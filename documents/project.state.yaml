  - { at: "2026-09-05", by: "[PM]", what: "**AI 가 기호로만 말해 소통이 끊겼다 — 화법을 규칙으로 박았다.** 사용자가 *ASM 어쩌고 했는데 그게 뭔지 전혀 못 알아들었다* 고 지적했다. **CLAUDE.md §5-13 신설**: 대화에서 ID·번호·약자를 쓰면 괄호로 뜻을 한 줄 붙인다 — `G2` 가 아니라 `G2`(아키텍처 게이트 · P2 를 닫고 P3 로 넘어가는 관문). IT 약자도 처음 쓸 때 한 번은 푼다. **산출물 문서에는 적용하지 않는다** — 문서는 ID 로 촘촘히 엮이는 것이 목적이라 매번 풀면 그 엮임이 흐려진다. 이미 있던 §5-12(이해하지 못한 승인을 받아내지 않는다)와 같은 뿌리인데 **화법 쪽이 비어 있었다.** **`user-guide/06-glossary.md` 신설** — ID 접두 34 · 단계와 게이트 14 · 우리가 정해 쓰는 말 24 · IT 약자 일곱 묶음. **약자 풀이를 지어내지 않고 34개를 전부 정의 파일에서 확인했다**(예: TS 는 추측이 아니라 03-glossary.yaml 의 turn_states). **둘은 일부러 뺐다** — 업무 도메인 용어 44개는 03-glossary.yaml 이 정본이라 링크만 뒀고(§4-3), 화면별 두 글자 접두(AL·MS·CF 등)는 화면이 늘 때마다 고쳐야 하는 목록이라 두지 않았다" }
  - { at: "2026-09-05", by: "[PM]", what: "**헌법에서 현황을 걷어냈다 — CLAUDE.md §11 을 없앴다.** 사용자 지적이다: *CLAUDE.md 는 변하지 않는 내용이 있어야 하지 않나, 진척은 별도 문서 아닌가.* 맞다 — 파일 스스로 *변하지 않는 규칙과 어디를 먼저 보는가만 담는다* 고 선언해 놓고 §11 이 진척을 들고 있었고, **같은 날 내가 거기에 P0 승인(2026-09-05)을 적어 위반을 키웠다.** **증상이 이미 넷 나 있었다**: §8 훅 표 머리가 *여섯 차단·넷 경고·하나 기록*(합 11)인데 표는 9행 · §11 머리의 *훅 열하나* 는 파일 수이지 걸리는 훅 수가 아니다(아홉) · 1행의 판 날짜가 그날 개정에도 그대로 · README 는 *스킬 열둘* 로 낡아 있었다. **개수와 날짜를 헌법에 박으면 아무도 모르게 낡는다.** §11 의 셋은 새 문서를 만들지 않고 **이미 그 사실을 갖고 있는 자리로** 보냈다 — spec 넷이 빈 것은 counter_note, Hub 메뉴 43개 문서는 60-screens.yaml, 컨텍스트 게이지는 harness/hooks.md. 각각 `@defer` 를 달아 `deferred.mjs` 가 계속 잡는다(22건 유지). **§4-2 에 규칙으로 못 박았다**: 미룬 것의 목록도 만들지 않으며 이 파일에도 현황을 적지 않는다. 훅 개수는 네 파일에서 아홉으로 맞췄다" }
  - { at: "2026-09-05", by: "[PM]", what: "**기한 없이 떠 있던 일곱에 사용자가 답했다 — 넷이 닫히고 셋이 성격을 바꿨다.** **성공 기준의 방침이 정해졌다**: 목표를 미리 세우지 않고 *측정을 만들고 → 정확히 재고 → 개선이 필요한지 판단한다*(`charter.measurement_first`). 그래서 `target: null` 은 빠진 것이 아니라 **아직 재지 않았다**는 뜻이고, **ASM-002 와 OQ-002 의 상호 대기가 풀린다** — 측정 인프라는 고객사 없이도 만들 수 있다. **목적 문장은 그대로 둔다** — 여러 목적 중 AI 가 *고객 입장에서 투자 가치가 가장 큰 것* 을 골랐고 사용자가 확인했다(`purpose_note`). **문서 예산 훅은 차단을 유지한다** — 다만 새 유형은 목적·포맷·소유(정본/파생) 셋을 규격화해야 자리가 열린다고 절차를 명문화했다. **UND-S02·S03 은 이미 구현돼 있어 닫았다** — 소스에서 확인했다: 액션 넷 `READ`·`SAVE`·`EXECUTE`·`EXPORT` 가 API 경로 접두로 판정되고(`standard/backend/api.md` §2), 요청 인터셉터가 **모든 API 접근**을 사용 이력에 쌓아 메뉴로 걸러 볼 수 있다 — **INV-01(개인정보 열람 추적 100%)이 이 경로로 지켜진다**. **UND-S04 대시보드는 마지막으로 미뤘다**(@defer P4) — 고객사마다 다르므로 컴포넌트를 미리 만들어 두고 고르게 한다. **컨텍스트 게이지의 사양이 생겼다** — 턴 종료 시 실측, 60% 초과면 compact 권고, 막지 않는다. **silent_approvals 가 1 에서 0 으로 돌아왔다** — 역질문 셋이 같은 날 답을 받았다. **부수**: 스캐너가 닫힌 UND 와 이미 기한 붙은 것을 세고 있어 고쳤고, 같은 일을 세 곳에 태그해 셋으로 보이던 것을 소유자 하나로 줄였다(§4-3). **기한 없음 7 → 1**" }
