# 프로젝트 진행 상태 — **"지금 어디 있는가" 의 유일한 진실**
#
# AI 가 매 작업 후 갱신하고 사람이 읽고 승인한다. `session-brief` 훅이 세션 시작에
# 이 파일을 문맥에 넣는다(CLAUDE.md §2).
#
# **현황을 적는 다른 문서를 만들지 않는다**(CLAUDE.md §4-2). 여기가 그 자리다.

project:
  name: "기업용 Agentic AI Hub"
  code: AIHUB
  started_at: 2026-09-04
  owner: "사용자 (고객·의사결정자)"

current:
  phase: P1                  # P0~P6 — **방법론 단계**. P0 는 2026-09-05 승인됐다
  roadmap: RM-P1             # RM-P1~RM-P4 — **로드맵 차수**. 지금 짓고 있는 제품 차수다
  workstream: system         # 현재 초점. 기존 백오피스 코어를 독립 모듈로 이행하는 작업흐름
  # ↑ **축이 둘이고 글자가 같다.** 차수는 *무엇을 내는가*(00-charter.yaml roadmap),
  #   단계는 *어디까지 만들었는가*(P0~P6)다. 한 차수가 P0~P6 을 한 바퀴 돈다.
  #   `trace-check` 가 이 값을 읽어 **뒤 차수의 결손을 오류가 아니라 경고로** 센다.
  slice: SLICE-515           # 즐겨찾기·그리드·저장 조회조건을 system 모듈 기준으로 이행한다
  blocked_by: []
  template_maintenance: false
  # ↑ true 로 켜면 G3 전에도 sources/ 를 고칠 수 있다(guard-write ①).
  #   **템플릿 자체의 보수에만 켠다.** 켠 사실이 여기 남아 무엇을 왜 열었는지 추적된다.

batch_g4:
  status: active
  approved_at: 2026-09-13
  change_request: CR-011
  scope: { roadmap: RM-P1, workstream: system, slices: [SLICE-515, SLICE-516] }
  rule: >-
    범위의 각 슬라이스는 G4 자체검증·레드팀·결정 카드·역질문을 마친 뒤 self_verified로
    보류하고 다음 슬라이스로 진행한다. 완료·커밋·배포는 금지하며, 사용자가 사후 일괄
    승인할 때만 슬라이스별로 done·지정 경로 커밋한다.
  unresolved_reverse_questions: []

# ── 단계 게이트 — **현재 차수(`current.roadmap`)의 것이다** ────────
# status: not_started | in_progress | self_verified | approved
#
# **게이트는 차수마다 한 벌 돈다**(process/04-gates.md §5). 여기 있는 일곱은 지금 도는
# 차수의 게이트이고, 차수를 넘길 때 `phase-gate` 가 **아래 `roadmap_closed` 로 접어 넣고
# 일곱을 `not_started` 로 되돌린다.** 차수별로 표를 늘리지 않는 이유는 읽는 사람과 훅이
# *지금 어디인가* 하나만 물어보기 때문이고, 지난 차수는 요약 한 줄이면 족하다.
gates:
  P0_inception:    { status: approved, approved_at: "2026-09-05", note: "**Exit Criteria 8/8.** 목적 한 문장 · 성공 기준 셋(정확성 1 · 유효성 2 · 절제 3, 목표값은 ASM-002 로 P1) · 범위 In 7/Out 10 · 액터 11 전원 목적 보유 · 제약 44 · 트랙 full · 기존 시스템 병행 · 기대치 balanced. 안고 넘어간 것 셋은 아래 gate_note" }
  P1_discovery:    { status: in_progress, approved_at: null, note: "03·10 이관 완료. **11-processes.yaml 이 비어 있다** — 특정 고객 업무를 지어내지 않고, 도메인 중립인 Hub 자체의 등록·조회·실행·운영 프로세스를 정의해야 한다. 첫 고객의 실제 업무와 기준선은 OQ-002 로 분리했다" }
  P2_architecture: { status: in_progress, approved_at: null, note: "**2026-09-12 재개방.** 기존 백오피스를 system으로 분리하고 admin·agent·portal과 함께 4모듈 경계를 두는 ADR-007이 ARCH-003·010~014와 공통 인가·라우팅에 영향을 준다. 기존 G2 자체검증은 무효화했으며 정본·하네스 갱신 뒤 다시 검증한다" }
  P3_design:       { status: in_progress, approved_at: null, note: "system 범위의 30·31·40·50·60·70 설계와 핵심 시퀀스 3건은 작성됐다. admin·agent·integration·portal의 각 소유 범위는 아직 해당 작업흐름 단계에서 설계한다" }
  P4_build:        { status: not_started, approved_at: null, note: "**G4 기계 검사 셋이 다 초록이다**(2026-09-06) — 셋 다 빨갛던 것을 세는 법을 고쳐 닫았다. 아래 quality_baseline" }
  P5_verify:       { status: not_started, approved_at: null, note: "" }
  P6_deliver:      { status: not_started, approved_at: null, note: "" }

# ── 작업흐름 게이트 — **같은 차수 안의 모듈·계약별 성숙도** ─────────
# 로드맵은 무엇을 내는지, 전역 gates는 차수 통합 상태, 아래는 어디까지 성숙했는지를 갖는다.
# P0/G0과 G6은 전역이다. 소스 쓰기는 기능을 소유한 작업흐름 P3_design 승인으로 열린다.
workstreams:
  system:
    phase: P4
    required_in: [RM-P1]
    blocked_by: []
    deferred_until: null
    gates:
      P1_discovery:    { status: approved, approved_at: "2026-09-12", note: "**사용자 승인 · Exit Criteria 8/8.** ACT-012, PRC-06~08, REQ-501~510을 현재 소스·Liquibase·화면 문서에서 역추적했다. SYSTEM 하위 16개·공통 대시보드 1개·메뉴 없는 공통 화면 8개와 근거 테이블 31개를 대조했고 추적성 오류 0건이다. 레드팀에서 전 수명주기·변조 불가·소스 키 한정·요청 승인이라는 과잉 표현을 현재 구현 범위로 바로잡았다. 역질문 권장안에 따라 설치용 ADMIN은 설치 시점의 전체 권한 기준선으로 한정하고, 운영에서는 시스템 관리자와 감사·품질 역할을 분리한다. 일반 계정·권한 공지와 요청은 system, AI 품질·정책 관련 알림은 admin이 소유한다" }
      P2_architecture: { status: approved, approved_at: "2026-09-12", note: "**사용자 승인 · Exit Criteria 8/8.** ADR-007 아래 ARCH-022~026으로 system의 백엔드·프론트 목표 경로, 31개 테이블 쓰기 소유권, 화면 경로와 기능별 이행 순서를 정의하고 AUTHZ-091로 설치용 ADMIN과 운영 권한을 분리했다. 사용자는 역할 겸임을 허용하고 특정 역할·메뉴 코드의 금지 하드코딩을 거부했다. 역할·메뉴·개인 권한 데이터와 유효 권한이 유일한 판정 근거다. 현재 고객이 없는 개발 단계이므로 신규 경로 전환과 회귀 시험 뒤 기존 API·화면 경로는 같은 슬라이스에서 즉시 제거하고 호환 별칭을 남기지 않는다. ASM-005·006은 기각됨으로 닫았다" }
      P3_design:       { status: approved, approved_at: "2026-09-12", note: "**사용자 승인 · Exit Criteria 11/11.** REQ-501~510을 UC-501~510·FEAT-501~510·ENT-501~531·API-501~599·SCR-501~525·TC 52건으로 연결했다. 실제 컨트롤러 99개와 목표 API의 요청·응답 타입·근거 메서드를 전수 대조했고 누락·중복 0건이다. 핵심 시퀀스는 UC-501·503·508 세 건이며 예외와 트랜잭션 경계를 표시했다. 권한 변경 API는 SYS_LO_ACCESS의 일반 시스템 사용 이력에 남기되 전용 원장은 고객사 요구가 생긴 도입 시점 이후만 기록하고 과거 변경은 복원하지 않는다. 같은 역할을 동시에 전체 저장하면 나중에 완료된 스냅샷이 이기고 자동 병합하지 않는다. 레드팀 위험은 사용자 결정과 TC-5076·TC-5026으로 닫았고 trace 오류 0건이었다" }
      P4_build:        { status: in_progress, approved_at: null, note: "SLICE-501 인증과 SLICE-502 역할·역할 권한은 system 모듈로 이행해 각각 2026-09-12 사용자 G4 재승인을 받았고, SLICE-503 메뉴 트리·API 카탈로그·실패 폐쇄 인터셉터, SLICE-504 사용자 관리·IP·활성 세션, SLICE-505 사용자 개인 예외·유효 권한 진단, SLICE-506 공통코드·참조 코드와 공통 조회 계약, SLICE-507 메시지 값·번들·캐시 버전, SLICE-508 시스템 설정·사용자 설정·캐시 버전, SLICE-509 로그인·사용 이력 목록·상세, SLICE-510 오류 이력·클라이언트 다운로드 이력, SLICE-511 배치 일정·구현 레지스트리·즉시 실행, SLICE-512 배치 실행 이력·협조적 중단·유실 판정, SLICE-513 공지 관리·사용자 공지·팝업, SLICE-514 관리 요청 판정·내 요청·알림함 public 계약도 사용자 G4 승인으로 완료했다. 사용자는 구 경로의 호환 별칭을 두지 않고 즉시 제거하기로 확정했다. 이력 상세는 CLOB 전문의 목록 부하를 피하려는 분리 조회이며 목록과 같은 현재 READ 권한으로 보호한다(CR-008). 다운로드 이력은 프런트가 요청한 사실만 남기고 실제 파일 수신을 서버가 판정하지 않는다. 이력 `PARAMETERS`의 개인정보 등 민감값 필드별 마스킹은 Hub 개발 완료 뒤 별도 기능으로 설계하며, 현재 마스킹된 불변 감사 이력은 화면별 캐시 정책을 따른다(CR-007). SLICE-512는 system 단일 경로·구 경로 부재와 협조적 중단 결과 분류를 계약·규칙 반전 시험으로 보장했다. SLICE-513은 공지의 admin·공용 API와 화면을 system 단일 경로로 이행하고 구 `/notice` 경로를 즉시 제거했다. 팝업의 오늘 하루 숨김은 기기별 브라우저 저장소에 유지한다. SLICE-514는 동일 요청의 동시 판정을 행 잠금으로 직렬화해 첫 요청만 처리하고, 뒤 요청은 처리자 정보를 드러내지 않는 기존 409 문구로 거부하며 잠금 대기 초과는 공통 오류 정책을 따른다(CR-010). 다음은 SLICE-515 즐겨찾기·그리드·저장 조회조건이다" }
      P5_verify:       { status: not_started, approved_at: null, note: "" }
  admin:
    phase: P1
    required_in: [RM-P1]
    blocked_by: []
    deferred_until: null
    gates:
      P1_discovery:    { status: in_progress, approved_at: null, note: "기준 정보·지식·정책 요구를 admin 책임으로 재분류한다" }
      P2_architecture: { status: not_started, approved_at: null, note: "" }
      P3_design:       { status: not_started, approved_at: null, note: "" }
      P4_build:        { status: not_started, approved_at: null, note: "" }
      P5_verify:       { status: not_started, approved_at: null, note: "" }
  agent:
    phase: P2
    required_in: [RM-P1]
    blocked_by: []
    deferred_until: "admin 계약 초안"
    gates:
      P1_discovery:    { status: in_progress, approved_at: null, note: "질의 처리 요구는 이관됐으나 작업흐름 단위 승인은 아직이다" }
      P2_architecture: { status: in_progress, approved_at: null, note: "턴·스텝·점유·중단 설계 초안과 ADR-001·003이 있다" }
      P3_design:       { status: not_started, approved_at: null, note: "" }
      P4_build:        { status: not_started, approved_at: null, note: "" }
      P5_verify:       { status: not_started, approved_at: null, note: "" }
  integration:
    phase: P2
    required_in: [RM-P1]
    blocked_by: [OQ-003]
    deferred_until: null
    gates:
      P1_discovery:    { status: approved, approved_at: "2026-09-11", note: "**Exit Criteria 8/8 · 사용자 승인.** 범용 Hub 프로세스 5개와 integration 소유 요구사항의 단계 연결을 확정했다. 작업흐름 G1은 우선순위 근거를 판정하고 Must 70% 상한은 전역 G1에서 적용한다. 계약 시험 원문은 합성 데이터가 기본이며 운영 원문은 권한·감사 아래 예외 열람한다. 서버군 격리·일괄 전환이 불가능하면 무중단으로 간주하지 않는다" }
      P2_architecture: { status: in_progress, approved_at: null, note: "**2026-09-12 사용자 승인으로 재개방.** ADR-007의 4모듈·화면 영역·API 계층·인가 진입 경계를 ARCH-003·010~014·018~020에 반영하고 다시 검증한다" }
      P3_design:       { status: in_progress, approved_at: null, note: "G2 재검증 동안 중지. 이후 FEAT-126·SCR-112와 portal↔agent 계약을 함께 설계한다" }
      P4_build:        { status: not_started, approved_at: null, note: "" }
      P5_verify:       { status: not_started, approved_at: null, note: "" }
  portal:
    phase: P1
    required_in: [RM-P1]
    blocked_by: []
    deferred_until: "admin·agent 핵심과 integration 계약 시험이 안정된 뒤"
    gates:
      P1_discovery:    { status: in_progress, approved_at: null, note: "제품 요구는 유지하고 핵심 계약 영향부터 선별한다" }
      P2_architecture: { status: not_started, approved_at: null, note: "" }
      P3_design:       { status: not_started, approved_at: null, note: "시각화 도구·화면 배치·사용자 편의 상세는 여기서 정한다" }
      P4_build:        { status: not_started, approved_at: null, note: "" }
      P5_verify:       { status: not_started, approved_at: null, note: "" }

# 고객사 구축에서 `extension:wms`처럼 추가한다. Hub 모듈 목록에는 넣지 않는다.
extension_workstreams: []

gate_note: >-
  **2026-09-11부터 전역 게이트와 작업흐름 게이트를 함께 쓴다(ADR-006).** 위 `gates`는
  RM-P1 전체의 통합 상태이고, `workstreams`는 admin·agent·portal·integration의 서로 다른
  설계·구현·검증 진척을 갖는다. 전역 G3 전에도 작업흐름 G3 승인을 받은 기능만 구현할 수 있다.

  **단계가 P0 인데 게이트 넷이 in_progress 인 것은 이상 상태다.** 산출물이 뒤에서
  앞으로 들어왔기 때문이다 — 설계가 먼저 있었고 프로세스를 뒤에 씌웠다. 정상화하는
  방법은 하나다: **P0 부터 `/phase-gate` 를 돌려 순서대로 승인받는다.** 승인 없이
  다음으로 넘어가면 그 뒤의 모든 것이 근거 없이 떠 있게 된다(CLAUDE.md §5-2).
  순서는 사용자가 택했다(2026-09-05 · 옛 OQ-001).

  **P0 는 2026-09-05 에 승인됐다.** 남은 셋(P1~P3)이 여전히 이상 상태이며 같은
  방법으로 하나씩 닫는다. **범용 Hub 의 P1 은 고객사 없이 진행할 수 있다.**
  `11-processes.yaml` 에는 특정 WMS·TMS 업무가 아니라 Hub 자체의 도메인 중립 프로세스를
  정의한다. 첫 고객의 실제 적용 업무와 적용 전 기준선은 제품 P1 의 입력이 아니라
  고객 파일럿 착수 조건(OQ-002)이다.

  **G0 승인과 함께 안고 넘어간 것 넷** — 승인이 이것들을 해결하지 않았다:
  ① **고객사 없이 도메인 중립 제품을 먼저 만든다는 전략은 확인됐다**(ASM-004 · 2026-09-11).
  다만 헌장의 효용 주장은 아직 실제 고객에서 검증되지 않았다. ECO-01(*경계를 넘는 업무의
  빈도가 효용을 결정한다*)은 OQ-002 로 업무와 기준선을 정한 첫 고객 파일럿 P5 에서 검증한다.
  ② **성공 기준의 실제 기준선은 첫 고객 파일럿을 기다린다.** OQ-002 가 그 업무 선정과
  적용 전 처리를 재는 일을 갖지만, 고객사 없이도 측정 설계와 범용 제품 요구사항은 세울 수
  있으므로 제품 P1·P2 를 막지 않는다.
  ③ **응답성을 아무도 판정하지 않는다.** 성공 기준에서 내리며 정본을 NFR 로 넘겼는데
  NFR 의 목표가 전부 null 이다(charter.tracked_metrics.MET-03.open_risk).
  ④ **응답성 측정을 만드는 일은 ASM-002 가 갖고 있었고 2026-09-10 에 끝났다** —
  NFR-006~009 가 재는 방법을 정한다. ③ 이 말한 *아무도 판정하지 않는다* 는 이제
  **재기 전이라 판정하지 않는다** 로 성격이 바뀌었고, 남은 것은 계측을 P4 에서
  실제로 심는 일 하나다(`21-nfr.yaml` 머리의 `@defer P4`).

