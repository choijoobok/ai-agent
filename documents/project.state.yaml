# 프로젝트 진행 상태 — **"지금 어디 있는가" 의 유일한 진실**
#
# AI 가 매 작업 후 갱신하고 사람이 읽고 승인한다. `session-brief` 훅이 세션 시작에
# 이 파일을 문맥에 넣는다(CLAUDE.md §2).
#
# **현황을 적는 다른 문서를 만들지 않는다**(CLAUDE.md §4-2). 여기가 그 자리다.

project:
  name: "기업용 Agentic AI Hub"
  code: AIHUB
  started_at: 2026-09-04
  owner: "사용자 (고객·의사결정자)"
  note: >-
    세 저장소를 합쳐 시작했다 — ordinary-backoffice(개발 표준·백오피스 템플릿) +
    ai-driven-development(프로세스) + agentic-ai(설계). 합친 근거는 CLAUDE.md.

current:
  phase: P1                  # P0~P6 — P0 는 2026-09-05 승인됐다
  slice: null                # 구현 단계에서만: SLICE-###
  blocked_by: [OQ-002]   # **지금 단계를 막는다.** P0 는 승인됐고 P1 이 여기서 막힌다
  template_maintenance: false
  # ↑ true 로 켜면 G3 전에도 sources/ 를 고칠 수 있다(guard-write ①).
  #   **템플릿 자체의 보수에만 켠다.** 켠 사실이 여기 남아 무엇을 왜 열었는지 추적된다.

# ── 단계 게이트 ────────────────────────────────────────────────────
# status: not_started | in_progress | self_verified | approved
gates:
  P0_inception:    { status: approved, approved_at: "2026-09-05", note: "**Exit Criteria 8/8.** 목적 한 문장 · 성공 기준 셋(정확성 1 · 유효성 2 · 절제 3, 목표값은 ASM-002 로 P1) · 범위 In 7/Out 10 · 액터 11 전원 목적 보유 · 제약 44 · 트랙 full · 기존 시스템 병행 · 기대치 balanced. **ASM-001(이관 설계 승계)이 이 승인으로 닫혔다.** 안고 넘어간 것 셋은 아래 gate_note" }
  P1_discovery:    { status: in_progress, approved_at: null, note: "03·10 이관 완료. **11-processes.yaml 이 비어 있다** — 프로세스 정의가 원본에 없었고 CON-017 에 막혀 있다" }
  P2_architecture: { status: in_progress, approved_at: null, note: "20·21·22 이관 완료. **NFR 19건의 목표 수치가 전부 null** 이고 TC 가 없어 T7 오류가 난다" }
  P3_design:       { status: in_progress, approved_at: null, note: "31·51·60 이관 완료. **30·40·50·70 이 비어 있다** — UC·ERD·API·TC 는 원본에 없었고 지어내지 않았다" }
  P4_build:        { status: not_started, approved_at: null, note: "**G4 기계 검사를 템플릿 코드에 처음 대 봤고 셋 다 임계를 넘는다** — 아래 quality_baseline" }
  P5_verify:       { status: not_started, approved_at: null, note: "" }
  P6_deliver:      { status: not_started, approved_at: null, note: "" }

gate_note: >-
  **단계가 P0 인데 게이트 넷이 in_progress 인 것은 이상 상태다.** 산출물이 뒤에서
  앞으로 들어왔기 때문이다 — 설계가 먼저 있었고 프로세스를 뒤에 씌웠다. 정상화하는
  방법은 하나다: **P0 부터 `/phase-gate` 를 돌려 순서대로 승인받는다.** 승인 없이
  다음으로 넘어가면 그 뒤의 모든 것이 근거 없이 떠 있게 된다(CLAUDE.md §5-2).
  순서는 사용자가 택했다(2026-09-05 · 옛 OQ-001).

  **P0 는 2026-09-05 에 승인됐다.** 남은 셋(P1~P3)이 여전히 이상 상태이며 같은
  방법으로 하나씩 닫는다. **다만 P1 은 지금 닫을 수 없다** — 고객사가 없어 대상
  업무가 없다(OQ-002).

  **G0 승인과 함께 안고 넘어간 것 셋** — 승인이 이것들을 해결하지 않았다:
  ① **헌장의 효용 주장이 검증되지 않았다**(ASM-004 · 기한 G1). ECO-01(*경계를 넘는
  업무의 빈도가 효용을 결정한다*)이 참인 조직에서만 이 제품의 값이 나온다.
  ② **ASM-002 와 OQ-002 가 서로를 기다린다.** 성공 기준 셋의 목표값은 P1 실측을
  기다리고 P1 은 고객사를 기다린다 — 둘 다 안 오면 G2 도 막힌다.
  ③ **응답성을 아무도 판정하지 않는다.** 성공 기준에서 내리며 정본을 NFR 로 넘겼는데
  NFR 19건의 목표가 전부 null 이다(charter.tracked_metrics.MET-03.open_risk).

# ── 미결 질문 (Open Questions) ─────────────────────────────────────
# 사용자 답변이 필요한 것. 답변되면 삭제하고 결과를 spec·ADR 에 반영한다.
open_questions:
  - id: OQ-002
    phase: P1
    question: "1차 적용 업무를 무엇으로 할 것인가 (CON-017)"
    status: "**답할 수 없음이 확인됐다**(2026-09-05) — 고객사가 아직 없다. 사용자가 *제품부터 만든다* 를 택했다"
    blocked_on: "고객사 확정"
    required: true
    impact: "11-processes.yaml 전체 · 성공 기준의 기준선(SUC-01) · 메타데이터 구축 범위(CON-016)"
    reversal_cost: medium
    note: >-
      **이것은 사용자가 미루는 결정이 아니라 지금 존재하지 않는 사실이다.** CON-017 은
      *1차 적용 업무를 고르고, 그 업무의 순서를 AI 기준으로 다시 그리고, 붙이기 전
      처리 시간·건수를 재 둔다* 를 요구한다 — 셋 다 실재하는 업무와 그 업무를 하는
      사람이 있어야 한다. 없는 상태에서 업무를 지어 넣으면 프로세스 정의서 · 성공
      기준의 기준선 · 메타데이터 범위가 전부 그 허구 위에 서고, 고객사가 정해지는
      순간 셋을 함께 버려야 한다.
    blocks: >-
      **P1 을 닫을 수 없다.** 11-processes.yaml 이 비어 있고 채울 근거가 없다.
      P0(헌장)는 제품의 목적·목표·비목표라 고객사 없이도 판단할 수 있으므로 막지 않는다.
    next: >-
      **P1 에 닿았을 때 셋 중 하나를 고른다** — ① 고객사가 정해질 때까지 P1 을 열어 둔 채
      P2·P3 로 간다(그러면 요구사항 우선순위의 근거가 업무 가치가 아니라 기술 의존이 된다)
      · ② 레퍼런스 시나리오를 ASM 으로 세우고 *가정임을 표시한 채* P1 을 닫는다
      · ③ P1 에서 멈추고 고객사를 기다린다. **지금 고르지 않는다** — P0 를 먼저 넘긴다.

