    - "2026-10-22 요구사항 리뷰 1일차 사용자 요청으로 질의별 토큰 표시와 당월 잔여/추가 질의 예상 횟수를 기존 6일차 REQ-006에 통합했다. 새 요구사항 번호 없이 99건과 기존 리뷰 순서를 유지한다. 각 질의·응답의 수행 시간 곁에 사용 토큰을, 채팅창 별도 영역에 본인 전체 세션의 당월 잔여와 본인 당월 정상 완료 질의의 1회 평균 사용량 기반 단일 예상 횟수를 표시한다. 계산·표본·예외 정본은 REQ-006.personal_usage이며 FEAT-102·114와 SCR-101·109를 연결했다. FEAT-114의 NFR 연결을 유지하면서 REQ-006 직접 연결과 REQ-116·119 의존/제약 양방향을 보완했다. 후속 사용자 명시 요청으로 2026-10-22 REQ-006 전체 보완본을 confirmed로 재확정하고 P1 재검토 대기 항목을 정리했다. 단계 게이트·소스 구현 승인은 포함하지 않는다. 후속 사용자 명시 요청에 따라 요구사항 보완과 상태 기록을 분리 커밋하고 origin/main에 푸시한다. 하네스·문서 lint·diff·UTF-8/LF 검사와 산식 경계 검산을 통과했다. 최초 보완 시 추적성 오류 0건·경고 153건이었으며 REQ-006 재검토 상태로 당시 경고가 1건 증가했다. 최신 확정 후 검증은 tasks 첫 항목을 따른다. 생성 문서 38개를 갱신하고 ID·장문 스칼라 누락 0건·깨진 상대 링크 0건을 확인했다."
    - "2026-10-21 사용자 요청으로 기능 요구사항 99건과 비기능 요구사항 25건 전체를 용어 사전과 대조했다. 제품 용어 82개(TRM-165~246)를 추가해 총 170개로 보완하고 기존 정의 15개를 현행화했다. 관리 승인·실행 승인·전송 동의, 신원 매핑·접근 허용 그룹, 행 스코프·기본 필터 등 혼동 구분 6개를 추가하고 일반 기술 용어 39개를 developer-guide/06-glossary.md에 설명했다. 평가셋의 미승인 유예 상태를 유지하고 제품 정책 정본은 기존 요구사항을 참조한다. 읽기 전용 영역별 대조 결과를 검토·통합했고 하네스·문서 lint·diff·용어 ID/키 중복·참조·UTF-8 무BOM/LF 검사를 통과했다. 추적성 오류 0건/기존 경고 152건, 생성 문서 38개의 ID 713개·장문 값 6244개 누락 및 깨진 링크 0건을 확인했다. 사용자 명시 요청에 따라 용어 사전과 상태 기록을 분리 커밋해 origin/main에 푸시한다. 게이트·소스 구현·기존 요구사항의 승인 상태는 바꾸지 않았으며 기존 연관 카드 검토·전체 흐름 대조 후 REQ-010 최종 확정 순서를 유지한다."
    - "2026-10-21 사용자 승인으로 API·커스텀 도구의 결과 안내와 사용자 선택 이후 처리를 보완했다. REQ-608·612에 공통 자연어 결과 가이드와 기존 계약 참조·전체 후보 승인/전결·버전 근거를, REQ-303에 매핑별 업무 결과 안내·질문/선택별 후속 절차를 두고 사본 없이 원천을 참조한다. REQ-009.result_dialogue와 REQ-005.result_followup_wait는 허용된 결과/가이드의 모델 전달·기존 사용자대기·유효 응답·구조화된 후속 제안과 agent 검증을 연결한다. 접수/완료 구분·새 상태 변경의 전체 값 별도 승인·장애 시 NFR-022 우선 결과 확인·원 실행 재전송/자동 폴링 금지·종결 뒤 새 요청과 과거 결과 불명 유지·현재 권한/마스킹/동의·감사 보존을 유지했다. 관련 기능 4건·화면 목록 4건·프로세스와 DES-003을 맞추고 검증 기준 16건을 추가했다. 하네스·문서 lint·diff·UTF-8 무BOM/LF와 Mermaid 3개 구문 검사 통과, 추적성 오류 0건/기존 경고 152건, 생성 문서 38개의 ID 631개·장문 값 6054개 누락 및 깨진 링크 0건을 확인했다. 실제 화면/메시지/참조 버전·경합 및 호출 시험은 P3 후속이며 게이트·소스 구현 승인은 포함하지 않는다. 이해 확인 문제는 요청마다 한 건씩 이어가고 기존 연관 카드 검토·전체 흐름 대조 후 REQ-010 최종 확정 순서를 유지한다. 후속 사용자 명시 요청에 따라 이번 보완과 상태 기록을 분리 커밋하고 origin/main에 푸시한다."
    - "2026-10-21 사용자 명시 요청으로 REQ-610의 운영 공통 프롬프트 편집 범위와 검증 시점을 명확히 했다. 운영자는 자연어 지침 본문과 규칙 관리 속성만 편집하며 변수 치환·기술 템플릿·통신 스키마는 소스에서 관리하고 agent가 호출별 동적 입력을 별도로 조합한다. 관리 데이터 저장 검증·LLM 의미 검토/관리자 판단·소스 및 실제 통신 계약 검증을 구분하고 자연어의 모든 모순을 저장 전에 기계적으로 검출한다고 보장하지 않음을 명시했다. 의미 검토 경고/실패의 관리자 판단과 미완료 기록은 유지하며 실제 계약·현재 권한·필수 실행 승인은 우회하지 않는다. 기존 confirmed에 합의한 정리를 반영하고 REQ-009·112, FEAT-013·SCR-013 및 ADR-020의 관련 표현을 맞췄다. 검증 기준 8건을 추가했으며 하네스·문서 lint·diff 검사 통과, 추적성 오류 0건/기존 후속 경고 152건, 파생 문서 38개의 ID 631개·장문 값 6001개 누락과 깨진 링크 0건을 확인했다. 실제 저장·의미 검토 화면·소스/입출력 시험은 P3 후속이다. 이해 확인 문제는 요청마다 한 건씩 이어가며 기존 연관 카드 검토·전체 흐름 대조 후 REQ-010 최종 확정 순서를 유지한다. 단계 게이트·소스 구현 승인은 포함하지 않으며, 후속 사용자 명시 요청에 따라 이번 정리와 검증 기록을 커밋·푸시한다."
    - "2026-10-21 요구사항 이해 확인 중 사용자 명시 요청으로 REQ-602의 모델 선택 복구를 보완했다. model_selection_recovery를 정본으로 모델 사용 불가 응답 뒤 허용 조합 목록 자동 재조회·제외된 선택의 미선택 전환·작성 질의 유지·사용자 직접 재선택/전송을 정의하고 남은 모델이 하나여도 자동 선택·재전송하지 않는다. 빈 목록/관리자 확인과 조회 실패/화면 내 재조회를 구분하며 시작 전 서버 재검사를 유지한다. 기존 confirmed에 합의한 보완을 반영하고 REQ-116·FEAT-101·SCR-101·DES-002에 연결했다. 검증 기준 7건을 추가했으며 하네스·문서 lint·diff 검사 통과, 추적성 오류 0건/기존 후속 경고 152건, 파생 문서 38개의 ID 631개·장문 값 5983개 누락과 깨진 링크 0건을 확인했다. 응답 계약·콤보 상태·늦은 조회/선택 경합과 실제 화면 시험은 P3 후속이다. 요구사항 이해 확인 문제는 사용자 요청마다 한 건씩 이어가며 기존 연관 카드 검토·전체 흐름 대조 후 REQ-010 최종 확정 순서를 유지한다. 단계 게이트·소스 구현 승인은 포함하지 않으며, 후속 사용자 요청에 따라 이번 보완과 검증 기록을 커밋·푸시한다."
    - "2026-10-20 사용자 최종 검토 후 명시 요청으로 REQ-014 전체 보완본을 confirmed로 확정했다. 세션 전체 사용자 질의 목록·상태/중단 표시·응답 모달/팝업·본문 원본 위치 이동 제외·본문 조회 범위/스크롤 유지·모든 상태의 새 턴 요청·기존 입력 분류 기반 즐겨찾기 등록과 검증 20건을 포함한다. 목록/열람/두 조작의 별도 LLM 호출 없음과 권한·보존·중복 접수/등록·오류 격리를 유지한다. 019의 메시지 페이지 기준과 페이지 크기 미정, 상세 저장/API/화면·경합 실행 시험은 P3 후속이다. 연관 보완 카드 REQ-013·113·201은 2026-10-22 사용자 명시 요청으로 재확정했다. 다음은 잔여 관련 요구사항과 전체 흐름 대조 후 REQ-010 최종 확정이다. 하네스·문서 lint·diff 검사 통과, 추적성 오류 0건/후속 경고 152건과 파생 문서 38개의 내용 누락·깨진 링크 0건을 확인했다. 후속 사용자 요청에 따라 이번 검토의 누적 문서 변경과 확정 상태를 커밋·푸시한다. 다른 카드 전체 신규 확정·단계 게이트·소스 구현은 포함하지 않는다."
    - "2026-10-20 사용자 요청으로 대화 초기/과거 조회를 REQ-019의 최신 메시지 묶음·역방향 메시지 페이징 기준에 통일했다. 019의 수명주기/변경 범위와 040 복원 검증에 남은 마지막 턴 기준 표현을 정리했다. 최신 메시지 묶음은 고정된 턴 수가 아닌 한 페이지이며 초기/추가 페이지의 구체 메시지 개수는 P3 미정임을 명시했다. REQ-014는 목록 항목 클릭 시 응답 레이어만 열고 목록/레이어에서 본문 원본 위치 이동을 제거한다. 열람으로 본문 로드 구간·과거 조회 경계·스크롤을 바꾸지 않는다. 즐겨찾기 불가 안내의 원 질의도 참조 정보/목록 내 선택으로 확인한다. 019의 대화 본문 관련 메시지 링크·040의 미종결 안내에 따른 기존 명시적 이동과 014의 열람을 구분했다. 관련 요구사항·기능/화면 목록·프로세스·시퀀스와 기존 검증 기준을 맞췄으며 014는 elaborated를 유지한다. 하네스·문서 lint·diff·인코딩·Mermaid 10개 구문 검사 통과, 추적성 오류 0건/기존 후속 경고 153건, 파생 문서 38개의 내용 누락·깨진 링크 0건을 확인했다. 소스 구현·게이트 전이·커밋·푸시는 수행하지 않았다."
