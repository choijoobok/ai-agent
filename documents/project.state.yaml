  tasks:
    - "2026-10-27 CR-025: 사용자 요청으로 REQ-502·505·508의 문서를 구현에 맞추고 502·505의 경합을 실패 재현 후 수정했다. 기존 조건부 확정 승인에 따라 세 카드를 confirmed로 반영하여 전체 101건 중 100건 확정, 미확정은 유예 REQ-615 한 건이다. 502는 고유 무효화 표식·관측값과 권한의 원자 저장·로그인 첫 보호 요청 재검사, 505는 원자 버전 증가·캐시 맵 교체·공개 번들 DB 본문과 전후 버전 검사를 적용했다. 508은 수동 쿨다운 우회와 실제 협조적 중단 결과를 명확히 했으며 제품 동작은 유지했다. 실패 재현 7건과 502·505·508 규칙 반전 검증을 거쳐 백엔드 전체 690테스트(실패·건너뜀 0), check·generateSeeds·checkSeeds와 코드 품질 검사(중복률 3.08%, 삼킴·미태깅 0)를 통과했다. DB 시험은 Spring Session JDBC/JPA와 H2이며 PostgreSQL·Redis 실연결 시험은 미수행이다. 세션 형식 반영은 노드 일괄 전환·기존 세션 종료, 과거 브라우저 메시지 오염은 배포 시 캐시 정리가 필요하다. 신규 기능 0, TC 5건 추가, 이전 요구사항·개인 설정과 단계 게이트를 보존했다. 하네스·문서 lint·추적성 오류 0건/후속 경고 117건, 생성물 38개 누락·깨진 링크 0건, UTF-8 무BOM/LF·diff 검사를 통과했다. 사용자 후속 요청에 따라 누적 요구사항 문서·system 보완·진행 상태를 분리 커밋해 origin/main에 푸시한다."
