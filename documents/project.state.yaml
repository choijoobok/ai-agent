# ── G4 기계 검사 첫 측정 (2026-09-04) ─────────────────────────────
# `node .claude/hooks/quality-check.mjs` — 소스 962개 / 코드 49,617라인
#
# **임계를 올려서 통과시키지 않는다**(CLAUDE.md §5-10). 대신 셋이 각각 무엇인지 적어 둔다 —
# 판정은 P4 착수 시 사용자와 함께 한다.
quality_baseline:
  measured_at: 2026-09-04
  duplication_pct: 12.66      # 임계 5%
  duplication_finding: >-
    **상위 중복이 전부 Java 구조 보일러플레이트다** — `*ErrorCode` enum 의 동일한 세 줄이
    23회, 복합키 `@Embeddable` 클래스가 14회. 복사·붙여넣기 부채가 아니라 언어가 요구하는
    형태다. 임계 5%는 GitClear 의 일반 관찰에서 온 값이고 **이 코드베이스에 맞춰 재측정한
    값이 아니다.** P4 착수 시 ① 보일러플레이트를 제외하는 측정으로 바꿀지 ② 임계를 이
    코드베이스 기준으로 다시 잡을지 사용자와 정한다. **둘 중 어느 쪽도 "그냥 올린다" 가
    아니다** — 근거를 남기고 바꾼다.
    @defer P4 — 중복률 임계를 이 코드베이스 기준으로 다시 잡을지, 측정에서 보일러플레이트를 뺄지 정한다
  swallowed_errors: 1         # 임계 0
  swallowed_finding: >-
    `BatchGhostSweeper.sweepQuietly()` 하나다. **의도된 삼킴이고 소스에 이유가 적혀 있다** —
    `scheduleWithFixedDelay` 는 작업이 던지면 다시 부르지 않으므로, DB 가 잠깐 흔들린 것
    때문에 청소가 영영 멈추면 안 된다. **검출기의 오탐이다.** 예외 목록을 두는 방식과
    `@SuppressWarnings` 류의 표식 중 무엇을 쓸지 P4 에서 정한다.
    @defer P4 — 의도된 예외 삼킴을 검출기에 알리는 방식을 정한다
  untagged_files: 962         # 임계 0
  untagged_finding: >-
    백오피스 템플릿이 이 추적성 체계보다 앞서 들어왔다. **템플릿의 기능을 실현하는 코드에
    Hub 의 FEAT-### 를 붙이는 것은 거짓 연결이다**(traceability.md §3). T10 이 경고인 이유이며,
    P4 부터 새로 쓰는 코드에만 적용한다.
  note: >-
    `trace-check` 는 817개, `quality-check` 는 962개로 센다 — 앞쪽이 테스트 파일을 빼기
    때문이다. **같은 지표를 두 수로 보고하는 것은 좋지 않다.** 어느 쪽을 정본으로 할지
    P4 착수 시 하나로 맞춘다.
    @defer P4 — 소스 개수의 정본을 trace-check(817) 와 quality-check(962) 중 하나로 맞춘다

