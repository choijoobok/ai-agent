  - { at: "2026-09-08", by: "[AA]", what: "**E2E 를 언제 짤지 아무도 묻지 않았고, 케이스 표에는 그것을 적을 칸이 없었다.** 잠금 수단이 **기계 / 사람** 둘뿐이라 *잠기지만 비싼 것* 이 갈 자리가 없었고, 그래서 화면을 넘나드는 흐름은 전부 ⑤ 사용자 테스트로 밀렸다. ① **셋으로 갈랐다** — 단위(선언 읽기) · **E2E**(브라우저) · 사람. 요건서 서식의 케이스 표도 셋으로 표시한다. ② **④-c E2E 판정**을 워크플로에 넣었다 — 게이트를 초록으로 만든 **뒤**, ⑤ 로 넘기기 **직전**에 3옵션으로 묻는다(지금 짠다 / ⑤ 뒤로 미룬다 / 짜지 않는다). 앞에 두면 무엇이 남는지 아직 모르고, 뒤에 두면 사용자가 이미 손으로 다 해 본 뒤다. **E2E 로 잠글 것이 없는 화면은 묻지 않는다** — 매번 묻는 질문은 읽히지 않는다. ③ **비용을 시간으로 말하지 않는다** — AI 는 벽시계 시간을 모른다(P4-build §5). 시나리오 수 · 픽스처 · 전제로 낸다. ④ **CLAUDE.md §8 이 절반 낡아 있었다** — *서비스 이름 · 트랜잭션* 을 **검사가 없다** 로 적었는데 ServiceConventionTest 가 조회의 readOnly 를 이미 빌드에서 막고 있었다(automation-matrix 는 맞게 적고 있었다 — 헌법만 낡았다). 사람 몫으로 남는 것은 **어느 이름을 고르나** 와 **명령 쪽 표시** 둘이다. ⑤ **미룬 것 둘을 세웠다** — E2E 러너 선정(P4 · 첫 화면이 *짠다* 로 판정될 때) · TC 가 코드로 옮겨졌는가의 검사(G3 · 지금 켜면 이미 선 테스트 156개가 전부 위반이라 하는 일이 검사가 아니라 태그 붙이기가 된다). **도구를 미리 고르지 않는다** — 근거가 추정이 된다" }
  - { at: "2026-09-08", by: "[AA]", what: "**T13 을 켰다 — TC 가 코드로 옮겨졌는지 아무도 세지 않고 있었다**(사용자가 A 를 택했다). T5 는 spec 안에서만 보므로 **TEST-FIRST 를 건너뛰어도 게이트가 초록일 수 있었다.** ① **앞서 내가 낸 `@tc` 파일 태그 안은 틀렸고 버렸다** — 파일 단위라 케이스 단위로 안 잠기고, *모든 테스트가 태그를 갖는가* 방향이라 이미 선 테스트가 전부 위반이 돼 **또 면제 명단이 필요해진다**(`@feat` 이 그래서 817건 명단을 갖는다 — **명단이 커지면 검사는 사실상 꺼진다**). ② **방향을 뒤집었다** — *모든 TC 가 코드에 있는가*. 그러면 기존 테스트는 대상이 아니라 **명단이 없고 앞으로도 필요 없다.** ③ **이름에 박는다** — `@DisplayName` 과 `it` 의 이름 첫머리에 TC 번호를 적는다. 케이스 단위로 잠기고 **실패 리포트에 그 번호가 그대로 떠서** 어느 요건이 깨졌는지 바로 보인다. 검사보다 이쪽이 값이 크다. ④ **비어 있는 지금이 켤 시점이다** — `70-testcases.yaml` 이 비어 **위반 0 으로 시작**하고 첫 TC 부터 돈다. 나중에 켜면 쌓인 TC 가 전부 위반이 된다. ⑤ 강도는 **T7 이 G2 를 쓰는 방식 그대로** — G3 승인 전 경고 · 이후 오류. **거꾸로(spec 에 없는 TC 를 테스트가 부름)는 언제나 오류**이며 T11 은 spec 안만 보므로 이것을 못 잡는다. ⑥ **연막 시험으로 확인했다** — 임시 TC 하나를 spec 에 넣으니 T13 이 잡았고 즉시 되돌렸다. 규칙이 살아 있다는 증거를 남기지 않으면 초록이 무엇의 초록인지 알 수 없다(§5-10). **바로잡음**: 앞 항목에 적은 *테스트 156개* 는 `*Test.java` 와 `*.test.ts` 만 센 값이고, 검사기가 실제로 훑는 것은 **162개** 다(테스트 디렉터리 전체). **소스는 건드리지 않았다** — 이름 규칙은 P4 의 첫 테스트부터 적용된다" }
  - { at: "2026-09-08", by: "[AA]", what: "**비용의 키가 「공급사」였는데 그 낱말이 정의된 적이 없었다** — 사용자가 베드락을 물어 드러났다. 문서마다 뜻이 갈려 있었다: ACT-007 의 심사 제약은 **모델 제작사** 를 가리키고 NFR-010 의 단가 키는 **과금 주체** 를 가리킨다. 같은 모델을 여러 경로로 사면 그 둘이 갈라진다 — 베드락으로 Claude 를 쓰면 심사 대상은 둘, 청구는 AWS, 모델은 Claude 다. ① **ADR-004 로 셋으로 갈랐다**(사용자 결정) — 모델 제작사 · **공급 경로** · 모델. 단가·엔드포인트·인증·리전이 경로에 붙고 심사는 제작사와 경로 둘 다다. 게이트웨이 경유를 지원 대상에 넣었다. ② **확장 구조를 두 축으로 갈랐다** — *무엇을 세는가*(계량 단위)는 공통코드로 **열고**, *어떻게 곱하는가*(과금 모드)는 **닫는다.** 새 과금 정책의 대부분이 새 계량 단위라 코드 없이 행 추가로 대응되고, 새 산식은 개발이 필요하며 그것이 정상이다 — 산식을 데이터로 두면 테스트가 못 잠근다. **시간당 과금은 자리만 두고 범위 밖이다.** ③ **모르는 계량 단위를 0 으로 세지 않는다** — 비용 미상으로 표시하고 알린다. 조용한 과소 집계는 한 달 뒤 청구서에서야 드러난다(조용한 누락이 틀린 값보다 나쁘다). **뒷면을 함께 정했다**: 토큰은 아는 값이므로 쿼터에서 차감하고 비용만 미상으로 둔다 — 0 으로 차감하면 쿼터가 뚫리고 막으면 새 모델을 못 쓴다. ④ **구멍 둘을 더 찾아 막았다** — **단가에 발효 시점이 없었다**(NFR-011 은 예산 계획에 *일 단위 발효 · 소급 불가* 를 못 박아 뒀는데 NFR-010 에는 같은 규칙이 없었다). **같은 문장을 가져왔다** — 규칙이 둘이면 운영자가 둘을 배운다. 그리고 **감사 이력이 산정 비용만 남기고 근거를 안 남겼다**(REQ-107) — 단가표 **판번호** 를 함께 남긴다. **행이 아니라 판 단위로 불변화한 이유**: 행마다 유효기간을 두면 한 호출의 조합을 재구성할 때 여러 행을 시점 조회해야 하고 그중 하나만 고쳐져도 조용히 달라진다. ⑤ NFR-016(정산)에 **대조 방법** 을 적었다 — 목표값은 ASM-002 방침대로 비운 채. **바로잡음**: 앞 답에서 정산 NFR 을 NFR-013 이라 했는데 NFR-016 이다. **지금이 가장 싼 시점이었다** — 40-domain.yaml 이 비어 단가 엔티티가 아직 없다. P3 에서 만들면 키가 굳고 G3 뒤엔 변경 요청을 탄다" }
  - { at: "2026-09-08", by: "[AA]", what: "**effort 가 단가 키에 있었는데 단가와 상관없는 것이었다** — 사용자가 정의를 줬다: **모델별 추론 레벨**(낮음·중간·높음)이며 **토큰 소모량과 응답 소요 시간을 바꾸고 단가는 바꾸지 않는다.** 원래 spec 부터 키에 있었고 어제 ADR-004 를 반영할 때도 그대로 실었다. ① **키에서 내렸다** — 단가의 키는 `공급 경로 · 모델 · 계량 단위` 다. effort 는 **사용량 기록의 축** 으로 남는다: 소비량이 달라지므로 *어느 effort 로 얼마를 썼나* 를 남겨야 역할별 라우팅을 조정할 수 있다(ARCH-040 이 이미 요구한다). ② **자리는 남겼다** — 사용자가 *나중에 과금 정책이 어떻게 바뀔지 모른다* 고 했고 맞다. 단가 행에 **한정자 칸**을 두고 **비우는 것을 기본**으로 한다: 비우면 그 모델의 모든 effort 에 적용되고, effort 별로 값이 갈리면 **행을 더해** 대응한다(정확 일치 우선 · 없으면 전체 행 · 어느 쪽도 없으면 비용 미상). **미리 조합을 다 만들지 않는 이유**: 운영자가 같은 값을 셋 입력하게 된다. 시간당 과금에 자리만 둔 것과 같은 방식이다. ③ **TRM-091 로 용어집의 빈칸을 채웠다** — effort 가 단가 키에 있으면서 정의가 없던 것이 어제 남긴 유일한 열린 항목이었다. ④ **어제 커밋이 이름 바꾸기를 절반만 했다** — 「공급사」가 spec 21곳과 `aidd-guide/standard/hub-conventions.md` 4곳에 그대로 남아 있었다(ARCH-040 · NFR-018 장애 전환 · 51-interfaces 의 프로토콜 표기 등). **전부 공급 경로를 뜻했다** — 심사 대상을 가리키는 곳은 하나도 없었다. 훑어 고치고 용어집의 **의도적 인용 한 줄만** 남겼다. **이것이 ADR-004 §5 가 포기한 것으로 적어 둔 비용의 실물이다** — 짧은 말을 잃으면 쓰던 자리를 다 찾아야 한다. **곁들여**: 이 로그를 처음 쓸 때 bash 이중 인용 안의 백틱이 명령 치환으로 먹혀 두 조각이 빈칸으로 들어갔다. 다시 썼다 — 여러 줄 한국어는 heredoc 으로 넘긴다(CLAUDE.md §9 가 커밋 메시지에 대해 같은 것을 말한다)" }
  - { at: "2026-09-10", by: "[AA]", what: "**MET-03 이 정본을 NFR 로 넘겼는데 받을 자리가 없었다 — 응답성 NFR 넷을 세웠다.** ① **카테고리 `응답성` 을 신설했다** — 기존 성능 5건은 전부 *대량 조회 방어* 라 축이 다르다. doc-gen 이 category 로 장을 나누므로 장이 하나 생겼고, 하드코딩된 장 제목과 `aggregation` 라벨을 함께 넣었다. ② **넷이 재는 것을 갈랐다** — NFR-006 구간 정의와 시각 기준점 · NFR-007 폴링 주기 · NFR-008 시간 분해 · NFR-009 멈춤 인지 지연. **핵심은 「첫 응답」이 무엇인지 정한 것이다** — portal↔agent 가 비동기라(ARCH-015) 사용자가 처음 보는 것은 접수 확인이지 응답이 아니다. 접수 확인을 첫 응답으로 재면 **언제나 빠른 값이 나오고 사용자가 기다린 시간은 어디에도 안 남는다.** ③ **기준 시각을 서버 수신 하나로 못 박았다** — 폐쇄망 PC 의 시계를 맞출 방법이 없어 클라이언트 t0 는 음수 지연을 만든다. 대신 사용자가 겪는 지연은 NFR-007 이 폴링 주기와 함께 잡는다: **서버가 200ms 에 상태를 바꿔도 주기가 5초면 사용자는 5초를 기다리고, 그때 고칠 것은 코드가 아니라 설정이다.** ④ **자동 재개가 없다는 것을 읽고 NFR-009 의 대상을 바꿨다** — 처음엔 *복구 지연* 으로 쓰려 했으나 ARCH-070 이 *만료된 턴은 중단으로 전이할 뿐 자동 재개하지 않는다* 로 정해 두었다. 그래서 재는 것은 복구가 아니라 **멈춘 것을 사용자가 알기까지** 이며, 그 사이 화면은 「처리 중」이다. ⑤ **두 번 재지 않게 경계를 적었다** — 총 시간은 NFR-006 · 턴 상한 집행은 NFR-013 · 큐 대기는 NFR-023 · 점유 관측은 turn-execution §7 이 갖는다. ⑥ ASM-002 의 `@defer P1` 을 닫고 헌장 MET-03 의 위험을 좁혔다 — 남은 것은 설계가 아니라 **계측을 P4 에서 심는 일** 하나다. **T7 오류가 19 → 23 으로 늘었다** — TC 는 P3 것이므로 정상이고, 늘어난 것은 결함이 아니라 잴 것이 늘었다는 표시다. **발견**: next_up 이 *measurement 칸을 채운다* 로 남아 있었으나 **19건 모두 이미 채워져 있었다**(널 0건). 다만 *누가 어디서 재나* 를 적은 것은 NFR-004 하나뿐이라 과제를 **채운다에서 수집 주체까지 보강한다로** 다시 세웠다 — *채웠다* 와 *측정이 섰다* 는 같지 않다. **곁들여**: 생성물의 강한 규칙 라벨이 `****강한 규칙****` 으로 나온다. 라벨 문자열이 이미 굵은데 생성기가 다시 굵게 감싸며, 8개 파일에 있고 이 변경 이전부터다" }
  - { at: "2026-09-10", by: "[AA]", what: "**C4 두 계층을 그림 두 벌로 만들지 않았다 — 하나를 접어서 낸다.** G2 는 Level 1(시스템 컨텍스트)과 Level 2(컨테이너)를 따로 요구하는데, 노드·간선을 두 벌 적으면 **그 순간 두 사실이 되고 한쪽만 고쳤을 때 어느 그림이 참인지 알 방법이 없다.** ① **노드에 축 둘을 더했다** — `l1:`(Level 1 에서 무엇으로 접히나) · `deploy:`(어느 배포 단위인가). 생성기가 `l1` 로 접어 Level 1 을 그리고, 같은 상자로 접힌 간선은 사라지며 남은 간선의 라벨은 합친다. Level 2 는 구역 안에서 `deploy` 로 한 겹 더 묶는다(중첩 subgraph). ② **상자 하나뿐인 배포 단위는 감싸지 않는다** — 테두리가 상자를 덧그릴 뿐이고 그 테두리를 *무언가 더 있다* 로 읽게 만든다. ③ **컨테이너를 세다가 브라우저 SPA 가 노드에 없던 것을 찾았다.** C4 에서 브라우저에서 도는 화면은 컨테이너인데 `USER → portal 모듈` 로 사람과 서버가 바로 이어져 있었다. **지어내지 않고 소스에서 확인했다** — `bootstrap/build.gradle.kts` 의 `processResources` 가 프론트 빌드 산출물을 `static` 으로 넣는다. 즉 **화면은 브라우저에서 돌고 서빙은 Hub WAS 가 하며 배포 단위는 하나다.** 그 사실이 없으면 컨테이너 그림이 반만 참이 된다. ④ **게이트웨이를 Level 1 에 남겼다** — C4 는 인프라를 L1 에 그리지 않는 것이 보통이지만 *나가는 통로가 하나이고 들어오는 통로가 없다*(CON-013)는 것이 이 제품의 도입 조건이다. 지우면 그림이 그 사실을 말하지 않는다. ⑤ **불변식을 하나 더했다** — 두 계층이 어긋나면 고칠 곳은 정본이 아니라 생성기다. ⑥ **곁들여 고쳤다** — 생성기가 이미 굵은 원문을 다시 굵게 감싸 `****…****` 를 만들고 있었다(이 장의 핵심 문장 셋). **검증**: doc-gen --check 초록(ID 448 · 스칼라 913 · 누락 0) · Mermaid 구조 검사(subgraph 짝 · 선언 없이 쓰인 상자 0 · 중첩 깊이 2). **하지 못한 것**: 실제 렌더는 확인하지 못했다 — 미리보기 창이 로컬 파일에는 스크립트를 돌리지 않는다. 구조만 봤다" }