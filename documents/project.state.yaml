    - "2026-10-02 사용자 요청으로 REQ-403에 비밀정보 전체 대상과 공통 보호 규칙을 모으고 REQ-604·608에 배포 API 연결 참조·상대 경로·공통/동적 헤더 경계를 보완했다. 사용자가 Spring Security Crypto 기반 YAML 암복호화·공통 설정 연동·운영 도구의 직접 구현을 명시 선택하여 ADR-022로 ADR-021의 Jasypt 채택을 대체했다. 암호화 yml과 환경별 외부 활성 마스터 키 하나의 운영 방식은 유지한다. 초기화/우선순위·암호문/키·도구·교체 계약은 P2에서 검증한다. REQ-403 카드 전체는 아직 elaborated이다. 비밀 정책 선택만으로 카드·게이트 확정이나 소스 구현을 승인하지 않는다"
    - "2026-10-02 사용자 요청으로 REQ-611에 테이블별 복수 행 스코프의 AND 강제 적용과 기본 필터별 제외 명세·서버 검증을 반영했다. 메모리 DB SQL 의미 검증 7건과 권한 조건 제거 변이 3건을 확인했다. 권한 모델·용어·agent 기능·저장 조회 의도와 연결했고 하네스·문서 lint 통과, 추적성 오류 0건·기존 경고 173건, 생성물 34개의 ID/장문 값 누락·깨진 링크 0건을 확인했다. REQ-611 전체 카드는 2026-10-07 사용자 명시 요청으로 확정했다. admin G1 별도 검증·승인은 아직이다. 요청/응답·저장 의도 계약은 P2, 제품 파서·대상 DBMS·모든 테이블 참조와 외부 조인·성능 검증은 P3에서 구체화한다"
    - "2026-10-02 후속 명확화로 REQ-202·207을 성공한 조회 실행 요청의 보존·복원 계약으로 보강했다. SQL·업무 인자·기본 필터 제외 명세·계약 버전을 함께 재현해 최초 조회와 같은 agent 검증·실행 경로를 사용하며 당시 권한·신원·실행 ID는 재사용하지 않는다. REQ-203의 저장 시 파라미터화와 정합성을 맞췄고 계약 미지원·명세 유실 시 SQL만으로 대신 실행하지 않는다. 정본·프로세스·용어·쓰기 소유권·기능을 연결하고 문서 검사 통과·추적성 오류 0건/기존 경고 173건·생성물 34개의 누락/깨진 링크 0건을 확인했다. 실제 저장/복원 계약 시험은 P3에 남기며 소스·게이트 변경은 없다"
    - "REQ-603의 다중 DB 스키마·객체 식별/권한 경계를 보완한 전체 정리안을 2026-10-02 사용자가 명시 확정했다. REQ-301·302·303·609와 용어·아키텍처·권한·기능을 대조했고 문서 검사·추적성·생성물 검증을 유지한다. 교차 DB 지원·식별 계약은 P2, DBMS별 식별자·파서 시험은 P3의 확인 항목이다. 구현 소스·게이트 상태는 변경하지 않았다"
    - "턴 생명주기의 승인된 정리 방향은 REQ-013·REQ-109·REQ-614에 반영했다. 전체 시간·턴당 토큰 상한 제거(NFR-013), 개인 동시 한도 기본 3(NFR-023), 새 시도의 모델 변경 허용(ARCH-040)으로 OQ-016·017을 해소했다. 2026-10-01 ADR-016으로 OQ-015를 해소했고, 2026-10-14 ADR-024로 미보존 선택·종료 삭제·기본 3개월을 대체했다. 현재는 원문 마스킹 사본의 기본 7일/양의 유한 기한·일일 파기·조사 보호(REQ-107)와 사용자대기 선행 만료(REQ-109)를 따른다. 재접속 표시·대기 선후 검증·일일 배치 시각과 실패 지연 목표는 P2, 조사 보호와 파기 경합은 P3 정련 범위다"
    - "2026-10-01 사용자 결정으로 처리 중 스텝 LLM 호출 전 개인 쿼터 재검사를 시스템 설정으로 제공하며 기본 비활성화로 NFR-012·REQ-614에 반영했다. 시작 전 검사·사용량 기록은 유지하고 설정 변경은 다음 LLM 호출 직전부터 적용한다. 이미 전송한 호출은 취소하지 않는다"
    - "기준정보 확정 후 agent 상세 요구사항 검토로 이동한다. 기존 REQ-001~027·030~040과 FEAT-201~221, 이미 확정한 공통 정책을 바탕으로 입력·처리 순서·출력·예외·상태 전이·수용 기준을 정련한다"
  then: >-
    확정된 REQ-010의 review_sequence에 따라 전체 흐름도·상세 시퀀스를 보완한다.
    요구사항별 반영 여부·정상/예외·누락/충돌을 대조하고 미확정 상세 계약은 P2/P3에서 정련한다.
    요구사항 검토 대상을 agent로 옮기는 것과 admin G1 승인은 별개다.
    기준정보 확정만으로 admin 설계·구현에 자동 진입하지 않으며 G1은 자체검증·별도 사용자 승인 뒤 통과한다.
    Portal 계정·인증 재사용은 P2 계약 검토에서 정하고 기존 system 구현 변경이 필요하면 별도 CR을 처리한다.
