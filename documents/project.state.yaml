  silent_approvals: 1
  # ↑ G0(2026-09-05). 사용자는 결정 넷을 명시적으로 골랐지만(승인 순서 · 제품 우선 ·
  #   balanced · 성공 기준 3축) **AI 가 낸 역질문 둘에는 답하지 않고 승인했다.**
  #   그 둘이 아래 unanswered_reverse_q 에 남아 있으며, 답이 없는 채로 굳은 것은
  #   *응답성을 판정에서 뺀다* 와 *목적 문장을 AI 초안대로 둔다* 이다.
  last_walkthrough: null
  deferred_by_user: false
  unanswered_reverse_q:
    # (해소됨 2026-09-05) "한 번에 전부 승인할 것인가" — 사용자가 *P0 부터 순서대로* 를 택했다(옛 OQ-001).
    - "**응답성을 성공 기준에서 뺀 것이 맞는가.** 게이트 규칙이 3개 이내라 넷을 내려야 했는데, 내리는 순간 응답성은 재기만 하는 값이 됐다. NFR 목표가 전부 null 인 지금은 속도를 아무도 판정하지 않는다 — ASM-002 의 기한(G2)을 앞당겨서라도 P1 에서 못 박아야 하는가?"
    - "**`purpose` 한 문장이 사용자의 말인가.** 내가 헌장의 문제 정의에서 뽑아 썼고, 뽑는 과정에서 *경계를 넘는 대조* 를 중심에 놓았다. 이 문장이 아래 요구사항 59건의 우선순위를 가르는 기준이 된다 — 다른 것이 중심이어야 한다면 지금이 고칠 때다"
    - "`documents/` 의 문서를 **훅이 차단**하게 만들었다(문서 예산). 정당한 새 문서가 막히는 일이 생길 텐데, 그때 지도에 행을 더하는 절차가 번거롭게 느껴지면 규칙이 아니라 훅을 끄게 된다. **차단이 맞는 강도인가**, 경고로 낮출 것인가?"

