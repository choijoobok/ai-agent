# 프로젝트 진행 상태 — **"지금 어디 있는가" 의 유일한 진실**
#
# AI 가 매 작업 후 갱신하고 사람이 읽고 승인한다. `session-brief` 훅이 세션 시작에
# 이 파일을 문맥에 넣는다(CLAUDE.md §2).
#
# **현황을 적는 다른 문서를 만들지 않는다**(CLAUDE.md §4-2). 여기가 그 자리다.

project:
  name: "기업용 Agentic AI Hub"
  code: AIHUB
  started_at: 2026-09-04
  owner: "사용자 (고객·의사결정자)"

current:
  phase: P1                  # P0~P6 — **방법론 단계**. P0 는 2026-09-05 승인됐다
  roadmap: RM-P1             # RM-P1~RM-P4 — **로드맵 차수**. 지금 짓고 있는 제품 차수다
  workstream: agent          # 현재 초점. 확정한 기준정보를 사용하는 agent 업무 동작을 한 건씩 검토한다
  # ↑ **축이 둘이고 글자가 같다.** 차수는 *무엇을 내는가*(00-charter/_index.yaml roadmap),
  #   단계는 *어디까지 만들었는가*(P0~P6)다. 한 차수가 P0~P6 을 한 바퀴 돈다.
  #   `trace-check` 가 이 값을 읽어 **뒤 차수의 결손을 오류가 아니라 경고로** 센다.
  slice: null                # 현재 구현 슬라이스 없음 — agent 요구사항 상세 정련·검토 중이다
  blocked_by: []
  template_maintenance: false
  # ↑ true 로 켜면 G3 전에도 sources/ 를 고칠 수 있다(guard-write ①).
  #   **템플릿 자체의 보수에만 켠다.** 켠 사실이 여기 남아 무엇을 왜 열었는지 추적된다.

# ── 팀 협업과 현재 후속 검증 ─────────────────────────────────────
# 2026-09-17 이전의 충돌·재시험 이력은 복원하지 않는다. 과거는 기존 커밋과 게이트 근거로 둔다.
collaboration:
  integration_mode: shared_main
  conflict_tracking_started_at: "2026-09-17"

# 과거 충돌은 커밋의 [충돌 통합] 블록이, 지금 다시 확인할 것만 이 맵이 갖는다.
# 키: SLICE-###(코드 시험) 또는 "<workstream>.P<n>"(문서 재검토).
pending_rechecks: {}

# ── 단계 게이트 — **현재 차수(`current.roadmap`)의 것이다** ────────
# status: not_started | in_progress | self_verified | approved
#
# **게이트는 차수마다 한 벌 돈다**(process/04-gates.md §5). 여기 있는 일곱은 지금 도는
# 차수의 게이트이고, 차수를 넘길 때 `phase-gate` 가 **아래 `roadmap_closed` 로 접어 넣고
# 일곱을 `not_started` 로 되돌린다.** 차수별로 표를 늘리지 않는 이유는 읽는 사람과 훅이
# *지금 어디인가* 하나만 물어보기 때문이고, 지난 차수는 요약 한 줄이면 족하다.
gates:
  P0_inception:    { status: approved, approved_at: "2026-09-05", note: "**Exit Criteria 8/8.** 목적 한 문장 · 성공 기준 셋(정확성 1 · 유효성 2 · 절제 3, 목표값은 ASM-002 로 P1) · 범위 In 7/Out 10 · 액터 11 전원 목적 보유 · 제약 44 · 트랙 full · 기존 시스템 병행 · 기대치 balanced. 안고 넘어간 것 셋은 아래 gate_note" }
  P1_discovery:    { status: in_progress, approved_at: null, note: "도메인 중립인 Hub 자체의 준비·요청·실행·운영 프로세스 PRC-01~13이 정의됐다. 첫 고객의 실제 업무와 적용 전 기준선은 OQ-002로 분리했으며, 전역 G1은 각 작업흐름의 P1 통합 검증 뒤 승인한다" }
  P2_architecture: { status: in_progress, approved_at: null, note: "**2026-09-12 재개방.** 기존 백오피스를 system으로 분리하고 admin·agent·portal과 함께 4모듈 경계를 두는 ADR-007이 ARCH-003·010~014와 공통 인가·라우팅에 영향을 준다. 기존 G2 자체검증은 무효화했으며 정본·하네스 갱신 뒤 다시 검증한다" }
  P3_design:       { status: in_progress, approved_at: null, note: "system 범위의 30·31·40·50·60·70 설계와 핵심 시퀀스 3건은 작성됐다. admin·agent·integration·portal의 각 소유 범위는 아직 해당 작업흐름 단계에서 설계한다" }
  P4_build:        { status: not_started, approved_at: null, note: "**G4 기계 검사 셋이 다 초록이다**(2026-09-06) — 셋 다 빨갛던 것을 세는 법을 고쳐 닫았다. 아래 quality_baseline" }
  P5_verify:       { status: not_started, approved_at: null, note: "" }
  P6_deliver:      { status: not_started, approved_at: null, note: "" }

# ── 작업흐름 게이트 — **같은 차수 안의 모듈·계약별 성숙도** ─────────
# 로드맵은 무엇을 내는지, 전역 gates는 차수 통합 상태, 아래는 어디까지 성숙했는지를 갖는다.
# P0/G0과 G6은 전역이다. 소스 쓰기는 기능을 소유한 작업흐름 P3_design 승인으로 열린다.
workstreams:
  system:
    phase: P6
    required_in: [RM-P1]
    blocked_by: []
    deferred_until: null
    gates:
      P1_discovery:    { status: approved, approved_at: "2026-09-12", note: "**사용자 승인 · Exit Criteria 8/8.** ACT-012, PRC-06~08, REQ-501~510을 현재 소스·Liquibase·화면 문서에서 역추적했다. SYSTEM 하위 16개·공통 대시보드 1개·메뉴 없는 공통 화면 8개와 근거 테이블 31개를 대조했고 추적성 오류 0건이다. 레드팀에서 전 수명주기·변조 불가·소스 키 한정·요청 승인이라는 과잉 표현을 현재 구현 범위로 바로잡았다. 역질문 권장안에 따라 설치용 ADMIN은 설치 시점의 전체 권한 기준선으로 한정하고, 운영에서는 시스템 관리자와 감사·품질 역할을 분리한다. 일반 계정·권한 공지와 요청은 system, AI 품질·정책 관련 알림은 admin이 소유한다" }
      P2_architecture: { status: approved, approved_at: "2026-09-12", note: "**사용자 승인 · Exit Criteria 8/8.** ADR-007 아래 ARCH-022~026으로 system의 백엔드·프론트 목표 경로, 31개 테이블 쓰기 소유권, 화면 경로와 기능별 이행 순서를 정의하고 AUTHZ-091로 설치용 ADMIN과 운영 권한을 분리했다. 사용자는 역할 겸임을 허용하고 특정 역할·메뉴 코드의 금지 하드코딩을 거부했다. 역할·메뉴·개인 권한 데이터와 유효 권한이 유일한 판정 근거다. 현재 고객이 없는 개발 단계이므로 신규 경로 전환과 회귀 시험 뒤 기존 API·화면 경로는 같은 슬라이스에서 즉시 제거하고 호환 별칭을 남기지 않는다. ASM-005·006은 기각됨으로 닫았다" }
      P3_design:       { status: approved, approved_at: "2026-09-12", note: "**사용자 승인 · Exit Criteria 11/11.** REQ-501~510을 UC-501~510·FEAT-501~510·ENT-501~531·API-501~599·SCR-501~525·TC 52건으로 연결했다. 실제 컨트롤러 99개와 목표 API의 요청·응답 타입·근거 메서드를 전수 대조했고 누락·중복 0건이다. 핵심 시퀀스는 UC-501·503·508 세 건이며 예외와 트랜잭션 경계를 표시했다. 권한 변경 API는 SYS_LO_ACCESS의 일반 시스템 사용 이력에 남기되 전용 원장은 고객사 요구가 생긴 도입 시점 이후만 기록하고 과거 변경은 복원하지 않는다. 같은 역할을 동시에 전체 저장하면 나중에 완료된 스냅샷이 이기고 자동 병합하지 않는다. 레드팀 위험은 사용자 결정과 TC-5076·TC-5026으로 닫았고 trace 오류 0건이었다" }
      P4_build:        { status: approved, approved_at: "2026-09-13", note: "사용자 재승인. CR-019로 재개방한 sample local 전용 코드·프런트·시드·Liquibase 기준선 분리를 재검증했다. 제품 번들은 sample을 제외하고 local은 여섯 화면을 포함하며, 전체 백엔드·프런트(88파일·688테스트)·시드·품질·추적성·문서 검사를 통과했다. SampleRules PIT는 변이 3개를 모두 제거했다. 실제 DB 설치·성능·번들 경고 영향은 P5에서 검증한다." }
      P5_verify:       { status: approved, approved_at: "2026-09-14", note: "**사용자 승인 · Exit Criteria 6/6.** 실제 빈 PostgreSQL 설치·product/local 기준선·product 백업/복구·JPA validate·API 인가 경계·운영 흐름을 검증했다. 잔여 5건은 RoleAuthServiceTest·AuthorizationInterceptorTest·CodeAdminServiceTest·ConfigServiceTest 재실행으로 닫았고, 전체 백엔드 check와 프런트 lint·타입 검사·테스트도 통과했다. system 소유 NFR은 0건이며 다른 작업흐름 NFR은 전역 G5 대상이 아니다. system 범위 trace 오류·경고 0건, Critical/High·Medium 이하 잔여 결함 0건이다. 실제 배치 자연 실행은 RUN-101 운영 관찰로 남긴다. P6에서 정본으로 생성물 전체를 다시 만들어 문서 생성 완전성 검사(ID 567개·장문 필드 1,980개)가 모두 누락 0건으로 닫혔다." }
  admin:
    phase: P1
    required_in: [RM-P1]
    blocked_by: []
    deferred_until: null
    gates:
      P1_discovery:    { status: in_progress, approved_at: null, note: "기존 요구사항 34건과 기준정보·Portal 이용자 관리 신규 16건 중 REQ-615를 제외한 15건은 confirmed다. REQ-615 1건은 전체 개발 완료 후 재검토 유예다. 2026-10-08 사용자가 REQ-038과 함께 보완한 admin REQ-303·305·306·608·612의 전체 변경 내용을 재확정했다. 커스텀 도구의 지식 연결·매핑별 사용 설명·후보 범위·승인 스냅샷·참조 버전 검증을 포함하며 OQ-029를 닫았다. 2026-10-02 사용자가 REQ-603 전체 정리안을 명시 확정했으며 교차 DB 지원·식별 계약은 P2에 남긴다. 2026-10-06 REQ-604의 API별 제공 시스템 지정·연결 선택·대상 시스템 그룹 매핑 제외를 포함한 카드 전체를 명시 확정했으며 연결 해석/변경 반영 계약은 P2에 남긴다. 2026-10-06 REQ-605의 그룹 정의·참조 현황·사용 중 삭제 차단과 지식 접근 그룹 변경 승인 규칙을 포함한 카드 전체를 명시 확정했다. 같은 날 REQ-606의 쿼터 등급 정의·허용 모델·월 적용·폐지 이전과 기존 예외 규칙을 포함한 카드 전체를 명시 확정했다. 같은 날 REQ-607의 고정 태그 ID·태그 자체 변경 승인·영향 확인용 연결 지식과 지식별 태그 ID 매핑 변경의 구분을 포함한 카드 전체를 명시 확정했다. 같은 날 요청 당시 지식 리비전 보존·태그/지식 변경 상호 차단 제외·승인 당시 영향 비교와 최소 검증을 추가한 REQ-607 전체 내용도 명시 확정했으며 화면/물리 버전/동시성 구현 계약은 P3에 남긴다. 2026-10-06 REQ-608의 연결 선택·입력값 구성 가이드·지식 API 매핑/승인·조회/실행 승인 구분·기존 보존 정책 참조를 포함한 카드 전체도 명시 확정했으며 연결/버전/영향은 P2, 화면/입력 검증은 P3에 남긴다. 2026-10-07 사용자가 그룹별 세 가지 처리와 공통 마스킹을 포함한 REQ-611 전체 카드를 명시 확정했으며 제품 파서·대상 DB 검증은 P3에 남긴다. 2026-10-08 사용자가 도구 전체 스냅샷·책임자 승인 후 반영·업무별 승인 설정 미사용 시 전결을 포함한 REQ-612 전체 카드를 명시 확정했다. 설정 저장/로드 계약은 P2, 상태·동시성/원자성은 P3에서 검증한다. 2026-10-08 사용자가 화면 편집 가능 설정과 YAML 읽기 전용 값의 구분·업무별 관리 승인 설정·항목별 적용 시점을 포함한 REQ-614 전체 카드도 명시 확정했다. REQ-615 유예를 제외한 기준정보 검토를 마치고 기존 사용자 선택에 따라 agent 기능 상세 요구사항 검토로 이어간다. 2026-10-01 사용자 결정으로 REQ-109의 DB 임시 저장·종료 후 보존 구분을 확정하여 OQ-015를 닫았다(ADR-016). 기준정보별 참조 검증·변경 전 스냅샷(ADR-017), 기본 모델 사용 불가 시 차단, 계획 통화와 Portal 사용자 관리 경계를 반영했다. REQ-607은 검색 태그·동의어로 한정한다. ADR-020으로 REQ-610의 agent 경유 검토·관리자 운영 모델/집계·소스 통신 계약·스텝별 조합을 확정하여 OQ-010·011을 닫았다. OQ-012는 REQ-615의 개발 완료 후 재검토로 옮겨 현재 답변 대기에서 제외했다. ADR-018로 사용자별 대상 매핑·그룹 추가 승인과 제거 무승인을 반영하고 SCR-037을 추가했다. ADR-019로 매 접근 시점의 현재 권한 판정과 유효 권한자의 동일인 승인을 확정하여 OQ-018·019를 닫았다. admin G1 별도 검증·승인이 필요하다" }
      P2_architecture: { status: in_progress, approved_at: null, note: "CR-023으로 실행 API·저장된 조회·추가 토큰 신청·승인의 최소 공개 계약과 쓰기 소유권을 ADR-013으로 정했다. admin P1 요구사항 상세 보강 뒤 P2 계약 영향과 정합성을 다시 검증한다" }
      P3_design:       { status: not_started, approved_at: null, note: "" }
      P4_build:        { status: not_started, approved_at: null, note: "" }
      P5_verify:       { status: not_started, approved_at: null, note: "" }
  agent:
    phase: P2
    required_in: [RM-P1]
    blocked_by: []
    deferred_until: null
    gates:
      P1_discovery:    { status: in_progress, approved_at: null, note: "질의 처리 요구는 이관됐으나 작업흐름 단위 승인은 아직이다. 이어가기·새 시도·실행용 상태 정리와 감사 분리, 전체 시간·턴당 토큰 상한 제거, 스텝·개별 호출·개인 동시 한도 유지와 새 시도 모델 변경 허용을 반영했다. 원문 기본 보존 3개월·매일 1회 파기·조사 보호·사용자대기 선행 만료를 확정했다. 2026-10-01 미보존도 진행·대기 중 공용 DB에 임시 저장하고 종료·중단 시 삭제하도록 OQ-015를 해소했다(ADR-016). 물리 저장·정리·재접속 계약은 P2/P3에서 정련한다" }
      P2_architecture: { status: in_progress, approved_at: null, note: "턴·스텝·점유·중단 설계 초안과 ADR-001·003이 있다. CR-023의 admin 공개 계약 초안(ADR-013)을 받아 저장된 조회의 현재 권한 재판정 경계를 대조했다" }
