  - id: REQ-608
    type: functional
    priority: must
    workstream: admin
    actors: ["ACT-003","ACT-002"]
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — FEAT-004·REQ-105·REQ-111·REQ-113·PRC-11; 신규 상세안은 확정 전"
    process_step: PRC-13-01
    title: "업무 API 계약·입출력 명세 기준정보 관리"
    detail: "관리자는 대상 시스템별 업무 API 계약과 요청·응답 경로 통제를 관리하고 고객사 공동 개발·시험·검수·오픈 근거를 연결할 수 있어야 한다"
    roadmap: RM-P1
    acceptance: "API 한 건에서 호출·입력·응답·결과 확인·오픈 근거를 확인할 수 있다. 명세 밖 응답 경로는 노출되지 않고 경고에 남으며 자격증명 값은 화면에 나타나지 않는다"
    summary: "호출 가능한 API의 검증된 계약과 고객사 적용 근거를 한 등록 원천에서 관리한다"
    intent:
      problem: "API의 호출·신원·결과·보안 계약이 누락되면 실행 결과를 오해하거나 미등록 응답을 노출한다"
      goal: "호출 가능한 API의 검증된 계약과 고객사 적용 근거를 한 등록 원천에서 관리한다"
      not: ["임의 URL을 즉시 실행하는 기능이 아니다","지식 변경 세트 승인이나 고객사 API 자동 감시·버전 협상을 새로 도입하지 않는다"]
    goal_trace: ["IN-06"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
