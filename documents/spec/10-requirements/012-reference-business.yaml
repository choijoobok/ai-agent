  - id: REQ-609
    type: functional
    priority: must
    workstream: admin
    actors: ["ACT-002"]
    source: "2026-09-30 기준정보 상세안 · 2026-10-01 사용자 결정: 대상별 ID 매핑·사용자 그룹 추가는 요청 후 별도 메뉴에서 승인·활성화, 제거는 무승인(ADR-018)"
    process_step: PRC-13-01
    title: "Portal 이용자의 대상별 신원 매핑·접근 권한 요청과 승인"
    detail: "관리자는 Portal 사용자에게 데이터소스·대상 시스템과 해당 대상의 사용자 ID 또는 사용자 그룹을 요청 상태로 등록하고, 승인자는 별도 사용자 접근 권한 승인 메뉴에서 승인·반려할 수 있어야 한다. 승인된 부여 항목만 활성화하며 권한 제거는 별도 승인 없이 처리한다"
    roadmap: RM-P1
    acceptance: "요청 상태의 대상 매핑과 사용자 그룹은 접근 권한을 부여하지 않는다. 승인 메뉴에서 승인한 동일 요청 내용만 활성화하며 반려·취소·제거한 요청을 늦은 승인으로 되살릴 수 없다. 활성 대상 매핑만으로 그룹·행 스코프·대상 시스템 자체 권한을 우회하지 않는다. 제거는 승인 없이 처리하고 이력을 남긴다"
    summary: "Portal 사용자에게 권한을 추가할 때 요청·승인을 거쳐 활성화하고, 제거는 승인 없이 처리한다. 대상별 사용자 ID는 승인된 매핑에서만 사용한다"
    intent:
      problem: "계정·Hub 소속·레거시 사용자 식별을 혼동하면 퇴직·이동 후 권한이 남거나 다른 사람의 신원으로 실행한다"
      goal: "Portal 이용자를 대상별 실제 사용자 신원과 연결한다"
      not: ["Portal 사용자 프로필·조직·이용 상태를 이중 관리하는 원장이 아니다","사용자 레거시 비밀번호나 사용자별 실제 행 접근 목록을 복제하지 않는다"]
    goal_trace: ["IN-06"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
      - {"item":"기본 신원 규칙: 대상 시스템 또는 데이터소스·Hub 식별자 그대로 사용/변환 패턴","origin":"고객사 신원 계약·관리자 입력","sensitivity":"개인 식별·권한 정보 — 열람 통제 필요","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"사용자별 예외: Portal 사용자·대상·예외 레거시 사용자 식별자·매핑 근거","origin":"관리자 입력·대량 등록/동기화","sensitivity":"개인 식별·권한 정보 — 열람 통제 필요","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - { item: "사용자별 권한 부여 요청: 대상 종류·대상/그룹·사용자 ID·요청 버전·상태·요청/처리 근거", origin: "관리자 요청·승인 메뉴 처리", sensitivity: "신원·접근 권한 정보", retention: "변경·승인 이력은 REQ-601·REQ-109를 따르며 권한 제거와 함께 지우지 않는다" }
      - {"item":"관리 이력: 등록/소속/활성/매핑 변경 전후·사유·원천·처리자·시각","origin":"관리자·인사 동기화","sensitivity":"개인 식별·권한 정보 — 열람 통제 필요","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"이용자 참조: Portal 이용자 ID·이름·현재 이용 상태의 읽기 전용 참조","origin":"REQ-616","sensitivity":"개인 식별·권한 정보 — 열람 통제 필요","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
    field_usage:
      - {"attribute_group":"기본 신원 규칙","used_for":"대상별 기본 사용자 ID 산출"}
      - {"attribute_group":"사용자별 예외","used_for":"기본 규칙으로 표현되지 않는 신원을 전달"}
      - {"attribute_group":"관리 이력","used_for":"오인 매핑·조직 변경 후 재부여 여부를 추적"}
      - {"attribute_group":"이용자 참조","used_for":"매핑 대상 식별과 비활성 사용자 구분"}
    consumers:
      - {"where":"agent API 실행·SQL 행 스코프","when":"실행 전","how":"API 신원 파라미터와 권한 테이블 사용자 바인딩에 같은 매핑 결과를 사용한다"}
      - {"where":"admin 권한 운영","when":"퇴직·조직 이동 후","how":"REQ-103의 비활성화·그룹 재확인·재부여를 처리한다"}
    business_rules:
      - "이용자 등록·활성 상태·소속 그룹·쿼터 기록은 REQ-616·REQ-103·REQ-116을 참조하며 신원 매핑에 복제하지 않는다"
      - "서비스 인증 계정과 업무 실행 사용자의 식별자는 별개다. SSO 로그인만으로 레거시 신원 매핑이 충족된 것으로 보지 않는다"
      - "필수 신원 매핑이 없으면 오류로 거부하며 NULL 바인딩이나 권한 없는 정상 0건 조회로 처리하지 않는다. 신원이 있고 허용 행이 없으면 0건은 정상이다"
      - "사용자별 예외는 해당 대상 기본 규칙보다 우선한다. 민감한 식별값과 매핑 원문은 관련 관리 권한 범위 안에서만 조회한다"
      - "2026-10-01 사용자 결정(ADR-018): 사용자별 데이터소스·대상 시스템 신규 매핑과 사용자 그룹 추가는 요청 상태로 저장하며 접근 권한은 없다. 사용자 접근 권한 승인 메뉴(SCR-037)의 승인 권한자가 승인한 항목만 활성 상태로 전환한다. 다른 대상의 기존 활성 권한은 신규 요청으로 바뀌지 않는다"
      - "대상 매핑 요청에는 Portal 사용자·대상 종류/식별자·해당 대상의 사용자 ID·요청 사유·신원 근거를 남긴다. 그룹 요청에는 사용자·그룹·사유를 남긴다. 승인자는 대상 계정의 존재만이 아니라 해당 이용자와의 신원 연결 근거를 확인한다"
      - "승인은 요청한 사용자·대상·ID 또는 그룹과 요청 버전에만 유효하다. 요청 내용 변경 시 이전 승인 근거를 재사용하지 않으며 승인·활성화는 함께 성공하거나 함께 실패한다. 중복 승인·취소 후 승인·제거 후 지연 승인은 활성 권한을 다시 만들지 못한다"
      - "기존 대상 사용자 ID 변경도 새 신원 부여이므로 승인 전에는 변경 ID를 사용하지 않는다. 기본 규칙으로 산출한 ID도 승인된 사용자별 대상 매핑을 대신하지 않는다. 규칙 변경·대량 등록·동기화로 새 부여 또는 ID 변경이 생겨도 승인 경로를 우회하지 않는다"
      - "사용자에게 부여된 데이터소스·대상 시스템·그룹 제거는 권한자가 승인 없이 처리하고 사유·변경 전 스냅샷·처리자·시각을 남긴다. 제거는 기준정보 정의나 감사 이력 삭제가 아니다. 다시 부여하거나 제거한 권한을 복원할 때는 새 요청·승인이 필요하다"
      - "대상 접근은 승인된 활성 사용자-대상 매핑과 기존 그룹·객체 권한·행 스코프·대상 시스템 권한을 함께 만족해야 한다. 요청·반려·취소·제거 상태는 유효 권한 집합에 넣지 않는다. 그룹 일부 제거 후에도 다른 승인된 그룹으로 같은 접근이 허용될 수 있다"
