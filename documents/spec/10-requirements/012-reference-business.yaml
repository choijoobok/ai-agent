# 영역: 기준정보 쿼터·검색태그·API·신원·프롬프트
requirements:
  - id: REQ-606
    type: functional
    priority: must
    workstream: admin
    actors: ["ACT-004"]
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — REQ-116·REQ-118·FEAT-017; 신규 상세안은 확정 전"
    process_step: PRC-13-01
    title: "쿼터 등급 정의·모델 허용 집합 관리"
    detail: "운영·비용 관리자는 등급명·순위·배분 가중치·허용 공급 경로/모델/effort 집합과 폐지·통합 대상 등급을 관리하고 적용 월과 영향을 확인할 수 있어야 한다"
    roadmap: RM-P1
    acceptance: "등급 정의와 허용 모델을 조회하고 다음 적용 월의 영향을 볼 수 있다. 당월·과거 월은 바뀌지 않으며 폐지 등급은 기존 이전 절차를 따른다"
    summary: "등급 기준을 독립 관리하고 사용자별 월 적용·토큰 배분은 기존 규칙으로 연결한다"
    intent:
      problem: "쿼터 등급 정의와 사용자 월별 배정 기록이 섞이면 현재 등급 수정으로 과거 월 계산을 바꿀 수 있다"
      goal: "등급 기준을 독립 관리하고 사용자별 월 적용·토큰 배분은 기존 규칙으로 연결한다"
      not: ["사용자 그룹에 따른 접근 권한이 아니다","월별 토큰 배정·사용량·승급 신청 자체를 등급 정의로 저장하지 않는다"]
    goal_trace: ["IN-06","MET-02"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
      - {"item":"등급 정의: 식별자·등급명·순위·설명·배분 가중치","origin":"관리자 입력","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"주 추론 허용 범위: 공급 경로·모델·effort 조합 집합","origin":"REQ-602 모델 등록 참조","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"적용·폐지: 정의의 적용 월·폐지/통합 시 이전 등급·변경 근거","origin":"REQ-116·REQ-118의 월 단위 관리","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
    field_usage:
      - {"attribute_group":"등급 정의","used_for":"신규 사용자 기본 선택과 가중치 기반 개인 한도 산정"}
      - {"attribute_group":"주 추론 허용 범위","used_for":"portal 선택지와 서버 모델 선택 검증"}
      - {"attribute_group":"적용·폐지","used_for":"다음 적용 가능한 월의 사용자 배정과 과거 이력 유지"}
    consumers:
      - {"where":"Hub 이용 등록·월별 배정","when":"등록·확정 시","how":"REQ-116의 기본 등급·가중치·일할 배정과 REQ-118 산식을 사용한다"}
      - {"where":"portal·agent","when":"모델 선택·새 턴·중단 후 새 시도 시작 시","how":"사용자 적용 월 등급과 현재 모델 상태를 확인한다"}
    business_rules:
      - "가중치 자릿수·순위별 조건·월 잠금·첫 사용 전 정정·폐지 이전 등급·모델 비활성 예외는 REQ-116이 정본이다. 산식·월말 확정·승계는 REQ-118이 정본이다"
      - "허용 조합은 등록되고 지원되는 모델 조합을 참조한다. 등급 삭제나 이름 변경으로 과거 배정·사용량을 다시 계산하지 않는다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "소속 사용자가 있는 등급을 대체 등급 지정 없이 폐지하여 다음 월을 확정하려 하면 REQ-116에 따라 거부된다"
    lifecycle: "적용 월별 예정·적용중·종료와 폐지 규칙은 REQ-116을 참조한다"
    permissions:
      - "ACT-004의 해당 메뉴·조회/등록/수정/상태변경 액션 권한으로 관리한다. 화면 노출과 별개로 서버에서 검증한다"
      - "권한 밖 개인정보·비밀값·업무 데이터를 기준정보의 사용처 조회로 우회 열람하지 못한다"
    audit: "기존 정책·승인·월별 확정 이력은 관련 요구사항을 따른다. 신규 관리 속성의 변경 근거는 REQ-601 공통안으로 확인하며 이력 없이 기존 근거를 덮어쓰지 않는다"
    volume: "고객사별 관리 항목 수·변경 빈도는 미확인이다. 기존 NFR을 임의 수치로 바꾸지 않는다"
    config:
      - "관리할 속성·원천·사용처는 이 카드의 data·field_usage·consumers를 따른다. 코드/배포 설정·관리 데이터·읽기 전용 참조를 혼합하지 않는다"
    risk: "참조 변경·사용 중지·적용 시점이 후속 실행과 이력을 깨뜨리지 않는지 설계·시험에서 검증한다"
    relations:
      depends_on: ["REQ-601"]
      constrains: []
      conflicts_with: []
      nfr: ["NFR-011"]
      interfaces: []
    realization:
      features: ["FEAT-017"]
      screens: ["SCR-021"]
    examples:
      - {"kind":"정상","case":"B 등급의 다음 적용 월 가중치와 허용 모델을 바꾸면 당월 배정은 유지되고 다음 배정 검토에만 반영된다"}
      - {"kind":"예외","case":"소속 사용자가 있는 등급을 대체 등급 지정 없이 폐지하여 다음 월을 확정하려 하면 REQ-116에 따라 거부된다"}
    volatility: {"level":"high","what":"고객사마다 기준 값·대상·규모가 다르므로 운영 데이터로 관리한다. 관리 원천과 승인·보안 경계는 고객사 값과 구분한다"}
    open: []
    maturity: { level: elaborated, at: "2026-09-30", by: "AI 정리", confirmed_by: null }

  - id: REQ-607
    type: functional
    priority: should
    workstream: admin
    actors: ["ACT-003"]
    source: "2026-10-01 사용자 정정 — 요청한 것은 검색용 태그 관리이며 별도 업무 도메인 관리·자산 귀속은 요청하지 않음. 기존 REQ-303·ARCH-060의 태그·동의어 검색을 상세화하며 화면 구성은 미확정"
    process_step: PRC-13-01
    title: "지식 검색 태그·동의어 관리"
    detail: "업무 자산 관리자는 지식을 찾기 위한 태그·동의어와 지식별 태그 부여 내용을 조회·관리할 수 있어야 한다. 질의 검색어를 지식의 태그와 매칭하며, 찾은 지식에서 인증 예제·카탈로그로 이어지는 기존 참조 관계를 사용한다"
    roadmap: RM-P1
    acceptance: "재고·가용재고 등의 태그와 동의어로 허용된 활성 지식을 찾고, 그 지식의 사용 가능한 예제·카탈로그 참조를 합산할 수 있다. 별도 도메인을 등록하거나 지식·예제·카탈로그를 도메인에 귀속시키지 않아도 검색할 수 있다"
    summary: "검색용 태그·동의어와 지식의 연결을 관리한다"
    intent:
      problem: "같은 업무 의미를 다른 검색어로 표현하면 필요한 지식을 놓칠 수 있다"
      goal: "관리자가 검색 표현을 보완하여 관련 지식을 찾을 수 있게 한다"
      not: ["별도 업무 도메인 기준정보·자산 분류 계층을 만들지 않는다","태그로 접근 권한을 부여하지 않는다","태그를 카탈로그·인증 예제에 직접 붙이는 기능을 자동으로 추가하지 않는다"]
    goal_trace: ["IN-06"]
    decider: "제품 오너(사용자)"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 지식의 태그·동의어·참조 링크와 변경 절차는 REQ-303·REQ-305·REQ-306을 따른다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다"
    data:
      - { item: "검색 태그·동의어", origin: "업무 자산 관리자", sensitivity: "관련 지식의 접근 범위 적용", retention: "REQ-303·REQ-305의 지식 리비전 보존 규칙" }
      - { item: "지식별 태그 부여 내용·참조 리비전", origin: "지식 리비전", sensitivity: "그룹 제한 업무 지식", retention: "REQ-303·REQ-305의 지식 리비전 보존 규칙" }
    field_usage:
      - { attribute_group: "검색 태그·동의어", used_for: "사용자 질의의 검색어와 지식 후보를 연결한다" }
      - { attribute_group: "지식별 태그 부여 내용", used_for: "검색 대상과 태그 변경의 영향 지식을 확인한다" }
    consumers:
      - { where: "agent 지식 검색", when: "질의 검색어 추출 후", how: "ARCH-060의 태그 검색과 선택적 벡터 검색을 사용한다" }
      - { where: "agent 컨텍스트 구성", when: "주입할 지식 선택 후", how: "REQ-303의 지식 직접 카탈로그·인증 예제 경유 카탈로그 합산 규칙을 적용한다" }
      - { where: "사용 안내", when: "지식 검색 무결과 시", how: "REQ-308에 따라 사용자에게 허용된 활성 지식의 태그만 안내한다" }
    business_rules:
      - "검색 방식과 임베딩 선택은 ARCH-060, 태그·동의어·참조 링크의 소유와 변경 절차는 REQ-303이 정본이다"
      - "태그·동의어가 검색에 쓰이는 내용을 바꾸면 해당 지식 후보 리비전과 기존 변경 세트 절차를 따른다. 운영 지식의 검색 의미를 별도 사전 수정으로 우회 변경하지 않는다"
      - "권한 밖 지식은 태그 매칭 여부와 관계없이 주입하지 않는다. 예제·카탈로그 접근 판정과 참조 합산은 REQ-303을 따른다"
    exceptions:
      - "미등록 검색 표현으로 지식을 찾지 못하면 REQ-308의 무결과 안내를 따른다"
      - "비허용 지식에 붙은 태그가 검색어와 같아도 그 지식이나 참조 객체를 노출하지 않는다"
    lifecycle: "지식에 적용되는 태그·동의어의 후보·활성·변경 이력은 REQ-303·REQ-305·REQ-306을 따른다"
    permissions: ["ACT-003의 관리 메뉴·액션 권한을 검사하며, 검색 시 지식의 접근 허용 그룹을 적용한다"]
    audit: "지식 리비전의 태그·동의어 변경 근거와 당시 내용을 보존한다(REQ-303·REQ-305)"
    volume: "고객사별 태그·동의어 수와 변경 빈도는 미확인이다"
    config: "태그·동의어와 지식별 부여 내용은 관리자 관리 값이다"
    risk: "공통 태그 표현의 변경이 여러 지식의 검색 결과를 바꿀 수 있으므로 영향 지식과 적용 리비전 경계를 화면 설계에서 드러내야 한다"
    relations:
      depends_on: ["REQ-601"]
      constrains: []
      conflicts_with: []
      nfr: []
      interfaces: []
    realization:
      features: ["FEAT-024"]
      screens: ["SCR-010"]
    examples:
      - { kind: 정상, case: "지식 '가용재고 계산 방법'의 태그·동의어에 '가용재고'·'출고가능수량'을 등록하면 두 표현으로 지식을 찾고 연결된 예제·카탈로그를 참조한다" }
      - { kind: 예외, case: "검색어와 태그가 일치해도 그 지식의 허용 그룹에 속하지 않는 사용자에게는 지식을 주입하지 않는다" }
    volatility: { level: high, what: "고객사별 검색 표현·동의어·지식별 태그가 다르다" }
    open:
      - "@defer P3 독립 태그 화면 또는 지식 편집 화면 통합, 공통 태그·동의어의 재사용 구조와 영향 지식 표시를 설계한다. 별도 업무 도메인 관리로 확대하지 않는다"
    maturity: { level: elaborated, at: "2026-10-01", by: "사용자 정정 반영", confirmed_by: null }

  - id: REQ-608
    type: functional
    priority: must
    workstream: admin
    actors: ["ACT-003","ACT-002"]
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — FEAT-004·REQ-105·REQ-111·REQ-113·PRC-11; 신규 상세안은 확정 전"
    process_step: PRC-13-01
    title: "업무 API 계약·입출력 명세 기준정보 관리"
    detail: "관리자는 대상 시스템별 업무 API 계약과 요청·응답 경로 통제를 관리하고 고객사 공동 개발·시험·검수·오픈 근거를 연결할 수 있어야 한다"
    roadmap: RM-P1
    acceptance: "API 한 건에서 호출·입력·응답·결과 확인·오픈 근거를 확인할 수 있다. 명세 밖 응답 경로는 노출되지 않고 경고에 남으며 자격증명 값은 화면에 나타나지 않는다"
    summary: "호출 가능한 API의 검증된 계약과 고객사 적용 근거를 한 등록 원천에서 관리한다"
    intent:
      problem: "API의 호출·신원·결과·보안 계약이 누락되면 실행 결과를 오해하거나 미등록 응답을 노출한다"
      goal: "호출 가능한 API의 검증된 계약과 고객사 적용 근거를 한 등록 원천에서 관리한다"
      not: ["임의 URL을 즉시 실행하는 기능이 아니다","지식 변경 세트 승인이나 고객사 API 자동 감시·버전 협상을 새로 도입하지 않는다"]
    goal_trace: ["IN-06"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
