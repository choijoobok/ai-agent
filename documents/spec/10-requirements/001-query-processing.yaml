requirements:
# ── 질의 처리 ───────────────────────────────────────────────
  - id: REQ-001
    type: functional
    priority: must
    actors: [ACT-001]
    title: "세션 내 맥락 유지"
    detail: "같은 세션 안에서는 이전 대화 맥락을 유지한다"
  - id: REQ-002
    type: functional
    priority: must
    actors: [ACT-001]
    title: "과거 턴 결과 재참조"
    detail: "직전 턴이 아닌 **과거 턴의 결과를 다시 참조**할 수 있어야 한다 (중간에 다른 주제를 거친 뒤 '아까 조회했던 것' 을 지시)"
  - id: REQ-003
    type: functional
    priority: must
    actors: [ACT-001]
    title: "컨텍스트 총량 제한"
    detail: "세션에 대화가 과도하게 누적되지 않도록 컨텍스트 총량을 제한할 수 있어야 한다"
    note: "**과거 턴 요약과 원본 재조회 참조를 병행**하는 방식으로 구현한다. 최근 N턴만 남기는 슬라이딩 윈도우 단독 방식은 REQ-002 를 만족하지 못한다"
  - id: REQ-004
    type: functional
    priority: must
    actors: [ACT-001]
    title: "연속 도구 호출"
    detail: "한 턴 처리 중 LLM 은 agent 에게 도구 호출을 **연속적으로** 요청할 수 있다"
  - id: REQ-005
    type: functional
    priority: must
    actors: [ACT-001]
    title: "처리 중 사용자 개입과 재개"
    detail: "턴 처리 중 사용자에게 추가 정보를 요구하거나 승인을 요청할 수 있고, 응답을 받아 처리를 재개할 수 있다"
  - id: REQ-006
    type: functional
    priority: must
    actors: [ACT-001]
    title: "처리 진행 상황 단계별 표시"
    detail: "질의 분석 중 · 조회 쿼리 작성 중 · 조회 중 등을 화면에 표시한다"
  - id: REQ-007
    type: functional
    priority: must
    actors: [ACT-001]
    title: "사용자 중단"
    detail: "처리 중 사용자가 중단할 수 있다. 중단 시 진행 중인 액션의 처리 방침을 정의해야 한다"
  - id: REQ-008
    type: functional
    priority: must
    actors: [ACT-001]
    title: "처리 중 추가 입력의 의도 분류"
    detail: "처리 중 사용자가 새 입력을 넣으면 **그 의도를 먼저 분류**한 뒤 처리한다. 새 입력이 항상 진행 중 턴에 대한 보강인 것은 아니며 — 전제를 뒤집는 교정일 수도, 무관한 별개 질의일 수도, 그만두라는 뜻일 수도 있다"
    traces_to: [REQ-030, REQ-031, REQ-032, REQ-033]
  - id: REQ-009
    type: functional
    priority: must
    priority_reason: "portal과 agent가 나뉘거나 다중화되면 계약 없이는 같은 요청과 응답을 해석할 수 없으므로 RM-P1의 필수 기반이다"
    actors: [ACT-001]
    process_step: PRC-05-02
    title: "요청·응답 포맷 규약 확정"
    detail: "portal ↔ agent ↔ LLM 사이의 데이터 포맷 규약을 문서로 확정한다"
    note: "portal↔agent의 제품 API 계약과 agent↔LLM 공급자 프로토콜은 서로 다른 계약이다. 전자는 integration 작업흐름에서, 후자는 FEAT-304와 IF-003에서 각각 버전과 호환성을 관리한다"
  - id: REQ-010
    type: functional
    priority: must
    actors: [ACT-001]
    title: "전체 흐름도 작성"
    detail: "연속 도구 호출 · 사용자 개입 · 중단 · 과거 턴 참조 · 신규 입력 끼어들기를 포함하는 흐름도를 작성한다"
  - id: REQ-011
    type: functional
    priority: must
    actors: [ACT-001]
    title: "응답 형태 — 텍스트 · 그리드 · 차트 · 내보내기"
    detail: "텍스트, 데이터 그리드, 차트, 엑셀 다운로드, 차트 이미지 다운로드를 지원한다"
    hard_rule: "**엑셀·이미지 내보내기는 클라이언트 컴포넌트의 기능이고 서버는 파일을 생성하지 않는다**"
    traces_to: [NGOAL-10]
  - id: REQ-012
    type: functional
    priority: must
    actors: [ACT-001]
    title: "기준 시각 제공"
    detail: "처리 결과가 데이터 조회일 때는 기준 시각(DW 사용 시 동기화 시점)을 함께 제공한다"
    why: "사용자가 동기화 지연을 인지하지 못한 채 낡은 데이터로 판단하는 것을 막는다"
  - id: REQ-013
    type: functional
    priority: must
    actors: [ACT-001]
    title: "중단된 턴의 재시도"
    detail: "턴이 정상 응답 없이 **중단된 경우**(서버 장애·수동 중단·오류) 사용자가 **재시도를 요구**할 수 있다. 중단된 턴은 재개 가능 상태로 기록한다"
  - id: REQ-014
    type: functional
    priority: should
    actors: [ACT-001]
    title: "중단 턴 재개 여부를 되묻지 않는다"
    detail: "중단 이후 **무관한 새 질의**를 한 경우, 중단된 턴의 재개 여부를 되묻는 것은 **프롬프트 규칙에 그렇게 명시된 경우에만** 수행한다. 명시가 없으면 묻지 않는다"
  - id: REQ-015
    type: functional
    priority: must
    actors: [ACT-001]
    title: "질의 해석문"
    detail: "LLM 은 사용자 질의를 **명료하게 재정리한 해석문**을 만들고, 이를 지식 검색·SQL 생성·실행 API 탐색의 입력으로 사용한다. 결과에는 이 해석문을 함께 제시해 사용자가 자신의 의도와 대조할 수 있게 한다"
  - id: REQ-016
    type: functional
    priority: must
    actors: [ACT-001]
    title: "화면 세션과 무관한 턴 처리"
    detail: "세션 창·브라우저를 닫거나 로그아웃해도 진행 중인 턴은 계속 처리되고 결과가 저장된다. agent 는 질의 접수 시점에 필요한 사용자·권한 정보를 **처리 문맥으로 복사해 보유**하며, 이후 처리 과정에서 화면 세션에 의존하지 않는다"
  - id: REQ-017
    type: functional
    priority: must
    actors: [ACT-001]
    title: "명시적 승인이 아닌 모든 입력은 비승인"
    detail: "사용자대기 상태에서 승인·거절이 아닌 다른 입력을 하면 **비승인으로 취급**한다. 대기 중이던 액션은 실행하지 않고, 그 입력을 LLM 에 피드백으로 전달해 같은 턴을 계속 처리한다. 나중에 다시 승인 여부를 되묻지 않는다"
  - id: REQ-018
    type: functional
    priority: must
    actors: [ACT-001]
    title: "현재 상태와 경과 시간 표시"
    detail: "처리 중에는 현재 상태와 **경과 시간**을 화면에 표시한다"
  - id: REQ-019
    type: functional
    priority: must
    actors: [ACT-001]
    title: "세션 재진입 시 역방향 페이징"
    detail: "세션을 다시 열면 마지막 턴만 표시하고, 이전 턴은 위로 스크롤할 때 일정 건수 단위로 추가 조회해 붙인다"
  - id: REQ-020
    type: functional
    priority: could
    actors: [ACT-001]
    title: "사용자 언어와 원어의 분리"
    detail: "지식 검색과 SQL 생성은 **등록된 원어 기준으로 수행**하고, 사용자에게 보이는 설명·안내만 사용자 언어로 제시한다. **조회된 데이터 값 자체는 번역하지 않는다**"
    roadmap: RM-P4
    note: "번역 과정에서 업무 용어가 왜곡되면 태그 매칭이 실패한다 — 지식 태그의 **동의어에 외국어 표현을 함께 등록**할 수 있어야 한다"
  - id: REQ-021
    type: functional
    priority: must
    actors: [ACT-001]
    title: "컨텍스트 단계적 축소"
    detail: "여러 데이터소스에 도달 가능하면 주입할 카탈로그가 데이터소스 수만큼 늘어난다. **질의와 관련된 데이터소스를 먼저 선별하고 그 카탈로그만 주입**하며, 선별은 **업무 도메인 → 데이터소스 → 테이블 → 컬럼** 순의 단계적 축소로 수행한다"
    hard_rule: "주입이 확정된 지식·인증 예제 쿼리의 **참조 공개 인터페이스는 객체 선별 결과에 합류**시킨다 — 키워드 선별이 놓친 공개 객체를 링크가 결정적으로 메꾼다"
    traces_to: [REQ-003]
  - id: REQ-022
    type: functional
    priority: must
    actors: [ACT-001]
    title: "조회 계획을 업무 용어로 제시하고 자연어로 교정받는다"
    detail: "조회에 대해서는 질의 해석문·대상 데이터 영역의 업무 명칭·적용 조건·기간·집계 단위를, **액션이 포함된 턴에서는 실행할 액션과 순서를 함께** 제시한다. **기본 필터가 해제된 경우 그 사실을 함께 표시한다**"
    hard_rule: "**테이블·컬럼의 물리명과 SQL 원문은 노출하지 않는다.** 사용자는 계획을 보고 **자연어로 교정**하며, 물리명이나 SQL 을 직접 편집하게 하지 않는다"
    traces_to: [REQ-015, REQ-104]
  - id: REQ-023
    type: functional
    priority: must
    actors: [ACT-001]
    title: "조회 계획 확인을 모든 턴에 강제하지 않는다"
    detail: "강제 조건은 정책으로 관리하고, 기본값은 ① 대상 데이터 영역이 복수이거나 선별 확신이 낮을 때 ② 예상 결과 규모가 임계치를 넘을 때 ③ 액션이 포함된 턴"
    hard_rule: "**③에서 계획 확인과 실행 승인을 하나로 합치지 않는다** — 전자는 '무엇을 하려는지 맞나' 를, 후자는 '되돌릴 수 없는 것을 실행해도 되나' 를 묻는다"
    why: "매 조회마다 확인을 요구하면 대화가 느려지고 사용자가 확인을 습관적으로 넘긴다"
  - id: REQ-024
    type: functional
    priority: must
    actors: [ACT-001]
    title: "성공한 턴의 결과 교정 재요청"
    detail: "처리는 정상 종료됐지만 결과가 의도와 다른 경우, 이전 턴의 해석문·조회 계획·생성 SQL 을 재작성의 입력으로 사용한다. 사용자가 같은 질의를 처음부터 다시 입력하게 하지 않는다"
    note: "REQ-013(중단 턴 재시도)과 **다른 경로**다"
  - id: REQ-025
    type: functional
    priority: must
    actors: [ACT-001]
    title: "확신이 없으면 추측하지 않는다"
    detail: "대상 데이터 영역을 특정할 수 없거나, 조건 해석이 갈리거나, 카탈로그·지식·예제 쿼리로 근거를 세울 수 없으면 임의로 골라 실행하지 않고 사용자에게 확인을 요구하거나 처리 불가로 응답한다. 처리 불가 응답에는 **무엇이 부족했는지**를 함께 제시한다"
    hard_rule: "**자율 처리 비율보다 처리한 것의 정확도를 우선한다**"
    traces_to: [SUC-02, SUC-03]
  - id: REQ-026
    type: functional
    priority: must
    actors: [ACT-001]
    title: "연속 실행 — 여러 액션이 한 요청에 걸릴 때"
    detail: "실행할 액션과 순서는 **사용자 요청에서 얻고 Hub 가 추론해 정하지 않는다.** 승인 필요 액션이 하나라도 있으면 예정된 액션 전체를 제시해 일괄 승인받되, 파라미터가 앞 액션의 결과에 의존하는 액션은 개별 승인한다"
    hard_rule: "**실패하면 그 지점에서 중단하고 보고**하며, 남은 액션의 처리 여부를 근거 없이 판단하지 않는다. 부분 실행 후의 재요청은 이미 실행된 것을 제시하고 사용자가 정한다"
    roadmap: RM-P2
    traces_to: [REQ-025, REQ-105]

  - id: REQ-027
    type: functional
    priority: must
    priority_reason: "RM-P1에서 모든 표현을 완성하지 않아도 새 의미 블록이 agent 통제를 바꾸지 않는 확장 경계는 첫 계약부터 있어야 한다"
    actors: [ACT-001]
    process_step: PRC-02-05
    title: "응답 표현 형식의 확장"
    detail: "portal 은 텍스트·그리드·차트·지도 등 표현 형식을 추가할 수 있어야 하며, 새 표현 형식 때문에 agent 의 질의 처리·권한·보안·쿼터·감사 흐름을 바꾸지 않아야 한다. agent가 검토 필요 자산을 하나 이상 사용했다고 계약 메타데이터로 알리면 portal은 사용자에게 검토 필요 경고를 표시하되, 지식 식별자·리비전과 공개 객체명은 노출하지 않는다"
    hard_rule: "**agent 계약에 특정 시각화 라이브러리의 옵션을 넣지 않는다.** agent 는 버전이 있는 의미 블록과 데이터를 반환하고 portal 의 표현 어댑터가 도구별 설정으로 변환한다"
    note: "지도는 미래 portal 요구의 대표 사례다. @defer G3 — portal 작업흐름에서 실제 시각화 도구와 화면 동작을 정하되, 계약 확장점은 integration 작업흐름에서 먼저 잠근다"
    traces_to: [REQ-009, REQ-011]

# ── 처리 중 입력의 네 갈래 ──────────────────────────────────
  - id: REQ-030
    type: functional
    priority: must
    actors: [ACT-001]
    title: "네 갈래 분기 — 보강 · 교정 · 별개 · 중단"
    detail: "① **보강**(조건·범위를 더한다) → 진행 중 턴에 반영 ② **교정**(전제가 틀렸다) → 되돌려 다시 수행, 지금까지의 스텝 결과는 버린다 ③ **별개**(무관한 질의) → 진행 중 턴은 그대로 두고 **별도 턴**으로 접수 ④ **중단** → 중단으로 전이"
    why: "**②를 ①로 처리하면 틀린 방향으로 스텝이 누적된다.** 토큰을 아끼려고 스텝 경계 반영을 택한 것이 오히려 더 큰 낭비가 되며, 액션까지 도달하면 복구 절차가 필요해진다"
    hard_rule: "어느 갈래든 **반영 시점은 스텝 경계다.** 진행 중인 LLM 요청을 즉시 끊지 않는다"
  - id: REQ-031
    type: functional
    priority: must
    actors: [ACT-001]
    title: "의도 판정은 LLM 분류 + 사용자 확인"
    detail: "자연어 입력의 의도를 규칙으로 가르는 것은 신뢰할 수 없고, 분류만 하고 확인하지 않으면 오분류가 그대로 진행된다. **분류는 보조 판정 역할**이며 관리자가 지정한 모델로 고정한다"
    hard_rule: "**판단이 갈리면 멈추는 쪽으로 기운다** — '멈춘다' 는 판정이 틀리면 다시 시도하면 되지만 **'계속한다' 는 판정이 틀리면 오류가 누적된다**. 확인 문구에는 **무엇을 버리게 되는지**를 함께 제시한다"
    open: "**분류 프롬프트를 프롬프트 규칙(FEAT-021)으로 관리할지가 미확정이다** — 프롬프트 규칙은 관리자가 운영 화면에서 바꾸는 *업무 지시* 인데 이것은 *시스템 분류기* 라 성격이 다르다. 운영 화면에 열면 분류가 조용히 나빠질 수 있고, 코드에 박으면 오분류를 고치려 배포해야 한다. @defer P3 agent 상세 설계에서 정한다"
    open2: "**한 턴당 분류 호출 횟수 상한이 미확정이다** — 처리 중 입력을 연타하면 쿼터가 소모된다. @defer P2 쿼터 설계에서 정한다(NFR-010~017)"
  - id: REQ-032
    type: functional
    priority: must
    actors: [ACT-001]
    title: "확인은 병행형이 기본, 차단형은 되돌릴 수 없을 때만"
    detail: "**병행형**(기본) — 턴은 처리중을 유지한 채 분류 결과를 기본값으로 표시하고 되돌릴 수단을 제공한다. 아무 조치도 하지 않으면 분류대로 반영된다. **차단형** — 진행 중 턴이 `승인 대기` 이거나 액션을 이미 실행한 경우 `의도 확인 대기` 로 전이하고 사용자의 선택 없이는 진행하지 않는다"
    hard_rule: "**분류 호출이 실패하거나 판정이 서지 않으면 차단형으로 폴백한다**"
    why: "매 입력마다 차단형 확인을 요구하면 대화가 느려지고 사용자가 확인을 습관적으로 넘긴다. 병행형의 전제는 오분류가 복구 가능하다는 것인데, 액션이 걸린 턴에서는 그 전제가 성립하지 않는다"
    open: "**`의도 확인 대기`(WT-03) 의 만료 시간 기본값이 미확정이다** — 만료 시간은 대기 유형별로 관리하며(03-glossary/_index.yaml state_rules) 승인은 사람의 판단을 기다리므로 길고 의도 확인은 직전 입력에 대한 반응이므로 짧다는 것까지만 정해져 있다. **값은 실측이 필요하다**(ASM-002 의 measurement_first 와 같은 성격이다). @defer P2 응답성 측정이 서면 그 값으로 정한다"
  - id: REQ-033
    type: functional
    priority: must
    actors: [ACT-001]
    title: "중단·추가 입력은 턴 레코드에 요청으로 기록한다"
    detail: "요청은 **턴을 처리 중인 인스턴스가 아닌 다른 인스턴스로 도착할 수 있다.** 멀티 인스턴스 운영에서 요청을 받은 인스턴스는 다른 인스턴스가 열어 둔 LLM 연결을 직접 끊을 수 없으므로, 턴 레코드에 요청으로 기록하고 처리 중인 인스턴스가 스텝 경계에서 확인해 스스로 중단하거나 반영한다"
    hard_rule: "중단 시 진행 중이던 LLM 요청은 클라이언트 측에서 취소하되 **이미 발생한 토큰은 과금되므로 사용량으로 기록한다**"
  - id: REQ-034
    type: functional
    priority: must
    actors: [ACT-001]
    title: "agent ↔ LLM 은 스트리밍 수신"
    detail: "중단을 실효 있게 하려면 스트리밍이어야 한다. 응답 전체를 기다리는 방식에서는 취소 시점에 이미 생성이 끝나 있어 절감 효과가 없고 REQ-018 의 상태 표시 근거도 얻을 수 없다"
    note: "이 구간의 스트리밍은 portal ↔ agent 가 비동기 폴링인 것과 **무관하게 성립한다**"
  - id: REQ-035
    type: functional
    priority: must
    actors: [ACT-001]
    title: "의도 분류 입력의 최소화"
    detail: "**넣는다** — 진행 중 턴의 해석문 · 현재 단계 · 액션 대기 여부 · 직전 턴 해석문 1건 · 새 입력 원문. **넣지 않는다** — 대화 이력 전체 · 스키마 카탈로그 · 지식·예제 쿼리 · **조회 결과 데이터**"
    why: "의도 분류는 '무엇을 조회할지' 를 판단하지 않는다. 조회 결과 데이터를 넣지 않는 것은 토큰 문제만이 아니라 전송 최소화 원칙(REQ-106)이다"
    traces_to: [REQ-003, REQ-106]
