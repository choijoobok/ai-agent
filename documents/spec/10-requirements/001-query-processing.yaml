requirements:
# ── 질의 처리 ───────────────────────────────────────────────
  - id: REQ-001
    type: functional
    priority: must
    category: "대화 맥락·참조"
    actors: [ACT-001]
    title: "세션 내 맥락 유지"
    detail: "같은 세션 안에서는 이전 대화 맥락을 유지한다"
  - id: REQ-002
    type: functional
    priority: must
    category: "대화 맥락·참조"
    actors: [ACT-001]
    title: "과거 턴 결과 재참조"
    detail: "직전 턴이 아닌 **과거 턴의 결과를 다시 참조**할 수 있어야 한다 (중간에 다른 주제를 거친 뒤 '아까 조회했던 것' 을 지시)"
  - id: REQ-003
    type: functional
    priority: must
    category: "대화 맥락·참조"
    actors: [ACT-001]
    title: "컨텍스트 총량 제한"
    detail: "세션에 대화가 과도하게 누적되지 않도록 컨텍스트 총량을 제한할 수 있어야 한다"
    note: "**과거 턴 요약과 원본 재조회 참조를 병행**하는 방식으로 구현한다. 최근 N턴만 남기는 슬라이딩 윈도우 단독 방식은 REQ-002 를 만족하지 못한다"
  - id: REQ-004
    type: functional
    priority: must
    category: "오케스트레이션"
    actors: [ACT-001]
    title: "연속 도구 호출"
    detail: "한 턴 처리 중 LLM 은 agent 에게 도구 호출을 **연속적으로** 요청할 수 있다"
  - id: REQ-005
    type: functional
    priority: must
    category: "사용자 대기·재개"
    actors: [ACT-001]
    title: "처리 중 사용자 개입과 재개"
    detail: "턴 처리 중 사용자에게 추가 정보를 요구하거나 승인을 요청할 수 있고, 응답을 받아 처리를 재개할 수 있다"
  - id: REQ-006
    type: functional
    priority: must
    category: "진행 상태·표시"
    actors: [ACT-001]
    title: "처리 진행 상황 단계별 표시"
    detail: "질의 분석 중 · 조회 쿼리 작성 중 · 조회 중 등을 화면에 표시한다"
  - id: REQ-007
    type: functional
    priority: must
    category: "중단·재시도"
    actors: [ACT-001]
    title: "사용자 중단"
    detail: "처리 중 사용자가 중단할 수 있다. 중단 시 진행 중인 액션의 처리 방침을 정의해야 한다"
  - id: REQ-008
    type: functional
    priority: must
    category: "처리 중 입력"
    actors: [ACT-001]
    title: "처리 중 추가 입력의 의도 분류"
    detail: "처리 중 사용자가 새 입력을 넣으면 **그 의도를 먼저 분류**한 뒤 처리한다. 새 입력은 진행 중 턴을 바꾸는 **변경**일 수도, 무관한 **별개 질의**일 수도, 그만두라는 **중단**일 수도 있다"
    traces_to: [REQ-030, REQ-031, REQ-032, REQ-033]
  - id: REQ-009
    type: functional
    priority: must
    category: "요청·응답 계약"
    priority_reason: "portal과 agent가 나뉘거나 다중화되면 계약 없이는 같은 요청과 응답을 해석할 수 없으므로 RM-P1의 필수 기반이다"
    actors: [ACT-001]
    process_step: PRC-05-02
    title: "요청·응답 포맷 규약 확정"
    detail: "portal ↔ agent ↔ LLM 사이의 데이터 포맷 규약을 문서로 확정한다"
    note: "portal↔agent의 제품 API 계약과 agent↔LLM 공급자 프로토콜은 서로 다른 계약이다. 전자는 integration 작업흐름에서, 후자는 FEAT-304와 IF-003에서 각각 버전과 호환성을 관리한다"
  - id: REQ-010
    type: functional
    priority: must
    category: "흐름·추적성"
    actors: [ACT-001]
    title: "전체 흐름도 작성"
    detail: "연속 도구 호출 · 사용자 개입 · 중단 · 과거 턴 참조 · 신규 입력 끼어들기를 포함하는 흐름도를 작성한다"
  - id: REQ-011
    type: functional
    priority: must
    category: "응답·표현"
    actors: [ACT-001]
    title: "응답 형태 — 텍스트 · 그리드 · 차트 · 내보내기"
    detail: "텍스트, 데이터 그리드, 차트, 엑셀 다운로드, 차트 이미지 다운로드를 지원한다"
    hard_rule: "**엑셀·이미지 내보내기는 클라이언트 컴포넌트의 기능이고 서버는 파일을 생성하지 않는다**"
    traces_to: [NGOAL-10]
  - id: REQ-012
    type: functional
    priority: must
    category: "조회 결과 정보"
    actors: [ACT-001]
    title: "기준 시각 제공"
    detail: "처리 결과가 데이터 조회일 때는 기준 시각(DW 사용 시 동기화 시점)을 함께 제공한다"
    why: "사용자가 동기화 지연을 인지하지 못한 채 낡은 데이터로 판단하는 것을 막는다"
  - id: REQ-013
    type: functional
    priority: must
    category: "중단·재시도"
    actors: [ACT-001]
    title: "중단된 턴의 재시도"
    detail: "턴이 정상 응답 없이 **중단된 경우**(서버 장애·점유 만료·정상 종료·수동 중단·안전한 호출의 타임아웃 자동 재시도 소진) 사용자가 **재시도를 요구**할 수 있다. 중단된 턴은 재개 가능 상태로 기록하되, 수동 재시도는 **원 사용자 질의만 재사용해 첫 처리 단계부터 새 시도로 다시 시작**한다. 이전 시도의 지식 검색 결과·카탈로그 선택·생성 SQL·중간 응답·도구 결과 체크포인트는 실행 입력으로 재사용하지 않고 감사 이력으로만 남긴다"
    hard_rule: "사용자대기(WAITING_USER)와 브라우저 재접속은 중단 재시도가 아니다 — 전자는 원 대기 단계에서, 후자는 상태 표시만 이어간다. 대상 시스템 실행 API가 이미 전송됐거나 결과가 불명인 경우에는 수동 재시도 버튼을 열지 않는다. 등록된 결과 확인 방법이 있으면 먼저 처리 결과를 확인하며, 없거나 확인에 실패하면 대상 시스템 수동 확인 안내와 결과 불명 이력만 남긴다. 첫 단계부터 다시 계획하므로 이전 승인·체크포인트는 재사용하지 않으며 새 실행 승인이 필요하면 다시 받아야 한다. 재시도는 같은 턴의 시작 정책 스냅샷을 사용하고, 쿼터·동시 처리 한도는 새 시도를 접수할 때만 확인하며 모든 시도를 이력으로 남긴다"
    acceptance: "서버 장애 뒤 사용자가 재시도하면 같은 원 질의를 새로 입력하지 않고도 첫 처리 단계부터 새 시도가 시작되며 이전 검색·계획·SQL·결과가 실행 입력에 섞이지 않는다. 사용자대기와 브라우저 재접속은 원 대기·표시 상태를 유지하고, 실행 API 전송·결과 불명 이력이 있는 턴은 재실행되지 않는다"
  - id: REQ-014
    type: functional
    priority: should
    category: "중단·재시도"
    actors: [ACT-001]
    title: "중단 턴 재개 여부를 되묻지 않는다"
    detail: "중단 이후 **무관한 새 질의**를 한 경우, 중단된 턴의 재개 여부를 되묻는 것은 **프롬프트 규칙에 그렇게 명시된 경우에만** 수행한다. 명시가 없으면 묻지 않는다"
  - id: REQ-015
    type: functional
    priority: must
    category: "질의 해석·처리 경로"
    actors: [ACT-001]
    title: "질의 해석문"
    detail: "LLM 은 사용자 질의를 **명료하게 재정리한 해석문**을 만들고, 이를 지식 검색·SQL 생성·실행 API 탐색의 입력으로 사용한다. 결과에는 이 해석문을 함께 제시해 사용자가 자신의 의도와 대조할 수 있게 한다"
  - id: REQ-016
    type: functional
    priority: must
    category: "세션 독립·재연결"
    actors: [ACT-001]
    title: "화면 세션과 무관한 턴 처리"
    detail: "세션 창·브라우저를 닫거나 로그아웃해도 진행 중인 턴은 계속 처리되고 결과가 저장된다. agent 는 질의 접수 시점에 필요한 사용자·권한 정보를 **처리 문맥으로 복사해 보유**하며, 이후 처리 과정에서 화면 세션에 의존하지 않는다"
  - id: REQ-017
    type: functional
    priority: must
    category: "승인 대기·만료"
    actors: [ACT-001]
    title: "승인 거절 뒤의 추가 질문과 재승인"
    detail: "승인·거절 이외의 입력은 실행 승인이 아니다. 사용자가 승인 요청을 **거절한 뒤** 추가 질문을 하면 그 질문은 별도 턴으로 처리하며, 원 승인 건은 실행하지 않은 이력으로 남긴다. 사용자가 나중에 원 건을 다시 승인하려 하면 Hub는 후보를 요약해 '이 요청이 맞습니까?'로 먼저 확인한다. 원 승인 요청의 최초 만료 시각 안이고 액션·순서·파라미터가 변하지 않은 경우에만 같은 만료 시각을 가진 새 승인 카드를 제시한다. 하나라도 달라졌거나 만료됐으면 현재 상태를 다시 검토해 새 계획·새 승인으로 처리한다"
    hard_rule: "후보 확인과 최종 실행 승인을 구분한다. 최종 승인은 대상·순서·파라미터가 표시된 **승인 카드의 명시적 승인 조작**으로만 성립하며, 자연어 응답만으로 실행하지 않는다"
  - id: REQ-018
    type: functional
    priority: must
    category: "진행 상태·표시"
    actors: [ACT-001]
    title: "현재 상태와 경과 시간 표시"
    detail: "처리 중에는 현재 상태와 **경과 시간**을 화면에 표시한다"
  - id: REQ-019
    type: functional
    priority: must
    category: "세션 독립·재연결"
    actors: [ACT-001]
    title: "세션 재진입 시 역방향 페이징"
    detail: "세션을 다시 열면 마지막 턴만 표시하고, 이전 턴은 위로 스크롤할 때 일정 건수 단위로 추가 조회해 붙인다"
  - id: REQ-020
    type: functional
    priority: could
    category: "사용자 언어"
    actors: [ACT-001]
    title: "사용자 언어와 원어의 분리"
    detail: "지식 검색과 SQL 생성은 **등록된 원어 기준으로 수행**하고, 사용자에게 보이는 설명·안내만 사용자 언어로 제시한다. **조회된 데이터 값 자체는 번역하지 않는다**"
    roadmap: RM-P4
    note: "번역 과정에서 업무 용어가 왜곡되면 태그 매칭이 실패한다 — 지식 태그의 **동의어에 외국어 표현을 함께 등록**할 수 있어야 한다"
  - id: REQ-021
    type: functional
    priority: must
    category: "컨텍스트 구성"
    actors: [ACT-001]
    title: "컨텍스트 단계적 축소"
    detail: "여러 데이터소스에 도달 가능하면 주입할 카탈로그가 데이터소스 수만큼 늘어난다. **질의와 관련된 데이터소스를 먼저 선별하고 그 카탈로그만 주입**하며, 선별은 **업무 도메인 → 데이터소스 → 테이블 → 컬럼** 순의 단계적 축소로 수행한다"
    hard_rule: "주입이 확정된 지식·인증 예제 쿼리의 **참조 공개 인터페이스는 객체 선별 결과에 합류**시킨다 — 키워드 선별이 놓친 공개 객체를 링크가 결정적으로 메꾼다"
    traces_to: [REQ-003]
  - id: REQ-022
    type: functional
    priority: must
    category: "계획·교정"
    actors: [ACT-001]
    title: "조회 계획을 업무 용어로 제시하고 자연어로 교정받는다"
    detail: "조회에 대해서는 질의 해석문·대상 데이터 영역의 업무 명칭·적용 조건·기간·집계 단위를, **액션이 포함된 턴에서는 실행할 액션과 순서를 함께** 제시한다. **기본 필터가 해제된 경우 그 사실을 함께 표시한다**"
    hard_rule: "**테이블·컬럼의 물리명과 SQL 원문은 노출하지 않는다.** 사용자는 계획을 보고 **자연어로 교정**하며, 물리명이나 SQL 을 직접 편집하게 하지 않는다"
    traces_to: [REQ-015, REQ-104]
  - id: REQ-023
    type: functional
    priority: must
    category: "계획·교정"
    actors: [ACT-001]
    title: "조회 계획 확인을 모든 턴에 강제하지 않는다"
    detail: "강제 조건은 정책으로 관리하고, 기본값은 ① 대상 데이터 영역이 복수이거나 선별 확신이 낮을 때 ② 예상 결과 규모가 임계치를 넘을 때 ③ 액션이 포함된 턴"
    hard_rule: "**③에서 계획 확인과 실행 승인을 하나로 합치지 않는다** — 전자는 '무엇을 하려는지 맞나' 를, 후자는 '되돌릴 수 없는 것을 실행해도 되나' 를 묻는다"
    why: "매 조회마다 확인을 요구하면 대화가 느려지고 사용자가 확인을 습관적으로 넘긴다"
  - id: REQ-024
    type: functional
    priority: must
    category: "계획·교정"
    actors: [ACT-001]
    title: "성공한 턴의 결과 교정 재요청"
    detail: "처리는 정상 종료됐지만 결과가 의도와 다른 경우, 이전 턴의 해석문·조회 계획·생성 SQL 을 재작성의 입력으로 사용한다. 사용자가 같은 질의를 처음부터 다시 입력하게 하지 않는다"
    note: "REQ-013(중단 턴 재시도)과 **다른 경로**다"
  - id: REQ-025
    type: functional
    priority: must
    category: "확신·처리 불가"
    actors: [ACT-001]
    title: "확신이 없으면 추측하지 않는다"
    detail: "대상 데이터 영역을 특정할 수 없거나, 조건 해석이 갈리거나, 카탈로그·지식·예제 쿼리로 근거를 세울 수 없으면 임의로 골라 실행하지 않고 사용자에게 확인을 요구하거나 처리 불가로 응답한다. 처리 불가 응답에는 **무엇이 부족했는지**를 함께 제시한다"
    hard_rule: "**자율 처리 비율보다 처리한 것의 정확도를 우선한다**"
    traces_to: [SUC-02, SUC-03]
  - id: REQ-026
    type: functional
    priority: must
    category: "액션 승인·실행"
    actors: [ACT-001]
    title: "연속 실행 — 여러 액션이 한 요청에 걸릴 때"
    detail: "실행할 액션과 순서는 **사용자 요청에서 얻고 Hub 가 추론해 정하지 않는다.** 등록된 실행 액션은 모두 실행 전에 사용자에게 명시적 승인을 받는다. 예정된 액션 전체를 제시해 일괄 승인받되, 파라미터가 앞 액션의 결과에 의존하는 액션은 개별 승인한다"
    hard_rule: "승인은 **승인 당시의 액션 식별자·순서·파라미터 값**에만 유효하며, 셋 중 하나라도 달라지거나 일괄 승인 유효 시간이 지나면 다시 승인받는다. **실패하면 그 지점에서 중단하고 보고**하며, 남은 액션의 처리 여부를 근거 없이 판단하지 않는다. 부분 실행 후의 재요청은 이미 실행된 것을 제시하고 사용자가 정한다"
    config: "`sys-config.agent.approval.wait-timeout-minutes`는 **최초 승인 요청을 제시한 시각부터** 사용자의 응답을 기다리는 시간이며 양의 정수 분, 기본 10분이다. 추가 질문·거절 뒤 후보 확인·재승인 카드 제시는 이 시각을 연장하거나 새로 시작하지 않는다. `sys-config.agent.approval.execution-ttl-minutes`는 사용자가 승인한 뒤 대상 시스템 호출을 시작할 수 있는 시간이며 양의 정수 분, 기본 5분이다. 두 값은 시스템 설정 DB 오버라이드로 배포 없이 변경하며, 저장 직후 **다음 승인 요청** 또는 **다음 사용자 승인**부터 적용한다. 이미 발급한 승인 요청·이미 받은 승인의 만료 시각은 바꾸지 않고, 적용 설정값·버전을 승인 이력에 남긴다"
    roadmap: RM-P1
    traces_to: [REQ-025, REQ-105]

  - id: REQ-027
    type: functional
    priority: must
    category: "응답·표현"
    priority_reason: "RM-P1에서 모든 표현을 완성하지 않아도 새 의미 블록이 agent 통제를 바꾸지 않는 확장 경계는 첫 계약부터 있어야 한다"
    actors: [ACT-001]
    process_step: PRC-02-05
    title: "응답 표현 형식의 확장"
    detail: "portal 은 텍스트·그리드·차트·지도 등 표현 형식을 추가할 수 있어야 하며, 새 표현 형식 때문에 agent 의 질의 처리·권한·보안·쿼터·감사 흐름을 바꾸지 않아야 한다. agent가 검토 필요 자산을 하나 이상 사용하면 계약에 사용자 표시 경고 문구와 경고 여부를 함께 넣고 portal은 그 문구를 그대로 표시한다. 지식 식별자·리비전과 공개 객체명은 노출하지 않는다"
    hard_rule: "**agent 계약에 특정 시각화 라이브러리의 옵션을 넣지 않는다.** agent 는 버전이 있는 의미 블록과 데이터를 반환하고 portal 의 표현 어댑터가 도구별 설정으로 변환한다"
    note: "지도는 미래 portal 요구의 대표 사례다. @defer G3 — portal 작업흐름에서 실제 시각화 도구와 화면 동작을 정하되, 계약 확장점은 integration 작업흐름에서 먼저 잠근다"
    traces_to: [REQ-009, REQ-011]

# ── 처리 중 입력의 세 갈래 ──────────────────────────────────
  - id: REQ-030
    type: functional
    priority: must
    category: "처리 중 입력"
    actors: [ACT-001]
    title: "세 갈래 분기 — 변경 · 별개 · 중단"
    detail: "① **변경**(`AMEND`) — 조건·범위·기간·지표·표현·실행 의도를 바꾸거나 철회한다. **보강과 교정을 구분하지 않는다.** 변경 항목과 이미 수행한 단계의 의존성을 기준으로 무효화 시작 단계를 판정하고, 그 지점부터 다시 수행한다. 무효화할 단계가 없으면 같은 처리 흐름을 이어간다. ② **별개**(`NEW`) — 진행 중 턴은 그대로 두고 별도 턴으로 접수한다. ③ **중단**(`STOP`) — 중단으로 전이한다"
    why: "보강과 교정의 경계는 자연어만으로 안정적으로 가를 수 없다. **의미 꼬리표가 아니라 어떤 단계가 더 이상 유효하지 않은지가 실행을 결정한다.**"
    hard_rule: "명시적 `STOP`은 LLM 분류 없이 즉시 처리한다. `AMEND`는 진행 중 LLM 요청의 클라이언트 측 취소를 즉시 시도하되, 이미 보낸 프롬프트에 입력을 섞지 않고 현재 호출이 끝난 뒤 변경 입력 묶음으로 새 호출을 시작한다. 이전 체크포인트를 무효화하면 revision을 올리고, 무효화하지 않으면 같은 revision을 이어간다. 대상 시스템 실행 API를 전송한 뒤에는 현재 실행을 변경·중단하지 않고 결과 확인 상태를 사용자에게 알린다"
  - id: REQ-031
    type: functional
    priority: must
    category: "처리 중 입력"
    actors: [ACT-001]
    title: "변경 영향 판정은 LLM 분류 + 사용자 확인"
    detail: "자연어 입력을 규칙만으로 가르는 것은 신뢰할 수 없으므로, LLM은 `AMEND`·`NEW`·`STOP`의 분류와 함께 **변경 항목·추가/교체/철회 연산·무효화 시작 단계**를 구조화해 제안한다. 분류는 보조 판정 역할이며 관리자가 지정한 모델으로 고정한다. 명시적 `STOP`은 분류하지 않는다"
    hard_rule: "**판단이 갈리면 멈추는 쪽으로 기운다** — '멈춘다' 는 판정이 틀리면 다시 시도하면 되지만 **'계속한다' 는 판정이 틀리면 오류가 누적된다**. 확인 문구에는 **무엇을 버리게 되는지**를 함께 제시한다"
    open: "**분류 프롬프트를 프롬프트 규칙(FEAT-021)으로 관리할지가 미확정이다** — 프롬프트 규칙은 관리자가 운영 화면에서 바꾸는 *업무 지시* 인데 이것은 *시스템 분류기* 라 성격이 다르다. 운영 화면에 열면 분류가 조용히 나빠질 수 있고, 코드에 박으면 오분류를 고치려 배포해야 한다. @defer P3 agent 상세 설계에서 정한다"
    open2: "**한 턴당 분류 호출 횟수 상한이 미확정이다** — 처리 중 입력을 연타하면 쿼터가 소모된다. @defer P2 쿼터 설계에서 정한다(NFR-010~017)"
  - id: REQ-032
    type: functional
    priority: must
    category: "처리 중 입력"
    actors: [ACT-001]
    title: "확인은 병행형이 기본, 차단형은 되돌릴 수 없을 때만"
    detail: "**병행형**(기본) — 턴은 처리중을 유지한 채 분류 결과를 기본값으로 표시하고 되돌릴 수단을 제공한다. 아무 조치도 하지 않으면 분류대로 반영된다. **차단형** — 진행 중 턴이 `승인 대기` 이거나 액션을 이미 실행한 경우 `의도 확인 대기` 로 전이하고 사용자의 선택 없이는 진행하지 않는다"
    hard_rule: "**분류 호출이 실패하거나 판정이 서지 않으면 차단형으로 폴백한다**"
    why: "매 입력마다 차단형 확인을 요구하면 대화가 느려지고 사용자가 확인을 습관적으로 넘긴다. 병행형의 전제는 오분류가 복구 가능하다는 것인데, 액션이 걸린 턴에서는 그 전제가 성립하지 않는다"
    open: "**`의도 확인 대기`(WT-03) 의 만료 시간 기본값이 미확정이다** — 만료 시간은 대기 유형별로 관리하며(03-glossary/_index.yaml state_rules) 승인은 사람의 판단을 기다리므로 길고 의도 확인은 직전 입력에 대한 반응이므로 짧다는 것까지만 정해져 있다. **값은 실측이 필요하다**(ASM-002 의 measurement_first 와 같은 성격이다). @defer P2 응답성 측정이 서면 그 값으로 정한다"
  - id: REQ-033
    type: functional
    priority: must
    category: "처리 중 입력·다중 인스턴스"
    actors: [ACT-001]
    title: "중단·변경 입력은 영속 이벤트로 기록한다"
    detail: "요청은 **턴을 처리 중인 인스턴스가 아닌 다른 인스턴스로 도착할 수 있다.** 중단·변경 입력은 대상 턴·입력 순번·접수 시점·처리 상태를 가진 append-only 이벤트로 DB에 기록한다. 요청을 받은 인스턴스는 다른 인스턴스가 열어 둔 LLM 연결을 직접 끊지 않으며, 점유한 인스턴스가 미처리 이벤트를 순서대로 읽어 스스로 중단하거나 반영한다"
    hard_rule: "중단 시 진행 중이던 LLM 요청은 클라이언트 측에서 취소하되 **이미 발생한 토큰은 과금되므로 사용량으로 기록한다**"
  - id: REQ-034
    type: functional
    priority: must
    category: "중단·스트리밍"
    actors: [ACT-001]
    title: "agent ↔ LLM 은 스트리밍 수신"
    detail: "중단을 실효 있게 하려면 스트리밍이어야 한다. 응답 전체를 기다리는 방식에서는 취소 시점에 이미 생성이 끝나 있어 절감 효과가 없고 REQ-018 의 상태 표시 근거도 얻을 수 없다"
    note: "이 구간의 스트리밍은 portal ↔ agent 가 비동기 폴링인 것과 **무관하게 성립한다**"
  - id: REQ-035
    type: functional
    priority: must
    category: "처리 중 입력·전송 최소화"
    actors: [ACT-001]
    title: "의도 분류 입력의 최소화"
    detail: "**넣는다** — 진행 중 턴의 유효 의도 스냅샷 · 현재 단계 · 액션 전송 여부 · 직전 턴 해석문 1건 · 순서대로 묶은 미처리 입력 원문. **넣지 않는다** — 대화 이력 전체 · 스키마 카탈로그 · 지식·예제 쿼리 · **조회 결과 데이터**"
    why: "의도 분류는 '무엇을 조회할지' 를 판단하지 않는다. 조회 결과 데이터를 넣지 않는 것은 토큰 문제만이 아니라 전송 최소화 원칙(REQ-106)이다"
    traces_to: [REQ-003, REQ-106]
  - id: REQ-036
    type: functional
    priority: must
    category: "접수·대기열"
    actors: [ACT-001, ACT-004]
    process_step: PRC-02-01
    title: "개인별 동시 턴 제한과 영속 대기열"
    detail: "Hub는 사용자별로 실행 중이거나 대기 중인 턴의 합에 설정된 상한을 적용한다. 실행 여유가 있으면 접수된 턴을 즉시 시작하고, 전체 실행 여유가 없으면 요청·상태·순번을 DB에 기록한 FIFO(먼저 들어온 순서) 대기열에 넣어 portal에 대기 상태를 보인다. 사용자는 대기 중인 턴을 중단할 수 있으며, 중단된 턴은 대기열에서 제거한다. 실행 여유가 생기면 가장 먼저 접수된 유효 대기 턴을 다시 요청받지 않고 시작한다. 대기·실행·중단·완료 결과는 portal에서 나중에 조회할 수 있어야 한다"
    hard_rule: "대기 중인 턴도 개인별 동시 턴 상한에 포함한다. 그렇지 않으면 한 사용자가 무제한 대기 요청으로 전체 대기열을 점유할 수 있다. 대기열의 순번·상태 전이·중단은 원자적으로 기록해, 중단과 시작이 경합하면 하나만 성공하게 한다"
    why: "LLM·도구 실행은 일반 HTTP 요청보다 오래 걸릴 수 있다. 개인별 점유 상한으로 한 사용자의 독점을 막고, 전체 용량 부족 시에는 요청을 잃거나 다시 입력하게 하지 않고 공정하게 재개한다"
    roadmap: RM-P1
  - id: REQ-037
    type: functional
    priority: must
    category: "SQL 오류·재작성"
    actors: [ACT-001, ACT-004]
    process_step: PRC-02-02
    title: "SQL 오류의 재작성 분류와 런타임 상한"
    detail: "agent는 SQL 파싱·카탈로그 대조·DB/DW 실행의 실패를 각각 기록하고, DB/DW 실행 실패는 **데이터소스의 DBMS 종류·실행 단계·Spring 변환 예외·근본 SQLException의 SQLState와 공급사 오류 코드**를 함께 보존해 Hub 표준 유형으로 분류한다. 파싱 실패·카탈로그 대조 실패와, DB/DW가 공급사 오류 코드로 확인한 `SQL_SYNTAX`만 SQL 재작성 후보이며, LLM에는 원본 오류가 아닌 정제된 재작성 피드백만 전달한다"
    hard_rule: "DB/DW 실행 오류의 자동 재작성은 `SQL_SYNTAX`에 한정한다. 접근 거부·정책 거부·연결/인프라 장애·사용자/시스템 취소·알 수 없는 DB/DW 오류·쿼리 타임아웃·객체 부재·의미/타입 오류는 자동 재작성하지 않는다. `BadSqlGrammarException` 등 Spring의 넓은 예외 유형 하나만으로 재작성 가능 여부를 정하지 않는다. SQL 재작성 횟수는 최초 SQL 생성 뒤의 **추가 재작성**만 세며, 기본값은 3회다"
    config: "`sys-config.agent.sql-regeneration.max-attempts`는 정수 0~5, 기본 3으로 관리한다. 변경은 배포 없이 저장 직후 **다음 재작성 판정**부터 적용하며, 진행 중 SQL 실행을 끊지는 않는다. 현재 턴에서 이미 쓴 재작성 횟수·적용 설정값·설정 버전을 각 판정에 남긴다"
    why: "DBMS마다 오류 코드와 SQL 방언이 다르므로 공통 예외 유형만으로는 재작성해도 되는 오류를 안전하게 가릴 수 없다. 반대로 SQL 오류를 무제한 재작성하면 같은 실패·토큰 비용·처리 시간이 반복된다"
    traces_to: [REQ-103, REQ-115]
    roadmap: RM-P1

# ── 질의 유형 · 결과 데이터 처리 · 재연결 ───────────────────
  - id: REQ-038
    type: functional
    priority: must
    category: "질의 유형·처리 경로"
    actors: [ACT-001, ACT-002]
    process_step: PRC-02-01
    title: "사용자 질의 유형과 처리 경로의 명시"
    detail: "agent는 자연어 질의를 처리 계획으로 만들 때 **지식 검색·요약**, **SQL 또는 등록 조회 API 기반 데이터 조회**, **등록 API·커스텀 도구의 액션 실행**, **LLM 없이 하는 결정적 데이터 가공·표현**, **정책상 허용된 제한 데이터의 LLM 해석** 중 하나 이상으로 구분해야 한다. 복합 질의는 사용자 의도와 의존 순서에 따라 여러 유형의 단계를 하나의 계획에 함께 기록한다"
    hard_rule: "지식 검색 무결과는 곧 질의 실패가 아니다 — 허용된 스키마·API 카탈로그로 처리 가능성을 계속 판단한다. 모든 처리 경로가 부족하면 존재 은닉 규칙 아래 전사 공통 문구와 허용 범위의 대안만 응답하고, 해당 사용자가 접근 가능한 활성 지식 태그의 중복 제거·정렬 목록을 안내할 수 있다. 지식 전체 열거·본문 일괄 요약은 처리 경로가 아니며 서버가 차단한다(REQ-112·REQ-308)"
    stages:
      - { name: "접수·분류·대기열", reqs: [REQ-009, REQ-015, REQ-036, REQ-038] }
      - { name: "맥락·지식·카탈로그 구성", reqs: [REQ-001, REQ-002, REQ-003, REQ-021, REQ-303, REQ-305, REQ-306, REQ-308] }
      - { name: "데이터 조회·결정적 가공·표현", reqs: [REQ-011, REQ-012, REQ-022, REQ-023, REQ-037, REQ-039, REQ-103, REQ-104] }
      - { name: "제한 데이터 LLM 해석", reqs: [REQ-039, REQ-106, REQ-111, REQ-112] }
      - { name: "액션 승인·실행", reqs: [REQ-017, REQ-026, REQ-105, REQ-113, REQ-114] }
      - { name: "응답·감사·사후 교정", reqs: [REQ-024, REQ-027, REQ-107, REQ-108, REQ-110, REQ-115] }
    lifecycle:
      - { name: "사용자 보강·변경·중단", reqs: [REQ-005, REQ-007, REQ-008, REQ-030, REQ-031, REQ-032, REQ-033, REQ-034, REQ-035] }
      - { name: "브라우저 이탈·재접속·수동 재시도", reqs: [REQ-013, REQ-014, REQ-016, REQ-019, REQ-040] }
      - { name: "대기·점유 만료와 상태 정리", reqs: [REQ-017, REQ-107, REQ-109], references: [ARCH-070, NFR-013, NFR-014, NFR-020, NFR-022, NFR-023] }
    hard_rule: "유형 판정은 데이터 접근·외부 모델 전송·도구 호출을 허용하는 근거가 아니다. 지식 검색은 활성 반영 세트만, 데이터 조회는 현재 권한과 카탈로그·API 계약만, 액션은 REQ-026의 명시적 승인만, LLM 해석은 REQ-039의 전송 정책을 각각 통과한 뒤에만 수행한다. 저장된 조회 실행은 LLM·턴을 만들지 않는 별도 경로(REQ-201~207)로 유지한다"
    why: "SQL 생성과 API 선택만으로는 지식 안내·결과 가공·분석 요청의 처리 책임과 통제 경계가 보이지 않는다. 유형을 먼저 드러내야 어떤 데이터를 어디까지 LLM에 보낼지, 어느 단계에서 사용자 확인을 받을지를 검토할 수 있다"
    acceptance: "지식 사용법 문의, SQL 조회, 등록 조회 API 호출, 승인 필요 실행, 차트용 집계, 결과 해석이 각각 단독·복합으로 들어왔을 때 계획에는 해당 유형과 순서가 기록되고, 유형 판정만으로 권한 없는 데이터·미등록 도구·미승인 액션·미허용 모델 전송이 발생하지 않는다"
    source: "2026-09-21 사용자 요구사항 재점검 — 사용자 질의 유형을 한 문서에서 관리"
    roadmap: RM-P1
  - id: REQ-039
    type: functional
    priority: must
    category: "결과 가공·LLM 전송 경계"
    actors: [ACT-001, ACT-002, ACT-007]
    process_step: PRC-02-03
    title: "결과 데이터의 결정적 가공과 제한된 LLM 해석"
    detail: "SQL·조회 API의 결과는 기본적으로 모델에 다시 보내지 않고, DB 또는 agent의 **결정적 가공**(집계·정렬·필터·차트 계열 추출)을 거쳐 portal 표현 어댑터로 전달한다. 사용자가 결과의 해석·서술을 명시적으로 요구하고 현재 전송 정책이 허용한 경우에만, 서버는 원 결과가 아닌 목적에 필요한 최소 집계·선택 열·마스킹·행 수 상한을 적용한 제한 데이터로 LLM 해석 스텝을 만들 수 있다"
    hard_rule: "차트 요청이나 사용자 요청만으로 실제 업무 데이터의 모델 전송이 허용되지는 않는다. 허용목록 밖 테이블·컬럼·API 응답 경로, 원 결과 전체, 마스킹 전 값은 모델 입력에 넣지 않는다. 전송 대상의 값은 지시가 아니라 데이터로 취급하며(REQ-112), 적용 정책·가공 방법·전송본은 REQ-106·107에 따라 남긴다. 정책이 허용하지 않으면 모델 해석 없이 통제된 그리드·차트 또는 전송 불가 안내만 제공한다"
    open: "제한 데이터에 허용할 집계 함수·열 수·행 수·크기 상한과 고객사별 예외 승인 절차는 REQ-106의 전송 정책 상세로 P2에서 확정한다. 이 미확정은 원 결과 전송을 허용하는 공백이 아니다"
    why: "차트 자체는 모델에 원본 행을 보내지 않아도 만들 수 있다. 반면 예외적인 분석 요청은 원본 결과 재전송을 관행으로 열지 않고, 목적에 맞는 최소 데이터와 기존 전송·마스킹·감사 통제를 함께 적용해야 한다"
    acceptance: "차트 요청은 모델에 조회 결과를 전송하지 않고 결정적 집계와 portal 렌더링으로 처리되며, LLM 해석을 요구한 경우에도 허용된 열·경로만 마스킹·상한 적용 후 전송되고 실제 전송본과 적용 정책이 이력에 남는다. 미허용 열·경로 또는 원 결과 전체는 사용자 요청이 있어도 모델 입력에 포함되지 않는다"
    source: "2026-09-21 사용자 요구사항 재점검 — 업무 데이터의 기본 비전송과 예외적 데이터 가공 필요"
    traces_to: [REQ-011, REQ-106, REQ-107, REQ-111, REQ-112]
    roadmap: RM-P1
  - id: REQ-040
    type: functional
    priority: must
    category: "세션 독립·재연결"
    actors: [ACT-001]
    process_step: PRC-02-01
    title: "브라우저 재접속 시 진행 턴의 안전한 재연결"
    detail: "브라우저 종료·네트워크 단절·로그아웃 뒤 같은 사용자가 다시 인증해 portal에 들어오면, portal은 영속된 턴 상태를 조회해 자신의 진행 중·사용자대기·최근 종결 턴을 다시 표시해야 한다. 처리 중인 턴에는 현재 상태·경과 시간·이미 기록된 결과를 붙이고, 사용자대기 턴에는 아직 유효한 원 대기 카드만 복원한다"
    hard_rule: "재접속은 새 LLM 연결·도구 호출·승인·재시도를 만들지 않으며 브라우저 종료를 사용자 중단으로 해석하지 않는다. 대기나 점유가 만료되어 중단된 턴은 REQ-013의 재시도 조건으로만 이어가고, 이미 대상 시스템 실행을 전송했거나 결과가 불명인 턴은 재접속으로 다시 실행하지 않는다. 상태 조회는 현재 인증된 사용자의 소유 턴으로 한정한다"
    why: "턴은 화면 세션보다 길게 실행되고, 다중 인스턴스에서 처리 인스턴스와 재접속 요청 인스턴스가 다를 수 있다. 화면 연결을 복구하는 것과 턴을 다시 실행하는 것을 분리하지 않으면 중복 실행이나 승인 우회가 생긴다"
    acceptance: "처리 중 브라우저를 닫았다가 재접속해도 같은 턴 ID의 상태·결과가 표시되고 LLM·도구 호출 수는 증가하지 않는다. 유효한 사용자대기는 기존 대기 카드로만 응답할 수 있으며, 만료·중단·결과 불명 턴은 각각 재시도 가능 여부 또는 수동 확인 안내를 표시하고 자동 실행하지 않는다"
    source: "2026-09-21 사용자 요구사항 재점검 — 브라우저 종료 뒤 기존 턴 재개"
    traces_to: [REQ-013, REQ-016, REQ-017, REQ-019, REQ-033]
    roadmap: RM-P1
