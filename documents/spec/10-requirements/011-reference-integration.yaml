    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — FEAT-002·ARCH-030·REQ-103 · 2026-10-02 사용자 보완 요청: 데이터소스의 다중 DB 스키마와 카탈로그 객체 식별을 허용하고 별도 스키마 권한·중복 매핑은 두지 않는다 · 2026-10-02 사용자 명시 확정: REQ-603 전체 정리안 확정, 교차 DB 지원 여부·식별 계약은 P2에서 별도 결정"
    process_step: PRC-13-01
    title: "데이터소스 정의·배포 연결 참조 관리"
    detail: "업무 자산 관리자는 현재 로드된 yml 데이터소스 식별자를 선택해 Hub 데이터소스를 등록하고 업무 메타데이터를 관리할 수 있어야 한다. 카탈로그·화면·agent는 Hub 데이터소스의 내부 식별자를 참조한다. 데이터소스는 DB/DW 접속 단위이며 DB 스키마 하나의 관리·권한 단위가 아니다. 하나의 데이터소스에 여러 DB 스키마의 공개 객체를 등록할 수 있다"
    roadmap: RM-P1
    acceptance: "로드된 yml ID에서 데이터소스를 등록하면 별칭·파서·시각·그룹을 관리할 수 있고 비밀값은 보이지 않는다. yml ID가 사라지면 끊긴 연결을 표시하고 그 데이터소스의 조회를 차단한다. 데이터소스 등록이나 사용자 매핑에 단일 DB 스키마 선택을 요구하지 않으며, 같은 데이터소스의 서로 다른 DB 스키마에 있는 동명 객체를 REQ-301에 따라 구분한다. 별도 사용자/그룹-DB 스키마 매핑 없이 기존 객체 권한·행 스코프를 적용하고 데이터소스 이용 허용을 전체 객체 공개로 해석하지 않는다"
    summary: "배포 접속 정보와 Hub 관리 메타데이터를 분리하고 연결 이상을 사용 전에 드러낸다. 다중 DB 스키마의 객체 식별과 사용자 접근 권한은 별개로 관리한다"
    intent:
      problem: "접속 설정과 업무용 데이터소스 명칭을 섞으면 설정 변경으로 참조가 깨지거나 비밀정보가 화면으로 노출된다"
      goal: "배포 접속 정보와 Hub 관리 메타데이터를 분리하고 연결 이상을 사용 전에 드러낸다"
      not: ["DB 접속 URL·계정·비밀번호·커넥션 풀의 화면 편집이 아니다","대상 시스템과 데이터소스를 1:1로 매핑하는 요구가 아니다","DB 스키마별 데이터소스 분리나 별도 사용자/그룹-DB 스키마 권한 관리를 요구하지 않는다"]
    goal_trace: ["IN-06"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
      - {"item":"연결 참조: Hub 내부 식별자·현재 로드된 yml 데이터소스 ID","origin":"Hub 발급·배포 설정 선택","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"업무 표시: 유일한 수정 가능 별칭·설명","origin":"관리자 입력","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"질의 기술 기준: DBMS 종류·사용 SQL 파서(DBMS 기본값과 별도 지정)","origin":"관리자 입력·지원 파서 목록","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"시각·범위: 운영 DB/DW 유형·시각 체계·데이터 기준 시각 정보·적용 가능 사용자 그룹","origin":"관리자 입력","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
    field_usage:
      - {"attribute_group":"연결 참조","used_for":"접속 구성과 업무 메타데이터를 연결한다"}
      - {"attribute_group":"업무 표시","used_for":"관리 화면과 LLM 컨텍스트에서 데이터소스를 구분한다"}
      - {"attribute_group":"질의 기술 기준","used_for":"SQL 해석·검증에 사용하며 파서 미지원이면 실행하지 않는다"}
      - {"attribute_group":"시각·범위","used_for":"조회 대상 선별·결과 기준 시각 표시·하위 그룹 매핑 어휘 제약에 사용한다"}
    consumers:
      - {"where":"카탈로그 관리","when":"공개 객체 등록 시","how":"데이터소스·DB 스키마·객체명으로 대상을 식별한다"}
      - {"where":"agent SQL 처리","when":"조회 계획·검증·실행 시","how":"데이터소스별 파서·연결·시각 정보를 사용한다"}
      - {"where":"admin 관리","when":"화면 진입·연결 점검 시","how":"미등록 yml ID/정상/끊긴 연결을 구분한다"}
    business_rules:
      - "접속 URL·계정·암호화된 비밀 설정값·풀 설정의 연결 정의는 배포 yml이 정본이며 관리 화면에서 관리하거나 표시하지 않는다(ARCH-030). 암호화 yml·공통 복호화 연동·외부 마스터 키 관리·비노출은 REQ-403이 정본이다"
      - "현재 로드된 설정 ID 목록을 읽으며, 설정 파일 변경에 의한 연결 재구성은 재시작이 필요하다. 화면 조회를 동적 풀 생성으로 해석하지 않는다"
      - "yml ID가 바뀌면 관리자가 동일한 연결 대상임을 확인한 뒤 내부 레코드의 yml 참조를 명시적으로 정정한다. 자동 추정·대체하지 않으며 정정 또는 설정 복구 전에는 끊긴 연결이다. 카탈로그의 내부 참조 식별자를 일괄 변경하지 않는다"
      - "끊긴 연결 또는 미지원 파서는 관련 조회를 차단하고 원인을 알린다. 적용 가능 그룹은 매핑 어휘이며 런타임 권한의 별도 추가 게이트가 아니다"
      - "단일 SQL은 한 데이터소스에서 실행한다. 대상 시스템 귀속을 데이터소스나 테이블에 추가하지 않는다(ARCH-030)"
      - "데이터소스 등록에 DB 스키마 하나를 필수 매핑하지 않고 스키마별로 연결 레코드를 분리하도록 강제하지 않는다. 접속 계정이 읽을 수 있는 여러 DB 스키마 중 공개 대상으로 선정한 객체를 같은 데이터소스에 등록할 수 있다. 객체의 DB 스키마명·물리 식별 규칙은 REQ-301이 정본이다"
      - "사용자의 데이터소스 이용 가능 여부와 대상별 신원은 REQ-609, 테이블·컬럼 접근과 행 스코프는 REQ-103·REQ-611을 따른다. 사용자 또는 그룹에 DB 스키마를 별도 권한 대상으로 매핑하지 않는다. 데이터소스에 접근할 수 있어도 미등록 또는 미허용 객체에는 접근할 수 없다"
      - "DB 접속 계정의 실제 스키마·객체 조회 권한은 고객사 DB/배포 설정 책임이며 Hub 사용자별 권한을 대신하지 않는다. yml의 스키마 지정은 필수 연결 매핑으로 강제하지 않으며, DB의 기본 스키마·검색 경로 설정이 있더라도 이름 해석 환경일 뿐 Hub의 공개 범위나 사용자 권한이 아니다"
      - "인증 예제와 지식의 데이터소스·DB 스키마 식별은 REQ-302·REQ-303의 실행 대상 및 카탈로그 참조를 사용한다. 같은 정보를 자산별 별도 스키마 목록이나 권한 매핑으로 중복 관리하지 않는다"
      - "단일 연결로 다른 DB/서버를 참조할 수 있다는 사실만으로 Hub 지원 범위가 확대되지 않는다. 참조의 전체 물리 식별 정보를 검증할 수 없으면 접두어를 버려 같은 이름의 등록 객체로 대체하지 않고 실행을 차단한다. 교차 DB 지원 여부·식별 계약은 이 카드의 open에서 별도로 결정한다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "재시작 후 'legacy_ro'가 설정에서 사라지면 다른 연결로 자동 대체하지 않고 끊긴 연결로 처리한다"
    lifecycle:
      - {"state":"정상","next":["끊긴 연결"],"note":"현재 로드된 설정에 참조 ID가 존재한다"}
      - {"state":"끊긴 연결","next":["정상"],"note":"설정 복구 또는 적합한 연결 참조 정정 뒤 재점검한다. 미등록 yml ID는 등록 전 후보다"}
    permissions:
      - "ACT-003의 해당 메뉴·조회/등록/수정/상태변경 액션 권한으로 관리한다. 화면 노출과 별개로 서버에서 검증한다"
      - "권한 밖 개인정보·비밀값·업무 데이터를 기준정보의 사용처 조회로 우회 열람하지 못한다"
    audit: "기존 정책·승인·월별 확정 이력은 관련 요구사항을 따른다. 신규 관리 속성의 변경 근거는 REQ-601 공통안으로 확인하며 이력 없이 기존 근거를 덮어쓰지 않는다"
    volume: "고객사별 관리 항목 수·변경 빈도는 미확인이다. 기존 NFR을 임의 수치로 바꾸지 않는다"
    config:
      - "관리할 속성·원천·사용처는 이 카드의 data·field_usage·consumers를 따른다. 코드/배포 설정·관리 데이터·읽기 전용 참조를 혼합하지 않는다"
    risk: "참조 변경·사용 중지·적용 시점이 후속 실행과 이력을 깨뜨리지 않는지 설계·시험에서 검증한다"
    relations:
      depends_on: ["REQ-601", "REQ-403"]
      constrains: ["REQ-301", "REQ-302", "REQ-303", "REQ-609"]
      conflicts_with: []
      nfr: []
      interfaces: []
    realization:
      features: ["FEAT-002"]
      screens: ["SCR-002"]
    examples:
      - {"kind":"정상","case":"yml 'legacy_ro'를 내부 DS-1과 연결하고 별칭을 바꿔도 기존 카탈로그의 DS-1 참조는 유지된다"}
      - { kind: 정상, case: "DS-1에 sales.orders와 archive.orders를 각각 등록한다. 데이터소스 등록과 사용자 DS-1 매핑에는 별도의 스키마 선택을 요구하지 않는다" }
      - { kind: 예외, case: "사용자의 DS-1 매핑이 활성이고 sales.orders 접근은 허용돼도 archive.orders 접근 그룹을 통과하지 못하면 후자는 주입·조회하지 않는다. sales 스키마에 생긴 미등록 테이블도 자동 공개하지 않는다" }
      - { kind: 예외, case: "other_db.sales.orders를 DS-1의 sales.orders와 같은 객체로 간주하지 않는다. 다른 DB를 포함한 물리 식별·지원 범위가 검증되지 않으면 조회를 실행하지 않는다" }
      - {"kind":"예외","case":"재시작 후 'legacy_ro'가 설정에서 사라지면 다른 연결로 자동 대체하지 않고 끊긴 연결로 처리한다"}
    volatility: {"level":"high","what":"고객사마다 기준 값·대상·규모가 다르므로 운영 데이터로 관리한다. 관리 원천과 승인·보안 경계는 고객사 값과 구분한다"}
    open:
      - "@defer P2 — 데이터소스별 접속 대상 DB/카탈로그 경계를 정한다. 초기에는 접속 대상 DB 안의 다중 스키마만 허용하는 안을 권장하며, MSSQL 등의 동일 연결 내 다른 DB 참조를 허용할지는 별도 결정한다. 허용 시 DB명을 포함한 물리 식별·카탈로그·SQL 검증 계약을 함께 설계하고 기존 식별에서 DB명만 생략하지 않는다"
    maturity: { level: confirmed, at: "2026-10-02", by: "AI 확정 기록", confirmed_by: "사용자 — 한 건씩 검토한 REQ-603 전체 정리안을 명시 확정. 교차 DB 지원 여부·식별 계약은 P2 확인 항목으로 유지" }

  - id: REQ-604
    type: functional
    priority: must
    workstream: admin
    actors: ["ACT-003","ACT-002"]
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — FEAT-001·REQ-105·ARCH-030·ARCH-050 · 2026-10-02 사용자 보완 요청: API 주소·인증·공통 헤더는 배포 연결 설정에서 관리하고 대상 시스템·API는 연결 참조로 매핑한다 · 2026-10-06 사용자 설명 개선 요청: 배포 연결 구성 정의 → 시스템의 허용 연결 목록·기본값 지정 → API별 연결 선택 순서를 명시한다 · 같은 날 사용자 정정: 사용자 그룹은 데이터소스와 개별 API에 매핑하며 대상 시스템에는 그룹 매핑을 두지 않는다. 사용자 용어 개선 요청에 따라 API별 제공 시스템 지정으로 쉽게 설명한다. 2026-10-06 사용자 명시 요청으로 카드 전체를 확정했다"
    process_step: PRC-13-01
    title: "대상 시스템 정의와 API별 제공 시스템 지정"
    detail: "관리자는 업무 API를 제공하는 대상 시스템의 명칭·설명·사용 상태와 관련 API·신원 매핑 현황을 관리할 수 있어야 한다. 배포 담당자가 주소·인증 방식·공통 고정 헤더를 한 묶음의 API 연결 설정으로 정의하면, 관리자는 대상 시스템에서 사용할 연결 식별자 목록을 매핑하고 그중 기본 연결을 지정한다. 개별 API에서 이 API를 제공하는 대상 시스템과 사용할 연결을 선택하는 절차는 REQ-608을 따른다"
    roadmap: RM-P1
    acceptance: "대상 시스템별 API·신원 매핑·허용 연결 목록·기본 연결을 조회할 수 있다. 같은 도메인이라도 인증·공통 고정 헤더 구성이 다른 연결을 한 시스템의 허용 목록에 함께 매핑할 수 있다. 기본 연결은 그 목록에서 지정하며 목록 밖 연결을 기본 연결이나 해당 시스템이 제공하는 API의 연결로 지정하면 거부된다. 대상 시스템에는 사용자 그룹을 매핑하지 않으며 API 호출 허용 그룹의 판정은 REQ-105·REQ-611을 따른다. 유효 연결이 없거나 해석되지 않으면 호출을 차단하고 비밀을 표시하지 않는다. 데이터소스는 독립적으로 유지된다"
    summary: "업무 API를 제공하는 시스템을 구분하고, 배포 설정에 있는 연결 중 이 시스템에서 사용할 목록과 기본값을 지정한다"
    intent:
      problem: "업무 API를 제공하는 시스템과 사용할 연결을 명확히 관리하지 않으면 API 계약·접속 구성·신원 매핑을 잘못 연결한다"
      goal: "업무 API를 제공하는 시스템과 그 시스템의 관리·연동 기준을 식별한다"
      not: ["데이터소스·카탈로그를 대상 시스템 아래에 강제 귀속시키지 않는다","고객사 업무 시스템의 기준정보와 계정을 Hub가 대신 관리하지 않는다","시스템과 도메인 주소를 반드시 일대일로 묶거나 화면에서 실제 인증정보·공통 접속 헤더 값을 편집하지 않는다"]
    goal_trace: ["IN-06"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
