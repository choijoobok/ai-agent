# 영역: 기준정보 공통·모델·연동·그룹
requirements:
  - id: REQ-601
    type: functional
    priority: must
    workstream: admin
    actors: ["ACT-002","ACT-003","ACT-004"]
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — 기존 기준정보 관리 기능 전반과 사용자 요청; 2026-10-01 정련 질문 사용자 결정 반영 · 2026-10-08 사용자 결정: 구축/운영 공통 관리 승인 설정과 저장자 전결 처리(ADR-023)"
    process_step: PRC-13-01
    title: "기준정보 관리 범위·공통 속성·참조 보호"
    detail: "관리자는 Hub가 반복 참조하는 정의·매핑·운영 기준을 항목별로 조회·등록·변경하고, 사용처와 변경 영향을 확인할 수 있어야 한다. 각 상세 항목은 REQ-602~616에 둔다. 이 묶음은 모든 기준정보를 한 화면이나 범용 코드 테이블에 저장하라는 요구가 아니다"
    roadmap: RM-P1
    acceptance: "참조·이력을 조회할 수 있는 항목은 삭제와 비활성화 모두 대상별 검증을 거친다. 유효 참조·기존 개별 정책을 깨뜨리는 변경은 차단하고 그 외 항목은 삭제할 수 있다. 변경 직전 최종 데이터를 별도 이력 테이블에 스냅샷으로 저장하고 변경 데이터는 현재 테이블에 저장한다. 이력 저장 실패 시 현재 값도 바뀌지 않는다. approval_policy의 승인 대상은 승인 절차 사용 시 승인 전 유효값이 바뀌지 않고, 미사용 시 같은 저장자의 전결 승인과 전체 후보 스냅샷·검증 근거를 남긴 뒤 반영한다. 전결에서도 월 적용·일괄 반영·현재 권한 검증은 유지하며 설정 변경으로 기존 대기 요청을 자동 승인하지 않는다"
    summary: "대상별 속성·사용처·관리 권한·적용 경계를 명시하고 참조를 깨뜨리는 변경을 막는다"
    intent:
      problem: "관리 기능이 분산되어 관리 원천·식별자·사용처·변경 영향이 불명확하다"
      goal: "대상별 속성·사용처·관리 권한·적용 경계를 명시하고 참조를 깨뜨리는 변경을 막는다"
      not: ["고객·상품·창고 같은 레거시 업무 기준정보를 Hub에 복제하는 통합 마스터 관리가 아니다","지식·인증 예제·스키마 카탈로그의 기존 정본이나 system 구현을 새로 만드는 요구가 아니다"]
    goal_trace: ["IN-06"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "기존 요구사항·정책·자산 변경 절차와 system의 구현된 관리 기능을 우선 참조한다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
      - {"item":"공통 식별: 변하지 않는 내부 식별자, 표시명, 설명, 해당 대상의 업무 키","origin":"관리자 입력·Hub 발급","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"사용 상태와 적용 기준: 신규 선택 가능 여부, 적용 시점 또는 적용 월, 대상별 상태","origin":"대상별 기존 규칙 및 신규 초안","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"관리 근거: 소유 관리 영역, 변경자·시각·사유, 변경 전후 값 또는 리비전 참조","origin":"Hub 변경 이력","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"참조 현황: 참조하는 기준정보·매핑·업무 자산과 설정, 해당 대상의 과거 사용 기록 연결","origin":"Hub 참조 조회","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
    field_usage:
      - {"attribute_group":"공통 식별","used_for":"이름 변경과 관계없이 참조·이력을 연결한다"}
      - {"attribute_group":"사용 상태와 적용 기준","used_for":"현재 사용할 값과 과거 기록을 구분한다. 모든 대상에 동일 상태 기계를 강제하지 않는다"}
      - {"attribute_group":"관리 근거","used_for":"어떤 관리값이 왜 변경됐는지 추적한다"}
      - {"attribute_group":"참조 현황","used_for":"삭제·사용 중지·연결 변경 전에 영향을 확인한다"}
    consumers:
      - {"where":"admin 기준정보 관리","when":"등록·변경·삭제 검토 시","how":"항목별 상세 정의와 기존 승인·월 적용·배포 경계를 사용한다"}
      - {"where":"agent·portal","when":"선택지 제공·컨텍스트 구성·실행·권한 판정 시","how":"해당 목적의 유효 기준만 참조한다. 화면 선택 제한만으로 서버 판정을 대체하지 않는다"}
    business_rules:
      - "2026-10-01 사용자 결정(ADR-017): 그룹·쿼터 등급·태그 등 기준정보의 특성에 따라 참조·이력을 명확히 조회할 수 있으면 삭제·비활성화 전에 유효성을 검증한다. 참조나 이력이 있다는 이유만으로 모든 항목을 일괄 삭제 금지하지 않으며 기존 항목별 규칙상 제약이 없으면 삭제할 수 있다. 참조 조회 실패는 참조 없음이 아니다"
      - "변경 전 최종 데이터를 별도 이력 테이블에 스냅샷으로 기록하고 변경 데이터를 현재 데이터로 저장한다. 대상 식별·변경 순서·처리자·시각·사유·작업 종류를 연결한다. 스냅샷 저장과 현재 데이터 갱신은 같은 트랜잭션으로 처리하며 동시 변경은 같은 이전 버전을 중복 덮어쓰지 않게 검증한다"
      - "신규 등록은 현재 데이터로 시작한다. 수정·비활성화와 허용된 삭제는 변경 직전 상태를 이력에 남긴다. 이력에도 기존 비밀값·개인정보 저장 통제를 적용한다. 실행 감사의 별도 기록(REQ-108)과 기준정보 변경 전 스냅샷의 원자성을 구별한다"
      - "지식·인증 예제·스키마 카탈로그와 자산 접근 그룹은 REQ-301~308·REQ-103의 변경 세트, 태그는 REQ-607, 도구 등록 정보는 REQ-612를 따른다. 승인 절차 사용/미사용과 전결의 공통 경계는 approval_policy를 따른다. 후보·유효본과 전체 스냅샷을 유지하며 기준정보라는 이름으로 운영본을 직접 덮어쓰지 않는다"
      - "Hub 사용자 그룹과 사용자 소속·직접 관리 보안 정책은 REQ-103, 쿼터의 월 적용은 REQ-116~119, 업무 API 계약의 고객사 공동 오픈은 REQ-608·PRC-11을 따른다. 승인 대상 업무의 경로만 공통 설정으로 선택하며 기존 직접 관리 항목에 일괄 승인 절차를 추가하지 않는다"
      - "관리자 계정·메뉴·역할·공통코드·메시지·시스템 설정·배치 정의는 REQ-501~508을 참조하며 admin에 중복 등록하지 않는다. Portal 이용자는 REQ-616의 별도 관리 메뉴를 두고 조직 정보는 인증·인사 원천을 구분한다. 컬럼 의미 유형·값 도메인·조인 정보는 REQ-301, 지식 태그·동의어는 REQ-303을 따른다"
      - "월별 배정·실제 사용량·품질 신고·오류·조사·평가 실행 결과·개인 저장 조회는 처리 기록 또는 사용자 자산이다. 기준정보와 연결하되 기준정보 목록으로 혼합하지 않는다"
      - "신규 공통안: 내부 식별자를 재사용하지 않고 표시명 변경으로 참조가 바뀌지 않게 한다. 삭제·연결 변경으로 유효 참조를 고아로 만들지 않으며, 제거가 막히면 사용처를 권한 범위 안에서 안내한다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "사용 중인 데이터소스를 삭제하려 하면 관련 카탈로그가 있다는 사실과 조치 대상을 안내하고 삭제하지 않는다"
    approval_policy:
      setting: "업무별 독립 불리언 설정 '관리 승인 절차 사용'. REQ-614의 운영 설정에서 항목별 현재 값·변경자·시각·사유를 관리한다. 구축 기간에는 필요한 항목을 false, 고객사 통합 검수 후 운영 오픈 전에는 운영 승인 대상 항목을 true로 전환한다. 각 항목의 기본값과 설정을 읽을 수 없는 경우는 true이며 고객사별 구축 종료·오픈 날짜를 자동 추정하지 않는다"
      scope: "targets의 각 업무에서 이미 정한 Hub 내부 관리 승인에 적용한다. 자산의 접근 그룹·참조 매핑은 소유 자산의 설정을 따르며 사용자 소속 그룹 추가/신원 부여 설정과 구분한다. 지식 내부 태그 ID·API 링크 변경은 지식 설정을, 태그 정의·API 계약 자체 변경은 해당 설정을 따른다. API·도구 등록/수정·허용 그룹·노출·비활성화·삭제도 각 업무의 승인 대상이다"
      required: "true: 대상별 기존 요청·검토·책임자 승인 또는 반려 절차를 수행한다. 지식·예제·카탈로그·태그·API·도구는 REQ-305·306의 기술 검토 후 최종 승인·일괄 반영 절차를 사용하며 승인 전 후보는 유효값이나 노출 목록에 포함하지 않는다"
      delegated: "false: 반영 가능한 등록·변경의 저장자가 전결 권한으로 즉시 승인한 처리로 기록한다. 별도 요청 제출·사람의 검토/승인 대기를 요구하지 않고 같은 처리 안에서 후보 스냅샷과 전결 승인·반영 이력을 만든다. 초안 저장이나 검증 실패를 승인으로 간주하지 않으며 실제로 하지 않은 사람의 기술 검토·책임자 승인을 수행했다고 기록하지 않는다"
      permissions: "모든 실제 변경 대상의 등록·변경/요청 액션에 현재 유효 권한이 있는 저장자가 미사용 설정 아래에서 그 저장 건을 전결할 수 있다. 다른 사용자의 기존 대기 건 승인 권한을 주지 않는다. 사용 설정에서는 각 검토·승인 액션 권한을 따르며 동일인 겸임의 기존 규칙을 유지한다. 설정 변경은 별도 운영 설정 변경 액션 권한으로 제한하고 새 승인 대상으로 만들지 않는다"
      evidence: "변경 전 유효본·전체 후보/요청 스냅샷(신규는 이전 상태 없음)·안정 식별자/기준 버전·작업 종류·저장자/요청자·실제 승인자·처리 시각·사유·검증 결과·승인 방식(책임자 승인/설정에 따른 전결)·변경 대상 종류별 적용 설정 값과 버전·실제 반영 결과를 연결한다. 전결의 요청 근거도 같은 저장에서 생성하며 과거 이력을 덮어쓰지 않는다"
      activation: "후보/처리 이력 생성·전결 승인·유효값 반영 또는 적용 예약은 함께 성공하거나 함께 실패한다. 승인과 실제 활성화를 구분하며 쿼터 승급 적용 월·추가 토큰 월말 만료·세트 일괄 반영 등 대상별 효력 시점을 바꾸지 않는다. 이력이나 검증에 실패하면 유효값과 권한은 바뀌지 않는다"
      transition: "서버는 반영 저장/새 요청 접수의 같은 처리에서 변경 대상 종류별 현재 설정 값과 버전을 확인·기록한다. 설정 전환과 저장이 경합해도 한 처리에 두 방식을 섞지 않는다. 이미 접수된 요청의 방식·상태는 유지하며 true→false로 바꿔도 대기 요청을 자동 승인하거나 동일 대상의 중복 요청/기준 버전 검증을 우회하지 않는다. 운영 오픈 전 대기 건은 기존 승인·반려/취소 절차로 정리하고 운영 승인 대상 항목의 사용 설정을 확인한다"
      boundaries: "양쪽 방식에서 필수 입력·참조/계약·기준 버전·현재 권한·민감정보·일괄 반영 검증을 유지한다. 고객사 외부 API 공동 오픈·커스텀 코드 요건 검수/코드 리뷰/배포 통제·운영 오픈 통합 검수는 이 설정으로 면제하지 않는다. 실제 업무 상태 변경 실행의 요청 사용자 명시 확인(REQ-026·105), 직접 관리 정책과 사용자 권한 제거의 기존 절차도 그대로 유지한다"
      targets:
        - {"item":"지식 관리","reqs":["REQ-303","REQ-305","REQ-308"]}
        - {"item":"인증 예제 관리","reqs":["REQ-205","REQ-302"]}
        - {"item":"스키마 카탈로그 관리","reqs":["REQ-301","REQ-304"]}
        - {"item":"공통 검색 태그 관리","reqs":["REQ-607"]}
        - {"item":"업무 API 관리","reqs":["REQ-608"]}
        - {"item":"도구 관리","reqs":["REQ-612"]}
        - {"item":"사용자 접근 권한 부여","reqs":["REQ-609","REQ-616"]}
        - {"item":"쿼터 등급 승급","reqs":["REQ-117"]}
        - {"item":"추가 토큰 사용","reqs":["REQ-119"]}
