    examples:
      - {"kind":"정상","case":"예시로 같은 기본 주소 https://order.example.com에 ORDER-PUBLIC(인증 없음)·ORDER-AUTH(토큰 인증과 공통 고정 헤더) 두 연결을 배포 설정에 정의한다. 주문 시스템 SYS-ORDER의 허용 연결 목록에 두 식별자를 매핑하고 기본 연결은 ORDER-PUBLIC으로 지정한다. 공개 주문 조회 API는 시스템 기본 연결 사용, 주문 저장 API는 ORDER-AUTH를 선택한다. 조회/저장에 따른 인증을 자동 추정하는 규칙은 아니다"}
      - {"kind":"정상","case":"같은 주문 시스템이 제공하는 주문 조회 API의 호출 허용 그룹은 G-VIEW, 주문 저장 API의 호출 허용 그룹은 G-WRITE로 각각 매핑한다. 대상 시스템에 그룹 목록을 만들지 않으며 G-VIEW 소속만으로 주문 저장 API의 호출 권한을 얻지 않는다. 호출 권한·신원 매핑의 나머지 조건은 REQ-105·REQ-609·REQ-611을 따른다"}
