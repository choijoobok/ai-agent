      mixed: "반영 세트의 실제 변경 대상 종류별 설정을 함께 판정한다. 하나라도 true이면 세트 전체를 요청·기술 검토·책임자 승인 후 일괄 반영하고 모든 변경 대상이 false인 경우에만 세트 저장자가 전결한다. 참조/영향 조회만 하는 자산의 설정은 판정 대상이 아니다. 설정이 다른 구성원을 부분 전결·부분 활성화하지 않는다"
    request_integrity:
      scope: "approval_policy.targets의 모든 관리 변경 요청·승인과 이후 추가하는 같은 유형의 승인 업무에 적용한다. 자산 변경, 사용자 신원/그룹 부여, 쿼터 승급·추가 토큰 신청을 포함하며 업무마다 원칙을 복제하지 않는다. 원래 승인 대상이 아닌 직접 관리 업무를 새 승인 대상으로 만들지 않으며 실제 업무 실행의 사용자 승인 계약은 REQ-026·105를 따른다"
      target_identity: [{"kind":"지식·예제·카탈로그·태그·업무 API·도구","key":"변경 대상 종류 + 안정 ID. 내용·접근 그룹·참조 매핑은 소유 자산 하나로 판정한다. 신규 대상도 관리 식별자가 같으면 새 후보 ID만으로 중복 제한을 피할 수 없다"},{"kind":"사용자 신원 매핑","key":"Portal 이용자 + 대상 종류(데이터소스/대상 시스템) + 대상 식별자. 바꾸려는 사용자 ID 값이나 요청 버전은 별도 대상으로 세지 않는다"},{"kind":"사용자 그룹 부여","key":"Portal 이용자 + 그룹 식별자. 다른 대상 신원·다른 그룹의 독립 요청은 묶어서 막지 않는다"},{"kind":"쿼터 등급 승급","key":"Portal 이용자. REQ-117의 월을 넘겨 유지되는 사용자당 처리 대기 1건을 따른다"},{"kind":"추가 토큰 사용","key":"Portal 이용자 + 신청 적용 월. 같은 달 미종결 신청은 1건이며 앞 신청의 종결 후 필요하면 별도 신규 신청할 수 있다"}]
      single_pending: "같은 변경 대상에는 접수된 미종결 요청을 최대 1건만 허용한다. 검토 대기/중·최종 승인 대기·승인 또는 전결 후 반영 미완료/반영 실패 복구 중을 포함한다. 요청자·탭·후보·반영 세트를 달리하거나 동시에 접수해도 서버에서 한 건만 접수하며 충돌은 조회 권한 범위 안에서 기존 요청을 안내한다. 초안 작성만으로 대상 전체를 선점하지 않는다"
      immutable_submission: "접수한 요청의 대상·작업 종류·변경 내용·요청 사유·기준 버전·참조 스냅샷을 고정한다. 요청자·검토자·승인자도 대기 중 이를 편집·교체하지 않는다. 검토 의견·승인/반려 사유·실제 승인량 등 단계별 처리 결과는 별도 이력으로 추가하며 제출 원문을 덮어쓰지 않는다"
      change_and_resubmit: "제출 후 내용을 바꾸려면 현재 유효 요청/변경 권한을 확인해 기존 요청을 취소하거나 반려 등 미반영 종결을 확인한 뒤 새 요청을 제출한다. 기존 요청·단계별 근거와 연결을 보존하고 새 요청 ID·스냅샷으로 필요한 검토·승인을 다시 받는다. 이전 요청의 승인·검토 완료 상태를 새 요청에 승계하지 않는다"
      decision_binding: "승인·반려·취소는 요청 ID·버전·허용 선행 상태·현재 처리 권한과 기준 유효본을 함께 확인한다. 취소·반려·만료·제거로 무효화된 건과 변경 전 요청에 대한 늦은 승인으로 권한·운영 데이터·한도를 만들거나 되살리지 않는다. 동일 처리 재전송은 중복 활성화·중복 지급 없이 기존 결과를 반환한다"
      race_and_completion: "접수·상태 전이·반영의 경합은 서버에서 검증해 동시에 성공하지 않게 한다. 취소와 승인 중 먼저 유효하게 확정된 상태를 기준으로 나머지 처리를 거부하거나 이미 처리된 결과를 안내한다. 승인 후 반영 중이거나 결과가 불명인 건을 단순 취소 완료로 바꿔 제한을 풀지 않는다. 반영 완료 또는 미반영 종결을 확정한 뒤 다음 요청을 허용하며 이미 반영된 변경의 되돌리기는 새 변경 절차를 따른다"
      scheduled_effect: "쿼터 승급처럼 원래 미래 적용을 정한 업무는 REQ-117·116의 적용 예약 기록을 성공적으로 확정하면 요청 처리가 완료된 것으로 본다. 업무가 의도한 미래 발효일 대기를 반영 실패/미완료로 취급하지 않으며 적용 월 잠금·예약 충돌 등 기존 규칙은 유지한다"
      sets_and_references: "복합 세트는 실제 변경하는 모든 대상에 같은 검사를 적용하고 하나라도 충돌하면 전체 접수를 거부한다. 읽거나 영향만 확인하는 참조 자산은 점유하지 않고 기존 참조 최신성 검사를 유지한다. 태그와 연결 지식의 독립 변경·참조 관계는 REQ-607을 따른다"
      delegated_and_direct: "승인 절차 미사용과 전결도 진행 중 요청·기준 버전 검사를 우회하지 않는다. 같은 대상의 기존 대기 요청을 전결 저장으로 덮어쓰지 않는다. 원래 승인 없이 가능한 사용자 권한 회수·비활성화는 대기 요청 때문에 지연하지 않으며 충돌하는 과거 부여/승인 근거를 무효화해 늦은 승인으로 복구되지 않게 한다. 다른 직접 관리 정책은 기존 범위를 따르고 승인 대상 변경을 직접 저장으로 우회하지 않는다"
      domain_results: "REQ-119의 신청량 이하 부분 승인과 REQ-117의 승인 시점 적용 월 결정은 제출 내용 변경이 아닌 승인 처리 결과로 남긴다. 원 신청량·희망 등급·신청 시각을 보존하며 부분 승인으로 남은 수량을 같은 요청의 추가 승인 대상으로 재사용하지 않는다. 다른 업무의 기존 검토 단계·인가·효력 시점·일괄 반영 규칙도 유지한다"
      verification: [{"case":"같은 매핑의 USER_A 요청 대기 중 USER_B로 수정 또는 새 요청","expected":"제출본 수정과 중복 접수를 모두 거부하고 기존 요청을 안내한다"},{"case":"기존 요청 취소 후 새 내용 제출과 이전 승인 도착","expected":"새 요청만 검토·승인 대상이며 이전 승인으로 활성화하지 않는다. 전후 요청과 취소 이력을 보존한다"},{"case":"두 담당자·탭의 동시 접수 또는 취소/승인 동시 처리","expected":"대상별 미종결 요청은 한 건이고 상태 전이는 허용된 하나만 성공한다. 중복 지급·활성화가 없다"},{"case":"승인 뒤 반영 실패 또는 복구 중 같은 대상 신규 요청","expected":"기존 처리 결과가 확정될 때까지 새 요청을 거부한다. 임의 종결로 제한을 풀지 않는다"},{"case":"복합 세트 일부 대상에 기존 요청, 또는 참조 자산만 처리 중","expected":"실제 변경 대상 충돌이면 전체 접수를 거부하고 참조만 하는 대상은 기존 최신성 검증으로 처리한다"},{"case":"승인 설정 해제 후 기존 대기 대상 전결 저장","expected":"기존 요청과 제출본을 보존하고 중복·버전 검증 우회를 거부한다"},{"case":"권한 회수와 오래 열린 승인 화면 처리","expected":"회수는 기존 절차로 즉시 처리하고 무효화된 부여 요청의 늦은 승인으로 복구하지 않는다"},{"case":"동월 추가 토큰 중복 신청·부분 승인, 승급 미래 적용 예약","expected":"미종결 추가 신청은 한 건, 부분 승인량은 별도 결과로 한 번만 지급한다. 승급 예약 확정은 요청 처리 완료이며 적용 월 정책은 유지한다"}]
    lifecycle: "항목별 참조·이력 검증 후 수정·비활성화·삭제한다. 승인 대상은 approval_policy에 따라 별도 승인 또는 저장자 전결로 처리하며 후보·유효본 분리와 월별 쿼터 잠금 등 개별 수명주기는 유지한다"
