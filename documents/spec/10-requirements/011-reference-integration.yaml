      - {"attribute_group":"공급 경로","used_for":"실제 호출 통로를 고르고 경로별 모델·단가를 연결한다. 비밀값은 관리 화면에 두지 않는다"}
      - {"attribute_group":"모델과 제공 조합","used_for":"호출 식별값과 사용자 표시명을 분리하고 제공하지 않는 조합을 제외한다"}
      - {"attribute_group":"역할 매핑","used_for":"agent의 스텝별 호출 모델과 admin/agent 공통 임베딩을 결정한다"}
    consumers:
      - {"where":"portal 모델 선택","when":"턴 시작 전","how":"REQ-116의 해당 사용자 등급 허용집합과 유효 제공 조합을 교차해 선택지를 제공한다"}
      - {"where":"agent 모델 호출·사용량 이력","when":"스텝 호출 시","how":"역할별 설정을 적용하고 공급 경로·모델·effort·역할을 기록한다"}
      - {"where":"지식 검색·임베딩","when":"본문/질의 벡터 생성 시","how":"동일 임베딩 모델·설정을 사용하며 교체 시 재임베딩한다"}
    business_rules:
      - "공급 경로와 제작사는 별개다. 같은 제작사 모델을 서로 다른 경로로 제공할 수 있고 단가는 경로·모델 단위다(ADR-004)"
      - "주 추론은 등급 허용 범위 안에서 사용자 선택 또는 관리자 기본값을 사용한다. 보조 판정은 역할별 고정 설정이며 실패 시 주 추론으로 자동 대체하지 않는다(ARCH-040)"
      - "모델 비활성화의 당월 선택지 즉시 제외와 진행 중 턴 유지 규칙은 REQ-116을 따른다. 기본 모델이 비활성·등급 범위 밖이면 허용되지 않은 모델을 몰래 선택하지 않는다"
      - "임베딩 교체 시 기존 벡터 재생성과 본문·질의 임베딩 일치 조건은 ARCH-040을 따른다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "모델 M이 effort 'high'만 지원하는데 'ultra' 조합을 저장하면 유효 조합이 아니라는 오류를 보여 준다"
    lifecycle: "모델 사용/비활성은 REQ-116을 따른다. 제작사·경로의 폐지는 REQ-601 공통안 검토 대상이다"
    permissions:
      - "ACT-004의 해당 메뉴·조회/등록/수정/상태변경 액션 권한으로 관리한다. 화면 노출과 별개로 서버에서 검증한다"
      - "권한 밖 개인정보·비밀값·업무 데이터를 기준정보의 사용처 조회로 우회 열람하지 못한다"
    audit: "기존 정책·승인·월별 확정 이력은 관련 요구사항을 따른다. 신규 관리 속성의 변경 근거는 REQ-601 공통안으로 확인하며 이력 없이 기존 근거를 덮어쓰지 않는다"
