  - id: REQ-603
    type: functional
    priority: must
    workstream: admin
    actors: ["ACT-003"]
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — FEAT-002·ARCH-030·REQ-103 · 2026-10-02 사용자 보완 요청: 데이터소스의 다중 DB 스키마와 카탈로그 객체 식별을 허용하고 별도 스키마 권한·중복 매핑은 두지 않는다 · 2026-10-02 사용자 명시 확정: REQ-603 전체 정리안 확정 · 2026-10-27 사용자 P2 결정: 동일 연결로 접근 가능한 다른 DB는 허용하고 별도 DB 허용 목록을 두지 않는다(ADR-027)"
    process_step: PRC-13-01
    title: "데이터소스 정의·배포 연결 참조 관리"
    detail: "업무 자산 관리자는 현재 로드된 yml 데이터소스 식별자를 선택해 Hub 데이터소스를 등록하고 업무 메타데이터를 관리할 수 있어야 한다. 카탈로그·화면·agent는 Hub 데이터소스의 내부 식별자를 참조한다. 데이터소스는 DB/DW 접속 단위이며 DB 스키마 하나의 관리·권한 단위가 아니다. 하나의 데이터소스의 기존 연결로 접근할 수 있는 여러 DB/카탈로그·스키마의 공개 객체를 등록할 수 있다"
    roadmap: RM-P1
    acceptance: "로드된 yml ID에서 데이터소스를 등록하면 별칭·파서·시각·그룹을 관리할 수 있고 비밀값은 보이지 않는다. yml ID가 사라지면 끊긴 연결을 표시하고 그 데이터소스의 조회를 차단한다. 데이터소스 등록이나 사용자 매핑에 단일 DB 스키마 선택을 요구하지 않으며, 같은 데이터소스의 서로 다른 DB/카탈로그·스키마에 있는 동명 객체를 REQ-301에 따라 구분한다. DBMS와 연결 계정이 접근을 허용하면 별도 DB 허용 목록 없이 다른 DB의 등록 객체도 조회할 수 있다. 별도 사용자/그룹-DB 스키마 매핑 없이 기존 객체 권한·행 스코프를 적용하고 데이터소스 이용 허용을 전체 객체 공개로 해석하지 않는다"
    summary: "배포 접속 정보와 Hub 관리 메타데이터를 분리하고 연결 이상을 사용 전에 드러낸다. 다중 DB 스키마의 객체 식별과 사용자 접근 권한은 별개로 관리한다"
    intent:
      problem: "접속 설정과 업무용 데이터소스 명칭을 섞으면 설정 변경으로 참조가 깨지거나 비밀정보가 화면으로 노출된다"
      goal: "배포 접속 정보와 Hub 관리 메타데이터를 분리하고 연결 이상을 사용 전에 드러낸다"
      not: ["DB 접속 URL·계정·비밀번호·커넥션 풀의 화면 편집이 아니다","대상 시스템과 데이터소스를 1:1로 매핑하는 요구가 아니다","DB 스키마별 데이터소스 분리나 별도 사용자/그룹-DB 스키마 권한 관리를 요구하지 않는다"]
    goal_trace: ["IN-06"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
      - {"item":"연결 참조: Hub 내부 식별자·현재 로드된 yml 데이터소스 ID","origin":"Hub 발급·배포 설정 선택","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"업무 표시: 유일한 수정 가능 별칭·설명","origin":"관리자 입력","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"질의 기술 기준: DBMS 종류·사용 SQL 파서(DBMS 기본값과 별도 지정)","origin":"관리자 입력·지원 파서 목록","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"시각·범위: 운영 DB/DW 유형·시각 체계·데이터 기준 시각 정보·적용 가능 사용자 그룹","origin":"관리자 입력","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
    field_usage:
      - {"attribute_group":"연결 참조","used_for":"접속 구성과 업무 메타데이터를 연결한다"}
      - {"attribute_group":"업무 표시","used_for":"관리 화면과 LLM 컨텍스트에서 데이터소스를 구분한다"}
      - {"attribute_group":"질의 기술 기준","used_for":"SQL 해석·검증에 사용하며 파서 미지원이면 실행하지 않는다"}
      - {"attribute_group":"시각·범위","used_for":"조회 대상 선별·결과 기준 시각 표시·하위 그룹 매핑 어휘 제약에 사용한다"}
    consumers:
      - {"where":"카탈로그 관리","when":"공개 객체 등록 시","how":"REQ-301의 데이터소스·DB/카탈로그·스키마·객체명 전체로 대상을 식별한다"}
      - {"where":"agent SQL 처리","when":"조회 계획·검증·실행 시","how":"데이터소스별 파서·연결·시각 정보를 사용한다"}
      - {"where":"admin 관리","when":"화면 진입·연결 점검 시","how":"미등록 yml ID/정상/끊긴 연결을 구분한다"}
    business_rules:
      - "접속 URL·계정·암호화된 비밀 설정값·풀 설정의 연결 정의는 배포 yml이 정본이며 관리 화면에서 관리하거나 표시하지 않는다(ARCH-030). 암호화 yml·공통 복호화 연동·외부 마스터 키 관리·비노출은 REQ-403이 정본이다"
      - "현재 로드된 설정 ID 목록을 읽으며, 설정 파일 변경에 의한 연결 재구성은 재시작이 필요하다. 화면 조회를 동적 풀 생성으로 해석하지 않는다"
      - "yml ID가 바뀌면 관리자가 동일한 연결 대상임을 확인한 뒤 내부 레코드의 yml 참조를 명시적으로 정정한다. 자동 추정·대체하지 않으며 정정 또는 설정 복구 전에는 끊긴 연결이다. 카탈로그의 내부 참조 식별자를 일괄 변경하지 않는다"
      - "끊긴 연결 또는 미지원 파서는 관련 조회를 차단하고 원인을 알린다. 적용 가능 그룹은 매핑 어휘이며 런타임 권한의 별도 추가 게이트가 아니다"
      - "단일 SQL은 한 데이터소스에서 실행한다. 대상 시스템 귀속을 데이터소스나 테이블에 추가하지 않는다(ARCH-030)"
      - "데이터소스 등록에 DB 스키마 하나를 필수 매핑하지 않고 스키마별로 연결 레코드를 분리하도록 강제하지 않는다. 접속 계정이 읽을 수 있는 여러 DB 스키마 중 공개 대상으로 선정한 객체를 같은 데이터소스에 등록할 수 있다. 객체의 DB 스키마명·물리 식별 규칙은 REQ-301이 정본이다"
      - "사용자의 데이터소스 이용 가능 여부와 대상별 신원은 REQ-609, 테이블·컬럼 접근과 행 스코프는 REQ-103·REQ-611을 따른다. 사용자 또는 그룹에 DB 스키마를 별도 권한 대상으로 매핑하지 않는다. 데이터소스에 접근할 수 있어도 미등록 또는 미허용 객체에는 접근할 수 없다"
      - "DB 접속 계정의 실제 스키마·객체 조회 권한은 고객사 DB/배포 설정 책임이며 Hub 사용자별 권한을 대신하지 않는다. yml의 스키마 지정은 필수 연결 매핑으로 강제하지 않으며, DB의 기본 스키마·검색 경로 설정이 있더라도 이름 해석 환경일 뿐 Hub의 공개 범위나 사용자 권한이 아니다"
      - "인증 예제와 지식의 데이터소스·DB 스키마 식별은 REQ-302·REQ-303의 실행 대상 및 카탈로그 참조를 사용한다. 같은 정보를 자산별 별도 스키마 목록이나 권한 매핑으로 중복 관리하지 않는다"
      - "2026-10-27 사용자 결정(ADR-027): 하나의 데이터소스에 설정된 기존 연결로 DBMS와 접속 계정이 접근을 허용하는 다른 DB/카탈로그의 조회를 허용한다. 접속 대상 DB 하나로 제한하거나 별도의 DB 허용 목록·DB별 Hub 권한 매핑을 두지 않는다. 같은 연결로 처리할 수 있는 DB 간 조인도 이 범위에 포함한다. Hub가 추가 연결·계정으로 우회하거나 서로 다른 데이터소스를 하나의 SQL로 묶는 기능을 뜻하지 않는다"
      - "다른 DB 조회에도 기존 공개 객체 등록·현재 사용자 권한·행 스코프·읽기 전용 SQL 통제를 적용한다. 실제 DB 접근 가능 여부는 DBMS 권한이 판정하며 Hub는 그 권한을 새로 부여하지 않는다. DB 권한 변경으로 실패하면 오류를 알리고 다른 연결이나 동명 객체로 자동 대체하지 않는다"
      - "DB/카탈로그명·DB 스키마명·객체명과 필요한 서버 한정자를 포함한 물리 식별은 REQ-301을 따른다. 해당 DBMS·파서에서 전체 참조와 기존 SQL 통제를 검증할 수 있어야 실행한다. 미지원 구문이나 해석 불가능한 한정자를 버려 등록 객체와 일치시키지 않는다. 이는 별도의 DB 허용 정책이 아니라 실제 대상을 검증하기 위한 조건이다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "재시작 후 'legacy_ro'가 설정에서 사라지면 다른 연결로 자동 대체하지 않고 끊긴 연결로 처리한다"
    lifecycle:
