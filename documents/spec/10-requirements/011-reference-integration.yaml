      - {"item":"모델과 제공 조합: 모델 식별자·제작사·표시명·추론/임베딩 용도·공급 경로별 호출 모델 식별값·지원 effort 목록·사용 여부","origin":"공급 경로 계약과 관리자 등록","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"역할 매핑: 주 추론 기본값·보조 판정 역할별 고정 경로/모델/effort·시스템 운영용 경로/모델/effort·임베딩 사용 여부 및 모델 설정","origin":"관리자 설정","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
    field_usage:
