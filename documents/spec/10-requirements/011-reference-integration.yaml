# 영역: 기준정보 공통·모델·연동·그룹
requirements:
  - id: REQ-601
    type: functional
    priority: must
    workstream: admin
    actors: ["ACT-002","ACT-003","ACT-004"]
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — 기존 기준정보 관리 기능 전반과 사용자 요청; 신규 상세안은 확정 전"
    process_step: PRC-13-01
    title: "기준정보 관리 범위·공통 속성·참조 보호"
    detail: "관리자는 Hub가 반복 참조하는 정의·매핑·운영 기준을 항목별로 조회·등록·변경하고, 사용처와 변경 영향을 확인할 수 있어야 한다. 각 상세 항목은 REQ-602~616에 둔다. 이 묶음은 모든 기준정보를 한 화면이나 범용 코드 테이블에 저장하라는 요구가 아니다"
    roadmap: RM-P1
    acceptance: "관리자가 모델·그룹·데이터소스의 사용처와 변경 근거를 확인할 수 있고, 유효 참조를 끊는 변경은 차단된다. 물리 삭제 가능 범위·과거 이력만 남은 항목의 폐지는 open의 확인 대상이다. 그룹 직접 변경, 지식 세트 승인, 월별 쿼터 적용, yml 배포 설정의 경계가 유지된다"
    summary: "대상별 속성·사용처·관리 권한·적용 경계를 명시하고 참조를 깨뜨리는 변경을 막는다"
    intent:
      problem: "관리 기능이 분산되어 관리 원천·식별자·사용처·변경 영향이 불명확하다"
      goal: "대상별 속성·사용처·관리 권한·적용 경계를 명시하고 참조를 깨뜨리는 변경을 막는다"
      not: ["고객·상품·창고 같은 레거시 업무 기준정보를 Hub에 복제하는 통합 마스터 관리가 아니다","지식·인증 예제·스키마 카탈로그의 기존 정본이나 system 구현을 새로 만드는 요구가 아니다"]
    goal_trace: ["IN-06"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "기존 요구사항·정책·자산 변경 절차와 system의 구현된 관리 기능을 우선 참조한다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
      - {"item":"공통 식별: 변하지 않는 내부 식별자, 표시명, 설명, 해당 대상의 업무 키","origin":"관리자 입력·Hub 발급","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"사용 상태와 적용 기준: 신규 선택 가능 여부, 적용 시점 또는 적용 월, 대상별 상태","origin":"대상별 기존 규칙 및 신규 초안","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"관리 근거: 소유 관리 영역, 변경자·시각·사유, 변경 전후 값 또는 리비전 참조","origin":"Hub 변경 이력","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"참조 현황: 참조하는 기준정보·매핑·업무 자산과 설정, 해당 대상의 과거 사용 기록 연결","origin":"Hub 참조 조회","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
    field_usage:
      - {"attribute_group":"공통 식별","used_for":"이름 변경과 관계없이 참조·이력을 연결한다"}
      - {"attribute_group":"사용 상태와 적용 기준","used_for":"현재 사용할 값과 과거 기록을 구분한다. 모든 대상에 동일 상태 기계를 강제하지 않는다"}
      - {"attribute_group":"관리 근거","used_for":"어떤 관리값이 왜 변경됐는지 추적한다"}
      - {"attribute_group":"참조 현황","used_for":"삭제·사용 중지·연결 변경 전에 영향을 확인한다"}
    consumers:
      - {"where":"admin 기준정보 관리","when":"등록·변경·삭제 검토 시","how":"항목별 상세 정의와 기존 승인·월 적용·배포 경계를 사용한다"}
      - {"where":"agent·portal","when":"선택지 제공·컨텍스트 구성·실행·권한 판정 시","how":"해당 목적의 유효 기준만 참조한다. 화면 선택 제한만으로 서버 판정을 대체하지 않는다"}
    business_rules:
      - "지식·인증 예제·스키마 카탈로그와 자산 접근 그룹은 REQ-301~308·REQ-103의 변경 세트 절차를 따른다. 기준정보라는 이름으로 직접 수정 대상으로 바꾸지 않는다"
      - "Hub 사용자 그룹과 사용자 소속·직접 관리 보안 정책은 REQ-103, 쿼터의 월 적용은 REQ-116~119, 업무 API 공동 오픈은 REQ-113을 그대로 따른다. 모든 기준정보에 일괄 승인 절차를 추가하지 않는다"
      - "관리자 계정·메뉴·역할·공통코드·메시지·시스템 설정·배치 정의는 REQ-501~508을 참조하며 admin에 중복 등록하지 않는다. Portal 이용자는 REQ-616의 별도 관리 메뉴를 두고 조직 정보는 인증·인사 원천을 구분한다. 컬럼 의미 유형·값 도메인·조인 정보는 REQ-301, 지식 태그·동의어는 REQ-303을 따른다"
      - "월별 배정·실제 사용량·품질 신고·오류·조사·평가 실행 결과·개인 저장 조회는 처리 기록 또는 사용자 자산이다. 기준정보와 연결하되 기준정보 목록으로 혼합하지 않는다"
      - "신규 공통안: 내부 식별자를 재사용하지 않고 표시명 변경으로 참조가 바뀌지 않게 한다. 삭제·연결 변경으로 유효 참조를 고아로 만들지 않으며, 제거가 막히면 사용처를 권한 범위 안에서 안내한다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "사용 중인 데이터소스를 삭제하려 하면 관련 카탈로그가 있다는 사실과 조치 대상을 안내하고 삭제하지 않는다"
    lifecycle: "대상별 기존 상태를 우선한다. 신규 항목의 비활성·삭제 공통안은 open에서 확정한다"
    permissions:
      - "ACT-002·ACT-003·ACT-004의 해당 메뉴·조회/등록/수정/상태변경 액션 권한으로 관리한다. 화면 노출과 별개로 서버에서 검증한다"
      - "권한 밖 개인정보·비밀값·업무 데이터를 기준정보의 사용처 조회로 우회 열람하지 못한다"
    audit: "기존 감사 의무는 해당 요구사항을 따른다. 신규 공통 이력 범위·보존은 open의 확인 대상이다"
    volume: "고객사별 관리 항목 수·변경 빈도는 미확인이다. 기존 NFR을 임의 수치로 바꾸지 않는다"
    config:
      - "관리할 속성·원천·사용처는 이 카드의 data·field_usage·consumers를 따른다. 코드/배포 설정·관리 데이터·읽기 전용 참조를 혼합하지 않는다"
    risk: "참조 변경·사용 중지·적용 시점이 후속 실행과 이력을 깨뜨리지 않는지 설계·시험에서 검증한다"
    relations:
      depends_on: []
      constrains: ["REQ-602","REQ-603","REQ-604","REQ-605","REQ-606","REQ-607","REQ-608","REQ-609","REQ-610","REQ-611","REQ-612","REQ-613","REQ-614","REQ-615","REQ-616"]
      conflicts_with: []
      nfr: []
      interfaces: []
    realization:
      features: ["FEAT-001","FEAT-002","FEAT-006","FEAT-015","FEAT-017","FEAT-024"]
      screens: ["SCR-001","SCR-002","SCR-006","SCR-015","SCR-021","SCR-010"]
    examples:
      - {"kind":"정상","case":"'물류조회' 그룹의 표시명을 '물류정보조회'로 바꿔도 기존 사용자·테이블 매핑은 같은 그룹 식별자를 참조한다"}
      - {"kind":"예외","case":"사용 중인 데이터소스를 삭제하려 하면 관련 카탈로그가 있다는 사실과 조치 대상을 안내하고 삭제하지 않는다"}
    volatility: {"level":"high","what":"고객사마다 기준 값·대상·규모가 다르므로 운영 데이터로 관리한다. 관리 원천과 승인·보안 경계는 고객사 값과 구분한다"}
    open: ["@defer P1 공통 수명주기 권장안: 참조 또는 이력이 있으면 물리 삭제를 막고 비활성·폐지로 관리, 한 번도 사용되지 않은 오등록만 삭제 허용. 기존 그룹 삭제 차단·등급 폐지 규칙은 유지한다. 영향: 참조 무결성·이력 재현. 되돌리기 비용: 중간","@defer P1 새 기준정보의 변경 이력 권장안: 변경 전후·사유·처리자·시각 보존. 기존 승인/정책 이력 이외 항목의 보존 기간은 고객사 보존 정책으로 정한다. 영향: 감사·저장량. 되돌리기 비용: 중간"]
    maturity: { level: elaborated, at: "2026-09-30", by: "AI 정리", confirmed_by: null }

  - id: REQ-602
    type: functional
    priority: must
    workstream: admin
    actors: ["ACT-004"]
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — FEAT-015·ARCH-040·ADR-004·REQ-116; 신규 상세안은 확정 전"
    process_step: PRC-13-01
    title: "모델 제작사·공급 경로·모델과 역할별 매핑 관리"
    detail: "운영 관리자는 모델 제작사, 호출 공급 경로, 모델, 경로별 제공 모델과 지원 effort(추론 노력 수준), 역할별 선택 기준을 관리할 수 있어야 한다. 임베딩은 주 추론·보조 판정과 별도로 설정한다"
    roadmap: RM-P1
    acceptance: "동일 모델을 직접 경로와 게이트웨이 경로에 등록해 구분 선택·계량할 수 있다. 지원하지 않는 effort 또는 등급 밖 모델 선택은 거부되고, 보조 판정 모델은 사용자 선택에 따라 바뀌지 않는다"
    summary: "제작사·공급 경로·모델을 구분하여 유효한 조합과 역할별 모델을 운영 데이터로 선택한다"
    intent:
      problem: "모델 제작사와 실제 호출 공급 경로를 하나로 취급하면 같은 모델의 호출·단가·인증·허용 범위를 혼동한다"
      goal: "제작사·공급 경로·모델을 구분하여 유효한 조합과 역할별 모델을 운영 데이터로 선택한다"
      not: ["자동 난이도 판정이나 공급사 장애 시 자동 대체 라우팅이 아니다","화면에 API 키·비밀번호를 저장하는 기능이 아니다"]
    goal_trace: ["IN-06"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
      - {"item":"제작사: 식별자·명칭·설명·이용 검토 근거","origin":"관리자 등록","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"공급 경로: 식별자·명칭·직접/게이트웨이 구분·접속/인증 설정 참조·사용 여부","origin":"관리자 등록·배포 설정 참조","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"모델과 제공 조합: 모델 식별자·제작사·표시명·추론/임베딩 용도·공급 경로별 호출 모델 식별값·지원 effort 목록·사용 여부","origin":"공급 경로 계약과 관리자 등록","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"역할 매핑: 주 추론 기본값·보조 판정 역할별 고정 경로/모델/effort·임베딩 사용 여부 및 모델 설정","origin":"관리자 설정","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
    field_usage:
