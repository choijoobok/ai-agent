  - id: REQ-604
    type: functional
    priority: must
    workstream: admin
    actors: ["ACT-003","ACT-002"]
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — FEAT-001·REQ-105·ARCH-030·ARCH-050 · 2026-10-02 사용자 보완 요청: API 주소·인증·공통 헤더는 배포 연결 설정에서 관리하고 대상 시스템·API는 연결 참조로 매핑한다 · 2026-10-06 사용자 설명 개선 요청: 배포 연결 구성 정의 → 시스템의 허용 연결 목록·기본값 지정 → API별 연결 선택 순서를 명시한다 · 같은 날 사용자 정정: 사용자 그룹은 데이터소스와 개별 API에 매핑하며 대상 시스템에는 그룹 매핑을 두지 않는다. 사용자 용어 개선 요청에 따라 API별 제공 시스템 지정으로 쉽게 설명한다. 2026-10-06 사용자 명시 요청으로 카드 전체를 확정했다"
    process_step: PRC-13-01
    title: "대상 시스템 정의와 API별 제공 시스템 지정"
    detail: "관리자는 업무 API를 제공하는 대상 시스템의 명칭·설명·사용 상태와 관련 API·신원 매핑 현황을 관리할 수 있어야 한다. 배포 담당자가 주소·인증 방식·공통 고정 헤더를 한 묶음의 API 연결 설정으로 정의하면, 관리자는 대상 시스템에서 사용할 연결 식별자 목록을 매핑하고 그중 기본 연결을 지정한다. 개별 API에서 이 API를 제공하는 대상 시스템과 사용할 연결을 선택하는 절차는 REQ-608을 따른다"
    roadmap: RM-P1
    acceptance: "대상 시스템별 API·신원 매핑·허용 연결 목록·기본 연결을 조회할 수 있다. 같은 도메인이라도 인증·공통 고정 헤더 구성이 다른 연결을 한 시스템의 허용 목록에 함께 매핑할 수 있다. 기본 연결은 그 목록에서 지정하며 목록 밖 연결을 기본 연결이나 해당 시스템이 제공하는 API의 연결로 지정하면 거부된다. 대상 시스템에는 사용자 그룹을 매핑하지 않으며 API 호출 허용 그룹의 판정은 REQ-105·REQ-611을 따른다. 유효 연결이 없거나 해석되지 않으면 호출을 차단하고 비밀을 표시하지 않는다. 데이터소스는 독립적으로 유지된다"
    summary: "업무 API를 제공하는 시스템을 구분하고, 배포 설정에 있는 연결 중 이 시스템에서 사용할 목록과 기본값을 지정한다"
    intent:
      problem: "업무 API를 제공하는 시스템과 사용할 연결을 명확히 관리하지 않으면 API 계약·접속 구성·신원 매핑을 잘못 연결한다"
      goal: "업무 API를 제공하는 시스템과 그 시스템의 관리·연동 기준을 식별한다"
      not: ["데이터소스·카탈로그를 대상 시스템 아래에 강제 귀속시키지 않는다","고객사 업무 시스템의 기준정보와 계정을 Hub가 대신 관리하지 않는다","시스템과 도메인 주소를 반드시 일대일로 묶거나 화면에서 실제 인증정보·공통 접속 헤더 값을 편집하지 않는다"]
    goal_trace: ["IN-06"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
      - {"item":"시스템 정의: 식별자·시스템명·설명·사용 상태","origin":"관리자 등록","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"허용 연결 목록: 이 시스템의 API가 선택할 수 있는 API 연결 설정 식별자 목록","origin":"관리자가 현재 로드된 배포 연결 설정에서 선택·매핑","sensitivity":"참조 식별자만 — 접속 주소·인증 비밀·공통 고정 헤더 원문 제외","retention":"참조 변경과 변경 전 스냅샷은 REQ-601"}
      - {"item":"기본 연결: 허용 연결 목록에서 공통으로 사용할 연결 식별자 한 개","origin":"관리자가 이 시스템의 허용 연결 목록에서 지정","sensitivity":"참조 식별자만 — 접속 주소·인증 비밀·공통 고정 헤더 원문 제외","retention":"참조 변경과 변경 전 스냅샷은 REQ-601"}
      - {"item":"연관 정보: 이 시스템이 제공하는 업무 API 목록·시스템 기본 신원 매핑 참조·고객사 계약/오픈 근거 연결","origin":"등록된 API·신원 매핑에서 조회","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
    field_usage:
      - {"attribute_group":"시스템 정의","used_for":"업무 API별로 이 API를 제공하는 대상 시스템을 구분한다"}
      - {"attribute_group":"허용 연결 목록","used_for":"API 관리에서 대상 시스템을 선택한 뒤 제공할 연결 후보의 범위를 정한다"}
      - {"attribute_group":"기본 연결","used_for":"개별 API가 시스템 기본 연결 사용을 선택했을 때 적용할 연결을 정한다"}
      - {"attribute_group":"연관 정보","used_for":"어떤 API·신원·고객사 변경 근거가 영향을 받는지 확인한다"}
    consumers:
      - {"where":"업무 API 등록","when":"API 계약 작성·변경 시","how":"대상 시스템을 선택하면 그 시스템의 허용 연결 목록·기본 연결을 제공한다. API별 연결 선택과 상대 경로·입출력 명세는 REQ-608을 따른다"}
      - {"where":"agent 업무 실행","when":"API 선택·신원 전달 시","how":"API 계약의 시스템과 유효 연결 참조를 서버에서 해석하고 REQ-609의 현재 신원 매핑을 사용한다"}
    business_rules:
      - "2026-10-06 사용자 정정: 대상 시스템에는 사용자 그룹 매핑이나 적용 가능 그룹 목록을 두지 않는다. 개별 API의 호출 허용 그룹과 현재 권한 판정은 REQ-105·REQ-611을 따른다. 이 시스템의 API라는 이유로 다른 API의 호출 권한을 부여하거나 제한하지 않는다"
      - "API 연결 설정은 도메인/기본 주소·인증 방식과 비밀 참조·공통 고정 헤더를 한 묶음으로 정의하고 식별자를 붙인 것이다. 주소·인증·헤더는 한 설정의 구성 항목이다. 설정 원천은 배포 yml이며 보호 규칙은 REQ-403을 따른다"
      - "배포 설정에서는 같은 도메인에 인증 없음·토큰 인증 등 서로 다른 인증·헤더 구성을 여러 연결 식별자로 정의할 수 있다. 여러 호스트/인증 구성 때문에 대상 시스템을 강제로 나누지 않는다. 인증 여부는 조회/실행 유형과 별도로 실제 API 계약에 따라 정한다"
      - "대상 시스템 관리에서는 로드된 연결 식별자 중 이 시스템에서 사용할 목록을 매핑하고, 그 목록에서 기본 연결을 지정한다. 추가로 허용하는 연결도 이미 배포 설정에 정의된 연결이다. 화면에서 실제 접속 주소·인증값·공통 고정 헤더를 새로 정의하거나 복제하지 않는다"
      - "API별 연결 선택은 REQ-608을 따른다. 시스템 허용 연결 목록은 선택 가능한 범위이고 기본 연결은 공통 선택값이다. 연결 하나를 사용하도록 허용해도 실제 API 호출 권한은 별도로 판정한다"
      - "기본 연결 변경·허용 연결 제거 전에 영향받는 API를 확인하고 REQ-601의 변경 전 스냅샷·참조 검증을 적용한다. 해당 시스템이 제공하는 API가 사용 중인 연결 참조를 끊거나 모르는 연결로 자동 대체하지 않는다"
      - "시스템 변경만으로 API 계약·자격증명·신원 매핑을 자동 변환하지 않는다. 공동 오픈 근거는 REQ-113·REQ-608에서 관리한다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "기본/개별 연결 참조가 해석되지 않으면 해당 API 호출을 차단한다. 업무 사용자가 보낸 임의 주소·인증정보로 복구하지 않는다"
    lifecycle: "신규 선택 가능 여부·폐지·사용 중 참조 보호는 REQ-601을 따른다. 연결 없는 등록 초안과 실제 호출 가능 상태는 구분하며 호출에 필요한 유효 연결은 사용 전에 확인한다"
    permissions:
      - "ACT-003·ACT-002의 해당 메뉴·조회/등록/수정/상태변경 액션 권한으로 관리한다. 화면 노출과 별개로 서버에서 검증한다"
      - "권한 밖 개인정보·비밀값·업무 데이터를 기준정보의 사용처 조회로 우회 열람하지 못한다"
    audit: "기존 정책·승인·월별 확정 이력은 관련 요구사항을 따른다. 신규 관리 속성의 변경 근거는 REQ-601 공통안으로 확인하며 이력 없이 기존 근거를 덮어쓰지 않는다"
    volume: "고객사별 관리 항목 수·변경 빈도는 미확인이다. 기존 NFR을 임의 수치로 바꾸지 않는다"
