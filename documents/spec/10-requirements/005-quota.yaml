  - id: REQ-118
    type: functional
    priority: should
    actors: [ACT-004]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-28 사용자 결정(말일 확정 마감·미확정 시 승계·가중치 배분)"
    process_step: PRC-12-01
    title: "월 총 토큰 풀 자동 산정과 관리자 보정"
    detail: "관리자는 다음 달별 계획 가능 금액을 직접 입력하거나 연간 계획을 월별 금액으로 등록한다. Hub는 확정한 계획 1M 기준 단가와 토큰 풀 보정률로 보정 단가를 계산하고, `floor(계획 가능 금액 ÷ 보정 단가 × 1,000,000)`으로 월 총 토큰 풀을 자동 산정한다. 관리자는 산정된 총 토큰 풀을 보정할 수 있으며 근거를 남긴다. **다음 달 배정은 당월 말일까지 확정한다.** 확정되지 않은 채 달이 바뀌면 Hub는 직전 확정 월의 계획 가능 금액·보정 단가·등급별 배분 가중치를 그대로 이어받아 월초 활성 사용자 수로 개인 기본 한도를 산정하고 '승계 확정'으로 표시한다"
    hard_rule: "안전 여유율은 산식에 적용하지 않는다. 계획 가능 금액·보정 단가·자동 산정값·관리자 보정값과 근거는 대상 월별로 함께 이력화하며, 이는 예산·회계 장부가 아니라 토큰 운영 기준이다"
    why: "고객사별 계획 금액과 실제 사용 패턴이 다르므로, 공통 산식은 제공하되 운영자가 월별 상황을 반영할 수 있어야 한다"
    roadmap: RM-P1
    acceptance: "월 총 토큰 풀은 확정 1M 기준 단가와 보정률을 적용한 명시 산식으로 계산되고, 관리자 보정 시 대상 월의 계획 금액·단가·자동 산정값·보정값·근거가 함께 남으며 안전 여유율은 산식에 더해지지 않는다. 다음 달 배정을 말일까지 확정하지 않으면 직전 확정 월 기준으로 승계 확정되고, 승계 확정된 달은 월중에 다시 확정되지 않는다"
    summary: "관리자가 다음 달 계획 가능 금액을 넣으면, Hub가 보정 단가로 월 총 토큰 풀을 자동 산정한다. 관리자는 근거를 남기고 산정값을 보정할 수 있다"
    intent:
      problem: "금액 계획과 토큰 사용량 사이의 환산이 사람마다 달라지면, 월 배정의 근거를 설명할 수 없다"
      goal: "같은 입력이면 같은 토큰 풀이 나오는 공통 산식을 두고, 고객사 사정은 근거가 남는 보정으로만 반영한다"
      not:
        - "예산·회계 장부가 아니다 — 전사 예산 편성·잔액 통제를 하지 않는다(NFR-011)"
        - "절대 차단선이 아니다 — 총 풀 밖 승인은 REQ-119의 예외 승인으로 남긴다"
        - "안전 여유율을 산식에 넣지 않는다"
    goal_trace: [IN-06, MET-02]
    decider: "제품 오너(사용자). 고객사 금액·보정률은 ACT-004"
    preconditions:
      - "대상 월의 계획 1M 기준 단가가 확정돼 있다(NFR-010)"
      - "쿼터 등급과 등급별 배분 가중치가 정의돼 있다(REQ-116)"
    data:
      - { item: "대상 월 계획 가능 금액(직접 입력 또는 연간 월별 등록)", origin: "admin 입력", sensitivity: "내부(비용)", retention: "월별 이력 보존" }
      - { item: "계획 1M 기준 단가·보정률·보정 단가", origin: "NFR-010 단가 기준·공급사 월 대조", sensitivity: "내부(비용)", retention: "월별 이력 보존" }
      - { item: "자동 산정값·관리자 보정값·보정 근거", origin: "Hub 계산·admin 입력", sensitivity: "내부(비용)", retention: "수정 불가 이력" }
    business_rules:
      - "월 총 토큰 풀 = floor(계획 가능 금액 ÷ 보정 단가 × 1,000,000). 산식의 정본은 NFR-010 hard_rule이다"
      - "보정률은 최근 3개 확정 월의 공급사 대조값으로 시스템이 제안하고, 관리자가 적용·수정·미적용을 고른다"
    exceptions:
      - "공정 단계의 예외는 PRC-12-01이 갖는다"
      - "확정 월이 3개 미만(도입 초기)이면 보정률을 제안하지 않고 기본값 1.0을 쓴다. 관리자는 근거를 남기고 바꿀 수 있다"
      - "다음 달 배정이 작성중이면 SCR-021에 미확정 경고를 표시한다. 말일까지 확정되지 않으면 승계 확정하며, 승계할 직전 확정 월이 없으면(도입 첫 달) 승계하지 않는다. 첫 확정 전에는 개인 한도가 없어 질의 턴을 시작할 수 없다"
      - "순위가 높은 등급의 배분 가중치가 낮은 등급보다 작으면 확정하지 않고 해당 등급을 표시한다"
      - "승계 확정된 달은 월중에 다시 확정할 수 없다. 부족분은 추가 승인(REQ-119)으로 처리한다"
    lifecycle:
      - { state: 작성중, next: [확정됨, 승계확정], note: "당월 말일까지 관리자가 확정한다" }
      - { state: 확정됨, next: [] }
      - { state: 승계확정, next: [], note: "말일까지 확정하지 않아 직전 확정 월 기준으로 자동 확정됐다 — 월중 재확정 불가" }
    permissions:
      - "입력·보정·확정: ACT-004"
    audit: "대상 월별로 계획 금액·단가·보정률·자동 산정값·보정값·근거·확정자·확정 시각을 한 묶음으로 남기고, 확정 뒤에는 수정하지 않는다"
    volume: "월 1회 확정. 대상 월 1건"
    config:
      - "계획 가능 금액·보정률 적용 여부는 월별 admin 입력이다. 산식 자체는 코드로 고정한다(ADR-004의 계량 단위·과금 모드 분리)"
    risk: "보정률의 입력인 공급사 월 대조값을 어떻게 받는지(수동 입력·파일·API)가 정해지지 않았다"
    relations:
      depends_on: [REQ-116, REQ-117]
      constrains: [REQ-117, REQ-119]
      conflicts_with: []
      nfr: [NFR-010, NFR-011]
      interfaces: []
    realization:
      features: [FEAT-017]
      screens: [SCR-021]
    examples:
      - { kind: 정상, case: "10월 계획 금액 1,000만 원, 1M 기준 단가 5,000원, 보정률 1.1이면 보정 단가 5,500원, 총 풀은 floor(10,000,000 ÷ 5,500 × 1,000,000) = 1,818,181,818 토큰이다" }
