# 영역: 쿼터·비용
requirements:
# ── 쿼터·비용 ───────────────────────────────────────────────
  - id: REQ-116
    type: functional
    priority: must
    actors: [ACT-004]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-28 사용자 결정(적용 월 잠금·신규 사용자 일할 자동 배정·첫 사용 전 정정·가중치 배분·모델 비활성화 즉시 제외·등급 폐지 절차) · 2026-09-30 사용자 재확정(쿼터 적용 대상은 관리자 계정과 별개인 활성 Portal 이용자, 기존 산식·월별 정책 유지)"
    process_step: PRC-12-01
    title: "개인별 쿼터 등급·모델 허용 관리"
    detail: "Hub는 사용자 그룹과 독립적으로 활성 Portal 이용자마다 쿼터 등급 하나를 부여해야 한다. 쿼터 등급별로 사용자가 주 추론에 선택할 수 있는 공급 경로·모델·effort 집합을 관리하며, 보조 판정 역할의 모델 매핑은 기존 역할별 설정을 따른다. 쿼터 등급은 사용자별 **적용 월** 단위로 관리한다. 관리자는 신규 사용자를 등록할 때 쿼터 등급을 부여하며(기본 선택값은 가장 낮은 등급), 그 등급은 등록한 달부터 적용된다. 관리자는 사용자별 쿼터 등급을 직접 변경할 수 있고 변경 사유를 남긴다"
    hard_rule: "사용자 그룹은 지식·스키마 카탈로그 등 Hub 업무 자산의 접근 통제 기준이며, 쿼터 등급이나 허용 모델은 사용자 그룹·system 역할로 결정하지 않는다. **당월과 지난 적용 월의 등급은 바꾸거나 지울 수 없다.** 직접 변경과 승급 승인은 다음 달 배정 확정(REQ-118) 전이면 다음 달부터, 확정 뒤면 그다음 달부터 적용한다. 이번 달 부족분은 추가 토큰 승인(REQ-119)으로 처리한다"
    why: "같은 접근 범위를 가진 사용자라도 Hub 활용도와 필요한 모델 수준이 다르므로, 접근 통제와 월별 토큰 배정·선택 가능 모델을 분리해야 한다"
    roadmap: RM-P1
    acceptance: "같은 사용자 그룹이라도 사용자별 쿼터 등급과 주 추론 허용 공급 경로·모델·effort를 다르게 관리할 수 있다. 신규 사용자는 등록 때 부여한 등급으로 그 달부터 쓰고, 당월·지난 달의 등급 변경 시도는 거부되며, 직접 변경은 사유를 남겨 다음 달 배정 확정 전이면 다음 달, 뒤면 그다음 달부터 적용된다"
    summary: "사용자마다 쿼터 등급 하나를 두고, 등급이 월 기본 배분 몫과 주 추론에서 고를 수 있는 공급 경로·모델·effort 범위를 정한다. 접근 통제(사용자 그룹)와는 별개의 축이다"
    intent:
      problem: "같은 접근 범위의 사용자라도 Hub 활용도와 필요한 모델 수준이 달라, 그룹 하나로 권한과 사용량을 함께 묶으면 과소·과다 배정이 생긴다"
      goal: "사용량·모델 수준을 사람 단위로 조정하되, 월중 변경이 이번 달 계산을 흔들지 않게 한다"
      not:
        - "사용자 그룹이 아니다 — 그룹은 업무 자산 접근 통제(REQ-103)이고 등급은 사용량·모델 범위다"
        - "system 역할이 아니다 — 역할·메뉴 권한(REQ-502)으로 등급을 정하지 않는다"
        - "보조 판정 역할의 모델 선택이 아니다 — 그것은 역할별 고정 설정을 따른다"
    goal_trace: [IN-06, MET-02]
    decider: "제품 오너(사용자). 고객사별 등급 체계와 값은 도입 시 ACT-004가 정한다"
    preconditions:
      - "Portal 이용자(REQ-616)가 Hub에 등록·활성 상태다 — 관리자 계정 존재와는 별개이며 활성 Portal 이용자 수가 개인 기본 한도의 분모다"
      - "선택 가능한 공급 경로·모델·effort가 외부 모델 관리(FEAT-015)에 등록돼 있다"
    data:
      - { item: "쿼터 등급 정의(등급명·순위·배분 가중치·허용 공급 경로·모델·effort 집합)", origin: "admin 입력", sensitivity: "일반", retention: "발효 월별 이력 보존" }
      - { item: "사용자별 적용 월별 쿼터 등급(사용자·적용 월·등급·근거: 신규 등록·직접 변경·승급 승인)", origin: "admin 입력·REQ-117 승인", sensitivity: "일반", retention: "당월·지난 월은 수정 불가" }
      - { item: "신규 사용자 일할 배정(등록일·적용 등급·그 달 등급 개인 기본 한도·남은 일수·그 달 일수·배정량)", origin: "Hub 계산", sensitivity: "일반", retention: "수정 불가 이력" }
      - { item: "직접 변경 사유·처리자·처리 시각", origin: "admin 입력", sensitivity: "일반", retention: "수정 불가 이력" }
    business_rules:
      - "2026-10-01 사용자 확정: 관리자 시스템 운영용 LLM 호출은 관리자 사용자별 토큰 사용량을 집계하되 쿼터 등급·개인 한도·턴 시작 및 호출 직전 쿼터 제한을 적용하지 않는다. 전체 실제 사용량·비용에는 포함하고 Portal 쿼터 소모와 구분해 기록한다"
      - "동일인이 관리자와 Portal 이용자를 겸해도 Portal 질의에는 기존 쿼터를 적용한다. 관리자 자격만으로 우회할 수 없으며 서버가 인가한 운영 기능 호출만 운영용으로 분류한다. 운영용 모델·effort는 REQ-602의 별도 설정을 사용한다"
      - "신규 사용자 등록 화면의 등급 기본 선택값은 순위가 가장 낮은 등급이다"
      - "신규 사용자 일할 배정 = floor(그 달 해당 등급의 개인 기본 한도 × Hub 이용 등록일(REQ-103)을 포함한 남은 일수 ÷ 그 달의 일수). 등록 즉시 자동으로 주며 신청·승인을 거치지 않는다"
      - "신규 일할 배정은 일반 배정·추가 승인(REQ-119)과 구분해 기록한다. 기존 사용자의 그 달 한도는 다시 계산하지 않는다"
      - "계획 총 풀은 절대 차단선이 아니므로, 신규 일할 배정이 미배정 계획량을 넘어도 지급하고 초과량을 따로 집계한다"
      - "다음 달 배정을 확정한 뒤 그달이 오기 전에 등록한 사용자는 다음 달 활성 인원에 없으므로, 다음 달 1일에 같은 산식으로 한 달 전체 몫을 자동 배정한다"
      - "그 달 배정 기록이 없는 사용자는 재활성화·재입사도 신규 일할 배정 대상이다. 그 달 배정 기록이 있으면 기존 배정을 그대로 둔다"
      - "등록 때 부여한 등급은 그 사용자의 첫 사용 기록이 생기기 전까지만 정정할 수 있고, 정정하면 신규 일할 배정을 새 등급으로 다시 계산한다. 첫 사용 뒤에는 당월 잠금을 따른다"
      - "개인 기본 한도 = floor(월 총 토큰 풀 × 본인 등급의 배분 가중치 ÷ Σ(등급별 배분 가중치 × 그 등급 활성 사용자 수)). 인원 분포와 관계없이 사람 사이의 한도 비율이 가중치 비율과 같다"
      - "배분 가중치는 등급 정의에 두며 사람마다 따로 주지 않는다. 0보다 큰 수이고 소수점 둘째 자리까지 쓴다"
      - "순위가 높은 등급의 배분 가중치는 낮은 등급 이상이어야 한다. 어기면 월 배정을 확정할 수 없다"
      - "개인별 버림으로 남은 토큰은 미배정 계획량으로 둔다"
      - "모델 비활성·허용 범위 이탈로 새 턴·새 시도 시작이 거부된 뒤 Portal 선택 목록을 갱신하는 동작은 REQ-602.model_selection_recovery를 따른다. 이 복구로 사용자 등급·당월 배정·진행 중 실행 시도의 고정 모델을 바꾸지 않는다"
    exceptions:
      - "공정 단계의 예외는 PRC-12-01이 갖는다"
      - "당월·지난 적용 월의 등급 변경·삭제 요청은 거부하고, 다음 적용 가능한 달을 안내한다"
      - "등급이 허용하던 모델을 외부 모델 관리에서 비활성화하면 당월에도 선택지에서 즉시 뺀다. 장애·보안·계약 사유이므로 적용 월 잠금의 예외이며 등급 기록은 바꾸지 않는다. 이미 진행 중인 실행 시도는 시작 시점 설정을 유지하되 새 턴·중단 후 새 시도는 현재 허용 집합을 적용한다(ARCH-040 · 2026-10-01 사용자 승인)"
      - "등급 폐지·통합은 다음 적용 가능한 월부터만 효력을 갖는다. 소속 사용자를 옮길 등급을 지정하기 전에는 그 달 배정을 확정할 수 없다"
    lifecycle:
      - { state: 예정, next: [적용중], note: "다음 달 이후 적용 월 — 배정 확정 전까지 바꿀 수 있다" }
      - { state: 적용중, next: [종료], note: "당월 — 바꾸거나 지울 수 없다" }
      - { state: 종료, next: [], note: "지난 달 — 바꾸거나 지울 수 없다" }
    permissions:
      - "등급 정의와 사용자별 등급 직접 변경: ACT-004"
      - "본인 등급과 선택 가능 모델 조회: ACT-001(본인만)"
    audit: "등급 정의 변경, 신규 등록 시 등급 부여, 사용자별 직접 변경, 신규 일할 배정은 근거·처리자·처리 시각·적용 월을 수정 불가 이력으로 남긴다"
    volume: "사용자 수와 등급 수는 고객사마다 다르며 아직 확인한 값이 없다"
    config:
      - "등급 목록·순위·허용 모델 집합은 admin 데이터로 배포 없이 바꾼다(PRN-06). 적용은 다음 적용 가능한 월부터다(TRM-154)"
    risk: "해당 없음 — 기술적으로 새로 검증할 구성요소가 없다"
    relations:
      depends_on: [REQ-103, REQ-616]
      constrains: [REQ-117, REQ-118, REQ-119]
      conflicts_with: []
      nfr: [NFR-011]
      interfaces: []
    realization:
      features: [FEAT-005, FEAT-015, FEAT-017, FEAT-101]
      screens: [SCR-005, SCR-015, SCR-021, SCR-101]
    examples:
      - { kind: 정상, case: "관리자 김관리의 운영 프롬프트 검토가 2,000토큰을 사용하면 김관리의 운영 사용량과 전체 비용에는 집계하되 Portal 개인 쿼터에서 차감하지 않는다" }
      - { kind: 예외, case: "같은 김관리가 Portal에서 개인 쿼터를 소진한 뒤 새 질의를 보내면 관리자 권한이 있어도 기존 시작 전 쿼터 검사로 차단한다" }
      - { kind: 정상, case: "관리자가 9/10에 김대리를 B→A로 직접 변경하고 사유를 남긴다. 10월 배정이 아직 확정 전이라 10/1부터 A가 적용되고, 9월 한도와 선택 가능 모델은 B 그대로다" }
      - { kind: 정상, case: "가중치 1:2:3:4:5, 인원 50·30·20·10·5, 총 풀 50,000,000이면 가중치 합은 235이고 1급 212,765 · 3급 638,297 · 5급 1,063,829가 배정된다. 버림으로 남은 105는 미배정 계획량이다" }
      - { kind: 정상, case: "인원이 5·10·20·30·50으로 뒤집혀도 가중치 합이 455가 되어 1급 109,890 · 5급 549,450으로 등급 순서가 유지된다" }
      - { kind: 정상, case: "9월 B 등급 개인 기본 한도가 30,000,000이고, 관리자가 9/21에 신규 사용자 이주임을 B로 등록한다. 남은 일수 10일(21~30일) ÷ 30일이므로 10,000,000이 즉시 자동 배정된다" }
      - { kind: 예외, case: "관리자가 9/15에 김대리의 9월 등급을 A로 바꾸려 하면 거부되고, 10월(확정 전) 또는 11월(확정 뒤)부터 적용할 수 있다고 안내한다" }
      - { kind: 예외, case: "관리자가 9/21에 이주임을 B로 잘못 등록했다가 이주임이 질의하기 전에 C로 정정하면, 9월 일할 배정이 C 기준으로 다시 계산된다. 첫 질의 뒤에는 정정이 거부된다" }
    volatility: { level: high, what: "등급 개수·이름·배분 가중치·허용 모델 범위는 고객사마다 다르다. 그래서 코드가 아니라 admin 데이터로 두고, 값은 도입 전 사용 현황 분석(CON-038)으로 정한다" }
    open: []
    maturity: { level: confirmed, at: "2026-09-30", by: "AI 정리", confirmed_by: "사용자 (2026-09-30 REQ-116 최종 정리본 재확정)" }
  - id: REQ-117
    approval_policy: "요청·사람의 검토/책임자 승인 단계는 REQ-601.approval_policy의 해당 업무 설정 사용 시 절차다. 미사용 시 저장자가 전결한 승인 이력으로 반영하며 전체 스냅샷·검증·효력 시점은 유지한다. 혼합 세트·설정 전환·권한 경계도 같은 공통 규칙을 따른다"
    type: functional
    priority: should
    actors: ["ACT-001","ACT-004"]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-28 사용자 결정(확정 뒤 승인은 그다음 달 적용·승급만 요청·대기 1건) · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023)"
    process_step: PRC-12-02
    title: "쿼터 등급 승급 요청·승인"
    detail: "승인 절차 사용 시: 사용자는 portal에서 희망 쿼터 등급과 사유를 제출하고, 운영·비용 관리자는 admin에서 승인 또는 반려와 처리 사유를 기록한다. 승인된 승급은 다음 달 배정 확정(REQ-118) 전에 승인되면 다음 달부터, 확정 뒤에 승인되면 그다음 달부터 개인 기본 쿼터와 주 추론 선택 가능 모델에 적용한다 미사용 시에는 REQ-601의 해당 업무 전결 처리로 전환하며 대상별 효력 시점을 유지한다"
