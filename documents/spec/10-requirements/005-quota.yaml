    detail: "승인 절차 사용 시: 사용자는 이번 달에 필요한 추가 토큰량과 업무 사유를 신청하고, 운영·비용 관리자는 계획 총 풀 대비 일반 배정·미배정 계획량·예외 승인 여부를 확인해 승인 또는 반려한다. 승인된 추가 한도는 즉시 해당 월 개인 한도에 더하며 월말에 만료되고 이월되지 않는다 미사용 시에는 REQ-601의 해당 업무 전결 처리로 전환하며 대상별 효력 시점을 유지한다"
