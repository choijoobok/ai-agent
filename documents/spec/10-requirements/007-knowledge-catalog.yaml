# 영역: 업무 메타데이터·지식
requirements:
# ── 메타데이터와 인증 예제 쿼리 ────────────────────────────
  - id: REQ-301
    type: functional
    priority: must
    actors: [ACT-003]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-09-01
    title: "선별 공개 사실을 수집하고 업무 의미를 검수한다"
    detail: "Hub 카탈로그는 업무 DB/DW 전체 스키마의 사본이 아니라 **고객사가 선택한 공개 데이터 인터페이스(뷰·테이블)** 의 업무 모델이다. 등록된 공개 객체의 **스키마 사실**(타입·PK·유니크·NOT NULL·컬럼 목록)은 권한이 있을 때 자동 수집·비교할 수 있다. **업무 의미**(업무 명칭·설명·의미 유형·값 도메인)는 수기이며 초안은 자동 제안하되 **사람이 검수해야 확정된다.** 업무 자산 관리자는 데이터소스·공개 범위·개발 구현 상세와 업무 관계를 함께 검수해 지식·인증 예제 쿼리의 근거로 삼는다. **정책**(그룹 매핑·마스킹·행 스코프·기본 필터·전송 허용)은 카탈로그 등록부터 수기로 적용하며 변경 이력 대상이다"
    hard_rule: "**Hub는 원본 DB/DW 전체를 수집·대사하지 않는다.** 민감 원본 객체는 등록하지 않으며, 자동 수집은 이미 선택·등록된 공개 객체 밖으로 범위를 넓히지 않는다. 자동 수집이 사람이 넣은 의미·정책을 덮지 않으며 DB 코멘트는 업무 명칭의 초안으로만 쓴다"
    why: "원본 테이블을 모두 노출하면 보안 경계가 무너지고, 복잡한 정형 조회를 뷰로 제공하는 고객사의 업무 모델과도 맞지 않는다. 정확도에 필요한 것은 전체 물리 스키마가 아니라 **검수된 공개 범위의 의미**다"
    note: "등록된 공개 객체의 구조 비교는 보조 신호일 뿐이며, DB/DW 변경이 Hub 공개 범위·업무 의미에 미치는 영향은 업무 자산 관리자가 고객사 변경 근거를 보고 직접 판정한다. **전부 채우려 하지 않는다** — 조회 빈도 상위 중 메타데이터 미완성 목록을 노출한다. 초기 오픈 전 보안 담당자의 최종 승인은 제품 외 검수 절차다. 카탈로그와 정책은 직접 관리하되, 지식 베이스는 REQ-305·REQ-306의 반영 세트 상태 관리를 따른다"
    traces_to: [PRN-10, CON-016, CON-018]
    acceptance: "선택된 공개 인터페이스의 구조 사실은 권한 안에서 수집·비교할 수 있으나 업무 의미·정책은 사람이 검수·확정하며, 등록 범위 밖 원본 객체는 수집·대사·노출되지 않는다. 자동 수집은 확정된 의미와 정책을 덮어쓰지 않는다"
  - id: REQ-302
    type: functional
    priority: must
    actors: [ACT-003]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-09-02
    title: "인증 예제 쿼리 — 직접 실행 경로를 우선한다"
    detail: "**예시 주입** — 질의와 유사한 예제 쿼리를 컨텍스트에 넣어 SQL 생성의 기준으로 삼는다. **직접 실행** — 질의가 예제 쿼리에 충분히 대응되면 LLM 이 SQL 을 새로 쓰지 않고 **파라미터만 채워** 실행을 요청한다"
    hard_rule: "**직접 실행도 SQL 통제 4단계를 건너뛰지 않는다** — 파라미터 값이 조건절을 바꾸므로 검증 없이 실행하면 통제가 무의미해진다. **예제 쿼리라는 이유로 면제되는 통제는 없다**"
    note: "축적 경로는 둘이다 — ① 관리자가 직접 등록 ② **성공한 조회 이력에서 관리자가 승격**. 예제 쿼리는 **등록 시점에 검수**하고, 추출된 **참조 공개 인터페이스는 정형으로 저장**되어 주입 판정과 공개 범위 영향 검수의 근거가 된다"
    why: "자주 쓰이는 질의를 예제 쿼리로 수렴시키면 정확도·조회 부하·검증 부담이 함께 줄어든다"
    acceptance: "관리자가 직접 등록하거나 성공한 조회 이력에서 승격한 인증 예제 쿼리만 검수 후 사용되며, 질의가 충분히 대응될 때도 파라미터 바인딩 뒤 SQL 통제 4단계를 모두 통과해야 직접 실행된다"
  - id: REQ-303
    type: functional
    priority: must
    actors: [ACT-003]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-09-01
    title: "지식과 공개 데이터 인터페이스의 역할 경계 — 참조 링크"
    detail: "**지식 본문에는 물리 테이블·컬럼명과 SQL 을 담지 않는다.** 공개 데이터 인터페이스 하나의 의미는 카탈로그의 업무 명칭·설명이, SQL로 표현되는 예시는 인증 예제 쿼리가 자리다. 지식은 **접근 허용 사용자 그룹**을 명시적으로 매핑하고, 특정 공개 뷰·테이블에 관한 것이면 **참조 인터페이스 링크**(0..N)로 표현한다. 접근 그룹 매핑이 없는 지식은 활성 상태여도 사용자 검색·주입 대상이 아니다"
    why: "Hub가 선택해 공개한 물리명·구조의 원천은 카탈로그 하나다. 다른 자산이 물리명을 자유 텍스트로 품으면 **통제와 변경 검수 밖에서 관리되는 스키마 사본**이 생긴다"
    link_uses: "① 지식 접근 그룹과 참조 인터페이스를 함께 쓰는 컨텍스트 주입 판정 ② **참조 인터페이스 카탈로그의 동반 주입** — 언급된 공개 객체의 스키마 없이 SQL을 쓰는 상황을 만들지 않는다 ③ **수명 관리** — 고객사 변경관리 근거 또는 선택적 구조 변화 경고가 있으면 해당 지식·예제 쿼리의 영향 검수를 남긴다"
    acceptance: "지식 본문에는 물리 테이블·컬럼명·SQL이 자유 텍스트로 저장되지 않고, 지식은 접근 허용 그룹과 공개 인터페이스 관련 0개 이상의 카탈로그 참조 링크를 관리한다. 접근 그룹 또는 참조 인터페이스 판정 하나라도 통과하지 못하면 해당 지식은 컨텍스트에 주입되지 않으며, 변경 영향 검수는 이 링크를 기준으로 대상 자산을 식별한다"
  - id: REQ-304
    type: functional
    priority: must
    actors: [ACT-003]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-09-04
    title: "공개 데이터 인터페이스 변화의 보조 감지와 영향 검수"
    detail: "업무 시스템 유지보수 담당자 또는 고객사 DB/DW 변경관리 절차의 통지·근거를 입력으로 업무 자산 관리자가 Hub 공개 범위 영향을 검수한다. 통지는 고객사 운영에서 정한 이메일·사내 메신저 또는 Hub 공지를 사용하며 Hub가 원천 시스템을 감시하지 않는다. 선택적으로, **이미 등록된 공개 뷰·테이블에 한해** 결과가 나오지 않는 조건의 조회 결과 메타데이터로 컬럼 목록을 비교해 변화 후보를 알릴 수 있다. 구조 변화 후보나 카탈로그의 업무 의미·값 도메인 변경이 생기면, 연결된 지식과 인증 예제 쿼리에 **지식 검토 필요** 상태를 남긴다. 대상은 공개 카탈로그와 이를 참조하는 저장된 조회·인증 예제 쿼리·지식이다"
    limits: "구조 비교는 컬럼 추가·삭제·타입 변경·객체 소멸의 후보만 알릴 수 있다. 컬럼의 **의미 변경**, 뷰의 행 필터·원본 조인 변경, 보안상 등록하지 않은 객체의 변경은 자동 감지할 수 없다. 업무 자산 관리자가 카탈로그의 업무 의미·값 도메인을 고치면 같은 검토 필요 상태를 직접 남긴다. 따라서 구조 비교가 없거나 이상이 없더라도 영향 없음의 자동 판정 근거가 되지 않는다"
    hard_rule: "**Hub는 업무 DB/DW 전체를 대사하거나 카탈로그·지식을 자동 갱신·활성화·비활성화하지 않는다.** 변화 후보와 DB/DW 변경 통지는 업무 자산 관리자의 영향 검수 대상으로만 쓰며, 검토 필요 상태는 사람이 수정 또는 영향 없음을 확인할 때까지 유지한다. 파괴적 변경 뒤 조회가 실패해도 기존 활성 자산을 자동으로 끄지 않고 오류를 기록·운영 담당자에게 알린다. SQL 파서의 스코프 주입·권한 재판정·마스킹은 이 상태와 무관하게 매 요청에 계속 적용한다"
    acceptance: "연결된 공개 인터페이스의 구조 변화 후보 또는 카탈로그 의미·값 도메인 변경이 발생하면 관련 지식·인증 예제 쿼리에 검토 필요 상태가 남고, 사람의 수정 또는 영향 없음 확인 전에는 사라지지 않는다"
    note: "**인라인 값 후보 샘플링은 다른 동작이다** — 실제 데이터를 읽으므로 ① 관리자가 대상 컬럼을 지정해 수동 실행 ② distinct 값 수 상한과 조회 행 상한 적용 ③ **조회 이력에 시스템 조회로 구분해 기록**. **개인정보 컬럼은 샘플링 대상에서 제외한다** — 값을 보여주는 것이 목적인 기능이므로 마스킹으로 해결되지 않는다"
  - id: REQ-305
    type: functional
    priority: must
    actors: [ACT-003, ACT-013]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-09-05
    title: "지식 베이스 반영 요청·승인과 활성 상태 관리"
    detail: "지식 베이스의 신규 등록·수정·삭제와 **접근 허용 그룹·태그·동의어·참조 인터페이스 링크 변경**에는 사유와 근거를 반드시 남긴다. 안정적인 지식 식별자 아래 후보 리비전을 만들며, 활성 지식을 직접 고치지 않는다. 고객사 시스템 관리 정책이 외부 테스트·감수 절차를 요구하면 그 완료 근거를 갖춘 뒤 업무 자산 관리자가 반영 세트에 담아 요청하고, **현재 유효한 승인 메뉴 액션**을 가진 사용자가 근거를 확인해 승인한 경우에만 실제 활성 상태로 바꾼다. 작성자와 승인자가 같은 사람인지 여부는 역할 부여로 운영하며 별도 자기 승인 차단을 두지 않는다"
    hard_rule: "승인 전 지식과 후보 리비전은 AI Agent의 검색·컨텍스트 주입 대상이 아니다. 반려된 요청은 활성 상태로 바뀌지 않으며, 본문·접근 그룹·태그·동의어·참조 링크 전체와 사유·근거·요청자·확인자·상태 전이를 보존한다"
    why: "지식 베이스의 품질 변화는 AI Agent의 응답 품질에 직접 영향을 주므로, 외부 검수와 실제 반영 사이를 사람이 확인 가능한 상태로 끊어야 한다"
    traces_to: [REQ-301, REQ-303]
    acceptance: "지식 신규·수정·삭제는 사유와 근거를 가진 후보 리비전으로만 요청되고, 현재 유효한 승인 권한자가 승인하기 전에는 검색·컨텍스트 주입 대상이 되지 않는다. 반려는 활성 상태를 바꾸지 않고 요청·확인·근거·상태 이력을 보존한다"
  - id: REQ-306
    type: functional
    priority: must
    actors: [ACT-003, ACT-013]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-09-05
    title: "반영 세트 단위 승인·반려와 일괄 활성화"
    detail: "하나 이상의 지식 후보 리비전(본문·접근 그룹·태그·동의어·참조 링크의 전체 세트), 공개 카탈로그 후보 리비전, 인증 예제 쿼리, 관련 지식·스키마 매핑과 변경 사유·근거, 고객사 정책상 필요한 외부 시험·감수 증빙을 반영 세트로 묶는다. 단건 변경도 항목 하나인 세트로 처리할 수 있다. 최종 책임자는 세트 전체를 승인하거나 반려하며, 승인된 세트의 구성 항목만 함께 활성화한다"
    hard_rule: "세트의 일부 항목만 활성화하지 않는다. 기존 활성 리비전과 매핑을 직접 수정하지 않고 후보 리비전에서 변경하며, 대상 지식·카탈로그가 새 리비전으로 활성화되어도 다른 지식의 참조 리비전을 자동 갱신하지 않는다. 승인 메뉴 액션은 역할·개인 예외의 현재 유효 권한으로만 판정하며, 한시 대리인의 역할 유효 기간이 끝나면 승인할 수 없다. 카탈로그·보안 정책의 직접 관리 원칙은 유지하고, 최종 책임자의 승인은 정책 자체가 아니라 세트의 AI 서비스 반영 여부에 한정한다"
    why: "업무 정책 변경은 지식 하나, 관련 지식, 공개 뷰의 의미, 인증 예제 쿼리와 매핑을 함께 바꿀 수 있다. 일부만 서비스에 반영하면 Agent가 서로 다른 근거를 조합해 잘못된 답을 만들 수 있다"
    traces_to: [REQ-301, REQ-303, REQ-304, REQ-305]
    acceptance: "반영 세트는 하나 이상의 후보 리비전·카탈로그·인증 예제 쿼리·매핑·근거를 함께 승인 또는 반려하고, 승인 시 구성 항목만 일괄 활성화된다. 일부 활성화·기존 활성 리비전 직접 수정·다른 지식 참조 리비전의 자동 변경은 발생하지 않는다"
  - id: REQ-307
    type: functional
    priority: must
    actors: [ACT-003]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-09-04
    title: "지식 검토 필요 작업의 별도 조회와 종결"
    detail: "업무 자산 관리자는 지식 검토 필요 자산만 별도 목록에서 조회하고 처리한다. 작업은 변경 통지 또는 감지 근거와 대상 자산의 안정 식별자·검토 당시 활성 리비전을 고정해 `검토 필요 → 검토 중 → 수정 필요 또는 수정 불필요 완료`로 전이한다. 수정 필요이면 기존 반영 세트 요청·승인 절차로 전환하고, 수정 불필요이면 근거·판정 사유·처리자·시각을 검토 완료 이력으로 남긴 뒤 같은 리비전을 유지한다"
    hard_rule: "수정 불필요 검토 완료는 지식 내용·활성 상태를 바꾸지 않으므로 후보 리비전이나 반영 세트를 만들지 않는다. 현재 유효한 검토 완료 메뉴 액션을 가진 업무 자산 관리자가 근거와 사유를 남겨 종결하며, 동일 자산에 열린 검토 작업이 있으면 새 변경 근거를 그 작업에 연결해 중복 작업을 만들지 않는다. 근거가 불충분하면 완료로 종결하지 않는다"
    acceptance: "검토 필요 목록에서 수정 불필요로 종결한 자산은 리비전이 바뀌지 않고도 검토 근거와 처리 이력이 조회되며, 수정 필요 자산은 반영 세트 승인·활성화 전까지 검토 필요 상태가 유지되고 활성화된 결과 리비전과 함께 검토 완료로 종결된다"
  - id: REQ-308
    type: functional
    priority: must
    actors: [ACT-001, ACT-003]
    process_step: PRC-02-01
    title: "AI 사용 안내 지식의 관리와 대화형 안내"
    detail: "업무 자산 관리자는 AI Hub의 사용 목적·가능한 업무·질의 작성 방법·안전한 사용 한계·접근 가능 데이터 확인 방법을 **사용 안내 지식**으로 관리한다. portal의 새 대화 화면은 agent가 제공한 고정 계약 문구로 AI에게 가능한 일을 물어보도록 안내한다. 사용자가 AI의 기능·사용 방법·질의 예시를 물으면 agent는 현재 활성인 사용 안내 지식만 검색해 답한다. 지식 검색이 무결과이면 agent는 해당 사용자에게 허용된 활성 지식의 태그를 중복 제거·정렬해 안내하고, 그 범위에서 질문할 수 있다고 답한다. 답변에는 사용자의 현재 접근 가능 데이터소스와 업무 범주를 짧게 요약할 수 있으나, 권한 밖 객체·물리 테이블·컬럼은 표시하지 않는다"
    hard_rule: "초기 안내 문구는 새 턴이나 모델 호출을 만들지 않되 portal이 자체 생산하지 않고 agent 계약에서 받는다. 사용 안내 지식의 후보·반려 리비전은 검색·답변에 쓰지 않는다. 무결과 태그 안내는 활성 지식의 허용 그룹 판정을 통과한 태그만 사용하며 지식 제목·본문·문서 수·전체 목록을 포함하지 않는다. 사용자가 모든 지식의 열거·본문·일괄 요약을 요구하면 전사 공통 프롬프트 규칙에 따라 구체적 업무 또는 사용법 질문을 요청한다. 사용자의 접근 가능 데이터와 지식 태그 상세 목록은 SCR-107이 RM-P2에 제공할 때까지 대화에서 요약만 하고, 상세 목록이 제공된 뒤에만 해당 화면으로 안내한다"
    why: "사용자가 첫 질문을 어떻게 시작할지 모르면 등록된 업무 범위 밖 질의를 반복하거나 기능을 쓰지 못한다. 정적 안내와 승인된 지식 기반 답변을 분리하면 안내 문구는 즉시 보이고, 사용법의 실제 내용은 지식 반영 절차 아래에서 최신으로 관리된다"
    source: "2026-09-21 사용자 결정"
    roadmap: RM-P1
    traces_to: [REQ-101, REQ-103, REQ-112, REQ-305]
    acceptance: "새 대화 화면은 AI에게 가능한 일을 물어보라는 안내를 모델 호출 없이 표시한다. 사용자가 사용법을 물으면 활성 사용 안내 지식에 근거한 답변과 접근 가능 업무 범주·데이터소스 요약만 받으며, 무결과이면 허용된 지식 태그의 중복 제거·정렬 목록만 받는다. 전체 지식 열거 요청에는 문서·제목·본문·건수가 나타나지 않고 구체적 업무 또는 사용법 질문을 요청하며, 권한 밖 객체와 물리명은 어떤 응답에도 나타나지 않는다"
