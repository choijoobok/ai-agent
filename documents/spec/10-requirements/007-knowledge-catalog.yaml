    maturity: {"level":"confirmed","at":"2026-10-22","by":"AI — 사용자 명시 확정 반영","confirmed_by":"사용자 (2026-10-22 공통 변경 요청·승인 원칙과 업무별 적용 경계·예외·검증을 포함한 REQ-601·305·306·609·117·119 여섯 전체 보완본 확정 및 커밋·푸시 요청). 단계 게이트·소스 구현 승인은 별도다."}

  - id: REQ-306
    approval_policy: "요청·사람의 검토/책임자 승인 단계는 REQ-601.approval_policy의 해당 업무 설정 사용 시 절차다. 미사용 시 저장자가 전결한 승인 이력으로 반영하며 전체 스냅샷·검증·효력 시점은 유지한다. 혼합 세트·설정 전환·권한 경계도 같은 공통 규칙을 따른다"
    type: functional
    priority: must
    actors: ["ACT-003","ACT-013"]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-30 사용자 결정(동일 지식의 승인 대기 중 신규 요청 차단을 반영 세트 간에도 적용, 조사·검토 근거를 가진 변경 요청과 반영 세트 승인을 하나의 절차로 관리) · 2026-09-30 사용자 결정(예제·카탈로그 단독 변경도 요청·기술 검토·최종 승인, 동일인 겸임 허용·결재선 설정 제외, 세트 스냅샷·승인 시 최신성 검사) · 2026-10-06 사용자 정정: 공통 태그 텍스트의 단독 변경에서는 연결된 지식이 영향 확인 대상이며 수정 대상이 아니다(REQ-607) · 2026-10-06 사용자 추가 확정: 태그/지식 변경은 상호 차단하지 않고 영향 목록·태그 텍스트 차이만으로 자동 반려하지 않으며 REQ-607의 실제 변경 대상 버전/태그 ID 유효성 검증을 적용한다 · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023) · 2026-10-08 사용자 보완 요청: 지식 연결 도구의 승인 전 계약 변경 검증·당시 참조 버전 재현을 보완하고 전체 카드 재확정 대기 · 2026-10-08 사용자가 변경된 요구사항 전체의 확정·커밋·푸시를 명시 요청하여 보완본을 confirmed로 기록"
    process_step: PRC-09-05
    title: "반영 세트 단위 기술 검토·최종 승인·반려와 일괄 활성화"
    detail: "도구(REQ-612)·업무 API(REQ-608)의 전체 등록 후보와 허용 그룹도 반영 세트 대상으로 포함한다. 승인 절차 사용 시: 지식 후보 리비전(본문·접근 그룹·태그 ID 매핑·참조 링크 전체), 공개 카탈로그 후보, 인증 예제 후보, 상호 매핑 중 하나 이상의 변경 항목과 사유·근거·필요한 외부 시험 증빙을 반영 세트로 묶는다. 지식 본문 변경 없이 예제 또는 카탈로그만 있는 단건 세트도 허용한다. 기술 검토가 완료된 뒤 최종 책임자는 세트 전체를 승인하거나 반려하며 승인된 구성만 함께 활성화한다. 공통 태그 후보의 반영 세트와 연결 지식의 영향 확인 경계는 REQ-607을 따른다 미사용 시에는 REQ-601의 해당 업무 전결 처리로 전환하며 대상별 효력 시점을 유지한다"
    hard_rule: "승인 절차 사용 시 단계와 권한: 세트의 일부 항목만 활성화하지 않는다. 기존 운영 리비전과 매핑을 직접 수정하지 않고 후보로 변경한다. 기술 검토 완료 전 최종 승인, 승인 전 운영 반영, 검토한 스냅샷의 대기 중 교체를 금지한다. 단계별 유효 권한이 있으면 동일인이 모두 처리할 수 있으나 단계는 생략하지 않는다(REQ-305). 지식·예제·카탈로그의 접근 허용 그룹은 세트 대상이다. 그 밖의 직접 관리 정책·사용자 소속 그룹과 고객사 물리 DB 변경은 세트 반영으로 수정하지 않는다(REQ-103) 승인 절차 미사용 시에는 REQ-601의 전결 규칙을 따른다. 운영본 직접 덮어쓰기 금지·기준 버전 검증·전체 스냅샷·일괄 반영은 두 방식 모두 유지한다"
    why: "업무 정책 변경은 지식 하나, 관련 지식, 공개 뷰의 의미, 인증 예제 쿼리와 매핑을 함께 바꿀 수 있다. 일부만 서비스에 반영하면 Agent가 서로 다른 근거를 조합해 잘못된 답을 만들 수 있다"
    traces_to: ["REQ-301","REQ-303","REQ-304","REQ-305"]
    acceptance: "승인 절차 사용 시: 단독 예제·카탈로그 변경을 포함한 세트는 기술 검토 완료 뒤 전체 최종 승인 또는 반려하며 승인된 구성 전체만 일괄 반영한다. 실제 변경 대상의 기준 운영본 또는 REQ-303의 예제·카탈로그·업무 API·커스텀 도구 계약 참조 버전이 최신이 아니면 차이와 사유를 남겨 전체 반려하고 재요청하게 한다. 태그/지식 변경의 영향 목록·텍스트 차이와 최소 유효성 검증은 REQ-607을 따른다. 요청·검토·승인 당시의 내용과 매핑은 보존하며 일부 반영·자동 최신본 치환은 발생하지 않는다 미사용 시에는 REQ-601의 해당 업무 전결 처리로 전환하며 대상별 효력 시점을 유지한다 지식에 연결된 도구 계약이 요청 후 승인 또는 전결 반영 전에 변경·폐기돼 참조 검증에 실패하면 옛 후보를 새 계약으로 자동 치환하거나 부분 반영하지 않는다."
    request_guard: "REQ-601.request_integrity의 대상별 단일 미종결 요청·제출본 고정·취소 후 재요청을 세트의 모든 실제 변경 대상에 적용한다. 하나라도 충돌하면 전체 접수를 거부하고 부분 요청하지 않는다. 참조만 하는 외부 자산과 독립된 변경은 점유하지 않으며 태그·지식의 경계는 REQ-607을 따른다"
    evidence: "반영 세트는 REQ-305의 조사·예방적 검토 또는 일반 변경 근거를 연결한다. 요청 스냅샷, 기술 검토 결과, 최종 승인/반려 당시 후보·참조 매핑과 최신성 검사 결과, 실제 반영 결과를 각각 보존한다. 지식 직접 카탈로그·예제 링크·예제별 카탈로그 매핑과 각각의 당시 버전을 보존해 REQ-303의 합산 목록을 재현한다. 과거 요청 화면은 당시 버전을 표시하며 현재 버전은 차이 비교 정보로만 표시한다. 반려 후 재요청은 이전 이력을 덮어쓰지 않는다. 공통 태그 요청의 당시 정의·버전·연결 지식 목록 보존은 REQ-607을 따른다. 요청 당시 지식 리비전·매핑을 보존하고 승인 당시 확인한 현재 목록과 차이를 별도 스냅샷으로 남기는 태그 요청의 근거 재현은 REQ-607을 따른다 전결에서는 같은 저장의 후보/요청 근거와 실제 전결·검증 결과를 보존하며 하지 않은 사람의 검토 결과를 생성하지 않는다(REQ-601) 지식의 업무 API·커스텀 도구 링크·매핑별 사용 설명과 당시 참조 계약 버전·검증 근거도 함께 보존해 과거 후보와 승인 근거를 재현한다."
    catalog_boundary: "2026-09-30 사용자 결정: Hub 카탈로그의 구조·업무 의미·값 도메인·조인 등 메타데이터 자체를 후보로 작성하고 단독 변경도 기술 검토·최종 승인 후 반영한다. 단순 서비스 참조 구성에만 승인을 한정하지 않는다. 지식·예제·카탈로그의 접근 허용 그룹(테이블 그룹·컬럼별 그룹 예외 포함)은 내용·참조 매핑과 함께 후보·스냅샷·승인·반영 대상으로 관리한다. 사용자 소속 그룹·고객사 물리 DB와 REQ-103의 그 밖의 직접 관리 정책은 이 세트 승인·복원으로 덮어쓰지 않는다"
    version_guard: "책임자 승인 또는 전결 반영 시 서버가 변경 대상의 기준 운영본과 참조만 하는 예제·카탈로그·업무 API·커스텀 도구 계약 버전을 현재의 최종 사용 가능 버전과 비교한다. 미완성 초안은 최신 운영본으로 세지 않는다. 같은 세트 안에서 새로 만드는 후보는 세트 내 검증된 후보 버전을 참조하되 그 기준 운영본이 달라지지 않았는지 검사한다. 불일치·참조 폐기·정합성 결손이면 전체 반려하고 수정·재검토·재요청한다. 승인 후 반영까지 검사 결과가 무효화되지 않게 보호하며 분리 처리 중 불일치가 생겨도 부분 반영하지 않고 반려·재요청으로 처리한다. 태그 단독 요청의 영향 지식 리비전·목록 변화와 지식 매핑 요청의 참조 태그 텍스트 변화는 이 예제·카탈로그 참조 최신성 검사로 자동 반려하지 않는다. 실제 변경 대상의 기준 버전·태그 ID 연결 가능 상태 검증과 당시 지식 리비전 보존은 REQ-607을 따른다"
    shared_impact: "공유 예제·카탈로그를 변경하면 카탈로그→지식의 직접 참조와 카탈로그→예제→지식의 간접 참조를 모두 추적해 활성 지식·예제와 매핑의 영향 범위를 확인한다. 필요한 내용 보완과 참조 버전 전환을 같은 세트에 포함해 반영 후 구버전 참조가 남지 않게 한다. 본문 변경이 불필요하면 본문 수정은 강제하지 않되 정합성 검토 근거와 새 참조 버전 매핑을 남긴다. 예제의 카탈로그 매핑을 지식의 직접 매핑으로 복사하지 않는다. 같은 카탈로그의 직접·간접 참조 버전이 다르면 정합성 결손으로 해소하며 임의로 한 버전을 선택하지 않는다. 검토 없이 다른 자산의 매핑을 자동 갱신하지 않으며 폐기 대상의 남은 참조는 세트 안에서 해소한다"
    summary: "관련 변경 후보를 하나의 반영 세트로 기술 검토·최종 승인하고 승인한 구성만 함께 활성화한다. 단독 예제·카탈로그 변경도 같은 절차이며 당시 직접·간접 참조 버전을 보존한다"
    intent:
      problem: "공유 자산 일부만 반영하거나 승인 사이 참조가 바뀌면 서로 다른 근거로 잘못된 답을 만들 수 있다"
      goal: "검토한 전체 구성과 실제 운영 구성의 일관성을 유지한다"
      not: ["고객사 물리 DB 변경을 Hub가 승인·동기화하는 절차가 아니다", "참조 합산을 위해 예제 매핑을 지식에 복사하는 기능이 아니다"]
    goal_trace: ["GOAL-1","SUC-02"]
    decider: "제품 오너(사용자)"
