  - id: REQ-307
    approval_policy: "요청·사람의 검토/책임자 승인 단계는 REQ-601.approval_policy의 해당 업무 설정 사용 시 절차다. 미사용 시 저장자가 전결한 승인 이력으로 반영하며 전체 스냅샷·검증·효력 시점은 유지한다. 혼합 세트·설정 전환·권한 경계도 같은 공통 규칙을 따른다"
    type: functional
    priority: must
    actors: ["ACT-003"]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-30 사용자 결정(고객사 변경 통지의 예방적 영향 검토와 변경 요청 근거 연결, 조사 진단의 중복 검토는 필수 아님) · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023)"
    process_step: PRC-09-04
    title: "지식 검토 필요 작업의 별도 조회와 종결"
    detail: "고객사의 스키마·뷰 필터·집계 기준·기준정보·업무 의미 변경 통지를 받으면, 겉으로 오류가 없어도 잘못된 데이터 제공·작업 수행을 예방하기 위해 업무 자산 관리자가 영향 검토 작업을 등록한다. 변경 통지·적용 시점·대상 자산의 안정 식별자와 검토 당시 활성 리비전을 근거로, 관련 지식·인증 예제·조회와 카탈로그의 영향 및 보완 방향을 확인한다. 상태는 `검토 필요 → 검토 중 → 수정 필요 또는 수정 불필요 완료`로 전이한다. 수정 필요이면 작업을 참조한 REQ-305·306의 변경 요청으로 연결하고, 수정 불필요이면 근거·사유·처리자·시각을 남겨 같은 리비전으로 종결한다"
    hard_rule: "수정 불필요 검토 완료는 지식 내용·활성 상태를 바꾸지 않으므로 후보 리비전이나 반영 세트를 만들지 않는다. 현재 유효한 검토 완료 메뉴 액션을 가진 업무 자산 관리자가 근거와 사유를 남겨 종결하며, 동일 자산에 열린 검토 작업이 있으면 새 변경 근거를 그 작업에 연결해 중복 작업을 만들지 않는다. 근거가 불충분하면 완료로 종결하지 않는다"
    acceptance: "실행 오류가 없어도 고객사 변경 통지로 검토 작업을 등록하고 영향 자산·근거·보완 방향을 남길 수 있다. 수정 불필요는 근거와 처리 이력을 남기고 리비전 변경 없이 종결한다. 수정 필요는 작업을 참조한 변경 요청으로 이어지며 요청 등록·승인만으로 완료하지 않는다. 검토 범위의 필요한 변경이 실제 반영됐음을 확인한 뒤 결과 리비전·적용 시각·범위와 함께 완료한다. 반려·반영 실패이면 미해결로 남는다"
    boundary: "이 작업은 변경 필요성을 진단하는 예방적 영향 검토이며 REQ-305의 제출된 세트에 대한 기술 검토 단계와 다르다. 조사에서 수정 방향을 이미 진단했다면 예방적 검토 작업은 필수가 아니지만 승인 절차 사용 시 변경 요청의 기술 검토는 생략하지 않는다. 추가 영향 검토가 필요하거나 기존 작업이 관련되면 조사와 함께 요청에 참조한다. 카탈로그·예제 변경은 세트에 포함하고 REQ-103의 직접 관리 대상에 한해 기존 변경 이력을 연결한다. 승인 절차 미사용 시 전결은 REQ-601을 따른다"
    evidence: "변경 통지 출처·내용·예정 또는 실제 적용 시점, 영향 자산·검토 당시 버전, 영향 판정·수정 또는 수정 불필요 근거, 연결 변경 요청·직접 관리 조치 이력, 결과 리비전·처리자·시각을 추적한다. 정상 실행이나 구조 비교 이상 없음만으로 업무 의미의 영향 없음을 단정하지 않는다"
    summary: "오류가 없어도 고객사 변경 통지의 영향을 검토하고 수정 필요 여부와 근거를 남긴다. 수정 필요 작업은 필요한 조치가 실제 반영됐음을 확인한 뒤 완료한다"
