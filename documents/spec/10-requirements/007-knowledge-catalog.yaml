      - "등록 경로·검수·두 활용 방식은 본문의 detail·note를 따른다"
      - "예제의 실행 대상은 Hub 데이터소스 내부 식별자 한 개로 명시한다. DB/카탈로그명·DB 스키마명·물리 참조는 REQ-301을 따르며, REQ-603의 동일 연결로 접근 가능한 여러 DB·스키마의 등록 공개 객체를 하나의 SQL에서 사용할 수 있다. DB·스키마마다 별도 예제/데이터소스를 만들도록 강제하거나 SQL과 별개인 사용 DB/스키마 허용 목록·권한 매핑을 수동 관리하지 않는다"
      - "등록·수정하는 예제의 해당 후보 SQL에서 사용하는 공개 테이블·뷰를 추출하고 REQ-301의 DB/카탈로그·필요 서버 한정자를 포함한 전체 물리 식별로 중복 제거해 해당 인증 예제 후보에 카탈로그 식별자·버전을 자동 매핑한다. 별칭·임시 질의 이름은 실제 객체와 구분하며 공개 뷰 내부의 비공개 원본 테이블까지 자동 수집하지 않는다. 노출 허용 그룹을 매핑한다(FEAT-023)"
      - "참조 추출 실패·불확실성이나 카탈로그 미등록·식별 불가 객체를 누락으로 표시한다. 초안 저장은 허용하지만 해결되지 않은 참조를 완전한 목록으로 간주하거나 운영에 반영하지 않는다. 미등록 객체는 공개 범위 선정·등록·검수를 요구하며 자동 등록·공개하지 않는다. 같은 반영 세트의 검토 대상 카탈로그 후보를 연결할 수 있으며 버전 검사는 REQ-306을 따른다"
      - "예제 SQL 또는 실행 데이터소스 수정 시 해당 예제 후보의 카탈로그 매핑을 다시 추출·대조한다. 지식에 예제를 연결해도 예제의 매핑을 지식 직접 매핑에 복사하지 않는다. 지식은 예제와 카탈로그를 각각 독립적으로 연결하며 조회 시 REQ-303에 따라 합산한다. 후보·운영본·연결 지식의 영향 검토와 반영은 REQ-305·306을 따른다"
      - "개인 저장 조회 승격은 REQ-205를 따르며 다른 사용자의 즐겨찾기·위젯을 만들지 않는다"
      - "직접 실행은 SQL 재작성 없이 파라미터를 채우는 경로이며 SQL 통제 4단계를 생략하지 않는다"
      - "2026-09-30 사용자 결정: 예제의 등록·수정·폐기·복원과 매핑 변경은 단독 변경도 REQ-305·306의 반영 세트로 요청한다. 함께 바뀌어야 하는 지식·카탈로그는 같은 세트에 묶으며 검수·승격만으로 운영에 반영하지 않는다"
    exceptions:
