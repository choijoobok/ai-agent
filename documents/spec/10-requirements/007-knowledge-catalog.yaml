    examples:
      - { kind: 정상, case: "공개 출고 뷰에서 컬럼 삭제 후보를 발견하면 참조 지식·예제를 검토 목록에 올리고 담당자가 변경 근거를 확인한다" }
      - { kind: 예외, case: "뷰 컬럼은 그대로지만 취소 건 제외 기준이 바뀌면 구조 비교로 알 수 없으므로 고객사 변경 통지를 근거로 검수한다" }
    volatility:
