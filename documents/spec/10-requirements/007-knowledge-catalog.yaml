      - "반영 실패·동시 변경에도 일부만 운영에 남기지 않는다"
    lifecycle: "승인 절차 사용 시: 후보 → 요청 → 기술 검토 → 최종 승인 → 전체 반영. 취소·반려 후에는 REQ-601.request_integrity에 따라 이전 건을 보존하고 새 요청으로 수정·재검토한다. 미사용 시에는 REQ-601의 해당 업무 전결 처리로 전환하며 대상별 효력 시점을 유지한다"
    permissions:
      - "승인 절차 사용 시: 단계별 유효 액션 권한을 따르며 동일인 겸임은 허용한다(REQ-305)"
      - "승인 절차 사용 시: 최종 승인 권한만으로 기술 검토를 대신할 수 없다"
      - "미사용 시 작성/변경 액션 권한자의 저장 건 전결과 이력은 REQ-601을 따른다"
    audit: "승인 절차 사용 시: evidence의 단계별 스냅샷·검사 결과·처리자·시각·사유·실제 반영 결과를 보존한다 미사용 시에는 REQ-601의 실제 전결 처리·설정 값/버전·검증/반영 이력을 남긴다"
    volume: "세트에는 한 개 이상의 변경 항목을 담는다. 변경 대상 자산마다 처리 중 요청은 최대 한 건이다"
    config: "업무별 승인 절차 사용 여부는 REQ-601·614를 따른다. 사용 시 역할·개인 권한과 유효 기간 및 기존 단계 순서를 적용하고 사용자별 결재선 설정은 제공하지 않는다"
    risk: "공유 자산의 간접 영향 누락과 승인 검사 후 반영 사이의 동시 변경을 방어해야 한다"
