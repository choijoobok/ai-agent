      - {"kind":"예외","case":"승인 절차 사용 시: 기술 검토 권한만 가진 사용자가 검토 완료 후 최종 승인하려 하면 거부한다. 같은 사람 허용은 권한 생략을 뜻하지 않는다"}
      - {"kind":"정상","case":"승인 절차 사용 시: 카탈로그 X의 내용은 유지하고 접근 그룹을 영업에서 영업·회계로 바꾸면 내용·그룹·참조 매핑 전체의 후보 스냅샷으로 요청한다. 기술 검토와 최종 승인·반영 전에는 회계 그룹에 새 접근을 허용하지 않는다"}
      - {"kind":"예외","case":"승인 절차 사용 시: 카탈로그 접근 그룹만 복원할 때도 승인 절차를 거치며 과거 스냅샷에 함께 보이는 마스킹·전송 정책을 되돌리지 않는다. 사용자 한 명을 회계 그룹에 추가하는 작업은 자산 변경 요청이 아니라 REQ-609의 별도 부여 승인이다"}
