    priority: must
    actors: ["ACT-003","ACT-013"]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-30 사용자 결정(동일 지식에 승인 대기 요청이 있으면 신규 변경 승인 요청 차단, 오류·품질 조사 또는 예방적 지식 검토를 변경 요청의 근거로 연결) · 2026-09-30 사용자 결정(예제·카탈로그 단독 변경도 요청·기술 검토·최종 승인, 동일인 겸임 허용·결재선 설정 제외, 세트 스냅샷·승인 시 최신성 검사) · 2026-10-06 사용자 정정: 태그 자체 변경과 지식 태그 ID 매핑 변경을 구분하며 공통 태그 단독 요청도 기존 승인 화면에서 처리한다(REQ-607) · 2026-10-06 사용자 추가 확정: 태그/지식 변경 상호 차단 제외와 실제 변경 대상별 중복 요청 제한·당시 지식 리비전 보존은 REQ-607을 따른다 · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023) · 2026-10-08 사용자 추가 지시: API·커스텀 도구의 매핑별 사용 설명 변경을 지식 후보·스냅샷에 포함하고 전체 카드 재검토 · 2026-10-08 사용자가 변경된 요구사항 전체의 확정·커밋·푸시를 명시 요청하여 보완본을 confirmed로 기록"
    process_step: PRC-09-05
    title: "지식 변경 요청·승인과 활성 상태 관리"
    detail: "도구(REQ-612)와 업무 API(REQ-608)의 내부 관리 후보도 같은 요청 화면·단계와 반영 세트를 사용한다. 승인 절차 사용 시: 지식 본문·접근 허용 그룹·태그 ID 매핑, 인증 예제, 스키마 카탈로그 메타데이터와 각 자산의 접근 허용 그룹·상호 참조 매핑의 신규·수정·삭제를 사유·근거가 있는 후보 리비전으로 작성한다. 지식 변경 없이 예제·카탈로그만 변경해도 같은 반영 세트로 요청한다. 요청 후 기술 검토 권한자가 검토를 완료해야 최종 승인 권한자가 승인할 수 있고, 승인된 세트만 함께 운영에 반영한다. 요청자·기술 검토자·최종 승인자의 동일인 여부로 제한하지 않으며 각 단계의 현재 유효 메뉴 액션 권한으로 판정한다. 공통 검색 태그의 단독 후보·스냅샷·연결 지식 영향 조회와 반영 범위는 REQ-607을 따른다 미사용 시에는 REQ-601의 해당 업무 전결 처리로 전환하며 대상별 효력 시점을 유지한다"
    hard_rule: "승인 절차 사용 시 단계와 권한: 승인 전·반려된 지식·인증 예제·카탈로그 후보와 매핑은 AI 운영에 사용하지 않는다. 초안 저장은 허용하되 기존 운영본을 직접 덮어쓰지 않는다. 요청·기술 검토·최종 승인 또는 반려·반영의 내용과 근거·처리자·시각을 각각 보존한다. 권한 겸임은 허용하지만 기술 검토 단계를 생략하거나 승인 권한만으로 검토 권한을 얻지는 않는다. 태그 후보의 운영 검색 제외와 지식 매핑 유지 경계는 REQ-607을 따른다 승인 절차 미사용 시에는 REQ-601의 전결 규칙을 따른다. 운영본 직접 덮어쓰기 금지·기준 버전 검증·전체 스냅샷·일괄 반영은 두 방식 모두 유지한다"
    why: "지식 베이스의 품질 변화는 AI Agent의 응답 품질에 직접 영향을 주므로, 외부 검수와 실제 반영 사이를 사람이 확인 가능한 상태로 끊어야 한다"
    traces_to: ["REQ-301","REQ-303"]
    acceptance: "승인 절차 사용 시: 지식·인증 예제·카탈로그·매핑의 단독 또는 복합 변경은 요청 후 기술 검토 완료를 거쳐 최종 승인된 세트만 반영된다. 세 권한을 가진 한 사람이 순서대로 모두 처리할 수 있지만 검토 미완료나 권한 부족이면 승인을 거부한다. 요청·승인 당시 스냅샷을 보존하고 기준본·참조 최신성 불일치는 REQ-306에 따라 반려·재요청한다. 동일 변경 대상의 처리 중 중복 요청과 동시 접수는 차단하며 반려는 운영본을 바꾸지 않는다 미사용 시에는 REQ-601의 해당 업무 전결 처리로 전환하며 대상별 효력 시점을 유지한다 API·커스텀 도구의 매핑별 사용 설명만 변경한 경우도 지식 후보 변경으로 처리하고 링크와 설명을 같은 요청·검토·승인 또는 전결 스냅샷에 보존한다(REQ-303)."
    roadmap: RM-P1
    summary: "지식·인증 예제·카탈로그·매핑을 단독 또는 함께 요청하고 기술 검토 완료 뒤 최종 승인해 일괄 반영한다. 승인 절차 사용 시 단계는 고정하되 결재선 설정과 동일인 제한은 두지 않으며 역할·메뉴 권한으로 한 사람의 전 단계 처리를 허용한다 업무별 절차 사용/전결은 REQ-601을 따른다"
    intent:
      problem: "활성 지식을 바로 고치면 검수 전 내용이 AI 답변에 섞이고 변경 근거를 복원할 수 없다"
      goal: "작성·검수·서비스 반영을 분리하고 승인한 전체 버전만 사용한다"
      not: ["작성자와 승인자가 반드시 다른 사람이어야 하는 이중 승인 제도가 아니다", "고객사 외부 시험·감수 절차를 Hub가 대신 수행하는 기능이 아니다"]
    goal_trace: ["GOAL-1","SUC-02"]
    decider: "제품 오너(사용자)"
    preconditions:
      - "업무 의미와 참조 인터페이스·변경 전후·영향 근거가 요청에 포함된다(REQ-301·303)"
      - "고객사 정책상 필요한 외부 시험·감수 근거를 갖추고 요청·기술 검토·최종 승인 액션 권한을 운영한다"
    data:
      - { item: "안정 지식 ID·후보 리비전 전체 내용·접근 그룹·태그 ID 매핑·참조 링크", origin: "업무 자산 관리자", sensitivity: "그룹 제한 업무 지식", retention: "전체 불변 스냅샷과 변경 이력 보존, 구체 기간은 P3 설계" }
      - { item: "신규·수정·삭제 사유·검수 근거·요청자·승인 또는 반려 결과", origin: "작성자와 승인 권한자", sensitivity: "내부 운영 근거", retention: "요청·확인·상태 전이 이력 보존" }
      - { item: "근거 조사·검토 작업 참조와 요청 시 진단·영향 범위·변경 전후 내용", origin: "REQ-115의 조사 또는 REQ-307의 영향 검토와 변경 작성자", sensitivity: "내부 운영 근거, 원본 열람 권한 별도 적용", retention: "승인 판단에 사용한 근거와 참조·연결 변경 이력 보존" }
      - { item: "지식의 직접 카탈로그·예제 링크와 예제별 카탈로그 매핑·버전을 포함한 전체 요청 스냅샷과 기술 검토·최종 승인/반려 당시 스냅샷·버전 검사 결과", origin: "요청자·기술 검토자·최종 승인자와 서버 검사", sensitivity: "내부 기술·업무 근거", retention: "단계별 처리자·시각·결과·사유와 재요청 연결을 불변 이력으로 보존" }
    business_rules:
      - "후보 리비전 대상 필드와 승인 전 검색 제외는 본문의 detail·hard_rule을 따른다"
      - "승인 절차 사용 시: 지식의 업무 API·커스텀 도구 매핑과 매핑별 사용 설명(용도·사용 조건·입력 확보 절차) 변경도 전체 후보 리비전과 단계별 요청·검토·승인 스냅샷에 포함한다. API 공통 입력 가이드·계약 자체의 관리 원천과 기존 갱신 절차는 REQ-608을 따른다"
      - "태그 자체의 변경과 지식 태그 ID 매핑 변경의 소유·스냅샷·승인 대상 경계는 REQ-607을 따른다"
      - "사유·근거와 고객사 정책상 필요한 외부 검수 증빙이 없으면 반영 요청으로 전환하지 않는다(PRC-09-05)"
      - "단건도 반영 세트로 요청하며 세트 승인·반려·일괄 활성화는 REQ-306이 갖는다"
      - "오류·품질 조사에서 진단한 변경은 조사 건을, 고객사 변경 통지의 영향 검토에서 도출한 변경은 지식 검토 작업을 참조해 요청한다. 같은 변경에 두 근거가 모두 있으면 함께 연결한다. 신규 등록·일반 개선은 자체 사유·근거로 요청할 수 있으며 조사를 억지로 생성하지 않는다"
      - "승인 절차 사용 시: 변경 요청은 반영 세트 하나를 기술 검토 후 최종 승인받는 업무 건이다. 자산별로 중복 결재하지 않으며 기술 검토는 최종 승인과 구분되는 선행 단계다. 조사·검토 또는 자산 화면에서 요청으로 진입하고 독립 요청 목록에서 대상·변경 전후·사유·연결 근거·처리 상태를 조회한다"
      - "승인 절차 사용 시: 2026-09-30 사용자 결정: 요청 → 기술 검토 → 최종 승인 → 반영의 순서를 고정한다. 사용자별 결재선·임의 다단계 결재 설정은 두지 않는다. 기술 담당자는 예제·카탈로그·매핑·관련 지식의 정합성과 시험 근거를 확인하고 검토 완료 또는 사유 있는 반려를 기록한다. 기술 검토 완료 건만 최종 승인 대기로 전환한다"
      - "승인 절차 사용 시: 요청자·기술 검토자·최종 승인자가 서로 다른 사람이어야 한다는 제한과 자기 검토·자기 승인 금지는 두지 않는다. 각 단계의 유효 액션 권한이 있으면 같은 사람이 전부 처리하되 검토 완료와 최종 승인을 각각 기록한다. 최종 승인자는 기술 검토 근거와 업무 영향·반영 범위를 확인한다"
      - "승인 절차 사용 시: 2026-09-30 사용자 확정: 지식·인증 예제·카탈로그는 전체 내용·접근 허용 그룹·참조 매핑과 버전을 한 세트의 요청·검토·승인 스냅샷으로 보존한다. 접근 그룹만 변경해도 같은 절차를 따르며 내용과 그룹 매핑을 함께 반영한다. 기술 검토에서 접근 범위 적절성을 확인하고 동일한 최종 승인자가 세트 전체를 승인하며 별도 보안 결재 단계를 추가하지 않는다. 사용자 소속 그룹 추가·제외와 그 밖의 정책 경계는 REQ-103을 따른다"
      - "조사 담당자는 진단을 기록하고 요청 작성 담당자를 배정·연결한다. 후보 작성·반영 요청은 해당 메뉴 액션 권한이 있는 업무 자산 관리자(ACT-003)가 수행한다. 품질 담당자가 그 권한도 보유하면 조사에서 바로 등록할 수 있으나 조사 담당이라는 이유로 변경 권한을 자동 부여하지 않는다"
      - "승인자는 요청 시점의 진단·영향 범위와 검수 근거를 확인한다. 원 조사·검토와 요청의 양쪽에서 연결과 상태를 조회하되, 연결만으로 내부 증거 열람 권한을 얻지 않으며 권한 밖 원본을 복제해 우회하지 않는다"
      - "반영 완료 시 결과 리비전·적용 시각·범위를 연결 근거에 남긴다. 지식 검토 완료는 REQ-307, 조사 완료·신고 회신은 REQ-115·110을 따르며 한쪽 상태를 다른 쪽에 자동 복사하지 않는다"
      - "변경 대상별 단일 미종결 요청·제출본 고정·취소 후 새 요청·동시 접수와 오래된 승인 차단은 REQ-601.request_integrity를 따른다. 실제 변경 대상과 참조 자산의 구분, 태그와 연결 지식의 독립 변경·과거 리비전 보존은 REQ-607을 따른다"
      - "취소·반려 후 새 요청의 접수와 승인 후 반영 미완료 보호는 REQ-601.request_integrity를 따른다. 기술 검토·최종 승인·일괄 반영의 단계는 유지한다"
      - "승인 절차 사용 시: 요청한 후보와 근거는 대기 중 덮어쓰지 않는다. 요청 전 초안의 기준 활성 리비전이 현재와 다르면 접수를 거부하고 최신본을 기준으로 보완하도록 안내한다. 기술 검토 또는 최종 승인에서 반려되면 원 요청·검토 이력을 유지하고 수정한 새 요청을 이전 요청과 연결해 제출하며 기술 검토부터 다시 수행한다. 승인자에게 여러 경쟁 후보 중 하나를 고르는 절차를 요구하지 않는다"
      - "과거 상태 복원도 새 후보 리비전으로 하며 기존 활성 리비전이나 과거 이력을 덮어쓰지 않는다(FEAT-014)"
      - "승인 권한은 처리 시점의 현재 유효 권한으로 판정하며 대리 역할 유효 기간이 끝나면 승인할 수 없다"
    exceptions:
      - "반려는 현재 활성 상태를 바꾸지 않으며 수정 필요 검토 작업도 완료시키지 않는다"
