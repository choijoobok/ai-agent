  - id: REQ-303
    approval_policy: "요청·사람의 검토/책임자 승인 단계는 REQ-601.approval_policy의 해당 업무 설정 사용 시 절차다. 미사용 시 저장자가 전결한 승인 이력으로 반영하며 전체 스냅샷·검증·효력 시점은 유지한다. 혼합 세트·설정 전환·권한 경계도 같은 공통 규칙을 따른다"
    type: functional
    priority: must
    actors: ["ACT-003"]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-30 사용자 결정(인증 예제별 자동 카탈로그 매핑, 지식의 예제·카탈로그 독립 매핑과 조회 시 합산, 직접 매핑 복사 금지) · 2026-10-02 사용자 보완 요청: 여러 데이터소스·DB 스키마의 카탈로그를 참조할 수 있으나 지식에 소속 정보·스키마 권한을 중복 매핑하지 않는다 · 2026-10-06 사용자 정정: 지식에는 고정 태그 ID를 매핑하며 태그 텍스트만 바뀌면 지식 리비전·매핑은 유지한다(REQ-607). 같은 날 REQ-608 보완 요청에 따라 지식의 업무 API 매핑과 업무 절차/API 공통 입력 가이드의 역할 구분을 연결한다 · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023) · 2026-10-08 사용자 보완 요청: REQ-038 검토에 따른 커스텀 도구 직접 매핑·승인 소유·후보 구성 보완, 변경 카드 전체 재확정 대기 · 같은 날 사용자 추가 지시: 도구의 용도·사용 조건은 지식 본문이 아닌 각 API·커스텀 도구 매핑 건의 설명으로 관리 · 2026-10-08 사용자가 변경된 요구사항 전체의 확정·커밋·푸시를 명시 요청하여 보완본을 confirmed로 기록. 2026-10-21 사용자 승인: API·커스텀 도구의 공통 결과 안내와 지식 매핑별 업무 후속 절차를 자연어 가이드로 관리하고, LLM의 안내·질문 및 사용자 응답에 따른 후속 처리를 기존 통제 안에서 연결한다."
    process_step: PRC-09-01
    title: "지식과 공개 데이터 인터페이스의 역할 경계 — 참조 링크"
    query_constraint_boundary: "테이블/뷰의 필수 조회 제약은 REQ-301.query_constraints를 참조한다. 지식은 출고 실적의 기준일 등 업무 의미와 조건 선택 근거를 설명하며 공통 제한 수치·대체 예외를 복제하거나 면제하지 않는다. 연결 카탈로그를 사용할 때 해당 제약도 함께 확인한다"
    detail: "지식 본문에는 물리 테이블·컬럼명과 SQL을 담지 않는다. 업무 설명은 지식, 공개 객체의 구조·의미는 카탈로그, SQL은 인증 예제가 정본이다. 지식은 접근 허용 그룹·태그 ID와 함께 인증 예제 0..N개, 카탈로그 직접 참조 0..N개, 업무 API 0..N개와 커스텀 도구 0..N개를 각각 독립적으로 매핑한다. 예제가 없거나 지식에 필요한 카탈로그 일부만 사용하는 경우도 허용한다. 예제의 카탈로그 매핑을 지식에 복사하지 않고 조회 시 직접 참조와 예제를 통한 간접 참조를 합산한다. 업무별 API·커스텀 도구의 용도·사용 조건·해당 도구의 입력 확보 절차는 각 지식-도구 매핑의 설명, 공통 파라미터 명세·값 채우기 가이드는 REQ-608의 API 관리가 정본이다. 접근 그룹이 없는 지식은 활성 상태여도 사용자 검색·주입 대상이 아니다"
    why: "Hub가 선택해 공개한 물리명·구조의 원천은 카탈로그 하나다. 다른 자산이 물리명을 자유 텍스트로 품으면 **통제와 변경 검수 밖에서 관리되는 스키마 사본**이 생긴다"
    link_uses: "① 지식·예제·카탈로그별 현재 접근 판정 ② 지식의 직접 카탈로그와 연결된 사용 가능 예제들의 카탈로그를 합산해 SQL 작성 범위 구성 ③ 카탈로그→지식의 직접 경로와 카탈로그→예제→지식의 간접 경로를 모두 이용한 변경 영향 검토 ④ 업무 API·커스텀 도구의 연결 후보 구성과 역참조를 통한 변경 영향 검토"
    acceptance: "지식에 인증 예제와 카탈로그를 각각 0개 이상 연결할 수 있으며 예제 참조가 지식의 직접 매핑으로 복사되지 않는다. 조회 시 직접·간접 카탈로그를 중복 제거해 합산하고 예제가 없어도 직접 매핑을 사용한다. 예제 연결 해제 후 해당 경로만의 항목은 합산 목록에서 빠지지만 직접 또는 다른 예제 경로는 유지한다. 접근 판정 실패 자산은 주입하지 않고 필수 참조 일부를 숨긴 불완전한 예제도 주입하지 않는다. 과거 합산 목록은 당시 스냅샷 버전으로 재현한다. 서로 다른 데이터소스·DB 스키마의 항목을 같은 지식에 연결해도 별도 데이터소스/스키마 목록을 입력하지 않으며 참조 합산이 단일 SQL의 데이터소스 경계나 사용자 권한을 확대하지 않는다 커스텀 도구도 0개 이상 직접 연결하고 같은 도구를 여러 지식에서 참조할 수 있다. 링크 변경은 지식 후보·스냅샷과 지식 관리 승인 설정을 따르며 계약 변경은 도구 관리 설정을 따른다. 그룹 권한만 있고 지식 연결이 없는 도구, 비활성·미검증·권한 밖 도구는 후보에 포함하지 않는다. 참조 버전이 충돌하면 임의 선택하지 않는다. API·커스텀 도구의 용도·사용 조건은 매핑별로 작성하며 지식 본문에 특정 도구 호출 안내를 중복하지 않는다. 설명이 없는 매핑은 활성 반영하지 않고 설명 변경도 지식 승인 설정을 따른다. 후보에서 제외한 매핑의 설명은 주입하지 않으며 같은 도구의 여러 설명은 출처를 유지한다. 결과 처리에도 tool_usage_mapping의 원천 가이드·업무별 후속 설명·출처를 제공하고 result_guidance.verification의 충돌·범위·버전 기준을 만족한다."
    roadmap: RM-P1
    summary: "지식은 일반 업무 설명·절차와 예제·카탈로그·업무 API·커스텀 도구의 독립 참조 및 매핑별 사용 설명를 갖는다. 인증 예제의 카탈로그는 SQL에서 추출하며 지식의 SQL 작성 범위는 직접·간접 참조의 합집합으로 구한다. API 공통 입력 규칙·가이드는 연결 API를 참조한다"
    intent:
      problem: "지식 본문에 SQL·물리명을 복제하면 권한 통제와 변경 영향 검수 밖의 스키마 사본이 생긴다"
      goal: "자산별 정본을 분리하고 정형 참조로 접근 통제와 영향 검수를 연결한다"
      not: ["지식 본문을 SQL 저장소로 쓰지 않는다", "접근 그룹을 매핑하지 않은 지식을 전체 공개로 해석하지 않는다"]
    goal_trace: ["GOAL-1","INV-01"]
    decider: "제품 오너(사용자)"
    preconditions:
      - "참조할 공개 인터페이스와 업무 의미가 카탈로그에 있다(REQ-301)"
      - "지식 접근 그룹과 현재 사용자 그룹을 판정할 수 있다(REQ-103)"
    data:
      - { item: "지식 본문·업무 절차·접근 그룹·태그 ID·0개 이상 예제 링크와 직접 카탈로그 링크·업무 API 링크·커스텀 도구 링크·매핑별 사용 설명(용도·사용 조건·입력 확보·결과 안내·질문/선택별 후속 절차)·참조 근거/버전", origin: "업무 자산 관리자", sensitivity: "그룹 제한 업무 지식", retention: "REQ-305의 불변 리비전 전체 스냅샷. API 계약 내용 버전·실행 근거는 REQ-608·REQ-108을 따른다" }
    business_rules:
      - "본문 금지 내용과 참조 링크의 용도는 본문의 detail·link_uses를 따른다"
      - "특정 데이터 객체를 참조하지 않는 일반 업무 지식도 허용하지만 접근 그룹 매핑은 필요하다"
      - "지식·예제·카탈로그의 개별 권한과 활성 버전을 확인하고 example_catalog_mapping의 직접·간접 합산 규칙으로 카탈로그 후보 범위를 구성한다"
      - "지식은 여러 데이터소스·DB 스키마의 공개 카탈로그 항목과 인증 예제를 참조할 수 있다. 소속 데이터소스와 DB 스키마는 REQ-301·REQ-302의 카탈로그/예제 참조에서 얻으며 지식에 별도 소속 목록·스키마 권한 매핑을 중복 저장하지 않는다. 참조 합산을 데이터소스 간 SQL 조인 허용이나 접근 권한 부여로 해석하지 않으며 데이터소스 경계는 REQ-603을 따른다"
      - "본문 검수에서 물리명·SQL을 발견하면 카탈로그 링크·인증 예제 등록으로 유도한다(FEAT-014)"
      - "접근 그룹·태그 ID 매핑·참조 링크를 고치는 경우도 REQ-305의 지식 후보 리비전·승인 절차를 따른다. 공통 태그 텍스트·동의어의 자체 변경과 당시 표현 재현은 REQ-607을 따르며 지식 매핑·리비전을 바꾸지 않는다"
      - "업무 API 매핑의 개수·소유·권한·공통 입력 가이드와 업무 절차의 구분은 REQ-608을 따른다. API 링크와 매핑별 사용 설명 변경도 지식 후보의 전체 스냅샷과 기존 승인 절차에 포함한다. API 계약 자체는 지식 반영 세트의 변경 대상으로 옮기지 않는다"
    tool_usage_mapping:
      description: "업무 API·커스텀 도구의 각 매핑 건에 그 지식에서의 용도와 어느 경우에 사용하는지를 설명한다. 필요한 업무별 입력 확보·조회·선택·호출 순서와 결과별 안내·추가 질문·사용자 선택에 따른 후속 작업/종료 순서도 해당 매핑 설명에 둔다. 같은 도구를 여러 지식에 연결할 때 설명은 매핑별로 독립 작성한다"
      ownership: "일반 업무 설명·절차는 지식 본문, 특정 API·커스텀 도구의 이름·식별자·용도·사용 조건·호출 안내는 정형 매핑과 그 설명이 정본이다. 지식 본문에 특정 도구를 지칭하는 호출 안내를 중복 작성하지 않고 매핑 편집으로 유도한다. 공통 계약·파라미터 명세·결과 의미·공통 결과 안내 가이드는 REQ-608·612의 도구/API 원천을 참조하고 복제하지 않는다"
      validation: "사용 설명이 없거나 용도·사용 조건을 판단할 수 없는 매핑은 초안으로 보존할 수 있으나 활성 반영하지 않는다. 지식 본문과 매핑 설명의 역할·일치 여부를 검수하며 탐지·입력 방식은 P3에서 정한다. 설명은 권한·실행 승인·계약 검증·필수 결과 확인·재전송/자동 폴링 금지를 우회하는 지시로 사용할 수 없다. 원천 결과 계약과 충돌하는 설명은 유효 반영하지 않는다"
      lifecycle: "설명만 고쳐도 지식 후보 리비전의 변경으로 처리하며 링크와 설명을 같은 전체 스냅샷으로 요청·검토·승인 또는 전결 반영한다. 연결 제거 시 그 매핑 설명도 현재 후보에서 제외하지만 과거 스냅샷에는 보존한다"
      delivery: "모델에는 도구 선택·입력 확보뿐 아니라 결과 처리·후속 질문/사용자 응답 해석에도 필요한 유효 매핑의 대상 식별자·원천 계약/공통 결과 안내 가이드와 해당 매핑의 사용 설명을 함께 전달한다. 당시 지식 리비전·매핑·계약/가이드 버전을 원 호출 및 결과와 연결한다. 제외된 매핑의 설명만 별도로 주입하지 않는다. 여러 검색 지식이 같은 도구를 참조하면 도구 정의는 중복 제거하되 각 설명의 지식·리비전·매핑 출처를 보존한다. 사용 조건이 충돌하거나 모호하면 임의 합성하지 않고 REQ-025에 따라 확인하거나 처리 불가로 안내한다"
    result_guidance:
      runtime: "후속 API·도구 참조는 현재 허용된 지식 연결 후보에서만 해석한다. 공통 가이드와 업무별 매핑 설명은 REQ-009.result_dialogue의 입력이며 등록된 작업·현재 권한·승인을 대신하지 않는다"
      verification:
        - "같은 도구를 여러 지식에 연결해 업무별 질문·후속 순서를 다르게 관리하되 공통 상태 의미·가이드 사본 없이 각 지식/매핑 출처를 유지한다"
        - "검색 지식 간 후속 설명이 충돌하면 임의 합성하지 않고 REQ-025에 따라 확인하거나 처리 불가로 안내한다. 제외·미승인 매핑의 가이드로 후속 호출하지 않는다"
        - "매핑의 결과 안내만 수정해도 전체 지식 후보 승인/전결과 불변 스냅샷에 포함하며 과거 실행은 당시 설명·원천 버전으로 재현한다"
    custom_tool_mapping:
      ownership: "지식에 등록 커스텀 도구의 안정 식별자를 0..N개 직접 매핑한다. 같은 도구를 여러 지식에서 참조할 수 있고 도구가 없는 지식도 허용한다. 업무 API는 REQ-608의 기존 API 링크를 사용하며 같은 API를 커스텀 도구 링크로 중복 관리하지 않는다"
      contract: "업무별 사용·입력 확보·결과 안내·질문/선택별 후속 순서는 해당 지식-도구 매핑의 설명에 두고 도구의 입출력·데이터 범위·마스킹·재시도·오류 계약은 REQ-612·REQ-114의 원천을 참조한다. 도구 코드·계약·자격증명을 지식 본문에 복사하지 않는다"
      approval: "커스텀 도구 링크 추가·제거·교체와 매핑별 사용 설명 변경은 지식의 전체 후보 리비전에 포함한다. REQ-601의 지식 관리 승인 설정 사용 시 REQ-305·306으로 요청·기술 검토·책임자 승인 후 반영하고 미사용 시 지식 변경 권한자가 전결한다. 도구 정의·계약 자체의 변경은 도구 관리 설정을 따른다. 함께 변경하는 세트는 공통 혼합 세트 규칙을 적용한다"
      validation: "지식 반영 전에 연결 도구의 존재·계약·활성·검증 근거와 참조 버전 정합성을 확인한다. 같은 반영 세트에서 도구를 함께 등록·변경하면 REQ-306의 검증된 세트 내 후보 참조를 적용한다. 미충족 초안은 보존할 수 있으나 유효 매핑으로 반영하지 않는다. 도구 변경만으로 지식 링크·본문·리비전을 자동 수정하지 않는다"
      candidates: "검색된 사용 가능 지식에 직접 연결된 커스텀 도구 중 현재 사용자 권한·활성·노출·검증 조건을 만족한 도구만 선택 후보로 제공한다. 여러 지식의 같은 도구는 안정 식별자로 중복 제거하고 참조 버전 충돌은 임의 선택하지 않는다. 연결은 호출 권한이나 REQ-114의 사용자 승인을 대신하지 않는다"
      snapshot: "지식 후보·요청·검토·승인 스냅샷에 도구 링크·매핑별 사용 설명과 당시 참조 버전·근거를 보존한다. 과거 연결은 당시 스냅샷으로 재현하고 현재 도구나 지식 값으로 덮어쓰지 않는다"
    example_catalog_mapping:
      ownership: "인증 예제→카탈로그는 REQ-302의 SQL 추출 결과를 예제 후보에 자동 매핑하고, 지식→예제와 지식→카탈로그 직접 매핑은 관리자가 독립적으로 선택한다. 두 종류의 지식 연결은 각각 0..N개이며 예제가 지식에 필요한 카탈로그 전체를 포괄할 필요가 없다. 예제 참조를 지식 직접 매핑에 복사하지 않는다"
      union: "지식의 SQL 작성용 카탈로그 후보는 직접 카탈로그와 연결된 사용 가능 인증 예제별 카탈로그의 합집합이다. 데이터소스·스키마를 포함한 카탈로그 안정 식별자로 중복 제거하고 각 항목의 직접·예제 경유·양쪽 경로 및 예제 식별자·버전을 표시한다. 합산은 조회 결과이며 별도의 지식 직접 매핑으로 저장하지 않는다. 이후 현재 권한 안의 질의 관련성·컬럼/필수 관계 선별과 입력 예산은 REQ-021·003을 따른다. 합산 전 데이터소스 우선 선별로 후보를 제한하지 않으며 필요한 다중 원천의 조회·결합은 REQ-021을 따른다"
      approval: "지식의 예제 링크·직접 카탈로그 링크와 예제 자체의 카탈로그 매핑 변경은 각각 해당 자산 후보로 작성하고 REQ-305·306으로 요청·기술 검토·승인한다. 승인 없이 활성 매핑을 바꾸거나 예제 최신 버전으로 자동 치환하지 않는다. 연결된 지식의 간접 영향도 검토하되 불필요한 직접 매핑 복사는 만들지 않는다"
      snapshot: "요청·검토·승인 스냅샷은 당시 지식의 직접 카탈로그와 예제 링크·버전, 그 예제 버전의 카탈로그 매핑·버전을 보존한다. 과거 합산 목록은 이 근거로 재현하고 현재 운영본으로 다시 계산하지 않는다. 같은 자산의 직접·간접 참조 버전이 충돌하면 임의 선택하지 않고 REQ-306의 정합성 검토에서 해소한다"
      missing: "미등록 객체는 카탈로그 자체를 자동 신규 등록하지 않고 누락과 등록·검수 필요를 안내한다. 해결 전 초안은 보존하되 반영하지 않는다. 데이터소스·스키마까지 구분하고 추출 불확실성은 기술 검토에서 해소한다"
      remove: "지식에서 예제 연결을 해제하면 승인·반영된 버전부터 그 예제만을 통해 포함됐던 항목이 합산 목록에서 제외된다. 지식 직접 매핑이나 다른 연결 예제를 통해 필요한 항목은 유지하며 카탈로그 자산 자체는 삭제하지 않는다. 예제 SQL 변경으로 참조가 줄면 해당 예제 후보 매핑의 차이를 검토·승인하고 같은 합산 원칙을 적용한다"
      security: "참조 합산은 접근 허용 그룹을 확대하지 않는다. 지식과 그 직접 참조는 기존 현재 권한 판정을 통과해야 하며 예제도 자체 접근 권한과 모든 필수 참조의 사용 가능 판정을 통과해야 한다. 권한 밖 필수 참조가 있는 예제는 일부 참조만 제거해 제공하지 않고 예제 전체를 주입·직접 실행 대상에서 제외한다. 그 예제로만 포함되는 카탈로그는 제외하되 별도의 허용된 직접·다른 예제 경로는 유지한다. 운영 권한·마스킹 통제는 그대로 적용한다"
    exceptions:
      - "그룹 매핑이 없거나 직접 참조 접근 판정에 실패하면 지식 주입에서 제외한다. 연결 예제의 접근·필수 참조 판정 실패는 example_catalog_mapping.security를 따른다"
      - "물리명·SQL 감지 방법과 검수 절차의 상세는 P3에서 설계하며 자동 탐지의 완전성을 가정하지 않는다"
    lifecycle: "지식 활성 상태는 REQ-305·306, 참조 변화에 따른 검토 필요 상태는 REQ-304·307이 갖는다"
    permissions:
      - "본문·그룹·링크 관리: 유효 메뉴 권한의 ACT-003"
      - "검색·주입: 현재 허용 그룹과 참조 인터페이스 판정 통과 사용자"
    audit: "본문·접근 그룹·참조 링크의 변경은 REQ-305의 동일 리비전 근거로 남긴다"
    volume: "지식당 예제와 직접 카탈로그는 각각 0..N개이며 합산 후보 범위와 실제 주입 총량은 구분한다. 검색·주입 총량 통제는 기존 컨텍스트 계약을 따른다 커스텀 도구 링크의 개수와 후보 구성은 custom_tool_mapping을 따른다."
    config: "접근 그룹·태그 ID 매핑·직접 카탈로그 링크·인증 예제 링크·업무 API 링크·커스텀 도구 링크와 업무 절차는 지식 리비전의 관리 값이다. API 공통 입력 명세·값 채우기 가이드는 REQ-608의 API 관리 원천을 참조한다. 공통 태그 텍스트·동의어의 소유·버전·단독 변경은 REQ-607을 따른다. SQL 추출 카탈로그 매핑은 인증 예제 리비전이 소유한다"
    risk: "참조 링크 누락은 변경 영향 검수 누락으로 이어지므로 등록 때 업무 관계를 함께 검수한다"
    relations:
      depends_on: ["REQ-301","REQ-302","REQ-603","REQ-601"]
      constrains: ["REQ-021","REQ-305","REQ-607","REQ-608","REQ-038","REQ-612"]
      conflicts_with: []
      nfr: []
      interfaces: []
    realization:
      features: [FEAT-014, FEAT-202, FEAT-203, FEAT-206]
      screens: [SCR-011]
    examples:
      - { kind: 정상, case: "출고 집계 기준 지식은 공개 출고 뷰를 링크하고, 사용법 지식은 링크 없이 허용 그룹만 지정한다" }
      - { kind: 예외, case: "지식 접근 그룹에는 속해도 연결된 직접 참조한 출고 뷰 접근 권한이 없으면 그 지식을 주입하지 않는다" }
      - { kind: 정상, case: "지식 직접 매핑이 주문·반품이고 예제 A가 주문·주문상세, 예제 B가 거래처·주문을 참조하면 합산 후보는 주문·반품·주문상세·거래처다. 지식 직접 매핑은 주문·반품 그대로다" }
      - { kind: 예외, case: "예제 A 연결을 해제하면 주문상세만 합산 후보에서 빠지고 직접 연결된 주문·반품과 예제 B의 거래처는 남는다. 카탈로그 자산은 삭제하지 않는다" }
      - { kind: 정상, case: "예제가 없는 지식은 직접 연결한 카탈로그만 사용하며 특정 데이터를 참조하지 않는 사용법 지식은 두 종류 연결 모두 0개여도 허용 그룹 판정 후 사용할 수 있다" }
      - { kind: 정상, case: "지식에 DS-1/sales.orders와 DS-2/public.stock의 카탈로그를 연결하면 각 소속은 카탈로그에서 얻는다. 지식에는 별도 데이터소스·DB 스키마 목록을 저장하지 않고 실행은 데이터소스별 SQL로 나눈다" }
      - { kind: 예외, case: "예제 필수 참조인 거래처의 접근 권한이 없으면 거래처만 숨긴 채 예제를 제공하지 않는다. 예제 전체와 그 예제만의 간접 카탈로그를 제외하고 허용된 직접·다른 예제 경로만 유지한다" }
      - { kind: 예외, case: "과거 요청이 예제 A v1의 주문·주문상세를 참조했다면 현재 v2에서 거래처가 추가돼도 과거 합산 목록에는 거래처를 끼워 넣지 않는다" }
      - { kind: 정상, case: "재고 통합 지식에 검증된 재고 통합 커스텀 도구를 연결한다. 링크 변경은 지식 승인 설정, 도구 계약 변경은 도구 승인 설정을 따르며 두 변경이 함께 있으면 혼합 세트 규칙을 적용한다" }
      - { kind: 예외, case: "사용자가 정산 도구의 허용 그룹에 속해도 검색된 지식에 정산 도구가 연결되지 않았다면 모델 후보에 제공하지 않는다" }
    volatility:
      level: "high"
      what: "업무 지식·허용 그룹·참조 관계는 고객사마다 다르다"
    open:
      - "@defer P3 — 본문 물리명·SQL 감지와 사람 검수의 상세 흐름을 설계한다"
      - "@defer P3 매핑별 결과 안내·질문/선택별 후속 절차의 편집·원천 가이드 참조·충돌 검토와 전달 계약을 화면 요건서·목업 및 시험에 연결한다"
    maturity: { level: confirmed, at: "2026-10-08", by: "AI — 사용자 명시 확정 반영", confirmed_by: "사용자 (2026-10-08 변경된 REQ-038·303·305·306·608·612 전체 보완본 확정·커밋·푸시 요청)" }

  - id: REQ-304
    approval_policy: "요청·사람의 검토/책임자 승인 단계는 REQ-601.approval_policy의 해당 업무 설정 사용 시 절차다. 미사용 시 저장자가 전결한 승인 이력으로 반영하며 전체 스냅샷·검증·효력 시점은 유지한다. 혼합 세트·설정 전환·권한 경계도 같은 공통 규칙을 따른다"
    type: functional
    priority: must
    actors: ["ACT-003"]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-30 사용자 결정(잠재적 오류 예방을 위한 고객사 변경 통지의 영향 검토와 변경 요청 근거 연결) · 2026-09-30 사용자 결정(고객사 DB와 Hub 반영 시점의 완전 동기화 비보장, 비중대한 변경의 일시적 시차 수용과 영향 검토 유지) · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023)"
    process_step: PRC-09-04
    title: "공개 데이터 인터페이스 변화의 보조 감지와 영향 검수"
    detail: "업무 시스템 유지보수 담당자 또는 고객사 DB/DW 변경관리 절차의 통지·근거를 입력으로 업무 자산 관리자가 Hub 공개 범위 영향을 검수한다. 통지는 고객사 운영에서 정한 이메일·사내 메신저 또는 Hub 공지를 사용하며 Hub가 원천 시스템을 감시하지 않는다. 선택적으로, **이미 등록된 공개 뷰·테이블에 한해** 결과가 나오지 않는 조건의 조회 결과 메타데이터로 컬럼 목록을 비교해 변화 후보를 알릴 수 있다. 구조 변화 후보나 카탈로그의 업무 의미·값 도메인 변경이 생기면, 연결된 지식과 인증 예제 쿼리에 **지식 검토 필요** 상태를 남긴다. 대상은 공개 카탈로그와 이를 참조하는 저장된 조회·인증 예제 쿼리·지식이다. 영향 지식은 카탈로그 직접 참조와 인증 예제를 경유한 간접 참조를 모두 추적한다"
    timing_policy: "고객사 DB 변경 시점과 Hub의 지식·예제·카탈로그 반영 시점을 완전히 일치시키는 것은 보장하지 않는다. 비중대한 변경의 일시적 불일치는 운영상 감수하되 변경 통지·영향 판정·고객사 적용 시점·Hub 실제 반영 시점과 미해결 검토 작업을 추적한다. 중대한 영향에는 이 허용을 일괄 적용하지 않으며 담당자의 별도 대응 판단이 필요하다. 시차 허용은 권한·마스킹 등 실행 통제의 유예가 아니다"
    limits: "구조 비교는 컬럼 추가·삭제·타입 변경·객체 소멸의 후보만 알릴 수 있다. 컬럼의 **의미 변경**, 뷰의 행 필터·원본 조인 변경, 보안상 등록하지 않은 객체의 변경은 자동 감지할 수 없다. 업무 자산 관리자가 카탈로그의 업무 의미·값 도메인을 고치면 같은 검토 필요 상태를 직접 남긴다. 따라서 구조 비교가 없거나 이상이 없더라도 영향 없음의 자동 판정 근거가 되지 않는다"
    hard_rule: "**Hub는 업무 DB/DW 전체를 대사하거나 카탈로그·지식을 자동 갱신·활성화·비활성화하지 않는다.** 변화 후보와 DB/DW 변경 통지는 업무 자산 관리자의 영향 검수 대상으로만 쓰며, 검토 필요 상태는 사람이 수정 또는 영향 없음을 확인할 때까지 유지한다. 파괴적 변경 뒤 조회가 실패해도 기존 활성 지식·인증 예제를 자동으로 끄지 않고 오류를 기록한다. 발생마다 알리지 않고 조사 담당자·지식 검토 작업 배정 때 알리는 규칙은 REQ-115를 따른다. 개인 저장 조회의 오류 표시는 REQ-204를 따른다. SQL 파서의 스코프 주입·권한 재판정·마스킹은 이 상태와 무관하게 매 요청에 계속 적용한다"
    acceptance: "비중대한 변경은 고객사와 Hub의 실제 반영 시점이 달라도 이를 완전 동기화 실패로 간주하지 않고 영향 검토·미해결 상태·조치 결과를 추적하며 실행 통제는 유지한다. 연결된 공개 인터페이스의 구조 변화 후보 또는 카탈로그 의미·값 도메인 변경이 발생하면 관련 지식·인증 예제 쿼리에 검토 필요 상태가 남고, 사람의 수정 또는 영향 없음 확인 전에는 사라지지 않는다"
    note: "**인라인 값 후보 샘플링은 다른 동작이다** — 실제 데이터를 읽으므로 ① 관리자가 대상 컬럼을 지정해 수동 실행 ② distinct 값 수 상한과 조회 행 상한 적용 ③ **조회 이력에 시스템 조회로 구분해 기록**. **개인정보 컬럼은 샘플링 대상에서 제외한다** — 값을 보여주는 것이 목적인 기능이므로 마스킹으로 해결되지 않는다"
    roadmap: RM-P1
    summary: "고객사의 변경 근거와 등록 객체의 선택적 구조 비교를 이용해 관련 지식·예제의 검토 필요 작업을 만든다. 후보 감지는 업무 영향 확정이 아니며 자동으로 카탈로그·지식 상태를 바꾸지 않는다"
    intent:
      problem: "DB 구조가 같아도 업무 의미가 바뀔 수 있고, 구조 차이만으로 자동 수정하면 잘못된 지식을 서비스할 수 있다"
      goal: "변경 근거와 참조 관계를 바탕으로 사람이 영향과 조치를 확인한다"
      not: ["원천 DB 전체 감시·대사가 아니다", "구조 비교 이상 없음은 업무 영향 없음의 증명이 아니다"]
    goal_trace: ["GOAL-1","SUC-02"]
    decider: "제품 오너(사용자)"
    preconditions:
      - "등록 공개 객체와 관련 지식·예제의 참조 관계가 있다(REQ-301·303)"
      - "고객사 유지보수·변경관리 절차에서 변경 근거를 제공한다"
    data:
      - { item: "변경 통지·구조 비교 후보·영향 대상·검토 근거", origin: "고객사 변경관리와 선택적 구조 비교", sensitivity: "내부 변경 정보", retention: "REQ-307의 검토 작업·완료 이력" }
    business_rules:
      - "감지 대상·한계·검토 필요 해제 조건은 본문의 detail·limits·hard_rule을 따른다"
      - "인라인 값 후보 샘플링은 관리자가 수동 실행하며 개인정보 컬럼 제외·distinct 상한·조회 행 상한·시스템 조회 이력을 적용한다"
      - "겉으로 실행 오류가 없더라도 업무 의미·집계·필터 변화로 잘못된 결과나 작업이 누적될 수 있으므로 고객사 변경 통지를 근거로 REQ-307의 예방적 영향 검토 작업을 등록한다. 작업 생성·중복 연결·수정 필요 또는 불필요 판정은 REQ-307을 따른다"
      - "개인 저장 조회의 확정 변경 통지·실행 실패에 따른 오류 표시와 복구는 REQ-204를 따른다. 지식의 자동 비활성화 금지와 저장 조회 오류 표시를 혼동하지 않는다"
    exceptions:
      - "근거가 불명확하면 영향 없음으로 완료하지 않고 고객사 확인을 받는다(PRC-09-04)"
      - "실행 오류를 이유로 승인·권한·마스킹 통제를 생략하지 않는다"
    lifecycle: "변화 후보·변경 근거 → 영향 검수 → REQ-307의 검토 작업. 원 자산 활성 상태와 검토 상태는 구분한다"
    permissions:
      - "공개 범위 영향 검수·값 후보 샘플링: 유효 메뉴 권한의 ACT-003"
      - "샘플링도 해당 데이터소스의 허용 권한 안에서만 실행한다"
    audit: "변경 근거·영향 판정과 검토 완료 이력을 남기고 샘플링은 시스템 조회로 구분한다"
    volume: "비교는 등록 공개 객체만, 값 샘플링은 상한 내에서 수행한다"
    config: "구조 비교의 사용 여부·실행 주기와 샘플링 상한의 구체값은 P2에서 정한다"
    risk: "뷰의 행 필터·조인·컬럼 의미 변화는 자동 감지로 보장할 수 없다"
