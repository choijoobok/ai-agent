# 영역: 업무 메타데이터·지식
requirements:
# ── 메타데이터와 인증 예제 쿼리 ────────────────────────────
  - id: REQ-301
    approval_policy: "요청·사람의 검토/책임자 승인 단계는 REQ-601.approval_policy의 해당 업무 설정 사용 시 절차다. 미사용 시 저장자가 전결한 승인 이력으로 반영하며 전체 스냅샷·검증·효력 시점은 유지한다. 혼합 세트·설정 전환·권한 경계도 같은 공통 규칙을 따른다"
    type: functional
    priority: must
    actors: ["ACT-003","ACT-005"]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-30 사용자 결정(미완성·미검수 카탈로그 초안 저장 허용, 해당 범위의 AI 사용 제외) · 2026-09-30 사용자 결정(예제·카탈로그 단독 변경도 요청·기술 검토·최종 승인, 동일인 겸임 허용·결재선 설정 제외, 세트 스냅샷·승인 시 최신성 검사) · 2026-09-30 사용자 결정(평가셋의 변경 승인 강제 조건 제거, 모든 모델 입력 요소를 대상으로 사용자 질의 모니터링·대표 질의 평가를 일상 품질 관리로 운영) · 2026-10-01 후속 결정: 평가 기능은 REQ-615에 따라 전체 개발 완료 후 재검토 · 2026-10-02 사용자 보완 요청: DB 스키마와 카탈로그를 구분하고 다중 스키마 객체의 물리 식별을 명확히 한다 · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023)"
    process_step: PRC-09-01
    title: "선별 공개 사실을 수집하고 업무 의미를 검수한다"
    detail: "Hub 카탈로그는 업무 DB/DW 전체 스키마의 사본이 아니라 **고객사가 선택한 공개 데이터 인터페이스(뷰·테이블)** 의 업무 모델이다. 등록된 공개 객체의 **스키마 사실**(타입·PK·유니크·NOT NULL·컬럼 목록)은 권한이 있을 때 자동 수집·비교할 수 있다. **업무 의미**(업무 명칭·설명·의미 유형·값 도메인)는 수기이며 초안은 자동 제안하되 **사람이 검수해야 확정된다.** 업무 자산 관리자는 데이터소스·공개 범위·개발 구현 상세와 업무 관계를 함께 검수해 지식·인증 예제 쿼리의 근거로 삼는다. **접근 허용 그룹**은 카탈로그 내용과 함께 후보로 작성·승인·반영한다. 그 밖의 정책(마스킹·행 스코프·기본 필터, LLM 전송은 REQ-106의 요청·동의 정책 참조)은 등록 시부터 담당 권한자가 직접 관리하고 변경 이력을 남긴다(REQ-103)"
    hard_rule: "**Hub는 원본 DB/DW 전체를 수집·대사하지 않는다.** 민감 원본 객체는 등록하지 않으며, 자동 수집은 이미 선택·등록된 공개 객체 밖으로 범위를 넓히지 않는다. 자동 수집이 사람이 넣은 의미·정책을 덮지 않으며 DB 코멘트는 업무 명칭의 초안으로만 쓴다"
    why: "원본 테이블을 모두 노출하면 보안 경계가 무너지고, 복잡한 정형 조회를 뷰로 제공하는 고객사의 업무 모델과도 맞지 않는다. 정확도에 필요한 것은 전체 물리 스키마가 아니라 **검수된 공개 범위의 의미**다"
    note: "등록된 공개 객체의 구조 비교는 보조 신호일 뿐이며, DB/DW 변경이 Hub 공개 범위·업무 의미에 미치는 영향은 업무 자산 관리자가 고객사 변경 근거를 보고 직접 판정한다. **전부 채우려 하지 않는다** — 조회 빈도 상위 중 메타데이터 미완성 목록을 노출한다. 초기 오픈 전 보안 담당자의 최종 승인은 제품 외 검수 절차다. 카탈로그 메타데이터와 접근 허용 그룹의 단독 변경도 REQ-305·306의 세트 요청·기술 검토·최종 승인 뒤 반영한다. 그 밖의 보안 정책·사용자 소속 그룹 관리 경계는 REQ-103을 따른다"
    traces_to: ["PRN-10","CON-016","CON-018"]
    acceptance: "선택된 공개 인터페이스의 구조 사실은 권한 안에서 수집·비교할 수 있으나 업무 의미·정책은 사람이 검수·확정하며, 등록 범위 밖 원본 객체는 수집·대사·노출되지 않는다. 자동 수집은 확정된 의미와 정책을 덮어쓰지 않는다. 업무 명칭·설명이 미완성 또는 미검수인 범위는 관리자 초안 저장만 가능하고 AI 컨텍스트 주입·업무 조회에는 사용되지 않는다. 같은 데이터소스의 서로 다른 DB/카탈로그 또는 DB 스키마에 있는 동명 객체는 별도 항목이고 같은 물리 객체의 중복 등록은 거부한다. 스키마를 갖는 DBMS의 실제 객체 참조는 DB 스키마명이 명시돼 카탈로그와 일치해야 하며, 스키마 생략·모호한 객체를 기본 스키마로 임의 보정해 실행하지 않는다. column_metadata·value_domain·relationship_metadata에 따라 물리 자료형과 업무 의미/형식·코드 출처·전체 조인 컬럼/관계의 검수 상태를 확인할 수 있다. 미확인·무효 참조를 추정으로 메우지 않고 해당 범위 사용을 제외하며 개인정보는 REQ-111.privacy_metadata를 따른다."
    roadmap: RM-P1
    summary: "고객사가 공개하기로 선택한 뷰·테이블만 등록한다. 컬럼의 구조·업무 의미·코드 출처·조인 관계와 필수 조회 제약을 검수하고 REQ-111의 개인정보 기준을 연결한다. 제약은 계획 단계의 조건 확인과 서버의 실제 SQL 검증에 사용하며 수집 결과로 공개 범위나 정책을 자동 확대하지 않는다"
    intent:
      problem: "전체 물리 스키마를 그대로 제공하면 공개 범위를 넘고 업무 의미가 없어 잘못된 SQL을 만들 수 있다"
      goal: "선별된 데이터의 검수된 의미·관계·정책을 AI 조회의 근거로 제공한다"
      not: ["원본 DB/DW 전체 복제·대사 기능이 아니다", "자동 수집으로 업무 의미·정책을 확정하는 기능이 아니다"]
    goal_trace: ["GOAL-1","INV-01"]
    decider: "제품 오너(사용자)"
    preconditions:
      - "고객사가 공개할 뷰·테이블을 선정하고 데이터소스와 조회 권한을 준비한다(CON-016·CON-018)"
      - "업무 자산 관리자가 업무와 데이터·구현 관계를 검수한다(PRC-09-01)"
    data:
      - { item: "공개 객체의 물리 식별: Hub 데이터소스 내부 식별자·DB/카탈로그명·DB 스키마명·객체명·객체 유형(TABLE/VIEW), 해당하는 경우 서버 한정자", origin: "공개 범위 선정·등록 객체 확인 — REQ-603의 동일 연결 범위", sensitivity: "내부 물리 객체 정보 — 공개·접근 통제 대상", retention: "카탈로그 리비전의 불변 이력 스냅샷" }
      - { item: "공개 객체·컬럼의 구조 사실과 업무 의미·값 도메인·조인 관계·필수 조회 제약", origin: "등록 객체의 수집 결과와 업무 자산 관리자 검수", sensitivity: "내부 스키마·업무 메타데이터", retention: "등록 상태의 불변 이력 스냅샷, 보관 설계는 REQ-107을 따름" }
    column_metadata:
      source: "2026-10-22 사용자 보완 요청: 컬럼명·설명·자료형·날짜 등의 의미/형식·공통코드 출처와 관계를 요구사항에 명시하고 개인정보 관리 항목은 REQ-111.privacy_metadata와 연결한다. 실제 필드명·물리 저장·화면 배치는 P3에서 정한다"
      attributes: "컬럼명·물리 자료형·기본키/유일키 여부·NULL 허용 여부, 업무 명칭·설명·의미 유형을 관리한다. 날짜·일시·금액·수량·코드 등은 물리 자료형과 구분하고 해석에 필요한 날짜/시간 형식·시간대 또는 단위를 해당하는 경우 명시한다. 문자열 저장 날짜나 숫자로 보이는 식별자를 이름·값 모양만으로 날짜·수량으로 추정하지 않는다"
      privacy: "각 컬럼에서 REQ-111.privacy_metadata의 분류·식별 용도·마스킹 참조·검수 상태를 확인할 수 있어야 한다. 보안 담당자의 정책 원천과 현재 권한은 REQ-103·611을 따르며 카탈로그에 별도 정책 사본을 만들지 않는다"
      incomplete: "업무 의미·필요한 형식·값 도메인이 미완성/미검수이면 해당 컬럼은 초안으로 저장하되 AI 주입·업무 조회에 사용하지 않는다. 개인정보 미확인은 REQ-111을 따른다. 필요한 조인 관계나 코드 참조가 미확인이면 그 관계/참조에 의존한 조회를 추정 실행하지 않는다. 이 조건은 코드·관계가 필요 없는 독립 컬럼까지 관계 등록을 강제하는 뜻이 아니다"
    value_domain:
      modes: "공통코드 그룹 참조·인라인 값과 의미의 열거·해당 없음 중 적용 방식을 명시한다. 미확인/미완성을 해당 없음으로 저장해 사용 가능으로 간주하지 않는다"
      code_reference: "공통코드 참조에는 코드값과 업무 의미를 확인할 수 있는 원천·그룹의 안정 참조를 둔다. 그룹 표시명만 저장하지 않으며 서로 다른 원천의 동명 그룹을 혼동하지 않는다. 카탈로그 컬럼의 실제 원천 식별은 catalog_reference를 따르고 코드명 확인을 이유로 미등록 객체를 자동 공개하거나 호출하지 않는다"
      catalog_reference: "컬럼이 속한 카탈로그의 Hub 데이터소스 내부 식별자를 기준으로 같은 데이터소스의 공개·허용된 공통코드 테이블/뷰를 참조한다. 대상 DB/카탈로그·DB 스키마·객체와 코드값 컬럼·코드명 컬럼, 필요한 코드 그룹 구분 컬럼/값 및 회사 등 추가 식별 조건을 관리한다. 전용 코드 테이블처럼 그룹 구분이 필요 없으면 이를 강제하지 않는다. 데이터소스는 소속 카탈로그에서 해석하며 별도 대상 시스템 귀속이나 시스템-데이터소스 매핑을 요구하지 않는다(REQ-603·604). Hub 자체 공통코드나 다른 데이터소스의 동명 코드로 자동 대체하지 않는다. 대상 객체의 물리 식별·공개 범위·현재 권한은 기존 카탈로그 규칙을 따른다"
      validation: "참조 대상의 존재·사용 가능 상태·값과 의미의 대응을 검수한다. 잘못된 그룹·해석 불가 코드가 있으면 다른 그룹으로 대체하거나 코드명을 생성하지 않는다. 원천 정의를 복제한 별도 코드 목록이 아니라 유효한 참조 또는 명시적으로 선택한 인라인 열거를 사용한다. 타입과 형식이 같아도 코드의 업무 의미가 같다고 추정하지 않는다"
    relationship_metadata:
      ownership: "2026-10-28 사용자 결정(ADR-030): 관계 작성 시 양쪽 공개 카탈로그 중 관리할 카탈로그를 명시 선택하고 이후 고정한다. 관계는 해당 카탈로그 전체 후보의 일부이며 반대쪽 화면은 같은 정본을 조회한다. 관리측은 업무상 1측/N측·화면 진입 방향과 별개이며 관계 수정으로 관리측을 이전하지 않는다. 대체가 필요하면 기존 관계 폐기와 새 관계 후보의 참조·영향 검증을 따른다"
      attributes: "관계 양쪽의 공개 카탈로그 객체·연결 컬럼 쌍과 방향, 1:1 또는 1:N의 업무상 관계·설명을 관리한다. 복합 키는 필요한 컬럼 쌍 전체를 함께 정의하고 일부 컬럼만으로 같은 관계라고 취급하지 않는다. 물리 FK(외래키)로 확인된 관계와 FK 없이 사람이 검수한 논리 관계의 근거를 구분한다"
      validation: "공개된 대상·컬럼의 존재와 참조 유효성, 조인 값의 타입/의미 호환, 1측의 유일성 근거와 누락·중복 시 조회/집계 의미를 검수한다. 이름이 같다는 이유나 자동 수집한 FK만으로 업무상 권장 조인을 확정하지 않는다. FK가 없는 레거시도 검수된 관계를 사용할 수 있고, 관계 등록을 이유로 원천 DB 제약을 생성·변경하지 않는다"
      controls: "관계는 조인 근거이며 상대 객체의 접근 권한을 부여하지 않는다. 미등록·미검수·무효 관계는 권장 경로로 주입하지 않고 그 관계에 의존한 조회를 추정 실행하지 않는다. 변경 시 연결 지식·예제의 영향 확인과 기존 카탈로그 후보 승인 절차를 따른다. 1:N 관계를 1:1로 보거나 일괄 DISTINCT로 중복을 숨겨 집계를 확정하지 않는다"
    query_constraints:
      source: "2026-10-23 사용자 제안과 보완 요청: 필요한 테이블·컬럼을 정한 뒤 필수 조회 조건을 확인한다. 대량 데이터의 기간 제한 등 공통 강제 조건은 지식 본문이 아니라 스키마 카탈로그의 테이블/뷰 관리에서 정형으로 정의한다. 2026-10-22 전체 카드 확정 이후 추가한 규칙이며, 2026-10-23 사용자 명시 요청으로 이 규칙과 검증 기준을 포함한 전체 보완본을 재확정했다"
      ownership: "필수 조회 제약(TRM-247)은 해당 공개 테이블/뷰의 카탈로그 내용이다. 지식은 어떤 업무 기준일·범위로 조회할지 설명하고 이 정의를 참조하며, 수치·예외 규칙의 별도 사본이나 더 느슨한 통과 기준을 만들지 않는다. 컬럼의 DB NOT NULL·행 접근 권한·선택 해제 가능한 기본 필터와 구분한다"
      attributes: "테이블/뷰별 제약의 안정 식별자·카탈로그 리비전, 업무 명칭·필요 이유, 적용 대상 컬럼의 안정 참조, 규칙 유형·허용 범위와 등록된 대체 조건을 관리한다. 컬럼별 필수 여부만으로 복합 조건을 표현하지 않는다. 실제 필드·코드·저장 구조는 P3에서 정한다"
      supported_rules: "초기 범위는 지정 기준일 컬럼의 시작·종료가 있는 기간 필수, 그 기간의 최대 허용 범위, 명시적으로 등록한 정확한 식별키 조회의 기간 대체 조건이다. 복수 제약은 모두 충족하고 대체 조건은 연결된 제약에만 적용한다. 범용 규칙 언어나 임의 SQL 조건식을 관리하는 새 기능은 요구하지 않는다"
      period: "기간 규칙은 기준일 컬럼·날짜/일시 형식·시간대·경계 포함/제외와 최대 범위의 값/단위를 검수된 메타데이터로 해석할 수 있어야 한다. 시작·종료 순서와 유효 범위를 검증하고 한쪽 경계만 있거나 NULL·형식 오류이면 충족으로 보지 않는다. 상대 날짜는 REQ-001.past_query_followup.amend의 요청 접수 시점·적용 시간대를 기준으로 구체화해 안내 범위와 실제 바인딩을 일치시킨다. 구체화한 기간은 대기·계획 생성·SQL 재작성 시각이 달라졌다는 이유로 재해석하지 않는다. 명시적 새 요청이나 REQ-007의 기간 변경 입력을 받으면 해당 입력 기준으로 바꾼 부분만 다시 해석·검증한다. 모든 테이블에 동일 기간이나 31일 같은 전역 기본값을 강제하지 않는다"
      exact_key_alternative: "관리자가 해당 제약의 대체로 등록·검수한 유일 식별키의 모든 구성 컬럼에 유효한 단일 값의 동등 조건을 준 경우만 기간 대체를 허용한다. 단일 값은 해당 대상의 조회 요청 전체 기준이다. 집합 연산 분기·상관 서브쿼리의 반복 평가·선행 결과 전달로 여러 키 값을 적용하는 경우를 단일 값으로 보지 않으며 하나의 고정된 전체 키임을 검증할 수 없으면 대체를 허용하지 않는다. 임의 식별자·복합 키 일부·NULL·부분 일치·와일드카드·여러 키 목록은 이 대체 조건이 아니다. 다른 제약·권한·실행 상한은 그대로 적용한다"
      management: "제약의 신규·변경·삭제와 대체 조건은 카탈로그 전체 후보·검수·승인/전결·불변 이력 절차(approval_policy·REQ-305·306)를 따른다. 자동 수집이나 지식/사용자 문구로 제약을 확정·완화하지 않는다. 제약 없음은 검수된 명시 상태이며 미확인·미검수·무효 참조·지원 불가를 없음으로 처리하지 않는다. 불완전한 후보는 초안 저장하되 해당 범위를 AI 조회에 사용하지 않는다"
      context: "REQ-021의 허용 카탈로그 제공·선별에서 적용 제약과 필요한 허용 컬럼을 함께 유지한다. 테이블·컬럼 계획 후 REQ-025에 따라 이미 확보한 조건의 충족 여부를 확인하고 부족한 것만 질문한다. 제약 참조 컬럼이 권한 밖이면 존재·물리명을 노출하거나 권한을 확대하지 않고 해당 경로의 사용 불가로 처리한다"
      enforcement: "계획 단계 확인은 실제 실행 검증을 대신하지 않는다. 서버는 실행 전 카탈로그 제약을 직접 읽고 생성 SQL·인증 예제·저장 조회·워크플로우 등 공통 SQL 실행 경로 모두에서 실제 SQL과 바인딩 값이 제약을 충족하는지 검증한다. 모델이 제출한 충족 표식·계획 설명·조건 이름만으로 통과시키지 않는다"
      reference_coverage: "각 데이터소스의 SQL마다 자기조인 별칭·서브쿼리·공통 테이블 식·집합 연산 각 분기 등 실제 공개 객체 참조의 유효 조건을 확인한다. 다른 테이블의 기간이나 한 분기의 조건만으로 전체 충족을 인정하지 않는다. OR·함수·조인 위치 등으로 제한을 우회하거나 실제 적용을 입증하지 못하면 실행하지 않는다. 비공개 기반 테이블까지 새로 수집·노출하는 요구는 아니다"
      final_validation: "행 스코프·기본 필터 주입과 제외 처리 후 최종 SQL·바인딩에서도 제약 충족을 확인한다. 조건·대상·참조 버전이 바뀌면 영향받는 검증을 다시 하며 검사한 요청과 다른 요청을 실행하지 않는다. 위반·검증 불가이면 실행하지 않고 REQ-025로 부족 조건 또는 처리 불가 사유를 안내한다. 정책 거부를 REQ-037의 구문 오류 자동 재작성으로 바꾸지 않는다"
      non_waiver: "계획 확인·실행 승인·기본 필터 제외·'전체 기간으로 조회'라는 사용자 요청은 제약 면제가 아니다. 임의 기본 기간 삽입·요청 범위 축소·자동 분할 조회로 제약을 우회하지 않는다. 기간을 충족해도 저비용 조회를 보장하지 않으므로 NFR-001~003의 행·시간·결과 크기 통제를 유지한다"
      versions: "제약은 REQ-108의 카탈로그 내용 버전 선택·턴 내 고정·장기 대기 후 재선택을 따른다. 권한·행 스코프·기본 필터 등 현재 정책 검사는 별개로 유지한다. 저장 조회의 새 실행은 REQ-207에 따라 실행 시 유효한 제약으로 검증하며 과거의 통과 결과를 재사용하지 않는다"
      audit: "적용 제약 식별자/리비전·대상 참조·조건 근거·판정/거부 이유를 해당 계획과 실행 요청에 연결한다. 조건 값의 보존·마스킹은 REQ-107·111을 따르며 원값의 무제한 로그 사본을 만들지 않는다"
    business_rules:
      - "수집 범위·업무 의미·정책의 경계는 본문의 detail·hard_rule을 따른다"
      - "테이블/뷰별 필수 조회 제약의 관리·미완성 처리·내용 버전과 실제 SQL 검증은 query_constraints를 따른다. 조건 누락·초과·우회·무효 참조를 실행하지 않고 verification의 정상/예외 기준을 충족해야 한다"
      - "DB 스키마와 스키마 카탈로그의 뜻은 TRM-161·TRM-162, 데이터소스의 다중 DB 스키마·권한 경계는 REQ-603을 따른다. 카탈로그 항목은 공개 테이블·뷰 하나이며 DB 스키마 전체를 등록·공개하는 단위가 아니다"
      - "물리 객체는 `(Hub 데이터소스 내부 식별자, DB/카탈로그명, DB 스키마명, 객체명)`으로 구분해 같은 데이터소스 안의 물리 실체당 한 건만 등록한다. DBMS가 구분하는 서버 한정자가 있으면 그것도 식별에 포함한다. DBMS에 없는 차원은 해당 없음으로 표현하며 빈 값을 다른 DB/스키마 전체와 일치시키지 않는다. 데이터소스·DB·스키마 중 하나라도 다르면 동명 객체도 다른 항목이다. 그룹별 차등 공개를 위한 서로 다른 물리 뷰는 각각 등록할 수 있지만 같은 물리 객체를 그룹별로 중복 등록하지 않는다. 연결이 허용하는 교차 DB 조회와 별도 DB 허용 목록을 두지 않는 정책은 REQ-603·ADR-027을 따른다"
      - "카탈로그에는 실제 DB/카탈로그명을 보존한다. SQL에서 DB명을 생략한 참조는 실행에 사용할 연결의 확정된 현재 DB로만 해석하고, 명시된 다른 DB명이나 서버 한정자를 버리지 않는다. 등록·수집·SQL 검증·행 스코프 주입·원본 컬럼 추적은 같은 전체 식별을 사용한다. 현재 DB를 확정할 수 없거나 연결의 이름 해석 환경과 검증 환경이 다르면 실행하지 않는다. 세션의 DB/검색 경로 전환이나 다른 연결로의 자동 대체로 검증을 우회하지 않는다"
      - "스키마를 갖는 DBMS의 등록 객체에는 기본 스키마(dbo·public 등)도 실제 DB 스키마명을 보존하며 데이터소스의 표시용 별칭으로 대체하지 않는다. SQL의 실제 테이블·뷰 참조에는 DB 스키마명을 명시해 선언한 데이터소스의 등록 객체 전체와 대조한다. 스키마 생략·모호한 참조는 보완 대상이며 DB의 기본 스키마·검색 경로를 따라 임의 대체해 실행하지 않는다. 별칭·임시 질의 이름은 물리 객체와 구분한다"
      - "업무 명칭·설명은 AI 사용 전 필수이며 미기재 항목은 미완성으로 표시한다. 미완성·미검수 객체·컬럼은 관리자 초안으로 저장할 수 있지만 해당 범위를 AI 컨텍스트 주입·업무 조회에 사용하지 않는다. 구조 사실 보조 수집과 관리자 검수는 허용하며, 보안 정책 적용만으로 검수를 대신하지 않는다"
      - "컬럼 속성·값 도메인·관계의 관리 항목과 불완전 처리 기준은 column_metadata·value_domain·relationship_metadata를 따른다. 기본값·컬럼 길이·인덱스는 기존과 같이 관리 대상이 아니다(FEAT-003)"
      - "카탈로그 신규·수정·폐기·복원은 후보로 작성하고 단독 변경도 REQ-305·306으로 요청한다. 기술 검수만으로 운영본을 직접 바꾸지 않는다. 접근 허용 그룹은 세트에 포함하며 그 밖의 직접 관리 정책과 오픈 전 검수는 REQ-103·PRC-09-03을 따른다"
      - "카탈로그의 상시 평가 기능은 REQ-615에 따라 유예한다. 평가셋 보유·평가 실행·평가 통과를 카탈로그 또는 다른 자산 변경의 일률적인 접수·승인·반영 조건으로 강제하지 않는다. REQ-305·306의 기술 검토와 필요한 시험 근거 확인은 유지한다"
    quality_management:
      scope: "상시 품질 평가·평가셋 기능의 유예와 재검토 시점은 REQ-615가 정본이다. 현재 설계·구현·게이트 필수 범위로 두지 않는다"
      retained: "오류·품질 신고·조사·조치는 REQ-110·REQ-115를 유지하고, 자산 변경의 기술 검토·승인과 필요한 개발 시험은 REQ-305·306을 따른다"
      controls: "향후 평가를 도입해도 기존 열람 권한·마스킹·보관·실행 통제를 우회하는 근거가 되지 않는다"
    exceptions:
      - "수집 권한이 없으면 자동 수집으로 범위를 우회하지 않으며, 업무 근거가 불명확하면 지식·인증 예제 공개 전에 보완한다(PRC-09-01)"
    lifecycle: "구조 사실 수집·의미 초안 저장(AI 사용 제외) → 승인 설정 사용 시 요청·기술 검토·최종 승인, 미사용 시 저장자의 의미 확인과 전결(REQ-601·305·306) → 전체 반영 → 현재 권한·공개 정책을 통과한 범위만 AI 사용"
    permissions:
      - "업무 의미·관계 검수: 유효 메뉴 권한의 ACT-003"
      - "오류·품질 조사: 해당 유효 액션 권한의 ACT-005, 변경 조치는 해당 자산 담당 권한으로 수행한다"
      - "보안 정책 관리는 REQ-103·PRC-09-03의 권한 경계를 따른다"
    audit: "공개 객체의 등록 컬럼·업무 의미 전체와 정책 변경의 과거 상태를 REQ-107에 따라 보존한다"
    volume: "고객사가 선택한 공개 객체만 대상으로 하며 조회 빈도 상위의 미완성 항목을 우선 확인한다"
    config: "등록 공개 범위·업무 의미·값 도메인·권장 조인 관계·필수 조회 제약은 관리자 관리 값이다"
    risk: "구조 비교가 정상이어도 업무 의미가 바뀔 수 있으므로 REQ-304의 사람 영향 검수가 필요하다"
    relations:
      depends_on: ["REQ-603","REQ-601","REQ-111"]
      constrains: ["REQ-021","REQ-025","REQ-303","REQ-304","REQ-305","REQ-608"]
