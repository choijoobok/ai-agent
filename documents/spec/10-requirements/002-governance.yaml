      - { kind: 예외, case: "승인 뒤 모델이 파라미터를 B창고로 바꾸면 승인이 무효가 되어 다시 승인을 받는다" }
      - { kind: 예외, case: "호출이 타임아웃됐는데 결과 확인 API가 없으면 재시도하지 않고 '결과 불명 — 대상 시스템에서 처리 여부를 확인하세요'를 이력과 응답에 남긴다" }
