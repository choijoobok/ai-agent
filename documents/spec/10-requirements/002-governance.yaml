      - { kind: 정상, case: "가중치 1:2:3:4:5, 인원 50·30·20·10·5, 총 풀 50,000,000이면 가중치 합은 235이고 1급 212,765 · 3급 638,297 · 5급 1,063,829가 배정된다. 버림으로 남은 105는 미배정 계획량이다" }
      - { kind: 정상, case: "인원이 5·10·20·30·50으로 뒤집혀도 가중치 합이 455가 되어 1급 109,890 · 5급 549,450으로 등급 순서가 유지된다" }
      - { kind: 정상, case: "9월 B 등급 개인 기본 한도가 30,000,000이고, 관리자가 9/21에 신규 사용자 이주임을 B로 등록한다. 남은 일수 10일(21~30일) ÷ 30일이므로 10,000,000이 즉시 자동 배정된다" }
