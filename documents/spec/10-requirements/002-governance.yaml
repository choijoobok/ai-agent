  - id: REQ-117
    type: functional
    priority: should
    actors: [ACT-001, ACT-004]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-28 사용자 결정(확정 뒤 승인은 그다음 달 적용·승급만 요청·대기 1건)"
    process_step: PRC-12-02
    title: "쿼터 등급 승급 요청·승인"
    detail: "사용자는 portal에서 희망 쿼터 등급과 사유를 제출하고, 운영·비용 관리자는 admin에서 승인 또는 반려와 처리 사유를 기록한다. 승인된 승급은 다음 달 배정 확정(REQ-118) 전에 승인되면 다음 달부터, 확정 뒤에 승인되면 그다음 달부터 개인 기본 쿼터와 주 추론 선택 가능 모델에 적용한다"
    hard_rule: "진행 중인 달의 개인 기본 쿼터를 승급으로 다시 계산하지 않는다. 이번 달 업무상 추가 사용이 필요하면 REQ-119의 추가 토큰 사용 신청·승인으로 처리하며, 승인·반려·취소 이력은 수정하지 않는다"
    roadmap: RM-P1
    acceptance: "사용자가 희망 등급과 사유를 제출하면 운영·비용 관리자는 승인 또는 반려와 사유를 기록하고, 승인된 승급은 승인 시점이 다음 달 배정 확정 전이면 다음 달, 뒤면 그다음 달의 기본 쿼터와 허용 모델에만 반영된다. 같은 달 부족분은 승급으로 바뀌지 않고 추가 사용 신청으로 안내된다"
    summary: "사용자가 portal에서 희망 등급과 사유로 승급을 요청하고, 운영·비용 관리자가 승인하거나 반려한다. 승인은 다음 적용 가능한 월(TRM-154)부터 적용된다"
    intent:
      problem: "사용자가 더 높은 모델·한도가 필요해도 관리자에게 알릴 공식 경로가 없으면 구두 요청과 임의 변경이 섞인다"
      goal: "등급 변경 요구를 근거가 남는 한 경로로 모으고, 이번 달 계산은 흔들지 않는다"
      not:
        - "이번 달 부족분 해소 수단이 아니다 — 그것은 REQ-119 추가 사용 신청이다"
        - "자동 승급이 아니다 — 사용량 실적으로 등급을 올리지 않는다"
    goal_trace: [IN-06, MET-02]
    decider: "제품 오너(사용자)"
    preconditions:
      - "요청자에게 현재 쿼터 등급이 있다(REQ-116)"
    data:
      - { item: "요청(희망 등급·사유·요청 시각)", origin: "portal 입력", sensitivity: "일반", retention: "수정 불가 이력" }
      - { item: "처리(승인·반려·처리 사유·처리자·처리 시각·발효 월)", origin: "admin 입력", sensitivity: "일반", retention: "수정 불가 이력" }
    business_rules:
      - "승인된 승급은 적용 월 1일에 발효한다. 적용 월은 승인 시점에 다음 달 배정이 확정 전이면 다음 달, 확정 뒤면 그다음 달이다"
      - "요청 화면과 승인 화면은 승인 시 적용될 월을 미리 보여 준다"
      - "사용자 요청 경로는 승급만 받는다. 강등은 관리자 직접 변경(REQ-116)으로만 하며 사유를 남긴다"
      - "처리를 기다리는 요청은 사용자당 1건이다. 월을 넘겨도 유지하며, 적용 월은 승인하는 시점 기준으로 정한다"
    exceptions:
      - "공정 단계의 예외는 PRC-12-02가 갖는다"
    lifecycle:
      - { state: 요청됨, next: [승인됨, 반려됨, 취소됨] }
      - { state: 승인됨, next: [발효됨] }
      - { state: 반려됨, next: [] }
      - { state: 취소됨, next: [] }
    permissions:
      - "요청·본인 요청 취소·본인 이력 조회: ACT-001"
      - "승인·반려·전체 조회: ACT-004"
    audit: "요청·처리·취소는 수정 불가 이력이며, 처리자와 처리 사유를 남긴다"
    volume: "고객사별 미확인. 월 단위 소량으로 예상하지만 추정이다"
    config: []
    risk: "해당 없음"
    relations:
      depends_on: [REQ-116, REQ-118]
      constrains: [REQ-118]
      conflicts_with: []
      nfr: [NFR-011]
      interfaces: []
    realization:
      features: [FEAT-037, FEAT-127]
      screens: [SCR-035, SCR-109]
    examples:
      - { kind: 정상, case: "김대리가 9/15에 B→A 승급을 사유와 함께 요청하고, 관리자가 9/20에 승인한다. 10월 배정은 아직 확정 전이라 10월 기본 한도와 선택 가능 모델부터 A 기준이다" }
      - { kind: 정상, case: "10월 배정이 9/28에 확정된 뒤 관리자가 9/29에 승급을 승인하면 11월부터 A가 적용되고, 승인 화면에 적용 월 11월이 표시된다" }
      - { kind: 예외, case: "김대리가 9월 한도가 부족하다며 승급을 요청하면, 화면은 승급이 9월 한도를 바꾸지 않는다고 알리고 추가 사용 신청 경로를 보인다" }
    volatility: { level: medium, what: "승인 절차의 단계 수(1단 승인)는 고객사 결재 문화에 따라 늘 수 있다" }
    open: []
    maturity: { level: confirmed, at: "2026-09-28", by: "AI 정리", confirmed_by: "사용자 (2026-09-28 질문 전건 권장안 승인)" }
  - id: REQ-118
    type: functional
    priority: should
    actors: [ACT-004]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-28 사용자 결정(말일 확정 마감·미확정 시 승계·가중치 배분)"
    process_step: PRC-12-01
    title: "월 총 토큰 풀 자동 산정과 관리자 보정"
    detail: "관리자는 다음 달별 계획 가능 금액을 직접 입력하거나 연간 계획을 월별 금액으로 등록한다. Hub는 확정한 계획 1M 기준 단가와 토큰 풀 보정률로 보정 단가를 계산하고, `floor(계획 가능 금액 ÷ 보정 단가 × 1,000,000)`으로 월 총 토큰 풀을 자동 산정한다. 관리자는 산정된 총 토큰 풀을 보정할 수 있으며 근거를 남긴다. **다음 달 배정은 당월 말일까지 확정한다.** 확정되지 않은 채 달이 바뀌면 Hub는 직전 확정 월의 계획 가능 금액·보정 단가·등급별 배분 가중치를 그대로 이어받아 월초 활성 사용자 수로 개인 기본 한도를 산정하고 '승계 확정'으로 표시한다"
    hard_rule: "안전 여유율은 산식에 적용하지 않는다. 계획 가능 금액·보정 단가·자동 산정값·관리자 보정값과 근거는 대상 월별로 함께 이력화하며, 이는 예산·회계 장부가 아니라 토큰 운영 기준이다"
    why: "고객사별 계획 금액과 실제 사용 패턴이 다르므로, 공통 산식은 제공하되 운영자가 월별 상황을 반영할 수 있어야 한다"
    roadmap: RM-P1
    acceptance: "월 총 토큰 풀은 확정 1M 기준 단가와 보정률을 적용한 명시 산식으로 계산되고, 관리자 보정 시 대상 월의 계획 금액·단가·자동 산정값·보정값·근거가 함께 남으며 안전 여유율은 산식에 더해지지 않는다. 다음 달 배정을 말일까지 확정하지 않으면 직전 확정 월 기준으로 승계 확정되고, 승계 확정된 달은 월중에 다시 확정되지 않는다"
    summary: "관리자가 다음 달 계획 가능 금액을 넣으면, Hub가 보정 단가로 월 총 토큰 풀을 자동 산정한다. 관리자는 근거를 남기고 산정값을 보정할 수 있다"
    intent:
      problem: "금액 계획과 토큰 사용량 사이의 환산이 사람마다 달라지면, 월 배정의 근거를 설명할 수 없다"
      goal: "같은 입력이면 같은 토큰 풀이 나오는 공통 산식을 두고, 고객사 사정은 근거가 남는 보정으로만 반영한다"
      not:
        - "예산·회계 장부가 아니다 — 전사 예산 편성·잔액 통제를 하지 않는다(NFR-011)"
        - "절대 차단선이 아니다 — 총 풀 밖 승인은 REQ-119의 예외 승인으로 남긴다"
        - "안전 여유율을 산식에 넣지 않는다"
    goal_trace: [IN-06, MET-02]
    decider: "제품 오너(사용자). 고객사 금액·보정률은 ACT-004"
    preconditions:
      - "대상 월의 계획 1M 기준 단가가 확정돼 있다(NFR-010)"
      - "쿼터 등급과 등급별 배분 가중치가 정의돼 있다(REQ-116)"
    data:
      - { item: "대상 월 계획 가능 금액(직접 입력 또는 연간 월별 등록)", origin: "admin 입력", sensitivity: "내부(비용)", retention: "월별 이력 보존" }
      - { item: "계획 1M 기준 단가·보정률·보정 단가", origin: "NFR-010 단가 기준·공급사 월 대조", sensitivity: "내부(비용)", retention: "월별 이력 보존" }
      - { item: "자동 산정값·관리자 보정값·보정 근거", origin: "Hub 계산·admin 입력", sensitivity: "내부(비용)", retention: "수정 불가 이력" }
    business_rules:
      - "월 총 토큰 풀 = floor(계획 가능 금액 ÷ 보정 단가 × 1,000,000). 산식의 정본은 NFR-010 hard_rule이다"
      - "보정률은 최근 3개 확정 월의 공급사 대조값으로 시스템이 제안하고, 관리자가 적용·수정·미적용을 고른다"
    exceptions:
      - "공정 단계의 예외는 PRC-12-01이 갖는다"
      - "확정 월이 3개 미만(도입 초기)이면 보정률을 제안하지 않고 기본값 1.0을 쓴다. 관리자는 근거를 남기고 바꿀 수 있다"
      - "다음 달 배정이 작성중이면 SCR-021에 미확정 경고를 표시한다. 말일까지 확정되지 않으면 승계 확정하며, 승계할 직전 확정 월이 없으면(도입 첫 달) 승계하지 않는다. 첫 확정 전에는 개인 한도가 없어 질의 턴을 시작할 수 없다"
      - "순위가 높은 등급의 배분 가중치가 낮은 등급보다 작으면 확정하지 않고 해당 등급을 표시한다"
      - "승계 확정된 달은 월중에 다시 확정할 수 없다. 부족분은 추가 승인(REQ-119)으로 처리한다"
    lifecycle:
      - { state: 작성중, next: [확정됨, 승계확정], note: "당월 말일까지 관리자가 확정한다" }
      - { state: 확정됨, next: [] }
      - { state: 승계확정, next: [], note: "말일까지 확정하지 않아 직전 확정 월 기준으로 자동 확정됐다 — 월중 재확정 불가" }
    permissions:
      - "입력·보정·확정: ACT-004"
    audit: "대상 월별로 계획 금액·단가·보정률·자동 산정값·보정값·근거·확정자·확정 시각을 한 묶음으로 남기고, 확정 뒤에는 수정하지 않는다"
    volume: "월 1회 확정. 대상 월 1건"
    config:
      - "계획 가능 금액·보정률 적용 여부는 월별 admin 입력이다. 산식 자체는 코드로 고정한다(ADR-004의 계량 단위·과금 모드 분리)"
    risk: "보정률의 입력인 공급사 월 대조값을 어떻게 받는지(수동 입력·파일·API)가 정해지지 않았다"
    relations:
      depends_on: [REQ-116, REQ-117]
      constrains: [REQ-117, REQ-119]
      conflicts_with: []
      nfr: [NFR-010, NFR-011]
      interfaces: []
    realization:
      features: [FEAT-017]
      screens: [SCR-021]
    examples:
      - { kind: 정상, case: "10월 계획 금액 1,000만 원, 1M 기준 단가 5,000원, 보정률 1.1이면 보정 단가 5,500원, 총 풀은 floor(10,000,000 ÷ 5,500 × 1,000,000) = 1,818,181,818 토큰이다" }
      - { kind: 예외, case: "관리자가 총 풀을 1,700,000,000으로 낮추며 근거를 비우면 확정하지 않는다" }
      - { kind: 예외, case: "10월 배정을 9/30까지 확정하지 않으면 10/1에 9월 확정 기준(계획 금액·보정 단가·배분 가중치)으로 10월 활성 인원에 맞춰 개인 한도를 산정하고 '승계 확정'으로 남긴다" }
