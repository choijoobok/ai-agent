    process_step: PRC-12-01
    title: "월 총 토큰 풀 자동 산정과 관리자 보정"
    detail: "관리자는 다음 달별 계획 가능 금액을 직접 입력하거나 연간 계획을 월별 금액으로 등록한다. Hub는 확정한 계획 1M 기준 단가와 토큰 풀 보정률로 보정 단가를 계산하고, `floor(계획 가능 금액 ÷ 보정 단가 × 1,000,000)`으로 월 총 토큰 풀을 자동 산정한다. 관리자는 산정된 총 토큰 풀을 보정할 수 있으며 근거를 남긴다. **다음 달 배정은 당월 말일까지 확정한다.** 확정되지 않은 채 달이 바뀌면 Hub는 직전 확정 월의 계획 가능 금액·보정 단가·등급별 배분 가중치를 그대로 이어받아 월초 활성 사용자 수로 개인 기본 한도를 산정하고 '승계 확정'으로 표시한다"
    hard_rule: "안전 여유율은 산식에 적용하지 않는다. 계획 가능 금액·보정 단가·자동 산정값·관리자 보정값과 근거는 대상 월별로 함께 이력화하며, 이는 예산·회계 장부가 아니라 토큰 운영 기준이다"
    why: "고객사별 계획 금액과 실제 사용 패턴이 다르므로, 공통 산식은 제공하되 운영자가 월별 상황을 반영할 수 있어야 한다"
    roadmap: RM-P1
    acceptance: "월 총 토큰 풀은 확정 1M 기준 단가와 보정률을 적용한 명시 산식으로 계산되고, 관리자 보정 시 대상 월의 계획 금액·단가·자동 산정값·보정값·근거가 함께 남으며 안전 여유율은 산식에 더해지지 않는다. 다음 달 배정을 말일까지 확정하지 않으면 직전 확정 월 기준으로 승계 확정되고, 승계 확정된 달은 월중에 다시 확정되지 않는다"
    summary: "관리자가 다음 달 계획 가능 금액을 넣으면, Hub가 보정 단가로 월 총 토큰 풀을 자동 산정한다. 관리자는 근거를 남기고 산정값을 보정할 수 있다"
