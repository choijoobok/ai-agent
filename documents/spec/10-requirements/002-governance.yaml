requirements:
# ── 보안·거버넌스 ───────────────────────────────────────────
  - id: REQ-101
    type: functional
    priority: must
    actors: [ACT-001, ACT-002]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-02-01
    title: "업무 연관성 판정과 존재 은닉"
    detail: "등록된 업무 범위 밖의 질의는 **거부**한다. 판정은 프롬프트 규칙 하나에 의존하지 않고 ① **구조적 판정**(등록된 도구·스키마·지식으로 처리할 수 없는 질의는 대상이 아니다) ② **규칙 기반 판정** ③ **사후 보정**(판정 결과를 기록하고 오분류 피드백으로 규칙을 개선)을 결합한다. 거부 시에도 질의와 사유를 기록한다"
    hard_rule: "**객체의 존재 자체를 숨기는 것이 의도된 동작이다** — 권한 없는 객체는 LLM 에 노출되지 않으므로 정보가 없는 것과 권한이 없는 것을 구분해 답할 수 없고, 사용자에게는 **정보 부재로 응답한다**"
    note: "다만 같은 질의를 반복하지 않도록 정보 부재 응답에는 전사 공통 프롬프트 규칙이 관리하는 **고정 문구**와, 시작 시점 정책에서 허용된 범위 안의 대안만 제시한다. 이 문구와 대안은 특정 객체의 존재·차단 여부를 드러내지 않으며, 상세 확인은 내 접근 가능 데이터 목록으로 안내한다"
    acceptance: "등록 범위 밖 질의와 권한 없는 객체를 포함한 질의를 각각 처리해도 사용자 응답에는 객체명·차단 여부·권한 부족 사유가 드러나지 않고, 내부 이력에는 실제 판정 사유와 안내 문구가 함께 남는다"
  - id: REQ-102
    type: functional
    priority: must
    actors: [ACT-002]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-02-01
    title: "LLM 자율성 경계 — 서버가 강제한다"
    detail: "**금지 → 대안**: LLM 이 운영 DB 에 직접 접속해 조회·변경 → LLM 은 SQL 만 작성하고 실행은 agent / LLM 이 운영 WAS API 를 직접 호출 → agent 가 등록된 API 를 호출 / LLM 이 권한 검사를 스스로 수행 → 권한 검사는 서버 규칙 / LLM 이 승인 필요 액션을 판단만으로 실행 → 사용자 승인 절차를 서버가 강제"
    traces_to: [PRN-02, PRN-03]
    acceptance: "모델이 DB 접속·업무 API 직접 호출·권한 판정 우회·미승인 실행을 지시해도 서버가 해당 경로를 제공하지 않으며, 조회·실행·권한·승인은 각각 등록된 agent와 서버 정책 경로에서만 처리된다"
  - id: REQ-103
    type: functional
    priority: must
    priority_reason: "여러 업무 시스템의 데이터를 한 창구에서 다루므로 접근 통제가 없으면 제품을 운영에 투입할 수 없다"
    actors: [ACT-002]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-02-02
    title: "데이터 접근 통제 — 그룹 판정 · 행 스코프 · SQL 4단계"
    detail: "상세 모델은 22-authz/_index.yaml 이 갖는다. 접근 제한·마스킹·행 스코프·전송 허용은 스키마 카탈로그 등록부터 함께 적용한다. 카탈로그 컬럼은 관리자가 등록한 뒤 예외 매핑이 없으면 테이블 허용 그룹을 상속하고, 원천 DB/DW에서 감지됐지만 카탈로그에 미등록인 신규 컬럼은 차단한다"
    note: "초기 제품 오픈 전에는 보안 담당자(ACT-002)가 정책 적용을 최종 승인한다. 스키마 카탈로그와 접근·마스킹 정책은 변경이 드물므로 운영 중에도 보안 담당자와 업무 자산 관리자가 화면에서 직접 처리하며 제품 내 요청·승인 절차를 두지 않는다. **변경 이력은 행 단위 diff만 보관하지 않는다.** 사용자별 Hub 그룹 전체, 지식 리비전의 접근 그룹·태그·참조 링크 전체, 공개 인터페이스의 테이블·등록 컬럼·업무 의미 전체, 인터페이스의 테이블 그룹·컬럼 예외·마스킹·행 스코프·기본 필터·전송 허용 전체를 각각 저장 시점의 불변 스냅샷으로 남긴다. 과거 시각 조회는 해당 시각 이하의 최신 스냅샷으로 당시 관리 화면을 재구성하고, 과거 상태 복원은 기존 이력을 고치지 않고 새 스냅샷을 만든다"
    traces_to: [REQ-104]
    acceptance: "그룹 매핑·행 스코프·마스킹·전송 허용 중 하나라도 현재 정책에서 판정되지 않으면 요청은 허용 범위 밖으로 처리된다. 사용자 그룹·지식 접근 그룹과 태그·카탈로그·카탈로그 그룹 매핑을 각각 변경한 뒤 과거 시각을 조회하면 해당 관리 대상의 전체 당시 상태, 변경자·시각·사유·근거가 조회되고, 과거 상태 복원은 새 이력으로 남는다"
  - id: REQ-104
    type: functional
    priority: must
    actors: [ACT-001, ACT-002]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-02-05
    title: "생성 SQL 과 물리명의 노출 통제"
    detail: "**기본은 비노출이다.** 일반 사용자에게는 조회 계획만 업무 용어로 제시하고 물리 테이블·컬럼명과 SQL 원문을 보여주지 않는다. **원문 열람은 사용자 그룹으로 통제하는 선택 기능**이며, 열람이 허용된 사용자에게도 **편집과 직접 실행은 제공하지 않는다**"
    why: "사용자가 고친 SQL 을 실행하면 그 SQL 은 LLM 이 만든 것도 관리자가 검수한 것도 아니게 되어, 통제 전제와 감사 이력의 의미가 함께 흔들린다"
    note: "관리자는 노출 설정과 무관하게 감사 이력에서 SQL 원문을 조회한다 — **노출 통제는 화면 표시의 문제이며 기록의 문제가 아니다**"
    acceptance: "일반 사용자에게는 조회 계획의 업무 용어만 표시되고 물리 테이블·컬럼명·SQL 원문은 표시되지 않으며, 원문 열람이 허용된 사용자도 SQL을 수정하거나 직접 실행할 수 없다"
  - id: REQ-105
    type: functional
    priority: must
    priority_reason: "RM-P1에서 조회와 실행을 함께 출시하므로, 실행 기능의 안전 경계와 공통 그룹 판정 인터페이스가 첫 출시 범위에 필요하다"
    actors: [ACT-001, ACT-002, ACT-006]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-03-01
    title: "API·도구 실행 통제"
    detail: "호출 가능한 API·커스텀 도구는 목록으로 등록·관리되며 목록에 없는 호출은 불가능하다. API 와 도구는 **유형**(조회/실행)을 갖고, 등록된 실행 API 와 상태를 바꾸는 커스텀 도구는 모두 요청 사용자의 명시적 승인을 받아야 한다. 명세에는 **실행 성공 응답의 의미(완료/접수)·타임아웃·자동/수동 타임아웃 재시도 가능 여부·멱등성·요청 식별자 전달 방식·결과 확인 API 유무와 방법**을 함께 등록한다. 결과 확인 API가 없는 실행도 등록할 수 있다"
    hard_rule: "**판정 미달이면 차단한다.** 중간 상태를 두지 않으며 승인을 받아 실행하는 우회 경로도 없다. 승인은 액션·순서·파라미터에 묶이고 변경·만료 시 무효다(REQ-026). **호출 인증은 시스템 단위 연동 계정으로, 실사용자 신원은 매핑된 식별자를 파라미터로 전달한다.** 결과 확인 API가 없거나 도달 불명 결과를 확인할 수 없는 실행은 재시도하지 않고, Hub는 결과 불명 이력과 대상 시스템에서 수동 확인해야 한다는 안내를 남긴다. 대상 시스템의 실제 처리 여부를 추측해 성공·실패로 종결하지 않는다"
    roadmap: RM-P1
    acceptance: "미등록 API·도구, 현재 그룹이 허용하지 않은 대상, 승인 액션·순서·파라미터와 다른 요청 또는 만료된 승인은 호출되지 않으며, 결과 확인이 불가능한 실행은 자동 재시도·성공 추정 없이 결과 불명 이력과 수동 확인 안내를 남긴다"

  - id: REQ-106
    type: functional
    priority: must
    priority_reason: "외부 모델로 나가는 데이터의 허용 범위를 강제하지 못하면 폐쇄망 고객사에서 모델 호출 자체를 열 수 없다"
    actors: [ACT-002, ACT-007]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-02-03
    title: "LLM 외부 전송 데이터 정책"
    detail: "**전송 허용 여부를 테이블·컬럼 단위 설정**으로 통제한다. 조회 API 응답은 카탈로그에 없으므로 **등록된 응답 스키마의 경로 단위**로 통제한다 — API 단위 플래그 하나로는 같은 응답 안의 개인정보와 업무 데이터를 가를 수 없다. **기본값은 차단이며 허용 목록 방식으로 연다.** 전송 시에도 마스킹 규칙과 행 수 상한을 적용하고 전송된 내용은 전량 기록한다"
    note: "**Hub 는 레거시의 암호화 키·복호화 수단을 보유하지 않는다** — 암호화되어 저장된 개인정보는 조회해도 암호문이며 기술적으로 취급이 불가능하다. **평문으로 저장된 개인정보 컬럼이 통제 대상이다**"
    acceptance: "허용 목록에 없는 테이블·컬럼·API 응답 경로는 모델 호출 입력에서 제거되고, 허용된 데이터도 현재 마스킹·행 수 상한을 적용한 뒤에만 전송되며 실제 전송분과 적용 정책이 이력에 남는다"
  - id: REQ-107
    type: functional
    priority: must
    priority_reason: "AI가 만든 조회·실행의 근거를 사후에 재구성할 수 없으면 감사와 장애 조사가 성립하지 않는다"
    actors: [ACT-005]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-02-04
    title: "감사 이력 — 전량 기록과 차등 저장"
    turn_identity: "턴 ID는 Hub DB가 전역 양수 BIGINT 시퀀스로 발급한다(1~9,223,372,036,854,775,807). 시간은 ID에 넣지 않고 TURN_STARTED_AT(timestamptz)을 정본으로 보관한다"
    detail: "**요청**(사용자·세션·턴·회차·스텝·원문 질의·전달된 컨텍스트와 프롬프트, **주입한 지식의 안정 식별자·리비전·지식 검토 필요 상태**) · **판정**(업무 연관성·권한·마스킹·차단 내역·턴 시작 시점의 사용자 그룹·프롬프트 규칙·지식·스키마 카탈로그·API 카탈로그 스냅샷 참조) · **조회**(생성 SQL·데이터소스·기준 시각·실행 시간·결과 행 수와 컬럼 목록·**결과 지문**) · **실행**(API·파라미터·결과·승인 이력) · **응답**(LLM 응답 원문·최종 응답·검토 필요 자산 사용 여부) · **사용량**(스텝 역할·**공급 경로**·모델·effort·**계량 단위별 수량과 출처**, Hub 추정이면 토큰 계산기 식별자·버전) · **월별 토큰 풀 기준**(계획 단가 기준 판·보정률 제안·수동 보정 근거) · **정책 변경**(변경자·시각·대상·이전 값·이후 값·스냅샷 식별자) · **감사·이력 열람**(열람자·시각·대상 이력 유형·검색·상세 조회 여부)"
    hard_rule: "**조회 결과 원문은 세 계층으로 차등 저장한다** — 메타데이터는 항상 · LLM 전송분은 항상 · **원문은 정책**(기본 미보존). 단 **실행 API 호출로 이어진 턴의 조회 결과는 정책과 무관하게 원문을 보존한다**(잘못 실행된 액션의 사후 조사에서 '어떤 데이터를 보고 실행했는가' 에 답해야 한다). **결과 지문(해시)은 항상 남긴다**"
    note: "**저장하지 않기로 한 것과 저장에 실패한 것은 다르다** — 원문 미보존 설정에서도 메타데이터·전송분의 기록 실패는 처리 실패다"
    traces_to: [PRN-07, REQ-507]
    acceptance: "조회·실행 턴마다 요청·판정·호출·응답·사용량·정책 변경·열람 이력이 누락 없이 남고, 조회 결과 원문은 정책에 따라 차등 보관하되 실행 API로 이어진 턴은 항상 보관하며 결과 지문은 모든 조회에 남는다"
  - id: REQ-108
    type: functional
    priority: must
    actors: [ACT-005]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-02-04
    title: "이력 기록과 트랜잭션 분리"
    detail: "이력 기록은 **업무 트랜잭션과 분리**한다. 소모된 토큰과 이미 실행된 조회·API 호출은 되돌릴 수 없으므로 성공·실패나 롤백 여부와 무관하게 기록이 남아야 한다. 발생 즉시 **별도 트랜잭션으로 커밋**하고 이력 테이블은 **append-only** 로 운용한다"
    hard_rule: "**한 턴은 실제 실행을 시작하는 시점의 정책 스냅샷으로 최종 응답까지 일관되게 처리한다.** 사용자 그룹, 전사 프롬프트 규칙, 지식 베이스, 스키마 카탈로그와 그 접근·마스킹·전송 정책, API 카탈로그를 권한 적용 뒤 고정해 그 턴 동안 재조회하지 않는다 — 스텝 1에서 허용으로 판정한 것을 스텝 3에서 다른 기준으로 검증하면 한 턴 안에 서로 모순된 판정이 생긴다. 대기열에만 있던 턴은 실제 실행 시작 시점에 스냅샷을 잡고, 세션은 여러 날에 걸칠 수 있으므로 일관성 경계로 삼지 않는다"
    note: "턴 이력에는 적용한 각 관리 화면 스냅샷 식별자와 프롬프트 규칙 ID·리비전을 함께 남긴다. 중단된 턴을 재시도해도 같은 턴의 사용자 질의를 재사용하는 한 이 스냅샷을 사용하며, 새 사용자 질의로 만든 새 턴만 그때의 현재 정책을 읽는다"
    acceptance: "조회·API 실행 또는 모델 호출이 실패·취소·업무 트랜잭션 롤백으로 끝나도 발생 이력은 별도 트랜잭션으로 남고, 한 턴의 모든 스텝과 중단 뒤 재시도는 시작 시점에 참조한 정책 스냅샷과 적용 프롬프트 규칙 ID·리비전으로 일관되게 판정된다"
  - id: REQ-109
    type: functional
    priority: must
    actors: [ACT-001, ACT-005, ACT-011]
    source: "2026-09-20 사용자 결정 (ASM-008)"
    process_step: PRC-02-04
    title: "보관과 파기 — 논리 삭제만 허용"
    detail: "**사용자의 대화 이력 삭제는 논리 삭제만 허용한다.** 표시 여부 플래그만 갱신되며 데이터는 삭제되지 않는다. admin 은 감사를 위해 **삭제 표시된 이력도 전량 조회**할 수 있고, 사용자가 감사 대상 기록을 지울 수 있는 경로는 제공하지 않는다. 물리 삭제는 보관 기간 정책에 따른 시스템 일괄 처리로만 수행한다"
    hard_rule: "**재개 상태(체크포인트)는 차등 저장을 우회하는 경로다** — 상태에는 도구 실행 결과 원문이 그대로 포함된다. 따라서 ① 턴이 종결되면 정리한다 ② **이전 회차의 재개 상태는 턴 종결 전에도 정리한다** ③ **보관 기간은 조회 결과 원문의 보관 기간보다 길 수 없다** ④ API 응답은 **마스킹된 사본만 상태에 싣는다**"
    acceptance: "사용자가 이력 삭제를 요청해도 표시 상태만 바뀌고 감사 열람은 유지되며, 물리 파기는 보관 정책의 일괄 처리만 수행한다. 재개 상태는 종결·회차 교체 시 정리되고 원문 보관 기간을 넘기거나 평문 API 응답을 담지 않는다"
  - id: REQ-110
    type: functional
    priority: should
    actors: [ACT-001, ACT-005]
    source: "2026-09-20 사용자 결정 (ASM-008)"
    process_step: PRC-02-06
    title: "품질 신고와 처리"
    detail: "사용자는 받은 응답이 사실과 다르거나 엉뚱하다고 판단되면 **해당 턴을 지정해 신고**한다. 신고 건은 원 응답의 이력과 연결되며, **되돌림이 있었던 턴에서는 최종 응답을 만든 회차의 이력에 연결한다**(버려진 회차의 SQL 을 근거로 분석하면 엉뚱한 결론이 나온다 — 다만 버려진 회차도 조회할 수 있어야 한다). 신고를 접수하면 해당 턴의 사용자 질의·생성된 모든 회차의 응답뿐 아니라 모델 호출, agent 도구·SQL·API 실행, 정책·권한 판정, 사용자 승인 요청·승인/거절, 처리 중 지시 보강·변경·중단, 대기·재시도·되돌림까지 **실제로 실행된 모든 스텝**의 순서·시각·입력·출력·상태 전이를 불변 증거 묶음으로 복사해 일반 대화 이력과 분리 보관한다. 각 모델 호출에는 실제 전달된 내부 프롬프트·선택된 지식과 스키마·전사 및 개인 규칙·정책 판정·모델 설정을 포함한다. 상태는 `접수 → 검토 → 종결` 로 전이하며 종결 시 처리자·일시·판단 사유와 **실제 조치 내역**을 기록한다"
    hard_rule: "**신고자는 자신의 신고 목록과 처리 결과·사유를 조회할 수 있다.** 결과 회신 없이 종결하는 것은 허용하지 않는다 — 신고가 어떻게 처리되는지 보이지 않으면 신고 자체가 들어오지 않아 품질 개선 경로가 끊긴다. 증거 묶음은 두 열람 층으로 나눈다: 신고자는 자신에게 보인 질의·응답·승인 결과와 처리 결과만, 유효 권한의 품질 담당자는 품질 재현에 필요한 전체 스텝 타임라인과 실제 모델 입력 전문(내부 프롬프트·주입 지식과 스키마·규칙·정책 판정 포함)까지 열람한다. 비밀 값·자격증명은 값 자체가 아니라 참조 식별자·버전·지문만 남긴다. 내부 증거를 신고자에게 노출하지 않으며 모든 열람을 감사한다. 자동 감지된 portal·agent 처리 오류는 REQ-115로 별도 관리하며, 응답 품질과 공통 원인이 확인되면 두 건을 직접 병합·상호 종결하지 않고 같은 지식 검토 작업의 근거로 연결한다"
    note: "@defer P3 — 증거 묶음의 별도 보관 기간, 물리 파기·종결 관계, 열람 권한·암호화와 데이터 모델의 정확한 키·무결성 규칙을 확정한다"
    acceptance: "신고자는 자신이 지정한 턴의 신고 상태와 처리 결과를 조회할 수 있고, 종결에는 처리자·시각·판단 사유·실제 조치가 필수다. 내부 증거 전문은 유효 권한의 품질 담당자에게만 열리며 모든 열람이 감사되고, 처리 오류 건과는 병합하지 않고 공통 지식 검토 근거로만 연결된다"
  - id: REQ-111
    type: functional
    priority: must
    actors: [ACT-002, ACT-011]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-11-02
    title: "API 응답의 개인정보 통제"
    detail: "**응답 경로 명세는 허용목록이며 기본값은 닫힘이다** — 명세에 없는 경로는 마스킹해서 화면에 내보내고, 저장하지 않으며, LLM 에 보내지 않는다. 경로 표현은 **정적 경로와 배열 와일드카드까지만** 허용한다. **미지정 경로가 응답에 나타나면 경고로 기록**하고 검토 대상으로 노출한다"
    hard_rule: "**마스킹은 수신 직후에 갈라놓는다** — 감사 이력·재개 상태·애플리케이션 로그로 가는 사본은 처음부터 마스킹된 것만 만들고 **평문은 사용자 응답 경로에만** 태운다. 마스킹된 사본을 만들지 못하면(명세 부재·파싱 실패) 응답 전체를 마스킹 대상으로 다룬다"
    two_axes: "**정보주체 식별자**(사번·고객 ID·주문번호)는 **보존한다** — '누구의 정보를 봤는가' 의 근거다. **민감 값**(주민등록번호·계좌·연락처·주소)은 **마스킹한다** — 필요하면 값 지문을 함께 남긴다. **평문 열람 여부와 그 근거가 된 그룹**은 평문으로 화면에 나간 경우 항상 남긴다"
    why: "차단목록으로 두지 않는 이유는 **레거시의 응답 변경을 감지할 수단이 없기 때문**이다. 차단목록이면 레거시가 필드를 하나 추가하는 순간 미지정 경로가 생기고, 그것이 개인정보면 그대로 평문으로 쌓인다"
    roadmap: RM-P1
    limits: "**등록된 명세만큼만 정확하다.** 값 패턴 탐지는 **보조 수단**이며 이것을 근거로 명세 등록을 면제하지 않는다"
    acceptance: "등록되지 않은 응답 경로는 평문으로 화면·이력·재개 상태·로그·모델 입력에 남지 않고 경고로 기록되며, 마스킹 사본을 만들지 못한 응답은 전체가 마스킹되어 처리된다"
  - id: REQ-112
    type: functional
    priority: must
    actors: [ACT-002]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-02-03
    title: "프롬프트 인젝션·오염 대응과 전사 공통 응답 규칙"
    detail: "사용자 입력·조회된 데이터·지식 문서에 포함된 지시성 문장을 **명령으로 해석하지 않는다.** 개인 기본 지시는 시스템 프롬프트 규칙을 무력화할 수 없고 정책 판정은 항상 서버 규칙이 최종 결정한다. 관리자는 전사 공통 프롬프트 규칙으로 ① 권한 밖·미등록 대상의 존재 은닉과 고정 안내 문구 ② 지식 검색 무결과 시 접근 가능 태그 안내 ③ 전체 지식·문서·본문의 열거·일괄 요약 거절과 구체적 업무·사용법 질문 요청 ④ agent가 생산한 사용자 문구를 portal이 그대로 표시하는 원칙을 관리한다. 규칙은 식별자·우선순위·적용 조건·문구 템플릿·허용 치환값·활성 여부·리비전으로 관리한다"
    hard_rule: "프롬프트 규칙은 응답 문구와 태도를 정할 뿐 권한 경계가 아니다. agent 서버는 접근 그룹 필터, 태그 중복 제거·정렬, 검색 결과 상한, 지식 전체 열람·내보내기 차단을 별도로 강제하며 LLM에 전체 지식 목록·본문을 제공하지 않는다"
    acceptance: "사용자 입력·조회 결과·지식 본문 또는 개인 기본 지시에 정책 우회·권한 확대·도구 직접 호출 지시가 포함돼도 서버 정책과 시스템 규칙이 변경되지 않고, 허용되지 않은 실행은 발생하지 않는다. 전체 지식을 보여 달라는 요청은 본문·제목·건수 열거 없이 구체적 업무 또는 사용법 질문을 요청하는 공통 문구로 응답하며, 태그 안내는 서버가 필터·중복 제거·정렬한 허용 태그만 사용한다"
  - id: REQ-113
    type: functional
    priority: must
    actors: [ACT-002, ACT-006]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-11-01
    title: "중복 실행의 책임 경계"
    detail: "**한 턴 안**의 중복(인스턴스 회수 후 재개 등)은 **Hub 가 막는다**(실행 점유). **턴 사이**의 중복(서로 다른 세션·턴이 같은 대상에 같은 액션)은 **대상 시스템이 막는다** — Hub 는 막지 않는다"
    why: "**후자를 막지 않는 것은 누락이 아니라 결정이다.** 두 사용자가 각자 다른 채팅에서 겹치는 대상을 처리하는 것은 정당한 병렬 업무이며, 파라미터가 일부 겹친다는 이유로 차단하면 정상 업무가 멈춘다. **무엇이 '같은 작업' 인지는 업무 의미론**이고 그 판단을 Hub 가 복제하는 것은 PRN-09 가 금지하는 방향이다"
    hard_rule: "Hub 가 이 층에서 제공하는 것은 차단이 아니라 **가시성**이다 — 승인 화면에 같은 API 의 최근 실행 이력(실행자·시각·파라미터)을 함께 제시해 **사람이 판단**하게 한다. 멱등하지 않은 것으로 등록된 실행 API 는 그 사실과 재시도 정책을 승인 화면에 함께 제시한다"
    roadmap: RM-P1
    acceptance: "같은 턴에서 재개·재시도로 동일 실행이 중복 요청되면 실행 점유가 하나만 통과시키고, 서로 다른 턴의 동일 업무는 Hub가 의미론으로 차단하지 않되 승인 화면에 최근 실행 이력·멱등성·재시도 정책을 표시한다"
  - id: REQ-114
    type: functional
    priority: should
    priority_reason: "RM-P1의 업무 실행은 등록 REST API만으로 성립하며, 내부 서비스 빈 기반 커스텀 도구는 같은 통제 아래 확장하는 후순위 기능이므로 should로 둔다"
    actors: [ACT-002]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-03-01
    title: "커스텀 도구 — PRN-08 의 명시적 예외"
    detail: "설정으로 표현할 수 없는 다중 시스템 데이터 가공은 agent 안의 서비스 빈으로 구현한다. **도구 레지스트리에 등록**되고 **호출 허용 그룹 매핑·실행 유형·명시적 사용자 승인·전량 감사**를 다른 도구와 동일하게 받으며, 미등록·미매핑 상태에서는 호출할 수 없다"
    hard_rule: "커스텀 도구는 코드이므로 SQL 통제 4단계를 거치지 않는다 — **도구별로 입력·출력 계약, 데이터 접근 범위, 민감 데이터 마스킹, 재시도·멱등성, 오류 처리**를 선언하고 구현에서 강제해야 한다. 이 선언과 코드 리뷰·보안 및 고객사 테스트·검수 근거 없이는 노출하지 않는다. **SQL 이나 등록 API 로 가능한 것을 커스텀 도구로 만들지 않는다** — 통제가 검증된 경로를 우회하는 코드가 늘어나는 것 자체가 위험이다"
    note: "공통 레지스트리·권한 판정·감사·승인 흐름은 재사용하지만, 내부 서비스의 데이터 통제는 자동으로 재사용되지 않는다. 요건 승인·코드 리뷰·배포 통제는 고객사 프로젝트 관리 체계의 책임이다"
    roadmap: RM-P1
    acceptance: "등록·그룹 매핑·실행 유형·승인·감사와 도구별 입출력·데이터 범위·마스킹·재시도·멱등성·오류 처리 선언 및 검수 근거가 모두 없는 커스텀 도구는 호출·노출되지 않는다"
  - id: REQ-115
    type: functional
    priority: must
    actors: [ACT-005, ACT-003]
    source: "2026-09-20 사용자 결정 (ASM-008)"
    process_step: PRC-10-01
    title: "portal·agent 처리 오류 기록과 지식 보완 관리"
    detail: "Hub는 portal 요청을 받은 agent가 요청·응답 계약, 컨텍스트 구성, 모델·도구 호출, SQL 검증·실행, 응답 구성 중 실패한 경우를 턴 단위 AI 처리 오류 발생 이력으로 남기고, 해당 턴에서 실제 실행된 모든 스텝(사용자 질의·모든 회차 응답·모델 호출·agent 도구·SQL·API 실행·정책 및 권한 판정·사용자 승인 요청과 결정·처리 중 지시 보강·변경·중단·대기·재시도·되돌림)의 순서·시각·입력·출력·상태 전이를 불변 증거 묶음으로 복사한다. 각 모델 호출에는 실제 전달된 내부 프롬프트와 선택된 지식·스키마·전사 및 개인 규칙·정책 판정·모델 설정을 포함한다. 같은 열린 원인 묶음에는 하나의 오류 처리 건을 자동 생성하거나 연결한다. 새 처리 건은 품질 담당자에게 기존 개인 알림 경로로 알리고, 품질 담당자가 지식 보완 필요를 판정한 경우에만 지식 검토 작업과 업무 자산 관리자를 배정해 추가 알림한다. 처리 건은 `접수 → 분석 중 → 지식 보완 대기 또는 외부 확인 대기 → 조치 완료 → 종결` 상태, 담당자, 조치와 연결 오류 발생을 조회한다"
    hard_rule: "AI 처리 오류 발생 이력과 증거 묶음은 수정·삭제하지 않으며, **system 모듈의 SYS_LO_EXCEPTION을 읽거나 참조하지 않는 별도 admin 자산**이다. 오류 이력에는 턴·단계·추적 식별자와 마스킹·정제한 실패 정보를 저장하고, 증거 묶음에는 품질 재현에 필요한 전체 스텝 타임라인과 실제 모델 입력 전문(내부 프롬프트·주입 지식과 스키마·규칙·정책 판정 포함)을 보관한다. 비밀 값·자격증명은 값 자체가 아니라 참조 식별자·버전·지문만 남긴다. 이 내부 증거는 유효 권한의 품질 담당자만 열람하고 모든 열람을 감사한다. 지식 보완 알림은 범용 알림함의 수동 전달이 아니라 처리 건의 상태 전이·검토 작업 배정으로 발생하며, admin은 system의 public 알림 계약만 사용한다. AI 처리 오류 처리 메뉴 액션은 현재 유효 역할 권한으로 판정하고, 품질 담당자의 장기 부재에는 역할 부여의 유효 시작일·종료일로 한시 대리인을 둔다. 정상 응답의 논리 오류는 품질 신고(REQ-110)로 처리하며, 공통 원인이 확인되면 두 건을 직접 병합·상호 종결하지 않고 같은 지식 검토 작업의 근거로 연결한다"
    note: "@defer P3 — 오류 처리 건을 묶는 안정 지문(실패 단계·오류 분류·영향 자산 등)과, AI 처리 오류·품질 신고·변경 통지를 지식 검토 작업에 연결하는 근거 매핑의 정확한 키·무결성·동시 처리 규칙을 데이터 모델로 확정한다"
    acceptance: "같은 열린 원인 묶음에서 발생한 portal·agent 처리 실패는 턴별 발생 이력을 잃지 않고 하나의 오류 처리 건에서 조회되며, 지식 보완이 필요한 경우 관련 검토 작업으로 연결되고 종결된 건에는 처리자·사유·조치 이력이 남는다"
  - id: REQ-116
    type: functional
    priority: must
    actors: [ACT-004]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-28 사용자 결정(적용 월 잠금·신규 사용자 일할 자동 배정·첫 사용 전 정정·가중치 배분·모델 비활성화 즉시 제외·등급 폐지 절차)"
    process_step: PRC-12-01
    title: "개인별 쿼터 등급·모델 허용 관리"
    detail: "Hub는 사용자 그룹과 독립적으로 사용자마다 쿼터 등급 하나를 부여해야 한다. 쿼터 등급별로 사용자가 주 추론에 선택할 수 있는 공급 경로·모델·effort 집합을 관리하며, 보조 판정 역할의 모델 매핑은 기존 역할별 설정을 따른다. 쿼터 등급은 사용자별 **적용 월** 단위로 관리한다. 관리자는 신규 사용자를 등록할 때 쿼터 등급을 부여하며(기본 선택값은 가장 낮은 등급), 그 등급은 등록한 달부터 적용된다. 관리자는 사용자별 쿼터 등급을 직접 변경할 수 있고 변경 사유를 남긴다"
    hard_rule: "사용자 그룹은 지식·스키마 카탈로그 등 Hub 업무 자산의 접근 통제 기준이며, 쿼터 등급이나 허용 모델은 사용자 그룹·system 역할로 결정하지 않는다. **당월과 지난 적용 월의 등급은 바꾸거나 지울 수 없다.** 직접 변경과 승급 승인은 다음 달 배정 확정(REQ-118) 전이면 다음 달부터, 확정 뒤면 그다음 달부터 적용한다. 이번 달 부족분은 추가 토큰 승인(REQ-119)으로 처리한다"
    why: "같은 접근 범위를 가진 사용자라도 Hub 활용도와 필요한 모델 수준이 다르므로, 접근 통제와 월별 토큰 배정·선택 가능 모델을 분리해야 한다"
    roadmap: RM-P1
    acceptance: "같은 사용자 그룹이라도 사용자별 쿼터 등급과 주 추론 허용 공급 경로·모델·effort를 다르게 관리할 수 있다. 신규 사용자는 등록 때 부여한 등급으로 그 달부터 쓰고, 당월·지난 달의 등급 변경 시도는 거부되며, 직접 변경은 사유를 남겨 다음 달 배정 확정 전이면 다음 달, 뒤면 그다음 달부터 적용된다"
    summary: "사용자마다 쿼터 등급 하나를 두고, 등급이 월 기본 배분 몫과 주 추론에서 고를 수 있는 공급 경로·모델·effort 범위를 정한다. 접근 통제(사용자 그룹)와는 별개의 축이다"
    intent:
      problem: "같은 접근 범위의 사용자라도 Hub 활용도와 필요한 모델 수준이 달라, 그룹 하나로 권한과 사용량을 함께 묶으면 과소·과다 배정이 생긴다"
      goal: "사용량·모델 수준을 사람 단위로 조정하되, 월중 변경이 이번 달 계산을 흔들지 않게 한다"
      not:
        - "사용자 그룹이 아니다 — 그룹은 업무 자산 접근 통제(REQ-103)이고 등급은 사용량·모델 범위다"
        - "system 역할이 아니다 — 역할·메뉴 권한(REQ-502)으로 등급을 정하지 않는다"
        - "보조 판정 역할의 모델 선택이 아니다 — 그것은 역할별 고정 설정을 따른다"
    goal_trace: [IN-06, MET-02]
    decider: "제품 오너(사용자). 고객사별 등급 체계와 값은 도입 시 ACT-004가 정한다"
    preconditions:
      - "사용자 계정이 system에서 활성 상태다(REQ-501) — 활성 사용자 수가 개인 기본 한도의 분모다"
      - "선택 가능한 공급 경로·모델·effort가 외부 모델 관리(FEAT-015)에 등록돼 있다"
    data:
      - { item: "쿼터 등급 정의(등급명·순위·배분 가중치·허용 공급 경로·모델·effort 집합)", origin: "admin 입력", sensitivity: "일반", retention: "발효 월별 이력 보존" }
      - { item: "사용자별 적용 월별 쿼터 등급(사용자·적용 월·등급·근거: 신규 등록·직접 변경·승급 승인)", origin: "admin 입력·REQ-117 승인", sensitivity: "일반", retention: "당월·지난 월은 수정 불가" }
      - { item: "신규 사용자 일할 배정(등록일·적용 등급·그 달 등급 개인 기본 한도·남은 일수·그 달 일수·배정량)", origin: "Hub 계산", sensitivity: "일반", retention: "수정 불가 이력" }
      - { item: "직접 변경 사유·처리자·처리 시각", origin: "admin 입력", sensitivity: "일반", retention: "수정 불가 이력" }
    business_rules:
      - "신규 사용자 등록 화면의 등급 기본 선택값은 순위가 가장 낮은 등급이다"
      - "신규 사용자 일할 배정 = floor(그 달 해당 등급의 개인 기본 한도 × 등록일을 포함한 남은 일수 ÷ 그 달의 일수). 등록 즉시 자동으로 주며 신청·승인을 거치지 않는다"
      - "신규 일할 배정은 일반 배정·추가 승인(REQ-119)과 구분해 기록한다. 기존 사용자의 그 달 한도는 다시 계산하지 않는다"
      - "계획 총 풀은 절대 차단선이 아니므로, 신규 일할 배정이 미배정 계획량을 넘어도 지급하고 초과량을 따로 집계한다"
      - "다음 달 배정을 확정한 뒤 그달이 오기 전에 등록한 사용자는 다음 달 활성 인원에 없으므로, 다음 달 1일에 같은 산식으로 한 달 전체 몫을 자동 배정한다"
      - "그 달 배정 기록이 없는 사용자는 재활성화·재입사도 신규 일할 배정 대상이다. 그 달 배정 기록이 있으면 기존 배정을 그대로 둔다"
      - "등록 때 부여한 등급은 그 사용자의 첫 사용 기록이 생기기 전까지만 정정할 수 있고, 정정하면 신규 일할 배정을 새 등급으로 다시 계산한다. 첫 사용 뒤에는 당월 잠금을 따른다"
      - "개인 기본 한도 = floor(월 총 토큰 풀 × 본인 등급의 배분 가중치 ÷ Σ(등급별 배분 가중치 × 그 등급 활성 사용자 수)). 인원 분포와 관계없이 사람 사이의 한도 비율이 가중치 비율과 같다"
      - "배분 가중치는 등급 정의에 두며 사람마다 따로 주지 않는다. 0보다 큰 수이고 소수점 둘째 자리까지 쓴다"
      - "순위가 높은 등급의 배분 가중치는 낮은 등급 이상이어야 한다. 어기면 월 배정을 확정할 수 없다"
      - "개인별 버림으로 남은 토큰은 미배정 계획량으로 둔다"
    exceptions:
      - "공정 단계의 예외는 PRC-12-01이 갖는다"
      - "당월·지난 적용 월의 등급 변경·삭제 요청은 거부하고, 다음 적용 가능한 달을 안내한다"
      - "등급이 허용하던 모델을 외부 모델 관리에서 비활성화하면 당월에도 선택지에서 즉시 뺀다. 장애·보안·계약 사유이므로 적용 월 잠금의 예외이며, 등급 기록은 바꾸지 않고 이미 진행 중인 턴은 시작 시점 설정을 유지한다(PRN-06)"
      - "등급 폐지·통합은 다음 적용 가능한 월부터만 효력을 갖는다. 소속 사용자를 옮길 등급을 지정하기 전에는 그 달 배정을 확정할 수 없다"
    lifecycle:
      - { state: 예정, next: [적용중], note: "다음 달 이후 적용 월 — 배정 확정 전까지 바꿀 수 있다" }
      - { state: 적용중, next: [종료], note: "당월 — 바꾸거나 지울 수 없다" }
      - { state: 종료, next: [], note: "지난 달 — 바꾸거나 지울 수 없다" }
    permissions:
      - "등급 정의와 사용자별 등급 직접 변경: ACT-004"
      - "본인 등급과 선택 가능 모델 조회: ACT-001(본인만)"
    audit: "등급 정의 변경, 신규 등록 시 등급 부여, 사용자별 직접 변경, 신규 일할 배정은 근거·처리자·처리 시각·적용 월을 수정 불가 이력으로 남긴다"
    volume: "사용자 수와 등급 수는 고객사마다 다르며 아직 확인한 값이 없다"
    config:
      - "등급 목록·순위·허용 모델 집합은 admin 데이터로 배포 없이 바꾼다(PRN-06). 적용은 다음 적용 가능한 월부터다(TRM-154)"
    risk: "해당 없음 — 기술적으로 새로 검증할 구성요소가 없다"
    relations:
      depends_on: [REQ-501]
      constrains: [REQ-117, REQ-118, REQ-119]
      conflicts_with: []
      nfr: [NFR-011]
      interfaces: []
    realization:
      features: [FEAT-005, FEAT-015, FEAT-017, FEAT-101]
      screens: [SCR-005, SCR-015, SCR-021, SCR-101]
    examples:
