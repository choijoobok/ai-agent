  - id: REQ-105
    type: functional
    priority: must
    priority_reason: "RM-P1에서 조회와 실행을 함께 출시하므로, 실행 기능의 안전 경계와 공통 그룹 판정 인터페이스가 첫 출시 범위에 필요하다"
    actors: ["ACT-001","ACT-002","ACT-006"]
    source: "2026-09-15 사용자 결정 (CR-023) · 2026-09-28 사용자 결정(결과 불명은 확정 기록 없이 종결) · 2026-09-28 사용자 결정(저장 사본은 항상 마스킹 — PRN-07 개정) · 2026-09-28 사용자 결정(실행 파라미터는 실행 턴에서 재조회로 생성)"
    process_step: PRC-03-01
    title: "API·도구 실행 통제"
    detail: "호출 가능한 API·커스텀 도구는 목록으로 등록·관리되며 목록에 없는 호출은 불가능하다. API 와 도구는 **유형**(조회/실행)을 갖고, 등록된 실행 API 와 상태를 바꾸는 커스텀 도구는 모두 요청 사용자의 명시적 승인을 받아야 한다. 명세에는 **실행 성공 응답의 의미(완료/접수)·타임아웃·자동/수동 타임아웃 재시도 가능 여부·멱등성·요청 식별자 전달 방식·결과 확인 API 유무와 방법**을 함께 등록한다. 결과 확인 API가 없는 실행도 등록할 수 있다"
    hard_rule: "**판정 미달이면 차단한다.** 중간 상태를 두지 않으며 승인을 받아 실행하는 우회 경로도 없다. 승인은 액션·순서·파라미터에 묶이고 변경·만료 시 무효다(REQ-026). **호출 인증은 시스템 단위 연동 계정으로, 실사용자 신원은 매핑된 식별자를 파라미터로 전달한다.** 결과 확인 API가 없거나 도달 불명 결과를 확인할 수 없는 실행은 재시도하지 않고, Hub는 결과 불명 이력과 대상 시스템에서 수동 확인해야 한다는 안내를 남긴다. 대상 시스템의 실제 처리 여부를 추측해 성공·실패로 종결하지 않는다"
    roadmap: RM-P1
    acceptance: "미등록 API·도구, 현재 그룹이 허용하지 않은 대상, 승인 액션·순서·파라미터와 다른 요청 또는 만료된 승인은 호출되지 않으며, 결과 확인이 불가능한 실행은 자동 재시도·성공 추정 없이 결과 불명 이력과 수동 확인 안내를 남긴다"
    summary: "등록된 API·커스텀 도구만 호출할 수 있다. 실행 유형은 요청 사용자가 승인한 액션·순서·파라미터 그대로만 실행하며, 결과를 확인할 수 없는 실행은 재시도나 추측 없이 결과 불명으로 남기고 수동 확인을 안내한다"
    intent:
      problem: "업무 실행은 되돌리기 어렵고, 대상 시스템이 실제로 처리했는지 Hub가 알 수 없는 경우가 있다"
      goal: "사용자가 승인한 그대로만 실행하고, 모르는 결과를 성공이나 실패로 지어내지 않는다"
      not:
        - "사용자 개인 권한으로 호출하는 것이 아니다 — 인증은 시스템 연동 계정, 실사용자는 매핑된 식별자 파라미터로 전달한다"
        - "결과 불명을 재시도로 해소하는 것이 아니다"
        - "중간 상태나 승인 우회가 있는 통제가 아니다 — 판정 미달이면 차단한다"
    goal_trace: ["GOAL-2","INV-01"]
    decider: "제품 오너(사용자) — 2026-09-15 CR-023에서 RM-P1 포함을 결정했다. API별 명세는 도입 시 ACT-014와 합의한다(CON-019)"
    preconditions:
      - "대상 기능이 REST로 제공되고 서비스 계정·인증 방식이 합의돼 있다(CON-019)"
      - "실사용자의 데이터소스·시스템별 신원 매핑이 있다(CON-021)"
      - "그룹 판정은 공통 컴포넌트 하나로 한다(REQ-103, FEAT-303)"
      - "여러 액션을 한 번에 승인하는 규칙은 REQ-026이 갖는다"
    data:
      - { item: "API·도구 명세(유형·성공 응답의 의미·타임아웃·재시도 가능 여부·멱등성·요청 식별자 전달 방식·결과 확인 API)", origin: "admin 입력", sensitivity: "내부", retention: "정책 스냅샷" }
      - { item: "승인(액션·순서·파라미터·유효 시간·승인자)", origin: "portal 사용자 승인", sensitivity: "개인정보로 표시된 파라미터는 마스킹 사본만 저장(REQ-111)", retention: "수정 불가 이력" }
      - { item: "실행 결과(성공·실패·결과 불명과 안내)", origin: "agent 호출", sensitivity: "응답은 마스킹 사본만 저장(REQ-111)", retention: "수정 불가 이력" }
    business_rules:
      - "목록에 없는 API·도구는 호출할 수 없다"
      - "실행 유형 API와 상태를 바꾸는 커스텀 도구는 모두 요청 사용자의 명시적 승인이 필요하다. 승인은 액션·순서·파라미터에 묶이고 변경·만료 시 무효다(REQ-026)"
      - "결과 확인 API가 없는 실행도 등록할 수 있다. 그 실행이 도달 불명이면 재시도하지 않고 결과 불명 이력과 수동 확인 안내를 남긴다"
      - "결과 불명은 그대로 종결 상태이며 Hub가 나중에 성공·실패로 확정 기록을 받지 않는다 — 사용자는 이미 대상 시스템에서 처리했을 가능성이 높고, 이중 입력은 대부분 남지 않아 목록이 소음이 된다. 업무 결과의 원천은 대상 시스템이다(PRN-09)"
      - "실행 API의 파라미터는 실행을 제안(승인 요청)하는 턴에서 필요한 데이터를 **다시 조회해** 만든다. 앞 턴의 조회 결과를 그대로 파라미터로 쓰지 않는다 — 조회와 실행 사이에 데이터가 바뀔 수 있다. 승인 뒤에는 승인된 값 그대로 실행한다(REQ-026)"
      - "같은 액션을 다시 요청하면 승인 화면의 최근 실행 이력에 결과 불명 건이 함께 보여 사람이 중복을 판단한다(REQ-113)"
      - "API별 결과 불명 비율을 운영 지표로 보여, 자주 결과 불명이 되는 API는 고객사와 결과 확인 API 도입을 협의한다(CON-019)"
      - "도구/API 등록 정보의 내부 관리 승인과 전결 설정은 REQ-601·608·612를 따른다. 해당 설정은 실제 상태 변경 실행의 요청 사용자 명시 확인이나 커스텀 코드 검수·배포 통제를 면제하지 않는다"
