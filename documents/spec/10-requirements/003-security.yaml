  - id: REQ-106
    type: functional
    priority: must
    priority_reason: "외부 모델로 나가는 데이터의 허용 범위를 강제하지 못하면 폐쇄망 고객사에서 모델 호출 자체를 열 수 없다"
    actors: [ACT-002, ACT-007]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-28 사용자 결정(상한 초과 거부·집계 SQL 표준) · 2026-09-28 사용자 결정(저장 사본은 항상 마스킹 — PRN-07 개정)"
    process_step: PRC-02-03
    title: "LLM 외부 전송 데이터 정책"
    detail: "**전송 허용 여부를 테이블·컬럼 단위 설정**으로 통제한다. 조회 API 응답은 카탈로그에 없으므로 **등록된 응답 스키마의 경로 단위**로 통제한다 — API 단위 플래그 하나로는 같은 응답 안의 개인정보와 업무 데이터를 가를 수 없다. **기본값은 차단이며 허용 목록 방식으로 연다.** 전송 시에도 마스킹 규칙과 행 수 상한을 적용하고 전송된 내용은 전량 기록한다"
    note: "**Hub 는 레거시의 암호화 키·복호화 수단을 보유하지 않는다** — 암호화되어 저장된 개인정보는 조회해도 암호문이며 기술적으로 취급이 불가능하다. **평문으로 저장된 개인정보 컬럼이 통제 대상이다**"
    acceptance: "허용 목록에 없는 테이블·컬럼·API 응답 경로는 모델 호출 입력에서 제거되고, 허용된 데이터도 현재 마스킹·행 수 상한을 적용한 뒤에만 전송되며 실제 전송분과 적용 정책이 이력에 남는다"
    summary: "외부 모델로 나가는 데이터를 테이블·컬럼 단위, API 응답은 등록된 응답 스키마의 경로 단위 허용 목록으로 통제한다. 기본은 차단이고, 허용된 데이터에도 마스킹과 행 수 상한을 적용하며 실제 전송분을 전량 기록한다"
    intent:
      problem: "폐쇄망 고객사의 데이터가 외부 모델로 나가면 그 뒤로는 통제할 수 없다"
      goal: "무엇이 어떤 정책으로 나갔는지를 언제든 설명할 수 있게 한다"
      not:
        - "접근 권한이 아니다 — 사용자가 볼 수 있는 데이터도 모델로는 보내지 않을 수 있다(REQ-103과 다른 축)"
        - "암호화된 개인정보의 복호화 통제가 아니다 — Hub는 레거시의 키를 갖지 않고 평문 컬럼이 통제 대상이다"
        - "API 단위 플래그가 아니다 — 같은 응답 안의 개인정보와 업무 데이터를 경로로 가른다"
    goal_trace: [ECO-05, INV-01]
    decider: "제품 오너(사용자). 고객사 허용 목록은 ACT-002, 개인정보 판단은 ACT-011"
    preconditions:
      - "전송 대상 테이블·컬럼이 카탈로그에 등록돼 있다(REQ-301)"
      - "API 응답 스키마와 개인정보 경로가 등록돼 있다(REQ-111, CON-020)"
      - "공급 경로와 모델이 등록돼 있다(ADR-004, FEAT-015)"
    data:
      - { item: "전송 허용 목록(테이블·컬럼·API 응답 경로)", origin: "admin 입력", sensitivity: "내부(보안 정책)", retention: "정책 스냅샷(REQ-103)" }
      - { item: "실제 전송분의 마스킹 사본과 적용 정책 식별자", origin: "agent 모델 호출", sensitivity: "개인정보로 표시된 값은 가린 사본만 저장(PRN-07)", retention: "감사 이력 보존 정책(REQ-107·REQ-109)" }
    business_rules:
      - "기본은 차단이며 허용 목록 방식으로 연다"
      - "허용된 데이터도 마스킹 규칙과 행 수 상한을 적용한 뒤에만 전송한다"
      - "전송된 내용은 전량 기록하되 저장 사본은 마스킹한다 — 허용 목록으로 평문 전송이 허용된 개인정보 컬럼도 이력에는 가려서 남는다(PRN-07)"
      - "대량 데이터의 분석은 **집계 SQL을 수행하는 것을 표준으로 한다** — 원본 행을 모델로 보내 집계시키지 않는다. 데이터 보안과 토큰 절약을 함께 위해서다"
    exceptions:
      - "공정 단계의 예외는 PRC-02-03이 갖는다"
      - "허용 목록 밖의 데이터는 모델 호출 입력에서 제거한다"
      - "조회 결과가 전송 행 수 상한을 넘으면 잘라서 보내지 않고 모델 전송을 거부한다. 사용자에게는 집계 조건으로 다시 묻거나, 원본이 필요하면 결과 그리드의 엑셀 다운로드(REQ-011)로 직접 가공하도록 안내한다 — 일부 행으로 한 해석은 전체처럼 보여 오답이 된다(SUC-02)"
    lifecycle: "해당 없음"
    permissions:
      - "허용 목록 관리: ACT-002(FEAT-019)"
      - "관리 화면 접근은 system 역할·메뉴 권한 데이터로 판정한다 — 특정 역할 하드코딩 없음(AUTHZ-091)"
    audit: "실제 전송분과 적용 정책이 REQ-107의 요청·판정 이력으로 남는다"
    volume: "턴당 모델 호출 수만큼 발생한다. 고객사별 미확인"
    config:
      - "행 수 상한과 제한 데이터의 집계·크기 상한 값은 운영 설정이며 REQ-039에 미룬 P2 결정과 함께 정한다"
    risk: "레거시가 응답 필드를 추가하면 경로 미지정이 된다 — 기본 차단이라 누설 대신 누락이 생기고, 그 누락을 알아채는 경고가 필요하다(REQ-111)"
    relations:
      depends_on: [REQ-103, REQ-111]
      constrains: [REQ-107]
      conflicts_with: []
      nfr: [NFR-026]
      interfaces: [IF-003]
    realization:
      features: [FEAT-019, FEAT-207, FEAT-304]
      screens: [SCR-017]
    examples:
      - { kind: 정상, case: "허용 목록에 주문번호·상품명만 있는 주문 테이블 조회 결과 50행의 요약을 요청하면, 두 컬럼만 마스킹 뒤 행 수 상한 안에서 전송되고 전송 원문과 적용 정책이 이력에 남는다" }
      - { kind: 예외, case: "고객 전화번호 컬럼이 허용 목록에 없으면 모델 입력에서 제거된다. 사용자가 '전화번호도 같이 분석해 줘'라고 해도 전송되지 않는다" }
      - { kind: 예외, case: "9월 주문 3만 행을 '상품별 추세를 분석해 줘'라고 하면 원본 행을 보내지 않고 상품·일자별 집계 SQL로 처리한다. 사용자가 원본 전체를 원하면 그리드의 엑셀 다운로드로 안내한다" }
