      - "**활성 Hub 사용자는 언제나 사용자 그룹을 1개 이상 가진다.** 마지막 그룹은 비활성화와 함께만 뺄 수 있고, 재활성화할 때는 그룹을 다시 지정해야 한다(IF-006의 조직 이동 흐름과 같다)"
