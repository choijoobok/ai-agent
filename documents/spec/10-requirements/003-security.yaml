  - id: REQ-104
    type: functional
    priority: must
    actors: [ACT-001, ACT-005]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-28 사용자 결정(생성·실행 SQL 분리 저장, portal 원문 열람 제거 — 권한 있는 사용자는 admin에서만)"
    process_step: PRC-02-05
    title: "생성 SQL 과 물리명의 노출 통제"
    detail: "**portal에는 SQL 원문과 물리 테이블·컬럼명을 표시하지 않는다.** 사용자에게는 조회 계획만 업무 용어로 제시한다. SQL 원문은 **admin의 조회 이력에서 메뉴 권한을 가진 사용자만** 보며, 누구에게도 **편집과 직접 실행은 제공하지 않는다**"
    why: "사용자가 고친 SQL 을 실행하면 그 SQL 은 LLM 이 만든 것도 관리자가 검수한 것도 아니게 되어, 통제 전제와 감사 이력의 의미가 함께 흔들린다. 일반 사용자가 SQL 원문을 볼 업무상 이유가 없고, 원문에는 스키마 구조가 드러난다"
    note: "**노출 통제는 화면 표시의 문제이며 기록의 문제가 아니다** — SQL 은 항상 감사 이력에 남는다(REQ-107)"
    acceptance: "portal의 어떤 화면에도 물리 테이블·컬럼명과 SQL 원문이 표시되지 않고 업무 용어 조회 계획만 보이며, admin 조회 이력의 메뉴 권한이 있는 사용자만 생성 SQL과 실제 실행 SQL을 읽기 전용으로 본다"
    summary: "portal은 업무 용어로 된 조회 계획만 보이고 SQL 원문·물리명을 보이지 않는다. SQL 원문은 admin 조회 이력에서 메뉴 권한이 있는 사용자만 읽기 전용으로 본다"
    intent:
      problem: "SQL과 물리명이 보이면 스키마 구조가 새고, 사용자가 SQL을 고쳐 실행하려는 요구가 생겨 통제 전제가 무너진다"
      goal: "사용자는 업무 용어로 계획을 확인하고, 원문은 감사·운영에 필요한 사람만 admin에서 본다"
      not:
        - "SQL 편집기가 아니다 — 고친 SQL 실행 경로를 두지 않는다"
        - "portal의 선택 기능이 아니다 — 사용자 그룹으로 portal 원문 열람을 여는 경로를 두지 않는다"
        - "기록 통제가 아니다 — 감사 이력에는 항상 원문이 남는다"
        - "조회 계획을 숨기는 것이 아니다 — 업무 용어 계획은 항상 보인다"
    goal_trace: [ECO-05]
    decider: "제품 오너(사용자)"
    preconditions:
