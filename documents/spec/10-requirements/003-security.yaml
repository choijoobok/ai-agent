      - "도구/API 등록 정보의 내부 관리 승인과 전결 설정은 REQ-601·608·612를 따른다. 해당 설정은 실제 상태 변경 실행의 요청 사용자 명시 확인이나 커스텀 코드 검수·배포 통제를 면제하지 않는다"
