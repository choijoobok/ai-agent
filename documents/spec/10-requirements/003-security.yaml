    lifecycle: "해당 없음"
    permissions:
      - "SQL 원문 조회: admin 조회 이력(FEAT-027)의 메뉴 권한 보유자 — 주로 ACT-005"
      - "관리 화면 접근은 system 역할·메뉴 권한 데이터로 판정한다 — 특정 역할 하드코딩 없음(AUTHZ-091)"
    audit: "admin 조회 이력의 열람은 REQ-107의 감사·이력 열람 기록으로 남는다"
    volume: "해당 없음"
    config: "해당 없음 — portal 원문 열람을 여는 설정을 두지 않는다"
