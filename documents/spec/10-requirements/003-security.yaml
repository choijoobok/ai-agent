  - id: REQ-107
    type: functional
    priority: must
    priority_reason: "AI가 만든 조회·실행의 근거를 사후에 재구성할 수 없으면 감사와 장애 조사가 성립하지 않는다"
    actors: [ACT-005]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-28 사용자 결정(생성·실행 SQL 분리 저장) · 2026-09-28 사용자 결정(저장 사본은 항상 마스킹 — PRN-07 개정) · 2026-09-28 사용자 결정(원문=조회 결과 행·yml 보존 설정·기간 경과 파기·실행 여부로 보존 가르지 않음)"
    process_step: PRC-02-04
    title: "감사 이력 — 전량 기록과 차등 저장"
    decision: "2026-10-01 사용자 승인(ADR-015·016) — 종료 후 원문 기본 보존 기간은 기존 산정 기준의 3개월, 삭제 배치는 매일 1회다. 보존 여부와 무관하게 진행·유효 대기 중에는 공용 DB에 임시 저장하며 미보존 원문은 종료·중단 시 삭제한다. 조사 보호·필수 감사 범위·마스킹은 유지한다"
    turn_identity: "턴 ID는 Hub DB가 전역 양수 BIGINT 시퀀스로 발급한다(1~9,223,372,036,854,775,807). 시간은 ID에 넣지 않고 TURN_STARTED_AT(timestamptz)을 정본으로 보관한다"
    export_audit_link: "공식 엑셀·차트 이미지 내보내기의 필수 기록 대상/순서는 REQ-011.export_audit를 따른다. 사용자·턴/결과·정책/한도·요청 범위·서버 판정과 클라이언트 보고를 연결하고 본 요구사항의 마스킹·메타데이터 보존 원칙을 적용한다. 파일 원문을 감사 목적으로 추가 저장하도록 요구하지 않는다"
    detail: "**요청**(사용자·세션·턴·회차·스텝·원문 질의·전달된 컨텍스트와 프롬프트, **주입한 지식의 안정 식별자·리비전·지식 검토 필요 상태**) · **판정**(업무 연관성·권한·마스킹·차단 내역·그 턴이 판정에 쓴 사용자 그룹·프롬프트 규칙·지식·스키마 카탈로그·API 카탈로그 스냅샷과 판정 시각) · **조회**(생성 SQL·실제 실행 SQL·데이터소스·기준 시각·실행 시간·결과 행 수와 컬럼 목록·**결과 지문**) · **실행**(API·파라미터·결과·승인 이력) · **응답**(LLM 응답 원문·최종 응답·검토 필요 자산 사용 여부) · **사용량**(스텝 역할·**공급 경로**·모델·effort·**계량 단위별 수량과 출처**, Hub 추정이면 토큰 계산기 식별자·버전) · **월별 토큰 풀 기준**(계획 단가 기준 판·보정률 제안·수동 보정 근거) · **정책 변경**(변경자·시각·대상·이전 값·이후 값·스냅샷 식별자) · **감사·이력 열람**(열람자·시각·대상 이력 유형·검색·상세 조회 여부)"
    hard_rule: "**저장 사본은 항상 마스킹한다**(PRN-07) — 조회 결과·모델 전송분·실행 파라미터·API 응답의 업무 데이터 값은 개인정보로 표시된 컬럼·경로·파라미터를 가린 사본만 저장하고, 마스킹 사본을 만들 수 없으면 값을 저장하지 않고 메타데이터와 지문만 남긴다. **조회 결과는 세 계층으로 차등 저장한다** — 메타데이터는 항상 · 모델 전송분(마스킹 사본)은 항상 · **원문(마스킹 사본)은 유한 기간 보존이 기본이며 만료 후 정기 파기한다**. 여기서 보존은 턴 종료 후에도 결과를 남기는 뜻이며, 미보존도 진행·대기 중에는 DB 임시 저장하고 종료·중단 시 삭제한다(ADR-016·REQ-109). **원문은 agent가 DB/DW·조회 API에서 받은 결과 행 데이터**이며 모델 응답과 다르다. 보존 여부와 보존 기간은 yml 설정으로만 정하고 실행 중에 바꾸지 않는다. **실행 여부로 원문 보존을 가르지 않는다** — 실행 API의 파라미터는 실행을 제안하는 턴에서 데이터를 다시 조회해 만들므로(REQ-105), 실행의 근거는 파라미터(마스킹 사본)·승인·결과와 그 재조회의 SQL·기준 시각·결과 지문이다. **결과 지문(해시)은 항상 원본 값으로 계산해 남긴다**"
    note: "**저장하지 않기로 한 것과 저장에 실패한 것은 다르다** — 보존 대상 원문 사본의 기록 실패는 미보존으로 대체하지 않고 처리 실패로 다룬다. 미보존에서도 진행·대기 중 필수 임시 결과와 감사 메타데이터·전송분의 기록 실패는 처리 실패다. 마스킹 불가로 값을 저장하지 않는 경우는 hard_rule의 별도 보안 예외다"
    traces_to: [PRN-07, REQ-507]
    acceptance: "조회·실행 턴마다 필수 감사 이력이 남고, 조회 결과는 YAML에 따른 마스킹 사본으로 기본 3개월 보존한다. 전역 기본값과 데이터소스·대상 시스템별 예외값은 모두 YAML에서 설정하며, 관리자 화면에서 대상별 최종 적용 정책과 전역 기본값 또는 개별 예외값 중 적용 원천을 조회할 수 있다. 화면·설정 변경 요청으로 보존 여부·기간을 변경할 수 없으며 변경은 YAML 수정·배포로 수행한다. 매일 1회 파기 배치는 보존 기한 경과 자료를 지우되 조사 대상은 REQ-110의 삭제 유예 규칙에 따라 제외한다. 조사 완료 후 원래 기한이 지난 자료는 다음 배치에서 삭제 대상이 되고 보존 기간을 다시 시작하지 않는다. 실행 이력에는 실행 턴의 재조회 근거와 파라미터 마스킹 사본이 남고 결과 지문은 모든 조회에 남는다"
    summary: "원문 보존은 턴 종료 후에도 조회 결과를 남기는 정책이다. 진행·유효 대기 중 결과는 공용 DB에 임시 저장한다. 미보존은 종료·중단 시 삭제하고 보존은 YAML의 적용 기한까지 유지해 일일 파기한다. 기본 기한은 3개월이며 전역 기본값과 대상별 예외값은 모두 YAML에서 설정하고 관리자 화면에서 조회한다. 필수 감사·조사 보호·마스킹은 별도 규칙을 따른다"
