  - id: REQ-107
    type: functional
    priority: must
    priority_reason: "AI가 만든 조회·실행의 근거를 사후에 재구성할 수 없으면 감사와 장애 조사가 성립하지 않는다"
    actors: [ACT-005]
    source: "2026-09-21 제품 오너 요구사항 재점검 · 2026-09-28 생성/실행 SQL 분리·저장 사본 마스킹·원문 정의·YAML 보존 설정 · 2026-10-14 사용자 결정: 요청/처리 유형별 감사, 유한 기간 필수 보존·기본 7일·조사 보호, 턴/스텝별 상태와 저장 시점 보완 2026-10-14 사용자 검토 제안으로 대화 메시지 시간순 표시·새 턴 재시도·원본/재시도 양방향 참조를 연결했다. 같은 날 사용자 명시 요청으로 REQ-013과 연관 변경 6건의 전체 보완본을 함께 확정했다. 2026-10-19 사용자 명시 승인으로 REQ-005.execution_parameter_storage와 ADR-025의 실행 파라미터 원값 암호화 임시 보관 예외를 연결했다. 2026-10-19 사용자 요청에 따라 통합 REQ-007의 모델 응답 실행별 스텝·대체 관계·실제 종료와 결과 미사용·호출별 사용량/늦은 정정을 보완했다. 기존 확정 내용은 보존하며 이번 보완을 포함한 카드는 통합본과 함께 검토한다"

    process_step: PRC-02-04
    title: "감사 이력 — 턴/스텝 상태·처리 사실 기록과 유형별 검토"
    decision: "2026-10-14 사용자 승인(ADR-024) — 조회 결과 미보존 설정과 턴 종료 시 원문 삭제를 폐지한다. 원문 마스킹 사본은 수신 시각부터 양의 유한 기간 보존하며 기본값은 7일, 파기는 매일 1회다. 오류·품질·추적 감사 조사에 필요한 자료만 삭제 유예하고 해제 후 원래 기한을 적용한다. 턴/스텝은 접수·시작부터 현재 상태를 저장·갱신하고 상태 변경 사실은 불변 이력으로 추가한다"
    turn_identity: "턴 ID는 Hub DB가 전역 양수 BIGINT 시퀀스로 발급한다(1~9,223,372,036,854,775,807). 시간은 ID에 넣지 않고 TURN_STARTED_AT(timestamptz)을 정본으로 보관한다"
    history_storage:
      ownership: "이 절은 저장 역할·시점·정합성의 정본이다. REQ-006은 표시, REQ-036은 개인 실행 제어/대기열/쿼터, REQ-109는 재개 상태 정리를 맡는다. 턴/스텝 현재 상태, 불변 사건 이력, 결과 사본, LangGraph 실행용 체크포인트를 논리적으로 구분하며 물리 테이블 수·컬럼·인덱스는 P3에서 정한다"
      turn: "비동기 접수 성공을 반환하기 전에 턴과 현재 시도·접수 시각·초기 상태·요청 식별자·접수 사건을 영속 저장한다(REQ-016·036). 접수 대기는 실행 시작과 구분한다. 시작·대기·이어가기·종결 때 현재 상태/버전과 시각을 갱신하고 상태 변경 사실을 추가한다. 전체 상태·허용 전이는 기존 턴 상태 계약을 사용하며 저장 요구 때문에 별도 상태 체계를 만들지 않는다"
      step: "스텝(TRM-003)은 Hub에서 식별·관측하는 모델 응답 실행 1회의 기록이다. 클라이언트 요청 수·HTTP/WebSocket 연결 수·대화/세션 수·스트리밍 청크/콘텐츠 블록 수와 일치한다고 가정하지 않는다. Hub가 직접 시작하는 실행은 외부 전송 전에 시작 시도/근거를 저장하고 미전송·시작 불명을 실제 공급자 시작과 구분한다. 공급자 자동 후속은 이를 유발하는 제어의 허용/전송 기록을 먼저 저장하고, 개별 실행 시작은 실제 시작 이벤트/조회·응답 식별 근거를 확인한 때 별도 스텝으로 기록한다. 아직 시작하지 않은 예상 후속은 스텝이 아니다. 정상 응답 없이 실패·중단·결과 불명으로 끝난 실행도 보존한다. SQL·API·임베딩과 그래프 노드는 별도 작업/호출 기록이며 LLM 스텝으로 일괄 변환하지 않는다"
      facts: "사용자·세션·턴·시도·회차·스텝/실행 건·부모 작업·호출/재시도·이벤트 식별자, 업무 대상·실제 처리 유형·자료 출처·감사 표식, 이전/이후 상태·전이 사유·행위자, 발생 시각·기록 시각·서버 확정 순서/버전, 접수/시작/대기/종료 시각, 인스턴스·점유 토큰, 요청/응답 참조·정책/프롬프트/계약 버전·오류/결과 불명·사용량 원장 참조를 연결한다. 실제 수행 시간 구간은 NFR-008·REQ-006을 따르고 관측되지 않은 종료 시각을 꾸미지 않는다. 필요한 근거 요약은 기록하되 모델 내부 추론 전문을 요구하지 않는다 대화 메시지 식별/기록 순서·응답 대상 입력·원본/직전 재시도/최초 원 요청과 새 턴 참조를 기록하고 물리 관계/키는 P3에서 정한다"
      append_only: "현재 상태 행의 UPDATE는 허용하지만 상태 전이 사건은 INSERT로 추가해 과거를 덮어쓰지 않는다. 시작과 종료는 같은 실행 건에 연결한다. 분류가 나중에 결정되거나 관리자 검토로 보정되면 판정 주체·시각·버전·근거를 추가하고 원 판정을 유지한다. 현재 상태·최신 분류·턴 단위 검색 요약은 이 사실들과 일치해야 한다. 접수/턴 범위 분류와 실제 스텝별 분류를 연결하며 모든 행에 무관한 분류값을 복제하지 않는다"
      atomicity: "Hub의 유효한 현재 상태 갱신과 해당 상태 전이 사건 저장은 함께 확정되거나 함께 실패해야 한다. 이를 외부 업무 트랜잭션과 분리된 감사 기록 원칙과 혼동하지 않는다. 단계 결과 감사는 점유와 무관하게 남길 수 있으나 현재 상태/스텝 진행 요약 갱신은 유효 시도·회차·점유/전이 주체·예상 버전 조건을 통과해야 한다. 동일 이벤트/접수/호출의 중복은 한 사실로 처리한다. 물리 트랜잭션·고유키·조건부 갱신 계약은 P3에서 정한다 동일 실행 변경 시 시작 회차만으로 모든 후속 결과를 버리지 않으며 서버에 저장된 적용 사건·현재 조건 버전과 유효 실행 연결을 함께 검사한다. 변경 적용이 확인되지 않은 결과는 채택하지 않는다"
      handoff: "인계 요청·성공·실패/복구, 점유 획득·해제·만료 회수, 사용자 중단 요청과 실제 중단 확정, 사용자대기 만료를 각각 근거와 함께 기록한다. 점유를 잃은 인스턴스의 늦은 응답은 이전 호출의 관측 사실로만 추가하고 현재 상태를 되살리거나 새 시도의 결과를 덮어쓰지 않는다(ARCH-070). 서버 장애로 종료 기록이 없으면 서버 회수/대조 경로가 중단·결과 불명과 확인 근거를 추가한다. 이전 외부 작업의 미관측 결과를 성공·실패로 단정하지 않는다"
      failure: "필수 접수/시작·동의·전송 시도/실행 직전 기록(ARCH-070의 action_executed 선행 표시 포함)을 확정하지 못하면 접수 성공이나 후속 외부 호출을 진행하지 않는다. 외부 호출 후 기록이 실패하면 신규 후속 작업과 최종 성공 공개를 멈추고 장애·확인 필요를 드러내며 별도 운영 오류/대조 경로로 남긴다. DB 복구 후 같은 식별자로 감사 기록을 보완하고 실제 외부 실행을 무조건 반복하지 않는다. 실행 결과 불명은 REQ-105의 확인/수동 확인 규칙을 따른다. 최종 결과·필수 감사·서버 종결 상태가 일치하기 전에 성공 응답을 확정하지 않는다"
      consumers: "Portal 폴링/진행·상세 시간은 REQ-006·019·040에 따라 현재 유효 상태와 공개 가능한 이력을 사용한다. 감사는 모든 실제 시도/회차와 분류·근거를 조회한다. REQ-036의 한도는 현재 실행 상태, 월 쿼터는 호출 원장과 집계가 기준이며 감사 사건 수를 실행 수나 토큰 사용량으로 세지 않는다. 조회 결과 원문 만료로 상태·시각·분류·전송/사용량 근거까지 함께 지우지 않는다"
      retry_lineage: "명시 재시도는 새 턴의 접수/상태/시도/스텝/호출/시간/사용량을 독립 저장하고 원 턴은 중단 이력으로 유지한다. 서버가 검증한 원본/직전/최초 참조와 메시지 관계를 접수 사실에 연결한다. 양방향 조회는 동일 관계에서 얻으며 단순 관련 참조와 재시도 관계를 구분한다. 각 사실은 실제 실행 턴/시도에 한 번만 귀속하고 연관 조회/합산으로 중복 집계하지 않는다. 관계가 같아도 동일 오류/조사로 자동 병합하지 않는다"
      intervention_lineage: "REQ-007의 변경 방식과 원/후속 실행 관계를 저장한다. 동일 응답 실행 안의 변경이 확인되면 스텝을 유지하고 입력/접수/실제 적용·조건 버전·회차/유효성 변경 사건을 추가한다. 원 시작 회차와 과거 입력을 덮어쓰지 않으며 현재 유효 조건은 적용 사건으로 판정한다. 공급자 자동 후속 또는 Hub 재요청이 실제 새 응답 실행을 만들면 같은 턴·시도 안에 별도 스텝/실행을 생성하고 원본/후속·제어 이벤트·변경 원인과 범위를 연결한다. 같은 연결/세션의 유지나 클라이언트가 새 생성 요청을 보내지 않았다는 이유로 합치지 않는다. 의도 분류도 별도 실제 응답 실행이면 보조 판정 스텝이다. 명시 중단·미실행 계획·카드/제어 접수·대기/적용 통지만으로 새 스텝을 만들지 않는다. DB 조회 등의 원/대체 호출도 별도 연결하고 관계로 시간/사용량을 복제하지 않는다"
      execution_outcome: "제어 요청 접수/반영, 취소 요청/확인, Hub 호출 수신·실행 구간의 종료 시각/근거, 공급자/DB/업무의 실제 종료·통신/업무 결과, 결과 채택/미사용 사유를 분리해 기록한다. 취소 미지원으로 원 모델 응답이 정상 도착했으면 완료·변경으로 결과 미사용이며 취소 완료가 아니다. 취소 요청만 했거나 원격 종료를 확인하지 못하면 해당 사실을 미확인으로 남긴다. Hub가 호출 처리를 끝냈다고 공급자 생성/과금 종료 시각을 꾸미지 않는다. 이미 채택했던 결과가 변경으로 무효화되면 원 채택 사실과 후속 무효화 사건을 모두 보존한다. 실행용 체크포인트 폐기와 원문 보존 기한은 감사 사실·사용량 삭제 사유가 아니다 공급자 변경 종료·Hub 취소·정상 완료를 구분하고 후속 응답이 있다는 이유로 원 실행을 취소 성공으로 바꾸지 않는다. 공급자 세션/응답의 종료를 Hub 턴 전체 종결로 자동 변환하지 않는다"
      usage_attribution: "사용량은 확인된 모델 응답 실행/도구 호출의 계량 범위에 한 번 귀속하고 사용자·턴/시도·스텝/역할·회차 및 조건 변경 사건·공급 경로/모델·외부 실행 식별과 원장 참조를 연결한다. 같은 실행의 청크/누적 usage 갱신은 같은 원장에 대조하고 공급자 자동 후속·Hub 재요청의 별도 실행은 각각 기록한다. 공급자가 실행별 값과 전체 요청/세션 누적값을 함께 보내면 중첩 범위를 합산하지 않는다. 합계만 제공하면 적용 범위를 기록하고 개별 실행 값은 미상으로 남기며 임의 배분하지 않는다. 계량의 확정/추정/미상·단위/계산기 버전·관측 범위와 추론/캐시 중복 방지는 NFR-010을 따른다. 실패·중단·미사용 실행도 포함하고 전체 미상분이 있으면 확인된 소계를 턴 전체 확정 합계로 표시하지 않는다"
      usage_correction: "늦은 계량·공급자 대조는 원 호출의 원장에 기존 근거를 보존한 정정으로 추가한다. 동일 응답 실행/계량 범위의 중복 이벤트/누적 usage 스냅샷은 합산하지 않고 호출의 유효 계량값 하나로 대조한다. 추정 700이 확정 900으로 바뀌면 유효 합산은 900이며 기존 700에 900을 다시 더하지 않는다. REQ-036 집계에는 유효값 차이만 한 번 반영하거나 같은 결과가 되는 재집계를 적용한다. 이미 닫힌 턴·무효 회차의 사용량도 원 귀속을 유지하고 현재 턴 상태·새 호출 사용량을 덮어쓰지 않는다. 사용 월/쿼터와 월별 공급자 대조는 REQ-036·NFR-010·011의 기존 기준을 따르며 회차 변경으로 예산이나 사용량을 초기화하지 않는다 연결 재사용·동일 실행 변경은 별도 사용량을 만들지 않고 각 공급자의 누적/증분 의미를 확인해 정규화한다"
      execution_identity: "Hub 실행 식별자와 공급자/API/계정 경로·응답/메시지/상호작용 또는 개별 모델 실행 식별자·부모 실행·원 제어 요청·연결 세대를 함께 대조한다. 재연결·이벤트 재수신은 같은 실행에 연결하고 공급자가 새 실행을 확인한 경우에만 새 스텝을 추가한다. 외부 ID는 저장된 Hub 범위에서 대조하고 서로 관계없는 계정/실행 문맥의 동일 문자열을 합치지 않으며 같은 실행의 재연결은 기존 이력에 연결한다. 고유 ID가 없으면 문서화·시험된 실행 경계/순서로 Hub ID를 부여한다. 메시지/블록/agent run 하나에 여러 실행이 있는 API는 개별 실행 근거를 매핑하며, 내부 경계가 비공개면 관측 가능한 응답 실행만 기록하고 미관측 실행 수·사용량 분할을 추측하지 않는다. 같은 ID라도 별도 실행을 명시하는 공급자 계약은 그 경계/실행 순번을 함께 기록한다"
      start_observation: "공급자 후속 시작을 관측한 시각과 공급자가 제공한 실제 시작 시각을 분리한다. 시작 시각이 없으면 관측 시각을 실제 시작으로 꾸미지 않는다. 시작 이벤트가 유실돼 종료/결과로 실제 실행 존재가 확인되면 같은 식별자로 이력을 보완하고 시작 시각은 미상/관측 범위를 남긴다. 중복 시작·역순 종료·종결 뒤 도착한 후속 실행도 사실/사용량은 기록하되 현재 진행을 되살리거나 후속 도구를 실행하지 않는다. 저장 장애 중 발생한 자동 실행을 기록 완료로 추정하지 않고 기존 failure 경로로 대조한다"

    verification_intervention_history:
      - {"case":"변경으로 원 요청 취소 후 새 모델 요청 및 별도 의도 분류 호출","expected":"각 실제 요청마다 시작·종료를 가진 별도 스텝/호출을 저장하고 동일 턴/시도·각 회차·원/대체 연결과 분류 역할을 보존한다. 예를 들어 1000+100+2000토큰이면 동일 호출 중복 없이 3100이다"}
      - {"case":"원 모델 응답 정상 완료지만 변경으로 미사용","expected":"완료 결과와 미사용 사유를 분리하고 취소 성공으로 기록하지 않는다. 새 스텝이 원 스텝의 시각·결과·사용량을 덮어쓰지 않는다"}
      - {"case":"명시 중단·시작 전 변경·중복 제어 이벤트","expected":"실제로 시작하지 않은 대체 모델 스텝이 없고 동일 접수/사건 재수신으로 호출·이력·사용량을 복제하지 않는다"}
      - {"case":"Hub 수신 종료 뒤 원격 생성 종료/최종 사용량 미확인","expected":"Hub 종료와 원격 미확인을 각각 기록한다. 수신된 본문 추정과 미상 내부 추론을 구분하고 원격 종료 시각·확정 0토큰을 만들지 않는다"}
      - {"case":"원 호출 추정 700 → 공급자 확정 900 → 동일 계량 재수신","expected":"원 추정 근거·정정 사실은 보존하되 유효 합계는 900이며 증분 200이 한 번 반영된다. 1600 또는 2500으로 중복 합산하지 않는다"}
      - {"case":"무효 회차/종결 턴의 늦은 계량·현재 턴은 새 호출 진행","expected":"사용량은 원 호출·원 귀속에만 정정되고 현재 진행·종결·새 호출 계량은 유지된다"}
      - {"case":"DB 조회 취소 뒤 새 조건 조회와 모델 재생성","expected":"원/새 DB 호출을 각각 기록하고 실제 새 모델 요청만 별도 모델 스텝으로 남긴다. 도구 호출/노드마다 가상의 LLM 스텝을 만들지 않는다"}
      - {"case":"확정 2000토큰과 원 호출의 일부 추정/미상 혼재","expected":"확정·추정 소계와 미상 포함 여부가 분리되고 알려진 2000을 전체 확정 사용량으로 표시하지 않는다"}
      - {"case":"같은 실행의 변경·수백 청크·블록·재연결","expected":"스텝 1개와 변경 사건을 유지하고 원 시작/회차/사용량을 초기화하지 않는다. 누적 계량은 유효값 하나로 집계한다"}
      - {"case":"자동 후속 접수/도구 대기 뒤 별도 응답 실행 시작 및 중복 이벤트","expected":"접수/대기는 사건만 저장한다. 후속 시작 근거에 따라 원 스텝과 연결된 새 스텝을 한 번 생성하고 원/후속 사용량을 각각 연결한다"}
      - {"case":"후속 시작 이벤트 유실 후 종료/사용량으로 실행 확인","expected":"실제 실행 이력을 보완하되 시작 시각을 꾸미지 않고 이미 종결된 턴을 되살리지 않는다"}
      - {"case":"공급자 콘텐츠 step/block와 실제 모델 실행의 다른 단위","expected":"이름만으로 Hub 스텝을 증가시키지 않고 문서화/시험된 실행 경계로 정규화한다. 비공개 내부 실행 수나 사용량 분할을 추정하지 않는다"}
      - {"case":"실행별 계량과 세션/요청 전체 누적값 동시 수신","expected":"범위를 중복 합산하지 않는다. 합계만 있으면 원장 범위와 개별 실행 미상을 남기고 임의로 배분하지 않는다"}

    retention_policy:
      scope: "대상은 DB/DW·조회 API 결과 원문의 마스킹 사본이다. 필수 감사 메타데이터·상태 전이·실제 모델 전송분·원 질의·모델 응답은 각각의 감사 보관 정책을 따르며 일괄 7일 삭제 대상으로 해석하지 않는다. 감사 명목으로 전체 결과를 복제해 원문 기한을 우회하지 않는다"
      duration: "기본 보존은 수신 시각부터 7일(7×24시간)이다. 모든 대상에 0보다 큰 유한 일수를 적용하며 보존 여부 스위치·0·음수·무기한은 허용하지 않는다. 전역 기본과 데이터소스·대상 시스템별 기간 예외를 YAML에서 정하고 개별 값이 없으면 전역값을 적용한다. 관리자 화면은 적용 기간과 원천을 읽기 전용으로 표시한다. 변경은 YAML 수정·배포로 수행한다"
      expiry: "결과 수신 시 적용 정책/버전·수신 시각·원래 만료 시각을 확정해 결과 참조와 연결한다. 폴링·재접속·읽기·대기·재시도·기존 결과 복사/재표현으로 원래 만료 시각을 다시 계산하지 않는다. 재가공을 새 원문 보존의 시작으로 삼지 않는다. 정책 변경은 새로 수신한 결과부터 적용하며 기존 자료 기한의 소급 변경은 별도 명시적 정책 변경으로 다룬다"
      availability: "턴의 완료·실패·중단 또는 체크포인트 정리는 결과 사본 삭제 조건이 아니다. 유효 기한 안에는 현재 권한으로 화면 복원·명시적 후속 참조/가공이 가능하고 LLM 전송에는 REQ-106의 요청·동의를 별도로 확인한다. 기한이 지나면 배치 실행 전 또는 조사 보호 중이라도 일반 열람·다운로드·재가공·실행 입력에서 제외한다. 보존된 마스킹 값으로 가려진 원래 값을 복원하지 않는다"
      purge: "매일 1회 agent 소유 파기 배치가 기한 경과 자료 중 유효 조사 보호가 없는 결과 사본과 파생 복사본을 삭제한다. 참조가 있다는 사실만으로 무기한 제외하지 않는다. 파기 직전 보호를 재검사하고 중복 실행·실패 재처리에서 유실/중복 파기 기록이 없게 하며 대상·시각·사유·성공/실패를 감사한다. 실패는 일반 접근 차단을 해제하지 않고 운영 경고로 드러낸다"
      investigation_hold: "오류·품질 신고·추적 감사의 실제 조사에 필요한 자료만 담당 권한자가 보호한다. 조사/근거 식별자·유형·담당자·사유·대상 턴/스텝/결과 범위·설정 시각·원래 만료 시각과 보호 상태/해제 근거를 기록한다. 자동 오류 발생이나 단순 감사 표식/열람만으로 모든 자료를 무기한 보호하지 않는다. 조사 연결·상태는 REQ-110·115를 따르며 추적 감사 조사도 같은 보호 원칙과 권한을 사용한다. 보호 자료는 조사 중 필요한 감사·증거 열람에 한정한다"
      release: "조사 완료·보호 필요 해소 시 해당 보호를 해제하고, 다른 유효 보호가 없으면 원래 기한을 적용한다. 이미 기한이 지났으면 다음 일일 배치 대상이며 해제일부터 7일을 다시 부여하지 않는다. 연결 취소/재연결은 보호 사유와 실제 필요 범위를 재평가하고 변경 이력을 남긴다. 장기 미완료 보호는 담당자·기간·사유로 조회·재검토한다. 이미 파기된 자료는 조사 재개로 복원할 수 없다"
      unavailable: "만료·파기·마스킹 사본 생성 불가를 결과 불가 사유로 구분해 안내하고 남은 메타데이터/이력만 제공한다. 과거 결과인 것처럼 추정하거나 재조회로 자동 대체하지 않는다. 사용자가 새 조회를 명시 요청하면 현재 권한·원천·쿼터로 처리하고 과거 시점 결과와 구분한다"
    verification_storage_retention:
      - { case: "작업 시작 뒤 프로세스 종료", expected: "접수/시작 기록을 조회할 수 있고 회수·대조 사실이 추가된다. 관측되지 않은 외부 결과를 성공/실패로 꾸미지 않는다" }
      - { case: "시작·종료·실패·대기·중단 및 재시도", expected: "현재 상태 갱신과 불변 전이 이력이 연결되고 이전 실행 건은 유지된다. 006의 작업 시간·대기 구간을 재구성한다" }
      - { case: "중복 접수/이벤트·늦은 호출 응답·상태 갱신 경합", expected: "중복 집계와 이중 상태 전이가 없고 이전 점유의 사실은 감사에 남지만 현재 상태를 바꾸지 않는다" }
      - { case: "시작 전 기록 실패·외부 실행 후 기록 실패", expected: "전자는 호출을 차단한다. 후자는 실행 성공을 공개하거나 외부 작업을 무조건 반복하지 않고 확인·대조한다" }
      - { case: "완료 직후 폴링·브라우저 재접속·이전 결과 가공", expected: "기한 내 결과가 남고 현재 권한과 필요한 동의로 조회한다. 실행용 체크포인트는 정리되며 읽기로 원문 기한이 늘지 않는다" }
      - { case: "미보존·0·음수·무기한 및 소스별 짧은 기한", expected: "잘못된 설정을 거부한다. 양의 기한에서도 REQ-109의 사용자대기/실행 입력 수명 조건을 검증한다" }
      - { case: "기한 만료와 일일 파기 지연", expected: "일반 접근은 즉시 차단하고 물리 파기를 재처리한다. 상태/분류 등 별도 보관 이력은 유지된다" }
      - { case: "조사 보호 시작·해제와 파기 경합", expected: "보호가 먼저 확정되면 파기를 막고 파기가 먼저 완료됐으면 유실 한계를 알린다. 여러 보호가 모두 해제돼야 원래 기한으로 파기한다" }
      - { case: "보호 중 일반 사용자 접근·이미 파기된 과거 결과", expected: "조사 보호가 일반 보존 연장으로 작동하지 않고 자동 재조회/허위 복원이 없다" }
    audit_classification:
      ownership: "분류의 의미·수집·필터 기준은 이 절이 정본이다. 실제 enum·필드·버전은 REQ-009의 소스 계약으로 설계하며 프롬프트는 코드나 감사 이력을 임의 정의하지 않는다"
      request_types: "요청 의도는 지식 질의·업무 데이터 조회·업무 실행·사용자 제공 자료 요약/가공·자료 검증·기존 결과 해석/재표현·기타로 구분한다. 복합 요청은 여러 유형을 연결하며 최초 추정과 최종 분류를 구분한다"
      processing_types: "실제 스텝은 지식 검색·SQL 조회·조회 API/조회 도구·실행 API/실행 도구·결정적 계산/변환·LLM 분류·LLM 요약/해석/작성/검증·임베딩·결과 표시/원문 보기·공식 파일 내보내기 등으로 구분한다. 계획만 한 작업과 실제 시도/완료한 작업을 혼합하지 않는다. 새 유형의 호환·미분류 처리는 P3 계약으로 정한다"
      input_origins: "사용자 직접 제공·Hub 조회 결과·기존 턴 결과·지식·혼합을 구분하며 한 단계에 복수 출처를 허용한다. 외부에서 붙여 넣은 자료의 추정 출처와 서버 검증 출처를 구분한다"
      review_flags: "비업무 추정·업무 연관성 판단 불명·사용자 동의 데이터 전송·동의 거부/범위 불일치·접근/보안 차단·필수 감사 실패·결과 불명·공식 내보내기 등 감사 관심 표식을 복수로 연결한다. 단순 표식만으로 비위·실패를 확정하지 않는다"
      facts: "사용자·세션·턴·시도·회차·스텝·호출 식별자, 유형·출처·업무 판정/근거 요약·모델/가이드 리비전, 동의 식별자/범위/안내 버전과 실제 전송 내역, 실행 상태·시각·사용량을 연결한다. 사용자 요청과 서버가 관측한 실행 사실을 분리하며 상세 추론 과정은 요구하지 않는다"
      query: "관리자는 기간·사용자·요청 유형·실제 처리 유형·자료 출처·업무 판정/표식·동의 전송 여부·처리 결과·검토 상태를 조합해 서버에서 전체 이력에 필터링한다. 턴 단위는 조건에 맞는 스텝이 하나라도 있으면 한 턴으로 중복 제거하고 해당 스텝으로 이동할 수 있어야 한다. 페이지에 로드된 목록만 필터하거나 누락 유형을 정상으로 간주하지 않는다 재시도 원본/직전/최초 참조와 실제 처리 턴을 구분해 조회하고 개별 턴 결과를 유지한다. 관련 턴을 함께 조회해도 각 턴/스텝/호출은 한 번만 집계하며 재시도 전송/실행 이력이 원본에 덮어써지지 않는다"
      review: "관리자 검토는 미검토·검토 중·검토 완료 상태와 업무 관련 판단/보정 의견·검토자·시각·사유를 추가 기록한다. 원래 모델 판정과 처리 사실은 불변으로 보존하고 조회/검토 행위도 감사한다. 기존 품질 신고·조사가 필요한 경우 REQ-110·115에 연결하며 검토만으로 자동 제재하지 않는다"
      reliability: "분류 결과가 없으면 미분류/판단 불명으로 기록한다. 지연 판정·중복 이벤트·재시도에서 동일 사실을 중복 집계하지 않고 실패·취소·거부 턴도 검색된다. 비업무 추정이 한 번 발생한 턴의 근거를 후속 성공으로 없애지 않는다. 관리자 보정은 별도 현재 검토 결과로 조회한다"
    verification_classification:
      - {"case":"직접 자료 요약과 DB 대조가 혼합된 턴","expected":"복수 요청 유형·각 실제 단계·자료 출처가 연결되고 어느 조건으로 검색해도 같은 턴은 한 번 표시한다"}
      - {"case":"비업무 추정·판정 실패·관리자 보정","expected":"추정/불명과 원 근거를 보존하고 검토 상태·보정 이력으로 검색한다"}
      - {"case":"동의 제출·거부·범위 변경·전송 실패","expected":"동의 사실과 실제 호출/전송 사실을 분리해 전송 여부·결과로 필터링한다"}
      - {"case":"재시도·중복 이벤트·이전 페이지 밖 이력","expected":"시도별 사실을 보존하며 서버 필터·턴 중복 제거·스텝 연결을 검증한다"}
      - {"case":"버튼/자연어 재시도 새 턴·원본/최초 참조로 감사 검색","expected":"원본 중단과 새 턴 처리 결과·요청 메시지·동의/전송/사용량을 연결해 조회하되 원 사실을 덮거나 참조 조인으로 중복 집계하지 않는다"}
    export_audit_link: "공식 엑셀·차트 이미지 내보내기의 필수 기록 대상/순서는 REQ-011.export_audit를 따른다. 사용자·턴/결과·정책/한도·요청 범위·서버 판정과 클라이언트 보고를 연결하고 본 요구사항의 마스킹·메타데이터 보존 원칙을 적용한다. 파일 원문을 감사 목적으로 추가 저장하도록 요구하지 않는다"
    detail: "**요청**(사용자·세션·턴·회차·스텝·원문 질의·전달된 컨텍스트와 프롬프트, **주입한 지식의 안정 식별자·리비전·지식 검토 필요 상태**) · **판정**(업무 연관성·권한·마스킹·차단 내역·그 턴이 판정에 쓴 사용자 그룹·프롬프트 규칙·지식·스키마 카탈로그·API 카탈로그 스냅샷과 판정 시각) · **조회**(생성 SQL·실제 실행 SQL·데이터소스·기준 시각·실행 시간·결과 행 수와 컬럼 목록·**결과 지문**) · **실행**(API·파라미터·결과·승인 이력) · **응답**(LLM 응답 원문·최종 응답·검토 필요 자산 사용 여부) · **사용량**(스텝 역할·**공급 경로**·모델·effort·**계량 단위별 수량과 출처**, Hub 추정이면 토큰 계산기 식별자·버전) · **월별 토큰 풀 기준**(계획 단가 기준 판·보정률 제안·수동 보정 근거) · **정책 변경**(변경자·시각·대상·이전 값·이후 값·스냅샷 식별자) · **감사·이력 열람**(열람자·시각·대상 이력 유형·검색·상세 조회 여부)"
    hard_rule: "감사·일반 재개 상태·결과 사본은 마스킹한다(PRN-07). 실행용 원값 암호화 임시본은 REQ-005.execution_parameter_storage와 ADR-025의 제한된 예외이며 감사·증거로 복제하거나 결과 보존/조사 보호로 수명을 연장하지 않는다. 그 이력·사본에 담는 조회 결과·모델 전송분·실행 파라미터·API 응답의 등록된 개인정보 값은 가린 사본만 저장하고, 안전한 사본을 만들 수 없으면 값 없이 메타데이터·지문과 사유만 남긴다. 이는 REQ-111에 따라 응답 전체를 마스킹 대상으로 다루고 값 저장을 제외하는 보안 예외이며 선택 가능한 미보존 설정이 아니다. 값 없는 메타데이터를 결과 사본이 보존된 것으로 표시하지 않는다. 사용자 공개·차단은 REQ-104·111의 통제를 따르고 이 예외를 평문 공개 허용으로 해석하지 않는다. 조회 결과 메타데이터·실제 모델 전송분·조회 결과 원문 사본은 목적별로 분리하며 각각의 보존 정책을 적용한다. 원문은 agent가 DB/DW·조회 API에서 받은 결과 행 데이터이며 모델 응답 원문과 다르다. 원문 마스킹 사본은 retention_policy의 기한까지 보존하고 완료·실패·중단만으로 삭제하지 않는다. 실행 API 파라미터는 실행을 제안하는 턴에서 다시 조회해 만들며(REQ-105), 보존 중인 과거 결과로 현재 실행 근거 재확인을 대체하지 않는다. 결과 지문은 원본 값으로 계산해 남긴다. 현재 상태 갱신과 불변 감사 이력의 구분은 history_storage를 따른다"
    note: "보존 대상 사본·필수 감사 기록의 저장 실패는 처리 실패로 다루며 미보존이나 정상 완료로 대체하지 않는다. 보안상 값 저장 제외와 DB 기록 실패를 같은 사유로 표시하지 않으며 전자는 제외 사유·필수 메타데이터가 정상 저장되어야 한다. 외부 호출 이후 기록 실패는 이미 일어난 업무 실행을 취소하거나 실패했다고 단정할 근거가 아니며 history_storage.failure의 확인·대조 경로를 따른다"
    traces_to: ["PRN-07","REQ-507","REQ-007"]

    acceptance: "조회·실행·직접 입력 처리·동의 전송·비업무 추정 턴이 접수·시작부터 history_storage에 따라 기록되고 audit_classification으로 검색된다. 진행 중에도 턴/스텝의 현재 상태와 시작 근거를 조회하고 종료·실패·중단 뒤에도 변경 순서를 재구성할 수 있다. 재시도·중복·늦은 응답과 관리자 보정은 원 사실을 덮어쓰지 않는다. 조회 결과 마스킹 사본은 기본 7일 및 YAML의 대상별 양의 유한 기한을 적용하고 턴 종료 후 폴링·재접속·명시적 후속 가공에 사용 가능하다. 만료 시 일반 열람/재사용을 차단하고 매일 1회 배치가 조사 보호 없는 사본을 파기한다. 조사 보호 자료는 감사 목적으로만 접근하며 해제 후 원래 기한을 따른다. 적용 기간·원천·수신/만료 시각·보호/파기 상태를 확인할 수 있고 미보존·0·음수·무기한 설정을 거부한다. 변경 전/후와 분류 호출은 독립 실행으로 연결되고 취소 사실과 결과 미사용을 구분한다. 원 호출 계량 유실·늦은 정정·중복 통지에도 사용량 출처와 불확실성이 보존되고 중복 합산이 없다 스텝 수는 스트리밍 조각/연결/요청 수가 아닌 확인된 모델 응답 실행 수와 일치한다. 같은 실행 변경과 공급자 자동 후속을 구분하고 접수만으로 가상 시작을 만들지 않는다"

    summary: "턴 접수·스텝 시작 시 기록을 생성하고 현재 상태를 갱신하며 상태 전이·호출·분류/검토 사실은 불변 이력으로 추가한다. 조회 결과 마스킹 사본은 수신 시각부터 기본 7일간 보존하고 조사에 필요한 자료만 삭제 유예한다. 실행 상태 정리와 결과/감사 자료 파기는 구분한다"
    intent:
      problem: "AI가 만든 조회와 실행의 근거를 사후에 재구성할 수 없으면 감사와 장애 조사가 성립하지 않는다"
      goal: "어떤 턴이든 '무엇을 보고 무엇을 했는가'에 답할 수 있게 한다"
      not:
        - "system 로그(SYS_LO_*)가 아니다 — admin의 감사 자산이다(REQ-507과 구분)"
        - "원문 무기한 보관이나 평문 저장이 아니다 — 마스킹 사본을 정해진 기한까지 보존하고 정기 파기한다"
        - "과거 감사 사실을 임의 수정하는 기능이 아니다 — 현재 상태 갱신·추가 보정 이력·정책에 따른 파기는 구분한다"
    goal_trace: [ECO-05, INV-01]
    decider: "제품 오너(사용자). 원문 보존 정책과 보존 기간은 고객사 ACT-011(CON-032)"
    preconditions:
      - "턴 ID를 Hub DB 시퀀스로 발급한다(turn_identity)"
      - "턴이 판정에 쓴 정책 스냅샷을 참조할 수 있다(REQ-103·REQ-108)"
      - "외부 업무 처리의 성공·롤백과 독립적으로 감사 사실을 확정한다. Hub 현재 상태와 그 상태 전이 이력은 history_storage의 일관성 기준을 따른다(PRC-02-04)"
    data:
      - { item: "기록 대상 전체 — 항목의 정본은 이 REQ의 detail이다", origin: "agent·admin", sensitivity: "업무 데이터 값은 마스킹 사본만 저장. 사용자 질의·모델 응답의 자유 문장은 평문(open 참고)", retention: "논리 삭제만(REQ-109), 보존 기간은 CON-032" }
    business_rules:
      - "턴/스텝 기록의 저장 시점·현재 상태와 불변 이력·오류 복구는 history_storage, 분류/검색은 audit_classification을 따른다"
      - "조회 결과 원문의 유한 기한·조사 보호·파기는 retention_policy, 실행용 재개 상태 정리는 REQ-109가 정본이다"
      - "등록된 개인정보 값은 마스킹 사본만 저장하고 사본 생성 불가는 별도 보안 예외로 남긴다(PRN-07). 저장 실패로 원문 보존을 생략하지 않는다"
