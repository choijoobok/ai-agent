      - "SQL 원문 조회는 감사 이력의 생성·실행 SQL 기록에 기댄다(REQ-107)"
    data: "해당 없음 — 표시 규칙이다. SQL 기록은 REQ-107이 갖는다"
    business_rules:
      - "portal은 SQL 원문과 물리명을 어떤 경우에도 표시하지 않는다"
      - "SQL은 모델이 만든 **생성 SQL**과 행 스코프·기본 필터를 주입한 **실제 실행 SQL**을 따로 저장하고(REQ-107), admin 조회 이력은 둘을 함께 보인다"
      - "admin에서도 편집과 직접 실행은 제공하지 않는다"
    exceptions:
