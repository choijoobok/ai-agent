      "저장 사본은 항상 마스킹한다 — 개인정보로 표시된 카탈로그 컬럼·API 응답 경로·API 요청 파라미터의 값은 가린 사본만 저장한다. 사본을 만들 수 없으면 값 없이 메타데이터·지문만 남긴다(PRN-07)"
      "'조회 결과 원문'은 agent가 DB/DW·조회 API에서 받은 결과 행 데이터다. 모델 응답 원문은 별도 항목('응답')이다"
      "조회 결과는 메타데이터(항상)·모델 전송분의 마스킹 사본(항상)·원문의 마스킹 사본(기본 보존, 유한 기간 경과 후 정기 파기)의 세 계층으로 저장한다. 품질 조사에서 당시 결과를 확인하려는 목적이며, 미보존으로 종료·중단 시 삭제된 결과와 보존 만료로 파기된 결과는 복원할 수 없다"
      "원문 보존 기본값은 조회 결과 수신 시각부터 달력 기준 3개월이며 90일로 치환하지 않는다. 삭제 배치는 매일 1회 실행하고 기한이 지난 자료를 대상으로 한다. 조사 대상 자료의 삭제 유예·해제는 REQ-110을 우선 적용하며, 조사와 관계없는 결과까지 삭제에서 제외하지 않는다"
      "조회 결과 원문의 보존 여부·기간은 YAML에서 전역 기본값과 데이터소스·대상 시스템별 예외값으로 설정한다. 관리자 화면에서는 적용 정책을 조회하며, 변경은 YAML 수정·배포로 수행한다. 개별 예외값이 있으면 해당 대상에 적용하고 없으면 전역 기본값을 적용한다. 화면에는 대상별 최종 적용값과 적용 원천(전역 기본값 또는 개별 예외값)을 구분해 표시한다"
      "보존한 원문 사본은 보존 기간이 지나면 정기 파기 배치로 지우되 REQ-110의 조사 중 삭제 유예를 먼저 확인한다. **배치 관리는 system의 스케줄 배치 화면(FEAT-508)을 그대로 쓰고 새 메뉴를 만들지 않는다.** 원문 사본을 소유한 모듈(agent)에 파기용 BatchJob 빈을 추가하고 공통 RetentionPurger를 재사용한다. 조사 보호 조건을 공통 파기기에 전달하는 계약은 P3에서 확인한다. system의 RetentionPurgeJob 대상 목록에 agent 테이블을 넣지 않는다 — 쓰기 소유권(ADR-013)과 yml 보존 정책의 원천을 유지한다"
      "실행 여부로 원문 보존을 가르지 않는다. 실행 이력에는 파라미터 마스킹 사본·승인·결과와, 파라미터를 만들려고 실행 턴에서 다시 조회한 SQL·기준 시각·결과 지문이 남는다(REQ-105)"
      "결과 지문(해시)은 원본 값으로 계산해 모든 조회에 남긴다 — 마스킹 사본만으로도 '그때 결과와 같은가'를 대조할 수 있다"
      "저장하지 않기로 한 것과 저장에 실패한 것은 다르다 — 메타데이터·전송분의 기록 실패는 처리 실패다"
    exceptions:
      - "공정 단계의 예외는 PRC-02-04·PRC-03-03이 갖는다"
    lifecycle: "해당 없음 — 불변 기록이며 상태 전이가 없다"
    permissions:
      - "감사 이력 열람: ACT-005(원문·민감 상세는 유효 권한 보유자만)"
      - "수정·삭제: 누구에게도 없다"
      - "관리 화면 접근은 system 역할·메뉴 권한 데이터로 판정한다 — 특정 역할 하드코딩 없음(AUTHZ-091)"
    audit: "감사·이력 열람 자체도 열람자·시각·대상 유형·검색·상세 조회 여부로 기록한다"
    volume: "턴마다 여러 스텝의 기록이 쌓이는 가장 큰 저장 영역이다. 원문 보존을 켠 데이터소스의 비율과 보존 기간에 따라 크게 달라지며 규모는 미확인(CON-025)"
    config:
      "조회 결과 원문의 보존 여부·기간은 전역 기본값과 데이터소스·대상 시스템별 예외값을 모두 YAML에서 설정한다. 관리자 화면에서는 최종 적용 정책과 적용 원천을 읽기 전용으로 조회하며 변경은 YAML 수정·배포로 수행한다. 기본 보존 기간은 3개월이고 정기 파기 스케줄은 매일 1회로 활성화해 운영한다. 예시의 7일·30일은 YAML에 설정하는 대상별 예외값이며 기본값이 아니다. 배치 실행 시각·기준 시간대·실패 시 최대 지연은 open에서 구체화한다"
    risk: "저장량과 쓰기 부하가 원문 보존 비율에 따라 커진다 — 목표치는 NFR에서 재고 정한다"
    relations:
      depends_on: [REQ-101, REQ-103, REQ-105, REQ-106, REQ-108]
      constrains: [REQ-104, REQ-109, REQ-110, REQ-115, REQ-207]
      conflicts_with: []
      nfr: [NFR-027]
      interfaces: []
    realization:
      features: [FEAT-019, FEAT-026, FEAT-027, FEAT-028, FEAT-029, FEAT-033, FEAT-210, FEAT-304, FEAT-305]
      screens: [SCR-017, SCR-027, SCR-028, SCR-029, SCR-030, SCR-031]
    examples:
      - { kind: 예외, case: "미보존 소스의 조회 결과도 진행·유효 대기 중에는 DB에 임시 저장한다. 종료·중단 뒤에는 전체 결과를 삭제하고 필수 감사 메타데이터·모델 전송분 사본만 각 보존 정책에 따라 남긴다. 조사 보호가 설정된 자료는 REQ-110을 우선한다" }
      - { kind: 정상, case: "기본 보존 정책에서 조회한 매출 결과의 마스킹 사본을 남긴다. 보존 기한 안에 합계 오류 신고가 들어오면 원천 데이터가 바뀌었더라도 당시 결과와 실제 모델 입력을 대조할 수 있다. 개인정보의 가려진 값까지 복원되는 것은 아니다" }
      - { kind: 정상, case: "10월 1일 수신한 결과는 다음 해 1월 1일 같은 기준 시각에 3개월이 된다. 조사 대상이 아니면 그 시각 이후 첫 일일 배치에서 삭제한다" }
      - { kind: 예외, case: "1월 1일 보존 기한이 지난 결과가 조사 중이면 일일 배치에서 제외한다. 1월 10일 조사 완료 시 원래 기한은 바뀌지 않으며 이후 첫 배치에서 삭제 대상이 된다. 이미 파기된 결과를 뒤늦은 조사로 복원하지는 못한다" }
      - { kind: 예외, case: "10:00에 고객 목록을 조회하고 10:20에 '그중 김철수 고객 배송지를 바꿔 줘'라고 하면, agent는 실행을 제안하는 턴에서 김철수 고객을 다시 조회해 파라미터를 만든다. 10:00 조회 원문은 실행과 무관하게 보존 설정대로 처리되고, 실행 이력에는 10:20 재조회의 SQL·기준 시각·지문과 연락처가 가려진 파라미터 사본이 남는다" }
      - { kind: 예외, case: "데이터소스 A의 원문 보존을 yml에서 30일로 재정의했으면 기한 후 첫 배치가 조사 대상이 아닌 사본을 지운다. 운영 중 admin 화면에서 보존 기간을 늘릴 수는 없다" }
      - { kind: 정상, case: "YAML의 전역 기본값이 보존·3개월이고 데이터소스 A의 예외값이 미보존, 대상 시스템 B의 예외값이 보존·30일이면 관리자 화면은 A의 미보존과 B의 30일을 개별 예외값 적용으로 표시한다. 예외값이 없는 대상은 전역 기본값 적용으로 표시하며 변경은 YAML 수정·배포로 수행한다" }
      - { kind: 예외, case: "메타데이터 기록이 DB 오류로 실패하면 사용자에게 성공 응답을 보내지 않는다" }
    volatility: { level: medium, what: "원문 보존 정책과 보존 기간은 고객사 규제에 따라 다르다. 기록 항목 자체는 고정한다" }
    open:
      - "@defer P6 — 사용자 질의 원문·모델 응답 같은 자유 문장과 system 사용 이력 파라미터(CR-007)의 개인정보 자동 판별·마스킹을 Hub 개발 뒤 별도 기능으로 설계한다. 그전에는 보관 기간과 열람 권한으로 통제한다"
      - "@defer P2 — 일일 배치의 실행 시각·기준 시간대·실패 시 최대 지연·운영 경고 기준을 정한다. 기본 보존 3개월·매일 1회 파기·조사 완료까지 삭제 제외는 확정이다"
      - "@defer P3 — 달력 월의 말일 계산과 조사 보호 시작·해제·파기 경합의 원자적 판정 계약을 구체화한다. 삭제 직전에도 유효한 조사 보호를 확인해 조사 중 자료를 지우지 않는다"
      - "@defer P4 — agent 모듈에 원문 사본 파기 BatchJob 빈을 추가하고(RetentionPurger 재사용, yml 보존 기간 사용) system 스케줄 화면에 등록한다. 운영 적용 시 확정된 보존 기한과 활성화된 정기 파기 스케줄을 확인한다"
    maturity: { level: confirmed, at: "2026-09-28", by: "AI 정리", confirmed_by: "사용자 (2026-09-28 요구사항 정의서 검토 뒤 확정)" }
