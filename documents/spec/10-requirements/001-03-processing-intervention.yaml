  # 기존 008은 아래 007에 통합하여 결번으로 유지한다(2026-10-19 사용자 승인).
  - id: REQ-007
    type: functional
    priority: must
    workstream: agent
    category: "처리 중 사용자 개입"
    actors: [ACT-001]
    title: "처리 중 사용자 개입 — 변경·중단"
    detail: "처리중·개인 순서 대기·사용자대기에서 들어온 입력을 카드 응답·명시적 제어·일반 자연어로 구분하고 대상과 의도를 확인한다. 변경은 같은 턴·시도에서 영향받는 범위만 다시 처리하고, 중단은 후속 처리를 끝낸다. 모델·DB 조회·업무 실행의 실제 단계별 제어와 결과 보고를 적용하며 개발 CLI·운영 API 모두 같은 사용자 조작과 업무 의미를 제공한다. 변경 전후의 실제 실행과 사용량은 각각 연결해 보존한다"
    hard_rule: "명시적 중단은 LLM 판정·개인 실행 순서·추가 승인 없이 접수한다. 접수 성공만으로 취소 완료를 표시하지 않는다. DB 조회는 동기 응답 대기 중에도 취소 요청을 전달할 수 있어야 하며 실제 취소 확인과 취소 시도 성공을 구분한다. 상태 변경 실행 API/도구의 전송 후 취소·롤백 또는 타임아웃에 따른 업무 실패를 단정하지 않는다. 전송/시도·결과 불명 실행의 자동·수동 재시도는 서버에서 차단한다(REQ-013·105·113, NFR-022). 명시적 카드 조작을 LLM의 승인/중단 추론으로 대체하지 않는다. 불명확한 대상·의도를 임의의 턴 변경이나 중단 확정으로 처리하지 않는다. 변경 확정으로 무효화된 결과는 최신 답변·후속 실행에 사용하지 않으며 실제 발생한 사용량은 보존한다. 응답 스트리밍 여부만으로 질의 변경 지원 여부나 공급자 생성 취소 성공을 판정하지 않는다. 변경을 위한 개별 호출 종료를 턴 전체 중단으로 처리하지 않는다. 이전 실행 이력을 새 실행으로 덮어쓰거나 실제 새 응답 실행 없이 예상 후속 스텝을 만들지 않는다"
    source: "2026-10-19 사용자가 DB 조회 취소·전송 후 업무 실행 취소 불가·타임아웃 결과 불명/재실행 금지·결과 보고를 포함한 기존 REQ-007을 확정했다. 이어 기존 008의 입력 분류·조건 변경을 REQ-007에 통합하고 008은 결번으로 두도록 승인했다. 스텝은 관측 가능한 모델 응답 실행 1회로 정련하고 동일 실행 변경·공급자 자동 후속·Hub 재요청, OpenAI·Claude·Gemini 지원, 실제 실행별 이력·사용량·중복 방지 기준을 보완했다. 같은 날 사용자 검토 후 명시 요청으로 상황별 변경·중단·최종 재승인·공통 사용자 동작·처리 결과 보고와 검증 조건 54건을 포함한 REQ-007 전체 통합본을 confirmed로 확정하고 커밋·푸시한다. 연관 REQ-006·107의 추가 보완분 전체 확정은 별도이며 이번 요청으로 해당 카드의 검토 상태를 바꾸지 않는다. 단계 게이트·상세 설계·소스 구현과 운영 API/실환경 시험은 후속이다"

    roadmap: RM-P1
    summary: "입력 접수·대상/의도 확인·현재 상태 검증을 공통으로 수행한 뒤 변경과 중단을 구분한다. 대기·모델·DB 조회·승인·전송된 업무 실행·종결 경합마다 허용 범위를 적용하고, 이전/새 실행과 실제 사용량을 보존하며 접수·반영·외부 결과를 보고한다"
    intent:
      problem: "중단 요청을 받았다는 사실과 외부 실행이 실제 멈췄다는 사실을 혼동하면 취소되지 않은 업무를 취소 성공으로 안내하거나 타임아웃 실행을 중복 전송하게 된다. 모든 입력을 변경으로 분류하거나 최신 턴에 임의 적용하면 승인 응답이 오해되고 다른 요청이 바뀐다. 구현체의 취소 차이 때문에 이전 결과가 다시 반영되거나 실제 비용이 사라진 것처럼 보일 수 있다"
      goal: "사용자가 구현체를 몰라도 진행 중 요청을 변경·분리·중단하고, 무엇이 접수·확인·반영되었는지 알 수 있게 한다. 취소·변경 반영·업무 결과와 사용량을 사실대로 구분한다"
      not: ["요청 스레드 종료·연결 닫기·인터럽트 또는 취소 메서드 반환만으로 대상 DB/모델/업무 시스템의 처리 종료·롤백을 보장하지 않는다","창 닫기·로그아웃은 중단 명령이 아니며 REQ-016을 따른다. 중단 요청 접수는 실행 재시도나 새 턴 생성이 아니다","이미 보낸 프롬프트를 실시간 편집하거나 CLI/API의 응답 문구·지연·토큰·공급자 종료 시점을 동일하게 보장하는 요구가 아니다","의도 확인·추가 정보 입력은 실행 승인이 아니며, 응답 무효화·취소 요청은 사용량 취소나 환불이 아니다"]
    goal_trace: [GOAL-0, IN-02]
    decider: "제품 오너(사용자)"
    preconditions:
      - "요청 사용자·대화·턴/시도/회차·진행 중 호출과 현재 점유를 식별하고 개입 이벤트를 공용 DB에 기록한다(REQ-009·033·107, ARCH-070)"
      - "자연어 입력의 의도·대상 판정과 불확실 시 확인은 REQ-030·031·032, 대기 취소와 실행 선택의 경합은 REQ-036을 따른다"
      - "호출 종류·전송 시도·타임아웃·결과 확인 방법과 DBMS/드라이버의 취소 동작을 구분한다(REQ-037·105, NFR-013·022)"
      - "REQ-005의 대기 요청·카드·승인 버전, REQ-009의 공통 입력/응답 계약, REQ-036의 개인 실행 순서와 현재 상태를 식별할 수 있어야 한다"
      - "REQ-030~035의 분기·분류·확인·영속 이벤트·모델 제어·최소 입력과 이 요구사항의 호출별 취소 경계를 따른다"
      - "구현체 지원 기능·운영 검증은 CON-033·034, 저장/복원과 경합의 실환경 전제는 ASM-003을 따른다"
    data:
      - {"item":"중단 요청 식별·대상 턴/시도/회차·요청자·입력 방식·접수/반영 시각·처리 상태·사유","origin":"portal 조작·자연어 판정과 agent 제어","sensitivity":"업무 및 사용자 식별 정보, 원문은 기존 마스킹 적용","retention":"현재 상태·불변 이력은 REQ-107·109"}
      - {"item":"호출별 취소 요청·확인 근거·전송 사실·통신 종료 원인·외부 처리 결과·후속 차단·재시도 가능 여부","origin":"실행 서버와 등록 DB/모델/업무 호출 어댑터","sensitivity":"외부 시스템의 원본 오류는 운영 이력으로 제한하며 사용자용 표준 사유와 분리","retention":"호출·사용량·감사 보존은 REQ-107·109, 실행 원값은 REQ-005"}
      - {"item":"사용자·대화·입력 식별자와 순번, 응답 대상 카드/턴/시도/회차, 접수·분류·반영 상태","origin":"portal 입력과 agent의 현재 상태","sensitivity":"사용자/업무 정보, 기존 마스킹·권한 적용","retention":"REQ-107·109"}
      - {"item":"분류 제안·변경 항목·무효화 범위·사용자 확인·적용 버전·구현체 호출/취소 사실·사용량 근거","origin":"분류 모델·agent·호출 구현체","sensitivity":"최소 문맥만 분류에 제공, 실행 원값은 REQ-005","retention":"REQ-107·109·111, 실행 원값은 REQ-005"}
    business_rules:
      - "본인이 접근할 수 있는 대상 턴에만 중단을 요청한다. 버튼·카드는 명시적 제어 명령으로 처리하고, 자연어는 중단 의도와 대상 턴을 먼저 판별한다. 대상/의도가 불명확하면 REQ-032에 따라 확인하며 임의의 턴이나 같은 사용자의 모든 턴을 일괄 중단하지 않는다. 명시적 중단을 다시 모델로 분류하거나 모델 쿼터 부족 때문에 접수를 막지 않는다"
      - "중단 요청은 현재 상태·소유권을 검사하고 영속 이벤트와 필수 감사를 저장한 뒤 접수 성공을 응답한다. 같은 요청의 재전송·다중 탭 조작은 기존 접수와 현재 결과로 응답하고 중복 취소·상태 전이를 만들지 않는다. 저장 실패나 접수 응답 유실 시 성공으로 추정하지 않으며 기존 요청/상태 조회로 대조한다"
      - "중단이 반영되면 원 작업의 새 모델 호출·DB 조회·업무 실행·자동 재시도·후속 결과 가공을 시작하지 않는다. 이미 전송한 호출의 결과 수신·사용량/감사·자원 정리와 실행 결과 확인 등 필수 정리는 허용한다. 새로운 업무를 수행하는 후속 처리와 구분하며 중단 시점까지 실제 수행된 사실은 보존한다"
      - "중단과 실행 시작·전송 시도·완료·만료는 현재 상태에 대해 일관된 순서로 판정한다. 중단이 먼저 확정되면 전송하지 않는다. 전송 시도 구간이 먼저 확정됐거나 전송 여부를 확인할 수 없으면 미전송으로 추정하지 않고 전송 후 정책으로 처리한다. 완료가 먼저 확정됐으면 이미 완료되었음을 알리고 완료 이력을 중단으로 바꾸지 않는다"
      - "중단 요청 접수·반영중·처리 결과는 제어 요청의 처리 상태이며 새 턴 상태를 임의로 추가하지 않는다. 호출/제어 경로의 한정된 정리와 필수 기록 후 기존 턴 종결 규칙을 적용한다. 실행 중단과 외부 호출의 결과를 별도로 남기므로 턴의 중단이 외부 업무 취소 성공을 뜻하지 않는다. 이미 확정된 종결을 늦은 응답으로 되돌리지 않는다"
      - "적용 범위는 같은 대화의 접근 가능한 미종결 턴이며 처리중·개인 순서 대기·사용자대기를 포함한다. 접수 성공과 실제 반영은 별개다. 입력 식별자·순서를 보존하고 중복 제출·다중 탭·다른 인스턴스 수신으로 같은 변경이나 새 턴을 중복 생성하지 않는다"
      - "승인·거절·추가 정보·의도 확인 카드 응답은 현재 유효한 대기 요청에 연결해 REQ-005로 처리한다. 값 해석에 모델을 쓸 수 있어도 카드 조작의 의미·대상을 모델 판정으로 바꾸지 않는다. 자연어 답변만으로 실행 승인하지 않으며 만료/무효 카드 응답을 새 질의로 자동 전환하지 않는다. 명시적 중단 버튼/카드는 분류를 우회해 아래 중단 정책으로 처리한다"
      - "일반 입력의 변경/중단 대상은 명시한 카드·답글·턴 참조를 우선하고 서버가 소유권과 유효성을 검사한다. 참조 없는 입력은 현재 문맥에서 대상이 유일하게 식별될 때만 적용한다. 여러 후보이거나 대상이 불명확하면 후보를 확인하며 가장 최근 턴·모든 턴을 임의 선택하지 않는다. 명확한 별개 질의에는 기존 턴 선택을 요구하지 않는다"
      - "추가 정보에 대한 자연어 답변과 조건 변경·별개 질의·중단을 문맥과 현재 질문으로 구분한다. 부족한 값만 보완하는 응답은 REQ-005로 연결하고, 어떤 질문의 답인지나 기존 조건 변경인지 불명확하면 사용자에게 확인한다. 일반 입력의 분류·변경 항목·무효화 시작 단계는 REQ-031의 모델 제안이며 실행 권한이 아니다"
      - "agent는 제안의 형식·허용 대상·현재 상태·입력 순서·승인 유효성을 검사하고 REQ-032의 병행형/차단형 확인을 적용한다. 되돌릴 수 있는 처리는 분류 결과와 되돌릴 수단을 표시하고, 승인 대기·이미 실행한 액션·분류 실패/불명확은 확인 없이 후속 진행하지 않는다. 반영 시점에 상태가 달라졌으면 확인 방식과 적용 가능성을 다시 검사한다"
      - "불확실하여 멈춘다는 것은 확인이 필요한 입력의 반영을 보류한다는 뜻이며 중단 확정이 아니다. 대상이 확정된 턴은 REQ-032의 의도 확인 대기에서 후속 단계를 보류하되 이미 전송된 호출은 REQ-007의 경계를 따른다. 대상 자체가 미정이면 기존 턴을 임의 정지/종결하지 않고 해당 입력의 대상을 먼저 확인한다"
      - "변경은 같은 턴·시도에서 REQ-030의 영향 범위만 무효화하고 필요한 단계부터 다시 처리한다. 별개 질의는 원 턴의 진행·대기 기한·승인을 그대로 두고 REQ-036에 따라 새 턴으로 접수한다. 중단은 아래 cancellation_policy를 따른다. 변경 처리와 REQ-013의 원본 연결 새 턴 재시도를 혼동하지 않는다"
      - "승인 대상·순서·실행값이 바뀌면 REQ-005·026에 따라 이전 승인을 무효화하고 모든 최종 값을 확보·검증·확인한 뒤 다시 승인받는다. 이미 전송/시도한 상태 변경 API의 값·실행 사실은 바꾸지 않고 결과 불명 실행을 변경 입력으로 재전송하지 않는다(REQ-007·105·113)"
      - "모델 분류·사용자 확인·호출 종료 뒤 반영 직전에 상태/회차를 다시 검사한다. 이미 종결·만료·중단되었거나 더 최신 입력에 의해 무효화된 제안을 뒤늦게 적용하지 않는다. 반영하지 못한 이유와 허용되는 다음 행동을 알리고 종결된 턴을 되살리거나 새 턴으로 몰래 옮기지 않는다"
    cancellation_policy:
      queued: "개인 실행 차례 전이면 REQ-036의 원자적 취소로 실행 대상에서 제외한다. 선택·시작이 먼저 반영되었다면 대기 취소 성공으로 표시하지 않고 실제 진행 단계의 중단 정책을 적용한다"
      waiting: "승인·추가 정보·차단형 확인 대기를 끝내고 기존 카드·승인·이어가기 자격을 무효화한다. REQ-005의 원값 신규 사용 차단·삭제와 REQ-109의 실행용 상태 정리를 적용하며 늦은 카드 응답으로 재개하지 않는다. 거절 후 대기 유지와 명시적 중단은 구분한다"
      model: "진행 중 모델 호출의 클라이언트 측 취소·응답 수신 중단을 요청하고 후속 처리를 차단한다. 공급자 서버의 생성 종료는 확인된 범위만 보고한다. 이미 발생했거나 늦게 확인된 사용량·응답 사실은 원 호출에 기록하며 부분/늦은 응답을 새 도구 실행 지시로 사용하지 않는다"
      db_query: "DB 조회 실행 중 취소를 지원한다. 실행 스레드가 동기 응답을 기다리는 동안에도 별도 제어 경로가 현재 조회의 취소 수단을 호출할 수 있어야 하며, 응답이 끝난 후 중단 플래그를 읽는 것만으로 충족했다고 보지 않는다. DBMS·드라이버가 확인한 취소 종료, 이미 정상 완료, 취소 요청 실패/미지원, 종료 확인 불가를 구분한다. 취소 요청의 전송/메서드 반환만으로 조회 취소 성공을 표시하지 않는다. 취소 실패나 확인 불가여도 후속 처리는 차단하고 기존 유한 호출·정체 제한으로 정리한다. 채택한 DBMS·드라이버 조합별 실제 취소 시험 전에는 지원 완료로 보고하지 않는다(REQ-037, NFR-013)"
      execution_before_send: "상태 변경 실행 API/도구의 전송 시도 전 중단이 확정되면 실행하지 않는다. 최종 전송 방어와 중단 판정은 같은 턴/시도/호출 기준으로 경합을 제어하고, 미전송이 확인된 경우에만 실행 요청을 보내지 않았다고 안내한다"
      execution_after_send: "상태 변경 실행 API/도구를 이미 전송/시도한 경우 해당 실행은 Hub에서 취소할 수 없다고 즉시 안내한다. 취소 성공을 만들기 위해 스레드·연결을 강제로 끊거나 별도 업무 취소·보상 호출을 자동 실행하지 않는다. 현재 호출의 응답 또는 기존 타임아웃과 필요한 결과 확인을 처리하고, 미전송 후속 액션은 시작하지 않는다. 현재 액션의 취소 불가와 남은 작업의 중단 결과를 함께 알린다"
      execution_timeout: "실행 전송 후 응답을 못 받으면 통신 원인은 응답 시간 초과, 업무 결과는 확인 불가로 구분하며 실제 업무 실패나 취소 성공으로 표시하지 않는다. 자동·수동 재실행을 금지하고 버튼·자연어·동일 원 요청의 새 턴 재시도로 우회하지 못하게 서버가 검사한다. 등록된 결과 확인 방법이 있으면 NFR-022에 따라 먼저 조회하고, 방법이 없거나 확인하지 못하면 대상 시스템에서 직접 확인하도록 안내한다. 처리 중 결과는 별도 재확인 방법/권장 시각을 알리고 자동 폴링하지 않는다. 결과 확인은 실행 재전송과 구분하며 이후 수동 확인에 따른 Hub 종결 기록 처리와 독립 새 업무의 책임 경계는 REQ-105·113을 따른다"
    change_policy:
      queued: "개인 순서 대기 중 변경은 같은 대기 항목의 유효 입력/버전을 갱신하고 기존 순서를 유지한다. 아직 호출하지 않은 계획에는 중단/대체 스텝을 만들지 않는다. 선택·시작이 먼저 확정되면 새 단계의 정책으로 다시 판정하며 변경 때문에 새 턴/대기 항목을 자동 생성하지 않는다"
      unaffected: "변경 항목과 의존성을 대조해 영향받는 결과·진행 중 호출·미전송 작업만 무효화한다. 예를 들어 출력 형식 변경에 영향받지 않는 DB 조회와 유효 결과는 유지한다. 이전 체크포인트가 무효면 회차를 올리고 이후 단계만 바뀌면 같은 회차를 유지한다. 회차가 바뀌어도 같은 시도의 NFR-013 스텝 예산은 초기화하지 않는다"
      model: "변경된 조건에 영향받는 모델 결과의 적용을 먼저 차단하고 아래 model_change_contract에 따라 같은 실행 유지·공급자 자동 후속·Hub 종료 후 새 요청 중 검증된 경로를 적용한다. 무관한 호출은 유지한다. 개별 응답 실행의 종료/변경이 턴 전체 중단을 뜻하지 않으며 스텝/사용량 기록은 실제 실행 경계에 따른다"
      db_query: "변경된 조건에 의존하는 진행 중 DB 조회는 결과 적용을 막고 cancellation_policy.db_query와 cancellation_control의 독립 제어 경로로 취소한다. DB/드라이버가 조회 취소 종료 또는 정상 완료를 확인하고 호출 자원 정리가 끝난 뒤 변경 조건으로 필요한 조회를 시작한다. 연결 종료만으로 원격 조회 종료를 추정하지 않는다. 취소 미지원/실패·종료 불명은 기존 유한 제한 안에서 확인하고, 끝내 확인하지 못하면 새 조회를 겹쳐 보내지 않고 적용 불가·운영 확인 필요를 보고하며 기존 실패/중단 정리 규칙으로 종결한다. 개별 조회의 취소 성공만으로 턴 전체를 중단하지 않는다"
      result_ready: "이미 반환된 모델/조회 결과는 변경과의 의존성으로 채택 여부를 판정한다. 영향받는 결과와 후속 계획·답변·승인만 무효화하고 사실 이력·실제 시간·사용량은 남긴다. 영향받지 않은 유효 결과는 현재 권한·보존 기한과 조건을 확인한 뒤 재사용할 수 있다"
      user_wait: "추가 정보 보완과 조건 변경을 구분한다. 부족한 값만 채우면 REQ-005의 같은 대기를 이어가고, 대상·순서·실행값 변경이면 이전 카드/승인과 해당 원값 사용을 무효화한 뒤 모든 최종 값을 확보·검증·확인하여 재승인받는다. 변경 확인과 추가 질문으로 원래 사용자대기 만료 시각을 연장하지 않는다"
      execution_before_send: "승인 후 미전송이라도 값·대상·순서 변경은 재승인이 필요하다. 변경 반영과 최종 전송 시도 표시는 같은 현재 버전 기준으로 경합을 판정한다. 변경이 먼저면 이전 승인으로 전송하지 않고, 전송 시도가 먼저이거나 여부 불명이면 전송 후 정책을 적용한다"
      execution_after_send: "이미 전송/시도한 상태 변경 API/도구는 현재 입력·승인·실행 사실을 수정하거나 취소·재전송하지 않는다. 원 호출의 결과 또는 기존 타임아웃/결과 확인을 처리하고 변경 영향이 있는 미전송 후속 작업을 보류한다. 사용자에게 변경 불가한 기존 실행과 변경 가능한 남은 범위를 구분해 확인받고, 필요한 재승인 후 미전송 범위만 수행한다. 결과 불명 시 원 실행을 다시 요구하는 변경은 차단하고 REQ-105·113의 확인 경로를 따른다"
      partial_execution: "복수 액션 중 완료/전송한 작업은 원 사실과 결과를 보존한다. 남은 작업의 변경 범위를 사용자에게 확인하고 변경된 실행 전체 값을 다시 승인받는다. 완료 액션을 회차 변경으로 반복하거나 기존 실행의 취소·보상 액션을 자동 추가하지 않는다"
      finalizing: "최종 답변 작성 중이라도 미종결이면 영향받는 답변을 무효화하고 필요한 범위부터 다시 처리한다. 서버의 최종 종결이 먼저 확정되면 원 턴 변경은 반영 불가로 알리고 원 완료를 보존한다. 사용자에게 새 요청이 필요함을 안내하되 자동으로 새 턴을 만들지 않는다"

    model_change_contract:
      basis: "변경 경로는 스트리밍 여부·연결/세션 재사용·클라이언트 호출 횟수가 아니라 구현체가 확인한 모델 응답 실행 경계로 결정한다. 스텝의 정본은 TRM-003·REQ-107.history_storage다. 같은 실행 유지, 공급자 자동 후속 실행, Hub의 종료 후 새 요청을 구분하며 미확인 기능을 지원으로 추정하지 않는다"
      same_execution: "공급자 계약과 실환경 시험에서 동일 응답 실행 안의 변경 반영이 보장될 때만 기존 스텝을 유지한다. 변경 입력/접수·실제 적용·조건 버전·유효 결과 범위를 사건으로 추가하고 원 시작/사용량을 초기화하지 않는다. 청크·콘텐츠 블록·상태 통지 수신과 같은 실행의 재연결은 새 스텝이 아니다. 단순 연결/응답 ID 유지만으로 내부 실행이 같다고 추정하지 않는다"
      provider_continuation: "공급자가 변경 입력을 받아 새 응답 실행을 자동 생성하는 경우 원 스텝은 보존하고 실제 후속 실행의 시작/식별 근거가 확인될 때 새 스텝을 생성·연결한다. 접수/큐 대기/도구 결과·승인 대기는 새 실행 시작이 아니며 해당 개입 사건으로만 기록한다. 자동 후속 실행을 기다리는 동안 같은 변경으로 Hub가 새 요청을 중복 전송하지 않는다. 연결 종료와 무관하게 개별 실행 완료를 검증/도구·승인 경로에 전달한다. 대기 해소에 필요한 유효한 도구 결과·승인 결과 제출은 중복 변경 요청과 구분하며 현재 조건·권한·승인과 새 실행 허용 검사를 거친다. 대기 자체는 무효/미승인 도구 실행을 허용하지 않는다. 원 응답의 변경 종료/정상 완료·후속의 시작/종료·사용량은 각각 남긴다. 원 실행과 후속 실행의 순서·겹침 여부는 공급자 계약/관측 사실을 따르며 두 실행이 있다는 이유로 동시 실행으로 표시하지 않는다"
      hub_replacement: "동일 실행 변경이나 자동 후속을 지원하지 않거나 공통 통제를 충족하지 못하면 기존 결과의 적용을 차단하고 cancellation_policy.model 및 REQ-034의 취소/유한 종료 경로를 사용한다. Hub의 원 호출 수신/실행 종료와 필수 기록·정리가 확인되고 현재 입력·권한·점유가 유효할 때 변경 조건으로 새 요청을 보낸다. 원격 생성 종료 미확인은 별도로 남기며 정리가 확인되지 않으면 중복 요청 대신 적용 불가를 보고한다"
      admission: "변경을 외부에 전달하기 전에 권한·동의·현재 입력 버전/점유·필수 전송 기록을 확인한다. 새 응답을 유발할 수 있는 제어도 새 실행의 사전 허용 대상으로 검사하고 NFR-012의 활성화된 쿼터 재검사와 NFR-013의 같은 시도 누적 스텝 상한을 우회하지 않는다. 자동 후속의 각 실행 경계에서 필요한 검사·중단/승인 통제를 보장할 수 없으면 그 경로를 사용하지 않고 Hub 제어 재요청으로 처리한다. 사전 허용/예산 확보 기록은 실제 스텝 시작이나 토큰 예약이 아니며 미시작분은 해제한다. 사용량은 어느 경로든 실제 발생량을 남긴다"
      recovery: "변경 전송·공급자 접수·실제 적용·후속 실행 시작을 별도 식별하고 중복/역순 이벤트와 재연결을 대조한다. 접수 응답 유실·연결 단절로 자동 후속 실행 여부가 불명하면 같은 변경을 무조건 재전송하거나 Hub 재요청으로 전환하지 않는다. 공급자가 미접수/미실행을 확인했거나 기존 실행과 제어를 정리해 후속 중복이 없음을 확인한 뒤에만 한 경로로 재시도한다. 기존 유한 제한 안에 대조하지 못하면 확인 불가로 보고하고 기존 오류/종결 규칙을 적용한다"
      result_guard: "어떤 경로도 이미 전송된 업무 실행을 취소하거나 바꾸지 않는다. 무효 조건의 결과·부분 도구 인자·대기 중 변경의 미적용 결과는 실행에 사용하지 않는다. 후속 응답과 같은 실행의 변경 결과도 현재 조건·권한·완결성·승인을 재검사하며 공급자 내부 이어가기나 도구/승인 대기 이벤트를 사용자 실행 승인으로 취급하지 않는다"
    implementation_contract:
      common: "개발 CLI와 운영 API는 같은 입력 방식·대상 확인·분류/확인 규칙·변경 적용 범위·승인 통제·접수/반영 안내·재접속 복원을 제공한다. 사용자가 구현체에 맞춰 취소 후 재입력하거나 다른 절차를 택하게 하지 않는다. 공통 의미를 제공할 수 없는 구현체는 해당 용도 미지원으로 표시하고 성공처럼 모사하지 않는다"
      replacement: "변경은 change_policy와 model_change_contract의 단계별/구현체별 경로로 처리한다. 모델 스트리밍 수신 자체를 입력 변경 기능으로 취급하지 않는다. DB 조회는 기존 종료 확인 조건을 유지하며, 무효 결과와 부분 출력·늦은 콜백은 최신 답변이나 후속 실행에 쓰지 않는다"
      visibility: "변경 입력 접수·사용자 확인 필요·이전 호출 정리/변경 반영중·변경된 조건으로 처리중·반영 실패를 실제 서버 기록에 따라 안내하고 REQ-006·040으로 복원한다. 구현체 이름·스트리밍 여부를 사용자 조작 조건으로 노출하지 않는다. 응답 지연과 취소 가능 범위가 다르면 기다리는 이유와 결과를 사실대로 알리며 즉시 반영·공급자 생성 종료·비용 절감을 보장하지 않는다"
      accounting: "스텝은 모델 응답 실행 1회이며 클라이언트 요청·연결·스트리밍 이벤트 개수와 일치한다고 가정하지 않는다. 동일 실행 변경은 기존 스텝에 사건만 추가하고 공급자 자동 후속/Hub 재요청으로 새 실행이 시작되면 별도 스텝을 연결한다. 실행별 사용량과 누적/부분 계량의 중복 방지는 REQ-107.history_storage·NFR-010, 쿼터/월 대조는 REQ-036·NFR-011을 따른다"
      validation: "같은 입력·상태·확인 선택과 통제된 분류 제안을 CLI·API 공통 시험에 넣어 적용 대상·분기·최종 유효 조건·승인 요구·무효 결과 차단·표시 상태가 같은지 검증한다. 자연어 판정 품질은 별도 검증하며 응답 문장/시간/사용량의 완전 일치를 요구하지 않는다. 운영 API의 실제 스트리밍 취소·추론/사용량·동시성은 구독 확보 후 따로 검증한다. OpenAI·Claude·Gemini의 채택 API/모델별로 같은 실행/자동 후속/Hub 재요청의 구분과 시작/종료·접수/적용·중복·재연결·사용량 범위를 시험한다. API 이벤트 이름이 같거나 step이라는 이름이 있다는 이유로 Hub 스텝에 바로 대응하지 않는다"

    provider_support:
      required: "OpenAI·Claude·Gemini를 공급자 지원 대상으로 둔다. 공급자 고유의 처리 중 변경 기능 유무와 무관하게 Hub의 같은 입력·확인·승인·중단/변경 결과를 지원해야 한다. 기본 대체 경로는 model_change_contract.hub_replacement이며 고유 기능 미지원만으로 공급자 전체를 미지원으로 처리하지 않는다"
      capability: "채택 공급자·API 종류/버전·모델·SDK/연동 구현체별로 응답 스트리밍, 같은 실행 변경, 자동 후속 실행, 취소/실제 종료 확인, 실행 식별/중복 대조, 사용량 단위, 재연결/복구와 사전 통제 가능 여부를 구분해 검증한다. 특정 API의 지원을 같은 회사의 모든 API/모델에 일반화하지 않는다"
      hosted_agent: "Claude Managed Agents·Gemini Live/관리형 Agent 같은 별도 API는 일반 모델 API와 구분한다. 공급자가 맡는 도구 실행/여러 모델 호출·원격 세션/보존·모델 제약이 Hub의 현재 권한·최종 승인·이력/계량·배포 제약에 맞는지 검증해야 한다. 사용자가 두 공급자 지원을 요청했다는 이유로 해당 관리형 제품이나 음성 전용 모델을 자동 채택하지 않는다. 같은 실행 변경은 검증 조건이며 세 공급자 모두가 이미 제공한다는 선언이 아니다"
    cancellation_control:
      delivery: "변경으로 필요한 취소 또는 명시 중단의 영속 제어 이벤트를 REQ-033에 따라 현재 실행 점유 서버에 전달한다. 요청 접수 서버가 다른 서버의 스레드/연결 객체를 직접 제어하지 않으며 실행 서버의 독립 제어 경로가 자기 인스턴스의 해당 호출에 취소를 요청한다. 동기 응답 대기 중에도 제어 이벤트를 확인하고 목적이 변경인지 턴 중단인지 구분해야 한다"
      identity: "취소 대상은 턴/시도/회차·호출 식별자·점유 토큰에 묶인 현재 실행 객체로 한정한다. 호출 종료 시 참조를 해제하고, 늦은 취소가 다음 호출·새 시도·다른 사용자 또는 풀에서 재사용된 연결을 취소하지 않게 등록/해제와 취소 경합을 제어한다. 객체 참조·스레드 ID만을 영속 실행 권한으로 사용하지 않는다"
      failure: "중단 전달·취소 호출·실행 종료 확인은 각각 유한한 시간/정체 제한을 갖고 원 호출의 타임아웃을 늘리지 않는다. 실행 서버 장애·점유 상실 시 ARCH-070의 회수와 늦은 결과 처리를 적용한다. 소유 서버에 도달하지 못했거나 확인 근거가 없으면 취소 성공을 추정하지 않는다. 로컬 실행 자원 정리·개인 실행 자리 해제와 원격 DB/업무 처리 종료의 확인을 구분하며 REQ-036의 중복 해제 방지를 따른다"
    result_reporting:
      producer: "agent가 중단 이벤트·전송/취소 근거·호출 결과·현재 상태를 대조해 구조화된 결과와 표준 사용자 문구를 만든다. 결과 보고에 LLM을 다시 호출하지 않으며 portal은 REQ-027의 계약대로 표시한다. 사용자 문구는 P3에서 MSG 키/서버 메시지 계약으로 연결한다. 변경 접수/반영·개별 호출 취소 결과 안내에도 같은 사실 기반 보고를 사용하며 원래 질의의 최종 업무 답변 생성과 구분한다"
      phases: "중단 요청이 저장되면 접수 사실을 먼저 알리고, 처리 중에는 대상 작업과 확인 중인 범위를 표시하며, 반영 결과가 저장되면 같은 요청의 현재 표시를 갱신한다. 접수와 실제 반영을 구분하고 REQ-006·040의 폴링·재접속·다중 탭 복원으로 최신 결과를 제공한다. 중단 접수만으로 최종 응답 폴링을 끝내지 않는다. 변경도 같은 접수/반영 구분을 사용하며 확인 필요·이전 호출 정리·새 조건 처리·반영 불가를 implementation_contract.visibility에 따라 표시한다. 변경에 대한 취소 결과와 턴 전체 중단 결과를 구분한다"
      facts: "보고에는 중단 대상·Hub 후속 작업 차단 여부·진행 중 호출의 취소 여부/근거·외부 업무 결과·타임아웃 등 사유·재시도 가능 여부·필요한 다음 행동을 구분한다. 해당 없는 항목을 취소 성공으로 채우지 않으며 확인됨·취소되지 않음/지원 불가·확인 불가를 구분한다. 권한 밖 업무 값·원본 예외·인증 정보는 노출하지 않는다"
      examples:
        - { situation: "대기 취소 확정", message: "대기 요청을 취소했습니다. 실행을 시작하지 않았습니다." }
        - { situation: "DB의 취소 종료 확인", message: "조회를 취소했습니다. 후속 처리는 진행하지 않습니다." }
        - { situation: "DB 취소 요청 뒤 종료 확인 불가", message: "후속 처리를 중단했습니다. DB 조회가 종료되었는지는 확인되지 않았습니다." }
        - { situation: "업무 실행 전송 후 중단 접수", message: "이미 실행 요청을 전송하여 Hub에서 취소할 수 없습니다. 해당 작업의 결과를 기다리며 남은 작업은 진행하지 않습니다." }
        - { situation: "실행 타임아웃·등록된 확인 방법 없음/확인 실패", message: "응답 시간 초과 — 실행 결과 확인 불가. 대상 시스템에서 처리되었을 수 있어 재시도할 수 없습니다. 대상 시스템에서 처리 결과를 직접 확인해 주세요." }
    exceptions:
      - "중단 접수 실패·접수 응답 유실·이미 종결된 턴은 현재 상태를 대조해 안내한다. 중단 저장/전달 오류를 모델 실패 또는 외부 업무 실패로 바꾸지 않는다"
      - "취소가 늦어 조회/업무 호출이 정상 완료된 경우 이미 완료된 사실과 후속 중단을 함께 보고한다. 취소 미지원/오류와 외부 종료 확인 불가는 다른 결과다"
      - "접수 저장 실패·응답 유실은 기존 입력 식별자로 대조하며 접수/반영 완료를 추정하지 않는다. 대상 없음·권한 없음·만료/종결·무효 카드의 사유는 허용 범위 안에서 안내한다"
      - "분류 모델의 오류·시간 초과·유효하지 않은 구조화 응답은 REQ-032의 확인 경로로 연결하며 임의의 변경/중단을 만들지 않는다. 확인 대기 만료는 기존 사용자대기 규칙을 따른다"
      - "모델 호출 취소 실패/미지원은 변경 입력 유실을 뜻하지 않는다. 기존 유한 호출/정체 제한 안에서 종료를 확인하고, 정리 실패로 계속할 수 없으면 그 사유를 보고한다. 중복 호출·무한 대기·취소 성공 위장은 허용하지 않는다"
    lifecycle: "입력 접수 → 종류/대상 확인 → 필요 시 의도 분류·사용자 확인 → 현재 상태 재검사 → 변경/별개/중단 또는 반영 불가 안내. 이는 입력 처리 흐름이며 새 턴 상태 코드를 정의하지 않는다. 병행형은 처리중, 차단형은 기존 의도 확인 대기, 변경은 같은 시도/필요 회차 갱신, 별개 질의는 새 턴이다 접수·사용자대기에서 취소가 확정되면 기존 중단 종결로 연결한다. 처리중에는 호출별 cancellation_policy에 따라 취소/응답/타임아웃·필수 정리와 기록을 처리한 뒤 중단한다. 이미 종결된 상태는 보존하며, 외부 업무 결과 불명은 호출 결과로 남기고 턴 중단/실패와 혼동하지 않는다. 실행용 상태·원값 정리와 감사 보존은 REQ-005·109를 따른다 변경으로 개별 모델/조회가 중단되어도 턴은 유효한 같은 시도로 계속하며, 변경 정리 실패·별도 STOP·기존 만료/실패 조건이 발생하면 해당 종결 규칙을 적용한다"
    permissions: "본인이 현재 접근 가능한 대화·턴·대기 요청에만 입력을 연결한다. 모델의 대상 제안으로 권한 검사를 생략하지 않으며 후보 확인에서도 권한 밖 정보는 노출하지 않는다"
    audit: "입력 접수·대상 근거·분류 제안/모델·사용자 확인·agent 반영/거부·무효화 범위·호출 취소/종료·사용량 근거를 연결한다. 상태와 불변 사건·마스킹/원값·보존은 REQ-005·107·109·111을 따르며 폐기 결과의 본문을 무기한 보존하지 않는다 중단 입력·접수/반영 시각·요청/호출 식별자·점유·취소 요청과 확인 결과·전송/타임아웃/업무 결과·재시도 거부·후속 차단·정리 결과를 REQ-107·109의 현재 상태/불변 사건으로 남긴다. 사용자 보고의 근거와 원 호출의 실제 사용량을 연결하고 원값·원본 오류는 기존 마스킹/접근 규칙을 따른다. 이전/새 스텝·호출의 대체 관계·각 결과의 채택 여부와 원 호출 사용량 귀속은 REQ-107.history_storage가 정본이다"
    volume: "중단은 개인 실행 순서를 기다리지 않는 제어 요청이다. 중복 제출·다중 탭·다중 인스턴스에서도 같은 대상에 한 번 반영하며 새 실행 자리를 요구하지 않는다 여러 미종결 턴·연속 입력·다중 탭/인스턴스를 처리한다. 순서와 묶음은 REQ-033·035, 개인 한도는 REQ-036, 분류 호출 예산은 REQ-031의 후속 설계를 따른다"
    config: "기존 호출 타임아웃·정체 제한·점유/회수·폴링 설정을 따른다. 취소 전달/확인 지연·자원 정리의 유한 상한과 DBMS별 호출 계약은 P3에서 정하고, 취소 때문에 원 호출 기한을 연장하거나 턴 전체 시간 상한을 새로 두지 않는다 분류 역할 모델은 REQ-031·610, 호출 시간/정체·개인 한도는 기존 NFR, 의도 확인 대기 만료는 REQ-032를 따른다. 구현체 능력은 소스 계약으로 확인하며 새 사용자별 변경 모드나 임의 수치를 추가하지 않는다"
    risk: "동기 호출 중 제어 경로의 정체, 호출 객체 재사용/해제와 늦은 취소, 중단/전송 시도/종결 경합, 취소 요청 성공과 실제 종료 혼동은 실제 드라이버·다중 인스턴스 시험이 필요하다. 늦은 분류/응답·취소 실패·입력과 전송/종결의 경합·사용량 누락이 잘못된 실행이나 비용 오표시를 만들 수 있다. CLI만으로 운영 취소·계량·동시성을 입증할 수 없으며 실제 호출·분산 저장 시험이 필요하다"
    acceptance: "명시 조작과 자연어 중단이 올바른 대상에 적용되고, 진행 중 DB 조회에 응답 완료를 기다리지 않고 취소를 전달할 수 있다. 실행 API 전송 후에는 취소 불가와 미전송 후속 중단을 안내하며 타임아웃의 결과 불명·재실행 차단·결과 확인/수동 확인을 적용한다. 모든 경로에서 접수·반영·외부 결과를 근거에 맞게 보고하고 재접속해도 복원한다. 입력 종류·대상·분류·확인·반영이 추적되고 카드 응답이 일반 변경으로 오인되지 않아야 한다. CLI와 운영 API에서 같은 업무 시나리오의 사용자 조작·분기·최종 조건·승인 통제가 같고 무효화된 결과의 최신 표시/후속 실행은 0건이어야 한다. 모호한 대상의 임의 변경, 종결 후 부활, 실행값 변경의 승인 우회, 중복 반영/재전송이 없어야 한다. 실제 발생한 호출 사용량을 보존하고 사용량 유실을 0으로 확정하지 않는다. 클라이언트 전송 또는 공급자 자동 후속으로 새 모델 응답 실행이 시작되면 이전과 새 스텝이 각각 남고 같은 턴/시도 안의 대체 관계를 조회할 수 있어야 한다. 명시 중단·미실행 계획에는 새 스텝을 만들지 않으며 호출별 사용량과 늦은 정정은 한 번만 합산한다 동일 실행이 계속되면 기존 스텝에 변경 사건을 추가하고 가상의 후속 실행을 만들지 않는다. OpenAI·Claude·Gemini의 고유 기능 차이에도 공통 변경·중단·승인 통제를 충족한다"

