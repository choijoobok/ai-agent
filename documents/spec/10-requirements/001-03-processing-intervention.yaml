      - { kind: 예외, case: "접수 응답을 잃고 같은 요청을 보내면 기존 턴을 반환한다. 그 사이 권한이 회수됐다면 기존 접수라는 이유로 결과 접근을 허용하지 않는다" }
      - { kind: 예외, case: "브라우저는 닫혔지만 Agent는 정상인 경우 계속 처리한다. Agent도 장애로 멈췄다면 점유 만료로 중단하며 재접속만으로 다시 실행하지 않는다" }
    volatility: { level: medium, what: "외부 인증 방식과 타임아웃·만료·복구 수치는 연동/운영 조건에 따라 구체화한다. 화면 독립·현재 권한·중복 실행 방지 원칙은 유지한다" }
    open:
