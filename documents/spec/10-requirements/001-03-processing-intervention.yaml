      - "@defer P3 로그인 세션과 독립적인 실행 문맥의 필드·저장·참조·접근 권한, 로그인 만료와 계정/권한 회수의 판정 및 차단 후 상태·오류 계약을 정한다"
      - "@defer P3 실제 연동별 인증 방식·자격 증명 참조·갱신 책임/상한·사용자 재인증 지원 여부·만료·실패 경로와 안전한 재호출 조건을 정한다. 모든 인증 방식의 자동 갱신을 지원한다고 가정하지 않는다"
