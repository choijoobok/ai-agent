  - id: REQ-016
    type: functional
    priority: must
    category: "세션 독립·재연결"
    actors: [ACT-001]
    process_step: PRC-02-01
    title: "화면 세션과 무관한 턴 처리"
    detail: "서버에 접수된 요청은 대화 세션 창·브라우저를 닫거나 로그아웃해도 기존 대기·실행 규칙에 따라 처리되고 결과 또는 종결 사유가 저장된다. agent는 사용자 식별과 접수 근거를 처리 문맥으로 보유해 화면 세션에 의존하지 않는다. 다만 접수 당시 권한 복사본으로 실행하지 않고 매 접근 시점에 현재 권한을 검사한다(REQ-108)"
    source: "2026-10-13 사용자 결정 — 창 닫기는 처리를 유지하고, 대화 세션 삭제는 미종결 턴의 취소·중단 및 종결 확인 후 허용하는 권장안을 승인했다. 후속 요청으로 접수 성공 경계·화면과 독립적인 처리 문맥·인증 만료/권한 회수·외부 인증·서버 장애·종결 제한과 검증 기준을 구체화해 반영했다. 같은 날 사용자가 REQ-016 전체 보완본을 명시 확정했다. P3 상세 설계와 실행 검증은 후속이다"
    business_rules:
      - "대화 세션 창 닫기·화면 이탈·로그아웃과 대화 세션 삭제를 구분한다. 창 닫기는 턴 중단 요청이 아니며 개인 순서 대기·실행·유효 사용자대기를 기존 규칙대로 유지한다"
      - "대화 세션 삭제의 선행 조건·서버 재검사·감사 보존은 REQ-109.session_deletion을 따른다. 삭제 조작만으로 진행 중인 턴이 숨겨진 채 실행되는 경로를 만들지 않는다"
      - "사용자대기에는 만료 시각이 있고 미응답으로 만료되면 현재 시도를 중단한다. NFR-013에 따라 턴 전체 시간 상한은 없으며, 사용자가 화면을 조작하지 않았다는 이유만으로 실행 중인 턴이나 개인 순서 대기 요청을 일괄 종료하지 않는다. 실행 점유 만료는 처리 담당자의 점유 갱신 중단을 기준으로 하며 사용자 무응답 시간과 다르다"
      - "사용자대기 만료 등으로 해당 대화 세션의 모든 현재 턴/시도가 종결되면 삭제 조건을 충족한다. 만료 시각 경과만으로 화면이 종결을 추정하지 않고 서버의 실제 상태 전이를 확인한다. 조건 충족은 삭제 가능 상태이며 자동 삭제 요청을 생성하지 않는다"
    hard_rule: "서버 접수와 브라우저의 접수 응답 수신을 구분한다. 화면 연결·로그인 세션 객체는 접수된 턴의 실행 상태나 권한 판정의 유일한 근거가 될 수 없다. 접수 당시 권한으로 후속 접근을 허용하거나 재접속·상태 조회만으로 새 실행을 만들지 않는다. 세션 삭제는 REQ-109.session_deletion의 전체 현재 턴/시도 종결 확인을 따른다"
    why: "화면 연결이 끊겨도 접수된 요청·결과가 유실되지 않게 하고, 재전송·재접속에서 중복 실행하거나 회수된 권한으로 처리하는 것을 막는다"
    summary: "화면과 독립적으로 접수된 턴을 처리하고 현재 권한·실행 제한을 적용하며, 재접속은 기존 상태 조회로 복원한다"
    intent:
