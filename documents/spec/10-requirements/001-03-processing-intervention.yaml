      authorization: "사용자 계정 비활성화·그룹/대상 권한 회수·신원 매핑 변경은 다음 보호 대상 접근 시 현재 값으로 검사한다. 지식 검색·모델 입력 구성·데이터 조회·업무 실행·결과 제공의 검사 범위는 REQ-108을 따르며 저장된 결과도 우회 제공하지 않는다. 이미 외부로 전송한 호출과 발생 사용량·업무 사실은 보존한다"
      external: "외부 시스템 인증은 portal 로그인과 구분한다. 등록된 연동 인증 방식이 허용하는 갱신·재발급만 정해진 상한 안에서 수행하며 다른 계정·더 높은 권한으로 임의 대체하지 않는다. 지원 인증 방식·갱신 책임·사용자 재인증 필요 여부와 실패 상태는 P3에서 정한다. 사용자 재인증 경로를 채택하면 만료·중단 기준을 함께 설계한다"
      replay: "인증 복구와 업무 호출 재전송을 분리한다. 외부 요청이 이미 전송됐거나 결과가 불명인 경우 인증을 복구했다는 이유만으로 재전송하지 않으며 REQ-013·105·NFR-022의 확인·재시도 규칙을 따른다"
