    actors: [ACT-001]
    title: "승인 거절 뒤의 추가 질문과 재승인"
    detail: "승인·거절 이외의 입력은 실행 승인이 아니다. 승인 거절 시 해당 카드는 무효화하고 거절 사실을 기록하며, 원 턴은 최초 승인 대기 만료 시각까지 사용자대기를 유지한다. 거절 자체로 이어가기 실행을 등록하거나 원 턴을 종결하지 않는다. 거절 뒤 추가 질문은 별도 턴으로 처리한다. 사용자가 원 건의 재승인을 명시하면 Hub는 후보를 요약해 '이 요청이 맞습니까?'로 먼저 확인한다. 원 턴이 미종결이고 최초 기한 안이면 실행 대상·순서·전체 파라미터 값을 다시 확인시켜 같은 만료 시각을 가진 새 승인 카드를 제시한다. 대상·순서·값이 달라졌으면 현재 상태로 계획과 모든 값을 다시 확보·검증한 뒤 승인받되 같은 원 건의 최초 기한은 연장하지 않는다. 최초 기한이 지나면 원 턴은 중단하고, 이후 사용자의 명시적 요청에 따른 새 계획·승인은 새 턴에서 처리한다. 중단 재시도로 접수할 때는 REQ-013·113의 허용 조건을 따른다"
    hard_rule: "후보 확인과 최종 실행 승인을 구분한다. 최종 승인은 REQ-005의 대상·순서·모든 파라미터 실제 값 확인 후 **승인 카드의 명시적 승인 조작**으로만 성립하며, 자연어 응답만으로 실행하지 않는다. 거절한 카드는 다시 활성화하지 않으며 후보 확인·질문·재발급으로 최초 기한을 연장하거나 만료·중단·종결된 원 턴을 되살리지 않는다"
    source: "2026-10-19 사용자 명시 동의: REQ-005 추가 검토의 2~5번 권장안 중 거절 카드 무효화·최초 기한까지 원 턴 대기 유지·만료 시 중단·이후 새 턴 처리 경계를 반영했다. REQ-017 카드 전체 확정은 별도다"
  - id: REQ-024
    type: functional
    priority: must
    category: "계획·교정"
    actors: [ACT-001]
    title: "성공한 턴의 결과 교정 재요청"
    detail: "처리는 정상 종료됐지만 결과가 의도와 다른 경우, 이전 턴의 해석문·조회 계획·생성 SQL 을 재작성의 입력으로 사용한다. 사용자가 같은 질의를 처음부터 다시 입력하게 하지 않는다"
    note: "REQ-013(중단 턴 재시도)과 **다른 경로**다"
