      - "기존 대화 세션·턴/시도·대기 카드를 식별할 수 있고 삭제·만료·현재 상태에 따른 수신 가능 여부를 서버가 판정한다"
    admission:
      success: "요청·턴/시도·대기 항목 등 이후 처리에 필요한 정보를 공용 영속 저장소에 커밋하고 접수에 필요한 필수 기록 조건을 충족한 뒤 접수 성공을 반환한다. 정확한 상태/감사 커밋 경계와 부분 저장 복구는 P3에서 정하며 메모리 적재나 화면의 전송 완료만으로 접수 성공을 확정하지 않는다"
      lost_response: "서버 접수 완료 뒤 응답이 유실돼도 처리를 유지한다. portal은 같은 요청 식별 근거로 기존 접수를 조회하거나 재전송하고 agent는 기존 턴·현재 상태를 반환한다. 접수 전에 연결이 끊겼거나 접수 여부를 확인할 수 없으면 성공·실패를 추정하지 않고 확인이 필요한 상태로 안내한다"
      duplicate: "조회·재전송은 현재 인증·소유권을 검사하고 REQ-036의 동일 요청 키·입력 비교·유일 제약을 따른다. 단순 응답 유실로 새 요청 식별자를 만들어 중복 실행하지 않는다"
    execution_context:
      separation: "대화 세션은 대화 묶음, 로그인 세션은 브라우저 인증 상태, 턴 실행 문맥은 서버 처리 근거로 구분한다. 로그인 세션이 종료돼도 접수된 요청의 사용자 식별과 실행 문맥을 잃지 않는다. 다른 인스턴스도 공용 영속 상태로 허용된 조회와 처리를 수행할 수 있어야 한다"
      references: "사용자·대화 세션·요청·턴/시도/회차/스텝 식별, 원 요청/저장 응답 참조, 접수 계약 버전·실행 설정 참조, 현재 상태·대기 카드·점유·결과·감사 참조를 연결한다. 이는 논리 정보 목록이며 물리 테이블·필드명은 P3에서 정한다"
      policy: "내용·모델 설정 고정 범위는 REQ-108·ARCH-040을 따르고 실제 접근 권한은 현재 값으로 검사한다. 사용자 식별자는 권한 증명이 아니며 인증 비밀값을 턴 실행 문맥·일반 로그에 복제해 화면 세션 독립성을 구현하지 않는다"
    authentication_boundaries:
