    acceptance: "실제 호출에 쓸 모든 파라미터 값을 확보·검증하기 전에는 최종 승인을 요청하거나 실행하지 않는다. 사용자가 실행 대상·순서·모든 파라미터의 실제 값을 확인하고 최종 승인한 경우에만 그 대상·순서·값 그대로 호출하며, 일부 값만 확인한 승인·승인 후 값 채움·값 변경에 이전 승인을 적용하지 않는다. 세 대기 유형과 병행형 확인을 구분하고 유효 응답을 현재 턴·시도에 한 번 반영한다. 사용자대기는 개인 실행 자리를 비우고 접수 후 개인 순서·실행 직전 현재 권한/기한 검사를 따른다. 만료/중단/종결·다중 탭·통신 유실·저장 실패에서 잘못된 이어가기·중복 실행·기한 연장이 없다 승인 전 원값을 전용 임시 테이블에 암호화해 고정하고 승인 카드·호출의 버전이 일치해야 한다. 로그인 세션 종료·인스턴스 교체에도 유효 값을 이어받으며 실행 목적 종료·만료·무효화 시 삭제한다. 삭제 실패·백업 복구가 사용 자격을 되살리지 않고 감사·로그에는 마스킹한 사본만 남는다."
