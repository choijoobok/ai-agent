    detail: "중단이 확정되고 재시도 허용 조건을 충족한 요청은 사용자가 명시적으로 다시 처리하도록 요청할 수 있다. 버튼과 자연어 요청 모두 새 턴 번호와 그 실행 시도를 발급하고 원본/직전 재시도 턴을 연결한다. 원 턴과 중단 응답은 보존하며 새 질의·응답 메시지를 현재 대화의 아래에 기록 순서대로 추가한다. 원 사용자 질의로 첫 처리 단계부터 다시 시작하고 이전 검색·계획·SQL·중간 응답·추가 정보·도구 결과·승인·체크포인트를 실행 입력으로 자동 승계하지 않는다"
    hard_rule: "사용자대기(WAITING_USER)와 브라우저 재접속은 중단 재시도가 아니다. 중단이 확정된 턴만 후보이며, 상태 변경 실행 API/도구를 이미 전송/시도했거나 결과가 불명인 턴은 전체 수동 재시도를 제공하지 않는다. 결과 확인/수동 확인은 REQ-105·113을 따르고 실행 전송 기록을 확인할 수 없으면 안전하다고 추정하지 않는다. 새 시도는 이전 승인·체크포인트를 재사용하지 않고 현재 권한·모델·시작 전 쿼터·개인 한도와 유효 전송 동의/자료 기한을 검사한다. 스텝 상한은 시도별로 집행하고 이전 시도의 시간·사용량·감사와 턴 전체 누적 통계는 유지한다"
    source: "기존 중단 재시도 규칙 · 2026-10-01 사용자 승인(이어가기와 처음부터 재시도 구분·중단 시 재개 상태 정리·새 시도의 모델 변경 허용) · 2026-10-14 다음 요구사항 상세 검토 요청으로 접수·개인 순서 대기·현재 권한/모델·동의·감사/보존·중복 접수 및 늦은 결과의 연결과 검증 기준을 정련했다. 후속 사용자 검토 제안으로 스텝 상한은 새 시도별 예산, 시간·사용량·감사는 턴 전체 누적으로 구분했다. 2026-10-14 사용자 검토 제안으로 대화 메시지 시간순 표시·새 턴 재시도·원본/재시도 양방향 참조를 연결했다. 같은 날 사용자 명시 요청으로 REQ-013과 연관 변경 6건의 전체 보완본을 함께 확정했다."
    summary: "중단된 요청의 재시도는 원본과 연결된 새 턴으로 접수한다. 버튼과 자연어는 같은 허용 판정·시간순 표시·양방향 참조를 적용하고 원본 중단/감사를 보존한다"
    intent:
      problem: "일시 장애로 중단된 질의를 다시 입력하는 부담이 있고, 마지막 단계부터 무조건 이어가면 중복 업무 실행·낡은 승인·이전 결과 혼입이 생길 수 있다"
      goal: "재시도를 편리하게 제공하면서 현재 조건 재검사와 시도별 이력 분리로 중복 실행·권한 우회를 막는다"
    goal_trace: [GOAL-1, GOAL-2]
    decider: "제품 오너(사용자). 현재 카드 전체는 검토 대상이며 기존 부분 결정의 승인과 구분한다"
    preconditions:
      - "유효한 인증과 해당 대화·턴의 소유권/접근 권한을 확인하고 삭제·보존 정책상 요청할 수 있는 원 질의를 확보한다"
      - "현재 시도의 중단이 서버에 확정되어야 한다. 중단 요청만 접수됐거나 접수/순서 대기·처리 중·유효한 사용자대기인 상태를 중단 확정으로 취급하지 않는다"
      - "이전 시도의 상태 변경 실행 전송/시도와 결과 불명 여부를 필수 기록으로 확인할 수 있어야 한다. 확인할 수 없으면 안전하다고 추정하지 않는다"
    data:
      - { item: "원 질의와 대화/턴·이전 시도·중단 사유/시각", origin: "서버가 보존한 원 요청과 REQ-107 현재 상태/불변 사건", sensitivity: "원 질의의 업무 데이터·개인정보와 내부 처리 근거", retention: "REQ-107·109의 각 보관 정책. 재시도로 기존 기한을 연장하지 않는다" }
      - { item: "재시도 요청 식별자·새 시도·선택 모델/공급 경로/effort와 접수/대기/시작 상태", origin: "사용자 명시 요청과 서버 허용 판정", sensitivity: "개인 선택·실행 문맥", retention: "REQ-107의 접수/상태/사용량 및 감사 정책" }
      - { item: "이전 실행 전송·결과 불명·승인·늦은 응답/카드와 새 시도의 정책/동의 근거", origin: "스텝·호출·승인/동의·감사 기록", sensitivity: "업무 실행/전송의 감사 근거", retention: "REQ-105·106·107·109. 실행용 체크포인트와 결과 사본의 수명은 구분한다" }
    business_rules:
      - "유효한 사용자대기 응답은 현재 시도의 이어가기이고 중단 후 재시도는 새 시도다. 재접속은 상태 조회일 뿐이다. 완료·실패한 턴을 재시도로 다시 실행하지 않으며 성공 결과 교정은 REQ-024를 따른다"
      - "새 턴/시도 접수는 REQ-036의 개인별 동시 턴·비동기 접수 규칙을 거친다. 원 턴을 다시 접수 상태로 되돌리지 않고 명시적 재시도 요청에 새 턴을 생성한다. 같은 원 요청에 대한 중복 재시도는 새 턴을 중복 생성하지 않는다"
      - "시도별 시작·중단·종료 사유와 소속 스텝·판정·승인·재개 상태를 식별한다. 재시도 턴은 자체 회차/스텝 기록을 시작하며 원 턴의 회차를 수정·승계하지 않는다. 원 턴/시도와 새 턴/시도의 기록·정리 대상이 섞이지 않게 한다"
      - "주 추론 모델·effort·공급 경로의 고정과 변경은 ARCH-040을 따른다. 같은 시도에서는 유지하지만 중단 후 새 시도에서는 현재 허용된 설정으로 변경할 수 있다. 변경된 모델로 이전 단계부터 이어가는 것이 아니라 첫 처리 단계부터 다시 시작한다"
      - "개별 호출의 안전한 자동 재시도와 사용자가 처음부터 요청하는 새 시도를 구분한다. 계층별 자동 재시도는 REQ-009의 계약, 실행의 멱등성·전송/결과 확인은 REQ-105를 따른다. 자동 재시도 소진이 모든 실패를 수동 재시도 가능 상태로 바꾸는 것은 아니다"
    retry_flow:
      - "현재 서버 상태·소유권·원 질의와 이전 실행/결과 불명 기록으로 수동 재시도 허용 여부를 판정한다. 화면의 예전 버튼 상태만으로 접수하지 않는다"
      - "현재 허용 모델·공급 경로·시작 전 쿼터/정책을 확인한다. 새 턴과 그 실행 시도·재시도 요청 식별자·원본/직전 대상 턴·최초 원 요청 참조·입력 메시지와 필수 접수 사건을 함께 저장한 뒤 접수 성공을 반환한다(REQ-016·036·107). 원 턴은 중단 상태로 유지한다"
      - "개인 한도가 차면 REQ-036의 같은 사용자 순서에 대기하고 대기 안내·취소 조작을 제공한다. 대기 항목은 실행 한도에서 제외하며 접수 성공을 실행 시작으로 표시하지 않는다"
      - "실행 차례에 현재 시작 조건·정책을 다시 확인하고 유효 점유로 시작한다. 권한·쿼터·모델 불가를 개인 한도 대기로 무한히 숨기지 않고 각 원 계약에 따라 안내/종결한다"
      - "원 질의로 첫 처리 단계부터 해석·지식 검색·계획·조회/가공을 다시 구성한다. 조회·실행이 필요한 단계는 REQ-038의 현재 지식/권한 통제, 직접 자료/기존 결과의 모델 전송은 REQ-106의 유효 요청·동의 범위를 검사한다"
      - "새 계획의 실행은 REQ-026·105의 새 승인으로 처리한다. 요청/응답 메시지는 REQ-019의 기록 순서로 아래에 추가하고 REQ-006·040으로 해당 새 턴의 진행·시간·결과를 표시한다. 원본 중단 메시지와 양방향 이동 링크를 제공한다"
    restart_scope:
      reuse: "원 사용자 질의를 재입력 없이 요청의 출발점으로 사용한다. 원문 보존이 끝났거나 접근할 수 없으면 숨은 체크포인트로 복원하지 않고 재입력 등 필요한 안내를 제공한다"
      discard: "이전 시도의 검색·선택 카탈로그·계획·SQL·중간 답변·추가 정보/승인 카드 응답·도구 결과·승인·실행용 체크포인트를 새 시도의 실행 입력으로 자동 사용하지 않는다. 필요한 자료는 새 흐름에서 확보/확인한다"
      reference: "원 질의가 과거 결과/직접 자료를 참조하더라도 자동 승계나 무조건 재전송의 근거가 되지 않는다. 출처·현재 권한·기한·목적과 동의 범위는 REQ-002·106·107을 따른다. 모델 공급 경로 등 범위가 바뀌면 필요한 확인 후 전송한다"
      counting: "스텝 상한은 NFR-013의 실행 시도별 예산을 적용한다. 재시도 새 턴의 실행 시도는 자체 예산으로 시작하고 같은 시도의 되돌림·이어가기·인계로 초기화하지 않는다. 각 턴/시도의 시간·스텝·사용량·감사는 독립 보존하며 연관 합계는 참조 관계로 집계해 개별 턴 합계와 구분한다. 이전 사용량은 개인 쿼터에 계속 반영한다. 전체 시간·턴 토큰 종료 상한은 추가하지 않는다"
    concurrency:
      - "같은 원 요청의 중단 재시도를 대상으로 연타·다중 탭·다중 인스턴스에서 요청해도 하나의 유효한 재시도 새 턴만 접수한다. 이미 접수/대기/실행된 재시도 턴/시도가 있으면 중복으로 시작하지 않고 현재 상태를 알려준다"
      - "접수 성공 응답이 유실되면 같은 요청 식별자로 접수 여부/현재 상태를 확인한다. 중단으로 보였다는 이유만으로 다른 식별자의 새 시도를 반복 생성하지 않는다"
      - "이전 시도의 늦은 모델/도구 결과·카드 응답은 그 시도의 관측 사실로만 기록한다. 새 시도의 상태·승인·입력·성공 결과를 바꾸거나 후속 호출을 시작하지 않는다"
      - "중단된 시도의 체크포인트 무효화는 물리 정리 성공과 분리한다. 정리 실패 중에도 실행 입력으로 읽지 않으며 이전 시도/회차 정리가 새 시도와 보존 대상 이력을 지우지 않는다(REQ-109)"
    exceptions:
      - "이미 전송/시도한 상태 변경 실행 또는 결과 불명: 전체 턴 수동 재시도를 제공하지 않고 REQ-105·113의 결과 확인/수동 확인 안내와 최근 실행 이력을 제공한다. 중단이 대상 시스템 취소·롤백을 뜻하지 않는다"
      - "중단 미확정·유효한 사용자대기·처리/순서 대기 중·완료/실패: 해당 상태에 맞는 조작만 제공하며 재시도 요청으로 다른 상태의 실행을 덮어쓰지 않는다"
      - "권한/소유권·원 질의/자료 기한·허용 모델·쿼터 조건 불충족: 해당 조건을 안내하고 무단 모델 대체·만료 자료 재사용·접수 성공 추정을 하지 않는다"
      - "필수 접수/시작/전송 직전 기록 실패: REQ-107에 따라 성공 반환/후속 호출을 차단한다. 외부 호출 후 기록 실패는 결과 불명·대조 경로를 따르고 업무를 무조건 재전송하지 않는다"
    lifecycle: "원 턴/시도 중단 확정과 이력 보존 → 사용자 명시 재시도/대상 확인·서버 허용 판정 → 원본과 연결된 새 턴/시도 접수·개인 순서 대기 → 새 턴의 처리/대기/중단/완료/실패. 원 턴을 중단에서 접수/처리중으로 되살리지 않는다"
    permissions: ["현재 인증·대화/턴 소유권과 접근 권한을 서버에서 검사한다. 매 데이터/도구 접근은 REQ-108의 현재 권한, 상태 변경 실행은 REQ-026·105의 승인, 모델 전송은 REQ-106의 요청·동의를 각각 적용한다"]
    audit: "REQ-107의 저장 시점·현재 상태/불변 사건·분류·보존을 따른다. 원 질의·이전/새 시도·중단 사유·재시도 요청/허용/거부·접수/순서 대기/취소/시작·모델/정책/동의·스텝/호출/사용량·늦은 결과를 연결하고 이전 사실을 덮어쓰지 않는다 원본/직전 대상·최초 원 요청과 새 턴/메시지 참조를 기록하고 각 턴의 사실은 독립 보존한다. 링크로 같은 사건을 여러 번 집계하거나 같은 요청 관계를 같은 오류/조사로 자동 병합하지 않는다"
    volume: "사용자 수·재시도 빈도의 확정 수치는 없다. 개인 한도·대기 순서는 REQ-036/NFR-023, 비용·누적 스텝 및 정체 방지는 NFR-012·013을 따른다"
    config: "현재 모델 허용 집합·기본값·개인 동시 한도·쿼터·시도별 스텝 상한·개별 호출 제한은 각 정본을 참조한다. 새 시도 예산은 NFR-013을 적용하며 재시도만의 별도 상한 값이나 전체 시간 제한을 추가하지 않는다"
    risk: "프로세스 장애 직전의 실행 전송 기록과 결과 불명 판정·인계/점유·늦은 응답의 경합, 체크포인트 무효화/정리와 새 시도 보호, 동의/현재 정책 재검사를 실제 다중 인스턴스 시험으로 검증해야 한다"
    relations:
      depends_on: []
