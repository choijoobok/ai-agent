# 영역: 처리 개입과 재시도
requirements:
  - id: REQ-005
    type: functional
    priority: must
    category: "사용자 대기·재개"
    actors: [ACT-001]
    title: "처리 중 사용자 개입과 재개"
    detail: "턴 처리 중 사용자에게 추가 정보를 요구하거나 승인을 요청할 수 있고, 응답을 받아 처리를 재개할 수 있다"
  - id: REQ-007
    type: functional
    priority: must
    category: "중단·재시도"
    actors: [ACT-001]
    title: "사용자 중단"
    detail: "처리 중 사용자가 중단할 수 있다. 중단 시 진행 중인 액션의 처리 방침을 정의해야 한다"
  - id: REQ-008
    type: functional
    priority: must
    category: "처리 중 입력"
    actors: [ACT-001]
    title: "처리 중 추가 입력의 의도 분류"
    detail: "처리 중 사용자가 새 입력을 넣으면 **그 의도를 먼저 분류**한 뒤 처리한다. 새 입력은 진행 중 턴을 바꾸는 **변경**일 수도, 무관한 **별개 질의**일 수도, 그만두라는 **중단**일 수도 있다"
    traces_to: [REQ-030, REQ-031, REQ-032, REQ-033]
  - id: REQ-013
    type: functional
    priority: must
    category: "중단·재시도"
    actors: [ACT-001]
    title: "중단된 턴의 재시도"
    detail: "턴이 정상 응답 없이 **중단된 경우**(서버 장애·점유 만료·서버 정상 종료·수동 중단·사용자대기 만료·안전한 호출의 타임아웃 자동 재시도 소진) 사용자가 **재시도를 요구**할 수 있다. 중단으로 현재 시도의 처리는 끝나지만 조건을 충족하면 같은 턴에 새 시도를 접수할 수 있다. 수동 재시도는 **원 사용자 질의만 재사용해 첫 처리 단계부터 새 시도로 다시 시작**한다. 이전 검색·카탈로그 선택·SQL·중간 응답·도구 결과·승인·체크포인트는 실행 입력으로 재사용하지 않는다. 실행용 재개 상태는 REQ-109에 따라 정리하고 감사 이력은 REQ-107의 저장 범위·보존 정책에 따라 별도로 남긴다"
    hard_rule: "사용자대기(WAITING_USER)와 브라우저 재접속은 중단 재시도가 아니다 — 전자는 원 대기 단계에서, 후자는 상태 표시만 이어간다. 대상 시스템 실행 API가 이미 전송됐거나 결과가 불명인 경우에는 수동 재시도 버튼을 열지 않는다. 등록된 결과 확인 방법이 있으면 먼저 처리 결과를 확인하며, 없거나 확인에 실패하면 대상 시스템 수동 확인 안내와 결과 불명 이력만 남긴다. 첫 단계부터 다시 계획하므로 이전 승인·체크포인트는 재사용하지 않으며 새 실행 승인이 필요하면 다시 받아야 한다. 재시도는 이전 시도의 정책 판정을 쓰지 않고 새로 판정하며(REQ-108), 새 시도 시작 전 쿼터·동시 처리 한도를 확인하고 모든 시도를 이력으로 남긴다. 처리 중 선택적 쿼터 재검사는 NFR-012, 사용자대기 응답 후 용량 재확보는 NFR-023을 따른다"
    acceptance: "서버 장애 뒤 사용자가 재시도하면 같은 원 질의를 새로 입력하지 않고도 첫 처리 단계부터 새 시도가 시작되며 이전 검색·계획·SQL·결과가 실행 입력에 섞이지 않는다. 사용자대기와 브라우저 재접속은 원 대기·표시 상태를 유지하고, 실행 API 전송·결과 불명 이력이 있는 턴은 재실행되지 않는다"
    source: "기존 중단 재시도 규칙 · 2026-10-01 사용자 승인(이어가기와 처음부터 재시도 구분·중단 시 재개 상태 정리·새 시도의 모델 변경 허용)"
    business_rules:
      - "유효한 사용자대기 응답은 현재 시도의 이어가기이고 중단 후 재시도는 새 시도다. 재접속은 상태 조회일 뿐이다. 완료·실패한 턴을 재시도로 다시 실행하지 않으며 성공 결과 교정은 REQ-024를 따른다"
      - "새 시도 접수는 REQ-036의 동시 턴·실행 용량·대기열 규칙을 거친다. 중단 턴을 접수 상태로 전환하는 것은 명시적 재시도 요청에 한하며, 중복 요청은 새 시도를 중복 생성하지 않는다"
      - "시도별 시작·중단·종료 사유와 소속 스텝·판정·승인·재개 상태를 식별한다. 재시도 시 회차를 올리지 않는 기존 규칙을 유지하되 이전 시도와 새 시도의 기록·정리 대상이 섞이지 않게 한다"
      - "주 추론 모델·effort·공급 경로의 고정과 변경은 ARCH-040을 따른다. 같은 시도에서는 유지하지만 중단 후 새 시도에서는 현재 허용된 설정으로 변경할 수 있다. 변경된 모델로 이전 단계부터 이어가는 것이 아니라 첫 처리 단계부터 다시 시작한다"
    examples:
      - { kind: 정상, case: "유효한 추가 정보 카드에 응답하면 현재 시도를 이어간다. 서버 장애로 이미 중단된 턴에서는 재시도를 명시적으로 요청해야 하며 새 시도는 용량 확인 뒤 첫 단계부터 처리한다" }
      - { kind: 예외, case: "새 시도가 시작된 뒤 이전 시도의 승인 카드 응답이나 도구 결과가 늦게 도착해도 새 시도의 입력·승인으로 사용하지 않는다. 호출 결과의 감사 기록은 이전 시도에 연결한다" }
      - { kind: 정상, case: "모델 A의 장애로 중단된 뒤 허용된 모델 B를 선택해 재시도하면 같은 턴의 새 시도가 B로 처음부터 처리한다. 유효한 사용자대기 카드에 응답하는 것만으로 A를 B로 바꾸지는 않는다" }
    open:
      - "@defer P3 — 시도 식별과 회차·스텝 순번의 결합, 중복 재시도 접수 방지, 이전 시도 정리 범위를 계약·저장 구조로 구체화한다"
  - id: REQ-014
    type: functional
    priority: should
    category: "중단·재시도"
    actors: [ACT-001]
    title: "중단 턴 재개 여부를 되묻지 않는다"
    detail: "중단 이후 **무관한 새 질의**를 한 경우, 중단된 턴의 재개 여부를 되묻는 것은 **프롬프트 규칙에 그렇게 명시된 경우에만** 수행한다. 명시가 없으면 묻지 않는다"
  - id: REQ-016
    type: functional
    priority: must
    category: "세션 독립·재연결"
    actors: [ACT-001]
    title: "화면 세션과 무관한 턴 처리"
    detail: "세션 창·브라우저를 닫거나 로그아웃해도 진행 중인 턴은 계속 처리되고 결과가 저장된다. agent는 사용자 식별과 접수 근거를 처리 문맥으로 보유해 화면 세션에 의존하지 않는다. 다만 접수 당시 권한 복사본으로 실행하지 않고 매 접근 시점에 현재 권한을 검사한다(REQ-108)"
  - id: REQ-017
    type: functional
    priority: must
    category: "승인 대기·만료"
    actors: [ACT-001]
    title: "승인 거절 뒤의 추가 질문과 재승인"
    detail: "승인·거절 이외의 입력은 실행 승인이 아니다. 사용자가 승인 요청을 **거절한 뒤** 추가 질문을 하면 그 질문은 별도 턴으로 처리하며, 원 승인 건은 실행하지 않은 이력으로 남긴다. 사용자가 나중에 원 건을 다시 승인하려 하면 Hub는 후보를 요약해 '이 요청이 맞습니까?'로 먼저 확인한다. 원 승인 요청의 최초 만료 시각 안이고 액션·순서·파라미터가 변하지 않은 경우에만 같은 만료 시각을 가진 새 승인 카드를 제시한다. 하나라도 달라졌거나 만료됐으면 현재 상태를 다시 검토해 새 계획·새 승인으로 처리한다"
    hard_rule: "후보 확인과 최종 실행 승인을 구분한다. 최종 승인은 대상·순서·파라미터가 표시된 **승인 카드의 명시적 승인 조작**으로만 성립하며, 자연어 응답만으로 실행하지 않는다"
  - id: REQ-024
    type: functional
    priority: must
    category: "계획·교정"
    actors: [ACT-001]
    title: "성공한 턴의 결과 교정 재요청"
    detail: "처리는 정상 종료됐지만 결과가 의도와 다른 경우, 이전 턴의 해석문·조회 계획·생성 SQL 을 재작성의 입력으로 사용한다. 사용자가 같은 질의를 처음부터 다시 입력하게 하지 않는다"
    note: "REQ-013(중단 턴 재시도)과 **다른 경로**다"
