      failure: "브라우저 연결 종료와 실행 담당 인스턴스 장애를 구분한다. 서버 종료·점유 만료는 ARCH-070의 중단·점유 해제 경로를 따르며 다른 인스턴스의 상태 조회가 자동 실행 인계를 뜻하지 않는다. 중단 뒤 재시도는 REQ-013의 명시 요청과 허용 조건을 따른다"
      evidence: "사용자대기 만료·점유 회수·대기열 재탐색과 종결 저장의 실패/지연은 탐지·복구 대상으로 남긴다. DB 장애 등으로 상태를 저장하지 못했으면 종결됐다고 표시하지 않는다. 감사·사용량·결과 불명 외부 업무를 정상 성공으로 바꾸지 않으며 늦은 응답으로 현재 상태를 되살리지 않는다"
