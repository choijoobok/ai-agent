      original: "원 턴의 중단 상태·중단 응답·소요 시간은 유지한다. 원본 위치에는 재시도 요청/결과로 이동하는 링크를 제공하고 새 위치에는 원본으로 이동하는 링크와 재시도 표식을 제공한다. 조작 가능 여부는 관련 원 요청의 현재 유효 재시도/금지 기록과 서버 권한 판정을 따른다"

