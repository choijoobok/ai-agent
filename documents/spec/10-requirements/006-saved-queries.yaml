# 영역: 저장된 조회·개인 대시보드
requirements:
# ── 저장된 조회와 개인 대시보드 ────────────────────────────
  - id: REQ-201
    type: functional
    priority: should
    actors: [ACT-001]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-02-07
    title: "질의 즐겨찾기와 저장된 조회를 구분한다"
    detail: "**질의 즐겨찾기** — 자연어 질의문을 저장하고 실행하면 새 턴으로 처리된다(LLM 호출·토큰 소모·결과가 매번 달라질 수 있다). **저장된 조회** — 확정 SQL + 파라미터 명세 + 해석문을 저장하고 **턴을 만들지 않고 직접 실행**된다(LLM 호출 없음·토큰 0·같은 파라미터면 같은 조회)"
    why: "성격이 반대이므로 하나의 기능으로 합치지 않는다"
    roadmap: RM-P1
    acceptance: "질의 즐겨찾기 실행은 새 턴과 모델 사용량을 만들고, 저장된 조회 실행은 확정 SQL과 파라미터 명세로 직접 실행되어 새 턴·모델 호출·토큰 사용량을 만들지 않는다"
    summary: "질의 즐겨찾기는 자연어 문장을 저장해 실행할 때마다 새 턴으로 처리하고, 저장된 조회는 확정 SQL과 파라미터 명세를 저장해 턴·모델 호출 없이 직접 실행한다. 성격이 반대라 한 기능으로 합치지 않는다"
    intent:
      problem: "매일 같은 조건으로 조회하는 사용자에게 대화는 느리고 토큰을 쓴다(ECO-02). 반대로 조건이 매번 달라지는 질문은 SQL로 고정하면 쓸 수 없다"
      goal: "반복 조회는 토큰 없이 같은 조회로, 자유 질문은 대화로 — 사용자가 두 경로를 구분해 고른다"
      not:
        - "즐겨찾기를 저장된 조회로 자동 전환하는 기능이 아니다"
        - "사용자 간 공유 기능이 아니다(REQ-205·NGOAL-09)"
    goal_trace: [ECO-02]
    decider: "제품 오너(사용자) — 2026-09-15 CR-023"
    preconditions:
      - "저장된 조회는 성공한 조회에서만 만들어진다(REQ-202)"
    data:
      - { item: "질의 즐겨찾기(자연어 질의문)", origin: "portal 사용자 입력", sensitivity: "일반(자유 문장 — REQ-107 open 참고)", retention: "사용자가 지울 때까지(portal 소유)" }
      - { item: "저장된 조회 실행 정의(확정 SQL·파라미터 명세·해석문·참조 객체·무효화 상태)", origin: "agent 저장 처리", sensitivity: "내부(SQL·물리명은 portal에 내보내지 않음 — REQ-104)", retention: "삭제 방식은 REQ-204 open(agent 소유)" }
    business_rules:
      - "즐겨찾기를 누르면 질의문이 채팅 입력란에 들어가고, 사용자가 보내야 새 턴이 된다"
      - "저장된 조회 실행은 턴·모델 호출·토큰 사용량을 만들지 않고, 같은 파라미터와 같은 권한이면 같은 SQL을 실행한다"
      - "저장된 조회 실행은 쿼터에서 차감하지 않는다 — 대신 유량 제한(NFR-005)이 브레이크다"
    exceptions:
      - "공정 단계의 예외는 PRC-02-07이 갖는다"
    lifecycle: "해당 없음 — 저장된 조회의 상태는 REQ-204가 갖는다"
    permissions:
      - "본인의 즐겨찾기·저장된 조회만 보고 실행한다: ACT-001"
      - "portal 화면 접근은 system 역할·메뉴 권한 데이터로 판정한다 — 특정 역할 하드코딩 없음(AUTHZ-091)"
    audit: "즐겨찾기 실행은 일반 턴 이력(REQ-107)으로, 저장된 조회 실행은 경로를 구분한 실행 이력(REQ-207)으로 남는다"
    volume: "사용자당 저장 개수 상한은 NFR-005 — 실측 후 정한다"
    config:
      - "저장 개수 상한은 admin 설정(FEAT-025)으로 배포 없이 바꾼다"
    risk: "사용자가 둘을 혼동하면 즐겨찾기로 토큰을 계속 쓰거나 저장된 조회에 자유 질문을 기대한다 — 화면 문구로 구분한다(03-glossary 헷갈리는 짝)"
    relations:
      depends_on: []
      constrains: [REQ-202, REQ-206, REQ-207]
      conflicts_with: []
      nfr: [NFR-005]
      interfaces: []
    realization:
      features: [FEAT-121, FEAT-122, FEAT-220]
      screens: [SCR-103, SCR-104]
    examples:
      - { kind: 정상, case: "매주 월요일 '지난주 A창고 출고 건수'를 보는 사용자는 저장된 조회를 눌러 토큰 없이 같은 조회를 받는다" }
      - { kind: 예외, case: "'요즘 반품이 왜 늘었지?'처럼 매번 다른 분석이 필요한 질문은 즐겨찾기로 저장하고, 누를 때마다 새 턴으로 처리돼 토큰을 쓴다" }
    volatility: { level: low, what: "두 경로의 구분은 제품 원칙이다. 상한값만 고객사마다 다르다" }
    open: []
    maturity: { level: elaborated, at: "2026-09-29", by: "AI 정리", confirmed_by: null }
  - id: REQ-202
    type: functional
    priority: should
    actors: [ACT-001]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-02-07
    title: "저장된 조회의 등록은 성공한 조회에서만"
    detail: "사용자가 SQL 을 작성하거나 붙여넣어 등록하는 경로는 두지 않는다. **수정도 자연어로 한다** — 저장된 해석문과 원 질의문을 컨텍스트로 새 턴을 열어 재생성한 뒤 다시 저장한다"
    why: "그 경로를 열면 '사용자가 고친 SQL 은 실행하지 않는다'(REQ-104)와 모순되고, 감사에서 그 SQL 의 출처를 답할 수 없다"
    roadmap: RM-P1
    acceptance: "성공한 조회의 결과에서만 저장된 조회 등록이 가능하고, 사용자 입력 SQL·붙여넣기 SQL·기존 SQL 직접 편집 경로는 제공되지 않는다. 수정 요청은 원 질의와 해석문을 사용한 새 턴 재생성으로만 처리된다"
    summary: "저장된 조회는 성공한 조회 결과에서만 등록하고, 사용자가 SQL을 쓰거나 붙여넣거나 고치는 경로는 두지 않는다. 수정은 원 질의와 해석문으로 새 턴을 열어 다시 만든 뒤 저장한다"
    intent:
      problem: "사용자가 SQL을 직접 넣을 수 있으면 검증을 우회하고, 감사에서 그 SQL의 출처를 답할 수 없다(REQ-104)"
      goal: "모든 저장된 조회가 Hub가 생성·검증·실행에 성공한 SQL에서 나왔음을 추적할 수 있게 한다"
      not:
        - "SQL 편집기가 아니다"
        - "실패하거나 상한으로 거부된 조회를 저장하는 기능이 아니다"
    goal_trace: [INV-01, ECO-02]
    decider: "제품 오너(사용자) — 2026-09-15 CR-023"
    preconditions:
      - "조회 턴의 생성 SQL과 실행 SQL이 이력으로 남아 있다(REQ-104·REQ-107)"
    data:
      - { item: "저장 근거(원 턴·회차·결과 블록 식별자·원 질의문·해석문)", origin: "agent 이력", sensitivity: "일반(자유 문장)", retention: "저장된 조회와 같다" }
    business_rules:
      - "등록은 최종 응답을 만든 회차에서 실행에 성공한 조회 결과 블록에서만 한다. 버려진 회차·실패·상한 초과로 거부된 조회(REQ-106)는 저장할 수 없다"
      - "한 턴에 조회가 여럿이면 결과 블록마다 따로 저장한다"
      - "저장된 조회 화면은 해석문과 파라미터만 보이고 SQL 원문·물리명은 보이지 않는다(REQ-104)"
      - "수정은 저장된 해석문과 원 질의문을 컨텍스트로 새 턴을 열어 재생성하고, 성공한 결과에서 다시 저장한다"
    exceptions:
      - "공정 단계의 예외는 PRC-02-07이 갖는다"
      - "사용자당 저장 개수 상한(NFR-005)을 넘으면 저장을 거부한다"
    lifecycle: "해당 없음 — 저장된 조회의 상태는 REQ-204가 갖는다"
    permissions:
      - "본인 조회 결과에서만 저장한다: ACT-001"
      - "portal 화면 접근은 system 역할·메뉴 권한 데이터로 판정한다 — 특정 역할 하드코딩 없음(AUTHZ-091)"
    audit: "저장 요청과 근거 턴·회차를 남긴다"
    volume: "해당 없음 — 개수는 REQ-201·NFR-005"
    config: "해당 없음"
    risk: "성공한 조회라도 틀린 결과였을 수 있다 — 저장해도 정확성을 보증하지 않으며 오류는 품질 신고(REQ-110)로 처리한다"
    relations:
      depends_on: [REQ-104, REQ-201]
      constrains: [REQ-203, REQ-205]
      conflicts_with: []
      nfr: [NFR-005]
      interfaces: []
    realization:
      features: [FEAT-122]
      screens: [SCR-104]
    examples:
      - { kind: 정상, case: "'이번 달 A창고 출고 건수' 조회가 성공하면 결과 블록의 저장 버튼으로 저장되고, 목록에는 해석문 'A창고 · 이번 달 · 출고 건수'가 보인다" }
      - { kind: 예외, case: "사용자가 '반품 제외 조건을 추가해 줘'라고 수정을 요청하면 새 턴이 원 질의와 해석문으로 SQL을 다시 만들고, 성공하면 다시 저장한다. SQL을 직접 고치는 입력란은 없다" }
    volatility: { level: low, what: "등록 경로 제한은 통제 원칙이라 고객사마다 달라지지 않는다" }
    open:
      - "@defer G1 — 저장하는 SQL은 행 스코프·기본 필터를 주입하기 전의 검증된 생성 SQL인가. REQ-207이 실행마다 현재 값으로 다시 주입하므로, 실행 SQL을 저장하면 저장한 날의 행 스코프가 굳거나 조건이 이중으로 붙는다"
      - "@defer G1 — 자연어 수정 뒤 다시 저장하면 같은 저장된 조회의 새 리비전으로 교체하는가(대시보드 위젯이 그대로 이어짐), 아니면 새 항목인가"
    maturity: { level: elaborated, at: "2026-09-29", by: "AI 정리", confirmed_by: null }
  - id: REQ-203
    type: functional
    priority: should
    actors: [ACT-001]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-02-07
    title: "저장 시점에 파라미터화를 강제한다"
    detail: "날짜·기간을 상수로 저장하면 하루 만에 무용지물이 된다. 저장 시 LLM 이 파라미터화 후보를 뽑아 사용자에게 확인받으며 **토큰은 저장할 때 한 번만** 쓴다. 파라미터 유형은 셋으로 제한한다 — ① 상대 시점·기간 ② 사용자 입력 값 ③ 실행자 신원"
    hard_rule: "**임의 표현식은 허용하지 않는다**(그 자체가 인젝션 표면이다). 바인딩은 **바인드 변수로만** 하고, 파서 검증은 파라미터가 바인딩된 형태를 대상으로 수행한다"
    roadmap: RM-P1
    acceptance: "저장 시 상대 시점·사용자 입력·실행자 신원 이외의 파라미터 표현식은 거부되고, 허용 파라미터는 바인드 변수로만 주입된다. 파라미터가 적용된 SQL은 실행 전 파서 검증을 다시 통과해야 한다"
    summary: "저장할 때 모델이 파라미터 후보를 뽑아 사용자에게 확인받고, 상대 시점·기간·사용자 입력 값·실행자 신원 셋만 허용한다. 값은 바인드 변수로만 넣고 바인딩된 형태로 다시 검증한다"
    intent:
      problem: "날짜를 상수로 저장하면 하루 만에 쓸모없어지고, 반대로 임의 표현식을 허용하면 그 자체가 인젝션 경로가 된다"
      goal: "한 번 저장한 조회를 매일 다시 쓰되, 파라미터가 SQL 구조를 바꾸지 못하게 한다"
      not:
        - "임의 표현식·SQL 조각 파라미터가 아니다"
        - "실행할 때마다 모델을 부르는 기능이 아니다 — 토큰은 저장할 때 한 번만 쓴다"
    goal_trace: [INV-01, ECO-02]
    decider: "제품 오너(사용자) — 2026-09-15 CR-023"
    preconditions:
      - "저장 대상 SQL이 성공한 조회에서 나왔다(REQ-202)"
      - "실행자 신원 파라미터는 데이터소스별 사용자 신원 매핑이 있어야 채울 수 있다(CON-021)"
    data:
      - { item: "파라미터 명세(이름·유형·상대 시점 표현·입력 형식·기본값)", origin: "저장 시 모델 후보 + 사용자 확인", sensitivity: "내부", retention: "저장된 조회와 같다" }
    business_rules:
      - "파라미터 유형은 ① 상대 시점·기간 ② 사용자 입력 값 ③ 실행자 신원 셋뿐이다"
      - "상대 시점·기간은 제품이 정해 둔 닫힌 목록(오늘·어제·이번 주·지난주·이번 달·지난달·최근 N일 등)에서만 고른다"
      - "사용자 입력 값은 유형·형식을 검증하고 바인드 변수로만 넣는다"
      - "실행자 신원은 실행하는 시점 사용자의 현재 신원 매핑으로 채운다 — 저장한 사람의 값이 아니다"
      - "사용자가 후보를 거절하면 그 값은 상수로 남는다. 확인 화면은 상수로 남는 조건을 해석문 기준으로 보여 준다"
      - "파라미터를 바인딩한 형태로 실행 전 파서 검증을 다시 통과해야 한다"
    exceptions:
      - "공정 단계의 예외는 PRC-02-07이 갖는다"
      - "허용 유형 밖의 표현식은 저장을 거부한다"
    lifecycle: "해당 없음"
    permissions:
      - "파라미터 확인·저장: 본인의 ACT-001"
      - "portal 화면 접근은 system 역할·메뉴 권한 데이터로 판정한다 — 특정 역할 하드코딩 없음(AUTHZ-091)"
    audit: "저장 시 모델 호출과 사용자 확인 결과를 남긴다(REQ-107)"
    volume: "저장 1건당 모델 호출 1회"
    config: "해당 없음 — 상대 시점 목록은 제품이 정한다"
    risk: "모델이 파라미터 후보를 놓치면 상수가 남는다 — 확인 화면에서 상수로 남는 조건을 보여 사용자가 알아채게 한다"
    relations:
      depends_on: [REQ-202]
      constrains: [REQ-207]
      conflicts_with: []
      nfr: []
      interfaces: []
    realization:
      features: [FEAT-122]
      screens: [SCR-104]
    examples:
