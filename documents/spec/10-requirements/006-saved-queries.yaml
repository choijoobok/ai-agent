# 영역: 저장된 조회·개인 대시보드
requirements:
# ── 저장된 조회와 개인 대시보드 ────────────────────────────
  - id: REQ-201
    type: functional
    priority: should
    actors: [ACT-001]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-02-07
    title: "질의 즐겨찾기와 저장된 조회를 구분한다"
    detail: "**질의 즐겨찾기** — 자연어 질의문을 저장하고 실행하면 새 턴으로 처리된다(LLM 호출·토큰 소모·결과가 매번 달라질 수 있다). **저장된 조회** — 확정 SQL + 파라미터 명세 + 해석문을 저장하고 **턴을 만들지 않고 직접 실행**된다(LLM 호출 없음·토큰 0·같은 파라미터면 같은 조회)"
    why: "성격이 반대이므로 하나의 기능으로 합치지 않는다"
    roadmap: RM-P1
    acceptance: "질의 즐겨찾기 실행은 새 턴과 모델 사용량을 만들고, 저장된 조회 실행은 확정 SQL과 파라미터 명세로 직접 실행되어 새 턴·모델 호출·토큰 사용량을 만들지 않는다"
  - id: REQ-202
    type: functional
    priority: should
    actors: [ACT-001]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-02-07
    title: "저장된 조회의 등록은 성공한 조회에서만"
    detail: "사용자가 SQL 을 작성하거나 붙여넣어 등록하는 경로는 두지 않는다. **수정도 자연어로 한다** — 저장된 해석문과 원 질의문을 컨텍스트로 새 턴을 열어 재생성한 뒤 다시 저장한다"
    why: "그 경로를 열면 '사용자가 고친 SQL 은 실행하지 않는다'(REQ-104)와 모순되고, 감사에서 그 SQL 의 출처를 답할 수 없다"
    roadmap: RM-P1
    acceptance: "성공한 조회의 결과에서만 저장된 조회 등록이 가능하고, 사용자 입력 SQL·붙여넣기 SQL·기존 SQL 직접 편집 경로는 제공되지 않는다. 수정 요청은 원 질의와 해석문을 사용한 새 턴 재생성으로만 처리된다"
  - id: REQ-203
    type: functional
    priority: should
    actors: [ACT-001]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-02-07
    title: "저장 시점에 파라미터화를 강제한다"
    detail: "날짜·기간을 상수로 저장하면 하루 만에 무용지물이 된다. 저장 시 LLM 이 파라미터화 후보를 뽑아 사용자에게 확인받으며 **토큰은 저장할 때 한 번만** 쓴다. 파라미터 유형은 셋으로 제한한다 — ① 상대 시점·기간 ② 사용자 입력 값 ③ 실행자 신원"
    hard_rule: "**임의 표현식은 허용하지 않는다**(그 자체가 인젝션 표면이다). 바인딩은 **바인드 변수로만** 하고, 파서 검증은 파라미터가 바인딩된 형태를 대상으로 수행한다"
    roadmap: RM-P1
    acceptance: "저장 시 상대 시점·사용자 입력·실행자 신원 이외의 파라미터 표현식은 거부되고, 허용 파라미터는 바인드 변수로만 주입된다. 파라미터가 적용된 SQL은 실행 전 파서 검증을 다시 통과해야 한다"
  - id: REQ-204
    type: functional
    priority: should
    actors: [ACT-001]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-02-07
    title: "저장된 조회는 반드시 썩는다 — 무효화 처리"
    detail: "**컬럼 삭제·타입 변경·공개 객체 소멸** → 고객사 변경 통지 또는 공개 인터페이스 변화 후보가 참조 객체에 닿으면 저장된 조회를 자동 비활성화하고 소유자에게 알린다. 해석문으로 다시 만들기를 제안한다. **그룹 매핑 축소** → 실행 시점 판정 실패, '권한 변경으로 사용 불가' 표시(**어떤 객체 때문인지는 노출하지 않는다**). **신원 매핑 부재** → 사유와 함께 거부. **사용자 비활성화** → 실행 중지"
    hard_rule: "**권한 상실 시 자동 삭제하지 않는다** — 사용자가 원인을 알아야 하고 그룹이 재부여되면 다시 동작하는 것이 옳다"
    roadmap: RM-P1
    acceptance: "참조 객체의 삭제·타입 변경·공개 범위 소멸이 확인되면 저장된 조회는 자동 비활성화되고 소유자에게 재생성 안내가 간다. 권한·신원·사용자 상태 변화로 실행이 불가한 경우에는 현재 사유로 거부하되 정의를 삭제하지 않는다"
  - id: REQ-205
    type: functional
    priority: should
    actors: [ACT-001]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-02-07
    title: "공유하지 않고 승격한다"
    detail: "사용자 간 공유는 제공하지 않는다. 조직에서 쓸 만한 조회가 나오면 **인증 예제 쿼리로 승격**한다 — 관리자 검수를 거치고 노출 허용 그룹이 명시되며 채팅에서도 재사용된다. **개인 저장 → 사용 빈도 집계 → 관리자 승격 → 전사 자산**"
    traces_to: [NGOAL-09]
    roadmap: RM-P1
    acceptance: "개인 저장된 조회를 다른 사용자에게 직접 공유하는 기능은 제공되지 않으며, 조직 공용 자산은 관리자 검수·노출 허용 그룹 지정·인증 예제 쿼리 승격 절차를 거쳐야만 재사용된다"
  - id: REQ-206
    type: functional
    priority: should
    actors: [ACT-001]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-02-07
    title: "대시보드 실행 방식 — 위젯별 수동 조회가 기본"
    detail: "대시보드 진입 시 자동 실행은 위젯 단위 옵션으로 둔다. **주기 자동 갱신(폴링 새로고침)은 제공하지 않는다** — 시간·조건으로 트리거되는 것은 워크플로우의 영역이다"
    why: "위젯 10개가 화면을 여는 순간 동시에 나가면 업무 시작 직후의 부하 집중이 재현된다"
    roadmap: RM-P1
    acceptance: "대시보드 위젯은 개별 자동 실행 설정 또는 사용자의 수동 실행으로만 조회되고, 주기 폴링·자동 새로고침은 설정하거나 실행할 수 없다"
  - id: REQ-207
    type: functional
    priority: must
    actors: [ACT-002]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-02-07
    title: "LLM 을 거치지 않는 실행 경로의 통제"
    detail: "저장된 조회와 워크플로우의 조회 단계는 **컨텍스트 필터링이 존재하지 않는다** — 이미 SQL 이 있기 때문이다. 이 경로에서는 **참조 객체 대조가 보완 수단이 아니라 주 방어선**이며, 매 실행마다 ① 참조 객체 **재추출**(저장 시점의 목록을 신뢰하지 않는다) ② **현재** 사용자 그룹과 대조 ③ 데이터소스 접근 그룹 판정 ④ **현재** 신원 매핑으로 행 스코프 재주입 ⑤ **현재** 컬럼 모드로 결과 마스킹 재적용 ⑥ 조회 상한·타임아웃 적용을 모두 수행한다"
    hard_rule: "**정의는 과거의 권한으로 만들어졌고 실행은 현재의 권한으로 판정한다.** 저장 시점의 판정 결과를 캐시해 재사용하지 않는다 — 캐시하면 그룹 변경이 반영되지 않아 과거 권한으로 실행된다"
    roadmap: RM-P1
    acceptance: "저장된 조회와 워크플로우 조회 단계는 실행마다 참조 객체를 재추출하고 현재 그룹·데이터소스 접근·신원 매핑·행 스코프·마스킹·조회 상한·타임아웃을 다시 판정한다. 저장 당시 권한 판정 결과는 재사용되지 않는다"
