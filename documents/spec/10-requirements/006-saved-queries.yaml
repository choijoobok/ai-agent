  - id: REQ-204
    type: functional
    priority: should
    actors: [ACT-001]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-02-07
    title: "저장된 조회는 반드시 썩는다 — 무효화 처리"
    detail: "**컬럼 삭제·타입 변경·공개 객체 소멸** → 고객사 변경 통지 또는 공개 인터페이스 변화 후보가 참조 객체에 닿으면 저장된 조회를 자동 비활성화하고 소유자에게 알린다. 해석문으로 다시 만들기를 제안한다. **그룹 매핑 축소** → 실행 시점 판정 실패, '권한 변경으로 사용 불가' 표시(**어떤 객체 때문인지는 노출하지 않는다**). **신원 매핑 부재** → 사유와 함께 거부. **사용자 비활성화** → 실행 중지"
    hard_rule: "**권한 상실 시 자동 삭제하지 않는다** — 사용자가 원인을 알아야 하고 그룹이 재부여되면 다시 동작하는 것이 옳다"
    roadmap: RM-P1
    acceptance: "참조 객체의 삭제·타입 변경·공개 범위 소멸이 확인되면 저장된 조회는 자동 비활성화되고 소유자에게 재생성 안내가 간다. 권한·신원·사용자 상태 변화로 실행이 불가한 경우에는 현재 사유로 거부하되 정의를 삭제하지 않는다"
    summary: "참조 객체가 삭제·타입 변경·공개 소멸되면 저장된 조회를 자동 비활성화하고 소유자에게 재생성을 안내한다. 권한·신원·사용자 상태 때문에 실행할 수 없으면 실행 시점에 거부하되 정의는 지우지 않는다"
    intent:
      problem: "저장된 조회는 저장 이후 스키마와 권한이 바뀌어 반드시 낡는다. 낡은 것을 조용히 실행하면 오류나 틀린 결과가 나고, 자동 삭제하면 사용자가 원인을 모른다"
      goal: "낡은 것은 드러내 다시 만들게 하고, 권한이 돌아오면 다시 동작하게 한다"
      not:
        - "권한 상실 시 자동 삭제가 아니다"
        - "어떤 객체 때문에 막혔는지 알려 주는 기능이 아니다(REQ-101 존재 은닉)"
    goal_trace: [INV-01, SUC-02]
    decider: "제품 오너(사용자) — 2026-09-15 CR-023"
    preconditions:
      - "저장된 조회의 참조 객체가 정형으로 저장돼 있다"
      - "변경 통지와 구조 변화 후보 처리가 있다(REQ-304·FEAT-217)"
    data:
      - { item: "무효화 상태·사유 유형·시각", origin: "agent", sensitivity: "내부(객체명은 사용자에게 내보내지 않음)", retention: "저장된 조회와 같다" }
    business_rules:
      - "컬럼 삭제·타입 변경·공개 객체 소멸이 참조 객체에 닿으면 자동 비활성화하고 소유자에게 알린다(REQ-509). 해석문으로 다시 만들기를 제안한다"
      - "그룹 매핑이 줄면 실행 시점 판정에서 막고 '권한 변경으로 사용 불가'만 보인다 — 어떤 객체 때문인지 드러내지 않는다"
      - "신원 매핑이 없으면 사유와 함께 거부하고, 사용자가 비활성화되면 실행을 멈춘다"
      - "권한 상실로 막힌 조회는 지우지 않는다 — 그룹이 다시 부여되면 그대로 동작한다"
      - "무효화되거나 막힌 조회를 쓰는 대시보드 위젯은 사용 불가로 표시한다"
    exceptions:
