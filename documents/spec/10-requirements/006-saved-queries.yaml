    process_step: PRC-02-07
    title: "LLM 을 거치지 않는 실행 경로의 통제"
    detail: "저장된 조회와 워크플로우의 조회 단계는 **컨텍스트 필터링이 존재하지 않는다** — 이미 SQL 이 있기 때문이다. 이 경로에서는 **참조 객체 대조가 보완 수단이 아니라 주 방어선**이며, 매 실행마다 ① 참조 객체 **재추출**(저장 시점의 목록을 신뢰하지 않는다) ② **현재** 사용자 그룹과 대조 ③ 데이터소스 접근 그룹 판정 ④ **현재** 신원 매핑으로 행 스코프 재주입 ⑤ **현재** 컬럼 모드로 결과 마스킹 재적용 ⑥ 조회 상한·타임아웃 적용을 모두 수행한다"
    hard_rule: "**정의는 과거의 권한으로 만들어졌고 실행은 현재의 권한으로 판정한다.** 저장 시점의 판정 결과를 캐시해 재사용하지 않는다 — 캐시하면 그룹 변경이 반영되지 않아 과거 권한으로 실행된다"
    roadmap: RM-P1
    acceptance: "저장된 조회와 워크플로우 조회 단계는 실행마다 참조 객체를 재추출하고 현재 그룹·데이터소스 접근·신원 매핑·행 스코프·마스킹·조회 상한·타임아웃을 다시 판정한다. 저장 당시 권한 판정 결과는 재사용되지 않는다"
    summary: "저장된 조회와 워크플로우 조회 단계는 모델을 거치지 않으므로 참조 객체 대조가 주 방어선이다. 실행마다 참조 객체를 다시 뽑고 현재 그룹·데이터소스 접근·신원 매핑·행 스코프·마스킹·상한·타임아웃을 다시 판정하며, 저장 당시 판정을 재사용하지 않는다"
