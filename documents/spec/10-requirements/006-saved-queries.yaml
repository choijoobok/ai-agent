      - { state: 무효, next: [활성, 삭제], note: "해석문으로 다시 만들어 저장하면 활성으로 돌아온다 — 리비전 방식은 REQ-202 open" }
      - { state: 삭제, next: [], note: "논리·물리 여부는 open" }
    permissions:
      - "본인 조회의 사용 불가 사유 확인·재생성: ACT-001"
      - "무효화 현황 조회: FEAT-025 메뉴 권한 보유자(주로 ACT-004)"
      - "관리 화면 접근은 system 역할·메뉴 권한 데이터로 판정한다 — 특정 역할 하드코딩 없음(AUTHZ-091)"
    audit: "자동 비활성화와 실행 거부 사유를 남긴다"
    volume: "스키마 변경 한 번에 여러 사용자의 조회가 함께 무효가 될 수 있다"
    config: "해당 없음"
    risk: "구조 변화 후보는 선택 기능의 추정이라 오탐이 있을 수 있다 — 후보만으로 비활성화하면 멀쩡한 조회가 멈춘다(open)"
    relations:
