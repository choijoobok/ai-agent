  - id: REQ-002
    type: functional
    priority: must
    category: "대화 맥락·참조"
    actors: [ACT-001]
    title: "과거 턴 결과 재참조"
    detail: "직전 턴이 아닌 **과거 턴의 결과를 다시 참조**할 수 있어야 한다 (중간에 다른 주제를 거친 뒤 '아까 조회했던 것' 을 지시)"
    business_rules:
      - "참조할 과거 턴/결과 버전·범위를 식별하고 REQ-107.retention_policy의 유효 기한과 현재 접근 권한을 확인한다. 턴 종료 뒤에도 기한 내 마스킹 결과 사본을 명시적 후속 가공에 사용할 수 있다"
      - "과거 조회 조건을 가져와 기간 등 일부 조건을 변경해 다시 조회하는 요청은 REQ-001.past_query_followup의 새 조회로 처리한다. 이 요구사항의 보존 결과 비교·가공과 구분하며 참조 대상을 찾는 것만으로 원천을 재실행하지 않는다"
      - "LLM 전송은 REQ-106의 요청·동의·범위/정책 확인을 따르며 과거 이력을 자동 전송하지 않는다. 과거 결과가 남아 있어도 새 업무 실행의 재조회 원칙(REQ-105)은 유지한다"
      - "만료/파기·안전한 사본 부재 시 과거 결과를 사용할 수 없음을 알리고 남은 메타데이터만 제공한다. 자동 재조회하지 않으며 사용자가 새 조회를 명시 요청하면 현재 시점 결과임을 구분한다. 후속 가공·복사로 원래 결과 기한을 연장하지 않는다"
  - id: REQ-003
    type: functional
    priority: must
    category: "대화 맥락·참조"
    actors: [ACT-001]
    title: "컨텍스트 총량 제한"
    detail: "세션에 대화가 과도하게 누적되지 않도록 컨텍스트 총량을 제한할 수 있어야 한다"
    note: "REQ-001의 제한된 압축 요약과 필요할 때 찾는 턴별 기록/원본 참조를 병행한다. 여기서 원본 참조는 권한·보존 정책상 유효한 Hub 기록/사본의 조회이며 원천 DB/API의 자동 재실행이 아니다. 과거 결과의 사용은 REQ-002를 따른다. 최근 N턴만 남기거나 단일 요약만 유지하는 방식으로 과거 조건/결과 참조를 대체하지 않는다"
    budget_scope: "제한 대상은 요약만이 아니라 시스템/공통 지침·카탈로그·지식·도구 정의·선별한 과거 맥락·현재 질의·해당 호출에 포함할 도구 결과 등 실제 모델 입력 전체다. 모델의 문맥 한도에서 응답 생성 여유를 확보하고 사용 가능한 입력 예산을 정한다. 구체 수치·압축 시작 기준·목표 크기·설정 책임은 후속 검토/측정으로 정하며, 요약 의미·실패·초과 시 사용자 처리는 REQ-001을 따른다"
