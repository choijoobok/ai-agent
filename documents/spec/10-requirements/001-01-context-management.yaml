# 영역: 대화 맥락 관리
requirements:
  - id: REQ-001
    type: functional
    priority: must
    category: "대화 맥락·참조"
    actors: [ACT-001]
    title: "세션 내 맥락 유지"
    detail: "같은 세션 안에서는 이전 대화 맥락을 유지한다"
  - id: REQ-002
    type: functional
    priority: must
    category: "대화 맥락·참조"
    actors: [ACT-001]
    title: "과거 턴 결과 재참조"
    detail: "직전 턴이 아닌 **과거 턴의 결과를 다시 참조**할 수 있어야 한다 (중간에 다른 주제를 거친 뒤 '아까 조회했던 것' 을 지시)"
  - id: REQ-003
    type: functional
    priority: must
    category: "대화 맥락·참조"
    actors: [ACT-001]
    title: "컨텍스트 총량 제한"
    detail: "세션에 대화가 과도하게 누적되지 않도록 컨텍스트 총량을 제한할 수 있어야 한다"
    note: "**과거 턴 요약과 원본 재조회 참조를 병행**하는 방식으로 구현한다. 최근 N턴만 남기는 슬라이딩 윈도우 단독 방식은 REQ-002 를 만족하지 못한다"
  - id: REQ-012
    type: functional
    priority: must
    category: "조회 결과 정보"
    actors: [ACT-001]
    title: "기준 시각 제공"
    detail: "처리 결과가 데이터 조회일 때는 기준 시각(DW 사용 시 동기화 시점)을 함께 제공한다"
    why: "사용자가 동기화 지연을 인지하지 못한 채 낡은 데이터로 판단하는 것을 막는다"
  - id: REQ-020
    type: functional
    priority: could
    category: "사용자 언어"
    actors: [ACT-001]
    title: "사용자 언어와 원어의 분리"
    detail: "지식 검색과 SQL 생성은 **등록된 원어 기준으로 수행**하고, 사용자에게 보이는 설명·안내만 사용자 언어로 제시한다. **조회된 데이터 값 자체는 번역하지 않는다**"
    roadmap: RM-P4
    note: "번역 과정에서 업무 용어가 왜곡되면 태그 매칭이 실패한다 — 지식 태그의 **동의어에 외국어 표현을 함께 등록**할 수 있어야 한다"
  - id: REQ-021
    type: functional
    priority: must
    category: "컨텍스트 구성"
    actors: [ACT-001]
    title: "컨텍스트 단계적 축소"
    detail: "여러 데이터소스에 도달 가능하면 주입할 카탈로그가 데이터소스 수만큼 늘어난다. **질의와 관련된 데이터소스를 먼저 선별하고 그 카탈로그만 주입**하며, 선별은 **데이터소스 → 테이블 → 컬럼** 순의 단계적 축소로 수행한다. 지식 후보는 REQ-607·ARCH-060의 검색 태그·동의어 및 선택적 벡터 검색으로 찾으며, 별도 업무 도메인 등록·자산 귀속을 선별 전제로 요구하지 않는다"
    hard_rule: "주입이 확정된 지식·인증 예제 쿼리의 **참조 공개 인터페이스는 객체 선별 결과에 합류**시킨다 — 키워드 선별이 놓친 공개 객체를 링크가 결정적으로 메꾼다"
    traces_to: [REQ-003]
