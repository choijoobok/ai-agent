# 영역: 처리 중 입력·턴 수명주기
requirements:
# ── 처리 중 입력의 세 갈래 ──────────────────────────────────
  - id: REQ-030
    type: functional
    priority: must
    category: "처리 중 입력"
    actors: [ACT-001]
    title: "세 갈래 분기 — 변경 · 별개 · 중단"
    detail: "① **변경**(`AMEND`) — 조건·범위·기간·지표·표현·실행 의도를 바꾸거나 철회한다. **보강과 교정을 구분하지 않는다.** 변경 항목과 이미 수행한 단계의 의존성을 기준으로 무효화 시작 단계를 판정하고, 그 지점부터 다시 수행한다. 무효화할 단계가 없으면 같은 처리 흐름을 이어간다. ② **별개**(`NEW`) — 진행 중 턴은 그대로 두고 별도 턴으로 접수한다. ③ **중단**(`STOP`) — 중단으로 전이한다"
    why: "보강과 교정의 경계는 자연어만으로 안정적으로 가를 수 없다. **의미 꼬리표가 아니라 어떤 단계가 더 이상 유효하지 않은지가 실행을 결정한다.**"
    hard_rule: "명시적 `STOP`은 LLM 분류 없이 즉시 처리한다. `AMEND`는 진행 중 LLM 요청의 클라이언트 측 취소를 즉시 시도하되, 이미 보낸 프롬프트에 입력을 섞지 않고 현재 호출이 끝난 뒤 변경 입력 묶음으로 새 호출을 시작한다. 이전 체크포인트를 무효화하면 revision을 올리고, 무효화하지 않으면 같은 revision을 이어간다. 대상 시스템 실행 API를 전송한 뒤에는 현재 실행을 변경·중단하지 않고 결과 확인 상태를 사용자에게 알린다"
  - id: REQ-031
    type: functional
    priority: must
    category: "처리 중 입력"
    actors: [ACT-001]
    title: "변경 영향 판정은 LLM 분류 + 사용자 확인"
    detail: "자연어 입력을 규칙만으로 가르는 것은 신뢰할 수 없으므로, LLM은 `AMEND`·`NEW`·`STOP`의 분류와 함께 **변경 항목·추가/교체/철회 연산·무효화 시작 단계**를 구조화해 제안한다. 분류는 보조 판정 역할이며 관리자가 지정한 모델으로 고정한다. 명시적 `STOP`은 분류하지 않는다"
    hard_rule: "**판단이 갈리면 멈추는 쪽으로 기운다** — '멈춘다' 는 판정이 틀리면 다시 시도하면 되지만 **'계속한다' 는 판정이 틀리면 오류가 누적된다**. 확인 문구에는 **무엇을 버리게 되는지**를 함께 제시한다"
    prompt_contract: "분류 출력 스키마·AMEND/NEW/STOP 제어 값·필수 필드는 소스 계약으로 관리한다. agent가 분류 스텝 유형에 맞는 템플릿·허용 공통 지침·입력을 조합하며 운영 편집으로 통신 계약을 바꾸지 않는다(REQ-610)"
    open: "@defer P3 REQ-610에 따라 분류 스텝의 템플릿·입력 변수·출력 스키마 조합을 상세화한다"
    open2: "**한 턴당 분류 호출 횟수 상한이 미확정이다** — 처리 중 입력을 연타하면 쿼터가 소모된다. @defer P2 쿼터 설계에서 정한다(NFR-010~017)"
  - id: REQ-032
    type: functional
    priority: must
    category: "처리 중 입력"
    actors: [ACT-001]
    title: "확인은 병행형이 기본, 차단형은 되돌릴 수 없을 때만"
    detail: "**병행형**(기본) — 턴은 처리중을 유지한 채 분류 결과를 기본값으로 표시하고 되돌릴 수단을 제공한다. 아무 조치도 하지 않으면 분류대로 반영된다. **차단형** — 진행 중 턴이 `승인 대기` 이거나 액션을 이미 실행한 경우 `의도 확인 대기` 로 전이하고 사용자의 선택 없이는 진행하지 않는다"
    hard_rule: "**분류 호출이 실패하거나 판정이 서지 않으면 차단형으로 폴백한다**"
    why: "매 입력마다 차단형 확인을 요구하면 대화가 느려지고 사용자가 확인을 습관적으로 넘긴다. 병행형의 전제는 오분류가 복구 가능하다는 것인데, 액션이 걸린 턴에서는 그 전제가 성립하지 않는다"
    open: "**`의도 확인 대기`(WT-03) 의 만료 시간 기본값이 미확정이다** — 만료 시간은 대기 유형별로 관리하며(03-glossary/_index.yaml state_rules) 승인은 사람의 판단을 기다리므로 길고 의도 확인은 직전 입력에 대한 반응이므로 짧다는 것까지만 정해져 있다. **값은 실측이 필요하다**(ASM-002 의 measurement_first 와 같은 성격이다). @defer P2 응답성 측정이 서면 그 값으로 정한다"
  - id: REQ-033
    type: functional
    priority: must
    category: "처리 중 입력·다중 인스턴스"
    actors: [ACT-001]
    title: "중단·변경 입력은 영속 이벤트로 기록한다"
    detail: "요청은 **턴을 처리 중인 인스턴스가 아닌 다른 인스턴스로 도착할 수 있다.** 중단·변경 입력은 대상 턴·입력 순번·접수 시점·처리 상태를 가진 append-only 이벤트로 DB에 기록한다. 요청을 받은 인스턴스는 다른 인스턴스가 열어 둔 LLM 연결을 직접 끊지 않으며, 점유한 인스턴스가 미처리 이벤트를 순서대로 읽어 스스로 중단하거나 반영한다"
    hard_rule: "중단 시 진행 중이던 LLM 요청은 클라이언트 측에서 취소하되 **이미 발생한 토큰은 과금되므로 사용량으로 기록한다**"
  - id: REQ-034
    type: functional
    priority: must
    category: "중단·스트리밍"
    actors: [ACT-001]
    title: "agent ↔ LLM 은 스트리밍 수신"
    detail: "중단을 실효 있게 하려면 스트리밍이어야 한다. 응답 전체를 기다리는 방식에서는 취소 시점에 이미 생성이 끝나 있어 절감 효과가 없고 REQ-018 의 상태 표시 근거도 얻을 수 없다"
    note: "이 구간의 스트리밍은 portal ↔ agent 가 비동기 폴링인 것과 **무관하게 성립한다**"
  - id: REQ-035
    type: functional
    priority: must
    category: "처리 중 입력·전송 최소화"
    actors: [ACT-001]
    title: "의도 분류 입력의 최소화"
    detail: "**넣는다** — 진행 중 턴의 유효 의도 스냅샷 · 현재 단계 · 액션 전송 여부 · 직전 턴 해석문 1건 · 순서대로 묶은 미처리 입력 원문. **넣지 않는다** — 대화 이력 전체 · 스키마 카탈로그 · 지식·예제 쿼리 · **조회 결과 데이터**"
    why: "의도 분류는 '무엇을 조회할지' 를 판단하지 않는다. 조회 결과 데이터를 넣지 않는 것은 토큰 문제만이 아니라 전송 최소화 원칙(REQ-106)이다"
    traces_to: [REQ-003, REQ-106]
  - id: REQ-036
    type: functional
    priority: must
    category: "접수·대기열"
    actors: [ACT-001, ACT-004]
    process_step: PRC-02-01
    title: "개인별 동시 턴 제한과 영속 대기열"
    detail: "Hub는 사용자별로 실행 중인 턴과 실행 순서 대기열에 있는 턴의 합에 설정된 상한을 적용한다. 기본값과 사용자대기 제외 규칙은 NFR-023을 따른다. 실행 여유가 있으면 접수된 턴을 즉시 시작하고, 전체 실행 여유가 없으면 요청·상태·순번을 DB에 기록한 FIFO(먼저 들어온 순서) 대기열에 넣어 portal에 대기 상태를 보인다. 사용자는 큐 대기 중인 턴을 중단할 수 있으며, 중단된 턴은 대기열에서 제거한다. 실행 여유가 생기면 가장 먼저 접수된 유효 대기 턴을 다시 요청받지 않고 시작한다. 대기·실행·중단·완료 결과는 portal에서 나중에 조회할 수 있어야 한다"
    hard_rule: "실행 순서 대기열의 턴도 개인별 동시 턴 상한에 포함한다. 승인·추가 정보·계획 확인 등 사용자대기와 구별하며, 사용자대기에서 돌아올 때도 NFR-023에 따라 용량을 다시 확보한다. 한 사용자가 무제한 실행 대기 요청으로 전체 대기열을 점유하지 못하게 한다. 대기열의 순번·상태 전이·중단은 원자적으로 기록해, 중단과 시작이 경합하면 하나만 성공하게 한다"
    why: "LLM·도구 실행은 일반 HTTP 요청보다 오래 걸릴 수 있다. 개인별 점유 상한으로 한 사용자의 독점을 막고, 전체 용량 부족 시에는 요청을 잃거나 다시 입력하게 하지 않고 공정하게 재개한다"
    roadmap: RM-P1
  - id: REQ-037
    type: functional
    priority: must
    category: "SQL 오류·재작성"
    actors: [ACT-001, ACT-004]
    process_step: PRC-02-02
    title: "SQL 오류의 재작성 분류와 런타임 상한"
    detail: "agent는 SQL 파싱·카탈로그 대조·DB/DW 실행의 실패를 각각 기록하고, DB/DW 실행 실패는 **데이터소스의 DBMS 종류·실행 단계·Spring 변환 예외·근본 SQLException의 SQLState와 공급사 오류 코드**를 함께 보존해 Hub 표준 유형으로 분류한다. 파싱 실패·카탈로그 대조 실패와, DB/DW가 공급사 오류 코드로 확인한 `SQL_SYNTAX`만 SQL 재작성 후보이며, LLM에는 원본 오류가 아닌 정제된 재작성 피드백만 전달한다"
    hard_rule: "DB/DW 실행 오류의 자동 재작성은 `SQL_SYNTAX`에 한정한다. 접근 거부·정책 거부·연결/인프라 장애·사용자/시스템 취소·알 수 없는 DB/DW 오류·쿼리 타임아웃·객체 부재·의미/타입 오류는 자동 재작성하지 않는다. `BadSqlGrammarException` 등 Spring의 넓은 예외 유형 하나만으로 재작성 가능 여부를 정하지 않는다. SQL 재작성 횟수는 최초 SQL 생성 뒤의 **추가 재작성**만 세며, 기본값은 3회다. **모델에 넘기는 재작성 피드백은 Hub 표준 오류 유형과 문제 위치(토큰·줄)만 담는다** — 호스트·포트·계정명·DB 이름·파일 경로·스택 트레이스와 DBMS 원본 메시지를 담지 않는다. **재작성하지 않는 오류**(연결·인프라 장애 등)는 사용자 응답과 모델 컨텍스트 모두에 agent 계약의 표준 문구만 보내고, 원본 예외는 운영 오류 이력에만 남긴다 — JDBC 연결 오류에는 접속 대상과 계정이 들어 있는 경우가 많다"
    source: "2026-09-28 사용자 결정(재작성 피드백 정제 기준·비재작성 오류의 표준 문구)"
    config: "`sys-config.agent.sql-regeneration.max-attempts`는 정수 0~5, 기본 3으로 관리한다. 변경은 배포 없이 저장 직후 **다음 재작성 판정**부터 적용하며, 진행 중 SQL 실행을 끊지는 않는다. 현재 턴에서 이미 쓴 재작성 횟수·적용 설정값·설정 버전을 각 판정에 남긴다"
    why: "DBMS마다 오류 코드와 SQL 방언이 다르므로 공통 예외 유형만으로는 재작성해도 되는 오류를 안전하게 가릴 수 없다. 반대로 SQL 오류를 무제한 재작성하면 같은 실패·토큰 비용·처리 시간이 반복된다"
    traces_to: [REQ-103, REQ-115]
    roadmap: RM-P1

# ── 질의 유형 · 결과 데이터 처리 · 재연결 ───────────────────
  - id: REQ-038
    type: functional
    priority: must
    workstream: agent
    category: "질의 유형·처리 경로"
    actors: [ACT-001, ACT-002]
    process_step: PRC-02-01
    title: "사용자 질의 유형과 처리 경로의 명시"
    detail: "agent는 사용자 질의를 바탕으로 사용 가능한 관련 지식을 검색하고, 검색된 지식의 일반 업무 설명·절차와 참조 매핑에서 구성한 허용 후보 및 매핑별 사용 설명를 모델에 제공해 필요한 작업을 선택하게 해야 한다. 카탈로그 후보는 REQ-303의 지식 직접 참조와 사용 가능한 인증 예제를 통한 간접 참조의 합산, 업무 API 후보는 REQ-608의 지식 연결, 커스텀 도구 후보는 REQ-303의 지식 직접 매핑을 기준으로 구성하며 도구의 노출·호출 조건은 REQ-612를 따른다. 처리 계획은 **지식 검색·요약**, **SQL·등록 조회 API 또는 등록된 조회 유형 커스텀 도구 기반 데이터 조회**, **등록 API·커스텀 도구의 액션 실행**, **LLM 없이 하는 결정적 데이터 가공·표현**, **정책상 허용된 제한 데이터의 LLM 해석** 중 하나 이상으로 구분한다. 복합 질의는 사용자 의도와 의존 순서에 따라 여러 유형의 단계를 하나의 계획에 함께 기록한다"
    stages:
      - { name: "접수·분류·대기열", reqs: [REQ-009, REQ-015, REQ-036, REQ-038] }
      - { name: "맥락·지식·카탈로그 구성", reqs: [REQ-001, REQ-002, REQ-003, REQ-021, REQ-303, REQ-305, REQ-306, REQ-308] }
      - { name: "데이터 조회·결정적 가공·표현", reqs: [REQ-011, REQ-012, REQ-022, REQ-023, REQ-037, REQ-039, REQ-103, REQ-104] }
      - { name: "제한 데이터 LLM 해석", reqs: [REQ-039, REQ-106, REQ-111, REQ-112] }
      - { name: "액션 승인·실행", reqs: [REQ-017, REQ-026, REQ-105, REQ-113, REQ-114] }
      - { name: "응답·감사·사후 교정", reqs: [REQ-024, REQ-027, REQ-107, REQ-108, REQ-110, REQ-115] }
    lifecycle:
      - { name: "사용자 보강·변경·중단", reqs: [REQ-005, REQ-007, REQ-008, REQ-030, REQ-031, REQ-032, REQ-033, REQ-034, REQ-035] }
      - { name: "브라우저 이탈·재접속·수동 재시도", reqs: [REQ-013, REQ-014, REQ-016, REQ-019, REQ-040] }
      - { name: "대기·점유 만료와 상태 정리", reqs: [REQ-017, REQ-107, REQ-109], references: [ARCH-070, NFR-013, NFR-014, NFR-020, NFR-022, NFR-023] }
    hard_rule: "유형 판정은 데이터 접근·외부 모델 전송·도구 호출을 허용하는 근거가 아니다. 지식 검색은 활성 반영 세트만, 데이터 조회는 검색된 지식의 참조 후보와 현재 권한·카탈로그·API 계약만, 액션은 REQ-026의 명시적 승인만, LLM 해석은 REQ-039의 전송 정책을 각각 통과한 뒤에만 수행한다. 관련 지식을 확보하지 못한 새 업무 질의는 접근 가능한 전체 카탈로그·API·도구 목록을 대신 제공해 임의 조회·실행하지 않는다. REQ-025에 따라 질문을 구체화하도록 확인하거나 REQ-101·REQ-308의 존재 은닉·공통 안내·허용된 활성 지식 태그 안내로 처리한다. 지식 전체 열거·본문 일괄 요약은 처리 경로가 아니며 서버가 차단한다(REQ-112·REQ-308). 저장된 조회 실행은 LLM·턴을 만들지 않는 별도 경로(REQ-201~207)로 유지한다"
    why: "SQL 생성과 API 선택만으로는 지식 안내·결과 가공·분석 요청의 처리 책임과 통제 경계가 보이지 않는다. 유형을 먼저 드러내야 어떤 데이터를 어디까지 LLM에 보낼지, 어느 단계에서 사용자 확인을 받을지를 검토할 수 있다"
    acceptance: "지식 사용법 문의, SQL 조회, 등록 조회 API 호출, 승인 필요 실행, 차트용 집계, 결과 해석이 각각 단독·복합으로 들어왔을 때 계획에는 해당 유형과 순서가 기록되고, 유형 판정만으로 권한 없는 데이터·미등록 도구·미승인 액션·미허용 모델 전송이 발생하지 않는다 지식에 연결되지 않은 커스텀 도구는 그룹 권한이 있어도 후보로 주입·호출하지 않는다. 불명확한 업무 실행 순서는 확인하며 요청하지 않은 실행을 추가하지 않는다. 복합 작업의 최종 실패 시 독립 작업도 새로 시작하지 않고 사용자에게 계속 여부를 확인하며 완료·실패·미수행·결과 확인 중을 구분한다. 필수 결과가 없는 보고·발송과 결과 불명 실행의 재호출은 차단하고 스텝 상한을 자동 새 턴으로 우회하지 않는다. API·커스텀 도구는 각 매핑의 사용 설명을 함께 전달하며 설명이 연결 대상에서 분리되거나 지식 본문 언급만으로 후보가 추가되지 않는다."
    source: "2026-09-21 사용자 요구사항 재점검 — 사용자 질의 유형을 한 문서에서 관리 · 2026-10-08 사용자 요청: 기술적 구현 방식과 분리해 agent 업무 동작을 차례대로 한 건씩 검토한다. 같은 날 사용자 정정: 사용자 질의로 지식을 먼저 검색하고 그 지식에 매핑된 카탈로그·업무 API 도구 후보를 전달해 모델이 선택하는 흐름을 확인했다. REQ-303·REQ-608과 맞지 않던 지식 무결과의 독립 조회·실행 문구를 바로잡은 검토안이며 전체 카드 확정 전 · 같은 날 사용자 보완 요청: 커스텀 도구 지식 매핑·업무 실행 범위·복합 부분 실패를 보완하고 변경 요구사항을 재검토 상태로 전환한다. 최종 실패 시 독립된 나머지 작업도 중단하고 계속 여부를 확인하는 안을 선택했으며 전체 카드는 재확정 대기 · 2026-10-08 사용자가 변경된 요구사항 전체의 확정·커밋·푸시를 명시 요청하여 보완본을 confirmed로 기록"
    roadmap: RM-P1
    summary: "사용자 질의로 관련 지식을 검색하고 그 지식의 참조 매핑과 현재 권한으로 구성한 후보 안에서 필요한 작업을 선택한다. 작업은 다섯 유형으로 구분하고 복합 요청은 의존 순서를 가진 계획으로 정리한다"
    intent:
      problem: "요청에 조회·가공·해석·실행이 섞이면 필요한 근거와 순서, 데이터 사용 범위와 사용자 승인을 구분하기 어렵다"
      goal: "사용자의 의도에 맞는 작업 유형과 처리 순서를 정하고 각 작업의 기존 통제를 적용한다"
      not:
        - "이 카드로 프레임워크·저장 구조·내부 호출 방식이나 통신 스키마를 확정하지 않는다"
        - "유형 판정은 권한 부여나 실행 승인이 아니며 모든 요청을 하나의 유형에만 넣지 않는다"
        - "계획 확인을 모든 질의에 강제하거나 등록되지 않은 실행 기능을 만들어 호출하지 않는다"
        - "보고서 요청만으로 서버 파일 생성·첨부 기능을 추가하지 않는다. 텍스트 서술은 REQ-039, 내보내기는 REQ-011·NGOAL-10, 등록 업무 기능의 실행은 해당 계약을 따른다"
        - "지식 검색이 무결과라는 이유로 사용자에게 허용된 전체 카탈로그·API·도구를 탐색 후보로 열지 않는다"
    goal_trace: [GOAL-0, GOAL-1, IN-02, IN-03, SUC-02, SUC-03]
    decider: "제품 오너(사용자)"
    preconditions:
      - "인증된 사용자의 자연어 요청과 사용할 수 있는 대화 맥락을 접수한다. 접수 자격·용량은 REQ-036·REQ-103을 따른다"
      - "사용 가능한 관련 지식을 검색하고 그 지식의 직접·간접 카탈로그 참조와 연결 업무 API·커스텀 도구를 후보 근거로 삼는다(REQ-303·REQ-608·REQ-612). 후보·참조 도구는 각각 현재 권한과 활성·계약 검증을 통과해야 한다(REQ-103·REQ-305·REQ-306·REQ-612)"
      - "질의 해석과 불확실한 조건의 확인은 REQ-015·REQ-025, 계획 표시와 확인 조건은 REQ-022·REQ-023을 따른다"
    data:
      - { item: "사용자 질의와 필요한 대화 맥락", origin: "사용자 입력과 기존 턴 기록", sensitivity: "업무·개인정보가 포함될 수 있는 사용자 입력", retention: "REQ-107·REQ-109의 기존 이력·보존 정책" }
      - { item: "처리 가능 근거: 검색된 활성 지식과 그 지식에 연결된 사용 가능 예제·카탈로그·업무 API 및 직접 매핑된 커스텀 도구", origin: "지식의 참조 매핑과 현재 접근·활성 판정", sensitivity: "사용자별 접근 제한 정보 — 비밀 원문 제외", retention: "각 관리 자산의 기존 버전·이력 정책" }
      - { item: "질의 해석문·작업 유형·의존 순서·사용자 확인이 필요한 부분", origin: "agent의 요청 해석과 처리 가능성 판정", sensitivity: "업무 처리 정보 — 권한 밖 대상과 물리명은 사용자에게 노출하지 않음", retention: "REQ-107·REQ-109의 처리·감사 이력 정책" }
    business_rules:
      - "작업 유형과 복합 계획의 범위는 detail, 경로별 통제와 지식 무결과 처리의 경계는 hard_rule을 따른다"
      - "현재 사용자에게 허용된 활성 지식을 검색한 뒤 지식의 업무 맥락과 참조 매핑에서 후보를 구성한다. 카탈로그는 REQ-303의 직접·간접 참조 합산, 업무 API는 REQ-608의 지식 연결, 커스텀 도구는 REQ-303의 직접 매핑을 따르며 매핑은 권한을 부여하지 않는다"
      - "모델에는 유효한 API·커스텀 도구 매핑과 해당 매핑의 용도·사용 조건을 함께 제공한다(REQ-303.tool_usage_mapping). 지식 본문의 도구 언급으로 미매핑 도구를 추가하지 않는다"
      - "모델은 전달된 지식·참조 후보 안에서 필요한 대상을 선택한다. 사용자에게 접근 권한이 있더라도 검색된 지식의 후보 범위 밖 자산을 자동으로 추가하지 않는다"
      - "지식 안내는 사용 가능한 지식에 근거한 업무·사용법 설명이며 데이터 조회는 업무 데이터 읽기, 업무 실행은 등록된 업무 기능의 수행이다"
      - "정해진 데이터 가공은 합계·정렬·필터·표·차트용 데이터 구성이고, 결과의 의미·원인 해석은 REQ-039가 허용한 별도 처리다. 차트 요청만으로 업무 데이터를 모델에 보내지 않는다"
      - "복합 요청은 필요한 작업을 하나 이상 선택하고 선행 결과가 필요한 작업의 순서를 계획에 기록한다. 유형을 하나로 줄여 사용자의 다른 요청을 누락하지 않는다"
      - "조회·가공의 처리 의존 순서는 계획할 수 있지만 업무 실행의 대상·액션·순서는 REQ-026에 따라 사용자 요청에서 얻는다. 요청하지 않은 업무 실행을 추가하지 않으며 실행 범위나 순서가 불명확하면 확인한다"
      - "복합 작업의 중단·부분 결과·재요청은 composite_outcome을 따른다. 조회 유형으로 분류한 커스텀 도구도 REQ-114의 승인·통제를 생략하지 않는다"
      - "처리 근거나 대상·조건이 부족하면 REQ-025에 따라 추가로 확인하거나 처리 불가로 응답하며 임의 대상을 선택하지 않는다"
      - "사용자에게 보여 줄 해석문·계획과 필수 확인 조건은 REQ-015·REQ-022·REQ-023을 따른다. 계획 확인과 실제 실행 승인은 구분한다"
      - "실제 업무 실행의 사용자 승인은 REQ-026·REQ-105에 따르며 업무별 관리 승인 설정(REQ-601)을 미사용해도 생략되지 않는다"
      - "후속 요청·변경·중단·재시도는 lifecycle의 연결 요구사항을 따른다. 이 카드의 유형 분류만으로 상태 전이나 재실행을 새로 허용하지 않는다"
    composite_outcome:
      failure: "기존 오류 교정·허용 재시도 절차로 해결되지 않은 작업의 최종 실패가 발생하면 실패와 무관한 나머지 작업도 새로 시작하지 않고 중단 사실과 처리 내역을 알린 뒤 사용자에게 계속 여부를 확인한다. 필수 선행 결과가 없는 후속 작업은 사용자가 계속을 요청해도 그대로 수행하지 않으며 필요한 재조회·조건 보완 또는 요청 범위 변경을 먼저 확인한다"
      reporting: "완료·실패·미수행·결과 확인 중인 항목을 구분하고 허용된 완료 결과만 부분 결과임을 표시해 제공한다. 조회 실패를 정상 0건으로 대체하거나 일부 결과로 전체 완료 보고서·발송을 수행하지 않는다. 접수만 확인된 실행과 결과 불명 실행은 완료로 표시하지 않는다(REQ-105)"
      resume: "계속 여부 확인은 업무 실행 승인이나 자동 재개 권한이 아니다. 완료된 작업과 미완료 범위를 제시하고 REQ-013·REQ-026·REQ-105의 재요청·새 시도·현재 데이터 재조회·재승인 규칙을 따른다. 결과 불명 실행은 확인 없이 다시 실행하지 않는다"
      limits: "전체 시간 상한은 두지 않지만 NFR-013의 최대 스텝과 개별 호출 제한은 유지한다. 한도 때문에 전체 요청을 마치지 못하면 부분 처리 내역을 알리고 남은 작업을 자동 새 턴으로 실행해 상한을 우회하지 않는다. 상한 도달 시 종결 상태·재요청 계약의 상세는 NFR-013의 P2 미결 사항을 따른다"
      in_flight: "중단은 이후 작업의 시작을 막는 뜻이다. 이미 전송·접수된 외부 실행을 취소·롤백했다고 보장하지 않으며 결과 확인·이력은 REQ-105·REQ-108을 따른다"
    exceptions:
      - "새 업무 질의의 지식 검색이 무결과이면 전체 카탈로그·API·도구를 대신 탐색하지 않는다. 질문 구체화·추가 확인 또는 REQ-101·REQ-308의 존재 은닉·공통 안내·허용된 활성 지식 태그 안내로 처리한다"
      - "여러 대상이나 조건으로 해석될 수 있으면 REQ-025에 따라 확인하며 임의 실행하지 않는다"
      - "권한 밖 대상과 미등록 기능은 처리 근거로 쓰지 않으며, 대상의 존재·차단 여부를 응답에 드러내지 않는다(REQ-101·REQ-103)"
      - "접수·권한 판정·모델 호출 실패 뒤 처리는 PRC-02와 연결된 개별 요구사항을 따른다"
    permissions:
      - "접수 가능 여부와 실제 지식·데이터·API·도구 접근은 현재 유효 권한으로 판정한다(REQ-103·REQ-108). 요청에 이름을 적었다는 이유로 권한이 생기지 않는다"
      - "등록된 업무 범위·권한·실행 승인·모델 전송 정책을 유형 분류나 자연어 지시로 우회하지 않는다"
    audit: "질의·해석·실제 처리 단계와 정책 판정, 확인·승인·실패 사실은 REQ-107·REQ-108·REQ-109의 기존 범위로 기록한다. 사용자에게 숨기는 실제 거부 사유는 내부 이력에서 관리한다(REQ-101)"
    volume: "단일·복합 질의를 모두 다루며 접수·개인 동시 처리와 단계 상한은 REQ-036·NFR-023·NFR-013을 따른다. 유형별 비율·평균 단계 수의 미확인 수치를 새로 확정하지 않는다"
    config: "업무별 사용 가능한 자산은 관련 admin 기준정보, 공통 해석·안내 규칙은 REQ-610, 계획 확인 조건은 REQ-023의 기존 설정을 따른다. 유형별 신규 수치나 설정 키를 이 카드에서 만들지 않는다"
    risk: "지식 검색 무결과를 이유로 전체 허용 카탈로그·API·도구를 제공하면 업무 맥락과 매핑을 건너뛴 조회·실행이 발생할 수 있다. 조회·해석·실행을 같은 처리로 취급하면 데이터 전송·실행 승인을 우회할 수 있다"
    relations:
      depends_on: [REQ-303, REQ-608, REQ-612]
      constrains: [REQ-009]
      conflicts_with: []
      nfr: [NFR-013, NFR-023]
      interfaces: []
    realization:
      features: [FEAT-201]
      screens: []
    examples:
      - { kind: 정상, case: "출하 조회 방법을 알려 달라는 요청은 허용된 활성 지식의 설명으로 처리한다. 실제 출하 내역 조회를 함께 요구하지 않았다면 그 데이터를 조회하지 않는다" }
      - { kind: 정상, case: "이번 달 창고별 재고를 합계 내서 차트로 보여 달라는 요청은 데이터 조회와 정해진 집계·표현 순서로 처리한다. 차트 구성만을 위해 조회 결과를 모델에 보내지 않는다" }
      - { kind: 정상, case: "미납 내역을 조회하고 안내 메일을 보내 달라는 요청은 등록된 해당 기능이 있을 때 조회 후 업무 실행의 순서로 계획한다. 메일 발송은 실제 실행 직전의 사용자 승인을 따로 거친다" }
      - { kind: 정상, case: "재고 조회 지식에 직접 연결된 카탈로그 A와 인증 예제를 통해 연결된 B를 합산해 후보를 구성한다. 같은 사용자가 C에 접근할 수 있어도 그 지식에 직접·간접 참조가 없으면 C를 선택 후보에 추가하지 않는다" }
      - { kind: 예외, case: "재고 조회 지식을 찾지 못하면 등록된 재고 카탈로그나 API에 접근할 권한이 있어도 그것만으로 자동 조회하지 않는다. 질문 구체화나 허용된 태그 범위의 안내로 응답한다" }
      - { kind: 예외, case: "지난달 매출이 줄어든 이유를 설명해 달라는 요청에서 모델 전송 정책이 해석용 데이터를 허용하지 않으면 REQ-039에 따라 통제된 조회·표현 또는 전송 불가 안내만 제공한다" }
      - { kind: 예외, case: "어느 창고인지 판단 근거가 부족하면 사용자가 말하지 않은 창고를 임의로 선택하지 않고 추가 정보를 확인한다" }
      - { kind: 예외, case: "접근할 수 없는 매출 컬럼을 요구해도 그 존재나 차단 여부를 밝히지 않고 허용된 정보와 공통 안내만 제공한다" }
      - { kind: 예외, case: "입고·출고·반품 조회 중 반품 조회가 최종 실패하면 나머지 독립 조회도 새로 시작하지 않고 완료·실패·미수행을 알려 계속 여부를 확인한다. 입출고만으로 전체 보고서를 완성하거나 메일을 보내지 않는다" }
      - { kind: 예외, case: "주문을 처리해 달라는 요청의 실행 범위가 불명확하면 출고·청구·메일을 임의로 추가하지 않고 확인한다" }
      - { kind: 예외, case: "메일 발송 요청이 접수됐지만 완료 여부가 확인되지 않으면 결과 확인 중으로 표시한다. 다른 작업의 실패나 스텝 상한 도달 후에도 발송을 자동 반복하지 않는다" }
    volatility:
      level: high
      what: "고객사별 등록 업무·사용 가능한 지식·데이터·도구가 달라진다. 작업 유형과 기존 통제 경계는 고객사 자산 값과 구분한다"
    open: []
    maturity: { level: confirmed, at: "2026-10-08", by: "AI — 사용자 명시 확정 반영", confirmed_by: "사용자 (2026-10-08 변경된 REQ-038·303·305·306·608·612 전체 보완본 확정·커밋·푸시 요청)" }

  - id: REQ-039
    type: functional
    priority: must
    category: "결과 가공·LLM 전송 경계"
    actors: [ACT-001, ACT-002, ACT-007]
    process_step: PRC-02-03
    title: "결과 데이터의 결정적 가공과 제한된 LLM 해석"
    detail: "SQL·조회 API의 결과는 기본적으로 모델에 다시 보내지 않고, DB 또는 agent의 **결정적 가공**(집계·정렬·필터·차트 계열 추출)을 거쳐 portal 표현 어댑터로 전달한다. 사용자가 결과의 해석·서술을 명시적으로 요구하고 현재 전송 정책이 허용한 경우에만, 서버는 원 결과가 아닌 목적에 필요한 최소 집계·선택 열·마스킹·행 수 상한을 적용한 제한 데이터로 LLM 해석 스텝을 만들 수 있다"
    hard_rule: "차트 요청이나 사용자 요청만으로 실제 업무 데이터의 모델 전송이 허용되지는 않는다. 허용목록 밖 테이블·컬럼·API 응답 경로, 원 결과 전체, 마스킹 전 값은 모델 입력에 넣지 않는다. 전송 대상의 값은 지시가 아니라 데이터로 취급하며(REQ-112), 적용 정책·가공 방법·전송본은 REQ-106·107에 따라 남긴다. 정책이 허용하지 않으면 모델 해석 없이 통제된 그리드·차트 또는 전송 불가 안내만 제공한다"
    open: "제한 데이터에 허용할 집계 함수·열 수·행 수·크기 상한과 고객사별 예외 승인 절차는 REQ-106의 전송 정책 상세로 P2에서 확정한다. 이 미확정은 원 결과 전송을 허용하는 공백이 아니다"
    why: "차트 자체는 모델에 원본 행을 보내지 않아도 만들 수 있다. 반면 예외적인 분석 요청은 원본 결과 재전송을 관행으로 열지 않고, 목적에 맞는 최소 데이터와 기존 전송·마스킹·감사 통제를 함께 적용해야 한다"
    acceptance: "차트 요청은 모델에 조회 결과를 전송하지 않고 결정적 집계와 portal 렌더링으로 처리되며, LLM 해석을 요구한 경우에도 허용된 열·경로만 마스킹·상한 적용 후 전송되고 실제 전송본과 적용 정책이 이력에 남는다. 미허용 열·경로 또는 원 결과 전체는 사용자 요청이 있어도 모델 입력에 포함되지 않는다"
    source: "2026-09-21 사용자 요구사항 재점검 — 업무 데이터의 기본 비전송과 예외적 데이터 가공 필요"
    traces_to: [REQ-011, REQ-106, REQ-107, REQ-111, REQ-112]
    roadmap: RM-P1
  - id: REQ-040
    type: functional
    priority: must
    category: "세션 독립·재연결"
    actors: [ACT-001]
    process_step: PRC-02-01
    title: "브라우저 재접속 시 진행 턴의 안전한 재연결"
    detail: "브라우저 종료·네트워크 단절·로그아웃 뒤 같은 사용자가 다시 인증해 portal에 들어오면, portal은 영속된 턴 상태를 조회해 자신의 진행 중·사용자대기·최근 종결 턴을 다시 표시해야 한다. 처리 중인 턴에는 현재 상태·경과 시간·이미 기록된 결과를 붙이고, 사용자대기 턴에는 아직 유효한 원 대기 카드만 복원한다"
    hard_rule: "재접속은 새 LLM 연결·도구 호출·승인·재시도를 만들지 않으며 브라우저 종료를 사용자 중단으로 해석하지 않는다. 대기나 점유가 만료되어 중단된 턴은 REQ-013의 재시도 조건으로만 이어가고, 이미 대상 시스템 실행을 전송했거나 결과가 불명인 턴은 재접속으로 다시 실행하지 않는다. 상태 조회는 현재 인증된 사용자의 소유 턴으로 한정한다"
    why: "턴은 화면 세션보다 길게 실행되고, 다중 인스턴스에서 처리 인스턴스와 재접속 요청 인스턴스가 다를 수 있다. 화면 연결을 복구하는 것과 턴을 다시 실행하는 것을 분리하지 않으면 중복 실행이나 승인 우회가 생긴다"
    acceptance: "처리 중 브라우저를 닫았다가 재접속해도 같은 턴 ID의 상태·결과가 표시되고 LLM·도구 호출 수는 증가하지 않는다. 유효한 사용자대기는 기존 대기 카드로만 응답할 수 있으며, 만료·중단·결과 불명 턴은 각각 재시도 가능 여부 또는 수동 확인 안내를 표시하고 자동 실행하지 않는다"
    source: "2026-09-21 사용자 요구사항 재점검 — 브라우저 종료 뒤 기존 턴 재개"
    traces_to: [REQ-013, REQ-016, REQ-017, REQ-019, REQ-033]
    roadmap: RM-P1
