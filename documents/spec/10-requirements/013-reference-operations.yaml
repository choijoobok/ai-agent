      - "@defer P3 테이블별 복수 규칙 모델·순서·권한 테이블 신뢰 출처·바인딩, 모든 참조와 외부 조인 의미를 유지하는 파서 주입, 기본 필터 조건의 중복/재작성 및 규칙 변경·캐시 무효화·쿼리 비용을 검증한다. 실제 제품 파서·대상 DBMS 검증 전 구현 완료로 간주하지 않는다"
    maturity: { level: elaborated, at: "2026-10-07", by: "AI — 사용자 그룹별 세 가지 처리 결정 반영·전체 카드 확정 대기", confirmed_by: null }

