  - id: REQ-616
    type: functional
    priority: must
    workstream: admin
    actors: ["ACT-002","ACT-004"]
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — 2026-09-30 사용자 명시 요청 — system은 admin 사용자 관리, admin에 별도 Portal 사용자 관리 메뉴 필요 · REQ-103·REQ-116·ARCH-050; 2026-10-01 정련 질문 사용자 결정 반영"
    process_step: PRC-13-01
    title: "Hub Portal 사용자 등록·조회·이용 상태 관리"
    detail: "권한을 가진 관리자는 admin에 별도의 Portal 사용자 관리 메뉴를 통해 일반 이용자를 검색·등록·변경·활성/비활성 처리하고, 조직·그룹·쿼터 등급·대상별 신원 매핑·변경 이력을 확인할 수 있어야 한다. system의 사용자 관리는 admin 관리자 계정과 메뉴 역할 관리이며 Portal 이용자 관리 메뉴를 대신하지 않는다"
    roadmap: RM-P1
    acceptance: "admin에 system 사용자 관리와 구분된 Portal 사용자 관리 메뉴가 존재하고 일반 이용자의 그룹·등급·신원·활성 상태를 관리할 수 있다. 외부 로그인 성공만으로 미등록 사용자가 질의할 수 없으며 Portal 사용자에게 관리자 권한이 생기지 않는다"
    summary: "admin의 독립 메뉴에서 Portal 사용자 생애주기를 관리하고 관리자 접근 권한과 구분한다"
    intent:
      problem: "관리자 계정 관리와 Portal 이용자 관리가 구분되지 않아 일반 이용자 등록·권한·한도를 어디서 처리하는지 모호하다"
      goal: "admin의 독립 메뉴에서 Portal 사용자 생애주기를 관리하고 관리자 접근 권한과 구분한다"
      not: ["Portal 사용자 등록으로 admin/system 메뉴·액션 권한을 자동 부여하지 않는다","관리자 등록만으로 Portal 이용 등록을 자동 완료하지 않는다","이 요구만으로 별도 사용자 테이블·별도 로그인 엔진·전체 계정 복제를 확정하지 않는다"]
    goal_trace: ["IN-06"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
      - {"item":"Portal 이용자 식별: 안정적인 이용자 ID·로그인/외부 신원 식별 참조·성명·조직/부서·인증/정보 원천","origin":"SSO·고객사 계정 연동 또는 자체 계정 모드","sensitivity":"개인 식별·권한 정보 — 열람 통제 필요","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"이용 상태: Hub 이용 등록일·등록 전/활성/비활성 상태·변경 사유·조직 변경 확인 여부","origin":"관리자 등록·인사 이벤트","sensitivity":"개인 식별·권한 정보 — 열람 통제 필요","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"업무 접근: 사용자 소속 Hub 그룹 집합·관련 접근 범위 조회","origin":"REQ-103·REQ-605","sensitivity":"개인 식별·권한 정보 — 열람 통제 필요","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"사용량 기준: 적용 월별 쿼터 등급·이번 달 한도/사용/잔여 조회·변경 근거 참조","origin":"REQ-116~119·REQ-606","sensitivity":"개인 식별·권한 정보 — 열람 통제 필요","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"레거시 연결: 대상 시스템/데이터소스별 신원 매핑·미매핑 표시","origin":"REQ-609","sensitivity":"개인 식별·권한 정보 — 열람 통제 필요","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
    field_usage:
      - {"attribute_group":"Portal 이용자 식별","used_for":"검색·사용자 식별·신원 연계. 원천 소유 속성과 Hub 편집 속성을 구분"}
      - {"attribute_group":"이용 상태","used_for":"Portal 이용 개시·중지·재개와 쿼터 등록일 기준"}
      - {"attribute_group":"업무 접근","used_for":"일반 이용자의 업무 자산 접근 판정"}
      - {"attribute_group":"사용량 기준","used_for":"등급 부여/직접 변경 및 이용 한도 확인"}
      - {"attribute_group":"레거시 연결","used_for":"해당 이용자의 API·행 스코프 실행 준비 확인"}
    consumers:
      - {"where":"admin Portal 사용자 관리","when":"등록·검색·인사 변동 처리 시","how":"이용자 정보·상태·그룹·쿼터·신원 매핑을 한 이용자 기준으로 확인한다"}
      - {"where":"portal·agent","when":"접속 후 이용 자격 확인·턴 시작·실행 시","how":"관리자 메뉴 역할이 아니라 Portal 이용 상태와 현재 그룹·쿼터·신원을 확인한다"}
    business_rules:
      - "2026-10-01 사용자 확정: 자체 계정 모드에서는 Portal 사용자 관리 메뉴에서 등록·비밀번호 초기화·잠금 해제를 공통 인증 기능으로 처리한다. 외부 연동 모드에서는 신원·프로필 속성을 원천 시스템에서 관리하고 Hub에서는 읽기 전용으로 표시한다. Hub 이용 활성·그룹·등급·레거시 신원 매핑은 기존 Hub 관리 규칙을 따른다"
      - "기존 SCR-005/FEAT-005를 Portal 사용자 관리로 명확히 하고 system의 SCR-501/FEAT-501과 별도 메뉴로 유지한다. 중복된 세 번째 사용자 관리 메뉴를 만들지 않는다"
      - "화면 진입 경계는 기존 ADR-007·ARCH-021을 따른다. 일반 이용자 메인은 /, 기능은 /portal/**이며 관리 콘솔은 /admin, system 관리는 /admin/system/**, Hub 관리는 /admin/hub/**다. Portal 사용자 관리 메뉴는 일반 이용자 메인이 아니라 Hub 관리 영역에 둔다. 하나의 앱·인증 부팅을 재사용하는 결정이며 별도 앱 배포를 요구하지 않는다"
      - "SSO/계정 연동 기본·연동 없는 고객사의 자체 계정 모드는 ARCH-050을 따른다. 외부 인증 성공과 Portal 이용 활성은 별개다"
      - "승인된 활성 그룹 1개 이상과 쿼터 등급이 갖춰져야 Hub 이용을 연다. 요청 상태 그룹은 세지 않는다. 활성 사용자의 마지막 그룹은 비활성화와 함께만 제거한다(REQ-103)"
      - "사용자 그룹 추가와 데이터소스·대상 시스템 신원 매핑 부여는 REQ-609의 요청·승인·활성화 절차로 처리하며 제거는 별도 승인이 없다. 승인 메뉴는 SCR-037로 분리하고 등급 변경은 REQ-116의 적용 월 규칙을 따른다"
      - "퇴직·조직 이동에 의한 비활성화·그룹 재확인/재부여는 REQ-103·ARCH-050을 따르고, 다시 활성화할 때 이용 조건을 재검사한다"
      - "동일인이 관리자이자 Portal 이용자일 수 있지만 두 이용 자격과 권한 부여를 분리한다. 하나의 자격이 다른 자격을 자동 생성하지 않는다"
      - "기존 system의 계정·인증 구현을 이번 요구사항 작업으로 변경하지 않는다. 저장소·인증 공통 사용 설계가 기존 승인 계약을 바꾸면 system 변경 요청 절차를 거친다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "system 관리자 김관리에게 Portal 이용 등록이 없으면 관리자 계정만으로 Portal 업무 질의를 허용하지 않는다"
