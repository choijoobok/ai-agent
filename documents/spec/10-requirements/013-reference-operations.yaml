      - "yml 원문 보존 기간이 7일이면 화면에는 현재 적용값 7일을 읽기 전용으로 표시한다. 설정 변경 요청으로 5일이나 30일을 보내도 변경하지 않는다"
    lifecycle: "화면 설정의 변경 이력과 현재 유효값을 구분한다. 배포 설정은 재시작 등 기존 적용 경계를 따른다"
