      - "사용자대기·승인 유효 시간·실행 점유 시간은 처리를 언제까지 기다리거나 실행할 수 있는지 정하는 운영값이다. 정책 재판정 기준 시간은 오래 대기한 뒤 권한·정책을 다시 확인하는 기준이며 턴 만료 시간이 아니다. 이 값들을 바꿔 데이터 보존 기한을 연장하지 않는다. 사용자대기 만료와 원문 보존 기한의 선후 조건은 REQ-109를 검증하며 조사 자료 삭제 유예는 REQ-110의 별도 정책이다"
      - "설정별 기존 적용 규칙이 우선이며 모든 값을 즉시 진행 중 턴에 덮어쓰지 않는다. 설정 정의와 현재 저장값·로드값이 다르면 구분해 보여 준다"
      - "미지원 키·자료형/범위 오류·상호 제약 위반은 적용하지 않고 오류 위치를 알려 준다. system 설정 관리(REQ-506)의 구현을 별도 admin 설정 저장소로 복제하라는 요구가 아니다"
    exceptions:
