# 영역: 기준정보 정책·도구·단가·운영·평가·Portal 이용자
requirements:
  - id: REQ-611
    type: functional
    priority: must
    workstream: admin
    actors: ["ACT-002"]
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — REQ-103·REQ-105·REQ-106·REQ-111·FEAT-007~009·FEAT-012·FEAT-019; 2026-10-02 사용자 요청 — 복수 행 스코프의 AND 강제 적용과 기본 필터별 선택 제외를 반영; 2026-10-07 사용자 결정 — 그룹별 처리를 원본 열람·마스킹 열람·접근 제한으로 정리하고 마스킹 방식은 그룹별로 세분화하지 않는다. 카드 전체는 확정 전"
    process_step: PRC-13-01
    title: "보안·조회 정책 정의와 적용 대상 매핑 관리"
    detail: "보안 담당자는 마스킹 변환, 행 스코프, 기본 필터, 외부 전송 허용 및 그룹별 처리(원본 열람·마스킹 열람·접근 제한)의 정의와 적용 대상을 관리하고 유효 통제와 변경 이력을 확인할 수 있어야 한다. 마스킹 방식은 그룹별로 세분화하지 않고 대상이 참조하는 공통 변환을 사용한다. 테이블별 복수 권한 조건은 모두 적용하며, 복수 기본 필터는 사용자 요청에 따른 항목별 제외를 서버가 검증해 적용한다"
    roadmap: RM-P1
    acceptance: "회사·조직·담당 업무의 권한 조건을 함께 등록하면 모든 조건을 AND로 만족하는 행만 조회한다. 취소·삭제·활성 상태 기본 필터 중 취소 필터만 유효하게 제외하면 삭제·활성 상태 필터와 모든 행 스코프는 유지된다. 미등록·타 테이블·해제 불가·변경된 리비전 또는 행 스코프를 제외 대상으로 전달하면 실행하지 않는다. 그룹별 원본 열람·마스킹 열람·접근 제한을 구분하고, 같은 대상의 마스킹 열람 그룹들은 동일한 변환을 사용한다. 접근 제한 항목은 실제 값을 제공하지 않으며 해당 항목을 제외한 조회가 완료되면 정보 부재를 안내한다. 동일 마스킹 변환을 컬럼과 API 경로에서 참조하며, 과거 상태 복원에서 승인 대상과 직접 정책을 혼합 덮어쓰기하지 않는다"
    summary: "규칙 종류별 속성과 적용 위치를 분리하고 동일 규칙의 단일 원천을 참조한다"
    intent:
      problem: "행 스코프·기본 필터·마스킹·전송 허용을 같은 설정으로 취급하거나 여러 곳에 중복 정의하면 보안 경계가 달라진다"
      goal: "규칙 종류별 속성과 적용 위치를 분리하고 동일 규칙의 단일 원천을 참조한다"
      not: ["LLM이 임의 권한 조건·사용자 신원·그룹별 스코프 조합을 작성하거나 선택하는 정책 엔진이 아니다","기본 필터가 접근 권한이나 행 스코프를 대체하지 않는다"]
    goal_trace: ["IN-06"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
      - {"item":"마스킹 변환: 규칙 식별·설명·변환 방식과 필요한 설정·적용 컬럼/API 응답 경로","origin":"보안 관리자 정의","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"행 스코프: 규칙 식별자·리비전·대상 테이블·회사/조직/담당 업무 등의 업무 의미·권한 테이블/컬럼·IN/조인/서브쿼리 조건·사용자 식별자 바인딩을 갖는 규칙 목록","origin":"보안 관리자·고객사 권한 구조","sensitivity":"내부 관리 정보 — 권한 원천과 바인딩 값은 LLM 선택 대상 아님","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"기본 필터: 필터 식별자·리비전·대상 테이블·업무명/설명·기본 주입 조건·명시 요청 시 해제 허용 여부를 갖는 항목 목록","origin":"관리자 정의","sensitivity":"내부 관리 정보 — 모델에는 허용된 카탈로그 범위의 설명만 제공","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"기본 필터 제외 명세: 대상 데이터소스/테이블·필터 식별자/리비전·제외 사유·사용자 요청 근거와 서버 검증 결과","origin":"LLM 의도 해석·agent 서버 검증","sensitivity":"내부 조회 의도 — 사용자 요청 원문은 기존 마스킹·보존 통제 적용","retention":"조회 계획·감사 이력. 저장 조회의 의도 보존은 REQ-202·REQ-207을 따른다"}
      - {"item":"전송 허용: 대상 테이블/컬럼의 외부 LLM 전송 허용 설정·API 경로 설정 참조","origin":"FEAT-019 입력·REQ-608 응답 속성 참조","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"그룹 매핑: 테이블 허용 그룹·컬럼별 예외 처리·API 호출 그룹/위험 등급/승인 강제·응답 경로별 처리. 컬럼과 응답 경로의 그룹별 처리는 원본 열람·마스킹 열람·접근 제한으로 구분","origin":"보안 관리자 매핑","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
    field_usage:
      - {"attribute_group":"마스킹 변환","used_for":"화면·저장 사본 등 REQ-111이 정한 경로에서 같은 변환을 사용"}
      - {"attribute_group":"행 스코프","used_for":"서버가 현재 유효한 모든 등록 권한 조건을 적용해 사용자 허용 범위의 교집합만 조회"}
      - {"attribute_group":"기본 필터","used_for":"LLM에 기본 조회 범위와 항목별 제외 가능 여부를 알리고 서버가 적용 목록을 결정"}
      - {"attribute_group":"기본 필터 제외 명세","used_for":"자연어 요청을 등록 필터별 선택 제외로 전달하고 검증·계획 표시·감사·재실행 의도를 연결"}
      - {"attribute_group":"전송 허용","used_for":"조회 가능 여부와 별개로 외부 전송을 판정"}
      - {"attribute_group":"그룹 매핑","used_for":"서버의 대상별 원본 열람·마스킹 열람·접근 제한 판정"}
    consumers:
      - {"where":"agent LLM 컨텍스트 구성","when":"조회 해석·SQL 생성 또는 인증 예제 선택 시","how":"허용된 지식·스키마 카탈로그와 해당 테이블의 기본 필터 식별자·리비전·업무 의미·해제 허용 여부를 전달한다. 권한 테이블·실사용자 바인딩은 노출하거나 선택시키지 않는다"}
      - {"where":"agent SQL 검증·실행","when":"실행 전후","how":"기본 필터 제외 명세를 검증하고 모든 행 스코프와 제외되지 않은 기본 필터를 주입한 뒤 결과/외부 전송 통제를 적용한다"}
      - {"where":"agent API 응답·portal 표시","when":"응답 처리 시","how":"등록 경로 속성과 그룹별 처리 결과·공통 변환을 조합한다"}
      - {"where":"정책 이력 조회","when":"변경·복원 검토 시","how":"REQ-103에 따라 당시 전체 상태와 직접/승인 변경 범위를 구분한다"}
    business_rules:
      - "2026-10-02 사용자 결정: 행 스코프와 기본 필터는 테이블당 각각 0..N개를 등록한다. 회사·조직·담당 업무 등 현재 유효한 행 스코프 규칙은 모두 AND로 결합한다. 각 규칙의 IN/서브쿼리 등으로 여러 허용 값을 표현할 수 있으나 규칙 사이를 OR로 넓히거나 일부만 선택하지 않는다. 실제 사용자별 허용 값은 레거시 권한 데이터가 원천이다"
      - "행 스코프는 조회 목적·사용자 지시·LLM 해석으로 동적 추가/제외하지 않는다. 모든 등록 권한 조건을 서버가 적용하며 정책 변경은 기존 관리 절차를 따른다. 바인딩은 REQ-609의 승인된 현재 대상 사용자 ID를 서버가 제공하고 LLM·요청 파라미터의 임의 ID로 대체하지 않는다. 매 접근 시점 현재 권한 판정(REQ-108)은 유지한다"
      - "권한 테이블의 중복 행 때문에 업무 결과·집계가 늘어나지 않도록 IN/EXISTS 또는 행 수 보존이 검증된 조인으로 조건을 적용한다. 필수 권한 규칙에서 사용자 허용 값이 없으면 허용 행이 없으며 해당 규칙을 생략하지 않는다. 신원 매핑 부재는 정상 0건이 아니라 조회 거부다(REQ-609)"
      - "기본 필터는 삭제 여부·취소 여부·상태 등의 항목으로 나누고, 별도 제외 요청이 없으면 모든 적용 항목을 AND로 주입한다. LLM에는 허용된 카탈로그와 함께 필터 식별자·리비전·업무 의미·기본 적용 설명·항목별 해제 허용 여부를 제공한다. 조건의 물리명은 해당 사용자의 카탈로그 허용 범위 안에서만 노출한다"
      - "사용자가 취소 이력 포함 등 기본 범위를 바꾸도록 요청하면 LLM은 해당 필터의 제외 명세를 SQL과 분리해 agent에 전달한다. 명세에는 데이터소스·테이블·필터 식별자/리비전·제외 사유·현재 사용자 요청 또는 보존된 조회 의도의 근거를 둔다. 자유 SQL 조건이나 해제 문구만으로 서버 정책을 변경하지 않는다"
      - "agent는 대상 테이블·등록 필터·현재 리비전·해제 허용 여부와 요청 근거를 검증한 항목만 제외하고 나머지 기본 필터와 모든 행 스코프는 유지한다. 미등록·타 테이블·변경된 리비전·행 스코프 대상·해제 불가 또는 근거 불명인 제외 요청은 해당 명세로 실행하지 않고 사유를 알려 명세 재구성 또는 사용자 확인으로 돌아간다. 해제 불가 항목은 유지하며 수정한 계획에서 그 사실을 알린다"
      - "모델은 관리자 기본 필터를 생성 SQL에 직접 복사하지 않고 필터 명세를 전달한다. 제외는 서버가 주입하는 해당 기본 필터에만 적용한다. 기존 생성 SQL·인증 예제에 같은 조건이 이미 있으면 임의 문자열 삭제로 해제하지 않으며 원 사용자 조건과 구별해 재작성·검증한다. '취소 건만' 같은 사용자 업무 조건은 유지한다. 실제 적용/제외 결과는 조회 계획·생성 SQL·실행 SQL과 함께 확인한다"
      - "기본 필터 명세와 제외 명세의 규칙은 인증 예제·저장된 조회·워크플로우 조회에도 동일하다. 예제의 해제 사례만으로 이번 조회의 필터를 제외하지 않는다. 저장 조회에서는 제외 명세가 REQ-202의 성공한 실행 요청과 함께 보존·복원되며 별도 SQL 실행 경로로 분리하지 않는다. 요청 재현·현재 정책 재검증과 과거 허용 판정 재사용 금지는 REQ-207을 따른다"
      - "2026-10-07 사용자 결정: 컬럼과 API 응답 경로의 그룹별 처리는 원본 열람·마스킹 열람·접근 제한 세 가지로 구분한다. 원본 열람은 값을 그대로 제공하고, 마스킹 열람은 대상이 참조하는 공통 변환을 적용한 값만 제공하며, 접근 제한은 해당 값의 열람을 허용하지 않는다. 마스킹 방식·강도·변환 설정은 그룹별로 세분화하지 않는다"
      - "여러 승인된 활성 소속 그룹의 접근 범위는 기존 합집합 원칙을 유지한다. 어느 그룹에서든 원본 열람이 허용되면 원본 열람, 원본 열람 없이 마스킹 열람만 허용되면 마스킹 열람, 어느 그룹에서도 열람을 허용하지 않으면 접근 제한으로 판정한다. 한 그룹의 접근 제한이 다른 그룹의 열람 허용을 취소하지 않는다"
      - "접근 제한 컬럼은 허용된 카탈로그와 조회 대상에서 제외하고 해당 값의 부분 마스킹으로 대신 제공하지 않는다. 제한 컬럼이 포함된 SQL은 AUTHZ-030의 검증·중립 피드백·재작성 절차를 따른다. 해당 항목을 제외한 조회가 완료되면 REQ-101에 따라 정보 부재를 안내하고 허용된 나머지 결과를 제공한다. 내부 이력에는 실제 제한 사유를 남기며 등록되지 않은 API 응답 경로의 처리는 REQ-111을 따른다"
      - "마스킹 변환 정의는 컬럼과 API 응답 경로가 공유한다. API 경로의 마스킹 여부·정보주체·전송 속성은 REQ-608 한 곳에서 등록한다. 그룹별 원본 열람 허용과 별개로 저장 사본의 개인정보 마스킹은 REQ-107·REQ-111을 유지한다"
      - "자산 접근 그룹의 세트 승인과 나머지 직접 관리 정책의 경계, 과거 스냅샷 복원은 REQ-103을 그대로 따른다"
      - "상태 변경 API의 사용자 실행 승인을 설정으로 끌 수 없다. 위험 등급·승인 강제 설정은 REQ-105의 실행 통제를 약화하지 않는다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "기본 필터 해제 요청을 행 스코프 해제로 처리하려 하면 실행을 거부하고 모든 권한 조건을 유지한다"
      - "자기조인·서브쿼리·집합 연산·외부 조인의 각 테이블 참조에서 권한 조건을 보장할 수 없거나 규칙·바인딩·제외 명세를 검증하지 못하면 조건 없이 실행하지 않는다(AUTHZ-030)"
    lifecycle: "정책 변경·과거 이력·복원은 REQ-103을 따르며 대상별 적용 상태를 보존한다"
    permissions:
      - "ACT-002의 해당 메뉴·조회/등록/수정/상태변경 액션 권한으로 관리한다. 화면 노출과 별개로 서버에서 검증한다"
      - "권한 밖 개인정보·비밀값·업무 데이터를 기준정보의 사용처 조회로 우회 열람하지 못한다"
    audit: "기존 정책·승인·월별 확정 이력과 기준정보 변경 전 스냅샷은 기존 요구사항을 따른다. 조회에는 실제 적용한 모든 행 스코프와 기본 필터, 제외/유지 판단한 필터의 식별자·리비전·사용자 요청 근거·판정 사유 및 생성/실행 SQL을 REQ-107의 이력으로 연결한다"
    volume: "고객사별 관리 항목 수·변경 빈도는 미확인이다. 기존 NFR을 임의 수치로 바꾸지 않는다"
    config:
      - "관리할 속성·원천·사용처는 이 카드의 data·field_usage·consumers를 따른다. 코드/배포 설정·관리 데이터·읽기 전용 참조를 혼합하지 않는다"
    risk: "복수 조건의 AND·IN·서브쿼리와 선택적 기본 필터 제외는 메모리 DB의 SQL 의미 검증으로 구현 가능성을 확인했다. 제품 파서·대상 DBMS별 구문/별칭/외부 조인 위치·권한 원천 조회 성능은 미검증이며 P3에서 검증해야 한다"
    relations:
      depends_on: ["REQ-601"]
      constrains: ["REQ-202", "REQ-207"]
      conflicts_with: []
      nfr: []
      interfaces: []
    realization:
      features: ["FEAT-007","FEAT-008","FEAT-009","FEAT-012","FEAT-019","FEAT-202","FEAT-204"]
      screens: ["SCR-007","SCR-008","SCR-009","SCR-003","SCR-017"]
    examples:
      - {"kind":"정상","case":"전화번호 컬럼과 API phone 경로가 동일 전화번호 마스킹 변환 정의를 참조한다"}
      - { kind: 정상, case: "전화번호의 고객지원 그룹은 원본 열람, 영업·배송 그룹은 마스킹 열람, 정산 그룹은 접근 제한으로 정한다. 영업과 배송에는 모두 같은 전화번호 변환을 적용하며 그룹별로 가리는 위치나 강도를 나누지 않는다" }
      - { kind: 정상, case: "영업·고객지원 그룹에 함께 속한 사용자는 전화번호 원본을 열람하고 영업·정산 그룹에 함께 속한 사용자는 마스킹된 전화번호를 열람한다. 정산 그룹의 접근 제한이 다른 그룹의 열람 허용을 취소하지 않는다" }
      - { kind: 예외, case: "정산 그룹만 가진 사용자가 허용된 고객번호와 제한된 전화번호를 요청하면 전화번호의 실제 값이나 일부 값을 제공하지 않는다. 전화번호를 제외한 조회가 완료되면 고객번호 결과와 정보 부재 안내를 제공하고 내부 이력에는 제한 사유를 남긴다" }
      - {"kind":"예외","case":"기본 필터 해제 요청을 행 스코프 해제로 처리하려 하면 허용하지 않고 권한 조건을 유지한다"}
      - { kind: 정상, case: "사용자 u17의 회사 C1·조직 O10·업무 T100 권한을 각각 IN 서브쿼리로 등록하면 세 권한을 모두 만족하는 데이터만 조회한다. 회사만 일치하고 조직 또는 업무가 다른 행은 나오지 않는다" }
      - { kind: 정상, case: "취소·삭제·활성 상태 필터가 있는 주문에서 '취소된 것도 포함해'라고 요청하면 해제 허용된 취소 필터만 제외한다. 삭제된 주문과 비활성 주문 및 다른 회사·조직·업무의 주문은 계속 제외된다" }
      - { kind: 예외, case: "기본 필터 제외 목록에 회사 권한 규칙이나 다른 테이블의 취소 필터를 넣으면 실행하지 않는다. 모델 SQL의 OR 1=1도 서버의 모든 행 스코프를 무력화하지 못한다" }
      - { kind: 예외, case: "명세 수신 후 필터가 변경되거나 해제 불가로 바뀌면 이전 제외 허용을 재사용하지 않는다. 새 명세로 계획을 재구성하고 권한 조건은 유지한다" }
      - { kind: 예외, case: "취소 필터 제외 명세가 있어도 모델 SQL에 취소 제외 조건이 남아 있으면 사용자 의도와 맞게 재작성한다. 삭제 제외 조건까지 임의 삭제하지 않는다" }
    volatility: {"level":"high","what":"고객사마다 기준 값·대상·규모가 다르므로 운영 데이터로 관리한다. 관리 원천과 승인·보안 경계는 고객사 값과 구분한다"}
    open:
