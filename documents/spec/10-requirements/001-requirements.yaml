  - id: REQ-502
    type: functional
    priority: must
    priority_reason: "역할과 개인 예외가 하나의 유효 권한으로 합성되지 않으면 같은 사용자에게 화면과 API가 서로 다른 답을 하므로 RM-P1 필수다"
    workstream: system
    actors: [ACT-012]
    process_step: PRC-06-02
    title: "역할 권한과 개인 예외를 합성해 현재 유효 권한을 계산한다"
    detail: "시스템 관리자는 역할, 사용자별 역할, 역할별 메뉴 액션과 사용자별 예외를 부여·회수하고 영향 사용자를 확인할 수 있어야 한다"
    acceptance: "동일 메뉴 액션의 역할 부여와 개인 예외가 정해진 규칙으로 하나의 유효 권한이 되고, 변경 뒤 오래 열린 세션도 이전 권한을 계속 사용하지 않는다"
    source: "현재 구현 역추적 — 역할·역할 권한·개인 권한 화면과 유효 권한 버전 검사"
    evidence:
      frontend: ["modules/system/features/role", "modules/system/features/roleauth", "features/userauth", "shared/authz"]
      backend: ["modules/system/api/role", "modules/system/api/user", "api/userauth", "api/authz", "domain/authz"]
      tables: [SYS_ROLE, SYS_USER_ROLE, SYS_ROLE_MENU_AUTH, SYS_USER_MENU_AUTH]
