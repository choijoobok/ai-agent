  - id: REQ-506
    type: functional
    priority: must
    priority_reason: "런타임 설정은 인증·보존·조회 범위에 직접 영향을 주므로 검증과 원자적 적용 없이 운영 변경을 허용할 수 없어 RM-P1 필수다"
    workstream: system
    actors: [ACT-012]
    process_step: PRC-07-03
    title: "시스템 설정은 검증된 값만 적용하고 배포 기본값으로 되돌릴 수 있어야 한다"
    detail: "시스템 관리자는 `sys-config.*` 아래에 등록된 일반 런타임 설정을 조회·변경할 수 있어야 하며, 키별 형식·범위와 변경 영향 경고를 따라야 한다. 비밀값·임의 변경 금지 값은 별도 프로퍼티 경로로 배포 관리하며 이 화면의 대상이 아니다"
    acceptance: "잘못된 형식·범위·미등록 키 변경은 저장되지 않고, 성공한 변경은 설정 캐시 버전과 함께 한 트랜잭션으로 적용되며 되돌리면 오버라이드 행이 사라져 배포 기본값이 다시 드러난다. 설정값은 노드 캐시가 아니라 다음 작업 스코프의 DB 오버라이드 합성으로 반영된다. `sys-config.*` 밖의 비밀·보호 설정은 목록·응답·저장 요청에 나타나지 않는다"
    source: "현재 구현 역추적 — 시스템 환경설정 화면과 사용자 설정 모달"
    evidence:
