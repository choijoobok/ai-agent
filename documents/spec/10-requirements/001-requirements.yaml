    roadmap: RM-P1

  - id: REQ-503
    type: functional
    priority: must
    priority_reason: "미등록·미매핑 API를 허용하면 메뉴 권한을 우회하므로 실패 폐쇄 권한 사슬은 RM-P1 보안 기준선이다"
    workstream: system
    actors: [ACT-012]
    process_step: PRC-06-03
    title: "메뉴·화면·서비스 API의 권한 사슬을 실패 폐쇄로 유지한다"
    detail: "시스템 관리자는 메뉴 트리와 API 카탈로그의 화면·액션·서비스 API 매핑을 확인하고, 사용자는 유효 권한이 있는 메뉴와 API만 사용할 수 있어야 한다"
    hard_rule: "메뉴가 보인다는 사실, URL을 안다는 사실, 역할 이름 중 어느 것도 API 허용 근거가 아니다. `/api/service/**`는 등록 API와 메뉴 액션의 완전 일치가 없으면 403이다"
    acceptance: "메뉴·화면 등록·API 등록·메뉴 API 매핑 중 하나를 제거한 회귀 시험이 반드시 접근 거부로 끝난다"
