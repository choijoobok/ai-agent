      - "관리 화면 접근은 system 역할·메뉴 권한 데이터로 판정한다 — 특정 역할 하드코딩 없음(AUTHZ-091)"
    audit: "도구 호출은 다른 도구와 같이 전량 감사한다(REQ-107)"
    volume: "고객사별 — 도구 수가 적을수록 좋다"
    config:
