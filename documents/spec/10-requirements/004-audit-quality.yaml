    note: "미지정 경로 경고는 발생마다 알리지 않는다 — 알림이 스팸이 되면 아무도 보지 않는다. 오류·불일치 현황(REQ-115)의 유형별 당일·주간 집계로 보이고, 명세 관리 권한자(주로 ACT-002)가 업무 API 화면(FEAT-004)의 경고 목록에서 검토해 명세를 보완한다"
    config:
