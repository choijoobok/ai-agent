  - id: REQ-110
    type: functional
    priority: should
    actors: [ACT-001, ACT-005]
    source: "2026-09-20 사용자 결정 (ASM-008) · 2026-09-28 사용자 결정(저장 사본은 항상 마스킹 — PRN-07 개정) · 2026-09-29 사용자 결정(대화 이력 보관 기간 안이면 신고 가능)"
    process_step: PRC-02-06
    title: "품질 신고와 처리"
    detail: "사용자는 받은 응답이 사실과 다르거나 엉뚱하다고 판단되면 **해당 턴을 지정해 신고**한다. 신고 건은 원 응답의 이력과 연결되며, **되돌림이 있었던 턴에서는 최종 응답을 만든 회차의 이력에 연결한다**(버려진 회차의 SQL 을 근거로 분석하면 엉뚱한 결론이 나온다 — 다만 버려진 회차도 조회할 수 있어야 한다). 신고를 접수하면 해당 턴의 사용자 질의·생성된 모든 회차의 응답뿐 아니라 모델 호출, agent 도구·SQL·API 실행, 정책·권한 판정, 사용자 승인 요청·승인/거절, 처리 중 지시 보강·변경·중단, 대기·재시도·되돌림까지 **실제로 실행된 모든 스텝**의 순서·시각·입력·출력·상태 전이를 불변 증거 묶음으로 복사해 일반 대화 이력과 분리 보관한다. 각 모델 호출에는 실제 전달된 내부 프롬프트·선택된 지식과 스키마·전사 및 개인 규칙·정책 판정·모델 설정을 포함한다. 상태는 `접수 → 검토 → 종결` 로 전이하며 종결 시 처리자·일시·판단 사유와 **실제 조치 내역**을 기록한다"
    hard_rule: "**신고자는 자신의 신고 목록과 처리 결과·사유를 조회할 수 있다.** 결과 회신 없이 종결하는 것은 허용하지 않는다 — 신고가 어떻게 처리되는지 보이지 않으면 신고 자체가 들어오지 않아 품질 개선 경로가 끊긴다. 증거 묶음은 두 열람 층으로 나눈다: 신고자는 자신에게 보인 질의·응답·승인 결과와 처리 결과만, 유효 권한의 품질 담당자는 품질 재현에 필요한 전체 스텝 타임라인과 실제 모델 입력 전문(내부 프롬프트·주입 지식과 스키마·규칙·정책 판정 포함)까지 열람한다. 비밀 값·자격증명은 값 자체가 아니라 참조 식별자·버전·지문만 남긴다. 업무 데이터 값은 마스킹 사본만 복사하며(PRN-07), 결과 원문이 보존되지 않은 턴은 SQL·메타데이터·결과 지문으로 재현한다. 내부 증거를 신고자에게 노출하지 않으며 모든 열람을 감사한다. 자동 감지된 portal·agent 처리 오류는 REQ-115로 별도 관리하며, 응답 품질과 공통 원인이 확인되면 두 건을 직접 병합·상호 종결하지 않고 같은 지식 검토 작업의 근거로 연결한다"
    note: "@defer P3 — 증거 묶음의 별도 보관 기간, 물리 파기·종결 관계, 열람 권한·암호화와 데이터 모델의 정확한 키·무결성 규칙을 확정한다"
    acceptance: "신고자는 자신이 지정한 턴의 신고 상태와 처리 결과를 조회할 수 있고, 종결에는 처리자·시각·판단 사유·실제 조치가 필수다. 내부 증거 전문은 유효 권한의 품질 담당자에게만 열리며 모든 열람이 감사되고, 처리 오류 건과는 병합하지 않고 공통 지식 검토 근거로만 연결된다"
    summary: "사용자는 틀리거나 엉뚱한 응답을 턴 단위로 신고하고, 접수 시 그 턴의 실제 스텝 전체를 불변 증거 묶음으로 복사한다. 품질 담당자가 검토해 처리 사유·조치를 남기고 신고자는 결과를 본다"
    intent:
      problem: "응답이 틀렸을 때 사용자가 알릴 경로가 없거나 처리 결과가 보이지 않으면 신고가 들어오지 않아 정확도를 개선할 근거가 끊긴다"
      goal: "신고 한 건으로 그 응답이 만들어진 과정을 재현하고, 신고자에게 처리 결과를 돌려준다"
      not:
        - "자동 감지된 처리 오류가 아니다 — 그것은 REQ-115이며 두 건을 병합하지 않는다"
        - "신고자에게 내부 프롬프트·주입 지식을 보여 주는 기능이 아니다"
    goal_trace: [SUC-02]
    decider: "제품 오너(사용자)"
    preconditions:
      - "신고 대상 턴의 이력이 남아 있다(REQ-107·REQ-108)"
      - "업무 데이터 값은 마스킹 사본이 있어야 복사된다(REQ-111·PRN-07)"
    data:
      - { item: "신고(대상 턴·회차·사유·신고자·시각)", origin: "portal 입력", sensitivity: "일반", retention: "수정 불가 이력" }
      - { item: "불변 증거 묶음(스텝 타임라인·실제 모델 입력 전문·업무 데이터 마스킹 사본)", origin: "agent 이력 복사", sensitivity: "내부(프롬프트·규칙 포함)", retention: "P3에서 정한다(note)" }
      - { item: "처리(처리자·시각·판단 사유·실제 조치)", origin: "admin 입력", sensitivity: "일반", retention: "수정 불가 이력" }
    business_rules:
      - "되돌림이 있었던 턴은 최종 응답을 만든 회차에 연결하고, 버려진 회차도 조회할 수 있게 둔다"
      - "증거 묶음은 신고자 층(자기에게 보인 질의·응답·승인 결과와 처리 결과)과 품질 담당 층(전체 타임라인·실제 모델 입력 전문)으로 나눈다"
      - "결과 회신 없이 종결하지 않는다"
      - "결과 원문이 보존되지 않은 턴은 SQL·메타데이터·결과 지문으로 재현한다"
      - "대화 이력 보관 기간(REQ-109) 안의 턴이면 언제든 신고할 수 있다. 사용자가 삭제 표시한 대화는 사용자 화면에 없으므로 신고 대상이 아니다"
    exceptions:
      - "공정 단계의 예외는 PRC-02-06이 갖는다"
    lifecycle:
      - { state: 접수, next: [검토] }
      - { state: 검토, next: [종결] }
      - { state: 종결, next: [], note: "처리자·시각·판단 사유·실제 조치가 필수" }
    permissions:
      - "신고와 본인 신고 결과 조회: ACT-001"
      - "검토·종결과 내부 증거 열람: 유효 권한의 ACT-005"
      - "관리 화면 접근은 system 역할·메뉴 권한 데이터로 판정한다 — 특정 역할 하드코딩 없음(AUTHZ-091)"
    audit: "증거 묶음의 모든 열람을 감사한다"
    volume: "고객사별 미확인 — 도입 초기에 몰렸다가 줄어드는 것이 보통이나 추정이다"
    config: "해당 없음"
    risk: "증거 묶음은 모델 입력 전문을 담아 크다 — 보관 기간과 저장량을 P3에서 정한다"
    relations:
      depends_on: [REQ-107, REQ-108, REQ-111]
      constrains: [REQ-101]
      conflicts_with: []
