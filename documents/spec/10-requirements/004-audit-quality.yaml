  - id: REQ-111
    type: functional
    priority: must
    actors: [ACT-002, ACT-011]
    source: "2026-09-15 사용자 결정 (CR-023) · 2026-09-28 사용자 결정(저장 사본은 항상 마스킹 — PRN-07 개정) · 2026-09-29 사용자 결정(불일치는 발생마다 알리지 않고 대시보드의 당일·주간 현황으로 보인다)"
    process_step: PRC-11-02
    title: "API 응답의 개인정보 통제"
    detail: "**응답 경로 명세는 허용목록이며 기본값은 닫힘이다** — 명세에 없는 경로는 마스킹해서 화면에 내보내고, 저장하지 않으며, LLM 에 보내지 않는다. **요청 파라미터도 API 명세에 개인정보 여부를 표시하며**, 표시된 파라미터는 승인 카드에서 요청 사용자에게만 평문으로 보이고 저장 사본(실행 이력·승인 이력·재개 상태)은 마스킹한다. 경로 표현은 **정적 경로와 배열 와일드카드까지만** 허용한다. **미지정 경로가 응답에 나타나면 경고로 기록**하고 검토 대상으로 노출한다"
    hard_rule: "**마스킹은 수신·생성 직후에 갈라놓는다** — 감사 이력·재개 상태·증거 묶음·애플리케이션 로그로 가는 사본은 처음부터 마스킹된 것만 만들고 **평문은 사용자 응답 경로에만** 태운다. 이 원칙은 API 응답만이 아니라 조회 결과·요청 파라미터·모델 전송분 전체에 적용한다(PRN-07). 마스킹된 사본을 만들지 못하면(명세 부재·파싱 실패) 응답 전체를 마스킹 대상으로 다룬다"
    two_axes: "**정보주체 식별자**(사번·고객 ID·주문번호)는 **보존한다** — '누구의 정보를 봤는가' 의 근거다. **민감 값**(주민등록번호·계좌·연락처·주소)은 **마스킹한다** — 필요하면 값 지문을 함께 남긴다. **평문 열람 여부와 그 근거가 된 그룹**은 평문으로 화면에 나간 경우 항상 남긴다"
    why: "차단목록으로 두지 않는 이유는 **레거시의 응답 변경을 감지할 수단이 없기 때문**이다. 차단목록이면 레거시가 필드를 하나 추가하는 순간 미지정 경로가 생기고, 그것이 개인정보면 그대로 평문으로 쌓인다"
    roadmap: RM-P1
    limits: "**등록된 명세만큼만 정확하다.** 값 패턴 탐지는 **보조 수단**이며 이것을 근거로 명세 등록을 면제하지 않는다"
    acceptance: "등록되지 않은 응답 경로는 평문으로 화면·이력·재개 상태·로그·모델 입력에 남지 않고 경고로 기록되며, 마스킹 사본을 만들지 못한 응답은 전체가 마스킹되어 처리된다"
    summary: "업무 API 응답은 등록된 경로 명세만 허용하고, 명세에 없는 경로는 화면에서 가리고 저장·모델 전송하지 않는다. 요청 파라미터도 개인정보를 표시해 저장 사본은 마스킹한다. 정보주체 식별자는 남기고 민감 값은 가린다"
    intent:
      problem: "레거시 API 응답에 개인정보가 섞여 오고, 레거시가 필드를 추가해도 Hub는 알 수 없다. 차단 목록으로는 새 필드가 평문으로 쌓인다"
      goal: "명세로 확인된 경로만 통과시키고, 누구의 정보를 봤는지는 추적하되 민감 값은 남기지 않는다"
      not:
        - "차단 목록이 아니다 — 허용 목록이며 기본은 닫힘이다"
        - "값 패턴 탐지로 명세 등록을 대신하는 것이 아니다 — 패턴 탐지는 보조다"
    goal_trace: [ECO-05, INV-01]
    decider: "제품 오너(사용자). API별 개인정보 경로 식별은 고객사 ACT-011·ACT-014(CON-020)"
    preconditions:
      - "API별 응답 스키마와 개인정보 경로를 식별할 담당·시점, 응답 변경 통보 절차가 합의돼 있다(CON-020)"
      - "API 명세가 등록돼 있다(FEAT-004)"
    data:
      - { item: "응답 경로 명세(정적 경로·배열 와일드카드, 정보주체 식별자·민감 값 구분)", origin: "admin 입력", sensitivity: "내부", retention: "정책 스냅샷(REQ-103)" }
      - { item: "요청 파라미터의 개인정보 표시", origin: "admin 입력", sensitivity: "내부", retention: "정책 스냅샷" }
      - { item: "미지정 경로 경고(API·경로·발생 시각)", origin: "agent", sensitivity: "내부(값은 남기지 않음)", retention: "감사 이력 보존 정책" }
    business_rules:
      - "명세에 없는 경로는 화면에서 가리고, 저장하지 않으며, 모델에 보내지 않는다"
      - "정보주체 식별자(사번·고객 ID·주문번호)는 남기고, 민감 값(주민등록번호·계좌·연락처·주소)은 가린다. 필요하면 값 지문을 함께 남긴다"
      - "평문으로 화면에 나간 경우 평문 열람 여부와 그 근거 그룹을 항상 남긴다"
      - "마스킹 사본을 만들지 못하면(명세 부재·파싱 실패) 응답 전체를 마스킹 대상으로 다룬다"
    exceptions:
