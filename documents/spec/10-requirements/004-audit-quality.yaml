# 영역: 감사·품질·보관
requirements:
# ── 감사·품질·보관 ───────────────────────────────────────────
  - id: REQ-108
    type: functional
    priority: must
    actors: [ACT-005]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-02-04
    title: "이력 기록과 트랜잭션 분리"
    detail: "이력 기록은 **업무 트랜잭션과 분리**한다. 소모된 토큰과 이미 실행된 조회·API 호출은 되돌릴 수 없으므로 성공·실패나 롤백 여부와 무관하게 기록이 남아야 한다. 발생 즉시 **별도 트랜잭션으로 커밋**하고 이력 테이블은 **append-only** 로 운용한다"
    hard_rule: "**한 턴은 실제 실행을 시작하는 시점의 정책 스냅샷으로 최종 응답까지 일관되게 처리한다.** 사용자 그룹, 전사 프롬프트 규칙, 지식 베이스, 스키마 카탈로그와 그 접근·마스킹·전송 정책, API 카탈로그를 권한 적용 뒤 고정해 그 턴 동안 재조회하지 않는다 — 스텝 1에서 허용으로 판정한 것을 스텝 3에서 다른 기준으로 검증하면 한 턴 안에 서로 모순된 판정이 생긴다. 대기열에만 있던 턴은 실제 실행 시작 시점에 스냅샷을 잡고, 세션은 여러 날에 걸칠 수 있으므로 일관성 경계로 삼지 않는다"
    note: "턴 이력에는 적용한 각 관리 화면 스냅샷 식별자와 프롬프트 규칙 ID·리비전을 함께 남긴다. 중단된 턴을 재시도해도 같은 턴의 사용자 질의를 재사용하는 한 이 스냅샷을 사용하며, 새 사용자 질의로 만든 새 턴만 그때의 현재 정책을 읽는다"
    acceptance: "조회·API 실행 또는 모델 호출이 실패·취소·업무 트랜잭션 롤백으로 끝나도 발생 이력은 별도 트랜잭션으로 남고, 한 턴의 모든 스텝과 중단 뒤 재시도는 시작 시점에 참조한 정책 스냅샷과 적용 프롬프트 규칙 ID·리비전으로 일관되게 판정된다"
  - id: REQ-109
    type: functional
    priority: must
    actors: [ACT-001, ACT-005, ACT-011]
    source: "2026-09-20 사용자 결정 (ASM-008) · 2026-09-28 사용자 결정(저장 사본은 항상 마스킹 — PRN-07 개정)"
    process_step: PRC-02-04
    title: "보관과 파기 — 논리 삭제만 허용"
    detail: "**사용자의 대화 이력 삭제는 논리 삭제만 허용한다.** 표시 여부 플래그만 갱신되며 데이터는 삭제되지 않는다. admin 은 감사를 위해 **삭제 표시된 이력도 전량 조회**할 수 있고, 사용자가 감사 대상 기록을 지울 수 있는 경로는 제공하지 않는다. 물리 삭제는 보관 기간 정책에 따른 시스템 일괄 처리로만 수행한다"
    hard_rule: "**재개 상태(체크포인트)는 차등 저장을 우회하는 경로다** — 상태에는 도구 실행 결과 원문이 그대로 포함된다. 따라서 ① 턴이 종결되면 정리한다 ② **이전 회차의 재개 상태는 턴 종결 전에도 정리한다** ③ **보관 기간은 조회 결과 원문의 보관 기간보다 길 수 없다** ④ **조회 결과와 API 응답은 마스킹된 사본만 상태에 싣는다**(PRN-07) — 재개된 턴은 개인정보로 표시된 값이 가려진 채 이어진다"
    acceptance: "사용자가 이력 삭제를 요청해도 표시 상태만 바뀌고 감사 열람은 유지되며, 물리 파기는 보관 정책의 일괄 처리만 수행한다. 재개 상태는 종결·회차 교체 시 정리되고 원문 보관 기간을 넘기거나 평문 API 응답을 담지 않는다"
  - id: REQ-110
    type: functional
    priority: should
    actors: [ACT-001, ACT-005]
    source: "2026-09-20 사용자 결정 (ASM-008) · 2026-09-28 사용자 결정(저장 사본은 항상 마스킹 — PRN-07 개정)"
    process_step: PRC-02-06
    title: "품질 신고와 처리"
    detail: "사용자는 받은 응답이 사실과 다르거나 엉뚱하다고 판단되면 **해당 턴을 지정해 신고**한다. 신고 건은 원 응답의 이력과 연결되며, **되돌림이 있었던 턴에서는 최종 응답을 만든 회차의 이력에 연결한다**(버려진 회차의 SQL 을 근거로 분석하면 엉뚱한 결론이 나온다 — 다만 버려진 회차도 조회할 수 있어야 한다). 신고를 접수하면 해당 턴의 사용자 질의·생성된 모든 회차의 응답뿐 아니라 모델 호출, agent 도구·SQL·API 실행, 정책·권한 판정, 사용자 승인 요청·승인/거절, 처리 중 지시 보강·변경·중단, 대기·재시도·되돌림까지 **실제로 실행된 모든 스텝**의 순서·시각·입력·출력·상태 전이를 불변 증거 묶음으로 복사해 일반 대화 이력과 분리 보관한다. 각 모델 호출에는 실제 전달된 내부 프롬프트·선택된 지식과 스키마·전사 및 개인 규칙·정책 판정·모델 설정을 포함한다. 상태는 `접수 → 검토 → 종결` 로 전이하며 종결 시 처리자·일시·판단 사유와 **실제 조치 내역**을 기록한다"
    hard_rule: "**신고자는 자신의 신고 목록과 처리 결과·사유를 조회할 수 있다.** 결과 회신 없이 종결하는 것은 허용하지 않는다 — 신고가 어떻게 처리되는지 보이지 않으면 신고 자체가 들어오지 않아 품질 개선 경로가 끊긴다. 증거 묶음은 두 열람 층으로 나눈다: 신고자는 자신에게 보인 질의·응답·승인 결과와 처리 결과만, 유효 권한의 품질 담당자는 품질 재현에 필요한 전체 스텝 타임라인과 실제 모델 입력 전문(내부 프롬프트·주입 지식과 스키마·규칙·정책 판정 포함)까지 열람한다. 비밀 값·자격증명은 값 자체가 아니라 참조 식별자·버전·지문만 남긴다. 업무 데이터 값은 마스킹 사본만 복사하며(PRN-07), 결과 원문이 보존되지 않은 턴은 SQL·메타데이터·결과 지문으로 재현한다. 내부 증거를 신고자에게 노출하지 않으며 모든 열람을 감사한다. 자동 감지된 portal·agent 처리 오류는 REQ-115로 별도 관리하며, 응답 품질과 공통 원인이 확인되면 두 건을 직접 병합·상호 종결하지 않고 같은 지식 검토 작업의 근거로 연결한다"
    note: "@defer P3 — 증거 묶음의 별도 보관 기간, 물리 파기·종결 관계, 열람 권한·암호화와 데이터 모델의 정확한 키·무결성 규칙을 확정한다"
    acceptance: "신고자는 자신이 지정한 턴의 신고 상태와 처리 결과를 조회할 수 있고, 종결에는 처리자·시각·판단 사유·실제 조치가 필수다. 내부 증거 전문은 유효 권한의 품질 담당자에게만 열리며 모든 열람이 감사되고, 처리 오류 건과는 병합하지 않고 공통 지식 검토 근거로만 연결된다"
  - id: REQ-111
    type: functional
    priority: must
    actors: [ACT-002, ACT-011]
    source: "2026-09-15 사용자 결정 (CR-023) · 2026-09-28 사용자 결정(저장 사본은 항상 마스킹 — PRN-07 개정)"
    process_step: PRC-11-02
    title: "API 응답의 개인정보 통제"
    detail: "**응답 경로 명세는 허용목록이며 기본값은 닫힘이다** — 명세에 없는 경로는 마스킹해서 화면에 내보내고, 저장하지 않으며, LLM 에 보내지 않는다. **요청 파라미터도 API 명세에 개인정보 여부를 표시하며**, 표시된 파라미터는 승인 카드에서 요청 사용자에게만 평문으로 보이고 저장 사본(실행 이력·승인 이력·재개 상태)은 마스킹한다. 경로 표현은 **정적 경로와 배열 와일드카드까지만** 허용한다. **미지정 경로가 응답에 나타나면 경고로 기록**하고 검토 대상으로 노출한다"
    hard_rule: "**마스킹은 수신·생성 직후에 갈라놓는다** — 감사 이력·재개 상태·증거 묶음·애플리케이션 로그로 가는 사본은 처음부터 마스킹된 것만 만들고 **평문은 사용자 응답 경로에만** 태운다. 이 원칙은 API 응답만이 아니라 조회 결과·요청 파라미터·모델 전송분 전체에 적용한다(PRN-07). 마스킹된 사본을 만들지 못하면(명세 부재·파싱 실패) 응답 전체를 마스킹 대상으로 다룬다"
    two_axes: "**정보주체 식별자**(사번·고객 ID·주문번호)는 **보존한다** — '누구의 정보를 봤는가' 의 근거다. **민감 값**(주민등록번호·계좌·연락처·주소)은 **마스킹한다** — 필요하면 값 지문을 함께 남긴다. **평문 열람 여부와 그 근거가 된 그룹**은 평문으로 화면에 나간 경우 항상 남긴다"
    why: "차단목록으로 두지 않는 이유는 **레거시의 응답 변경을 감지할 수단이 없기 때문**이다. 차단목록이면 레거시가 필드를 하나 추가하는 순간 미지정 경로가 생기고, 그것이 개인정보면 그대로 평문으로 쌓인다"
    roadmap: RM-P1
    limits: "**등록된 명세만큼만 정확하다.** 값 패턴 탐지는 **보조 수단**이며 이것을 근거로 명세 등록을 면제하지 않는다"
    acceptance: "등록되지 않은 응답 경로는 평문으로 화면·이력·재개 상태·로그·모델 입력에 남지 않고 경고로 기록되며, 마스킹 사본을 만들지 못한 응답은 전체가 마스킹되어 처리된다"
  - id: REQ-112
    type: functional
    priority: must
    actors: [ACT-002]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지"
    process_step: PRC-02-03
    title: "프롬프트 인젝션·오염 대응과 전사 공통 응답 규칙"
    detail: "사용자 입력·조회된 데이터·지식 문서에 포함된 지시성 문장을 **명령으로 해석하지 않는다.** 개인 기본 지시는 시스템 프롬프트 규칙을 무력화할 수 없고 정책 판정은 항상 서버 규칙이 최종 결정한다. 관리자는 전사 공통 프롬프트 규칙으로 ① 권한 밖·미등록 대상의 존재 은닉과 고정 안내 문구 ② 지식 검색 무결과 시 접근 가능 태그 안내 ③ 전체 지식·문서·본문의 열거·일괄 요약 거절과 구체적 업무·사용법 질문 요청 ④ agent가 생산한 사용자 문구를 portal이 그대로 표시하는 원칙을 관리한다. 규칙은 식별자·우선순위·적용 조건·문구 템플릿·허용 치환값·활성 여부·리비전으로 관리한다"
    hard_rule: "프롬프트 규칙은 응답 문구와 태도를 정할 뿐 권한 경계가 아니다. agent 서버는 접근 그룹 필터, 태그 중복 제거·정렬, 검색 결과 상한, 지식 전체 열람·내보내기 차단을 별도로 강제하며 LLM에 전체 지식 목록·본문을 제공하지 않는다"
    acceptance: "사용자 입력·조회 결과·지식 본문 또는 개인 기본 지시에 정책 우회·권한 확대·도구 직접 호출 지시가 포함돼도 서버 정책과 시스템 규칙이 변경되지 않고, 허용되지 않은 실행은 발생하지 않는다. 전체 지식을 보여 달라는 요청은 본문·제목·건수 열거 없이 구체적 업무 또는 사용법 질문을 요청하는 공통 문구로 응답하며, 태그 안내는 서버가 필터·중복 제거·정렬한 허용 태그만 사용한다"
  - id: REQ-113
    type: functional
    priority: must
    actors: [ACT-002, ACT-006]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-11-01
    title: "중복 실행의 책임 경계"
    detail: "**한 턴 안**의 중복(인스턴스 회수 후 재개 등)은 **Hub 가 막는다**(실행 점유). **턴 사이**의 중복(서로 다른 세션·턴이 같은 대상에 같은 액션)은 **대상 시스템이 막는다** — Hub 는 막지 않는다"
    why: "**후자를 막지 않는 것은 누락이 아니라 결정이다.** 두 사용자가 각자 다른 채팅에서 겹치는 대상을 처리하는 것은 정당한 병렬 업무이며, 파라미터가 일부 겹친다는 이유로 차단하면 정상 업무가 멈춘다. **무엇이 '같은 작업' 인지는 업무 의미론**이고 그 판단을 Hub 가 복제하는 것은 PRN-09 가 금지하는 방향이다"
    hard_rule: "Hub 가 이 층에서 제공하는 것은 차단이 아니라 **가시성**이다 — 승인 화면에 같은 API 의 최근 실행 이력(실행자·시각·파라미터·결과 — 결과 불명 포함)을 함께 제시해 **사람이 판단**하게 한다. 멱등하지 않은 것으로 등록된 실행 API 는 그 사실과 재시도 정책을 승인 화면에 함께 제시한다"
    roadmap: RM-P1
    acceptance: "같은 턴에서 재개·재시도로 동일 실행이 중복 요청되면 실행 점유가 하나만 통과시키고, 서로 다른 턴의 동일 업무는 Hub가 의미론으로 차단하지 않되 승인 화면에 최근 실행 이력·멱등성·재시도 정책을 표시한다"
  - id: REQ-114
    type: functional
    priority: should
    priority_reason: "RM-P1의 업무 실행은 등록 REST API만으로 성립하며, 내부 서비스 빈 기반 커스텀 도구는 같은 통제 아래 확장하는 후순위 기능이므로 should로 둔다"
    actors: [ACT-002]
    source: "2026-09-15 사용자 결정 (CR-023) · 2026-09-28 사용자 결정(설정·자격증명 비반환 검수)"
    process_step: PRC-03-01
    title: "커스텀 도구 — PRN-08 의 명시적 예외"
    detail: "설정으로 표현할 수 없는 다중 시스템 데이터 가공은 agent 안의 서비스 빈으로 구현한다. **도구 레지스트리에 등록**되고 **호출 허용 그룹 매핑·실행 유형·명시적 사용자 승인·전량 감사**를 다른 도구와 동일하게 받으며, 미등록·미매핑 상태에서는 호출할 수 없다"
    hard_rule: "커스텀 도구는 코드이므로 SQL 통제 4단계를 거치지 않는다 — **도구별로 입력·출력 계약, 데이터 접근 범위, 민감 데이터 마스킹, 재시도·멱등성, 오류 처리**를 선언하고 구현에서 강제해야 한다. 이 선언과 코드 리뷰·보안 및 고객사 테스트·검수 근거 없이는 노출하지 않는다. **검수 항목에는 '설정 파일·환경 변수·자격증명을 읽거나 출력·오류로 반환하지 않는다'를 반드시 넣는다** — 커스텀 도구는 agent 안의 코드라 설계가 아니라 검수만이 이 경로를 막는다(2026-09-28 사용자 결정). **SQL 이나 등록 API 로 가능한 것을 커스텀 도구로 만들지 않는다** — 통제가 검증된 경로를 우회하는 코드가 늘어나는 것 자체가 위험이다"
    note: "공통 레지스트리·권한 판정·감사·승인 흐름은 재사용하지만, 내부 서비스의 데이터 통제는 자동으로 재사용되지 않는다. 요건 승인·코드 리뷰·배포 통제는 고객사 프로젝트 관리 체계의 책임이다"
    roadmap: RM-P1
    acceptance: "등록·그룹 매핑·실행 유형·승인·감사와 도구별 입출력·데이터 범위·마스킹·재시도·멱등성·오류 처리 선언 및 검수 근거가 모두 없는 커스텀 도구는 호출·노출되지 않는다"
  - id: REQ-115
    type: functional
    priority: must
    actors: [ACT-005, ACT-003]
    source: "2026-09-20 사용자 결정 (ASM-008) · 2026-09-28 사용자 결정(저장 사본은 항상 마스킹 — PRN-07 개정)"
    process_step: PRC-10-01
    title: "portal·agent 처리 오류 기록과 지식 보완 관리"
    detail: "Hub는 portal 요청을 받은 agent가 요청·응답 계약, 컨텍스트 구성, 모델·도구 호출, SQL 검증·실행, 응답 구성 중 실패한 경우를 턴 단위 AI 처리 오류 발생 이력으로 남기고, 해당 턴에서 실제 실행된 모든 스텝(사용자 질의·모든 회차 응답·모델 호출·agent 도구·SQL·API 실행·정책 및 권한 판정·사용자 승인 요청과 결정·처리 중 지시 보강·변경·중단·대기·재시도·되돌림)의 순서·시각·입력·출력·상태 전이를 불변 증거 묶음으로 복사한다. 각 모델 호출에는 실제 전달된 내부 프롬프트와 선택된 지식·스키마·전사 및 개인 규칙·정책 판정·모델 설정을 포함한다. 같은 열린 원인 묶음에는 하나의 오류 처리 건을 자동 생성하거나 연결한다. 새 처리 건은 품질 담당자에게 기존 개인 알림 경로로 알리고, 품질 담당자가 지식 보완 필요를 판정한 경우에만 지식 검토 작업과 업무 자산 관리자를 배정해 추가 알림한다. 처리 건은 `접수 → 분석 중 → 지식 보완 대기 또는 외부 확인 대기 → 조치 완료 → 종결` 상태, 담당자, 조치와 연결 오류 발생을 조회한다"
    hard_rule: "AI 처리 오류 발생 이력과 증거 묶음은 수정·삭제하지 않으며, **system 모듈의 SYS_LO_EXCEPTION을 읽거나 참조하지 않는 별도 admin 자산**이다. 오류 이력에는 턴·단계·추적 식별자와 마스킹·정제한 실패 정보를 저장하고, 증거 묶음에는 품질 재현에 필요한 전체 스텝 타임라인과 실제 모델 입력 전문(내부 프롬프트·주입 지식과 스키마·규칙·정책 판정 포함)을 보관하되, 업무 데이터 값은 이미 남아 있는 마스킹 사본만 복사한다(PRN-07). 결과 원문이 보존되지 않은 턴은 SQL·메타데이터·결과 지문으로 재현한다. 비밀 값·자격증명은 값 자체가 아니라 참조 식별자·버전·지문만 남긴다. 이 내부 증거는 유효 권한의 품질 담당자만 열람하고 모든 열람을 감사한다. 지식 보완 알림은 범용 알림함의 수동 전달이 아니라 처리 건의 상태 전이·검토 작업 배정으로 발생하며, admin은 system의 public 알림 계약만 사용한다. AI 처리 오류 처리 메뉴 액션은 현재 유효 역할 권한으로 판정하고, 품질 담당자의 장기 부재에는 역할 부여의 유효 시작일·종료일로 한시 대리인을 둔다. 정상 응답의 논리 오류는 품질 신고(REQ-110)로 처리하며, 공통 원인이 확인되면 두 건을 직접 병합·상호 종결하지 않고 같은 지식 검토 작업의 근거로 연결한다"
    note: "@defer P3 — 오류 처리 건을 묶는 안정 지문(실패 단계·오류 분류·영향 자산 등)과, AI 처리 오류·품질 신고·변경 통지를 지식 검토 작업에 연결하는 근거 매핑의 정확한 키·무결성·동시 처리 규칙을 데이터 모델로 확정한다"
    acceptance: "같은 열린 원인 묶음에서 발생한 portal·agent 처리 실패는 턴별 발생 이력을 잃지 않고 하나의 오류 처리 건에서 조회되며, 지식 보완이 필요한 경우 관련 검토 작업으로 연결되고 종결된 건에는 처리자·사유·조치 이력이 남는다"
