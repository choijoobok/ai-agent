# 영역: 감사·품질·보관
requirements:
# ── 감사·품질·보관 ───────────────────────────────────────────
  - id: REQ-108
    type: functional
    priority: must
    actors: [ACT-005]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-29 사용자 결정(정책은 스텝이 처음 필요할 때 판정해 턴 끝까지 고정·소급 없음 · 오래 멈춘 뒤 이어가면 재판정)"
    process_step: PRC-02-04
    title: "이력 기록과 트랜잭션 분리"
    detail: "이력 기록은 **업무 트랜잭션과 분리**한다. 소모된 토큰과 이미 실행된 조회·API 호출은 되돌릴 수 없으므로 성공·실패나 롤백 여부와 무관하게 기록이 남아야 한다. 발생 즉시 **별도 트랜잭션으로 커밋**하고 이력 테이블은 **append-only** 로 운용한다"
    hard_rule: "**한 턴 안에서 정책 대상은 한 번만 판정한다(판정 고정).** 스텝이 사용자 그룹·전사 프롬프트 규칙·지식·스키마 카탈로그와 그 접근·마스킹·전송 정책·API 카탈로그 중 하나를 처음 필요로 할 때 그 시점의 현재 값으로 판정하고, 턴이 끝날 때까지 같은 대상을 다시 판정하지 않는다. 판정한 뒤 정책이 바뀌어도 그 턴에 소급하지 않는다 — 스텝 1에서 허용으로 판정한 것을 스텝 3에서 다른 기준으로 다시 판정하면 한 턴 안에 서로 모순된 판정이 생긴다. **예외는 오래 멈춘 뒤 이어갈 때다** — 사용자대기에 들어간 뒤 응답까지 재판정 기준 시간(config)을 넘겼으면 이어가기 전에 고정을 모두 풀고 현재 값으로 다시 판정하고, 중단된 턴의 재시도는 첫 단계부터 새로 시작하므로 경과 시간과 무관하게 새로 판정한다(REQ-013). 세션은 여러 날에 걸칠 수 있으므로 일관성 경계로 삼지 않는다"
    note: "턴 이력에는 대상별로 판정에 쓴 관리 화면 스냅샷 식별자·프롬프트 규칙 ID·리비전과 판정 시각, 재판정 여부를 함께 남긴다. 주 추론 모델·effort를 턴 시작에 고정하는 것은 이 규칙이 아니라 LLM 계층 규칙(20-architecture)이 갖는다"
    acceptance: "조회·API 실행 또는 모델 호출이 실패·취소·업무 트랜잭션 롤백으로 끝나도 발생 이력은 별도 트랜잭션으로 남는다. 한 턴에서 같은 정책 대상은 처음 판정한 값으로 끝까지 판정되고, 사용자대기가 재판정 기준 시간을 넘긴 뒤 이어가거나 중단된 턴을 재시도하면 현재 정책으로 다시 판정된다"
    summary: "이력은 업무 트랜잭션과 분리해 발생 즉시 별도 트랜잭션으로 커밋하고 append-only로 쌓는다. 정책은 스텝이 처음 필요로 할 때 판정해 턴이 끝날 때까지 고정하고, 오래 멈췄다 이어가거나 재시도하면 다시 판정한다"
    intent:
      problem: "토큰 소모와 이미 나간 조회·API 호출은 되돌릴 수 없는데, 업무 트랜잭션이 롤백되면 그 사실까지 사라진다. 또 한 턴 안에서 정책이 바뀌면 스텝마다 서로 모순된 판정이 나온다"
      goal: "무슨 일이 일어났는지는 성공·실패와 무관하게 남기고, 한 턴 안의 판정은 하나의 기준으로 묶는다"
      not:
        - "업무 데이터의 트랜잭션 관리가 아니다 — 업무 시스템의 성공·롤백은 대상 시스템의 일이다"
        - "세션 단위 일관성이 아니다 — 세션은 여러 날에 걸칠 수 있어 경계로 삼지 않는다"
    goal_trace: [INV-01]
    decider: "제품 오너(사용자) — 감사 무결성 원칙이라 고객사별 조정 대상이 아니다"
    preconditions:
      - "정책 대상(사용자 그룹·프롬프트 규칙·지식·카탈로그·API 카탈로그)이 스냅샷 식별자를 갖는다(REQ-103)"
    data:
      - { item: "턴별·대상별 판정 스냅샷 식별자·프롬프트 규칙 ID·리비전·판정 시각·재판정 여부", origin: "agent 스텝 판정", sensitivity: "내부", retention: "감사 이력 보존 정책(REQ-107·REQ-109)" }
    business_rules:
      - "이력은 발생 즉시 업무 트랜잭션과 별도 트랜잭션으로 커밋하고 append-only로 운용한다"
      - "정책 대상은 스텝이 처음 필요로 할 때 현재 값으로 판정하고 턴이 끝날 때까지 고정한다. 대기열에만 있던 턴은 처리를 시작한 뒤에야 판정하므로 대기 중 변경이 반영된다"
      - "권한을 줄이는 변경(계정 비활성화·그룹 회수)도 이미 판정한 턴에 소급하지 않는다. 승인 대기(기본 10분)와 실행 유효 시간(기본 5분) 안에서는 옛 판정으로 실행될 수 있음을 감수한다"
      - "사용자대기에 들어간 뒤 응답까지 재판정 기준 시간을 넘기면 이어가기 전에 고정을 모두 풀고 현재 값으로 다시 판정한다. 다시 판정해 대기 중이던 액션이 허용되지 않으면 실행하지 않고 차단 사유를 안내한다(REQ-102)"
      - "중단된 턴의 재시도는 첫 단계부터 새 시도이므로 이전 시도의 판정을 쓰지 않고 새로 판정한다(REQ-013)"
    exceptions:
      - "공정 단계의 예외는 PRC-02-04가 갖는다 — 필수 이력을 기록하지 못하면 응답을 성공 처리하지 않는다"
    lifecycle: "해당 없음 — 이력은 불변이고, 턴 상태는 03-glossary 003-turn-states가 정본이다"
    permissions: "해당 없음 — 기록 방식의 규칙이다. 이력 열람 권한은 REQ-107이 갖는다"
    audit: "턴 이력에 대상별 판정 스냅샷 식별자·프롬프트 규칙 ID·리비전·판정 시각과 재판정 여부를 남긴다"
    volume: "스텝마다 기록이 생긴다 — 규모는 REQ-107·CON-025와 같다"
    config:
      - "`sys-config.agent.policy.recheck-after-minutes` — 사용자대기에 들어간 뒤 응답까지 이 시간을 넘기면 고정한 판정을 풀고 다시 판정한다. 양의 정수 분, 기본 60분. 시스템 설정 DB 오버라이드로 배포 없이 바꾸며 저장 뒤 새로 대기에 들어가는 턴부터 적용한다"
    risk: "권한 회수가 이미 판정한 턴에 소급되지 않아 짧은 창에서 옛 판정으로 실행될 수 있다 — 2026-09-29 사용자 결정으로 감수한다. 스텝마다 별도 커밋하므로 쓰기 횟수가 많다 — NFR-027의 누락 금지와 함께 처리량을 P3·P4에서 잰다"
    relations:
      depends_on: [REQ-103]
      constrains: [REQ-107, REQ-110, REQ-115]
      conflicts_with: []
      nfr: [NFR-027]
      interfaces: []
    realization:
      features: [FEAT-210]
      screens: []
    examples:
      - { kind: 정상, case: "출고 API 호출 뒤 대상 시스템이 업무 트랜잭션을 롤백해도 Hub의 호출 이력과 소모 토큰은 별도 트랜잭션으로 이미 남아 있다" }
      - { kind: 예외, case: "10:01에 카탈로그를 판정한 턴은 10:02에 관리자가 그 그룹 매핑을 바꿔도 10:01 판정으로 최종 응답까지 간다. 10:05의 새 질문부터 바뀐 매핑이 적용된다" }
      - { kind: 예외, case: "추가 정보 대기에 들어간 턴에 사용자가 3시간 뒤 답하면, 기준 60분을 넘겼으므로 이어가기 전에 현재 매핑으로 다시 판정한다. 그사이 그룹이 회수됐다면 그 테이블은 조회하지 않고 차단 사유를 안내한다" }
    volatility: { level: low, what: "감사 무결성 원칙이라 고객사마다 달라지지 않는다. 재판정 기준 시간만 운영 설정이다" }
    open: []
    maturity: { level: confirmed, at: "2026-09-29", by: "AI 정리", confirmed_by: "사용자 (2026-09-29 요구사항 정의서 검토 뒤 확정)" }
  - id: REQ-109
    type: functional
    priority: must
    actors: [ACT-001, ACT-005, ACT-011]
    source: "2026-09-20 사용자 결정 (ASM-008) · 2026-09-28 사용자 결정(저장 사본은 항상 마스킹 — PRN-07 개정) · 2026-09-29 사용자 결정(대화 이력 보관 기간은 yml · 파기는 system 스케줄 화면에 빈 등록)"
    process_step: PRC-02-04
    title: "보관과 파기 — 논리 삭제만 허용"
    detail: "**사용자의 대화 이력 삭제는 논리 삭제만 허용한다.** 표시 여부 플래그만 갱신되며 데이터는 삭제되지 않는다. admin 은 감사를 위해 **삭제 표시된 이력도 전량 조회**할 수 있고, 사용자가 감사 대상 기록을 지울 수 있는 경로는 제공하지 않는다. 물리 삭제는 보관 기간 정책에 따른 시스템 일괄 처리로만 수행한다"
    hard_rule: "**재개 상태(체크포인트)는 차등 저장을 우회할 수 있는 경로다** — 상태에는 스텝마다 도구 실행 결과가 담긴다. 따라서 ① 턴이 종결되면 정리한다 ② **이전 회차의 재개 상태는 턴 종결 전에도 정리한다** ③ **보관 기간은 조회 결과 원문의 보관 기간보다 길 수 없다** ④ **조회 결과와 API 응답은 마스킹된 사본만 상태에 싣는다**(PRN-07) — 재개된 턴은 개인정보로 표시된 값이 가려진 채 이어진다"
    acceptance: "사용자가 이력 삭제를 요청해도 표시 상태만 바뀌고 감사 열람은 유지되며, 물리 파기는 보관 정책의 일괄 처리만 수행한다. 재개 상태는 종결·회차 교체 시 정리되고 원문 보관 기간을 넘기거나 평문 조회 결과·API 응답을 담지 않는다"
    summary: "사용자의 대화 이력 삭제는 표시 플래그만 바꾸는 논리 삭제이고, 물리 삭제는 보관 기간에 따른 일괄 처리로만 한다. 재개 상태(체크포인트)는 턴·회차가 끝나면 정리하고 마스킹 사본만 담는다"
    intent:
      problem: "사용자가 대화를 지우면 감사 대상 기록까지 사라지고, 재개 상태가 오래 남으면 원문 보존 정책을 우회하는 저장소가 된다"
      goal: "사용자 화면에서는 지울 수 있게 하되 감사 근거는 남기고, 재개 상태는 필요한 동안만 둔다"
      not:
        - "개인정보 삭제 요청(정보주체 권리) 처리가 아니다 — 법적 파기 요구는 고객사 법무 절차(CON-032)를 따른다"
        - "사용자가 감사 기록을 지우는 경로가 아니다"
    goal_trace: [ECO-05]
    decider: "제품 오너(사용자). 보관 기간은 고객사 ACT-011(CON-032)"
    preconditions:
      - "보관 기간이 고객사와 합의돼 있다(CON-032)"
      - "재개 상태에 담는 조회 결과·API 응답의 마스킹 사본을 만들 수 있다(REQ-111·PRN-07)"
    data:
      - { item: "대화 이력의 표시 여부 플래그와 삭제 표시 시각", origin: "portal 사용자 조작", sensitivity: "일반", retention: "대화 이력 보관 기간(yml)" }
      - { item: "재개 상태(스텝별 메시지·도구 결과의 마스킹 사본)", origin: "agent", sensitivity: "업무 데이터 값은 마스킹 사본", retention: "턴 종결 시 정리 · 원문 보존 기간을 넘지 않음" }
    business_rules:
      - "사용자의 대화 이력 삭제는 표시 여부 플래그만 바꾼다. admin은 삭제 표시된 이력도 감사용으로 전량 조회한다"
      - "물리 삭제는 보관 기간 정책에 따른 시스템 일괄 처리로만 한다. **배치 관리는 system 스케줄 배치 화면(FEAT-508)을 그대로 쓰고 새 메뉴를 만들지 않는다** — 대화 이력을 소유한 agent 모듈에 파기용 BatchJob 빈을 추가하면 스케줄 화면의 BEAN_ID 목록에 나타나고, 청크 분할·중단은 공통 RetentionPurger를 재사용한다(원문 사본 파기 REQ-107과 같은 방식)"
      - "재개 상태는 턴이 끝나면 정리하고, 이전 회차의 재개 상태는 턴이 끝나기 전에도 정리한다"
      - "재개 상태의 보관 기간은 조회 결과 원문의 보존 기간을 넘지 않는다 — 원문을 보존하지 않는 데이터소스라면 턴이 끝나는 즉시 정리한다"
    exceptions:
      - "공정 단계의 예외는 PRC-02-04가 갖는다"
    lifecycle:
      - { state: 표시, next: [삭제 표시], note: "사용자 대화 목록에 보인다" }
      - { state: 삭제 표시, next: [파기], note: "사용자에게 보이지 않고 admin 감사 조회에는 보인다" }
      - { state: 파기, next: [], note: "보관 기간이 지나 일괄 처리로 물리 삭제됐다" }
    permissions:
      - "대화 이력 삭제(논리): 본인 대화의 ACT-001"
      - "삭제 표시 포함 전량 조회: ACT-005"
      - "관리 화면 접근은 system 역할·메뉴 권한 데이터로 판정한다 — 특정 역할 하드코딩 없음(AUTHZ-091)"
    audit: "삭제 표시 조작도 이력으로 남는다(REQ-107)"
    volume: "대화 이력은 사용자·턴 수에 비례한다. 재개 상태는 스텝마다 메시지 전량을 담아 턴 안에서도 빨리 쌓인다(CON-025)"
    config:
      - "대화 이력 보관 기간은 yml 전역 값이며 배포 없이 바꿀 수 없다 — 보관 기간은 규제 합의(CON-032)의 결과라 운영 화면에서 늘리거나 줄이지 않는다. 합의 전에는 파기 배치를 꺼 둔다"
    risk: "재개 상태 정리가 실패하면 마스킹 사본이라도 보존 정책보다 오래 남는다 — 정리 실패를 운영 경고로 드러내야 한다"
    relations:
      depends_on: [REQ-107, REQ-111]
      constrains: []
      conflicts_with: []
      nfr: []
      interfaces: []
    realization:
      features: [FEAT-019, FEAT-020, FEAT-026, FEAT-112]
