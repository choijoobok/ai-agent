  - id: REQ-115
    type: functional
    priority: must
    actors: [ACT-005, ACT-003, ACT-002, ACT-012]
    source: "2026-09-20 사용자 결정 (ASM-008) · 2026-09-28 사용자 결정(저장 사본은 항상 마스킹 — PRN-07 개정) · 2026-09-29 사용자 결정(모든 예외는 오류 이력 · 유형 분류 · 발생마다 알리지 않고 대시보드 당일·주간 현황)"
    process_step: PRC-10-01
    title: "portal·agent 처리 오류 기록과 지식 보완 관리"
    detail: "Hub는 portal 요청을 받은 agent가 요청·응답 계약, 컨텍스트 구성, 모델·도구 호출, SQL 검증·실행, 응답 구성 중 실패한 경우를 턴 단위 AI 처리 오류 발생 이력으로 남기고, 해당 턴에서 실제 실행된 모든 스텝(사용자 질의·모든 회차 응답·모델 호출·agent 도구·SQL·API 실행·정책 및 권한 판정·사용자 승인 요청과 결정·처리 중 지시 보강·변경·중단·대기·재시도·되돌림)의 순서·시각·입력·출력·상태 전이를 불변 증거 묶음으로 복사한다. 각 모델 호출에는 실제 전달된 내부 프롬프트와 선택된 지식·스키마·전사 및 개인 규칙·정책 판정·모델 설정을 포함한다. 같은 열린 원인 묶음에는 하나의 오류 처리 건을 자동 생성하거나 연결한다. 새 처리 건은 품질 담당자에게 기존 개인 알림 경로로 알리고, 품질 담당자가 지식 보완 필요를 판정한 경우에만 지식 검토 작업과 업무 자산 관리자를 배정해 추가 알림한다. 처리 건은 `접수 → 분석 중 → 지식 보완 대기 또는 외부 확인 대기 → 조치 완료 → 종결` 상태, 담당자, 조치와 연결 오류 발생을 조회한다"
    hard_rule: "AI 처리 오류 발생 이력과 증거 묶음은 수정·삭제하지 않으며, **system 모듈의 SYS_LO_EXCEPTION을 읽거나 참조하지 않는 별도 admin 자산**이다. 오류 이력에는 턴·단계·추적 식별자와 마스킹·정제한 실패 정보를 저장하고, 증거 묶음에는 품질 재현에 필요한 전체 스텝 타임라인과 실제 모델 입력 전문(내부 프롬프트·주입 지식과 스키마·규칙·정책 판정 포함)을 보관하되, 업무 데이터 값은 이미 남아 있는 마스킹 사본만 복사한다(PRN-07). 결과 원문이 보존되지 않은 턴은 SQL·메타데이터·결과 지문으로 재현한다. 비밀 값·자격증명은 값 자체가 아니라 참조 식별자·버전·지문만 남긴다. 이 내부 증거는 유효 권한의 품질 담당자만 열람하고 모든 열람을 감사한다. 지식 보완 알림은 범용 알림함의 수동 전달이 아니라 처리 건의 상태 전이·검토 작업 배정으로 발생하며, admin은 system의 public 알림 계약만 사용한다. AI 처리 오류 처리 메뉴 액션은 현재 유효 역할 권한으로 판정하고, 품질 담당자의 장기 부재에는 역할 부여의 유효 시작일·종료일로 한시 대리인을 둔다. 정상 응답의 논리 오류는 품질 신고(REQ-110)로 처리하며, 공통 원인이 확인되면 두 건을 직접 병합·상호 종결하지 않고 같은 지식 검토 작업의 근거로 연결한다"
    note: "@defer P3 — 오류 처리 건을 묶는 안정 지문(실패 단계·오류 분류·영향 자산 등)과, AI 처리 오류·품질 신고·변경 통지를 지식 검토 작업에 연결하는 근거 매핑의 정확한 키·무결성·동시 처리 규칙을 데이터 모델로 확정한다"
    acceptance: "같은 열린 원인 묶음에서 발생한 portal·agent 처리 실패는 턴별 발생 이력을 잃지 않고 하나의 오류 처리 건에서 조회되며, 지식 보완이 필요한 경우 관련 검토 작업으로 연결되고 종결된 건에는 처리자·사유·조치 이력이 남는다. 발생마다 알림은 가지 않고, 유형별 당일·주간 발생 현황이 대시보드에 보인다"
    summary: "portal·agent가 요청을 처리하지 못한 경우를 턴 단위 AI 처리 오류로 유형을 나눠 남기고 증거 묶음을 복사한다. 같은 원인은 하나의 처리 건으로 묶어 품질 담당자에게 알리고, 지식 보완이 필요하면 지식 검토 작업으로 넘긴다. 발생마다 알리지 않고 유형별 당일·주간 현황을 대시보드로 보인다"
    intent:
      problem: "처리 실패가 system 예외 로그에 섞이면 AI 품질 문제로 추적되지 않고, 같은 원인의 실패가 흩어져 보여 지식 보완으로 이어지지 않는다"
      goal: "AI 처리 실패를 원인별로 모아 보고, 필요한 지식 보완까지 한 흐름으로 끝낸다"
      not:
        - "system의 SYS_LO_EXCEPTION이 아니다 — 읽지도 참조하지도 않는 별도 admin 자산이다"
        - "사용자 품질 신고가 아니다(REQ-110) — 공통 원인이면 같은 지식 검토 작업에 연결만 한다"
    goal_trace: [SUC-02]
    decider: "제품 오너(사용자) — 2026-09-20 ASM-008"
    preconditions:
      - "턴 이력과 스텝 기록이 남아 있다(REQ-107·REQ-108)"
      - "system 공개 알림 계약이 있다(REQ-509)"
    data:
      - { item: "AI 처리 오류 발생 이력(턴·단계·추적 식별자·마스킹·정제한 실패 정보)", origin: "agent·portal", sensitivity: "내부", retention: "수정·삭제 불가" }
      - { item: "불변 증거 묶음", origin: "agent 이력 복사", sensitivity: "내부(프롬프트·규칙 포함, 업무 데이터는 마스킹 사본)", retention: "REQ-110과 같이 P3에서 정함" }
      - { item: "처리 건(상태·담당자·조치·연결 발생)", origin: "admin", sensitivity: "일반", retention: "수정 불가 이력" }
    business_rules:
      - "같은 열린 원인 묶음의 실패는 하나의 처리 건에 자동 생성·연결한다"
      - "새 처리 건은 품질 담당자에게 기존 개인 알림 경로로 알리고, 지식 보완이 필요하다고 판정한 경우에만 지식 검토 작업과 업무 자산 관리자를 배정해 추가로 알린다"
      - "품질 담당자의 장기 부재에는 역할 부여의 유효 기간으로 한시 대리인을 둔다"
      - "오류 이력은 발생 시점에 유형을 분류해 남긴다 — 스키마 카탈로그 불일치(SQL 실행 시 객체·컬럼 없음 등) · API 요청 불일치(대상 시스템의 요청 검증 오류) · API 응답 파싱 실패 · 그 밖의 처리 오류. 사후에 오류 문구로 분류하지 않는다 — 문구가 바뀌면 집계가 끊긴다"
      - "발생 건마다 알림을 보내지 않는다 — 알림이 스팸이 되면 아무도 보지 않는다. 대신 대시보드에 유형별 당일·주간 발생 현황을 보이고(응답 명세 불일치 경고 REQ-111 포함), 업무 자산 관리자(ACT-003)·보안 담당자(ACT-002)·시스템 관리자(ACT-012)가 메뉴 권한으로 본다. 원인 묶음마다 새 처리 건을 품질 담당자에게 한 번 알리는 규칙은 그대로다"
      - "portal·agent 처리 실패가 아닌 서버 예외는 system 오류 이력(REQ-507)에 남는다 — 어떤 예외도 두 이력 중 어디에도 남지 않는 일은 없다"
    exceptions:
      - "공정 단계의 예외는 PRC-10-01이 갖는다"
    lifecycle:
      - { state: 접수, next: [분석 중] }
      - { state: 분석 중, next: [지식 보완 대기, 외부 확인 대기, 조치 완료] }
      - { state: 지식 보완 대기, next: [조치 완료] }
      - { state: 외부 확인 대기, next: [조치 완료] }
      - { state: 조치 완료, next: [종결] }
      - { state: 종결, next: [] }
    permissions:
