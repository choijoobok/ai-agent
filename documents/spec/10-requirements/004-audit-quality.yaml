  - id: REQ-113
    type: functional
    priority: must
    actors: [ACT-002, ACT-006]
    source: "2026-09-15 사용자 결정 (CR-023)"
    process_step: PRC-11-01
    title: "중복 실행의 책임 경계"
    detail: "**한 턴 안**의 중복(인스턴스 회수 후 재개 등)은 **Hub 가 막는다**(실행 점유). **턴 사이**의 중복(서로 다른 세션·턴이 같은 대상에 같은 액션)은 **대상 시스템이 막는다** — Hub 는 막지 않는다"
    why: "**후자를 막지 않는 것은 누락이 아니라 결정이다.** 두 사용자가 각자 다른 채팅에서 겹치는 대상을 처리하는 것은 정당한 병렬 업무이며, 파라미터가 일부 겹친다는 이유로 차단하면 정상 업무가 멈춘다. **무엇이 '같은 작업' 인지는 업무 의미론**이고 그 판단을 Hub 가 복제하는 것은 PRN-09 가 금지하는 방향이다"
    hard_rule: "Hub 가 이 층에서 제공하는 것은 차단이 아니라 **가시성**이다 — 승인 화면에 같은 API 의 최근 실행 이력(실행자·시각·파라미터·결과 — 결과 불명 포함)을 함께 제시해 **사람이 판단**하게 한다. 멱등하지 않은 것으로 등록된 실행 API 는 그 사실과 재시도 정책을 승인 화면에 함께 제시한다"
    roadmap: RM-P1
    acceptance: "같은 턴에서 재개·재시도로 동일 실행이 중복 요청되면 실행 점유가 하나만 통과시키고, 서로 다른 턴의 동일 업무는 Hub가 의미론으로 차단하지 않되 승인 화면에 최근 실행 이력·멱등성·재시도 정책을 표시한다"
    summary: "한 턴 안의 중복 실행(재개·재시도)은 Hub가 실행 점유로 막고, 서로 다른 턴의 같은 업무는 대상 시스템이 막는다. Hub는 대신 승인 화면에 최근 실행 이력과 멱등성을 보여 사람이 판단하게 한다"
    intent:
      problem: "서버가 재시작되거나 재시도가 겹치면 같은 실행이 두 번 나갈 수 있다. 반대로 Hub가 '같은 작업'을 추측해 막으면 정당한 병렬 업무가 멈춘다"
      goal: "Hub가 확실히 아는 범위(한 턴)는 막고, 업무 의미가 필요한 범위는 판단 근거를 보여 준다"
      not:
        - "업무 의미의 중복 판정이 아니다 — 무엇이 같은 작업인지는 대상 시스템의 일이다(PRN-09)"
    goal_trace: [GOAL-2]
    decider: "제품 오너(사용자) — 2026-09-15 CR-023"
    preconditions:
      - "실행 API의 멱등성·재시도 정책이 명세돼 있다(REQ-105)"
    data:
      - { item: "실행 점유(턴·액션·점유 시각)", origin: "agent", sensitivity: "내부", retention: "턴 종결까지" }
    business_rules:
      - "한 턴 안에서 재개·재시도로 같은 실행이 겹치면 실행 점유가 하나만 통과시킨다"
      - "서로 다른 턴의 같은 업무는 Hub가 막지 않는다"
      - "승인 화면에 같은 API의 최근 실행 이력(실행자·시각·파라미터·결과, 결과 불명 포함)을 보인다. 멱등하지 않은 API는 그 사실과 재시도 정책을 함께 보인다"
    exceptions:
      - "공정 단계의 예외는 PRC-11-01이 갖는다"
    lifecycle: "해당 없음 — 실행 점유는 턴 상태의 일부다(03-glossary)"
    permissions: "해당 없음 — 승인 권한은 REQ-105가 갖는다"
    audit: "실행 점유와 중복 거부를 실행 이력에 남긴다"
    volume: "해당 없음"
    config: "해당 없음"
    risk: "해당 없음 — 점유 설계는 ADR-003·turn-execution 설계가 갖는다"
    relations:
      depends_on: [REQ-105]
      constrains: []
      conflicts_with: []
      nfr: []
      interfaces: [IF-002]
    realization:
      features: [FEAT-004, FEAT-105]
      screens: [SCR-004, SCR-101]
    examples:
      - { kind: 정상, case: "출고 API를 호출하던 중 agent 인스턴스가 재시작돼 턴이 재개돼도, 실행 점유가 있어 출고는 한 번만 나간다" }
      - { kind: 예외, case: "두 사용자가 각자 채팅에서 같은 주문의 출고를 요청하면 Hub는 막지 않고, 두 번째 사용자의 승인 화면에 첫 번째 실행 이력을 보인다. 실제 중복 차단은 대상 시스템이 한다" }
    volatility: { level: low, what: "책임 경계 원칙이라 고객사마다 달라지지 않는다" }
    open: []
    maturity: { level: confirmed, at: "2026-09-29", by: "AI 정리", confirmed_by: "사용자 (2026-09-29 요구사항 정의서 검토 뒤 확정)" }
  - id: REQ-114
    type: functional
    priority: should
    priority_reason: "RM-P1의 업무 실행은 등록 REST API만으로 성립하며, 내부 서비스 빈 기반 커스텀 도구는 같은 통제 아래 확장하는 후순위 기능이므로 should로 둔다"
    actors: [ACT-002]
    source: "2026-09-15 사용자 결정 (CR-023) · 2026-09-28 사용자 결정(설정·자격증명 비반환 검수)"
    process_step: PRC-03-01
    title: "커스텀 도구 — PRN-08 의 명시적 예외"
    detail: "설정으로 표현할 수 없는 다중 시스템 데이터 가공은 agent 안의 서비스 빈으로 구현한다. **도구 레지스트리에 등록**되고 **호출 허용 그룹 매핑·실행 유형·명시적 사용자 승인·전량 감사**를 다른 도구와 동일하게 받으며, 미등록·미매핑 상태에서는 호출할 수 없다"
    hard_rule: "커스텀 도구는 코드이므로 SQL 통제 4단계를 거치지 않는다 — **도구별로 입력·출력 계약, 데이터 접근 범위, 민감 데이터 마스킹, 재시도·멱등성, 오류 처리**를 선언하고 구현에서 강제해야 한다. 이 선언과 코드 리뷰·보안 및 고객사 테스트·검수 근거 없이는 노출하지 않는다. **검수 항목에는 '설정 파일·환경 변수·자격증명을 읽거나 출력·오류로 반환하지 않는다'를 반드시 넣는다** — 커스텀 도구는 agent 안의 코드라 설계가 아니라 검수만이 이 경로를 막는다(2026-09-28 사용자 결정). **SQL 이나 등록 API 로 가능한 것을 커스텀 도구로 만들지 않는다** — 통제가 검증된 경로를 우회하는 코드가 늘어나는 것 자체가 위험이다"
    note: "공통 레지스트리·권한 판정·감사·승인 흐름은 재사용하지만, 내부 서비스의 데이터 통제는 자동으로 재사용되지 않는다. 요건 승인·코드 리뷰·배포 통제는 고객사 프로젝트 관리 체계의 책임이다"
    roadmap: RM-P1
    acceptance: "등록·그룹 매핑·실행 유형·승인·감사와 도구별 입출력·데이터 범위·마스킹·재시도·멱등성·오류 처리 선언 및 검수 근거가 모두 없는 커스텀 도구는 호출·노출되지 않는다"
    summary: "설정으로 표현할 수 없는 다중 시스템 가공은 agent 안의 커스텀 도구로 만들되, 다른 도구와 같은 등록·그룹 매핑·승인·감사를 받고, 입출력·데이터 범위·마스킹·재시도·오류 처리 선언과 검수 근거 없이는 노출하지 않는다"
    intent:
      problem: "등록 API와 SQL만으로는 여러 시스템을 가로지르는 가공을 할 수 없는 경우가 있지만, 코드는 SQL 통제 4단계를 거치지 않는다"
      goal: "필요한 예외만 코드로 허용하고, 그 코드가 통제를 우회하지 못하게 선언·검수로 묶는다"
      not:
        - "SQL·등록 API로 되는 일을 코드로 만드는 경로가 아니다"
        - "통제가 자동으로 재사용되는 도구가 아니다 — 내부 서비스의 데이터 통제는 도구가 직접 강제한다"
    goal_trace: [GOAL-2]
    decider: "제품 오너(사용자). 도구별 요건 승인·코드 리뷰·배포 통제는 고객사 프로젝트 관리 체계"
    preconditions:
      - "도구 레지스트리와 그룹 판정·승인·감사 흐름이 있다(REQ-105)"
      - "모델에게 금지된 경로는 서버가 강제한다(REQ-102)"
    data:
      - { item: "도구 선언(입출력 계약·데이터 접근 범위·민감 데이터 마스킹·재시도·멱등성·오류 처리)과 검수 근거", origin: "개발·검수", sensitivity: "내부", retention: "도구 버전별 보존" }
    business_rules:
      - "커스텀 도구는 등록·그룹 매핑·실행 유형·명시적 승인·전량 감사를 다른 도구와 똑같이 받는다"
      - "도구별 선언과 코드 리뷰·보안·고객사 테스트 검수 근거가 없으면 노출하지 않는다"
      - "검수에는 '설정 파일·환경 변수·자격증명을 읽거나 출력·오류로 반환하지 않는다'를 반드시 넣는다"
    exceptions:
