# 영역: 질의 해석과 실행
requirements:
  - id: REQ-004
    type: functional
    priority: must
    category: "오케스트레이션"
    actors: [ACT-001]
    title: "연속 도구 호출"
    detail: "한 턴 처리 중 LLM 은 agent 에게 도구 호출을 **연속적으로** 요청할 수 있다"
  - id: REQ-010
    type: functional
    priority: must
    workstream: agent
    category: "흐름·추적성"
    priority_reason: "비동기 통신과 분산 실행의 정상·예외 경로를 함께 검토해야 상태 유실·중복 실행·무한 대기·감사 및 사용량 누락을 설계에서 발견할 수 있다"
    actors: [ACT-001]
    title: "질의 처리 전체 흐름과 분산 실행·상태 관리 흐름 정의"
    detail: "portal의 비동기 질의 접수·상태/결과 폴링부터 agent의 턴·시도·회차·스텝·LangGraph 상태 관리, 대화/추론 및 임베딩 모델 호출, 지식 검색·SQL·업무 API·도구 실행과 최종 결과 전달까지 연결된 흐름도를 작성한다. 연속 호출·과거 턴 참조·사용자 개입·중단·이어가기·재시도와 멀티 인스턴스의 실행 점유·만료·장애·배포 종료를 포함하고, 각 경로에 권한·감사·추적·쿼터·동시 처리 제한의 검사 및 기록 지점을 표시한다"
    hard_rule: "흐름도는 연결된 요구사항의 동작을 표현하며 새 정책의 근거가 되지 않는다. 확정된 요구사항, 검토 중인 기존 설계, 미확정 연결을 구분한다. 누락·충돌은 해당 정본에서 해결하고, 관련 요구사항 검토와 흐름/상태/메시지 대조가 끝나기 전에 상세 흐름을 확정하거나 구현 완료로 판정하지 않는다"
    source: "2026-10-12 사용자 요청 — portal 폴링·턴/스텝/LangGraph 상태·감사/추적/쿼터·LLM 호출과 실행 점유·중단/재개를 멀티 인스턴스에서 연결한다. 먼저 요구사항의 범위·완료 기준을 보완하고 개요도 초안을 유지하며, 관련 요구사항 검토 후 상세 흐름을 확정하는 순서에 동의했다. 같은 날 사용자가 범위·완료 기준의 기존 합의를 재확인하고, 관련 요구사항 검토·확정 → 흐름도·상세 시퀀스 보완 → 반영 여부·누락·충돌 최종 점검 → REQ-010 최종 확정 순서를 명시 선택했다"
    roadmap: RM-P1
    summary: "사용자 요청 한 건이 비동기·다중 인스턴스 환경에서 어떻게 처리·대기·종결되는지 전체 개요도와 주요 분기별 흐름도로 파악한다. 흐름별 근거 요구사항과 미확정 지점을 연결해 순차 검토와 상세 설계의 입력으로 사용한다"
    intent:
      problem: "통신·상태·점유·감사·쿼터를 따로 설계하면 각 규칙이 맞아도 인계·복구 경로에서 처리가 끊기거나 중복 실행될 수 있다"
      goal: "업무 요청의 시작부터 결과 확인까지 담당 주체·상태·메시지·저장·검증·실패 처리의 연결을 검토할 수 있게 한다"
      not:
        - "전체 처리를 한 장의 거대한 흐름도로 표현하거나 모든 요청에 모델·임베딩 호출을 강제하지 않는다"
        - "초안의 배치 순서가 트랜잭션 경계·물리 테이블·LangGraph 노드 및 체크포인트 구현을 확정하지 않는다"
        - "점유가 장애 후 자동 실행 인계나 업무 API의 정확히 한 번 실행을 보장한다는 뜻이 아니다"
    goal_trace: [GOAL-0, GOAL-1, IN-02, IN-06]
    decider: "제품 오너(사용자)"
    preconditions:
      - "REQ-009의 공통 메시지·작업·프롬프트 계약과 REQ-038의 질의 유형별 처리 경로를 연결 기준으로 사용한다"
      - "기존 ARCH-015의 비동기 폴링, ARCH-070의 실행 점유와 documents/design/turn-execution.md를 검토 입력으로 사용하되 문서 존재 자체를 설계 승인으로 간주하지 않는다"
      - "Spring AI·LangGraph4j의 역할은 ADR-001·003을 따르며 실환경 재현의 미확인 전제 ASM-003은 유지한다"
    flow_coverage:
      - { flow: "전체 처리 개요", includes: "질의 접수·해석·계획, 과거 턴 참조·문맥 구성, 지식 검색·입력값 확보, 반복 모델/도구 호출, SQL·업무 API·결과 가공·표현·종결", requirements: [REQ-001, REQ-002, REQ-003, REQ-004, REQ-009, REQ-012, REQ-015, REQ-020, REQ-021, REQ-022, REQ-023, REQ-025, REQ-026, REQ-037, REQ-038, REQ-039] }
      - { flow: "portal 비동기 조회", includes: "접수 응답·상태/결과 폴링·최종 응답 수신·사용자대기·중단/실패·화면 이탈·재접속, 상태별 폴링 중지/재시작과 일시 조회 실패", requirements: [REQ-006, REQ-011, REQ-016, REQ-019, REQ-027, REQ-040] }
      - { flow: "턴·스텝·그래프 상태", includes: "턴/시도/회차/스텝/호출의 구분, 업무 상태와 LangGraph 상태의 대응, 저장·복원·무효화·정리, 실행용 상태와 감사 이력의 분리", requirements: [REQ-009, REQ-013, REQ-030, REQ-032, REQ-036, REQ-107, REQ-108, REQ-109] }
      - { flow: "멀티 인스턴스 실행", includes: "접수·실행·폴링 인스턴스의 분리, 공용 저장소·사용자별 순서 대기/취소·개인별 동시 한도·실행 점유, 만료 회수·늦은 응답·중복 입력·서버 장애·배포 종료", requirements: [REQ-016, REQ-033, REQ-034, REQ-036, REQ-040, REQ-108, REQ-113] }
      - { flow: "변경·중단·이어가기·재시도", includes: "추가 정보·승인 대기와 거절, 처리 중 변경/별개/중단 입력, 스트리밍 중단, 현재 시도 이어가기와 중단 후 새 시도, 부분 실행·결과 불명", requirements: [REQ-005, REQ-007, REQ-013, REQ-014, REQ-017, REQ-024, REQ-026, REQ-030, REQ-031, REQ-032, REQ-033, REQ-034, REQ-035, REQ-105, REQ-113] }
      - { flow: "감사·추적·사용량 통제", includes: "권한·모델 허용·전송/응답 통제, 쿼터 시작 검사·선택적 재검사, 개인별 동시 실행·스텝 한도, 호출 사용량·계량 실패·늦은 응답과 필수 감사 기록", requirements: [REQ-102, REQ-103, REQ-104, REQ-105, REQ-106, REQ-107, REQ-108, REQ-109, REQ-111, REQ-112, REQ-115, REQ-116, REQ-602, REQ-606, REQ-610, REQ-614] }
      - { flow: "임베딩의 별도 연결", includes: "질의 검색용 임베딩과 관리자의 지식 등록·재임베딩을 구분하고 선택적 사용·공통 호출 계층·사용자/시스템 비용 귀속·장애 시 태그 검색 경로를 연결", requirements: [REQ-303, REQ-305, REQ-306, REQ-602], interfaces: [IF-004], nfr: [NFR-015, NFR-021] }
    diagram_contract:
      - "전체 개요도에서 각 상세 흐름을 찾아갈 수 있어야 하며, 상세도는 진입 조건·담당 주체·입력/출력·후속 상태·예외 및 관련 요구사항 ID를 표시한다"
      - "실행·감사·사용량·결과·체크포인트의 기록 시점과 근거 저장소, 원자적으로 처리할 경계 및 실패 시 후속 조치를 구분한다. 현재 단계에서 미정이면 설계 후속으로 표시한다"
      - "각 호출과 이벤트를 대화·턴·시도·회차·스텝·점유·모델/도구 호출에 연결한다. 실제 식별자 필드와 버전은 REQ-009의 설계에서 정한다"
      - "모델·임베딩·도구 경로에는 호출 전 검사, 호출 중 변경/취소 가능성, 결과·오류·사용량 수신, 늦게 온 응답의 실행 반영 가능 여부와 기록 지점을 표시한다"
      - "개요도는 아래 초안에서 시작한다. 상세 설계는 documents/spec/20-architecture/ 및 documents/design/의 기존 산출물 체계를 사용하고, 시퀀스는 연결된 유즈케이스 설계에서 생성한다. 정책을 그림마다 다시 정의하지 않는다"
    overview_status: "검토용 개요 초안 — 단계 내부의 순서·원자성·실제 폴링 상태표와 그래프 저장/복원 계약은 미확정이다. 화살표는 업무 연결이며 네트워크 호출 및 트랜잭션의 확정 순서가 아니다"
    sequence_design:
      - { document: "documents/design/agent-request-sequences.md", design: DES-002, scope: "접수·개인 한도·개인 순서 대기/취소·시작 전 쿼터·비동기 폴링·최종 상태 조회와 전체 연결" }
      - { document: "documents/design/agent-lifecycle-sequences.md", design: DES-003, scope: "턴/시도/회차/스텝·LangGraph 상태, 사용자대기·다른 인스턴스 이어가기·변경/중단·만료/늦은 결과·새 시도" }
      - { document: "documents/design/agent-call-sequences.md", design: DES-004, scope: "매 모델 호출의 쿼터 재검사·프롬프트/응답 계약·도구 승인/전송·SQL 재작성·질의/지식 임베딩" }
      - { document: "documents/design/agent-history-sequences.md", design: DES-005, scope: "호출 식별·별도 감사 트랜잭션·사용량 원장/집계·기록 실패·중복 계량·늦은 응답·최종 응답 저장/공개" }
