    review_sequence:
      - "1. 본 카드의 범위·완료 기준은 2026-10-12 사용자 합의 사항으로 유지한다. REQ-010 최종 확정은 관련 요구사항 검토와 다이어그램 보완 뒤에 진행한다"
      - "2. 접수·진행 표시·폴링·재접속 → 턴/시도/대기/중단/재시도 → 다중 인스턴스 점유·이벤트·그래프 상태 → 모델/임베딩/도구 → 감사/쿼터 순으로 관련 요구사항을 한 건씩 검토한다. 이미 확정된 항목은 연결 영향만 확인한다"
      - "3. 관련 요구사항을 확정할 때마다 전체 흐름도·상세 시퀀스를 보완하고 요구사항별 반영 위치·부분 반영·별도 흐름·설계 후속을 대조한다. 누락·충돌과 정상·예외 경로를 최종 점검한 뒤 사용자 검토로 REQ-010을 최종 확정한다. P2 상태·책임 경계와 P3 저장·메시지·동시성 계약 및 시험의 상세 설계 승인은 별도로 진행한다"
    data:
      - { item: "흐름별 요구사항·상태·메시지·실행/감사/사용량 연결과 미확정 지점", origin: "기존 spec·ADR와 이후 승인된 설계", sensitivity: "설계 정보 — 예시는 합성 값이며 운영 비밀·원문을 포함하지 않는다", retention: "기존 소스·문서 형상 관리" }
    business_rules:
      - "portal 비동기 폴링은 ARCH-015·REQ-040을 따른다. 처리중·사용자대기·중단·실패·완료·일시적 조회 실패별 표시 및 폴링 중지/재시작 조건을 설계하며, 접수 응답이나 중간 메시지를 최종 결과로 오인하지 않는다"
      - "턴 실행 점유는 모델이 아닌 agent 인스턴스가 보유한다. 사용자대기 시 해제·유효 응답의 재획득, 점유 상실 시 상태 쓰기 차단과 감사 기록의 별도 경계는 ARCH-070을 연결한다"
      - "사용자대기 후 현재 시도 이어가기와 중단 후 처음부터 새 시도로 재시도는 REQ-013·109에 따라 구분한다. 화면 재접속과 단순 폴링은 새 실행 요청이 아니다"
      - "점유 만료·장애가 자동 재실행이나 이미 전송한 업무 액션의 재전송으로 이어지지 않도록 REQ-105·113 및 ARCH-070의 경계를 표시한다"
      - "사용량·감사 기록과 실행 상태 변경의 허용 여부를 분리한다. 늦은 호출 결과를 실행에 반영하지 않는다는 이유로 필요한 사용량·감사를 누락하지 않으며 기록 실패 처리는 NFR-027에 연결한다"
      - "쿼터 검사 시점·선택적 스텝 재검사·개인별 동시 실행·스텝 한도는 NFR-012·013·023을 참조한다. 흐름도를 이유로 선차감·정확한 예산 상한·전체 턴 시간 제한을 추가하지 않는다"
    lifecycle: "문서 성숙도는 개요 초안 → 관련 요구사항 검토 반영 → P2 경계 검증 → P3 상세 설계 및 시험 연결 순서다. 제품의 턴·스텝·그래프 상태는 기존 용어·상태 정본을 연결하며 이 카드에서 새 상태 코드를 정의하지 않는다"
    exceptions:
      - "조회 실패·네트워크 단절과 실제 턴 중단을 구분하며, portal 재접속 시 현재 상태를 조회하고 자동으로 새 실행을 만들지 않는다"
      - "사용자 응답과 대기 만료, 중단과 완료, 점유 회수와 늦은 호출 결과의 경합에 대해 승리 조건·무효 입력·최종 표시·감사 기록을 상세도에 포함한다"
      - "사용자 중단은 REQ-007의 명시 조작/자연어 대상 판정·동기 DB 조회 중 취소 전달·전송 후 실행 취소 불가·타임아웃 결과 불명/재실행 금지·결과 확인/수동 확인을 상세도에 연결한다. 중단 접수와 실제 반영·외부 호출 종료/업무 결과를 구분해 LLM 없이 보고하고 폴링/재접속으로 복원한다"
      - "임베딩 비활성·장애, 모델 거절·시간 초과, 도구 부분 실패·결과 불명, 필수 감사 기록 실패와 쿼터/한도 도달을 정상 성공으로 합치지 않는다"
    permissions: "접수·폴링·결과 열람·사용자 응답·승인·도구 호출·재시도의 인가 시점을 기존 REQ-103·105·108에 연결한다. 식별자 보유나 시작 시점 권한만으로 후속 동작을 허용하지 않는다"
    audit: "실행 이력의 정책 정본은 REQ-107·108·109·115다. 접수·스텝 시작 시 저장, 현재 상태 갱신과 불변 전이 이력·재시도/점유 경계는 REQ-107.history_storage, 결과 원문의 유한 기한·조사 보호와 체크포인트 정리 분리는 REQ-107.retention_policy·109에 연결한다. 흐름도에 감사·기술 추적·사용량 계량의 목적과 기록 시점을 구분하고 관련 식별자를 연결하며, 별도 원문 저장 정책을 만들지 않는다"
    volume: "둘 이상의 agent 인스턴스·동시 턴·반복 호출·폴링을 가정한 경합 사례를 포함한다. 성능·용량 수치는 기존 NFR 및 설계의 측정 대상으로 유지한다"
    config: "폴링·점유·대기 만료·스텝/동시 한도·쿼터 재검사의 적용 설정과 효력 시점은 REQ-614 및 해당 NFR에 연결하며 새 기본값을 정하지 않는다"
    risk: "LangGraph 상태와 업무 상태·실행 점유·감사 기록의 원자성/복구 경계는 실환경 검증 전이다. ASM-003과 관련 P2/P3 후속을 해소하지 않고 그림의 완성을 구현 검증으로 간주하지 않는다"
    acceptance: "범위 목록의 각 항목이 개요 또는 상세 흐름에 연결되고, 관련 요구사항에서 흐름으로 역추적할 수 있어야 한다. 모든 대기·반복·실패·경합에는 다음 처리 또는 종료 조건이 있고, 중간 메시지·조회 실패·지연 응답으로 중복 실행이나 잘못된 종결을 만드는 경로가 없어야 한다. P1에서는 범위·완료 기준과 미확정 연결을 검토하고, 상세도 완성은 관련 요구사항 검토 및 P2/P3 대조 뒤에 판정한다"
    verification:
      - "범위 목록과 관련 요구사항별로 어느 흐름·분기에 표현됐는지 대응표를 대조하고, 설계에서 각 정상/예외 분기를 시험 사례에 연결한다"
      - "한 턴의 접수·폴링은 인스턴스 A, 실행은 B, 사용자 응답은 C에 도착하는 사례를 따라 상태·점유·사용량·최종 표시를 검토한다"
      - "오래된 점유의 결과를 현재 상태에 쓰거나 폴링을 실행 요청으로 해석하도록 규칙을 뒤집었을 때 검토/계약 시험이 실패해야 한다"
    relations:
      depends_on: []
      constrains: []
      conflicts_with: []
      nfr: [NFR-006, NFR-007, NFR-008, NFR-009, NFR-010, NFR-012, NFR-013, NFR-014, NFR-015, NFR-020, NFR-021, NFR-022, NFR-023, NFR-026, NFR-027]
      interfaces: [IF-001, IF-002, IF-003, IF-004]
    realization:
      features: [FEAT-201]
      screens: []
    examples:
      - { kind: "정상", case: "A가 접수한 턴을 B가 처리하고 portal의 폴링은 C로 도착한다. 공용 상태·결과를 통해 동일 턴의 진행과 최종 응답을 표시하고, 폴링이 별도 실행을 만들지 않는다" }
      - { kind: "정상", case: "B가 추가 정보 대기로 점유를 놓은 뒤 C가 유효한 사용자 응답을 받아 점유를 획득한다. 현재 시도의 상태를 이어가며 이전 단계의 완료된 액션을 임의로 다시 실행하지 않는다" }
      - { kind: "예외", case: "B의 점유 만료 후 이전 모델 응답이 도착한다. 중단 상태를 되살리지 않고 필요한 호출 감사·사용량의 기록 경계를 확인한다. 사용자 재시도는 기존 상태 복원이 아닌 새 시도다" }
      - { kind: "예외", case: "portal의 일시적 폴링 실패 동안 턴은 완료된다. 재접속 조회로 현재 결과를 확인하며 질의나 업무 API를 다시 전송하지 않는다" }
      - { kind: "예외", case: "질의 임베딩이 실패하면 NFR-021의 태그 검색 경로를 따르고, 관리자 지식 재임베딩 비용을 해당 질의 사용자의 사용량으로 섞지 않는다" }
      - { kind: "예외", case: "업무 API 전송 후 응답을 받기 전에 실행 인스턴스가 종료된다. 결과 불명을 성공·미실행으로 단정하거나 자동 재전송하지 않고 기존 확인·재요청 경계를 따른다" }
    volatility: { level: medium, what: "관련 요구사항 정련과 실환경 검증에 따른 상세 분기·상태/메시지/저장 계약 및 운영 설정 적용 지점" }
    open:
      - "@defer P1 OQ-031 — 범위·완료 기준은 사용자와 합의했다. 관련 요구사항을 먼저 검토·확정하고 흐름도·상세 시퀀스를 보완한 뒤 반영 여부·누락·충돌을 점검하여 REQ-010을 최종 확정한다. 범위의 재승인을 선행 조건으로 요구하지 않는다"
      - "@defer P2 관련 요구사항 검토 후 전체 개요와 각 주체의 상태·책임·분산 점유·데이터 저장 경계를 대조한다. ARCH-015의 폴링 규칙을 사용자대기·일시 조회 실패·재접속까지 상태별로 구체화한다"
      - "@defer P3 LangGraph 상태와 턴/시도/회차/스텝의 대응, 체크포인트 저장/복원/무효화·원자성, 영속 이벤트 순서와 대기 만료·중단/완료·점유 만료의 경합을 상세 설계하고 계약 시험으로 연결한다"
      - "@defer P3 모델/임베딩/도구별 취소 가능성·늦은 응답·필수 감사 실패·사용량 계량 실패의 처리 순서와 식별자·저장 계약을 대조한다. 폴링 간격·재시도·중지/재시작의 상세 계약도 함께 검증한다"
    maturity: { level: elaborated, at: "2026-10-12", by: "AI — 범위·완료 기준 사용자 합의 반영, 관련 요구사항·다이어그램 보완 후 최종 확정 대기", confirmed_by: null }
  - id: REQ-015
    type: functional
    priority: must
    category: "질의 해석·처리 경로"
    actors: [ACT-001]
    title: "질의 해석문"
    detail: "LLM 은 사용자 질의를 **명료하게 재정리한 해석문**을 만들고, 이를 지식 검색·SQL 생성·실행 API 탐색의 입력으로 사용한다. 결과에는 이 해석문을 함께 제시해 사용자가 자신의 의도와 대조할 수 있게 한다"
  - id: REQ-022
    type: functional
    priority: must
    category: "계획·교정"
    actors: [ACT-001]
    title: "조회 계획을 업무 용어로 제시하고 자연어로 교정받는다"
    detail: "조회에 대해서는 질의 해석문·대상 데이터 영역의 업무 명칭·적용 조건·기간·집계 단위를, **액션이 포함된 턴에서는 실행할 액션과 순서를 함께** 제시한다. **기본 필터가 해제된 경우 그 사실을 함께 표시한다**"
    hard_rule: "**테이블·컬럼의 물리명과 SQL 원문은 노출하지 않는다.** 사용자는 계획을 보고 **자연어로 교정**하며, 물리명이나 SQL 을 직접 편집하게 하지 않는다"
    traces_to: [REQ-015, REQ-104]
  - id: REQ-023
    type: functional
    priority: must
    category: "계획·교정"
    actors: [ACT-001]
    title: "조회 계획 확인을 모든 턴에 강제하지 않는다"
    detail: "강제 조건은 정책으로 관리하고, 기본값은 ① 대상 데이터 영역이 복수이거나 선별 확신이 낮을 때 ② 예상 결과 규모가 임계치를 넘을 때 ③ 액션이 포함된 턴"
    hard_rule: "**③에서 계획 확인과 실행 승인을 하나로 합치지 않는다** — 전자는 '무엇을 하려는지 맞나' 를, 후자는 '되돌릴 수 없는 것을 실행해도 되나' 를 묻는다"
    why: "매 조회마다 확인을 요구하면 대화가 느려지고 사용자가 확인을 습관적으로 넘긴다"
  - id: REQ-025
    type: functional
    priority: must
    category: "확신·처리 불가"
    actors: [ACT-001]
    title: "확신이 없으면 추측하지 않는다"
    detail: "대상 데이터 영역을 특정할 수 없거나, 조건 해석이 갈리거나, 카탈로그·지식·예제 쿼리로 근거를 세울 수 없으면 임의로 골라 실행하지 않고 사용자에게 확인을 요구하거나 처리 불가로 응답한다. 처리 불가 응답에는 **무엇이 부족했는지**를 함께 제시한다"
    hard_rule: "**자율 처리 비율보다 처리한 것의 정확도를 우선한다**"
    traces_to: [SUC-02, SUC-03]
  - id: REQ-026
    type: functional
    priority: must
    category: "액션 승인·실행"
    actors: [ACT-001]
    title: "연속 실행 — 여러 액션이 한 요청에 걸릴 때"
    detail: "실행할 액션과 순서는 **사용자 요청에서 얻고 Hub 가 추론해 정하지 않는다.** 등록된 실행 액션은 모두 REQ-005의 모든 파라미터 값 확보·검증과 사용자 전체 값 확인 후 최종 승인 절차를 거친다. 예정된 액션 전체를 제시해 일괄 승인받되, 파라미터가 앞 액션의 결과에 의존하는 액션은 그 결과와 모든 값을 확보한 뒤 개별 승인한다"
    hard_rule: "승인은 **승인 당시의 액션 식별자·순서·파라미터 값**에만 유효하며, 셋 중 하나라도 달라지거나 일괄 승인 유효 시간이 지나면 다시 승인받는다. **실패하면 그 지점에서 중단하고 보고**하며, 남은 액션의 처리 여부를 근거 없이 판단하지 않는다. 부분 실행 후의 재요청은 이미 실행된 것을 제시하고 사용자가 정한다"
    config: "`sys-config.agent.approval.wait-timeout-minutes`는 **최초 승인 요청을 제시한 시각부터** 사용자의 응답을 기다리는 시간이며 양의 정수 분, 기본 10분이다. 추가 질문·거절 뒤 후보 확인·재승인 카드 제시는 이 시각을 연장하거나 새로 시작하지 않는다. `sys-config.agent.approval.execution-ttl-minutes`는 사용자가 승인한 뒤 대상 시스템 호출을 시작할 수 있는 시간이며 양의 정수 분, 기본 5분이다. 두 값은 시스템 설정 DB 오버라이드로 배포 없이 변경하며, 저장 직후 **다음 승인 요청** 또는 **다음 사용자 승인**부터 적용한다. 이미 발급한 승인 요청·이미 받은 승인의 만료 시각은 바꾸지 않고, 적용 설정값·버전을 승인 이력에 남긴다"
    roadmap: RM-P1
    traces_to: [REQ-005, REQ-025, REQ-105]
