consistency_review:
  reviewed_at: 2026-09-17
  scope: "integration·system G1과 admin P1 — 기존 계약 요구, REQ-101~119·201~207·301~307·REQ-501~510"
  unresolved: []
  pairs:
    - ids: [REQ-009, REQ-027]
      tension: "엄격한 요청·응답 계약과 새 표현 형식의 확장이 충돌할 수 있다"
      resolution: "호환되는 선택 필드·표현 블록은 같은 계약 주 버전에서 추가하고 portal은 모르는 블록만 무시한다. 모르는 계약 주 버전은 전체 실패로 드러낸다"
    - ids: [REQ-103, REQ-108]
      tension: "현재 권한 반영과 한 턴 안에서의 정책 일관성이 충돌할 수 있다"
      resolution: "새 턴의 시작에는 현재 정책을 적용하고, 시작된 턴은 그 시점의 정책으로 끝까지 처리한다. 세션은 일관성 경계가 아니다"
    - ids: [REQ-106, REQ-107]
      tension: "외부 전송 최소화와 전송 내용 전량 감사가 충돌할 수 있다"
      resolution: "허용·마스킹을 먼저 적용한 실제 전송분만 외부로 보내고, 감사 이력도 그 실제 전송분을 기록한다. 차단된 원문을 감사 목적으로 새로 복제하지 않는다"
    - ids: [REQ-105, REQ-113]
      tension: "Hub의 실행 통제와 대상 시스템의 중복 실행 책임이 겹칠 수 있다"
      resolution: "한 턴 안의 중복은 Hub의 점유와 실행 통제가 막고, 서로 다른 턴 사이의 업무 중복은 대상 시스템이 막는다"
    - ids: [REQ-502, REQ-503]
      tension: "권한을 편집하는 모델과 실제 화면·API 접근 판정이 서로 다른 원천을 볼 수 있다"
      resolution: "역할과 개인 예외는 유효 권한 하나로 합성하고 메뉴 렌더링·로그인 이동·서비스 API가 모두 그 결과를 사용한다"
    - ids: [REQ-505, REQ-506]
      tension: "메시지 값과 시스템 설정을 함께 바꾸면 다중 인스턴스의 반영 시점이 같아야 한다고 오해하기 쉽다"
      resolution: "메시지는 노드별 번들 캐시를 두므로 공유 버전과 고객사별 TTL 안의 재조회가 필요하다. 설정은 노드 캐시가 없어 다음 작업 스코프가 DB 오버라이드를 다시 합성한다. 두 저장 모두 값과 버전 변경을 부분 성공으로 남기지 않는다"
    - ids: [REQ-107, REQ-109]
      tension: "전량 감사와 조회 결과 원문의 차등 보관이 충돌할 수 있다"
      resolution: "처리 사실·판정·결과 메타데이터와 지문은 전량 보존하고, 조회 결과 원문만 정책에 따라 차등 보관한다"
    - ids: [REQ-105, REQ-111]
      tension: "업무 API 실행 등록과 API 응답 경로의 전송·마스킹 통제가 서로 다른 admin 화면에서 중복 정의될 수 있다"
      resolution: "API 응답 경로별 전송 허용·마스킹·미지정 경로 경고의 단일 등록 원천은 FEAT-004(SCR-004)다. FEAT-019(SCR-017)은 테이블·컬럼 전송 허용과 결과 보존 정책만 관리하며 API 경로 통제 결과를 참조한다"
    - ids: [REQ-116, REQ-117, REQ-118, REQ-119]
      tension: "다음 달 기본 배정·등급 승급과 이번 달 긴급 추가 사용을 한 흐름으로 처리하면 이미 유효한 한도를 소급 변경하거나 예외 승인의 근거를 잃을 수 있다"
      resolution: "PRC-12에서 쿼터 등급을 적용 월 단위로 잠가 당월·지난 달을 바꾸지 않고, 다음 달 배정과 승급은 확정 마감 기준으로 다음 달 또는 그다음 달부터만 적용한다. 월중 신규 사용자는 기존 사용자를 재계산하지 않는 일할 자동 배정으로 처리하고, 이번 달 부족은 별도 추가 토큰 신청·승인으로 즉시 반영한다. 승인 이력·예외 승인 근거·월말 만료를 구분해 남긴다"
    - ids: [REQ-107, REQ-507]
      tension: "감사·이력 화면 자체가 개인정보 열람 경로인데 그 열람을 기록하지 않으면 누가 무엇을 봤는지 사후에 추적할 수 없다"
      resolution: "감사·이력의 목록·상세 열람은 system 공통 사용 이력으로 남기며, REQ-107은 열람자·시각·이력 유형·검색 또는 상세 조회 여부를 감사 사실로 보존한다"
