nfrs:
# ── 대량 조회 방어 ──────────────────────────────────────────
  - id: NFR-001
    category: 성능
    title: "조회 강제 상한"
    requirement: "최대 행 수 · 실행 시간 초과 · 결과 크기 제한을 강제 적용한다. 실행 전 비용·행 수를 예측해 임계치를 넘으면 조건 보완을 요구하거나 승인 절차를 거친다"
    measurement: "상한 초과로 거부된 조회 건수 / 전체 조회 건수 · 조회 실행 시간 분포(p50·p95·p99)"
    test_case: null
    target: null
    note: "**상한·타임아웃은 결과를 제한할 뿐 풀스캔·카테시안 조인이 만드는 도달 전 부하는 막지 못한다.** 운영 DB 부하가 우려되는 고객사에는 **별도 DW 경유를 권장**하고, 보완으로 **실행 전 실행 계획(EXPLAIN) 검토를 옵션으로 검토**한다 — 비용 추정치의 해석이 DBMS 별로 다르므로 임계 기준을 데이터소스 단위 설정으로 둔다"
  - id: NFR-002
    category: 성능
    title: "표시 상한까지 한 번에 전달 — 서버사이드 페이징 없음"
    requirement: "**조회는 한 번만 실행하고 결과는 표시 상한까지 전량 전달한다.** 상한 안에서의 페이지 이동·정렬·필터는 그리드 컴포넌트가 클라이언트에서 처리한다. 전체 건수는 **상한 + 1행을 요청**해 판정하고, 초과가 확인되면 상한까지만 표시하며 총 건수를 '상한 이상' 으로 표기한다"
    why: "**페이징을 두지 않는 이유는 성능이 아니다.** 페이지마다 저장된 SQL 을 다시 실행하는 구조는 ① 종결된 턴이 업무 DB 를 계속 읽는 경로를 만들고 ② LLM 이 생성한 SQL 에는 정렬 유일성이 보장되지 않아 페이지 간 행 중복·누락이 발생하며 ③ 페이지 수만큼 상한을 우회한다. **전체 건수를 얻기 위한 별도 카운트 조회도 두지 않는다** — 상한이 걸리지 않는 쿼리를 방어 목적으로 추가하는 셈이 된다"
    measurement: "상한 초과 조회의 비율 · 결과 전달 페이로드 크기 분포"
    test_case: null
    target: null
    implementation: "**상한 강제는 SQL 을 고쳐 쓰지 않고 JDBC 수준**(최대 행 수·fetch size·쿼리 타임아웃)에서 적용한다 — 검증된 SQL 을 다시 변형하는 경로를 만들지 않으며 DBMS 중립을 유지한다"
  - id: NFR-003
    category: 성능
    title: "상한 초과 조회는 업무 시스템으로 안내한다"
    requirement: "상한을 초과하는 조회는 조건 보완을 요구하고 업무 시스템 이용을 안내한다"
    why: "상한을 넘는 조회는 당장의 업무 수행보다 분석·통계·원천 데이터 수집 목적인 경우가 많고, 그것은 원래 업무 시스템의 일이다"
    measurement: "상한 초과 후 조건 보완으로 완료된 비율"
    test_case: null
    target: null
  - id: NFR-004
    category: 성능
    title: "읽기 전용 계정과 별도 리소스 한도"
    requirement: "조회는 읽기 전용 계정과 별도 리소스 한도로 수행해 업무 시스템 영향을 억제한다"
    measurement: "업무 DB 의 Hub 세션 CPU·IO 점유율 (고객사 모니터링 도구가 수집)"
    test_case: null
    target: null
  - id: NFR-005
    category: 성능
    title: "저장된 조회의 유량 제한"
    requirement: "**사용자당 저장 개수 상한** · **대시보드당 위젯 수 상한** · **자동 실행의 동시 실행 수 제한과 결과 캐시 TTL** · **같은 위젯의 연속 실행 최소 간격(쿨다운)**. 조회 상한은 채팅 조회와 동일하며 **완화하지 않는다**"
    why: "저장된 조회는 토큰을 소모하지 않아 **쿼터가 유량 제한 역할을 하지 못한다.** 채팅 조회에서는 토큰 한도가 자연스러운 브레이크였지만, 조회 버튼은 부담 없이 반복 클릭된다"
    measurement: "사용자·기간 단위의 조회 실행 횟수와 누적 반환 행 수 (임계 초과 시 관리자에게 알린다)"
    test_case: null
    target: null
    note: "**하드 상한은 실측 후 정한다** — 처음부터 걸면 정상 사용을 막는다"
    phase: P2

# ── 토큰·비용 관리 ──────────────────────────────────────────
  - id: NFR-010
    category: 비용
    title: "단가·사용량 집계 — 키는 공급 경로이고 계량 단위는 열려 있다"
    requirement: "사용 가능한 **공급 경로·모델** 조합과 **조합별 계량 단위 단가**를 관리한다(TRM-087·TRM-088). **같은 모델이라도 경로가 다르면 단가가 다르므로 경로가 키에 있어야 한다.** 사용량은 실제 계량 수량을 근거로 사용자·기간별로 집계하며 계량 단위를 구분한다"
    effort_rule: "**effort 는 단가의 키가 아니다**(TRM-091) — 추론 레벨은 토큰 소모량과 응답 시간을 바꾸지만 단가는 바꾸지 않는다. **다만 단가 행에 한정자 자리를 남긴다**: 비우면 그 모델의 모든 effort 에 적용되고, 나중에 effort 별로 값이 갈리면 **행을 더해** 대응한다(정확 일치 우선 · 없으면 전체 행 · 어느 쪽도 없으면 비용 미상). 미리 조합을 다 만들면 운영자가 같은 값을 셋 입력한다. **사용량 기록에는 effort 를 반드시 남긴다** — 단가와 무관하게 소비량 분석과 역할별 라우팅 조정의 근거다(ARCH-040)"
    detail: "**계량 단위는 공통코드 그룹으로 열어 둔다** — 입력·출력·캐시 읽기·캐시 쓰기(유지 시간별로 갈릴 수 있다)·요청 건수 등이며, 공급 경로가 새 항목을 도입하면 **코드 없이 행 추가로 대응한다.** 반면 **과금 모드(TRM-089)는 산식이므로 열지 않는다** — 지금 지원하는 것은 토큰당 하나이고, 시간당·배치는 자리만 두고 범위 밖이다(ADR-004 §5)"
    hard_rule: "**단가는 판(TRM-090) 단위로 불변이며 일 단위로 발효한다** — 발효한 판은 고치지 않고 새 판을 더하며 **과거 일자로는 발효할 수 없다.** NFR-011 이 예산 계획에 세운 것과 같은 규칙이고 이유도 같다: 소급 변경이 없어야 이미 집행된 쿼터 판정과 정산이 흔들리지 않는다"
    unknown_unit_rule: "**모르는 계량 단위를 0 으로 세지 않는다.** 단가표에 없는 항목이 응답에 오면 그 호출을 **비용 미상**으로 표시하고 관리자에게 알린다 — 조용한 과소 집계는 한 달 뒤 청구서에서야 드러난다. **다만 토큰은 아는 값이므로 쿼터에서 차감한다**(NFR-012) — 비용만 미상으로 둔다. 0 으로 차감하면 쿼터가 뚫리고, 막으면 새 모델을 못 쓴다"
    measurement: "질의당 평균 계량 수량(단위별) · 질의당 평균 비용 · 캐시 적중률 · **비용 미상 호출 건수**"
    test_case: null
    target: null
    traces_to: [ARCH-040]
  - id: NFR-011
    category: 비용
    title: "전사 예산 계획에서 개인 상한을 유도한다"
    requirement: "예산 계획은 **기간(시작일~종료일) 단위**로 전사 총 상한을 정하고, 그 안에서 **쿼터 등급별 배분율(합계 100%)** 을 설정한다. 등급별 배분액을 그 등급의 사용자 수로 나눠 **사용자별 상한을 자동 계산**하며, 사용자 변동(입사·퇴사·비활성화·등급 변경)이 발생하면 재계산한다"
    why: "개인 쿼터를 각각 설정하는 방식은 **합계가 조직 예산을 초과해도 막을 장치가 없다**"
    hard_rule: "**계획 변경은 일 단위로 발효한다** — 진행 중인 계획은 종료일만 수정할 수 있고(과거 일자로는 불가), 변경분은 다음날 시작하는 신규 계획으로 추가한다. **소급 변경이 없어야 이미 집행된 판정과 정산이 흔들리지 않는다**"
    measurement: "등급별 쿼터 초과율 · 전사 예산 소진율 · 기간 종료 시 실사용/계획 비율"
    test_case: null
    target: null
  - id: NFR-012
    category: 비용
    title: "쿼터 집행 시점과 그 한계"
    requirement: "쿼터 검사는 **각 스텝의 LLM 호출 직전에 커밋된 사용량 기록**을 근거로 수행한다. 이력을 즉시 커밋하는 구조이므로 **동시 요청이 한도를 소폭 초과할 수 있으며 이는 사후 정산으로 처리한다**"
    detail: "이 방식에서는 한 턴을 처리하는 중간에 한도가 소진되어 **토큰은 소모했으나 응답은 받지 못하는** 상태가 될 수 있다. 이를 줄이기 위해 **턴 시작 시점에 최소 여유분을 확인**하고, 여유가 없으면 턴을 시작하지 않고 사용자에게 알린다. 처리 중 소진된 경우 해당 턴은 실패로 종결하며 소모된 사용량은 그대로 기록한다"
    measurement: "한도 초과 발생 건수와 초과량 · 처리 중 소진으로 실패한 턴 수"
    test_case: null
    target: null
    note: "선차감을 엄격히 강제해야 하는 등급이 있다면 원자적 카운터를 별도로 둔다"
  - id: NFR-013
    category: 비용
    title: "턴 단위 상한 — 회차와 무관하게 누적 집행"
    requirement: "한 턴의 **최대 스텝 수 · 최대 누적 토큰 · 최대 소요 시간**을 제한한다"
    hard_rule: "**회차와 무관하게 턴 전체 누적으로 집행한다** — 되돌리면 스텝 순번은 처음부터 다시 시작되지만 상한까지 초기화되면 교정을 반복하는 것만으로 상한이 무한히 늘어난다"
    implementation: "**이 상한은 오케스트레이션 프레임워크의 자체 제한 기능이 아니라 우리 코드에서 집행한다** — 프레임워크의 제한값은 대개 그래프 컴파일 시점에 고정되어 PRN-06(배포 없는 런타임 변경)을 만족하지 못하고, 초과 시의 처리도 우리 턴 상태 모델과 다르다"
    measurement: "턴당 스텝 수·누적 토큰·소요 시간 분포 · 상한 도달로 강제 종료된 턴 수"
    test_case: null
    target: null
    note: "**턴 단위 상한의 잔여를 컨텍스트에 명시한다** — 남은 스텝 수와 토큰 여유를 LLM 에 알려 스스로 조회 범위를 좁히거나 조기 종결하도록 유도한다. 이는 안내이며 강제의 대체가 아니다"
  - id: NFR-014
    category: 비용
    title: "되돌림 상한 (회차 상한)"
    requirement: "한 턴에서 되돌려 다시 수행할 수 있는 횟수를 제한한다. 교정이 반복되면 버려지는 회차마다 토큰이 새로 발생하므로 턴 단위 상한과 함께 집행한다"
    measurement: "턴당 회차 수 분포 · 회차 상한 도달 건수"
    test_case: null
    target: null
    note: "**값은 미확정이다**"
  - id: NFR-015
    category: 비용
    title: "임베딩 비용의 귀속"
    requirement: "지식 본문 임베딩(admin)은 개인 쿼터가 아닌 **시스템 비용**으로 집계한다. 질의 키워드 임베딩(agent)은 해당 사용자 사용량에 포함한다. **평가셋 실행 비용도 시스템 비용**으로 집계한다"
    measurement: "시스템 비용 / 전체 비용 비율 · 재임베딩 1회당 비용"
    test_case: null
    target: null
  - id: NFR-016
    category: 비용
    title: "정산"
    requirement: "주간·월간·연간 비용 정산이 가능해야 한다"
    detail: "**대조 방법을 먼저 세운다** — 경로마다 청구서 형식이 다르므로 무엇과 무엇을 어떤 단위로 맞출지(기간 · 계정 · 태그)를 경로별로 정한다. 게이트웨이를 경유하면 약정 할인·통화·세금이 사이에 끼어 **차이가 구조적으로 생긴다**(ADR-004)"
    measurement: "정산 리포트 생성 가능성 · 집계 값과 **경로 청구액**의 차이 · 비용 미상으로 남은 금액"
    test_case: null
    target: null
  - id: NFR-017
    category: 비용
    title: "쿼터가 닿지 않는 경로를 전제한다"
    requirement: "**저장된 조회는 LLM 을 호출하지 않으므로 토큰을 소모하지 않고 쿼터로 억제되지 않는다.** 이 경로의 유량 제한은 NFR-005 가 담당하며, **쿼터를 유일한 부하 통제 수단으로 전제하지 않는다**"
    measurement: "저장된 조회 실행 건수 / 채팅 조회 건수 비율"
    test_case: null
    target: null

# ── 안정성 ──────────────────────────────────────────────────
  - id: NFR-020
