# 용어사전 — 유비쿼터스 언어
#
# 작성 단계: P1
# status: migrated — 사용자 승인 전이다.
#
# **이 사전이 모든 문서·DB 테이블·API 필드 명명의 기준이다.** 동의어를 섞어 쓰지 않는다.
# `key` 는 영문 키이며, DB 컬럼 값과 코드 상수는 이 키를 대문자 스네이크로 쓴다.
#
# 절이 셋이고 **성격이 다르다** — 섞으면 남의 어휘가 우리 명명의 근거가 된다:
#   terms:            우리 용어. `key` 를 갖고 **명명의 기준이다**
#   framework_terms:  남의 어휘(LangGraph4j · Spring AI). `key` 가 **없다** — 읽기 위해 싣는다
#   confusions:       **실제로 어긋난 짝.** 정의를 나란히 두는 것으로 막히지 않는 것만 더한다

meta:
  status: migrated
  baselined: null

# ── 대화 구조 ────────────────────────────────────────────────
terms:
  - id: TRM-001
    term: 세션
    key: session
    group: 대화
    definition: "하나의 채팅 창. 맥락 유지와 컨텍스트 관리의 단위. 제목을 가지며, 사용자는 논리 삭제로 자신의 목록에서 숨길 수 있다"
  - id: TRM-002
    term: 턴
    key: turn
    group: 대화
    definition: "**사용자 질의 1건과 그에 대한 최종 응답까지의 처리 단위.** 한 세션은 여러 턴을 가진다"
  - id: TRM-003
    term: 스텝
    key: step
    group: 대화
    definition: "**턴을 처리하는 동안 발생하는 agent ↔ LLM 1회 요청·응답 왕복.** 한 턴은 여러 스텝을 가진다"
  - id: TRM-004
    term: 회차
    key: revision
    group: 대화
    definition: "**한 턴 안에서 되돌려 다시 수행한 시도의 구분.** 되돌리면 스텝 순번이 처음부터 다시 시작되므로, 스텝을 특정하려면 회차가 함께 필요하다 — 스텝의 식별자는 `턴 + 회차 + 순번` 이다"
  - id: TRM-005
    term: 스텝 역할
    key: stepRole
    group: 대화
    definition: "스텝이 LLM 에게 요구하는 작업의 성격. **주 추론**(계획 수립·SQL 생성·최종 응답 작성·실패 원인 분석)과 **보조 판정**(업무 연관성 판정·업무 도메인·데이터소스 선별·컬럼 프루닝·질의 키워드 추출·과거 턴 요약·처리 중 입력의 의도 분류)으로 구분한다"
    note: "**모델 선택의 단위다**"
  - id: TRM-006
    term: 도구 호출
    key: toolCall
    group: 대화
    definition: "스텝의 결과로 LLM 이 agent 에게 요청하는 단위 작업 (SQL 조회·API 실행·지식 검색·과거 이력 참조·사용자 확인 요청 등)"
  - id: TRM-007
    term: 도구
    key: tool
    group: 대화
    definition: "agent 가 LLM 에게 노출하는, 호출 가능한 기능의 명세"
  - id: TRM-008
    term: 사용자 개입
    key: interaction
    group: 대화
    definition: "턴 처리 중 사용자에게 추가 정보나 승인을 요청하고 응답을 받는 것"
  - id: TRM-009
    term: 컨텍스트
    key: context
    group: 대화
    definition: "특정 턴을 처리하기 위해 LLM 에 전달되는 정보 집합 (시스템 프롬프트·개인 기본 지시·지식·과거 턴 요약·스키마 정보 등)"
  - id: TRM-010
    term: 품질 신고
    key: qualityReport
    group: 대화
    definition: "사용자가 특정 턴의 응답 품질에 이의를 제기하는 건. 상태를 가지며 관리자의 처리로 종결된다"
  - id: TRM-011
    term: 실행 점유
    key: executionLease
    group: 대화
    definition: "한 턴을 특정 agent 인스턴스가 처리 중임을 나타내는 **시한부 소유권**. 만료 시각을 가지며 갱신되지 않으면 회수된다"
  - id: TRM-012
    term: 점유 토큰
    key: fenceToken
    group: 대화
    definition: "실행 점유가 바뀔 때마다 증가하는 값. 점유를 잃은 인스턴스의 뒤늦은 쓰기를 무효화하는 데 쓴다"

# ── 실행과 자동화 ────────────────────────────────────────────
  - id: TRM-020
    term: 워크플로우
    key: workflow
    group: 실행
    definition: "기본 기능(도구)을 조합해 사용자가 정의한 자동 처리 절차"
  - id: TRM-021
    term: 잡
    key: job
    group: 실행
    definition: "워크플로우의 실행 인스턴스. 주기 실행·조건 실행·수동 실행으로 생성된다"
  - id: TRM-022
    term: 액션
    key: action
    group: 실행
    definition: "데이터를 변경하거나 외부에 영향을 주는 실행 (조회와 구분)"
  - id: TRM-023
    term: 승인 필요 액션
    key: approvalRequiredAction
    group: 실행
    definition: "실행 전 사용자 승인이 강제되는 액션"
  - id: TRM-024
    term: 커스텀 도구
    key: customTool
    group: 실행
    definition: "설정으로 표현할 수 없는 다중 시스템 데이터 가공을 위해 agent 안에 서비스 빈으로 구현하는 도구. 도구 레지스트리에 등록되어 다른 도구와 같은 통제를 받는다"
    note: "PRN-08 의 명시적 예외다"
  - id: TRM-025
    term: 질의 즐겨찾기
    key: savedPrompt
    group: 실행
    definition: "사용자가 저장한 **자연어 질의문**. 실행하면 새 턴으로 처리된다 — LLM 을 거치므로 토큰을 소모하고 결과가 매번 달라질 수 있다"
  - id: TRM-026
    term: 저장된 조회
    key: savedQuery
    group: 실행
    definition: "사용자가 저장한 **확정 SQL 과 파라미터 명세, 해석문의 묶음**. 실행은 턴을 만들지 않고 직접 수행되며 LLM 을 호출하지 않는다. 인증 예제 쿼리의 개인 대응물이다"
  - id: TRM-027
    term: 대시보드
    key: dashboard
    group: 실행
    definition: "저장된 조회를 배치한 개인 화면. 구성 단위는 **위젯**(저장된 조회 + 표현 형식)이다"

# ── 정책과 권한 ──────────────────────────────────────────────
  - id: TRM-040
    term: 대상 시스템
    key: targetSystem
    group: 정책
    definition: "연동되는 레거시 업무 시스템 단위. 복수를 전제한다. API(기능)의 귀속처이며, **데이터소스와는 관계를 갖지 않는다**"
  - id: TRM-041
    term: 데이터소스
    key: dataSource
    group: 정책
    definition: "조회 대상 DB 또는 DW 연결 단위. 접속 정보는 yml 설정이 원천이고, admin 에 등록된 데이터소스 레코드(표시용 별칭·DBMS 종류·파서)가 그 ID 를 연결한다. **대상 시스템과 관계를 갖지 않는다**"
  - id: TRM-042
    term: 업무 도메인
    key: businessDomain
    group: 정책
    definition: "카탈로그·지식·인증 예제 쿼리를 업무 단위로 묶은 집합. 질의 처리의 첫 단계에서 이 묶음을 먼저 선별해 컨텍스트 주입 범위를 좁힌다"
  - id: TRM-043
    term: 인증 예제 쿼리
    key: certifiedQuery
    group: 정책
    definition: "관리자가 검수해 등록한, 업무 질의와 그에 대응하는 SQL·파라미터 명세의 쌍. 컨텍스트에 예시로 주입되거나 파라미터만 채워 그대로 실행된다"
  - id: TRM-044
    term: 조회 계획
    key: queryPlan
    group: 정책
    definition: "조회·실행 전에 사용자에게 **업무 용어로** 제시하는 처리 예정 내역 — 질의 해석문, 대상 데이터 영역의 업무 명칭, 적용 조건·기간·집계 단위. **액션이 포함된 턴에서는 실행할 액션과 순서도 포함한다**"
    note: "DBMS 실행 계획(EXPLAIN)과는 다른 개념이다. **이 용어를 유지할지는 미확정** — 액션 목록까지 담게 되어 이름과 범위가 어긋난다"
  - id: TRM-045
    term: 사용자 그룹
    key: userGroup
    group: 정책
    definition: "접근 통제의 기본 단위. 시스템 전체를 아우르는 **전역** 개념으로, 직무·역할 단위로 정의한다(예: 급여담당·평가관리자). 사용자는 여러 그룹에 속할 수 있고, 접근 범위는 소속 그룹들이 여는 범위의 **합집합**이다"
  - id: TRM-046
    term: 쿼터 등급
    key: quotaGrade
    group: 정책
    definition: "토큰·비용 한도 등급. **사용자 단위로 하나만** 부여하며 그룹과 무관하다"
  - id: TRM-047
    term: 마스킹
    key: masking
    group: 정책
    definition: "접근을 허용하되 값을 가려서 보여주는 것. **컬럼 또는 API 응답 경로** ↔ 그룹 매핑의 **모드**(허용/마스킹)로 지정하며, 값 변환 규칙은 두 경로가 같은 것을 쓴다"
  - id: TRM-048
    term: 기본 필터
    key: defaultFilter
    group: 정책
    definition: "테이블을 조회할 때 기본으로 강제 주입되는 조건. 논리 삭제 플래그·유효 상태처럼 **빠뜨리면 폐기 데이터까지 집계되는** 조건을 다룬다. 테이블당 0..1개이며 명시적 지시가 있을 때만 해제된다"
    note: "**권한 통제가 아니다** — 정확도를 위한 장치다. 행 스코프와 한 항목으로 합치지 않는다: 하나는 볼 수 있는 범위이고 하나는 세어야 할 범위다"
  - id: TRM-049
    term: 신원 매핑
    key: identityMapping
    group: 정책
    definition: "Hub 사용자가 각 대상 시스템·데이터소스에서 갖는 사용자 식별자의 매핑. API 호출의 신원 파라미터와 행 스코프 조인의 바인딩 값으로 쓰인다"
    note: "**신원 매핑은 곧 사칭 능력이다.** 매핑 변경은 정책 변경 이력에 남긴다"
  - id: TRM-050
    term: 프롬프트 규칙
    key: promptRule
    group: 정책
    definition: "관리자가 등록·수정하는 시스템 차원의 지시"
  - id: TRM-051
    term: 개인 기본 지시
    key: personalDirective
    group: 정책
    definition: "사용자가 등록하는 개인화 지시. 프롬프트 규칙에 종속되며 이를 무력화할 수 없다"
  - id: TRM-052
    term: 지식
    key: knowledge
    group: 정책
    definition: "업무 용어·규칙·설명 등 검색되어 컨텍스트에 주입되는 자료"
    note: "**물리 테이블·컬럼명과 SQL 을 담지 않는다** — 특정 테이블에 관한 것이면 참조 테이블 링크로 표현한다"
  - id: TRM-053
    term: 쿼터
    key: quota
    group: 정책
    definition: "사용자·기간 단위 토큰/비용 한도"
  - id: TRM-054
    term: 행 스코프
    key: rowScope
    group: 정책
    definition: "행 단위 접근 제한(담당 조직·거래처·창고 등). 대상 데이터소스 안의 사용자 권한 정보 테이블과의 조인 또는 서브쿼리로 구현하며, 테이블당 0..1개 규칙을 둔다"

# ── 실행 기반 어휘 (구현 수준) ───────────────────────────────
# **업무 용어가 아니라 구현 어휘다.** 그래도 우리가 정한 것이므로 `key` 를 갖고 명명의
# 기준이 된다 — 정본은 documents/design/turn-execution.md 이고 여기는 그 색인이다.
  - id: TRM-060
    term: 획득
    key: acquire
    group: 실행기반
    definition: "진입 가능한 상태의 턴을 잡고 **점유 토큰을 +1** 한다"
  - id: TRM-061
    term: 갱신
    key: renew
    group: 실행기반
    definition: "처리 중에 점유 만료 시각을 미룬다. **중단 요청과 처리 중 입력도 이 왕복에서 함께 읽는다**"
  - id: TRM-062
    term: 해제
    key: release
    group: 실행기반
    definition: "처리를 끝내고 점유를 놓으면서 다음 상태로 전이시킨다"
  - id: TRM-063
    term: 회수
    key: sweep
    group: 실행기반
    definition: "만료된 점유를 찾아 중단 상태로 돌리는 배치. 그 배치를 **스위퍼**라 부른다"
  - id: TRM-064
    term: 점유 상실 신호
    key: leaseLost
    group: 실행기반
    definition: "점유를 잃었다는 신호(`LeaseLostException`). 받으면 **아무 상태도 쓰지 않고 포기한다** — 실패로 기록하는 것조차 하지 않는다"
  - id: TRM-065
    term: 점유 유지 시간
    key: leaseDuration
    group: 실행기반
    definition: "기호 **L**. 갱신 없이 이 시간을 넘기면 만료된다"
    note: "값은 미확정이다 — 실측이 필요하다"
  - id: TRM-066
    term: 갱신 주기
    key: renewInterval
    group: 실행기반
    definition: "기호 **R**. `L / 3` 이하로 둔다"
  - id: TRM-067
    term: 회수 주기
    key: sweepInterval
    group: 실행기반
    definition: "기호 **S**. 스위퍼가 도는 주기"
    note: "**인스턴스가 죽고 회수되기까지 최악 `L + S` 가 걸린다** — 사용자에게 보이는 복구 시간의 상한은 L 이 아니라 이 합이다"
  - id: TRM-068
    term: 창 A
    key: windowA
    group: 실행기반
    definition: "중복 실행이 열리는 구간 하나 — **프로세스가 정지했다가 회수된 뒤 되살아날 때**"
    note: "현실성이 낮다 — 최소 L 동안 얼어 있어야 한다"
  - id: TRM-069
    term: 창 B
    key: windowB
    group: 실행기반
    definition: "중복 실행이 열리는 구간 둘 — **도구 실행이 L 보다 길어져 정상 처리 중인 인스턴스가 회수될 때**"
    note: "**장애 없이도 열린다.** 그래서 L 은 실행 API 의 타임아웃·재시도까지 포함해 산정한다 — exactly-once 를 약속하지 않는 근거가 이 창이다"
  - id: TRM-070
    term: 액션 실행 표시
    key: actionExecuted
    group: 실행기반
    definition: "**이 턴에서 액션이 나갔을 수 있다**는 표시. **성공 여부가 아니다.** 호출 디스패치 직전에 쓴다"
    note: "응답을 기다렸다가 쓰면 회수와 재개 사이에 값이 거짓으로 남아 재개가 같은 액션을 다시 낸다"
  - id: TRM-071
    term: 조건부 쓰기
    key: conditionalWrite
    group: 실행기반
    definition: "`WHERE` 절에 점유 조건을 걸어 **0행이면 점유 상실로 판정하는** 쓰기 방식"
  - id: TRM-072
    term: 체크포인트 upsert
    key: checkpointUpsert
    group: 실행기반
    definition: "갱신할 행이 없으면 삽입으로 흘러내리는 것. **시간여행이 저장소에 없는 id 로 갱신을 걸기 때문에 필요하다**"

# ── 처리 중 입력의 어휘 ──────────────────────────────────────
  - id: TRM-080
    term: 해석문
    key: interpretation
    group: 처리중입력
    definition: "LLM 이 사용자 질의를 명료하게 재정리한 문장(REQ-015). **지식 검색·SQL 생성·의도 분류의 입력**이며 조회 계획의 일부로 사용자에게 제시된다"
  - id: TRM-081
    term: 처리 중 입력의 네 갈래
    key: inflightIntent
    group: 처리중입력
    definition: "처리 중 들어온 입력의 분류 넷 — **보강**(`BOOST`) · **교정**(`CORRECT`) · **별개**(`NEW`) · **중단**(`STOP`)"
    note: "보수적 우선순위는 `CORRECT > STOP > NEW > BOOST` 다. 그 순위가 실제로 안전한지는 실모델로만 확인된다"
  - id: TRM-082
    term: 분류 불능
    key: UNSURE
    group: 처리중입력
    definition: "분류가 서지 않을 때. **차단형 확인으로 넘긴다** — 추측해서 갈래를 고르지 않는다(REQ-025)"
  - id: TRM-083
    term: 병행형 확인
    key: inlineConfirm
    group: 처리중입력
    definition: "턴을 **멈추지 않고** 분류 결과를 기본값으로 보여주며 되돌릴 창을 주는 것. **기본값이다**"
  - id: TRM-084
    term: 차단형 확인
    key: blockingConfirm
    group: 처리중입력
    definition: "`의도 확인 대기`(WT-03)로 전이해 **사용자 선택 없이는 진행하지 않는** 것. **되돌릴 수 없는 것이 걸렸을 때만** 쓴다"
    note: "확인 때문에 멈추는 것 자체가 비용이다"
  - id: TRM-085
    term: 일괄 승인
    key: batchApproval
    group: 처리중입력
    definition: "연속 실행에서 예정된 액션 전체를 한 번에 승인받는 것(REQ-026)"
    note: "**파라미터가 앞 액션의 결과에 의존하는 액션은 개별 승인한다** — 일괄에 넣으면 승인 시점에 무엇을 승인하는지 알 수 없다"
# ── 개념 계층 ────────────────────────────────────────────────
hierarchy: "세션 → 턴 → { 스텝 → 도구 호출 } · 사용자 개입"

# ── 턴 상태 모델 ────────────────────────────────────────────
# 한 턴은 수 초에서 수 분 이상 걸리며, 사용자 이탈·중단·서버 장애를 견디고 재개될 수
# 있어야 한다. 따라서 턴은 **상태를 가진 지속 작업**으로 다룬다. 상태는 여섯으로 한정한다.
turn_states:
  - id: TS-01
    state: 접수
    key: RECEIVED
    meaning: "질의를 받아 기록했고 아직 처리를 시작하지 않았다"
    next: [RUNNING, FAILED]
  - id: TS-02
    state: 처리중
    key: RUNNING
    meaning: "스텝을 진행하고 있다"
    next: [WAITING_USER, DONE, ABORTED, FAILED]
  - id: TS-03
    state: 사용자대기
    key: WAITING_USER
    meaning: "사용자 응답 없이는 진행할 수 없다"
    next: [RUNNING, ABORTED, FAILED]
  - id: TS-04
    state: 중단
    key: ABORTED
    meaning: "처리가 멈췄고 **재개 가능**하다 — 수동 중단·서버 재시작·실행 점유 만료·대기 만료처럼 다시 시도할 여지가 있는 멈춤"
    next: [RUNNING]
  - id: TS-05
    state: 실패
    key: FAILED
    meaning: "처리가 불가능한 것으로 확정됐다 — 쿼터 소진·권한 부족·복구 불가 오류처럼 재시도해도 결과가 같은 종결"
    next: []
  - id: TS-06
    state: 완료
    key: DONE
    meaning: "최종 응답을 사용자에게 전달했다"
    next: []

wait_types:
  - id: WT-01
    type: 승인 대기
    key: APPROVAL
    waits_for: "승인 필요 액션의 실행 전 승인"
    resume: "승인이면 실행, **그 외 모든 입력은 비승인**"
  - id: WT-02
    type: 추가 정보 대기
    key: ADDITIONAL_INFO
    waits_for: "질의 처리에 필요한 정보 요구"
    resume: "받은 정보를 입력으로 처리를 이어간다"
  - id: WT-03
    type: 의도 확인 대기
    key: INTENT_CONFIRM
    waits_for: "**처리 중 들어온 새 입력의 의도 확인**"
    resume: "**네 갈래로 분기한다** — 진행 중 턴에 반영 / 되돌려 재수행 / 별도 턴 / 중단"
    note: "**되돌릴 수 없는 것이 걸린 턴에서만 쓴다.** 그 외에는 턴을 처리중으로 둔 채 확인을 병행하며 사용자대기로 전이하지 않는다 — 확인 때문에 멈추는 것 자체가 비용이다"

state_rules:
  - "**중단과 실패를 구분한다.** 재시도 대상은 중단 상태에 한한다"
  - "**사용자대기에는 만료 시각을 둔다.** 만료되면 중단으로 전이하고 대기 중이던 액션은 실행하지 않는다. 만료 시간은 **대기 유형별로** 관리한다 — 승인은 사람의 판단을 기다리므로 길고, 의도 확인은 직전 입력에 대한 반응이므로 짧다"
  - "**이미 액션을 실행한 턴은 재개 대상에서 제외한다.** 실행된 업무 API 는 되돌릴 수 없으므로 재개 시 같은 액션이 다시 실행될 위험이 있다. 부분 실행 상태를 사용자에게 알리고 새 턴으로 처리한다"
  - "**그 새 턴에서 무엇을 다시 할지는 agent 가 정하지 않는다.** 이미 실행된 액션과 결과를 제시하고 **사용자가 어디부터 다시 할지 선택**한다 — '같은 요청인가' 와 '이미 처리했는가' 를 추론으로 판정하면 오판이 곧 중복 실행이 된다"
  - "**스텝은 별도의 상태 모델을 두지 않는다.** 이력으로만 남으며, 재개 지점은 **현재 회차에서** 마지막으로 완료된 스텝을 근거로 판단한다"

# ── 되돌림과 회차 ───────────────────────────────────────────
revision_rules:
  - path: "처리 중 입력의 교정"
    increments: true
    why: "되돌려 다시 한다. 지나온 스텝이 버려진다"
  - path: "중단된 턴의 재시도"
    increments: false
    why: "중단 지점에서 **이어간다.** 버려지는 스텝이 없다"
  - path: "승인·추가 정보 응답 후 재개"
    increments: false
    why: "이어간다"
  - path: "비승인 입력 후 계속"
    increments: false
    why: "같은 턴을 계속 처리한다"
  - path: "성공한 턴의 결과 교정 재요청"
    increments: null
    why: "해당 없음 — 종결된 턴은 되돌리지 않고 **새 턴으로 처리한다**"

revision_notes:
  - "**버려진 회차의 기록도 남긴다**(PRN-07). 버려졌다는 것과 기록하지 않는다는 것은 다르며, 그 회차에서 이미 발생한 토큰과 이미 실행된 도구가 거기 있다. 이력은 append-only 이므로 지난 회차의 행을 수정해 표시하지 않는다"
  - "**감사 이력에는 기록 당시의 회차를 함께 남긴다.** 점유 토큰과 **두 값은 직교한다** — 점유 토큰은 '어느 인스턴스가 처리했나', 회차는 '무엇을 하려던 시도인가' 에 답한다"
  - "**되돌림에는 상한을 둔다.** 교정이 반복되면 이력과 비용이 함께 늘어난다. 상한 값은 미확정이다"

# ── 프레임워크 용어 ─────────────────────────────────────────
# **`terms:` 와 갈라 둔 이유가 있다 — 이것은 우리 명명의 기준이 아니다.** 그래서 `key` 가
# 없다. 남의 어휘이며, 구현이나 documents/design/turn-execution.md 를 읽을 때 필요해서
# 싣는다. 오케스트레이션이 LangGraph4j 로 확정된 전제 위에 있고(ASM-003) 그 전제가
# 바뀌면 이 절은 통째로 갈린다 — 그때 `terms:` 는 흔들리지 않는다. **그것이 가른 값이다.**
framework_terms:
# 그래프 실행 (LangGraph4j)
  - id: TRM-100
    term: StateGraph
    origin: LangGraph4j
    group: 그래프
    definition: "노드와 엣지로 짠 실행 그래프의 **정의**"
    relation: "우리 스텝 루프의 뼈대"
  - id: TRM-101
    term: CompiledGraph
    origin: LangGraph4j
    group: 그래프
    definition: "정의를 컴파일해 실제로 돌릴 수 있게 만든 것"
  - id: TRM-102
    term: 노드 (Node)
    origin: LangGraph4j
    group: 그래프
    definition: "그래프의 작업 단위. 임의의 자바 코드다"
    relation: "**스텝(TRM-003)과 1:1 이 아니다** — confusions 의 첫 항목을 본다"
  - id: TRM-103
    term: 엣지 (Edge)
    origin: LangGraph4j
    group: 그래프
    definition: "노드에서 노드로 가는 화살표. 조건부 분기가 가능하다"
    relation: "우리 흐름의 제어"
  - id: TRM-104
    term: 상태 (AgentState)
    origin: LangGraph4j
    group: 그래프
    definition: "노드 사이를 흐르는 값 뭉치. 체크포인트에 통째로 저장된다"
    relation: "대화 메시지·진행 위치가 여기 담긴다"
  - id: TRM-105
    term: 채널 (Channel) · Reducer
    origin: LangGraph4j
    group: 그래프
    definition: "상태의 각 키를 **어떻게 병합할지** 정하는 규칙 (덮어쓰기 / 이어붙이기)"
    relation: "메시지는 이어붙이기, 나머지는 덮어쓰기"
  - id: TRM-106
    term: GraphInput.args · resume
    origin: LangGraph4j
    group: 그래프
    definition: "새로 시작 / 멈춘 지점에서 재개"
    relation: "우리 `start()` · `resume()`·`retry()` 에 대응한다"
# 멈춤과 재개
  - id: TRM-110
    term: 인터럽트 (interrupt)
    origin: LangGraph4j
    group: 멈춤
    definition: "노드에 들어가기 **직전에** *여기서 멈출까* 를 판정하는 것"
    relation: "**상태의 순수 함수다.** 재개하면 다시 평가되므로 *이미 물었다* 는 사실이 상태에 없으면 무한 반복된다 — PoC 에서 실제로 무한 루프에 빠졌다"
  - id: TRM-111
    term: InterruptableAction
    origin: LangGraph4j
    group: 멈춤
    definition: "노드가 인터럽트 판정을 갖도록 만드는 인터페이스"
    relation: "승인 게이트·중단·의도 분기가 전부 여기 붙는다"
  - id: TRM-112
    term: InterruptionMetadata
    origin: LangGraph4j
    group: 멈춤
    definition: "멈춘 이유를 담아 올려보내는 것 (`APPROVAL_REQUIRED` · `INTENT_CORRECT` 등)"
  - id: TRM-113
    term: 체크포인트 (Checkpoint)
    origin: LangGraph4j
    group: 멈춤
    definition: "어느 시점의 상태 전체를 저장한 것. **재개의 유일한 근거**"
    relation: "우리 `ai_agent_checkpoint` 테이블에 쓴다 — **감사 이력과 다른 것이다**(confusions)"
  - id: TRM-114
    term: CheckpointSaver
    origin: LangGraph4j
    group: 멈춤
    definition: "체크포인트를 읽고 쓰는 저장소 인터페이스"
    relation: "**우리 테이블을 이 구현체로 만들었다** — 그래서 상태 원천이 하나다"
  - id: TRM-115
    term: StateSnapshot
    origin: LangGraph4j
    group: 멈춤
    definition: "체크포인트 하나를 상태·노드·설정으로 감싼 조회 결과"
    relation: "되돌림 지점을 고를 때 쓴다"
  - id: TRM-116
    term: 시간여행 (time travel)
    origin: LangGraph4j
    group: 멈춤
    definition: "과거 체크포인트로 되돌아가 거기서 다시 실행하는 것"
    relation: "**회차(TRM-004)를 올리는 경로다.** 갱신이 저장소에 없는 id 로 오므로 upsert 가 필요하다(TRM-072)"
# 실행 문맥과 훅
  - id: TRM-120
    term: RunnableConfig
    origin: LangGraph4j
    group: 문맥
    definition: "한 번의 실행에 딸려 다니는 설정 보따리"
  - id: TRM-121
    term: threadId
    origin: LangGraph4j
    group: 문맥
    definition: "그 실행을 식별하는 값"
    relation: "**우리는 여기에 턴 ID 를 싣는다**"
  - id: TRM-122
    term: checkPointId
    origin: LangGraph4j
    group: 문맥
    definition: "어느 체크포인트에서 시작할지. 되돌림에서 쓴다"
  - id: TRM-123
    term: metadata
    origin: LangGraph4j
    group: 문맥
    definition: "임의의 값을 실어 노드·훅·저장소 어디서나 꺼내 쓰는 자리"
    relation: "**점유 토큰(TRM-012)과 회차(TRM-004)를 여기로 나른다**"
  - id: TRM-124
    term: BeforeCall 훅
    origin: LangGraph4j
    group: 문맥
    definition: "노드 본문 **전에** 도는 것. 인터럽트 판정보다도 앞이다"
    relation: "**점유 갱신·중단 확인·의도 분류를 여기 둔다** — 앞에서 읽은 값을 뒤의 `interrupt()` 가 쓴다"
  - id: TRM-125
    term: WrapCall 훅
    origin: LangGraph4j
    group: 문맥
    definition: "노드 본문을 **감싸는** 것. 성공·실패·소요시간을 다 잡는다"
    relation: "스텝 이력을 여기서 남긴다. **다만 인터럽트로 멈춘 노드는 이 훅을 타지 않는다**"
  - id: TRM-126
    term: AfterCall 훅
    origin: LangGraph4j
    group: 문맥
    definition: "노드 본문 **뒤에** 도는 것"
# 모델 계층 (Spring AI)
  - id: TRM-130
    term: ChatModel
    origin: Spring AI
    group: 모델
    definition: "공급사를 감춘 대화 모델 인터페이스"
    relation: "**FEAT-304(외부 모델 호출 공통 컴포넌트)의 내부 구현으로만 쓴다.** 도메인 코드는 우리 인터페이스만 본다 — 노출하면 공급사 교체 가능성을 얻는 대신 **프레임워크가 교체 불가능한 종속**이 된다(PRN-05)"
  - id: TRM-131
    term: Prompt · Message
    origin: Spring AI
    group: 모델
    definition: "모델에 보내는 입력"
    relation: "ChatModel 과 같은 경계 — FEAT-304 안에만 둔다"
  - id: TRM-132
    term: Usage
    origin: Spring AI
    group: 모델
    definition: "입력·출력 토큰 수"
    relation: "정산의 근거다. **정본은 API Provider 다**(CON-034) — 개발 기간 CLI 의 값은 정산에 쓰지 않는다"

# 훅과 인터럽트의 실행 순서 — **우리 설계가 이 순서에 의존한다.**
hook_order: "BeforeCall 훅 → interrupt() 판정 → WrapCall 체인 → 노드 본문 → AfterCall 훅"
hook_order_notes:
  - "**점유 갱신·중단 확인·의도 분류를 `BeforeCall` 에 둔 이유가 이것이다** — 앞에서 읽은 값을 뒤의 `interrupt()` 가 쓴다"
  - "**인터럽트로 멈춘 노드는 `WrapCall` 을 타지 않는다.** 그래서 승인 대기·중단의 이력은 훅이 아니라 오케스트레이터가 남긴다"
  - "**프레임워크 버전이 올라가 이 순서가 바뀌면 우리 설계가 깨진다** — 올릴 때 documents/design/turn-execution.md 를 함께 확인한다"

# ── 헷갈리는 짝 ─────────────────────────────────────────────
# **이 절이 사전의 본론이다.** 정의를 나란히 두는 것으로는 혼동이 막히지 않는다 —
# 실제로 어긋난 지점을 *무엇과 무엇이 다른가* 로 적어야 막힌다(CLAUDE.md §5-13 과 같은 뿌리).
#
# **미리 채우지 않는다.** 설계 논의·코드 리뷰·재현 실험에서 **실제로 혼동이 일어난 것만**
# 더한다. 짝은 별도 ID 를 갖지 않고 `pair` 의 두 ID 로 식별한다 — 짝은 산출물이 아니라
# 두 용어 사이의 관계이고, 새 접두를 만들면 `trace-check` 가 검사하지 않는 ID 가 늘어난다.
confusions:
  - pair: [TRM-102, TRM-003]
    title: "노드 ≠ 스텝"
    severity: "가장 자주 어긋난다"
    left: "**노드** — LangGraph4j 가 정한 그래프의 작업 하나. 쓰임은 **실행 편의**"
    right: "**스텝** — 우리가 정한 agent ↔ LLM 1회 왕복. 쓰임은 **감사·과금**"
    evidence: "PoC 에서 훅을 전 노드에 걸었더니 스텝 이력이 5행이 아니라 **9행**으로 나왔다 — `reason` 노드와 `tool` 노드가 각각 행을 만들었다"
    rule: "**노드 분할은 구현 사정이고 스텝은 과금 단위다.** 둘이 우연히 일치할 때만 훅을 전역으로 건다"

  - pair: [TRM-012, TRM-004]
    title: "점유 토큰 ≠ 회차"
    left: "**점유 토큰** — 어느 **인스턴스**가 처리했나. 인프라 층. 점유가 바뀔 때 오른다"
    right: "**회차** — 무엇을 하려던 **시도**인가. 업무 흐름 층. 되돌려 다시 할 때 오른다"
    evidence: "**직교한다.** 한 회차가 여러 점유에 걸칠 수 있고(인스턴스가 죽어 회수·재개), 한 점유 안에서 회차가 오를 수도 있다(교정) — 후자가 실측으로 확인됐다: fence 는 1 로 고정인데 회차만 0→1"
    rule: "둘 다 이력에 함께 남긴다. 하나로 합치지 않는다"

  - pair: [TS-04, TS-05]
    title: "중단 ≠ 실패"
    left: "**중단** — **다시 해볼 여지가 있는** 멈춤. 서버 재시작 · 점유 만료 · 대기 만료 · 사용자 중단. **재시도 가능**"
    right: "**실패** — 다시 해도 같은 종결. 쿼터 소진 · 권한 부족 · 복구 불가 오류. 재시도 불가"
    rule: "**액션 실패를 보고할 때 이 구분을 담는다** — 사용자의 다음 행동이 갈린다"

  - pair: [REQ-013, REQ-024]
    title: "재시도 ≠ 교정 ≠ 결과 교정 재요청"
    severity: "셋 다 *다시 한다* 인데 전부 다르다"
    left: "**재시도**(REQ-013) — 턴이 **중단**됐을 때. 멈춘 지점에서 **이어간다.** 회차 안 올린다"
    middle: "**교정**(REQ-030~035 의 네 갈래 중 `CORRECT`) — 턴이 **처리 중**일 때. **되돌려서** 다시 한다. 회차 **올린다**"
    right: "**결과 교정 재요청**(REQ-024) — 턴이 **완료**됐을 때. **새 턴**을 만든다. 회차 해당 없음"

  - pair: [TRM-044, NFR-001]
    title: "조회 계획 ≠ DBMS 실행 계획(EXPLAIN)"
    left: "**조회 계획** — 실행 전에 사용자에게 **업무 용어로** 보여주는 예정 내역. 물리명과 SQL 은 보여주지 않는다"
    right: "**DBMS 실행 계획(EXPLAIN)** — DB 가 쿼리를 어떻게 처리할지에 대한 내부 계획. 대량 조회 방어의 사전 판정(NFR-001)에 쓴다"
    rule: "이름이 비슷하지만 **대상도 독자도 다르다**"
    note: "조회 계획은 액션이 포함된 턴에서 실행할 액션과 순서도 담게 되어(REQ-026) **이름과 범위가 어긋난 상태다.** 용어를 바꿀지는 미확정이다"

  - pair: [TRM-025, TRM-026]
    title: "질의 즐겨찾기 ≠ 저장된 조회"
    left: "**질의 즐겨찾기** — **자연어 문장**을 저장한다. 실행하면 새 턴이 생기고 LLM 을 거친다. 결과가 매번 달라질 수 있고 **토큰을 소모한다**"
    right: "**저장된 조회** — **확정 SQL + 파라미터 명세**를 저장한다. 턴이 생기지 않고 LLM 도 거치지 않는다. **결정적이고 토큰을 쓰지 않는다**"

  - pair: [TRM-113, REQ-107]
    title: "체크포인트 ≠ 감사 이력"
    severity: "같은 DB 에 있고 같은 턴을 다루지만 목적이 다르다"
    left: "**체크포인트** — **어디서부터 다시 시작하나.** 턴 종결 시 정리되고 이전 회차는 교정 시 정리된다. **갱신된다**"
    right: "**감사 이력** — **무슨 일이 있었나.** 보관 기간 정책을 따른다. **append-only** 이며 지난 행을 수정하지 않는다"
    rule: "원천은 하나이고 표가 둘인 것은 **분업이다** — 어느 한쪽을 다른 쪽으로 대신할 수 없다"

  - pair: [TRM-110, TS-04]
    title: "인터럽트 ≠ 중단(상태)"
    left: "**인터럽트** — LangGraph4j 가 노드 진입 직전에 멈추는 것. **재개 가능한 멈춤**을 뜻하며 **승인 대기도 인터럽트다**"
    right: "**중단** — 턴 상태 여섯 중 하나(TS-04)"
    rule: "승인 대기로 멈춘 것은 인터럽트지만 **중단 상태가 아니다.** 그리고 **점유를 잃었을 때는 인터럽트가 아니라 예외여야 한다** — 점유를 잃은 인스턴스는 그 턴에 아무 권한이 없어 *재개 가능한 멈춤* 이 성립하지 않는다"

  - pair: [TRM-040, TRM-041]
    title: "대상 시스템 ≠ 데이터소스"
    left: "**대상 시스템** — 레거시 시스템 하나. **API(실행·조회 기능)가 여기 귀속된다**"
    right: "**데이터소스** — 조회할 DB/DW 연결 하나. **테이블·컬럼이 여기 귀속된다**"
    rule: "**둘은 서로 관계를 갖지 않는다**(ARCH-030) — *이 대상 시스템의 DB 는 저 데이터소스* 라는 연결을 두지 않는다. 조회 경로와 실행 경로가 독립한 두 축이고 권한 매핑도 각각 따로 걸린다"

  - pair: [TRM-045, TRM-046]
    title: "사용자 그룹 ≠ 쿼터 등급"
    left: "**사용자 그룹** — 무엇에 **접근**할 수 있나. **여러 개** 가질 수 있고 범위는 합집합이다"
    right: "**쿼터 등급** — 얼마나 **쓸** 수 있나. **사용자당 하나**이며 그룹과 무관하다"
