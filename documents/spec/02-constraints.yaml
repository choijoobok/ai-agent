# 제약사항 · 전제 · 설계 원칙
#
# 작성 단계: P0
# status: migrated — 사용자 승인 전이다.

meta:
  status: migrated
  baselined: null

# ── 설계 원칙 ────────────────────────────────────────────────
# 설계 원칙 ID 는 `PRN-` 이다 — `P0`~`P6` 은 개발 단계의 것이다(CLAUDE.md).
# **이후 모든 판단의 기준이다.** 상세 설계에서 선택지가 갈릴 때 이 원칙에 부합하는 쪽을 택한다.
principles:
  - id: PRN-01
    title: "외부 모델 호출 추상화와 단일 경로"
    detail: "외부 모델 호출은 **공통 컴포넌트를 통해서만** 한다. 모듈 코드는 공급 경로의 SDK 나 엔드포인트를 직접 참조하지 않는다. 호출 내용·토큰·비용 기록, 프롬프트 규칙 주입, 전송 데이터 정책 적용이 모두 이 컴포넌트 한 곳에서 일어난다"
    who: "대화·추론 LLM 은 **agent 만** · 임베딩은 **admin 과 agent**"
    traces_to: [FEAT-304]
  - id: PRN-02
    title: "판단은 LLM, 실행은 agent"
    detail: "LLM 은 SQL·계획·응답 문장을 생성할 수 있으나 실행하지 않는다. DB 조회, API 호출, 파일 생성, 메일 발송은 agent 가 자신의 권한 검사를 거쳐 수행한다"
  - id: PRN-03
    title: "자율성 최대 보장, 크리티컬 경로만 서버 강제"
    detail: "LLM 의 판단 재량은 넓게 둔다. 단 권한 우회·개인정보 취득·비가역 실행처럼 사고 시 치명적인 영역은 LLM 판단에 맡기지 않고 서버가 규칙으로 직접 처리한다"
  - id: PRN-04
    title: "DBMS 지원 경계 분리"
    detail: "독립 백오피스 템플릿은 주요 DBMS 지원을 유지한다. 통합 Agentic AI Hub에서는 system·admin·portal·agent가 하나의 PostgreSQL 스키마를 공유하며, 업무 DB·DW는 고객사 환경에 따라 달라지므로 연결 경계에서는 특정 DBMS 문법·기능에 종속되지 않는다"
  - id: PRN-05
    title: "LLM 공급 경로·모델 교체 가능"
    detail: "**공급 경로·모델·effort 는 설정으로 교체된다**(TRM-087). 같은 모델을 제작사 직접 API 로도 게이트웨이로도 살 수 있으므로 **경로와 모델은 따로 고른다.** 특정 경로의 SDK 개념이 도메인 코드로 새지 않도록 추상화 계층을 둔다(ADR-004)"
  - id: PRN-06
    title: "정책은 런타임 관리"
    detail: "프롬프트 규칙, 지식, 사용자 그룹과 각종 그룹 매핑, 마스킹, 쿼터 등급은 **배포 없이** admin 에서 즉시 변경·적용된다"
    exception: "커스텀 도구 하나 — 코드이므로 배포가 필요하다"
  - id: PRN-07
    title: "전량 감사, 결과 원문은 차등"
    detail: "프롬프트, 생성된 SQL, 실행 API 와 파라미터, 응답, 토큰 사용량, 조회 결과의 메타데이터와 LLM 에 전송된 데이터는 모두 기록한다. 다만 **조회 결과 원문의 보존은 차등 정책**으로 다룬다 — 레거시의 평문 개인정보를 AI 전용 DB 에 무기한 복제하는 것을 기본값으로 두지 않기 위함이다"
    hard_rule: "**기록 실패는 처리 실패로 취급한다**"
    traces_to: [REQ-107]
  - id: PRN-08
    title: "도메인 중립"
    detail: "업무 지식(스키마·API·용어·담당 업무·할 일 정의)은 코드에 넣지 않고 admin 에 등록되는 설정·메타데이터로만 표현한다. 어떤 업무 도메인에도 적용 가능한 구조를 지향한다"
    exception: "**커스텀 도구 하나** — 설정으로 표현할 수 없는 다중 시스템 데이터 가공 로직을 agent 안의 서비스 빈으로 구현하는 고객사별 커스터마이징 영역이다"
  - id: PRN-09
    title: "레거시 무침습"
    detail: "연동 대상 업무 시스템의 코드·스키마 변경을 요구하지 않는다. 읽기는 DB/DW, 실행은 기존 공개 API 를 사용한다. 단 업무 API 는 HTTP 표준 REST 여야 한다"
    note: "어댑터 구성은 고객사 범위이며, 어댑터가 확보되지 않은 기능은 연동 대상에서 제외한다"
  - id: PRN-10
    title: "정확도는 메타데이터에서 나온다"
    detail: "자연어 질의의 정확도를 좌우하는 것은 프롬프트 기교가 아니라 업무 메타데이터의 품질이다 — 테이블·컬럼의 업무 명칭·설명, 공통코드 값 체계, 인증 예제 쿼리, 지식 태그·동의어. 따라서 이 자산들은 부가 정보가 아니라 **제품의 핵심 산출물**로 다루며, 등록·검수·개선 경로를 기능으로 갖춘다"
    traces_to: [REQ-301, ECO-03]

# ── 기술 제약 ───────────────────────────────────────────────
technical:
  - id: CON-001
    area: "AI 전용 DB"
    constraint: "통합 Agentic AI Hub의 system·admin·portal·agent는 하나의 PostgreSQL 스키마를 공유한다. 설정·이력·지식·**임베딩 벡터**를 모두 이 스키마의 테이블로 관리하며, 벡터 검색은 **pgvector 확장**을 쓴다. 독립 백오피스 템플릿의 제품 DB와 고객사 업무 DB·DW 연결은 이 제약의 대상이 아니다"
    why: "**별도 벡터 DB 를 두지 않는다.** 요지는 둘이다 — ① 임베딩을 끄는 구성이 정식이므로(ARCH-060) 별도 저장소는 *끈 고객사도 설치·운영하는* 잉여 구성요소가 된다 ② 저장소를 나눌 때 드는 동기화·이중 쓰기·백업 정합은 **규모와 무관하게 첫날부터** 든다. 벡터 저장소의 대안 비교는 ADR-005, 템플릿 독립 지원·통합 Hub·DW DBMS 경계는 ADR-008이 갖는다"
    review_signal: "**셋 중 둘 이상이 함께 관측되면 재검토한다**(ADR-005 §6) — ① 벡터 인덱스가 일반 조회의 p95 를 밀어낸다 ② HNSW 인덱스가 메모리에 들어가지 않는다 ③ 필터 선택도가 높은 질의가 주 경로가 된다. **하나만으로 반응하지 않는다** — 튜닝으로 회복되는 일이 많아 고칠 수 있는 것을 갈아치우게 된다"
    traces_to: [ADR-005, ADR-008]
  - id: CON-002
    area: "업무 DB / DW"
    constraint: "DBMS 중립. 고객사 업무 DB·DW는 특정 DBMS로 제한하지 않으며, 접속 정보는 **yml 에만** 두고 admin은 매핑만 관리한다"
    traces_to: [PRN-04, ADR-008]
  - id: CON-003
    area: "업무 시스템 연동"
    constraint: "**HTTP/HTTPS 표준 RESTful API 로 한정**. 본문은 JSON 기본. SOAP·gRPC·메시지 큐·소켓·DB 프로시저 직접 호출·파일 인터페이스는 지원하지 않는다"
    traces_to: [NGOAL-08]
  - id: CON-004
    area: "HTTP 클라이언트"
    constraint: "Spring WebClient. 대상 시스템별 타임아웃·재시도·인증 방식은 설정으로 관리한다"
  - id: CON-005
    area: "외부 모델 호출"
    constraint: "Spring AI 의 모델 추상화를 **공통 컴포넌트 내부 구현으로만** 사용한다. 도메인 코드는 우리 인터페이스만 본다"
    why: "프레임워크의 추상화도 같은 층의 경쟁 추상화다 — 도메인에 노출하면 공급 경로 교체 가능성을 얻는 대신 **프레임워크 자체가 교체 불가능한 종속**이 된다"
    traces_to: [PRN-01, PRN-05]
  - id: CON-006
    area: "턴 오케스트레이션"
    constraint: "상태 그래프 런타임(LangGraph4j) 위에서 스텝 루프를 수행한다. **체크포인트 저장소를 별도로 두지 않고 AI 전용 DB 의 테이블에 직접 쓴다**"
    why: "재개 상태의 원천을 하나로 유지하기 위함이다"
  - id: CON-007
    area: "백엔드"
    constraint: "Spring Boot 최신 안정 버전 계열(현재 4.x, 따라서 Spring AI 2.0 계열). 영속화는 JPA + QueryDSL. **런타임은 JDK 25**"
    note: "**런타임 버전은 연동 전제다** — 고객사 서버에 이 JDK 를 요구한다. 빌드 toolchain 이 그 값이며(`sources/build.gradle.kts`) 둘이 갈리면 소스가 이긴다"
  - id: CON-008
    area: "모듈 구조"
    constraint: "system / admin / portal / agent 를 **하나의 애플리케이션으로 통합 개발·배포**한다. 하나의 PostgreSQL 스키마를 공유하되 화면·API·서비스·Entity/Repository·테이블 쓰기 소유권은 제품 모듈별로 나눈다"
    why: "물리 배포와 DB를 하나로 유지해 폐쇄망 운영 복잡도를 늘리지 않으면서, 기존 백오피스 기반과 AI 기능의 변경 책임을 분리한다(ADR-007 · ARCH-010 · ARCH-024)"
  - id: CON-009
    area: "분리 배포"
    constraint: "필요 시 **agent 만** 분리해 스케일 아웃한다. DB 는 분리하지 않는다"
  - id: CON-010
    area: "세션 저장소"
    constraint: "멀티 인스턴스 운영 시 Redis 또는 Spring JDBC Session. **턴 처리는 화면 세션에 의존하지 않는다**"
  - id: CON-011
    area: "비밀 값"
    constraint: "접속 정보·키는 설정 파일에 평문으로 두지 않는다. 기본 전략은 **yml + Jasypt 암호화**이며 복호화 키는 환경 변수 또는 배포 도구에서 주입한다"
  - id: CON-036
    area: "캐시"
    constraint: "**공통 캐시 계층을 두지 않는다.** 카탈로그·권한 판정·단가표처럼 매 턴 읽히는 것도 지금은 DB 에서 직접 읽는다"
    why: "**무엇이 느린지 재기 전에 캐시를 넣으면 무엇을 줄였는지 알 수 없다** — NFR-008 이 턴 시간을 구간으로 분해하므로 근거는 그쪽에서 나온다. 캐시는 정합성 문제를 함께 들여오므로 근거 없이 넣지 않으며, 필요해지면 그때 ADR 을 세운다"
    note: "**기능이 요구하는 국소 캐시와 공급 경로의 프롬프트 캐시는 이 제약의 대상이 아니다** — 저장된 조회의 결과 캐시 TTL(NFR-005)과 컨텍스트 접두부 캐시(ARCH-040)는 각자의 자리가 있다"
    decided_at: "2026-09-10 — 사용자 확정. 그 전에는 캐시가 스택의 축에서 통째로 비어 있었다"
  - id: CON-037
    area: "모니터링"
    constraint: "**기술 운영 모니터링과 업무 운영 현황을 분리한다.** 기술 운영은 고객사 전사 표준 도구를 우선하고, Hub 는 Spring Boot Actuator·Micrometer 기반의 헬스·지표 노출 지점을 제공한다. 고객사 도구가 없으면 **Prometheus 수집 + Grafana 시각화**를 선택 설치하는 기본 구성으로 제안한다"
    why: "CPU·메모리·스레드·커넥션 풀·HTTP 오류 같은 기술 지표는 고객사 인프라 도구가 한곳에서 보는 것이 맞다. 반면 비용·쿼터·결함·턴 상태는 제품의 업무 데이터이므로 admin 기능이 조회하고, 고객사별 대시보드는 그 기능 위에 구성한다"
    boundaries:
      - "**Hub 가 노출한다** — JVM 메모리·GC·스레드 · 프로세스 CPU · HTTP 요청 지연과 서버 오류 · 애플리케이션 커넥션 풀 · Hub 구성요소 헬스"
      - "**고객사 인프라·DB 도구가 가진다** — 호스트·컨테이너 네트워크 트래픽 · 업무 DB 세션의 CPU·IO · DB 자체 슬로우 쿼리 탐지. Hub 는 실행 SQL 에 턴 ID 를 주석으로 남겨 교차 추적만 돕는다(AUTHZ-030)"
      - "**admin 제품 기능이 가진다** — 활성 작업 사용자·턴·토큰·비용·쿼터·API 호출·품질 신고 같은 업무 운영 현황. 기술 지표 인터페이스 IF-008 로 내보내는 것과 같은 화면에 섞지 않는다"
    hard_rule: "기술 지표 라벨에는 **사용자 ID·턴 ID·질의문·업무 키를 넣지 않는다.** 결과 상태·질의 유형·공급 경로 코드처럼 집계 가능한 낮은 카디널리티 값만 허용한다"
    note: "고객사 표준 도구와의 실제 연결 방식·수집 범위는 착수 시 CON-027 에서 확정한다. 기본 구성이 제품의 고정 대시보드라는 뜻은 아니며, 고객사 도구가 있으면 Prometheus·Grafana를 중복 설치하지 않는다"
    decided_at: "2026-09-11 — 사용자가 기술 운영과 업무 운영의 범위를 분리하고 고객사 표준 우선·부재 시 보편적 기본 도구 사용을 확정"
  - id: CON-035
    area: "게이트웨이 경유"
    constraint: "**게이트웨이(Bedrock · Vertex 등) 경유를 지원한다**(ADR-004). 공급 경로(TRM-087)는 제작사 직접 API 와 **동등한 1급 대상**이며 단가·엔드포인트·인증·리전이 경로에 붙는다. 도메인 코드는 경로를 알지 못한다 — 공통 컴포넌트 안에만 둔다(PRN-01)"
    note: "**경유하면 심사 대상이 둘이 된다**(ACT-007) — 데이터가 제작사와 경로 둘을 지난다. CON-013 의 아웃바운드 허용 목록도 **경로의 도메인** 기준이다"

# ── 배포·망 전제 ────────────────────────────────────────────
deployment:
  - id: CON-012
    title: "독립형 배포"
    constraint: "레거시와 별도로 배포·운영되며 업무 시스템의 배포 주기에 종속되지 않는다. DB 와 WAS 는 내부 폐쇄망 설치를 기본 가정으로 한다. **AI 전용 DB 는 우리가 설치해 제공한다** — 고객사가 이미 쓰는 PostgreSQL 인스턴스를 받아 쓰지 않는다"
    why: "**완제품을 납품하는 형태이기 때문이다**(CON-014). 그래서 PostgreSQL 버전과 확장 설치가 우리 손 안에 있고, ADR-005(벡터 저장소)가 그 전제 위에 선다 — 남의 인스턴스를 받아 쓰면 확장 설치가 고객사마다 협의 항목이 된다"
    decided_at: "2026-09-10 — 사용자 확정. 그 전에는 *어디에 설치하나*(폐쇄망)만 있고 *누가 설치하나*가 spec 에 없었다"
  - id: CON-013
    title: "단일 아웃바운드 통로 · 인바운드 미허용"
    constraint: "폐쇄망에서 외부로 나가는 경로는 하나로 제한하고 인바운드는 허용하지 않는다. 기본 방식은 DMZ 아웃바운드 프록시 경유"
    infra_requirements: "① 외부 모델 목적지에 대한 아웃바운드 허용 — **IP 가 아니라 도메인 기준**(공급 경로 사정으로 변동되므로 IP 허용 목록은 주기적으로 깨진다) ② 프록시 경유 정보 제공 ③ 인바운드 미허용"
    owner: ACT-009
  - id: CON-014
    title: "SaaS 가 아니라 고객사 서버 직접 구축"
    constraint: "운영 이관 후 고객사별로 개별 유지보수한다. **고객사 간 버전이 갈릴 수 있음을 전제한다** — 이 헌장과 원칙은 버전이 갈려도 유지되어야 하는 공통 기반이다"
    operations: "**운영은 둘로 나뉜다**(사용자 확정 2026-09-10) — **일상 운영은 고객사 관리자**가 admin 화면으로 한다(계정·권한·쿼터와 비용 한도·업무 지식과 카탈로그 관리). **장애 대응과 업그레이드는 우리가 한다.** 그래서 admin 화면은 *우리가 쓰는 도구* 가 아니라 **고객사 관리자가 매일 쓰는 제품**이며, 그 사실이 화면 요건의 기준이다"

# ── 착수 시 확정해야 하는 것 ────────────────────────────────
# 시스템 기능이 아니므로 값을 여기서 확정하지 않는다. 대신 **확정되지 않은 상태로
# 구축에 들어가지 않는다**는 것을 요건으로 둔다. 미확정 항목은 ASM- 으로 관리한다.
customer_agreements:
  - id: CON-015
    area: "사용자 접속"
    decide: "VPN 전용 / 사내 PC 원격 / VDI 등 접속 방식과 허용 대역"
    owner: ACT-009
  - id: CON-016
    area: "메타데이터 구축"
    decide: "테이블·컬럼 **업무 의미의 등록·검수 담당과 일정**"
    owner: ACT-003
    note: "**이 인력이 정확도의 상한을 정하므로 도입의 실질 비용이자 전제다**"
    traces_to: [PRN-10, ECO-03]
  - id: CON-017
    area: "대상 업무와 프로세스"
    decide: "1차 적용 업무의 선정과 **AI 기준의 프로세스 재설계 합의**. 적용 전 지표(현행 처리 시간·건수)를 함께 확보해 효과 측정의 기준선으로 삼는다"
    note: >-
      기존 절차를 그대로 둔 채 대화 창구만 얹으면 반복 수작업(PRB-05)이 그대로 남는다.
      **이 합의는 첫 고객 파일럿의 착수 조건이며 범용 Hub 제품의 P1·P2 를 막지 않는다.**
      제품 프로세스는 특정 WMS·TMS 업무를 전제하지 않고 도메인 중립으로 정의한다.
  - id: CON-018
    area: "업무 DB 계정"
    decide: "읽기 전용 계정의 권한 범위 · DBMS 별 리소스 한도 · 접속 허용 IP"
    hard_requirement: "**메타데이터 조회 권한은 연동 전제다** — 없으면 카탈로그의 스키마 사실을 자동 수집할 수 없어 전부 수기 등록이 되고 스키마 변경 감지의 정확도도 떨어진다"
    owner: ACT-010
  - id: CON-019
    area: "API 연동"
    decide: "연동 대상 기능의 REST 제공 여부와 명세 · **시스템별 서비스 계정 발급과 인증 방식**(토큰·mTLS) · 호출 허용 대역 · 복구·원복 절차"
    note: "REST 가 없는 기능은 어댑터 제공 여부와 담당 주체를, **사용자별 인증만 지원하고 서비스 계정 발급이 불가능한 API** 는 어댑터 또는 연동 제외를 확정한다"
    owner: ACT-006
  - id: CON-020
    area: "API 응답의 개인정보"
    decide: "응답 스키마에서 **개인정보 경로를 식별할 담당과 시점** · 정보주체 식별자에 해당하는 경로 · **응답 스키마 변경 시의 통보 절차**"
    note: "**우리는 레거시의 응답 변경을 감지할 수단이 없다**"
    owner: ACT-011
  - id: CON-021
    area: "신원 매핑 원천"
    decide: "시스템·데이터소스별 사용자 식별자 체계와 매핑 원천(인사 데이터 등) · 대량 등록·동기화 방식"
    note: "**신원 매핑은 곧 사칭 능력이다** — 잘못 매핑하면 남의 권한으로 레거시 데이터에 접근한다"
  - id: CON-022
    area: "인사 변경 연동"
    decide: "사용자 변경 이벤트(퇴직·조직 이동)의 원천 시스템과 전달 방식"
    owner: ACT-008
  - id: CON-023
    area: "데이터소스 목록"
    decide: "연동 대상 데이터소스 전체 목록과 각각의 DBMS 종류·버전"
    note: "파서 확보 범위와 지원 선언 범위의 근거가 된다"
  - id: CON-024
    area: "그룹별 차등 뷰"
    decide: "그룹별로 행·컬럼 범위가 달라야 하는 테이블의 뷰 생성 여부와 담당 · 뷰 배치 스키마 · 읽기 계정의 SELECT 부여"
    owner: ACT-010
  - id: CON-025
    area: "이력 용량"
    decide: "질의 1건당 예상 이력 용량 × 일 질의 건수 × 보관 기간"
    note: "**재개 상태는 스텝마다 그 시점의 메시지 전량을 저장하므로 한 턴 안에서도 누적이 빠르다** — 산정에 별도 항목으로 넣는다. 데이터소스별로 조회 결과 원문의 보존 여부를 먼저 결정해야 산정이 가능하다"
  - id: CON-026
    area: "백업·복구"
    decide: "RPO·RTO 목표와 백업 방식. 설정·정책과 이력은 크기와 변경 빈도가 달라 백업 주기를 분리한다"
  - id: CON-027
    area: "모니터링"
    decide: "고객사 전사 표준 기술 모니터링 도구의 유무 · IF-008 수집 연결 방식 · 수집할 헬스·지표 범위 · 도구가 없을 때 Prometheus·Grafana 기본 구성의 설치 여부"
    note: "**여기서 정하는 것은 기술 운영 모니터링이다.** 비용·쿼터·품질 신고·턴 상태 같은 업무 운영 현황과 고객사별 admin 대시보드 구성은 제품 기능의 범위다(CON-037)"
  - id: CON-028
    area: "프록시·로드밸런서"
    decide: "유휴 타임아웃 · 응답 버퍼링 여부 · TLS 인스펙션 사용 시 사설 CA 인증서 · 프록시 인증 방식"
    owner: ACT-009
  - id: CON-029
    area: "레거시 딥링크"
    decide: "팝업 진입 링크를 설치할 레거시 화면 목록 · 설치 담당 · 전달할 문맥 파라미터"
    note: "링크 삽입은 레거시의 스키마·기능 변경이 아니므로 PRN-09 에 저촉되지 않는다"
  - id: CON-030
    area: "내보내기 이력"
    decide: "그리드·차트의 클라이언트 내보내기(엑셀·이미지) 이력을 보안 정책상 요구하는지"
  - id: CON-031
    area: "메일 발송"
    decide: "고객사 자체 메일 전송 에이전트 사용 여부 또는 메일 서버 구성"
  - id: CON-032
    area: "개인정보 보관"
    decide: "대화 이력의 보관 기간과 파기 방식에 대한 법무·보안 검토"
    owner: ACT-011

# ── 개발 기간의 제약 ────────────────────────────────────────
development:
  - id: CON-033
    title: "개발 기간에는 CLI Provider 를 쓴다"
    constraint: "엔터프라이즈 API 구독 비용 문제로 개발 중에는 CLI 를 사용한다. 토큰 집계·스트리밍·동시성 특성이 API 와 다르다"
    hard_rule: "**추상화 인터페이스는 API Provider 를 기준으로 설계한다.** CLI 가 지원하지 못하는 기능은 구현체에서 미지원으로 명시하며, **인터페이스를 CLI 수준으로 낮추지 않는다** — 개발 환경의 제약이 운영 설계를 축소시키지 않게 한다"
    risk: "**토큰 집계·스트리밍·동시성** 세 항목이 CLI 로는 검증되지 않는다. 각각 정산·상태 표시·동시 처리 한계의 근거이므로 **API 구독 확보 직후 최우선으로 실환경 검증**하며, 검증 전에는 해당 기능을 완료로 보지 않는다"
  - id: CON-034
    title: "토큰·비용 집계의 정본은 API Provider 다"
    constraint: "개발 환경의 사용량 수치는 정산 근거로 사용하지 않는다"
