modules:
  - id: MOD-system
    users: [ACT-005, ACT-012]
    form: "관리 콘솔 (`/admin/system/**`, 좌측 메뉴 트리)"
    responsibility: "사용자·메뉴·역할·권한·공통코드·다국어 메시지와 백오피스 공통 운영 기반"
    forbidden: "AI 지식·정책의 업무 규칙 소유 · 대화·추론 LLM 호출 · 업무 DB·API 직접 접근"
    note: "기존에 구현된 백오피스 시스템 관리 기능의 소유 모듈이다. 기술 기반 `platform`·`shared`와 구분한다"
  - id: MOD-admin
    users: [ACT-002, ACT-003, ACT-004, ACT-005]
    form: "관리 콘솔 (`/admin/hub/**`, 좌측 메뉴 트리)"
    responsibility: "AI 기준 정보·지식·정책·설정 관리 · 품질 신고 처리 · AI 감사·통계"
    forbidden: "대화·추론 LLM 호출 · 업무 DB·API 직접 접근 · 감사 이력 수정·삭제"
  - id: MOD-portal
    users: [ACT-001]
    form: "독립 사용자 화면 (도메인 루트 `/`와 `/portal/**`)"
    responsibility: "채팅 · 지난 대화 · 개인화 프롬프트 · 내 사용량 · 접근 가능 목록 · 워크플로우 · 품질 신고"
    forbidden: "외부 모델 호출 · 업무 DB·API 직접 접근 · 감사 이력·사용량 임의 기록"
    note: "**채팅 화면만이 아니라 개인 사용자용 모듈 전체**를 가리킨다"
  - id: MOD-agent
    users: []
    form: "백엔드 전용 (UI 없음)"
    responsibility: "질의 처리 · LLM 통신 · SQL 실행 · 업무 API 실행 · 지식 검색 · 컨텍스트 관리 · 정책 집행 · 이력 기록 · 워크플로우·스케줄 실행"
    forbidden: "정책 검사를 건너뛴 실행"
    note: "**업무 시스템과 대화·추론 LLM 에 닿는 유일한 접점이다.** 분리 배포는 이 모듈만 대상으로 한다"
