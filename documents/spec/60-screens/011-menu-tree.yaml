      reason: "RM-P3 자동화 후속 화면. 이번 목업 대상에서 제외한다."
  rules:
    - "메뉴 영역과 화면의 표시 순서는 admin_groups의 배열 순서를 정본으로 삼는다. 생성 화면정의서와 설계 사이트의 목업 목차도 같은 순서를 따른다. 파일명·화면 ID 순으로 다시 정렬하지 않는다."
    - "공통 기반을 최상단에 두고 운영 설정→모델→단가→쿼터→사용자 그룹→Portal 사용자 순으로 준비한다. 이후 연동 자산→접근 권한→업무 지식→AI 운영→비용 처리→감사·이력→품질 관리로 내려간다."
    - "선행 기반을 먼저 준비하는 업무 탐색 순서이며 모든 참조를 단방향으로 제한하지 않는다. 자산 등록 뒤 대상별 권한을 연결하고, 월 운영 결과는 다음 월 기준 보완으로 되돌아올 수 있다."
    - "영역 안에서 소유 자산과 공유 편집면·전용 요청·상속 이력을 가까이 둔다. 이력16개는 원 화면 상속 안내만 제공하고 독립 목업을 복제하지 않는다."
    - "관리 화면은 실제 적용본만 표시하고 요청/승인/반려는 소유 요청 화면에서 처리한다."
    - "현재/요청/실행 감사의 의미가 다른 이력을 한 관리 _HIST 화면으로 합치지 않는다."
    - "원 화면별 상속 이력은 목록에 포함하지만 독립 목업 작성 수에는 포함하지 않는다."
    - "메뉴별 독립 이동과 읽기/처리/반출 권한을 유지한다. 구조 노드는 URL을 갖지 않고 리프만 화면에 연결한다."
    - "전체 화면 요건/목업 합의 후 물리/API·트랜잭션 설계를 진행한다. 지금의 경로·코드는 구현 완료나 G3 승인을 뜻하지 않는다."
    - "승인 대상 6종은 본 메뉴와 같은 그룹에 전용 변경 요청 메뉴를 둔다. SCR-036은 통합 조회/상세 이동만 제공한다. 관계·그룹 매핑·도움말은 소유 자산의 요청 화면을 사용하며 직접 관리 항목에 새 승인을 추가하지 않는다."
  request_workflow:
    index_screen: SCR-036
    source: "각 승인 대상 원 화면의 request_view와 전용 요청 화면의 source_screen이 서로 연결된다."
    rule: "통합 조회→자산별 요청 상세/판정→원 관리 화면의 실제 적용본과 별도 변경 이력으로 이어진다. 복합 요청은 메뉴가 달라도 한 요청번호의 전체 판정/반영을 유지한다."
