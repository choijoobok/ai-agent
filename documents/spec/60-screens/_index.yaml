    [5] 
    [6] 재채번: MNU-Ann → SCR-0nn · MNU-Pnn → SCR-1nn.
    [7] 
    [8] **화면의 컬럼·검증·영향 테이블은 여기에 담지 않는다** — `documents/screen/{페이지경로}/`
    [9] 의 문서 셋이 갖는다(CLAUDE.md §6). 여기는 *무엇이 메뉴로 존재하고 어떤 기능이 거기
    [10] 속하는지* 까지다. **44개 화면의 문서 셋은 아직 없다** — CLAUDE.md §11.
    [24] ── 무엇을 메뉴로 두는가 ────────────────────────────────────
    [40] ── 접근 통제 경계 ──────────────────────────────────────────
    [41] 대분류는 이 분리선과 일치하도록 잘랐다.
    [61] ══ admin — 연동 관리 (3.1) ══════════════════════════════════════
    [62] 권장 조인 경로와 기본 필터를 카탈로그 안에 둔다 — 둘 다 대상이 테이블이고 등록하는
    [63] 사람도 같은 사람이다. 테이블을 열어 둔 자리에서 함께 다루지 않으면 등록되지 않는다.
    [64] **행 스코프는 여기 두지 않는다** — 기본 필터와 구조가 같아 붙이고 싶어지지만
    [65] 목적이 다르고, 무엇보다 **접근 통제**라 권한 관리 쪽의 통제를 받아야 한다.
    [98] ══ admin — 권한 관리 (3.2) ══════════════════════════════════════
    [99] **이 대분류 전체가 하나의 통제 경계다.** 다섯 화면이 접근 범위를 정하므로
    [100] 이 대분류에 대한 접근 권한은 **감사 열람 권한과 반드시 분리할 수 있어야 한다.**
    [137] ══ admin — 업무 지식 관리 (3.3) ═════════════════════════════════
    [138] **이 대분류가 정확도의 원장이다.** 나머지 admin 메뉴가 전부 완성돼도 여기가 비어
    [139] 있으면 시스템은 답을 틀린다. 문서 셋에서 **등록 부담을 줄이는 장치**(초안 제안 ·
    [140] 미완성 목록 · 조회 이력에서의 승격)를 부가 기능이 아니라 **주 기능으로** 다룬다.
    [179] ══ admin — AI 운영 (3.4) ════════════════════════════════════════
    [225] ══ admin — 비용 관리 (3.5) ══════════════════════════════════════
    [250] ══ admin — 품질 관리 (3.6) ══════════════════════════════════════
    [273] ══ admin — 감사·이력 (3.7) ══════════════════════════════════════
    [274] **이 대분류의 상세 설계는 이력 스키마가 확정된 뒤에 한다** — 여기서는 메뉴의 존재와
    [275] 경계만 확정하고 조회 축·지표·필터는 나중이다.
    [276] **이 대분류는 그 자체가 개인정보 열람 경로다** — 접근 권한을 별도 그룹으로 끊는 것이
    [277] 전제이며, **열람 행위 자체를 기록할지는 미확정**이다.
    [321] ══ portal (4장) ═════════════════════════════════════════════════
    [322] **대분류를 두지 않는다** — 개인 사용자의 진입점이 11개뿐이고, 여기서 계층을 한 겹 더
    [323] 만들면 탐색 비용(PRB-03)을 반복한다.
    [407] ══ system — 기존 백오피스 화면의 목표 경로와 소유권 ═════════════
    [408] 동작·컬럼·검증은 current_doc의 승인된 정본을 보존한다. 구현 슬라이스에서 소스 경로와
    [409] 함께 target_doc으로 옮기고 current_route를 즉시 제거한다(ARCH-025).
