    design_status: "screen_draft"
    layout: "조회조건·상단 요청 마스터 그리드·선택 요청의 하단 탭으로 구성한다. 원 관리 화면의 소유 업무 컬럼/탭을 재사용하고 요청번호·요청자/일시·상태·처리자/일시·사유·자기 기준/결과 리비전과 처리 영역을 추가한다. 요청일시 범위·처리 상태·요청자 조건을 제공하고 원 관리 화면의 업무 조건도 요청 스냅샷 값에 적용한다. 제출본은 읽기 전용이며 초안만 허용 상태/권한에서 보완한다. 원 관리 화면이 단일 그리드이면 업무 컬럼과 요청정보를 요청 목록에서 확인하며 존재하지 않는 하단 탭을 추가하지 않는다. 원 화면이 마스터/탭형이면 요청 마스터와 당시 소유 자식 탭을 재사용한다."
    storage: "REQ-601.approval_storage. REQUEST_NO+대상 종류/원 ID로 선택 요청의 마스터와 소유 자식 _SNP 전체를 읽고 현재 본 테이블과 섞지 않는다. 반려 사유·이전 요청/재요청·단계별 결과는 공통 원장에 연결한다. 지식은 소유 ID 매핑/설명만 포함하며 외부 상세를 복사하지 않는다."
