# 자산별 변경 요청 조회·기술 검토·최종 승인/반려 화면
screens:
  - id: SCR-056
    module: "admin"
    workstream: "admin"
    entry: "menu"
    group: "요청·승인"
    title: "스키마 카탈로그 변경 요청"
    feature: FEAT-003
    features:
      - FEAT-003
      - FEAT-014
    usecases:
      - UC-003
      - UC-005
      - UC-012
    traces_to:
      - REQ-601
      - REQ-305
      - REQ-306
    roadmap: "RM-P1"
    view_kind: "change_request"
    screen_role: "request_approval"
    source_screen: SCR-003
    request_index: SCR-036
    type: "list_detail"
    route: "/admin/hub/catalog/change-request"
    menu_code: "HUB_CATALOG_CHANGE_REQUEST"
    menu_parent: "HUB_REQUEST_APPROVAL"
    target_doc: "documents/screen/admin/hub/catalog/change-request/requirements.md"
    design_status: "screen_draft"
    layout: "조회조건·상단 요청 마스터 그리드·선택 요청의 하단 탭으로 구성한다. 원 관리 화면의 소유 업무 컬럼/탭을 재사용하고 요청번호·요청자/일시·상태·처리자/일시·사유·자기 기준/결과 리비전과 처리 영역을 추가한다. 요청일시 범위·처리 상태·요청자 조건을 제공하고 원 관리 화면의 업무 조건도 요청 스냅샷 값에 적용한다. 제출본은 읽기 전용이며 초안만 허용 상태/권한에서 보완한다. 원 관리 화면이 단일 그리드이면 업무 컬럼과 요청정보를 요청 목록에서 확인하며 존재하지 않는 하단 탭을 추가하지 않는다. 원 화면이 마스터/탭형이면 요청 마스터와 당시 소유 자식 탭을 재사용한다."
    storage: "REQ-601.approval_storage. REQUEST_NO+대상 종류/원 ID로 선택 요청의 마스터와 소유 자식 _SNP 전체를 읽고 현재 본 테이블과 섞지 않는다. 반려 사유·이전 요청/재요청·단계별 결과는 공통 원장에 연결한다. 지식은 소유 ID 매핑/설명만 포함하며 외부 상세를 복사하지 않는다."
    actions: "유효 권한·선행 상태에 따라 초안 저장·제출·취소·기술 검토 완료·최종 승인·반려·재요청 연결을 제공한다. 승인 설정 미사용의 전결 결과도 실제 수행 방식으로 조회한다. 통합 조회 화면은 판정하지 않고 이 화면으로 이동한다."
    impact: "REQ-303.reference_mapping·REQ-306.knowledge_impact. 지식 요청은 본문·소유 매핑/설명만 심사한다. 나머지 자산 요청은 적용/미종결 제출 지식의 목록·본문·매핑 설명을 상태/요청번호로 구분해 영향/보완 판단과 별도 지식 요청 연결을 기록한다."
    set_boundary: "복합 요청은 같은 REQUEST_NO의 전체 변경 대상과 처리 결과를 공유한다. 다른 종류의 대상은 각 전용 요청 화면으로 문맥을 유지해 이동한다. 어느 화면에서 열어도 기술 검토·승인·반려/반영은 요청 전체에 한 번 적용하며 현재 자산만 부분 판정/부분 반영하지 않는다. 전체 대상의 현재 처리 권한·선행 상태·자기 기준본·기술 검증을 확인한다."
    access: "별도 요청 메뉴의 조회/반출과 요청·취소·기술 검토·최종 승인/반려 액션 권한을 현재 유효 권한으로 검사한다. 본 관리 화면 변경 권한과 자동 동치로 보지 않고 다른 자산/지식 열람 권한을 확대하지 않는다."
    history_policy:
      kind: "business_record"
      rule: "요청/검토/승인·반려 원장과 _SNP를 조회한다. 실제 적용 결과의 _HIST는 원 관리 화면의 별도 변경 이력 메뉴로 연결하고 이 요청 화면에 또 _HIST를 만들지 않는다."
