    set_boundary: "복합 요청은 같은 REQUEST_NO의 전체 변경 대상과 처리 결과를 공유한다. 다른 종류의 대상은 각 전용 요청 화면으로 문맥을 유지해 이동한다. 어느 화면에서 열어도 기술 검토·승인·반려/반영은 요청 전체에 한 번 적용하며 현재 자산만 부분 판정/부분 반영하지 않는다. 전체 대상의 현재 처리 권한·선행 상태·자기 기준본·기술 검증을 확인한다."
    access: "별도 요청 메뉴의 조회/반출과 요청·취소·기술 검토·최종 승인/반려 액션 권한을 현재 유효 권한으로 검사한다. 본 관리 화면 변경 권한과 자동 동치로 보지 않고 다른 자산/지식 열람 권한을 확대하지 않는다."
    history_policy:
      kind: "business_record"
      rule: "요청/검토/승인·반려 원장과 _SNP를 조회한다. 실제 적용 결과의 _HIST는 원 관리 화면의 별도 변경 이력 메뉴로 연결하고 이 요청 화면에 또 _HIST를 만들지 않는다."
