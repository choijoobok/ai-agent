doc_order:
  unit: "**리프 메뉴 1개 = 문서 셋 1건**을 기본으로 한다 (44건)"
  flexibility: "**묶어도 되고 쪼개도 된다.** 대상과 등록 주체가 같은 리프(SCR-007·SCR-008 그룹 매핑)는 묶을 수 있고, SCR-101 채팅은 흐름 단위로 나눌 수 있다"
  order: "**P1 메뉴가 먼저다.** 그중에서도 **SCR-003 스키마 카탈로그와 업무 지식 관리(SCR-010~014)를 앞에 둔다** — DB 설계의 설정 테이블 대부분이 여기서 나오고 agent 의 컨텍스트 구성이 이 화면들의 산출물을 입력으로 삼는다"
  path_rule: "화면 정본은 `documents/screen/{모듈}/{화면경로}/`에 둔다(ADR-007). 브라우저의 `/admin` 같은 화면 영역 접두사와 모듈 소유권을 혼동하지 않으며, 정확한 변환 규칙은 하네스·화면 문서 표준을 함께 갱신한다"
  status: >-
    **아직 한 건도 시작하지 않았다.** `documents/screen/` 에 있는 것은 백오피스 템플릿의
    화면 문서이고, 여기 44개(admin 32 · portal 12)는 이 목록에만 있다.
    @defer P3 — Hub 메뉴 44개의 화면 문서 셋을 시작한다
