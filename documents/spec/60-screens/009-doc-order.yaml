doc_order:
  unit: "**독립된 화면 계약 SCR 1개 = 화면 명세 1건**을 기본으로 한다. 메뉴의 주 화면에서 시작하되 독립 계약이 있는 상세·모달·탭·공통 화면은 별도 SCR로 식별한다"
  flexibility: "같은 메뉴의 내부 동작은 주 화면 명세 안에서 다룰 수 있다. 여러 화면이 공유하는 업무 선택창·모달은 공통 계약을 한 번 정의하고 호출 화면은 전달값·반환값 매핑을 참조한다. 화면의 기능은 FEAT ID로 연결하며 메뉴와 기능을 일대일로 강제하지 않는다"
  order: "**P1 메뉴가 먼저다.** 그중에서도 **SCR-003 스키마 카탈로그와 업무 지식 관리(SCR-010~014·034·036)를 앞에 둔다** — DB 설계의 설정 테이블 대부분이 여기서 나오고 agent 의 컨텍스트 구성이 이 화면들의 산출물을 입력으로 삼는다"
  path_rule: "화면 정본은 `documents/screen/{모듈}/{화면경로}/`에 둔다(ADR-007). 브라우저의 `/admin` 같은 화면 영역 접두사와 모듈 소유권을 혼동하지 않으며, 정확한 변환 규칙은 하네스·화면 문서 표준을 함께 갱신한다"
  common_screen_design: "@defer P3 — admin은 현재 메뉴 주 화면 목록을 출발점으로 삼는다. 대상 선택·참조 영향·이력 조회 등의 재사용 가능성은 각 업무 계약을 대조해 판정하고, 공통 화면으로 식별되면 SCR·uses_screens·입출력 매핑과 별도 요건서를 추가한다. 지금 목록에 공통 SCR이 없다는 것은 공통 화면이 필요 없다는 결론이 아니다"
  menu_design: "@defer P3 — admin 메뉴 코드·상위 메뉴·route와 화면 요건서/목업을 상세 설계한다. SCR-010의 독립 메뉴/지식 편집 통합은 해당 note의 미결 조건을 유지한다. 차수와 scope_status로 현재 대상·후속 차수·유예 후보를 구분하며 후보를 구현 대상으로 세지 않는다"
