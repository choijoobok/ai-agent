doc_order:
  unit: "**독립된 화면 계약 SCR 1개 = 화면 명세 1건**을 기본으로 한다. 메뉴의 주 화면에서 시작하되 독립 계약이 있는 상세·모달·탭·공통 화면은 별도 SCR로 식별한다"
  flexibility: "같은 메뉴의 내부 동작은 주 화면 명세 안에서 다룰 수 있다. 여러 화면이 공유하는 업무 선택창·모달은 공통 계약을 한 번 정의하고 호출 화면은 전달값·반환값 매핑을 참조한다. 화면의 기능은 FEAT ID로 연결하며 메뉴와 기능을 일대일로 강제하지 않는다"
  order: "admin RM-P1 전체 메뉴 트리/화면 목록 → 모든 원 화면의 요건서·1차 목업 → 묶음 화면 검토 → 전체 업무 흐름 합의 → 관련 기술 상세 설계 → G3 승인 → 개발 순서다. system은 이번 작업에서 제외한다."
  path_rule: "화면 정본은 AGENTS.md §6.1에 따라 실제/설계 페이지 경로를 documents/screen/ 아래에 그대로 미러링한다. system은 admin/system, admin은 ARCH-021의 admin/hub 경로다. 모듈 소유권은 SCR.module로 구분하며 URL 접두사를 모듈명으로 해석하지 않는다"
  common_screen_design: "@defer 전체 화면 승인 전 — UND-S07의 호출/입출력을 원 화면 목업과 함께 대조해 공통/전용 영역을 결정한다. 후보를 새 메뉴/완료 화면으로 세지 않는다."
  menu_design: "2026-10-30 사용자 합의: menu_tree의 admin 메뉴 배치·코드·경로를 목업 검토안으로 사용한다. source_screen 상속 이력은 목록에 포함하되 독립 목업을 만들지 않는다. 유예/후속 화면은 이번 목록에서 제외한다."
  screen_requirement_depth: "화면 검토 단계는 업무 목적·조회/입력 항목·선택 출처·필수/검증·버튼·상태·저장 단위·화면 간 전달과 사용자 수락 사례를 작성한다. 미정 물리명/API 경로·잠금/복구 상세는 추정하지 않고 같은 요건서의 후속으로 표시해 전체 화면 합의 뒤 G3 전에 보완한다."
  request_screen_design: "자산별 변경 요청 6개는 원 관리 화면의 소유 컬럼/탭을 재사용하되 요청 목록·메타정보·상태별 명령·영향 검토·복합 요청 이동을 별도 요건/목업으로 확인한다. 상속 이력16개와 달리 요청 처리 화면은 목업 작성 대상이다. 공통 요청 표시/판정 영역은 한 명이 통합하고 각 담당자는 자기 자산의 업무 구성만 작성한다."
