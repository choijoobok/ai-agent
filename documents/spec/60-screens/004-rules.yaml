rules:
  - "**통제의 단위는 리프 메뉴다.** 대분류는 기본 묶음일 뿐이며 고객사가 리프 단위로 다르게 매핑할 수 있어야 한다 — 대분류를 단위로 삼으면 '카탈로그는 열되 API 는 막는다' 가 표현되지 않는다"
  - "**읽기와 쓰기를 별도 메뉴로 나누지 않는다.** 같은 대상의 조회 화면과 등록 화면을 따로 두면 메뉴 수가 두 배가 되고 탐색 비용이 늘어난다. 권한 모드는 메뉴 매핑의 속성으로 다룬다"
  - "**메뉴는 그 차수(RM-Pn)에 도달하기 전까지 노출하지 않는다.** 비활성 상태로 보여 주면 사용자가 매번 눌러 보게 되고, 그 자체가 탐색 비용이다"
