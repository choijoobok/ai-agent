not_menus:
  - group: "admin 공통 관리 승인 (FEAT-040)"
    why: "업무별 관리 기능이 내부에서 사용하는 요청 무결성·승인 경로 계약이다. 직접 진입 메뉴나 공통 모달을 새로 만들지 않는다. 자산·사용자 접근·쿼터 승인 화면의 기존 소유 기능을 유지한다"
  - group: "admin 처리 오류·증거 접수 (FEAT-041)"
    why: "portal·agent가 공개 계약으로 인계하는 발생 원본과 불변 증거의 서버 처리다. 조회·조사 처리는 기존 SCR-033·FEAT-035가 담당하며 접수 전용 메뉴를 추가하지 않는다"
  - group: "agent (FEAT-201~222, 22건)"
    why: "백엔드 처리다. 화면을 갖지 않으며 agent 설계의 대상이다"
  - group: "공통 (FEAT-301~305, 5건)"
    why: "인증·설정·공통 컴포넌트·수신 인터페이스다. 특히 인증·인가는 **모든 메뉴에 걸리는 통제**이지 메뉴가 아니다"

