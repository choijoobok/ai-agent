control_boundaries:
  - boundary: "정책 변경"
    group: "권한 관리"
    why: "**접근 범위 자체를 바꾼다. 자기 권한 확대가 가능한 자리다**"
  - boundary: "업무 자산 등록"
    group: "연동 관리 · 업무 지식 관리"
    why: "정확도를 만들지만 권한을 넓히지는 않는다. **현업 담당자에게 열 수 있어야 한다**"
  - boundary: "운영·비용"
    group: "AI 운영 · 비용 관리"
    why: "한도와 모델을 다룬다"
  - boundary: "열람 전용"
    group: "품질 관리 · 감사·이력"
    why: "**업무 데이터 원문과 개인정보에 닿는다**"
