control_boundaries:
  - boundary: "정책 변경"
    group: "권한 관리"
    why: "**접근 범위 자체를 바꾼다. 자기 권한 확대가 가능한 자리다**"
  - boundary: "업무 자산 등록"
    group: "연동 관리 · 업무 지식 관리"
    why: "정확도를 만들지만 권한을 넓히지는 않는다. **현업 담당자에게 열 수 있어야 한다**"
  - boundary: "운영·비용"
    group: "AI 운영 · 비용 관리"
    why: "한도와 모델을 다룬다"
  - boundary: "감사 열람과 검토·조사 처리"
    group: "품질 관리 · 감사·이력"
    why: "업무 데이터 원문과 개인정보에 닿으므로 현재 메뉴·액션 권한과 자료 범위를 검사한다. 원본 이력은 수정하지 않으며 검토 의견·조사 연결/배정·증거 보호/해제·회신·종결은 각각의 처리 권한으로 구분한다. 조회 권한만으로 처리나 정책 복원을 허용하지 않고, 복원은 원 소유 기능의 새 변경 절차로 인계한다"
