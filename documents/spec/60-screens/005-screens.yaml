# ══ admin — 연동 관리 (3.1) ══════════════════════════════════════
# 권장 조인 경로와 기본 필터를 카탈로그 안에 둔다 — 둘 다 대상이 테이블이고 등록하는
# 사람도 같은 사람이다. 테이블을 열어 둔 자리에서 함께 다루지 않으면 등록되지 않는다.
# **행 스코프는 여기 두지 않는다** — 기본 필터와 구조가 같아 붙이고 싶어지지만
# 목적이 다르고, 무엇보다 **접근 통제**라 권한 관리 쪽의 통제를 받아야 한다.
  - id: SCR-001
    module: admin
    group: "연동 관리"
    title: "대상 시스템"
    feature: FEAT-001
    roadmap: RM-P1
    agent_contact: 설정
    note: "**RM-P1에서 등록한다** — 조회는 데이터소스만으로 성립하지만, 실행 출시 범위에서는 업무 API를 제공하는 대상 시스템을 등록해야 한다. 개별 API의 제공 시스템 지정과 계약 상세는 SCR-004가 관리한다"
  - id: SCR-002
    module: admin
    group: "연동 관리"
    title: "데이터소스"
    feature: FEAT-002
    roadmap: RM-P1
    agent_contact: 설정
  - id: SCR-003
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.approval_policy를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    module: admin
    group: "연동 관리"
    title: "스키마 카탈로그"
    feature: FEAT-003
    features: [FEAT-003, FEAT-011, FEAT-012]
    roadmap: RM-P1
    agent_contact: 설정
    note: "**작성 순서에서 가장 앞이다** — Hub 공개 대상으로 선택한 뷰·테이블과 그 업무 의미를 여기서 관리하고, agent의 컨텍스트 구성이 이 화면의 산출물을 입력으로 삼는다. 업무 DB/DW 전체를 대사하는 화면이 아니다. 메타데이터 후보를 작성하고 단독 변경도 SCR-036의 요청·기술 검토·최종 승인으로 반영한다"
  - id: SCR-004
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.approval_policy를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    module: admin
    group: "연동 관리"
    title: "업무 API"
    feature: FEAT-004
    roadmap: RM-P1
    agent_contact: 설정
    note: "REQ-608의 API 계약과 입력 필드별 자료형·필수 여부·허용값·값의 출처·채우기 가이드·검증 조건을 관리한다. 고정값·기본값과 허용 조회 참조·결과 추출/변환 안내를 구분하고 해당 지식-API 매핑 건의 사용 설명·업무별 절차를 참조한다. API 자체 갱신과 지식 매핑 변경 승인의 경계는 REQ-608을 따른다. 실제 필드 배치·화면 요건서·목업은 P3에서 정한다 REQ-608.result_handling_guide의 API 공통 결과 안내·질문/선택별 후속 처리 가이드를 자연어로 관리하고 계약 원천을 참조한다. 구체 필드·배치·목업은 P3에서 정한다."

# ══ admin — 권한 관리 (3.2) ══════════════════════════════════════
# **이 대분류 전체가 하나의 통제 경계다.** 아래 관리·승인 화면이 접근 범위를 정하므로
# 이 대분류에 대한 접근 권한은 **감사 열람 권한과 반드시 분리할 수 있어야 한다.**
  - id: SCR-005
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.approval_policy를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    module: admin
    group: "권한 관리"
    title: "Portal 사용자 관리"
    feature: FEAT-005
    roadmap: RM-P1
    agent_contact: 설정
    note: "REQ-616의 Portal 이용자 전용 관리 메뉴다. system의 관리자 사용자 관리(SCR-501)와 별도이며 그룹·쿼터·신원 매핑·이용 상태를 확인한다. 관리 콘솔 /admin/hub/** 영역에 두고 상세 경로는 P3에서 정한다. 이용자가 사용하는 Portal 메인(/)과 Portal 기능(/portal/**) 화면이 아니다(ARCH-021)"
