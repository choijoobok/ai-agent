    response_preview: "질의 목록 항목을 클릭하면 선택 질의와 연결된 공개 응답을 모달/팝업 레이어로 보여준다. 목록/레이어에 본문 원본 위치 이동을 제공하지 않고 본문 로드 구간·조회 경계·스크롤을 유지한다. 새 턴 요청·즐겨찾기 등록과 조작을 분리하며 응답 연결/표현·상태·권한/보존·오류·늦은 응답·닫은 뒤 위치/입력 유지는 REQ-014.response_preview를 따른다. 구체적인 레이어 형태·배치는 P3 화면 설계에서 정한다"
    query_list: "본문과 별도로 현재 세션의 모든 사용자 질의를 REQ-014의 목록으로 표시한다. 질의문·접수 시각·현재 상태와 중단 표식/사유, '새 턴으로 다시 요청'·'자주 쓰는 질의로 등록' 버튼을 제공한다. 모든 상태의 새 턴 요청은 REQ-013, 등록/관리는 REQ-201을 따른다. 즐겨찾기 등록은 기존 입력 종류·문맥 관계로 자격을 구분하고 변경/추가 응답·문맥 의존 입력·판정 전 항목에는 비활성 사유를 표시한다. 목록/두 조작 자체의 모델 호출 없이 본문 밖 질의·페이지·현재 권한/보존을 처리한다"
    note: "**이 화면 하나가 P1 가치의 전달 지점이다.** admin 메뉴 하나와 같은 무게로 다루면 안 되며, 문서 셋을 단일 문서로 두지 않고 **흐름 단위로 나누는 것을 허용한다.** 13개 기능이 들어가는 것은 전부 **진행 중인 대화에 대한 동작**이라 별도 진입점을 가질 수 없기 때문이다. 새 대화에는 AI에게 가능한 일을 물어보라는 정적 안내가 보이고, 사용법 질문은 활성 사용 안내 지식으로 답한다. 중단 요청·호출별 취소/업무 결과·재시도 불가·확인 안내는 REQ-007을 참조하며 agent 계약의 접수/반영중/처리 결과를 폴링·재접속으로 표시한다. 추가 입력의 대상 확인·분류/확인·변경 반영 안내와 CLI/API 공통 사용자 동작은 REQ-007을 따른다"
