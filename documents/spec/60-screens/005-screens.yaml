# ══ admin — 업무 지식 관리 (3.3) ═════════════════════════════════
# **이 대분류가 정확도의 원장이다.** 나머지 admin 메뉴가 전부 완성돼도 여기가 비어
# 있으면 시스템은 답을 틀린다. 문서 셋에서 **등록 부담을 줄이는 장치**(초안 제안 ·
# 미완성 목록 · 조회 이력에서의 승격)를 부가 기능이 아니라 **주 기능으로** 다룬다.
  - id: SCR-010
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.approval_policy를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    module: admin
    group: "업무 지식 관리"
    title: "지식 검색 태그·동의어"
    note: "REQ-607의 고정 태그 ID별 텍스트·동의어 후보와 연결 지식 목록을 조회·작성한다. 태그 자체 변경은 기존 SCR-036에서 요청·검토·승인하며 연결된 지식 목록은 영향 확인용이다. 독립 작성 메뉴 또는 지식 편집 화면 통합은 P3에서 검토한다"
    feature: FEAT-024
    roadmap: RM-P1
    agent_contact: 설정
  - id: SCR-011
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.approval_policy를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    module: admin
    group: "업무 지식 관리"
    title: "지식"
    feature: FEAT-014
    roadmap: RM-P1
    agent_contact: 설정
    note: "지식의 인증 예제와 직접 카탈로그를 독립 연결하고 합산 카탈로그의 직접·예제 경유·양쪽 경로 및 버전을 구분해 조회한다. 예제 매핑을 직접 매핑으로 복사하지 않는다(REQ-303). REQ-608의 업무 API를 별도로 매핑하고 각 매핑 건에 용도·사용 조건·입력 확보·조회·선택 절차를 작성하며 공통 입력 명세·가이드는 연결 API에서 참조한다. 지식 자산과 후보 리비전을 작성·조회한다. 변경 요청의 독립 목록·제출·기술 검토·최종 승인·반려·반영 결과는 SCR-036, 예방적 영향 검토 작업은 SCR-034가 맡으며 관련 항목으로 이동할 수 있다. 태그 ID·API 매핑과 매핑별 사용 설명 변경은 지식 후보에 포함하고 공통 태그 텍스트·동의어 변경은 REQ-607의 태그 자체 요청으로 구분한다 REQ-303의 커스텀 도구도 0..N개 직접 매핑하고 매핑별 용도·사용 조건·입력 확보 설명과 당시 참조 버전을 관리한다. 링크 변경은 지식 관리 승인 설정을, 계약 원천은 REQ-612를 따른다. REQ-303.tool_usage_mapping의 결과 안내·질문/선택별 업무 후속 절차를 각 API·커스텀 도구 매핑에서 편집하고 원천 공통 가이드는 참조한다."
  - id: SCR-036
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.approval_policy를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    module: admin
    group: "업무 지식 관리"
    title: "지식 변경 요청"
    feature: FEAT-014
    roadmap: RM-P1
    agent_contact: 설정
    note: "지식·예제·카탈로그·매핑의 단독 또는 복합 변경 요청을 등록·조회하고 기술 검토 대기/중·최종 승인 대기·반려·반영 상태를 구분한다. 기술 검토 완료와 최종 승인 액션은 각각 유효 권한과 선행 상태를 확인하며 동일인의 전 단계 처리를 허용한다. 조사(SCR-033) 또는 지식 검토(SCR-034)에서 요청 등록으로 진입하며, 대상·변경 전후·사유·근거 조사/검토와 반영 세트 상태를 조회한다. 각 자산의 전체 내용·접근 허용 그룹·참조 매핑을 포함한 요청·검토·승인 당시 스냅샷과 현재 버전 차이·반려 사유·재요청 연결을 조회한다. 직접·예제 경유 카탈로그의 합산 목록은 당시 참조 버전으로 재현하며 현재 매핑으로 바꿔 표시하지 않는다(REQ-303). 결재선 설정은 두지 않는다. 세트 일괄 반영·자산별 중복 요청 차단·최신성 검사는 REQ-305·306을 따른다. 자산 후보 작성 화면과 보안 정책 직접 관리 화면은 유지한다. REQ-607의 태그 단독 요청도 함께 처리한다. 태그 변경 전후·자체 버전·단계별 스냅샷과 당시 연결된 지식 목록을 조회하며 영향 지식과 실제 수정 대상을 구분한다. 태그 텍스트만 바뀌면 태그 정의만 반영하고 연결된 지식의 매핑·본문·리비전은 바꾸지 않는다. 태그 요청의 연결 지식은 요청 당시 리비전으로 조회하고 현재 목록의 추가·제거·리비전 차이를 구분해 보여준다. 원 요청 스냅샷과 승인 당시 확인한 목록은 따로 보존한다. 태그와 지식 변경의 상호 차단 제외·동일 변경 대상 중복 제한·최소 검증은 REQ-607을 따른다 업무 API(REQ-608)·도구(REQ-612)의 전체 후보·권한/계약 근거도 같은 화면에서 검토·승인한다. 각 종류의 승인 설정·전결·혼합 세트 판정은 REQ-601을 따른다. 사람의 검토 없이 전결한 건은 실제 전결 처리와 설정 근거를 표시하며 책임자 승인으로 표시하지 않는다 지식의 업무 API·커스텀 도구 링크·매핑별 사용 설명과 당시 계약 버전·검증 근거를 재현하고 현재 버전과의 차이·반영 가능 여부를 REQ-306에 따라 확인한다. API·도구 공통 가이드와 지식 매핑의 후속 설명 변경도 각 전체 후보 스냅샷에 포함한다. REQ-608·612·303에 따라 당시 원천 버전·설명 및 현재와의 차이·계약/영향 검토 근거를 조회한다."
  - id: SCR-034
    module: admin
    group: "업무 지식 관리"
    title: "지식 검토 작업"
    feature: FEAT-036
    roadmap: RM-P1
    agent_contact: 설정
    note: "고객사 스키마·기준정보·업무 규칙 변경의 통지와 영향 검토 근거를 등록·조회한다. 오류가 없어도 검토를 시작하고 수정 필요이면 이 작업을 참조한 SCR-036 변경 요청으로 이어진다. 조사에서 이미 진단한 변경은 이 화면을 반드시 거치지 않는다. 등록·처리·완료 기준은 REQ-307을 따른다"
  - id: SCR-012
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.approval_policy를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    module: admin
    group: "업무 지식 관리"
    title: "인증 예제 쿼리"
    feature: FEAT-023
    roadmap: RM-P1
    agent_contact: 설정
    note: "예제 SQL에서 추출해 예제 자체에 자동 매핑한 카탈로그·버전과 미등록·추출 불확실 항목을 확인한다(REQ-302). 예제·참조 매핑의 후보를 작성하고 단독 변경도 SCR-036에서 요청·기술 검토·최종 승인 후 운영에 반영한다. 요청·승인 당시 버전과 현재 운영본은 구분해 조회한다(REQ-302·305·306)"
  - id: SCR-013
    module: admin
    group: "업무 지식 관리"
    title: "프롬프트 규칙"
    feature: FEAT-013
    roadmap: RM-P1
