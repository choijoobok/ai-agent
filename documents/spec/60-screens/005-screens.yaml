    note: "REQ-609의 대상별 신원 매핑·그룹 추가 요청을 별도 메뉴에서 승인·반려한다. 사용자·대상·ID/그룹·요청 사유·근거·현재 권한·요청 버전·처리 이력을 확인한다. 승인 전 활성화는 불가하며 요청 작성·제거 메뉴와 승인 액션 권한을 분리한다. 상세 경로·요건서·목업은 P3에서 사용자 승인 절차로 정의한다"
