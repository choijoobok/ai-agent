menu_criteria:
  claim: "**셋을 모두 만족할 때만 메뉴로 둔다.** 하나라도 어긋나면 상위 화면의 기능으로 접는다"
  why: "메뉴를 잘게 쪼개면 **탐색 비용(PRB-03)을 우리가 다시 만드는 셈**이 된다"
  tests:
    - axis: 진입
      is_menu: "내비게이션에서 **직접 진입**한다"
      not_menu: "다른 화면의 흐름 안에서만 도달한다"
    - axis: 대상
      is_menu: "고유한 **관리 대상 목록**을 가진다"
      not_menu: "이미 열려 있는 대상에 대한 동작이다"
    - axis: 통제
      is_menu: "**접근 권한을 따로 줄 이유**가 있다"
      not_menu: "상위 화면의 권한에 종속된다"
  note: "**접는다고 설계가 사라지지 않는다** — 화면의 소유/참여 기능은 SCR.feature·features로 연결한다. 모달·탭도 독립된 입력·결과·검증 또는 재사용 계약이 있으면 별도 SCR로 정의하고 호출 화면의 uses_screens로 연결한다. 단순 배치 탭과 일반 UI 컴포넌트를 별도 업무 화면으로 늘리지는 않는다. 공통 서버 기능은 FEAT.uses_features로 연결한다"

# ── 접근 통제 경계 ──────────────────────────────────────────
# 대분류는 이 분리선과 일치하도록 잘랐다.
