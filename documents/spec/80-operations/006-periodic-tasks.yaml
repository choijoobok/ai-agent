periodic_tasks:
  - id: RUN-501
    title: "이력 보존 파기 배치 (RETENTION_PURGE)"
    purpose: "감사·추적 이력이 보관 기간을 넘기지 않도록 정기 파기한다(knowledge/retention.md)"
    traces_to: [ARCH-024]
    procedure:
      - "cron `0 30 3 * * *`(매일 03:30). 대상은 사용 이력 90일·에러 로그 180일·로그인 이력 1년·배치 실행 이력 1년·인앱 알림 90일이며, 개인정보 접근 이력(SYS_LO_PII_ACCESS)은 방향이 하한이라 구조적으로 제외한다"
      - "기간·대상은 코드가 아니라 시스템 설정(sys-config.retention.*) 데이터를 읽으므로 값은 화면에서 바꾼다"
    verify: "실측(2026-09-14): USE_YN='N' — 비활성이다. 시드 설명이 이유를 직접 적어 뒀다 — '삭제는 되돌릴 수 없고 아카이브는 아직 없다. 켜기 전에 보존 기간과 아카이브 방침을 먼저 정한다.' knowledge/retention.md §1도 '아카이브 후 삭제한다'를 정책으로 두었으나 아카이브 구현은 없다 — 지금 켜면 정책과 실제가 어긋난 채로 돈다"
    customer_values: "@defer P6 — 보존 기간 값과 아카이브 구현 여부는 고객사 규제·정책 확정 뒤 결정한다. 그 전에는 켜지 않는다"
    next_targets: "Hub 조회 결과 원문 사본(REQ-107)도 같은 청크 방식으로 파기한다 — 이 배치의 대상 목록에 넣지 않고, 사본을 소유한 agent 모듈의 파기용 BatchJob 빈을 따로 두어 같은 스케줄 배치 화면에 등록한다. 보존 기간은 sys-config가 아니라 yml에서 읽는다"
    status: verified
  - id: RUN-502
    title: "만료 예고 알림 배치 (EXPIRY_NOTICE)"
    purpose: "계정·비밀번호 만료가 임박한 사용자에게 알림을 보낸다"
    traces_to: [FEAT-501, FEAT-509]
    procedure:
      - "cron `0 10 4 * * *`(매일 04:10)"
      - "다음 날 RUN-101의 일상 점검에서 이 배치의 SUCCESS 행이 24시간 안에 있는지로 정상 동작을 확인한다"
    verify: "실측(2026-09-14): USE_YN='Y' — 활성이다. 실행 이력은 아직 없다(서버 기동 직후라 04:10을 지나지 않았다) — 다음 자연 실행에서 RUN-101 질의로 확인한다"
    status: draft
