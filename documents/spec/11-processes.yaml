# 업무 프로세스 정의 (As-Is / To-Be)
#
# 작성 단계: P1
# status: empty — **비어 있다. 지어내지 않았다.**
#
# 원본(agentic-ai)에는 업무 프로세스 정의가 없었다. 프로세스는 **고객사의 것**이고,
# 착수 시 1차 적용 업무를 선정하며 확정된다(CON-017).
#
# **여기가 비어 있는 것이 이 프로젝트의 가장 큰 위험이다.** 헌장이 말하는 가치는
# "시스템 경계를 넘는 조회·대조" 의 빈도에서 나오는데(ECO-01), 그 빈도는 프로세스를
# 그려 보지 않으면 알 수 없다. **효과 측정의 기준선도 여기서 나온다**(SUC-01).
#
# 채우는 방법: aidd-guide/phase/P1-discovery.md §3

meta:
  status: empty
  blocked_by: [CON-017]
  baselined: null

processes: []

