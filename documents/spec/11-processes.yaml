# Hub 프로세스 정의 (도메인 중립)
#
# 작성 단계: P1
# 특정 고객의 WMS·TMS 업무 순서를 가정하지 않는다. 여기에는 고객사가 달라져도 유지되는
# Hub 자체의 준비·요청 처리·실행 통제·계정 동기화·계약 배포 흐름만 정의한다.
# 첫 고객의 실제 적용 업무와 적용 전 처리 시간·건수는 OQ-002가 별도로 확정한다.

meta:
  status: draft
  scope: "범용 Hub 자체 프로세스"
  baselined: null

processes:
  - id: PRC-01
    name: "실행 환경 준비"
    trigger: "고객사 환경에 Hub를 새로 설치하거나 실행 프로파일을 바꾼다"
    actors: [ACT-009]
    steps:
      - id: PRC-01-01
        name: "환경별 설정과 프로파일 구성"
        actor: ACT-009
        system: "Hub 배포 환경"
        input: "로컬·개발·운영 환경 정보와 모듈별 설정"
        output: "활성 프로파일과 비밀 값 참조가 분리된 실행 설정"
        reqs: [REQ-402]
        rules:
          - "비밀 값과 업무 DB·API 자격증명을 설정 파일에 평문으로 두지 않는다"
          - "화면은 자격증명 자체가 아니라 매핑과 참조 키만 관리한다"
        exceptions:
          - "필수 비밀 값이나 참조 대상이 없으면 해당 프로파일을 활성화하지 않고 누락 항목을 알린다"
    outcome: "선택한 환경에서 모듈이 같은 설정 원칙으로 기동된다"

  - id: PRC-02
    name: "자연어 요청 접수와 응답 전달"
    trigger: "업무 담당자가 portal에서 자연어 요청을 보낸다"
    actors: [ACT-001, ACT-002, ACT-005, ACT-007]
    steps:
      - id: PRC-02-01
        name: "요청 계약 접수"
        actor: ACT-001
        system: "portal · agent 계약 어댑터"
        input: "계약 버전이 명시된 요청"
        output: "접수된 턴 식별자"
        reqs: [REQ-009]
        rules:
          - "portal과 agent는 합의한 요청 스키마만 사용한다"
        exceptions:
          - "지원하지 않는 계약 주 버전이면 조용히 무시하지 않고 접수를 거부한다"
      - id: PRC-02-02
        name: "사용자와 데이터 접근 권한 판정"
        actor: ACT-002
        system: "common 권한 판정 컴포넌트"
        input: "사용자 신원·소속 그룹·요청 대상"
        output: "허용 범위와 마스킹 모드"
        reqs: [REQ-103]
        rules:
          - "허용 그룹 매핑이 없으면 기본값으로 차단한다"
        exceptions:
          - "사용자나 대상의 매핑이 없으면 실행하지 않고 중립적인 거부 사유를 반환한다"
      - id: PRC-02-03
        name: "허용된 데이터로 외부 모델 호출"
        actor: ACT-007
        system: "agent 외부 모델 호출 컴포넌트"
        input: "전송 허용과 마스킹을 적용한 컨텍스트"
        output: "모델 응답과 사용량"
        reqs: [REQ-106]
        rules:
          - "전송 허용 목록 밖의 데이터는 모델 호출 전에 제거한다"
        exceptions:
          - "공급 경로 호출이 실패하면 성공으로 대체하지 않고 턴을 중단 상태로 전환한다"
      - id: PRC-02-04
        name: "처리 사실과 판정 기록"
        actor: ACT-005
        system: "agent 감사 이력 기록"
        input: "요청·판정·호출·응답·비용 정보"
        output: "변경할 수 없는 감사 이력"
        reqs: [REQ-107]
        rules:
          - "기록은 성공·실패와 무관하게 남기며 업무 처리와 별도 트랜잭션으로 확정한다"
        exceptions:
          - "필수 이력을 기록하지 못하면 응답을 성공 처리하지 않는다"
      - id: PRC-02-05
        name: "최종 응답 계약 전달과 표시"
        actor: ACT-001
        system: "agent 응답 계약 · portal 표현 어댑터"
        input: "agent가 통제를 끝낸 최종 응답과 메타데이터"
        output: "portal이 계약상 알고 있는 데이터로 구성한 사용자 응답"
        reqs: [REQ-009, REQ-027]
        rules:
          - "agent는 의미와 데이터를 반환하고 portal은 표시 여부와 표현 방식을 결정한다"
          - "알고 있는 계약의 모르는 선택 필드·표현 블록은 해당 부분만 무시한다"
        exceptions:
          - "계약 자체를 해석할 수 없으면 전체를 무시하지 않고 지원하지 않는 버전으로 처리한다"
    outcome: "사용자는 통제를 거친 결과를 받고 감사 담당자는 같은 처리의 근거를 추적할 수 있다"

  - id: PRC-03
    name: "등록된 업무 API 실행"
    trigger: "사용자 요청에 등록된 업무 액션이 포함된다"
    actors: [ACT-001, ACT-002, ACT-005, ACT-006]
    steps:
      - id: PRC-03-01
        name: "실행 가능성과 승인 필요 여부 판정"
        actor: ACT-002
        system: "common 권한 판정 · agent 실행 통제"
        input: "대상 API·사용자 그룹·파라미터·승인 상태"
        output: "실행 허용 또는 거부"
        reqs: [REQ-105]
        rules:
          - "등록되지 않았거나 그룹 판정에 실패한 API는 실행하지 않는다"
        exceptions:
          - "승인 필요 액션에 명시적 승인이 없으면 비승인으로 처리한다"
      - id: PRC-03-02
        name: "업무 시스템 호출"
        actor: ACT-006
        system: "agent 업무 API 어댑터"
        input: "허용된 API와 마스킹·신원 매핑을 적용한 파라미터"
        output: "업무 시스템의 실행 결과"
        reqs: [REQ-105]
        rules:
          - "Hub는 등록된 방식으로만 호출하고 업무 상태의 원천을 자기 DB에 복제하지 않는다"
        exceptions:
          - "실패하면 그 지점에서 중단하고 남은 액션의 실행 여부를 임의로 판단하지 않는다"
      - id: PRC-03-03
        name: "실행 이력 기록"
        actor: ACT-005
        system: "agent 감사 이력 기록"
        input: "API·파라미터·결과·승인 이력"
        output: "감사 이력"
        reqs: [REQ-107]
        rules:
          - "업무 트랜잭션의 성공·롤백과 무관하게 발생 사실을 기록한다"
        exceptions:
          - "기록 실패는 실행 성공으로 보고하지 않는다"
    outcome: "허용된 업무 액션만 실행되고 결과와 승인 근거가 추적된다"

  - id: PRC-04
    name: "사용자 상태 동기화"
    trigger: "인사 시스템이나 그룹웨어가 퇴직·조직 이동 이벤트를 보낸다"
    actors: [ACT-002, ACT-005, ACT-008]
    steps:
      - id: PRC-04-01
        name: "사용자 변경 이벤트 접수"
        actor: ACT-008
        system: "common 사용자 변경 수신 인터페이스"
        input: "원천 시스템의 사용자 변경 이벤트"
        output: "검증된 변경 요청"
        reqs: [REQ-103]
        rules:
          - "외부 인터넷이 아니라 고객사 폐쇄망 내부의 등록된 원천에서만 받는다"
        exceptions:
          - "원천이나 대상 사용자를 식별하지 못하면 적용하지 않고 실패 이력을 남긴다"
      - id: PRC-04-02
        name: "접근 상태 변경과 기록"
        actor: ACT-002
        system: "common 계정·권한 컴포넌트"
        input: "검증된 퇴직·조직 이동 정보"
        output: "비활성화 또는 관리자 확인 대기 상태"
        reqs: [REQ-103, REQ-107]
        rules:
          - "퇴직은 비활성화하고 조직 이동은 일시 비활성화한 뒤 관리자에게 알린다"
        exceptions:
          - "정책 변경 이력을 남기지 못하면 변경을 성공 처리하지 않는다"
    outcome: "계정 원천의 변경이 Hub 접근 상태에 반영되고 변경 근거가 남는다"

  - id: PRC-05
    name: "계약 버전 배포 전환"
    trigger: "portal과 agent 사이의 계약이나 이를 구현한 서버를 배포한다"
    actors: [ACT-009]
    steps:
      - id: PRC-05-01
        name: "신규 서버군 격리 기동"
        actor: ACT-009
        system: "고객사 배포·트래픽 제어 환경"
        input: "신규 서버 버전과 실행 프로파일"
        output: "사용자 접근이 차단된 신규 서버군"
        reqs: [REQ-402]
        rules:
          - "기존 서버군은 사용자 서비스를 계속하고 신규 서버군에는 운영 트래픽을 보내지 않는다"
        exceptions:
          - "기동 또는 상태 점검이 실패하면 트래픽을 전환하지 않는다"
          - "고객사 환경이 서버군 격리와 일괄 전환을 지원하지 않으면 이 절차를 무중단으로 간주하지 않는다. 계약 호환 롤링 배포를 별도로 검증하거나 계획된 중단 배포로 전환한다"
      - id: PRC-05-02
        name: "요청·응답 계약 시험"
        actor: ACT-009
        system: "Agent 계약 시험 화면"
        input: "지원 계약 버전별 대표 요청"
        output: "agent 응답 원문과 스키마 검증 결과"
        reqs: [REQ-009, REQ-027]
        rules:
          - "계약 시험 화면은 응답을 의미 변환 없이 안전한 원문으로 표시한다"
          - "실제 portal은 계약상 알고 있는 데이터만 처리한다"
          - "계약 시험은 합성 데이터를 기본으로 하고, 운영 응답 원문은 권한을 가진 내부 운영자만 감사 이력을 남기며 예외적으로 열람한다"
        exceptions:
          - "필수 필드·상태·오류 의미가 계약과 다르면 신규 서버군을 활성화하지 않는다"
          - "원문에 허용되지 않은 민감정보가 포함되면 화면에 표시하지 않고 보안 실패로 기록한다"
      - id: PRC-05-03
        name: "신규 서버군으로 접근 전환"
        actor: ACT-009
        system: "고객사 트래픽 제어 환경"
        input: "계약 시험과 상태 점검을 통과한 신규 서버군"
        output: "신규 서버군으로 향하는 사용자 트래픽"
        reqs: [REQ-009]
        rules:
          - "서버 빌드 버전과 API 계약 버전을 같은 것으로 취급하지 않는다"
          - "접수된 턴에는 접수 당시 계약 버전을 기록한다"
        exceptions:
          - "이전 portal이나 진행 중인 턴이 남으면 버전 불일치를 감지해 재접속시키거나 해당 계약을 한시적으로 유지한다"
          - "전환 뒤 핵심 요청이나 상태 조회가 실패하면 이전 DB 구조가 남아 있는 되돌림 기간 안에서 접근을 이전 서버군으로 복귀시킨다"
      - id: PRC-05-04
        name: "이전 서버군 정리"
        actor: ACT-009
        system: "고객사 배포·트래픽 제어 환경"
        input: "이전 계약의 진행 중 턴·접속·되돌림 기간 현황"
        output: "이전 서버군과 계약 경로의 비활성화"
        reqs: [REQ-009]
        rules:
          - "신규 서버 준비뿐 아니라 이전 계약의 진행 중 턴과 기존 클라이언트가 없는 것도 확인한다"
          - "되돌림 기간이 끝나기 전에는 이전 DB 구조를 제거하지 않는다"
        exceptions:
          - "진행 중 요청이나 되돌림 필요성이 남아 있으면 이전 계약 경로를 닫지 않는다"
    outcome: "서버 다중화 환경에서 진행 중 요청을 잃지 않고 계약 버전을 전환한다"

customer_pilot:
  status: deferred
  reason: "첫 고객의 실제 적용 업무·빈도·처리 시간은 고객이 확정된 뒤에만 정의할 수 있다"
  question: "OQ-002"
