# 영역: admin 공통 관리·승인 흐름
usecases:
  - id: UC-001
    name: "관리 대상의 원천·변경 영향·처리 경로를 확인한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - REQ-601
    actors:
      primary:
        - ACT-002
        - ACT-003
        - ACT-004
      secondary: []
    process_step: "PRC-13-01"
    precondition: "해당 관리 대상의 조회 권한이 있다. 변경은 별도 메뉴·액션의 현재 유효 권한으로 판정한다"
    trigger: "기준정보를 등록·수정·비활성화·삭제하거나 변경 이력을 확인하려 한다"
    main_flow:
      - "대상의 안정 식별자와 관리 원천을 확인하고 현재 값·버전·사용 상태를 조회한다"
      - "편집 가능한 속성과 원천에서 관리하는 읽기 전용 속성을 구분한다"
      - "권한 범위 안에서 실제 변경 대상과 참조·사용처·과거 이력의 연결을 확인한다"
      - "대상별 요구사항에 따라 직접 관리 경로인지 기존 관리 승인 대상인지 구분한다"
      - "직접 관리는 UC-002, 승인 대상의 반영 저장·신규 요청은 UC-003으로 연결한다. 이 단계의 화면 표시만으로 승인 방식이나 저장 성공을 확정하지 않는다"
    alternative_flows:
      - id: "A1"
        condition: "신규 등록"
        flow:
          - "관리 식별자와 신규 후보를 구분한다. 변경 전 유효본은 없음으로 표시한다"
      - id: "A2"
        condition: "system 또는 외부 원천이 소유하는 속성"
        flow:
          - "기존 공개 계약과 소유 관리 경로를 안내한다. admin에 관리 원천을 복제하지 않는다"
    exception_flows:
      - id: "E1"
        condition: "참조 조회 실패 또는 조회 권한 부족"
        flow:
          - "참조 없음으로 표시하지 않는다. 제한 사유를 안내하고 확인되지 않은 참조를 근거로 삭제·변경하지 않는다"
      - id: "E2"
        condition: "대상별 제약을 깨뜨리는 삭제·비활성화"
        flow:
          - "현재 값을 유지하고 권한 범위 안에서 영향을 받는 사용처와 보완 대상을 안내한다"
    postcondition: "관리 원천·변경 대상·조회 가능한 영향과 후속 처리 경로가 구분된다. 조회만으로 현재 값이나 요청 상태는 바뀌지 않는다"
    rules_from:
      - "REQ-601.data"
      - "REQ-601.field_usage"
      - "REQ-601.business_rules"
      - "REQ-601.permissions"
    pending:
      - "@defer P3 — 대상별 참조 조회 계약·삭제 후 과거 참조 표시·권한별 공개 필드는 각 기능의 데이터/API/화면 설계에서 확정한다"
    storage_context: "REQ-601.approval_storage. 관리 조회/변경 입력은 현재 적용본, 초안 편집/제출/검토/반려는 SCR-036 요청 문맥, 과거 적용본은 별도 HIST 문맥이다. 후보는 _SNP의 전체 요청 내용이며 업무 REVISION 증가는 실제 반영 성공 때만 발생한다."
  - id: UC-002
    name: "직접 관리 대상의 변경을 검증하고 반영한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-601]
    actors: { primary: [ACT-002, ACT-003, ACT-004], secondary: [] }
    process_step: PRC-13-02
    precondition: "대상별 요구사항에서 직접 관리를 허용한 작업이고 현재 변경 권한이 있다"
    ownership_boundary: "아래 변경 전 이력·현재값의 동시 저장은 REQ-601이 적용되는 admin 소유 기준정보 변경의 계약이다. 기존 system 기능에 새 이력 원장이나 기대 버전 방식을 일괄 강제하지 않는다. system 소유 작업은 해당 공개 계약을 사용하며, CR-026·027의 승인된 계정/설정 목표 변경은 ARCH-029·050과 system 상세 설계에서 별도로 검증한다"
    trigger: "직접 관리 항목의 변경을 저장한다"
    main_flow:
      - "변경 대상·작업 종류·사유·편집 기준 버전과 변경 내용을 전달한다"
      - "서버가 현재 권한과 대상별 입력·참조·사용 상태·기준 버전을 다시 검증한다"
      - "신규는 현재 데이터로 등록하고, 수정·비활성화·허용된 삭제는 대상별 이력 계약에 따라 변경 전 최종 상태를 보존한다"
      - "admin 소유 기준정보는 이력과 현재 데이터 갱신을 함께 성공시키고 실제 적용 결과·버전·시각을 반환한다. system 소유 작업은 아래 A1의 해당 공개 계약으로 결과를 확인한다"
      - "UC-006에서 현재 유효 상태와 변경 근거를 확인한다"
    alternative_flows:
      - { id: A1, condition: "원천이 기존 system 관리 기능", flow: ["해당 소유 공개 서비스의 권한·경합·결과·이력 계약을 사용한다. 일반 사용 이력을 admin 변경 전 전체 스냅샷으로 간주하지 않고 기존 기록을 새 공통 테이블에 복제하지 않는다", "승인된 목표와 현재 구현의 차이는 ARCH-029·050에서 확인한다. 현재 구현만으로 목표 계약 검증 완료를 선언하지 않는다"] }
      - { id: A2, condition: "권한 제거·이용자 비활성화처럼 원래 승인 없는 작업", flow: ["REQ-609의 기존 제거·회수 경로를 따른다. 관리 승인 설정이나 대기 부여 요청 때문에 회수를 지연하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "참조·기준 버전·현재 권한 검증 실패", flow: ["변경하지 않고 현재 상태와 다시 확인할 항목을 반환한다"] }
      - { id: E2, condition: "admin 소유 기준정보의 이력 저장 또는 현재 값 갱신 실패", flow: ["해당 변경의 부분 반영을 남기지 않는다. 성공으로 표시하지 않고 처리 결과를 확인한다. system 소유 작업의 실패 판정·재처리는 그 공개 계약을 따른다"] }
      - { id: E3, condition: "기존 승인 대상 변경을 직접 저장으로 요청", flow: ["직접 반영을 거부한다. UC-003의 승인 방식 판정과 제출본·중복 검증을 거치게 한다"] }
    postcondition: "직접 관리가 허용된 변경만 이력과 일관되게 반영된다. 승인·전결을 수행하지 않은 작업에 승인 이력을 만들지 않는다"
    rules_from: ["REQ-601.business_rules", "REQ-601.audit", "REQ-601.request_integrity.delegated_and_direct"]
    pending:
      - "@defer P3 — 이력 저장 구조·기준 버전·동시 변경 제어와 대상별 소유 공개 서비스는 데이터/API 설계에서 확정한다. 고객사 이력 보존 기간을 임의로 정하지 않는다"

  - id: UC-003
    name: "관리 변경을 승인 요청으로 접수하거나 저장자 전결로 처리한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - REQ-601
    actors:
      primary:
        - ACT-002
        - ACT-003
        - ACT-004
      secondary:
        - ACT-001
    process_step: "PRC-13-02"
    precondition: "기존 관리 승인 대상이며 실제 변경 대상 전부의 등록·변경/요청 권한과 반영 가능한 후보가 있다. Portal에서 시작한 신청의 화면은 해당 작업흐름이 설계한다"
    trigger: "승인 대상 후보를 반영 저장하거나 새 요청으로 제출한다"
    main_flow:
      - "실제 변경 대상의 안정 식별자·작업 종류·기준 유효본·전체 후보·요청 사유·참조 스냅샷을 확인한다"
      - "REQ-601.request_integrity.target_identity로 대상별 미종결 요청과 기준 버전을 검사한다. 복합 세트는 실제 변경 대상 전부를 검사한다"
      - "ARCH-029의 공개 계약으로 실제 변경 대상 종류별 현재 승인 설정 값과 버전을 같은 접수/반영 처리에서 확정한다"
      - "사용 설정이 있으면 전체 제출본을 고정한 요청을 접수하고 UC-004의 해당 업무 절차로 보낸다. 후보를 유효값으로 공개하지 않는다"
      - "실제 변경 대상의 설정이 모두 미사용이면 저장자 자신의 저장 건을 전결한다. 후보·검증·설정 근거·전결 승인·실제 반영 또는 적용 예약을 함께 기록한다"
      - "요청 접수·즉시 반영·적용 예약을 구분해 결과를 반환하고 UC-006으로 연결한다"
    alternative_flows:
      - id: "A1"
        condition: "초안만 저장"
        flow:
          - "접수나 승인으로 기록하지 않고 대상 전체를 선점하지 않는다. 반영 저장/제출 때 다시 검증한다"
      - id: "A2"
        condition: "설정 읽기 실패"
        flow:
          - "REQ-601.approval_policy.read_failure에 따라 true로 판정한다"
          - "현재 권한·참조 검증과 요청·감사 저장이 모두 가능할 때만 수동 승인 요청으로 접수한다"
          - "조회 실패와 관측 불가 버전을 구별해 남기며 전결·유효본 반영은 하지 않는다"
      - id: "A3"
        condition: "지식·카탈로그 등 실제 변경 자산의 승인 설정이 혼합됨"
        flow:
          - "하나라도 사용이면 세트 전체를 해당 자산 승인 절차로 보낸다. 영향 조회만 하는 참조 자산의 설정은 합산하지 않는다"
    exception_flows:
      - id: "E1"
        condition: "기존 미종결 요청·오래된 기준본·권한 또는 참조 검증 실패"
        flow:
          - "전체 접수/반영을 거부한다. 조회 권한 범위에서 충돌을 안내하며 기존 요청은 보존한다"
      - id: "E2"
        condition: "설정 전환과 저장이 경합"
        flow:
          - "일관된 한쪽 설정으로 처리하거나 충돌을 반환한다. 별도 두 번 읽기만으로 원자성을 보장했다고 보지 않는다"
      - id: "E3"
        condition: "후보·요청·감사·전결·반영 또는 적용 예약 저장 실패"
        flow:
          - "함께 실패시키고 부분 활성화·부분 지급을 남기지 않는다. 결과가 불명확하면 완료로 표시하지 않는다"
      - id: "E4"
        condition: "미사용 설정으로 기존 대기 요청을 덮어쓰려 함"
        flow:
          - "전결을 거부한다. 기존 요청의 접수 방식·제출본과 미종결 제한을 유지한다"
    postcondition: "고정된 승인 요청 하나 또는 검증된 전결 반영/예약 결과가 남는다. 실제 수행하지 않은 기술 검토·책임자 승인은 기록하지 않는다"
    rules_from:
      - "REQ-601.approval_policy"
      - "REQ-601.request_integrity"
      - "ARCH-029.target_contract"
    pending:
      - "@defer P3 — 설정 값/버전 확정과 요청·반영을 묶는 물리 트랜잭션, 요청 식별자·버전·조건부 갱신 계약은 후속 데이터/API 설계에서 검증한다"
    storage_context: "REQ-601.approval_storage. 관리 조회/변경 입력은 현재 적용본, 초안 편집/제출/검토/반려는 SCR-036 요청 문맥, 과거 적용본은 별도 HIST 문맥이다. 후보는 _SNP의 전체 요청 내용이며 업무 REVISION 증가는 실제 반영 성공 때만 발생한다."
  - id: UC-004
    name: "고정된 관리 요청을 업무별 절차로 검토·승인한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - REQ-601
    actors:
      primary:
        - ACT-002
        - ACT-003
        - ACT-004
        - ACT-013
      secondary:
        - ACT-001
    process_step: "PRC-13-02"
    precondition: "접수된 요청이 있으며 해당 단계의 현재 유효 권한이 있다. 요청 내용은 고정되고 기존 접수 방식이 유지된다"
    trigger: "담당자가 요청을 조회하고 기술 검토·최종 승인·반려를 처리한다"
    main_flow:
      - "업무별 승인 화면에서 제출본·기준 유효본·요청 근거·현재 영향과 선행 처리 결과를 조회한다"
      - "요청 ID·버전·허용 선행 상태·현재 권한과 해당 업무가 정한 기준 유효본·참조 유효성 조건을 검증한다. 참조 변경 자체를 일괄 반려 사유로 삼지 않는다"
      - "아래 업무별 절차의 현재 단계만 수행하고 의견·판정·실제 처리자를 제출본과 별도 이력으로 남긴다"
      - "최종 승인 조건이 충족되면 해당 기능이 전체 변경 반영 또는 적용 예약을 확정한다. 실패·결과 불명은 정상 종결로 바꾸지 않는다"
      - "UC-006에서 승인 결과와 실제 효력을 구분해 조회한다"
    domain_paths:
      - kind: "지식·예제·카탈로그·태그·업무 API·도구의 자산 변경 세트"
        owner: FEAT-014
        screen: SCR-036
        rules_from:
          - REQ-305
          - REQ-306
          - REQ-607
          - REQ-608
          - REQ-612
        flow: "기술 검토 완료 후 최종 책임자 승인·반려와 세트 일괄 반영. 동일인도 각 단계의 권한이 있으면 순서대로 처리한다. 외부 공동 오픈·코드 검수/배포 통제는 별도로 유지한다"
      - kind: "사용자 신원 매핑·그룹 부여"
        owner: FEAT-038
        screen: SCR-037
        rules_from:
          - REQ-609
          - REQ-616
        flow: "해당 승인 권한자가 승인·반려하고 동일 요청 버전만 활성화한다. 기술 검토 단계를 새로 추가하지 않는다. 제거·회수는 기존 별도 경로를 유지한다"
      - kind: "쿼터 등급 승급"
        owner: FEAT-037
        screen: SCR-035
        rules_from:
          - REQ-116
          - REQ-117
        flow: "신청 등급과 승인 시점의 월 배정 상태를 대조해 적용 월과 예약 결과를 기록한다. 예약 확정은 요청 처리 완료이며 실제 발효일 대기를 반영 실패로 보지 않는다"
      - kind: "이번 달 추가 토큰"
        owner: FEAT-018
        screen: SCR-022
        rules_from:
          - REQ-119
        flow: "신청량 이하 승인량·예외 승인 근거를 별도 처리 결과로 남기고 당월 한도에 반영한다. 월말 만료·미처리 신청 만료·알림은 기존 계약을 따른다"
    alternative_flows:
      - id: "A1"
        condition: "검토 또는 승인 반려"
        flow:
          - "반려 권한·선행 상태를 확인해 사유와 미반영 종결을 기록한다. 수정이 필요하면 UC-005로 연결한다"
      - id: "A2"
        condition: "설정 읽기 장애로 접수한 요청"
        flow:
          - "승인·반영 전에 원천 복구와 현재 권한·참조 검증을 확인한다. 복구된 설정이 미사용이어도 기존 요청을 자동 승인하지 않는다"
      - id: "A3"
        condition: "태그 단독 요청의 영향 지식 리비전·목록 또는 지식 매핑 요청의 참조 태그 텍스트가 변경됨"
        flow:
          - "REQ-306.version_guard·REQ-607에 따라 차이를 표시하되 그 변화만으로 자동 반려하지 않는다"
          - "실제 변경 대상의 기준 버전·태그 ID 연결 가능 상태와 당시 지식 리비전 보존은 검증한다"
    exception_flows:
      - id: "E1"
        condition: "권한 회수·제출본 불일치·선행 단계 미완료 또는 해당 업무의 기준본·참조 유효성 검증 실패"
        flow:
          - "허용되지 않은 단계 전이·반영을 거부한다. 변경 필요 시 기존 요청의 미반영 종결 후 새 요청으로 검토한다"
      - id: "E2"
        condition: "승인과 취소·반려·제거가 경합하거나 같은 처리가 재전송됨"
        flow:
          - "유효하게 확정된 상태에 따라 한 번만 처리한다. 기존 결과를 반환하거나 거부하며 오래된 승인으로 권한·한도를 되살리지 않는다"
      - id: "E3"
        condition: "반영 실패 또는 실제 결과 불명"
        flow:
          - "기존 요청과 근거를 보존하고 UC-006에서 결과를 확인한다. 단순 취소로 미종결 제한을 해제하지 않는다"
    postcondition: "업무별 단계·권한·효력 시점에 맞는 처리 근거가 남으며 제출 원문·기존 메뉴 경계는 유지된다"
    rules_from:
      - "REQ-601.approval_policy"
      - "REQ-601.request_integrity.domain_results"
      - "REQ-601.request_integrity.race_and_completion"
    pending:
      - "@defer P3 — REQ-609.open의 신원 ID 교체 대기 중 기존 활성 매핑 처리·승인 근거·요청 만료 운영은 사용자 접근 상세 설계에서 확인한다. 이 초안에서 임의 기본값을 정하지 않는다"
    storage_context: "REQ-601.approval_storage. 관리 조회/변경 입력은 현재 적용본, 초안 편집/제출/검토/반려는 SCR-036 요청 문맥, 과거 적용본은 별도 HIST 문맥이다. 후보는 _SNP의 전체 요청 내용이며 업무 REVISION 증가는 실제 반영 성공 때만 발생한다."
  - id: UC-005
    name: "미반영 요청을 종결하고 변경된 내용으로 새 요청을 제출한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - REQ-601
    actors:
      primary:
        - ACT-002
        - ACT-003
        - ACT-004
      secondary:
        - ACT-001
        - ACT-013
    process_step: "PRC-13-02"
    precondition: "제출 내용 변경이 필요하며 해당 요청의 현재 상태와 취소/변경 권한을 확인할 수 있다"
    trigger: "요청자가 제출 후 내용을 바꾸거나 반려된 변경을 다시 제출하려 한다"
    main_flow:
      - "현재 요청 ID·버전·처리 상태와 실제 반영 여부를 조회한다"
      - "허용된 상태에서 취소하거나 이미 반려·만료 등 미반영 종결인지 확인한다. 제출 원문은 편집하지 않는다"
      - "이전 요청의 제출본·검토·승인/취소 근거를 보존하고 새 후보와 전후 요청 연결을 만든다"
      - "새 요청 ID·스냅샷·현재 기준본으로 UC-003을 다시 수행한다. 이전 검토·승인 완료 상태를 승계하지 않는다"
    alternative_flows:
      - id: "A1"
        condition: "이미 유효값에 반영된 변경을 되돌리려 함"
        flow:
          - "완료 요청 취소가 아닌 새 변경 절차로 진행한다. 과거 상태를 현재 유효본에 직접 덮어쓰지 않는다"
    exception_flows:
      - id: "E1"
        condition: "승인 후 반영 중·반영 실패 복구 중·결과 불명"
        flow:
          - "취소 완료로 바꾸지 않고 UC-006에서 기존 결과를 확인한다. 같은 대상의 새 요청 제한을 유지한다"
      - id: "E2"
        condition: "취소와 승인 경합 또는 이전 요청의 늦은 승인 도착"
        flow:
          - "확정된 상태를 기준으로 중복 전이를 거부한다. 무효 요청의 승인으로 새 후보나 권한을 활성화하지 않는다"
      - id: "E3"
        condition: "새 요청 접수 전 권한·기준본·다른 요청 상태가 바뀜"
        flow:
          - "새 접수를 거부하고 현재 조건을 다시 확인한다. 이전 요청의 승인 근거로 우회하지 않는다"
    postcondition: "이전 요청의 근거가 보존되고 새 요청은 독립된 제출본과 검토·승인 결과를 갖는다"
    rules_from:
      - "REQ-601.request_integrity.change_and_resubmit"
      - "REQ-601.request_integrity.decision_binding"
      - "REQ-601.request_integrity.race_and_completion"
    storage_context: "REQ-601.approval_storage. 관리 조회/변경 입력은 현재 적용본, 초안 편집/제출/검토/반려는 SCR-036 요청 문맥, 과거 적용본은 별도 HIST 문맥이다. 후보는 _SNP의 전체 요청 내용이며 업무 REVISION 증가는 실제 반영 성공 때만 발생한다."
  - id: UC-006
    name: "관리 변경의 처리 결과·실제 효력·이력을 확인한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - REQ-601
    actors:
      primary:
        - ACT-002
        - ACT-003
        - ACT-004
      secondary:
        - ACT-001
        - ACT-005
        - ACT-013
    process_step: "PRC-13-03"
    precondition: "대상 또는 요청이 식별되며 이력·결과의 조회 권한이 있다"
    trigger: "저장·접수·승인 뒤 결과를 확인하거나 통신 실패 후 같은 처리의 결과를 대조한다"
    main_flow:
      - "대상·요청 식별자로 제출본·기준 유효본·단계별 처리·설정 근거와 현재 유효값을 연결해 조회한다"
      - "초안·승인 대기·검토/승인 결과와 실제 반영 완료·적용 예약·실패/결과 불명을 구분해 표시한다. 실제 상태 코드는 해당 업무 상세 설계가 정한다"
      - "변경 전 최종 상태와 변경 순서·실제 처리자·시각·사유를 권한 범위 안에서 확인한다"
      - "재전송이면 동일 처리의 기존 결과를 대조한다. 새 승인·지급·활성화를 발생시키지 않는다"
      - "미반영 종결이면 UC-005의 새 요청, 반영 완료 뒤 재변경이면 UC-001, 미완료/불명이면 기존 요청의 결과 확인 경로를 유지한다"
    alternative_flows:
      - id: "A1"
        condition: "미래 적용 예약이 확정됨"
        flow:
          - "요청 처리 완료와 실제 적용 월을 함께 보여 준다. 발효일 대기를 실패나 미종결 요청으로 표시하지 않는다"
      - id: "A2"
        condition: "연결 조사·검토 작업이 있음"
        flow:
          - "REQ-305·306·307에 따라 실제 반영 근거를 연결한다. 관리 요청 완료만으로 조사 해결 검증을 완료 처리하지 않는다"
    exception_flows:
      - id: "E1"
        condition: "원천 조회 불가·근거 연결 누락"
        flow:
          - "정상 적용으로 표시하지 않는다. 확인되지 않은 결과와 조회 실패를 구별해 안내한다"
      - id: "E2"
        condition: "이력에 비밀값·권한 밖 개인정보·업무 데이터가 있음"
        flow:
          - "기존 저장·마스킹·열람 통제를 적용한다. 사용처/이력 조회로 권한을 우회하지 않는다"
    postcondition: "승인 판정과 실제 효력이 구분되고 같은 변경의 근거를 추적할 수 있다. 조회 자체가 반영이나 재실행을 유발하지 않는다"
    rules_from:
      - "REQ-601.audit"
      - "REQ-601.permissions"
      - "REQ-601.request_integrity.scheduled_effect"
      - "REQ-601.request_integrity.race_and_completion"
    pending:
      - "@defer P3 — 반영 결과 불명·실패 복구의 대상별 조회/재처리 계약과 이력 공개 필드를 데이터/API/화면 설계에서 구체화한다. 신규 복구 메뉴를 이 초안으로 확정하지 않는다"
    storage_context: "REQ-601.approval_storage. 관리 조회/변경 입력은 현재 적용본, 초안 편집/제출/검토/반려는 SCR-036 요청 문맥, 과거 적용본은 별도 HIST 문맥이다. 후보는 _SNP의 전체 요청 내용이며 업무 REVISION 증가는 실제 반영 성공 때만 발생한다."
