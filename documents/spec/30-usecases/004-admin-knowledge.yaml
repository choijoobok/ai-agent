# 영역: 지식·공통 태그·자산 변경 요청·예방적 검토. 업무 규칙의 정본은 rules_from이다.
usecases:
  - id: UC-010
    name: "지식 본문과 독립 참조·도구별 사용 설명을 후보로 작성한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-303]
    actors: { primary: ACT-003, secondary: [] }
    process_step: PRC-09-02
    precondition: "지식 작성 권한과 업무 근거가 있고 참조할 자산의 현재 사용 가능성·버전을 확인할 수 있다"
    trigger: "지식을 신규 작성하거나 본문·접근 그룹·태그 ID·참조 링크·매핑별 설명을 변경한다"
    main_flow:
      - "업무 의미·일반 절차를 본문에 작성하고 접근 그룹을 지정한다. 물리명·SQL은 카탈로그·인증 예제, 특정 도구의 호출 안내는 해당 매핑 설명으로 구분한다"
      - "인증 예제와 직접 카탈로그를 각각 0개 이상 독립 선택한다. 직접·예제 경유·양쪽 경로와 버전을 합산 조회하되 예제의 참조를 직접 매핑으로 저장하지 않는다"
      - "태그 ID와 업무 API·커스텀 도구를 각각 연결하고 도구 매핑마다 용도·사용 조건·입력 확보·결과 안내·질문/선택별 후속 절차를 작성한다"
      - "API·도구의 공통 입력/결과 가이드와 계약은 원천에서 참조하고 매핑 설명의 누락·역할 중복·원천과의 충돌을 검수한다"
      - "현재 기준 리비전·본문·그룹·링크·매핑 설명·각 참조 버전을 전체 후보로 보존한다. 검수가 끝난 변경은 UC-012로 인계한다"
      - "UC-006에서 실제 반영을 확인한다. 승인된 연결도 현재 접근 권한·활성·검증 조건을 통과한 경우에만 후보 구성과 주입에 사용한다"
    alternative_flows:
      - { id: A1, condition: "특정 데이터 객체나 도구가 없는 일반 업무 지식", flow: ["예제·카탈로그·도구 연결을 강제하지 않는다. 지식 접근 그룹과 본문 검수는 유지한다"] }
      - { id: A2, condition: "여러 데이터소스·스키마의 카탈로그를 연결", flow: ["참조에서 소속을 얻고 지식에 별도 데이터소스/스키마 목록을 중복 저장하지 않는다. 합산을 권한 확대나 데이터소스 간 SQL 조인 허용으로 해석하지 않는다"] }
      - { id: A3, condition: "예제 또는 도구 연결을 해제", flow: ["승인·반영된 새 후보부터 해당 경로/매핑 설명을 제외한다. 다른 직접·예제 경로와 자산 자체는 유지한다"] }
      - { id: A4, condition: "매핑 설명만 변경하거나 과거 상태를 복원", flow: ["새 지식 후보의 전체 스냅샷으로 처리한다. 과거 승인·실행 근거를 현재 값으로 치환하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "본문에 물리명·SQL·특정 도구 호출 안내를 중복 작성", flow: ["해당 원천·매핑 편집으로 안내하고 검수 전 유효 반영하지 않는다. 자동 탐지만으로 완전 검수를 가정하지 않는다"] }
      - { id: E2, condition: "참조 미등록·사용 불가·버전 충돌 또는 매핑 설명 누락/계약 충돌", flow: ["보완할 후보로 유지하고 임의 버전 선택·계약 복제·유효 매핑 반영을 하지 않는다"] }
      - { id: E3, condition: "접근 그룹 없음 또는 현재 권한/필수 참조 판정 실패", flow: ["REQ-303.example_catalog_mapping.security에 따라 지식·직접 참조·예제의 사용 가능성을 구분한다. 권한 밖 필수 참조를 일부 숨긴 불완전한 예제를 주입하지 않는다"] }
    postcondition: "자산별 정본을 복제하지 않는 지식 전체 후보와 변경 요청이 연결되고 과거 직접·간접 참조를 당시 버전으로 재현할 근거가 남는다"
    rules_from: ["REQ-303.detail", "REQ-303.example_catalog_mapping", "REQ-303.tool_usage_mapping", "REQ-303.custom_tool_mapping", "REQ-303.result_guidance", "REQ-303.query_constraint_boundary"]
    pending:
      - "@defer P3 — 본문/매핑 역할 검수의 입력·자동 탐지와 사람 검수, 참조 합산·매핑별 설명/원천 가이드·충돌 표시를 데이터/API/화면·시험으로 설계한다"

  - id: UC-011
    name: "공통 태그·동의어 후보와 연결 지식의 영향 차이를 확인한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-607]
    actors: { primary: ACT-003, secondary: [] }
    process_step: PRC-09-05
    precondition: "태그 정의의 작성/변경 권한이 있고 해당 태그와 조회 가능한 연결 지식의 근거를 확인할 수 있다"
    trigger: "공통 태그를 등록하거나 검색 텍스트·동의어를 변경한다"
    main_flow:
      - "검색 텍스트와 별개의 고정 태그 ID를 확인하고 태그 정의·현재 운영 버전의 변경 후보를 작성한다"
      - "연결 지식 ID·당시 리비전·태그 ID 매핑을 영향 확인 근거로 조회한다. 단순 영향 조회 대상을 실제 변경 세트에 넣지 않는다"
      - "변경 전후 태그와 당시 연결 근거를 후보/요청 스냅샷으로 보존해 UC-012로 인계한다. 요청 접수/전결은 태그 종류의 승인 설정과 UC-003을 따른다"
      - "검토·승인 시 요청 당시와 현재 연결 지식의 추가·제거·리비전 차이를 확인하고 원 요청과 별도의 승인 근거를 남긴다"
      - "유효 반영 시 태그 정의만 바꾸고 기존 지식 리비전·태그 ID 매핑을 유지한다. UC-006에서 당시 표현·목록과 실제 반영을 확인한다"
    alternative_flows:
      - { id: A1, condition: "지식에 연결할 태그 ID를 추가·제거·교체", flow: ["태그 정의 변경 대신 UC-010의 지식 후보로 작성한다. 같은 세트에서 둘 다 수정하면 실제 변경한 태그·지식 각각을 검사한다"] }
      - { id: A2, condition: "태그 요청 대기 중 연결 지식이 바뀜 또는 지식 요청 대기 중 태그 텍스트가 바뀜", flow: ["참조/영향 차이만으로 서로의 변경을 잠그거나 자동 반려하지 않는다. 실제 변경 대상의 기준 버전과 태그 ID의 연결 가능 상태는 검증한다"] }
    exception_flows:
      - { id: E1, condition: "같은 실제 변경 대상에 미종결 요청이 있거나 기준 버전이 다름", flow: ["UC-003의 중복·기준본 검사로 차단하고 기존 요청·유효 상태를 유지한다"] }
      - { id: E2, condition: "신규 연결할 태그 ID가 없거나 연결 불가", flow: ["해당 지식 매핑 반영을 막는다. 텍스트만 달라진 경우와 구분한다"] }
      - { id: E3, condition: "태그 요청 반려·반영 실패 또는 영향 근거 열람 권한 부족", flow: ["기존 태그 정의와 별도로 승인·반영된 지식 변경을 유지한다. 근거 연결을 통해 권한 밖 지식이나 과거 본문을 노출하지 않는다"] }
    postcondition: "태그 자체 변경과 지식 매핑 변경의 대상·이력이 구분되며 운영 검색은 유효 태그 정의와 현재 지식 접근 통제를 따른다"
    rules_from: ["REQ-607.business_rules", "REQ-607.data", "REQ-607.exceptions", "REQ-601.request_integrity", "REQ-306.version_guard"]
    pending:
      - "@defer P3 — SCR-010의 독립/지식 편집 통합 여부와 버전·관계 스냅샷·검색 색인·턴 내 태그 버전 계약은 원래 화면/데이터 상세 설계에서 정한다"

  - id: UC-012
    name: "자산 변경 세트를 제출하고 기술 검토·최종 판정·일괄 반영한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-305, REQ-306]
    actors: { primary: ACT-003, secondary: [ACT-013] }
    process_step: PRC-09-05
    precondition: "자산 변경의 전체 후보·영향·사유와 필요한 외부 시험/감수 근거가 있고 해당 작업의 현재 유효 권한을 확인할 수 있다"
    trigger: "단독 또는 복합 자산 후보를 운영에 반영하려 한다"
    main_flow:
      - "지식·예제·카탈로그·태그·업무 API·도구 중 실제 변경 대상을 구성하고 내용·접근 그룹·참조 매핑·설명·기준본을 후보에 포함한다"
      - "조사·예방적 검토 또는 일반 변경의 자체 근거를 연결하고 직접·간접 참조 영향을 대조한다. 필요한 참조 버전 전환도 세트에 포함하며 참조만 하는 자산은 변경 대상으로 점유하지 않는다"
      - "UC-003으로 미종결 요청·전체 제출본·현재 승인 설정을 판정한다. 수동 승인 요청이면 제출본을 고정하고 전결이면 같은 검증·스냅샷·일괄 반영 계약을 적용한다"
      - "수동 승인 경로에서는 PRC-09-07의 기술 검토 권한자가 내용·매핑·접근 범위·시험 근거를 검토하고 완료 또는 사유 있는 반려를 기록한다"
      - "기술 검토 완료 건만 PRC-09-06의 최종 승인 권한자가 업무 영향·반영 범위를 판정한다. 각 단계의 현재 권한이 있으면 동일인이 순서대로 처리할 수 있다"
      - "최종 승인 또는 전결 반영 시 REQ-306.version_guard의 대상 기준본·참조 최신성·세트 내 후보 정합성을 검증하고 세트 전체를 함께 반영한다"
      - "UC-006의 결과 리비전·시각·범위를 원 조사/검토에 연결한다. 필요한 변경의 실제 반영과 원 문제 해결 확인에 따라 각 작업의 완료를 별도로 판단한다"
    alternative_flows:
      - { id: A1, condition: "지식 변경 없이 예제·카탈로그·태그·API·도구만 변경", flow: ["단독 변경도 동일한 세트 경로를 사용한다. 의미 없는 지식 후보나 조사·검토 작업을 만들지 않는다"] }
      - { id: A2, condition: "승인 설정이 미사용 또는 실제 변경 종류별로 혼합됨", flow: ["UC-003·REQ-601의 전결/혼합 세트 판정을 사용한다. 수행하지 않은 사람의 기술 검토·최종 승인을 기록하지 않는다"] }
      - { id: A3, condition: "검토·승인 반려 또는 제출 내용 변경 필요", flow: ["미반영 종결·취소와 새 요청은 UC-005를 따른다. 이전 요청·근거를 보존하고 UC-003에서 현재 승인 설정으로 새 처리 방식을 판정한다. 수동 승인 경로이면 기술 검토부터 다시 수행하며 전결 경로에서도 전체 검증·스냅샷·반영 계약을 유지한다"] }
      - { id: A4, condition: "태그 영향 지식 목록 또는 지식 매핑의 태그 텍스트만 변경됨", flow: ["UC-011의 독립 변경 예외를 적용한다. 실제 변경 대상·태그 연결 가능성 검증과 당시 근거 보존은 유지한다"] }
    exception_flows:
      - { id: E1, condition: "후보·사유·필요 증빙 누락, 기준본 충돌 또는 한 대상의 미종결 요청 중복", flow: ["전체 접수를 거부하고 기존 운영본·요청을 유지한다. 세트 일부만 별도 접수하지 않는다"] }
      - { id: E2, condition: "현재 권한 부족 또는 기술 검토 미완료", flow: ["해당 단계 전이를 거부한다. 최종 승인 권한으로 기술 검토 권한을 대신하지 않는다"] }
      - { id: E3, condition: "업무별 기준본·참조 최신성·직접/간접 버전 정합성 실패", flow: ["REQ-306에 따라 세트 전체를 반려하고 차이를 남긴다. 참조 버전을 임의 선택하거나 타 자산의 매핑을 검토 없이 갱신하지 않는다"] }
      - { id: E4, condition: "승인 뒤 반영 경합·실패·결과 불명", flow: ["부분 활성화와 정상 종결을 막고 UC-006에서 결과를 확인한다. 미종결 요청 제한과 연결 검토의 미해결 상태를 유지한다"] }
    postcondition: "단계별 불변 근거와 실제 일괄 반영 결과가 연결된다. 승인 판정만으로 운영 사용·검토 완료·조사 해결을 확정하지 않는다"
    rules_from: ["REQ-305.business_rules", "REQ-305.hard_rule", "REQ-306.request_guard", "REQ-306.evidence", "REQ-306.catalog_boundary", "REQ-306.version_guard", "REQ-306.shared_impact", "REQ-601.approval_policy"]
    pending:
      - "@defer P3 — 후보·요청·단계별 스냅샷과 현재 유효본의 물리 구조, 설정·권한·참조 검증과 일괄 반영의 동시성/복구 계약, 화면 상태·시퀀스·시험을 설계한다"

  - id: UC-013
    name: "고객사 변경의 예방적 지식 검토 작업을 등록하고 근거에 따라 종결한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-307]
    actors: { primary: ACT-003, secondary: [ACT-010, ACT-014] }
    process_step: PRC-09-04
    precondition: "변경 통지·카탈로그 영향 근거가 있고 검토 등록·판정·완료의 현재 액션 권한을 확인할 수 있다"
    trigger: "실행 오류 유무와 관계없이 스키마·기준정보·업무 의미 등의 변경 영향을 검토해야 한다"
    main_flow:
      - "변경 출처·내용·적용 시점·영향 자산의 안정 ID와 검토 당시 활성 리비전을 확인한다"
      - "같은 자산의 열린 검토 작업이 있으면 새 근거를 연결하고, 없으면 검토 필요 작업을 등록한다"
      - "검토 중으로 처리하며 영향·보완 방향과 수정 필요 또는 수정 불필요의 근거를 기록한다. 정상 실행이나 구조 비교 결과만으로 의미상 안전을 단정하지 않는다"
