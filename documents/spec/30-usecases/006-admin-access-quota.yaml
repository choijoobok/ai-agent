# 영역: admin Portal 이용자·접근 권한·월별 쿼터
usecases:
  - id: UC-023
    name: "공통 계정에 Portal 이용 자격을 등록·활성화한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-616]
    actors: { primary: [ACT-002, ACT-004], secondary: [] }
    process_step: PRC-13-01
    precondition: "Portal 이용자 관리 권한과 계정 원천·본인 식별 근거가 있다"
    trigger: "신규 이용자를 등록하거나 기존 계정에 Portal 자격을 연결·재활성화한다"
    main_flow:
      - "기존 공통 계정 연결과 신규 자체 계정 생성을 구분하고 원천·기존 Portal 등록 여부를 확인한다"
      - "자체 계정의 허용 작업은 system 공개 계약으로, 외부 원천의 신원/프로필은 읽기 전용으로 처리한다"
      - "Portal 프로필·승인된 활성 그룹·등급·현재 신원 매핑을 확인한다. 부여는 UC-024, 월별 배정은 UC-027의 기존 계약으로 연결한다"
      - "활성 그룹 1개 이상과 등급 등 이용 조건을 검증해 등록/활성화 결과를 기록한다. 같은 월 배정이 있으면 유지하고 없으면 신규 배정 계약으로 인계한다"
      - "계정 생성·연결·Portal 등록·배정의 실제 처리 결과와 재처리 지점을 구분해 UC-006으로 확인한다"
    alternative_flows:
      - { id: A1, condition: "동일인이 관리자와 Portal 이용 자격을 함께 가짐", flow: ["공통 계정을 참조하되 두 자격을 독립 관리한다. 한 자격으로 다른 자격이나 관리자 역할을 자동 생성하지 않는다"] }
      - { id: A2, condition: "외부 인증 성공 또는 재활성화", flow: ["현재 Portal 등록·그룹·등급 조건을 다시 확인한다. 인증 성공만으로 이용 자격·레거시 신원을 부여하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "활성 그룹/등급 미충족 또는 원천 충돌", flow: ["이용 가능으로 표시하지 않고 필요한 승인/원천 정정을 안내한다"] }
      - { id: E2, condition: "공통 계정 처리 이후 등록/배정 일부 실패", flow: ["이미 생성된 계정·배정을 중복 생성하지 않는다. 실제 완료 상태를 확인해 미완료 절차만 재처리한다"] }
    postcondition: "Portal 자격과 공통 계정·해당 월 배정의 상태가 구분되고 이력이 연결된다. 다른 모듈의 관리 권한은 자동 확대되지 않는다"
    rules_from: ["REQ-616.business_rules", "REQ-616.lifecycle", "REQ-116.business_rules", "REQ-116.empty_population"]
    pending: ["@defer P3 — CR-027의 system 공개 계약·등록/배정 재처리·원천 읽기 전용·활성화 경합을 설계한다. 현재 구현 완료로 간주하지 않는다"]

  - id: UC-024
    name: "이용자 신원·그룹의 부여를 판정하고 권한을 회수한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-609]
    actors: { primary: ACT-002, secondary: [] }
    process_step: PRC-13-04
    precondition: "요청·승인·회수 중 수행 작업의 현재 액션 권한이 있고 대상 이용자/그룹/연결의 근거가 있다"
    trigger: "대상별 신원 또는 그룹 소속을 추가·변경하거나 기존 접근을 제거한다"
    main_flow:
      - "이용자와 대상 종류/안정 식별자 또는 그룹, 현재 유효 매핑·부여 사유·신원 근거를 확인한다"
      - "새 부여·신원 변경은 UC-003으로 접수/전결한다. 사용 모드의 승인·반려는 사용자 접근 권한 승인 경로에서 현재 승인 권한으로 처리한다"
      - "고정 제출본·기준 버전·현재 권한을 재검증하고 판정한 같은 요청 버전만 활성화한다. 자산의 기술 검토 단계를 끼워 넣지 않는다"
      - "UC-006으로 요청/유효 권한/회수 결과를 구분해 확인한다. 실제 데이터·API 접근은 현재 원천 권한으로 다시 판정한다"
    alternative_flows:
      - { id: A1, condition: "권한 제거·이용자 비활성화", flow: ["PRC-13-05의 승인 없는 즉시 회수로 처리한다. 마지막 활성 그룹 제거는 이용자 비활성화와 함께 수행한다. 대기 부여 요청 때문에 회수를 지연하지 않는다"] }
      - { id: A2, condition: "기본 신원 규칙 변경·대량 등록·동기화", flow: ["신규 부여/ID 변경의 동일 승인 경로를 적용한다. 사용자별 예외 우선순위와 서비스 계정/실행 사용자 신원 구분을 유지한다"] }
      - { id: A3, condition: "과거 권한을 다시 부여하거나 제출본 수정", flow: ["복원은 새 후보로 판정한다. 진행 요청 수정은 UC-005의 취소·새 요청 절차를 따른다"] }
    exception_flows:
      - { id: E1, condition: "취소·회수 뒤 늦은 승인 또는 중복 제출", flow: ["권한을 부활시키거나 중복 부여하지 않고 현재 상태를 안내한다"] }
      - { id: E2, condition: "신원 매핑 부재 또는 신원 증빙/참조 불일치", flow: ["임의 사용자 ID로 대체하지 않는다. 신원은 있으나 권한 원천의 허용 행이 없어 조회 0건인 경우와 구분한다"] }
    postcondition: "유효한 부여/회수만 현재 권한에 반영되고 요청·반려·취소본은 접근 권한이 되지 않는다"
    rules_from: ["REQ-609.business_rules", "REQ-609.request_guard", "REQ-609.permissions", "REQ-609.lifecycle", "REQ-103.exceptions"]
    pending: ["@defer P3 — 신원 교체 대기 중 기존 매핑 유지/중지·인정 증빙·요청 만료는 REQ-609.open을 유지한다. 현재 버전·승인/회수 경합과 대상별 오류 계약을 설계한다"]

  - id: UC-025
    name: "Hub 사용자 그룹의 정의와 참조를 관리한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-605]
    actors: { primary: ACT-002, secondary: [] }
    process_step: PRC-13-01
    precondition: "Hub 그룹 정의 관리 권한이 있다"
    trigger: "그룹을 생성·변경·비활성화하거나 미사용 그룹을 삭제하려 한다"
    main_flow:
      - "전역 그룹 식별·설명·사용 상태와 소속 이용자·자산/정책의 사용처를 확인한다"
      - "그룹 자체의 허용된 정의 변경을 UC-002로 검증·반영한다"
      - "이름 변경과 안정 식별자·과거 이력을 구분하고 UC-006으로 현재 상태를 확인한다"
    alternative_flows:
      - { id: A1, condition: "사용자 소속 또는 자산의 접근 그룹을 변경", flow: ["그룹 정의 변경과 분리해 사용자 부여/회수는 UC-024, 자산 접근 정책은 UC-026으로 연결한다"] }
    exception_flows:
      - { id: E1, condition: "사용 중 그룹 삭제 또는 참조 조회 실패", flow: ["사용처 없음으로 처리하지 않고 참조를 안내해 삭제를 차단한다"] }
      - { id: E2, condition: "그룹 생성으로 메뉴 역할·쿼터 등급·자산 권한을 자동 부여", flow: ["독립 관리 대상임을 안내하고 해당 업무의 별도 판정 경로를 유지한다"] }
    postcondition: "그룹 정의와 안정 참조가 유지되며 그룹 자체 관리가 사용자/자산 권한 부여를 대신하지 않는다"
    rules_from: ["REQ-605.business_rules", "REQ-605.lifecycle", "REQ-601.business_rules"]
    pending: ["@defer P3 — 그룹 참조/사용 상태·허용 비활성화/삭제·식별자 보호와 영향 표시를 상세화한다"]

  - id: UC-026
    name: "자산 접근 매핑과 직접 보안 정책을 정해진 경로로 변경한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-611]
    actors: { primary: ACT-002, secondary: [ACT-003] }
    process_step: PRC-09-03
    precondition: "정책 종류별 관리 권한과 현재 대상·그룹·신원/필터 근거가 있다"
    trigger: "카탈로그/API 접근 매핑·열람/마스킹·행 스코프·기본 필터를 변경한다"
    main_flow:
      - "정책 종류·소유 원천·전체 현재 값과 참조·적용 영향을 확인한다"
      - "카탈로그 자산 접근 그룹은 카탈로그 전체 후보, API 허용 그룹·응답 통제는 API 전체 후보로 UC-012에 인계한다"
      - "직접 관리인 카탈로그 열람 모드·공통 마스킹 변환·행 스코프·기본 필터는 UC-002로 처리한다. 이를 자산 승인 모드로 일괄 전환하지 않는다"
      - "그룹 허용 합집합·원본/마스킹/차단 판정과 행 스코프·기본 필터의 전체 AND 조건, 해제 가능 여부·신원 출처를 검수한다"
      - "불변 전체 스냅샷·사유·실제 적용과 기존 알림 근거를 남기고 현재 상태·정책 이력으로 확인한다"
    alternative_flows:
      - { id: A1, condition: "기본 필터의 명시적 제외 요청", flow: ["REQ-103·611의 대상·규칙/리비전·사유·요청 근거를 검사한다. 행 스코프·해제 불가 필터·카탈로그 필수 조회 제약은 제외로 해제하지 않는다"] }
      - { id: A2, condition: "과거 정책 복원", flow: ["과거 이력을 덮지 않고 현재 권한·참조를 다시 검증하는 새 변경으로 처리한다"] }
    exception_flows:
      - { id: E1, condition: "권한 테이블 중복으로 행/집계 증가 또는 일부 행 스코프 생략", flow: ["정상 정책으로 반영하지 않는다. REQ-103의 모든 규칙 결합과 중복 방지 조건을 검증한다"] }
      - { id: E2, condition: "현재 신원·참조·기준 리비전·변경 이력 저장 실패", flow: ["부분 적용이나 확인되지 않은 정책 복원을 성공으로 표시하지 않는다"] }
    postcondition: "정책 종류에 맞는 승인/직접 반영과 원천·전체 스냅샷을 추적할 수 있다. 과거 정책이나 관리 승인이 현재 동의·권한을 대체하지 않는다"
    rules_from: ["REQ-611.business_rules", "REQ-611.query_constraint_boundary", "REQ-611.consent_policy_link", "REQ-103.business_rules", "REQ-608.business_rules"]
    pending: ["@defer P3 — 정책별 원천·입력 모델·AND/합집합·제외 명세와 조건부 반영/알림의 원자성·실행 시 검증을 설계한다"]

  - id: UC-027
    name: "등급·월 계획을 확정하고 개인 기본 한도를 배정한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-116, REQ-118, REQ-606]
    actors: { primary: ACT-004, secondary: [] }
    process_step: PRC-12-01
    precondition: "월별 계획·등급 관리 권한과 계획 단가·금액·보정률의 근거가 있다"
    trigger: "다음 달 계획을 확정하거나 월 전환·신규 등록/재활성화에 따른 배정을 처리한다"
    main_flow:
      - "그룹/메뉴 역할과 독립적인 등급·양수 가중치·허용 모델·이전 등급과 적용 월을 확인한다"
      - "확정 단가·계획 가능 금액·보정률·활성 인원으로 기존 산식의 총 풀·개인 한도를 미리 보고 관리자 보정 근거를 기록한다"
      - "다음 달 배정을 정해진 기한까지 확정하고 확정/승계확정 월의 입력과 결과를 보존한다"
      - "신규 이용자는 원칙상 최저 등급으로 등록 유효일을 포함한 남은 일수의 일할 한도를 배정한다. 같은 월 배정은 유지하며 첫 사용 전 최초 등급 정정만 기존 재계산 규칙을 적용한다"
      - "기준·배정·사용량·실제 적용 월을 분리해 확인한다. 신규 유입 때문에 기존 이용자 한도를 다시 산정하지 않는다"
    alternative_flows:
      - { id: A1, condition: "월말까지 다음 달 미확정", flow: ["직전 확정 월의 계획 금액·보정 단가·가중치를 승계하고 월초 활성 인원으로 산정한다. 개인 잔여 토큰 이월과 구분한다. 직전 확정 월이 없으면 첫 확정 전 시작을 막는다"] }
      - { id: A2, condition: "활성 이용자 0명", flow: ["월 계획은 확정하되 개인 기준은 미산정으로 둔다. 해당 월 최초 활성 인원이 생길 때 한 번만 기준/배정을 만들고 이후에도 이를 유지한다. 다시 0명이 되어도 미산정으로 되돌리지 않는다"] }
      - { id: A3, condition: "관리자 직접 등급 변경·강등 또는 등급 폐지/통합", flow: ["사유와 이전 등급을 정하고 다음 달 확정 전이면 다음 달, 확정 뒤면 그다음 달로 적용한다. 당월/과거 한도를 소급 변경하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "가중치 순서/소수 자릿수 오류·폐지 등급의 이전 대상 없음", flow: ["해당 월을 확정하지 않고 보완한다"] }
      - { id: E2, condition: "동시 활성화·월 전환·배정 재전송", flow: ["같은 월 기준과 개인 배정을 중복 생성하지 않는다. 실제 확정 결과를 확인한다"] }
    postcondition: "월 계획과 개인 배정의 근거·적용 월이 일관되며 과거 사용량과 당월 잠금 경계가 보존된다"
    rules_from: ["REQ-116.business_rules", "REQ-116.empty_population", "REQ-116.hard_rule", "REQ-118.business_rules", "REQ-118.lifecycle", "REQ-606.business_rules"]
    pending: ["@defer P3 — 월 확정/승계·0명 첫 활성·일할/최초 정정·동시 배정의 저장 구조와 원자성, 산식 경계 시험을 설계한다"]

  - id: UC-028
    name: "승급 요청을 판정하고 미래 적용 월을 예약한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-117]
    actors: { primary: ACT-004, secondary: [ACT-001] }
    process_step: PRC-12-02
    precondition: "유효한 승급 후보/요청과 현재 처리 권한이 있다. Portal 접수 화면은 해당 작업흐름이 소유한다"
    trigger: "승급 요청을 승인·반려하거나 저장자 전결 결과를 반영한다"
    main_flow:
      - "희망 등급·사유·현재 등급과 고정 제출본, 사용자당 미종결 요청을 확인한다"
