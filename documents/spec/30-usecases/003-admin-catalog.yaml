# 영역: 공개 카탈로그·인증 예제 — 공통 접수/승인 계약은 UC-001~006을 사용한다.
usecases:
  - id: UC-007
    name: "공개 카탈로그 후보를 작성하고 사용 가능성을 검수한다"
    workstream: admin
    design_status: draft
    feature_contract: FEAT-003
    entities: [ENT-005, ENT-006, ENT-007, ENT-009, ENT-020, ENT-021, ENT-022, ENT-023, ENT-024, ENT-026, ENT-028]
    reqs: [REQ-301]
    actors: { primary: ACT-003, secondary: [ACT-002] }
    process_step: PRC-09-01
    precondition: "고객사가 공개할 테이블·뷰를 선정했고 관리 대상 데이터소스의 조회·카탈로그 작성 권한과 업무 근거가 있다"
    trigger: "선정한 공개 객체를 처음 등록하거나 구조·업무 의미·값 도메인·조회 제약·접근 그룹을 보완한다"
    main_flow:
      - "UC-001에서 관리 원천과 영향을 확인하고 데이터소스 내부 ID·DB/카탈로그·실제 스키마·객체명으로 공개 객체를 식별한다. 필요한 서버 한정자는 원천 사실에 포함한다"
      - "공개 객체와 컬럼의 구조 사실을 읽고 업무 명칭·설명·의미/형식·값 도메인의 원천과 검수 근거를 후보에 작성한다. 대상 시스템 귀속을 새로 만들지 않는다"
      - "개인정보 기준·접근 허용 그룹과 컬럼별 예외를 원래 소유 계약에 따라 확인한다. 의미 검수·개인정보 검수·보안 정책 적용을 각각 구분한다"
      - "REQ-301.query_constraints의 필수 조회 제약·검수된 대체 조건 또는 검수된 제약 없음 상태를 작성한다. 권장 관계가 필요하면 UC-008로 연결한다"
      - "업무 의미·값 도메인 변경은 외부 통지·구조 비교 이상 유무와 무관하게 UC-014로 인계해 연결 지식·인증 예제의 검토 필요를 남긴다. 변경 후보와 실제 운영 반영 시점은 구분한다"
      - "미완성·미검수 범위를 표시하고 초안으로 저장한다. 검수가 끝난 후보를 반영하려면 UC-012의 자산 변경 세트로 인계한다"
      - "UC-006에서 실제 반영 결과를 확인한다. 유효본에서도 현재 공개·권한·필수 메타데이터 조건을 만족하는 범위만 AI 주입·업무 조회에 제공한다"
    alternative_flows:
      - { id: A1, condition: "원천 코멘트 또는 인라인 값 후보를 보완 자료로 사용", flow: ["코멘트는 초안 제안으로만 사용한다. 값 샘플링은 구조 조회와 구분하고 REQ-304.note의 수동 컬럼 선택·개인정보 제외·권한·조회량 제한·이력 계약을 적용한다"] }
      - { id: A2, condition: "일부 객체·컬럼의 의미나 제약을 아직 확인하지 못함", flow: ["초안을 보존하고 해당 범위를 운영 사용에서 제외한다. 미확인을 해당 없음이나 검수 완료로 바꾸지 않는다"] }
      - { id: A3, condition: "기존 후보의 비활성화·삭제 또는 과거 상태 복원", flow: ["참조 영향을 확인한 새 후보로 작성하고 UC-012를 따른다. 현재 유효본이나 과거 스냅샷을 직접 덮어쓰지 않는다"] }
    exception_flows:
      - { id: E1, condition: "원천 객체 식별 불가·조회 권한 부족·참조 조회 실패", flow: ["읽기 실패를 객체 없음으로 처리하지 않는다. 자동 삭제·공개·후보 확정 없이 실패 원인과 보완 항목을 안내한다"] }
      - { id: E2, condition: "업무 의미·값 도메인·개인정보 검수 또는 조회 제약이 미완성/지원 불가", flow: ["해당 범위를 사용할 수 없는 후보로 유지한다. 자동 수집·입력 문구만으로 사용 가능을 확정하거나 제약을 완화하지 않는다"] }
      - { id: E3, condition: "반영 시 기준 운영본이나 참조가 변경됨", flow: ["UC-003·012의 검증 결과에 따라 접수/반영을 막고 차이를 확인한다. 오래된 후보로 현재 값을 덮어쓰지 않는다"] }
    postcondition: "공개 객체의 후보·검수 상태·운영 사용 가능 범위와 후속 요청이 구분된다. 초안 작성만으로 활성화하지 않는다"
    rules_from: ["REQ-301.column_metadata", "REQ-301.value_domain", "REQ-301.query_constraints", "REQ-301.business_rules", "REQ-301.quality_management", "REQ-304.note", "REQ-601.approval_policy"]
    sequence_design:
      contracts_from: ["FEAT-003.identity_contract", "FEAT-003.composition_contract", "FEAT-003.edit_transaction", "FEAT-003.set_public_contract", "FEAT-003.source_public_contract", "REQ-301", "REQ-304"]
      scope: "SCR-003의 전체 초안 저장·원 명령 확인과 관측/검증/소유 변경 세트 인계다. 직접 관리 ENT-019·운영 반영 원장으로 확대하지 않는다"
      diagrams:
        - key: draft-save
          title: "전체 후보와 구성 ID·변경 근거·원 성공 결과의 동시 저장"
          apis: [API-023, API-024, API-025, API-034]
          testcases: [TC-0032, TC-0033, TC-0034, TC-0035, TC-0036, TC-0037, TC-00310]
          transaction_boundary: "현재 권한/원 성공을 확인하고 READ COMMITTED에서 부모를 공통 순서로 잠근다. 잠금 뒤 원 명령 재조회·DRAFT/기대 버전·전체 참조/구성 검사와 ENT-028/전체 초안·자식·필요 변경 근거는 같은 TX다. 고정 후보·운영 포인터는 이 저장에서 바꾸지 않는다"
          mermaid: |
            sequenceDiagram
                autonumber
                participant U as 카탈로그 화면
                participant A as admin 후보 저장
                participant D as AI 전용 DB
                U->>A: API-023/024/025 원 키·전체 구성/복사 기준·사유
                A->>A: 현재 SAVE/소유 권한·형식·인증 주체/입력 지문 확인
                A->>D: 같은 원 명령의 성공 결과 확인
                alt 같은 주체/기능/입력의 성공 있음
                    D-->>A: 원 DraftResult와 clientKey 매핑
                    A-->>U: 원 성공 재생 — 현재 누락/검수는 별도 조회
                else 미반영 명령
                    rect rgba(110, 150, 190, 0.10)
                        Note over A,D: BEGIN READ COMMITTED — 부모 종류/숫자 ID 순으로 잠금
                        A->>D: 잠금 뒤 같은 명령 성공 재조회
                        alt 원 성공 확인
                            D-->>A: 기대 버전보다 먼저 원 성공 반환
                            Note over A,D: TX 종료·잠금 해제 뒤 응답
                        else 새 명령 검증
                            A->>A: DRAFT·기대 편집/복사 기준 판·전체 구성/소유 검증
                            A->>A: 정확 식별/profile·현재 참조·검수 의도/근거 검증
                            alt 버전/소유/참조/식별 오류 또는 필수 검증 불가
                                A->>D: ROLLBACK
                                A-->>U: 계약 거부·입력 보존
                            else 미완성 초안 포함 저장 가능
                                A->>D: 신규 catalog/revision/member ID 배정·clientKey 참조 해석
                                A->>A: 완전한 원 성공 결과/ID 매핑 계산
                                A->>D: ENT-028 완전한 결과 INSERT
                                A->>D: 전체 후보/자식·필요 의미 변경 근거 ENT-010/027 저장
                                alt 모든 저장 성공
                                    A->>D: COMMIT
                                    A-->>U: DraftResult — 초안 저장이며 운영 반영 아님
                                else 키 경합 또는 자식/근거/결과 저장 실패
                                    A->>D: ROLLBACK — 부분 성공 없음
                                    Note over A,D: 키 경합은 실패 TX 종료 뒤 새 읽기로 원 성공 확인
                                    A-->>U: 명시 거부 또는 결과 불명 구분
                                end
                            end
                        end
                    end
                end
                opt 응답 유실/접수 불명
                    U->>U: 원 키·원 입력 유지·새 저장/복사 잠금
                    U->>A: API-034 현재 READ+SAVE로 원 키 확인
                    alt 원 성공 확인
                        A-->>U: APPLIED + 원 DraftResult
                    else 원 성공 미발견/타 주체
                        A-->>U: UNKNOWN — 미실행 확정 아님
                        U->>A: 선택 시 같은 원 API·키·전체 입력 재전송
                    end
                end
          reading_order:
            - "후보 저장·복사와 실제 운영 반영은 다른 명령이다. 미완성 값은 허용하지만 없는 참조·중복 구성·소유 이전은 거부한다"
            - "기존 성공은 현재 권한·같은 주체/입력에서 재생하고 잠금 대기 뒤 다시 확인한다. 과거 성공의 editVersion/clientKey 매핑에 현재 검수 결과를 섞지 않는다"
            - "전체 구성·배정 ID·필요 업무 의미/값 변경 근거·완전한 명령 결과를 함께 확정한다. 서버가 검수자/시각과 무효화 범위를 결정한다"
            - "UNKNOWN/통신·커밋 불명에는 새 키를 만들지 않는다. 미반영이 확인된 명시 거부만 입력 보존 후 편집 복귀하며 수정한 새 의도에 새 키를 쓴다"
          counterexamples:
            - "clientKey를 다른 후보의 미배정 ID로 추정하거나 FROZEN 판의 자식만 수정하면 실패해야 한다"
            - "현재 운영 포인터를 초안 저장으로 바꾸거나 이력/근거 실패 후 자식 일부만 남으면 실패해야 한다"
        - key: source-and-handoff
          title: "원천 관측·메타데이터 검수와 소유 변경 세트의 고정/반영 인계"
          apis: [API-028, API-029, API-030, API-035]
          testcases: [TC-00310, TC-00311, TC-00312, TC-00313, TC-00314]
          transaction_boundary: "원천 확인/샘플과 getValidation은 운영 반영 TX가 아니다. 고정과 실제 반영은 FEAT-014/040 소유의 별도 짧은 TX이며 사람의 검토/승인 대기를 DB 잠금 안에 두지 않는다"
          mermaid: |
            sequenceDiagram
                autonumber
                participant U as 카탈로그 화면
                participant A as admin 카탈로그 조회/검증
                participant I as integration 원천 관측
                participant K as 자산 변경 세트 소유
                participant D as AI 전용 DB
                U->>A: API-028/029 선정한 정확 객체/선택 판
                A->>I: 현재 공개/권한 안의 정확 객체 구조 확인
                alt 모호/부분/실패
                    I-->>A: 상태·누락/실패 범위·관측 근거
                    A-->>U: 확인 불가/차이 표시 — 자동 삭제·공개 없음
                else 정확 사실 확인
                    I-->>A: 구조 사실·코멘트 제안·관측 근거
                    A-->>U: 검수 보조 자료 — 의미 검수 완료 아님
                end
                opt 별도 수동 샘플
                    Note over U,I: 등록 컬럼 선택·현재 원본 권한·개인정보 제외·제약/상한 계약이 완성된 때만 활성화
                    U->>A: API-030 검증 가능한 조건/선택 컬럼
                    A->>I: 현재 정책/제약/행·시간 제한 검증 후 조회
                    I-->>U: 허용 결과·시스템 조회 이력 참조 — 후보/근거에 원문 복제 금지
                end
                U->>A: API-035 선택 판/기대 편집 버전·세트 후보 집합 검증
                A-->>U: 누락·참조·검수 결과 — 예약/접수/반영 허가 아님
                alt 미완성 또는 소유 계약 대기
                    U->>U: 초안 보완 — 현재 운영본 유지
                else 인계 가능한 전체 후보
                    U->>K: SCR-036의 소유 흐름으로 대상·기준/후보 판·사유 인계
                    rect rgba(110, 150, 190, 0.10)
                        Note over K,D: 소유 고정 TX — 실제 저장/복구 계약은 knowledge 후속
                        K->>D: 전체 후보/참조 잠금·기대 편집 버전·구성 완전성 검사
                        K->>D: 전체 고정 참조/지문 확정·FROZEN 또는 전체 실패
                    end
                    Note over K,D: 요청/기술 검토·승인 또는 설정 미사용 전결 — DB 잠금 밖의 소유 절차
                    rect rgba(90, 160, 110, 0.10)
                        Note over K,D: 별도 실제 반영 TX — 소유 G3 후 구현
                        K->>D: 전체 기준/참조 최신성·현재 권한/정책·동일성 재검증
                        alt 충돌/필수 검증 실패
                            K->>D: ROLLBACK — 운영본 유지
                        else 반영 검증 통과
                            K->>D: 전체 포인터·효력·물리 이름·세트 결과 함께 COMMIT
                        end
                    end
                    K-->>U: 실제 세트 결과 확인 — 초안 저장과 구분
                end
          reading_order:
            - "관측과 검수, 샘플 실행, 후보 검증, 고정/승인·전결, 실제 반영을 분리한다. 구조 정상도 업무 의미/값 변경의 영향 검토를 면제하지 않는다"
            - "샘플의 현재 권한/개인정보 제외·조건/상한이 미완성이면 기능을 활성화하지 않는다. 이 그림은 샘플 상한 숫자나 허용 공개 범위를 새로 정하지 않는다"
            - "고정과 반영은 소유 기능의 전체 후보 집합을 사용한다. 현재 직접 정책이나 외부 DDL을 admin DB 잠금으로 동결한 것으로 간주하지 않는다"
          pending: ["@defer P3 knowledge·access_policy·integration·agent — 그룹 후보·세트 원장/고정/복구·원천 관측/샘플 공개 계약과 실제 동시 실행 시험을 연결한다"]
      pending: ["@defer P3 — 화면 상세 승인·소유 후속 계약·구체 DTO/오류 메시지·제품 DB/동시 요청 및 사용자 시험을 완료한다"]
    pending:
      - "@defer P3 — 입력 필드·원천 조회/샘플링 계약·미완성 표시·버전과 공개 범위 검증을 데이터/API/화면·시험으로 구체화한다. 기본값·컬럼 길이·인덱스를 별도 관리 범위로 추가하지 않는다"

  - id: UC-008
    name: "공개 객체 사이의 권장 조인 관계 후보를 검수한다"
    workstream: admin
    design_status: draft
    feature_contract: FEAT-011
    entities: [ENT-006, ENT-008, ENT-020, ENT-025]
    reqs: [REQ-301]
    actors: { primary: ACT-003, secondary: [] }
    process_step: PRC-09-02
    precondition: "양쪽 공개 객체·컬럼을 식별할 수 있고 관계의 업무 의미와 물리 또는 논리 근거를 확인할 수 있다"
    trigger: "카탈로그에서 권장 조인 관계를 등록·수정·폐기한다"
    main_flow:
      - "REQ-301.relationship_metadata.ownership에 따라 관리 카탈로그를 작성 시 명시 선택·고정하고 양쪽 역할·공개 객체·모든 컬럼 쌍을 작성한다. FEAT-014.reference_validation으로 자기/같은 세트 후보와 외부 유효본을 구분하고 현재 접근 범위를 확인한다"
      - "물리 외래 키 또는 검수한 논리 관계의 근거와 방향·대응 수·복합 키 전체를 후보로 작성한다"
      - "REQ-301.relationship_metadata에 따라 조인 의미와 집계 중복 위험을 검수한다. 1:N의 중복을 일괄 DISTINCT로 숨기지 않는다"
      - "카탈로그 후보의 일부로 변경 전후와 영향 근거를 보존하고 UC-012의 세트 승인/전결로 인계한다"
    alternative_flows:
      - { id: A1, condition: "자동 수집한 외래 키 또는 동명 컬럼이 관계 후보로 보임", flow: ["검토 자료로만 사용하고 업무 관계를 확인한 뒤 후보로 확정한다"] }
      - { id: A2, condition: "독립 조회에 관계가 필요하지 않음", flow: ["관계 등록을 강제하지 않는다. 미확인 관계에 의존한 조회와 독립적으로 사용 가능한 컬럼을 구분한다"] }
      - { id: A3, condition: "같은 카탈로그의 자기조인", flow: ["두 역할과 컬럼 쌍 방향을 유지하고 양쪽 모두 같은 소유 후보의 구성으로 검증한다. 인증 예제의 객체 목록 중복 제거로 역할까지 합치지 않는다"] }
      - { id: A4, condition: "반대쪽 카탈로그 화면에서 관계를 변경", flow: ["같은 관계의 관리 카탈로그 후보로 연결해 현재 편집 권한을 검사한다. 화면 방향만으로 관리측을 바꾸거나 별도 관계 사본을 만들지 않는다"] }
    exception_flows:
      - { id: E1, condition: "복합 키 일부 누락·컬럼/객체 식별 불가·관계 의미 미확인", flow: ["권장 관계로 운영 사용하지 않고 초안·미검수 사유를 보존한다"] }
      - { id: E2, condition: "상대 객체의 현재 접근 권한 부족 또는 참조 버전 충돌", flow: ["관계 등록으로 권한을 부여하거나 참조 버전을 임의 선택하지 않는다. 관련 후보와 영향을 보완한다"] }
    postcondition: "검수 근거가 있는 관계 후보와 변경 요청이 연결되며 운영 사용은 실제 반영·현재 접근 통제를 따른다"
    rules_from: ["REQ-301.relationship_metadata", "REQ-306.catalog_boundary", "REQ-306.version_guard"]
    sequence_design:
      contracts_from: ["FEAT-011", "FEAT-003.composition_contract", "FEAT-003.set_public_contract", "FEAT-014.reference_validation", "ADR-030"]
      shared_sequences: ["[공통 후보 저장](UC-007.md#draft-save)", "[고정·실제 반영 인계](UC-007.md#source-and-handoff)"]
      scope: "SCR-003의 관계 관리측 선택·반대편 동일 정본 조회·자기조인과 복합 컬럼쌍을 전체 카탈로그 후보에 연결한다"
      diagrams:
        - key: managing-relation
          title: "관리측 고정과 자기/세트/외부 판을 구분한 관계 후보"
          apis: [API-024, API-027, API-036]
          testcases: [TC-0111, TC-0112, TC-0113]
          transaction_boundary: "관계/쌍은 관리 카탈로그 전체 후보의 저장 TX에 포함한다. 별도 관계 승인/부분 반영은 없고 실제 고정·반영은 UC-007의 소유 세트 인계를 따른다"
          mermaid: |
            sequenceDiagram
                autonumber
                participant U as 카탈로그 화면
                participant A as admin 카탈로그 후보
                participant D as AI 전용 DB
                U->>A: API-027 선택 판에 관련된 관계 조회
                A-->>U: 같은 관계 ID·관리 카탈로그·두 역할/방향·정확 참조 판
                alt 반대편 화면에서 기존 관계 수정
                    U->>A: 관리 카탈로그 후보 열기·현재 SAVE/소유 권한 확인
                    A-->>U: 관리측 편집 문맥 또는 권한 거부
                else 새 관계 작성
                    U->>U: 양쪽 공개 카탈로그 중 관리측 명시 선택
                    Note over U,A: 관리측은 생성 뒤 고정 — 1/N 방향·화면 진입과 별개
                end
                U->>A: API-036 현재 권한의 객체/컬럼/참조 판 후보 조회
                A-->>U: 자기/같은 세트 후보·외부 유효본 참조 구분
                alt 자기조인
                    U->>U: 같은 소유 후보의 LEFT/RIGHT 두 역할·모든 방향 컬럼쌍 유지
                else 서로 다른 공개 객체
                    U->>U: 양쪽 정확 판/역할·관계 의미·전체 복합 컬럼쌍 검수
                end
                rect rgba(110, 150, 190, 0.10)
                    Note over A,D: UC-007 draft-save의 관리측 전체 후보 TX
                    U->>A: API-024 관리측 전체 구성·기대 편집 버전·원 키
                    A->>D: 소유/종류·전체 쌍/참조·검수 근거 확인
                    alt 존재하지 않는 비null 참조/잘못된 소유/중복/관리측 이전 시도
                        A->>D: ROLLBACK
                        A-->>U: 보완 사유 — 자동 판 치환/권한 부여 없음
                    else 전체 초안 저장 가능
                        Note over A,D: 쌍 0개/일부 완전 쌍은 누락 사유와 UNKNOWN 보존 — 검수 완료/운영 사용은 불가
                        A->>D: 관계/쌍 포함 전체 후보·원 성공 COMMIT
                        A-->>U: 후보 저장 결과 — 운영 반영은 소유 세트로 인계
                    end
                end
          reading_order:
            - "반대편 조회도 같은 안정 관계 ID를 사용한다. 기존 관계의 관리측을 바꾸거나 사본으로 편집하지 않는다"
            - "자기조인은 같은 카탈로그/후보여도 두 업무 역할을 유지하며 LEFT/RIGHT 컬럼쌍을 합치지 않는다. 복합 쌍 일부만 검수하지 않는다"
            - "관계 정의는 쌍 목록 0개나 일부 완전한 쌍과 누락 사유로 초안 보존한다. 한쪽 컬럼만 있는 불완전 쌍 행·없는 참조·소유 오류·중복·관리측 이전은 거부하고, 누락 상태를 검수 완료/권장 경로로 운영 제공하지 않는다"
            - "참조 선택은 예약이 아니다. 같은 세트 후보/외부 현재 유효본과 실제 반영 직전 현재 권한을 다시 검증하며 무관한 자산에 업무 점유를 만들지 않는다"
          counterexamples: ["1:N 중복 의미를 일괄 DISTINCT로 감추거나 관계가 불필요한 독립 컬럼에도 관계를 강제하면 실패해야 한다"]
    pending:
      - "@defer P3 — 관계·복합 컬럼 쌍·검수 근거의 저장과 방향/대응 수 표시, 참조 무효·집계 중복 반례를 설계한다"

  - id: UC-009
    name: "인증 예제 후보와 SQL에서 추출한 카탈로그 참조를 검수한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-302]
    actors: { primary: ACT-003, secondary: [] }
    process_step: PRC-09-02
    precondition: "후보 작성 권한과 공개 카탈로그·업무 질문·파라미터 근거가 있다. 원 조회를 승격할 때는 원본 조회 권한도 별도로 갖는다"
    trigger: "인증 예제를 직접 작성하거나 성공한 조회 이력을 후보로 승격하고, 기존 SQL·실행 데이터소스를 변경한다"
    main_flow:
      - "원본 근거 또는 직접 작성한 업무 질문·SQL·파라미터와 실행 데이터소스 내부 ID 하나를 후보에 기록한다"
      - "해당 후보 SQL의 실제 공개 객체 참조를 추출해 데이터소스·DB/스키마까지 식별하고 예제 자체에 카탈로그 ID·버전을 자동 매핑한다"
      - "별칭·임시 질의 이름과 실제 객체를 구분하고 추출 결과·누락·버전 차이·모든 필수 참조를 검수한다. 공개 뷰 내부의 비공개 원본까지 수집하지 않는다"
      - "SQL 또는 실행 데이터소스가 바뀌면 다시 추출·대조한다. 예제의 카탈로그 매핑을 지식의 직접 매핑으로 복사하지 않는다"
      - "질문·파라미터·접근 그룹·SQL과 참조 매핑을 전체 후보에 보존하고 UC-012로 인계한다. 운영 반영 뒤의 예시 주입·직접 실행은 현재 권한과 기존 SQL 통제를 따른다"
    alternative_flows:
      - { id: A1, condition: "개인 저장 조회의 사용 근거에서 승격", flow: ["REQ-205의 사용 현황 열람과 후보 작성 권한을 각각 검사한다. 후보만 만들고 원 개인 조회·다른 사용자의 즐겨찾기·위젯을 바꾸지 않는다"] }
      - { id: A2, condition: "같은 연결에서 여러 DB·스키마를 참조", flow: ["실제 참조의 식별자를 구분한다. 별도 사용 DB/스키마 허용 목록이나 데이터소스 간 SQL 조인을 새로 만들지 않는다"] }
      - { id: A3, condition: "같은 세트에서 공개 카탈로그 후보를 함께 작성", flow: ["UC-007과 연결하고 검증된 세트 내 후보 참조를 사용한다. UC-012의 전체 정합성·기준본 검증을 유지한다"] }
    exception_flows:
      - { id: E1, condition: "추출 실패·불확실·미등록 또는 식별 불가 객체", flow: ["누락·불확실성을 표시하고 초안만 보존한다. 미등록 객체를 자동 등록·공개하거나 불완전한 참조로 반영하지 않는다"] }
      - { id: E2, condition: "필수 참조 일부의 권한·사용 가능성 또는 버전 정합성 실패", flow: ["필수 참조를 일부 제거한 예제를 운영에 제공하지 않는다. 허용 가능한 전체 참조와 후보를 보완한다"] }
      - { id: E3, condition: "승격 원본 열람 또는 후보 작성 권한 부족", flow: ["승격을 거부하며 원 개인 조회를 공유하거나 내부 내용을 복제하지 않는다"] }
    postcondition: "예제 전체 후보와 실제 공개 참조·검수 근거가 연결된다. 승격·추출·초안 저장은 인증 완료나 실행 권한 부여가 아니다"
    rules_from: ["REQ-302.business_rules", "REQ-302.exceptions", "REQ-205.business_rules", "REQ-303.example_catalog_mapping", "REQ-306.version_guard"]
    pending:
      - "@defer P3 — SQL 추출·카탈로그 식별·참조 스냅샷·원본 접근 계약과 실패 표시를 구체화한다. 직접 실행은 소유 agent 실행 계약과 시험으로 연결한다"

  - id: UC-014
    name: "고객사 변경이 공개 카탈로그와 연결 지식에 주는 영향을 판정한다"
    workstream: admin
    design_status: draft
    feature_contract: FEAT-003
    entities: [ENT-010, ENT-027, ENT-028]
    reqs: [REQ-304]
    actors: { primary: ACT-003, secondary: [ACT-010, ACT-014] }
    process_step: PRC-09-04
    precondition: "고객사 변경 통지·근거, 등록 공개 객체의 구조 변화 후보 또는 관리자의 카탈로그 업무 의미·값 도메인 변경이 있으며 영향 자산과 변경 근거를 조회할 권한이 있다"
    trigger: "고객사 변경 근거를 받거나 등록 공개 객체의 구조 변화 후보를 확인하거나 UC-007에서 카탈로그 업무 의미·값 도메인을 변경한다"
    main_flow:
      - "변경 통지의 출처·내용·예정/실제 적용 시점과 Hub에 등록된 공개 객체 범위를 확인한다"
      - "구조·업무 의미·민감도 영향을 판정하고 카탈로그→지식 직접 경로와 카탈로그→예제→지식 간접 경로를 함께 추적한다"
      - "구조 변화 후보 또는 카탈로그 업무 의미·값 도메인 변경이면 연결 지식·인증 예제에 UC-013의 검토 필요를 남긴다. 기존 열린 작업에는 근거·해당 버전을 연결하며, 내부 의미 변경을 외부 통지나 구조 이상이 없다는 이유로 생략하지 않는다"
      - "영향 없음은 판정 근거·사유·처리자·시각을 남긴다. 수정이 필요하면 검토 작업에서 UC-012의 실제 변경 요청으로 이어진다"
      - "고객사 적용과 Hub 실제 반영의 시점·영향·미해결 검토를 대조한다. 비중대한 변경의 시차 수용과 중대한 영향 판단을 구분한다"
    alternative_flows:
      - { id: A1, condition: "등록 공개 객체의 구조 비교를 사용", flow: ["REQ-304의 선택적 검수 보조 신호로만 사용한다. 전체 DB 대사·원천 자동 감시·업무 의미 변화의 완전 탐지를 약속하지 않는다"] }
      - { id: A2, condition: "실제 실행 실패나 품질 문제가 함께 발견됨", flow: ["발생 근거와 조사를 원래 소유 경로로 연결한다. 이미 조사에서 진단했다면 같은 예방적 검토를 강제로 중복 생성하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "통지 근거 부족 또는 영향 불명확", flow: ["구조 비교 정상·SQL 성공만으로 영향 없음으로 종결하지 않고 고객사 확인과 검토를 유지한다"] }
      - { id: E2, condition: "파괴적 변경으로 기존 실행이 실패", flow: ["오류를 기록하되 활성 지식·예제를 자동 비활성화하지 않는다. SQL 접근·마스킹 통제는 계속 적용하고 개인 저장 조회의 확인 필요/오류는 REQ-204의 별도 상태를 따른다"] }
