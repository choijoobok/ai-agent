# 영역: 공개 카탈로그·인증 예제 — 공통 접수/승인 계약은 UC-001~006을 사용한다.
usecases:
  - id: UC-007
    name: "공개 카탈로그 후보를 작성하고 사용 가능성을 검수한다"
    workstream: admin
    design_status: draft
    feature_contract: FEAT-003
    entities: [ENT-005, ENT-006, ENT-007, ENT-009, ENT-020, ENT-021, ENT-022, ENT-023, ENT-024, ENT-026, ENT-028]
    reqs: [REQ-301]
    actors: { primary: ACT-003, secondary: [ACT-002] }
    process_step: PRC-09-01
    precondition: "고객사가 공개할 테이블·뷰를 선정했고 관리 대상 데이터소스의 조회·카탈로그 작성 권한과 업무 근거가 있다"
    trigger: "선정한 공개 객체를 처음 등록하거나 구조·업무 의미·값 도메인·조회 제약·접근 그룹을 보완한다"
    main_flow:
      - "UC-001에서 관리 원천과 영향을 확인하고 데이터소스 내부 ID·DB/카탈로그·실제 스키마·객체명으로 공개 객체를 식별한다. 필요한 서버 한정자는 원천 사실에 포함한다"
      - "공개 객체와 컬럼의 구조 사실을 읽고 업무 명칭·설명·의미/형식·값 도메인의 원천과 검수 근거를 후보에 작성한다. 대상 시스템 귀속을 새로 만들지 않는다"
      - "개인정보 기준·접근 허용 그룹과 컬럼별 예외를 원래 소유 계약에 따라 확인한다. 의미 검수·개인정보 검수·보안 정책 적용을 각각 구분한다"
      - "REQ-301.query_constraints의 필수 조회 제약·검수된 대체 조건 또는 검수된 제약 없음 상태를 작성한다. 권장 관계가 필요하면 UC-008로 연결한다"
      - "업무 의미·값 도메인 변경은 외부 통지·구조 비교 이상 유무와 무관하게 UC-014로 인계해 연결 지식·인증 예제의 검토 필요를 남긴다. 변경 후보와 실제 운영 반영 시점은 구분한다"
      - "미완성·미검수 범위를 표시하고 초안으로 저장한다. 검수가 끝난 후보를 반영하려면 UC-012의 자산 변경 세트로 인계한다"
      - "UC-006에서 실제 반영 결과를 확인한다. 유효본에서도 현재 공개·권한·필수 메타데이터 조건을 만족하는 범위만 AI 주입·업무 조회에 제공한다"
    alternative_flows:
      - { id: A1, condition: "원천 코멘트 또는 인라인 값 후보를 보완 자료로 사용", flow: ["코멘트는 초안 제안으로만 사용한다. 값 샘플링은 구조 조회와 구분하고 REQ-304.note의 수동 컬럼 선택·개인정보 제외·권한·조회량 제한·이력 계약을 적용한다"] }
      - { id: A2, condition: "일부 객체·컬럼의 의미나 제약을 아직 확인하지 못함", flow: ["초안을 보존하고 해당 범위를 운영 사용에서 제외한다. 미확인을 해당 없음이나 검수 완료로 바꾸지 않는다"] }
      - { id: A3, condition: "기존 후보의 비활성화·삭제 또는 과거 상태 복원", flow: ["참조 영향을 확인한 새 후보로 작성하고 UC-012를 따른다. 현재 유효본이나 과거 스냅샷을 직접 덮어쓰지 않는다"] }
    exception_flows:
      - { id: E1, condition: "원천 객체 식별 불가·조회 권한 부족·참조 조회 실패", flow: ["읽기 실패를 객체 없음으로 처리하지 않는다. 자동 삭제·공개·후보 확정 없이 실패 원인과 보완 항목을 안내한다"] }
      - { id: E2, condition: "업무 의미·값 도메인·개인정보 검수 또는 조회 제약이 미완성/지원 불가", flow: ["해당 범위를 사용할 수 없는 후보로 유지한다. 자동 수집·입력 문구만으로 사용 가능을 확정하거나 제약을 완화하지 않는다"] }
      - { id: E3, condition: "반영 시 기준 운영본이나 참조가 변경됨", flow: ["UC-003·012의 검증 결과에 따라 접수/반영을 막고 차이를 확인한다. 오래된 후보로 현재 값을 덮어쓰지 않는다"] }
    postcondition: "공개 객체의 후보·검수 상태·운영 사용 가능 범위와 후속 요청이 구분된다. 초안 작성만으로 활성화하지 않는다"
    rules_from: ["REQ-301.column_metadata", "REQ-301.value_domain", "REQ-301.query_constraints", "REQ-301.business_rules", "REQ-301.quality_management", "REQ-304.note", "REQ-601.approval_policy"]
    pending:
      - "@defer P3 — 입력 필드·원천 조회/샘플링 계약·미완성 표시·버전과 공개 범위 검증을 데이터/API/화면·시험으로 구체화한다. 기본값·컬럼 길이·인덱스를 별도 관리 범위로 추가하지 않는다"

  - id: UC-008
    name: "공개 객체 사이의 권장 조인 관계 후보를 검수한다"
    workstream: admin
    design_status: draft
    feature_contract: FEAT-011
    entities: [ENT-006, ENT-008, ENT-020, ENT-025]
    reqs: [REQ-301]
    actors: { primary: ACT-003, secondary: [] }
    process_step: PRC-09-02
    precondition: "양쪽 공개 객체·컬럼을 식별할 수 있고 관계의 업무 의미와 물리 또는 논리 근거를 확인할 수 있다"
    trigger: "카탈로그에서 권장 조인 관계를 등록·수정·폐기한다"
    main_flow:
      - "REQ-301.relationship_metadata.ownership에 따라 관리 카탈로그를 작성 시 명시 선택·고정하고 양쪽 역할·공개 객체·모든 컬럼 쌍을 작성한다. FEAT-014.reference_validation으로 자기/같은 세트 후보와 외부 유효본을 구분하고 현재 접근 범위를 확인한다"
      - "물리 외래 키 또는 검수한 논리 관계의 근거와 방향·대응 수·복합 키 전체를 후보로 작성한다"
      - "REQ-301.relationship_metadata에 따라 조인 의미와 집계 중복 위험을 검수한다. 1:N의 중복을 일괄 DISTINCT로 숨기지 않는다"
      - "카탈로그 후보의 일부로 변경 전후와 영향 근거를 보존하고 UC-012의 세트 승인/전결로 인계한다"
    alternative_flows:
      - { id: A1, condition: "자동 수집한 외래 키 또는 동명 컬럼이 관계 후보로 보임", flow: ["검토 자료로만 사용하고 업무 관계를 확인한 뒤 후보로 확정한다"] }
      - { id: A2, condition: "독립 조회에 관계가 필요하지 않음", flow: ["관계 등록을 강제하지 않는다. 미확인 관계에 의존한 조회와 독립적으로 사용 가능한 컬럼을 구분한다"] }
      - { id: A3, condition: "같은 카탈로그의 자기조인", flow: ["두 역할과 컬럼 쌍 방향을 유지하고 양쪽 모두 같은 소유 후보의 구성으로 검증한다. 인증 예제의 객체 목록 중복 제거로 역할까지 합치지 않는다"] }
      - { id: A4, condition: "반대쪽 카탈로그 화면에서 관계를 변경", flow: ["같은 관계의 관리 카탈로그 후보로 연결해 현재 편집 권한을 검사한다. 화면 방향만으로 관리측을 바꾸거나 별도 관계 사본을 만들지 않는다"] }
    exception_flows:
      - { id: E1, condition: "복합 키 일부 누락·컬럼/객체 식별 불가·관계 의미 미확인", flow: ["권장 관계로 운영 사용하지 않고 초안·미검수 사유를 보존한다"] }
      - { id: E2, condition: "상대 객체의 현재 접근 권한 부족 또는 참조 버전 충돌", flow: ["관계 등록으로 권한을 부여하거나 참조 버전을 임의 선택하지 않는다. 관련 후보와 영향을 보완한다"] }
    postcondition: "검수 근거가 있는 관계 후보와 변경 요청이 연결되며 운영 사용은 실제 반영·현재 접근 통제를 따른다"
    rules_from: ["REQ-301.relationship_metadata", "REQ-306.catalog_boundary", "REQ-306.version_guard"]
    pending:
      - "@defer P3 — 관계·복합 컬럼 쌍·검수 근거의 저장과 방향/대응 수 표시, 참조 무효·집계 중복 반례를 설계한다"

  - id: UC-009
    name: "인증 예제 후보와 SQL에서 추출한 카탈로그 참조를 검수한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-302]
    actors: { primary: ACT-003, secondary: [] }
    process_step: PRC-09-02
    precondition: "후보 작성 권한과 공개 카탈로그·업무 질문·파라미터 근거가 있다. 원 조회를 승격할 때는 원본 조회 권한도 별도로 갖는다"
    trigger: "인증 예제를 직접 작성하거나 성공한 조회 이력을 후보로 승격하고, 기존 SQL·실행 데이터소스를 변경한다"
    main_flow:
      - "원본 근거 또는 직접 작성한 업무 질문·SQL·파라미터와 실행 데이터소스 내부 ID 하나를 후보에 기록한다"
      - "해당 후보 SQL의 실제 공개 객체 참조를 추출해 데이터소스·DB/스키마까지 식별하고 예제 자체에 카탈로그 ID·버전을 자동 매핑한다"
      - "별칭·임시 질의 이름과 실제 객체를 구분하고 추출 결과·누락·버전 차이·모든 필수 참조를 검수한다. 공개 뷰 내부의 비공개 원본까지 수집하지 않는다"
      - "SQL 또는 실행 데이터소스가 바뀌면 다시 추출·대조한다. 예제의 카탈로그 매핑을 지식의 직접 매핑으로 복사하지 않는다"
      - "질문·파라미터·접근 그룹·SQL과 참조 매핑을 전체 후보에 보존하고 UC-012로 인계한다. 운영 반영 뒤의 예시 주입·직접 실행은 현재 권한과 기존 SQL 통제를 따른다"
    alternative_flows:
      - { id: A1, condition: "개인 저장 조회의 사용 근거에서 승격", flow: ["REQ-205의 사용 현황 열람과 후보 작성 권한을 각각 검사한다. 후보만 만들고 원 개인 조회·다른 사용자의 즐겨찾기·위젯을 바꾸지 않는다"] }
      - { id: A2, condition: "같은 연결에서 여러 DB·스키마를 참조", flow: ["실제 참조의 식별자를 구분한다. 별도 사용 DB/스키마 허용 목록이나 데이터소스 간 SQL 조인을 새로 만들지 않는다"] }
      - { id: A3, condition: "같은 세트에서 공개 카탈로그 후보를 함께 작성", flow: ["UC-007과 연결하고 검증된 세트 내 후보 참조를 사용한다. UC-012의 전체 정합성·기준본 검증을 유지한다"] }
    exception_flows:
      - { id: E1, condition: "추출 실패·불확실·미등록 또는 식별 불가 객체", flow: ["누락·불확실성을 표시하고 초안만 보존한다. 미등록 객체를 자동 등록·공개하거나 불완전한 참조로 반영하지 않는다"] }
      - { id: E2, condition: "필수 참조 일부의 권한·사용 가능성 또는 버전 정합성 실패", flow: ["필수 참조를 일부 제거한 예제를 운영에 제공하지 않는다. 허용 가능한 전체 참조와 후보를 보완한다"] }
      - { id: E3, condition: "승격 원본 열람 또는 후보 작성 권한 부족", flow: ["승격을 거부하며 원 개인 조회를 공유하거나 내부 내용을 복제하지 않는다"] }
    postcondition: "예제 전체 후보와 실제 공개 참조·검수 근거가 연결된다. 승격·추출·초안 저장은 인증 완료나 실행 권한 부여가 아니다"
    rules_from: ["REQ-302.business_rules", "REQ-302.exceptions", "REQ-205.business_rules", "REQ-303.example_catalog_mapping", "REQ-306.version_guard"]
    pending:
      - "@defer P3 — SQL 추출·카탈로그 식별·참조 스냅샷·원본 접근 계약과 실패 표시를 구체화한다. 직접 실행은 소유 agent 실행 계약과 시험으로 연결한다"

  - id: UC-014
    name: "고객사 변경이 공개 카탈로그와 연결 지식에 주는 영향을 판정한다"
    workstream: admin
    design_status: draft
    feature_contract: FEAT-003
    entities: [ENT-010, ENT-027, ENT-028]
    reqs: [REQ-304]
    actors: { primary: ACT-003, secondary: [ACT-010, ACT-014] }
    process_step: PRC-09-04
    precondition: "고객사 변경 통지·근거, 등록 공개 객체의 구조 변화 후보 또는 관리자의 카탈로그 업무 의미·값 도메인 변경이 있으며 영향 자산과 변경 근거를 조회할 권한이 있다"
    trigger: "고객사 변경 근거를 받거나 등록 공개 객체의 구조 변화 후보를 확인하거나 UC-007에서 카탈로그 업무 의미·값 도메인을 변경한다"
    main_flow:
      - "변경 통지의 출처·내용·예정/실제 적용 시점과 Hub에 등록된 공개 객체 범위를 확인한다"
      - "구조·업무 의미·민감도 영향을 판정하고 카탈로그→지식 직접 경로와 카탈로그→예제→지식 간접 경로를 함께 추적한다"
      - "구조 변화 후보 또는 카탈로그 업무 의미·값 도메인 변경이면 연결 지식·인증 예제에 UC-013의 검토 필요를 남긴다. 기존 열린 작업에는 근거·해당 버전을 연결하며, 내부 의미 변경을 외부 통지나 구조 이상이 없다는 이유로 생략하지 않는다"
      - "영향 없음은 판정 근거·사유·처리자·시각을 남긴다. 수정이 필요하면 검토 작업에서 UC-012의 실제 변경 요청으로 이어진다"
      - "고객사 적용과 Hub 실제 반영의 시점·영향·미해결 검토를 대조한다. 비중대한 변경의 시차 수용과 중대한 영향 판단을 구분한다"
    alternative_flows:
      - { id: A1, condition: "등록 공개 객체의 구조 비교를 사용", flow: ["REQ-304의 선택적 검수 보조 신호로만 사용한다. 전체 DB 대사·원천 자동 감시·업무 의미 변화의 완전 탐지를 약속하지 않는다"] }
