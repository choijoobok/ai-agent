nfrs:
  - id: NFR-028
    category: "사용성·호환성"
    workstream: portal
    roadmap: RM-P1
    reqs: [REQ-041]
    title: "Portal 반응형 웹의 환경별 기능·조작 동등성"
    requirement: "REQ-041의 각 출시 차수 제품 Portal 기능을 PC·모바일 지원 환경에서 검증한다. 배치 차이는 허용하되 필수 정보·유효 조작·입력·서버 통제의 유실을 허용하지 않는다"
    measurement: "확정 지원 환경×출시 기능별 검증 완료율, 필수 정보/조작 접근 불가·입력 유실·의도하지 않은 제출/중복 실행 건수"
    source: "Portal 화면별 요건·목업과 연결한 브라우저/실제 모바일 단말 시험 결과·캡처 및 원 기능의 서버 접수/승인/실행/감사 이력. 데스크톱의 화면 폭 축소만으로 가상 키보드·잠금/복귀·다운로드 실단말 검증을 대신하지 않는다"
    target: "P3에서 확정한 지원 행렬의 해당 차수 필수 검증 100% 완료, 필수 정보/조작 접근 불가·크기/방향 전환에 의한 입력 유실·의도하지 않은 제출/중복 실행 0건"
    test_case: null
    verification_scope: "지원 최소 폭·전환 경계 전후·넓은 폭·가로/세로, 터치·키보드·가상 키보드, 긴 입력/표/차트·메뉴/탭/모달·승인 패널·오류, 백그라운드/통신 단절·재인증, 내보내기를 포함한다. 구체 기대 결과는 REQ-041과 원 기능의 요구사항을 따른다"
    open:
      - "@defer P3 Portal 소유 G3 전에 지원 폭·OS/브라우저 버전·대표 실단말·화면별 검증 조합과 테스트 케이스 ID를 확정한다. Android/iOS 모바일 브라우저를 후보로 대조하며 특정 버전이나 폭을 이미 승인된 값으로 취급하지 않는다"
    traces_to: [REQ-041]
