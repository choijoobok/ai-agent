    category: 가용성
    title: "임베딩 모델 장애 시 태그 검색으로 계속한다"
    requirement: "**지식 검색 실패가 질의 처리 전체의 실패가 되지 않게 한다**"
    measurement: "임베딩 장애 중 지식 검색 성공률"
    source: "**지식 검색 기록.** 임베딩 실패 여부를 **검색 건마다** 남겨야 *장애 중* 을 구간으로 자를 수 있다"
