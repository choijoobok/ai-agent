  - id: NFR-022
    category: 운영성
    title: "도구 호출 실패·타임아웃·중단의 처리 방침"
    requirement: "Hub는 도구 호출 실패를 호출 종류·실패 단계·요청 도달/결과 확인 가능성·멱등성·부작용 여부로 분류한다. **타임아웃 재시도가 안전하다고 도구 등록 계약에 명시된 경우에만**, 최초 타임아웃 뒤 자동 재시도를 한 번 수행한다. 두 번째 시도도 타임아웃이면 자동 재시도를 끝내고 사용자에게 알린다. 같은 호출이 수동 재시도 가능으로 등록됐고 되돌릴 수 없는 실행이 없으면, 턴은 중단(ABORTED)으로 전이하여 사용자가 수동 재시도를 요청할 수 있다"
    hard_rule: "DB/DW 실행 타임아웃은 REQ-037에 따라 재작성·재시도하지 않는다. 타임아웃 재시도는 전송 전에 `TIMEOUT_RETRYING` 호출 시도 이력을 DB에 남긴 뒤에만 시작하며, 턴 자체에 새 상태를 만들지 않는다. 수동 재시도는 자동 1회 제한을 우회하는 자동 동작이 아니며, 수동 요청마다 새 호출 시도 이력·쿼터·동시 처리 한도를 적용한다. 대상 시스템 실행 API가 전송됐거나 결과가 불명인 경우에는 직접 재시도하지 않는다. 결과 확인 방법이 등록됐으면 먼저 확인하고, 방법이 없거나 확인에 실패하면 결과 불명 이력과 대상 시스템 수동 확인 안내를 남긴다. 결과 확인이 `처리 중`이면 사용자에게 알리고, 등록된 권장 확인 시간 뒤 사용자가 별도로 확인하도록 안내하며 Hub가 자동 폴링하지 않는다. 이력에는 원 호출·자동/수동 재시도 순번·타임아웃 시각·재시도 시작 시각·적용한 도구 계약·멱등성/결과 확인 근거·최종 결과를 남긴다. portal은 처리 중 `타임아웃으로 재시도 중(2/2)`을, 자동 재시도 소진 뒤 수동 재시도가 가능한 경우에는 재시도 버튼과 사유를 보여야 한다"
    measurement: "도구 호출 실패율 · 유형별 분포 · 타임아웃 발생·자동/수동 재시도 시작·재시도 성공·두 번째 타임아웃·수동 재시도 요청 건수 · 첫 타임아웃부터 최종 결과까지의 소요 시간"
    source: "**도구 호출 시도 이력과 턴 상태 이력.** 실패 유형(거부 · 타임아웃 · 오류 · 중단)을 **호출 시점에 분류해** 남기고, 최초 호출과 자동·수동 재시도를 같은 호출 식별자로 연결한다. 자동 재시도 소진 뒤 중단으로 전이한 시각과 수동 재시도 요청은 턴 상태 이력으로 남긴다 — 사후에 메시지 문구로 분류하면 문구가 바뀌는 순간 통계가 끊긴다"
    test_case: null
    target: null
    status: in_progress
  - id: NFR-023
    category: 확장성
    title: "동시 처리량 한계와 큐잉 정책"
    requirement: "Hub는 스케일 업·아웃으로 예상 동시 사용량을 감당하도록 구축하되, 실제 실행 용량을 넘는 턴은 REQ-036의 DB 영속 FIFO 대기열에서 관리한다. 개인별 동시 턴 상한의 기본값은 3이며 전체 실행 용량과 함께 운영 설정으로 관리한다. 개인 한도는 실행 중과 실행 순서 대기열의 합에 적용한다. **승인·추가 정보·계획 확인 등 사용자대기는 처리 스레드·실행 점유·대기열 슬롯을 유지하지 않으며 개인 한도에서 제외한다.** 사용자 응답 뒤에는 개인 한도와 전체 실행 용량을 다시 확보해야 실행할 수 있다. 전체 용량 부족은 HTTP 연결 수 제한이나 같은 턴의 실행 점유와 혼동하지 않는다. 큐 대기 턴은 사용자가 중단할 수 있고, 실행 여유가 생기면 재요청 없이 접수 순서대로 시작한다"
    measurement: "동시 처리 턴 수 · 큐 대기 시간"
    source: "**턴 이력의 접수·시작 시각.** 큐 대기는 시작 − 접수이며 **이 값의 정본은 여기다**(NFR-008 은 구성 요소로 끌어 쓴다). 동시 처리 턴 수는 표본 시각마다 세는 값이라 **집계 주기를 함께** 남긴다"
    test_case: null
    target: null
    status: decided
    note: "2026-10-01 사용자 승인으로 개인 한도 기본값은 3이다. 전체 실행 용량과 고객사별 조정값은 부하 시험으로 정한다. **CLI Provider로는 동시성이 검증되지 않는다** — API 구독 확보 직후 개인별 상한·FIFO 순서·대기 중단·사용자 응답 후 용량 재확보를 검증한다"
    open: "@defer P2 — 사용자대기 응답 시 개인 한도가 이미 찬 경우의 응답 접수·큐 재진입·화면 안내 계약을 구체화한다. 슬롯 없이 실행하거나 기존 카드 만료를 자동 연장하지 않는다"
  - id: NFR-024
    category: 운영성
    title: "잡의 중복 실행 방지와 실패 재시도"
    requirement: "**멀티 인스턴스 운영을 전제하므로 중복 실행 방지는 인스턴스 간에 성립해야 한다** — 턴 실행 점유와 동일한 구조를 적용한다"
    measurement: "잡 중복 실행 감지 건수 · 재시도 성공률"
    source: "**잡 실행 기록.** 중복 실행은 *같은 잡의 같은 실행 창에 점유가 둘 생긴 것* 으로 세고(ARCH-070 과 같은 구조), 재시도는 원 실행과 이어 남긴다"
    test_case: null
    target: null
    roadmap: RM-P3
  - id: NFR-025
    category: 확장성
    title: "워크플로우 부하는 근무 시간에 겹친다"
