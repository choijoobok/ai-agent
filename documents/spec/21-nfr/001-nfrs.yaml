nfrs:
# ── 대량 조회 방어 ──────────────────────────────────────────
  - id: NFR-001
    category: 성능
    title: "조회 강제 상한"
    requirement: "최대 행 수 · 실행 시간 초과 · 결과 크기 제한을 강제 적용한다. 실행 전 비용·행 수를 예측해 임계치를 넘으면 조건 보완을 요구하거나 승인 절차를 거친다"
    measurement: "상한 초과로 거부된 조회 건수 / 전체 조회 건수 · 조회 실행 시간 분포(p50·p95·p99)"
    source: "**agent 의 조회 실행 기록** — 업무 DB 에 닿는 것은 agent 뿐이다(ARCH-013). 거부 건수는 **실행 전 상한 판정 시점**에, 실행 시간은 **종결 시점**에 남긴다. 한 시점에서만 재면 거부된 조회가 분포에서 통째로 빠진다"
    test_case: null
    target: null
    note: "**상한·타임아웃은 결과를 제한할 뿐 풀스캔·카테시안 조인이 만드는 도달 전 부하는 막지 못한다.** 운영 DB 부하가 우려되는 고객사에는 **별도 DW 경유를 권장**하고, 보완으로 **실행 전 실행 계획(EXPLAIN) 검토를 옵션으로 검토**한다 — 비용 추정치의 해석이 DBMS 별로 다르므로 임계 기준을 데이터소스 단위 설정으로 둔다"
  - id: NFR-002
    category: 성능
    title: "표시 상한까지 한 번에 전달 — 서버사이드 페이징 없음"
    requirement: "**조회는 한 번만 실행하고 결과는 표시 상한까지 전량 전달한다.** 상한 안에서의 페이지 이동·정렬·필터는 그리드 컴포넌트가 클라이언트에서 처리한다. 전체 건수는 **상한 + 1행을 요청**해 판정하고, 초과가 확인되면 상한까지만 표시하며 총 건수를 '상한 이상' 으로 표기한다"
    why: "**페이징을 두지 않는 이유는 성능이 아니다.** 페이지마다 저장된 SQL 을 다시 실행하는 구조는 ① 종결된 턴이 업무 DB 를 계속 읽는 경로를 만들고 ② LLM 이 생성한 SQL 에는 정렬 유일성이 보장되지 않아 페이지 간 행 중복·누락이 발생하며 ③ 페이지 수만큼 상한을 우회한다. **전체 건수를 얻기 위한 별도 카운트 조회도 두지 않는다** — 상한이 걸리지 않는 쿼리를 방어 목적으로 추가하는 셈이 된다"
    measurement: "상한 초과 조회의 비율 · 결과 전달 페이로드 크기 분포"
    source: "**조회 실행 기록.** 페이로드 크기는 **결과를 직렬화한 직후** 재고 압축 후 전송량과 구분해 남긴다 — 둘을 섞으면 상한이 무엇을 막고 있는지 알 수 없다"
    test_case: null
    target: null
    implementation: "**상한 강제는 SQL 을 고쳐 쓰지 않고 JDBC 수준**(최대 행 수·fetch size·쿼리 타임아웃)에서 적용한다 — 검증된 SQL 을 다시 변형하는 경로를 만들지 않으며 DBMS 중립을 유지한다"
  - id: NFR-003
    category: 성능
    title: "상한 초과 조회는 업무 시스템으로 안내한다"
    requirement: "상한을 초과하는 조회는 조건 보완을 요구하고 업무 시스템 이용을 안내한다"
    why: "상한을 넘는 조회는 당장의 업무 수행보다 분석·통계·원천 데이터 수집 목적인 경우가 많고, 그것은 원래 업무 시스템의 일이다"
    measurement: "상한 초과 후 조건 보완으로 완료된 비율"
    source: "**턴 이력.** *조건 보완으로 완료* 는 **상한 초과 안내를 받은 것과 같은 대화 안에서 이어진 조회가 성공한 것**으로 센다 — 이어짐의 범위를 정하지 않으면 세는 사람마다 값이 달라진다"
    test_case: null
    target: null
  - id: NFR-004
    category: 성능
    title: "읽기 전용 계정과 별도 리소스 한도"
    requirement: "조회는 읽기 전용 계정과 별도 리소스 한도로 수행해 업무 시스템 영향을 억제한다"
    measurement: "업무 DB 의 Hub 세션 CPU·IO 점유율"
    source: "**고객사 모니터링 도구다 — 우리가 재지 못한다.** 업무 DB 안의 세션 점유는 Hub 밖의 값이라 고객사에 제출을 요청해야 한다(CON-015 와 같은 성격의 협의 항목). **우리 쪽에 값이 없다는 사실 자체를 기록한다** — 빈칸과 *문제 없음* 은 다르다"
    test_case: null
    target: null
  - id: NFR-005
    category: 성능
    title: "저장된 조회의 유량 제한"
    requirement: "**사용자당 저장 개수 상한** · **사용자당 대시보드 수 상한** · **대시보드당 위젯 수 상한** · **자동 실행의 동시 실행 수 제한과 결과 캐시 TTL** · **같은 위젯의 연속 실행 최소 간격(쿨다운)** · **실패 후 사용자·저장 조회 ID 단위 재시도 대기시간**(REQ-204). 조회 상한은 채팅 조회와 동일하며 **완화하지 않는다**"
    why: "저장된 조회는 토큰을 소모하지 않아 **쿼터가 유량 제한 역할을 하지 못한다.** 채팅 조회에서는 토큰 한도가 자연스러운 브레이크였지만, 조회 버튼은 부담 없이 반복 클릭된다"
    measurement: "사용자·기간 단위의 조회 실행 횟수와 누적 반환 행 수 (임계 초과 시 관리자에게 알린다)"
    source: "**저장된 조회의 실행 기록.** 채팅 조회와 같은 기록에 두되 **경로를 구분**하는 것이 전제다(NFR-017 이 그 비율을 본다). 알림은 집계가 임계를 넘을 때 낸다"
    test_case: null
    target: null
    hard_rule: "**결과 캐시는 DB에 저장하지 않는 메모리 캐시로 한정하고 TTL 안에서만 산다**(2026-09-28 사용자 결정) — 영속 캐시는 평문 업무 데이터의 저장 사본이 되어 PRN-07의 저장 사본 마스킹 원칙을 우회한다"
    note: "**하드 상한은 실측 후 정한다** — 처음부터 걸면 정상 사용을 막는다"
    roadmap: RM-P1

# ── 응답성 ──────────────────────────────────────────────────
# **넷이 정하는 것은 목표가 아니라 재는 방법이다**(ASM-002). 그래서 target 은 비어 있고,
# G2 가 볼 것은 *얼마나 빠른가* 가 아니라 **재고 있는가** 다.
  - id: NFR-006
    category: 응답성
    title: "응답성의 구간 정의와 시각 기준점 — 무엇을 재면 응답 시간인가"
    requirement: "턴 하나의 응답성을 **세 구간**으로 나누어 잰다 — ① **접수 확인**(질의 수신 → 접수 응답 반환 · TS-01) ② **첫 진행 표시**(질의 수신 → 사용자 화면의 상태가 처음 바뀐 시점) ③ **최종 응답**(질의 수신 → TS-06 완료). **MET-03 이 말한 「첫 응답」은 ②이며 ①이 아니다** — 접수 확인은 접수됐다는 사실만 알릴 뿐 사용자의 기다림을 끝내지 않는다"
    hard_rule: "**기준 시각은 agent 가 질의를 수신한 서버 시각 하나다.** 클라이언트 시계를 t0 로 쓰지 않는다 — 폐쇄망 PC 의 시계를 맞출 방법이 없고, 어긋난 t0 는 음수 지연을 만들어 분포 전체를 오염시킨다. 사용자 PC ↔ portal 구간은 이 값에 들어가지 않으며, 사용자가 실제로 겪는 지연은 NFR-007 이 폴링 주기와 함께 따로 잡는다"
    aggregation: "**정상 종결(TS-06)과 그 밖(TS-04 중단 · TS-05 실패)을 분리해 집계한다** — 실패가 빨리 끝날수록 평균이 좋아지는 착시가 생긴다. **평균을 지표로 삼지 않는다**: p50 · p95 · p99 · 최대를 함께 남기고 표본 수를 붙인다. **질의 유형(조회 · 실행 · 지식)별로 나눈다** — 성격이 다른 것을 한 분포에 섞으면 무엇이 느린지 볼 수 없다"
    measurement: "구간 ①②③ 각각의 소요 시간 분포(p50·p95·p99·최대) · 종결 상태별 · 질의 유형별 · 표본 수"
    source: "**턴 이력.** t0 는 agent 가 질의를 수신한 서버 시각이고, 구간 ②(첫 진행 표시)는 **폴링 응답이 상태 변화를 처음 실어 나른 시각**이라 서버 기록만으로는 잡히지 않는다 — NFR-007 과 같은 지점에서 함께 남긴다"
    test_case: null
    target: null
    note: "**같은 값을 두 번 재지 않는다** — 총 소요 시간의 측정은 유지하되 NFR-013에 따라 턴 전체 시간 상한으로 집행하지 않는다. 시간 예산 계산용 별도 테이블은 요구하지 않는다. 저장된 조회(LLM 미경유)의 실행 시간은 NFR-001이 갖는다"
    traces_to: [ARCH-015]
  - id: NFR-007
    category: 응답성
    title: "체감 지연은 폴링 주기가 지배한다 — 설정값과 함께 잰다"
    requirement: "portal ↔ agent 가 비동기 폴링이므로(ARCH-015) 사용자가 상태 변화를 보기까지의 지연은 **서버 처리 시간 + 다음 폴링까지의 대기**다. 그때 유효했던 **폴링 주기 설정값을 함께 기록**하고, 주기를 바꾸면 변경 시각을 남겨 앞뒤 분포를 가른다"
    why: "서버가 상태를 200ms 만에 바꿔도 주기가 5초면 사용자는 최대 5초를 기다린다. **그때 고칠 것은 코드가 아니라 설정이다** — 나누어 재지 않으면 엉뚱한 곳을 고치고, 서버 구간만 재면 사용자가 겪는 것을 재지 못한다"
    detail: "**폴링 부하를 같은 자리에서 본다** — 주기를 줄이면 체감은 좋아지고 요청 수는 늘어난다. 턴당 폴링 요청 수를 함께 집계해야 균형점을 근거로 고를 수 있다. **진행 표시가 한 번도 갱신되지 않은 채 끝난 턴은 따로 센다** — REQ-018 이 상태와 경과 시간 표시를 요구하는데 그 턴에서는 요구가 지켜지지 않은 것이다"
    measurement: "상태 변화 시각 → 그것을 실어 나른 폴링 응답 시각의 차 분포 · 유효 폴링 주기 설정값 · 턴당 폴링 요청 수 · 진행 표시 무갱신 종결 턴의 비율"
    source: "**폴링 요청 처리 지점.** 상태 변화 시각은 턴 이력이, 실어 나른 시각은 폴링 응답이 갖는다 — **두 기록을 잇지 않으면 이 값이 나오지 않는다.** 유효 주기는 admin 시스템 설정의 **변경 이력**에서 온다(그때 값이어야 한다)"
    test_case: null
    target: null
    traces_to: [ARCH-015]
    reqs: [REQ-018]
  - id: NFR-008
    category: 응답성
    title: "총 시간을 구성으로 분해한다 — 나누지 않으면 고칠 곳을 모른다"
    requirement: "턴의 소요 시간을 **LLM 대기 · 도구 실행(업무 DB 조회 / 업무 API 실행) · 지식 검색(임베딩 호출 포함) · 큐 대기 · 그 밖 자체 처리**로 나누어 기록한다. 스텝마다 **역할(주 추론 / 보조 판정)과 그때 쓰인 공급 경로·모델·effort** 를 함께 남긴다 — ARCH-040 이 비용 분석을 위해 이미 요구하는 기록이며, 응답성은 같은 기록의 시간 축을 쓴다"
    why: "총 시간만 있으면 *느리다* 만 남는다. 분해가 없으면 **개선 대상의 선택이 추측이 된다** — 모델을 낮출 일인지, 조회를 좁힐 일인지, 인스턴스를 늘릴 일인지가 여기서 갈린다"
    hard_rule: "**벽시계 시간과 누적 처리 시간을 둘 다 남긴다.** 사용자대기(TS-03)와 중단 후 재시도 접수 전 구간은 벽시계에는 들어가고 처리에는 들어가지 않는다. 재시도는 TS-04 → TS-01 → TS-02로 접수·실행 용량 확인을 거치며 큐 대기는 별도 기록한다. 하나만 남기면 *사용자가 기다린 시간* 과 *시스템이 쓴 시간* 중 하나를 잃는다"
    detail: "**되돌림으로 버려진 회차의 시간도 남긴다**(NFR-014) — 버려진 스텝도 사용자가 기다린 시간이고, 회차 상한을 조정할 근거가 거기서 나온다. **큐 대기 시간의 정본은 NFR-023 이며** 여기서는 턴 시간의 구성 요소로 그 값을 끌어 쓴다"
    measurement: "구간별 소요 시간 분포(p50·p95·p99·최대) · 역할별 LLM 대기 시간 · 스텝 수 대비 총 시간 · 버려진 회차의 누적 시간 · 벽시계와 누적 처리 시간의 차"
    source: "**스텝 기록** — ARCH-040 이 비용 분석을 위해 이미 요구하는 그 기록에 **시작·종료 시각을 함께** 남긴다. 구간(LLM 대기 / 도구 실행 / 지식 검색 / 큐 대기 / 자체 처리)은 스텝의 종류로 가른다"
    test_case: null
    target: null
    traces_to: [ARCH-040]
  - id: NFR-009
    category: 응답성
    title: "멈춘 턴을 사용자가 알기까지 — 헛되이 기다린 시간도 응답 시간이다"
    requirement: "인스턴스 이상이나 점유 만료로 실제 처리가 멈춘 턴이 **중단(TS-04)으로 사용자에게 보이기까지의 지연**을 잰다. 설계상 상한은 **점유 유지 시간 + 만료 회수 배치 주기**이고 둘 다 운영 설정이다(ARCH-070 · FEAT-020). **설정값과 실측 지연을 함께 남긴다** — 실측이 상한을 넘으면 회수 배치가 밀린 것이고 크게 밑돌면 설정이 과하게 보수적인 것인데, 설정값 없이는 어느 쪽인지 판정할 수 없다"
    why: "**멈춘 동안에도 화면은 「처리 중」이다.** 자동 재개는 하지 않으므로(ARCH-070) 이 구간은 사용자가 아무것도 진행되지 않는 채로 기다리는 시간이며, 사용자에게는 응답이 늦는 것과 구분되지 않는다"
    measurement: "마지막 점유 갱신 시각 → 중단 전이 시각의 지연 분포 · 그때의 점유 유지 시간·회수 주기 설정값 · 만료로 중단된 턴 수 / 전체 턴 수 · 그중 사용자가 재시도한 비율"
    source: "**점유 기록과 만료 회수 배치.** 마지막 갱신 시각은 점유가, 중단 전이 시각은 턴 이력이 갖는다. 설정값은 운영 설정의 **변경 이력**에서 온다 — **그때 유효했던 값이어야 하므로 현재 값을 쓰면 판정이 뒤집힌다**"
    test_case: null
    target: null
    note: "**회수 건수와 그 유형별 분해는 여기가 갖지 않는다** — `documents/design/turn-execution.md` §7 이 점유 관측의 정본이다. 여기가 갖는 것은 **사용자가 헛되이 기다린 시간** 하나다"
    traces_to: [ARCH-070]

# ── 토큰·비용 관리 ──────────────────────────────────────────
  - id: NFR-010
    category: 비용
    title: "사용량 기록과 토큰 풀 기준 단가"
    requirement: "Hub는 실제 LLM 호출의 **공급 경로·모델·effort·계량 단위별 수량과 계량 출처**를 사용자·기간별로 기록·집계한다. 공급 경로 응답이 입력·출력·캐시 토큰 수를 주면 그 값을 기록하고, 응답에 토큰 수가 없으면 Hub가 실제 전송 프롬프트와 수신 응답 본문을 당시 모델의 토큰 계산기로 산출한 입력·출력 **추정 사용량**을 기록한다. 월 총 토큰 풀 산정에는 공급 경로·모델의 기본 공개 요금과 고객사가 정한 입력·캐시·출력 구성비로 계산한 **계획 1M 기준 단가**와 관리자가 확정한 토큰 풀 보정률을 사용한다"
    effort_rule: "**effort 는 계획 단가의 키가 아니다**(TRM-091) — 추론 레벨은 토큰 소모량과 응답 시간을 바꾸므로 사용량 기록의 필수 분석 축으로 남긴다. 역할별·등급별 모델과 effort 사용 구성의 차이는 공급사 월 집계와의 보정률로 다음 달 토큰 풀에 반영한다"
    detail: "계획 단가는 기본 공개 요금만 대상으로 하며 할인·이벤트·계약 특가·세금·구독료·배치·우선처리·실제 캐시 적중률 같은 예외 정책을 반영하거나 자동 추적하지 않는다. 공급 경로가 준 계량값은 원문 그대로 기록하고, Hub 추정 사용량은 **공급사 계량값으로 표기하거나 덮어쓰지 않는다**. 추정 시에는 토큰 계산기 식별자·버전과 계산 대상(전송 프롬프트·수신 응답)을 함께 남긴다. 캐시 적중처럼 본문만으로 알 수 없는 단위는 추정 0으로 기록하지 않고 미상으로 남긴다. 개별 호출의 예상 비용은 계산하지 않는다"
    hard_rule: "월 총 토큰 풀은 `floor(계획 가능 금액 ÷ (계획 1M 기준 단가 × 확정 보정률) × 1,000,000)`으로 자동 산정하며, 안전 여유율은 적용하지 않는다. 계획 1M 기준 단가와 구성비는 월별 산정 기준으로 이력을 남기며 과거 월의 토큰 풀·배정·사용량을 소급 변경하지 않는다. 이 값은 전사 예산·공급사 청구·회계 정산의 금액이 아니라 다음 달 토큰 풀을 계산하기 위한 운영 기준이다"
    quota_count_rule: "개인 쿼터 차감값은 공급 경로가 **총 토큰 수**를 주면 그 값을 우선 사용한다. 총 토큰 수가 없고 입력·캐시·출력 등 분리 필드만 있으면, 공급 경로별로 등록한 **비중복 필드 조합**만 합산한다. 응답에 계량값이 전혀 없으면 실제 전송 프롬프트와 수신 응답 본문을 계산한 입력·출력 추정값을 합산하며, 이때 캐시는 별도 추정·가산하지 않는다"
    unknown_unit_rule: "공급 경로 응답의 모르는 계량 단위는 0으로 기록하거나 조용히 버리지 않는다. 캐시가 입력 토큰에 포함되는지 여부와 비중복 조합은 공급 경로별 차감 규칙으로 명시하며, 새 공급 경로 또는 응답 계량 형식 변경은 이 규칙을 등록하기 전 **사용자 쿼터가 적용되는 호출로 허용하지 않는다**. 본문만으로 알 수 없는 캐시 등 단위는 미상으로 남겨 공급사 월 집계 대조의 차이 원인이 되게 한다"
    measurement: "질의당 계량 수량(공급 경로·모델·effort·단위별)과 출처(공급사 계량·Hub 추정) · 추정 사용량 비율 · 캐시 적중률 · 계획 1M 기준 단가 · 공급사 실제 1M 비용과의 괴리율"
    source: "**LLM 호출 기록(사용량)과 월별 계획 단가 기준 이력.** 계량 수량은 공급 경로 응답이 준 값 또는 당시 전송 프롬프트·수신 응답으로 Hub가 계산한 값이며, 호출에는 적용한 공급 경로별 쿼터 차감 규칙 식별자와 추정값의 계산기 식별자·버전을 남긴다. 월별 토큰 풀에는 당시의 계획 기준 식별자를 함께 남긴다"
    test_case: null
    target: null
    traces_to: [ARCH-040]
  - id: NFR-011
    category: 비용
    title: "월별 개인 쿼터 배분·추가 승인 이력의 운영 정합성"
    requirement: "REQ-116~119에 따라 확정한 월별 토큰 풀·등급별 배분·개인 기본 한도·추가 승인과 실제 사용량을 **같은 대상 월과 사용자 기준으로 재구성**할 수 있어야 한다. 계획값·일반 배정·예외 승인·실제 사용·월말 만료를 서로 다른 이력으로 보존하고 대조한다"
    why: "업무량은 월초·월말에 몰릴 수 있으므로, 주별로 쪼개지 않고 한 달 안에서 사용량을 유연하게 쓰게 한다. 토큰 계량과 공급사 청구에는 오차가 있고 긴급 업무도 있으므로 계획 총 풀을 절대 상한으로 강제하면 정상 운영을 해친다. 반대로 예외를 근거 없이 자동 허용하면 사용 통제와 사후 정산 근거가 사라진다"
    hard_rule: "쿼터는 **Hub 사용량 통제와 운영 가이드**이지 전사 예산 편성·잔액 통제·회계 처리 기능이 아니다. 월중 변경으로 과거의 배정·승인·사용량을 소급 재계산하지 않으며, 계획 총 풀 밖의 예외 승인과 공급사 계량 차이는 일반 배정이나 계획값을 덮어쓰지 않고 별도 근거로 남긴다"
    measurement: "월별 계획 총 토큰 풀 대비 등급별 배분 가중치·등급별 활성 사용자 수·가중치 1단위 토큰량·미배정 계획량·사용자별 배정·누적 사용·잔여 한도·공급사 계량/Hub 추정 사용량 · 신규 사용자 일할 배정 건수·배정량과 미배정 계획량 초과분 · 승급의 적용 월 반영 건수 · 승계 확정 월 · 초과 신청·승인(부분 승인 포함)·반려·미처리 만료 건수와 승인량 · 계획 총 풀 밖 예외 승인량과 사유 · 계획·실제 1M 비용 괴리율과 시스템 제안·수동 보정률 및 근거 · Hub 기록과 공급사 계량의 실제 사용 차이 · 월말 만료량"
    source: "**사용량 기록·월별 쿼터 배분 기준·사용자 배정·추가 승인 이력·공급사 월 사용량의 대조.** 공급사 사용분 기준 토큰 총량과 비용은 월 단위 대조값으로 기록하고, 할인·세금·구독료·일회성 크레딧 등 비교를 왜곡하는 달은 보정 계산에서 제외할 수 있다. 각 사용량에는 발생 시점의 월과 사용자, 각 배정·승인·수동 보정에는 대상 월·근거·처리자·토큰량을 남기며, 계획 초과와 계량 차이는 계획값을 덮어쓰지 않고 별도 대조 근거로 남긴다"
    traces_to: [REQ-116, REQ-117, REQ-118, REQ-119]
    test_case: null
    target: null
  - id: NFR-012
    category: 비용
    title: "쿼터 집행 — 시작 전 검사와 선택적 스텝 재검사"
    requirement: "**새 턴과 중단 후 새 시도를 시작하기 전의 개인 쿼터 검사는 항상 수행한다.** 턴 처리 중 각 스텝의 LLM 호출 직전 쿼터 재검사는 시스템 설정으로 활성화·비활성화하며 **기본값은 비활성화(false)**다. 비활성화 시 이미 시작한 처리는 개인 쿼터 소진만을 이유로 중단하지 않고 실제 사용량을 전량 기록한다. 이후 새 턴·새 시도는 그 사용량을 반영해 검사한다"
    detail: "시작 전 검사는 커밋된 사용량과 개인의 당시 유효 한도를 기준으로 하며 여유가 없으면 시작하지 않고 추가 사용 신청 경로를 안내한다. 재검사가 활성화된 경우 각 스텝의 LLM 호출 직전에 같은 기준으로 검사하여 사용량이 한도 이상이면 그 호출과 후속 처리를 시작하지 않는다. 기존 쿼터 소진 상태 규칙에 따라 실패로 종결하되 이미 수행한 업무·발생한 사용량·감사 이력은 남긴다. 비활성화 상태의 유효한 사용자대기 후 이어가기는 새 턴 시작이 아니므로 쿼터 소진만으로 차단하지 않는다. 계획 총 토큰 풀은 개인별 집행 한도와 구분하며, 진행 중 처리의 정책상 허용된 초과·승인된 추가 한도·동시 호출의 계량 지연을 각각 구분해 대조한다"
    hard_rule: "이 설정은 개인 쿼터의 처리 중 재검사만 제어한다. 시작 전 검사·모델 허용 범위·권한·실행 승인·사용량 기록을 끄지 않는다. 활성 상태에서도 이미 전송한 LLM·업무 실행 요청을 취소하거나 롤백한 것으로 처리하지 않고 다음 호출 경계에서 차단한다. 차단 안내를 만들기 위해 모델을 추가 호출하지 않는다. 이미 수행한 업무와 결과 불명 여부를 보존·안내하며 실행 결과를 확인 없이 실패로 단정하지 않는다"
    measurement: "시작 전 쿼터 차단 건수 · 설정 활성/비활성별 개인 한도 초과 건수·초과량 · 활성 상태에서 처리 중 쿼터 소진으로 실패한 턴 수"
    source: "2026-10-01 사용자 결정 — 스텝 LLM 호출 직전 쿼터 검사 활성/비활성을 시스템 설정으로 제공하고 기본은 처리 중 중단하지 않음. 계측은 시작·호출 경계의 적용 설정값/버전·개인 유효 한도·커밋된 사용량·판정 시각·차단 또는 검사 생략 사유를 실제 호출 사용량과 연결한다"
    config:
      - "시스템 공통 운영 설정: 처리 중 스텝 LLM 호출 전 개인 쿼터 재검사 여부. 불리언, 기본 false, 관리 권한자가 배포 없이 변경한다. 저장 후 다음 LLM 호출 직전부터 진행 중인 턴에도 적용하며 이미 전송한 호출은 소급 취소하지 않는다(2026-10-01 사용자 확정). REQ-614에서 항목·기본값·현재 값·원천·적용 시점을 표시한다. 구체적인 설정 키는 P2에서 정한다"
    examples:
      - { kind: 정상, case: "재검사 비활성 상태에서 잔여 1,000토큰으로 시작한 턴이 5,000토큰을 사용해도 개인 쿼터 소진만으로 중단하지 않는다. 실제 5,000토큰을 기록하고 다음 새 턴·새 시도는 갱신된 사용량으로 시작 전 검사해 차단한다" }
      - { kind: 예외, case: "재검사 활성 상태에서 앞 스텝까지 커밋된 사용량이 개인 한도에 도달하면 다음 LLM 호출은 전송하지 않고 쿼터 소진으로 처리를 끝낸다. 그 전에 사용한 토큰과 수행한 업무는 지우지 않는다" }
      - { kind: 예외, case: "활성 상태라도 동시에 검사에 통과한 호출의 사용량이 나중에 기록되면 한도를 초과할 수 있다. 비활성 상태에서는 진행 중 처리의 사용량만큼 초과할 수 있으므로 초과량을 소폭이라고 보장하지 않는다" }
      - { kind: 예외, case: "비활성 상태에서 시작한 모델 호출 A의 응답을 기다리는 동안 설정을 활성화해도 A는 취소하지 않는다. 다음 호출 B 직전에 활성 설정과 커밋된 사용량을 확인해 한도에 도달했다면 B를 전송하지 않는다. 반대로 비활성화하면 이후 호출은 쿼터 소진만으로 차단하지 않되 이미 실패로 종결한 턴을 자동 재시작하지 않는다" }
    test_case: null
    target: null
    note: "이 설정은 선차감·토큰 예약·정확한 한도 내 사용을 보장하는 기능이 아니다. 비활성 상태에서 허용된 초과도 실제 사용량에 포함하며 초과분을 버리거나 사용량을 한도로 잘라 기록하지 않는다"
    open: "@defer P2 — 재검사 여부의 구체적인 설정 키와 설정 버전 조회·감사 계약을 정한다. 다음 호출 직전 적용과 기본 false는 확정값이다"
  - id: NFR-013
    category: 비용
    title: "턴 최대 스텝 수 — 전체 시간·토큰 상한은 두지 않는다"
    requirement: "한 턴의 **최대 스텝 수**를 제한한다. 턴 전체 누적 토큰과 전체 소요 시간에는 강제 종료 상한을 두지 않는다. 개인 쿼터의 시작 전 검사와 선택적 처리 중 재검사는 NFR-012로 별도 집행한다. 개별 LLM·도구 호출 타임아웃, 모델·API 자체 한도, 사용자대기 만료와 실행 점유 만료는 유지하며 전체 시간 상한 폐지로 해제되지 않는다"
    hard_rule: "**회차와 무관하게 턴 전체 누적으로 집행한다** — 되돌리면 스텝 순번은 처음부터 다시 시작되지만 상한까지 초기화되면 처리 중 변경으로 되돌림을 반복하는 것만으로 상한이 무한히 늘어난다"
    implementation: "**이 상한은 오케스트레이션 프레임워크의 자체 제한 기능이 아니라 우리 코드에서 집행한다** — 프레임워크의 제한값은 대개 그래프 컴파일 시점에 고정되어 PRN-06(배포 없는 런타임 변경)을 만족하지 못하고, 초과 시의 처리도 우리 턴 상태 모델과 다르다"
    measurement: "턴당 스텝 수·누적 토큰·소요 시간 분포 · 스텝 상한 도달로 종료된 턴 수. 사용량과 시간은 상한 집행 여부와 무관하게 기록한다"
    source: "**턴 이력** — 소요 시간은 **NFR-006 이 재는 지점을 그대로 쓴다**(두 번 재지 않는다). 스텝 수·누적 토큰은 스텝 기록의 합이다"
    test_case: null
    target: null
    note: "남은 스텝 수를 LLM에 알려 범위를 조절하거나 종결하도록 유도한다. 이는 안내이며 강제의 대체가 아니다. 한 질의의 복수 지시·워크플로우도 전체 시간·토큰 상한으로 끊지 않되 스텝 상한과 개별 호출 제한을 우회하지 않는다"
    decision: "2026-10-01 사용자 승인 — 전체 시간·턴당 토큰 강제 종료 상한을 없애고 최대 스텝 수·개별 호출 제한·개인 동시 처리 한도로 통제한다. 재시도 잔여 시간 계산은 필요하지 않다"
    open: "@defer P2 — 스텝 상한의 기본값·변경 적용 시점·도달 시 종결 계약을 구체화한다. 회차 변경으로 누적 스텝 수를 초기화하지 않으며, 새 시도의 스텝 순번과 턴 누적 집계는 구별한다"
  - id: NFR-014
    category: 비용
    title: "되돌림 상한 (회차 상한)"
    requirement: "한 턴에서 되돌려 다시 수행할 수 있는 횟수를 제한한다. 처리 중 변경으로 이전 체크포인트가 반복해 무효화되면 버려지는 회차마다 토큰이 새로 발생하므로 NFR-013의 스텝 상한과 함께 집행한다"
    measurement: "턴당 회차 수 분포 · 회차 상한 도달 건수"
    source: "**턴 이력의 회차 값.** 되돌림으로 버려진 스텝은 **지우지 않고 회차로 구분해** 남긴다 — 지우면 NFR-008 의 *버려진 시간* 도 함께 사라진다"
    test_case: null
    target: null
    note: "**값은 미확정이다**"
  - id: NFR-015
    category: 비용
    title: "임베딩 비용의 귀속"
    requirement: "지식 본문 임베딩(admin)은 개인 쿼터가 아닌 **시스템 비용**으로 집계한다. 질의 키워드 임베딩(agent)은 해당 사용자 사용량에 포함한다. **평가셋 실행 비용도 시스템 비용**으로 집계한다"
    measurement: "시스템 비용 / 전체 비용 비율 · 재임베딩 1회당 비용"
    source: "**임베딩 호출 기록.** 귀속(시스템 / 사용자)을 **호출 시점에 정해** 남긴다 — 사후에 admin 이 불렀는지 agent 가 불렀는지로 되짚으면 재임베딩과 평가셋이 섞인다"
    test_case: null
    target: null
  - id: NFR-016
    category: 비용
    title: "월별 공급사 사용 대조와 보정 근거 제공"
    requirement: "Hub는 월별 사용량·공급 경로·모델·effort·계량 단위·사용자 및 시스템 귀속을 집계·다운로드하고, 관리자가 공급사가 제공한 월별 사용 토큰 총량과 사용분 비용을 대조값으로 기록해 계획 1M 단가와의 괴리율·다음 달 보정률 제안을 확인할 수 있어야 한다"
    detail: "대조값은 토큰 풀 보정용 관측 자료이며 청구서·전표·회계 정산을 처리하지 않는다. 공급사 청구서의 형식, 약정 할인·통화·세금 반영, 전표 처리와 최종 정산은 재경·회계의 업무다. 고정 요금·세금·일회성 할인처럼 사용 패턴 비교를 왜곡하는 값은 대조 근거와 함께 보정 계산에서 제외할 수 있다"
    measurement: "월별 대조값·괴리율·보정률 제안 생성 가능성 · 보정 대상에서 제외된 월과 근거 · Hub 기록과 공급사 토큰 총량 차이"
    source: "**Hub 집계는 LLM 사용량 기록에서**, 공급사 사용 토큰·사용분 비용 대조값은 관리자가 월별로 기록한 근거에서 온다. 공급사 청구서 원문과 회계 처리 자료는 Hub의 저장·처리 대상이 아니다"
    test_case: null
    target: null
  - id: NFR-017
    category: 비용
    title: "쿼터가 닿지 않는 경로를 전제한다"
    requirement: "**저장된 조회는 LLM 을 호출하지 않으므로 토큰을 소모하지 않고 쿼터로 억제되지 않는다.** 이 경로의 유량 제한은 NFR-005 가 담당하며, **쿼터를 유일한 부하 통제 수단으로 전제하지 않는다**"
    measurement: "저장된 조회 실행 건수 / 채팅 조회 건수 비율"
    source: "**채팅 조회와 저장된 조회의 실행 기록.** 같은 기록에 경로 구분을 두는 것이 전제다(NFR-005)"
    test_case: null
    target: null

# ── 가용성 · 운영성 · 확장성 ────────────────────────────────
  - id: NFR-020
    category: 가용성
    title: "LLM 공급 경로 장애 — 수동 전환, 자동 폴백 미약속"
    requirement: "공급 경로 장애가 길어지면 관리자가 설정 변경으로 대체 공급 경로·모델에 전환할 수 있다. **이는 수동 조치이며 자동 폴백을 약속하지 않는다.** 장애 중 진행 턴은 중단 상태로 전환되고 REQ-013의 허용 조건을 충족하면 재시도할 수 있다. 새 시도에는 ARCH-040에 따라 현재 허용된 모델·공급 경로 설정을 적용할 수 있다"
    measurement: "장애 감지부터 전환까지 소요 시간 · 장애로 중단된 턴 수와 재시도 성공률"
    source: "**공급 경로 호출 실패 기록과 전환 조작 이력.** 전환이 수동이므로 **감지 시각은 시스템이, 전환 시각은 관리자 조작이** 갖는다 — 둘을 잇지 않으면 소요 시간이 나오지 않는다"
    test_case: null
    target: null
