# 비기능 목표치 — 성능 · 응답성 · 비용 · 가용성 · 확장성 · 운영성 · 보안 · 규정준수
#
# 작성 단계: P2
# status: migrated — 사용자 승인 전이다.
#
# **목표 수치는 아직 확정하지 않았다.** 성공 기준(00-charter/_index.yaml)과 같은 이유로
# P1 종료 시점에 실측을 근거로 확정한다. `target: null` 인 항목은 그 표시다.
#
# **칸이 셋이다 — `measurement`(무엇을 재나) · `source`(어디서 나오나) · `target`(얼마여야 하나).**
# `source` 는 2026-09-10 에 세웠다. 그 전에는 19건 중 수집 주체를 적은 것이 하나뿐이었고,
# **재는 방법을 적었다는 것과 잴 수 있다는 것이 같지 않았다** — 어디서 나오는지 없는 지표는
# 계측을 심을 때 *어디에 심나* 부터 다시 정해야 하고, 그때 정하면 지표마다 다르게 정해진다.
# **우리가 잴 수 없는 것은 그렇다고 적는다**(NFR-004) — 빈칸과 *문제 없음* 은 다르다.
#
# 추적성 T7: 모든 NFR 은 `measurement` · `source` · `test_case` 를 가져야 한다.
# **measurement 와 source 는 모두 있고, TC 는 아직 없다** — 70-testcases/_index.yaml 이 비어 있으며
# P3 에서 만든다. 소유 작업흐름 G3 전까지 이 결손은 경고이고, G2 는 04-gates.md 의 대안 기준
# (목표를 미루기로 한 명시적 결정 + measurement/source)으로 판정한다.
#
# **응답성(MET-03)의 정본이 여기다** — 00-charter/_index.yaml 이 성공 기준에서 응답성을 내리며
# 정본을 NFR 로 지목했고, 받는 자리가 NFR-006~009 다(2026-09-10 신설 · ASM-002 가 맡았던 일).
# **넷이 정하는 것은 재는 방법이고 목표값은 여기서도 비운다** — 측정을 먼저 만들고,
# 정확히 잰 뒤에, 개선이 필요한지 판단한다.
# @defer P4 응답성 계측을 심는다 — 설계가 선 뒤이고, G3 승인 전에는 guard-write 가 sources/ 를 막는다

