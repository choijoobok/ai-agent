# 첫 물리 묶음의 집합·명령 처리 — 제품 구현 전 설계 초안
entities:
  - id: ENT-017
    name: "대상 시스템 허용 연결"
    term: TRM-261
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_TARGET_SYSTEM_CONN
    features: ["FEAT-001"]
    reqs: ["REQ-604"]
    attributes:
      - {"name":"대상 시스템 식별자","physical_name":"TARGET_SYSTEM_ID","pk":true,"description":"허용 집합의 소유 시스템"}
      - {"name":"배포 API 연결 식별자","physical_name":"CONNECTION_ID","pk":true,"description":"현재 로드 정의에서 선택한 비밀 없는 참조. 주소/인증/헤더 사본이 아니다"}
    relations:
      - {"entity":"ENT-001","cardinality":"허용 연결마다 시스템 하나","description":"부모 변경과 같은 트랜잭션으로 전체 집합 저장"}
    rules:
      - "연결 없는 등록 초안은 자식 0개다. 같은 시스템/연결 중복은 기본키가 거부한다"
      - "기본 연결의 집합 소속은 ENT-001의 지연 FK로 커밋 시 검증한다. 실제 사용 중 참조 제거 보호는 FEAT-001 계약이 추가로 검사한다"
    delete_policy: "부모의 참조 검증을 통과한 집합 교체/허용 삭제에서 같은 트랜잭션으로 제거한다. 별도 독립 삭제 기능은 없다"
    physical:
      attributes:
        - {"name":"TARGET_SYSTEM_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"CONNECTION_ID","type":"character varying(100)","nullable":false,"default":null}
      constraints:
        - {"name":"PK_ADM_TARGET_SYSTEM_CONN","definition":"PRIMARY KEY (TARGET_SYSTEM_ID, CONNECTION_ID)"}
        - {"name":"FK_ADM_CONN_TARGET","definition":"FOREIGN KEY (TARGET_SYSTEM_ID) REFERENCES AI_ADMIN_TARGET_SYSTEM (TARGET_SYSTEM_ID) DEFERRABLE INITIALLY DEFERRED"}
      indexes:
        - {"name":"IX_ADM_CONN_REFERENCE","unique":false,"method":"btree","definition":"(CONNECTION_ID, TARGET_SYSTEM_ID)"}

  - id: ENT-018
    name: "데이터소스 적용 가능 그룹"
    term: TRM-262
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_DATA_SOURCE_GROUP
    features: ["FEAT-002"]
    reqs: ["REQ-603"]
    attributes:
      - {"name":"데이터소스 식별자","physical_name":"DATA_SOURCE_ID","pk":true,"description":"매핑 어휘 집합의 소유 데이터소스"}
      - {"name":"그룹 안정 식별자","physical_name":"GROUP_ID","pk":true,"description":"FEAT-006의 관리 그룹 참조. 현재 BIGINT 설계는 소유 영역과 물리 계약 대조가 필요하다"}
    relations:
      - {"entity":"ENT-002","cardinality":"그룹 매핑마다 데이터소스 하나","description":"집합 교체와 참조 보호를 부모 변경에 포함한다"}
    rules:
      - "적용 가능 그룹 집합은 추가 런타임 권한 게이트가 아니다"
      - "하위 테이블/컬럼 매핑에 쓰는 그룹 제거는 차단하며 그룹 조회 실패를 미사용으로 보지 않는다"
    delete_policy: "부모의 그룹 매핑 참조 검증 후 같은 트랜잭션으로 제거한다. 참조 중이거나 검증 불가면 삭제하지 않는다"
    pending:
      - "@defer P3 access_policy — 그룹 엔티티의 식별 타입·물리 FK 및 그룹 삭제/하위 매핑 쓰기의 동일 잠금 계약을 확정한다. 가짜 그룹 테이블을 참조하지 않는다"
    physical:
      attributes:
        - {"name":"DATA_SOURCE_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"GROUP_ID","type":"bigint","nullable":false,"default":null}
      constraints:
        - {"name":"PK_ADM_DATA_SOURCE_GROUP","definition":"PRIMARY KEY (DATA_SOURCE_ID, GROUP_ID)"}
        - {"name":"FK_ADM_GROUP_SOURCE","definition":"FOREIGN KEY (DATA_SOURCE_ID) REFERENCES AI_ADMIN_DATA_SOURCE (DATA_SOURCE_ID)"}
      indexes:
        - {"name":"IX_ADM_GROUP_REFERENCE","unique":false,"method":"btree","definition":"(GROUP_ID, DATA_SOURCE_ID)"}

  - id: ENT-019
    name: "연동 자산 변경 처리"
    term: TRM-263
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_ASSET_COMMAND
    features: ["FEAT-001","FEAT-002"]
    reqs: ["REQ-601"]
    attributes:
      - {"name":"명령 식별자","physical_name":"COMMAND_KEY","pk":true,"description":"한 저장 의도를 식별하는 UUID 문자열. HTTP 추적 ID와 별개다"}
      - {"name":"처리 주체","physical_name":"ACTOR_ID","description":"서버가 현재 인증 주체에서 확정한다"}
      - {"name":"입력 지문","physical_name":"REQUEST_DIGEST","description":"정규화한 대상/작업/기대 버전/전체 입력/사유/주체의 SHA-256. 원문/비밀을 보관하지 않는다"}
      - {"name":"대상 종류","physical_name":"TARGET_KIND","description":"대상 시스템 또는 데이터소스"}
      - {"name":"대상 식별자","physical_name":"TARGET_ID","description":"생성 결과 또는 변경한 기존 대상"}
      - {"name":"작업 종류","physical_name":"ACTION_CD","description":"CREATE/CHANGE/REFERENCE_CORRECTION/DELETE"}
      - {"name":"반영 버전","physical_name":"RESULT_VERSION","description":"성공한 새 관리 버전. 삭제도 마지막 버전+1"}
      - {"name":"이력 식별자","physical_name":"HISTORY_ID","description":"신규를 포함한 성공 명령이 생성한 대상 종류의 확정 후 이력으로 해석"}
      - {"name":"반영 시각","physical_name":"APPLIED_DTM","description":"성공 트랜잭션의 서버 시각"}
    relations:
      - {"entity":"ENT-001","cardinality":"시스템 명령이면 당시 대상 하나","description":"삭제 뒤 현재 행은 없어도 처리 결과는 남는다"}
      - {"entity":"ENT-002","cardinality":"데이터소스 명령이면 당시 대상 하나","description":"현재 행에 물리 FK를 두지 않는다"}
    rules:
      - "50-api.feature_contracts.FEAT-001.shared_write_contract의 같은 주체/명령/입력 판정과 권한 검사를 따른다"
      - "성공 결과만 현재값/집합/이력과 같은 트랜잭션으로 남긴다. 롤백은 명령 결과도 남기지 않는다"
      - "처리 중은 미커밋 트랜잭션이며 조회에서 미발견을 미실행 확정으로 반환하지 않는다"
    delete_policy: "현재 자산 삭제에 연쇄 삭제하지 않는다. 아래 보존/재수신 경계가 확정되기 전 파기 기능을 활성화하지 않는다"
    pending:
      - "@defer P3 audit_trace — 관리 이력 보존 정책과 명령 키 재사용/늦은 재수신 차단의 보존 경계를 함께 확정한다. 그 전 파기 기능을 활성화하지 않으며 무기한 보존을 운영 정책으로 확정한 것은 아니다"
    physical:
      attributes:
        - {"name":"COMMAND_KEY","type":"character(36)","nullable":false,"default":null}
        - {"name":"ACTOR_ID","type":"character varying(30)","nullable":false,"default":null}
        - {"name":"REQUEST_DIGEST","type":"character varying(64)","nullable":false,"default":null}
        - {"name":"TARGET_KIND","type":"character varying(20)","nullable":false,"default":null}
        - {"name":"TARGET_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"ACTION_CD","type":"character varying(30)","nullable":false,"default":null}
        - {"name":"RESULT_VERSION","type":"bigint","nullable":false,"default":null}
        - {"name":"HISTORY_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"APPLIED_DTM","type":"timestamp with time zone","nullable":false,"default":null}
      constraints:
        - {"name":"PK_ADM_ASSET_COMMAND","definition":"PRIMARY KEY (COMMAND_KEY)"}
        - {"name":"CK_ADM_COMMAND_KIND","definition":"CHECK (TARGET_KIND IN ('TARGET_SYSTEM','DATA_SOURCE'))"}
        - {"name":"CK_ADM_COMMAND_ACTION","definition":"CHECK (ACTION_CD IN ('CREATE','CHANGE','REFERENCE_CORRECTION','DELETE'))"}
        - {"name":"CK_ADM_COMMAND_VERSION","definition":"CHECK (RESULT_VERSION >= 1)"}
      indexes:
        - {"name":"IX_ADM_COMMAND_TARGET","unique":false,"method":"btree","definition":"(TARGET_KIND, TARGET_ID, APPLIED_DTM DESC)"}

