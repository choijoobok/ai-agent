        - {"name":"CK_CAT_COL_REVIEW","definition":"CHECK (REVIEW_STATUS IN ('UNKNOWN','VERIFIED','INVALID') AND (REVIEW_STATUS <> 'VERIFIED' OR (REVIEWER_ID IS NOT NULL AND REVIEWED_DTM IS NOT NULL AND REVIEW_EVIDENCE IS NOT NULL)))"}
        - {"name":"CK_CAT_COL_VALUE_REVIEW","definition":"CHECK (VALUE_REVIEW_STATUS IN ('UNKNOWN','VERIFIED','INVALID') AND (VALUE_REVIEW_STATUS <> 'VERIFIED' OR (VALUE_REVIEWER_ID IS NOT NULL AND VALUE_REVIEWED_DTM IS NOT NULL AND VALUE_REVIEW_EVIDENCE IS NOT NULL)))"}
        - {"name":"UK_CAT_COL_NAME","definition":"UNIQUE (REVISION_ID, COLUMN_KEY)"}
      indexes: [{"name":"IX_CAT_COL_HISTORY","unique":false,"method":"btree","definition":"(COLUMN_ID, REVISION_ID)"}]


  - id: ENT-008
    name: "권장 조인 관계"
    term: TRM-254
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_CAT_JOIN_RELATION
    features: [FEAT-011, FEAT-003]
    reqs: [REQ-301, REQ-306]
    description: "소유 카탈로그 내용 판에 포함된 공개 객체 사이의 검수할 관계. 양쪽 화면에서 보이는 관계를 각각 독립 정본으로 중복 관리하지 않는다"
    attributes:
      - {"name":"관리 카탈로그의 소유 판","physical_name":"REVISION_ID","pk":true,"description":"관리 카탈로그의 소유 판"}
      - {"name":"작성 시 고정한 관리 카탈로그","physical_name":"CATALOG_ID","description":"작성 시 고정한 관리 카탈로그"}
      - {"name":"안정 구성 식별자 중 RELATION","physical_name":"RELATION_ID","pk":true,"description":"안정 구성 식별자 중 RELATION"}
      - {"name":"구성 종류","physical_name":"MEMBER_KIND","description":"안정 식별의 종류 RELATION"}
      - {"name":"왼쪽 역할 객체","physical_name":"LEFT_CATALOG_ID","description":"왼쪽 역할 객체"}
      - {"name":"왼쪽 역할 내용 판","physical_name":"LEFT_REVISION_ID","description":"왼쪽 역할 내용 판"}
      - {"name":"왼쪽 업무 역할. SQL 별칭이 아니다","physical_name":"LEFT_ROLE_NAME","description":"왼쪽 업무 역할. SQL 별칭이 아니다"}
      - {"name":"오른쪽 역할 객체","physical_name":"RIGHT_CATALOG_ID","description":"오른쪽 역할 객체"}
      - {"name":"오른쪽 역할 내용 판","physical_name":"RIGHT_REVISION_ID","description":"오른쪽 역할 내용 판"}
      - {"name":"오른쪽 업무 역할","physical_name":"RIGHT_ROLE_NAME","description":"오른쪽 업무 역할"}
      - {"name":"양쪽 대응 수","physical_name":"CARDINALITY_CD","description":"UNKNOWN/ONE_ONE/ONE_MANY/MANY_ONE"}
      - {"name":"방향·관계의 업무 설명","physical_name":"DESCRIPTION","description":"방향·관계의 업무 설명"}
      - {"name":"관계 근거 유형","physical_name":"ORIGIN_KIND","description":"UNKNOWN/PHYSICAL_FK/LOGICAL"}
      - {"name":"원천 FK 또는 논리 관계 근거","physical_name":"ORIGIN_EVIDENCE","description":"원천 FK 또는 논리 관계 근거"}
      - {"name":"검수 상태 UNKNOWN/VERIFIED/INVALID","physical_name":"REVIEW_STATUS","description":"검수 상태 UNKNOWN/VERIFIED/INVALID"}
      - {"name":"실제 검수자","physical_name":"REVIEWER_ID","description":"실제 검수자"}
      - {"name":"실제 검수 시각","physical_name":"REVIEWED_DTM","description":"실제 검수 시각"}
      - {"name":"검수 근거. 샘플 원값이나 비밀을 넣지 않는다","physical_name":"REVIEW_EVIDENCE","description":"검수 근거. 샘플 원값이나 비밀을 넣지 않는다"}
    relations:
      - {"entity":"ENT-020","cardinality":"소유 판·구성의 복합 키로 참조","description":"명시된 physical 외래키를 따른다. 보존·고정과 현재 권한 판정은 별도 계약이다"}
      - { entity: ENT-006, cardinality: "관계 구성마다 소유 내용 판 하나", description: "관계만 변경해도 해당 카탈로그 후보/반영 세트를 따른다" }
      - { entity: ENT-005, cardinality: "관계마다 양쪽 역할의 객체 참조와 그중 관리 객체 하나", description: "자기조인이면 두 역할의 객체 ID가 같을 수 있다. 같은 DB/스키마라는 추가 제약을 만들지 않고 실제 연결/실행 지원 경계를 검사한다" }
      - { entity: ENT-007, cardinality: "관계마다 컬럼 쌍 0개 이상, 사용 가능한 관계는 필요한 전체 쌍 1개 이상", description: "미완성 초안의 누락은 사용 불가로 표시한다" }
    rules:
      - "이름 일치·자동 수집 FK만으로 권장 관계를 확정하지 않고 원천 DB 제약도 생성/변경하지 않는다. 관계 등록은 양쪽 객체의 접근 권한 부여가 아니다"
      - "관리측 선택·고정은 REQ-301.relationship_metadata.ownership을 따른다. 반대 화면도 같은 관계 안정 식별자를 사용하며 이름·1측/N측 변경으로 관리측을 바꾸지 않는다"
      - "자기조인의 두 역할은 동일 소유 후보의 컬럼 구성을 참조한다. 한쪽을 이전 유효본으로 바꾸거나 카탈로그 ID 중복 제거로 역할/컬럼 쌍을 합치지 않는다"
      - "양쪽 객체만 같은 관계를 모두 중복으로 막지 않는다. 주문의 주문자/수령자 관계처럼 전체 역할·컬럼 쌍·방향·업무 의미가 다를 수 있다. 기존 관계를 재조회하는 것과 별도 관계 생성은 안정 식별자로 구분한다"
      - "미등록·미검수·무효 참조는 권장 경로로 사용하지 않는다. 1:N의 중복을 1:1이나 일괄 DISTINCT로 숨기지 않는다"
      - "관계 변경은 양쪽 객체와 연결 지식/예제의 영향 및 참조 버전을 대조한다. 조회만 하는 상대 객체를 변경 대상처럼 점유하지 않는다"
      - "다른 데이터소스를 하나의 SQL 연결로 자동 합치지 않는다. 실행 가능한 연결 범위와 다중 원천 결과 결합은 REQ-603 및 agent 소비 계약으로 구분한다"
    audit: "소유 ENT-006의 당시 전체 관계와 참조 판·검수 근거를 보존한다. 과거 조회에서 현재 상대 컬럼으로 치환하지 않는다"
    rules_from: ["REQ-301.relationship_metadata", "REQ-306.catalog_boundary", "REQ-306.version_guard", "REQ-306.shared_impact", "UC-008"]
    delete_policy: "초안의 자식 제거도 부모 잠금/편집 버전을 검사한다. 고정 판과 과거 자식은 관리 화면에서 삭제/수정하지 않으며 파기는 소유 보존 정책과 참조 보호를 따른다"
    storage_contract: "ENT-020의 소유 카탈로그는 생성 후 변경 금지다. 관계 내용은 소유 리비전/안정 관계 ID로 식별하고 양쪽 역할은 LEFT/RIGHT로 유지한다. 전체 컬럼 쌍은 ENT-025이며 두 객체만으로 유일성 제약을 만들지 않는다. 자기조인은 양쪽 역할 모두 소유 판을 가리키고 미완성의 null 역할은 사용 불가다."
    pending: ["@defer P3 verification·agent — 자기조인·복합 쌍·미대응/중복 집계의 화면/실제 SQL 소비 시험을 연결한다"]
    physical:
      attributes:
        - {"name":"REVISION_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"CATALOG_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"RELATION_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"MEMBER_KIND","type":"character varying(12)","nullable":false,"default":null}
        - {"name":"LEFT_CATALOG_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"LEFT_REVISION_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"LEFT_ROLE_NAME","type":"character varying(100)","nullable":true,"default":null}
        - {"name":"RIGHT_CATALOG_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"RIGHT_REVISION_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"RIGHT_ROLE_NAME","type":"character varying(100)","nullable":true,"default":null}
        - {"name":"CARDINALITY_CD","type":"character varying(12)","nullable":false,"default":null}
        - {"name":"DESCRIPTION","type":"text","nullable":true,"default":null}
        - {"name":"ORIGIN_KIND","type":"character varying(12)","nullable":false,"default":null}
        - {"name":"ORIGIN_EVIDENCE","type":"text","nullable":true,"default":null}
        - {"name":"REVIEW_STATUS","type":"character varying(12)","nullable":false,"default":null}
        - {"name":"REVIEWER_ID","type":"character varying(30)","nullable":true,"default":null}
        - {"name":"REVIEWED_DTM","type":"timestamp with time zone","nullable":true,"default":null}
        - {"name":"REVIEW_EVIDENCE","type":"text","nullable":true,"default":null}
      constraints:
        - {"name":"PK_CAT_JOIN_RELATION","definition":"PRIMARY KEY (REVISION_ID, RELATION_ID)"}
        - {"name":"FK_CAT_JOIN_OWNER","definition":"FOREIGN KEY (CATALOG_ID, REVISION_ID) REFERENCES AI_ADMIN_CATALOG_REVISION (CATALOG_ID, REVISION_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"FK_CAT_JOIN_MEMBER","definition":"FOREIGN KEY (CATALOG_ID, RELATION_ID, MEMBER_KIND) REFERENCES AI_ADMIN_CATALOG_MEMBER (CATALOG_ID, MEMBER_ID, MEMBER_KIND)"}
        - {"name":"CK_CAT_JOIN_KIND","definition":"CHECK (MEMBER_KIND = 'RELATION')"}
        - {"name":"FK_CAT_JOIN_LEFT","definition":"FOREIGN KEY (LEFT_CATALOG_ID, LEFT_REVISION_ID) REFERENCES AI_ADMIN_CATALOG_REVISION (CATALOG_ID, REVISION_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"FK_CAT_JOIN_RIGHT","definition":"FOREIGN KEY (RIGHT_CATALOG_ID, RIGHT_REVISION_ID) REFERENCES AI_ADMIN_CATALOG_REVISION (CATALOG_ID, REVISION_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"UK_CAT_JOIN_PAIR_REFS","definition":"UNIQUE (REVISION_ID, RELATION_ID, LEFT_REVISION_ID, RIGHT_REVISION_ID)"}
        - {"name":"CK_CAT_JOIN_ROLES","definition":"CHECK ((LEFT_CATALOG_ID IS NULL OR LEFT_CATALOG_ID <> CATALOG_ID OR LEFT_REVISION_ID = REVISION_ID) AND (RIGHT_CATALOG_ID IS NULL OR RIGHT_CATALOG_ID <> CATALOG_ID OR RIGHT_REVISION_ID = REVISION_ID) AND (LEFT_CATALOG_ID IS NULL OR RIGHT_CATALOG_ID IS NULL OR LEFT_CATALOG_ID = CATALOG_ID OR RIGHT_CATALOG_ID = CATALOG_ID))"}
        - {"name":"CK_CAT_JOIN_CODES","definition":"CHECK (CARDINALITY_CD IN ('UNKNOWN','ONE_ONE','ONE_MANY','MANY_ONE') AND ORIGIN_KIND IN ('UNKNOWN','PHYSICAL_FK','LOGICAL'))"}
        - {"name":"CK_CAT_JOIN_REVIEW","definition":"CHECK (REVIEW_STATUS IN ('UNKNOWN','VERIFIED','INVALID') AND (REVIEW_STATUS <> 'VERIFIED' OR (REVIEWER_ID IS NOT NULL AND REVIEWED_DTM IS NOT NULL AND REVIEW_EVIDENCE IS NOT NULL)))"}
      indexes: [{"name":"IX_CAT_JOIN_LEFT","unique":false,"method":"btree","definition":"(LEFT_CATALOG_ID, LEFT_REVISION_ID)"},{"name":"IX_CAT_JOIN_RIGHT","unique":false,"method":"btree","definition":"(RIGHT_CATALOG_ID, RIGHT_REVISION_ID)"}]


  - id: ENT-010
    name: "카탈로그 변경 근거"
    term: TRM-255
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_CATALOG_EVIDENCE
    features: [FEAT-003, FEAT-036]
    reqs: [REQ-304]
    description: "공개 범위 변경 검토의 입력 근거. 기술 관측·관리자 의미 변경과 지식 검토 작업의 판정/종결은 별도다"
    attributes:
      - {"name":"변경 근거 식별자","physical_name":"EVIDENCE_ID","pk":true,"description":"변경 근거 식별자"}
      - {"name":"근거 출처 유형","physical_name":"SOURCE_KIND","description":"NOTICE/STRUCTURE/MEANING"}
      - {"name":"고객사 통지 또는 소유 원 기록 참조","physical_name":"SOURCE_REF","description":"고객사 통지 또는 소유 원 기록 참조"}
      - {"name":"관측 상태","physical_name":"OBSERVATION_STATUS","description":"UNCONFIRMED/COMPLETE/PARTIAL/FAILED"}
      - {"name":"근거 본문 형식 버전","physical_name":"EVIDENCE_FORMAT","description":"근거 본문 형식 버전"}
      - {"name":"v1 구조 차이/업무 변경 근거 JSON 문자열. 원천 주소·비밀·샘플 원값 제외","physical_name":"EVIDENCE_BODY","description":"v1 구조 차이/업무 변경 근거 JSON 문자열. 원천 주소·비밀·샘플 원값 제외"}
      - {"name":"접수 시각","physical_name":"RECEIVED_DTM","description":"접수 시각"}
      - {"name":"실제 관측 시각. 미관측은 null","physical_name":"OBSERVED_DTM","description":"실제 관측 시각. 미관측은 null"}
      - {"name":"고객사 예정 적용 시각","physical_name":"PLANNED_SOURCE_DTM","description":"고객사 예정 적용 시각"}
      - {"name":"확인한 실제 원천 적용 시각","physical_name":"ACTUAL_SOURCE_DTM","description":"확인한 실제 원천 적용 시각"}
      - {"name":"실제 등록/관측 주체","physical_name":"ACTOR_ID","description":"실제 등록/관측 주체"}
      - {"name":"등록 재수신 식별자","physical_name":"COMMAND_KEY","description":"등록 재수신 식별자"}
    relations:
      - { entity: ENT-005, cardinality: "근거마다 관련 등록 항목 0개 이상", description: "공개 범위 대조 전 미확인과 확인 결과 대상 없음을 구분하며 전체 DB 공개를 요구하지 않는다" }
      - { entity: ENT-006, cardinality: "근거마다 관련 내용 판 0개 이상", description: "관측 기준과 후보/실제 반영본의 시점을 구분한다" }
    related_features: [FEAT-036, FEAT-014, FEAT-023, FEAT-035, FEAT-041]
    rules:
      - "조회 실패·부분 수집·구조 차이 없음은 영향 없음의 자동 판정이 아니다. 내부 의미/값 도메인 변경은 구조 이상이나 외부 통지 유무와 무관하게 검토 필요를 연결한다"
      - "구조 비교는 등록 공개 범위의 보조 신호다. 새 컬럼 자동 공개·운영본 변경·활성 지식/예제 자동 비활성화를 하지 않는다"
      - "직접 카탈로그→지식 및 예제 경유 영향을 함께 전달한다. 기존 열린 검토에는 근거/버전을 연결하고 조사에서 이미 진단한 변경에 예방 검토를 강제 중복하지 않는다"
      - "샘플링은 별도 수동 실행/시스템 조회 이력이다. 개인정보 제외·권한·상한을 유지하며 실제 값 원문을 이 근거의 구조 사실로 복제하지 않는다"
    audit: "접수·관측 당시 근거를 보존하고 후속 보완·검토/변경 연결을 추적한다. 영향 판정·완료·실제 반영은 각각 소유 기록으로 확인한다"
    rules_from: ["REQ-304.detail", "REQ-304.limits", "REQ-304.timing_policy", "REQ-304.note", "REQ-307.boundary", "UC-014"]
    delete_policy: "접수한 근거를 관리자 수정/삭제로 덮지 않는다. 후속 보완 근거를 연결하며 파기는 소유 보존/보호 정책에서만 수행한다"
    storage_contract: "근거와 관련 대상은 같은 트랜잭션으로 생성하고 수신 후 원문을 덮지 않는다. 보완은 새 근거로 연결한다. ENT-027로 관측 기준/변경 전후/후보 판을 각각 보존하며 영향 검토의 완료 상태는 복제하지 않는다."
    pending: ["@defer P3 knowledge·audit_trace — FEAT-036의 열린 검토/기존 조사와 근거 연결·종결 상태·보존 및 동일 출처 재접수 판단을 소유 계약에 연결한다"]
    physical:
      attributes:
        - {"name":"EVIDENCE_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"SOURCE_KIND","type":"character varying(16)","nullable":false,"default":null}
        - {"name":"SOURCE_REF","type":"character varying(200)","nullable":true,"default":null}
        - {"name":"OBSERVATION_STATUS","type":"character varying(12)","nullable":false,"default":null}
        - {"name":"EVIDENCE_FORMAT","type":"integer","nullable":false,"default":null}
        - {"name":"EVIDENCE_BODY","type":"text","nullable":false,"default":null}
        - {"name":"RECEIVED_DTM","type":"timestamp with time zone","nullable":false,"default":null}
        - {"name":"OBSERVED_DTM","type":"timestamp with time zone","nullable":true,"default":null}
        - {"name":"PLANNED_SOURCE_DTM","type":"timestamp with time zone","nullable":true,"default":null}
        - {"name":"ACTUAL_SOURCE_DTM","type":"timestamp with time zone","nullable":true,"default":null}
        - {"name":"ACTOR_ID","type":"character varying(30)","nullable":false,"default":null}
        - {"name":"COMMAND_KEY","type":"character varying(36)","nullable":false,"default":null}
      constraints:
        - {"name":"PK_CATALOG_EVIDENCE","definition":"PRIMARY KEY (EVIDENCE_ID)"}
