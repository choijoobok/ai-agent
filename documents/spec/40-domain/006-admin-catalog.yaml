# 영역: admin 연동 자산 — 카탈로그 물리 설계 초안 (미구현)
entities:
  - id: ENT-005
    name: "카탈로그 항목"
    term: TRM-223
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_CATALOG_ENTRY
    features: [FEAT-003]
    reqs: [REQ-301, REQ-603]
    description: "Hub가 공개 대상으로 등록한 물리 테이블/뷰 하나의 안정 식별과 실제 반영된 내용 연결. DB 스키마 전체나 그룹별 등록 단위가 아니다"
    attributes:
      - {"name":"카탈로그 안정 식별자","physical_name":"CATALOG_ID","pk":true,"description":"카탈로그 안정 식별자"}
      - {"name":"Hub 데이터소스 참조. 과거 보존을 위해 현재 행 FK를 두지 않는다","physical_name":"DATA_SOURCE_ID","description":"Hub 데이터소스 참조. 과거 보존을 위해 현재 행 FK를 두지 않는다"}
      - {"name":"원천 서버 한정자. 해당 없음은 null","physical_name":"SERVER_NAME","description":"원천 서버 한정자. 해당 없음은 null"}
      - {"name":"실제 DB/카탈로그명. 해당 없음은 null","physical_name":"DATABASE_NAME","description":"실제 DB/카탈로그명. 해당 없음은 null"}
      - {"name":"실제 스키마명. 해당 없음은 null","physical_name":"SCHEMA_NAME","description":"실제 스키마명. 해당 없음은 null"}
      - {"name":"원천 객체명","physical_name":"OBJECT_NAME","description":"원천 객체명"}
      - {"name":"DBMS 식별 해석 규칙의 버전. 이름 변환을 임의 적용하지 않는다","physical_name":"IDENTITY_PROFILE","description":"DBMS 식별 해석 규칙의 버전. 이름 변환을 임의 적용하지 않는다"}
      - {"name":"전체 물리 식별의 SHA-256 비교 키. 전체 원문과 함께 대조한다","physical_name":"OBJECT_KEY","description":"전체 물리 식별의 SHA-256 비교 키. 전체 원문과 함께 대조한다"}
      - {"name":"실제 반영된 현재 내용 판. 최초 후보는 null","physical_name":"CURRENT_REVISION_ID","description":"실제 반영된 현재 내용 판. 최초 후보는 null"}
      - {"name":"DRAFT/ACTIVE/RETIRED. 승인 요청 상태가 아니다","physical_name":"LIFECYCLE_CD","description":"DRAFT/ACTIVE/RETIRED. 승인 요청 상태가 아니다"}
      - {"name":"현재 포인터·효력의 동시 변경 버전","physical_name":"STATE_VERSION","description":"현재 포인터·효력의 동시 변경 버전"}
      - {"name":"세트 소유 기능의 실제 반영 결과 참조","physical_name":"APPLY_RESULT_REF","description":"세트 소유 기능의 실제 반영 결과 참조"}
      - {"name":"실제 반영 시각","physical_name":"APPLIED_DTM","description":"실제 반영 시각"}
      - {"name":"최초 작성 주체","physical_name":"REG_ID","description":"최초 작성 주체"}
      - {"name":"최초 등록 시각","physical_name":"REG_DTM","description":"최초 등록 시각"}
    relations:
      - { entity: ENT-002, cardinality: "항목마다 데이터소스 하나", description: "같은 연결 안의 여러 DB/스키마 객체를 각각 전체 식별한다" }
      - { entity: ENT-006, cardinality: "항목마다 내용 리비전 1개 이상, 현재 유효본 0개 또는 1개", description: "최초 항목/후보는 같은 트랜잭션에서 생성한다" }
    rules:
      - "REQ-301.business_rules의 전체 식별로 같은 데이터소스 안의 물리 실체당 한 항목만 등록한다. 서로 다른 그룹이라는 이유로 같은 실체를 중복 등록하지 않는다"
      - "원천 이름 변경은 REQ-301.identity_change에 따라 동일 객체 근거와 새 후보 반영으로 안정 식별자를 유지한다. 소멸·재생성의 자동 승계나 과거 이름/참조 덮어쓰기는 허용하지 않는다"
      - "현재 유효본 교체는 ENT-006 전체 구성과 세트의 모든 변경 대상이 함께 반영될 때만 가능하다. 객체 등록이나 기술 검수만으로 유효본을 만들지 않는다"
    state_machine:
      management: "후보만 존재하는 항목·실제 유효본이 있는 항목·허용된 폐기 결과를 구분한다. 내용 검수/요청 처리 상태와 현재 보안 정책 상태를 하나의 플래그로 합치지 않는다"
      consumption: "ARCH-028의 선택 내용 리비전과 현재 공개/권한·신원·정책을 함께 검사한다. 오래된 내용의 보관은 폐기·회수 후 사용 허용이 아니다"
    audit: "당시 전체 내용은 ENT-006과 반영 세트의 실제 결과 참조로 재현한다. 삭제 후에도 원 식별자·과거 내용을 잃지 않는다"
    delete_policy: "폐기는 새 후보/세트로 요청하고 REQ-306.shared_impact의 남은 참조를 해소한다. 원천 객체 소멸 신호만으로 자동 삭제하지 않는다"
    rules_from: ["REQ-301.business_rules", "REQ-306.shared_impact", "ARCH-028.asset_versions", "UC-007"]
    storage_contract: "50-api의 FEAT-003 계약을 따른다. 신규 항목과 최초 리비전은 같은 트랜잭션이다. 현재 포인터는 같은 카탈로그의 고정 리비전만 가리키며 상태·정확 물리 식별·포인터 전환은 전체 세트 반영에 참여한다. 이름 변경 후보는 현재 행을 미리 고치지 않는다. 부모 유효/초안 참조가 없는 보존용 항목 때문에 데이터소스 삭제를 영구 금지하지 않도록 현재 데이터소스 FK는 두지 않고 공통 부모 잠금으로 유효 참조를 검사한다."
    pending: ["@defer P3 knowledge·access_policy — 세트 반영 결과/복구·그룹/현재 정책 저장과 참조를 연결한다. 카탈로그 부모는 보존하며 데이터소스 허용 삭제 판단은 유효본/후보의 실제 참조를 검사한다"]
    physical:
      attributes:
        - {"name":"CATALOG_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"DATA_SOURCE_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"SERVER_NAME","type":"character varying(500)","nullable":true,"default":null}
        - {"name":"DATABASE_NAME","type":"character varying(500)","nullable":true,"default":null}
        - {"name":"SCHEMA_NAME","type":"character varying(500)","nullable":true,"default":null}
        - {"name":"OBJECT_NAME","type":"character varying(500)","nullable":false,"default":null}
        - {"name":"IDENTITY_PROFILE","type":"character varying(100)","nullable":false,"default":null}
        - {"name":"OBJECT_KEY","type":"character varying(64)","nullable":false,"default":null}
        - {"name":"CURRENT_REVISION_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"LIFECYCLE_CD","type":"character varying(10)","nullable":false,"default":null}
        - {"name":"STATE_VERSION","type":"bigint","nullable":false,"default":null}
        - {"name":"APPLY_RESULT_REF","type":"character varying(100)","nullable":true,"default":null}
        - {"name":"APPLIED_DTM","type":"timestamp with time zone","nullable":true,"default":null}
        - {"name":"REG_ID","type":"character varying(30)","nullable":false,"default":null}
        - {"name":"REG_DTM","type":"timestamp with time zone","nullable":false,"default":null}
      constraints:
        - {"name":"PK_CATALOG_ENTRY","definition":"PRIMARY KEY (CATALOG_ID)"}
        - {"name":"CK_CAT_ENTRY_STATE","definition":"CHECK (LIFECYCLE_CD IN ('DRAFT','ACTIVE','RETIRED') AND STATE_VERSION >= 1 AND ((LIFECYCLE_CD = 'DRAFT' AND CURRENT_REVISION_ID IS NULL) OR (LIFECYCLE_CD <> 'DRAFT' AND CURRENT_REVISION_ID IS NOT NULL AND APPLY_RESULT_REF IS NOT NULL AND APPLIED_DTM IS NOT NULL)))"}
        - {"name":"FK_CAT_CURRENT","definition":"FOREIGN KEY (CATALOG_ID, CURRENT_REVISION_ID) REFERENCES AI_ADMIN_CATALOG_REVISION (CATALOG_ID, REVISION_ID) DEFERRABLE INITIALLY DEFERRED"}
      indexes: [{"name":"UX_CAT_LIVE_OBJECT","unique":true,"method":"btree","definition":"(DATA_SOURCE_ID, OBJECT_KEY) WHERE LIFECYCLE_CD IN ('DRAFT','ACTIVE')"}]

