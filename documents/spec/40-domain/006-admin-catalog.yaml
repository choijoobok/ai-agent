        - {"name":"DESCRIPTION","type":"text","nullable":true,"default":null}
        - {"name":"INTENT_CD","type":"character varying(10)","nullable":false,"default":null}
        - {"name":"REVIEW_STATUS","type":"character varying(12)","nullable":false,"default":null}
        - {"name":"REVIEWER_ID","type":"character varying(30)","nullable":true,"default":null}
        - {"name":"REVIEWED_DTM","type":"timestamp with time zone","nullable":true,"default":null}
        - {"name":"REVIEW_EVIDENCE","type":"text","nullable":true,"default":null}
        - {"name":"IDENTITY_EVIDENCE","type":"text","nullable":true,"default":null}
        - {"name":"CHANGE_REASON","type":"text","nullable":false,"default":null}
        - {"name":"POLICY_REF_FORMAT","type":"integer","nullable":false,"default":null}
        - {"name":"POLICY_REFERENCES","type":"text","nullable":true,"default":null}
        - {"name":"FROZEN_DIGEST","type":"character varying(64)","nullable":true,"default":null}
        - {"name":"FROZEN_DTM","type":"timestamp with time zone","nullable":true,"default":null}
        - {"name":"REG_ID","type":"character varying(30)","nullable":false,"default":null}
