    rules:
      - "미등록 컬럼은 발견됐어도 등록 컬럼으로 자동 추가하지 않는다. 등록된 컬럼의 접근 그룹 기본 상속과 예외는 FEAT-007을 따른다"
      - "의미·필요 형식·값 도메인이 미완성/미검수이면 해당 범위를 사용하지 않는다. 코드/관계가 불필요한 독립 컬럼에 별도 관계 등록을 강제하지 않는다"
      - "공통코드 참조와 인라인 열거의 관리 방식을 명확히 하며 다른 데이터소스·Hub 코드·동명 그룹으로 대체하지 않는다. 원천 참조만으로 미등록 코드 객체를 공개하지 않는다"
      - "원천 치수와 인덱스 메타데이터는 REQ-301.source_dimensions/index_metadata로 추가 설계한다. 현재 physical에는 신규 치수/인덱스 저장 매핑이 없으며 이를 완료로 취급하지 않는다. DB 기본값과 원천 DDL은 제외하고 관측 사실이 업무 의미·정책을 덮지 않는다"
    audit: "소유 ENT-006의 전체 컬럼 스냅샷과 검수 근거로 과거를 재현한다. 샘플링 원값을 내용 이력에 무제한 복제하지 않는다"
    rules_from: ["REQ-301.column_metadata", "REQ-301.value_domain", "REQ-301.business_rules", "REQ-111.privacy_metadata", "REQ-304.note"]
    delete_policy: "초안의 자식 제거도 부모 잠금/편집 버전을 검사한다. 고정 판과 과거 자식은 관리 화면에서 삭제/수정하지 않으며 파기는 소유 보존 정책과 참조 보호를 따른다"
    design_followup: "@defer P3 integration_assets — REQ-301.source_dimensions/index_metadata에 따라 치수의 형식/단위/정밀도·소수자리와 인덱스 정의/순서 구성의 논리·물리 저장을 보완한다. 현재 ENT-007 SOURCE_TYPE과 기존 식별키 테이블에 임의로 합쳐 저장하지 않으며 전체 후보·검수·복사/고정/이행 계약을 함께 완성한다"
    storage_contract: "COLUMN_ID의 소유/종류는 ENT-020으로 고정한다. 구조 키는 ENT-021/022, INLINE은 ENT-023, CODE 조회 바인딩은 ENT-024에 저장한다. CODE_QUERY_ID/CODE_QUERY_REVISION_ID는 ENT-041/042의 정확 조회 버전을 가리킨다. 이전 단일 코드 테이블·값/명칭 컬럼 참조와 CODE_CONDITION 모델은 사용하지 않는다. 전체 후보 저장/복사/고정은 조회 참조와 전체 typed 바인딩을 보존하되 조회 결과를 복제하지 않는다"
    code_query_followup: "@defer P3 integration_assets — ENT-041/042/043의 물리 스키마를 확정해 CODE_QUERY_ID/CODE_QUERY_REVISION_ID의 같은 데이터소스·정확 버전 복합 FK/잠금·전체 이행/검수 계약을 완성한다. 현재 논리 참조를 FK 완료로 표시하지 않는다"
