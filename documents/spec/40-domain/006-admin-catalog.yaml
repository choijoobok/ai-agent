  - id: ENT-008
    name: "권장 조인 관계"
    term: TRM-254
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: logical
    features: [FEAT-011, FEAT-003]
    reqs: [REQ-301, REQ-306]
    description: "소유 카탈로그 내용 판에 포함된 공개 객체 사이의 검수할 관계. 양쪽 화면에서 보이는 관계를 각각 독립 정본으로 중복 관리하지 않는다"
    attributes:
      - { name: "관계 안정 식별자", meaning: "관계 후보/과거 참조를 연결하는 식별. 컬럼쌍 이름 문자열로 대체하지 않는다", origin: "서버" }
      - { name: "소유 카탈로그 리비전 참조", meaning: "이 관계를 변경하는 ENT-006의 구성 참조. 소유측과 업무상 조인 방향은 별개다", origin: "후보 작성 대상" }
      - { name: "양쪽 객체·내용 판 참조", meaning: "각 공개 카탈로그와 선택한 내용 판. 소유측은 자기 후보의 구성, 상대측은 검증한 유효본 또는 같은 세트 후보로 식별한다", origin: "관리자 선택 및 검증" }
      - { name: "전체 조인 컬럼 쌍", meaning: "양쪽 컬럼 안정 참조의 전체 집합. 복합 키의 필요한 쌍을 일부 생략해 같은 관계로 보지 않는다", origin: "관리자 및 원천 근거" }
      - { name: "방향·대응 수·업무 설명", meaning: "1:1/1:N에서 어느 쪽이 1측인지와 관계의 업무 의미. 화면에서 여는 방향만으로 뒤집지 않는다", origin: "관리자 검수" }
      - { name: "물리·논리 관계 근거", meaning: "원천 외래 키로 확인한 사실 또는 외래 키 없이 검수한 논리 관계의 출처·내용", origin: "원천 사실/업무 근거" }
      - { name: "유일성·누락·집계 검수 근거", meaning: "1측 유일성, 컬럼 타입/의미 호환, 미대응·중복의 조회/집계 의미와 실제 확인 주체·시각·결과", origin: "기술·업무 검수" }
      - { name: "관계 검수 상태", meaning: "미확인/미완성/검수 결과. 현재 운영 사용 가능은 소유 리비전 반영과 양쪽 현재 접근 조건으로 별도 판정한다", origin: "실제 검수 처리" }
    relations:
      - { entity: ENT-006, cardinality: "관계 구성마다 소유 내용 판 하나", description: "관계만 변경해도 해당 카탈로그 후보/반영 세트를 따른다" }
      - { entity: ENT-005, cardinality: "관계마다 양쪽 객체 참조", description: "같은 DB/스키마라는 추가 제약을 만들지 않고 실제 연결/실행 지원 경계를 검사한다" }
      - { entity: ENT-007, cardinality: "관계마다 컬럼 쌍 0개 이상, 사용 가능한 관계는 필요한 전체 쌍 1개 이상", description: "미완성 초안의 누락은 사용 불가로 표시한다" }
    rules:
      - "이름 일치·자동 수집 FK만으로 권장 관계를 확정하지 않고 원천 DB 제약도 생성/변경하지 않는다. 관계 등록은 양쪽 객체의 접근 권한 부여가 아니다"
      - "미등록·미검수·무효 참조는 권장 경로로 사용하지 않는다. 1:N의 중복을 1:1이나 일괄 DISTINCT로 숨기지 않는다"
      - "관계 변경은 양쪽 객체와 연결 지식/예제의 영향 및 참조 버전을 대조한다. 조회만 하는 상대 객체를 변경 대상처럼 점유하지 않는다"
      - "다른 데이터소스를 하나의 SQL 연결로 자동 합치지 않는다. 실행 가능한 연결 범위와 다중 원천 결과 결합은 REQ-603 및 agent 소비 계약으로 구분한다"
    audit: "소유 ENT-006의 당시 전체 관계와 참조 판·검수 근거를 보존한다. 과거 조회에서 현재 상대 컬럼으로 치환하지 않는다"
    rules_from: ["REQ-301.relationship_metadata", "REQ-306.catalog_boundary", "REQ-306.version_guard", "REQ-306.shared_impact", "UC-008"]
    pending: ["@defer P3 integration_assets — 정본 소유측 선정/중복 관계 판정·자기조인 역할·양쪽 동시 변경/상호 참조의 버전 검증·물리 저장·UI 방향 표시와 실행 지원 범위를 구체화한다. 반대쪽 조회와 독립 승인 업무를 혼동하지 않는다"]

