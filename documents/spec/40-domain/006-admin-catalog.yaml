      - { name: "업무 명칭·필요 이유", meaning: "이 공개 객체에 조건을 강제하는 검수할 업무 근거", origin: "관리자" }
      - { name: "규칙 유형", meaning: "REQ-301.query_constraints의 기간 필수·최대 범위·등록된 정확한 전체 식별키 대체 범위. 임의 SQL이나 범용 규칙 언어를 추가하지 않는다", origin: "지원 유형에서 선택" }
      - { name: "기간 기준 컬럼 참조", meaning: "등록 컬럼 안정 참조와 내용 판에서 검수한 날짜/일시 해석 기준", origin: "관리자 선택" }
      - { name: "기간 해석·최대 범위", meaning: "형식·시간대·양쪽 경계 포함/제외와 최대 범위 값/단위. 모든 테이블에 같은 기간이나 전역 기본값을 강제하지 않는다", origin: "검수된 메타데이터" }
      - { name: "등록 대체 식별키 구성", meaning: "해당 제약에 연결한 유일 식별키의 전체 컬럼 집합과 근거. 미등록 대체·부분 키·여러 값 목록을 허용하지 않는다", origin: "관리자 검수", collection: "해당 제약에서 허용하는 대체 키 구성" }
      - { name: "검수 결과·근거", meaning: "참조/형식/단위/대체 조건의 완성·지원 여부와 확인 주체·시각. 미확인·무효를 제약 없음으로 저장하지 않는다", origin: "실제 검수 처리" }
    relations:
      - { entity: ENT-006, cardinality: "제약마다 소유 내용 판 하나", description: "신규·수정·삭제·대체 변경은 같은 전체 후보/세트로 반영한다" }
      - { entity: ENT-007, cardinality: "제약마다 대상 컬럼 참조 0개 이상, 사용 가능한 제약은 필요한 전체 참조 1개 이상", description: "미완성 초안의 누락을 표시하고 기간/대체 키의 전체 참조를 해당 내용 판에서 검증한다" }
    rules:
      - "여러 제약은 모두 충족해야 하며 대체는 연결된 제약에만 적용한다. 제약 없음은 ENT-006의 검수된 명시 상태이며 빈 목록으로 미확인을 숨기지 않는다"
      - "미완성 후보는 저장할 수 있으나 해당 범위를 AI 조회에 사용하지 않는다. 내용 승인·실행 승인·기본 필터 제외는 제약 면제가 아니다"
      - "실제 SQL/바인딩 전체와 최종 필터 처리 후 판정은 agent 소유다. 모델의 충족 표식만으로 통과하지 않고 과거 실행의 통과 결과를 새 실행에 재사용하지 않는다"
    audit: "관리 정의는 ENT-006에 보존하고 실행의 적용 제약/판정은 REQ-301.query_constraints.audit의 소유 감사로 연결한다"
    rules_from: ["REQ-301.query_constraints", "REQ-108", "REQ-207"]
    pending: ["@defer P3 integration_assets·agent — 지원 날짜 단위/코드·기간과 대체 키의 정형 저장·편집 검증·파서 검증 가능 범위·최종 SQL/바인딩 일치·버전 경합과 실행 거부 시험을 설계한다"]

