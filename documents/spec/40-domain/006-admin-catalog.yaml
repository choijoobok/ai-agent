# 영역: admin 연동 자산 — 공개 카탈로그·권장 조인 관계 논리 초안
entities:
  - id: ENT-005
    name: "카탈로그 항목"
    term: TRM-223
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: logical
    features: [FEAT-003]
    reqs: [REQ-301, REQ-603]
    description: "Hub가 공개 대상으로 등록한 물리 테이블/뷰 하나의 안정 식별과 실제 반영된 내용 연결. DB 스키마 전체나 그룹별 등록 단위가 아니다"
    attributes:
      - { name: "카탈로그 식별자", meaning: "생성 뒤 재사용하지 않는 자산 식별자. 표시명이나 최신 리비전 번호로 대체하지 않는다", origin: "서버" }
      - { name: "데이터소스 참조", meaning: "ENT-002의 안정 Hub 식별자. 대상 시스템 귀속은 두지 않는다", origin: "관리자 선택" }
      - { name: "DB·카탈로그명", meaning: "원천의 실제 DB/카탈로그명. DBMS에 없는 차원은 명시적 해당 없음이며 전체와 일치하는 빈 조건이 아니다", origin: "확인한 원천 식별" }
      - { name: "DB 스키마명", meaning: "스키마가 있는 DBMS에서는 기본 스키마도 실제 이름으로 보존한다. 연결 별칭이나 검색 경로 추정으로 채우지 않는다", origin: "확인한 원천 식별" }
      - { name: "객체명", meaning: "공개 테이블/뷰의 실제 이름. SQL 별칭·임시 질의 이름과 구분한다", origin: "확인한 원천 식별" }
      - { name: "서버 한정자", meaning: "DBMS가 구분하는 경우 전체 물리 식별에 포함하는 한정자. 해당 없음과 미확인을 구분한다", origin: "확인한 원천 식별" }
      - { name: "현재 유효 리비전 참조", meaning: "세트 전체가 실제 반영된 ENT-006의 내용 판. 최초 후보만 있으면 유효 리비전이 없다", origin: "FEAT-014 반영 결과" }
      - { name: "현재 효력 근거", meaning: "실제 공개·폐기 결과와 적용 작업/시각의 참조. 초안의 공개 의도나 현재 접근 권한을 대신하지 않는다", origin: "실제 반영 결과" }
      - { name: "생성 주체", meaning: "최초 등록을 처리한 공통 주체 참조", origin: "서버 인증 근거" }
      - { name: "생성 시각", meaning: "안정 항목이 최초 등록된 시각. 운영 반영 시각과 구분한다", origin: "서버" }
    relations:
      - { entity: ENT-002, cardinality: "항목마다 데이터소스 하나", description: "같은 연결 안의 여러 DB/스키마 객체를 각각 전체 식별한다" }
      - { entity: ENT-006, cardinality: "항목마다 내용 리비전 1개 이상, 현재 유효본 0개 또는 1개", description: "최초 항목/후보 생성의 원자성은 후속 물리 계약에서 정한다" }
    rules:
      - "REQ-301.business_rules의 전체 식별로 같은 데이터소스 안의 물리 실체당 한 항목만 등록한다. 서로 다른 그룹이라는 이유로 같은 실체를 중복 등록하지 않는다"
      - "원천 이름 변경·소멸·재생성을 관측해도 기존 식별자·과거 참조를 자동 이전하거나 재사용하지 않는다. 동일성 확인과 변경 경로의 상세는 후속 명세에서 정한다"
      - "현재 유효본 교체는 ENT-006 전체 구성과 세트의 모든 변경 대상이 함께 반영될 때만 가능하다. 객체 등록이나 기술 검수만으로 유효본을 만들지 않는다"
    state_machine:
      management: "후보만 존재하는 항목·실제 유효본이 있는 항목·허용된 폐기 결과를 구분한다. 내용 검수/요청 처리 상태와 현재 보안 정책 상태를 하나의 플래그로 합치지 않는다"
      consumption: "ARCH-028의 선택 내용 리비전과 현재 공개/권한·신원·정책을 함께 검사한다. 오래된 내용의 보관은 폐기·회수 후 사용 허용이 아니다"
    audit: "당시 전체 내용은 ENT-006과 반영 세트의 실제 결과 참조로 재현한다. 삭제 후에도 원 식별자·과거 내용을 잃지 않는다"
    delete_policy: "폐기는 새 후보/세트로 요청하고 REQ-306.shared_impact의 남은 참조를 해소한다. 원천 객체 소멸 신호만으로 자동 삭제하지 않는다"
    rules_from: ["REQ-301.business_rules", "REQ-306.shared_impact", "ARCH-028.asset_versions", "UC-007"]
    pending: ["@defer P3 integration_assets — DBMS별 전체 식별의 정규화/동일성·원천 이름 변경과 재생성·현재 포인터/세트 반영 경합·물리 키와 삭제 후 조회를 설계한다"]

  - id: ENT-006
    name: "카탈로그 리비전"
    term: TRM-252
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: logical
    features: [FEAT-003, FEAT-011, FEAT-014, FEAT-033]
    reqs: [REQ-301, REQ-103, REQ-305, REQ-306]
    description: "공개 카탈로그 항목 한 건의 후보 및 과거 전체 내용. 컬럼·관계·필수 제약에 독립 승인 단계를 만들지 않고 같은 후보 구성으로 연결한다"
    attributes:
      - { name: "내용 리비전 식별자", meaning: "카탈로그 항목 안에서 당시 전체 구성을 특정하는 참조. 현재 버전·배포 버전·정책 버전과 구분한다", origin: "서버" }
      - { name: "카탈로그 참조", meaning: "ENT-005의 안정 식별자", origin: "후보 작성 대상" }
      - { name: "기준 유효 리비전", meaning: "수정/폐기/복원 후보를 작성한 기준 운영본. 신규는 기준본 없음으로 구분한다", origin: "서버 조회" }
      - { name: "당시 물리 식별·객체 유형", meaning: "ENT-005의 전체 식별과 TABLE/VIEW 사실을 그 내용 판의 근거로 보존한다. 현재 식별을 합성해 과거를 바꾸지 않는다", origin: "확인한 등록/관측 근거" }
      - { name: "업무 명칭·설명", meaning: "객체의 업무 의미. 미기재/미검수는 해당 범위 사용 불가이며 구조 코멘트를 자동 확정하지 않는다", origin: "관리자 검수" }
      - { name: "공개·폐기 의도", meaning: "이 후보가 요청하는 운영 변경. 현재 유효 상태 자체가 아니다", origin: "관리자" }
      - { name: "전체 등록 컬럼 구성", meaning: "ENT-007의 해당 리비전 전체 집합. 발견만 한 미등록 컬럼은 포함하지 않는다", origin: "관리자 및 검수 결과" }
      - { name: "전체 권장 관계 구성", meaning: "이 후보가 소유한 ENT-008 구성과 참조 내용 판. 반대편에서 보이는 조회 투영을 별도 정본으로 저장하지 않는다", origin: "관리자 및 검수 결과" }
      - { name: "필수 조회 제약 구성", meaning: "ENT-009의 전체 집합 및 검수된 제약 없음/미확인 구분. 빈 집합만으로 없음 승인을 추정하지 않는다", origin: "관리자 검수" }
      - { name: "접근 허용 그룹 구성", meaning: "테이블 그룹·등록 컬럼의 그룹 예외 전체. FEAT-007의 후보 계약과 연결하며 그룹만 바뀌어도 같은 세트에 포함한다", origin: "권한 있는 후보 작성" }
      - { name: "검수 근거 참조", meaning: "객체/컬럼/관계/제약별 미완성·검수 결과와 실제 확인 주체·시각·근거. 개인정보 검수와 현재 보안 정책을 별도로 대조한다", origin: "실제 검수 처리" }
      - { name: "변경 사유·근거 참조", meaning: "일반 변경 사유 또는 ENT-010·조사·검토 작업의 연결. 연결만으로 원본 열람 권한을 부여하지 않는다", origin: "작성자" }
      - { name: "반영 세트·처리 결과 참조", meaning: "FEAT-014·040의 접수/기술 검토/판정/전결/실제 반영 근거. 이 엔티티에 별도 결재 상태 원장을 복제하지 않는다", origin: "소유 공개 계약" }
      - { name: "당시 직접 정책 근거 참조", meaning: "과거 화면 재현에 필요한 FEAT-007·008·009·012·019 소유의 당시 정책 판/기록. 이 후보의 승인·복원 범위에는 포함하지 않는다", origin: "정책 소유 공개 조회" }
      - { name: "작성 주체·작성 시각", meaning: "이 내용 판을 작성한 주체·시각. 각 단계 처리자의 근거는 반영 세트에서 별도로 보존한다", origin: "서버 인증/시각" }
    relations:
      - { entity: ENT-005, cardinality: "리비전마다 카탈로그 항목 하나", description: "현재 항목의 실제 효력과 과거 내용 보관을 구분한다" }
      - { entity: ENT-007, cardinality: "리비전마다 등록 컬럼 0개 이상", description: "미완성 초안은 저장 가능하나 해당 미완성 범위는 AI 사용에서 제외한다" }
      - { entity: ENT-008, cardinality: "리비전마다 소유 관계 0개 이상", description: "관계 없는 독립 컬럼의 사용을 일괄 막지 않는다" }
      - { entity: ENT-009, cardinality: "리비전마다 필수 제약 0개 이상", description: "검수된 제약 없음은 별도 의미 상태다" }
      - { entity: ENT-010, cardinality: "리비전에 변경 근거 0개 이상", description: "일반 사유로 작성하는 후보에 별도 조사/관측을 강제하지 않는다" }
    related_features: [FEAT-014, FEAT-040, FEAT-007, FEAT-008, FEAT-009, FEAT-012, FEAT-019, FEAT-033, FEAT-036]
    rules:
      - "제출 전 작성 초안과 제출 이후 고정 구성·과거 유효본을 구분한다. 제출된 내용을 교체하지 않고 취소/반려 후 새 요청으로 연결한다"
      - "구조·의미·값 도메인·관계·제약·접근 그룹은 전체 후보로 검증/반영한다. 마스킹 변환·행 스코프·기본 필터·전송 정책의 직접 관리값은 내용 승인/복원으로 덮어쓰지 않는다"
      - "REQ-306의 기준 운영본·참조 최신성·같은 세트 후보 참조·직접/간접 버전 정합성·일괄 반영을 유지한다. 참조만 하는 자산을 변경 대상처럼 점유하지 않는다"
      - "현재 유효본의 이전 전체 구성을 별도 보존한 상태에서만 새 구성을 반영한다. 현재 리비전 포인터·세트 구성 중 일부만 갱신하거나 과거를 현재 컬럼/그룹으로 재계산하지 않는다"
    state_machine:
      content: "작성 초안·제출된 고정 후보·실제 반영본/과거 내용을 구분한다. 요청/검토/승인·전결/실패 복구의 상태 원천은 FEAT-014·040이다"
      consumption: "내용 판의 존재·검수 완료·승인 완료·실제 반영 완료를 구분한다. 반영 후에도 미완성 범위와 현재 접근 불가 범위는 사용하지 않는다. 과거 접근 그룹 스냅샷으로 현재 인가를 대신하지 않는다"
    audit: "전체 내용·접근 그룹과 단계별 근거를 당시 참조로 재현한다. 이력 조회는 현재 권한을 검사하며 복원은 새 후보·세트로 처리한다"
    retention: "REQ-301.audit·REQ-305.audit·REQ-306.evidence와 REQ-107의 자료별 보존 경계를 따른다. 대화/결과의 기한을 카탈로그 내용에 일괄 적용하지 않는다"
    rules_from: ["REQ-301", "REQ-305.business_rules", "REQ-306.catalog_boundary", "REQ-306.version_guard", "REQ-306.evidence", "REQ-601.request_integrity", "ARCH-028.asset_versions"]
    pending: ["@defer P3 integration_assets·knowledge·access_policy — 초안 편집/고정 시점·전체 내용의 물리 저장·세트 원자성/재수신·그룹 후보와 직접 정책 당시 참조를 소유 계약에 연결한다. 반영 세트/그룹 엔티티를 이번에 임시 생성하지 않는다"]

  - id: ENT-007
    name: "카탈로그 컬럼"
    term: TRM-253
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: logical
    features: [FEAT-003]
    reqs: [REQ-301, REQ-111]
    description: "한 카탈로그 리비전의 등록 컬럼 구성. 안정 컬럼 참조와 당시 속성을 함께 식별하며 컬럼별 독립 승인 절차를 두지 않는다"
    attributes:
      - { name: "컬럼 안정 식별자", meaning: "카탈로그 항목 안에서 조인·제약·정책이 참조하는 컬럼 식별. 물리명 변경이나 삭제 후 동명 컬럼을 자동 동일시하지 않는다", origin: "서버" }
      - { name: "소유 리비전 참조", meaning: "ENT-006의 전체 구성에 속하는 내용 판. 논리 식별은 소유 내용 판과 컬럼 안정 식별자의 조합이다", origin: "후보 작성 대상" }
      - { name: "물리 컬럼명·자료형", meaning: "확인한 원천 구조 사실. 자료형과 의미 유형/표현 형식을 구분한다", origin: "원천 사실 및 검수" }
      - { name: "키 참여·NULL 허용 사실", meaning: "기본키/유일키 참여와 NULL 허용 여부. 복합 키의 전체 구성 근거를 보존해 단일 참여 컬럼을 유일키로 오인하지 않는다", origin: "원천 사실 및 검수" }
      - { name: "업무 명칭·설명", meaning: "해당 컬럼의 검수할 업무 의미. 원천 코멘트/샘플만으로 확정하지 않는다", origin: "관리자" }
      - { name: "의미 유형·해석 형식", meaning: "날짜/일시·금액·수량·플래그·코드·식별자·자유 텍스트의 의미와 해당하는 형식/시간대/단위. 값 모양으로 의미를 추정하지 않는다", origin: "관리자 검수" }
      - { name: "값 도메인 방식", meaning: "공통코드 참조·인라인 열거·검수된 해당 없음과 미확인을 구분한다", origin: "관리자 검수" }
      - { name: "코드 원천 참조 구성", meaning: "같은 데이터소스의 공개 코드 객체/리비전·코드값/명칭 컬럼·필요한 그룹 구분 컬럼/값·추가 식별 조건. 불필요한 그룹 조건은 강제하지 않는다", origin: "관리자 및 참조 검증" }
      - { name: "인라인 값·의미 집합", meaning: "명시적으로 선택한 열거 방식의 값과 의미 전체. 코드 원천 정의나 미검수 샘플의 자동 복제본이 아니다", origin: "관리자 검수" }
      - { name: "의미·값 도메인 검수 근거", meaning: "완성/미확인·미검수 사유와 확인 주체·시각·근거를 속성별로 구분한다", origin: "실제 검수 처리" }
      - { name: "개인정보·접근 정책 참조", meaning: "REQ-111.privacy_metadata와 FEAT-007·008·009·019의 분류·식별 용도·마스킹·현재 정책 원천. 별도 편집 가능한 정책 사본은 두지 않는다", origin: "정책 소유 공개 계약" }
    relations:
      - { entity: ENT-006, cardinality: "컬럼 구성마다 소유 리비전 하나", description: "물리 저장은 후속이며 현재/과거 컬럼 구성을 함께 보존한다" }
      - { entity: ENT-005, cardinality: "코드 참조 방식이면 대상 코드 객체 하나", description: "같은 데이터소스의 공개·허용 객체 전체 식별과 당시 참조 판을 사용한다" }
    rules:
      - "미등록 컬럼은 발견됐어도 등록 컬럼으로 자동 추가하지 않는다. 등록된 컬럼의 접근 그룹 기본 상속과 예외는 FEAT-007을 따른다"
      - "의미·필요 형식·값 도메인이 미완성/미검수이면 해당 범위를 사용하지 않는다. 코드/관계가 불필요한 독립 컬럼에 별도 관계 등록을 강제하지 않는다"
      - "공통코드 참조와 인라인 열거의 관리 방식을 명확히 하며 다른 데이터소스·Hub 코드·동명 그룹으로 대체하지 않는다. 원천 참조만으로 미등록 코드 객체를 공개하지 않는다"
      - "컬럼 길이·DB 기본값·인덱스는 관리 속성으로 추가하지 않는다. 수집한 사실은 후보의 검수 자료이며 업무 의미·정책을 덮어쓰지 않는다"
    audit: "소유 ENT-006의 전체 컬럼 스냅샷과 검수 근거로 과거를 재현한다. 샘플링 원값을 내용 이력에 무제한 복제하지 않는다"
