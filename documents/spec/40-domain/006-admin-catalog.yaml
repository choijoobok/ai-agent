        - {"name":"UK_CAT_REV_NO","definition":"UNIQUE (CATALOG_ID, REVISION_NO)"}
        - {"name":"FK_CAT_REV_OWNER","definition":"FOREIGN KEY (CATALOG_ID) REFERENCES AI_ADMIN_CATALOG_ENTRY (CATALOG_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"FK_CAT_BASE","definition":"FOREIGN KEY (CATALOG_ID, BASE_REVISION_ID) REFERENCES AI_ADMIN_CATALOG_REVISION (CATALOG_ID, REVISION_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"FK_CAT_RESTORE","definition":"FOREIGN KEY (CATALOG_ID, RESTORE_REVISION_ID) REFERENCES AI_ADMIN_CATALOG_REVISION (CATALOG_ID, REVISION_ID) DEFERRABLE INITIALLY DEFERRED"}
