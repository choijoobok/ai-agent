      - { entity: ENT-007, cardinality: "리비전마다 등록 컬럼 0개 이상", description: "미완성 초안은 저장 가능하나 해당 미완성 범위는 AI 사용에서 제외한다" }
      - { entity: ENT-008, cardinality: "리비전마다 소유 관계 0개 이상", description: "관계 없는 독립 컬럼의 사용을 일괄 막지 않는다" }
      - { entity: ENT-010, cardinality: "리비전에 변경 근거 0개 이상", description: "일반 사유로 작성하는 후보에 별도 조사/관측을 강제하지 않는다" }
    related_features: [FEAT-014, FEAT-040, FEAT-007, FEAT-009, FEAT-012, FEAT-019, FEAT-033, FEAT-036]
    rules:
      - "제출 전 작성 초안과 제출 이후 고정 구성·과거 유효본을 구분한다. 제출된 내용을 교체하지 않고 취소/반려 후 새 요청으로 연결한다"
      - "구조·의미·값 도메인·관계·접근 그룹은 전체 후보로 검증/반영한다. 마스킹 변환·행 스코프·기본 필터·필수 조회 제약·전송 정책의 직접 관리값은 내용 승인/복원으로 덮어쓰지 않는다"
      - "기준 운영본·같은 세트 후보·외부 유효본·영향/과거 참조의 구분과 검증은 FEAT-014.reference_validation을 따른다. 참조만 하는 자산을 변경 대상처럼 점유하지 않는다"
      - "현재 유효본의 이전 전체 구성을 별도 보존한 상태에서만 새 구성을 반영한다. 현재 리비전 포인터·세트 구성 중 일부만 갱신하거나 과거를 현재 컬럼/그룹으로 재계산하지 않는다"
    state_machine:
      content: "작성 초안·제출된 고정 후보·실제 반영본/과거 내용을 구분한다. 요청/검토/승인·전결/실패 복구의 상태 원천은 FEAT-014·040이다"
      consumption: "내용 판의 존재·검수 완료·승인 완료·실제 반영 완료를 구분한다. 반영 후에도 미완성 범위와 현재 접근 불가 범위는 사용하지 않는다. 과거 접근 그룹 스냅샷으로 현재 인가를 대신하지 않는다"
    audit: "전체 내용·접근 그룹과 단계별 근거를 당시 참조로 재현한다. 이력 조회는 현재 권한을 검사하며 복원은 새 후보·세트로 처리한다"
    retention: "REQ-301.audit·REQ-305.audit·REQ-306.evidence와 REQ-107의 자료별 보존 경계를 따른다. 대화/결과의 기한을 카탈로그 내용에 일괄 적용하지 않는다"
    rules_from: ["REQ-301", "REQ-305.business_rules", "REQ-306.catalog_boundary", "REQ-306.version_guard", "REQ-306.evidence", "REQ-601.request_integrity", "ARCH-028.asset_versions"]
    delete_policy: "초안의 자식 제거도 부모 잠금/편집 버전을 검사한다. 고정 판과 과거 자식은 관리 화면에서 삭제/수정하지 않으며 파기는 소유 보존 정책과 참조 보호를 따른다"
    storage_contract: "초안 자식 쓰기·검수·고정은 모두 카탈로그 부모/리비전 잠금과 EDIT_VERSION을 검사한다. FROZEN 이후 자식까지 불변이며 취소/반려 뒤 재작성은 새 판이다. 승인/전결/복구 상태를 이 테이블에 복제하지 않는다. 정책 참조 TEXT는 버전 있는 참조 봉투이며 그룹 후보나 현재 정책 값을 통째로 복제한 우회 저장이 아니다."
    pending: ["@defer P3 knowledge·access_policy — 접근 그룹 후보의 소유 저장 구조·당시 정책 참조 형식과 세트 고정/반영 결과의 물리 연결을 확정한다. 이 구성이 비어 있다고 전체 내용 스냅샷이 완성된 것으로 보지 않는다"]
    physical:
