      - "원천 API의 대응 유일성과 계약/가이드 판을 함께 검사한다. FEAT-014.reference_validation에 따라 같은 세트의 API 후보를 참조할 수 있으나 외부 API의 미완성 초안을 유효 계약으로 쓰거나 새 판으로 자동 치환하지 않는다"
      - "계약·그룹·노출·가이드 변경 모두 전체 후보/스냅샷과 설정별 승인 또는 전결·일괄 반영 대상이다. 내부 관리 절차가 코드 검수·배포·실행 사용자 승인을 면제하지 않는다"
      - "참조 계약이 요청 뒤 변경·폐기·무효화되면 옛 승인으로 새 계약을 사용하지 않는다. 기준/참조 검증 실패에서 후보를 자동 치환하거나 일부만 반영하지 않는다"
      - "지식 연결 제거와 도구 폐지는 실제 변경 대상의 혼합 세트로 처리할 수 있다. 과거 연결과 실행 근거를 보존하고 사용 설명의 정본을 도구로 옮기지 않는다"
      - "자연어 가이드와 내부 구현으로 별도 직접 실행·재전송·자동 폴링 경로를 만들지 않는다. 결과 불명·멱등성·새 승인은 REQ-105·113의 경계를 따른다"
    state_machine:
      content: "작성 초안·고정 제출 후보·실제 유효본을 구분하며 반려/반영 실패는 기존 유효본을 유지한다. 요청/판정·복구 상태는 FEAT-014·040이 소유한다"
      consumption: "선택된 내용/원천 계약의 정합성과 현재 효력을 검사한다. 과거 허용 그룹·검수 근거를 현재 권한/구현 유효성의 대용으로 쓰지 않는다"
    audit: "변경 전 유효본·전체 후보와 당시 API/구현 계약·검수 근거·실제 승인/전결/반영을 연결한다. 실제 수행하지 않은 다른 사람의 승인 근거를 만들지 않는다"
    retention: "REQ-612.audit 및 REQ-601의 관리 이력과 실행 기록 정책을 구분하며 코드/비밀 원문을 이력 사본으로 보관하지 않는다"
    rules_from: ["REQ-612", "REQ-114.business_rules", "REQ-105", "REQ-113", "REQ-306.version_guard", "REQ-601.request_integrity"]
    delete_policy: "고정 내용/과거 판은 불변이고 폐지는 현재 효력 전환이다. 작업 중 참조·API 대응 점유/유효 연결을 검사하며 실제 보존/파기는 소유 정책을 따른다"
    storage_contract: "API 기반은 ENT-012 원천 계약/가이드를 참조하고 사본을 저장하지 않는다. 내부 구현은 공개 레지스트리의 식별자·검증 계약/배포 근거만 저장하며 클래스명·코드·환경변수/비밀을 실행 입력으로 받지 않는다. 모든 자식과 그룹 후보가 전체 판이며 고정 뒤 불변이다."
    pending: ["@defer P3 access_policy·knowledge — 전체 그룹/노출 후보 저장·세트 고정/반영·참조 점유 종료/복구를 연결한다","@defer P3 agent — 구현 레지스트리의 검수/배포 버전·현재 무효화/회수와 실제 호출 직전 검사 계약을 완성한다"]
