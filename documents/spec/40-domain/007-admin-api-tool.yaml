      - { entity: ENT-014, cardinality: "응답 코드형 필드마다 코드명 구성 0개 또는 1개", description: "필요한 구성이 미완성이면 정상 운영 계약으로 확정하지 않는다" }
    rules:
      - "요청 값 확보와 공통 계약은 API가, 업무별 질문/선택 순서는 지식 매핑이 소유한다. 응답 필드에 입력 확보 절차를 요구하지 않는다"
      - "실제 입력 검증과 서버 신원/추적값 주입은 신뢰된 서버 근거로 처리하며 모델 출력·응답값으로 보호값을 덮지 않는다"
      - "실제 응답의 미등록 경로·필수 누락·불명 형식은 REQ-111·115의 가림/경고·오류로 처리한다. 상태 변경 성공 뒤 응답 검증 실패를 미실행으로 바꾸지 않는다"
    audit: "당시 필드 전체를 ENT-012에 보존하고 실제 값은 실행 이력의 마스킹/보존 규칙을 따른다"
