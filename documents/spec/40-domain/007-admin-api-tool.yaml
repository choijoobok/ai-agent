# 영역: admin 연동 자산 — 업무 API·등록 도구 논리 초안
entities:
  - id: ENT-011
    name: "업무 API"
    term: TRM-199
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: logical
    features: [FEAT-004]
    reqs: [REQ-608]
    description: "지식·도구·코드 조회·실행 근거가 참조하는 업무 API의 안정 등록 단위. Hub 서비스 API 목록이나 실제 외부 호출 건과 구분한다"
    attributes:
      - { name: "업무 API 식별자", meaning: "등록 뒤 재사용하지 않는 안정 식별. 명칭·주소·HTTP 메서드/경로 문자열로 대체하지 않는다", origin: "서버" }
      - { name: "현재 유효 리비전 참조", meaning: "전체 세트가 실제 반영한 ENT-012 내용 판. 최초 후보만 있으면 유효본 없음으로 구분한다", origin: "FEAT-014 실제 반영" }
      - { name: "현재 효력 근거", meaning: "등록·비활성화·삭제의 실제 결과/시각 참조. 고객사 오픈 적용일·연결/신원·현재 권한의 호출 조건과 구분한다", origin: "실제 반영 결과" }
      - { name: "생성 주체", meaning: "최초 등록을 처리한 공통 주체 참조", origin: "서버 인증 근거" }
      - { name: "생성 시각", meaning: "안정 항목 최초 등록 시각. 공동 오픈/실제 반영 시각과 별개다", origin: "서버" }
    relations:
      - { entity: ENT-012, cardinality: "API마다 내용 판 1개 이상, 현재 유효본 0개 또는 1개", description: "안정 항목/최초 후보 생성과 유효본 교체의 원자성은 물리 계약에서 정한다" }
    related_features: [FEAT-014, FEAT-021, FEAT-033]
    rules:
      - "등록·관리 승인·현재 유효본 존재만으로 호출을 허용하지 않는다. 공동 오픈·현재 연결·신원·권한·실제 인자·필수 실행 승인 조건을 소비 시 검사한다"
      - "계약 갱신만으로 지식의 매핑 설명·리비전이나 도구 참조 판을 자동 갱신하지 않는다. REQ-306의 사용처·참조 최신성·영향 검토를 유지한다"
      - "표시명·메서드/경로·제공 시스템과의 새 유일성 제약을 임의로 만들지 않는다. 삭제 후 과거 등록/계약·실행 참조는 보존한다"
    state_machine:
      management: "후보만 존재·실제 유효본·비활성/폐지 결과를 구분한다. 호출 가능은 공동 오픈과 현재 통제를 포함한 별도 판정이다"
      consumption: "선택 내용 판은 ARCH-028·REQ-108을 따르되 현재 공개·권한·연결·신원 검사를 유지한다. 폐지가 이미 외부 접수된 실행을 소급 취소하지 않는다"
    audit: "내용/처리의 과거 근거는 ENT-012와 세트 결과로, 실제 호출은 agent의 실행 근거로 연결한다"
    rules_from: ["REQ-608.business_rules", "REQ-608.lifecycle", "ARCH-028.asset_versions", "REQ-105"]
    pending: ["@defer P3 integration_assets — 현재 효력·오픈 시점 판정·내용 포인터와 세트 원자성·참조 보호·허용 삭제와 과거 조회의 물리/공개 계약을 정한다"]

  - id: ENT-012
    name: "업무 API 리비전"
    term: TRM-256
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: logical
    features: [FEAT-004, FEAT-008, FEAT-014, FEAT-021, FEAT-033]
    reqs: [REQ-608, REQ-105, REQ-111]
    description: "업무 API의 전체 후보·당시 유효 계약. 내부 승인·고객사 공동 오픈·실제 실행 승인의 근거를 혼합하지 않는다"
    attributes:
      - { name: "API·내용 리비전 식별", meaning: "ENT-011 안정 API와 이 전체 내용 판의 참조. 배포 적용 설정 식별자와 별개다", origin: "서버/후보 대상" }
      - { name: "기준 유효 리비전", meaning: "후보 작성 때 대조한 운영본. 신규는 없음이며 참조만 하는 외부 자산과 실제 변경 대상을 구분한다", origin: "서버 조회" }
      - { name: "명칭·설명·조회/실행 유형", meaning: "업무 의미와 상태 변경 여부. HTTP 메서드나 인증 유무로 유형을 추정하지 않는다", origin: "검수된 고객사 계약" }
      - { name: "제공 시스템·연결 선택", meaning: "ENT-001과 시스템 기본 연결 사용/허용 목록의 특정 연결 참조. 기본 사용 시 실제 연결은 현재 시스템 정의로 해석한다", origin: "관리자 선택" }
      - { name: "HTTP 메서드·상대 경로", meaning: "등록 연결을 기준으로 서버가 목적지를 구성할 계약. 절대 주소·다른 호스트를 선택하는 경로는 허용하지 않는다", origin: "검수된 계약" }
      - { name: "신원 필요·전달 계약", meaning: "REQ-609의 현재 유효 매핑과 신뢰된 서버 값이 필요한지/어디로 전달되는지의 명세. 비밀·보호 헤더 값 자체를 저장하지 않는다", origin: "검수된 계약" }
      - { name: "전체 요청·응답 필드 구성", meaning: "ENT-013의 구조·의미·검증·입력 가이드·개인정보 기준 전체. 응답 코드명 구성은 ENT-014와 연결한다", origin: "관리자 및 검수" }
      - { name: "호출 허용 그룹·응답 통제 구성", meaning: "이 API 후보의 전체 접근 그룹과 그룹별 응답 경로의 원본/마스킹/접근제한 처리 전체 값 또는 불변 정책 판 참조. FEAT-008은 같은 원천·후보 경로를 사용하며 공통 마스킹 변환 정의와 현재 전송 동의는 별도다", origin: "권한 있는 관리·정책 후보" }
      - { name: "선택적 전체 호출 제한", meaning: "미지정 시 ARCH-033 공통값, 지정 시 해당 내용 판의 값을 사용한다. 0/음수/무제한은 받지 않고 유효 범위·연결 제한·점유/프록시와 대조한다", origin: "REQ-608.timeout_policy" }
      - { name: "재시도·멱등성·요청 식별 계약", meaning: "자동/수동 타임아웃 재시도 가능 여부, 멱등성의 보장 여부/근거·범위와 요청 식별자 전달 방식. 근거 없이 멱등성을 보장으로 채우지 않는다", origin: "API 제공자 검수 근거" }
      - { name: "성공 의미·결과 확인 계약", meaning: "완료/접수 의미와 결과 확인 API 유무·호출/상태 매핑·권장 재확인 시간 및 수동 확인 안내. 결과 확인 API 없음도 명시 등록 가능하다", origin: "고객사 계약" }
      - { name: "공동 오픈 근거·적용일", meaning: "릴리스 식별자·외부 계약 버전·책임자·시험/검수 자료·적용일. Hub 내부 승인 상태로 대체하지 않는다", origin: "고객사 공동 오픈 자료" }
      - { name: "공통 결과 안내·후속 가이드", meaning: "등록 결과 의미·질문/선택별 후속 참조·입력 확보·종료/수동 확인 안내. 실행 가능한 스크립트나 별도 상태표가 아니다", origin: "관리자 자연어 및 계약 참조" }
      - { name: "사용/노출 변경 의도", meaning: "후보가 요청하는 등록·변경·비활성화·삭제 의도. 현재 유효 상태와 구분한다", origin: "관리자" }
      - { name: "검수·변경 근거 및 세트 참조", meaning: "전체 후보의 사유·기준/참조 판·필드 검수와 FEAT-014·040의 요청/판정/전결/실제 반영 근거", origin: "실제 처리 기록" }
      - { name: "작성 주체·시각", meaning: "내용 판 작성 근거. 외부 검수자·내부 승인자·실제 실행자는 각각 소유 기록에서 식별한다", origin: "서버 인증/시각" }
    relations:
      - { entity: ENT-011, cardinality: "내용 판마다 안정 API 하나", description: "당시 전체 구성과 실제 반영 결과를 연결한다" }
      - { entity: ENT-001, cardinality: "완성 계약마다 제공 시스템 하나", description: "미완성 초안은 누락을 표시하며 정상 운영 반영 전에 그 시스템의 허용 연결 중 기본/특정 방식을 검증한다" }
      - { entity: ENT-013, cardinality: "내용 판마다 필드 0개 이상", description: "실제 계약의 입력/응답 필수 구성과 미완성을 대조하며 모든 API에 임의 필드를 강제하지 않는다" }
      - { entity: ENT-014, cardinality: "내용 판마다 코드명 규칙 0개 이상", description: "코드형 응답 필드에 필요한 구성을 검수한다" }
      - { entity: ENT-011, cardinality: "결과 확인·후속 API 참조 0개 이상", description: "각 역할의 안정 대상과 당시 계약 판/입출력 매핑을 보존한다" }
      - { entity: ENT-015, cardinality: "후속 도구 참조 0개 이상", description: "가이드의 참조는 노출·실행 권한을 부여하지 않는다" }
    rules:
      - "제출 전 초안·제출 뒤 고정 후보·실제 유효본/과거 내용을 구분한다. 필드·그룹·가이드만 바뀌어도 전체 후보와 세트로 검증/반영하며 당시 구성을 보존한다"
      - "미확인 필드·개인정보·참조를 정상 운영 계약으로 확정하지 않는다. 공동 오픈 적용일 전 호출을 관리 승인만으로 허용하지 않는다"
      - "배포 주소·인증 비밀·공통 고정 헤더는 별도 원천이다. 인증 없음도 명시 검수된 연결 방식인 경우에만 허용하며 비밀 누락을 인증 없음으로 바꾸지 않는다"
      - "실제 인자 확보/검증과 실행 승인은 소비 시 처리한다. 관리 승인·신원 전달 위치·자연어 가이드가 사용자/모델의 보호값 덮어쓰기나 승인 후 인자 변경을 허용하지 않는다"
      - "타임아웃·응답 해석/코드명 실패를 외부 미실행·실패·취소 확정으로 바꾸지 않는다. 결과 확인 API 없음·멱등성 미보장도 명시된 계약이며 자동 재전송의 근거가 아니다"
    state_machine:
      content: "초안·고정 후보·실제 반영본과 외부 오픈 조건을 구분한다. 세트 처리 상태는 FEAT-014·040이 소유한다"
      consumption: "선택 내용 판·현재 공개/그룹/정책과 실제 연결/신원·호출 제한을 검사한다. 과거 허용 그룹·오픈 근거만으로 현재 호출을 허용하지 않는다"
    audit: "변경 전 유효 구성·고정 후보·단계별 처리·실제 반영은 당시 판으로 연결한다. 실행의 인자·승인·대상·결과는 REQ-107·108·111의 소유 이력으로 연결한다"
    retention: "REQ-608.audit·REQ-601.open의 관리 이력과 실행 자료별 정책을 구분한다. 비밀/코드 원문이나 실제 응답값을 계약 이력의 사본으로 보관하지 않는다"
    rules_from: ["REQ-608", "REQ-105.approval_target_binding", "REQ-306.version_guard", "REQ-601.request_integrity", "ARCH-028.api_connection_resolution", "ARCH-032.secret_contract.no_auth"]
    pending: ["@defer P3 integration_assets·access_policy·agent/integration — 후보의 물리 저장·그룹/응답 정책 소유 경계·외부 적용일/검수 연결·경로 결합·보호 헤더·호출 제한/실행 동일성·재수신·세트 원자성과 시험을 구체화한다. 반출 속성은 REQ-608.open에서 정련한다"]

  - id: ENT-013
    name: "업무 API 필드 명세"
    term: TRM-257
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: logical
    features: [FEAT-004, FEAT-008]
    reqs: [REQ-608, REQ-111]
    attributes:
      - { name: "필드 안정 식별·소유 리비전", meaning: "ENT-012 안의 요청/응답 필드 참조와 당시 내용 판. 동일 이름의 다른 위치/경로를 구분한다", origin: "서버/계약" }
      - { name: "요청/응답 구분·전달 위치·경로", meaning: "필드/배열 하위 값의 정적 위치. 응답은 REQ-111의 정적 경로·배열 와일드카드 범위를 따른다", origin: "검수된 계약" }
      - { name: "업무 명칭·설명·전달 자료형", meaning: "필드의 구조와 업무 의미. 물리 DB 컬럼이나 외래 키를 필수로 요구하지 않는다", origin: "고객사 계약/관리자" }
      - { name: "의미 유형·해석 형식", meaning: "날짜/일시·금액·수량·코드 등의 의미와 필요한 형식·시간대·단위", origin: "관리자 검수" }
      - { name: "필수 여부·NULL 허용·검증 조건", meaning: "경로/값의 존재·허용값·형식 조건. 부재/NULL/0/빈 문자열을 자동 동일시하지 않는다", origin: "검수된 계약" }
      - { name: "값 도메인 구성", meaning: "명시 코드 원천/그룹 참조·인라인 값/의미·검수된 해당 없음. 미확인을 없음으로 바꾸거나 제공 시스템에서 데이터소스를 추정하지 않는다", origin: "관리자 및 검수" }
      - { name: "요청 값의 출처·채우기 가이드", meaning: "요청에만 적용하는 사용자/허용 조회/고정값/계산·형식 변환/서버 제공의 구분, 선택 조건·조회 참조/추출·부족/모호성 처리", origin: "API 공통 입력 명세" }
      - { name: "요청 고정값·기본값", meaning: "계약이 허용한 비밀 아닌 관리값. 신원·인증·보호 헤더를 일반 고정값으로 옮기지 않는다", origin: "관리자/계약" }
