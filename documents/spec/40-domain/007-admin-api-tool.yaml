      - { entity: ENT-005, cardinality: "완성된 카탈로그 방식이면 코드 객체 하나", description: "명시 데이터소스와 해당 객체/컬럼의 전체 식별을 함께 대조한다. 초안의 미지정은 정상 운영 반영 전 보완한다" }
      - { entity: ENT-011, cardinality: "완성된 API 방식이면 조회 API 하나", description: "HTTP 메서드가 아닌 검수된 조회 유형과 실제 응답 경로를 검사한다. 초안의 미지정은 정상 운영 반영 전 보완한다" }
    rules:
      - "선택 방법 밖 원천으로 자동 대체·코드명 추측·다른 코드명 규칙의 재귀 호출을 하지 않는다. 원 코드값과 표시명을 별도로 유지한다"
      - "원 업무와 코드 조회의 현재 권한·활성·신원·행 스코프·마스킹을 각각 검사한다. 가려진 원값을 복원해 조회하거나 명칭으로 제한된 의미를 노출하지 않는다"
      - "누락·복수 대응·권한 부족·조회 실패/시간 초과는 코드명 확인 불가이며 원 업무의 성공/접수/실패/불명과 별개다. 허용된 원값만 표시하고 미등록/개인정보 미확인을 예외로 노출하지 않는다"
      - "코드명 확인 실패로 원 업무를 재전송하거나 무기한 재시도·자동 폴링하지 않는다. 과거 결과를 현재 명칭으로 조용히 변경하지 않는다"
    audit: "관리 규칙은 ENT-012의 전체 구성, 사용 계약/참조와 해석 결과·실패는 REQ-107·108·111 실행 근거에 연결한다"
    rules_from: ["REQ-608.code_name_resolution", "REQ-608.field_metadata"]
    delete_policy: "고정 내용/과거 판은 불변이고 폐지는 현재 효력 전환이다. 작업 중 참조·API 대응 점유/유효 연결을 검사하며 실제 보존/파기는 소유 정책을 따른다"
    storage_contract: "코드명 규칙은 응답 코드 필드당 하나다. INLINE은 ENT-030의 같은 필드 값/의미를 공유하고 코드표를 복제하지 않는다. CATALOG/API의 정확 대상 판은 ENT-032, 입력·전체 대응 조건과 명칭 추출은 ENT-033이 소유한다. 같은 항목 여부·전체 대응 유일성·원값/명칭의 현재 권한을 별도 검증한다."
    pending: ["@defer P3 agent·integration — 선택한 조회의 행/시간 상한·코드명 해석 실패 상태/메시지·현재 권한/마스킹·실제 응답 대응 시험을 연결한다. 상한 미설정 시 외부 코드명 조회를 켜지 않는다"]
    physical:
      attributes:
        - {"name":"REVISION_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"FIELD_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"METHOD_CD","type":"character varying(8)","nullable":false,"default":null}
        - {"name":"NAME_FIELD_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"REFERENCE_NO","type":"integer","nullable":true,"default":null}
        - {"name":"MATCH_MODE","type":"character varying(10)","nullable":false,"default":null}
        - {"name":"REVIEW_STATUS","type":"character varying(12)","nullable":false,"default":null}
        - {"name":"REVIEWER_ID","type":"character varying(30)","nullable":true,"default":null}
        - {"name":"REVIEWED_DTM","type":"timestamp with time zone","nullable":true,"default":null}
        - {"name":"REVIEW_EVIDENCE","type":"text","nullable":true,"default":null}
      constraints:
        - {"name":"PK_API_CODE_NAME_RULE","definition":"PRIMARY KEY (REVISION_ID, FIELD_ID)"}
        - {"name":"FK_API_NAME_CODE","definition":"FOREIGN KEY (REVISION_ID, FIELD_ID) REFERENCES AI_ADMIN_BUSINESS_API_FIELD (REVISION_ID, FIELD_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"FK_API_NAME_FIELD","definition":"FOREIGN KEY (REVISION_ID, NAME_FIELD_ID) REFERENCES AI_ADMIN_BUSINESS_API_FIELD (REVISION_ID, FIELD_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"FK_API_NAME_REFERENCE","definition":"FOREIGN KEY (REVISION_ID, REFERENCE_NO) REFERENCES AI_ADMIN_API_CONTRACT_REF (REVISION_ID, REFERENCE_NO) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"CK_API_NAME_MODE","definition":"CHECK (METHOD_CD IN ('UNKNOWN','RESPONSE','INLINE','CATALOG','API') AND MATCH_MODE IN ('UNKNOWN','SAME_ITEM','KEYS') AND (METHOD_CD = 'RESPONSE' OR NAME_FIELD_ID IS NULL) AND (METHOD_CD IN ('CATALOG','API') OR REFERENCE_NO IS NULL))"}
        - {"name":"CK_API_NAME_REVIEW","definition":"CHECK (REVIEW_STATUS IN ('UNKNOWN','VERIFIED','INVALID') AND (REVIEW_STATUS <> 'VERIFIED' OR (REVIEWER_ID IS NOT NULL AND REVIEWED_DTM IS NOT NULL AND REVIEW_EVIDENCE IS NOT NULL)))"}
      indexes: []

  - id: ENT-015
