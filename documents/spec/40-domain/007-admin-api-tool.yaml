      - { entity: ENT-016, cardinality: "도구마다 내용 판 1개 이상, 유효본 0개 또는 1개", description: "신규/변경/폐지 모두 전체 후보로 관리한다" }
      - { entity: ENT-011, cardinality: "완성된 API 기반 등록이면 API 하나, 내부 구현 기반이면 없음", description: "당시 원천/계약은 ENT-016이 보존하며 현재 대응은 REQ-612.api_tool_mapping을 검증한다" }
    related_features: [FEAT-014, FEAT-004, FEAT-033]
    rules:
      - "등록·허용 그룹·노출 상태만으로 전체 업무 도구를 모델에 제공하지 않는다. 지식의 API/커스텀 도구 연결과 현재 권한·계약을 후보 구성/호출 때 각각 검증한다"
      - "REQ-612.api_tool_mapping의 API당 도구 하나를 신규·변경·폐지 후 재등록/복원에 적용한다. API/도구의 후보 ID만 달리해 같은 API에 별도 등록을 만들거나 자동 생성·승인하지 않는다"
      - "연결 지식은 원 매핑의 역조회이며 별도 사본을 두지 않는다. 유효 연결을 깨는 삭제/비활성화는 참조 검증을 거치고 조회 실패를 연결 없음으로 보지 않는다"
      - "폐지 반영 뒤 현재 노출·이후 호출을 중단하되 이미 외부 완료/접수된 실행은 소급 취소하지 않는다. 과거 등록/승인/실행 근거를 보존한다"
    state_machine:
      management: "후보와 실제 유효본·비노출/폐지를 구분한다. 비활성화·삭제도 설정에 따른 승인/전결 반영이며 무검수 직접 조작으로 우회하지 않는다"
      consumption: "도구의 현재 효력과 원천 API/구현의 유효성·지식 연결·실행 승인을 별도로 확인한다"
    audit: "ENT-016 전체 내용·실제 세트 처리와 호출별 근거를 안정 식별자로 연결한다"
    rules_from: ["REQ-612.business_rules", "REQ-612.api_tool_mapping", "REQ-612.lifecycle", "REQ-105", "ARCH-028.asset_versions"]
    delete_policy: "고정 내용/과거 판은 불변이고 폐지는 현재 효력 전환이다. 작업 중 참조·API 대응 점유/유효 연결을 검사하며 실제 보존/파기는 소유 정책을 따른다"
    storage_contract: "API당 등록 도구 하나는 ENT-035와 FEAT-021.api_mapping_contract로 검사한다. 현재 대응과 작성 중 대응 예약을 구분하며 후보가 현재 도구로 노출되지 않는다. RETIRED도 마지막 등록 대응을 보존하고 복원은 같은 TOOL_ID의 새 후보를 사용한다. 내부 구현의 대응 수에는 새 제한을 두지 않는다."
    pending: ["@defer P3 knowledge — 연결 지식 역참조·세트 원장/복구와 API 대응 예약의 해제/실제 전환을 연결한다"]
    physical:
      attributes:
        - {"name":"TOOL_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"CURRENT_REVISION_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"LIFECYCLE_CD","type":"character varying(10)","nullable":false,"default":null}
        - {"name":"STATE_VERSION","type":"bigint","nullable":false,"default":null}
        - {"name":"APPLY_RESULT_REF","type":"character varying(100)","nullable":true,"default":null}
        - {"name":"APPLIED_DTM","type":"timestamp with time zone","nullable":true,"default":null}
        - {"name":"REG_ID","type":"character varying(30)","nullable":false,"default":null}
        - {"name":"REG_DTM","type":"timestamp with time zone","nullable":false,"default":null}
      constraints:
        - {"name":"PK_BUSINESS_TOOL","definition":"PRIMARY KEY (TOOL_ID)"}
        - {"name":"CK_BIZ_TOOL_STATE","definition":"CHECK (LIFECYCLE_CD IN ('DRAFT','ACTIVE','DISABLED','RETIRED') AND STATE_VERSION >= 1 AND ((LIFECYCLE_CD = 'DRAFT' AND CURRENT_REVISION_ID IS NULL) OR (LIFECYCLE_CD <> 'DRAFT' AND CURRENT_REVISION_ID IS NOT NULL AND APPLY_RESULT_REF IS NOT NULL AND APPLIED_DTM IS NOT NULL)))"}
        - {"name":"FK_BIZ_TOOL_CURRENT","definition":"FOREIGN KEY (TOOL_ID, CURRENT_REVISION_ID) REFERENCES AI_ADMIN_BIZ_TOOL_REVISION (TOOL_ID, REVISION_ID) DEFERRABLE INITIALLY DEFERRED"}
