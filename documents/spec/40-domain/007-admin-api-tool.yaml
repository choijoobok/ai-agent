    storage_contract: "경로 원문은 형식 버전 1의 정적 토큰 배열을 TEXT로 직렬화하며 DB 배열/JSONB가 아니다. 비교 키는 서버가 산출한다. 필드와 값/조건·개인정보 검수는 API 전체 초안의 동일 EDIT_VERSION 아래 저장한다. 필드 구조·출처·정책 참조가 바뀌면 관련 검수/의존 규칙을 무효화한다."
    pending: ["@defer P3 access_policy·agent — 개인정보 분류/마스킹 참조 유효성·응답 중첩 경로 통제·반출 상속과 실제 누락/null/배열 판정 시험을 연결한다"]
