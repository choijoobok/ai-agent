# 업무 API·도구 물리 설계 초안 — 미구현
entities:
  - id: ENT-011
    name: "업무 API"
    term: TRM-199
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_BUSINESS_API
    features: [FEAT-004, FEAT-021]
    reqs: [REQ-608]
    description: "지식·도구·코드 조회·실행 근거가 참조하는 업무 API의 안정 등록 단위. Hub 서비스 API 목록이나 실제 외부 호출 건과 구분한다"
    attributes:
      - {"name":"안정 식별자","physical_name":"API_ID","pk":true,"description":"안정 식별자"}
      - {"name":"실제 반영된 판. 최초 후보는 null","physical_name":"CURRENT_REVISION_ID","description":"실제 반영된 판. 최초 후보는 null"}
      - {"name":"DRAFT/ACTIVE/DISABLED/RETIRED","physical_name":"LIFECYCLE_CD","description":"DRAFT/ACTIVE/DISABLED/RETIRED"}
      - {"name":"포인터·효력의 버전","physical_name":"STATE_VERSION","description":"포인터·효력의 버전"}
      - {"name":"공통 세트 실제 반영 결과 참조","physical_name":"APPLY_RESULT_REF","description":"공통 세트 실제 반영 결과 참조"}
      - {"name":"실제 반영 시각","physical_name":"APPLIED_DTM","description":"실제 반영 시각"}
      - {"name":"최초 작성 주체","physical_name":"REG_ID","description":"최초 작성 주체"}
      - {"name":"최초 작성 시각","physical_name":"REG_DTM","description":"최초 작성 시각"}
    relations:
      - { entity: ENT-012, cardinality: "API마다 내용 판 1개 이상, 현재 유효본 0개 또는 1개", description: "안정 항목/최초 후보는 FEAT-004.edit_transaction, 유효본 교체는 module_contract.freeze_apply와 세트 소유 후속을 따른다" }
      - { entity: ENT-015, cardinality: "API마다 대응 등록 도구 0개 또는 1개", description: "REQ-612.api_tool_mapping. 도구 등록 전에는 없을 수 있으며 과거 내용 판 여러 개를 여러 도구로 세지 않는다" }
    related_features: [FEAT-014, FEAT-021, FEAT-033]
    rules:
      - "등록·관리 승인·현재 유효본 존재만으로 호출을 허용하지 않는다. 공동 오픈·현재 연결·신원·권한·실제 인자·필수 실행 승인 조건을 소비 시 검사한다"
      - "계약 갱신만으로 지식의 매핑 설명·리비전이나 도구 참조 판을 자동 갱신하지 않는다. REQ-306의 사용처·참조 최신성·영향 검토를 유지한다"
      - "표시명·메서드/경로·제공 시스템과의 새 유일성 제약을 임의로 만들지 않는다. 삭제 후 과거 등록/계약·실행 참조는 보존한다"
    state_machine:
      management: "후보만 존재·실제 유효본·비활성/폐지 결과를 구분한다. 호출 가능은 공동 오픈과 현재 통제를 포함한 별도 판정이다"
      consumption: "선택 내용 판은 ARCH-028·REQ-108을 따르되 현재 공개·권한·연결·신원 검사를 유지한다. 폐지가 이미 외부 접수된 실행을 소급 취소하지 않는다"
    audit: "내용/처리의 과거 근거는 ENT-012와 세트 결과로, 실제 호출은 agent의 실행 근거로 연결한다"
    rules_from: ["REQ-608.business_rules", "REQ-608.lifecycle", "REQ-612.api_tool_mapping", "ARCH-028.asset_versions", "REQ-105"]
    delete_policy: "고정 내용/과거 판은 불변이고 폐지는 현재 효력 전환이다. 작업 중 참조·API 대응 점유/유효 연결을 검사하며 실제 보존/파기는 소유 정책을 따른다"
    storage_contract: "안정 항목과 최초 초안은 원자적으로 생성한다. 현재 포인터는 같은 API의 고정 판만 가리킨다. 표시명·메서드/경로·제공 시스템에 새 유일성 제한은 두지 않는다. 후보 저장으로 현재 효력/공동 오픈을 바꾸지 않으며 폐지는 이력을 삭제하지 않는다."
    pending: ["@defer P3 knowledge·audit_trace — 공통 세트의 실제 결과/복구·이력 보존/파기를 연결한다"]
    physical:
      attributes:
        - {"name":"API_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"CURRENT_REVISION_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"LIFECYCLE_CD","type":"character varying(10)","nullable":false,"default":null}
        - {"name":"STATE_VERSION","type":"bigint","nullable":false,"default":null}
        - {"name":"APPLY_RESULT_REF","type":"character varying(100)","nullable":true,"default":null}
        - {"name":"APPLIED_DTM","type":"timestamp with time zone","nullable":true,"default":null}
        - {"name":"REG_ID","type":"character varying(30)","nullable":false,"default":null}
        - {"name":"REG_DTM","type":"timestamp with time zone","nullable":false,"default":null}
      constraints:
        - {"name":"PK_BUSINESS_API","definition":"PRIMARY KEY (API_ID)"}
        - {"name":"CK_BIZ_API_STATE","definition":"CHECK (LIFECYCLE_CD IN ('DRAFT','ACTIVE','DISABLED','RETIRED') AND STATE_VERSION >= 1 AND ((LIFECYCLE_CD = 'DRAFT' AND CURRENT_REVISION_ID IS NULL) OR (LIFECYCLE_CD <> 'DRAFT' AND CURRENT_REVISION_ID IS NOT NULL AND APPLY_RESULT_REF IS NOT NULL AND APPLIED_DTM IS NOT NULL)))"}
        - {"name":"FK_BIZ_API_CURRENT","definition":"FOREIGN KEY (API_ID, CURRENT_REVISION_ID) REFERENCES AI_ADMIN_BUSINESS_API_REVISION (API_ID, REVISION_ID) DEFERRABLE INITIALLY DEFERRED"}
      indexes: []

