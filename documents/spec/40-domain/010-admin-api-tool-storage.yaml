    rules: ["선택한 종류의 값/ID만 받으며 다른 종류 컬럼은 null이다. 참조 번호와 선택 판·필드/컬럼을 복합 FK 및 서비스 검증으로 결합한다. null FK로 다른 판의 구성 참조를 우회하지 못한다","LOOKUP_INPUT은 선택 조회의 요청/AND 조건으로, MATCH_KEY는 원 항목과 결과 전체 키 대응으로, CODE_VALUE/DISPLAY_NAME은 실제 응답 추출로 사용한다. 배열 위치만으로 대응하지 않는다","REQUEST_KEY/IDENTITY는 SERVER 원천과 원 요청 대상만 허용한다. 응답/LLM 값으로 보호값을 덮지 않는다. 상태·신원·요청키와 코드명 표시를 한 값으로 합치지 않는다"]
    delete_policy: "고정 내용/과거 판은 불변이며 현재 쓰기 API로 제거하지 않는다. 점유는 FEAT-021의 명시 해제 조건에서만 제거하고 편집 결과는 보존 경계를 따른다"
    pending: []
    physical:
      attributes:
