      - {"name":"이 대응을 사용하는 입력/코드 필드. 결과 확인 전체이면 null","physical_name":"OWNER_FIELD_ID","description":"이 대응을 사용하는 입력/코드 필드. 결과 확인 전체이면 null"}
      - {"name":"외부 조회/결과 확인 참조. 순수 내부 대응이면 null","physical_name":"REFERENCE_NO","description":"외부 조회/결과 확인 참조. 순수 내부 대응이면 null"}
      - {"name":"ENT-032가 선택한 API 판","physical_name":"REFERENCE_API_REVISION_ID","description":"ENT-032가 선택한 API 판"}
      - {"name":"ENT-032가 선택한 카탈로그 판","physical_name":"REFERENCE_CATALOG_REVISION_ID","description":"ENT-032가 선택한 카탈로그 판"}
      - {"name":"LOOKUP_INPUT/MATCH_KEY/CODE_VALUE/DISPLAY_NAME/INPUT_VALUE/REQUEST_KEY/IDENTITY","physical_name":"PURPOSE_CD","description":"LOOKUP_INPUT/MATCH_KEY/CODE_VALUE/DISPLAY_NAME/INPUT_VALUE/REQUEST_KEY/IDENTITY"}
      - {"name":"LOCAL_FIELD/API_FIELD/CATALOG_COL/FIXED/SERVER","physical_name":"SOURCE_KIND","description":"LOCAL_FIELD/API_FIELD/CATALOG_COL/FIXED/SERVER"}
      - {"name":"같은 소유 판의 원 요청/응답 필드","physical_name":"SOURCE_FIELD_ID","description":"같은 소유 판의 원 요청/응답 필드"}
      - {"name":"참조 API 판의 원 필드","physical_name":"SOURCE_API_FIELD_ID","description":"참조 API 판의 원 필드"}
      - {"name":"참조 카탈로그 판의 원 컬럼","physical_name":"SOURCE_COLUMN_ID","description":"참조 카탈로그 판의 원 컬럼"}
      - {"name":"신뢰된 서버 문맥 계약의 허용 키","physical_name":"CONTEXT_KEY","description":"신뢰된 서버 문맥 계약의 허용 키"}
      - {"name":"고정 값 타입 STRING/NUMBER/BOOLEAN/NULL","physical_name":"FIXED_TYPE","description":"고정 값 타입 STRING/NUMBER/BOOLEAN/NULL"}
      - {"name":"비밀 아닌 정형 고정값. NULL만 null","physical_name":"FIXED_TEXT","description":"비밀 아닌 정형 고정값. NULL만 null"}
      - {"name":"LOCAL_FIELD/API_FIELD/CATALOG_COL/RESULT","physical_name":"TARGET_KIND","description":"LOCAL_FIELD/API_FIELD/CATALOG_COL/RESULT"}
      - {"name":"같은 소유 판의 받는 필드","physical_name":"TARGET_FIELD_ID","description":"같은 소유 판의 받는 필드"}
      - {"name":"참조 API 판의 받는 필드","physical_name":"TARGET_API_FIELD_ID","description":"참조 API 판의 받는 필드"}
      - {"name":"참조 카탈로그 판의 받는 컬럼","physical_name":"TARGET_COLUMN_ID","description":"참조 카탈로그 판의 받는 컬럼"}
