        - {"name":"REFERENCE_NO","type":"integer","nullable":false,"default":null}
        - {"name":"OWNER_FIELD_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"ROLE_CD","type":"character varying(12)","nullable":false,"default":null}
        - {"name":"TARGET_KIND","type":"character varying(7)","nullable":false,"default":null}
        - {"name":"API_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"API_REVISION_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"CATALOG_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"CATALOG_REVISION_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"TOOL_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"TOOL_REVISION_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"PURPOSE","type":"text","nullable":true,"default":null}
      constraints:
        - {"name":"PK_API_CONTRACT_REFERENCE","definition":"PRIMARY KEY (REVISION_ID, REFERENCE_NO)"}
        - {"name":"FK_API_REF_OWNER","definition":"FOREIGN KEY (REVISION_ID) REFERENCES AI_ADMIN_BUSINESS_API_REVISION (REVISION_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"FK_API_REF_FIELD","definition":"FOREIGN KEY (REVISION_ID, OWNER_FIELD_ID) REFERENCES AI_ADMIN_BUSINESS_API_FIELD (REVISION_ID, FIELD_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"FK_API_REF_TARGET","definition":"FOREIGN KEY (API_ID, API_REVISION_ID) REFERENCES AI_ADMIN_BUSINESS_API_REVISION (API_ID, REVISION_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"FK_API_REF_CAT","definition":"FOREIGN KEY (CATALOG_ID, CATALOG_REVISION_ID) REFERENCES AI_ADMIN_CATALOG_REVISION (CATALOG_ID, REVISION_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"FK_API_REF_TOOL","definition":"FOREIGN KEY (TOOL_ID, TOOL_REVISION_ID) REFERENCES AI_ADMIN_BIZ_TOOL_REVISION (TOOL_ID, REVISION_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"UK_API_REF_API_REV","definition":"UNIQUE (REVISION_ID, REFERENCE_NO, API_REVISION_ID)"}
        - {"name":"UK_API_REF_CAT_REV","definition":"UNIQUE (REVISION_ID, REFERENCE_NO, CATALOG_REVISION_ID)"}
        - {"name":"CK_API_REF_KIND","definition":"CHECK (REFERENCE_NO > 0 AND ROLE_CD IN ('INPUT_LOOKUP','FIELD_CODE','CODE_NAME','RESULT_CHECK','FOLLOWUP') AND TARGET_KIND IN ('API','CATALOG','TOOL') AND (TARGET_KIND = 'API' OR (API_ID IS NULL AND API_REVISION_ID IS NULL)) AND (TARGET_KIND = 'CATALOG' OR (CATALOG_ID IS NULL AND CATALOG_REVISION_ID IS NULL)) AND (TARGET_KIND = 'TOOL' OR (TOOL_ID IS NULL AND TOOL_REVISION_ID IS NULL)))"}
      indexes: []

