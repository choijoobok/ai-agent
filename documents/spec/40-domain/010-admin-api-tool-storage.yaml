        - {"name":"REFERENCE_NO","type":"integer","nullable":false,"default":null}
        - {"name":"TARGET_KIND","type":"character varying(4)","nullable":false,"default":null}
        - {"name":"API_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"API_REVISION_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"TOOL_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"TOOL_REVISION_ID","type":"bigint","nullable":true,"default":null}
        - {"name":"PURPOSE","type":"text","nullable":true,"default":null}
      constraints:
        - {"name":"PK_TOOL_GUIDE_REFERENCE","definition":"PRIMARY KEY (REVISION_ID, REFERENCE_NO)"}
        - {"name":"FK_TOOL_GUIDE_OWNER","definition":"FOREIGN KEY (REVISION_ID) REFERENCES AI_ADMIN_BIZ_TOOL_REVISION (REVISION_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"FK_TOOL_GUIDE_API","definition":"FOREIGN KEY (API_ID, API_REVISION_ID) REFERENCES AI_ADMIN_BUSINESS_API_REVISION (API_ID, REVISION_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"FK_TOOL_GUIDE_TOOL","definition":"FOREIGN KEY (TOOL_ID, TOOL_REVISION_ID) REFERENCES AI_ADMIN_BIZ_TOOL_REVISION (TOOL_ID, REVISION_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"CK_TOOL_GUIDE_KIND","definition":"CHECK (REFERENCE_NO > 0 AND TARGET_KIND IN ('API','TOOL') AND (TARGET_KIND = 'API' OR (API_ID IS NULL AND API_REVISION_ID IS NULL)) AND (TARGET_KIND = 'TOOL' OR (TOOL_ID IS NULL AND TOOL_REVISION_ID IS NULL)))"}
      indexes: []
