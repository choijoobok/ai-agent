    rules: ["내부 구현의 자연어 가이드에서 사용할 등록 후속 참조만 보존한다. API 기반 도구는 API 판의 가이드/참조를 사용하고 이 행을 두지 않는다","후속 참조는 실행 허가가 아니다. 현재 지식 연결·권한·계약·인자·새 실행 승인을 다시 검사한다"]
    delete_policy: "고정 내용/과거 판은 불변이며 현재 쓰기 API로 제거하지 않는다. 점유는 FEAT-021의 명시 해제 조건에서만 제거하고 편집 결과는 보존 경계를 따른다"
    pending: []
    physical:
      attributes:
