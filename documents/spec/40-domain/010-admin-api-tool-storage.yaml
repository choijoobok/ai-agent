      - {"name":"API/CATALOG/TOOL","physical_name":"TARGET_KIND","description":"API/CATALOG/TOOL"}
      - {"name":"참조 안정 API","physical_name":"API_ID","description":"참조 안정 API"}
      - {"name":"선택 API 내용 판","physical_name":"API_REVISION_ID","description":"선택 API 내용 판"}
      - {"name":"참조 공개 카탈로그","physical_name":"CATALOG_ID","description":"참조 공개 카탈로그"}
      - {"name":"선택 카탈로그 내용 판","physical_name":"CATALOG_REVISION_ID","description":"선택 카탈로그 내용 판"}
      - {"name":"참조 안정 도구","physical_name":"TOOL_ID","description":"참조 안정 도구"}
      - {"name":"선택 도구 내용 판","physical_name":"TOOL_REVISION_ID","description":"선택 도구 내용 판"}
      - {"name":"업무 역할·선택 조건 설명","physical_name":"PURPOSE","description":"업무 역할·선택 조건 설명"}
    rules: ["실제 내용 참조를 자연어/JSON 봉투에 숨기지 않는다. 비null ID는 존재와 소유를 검사하며 미완성 null은 초안에만 허용한다","공동 후보의 정확 판과 외부 최신 유효본을 FEAT-014.reference_validation으로 대조한다. 조회 참조는 QUERY만 가능하고 FOLLOWUP은 별도 현재 권한/실행 승인 조건을 유지한다","카탈로그의 데이터소스는 선택한 안정 카탈로그에서 확인한다. API 제공 시스템에서 추정하지 않는다. 상호 내용 참조 허용은 코드명 조회 재귀 실행 허가가 아니다"]
    delete_policy: "고정 내용/과거 판은 불변이며 현재 쓰기 API로 제거하지 않는다. 점유는 FEAT-021의 명시 해제 조건에서만 제거하고 편집 결과는 보존 경계를 따른다"
    pending: []
    physical:
      attributes:
