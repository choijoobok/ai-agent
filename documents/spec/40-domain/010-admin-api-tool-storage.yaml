      - {"name":"검증 필드","physical_name":"FIELD_ID","pk":true,"description":"검증 필드"}
      - {"name":"필드 안의 조건 순서","physical_name":"CHECK_NO","pk":true,"description":"필드 안의 조건 순서"}
      - {"name":"MIN/MAX/MIN_LENGTH/MAX_LENGTH/MIN_ITEMS/MAX_ITEMS/FORMAT","physical_name":"CHECK_KIND","description":"MIN/MAX/MIN_LENGTH/MAX_LENGTH/MIN_ITEMS/MAX_ITEMS/FORMAT"}
      - {"name":"NUMBER/STRING","physical_name":"OPERAND_TYPE","description":"NUMBER/STRING"}
      - {"name":"정형 기준값 또는 검증기 형식 식별자","physical_name":"OPERAND_TEXT","description":"정형 기준값 또는 검증기 형식 식별자"}
      - {"name":"MIN/MAX의 경계 포함 Y/N. 그 외 null","physical_name":"INCLUSIVE_YN","description":"MIN/MAX의 경계 포함 Y/N. 그 외 null"}
    rules: ["조건은 모두 AND이며 값 타입·범위 모순·지원 형식을 후보 검수에서 검사한다. 임의 정규식/스크립트·실행 코드를 받지 않는다","허용값 집합은 ENT-030 또는 검수한 FIELD_CODE 참조, 필수/null은 ENT-013이 소유한다. 지원 밖 검증을 무시하거나 정상 검수로 표시하지 않는다"]
    delete_policy: "고정 내용/과거 판은 불변이며 현재 쓰기 API로 제거하지 않는다. 점유는 FEAT-021의 명시 해제 조건에서만 제거하고 편집 결과는 보존 경계를 따른다"
    pending: []
    physical:
      attributes:
        - {"name":"REVISION_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"FIELD_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"CHECK_NO","type":"integer","nullable":false,"default":null}
        - {"name":"CHECK_KIND","type":"character varying(16)","nullable":false,"default":null}
        - {"name":"OPERAND_TYPE","type":"character varying(8)","nullable":false,"default":null}
        - {"name":"OPERAND_TEXT","type":"text","nullable":false,"default":null}
        - {"name":"INCLUSIVE_YN","type":"character varying(1)","nullable":true,"default":null}
      constraints:
        - {"name":"PK_API_FIELD_CHECK","definition":"PRIMARY KEY (REVISION_ID, FIELD_ID, CHECK_NO)"}
        - {"name":"FK_API_CHECK_FIELD","definition":"FOREIGN KEY (REVISION_ID, FIELD_ID) REFERENCES AI_ADMIN_BUSINESS_API_FIELD (REVISION_ID, FIELD_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"CK_API_CHECK_CODE","definition":"CHECK (CHECK_NO > 0 AND CHECK_KIND IN ('MIN','MAX','MIN_LENGTH','MAX_LENGTH','MIN_ITEMS','MAX_ITEMS','FORMAT') AND OPERAND_TYPE IN ('NUMBER','STRING') AND (INCLUSIVE_YN IS NULL OR INCLUSIVE_YN IN ('Y','N')))"}
      indexes: []

  - id: ENT-032
    name: "API 계약 참조"
    term: TRM-276
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_API_CONTRACT_REF
    features: ["FEAT-004"]
    reqs: ["REQ-608"]
    attributes:
      - {"name":"소유 API 판","physical_name":"REVISION_ID","pk":true,"description":"소유 API 판"}
      - {"name":"판 안의 참조 번호","physical_name":"REFERENCE_NO","pk":true,"description":"판 안의 참조 번호"}
      - {"name":"입력/값/코드명의 소유 필드. API 전체 후속이면 null","physical_name":"OWNER_FIELD_ID","description":"입력/값/코드명의 소유 필드. API 전체 후속이면 null"}
