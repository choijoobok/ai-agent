# 업무 API·도구의 필드·값·정형 참조/대응·후보 점유·편집 결과 — 미구현
entities:
  - id: ENT-029
    name: "API 필드 안정 식별"
    term: TRM-273
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_API_FIELD_IDENTITY
    features: ["FEAT-004"]
    reqs: ["REQ-608"]
    attributes:
      - {"name":"API 안의 안정 필드 식별자","physical_name":"FIELD_ID","pk":true,"description":"API 안의 안정 필드 식별자"}
      - {"name":"소유 안정 API","physical_name":"API_ID","description":"소유 안정 API"}
      - {"name":"최초 작성 주체","physical_name":"REG_ID","description":"최초 작성 주체"}
      - {"name":"최초 작성 시각","physical_name":"REG_DTM","description":"최초 작성 시각"}
    rules: ["같은 API 안에서만 ID를 사용하고 다른 API로 이전/재사용하지 않는다. 이름/위치가 같다고 다른 필드를 자동 동일시하지 않는다","새 후보는 같은 필드 ID와 새 판의 경로/의미를 보존한다. 제거된 필드 ID는 과거 조회 때문에 남고 새 판에서 자동 복구하지 않는다"]
    delete_policy: "고정 내용/과거 판은 불변이며 현재 쓰기 API로 제거하지 않는다. 점유는 FEAT-021의 명시 해제 조건에서만 제거하고 편집 결과는 보존 경계를 따른다"
    pending: []
    physical:
      attributes:
        - {"name":"FIELD_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"API_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"REG_ID","type":"character varying(30)","nullable":false,"default":null}
        - {"name":"REG_DTM","type":"timestamp with time zone","nullable":false,"default":null}
      constraints:
        - {"name":"PK_API_FIELD_IDENTITY","definition":"PRIMARY KEY (FIELD_ID)"}
        - {"name":"UK_API_FIELD_OWNER","definition":"UNIQUE (API_ID, FIELD_ID)"}
        - {"name":"FK_API_FIELD_PARENT","definition":"FOREIGN KEY (API_ID) REFERENCES AI_ADMIN_BUSINESS_API (API_ID) DEFERRABLE INITIALLY DEFERRED"}
      indexes: []

  - id: ENT-030
    name: "API 필드 정의 값"
    term: TRM-274
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_API_FIELD_VALUE
    features: ["FEAT-004"]
    reqs: ["REQ-608"]
    attributes:
      - {"name":"소유 판","physical_name":"REVISION_ID","pk":true,"description":"소유 판"}
      - {"name":"소유 필드","physical_name":"FIELD_ID","pk":true,"description":"소유 필드"}
      - {"name":"필드 안의 정의 순서","physical_name":"VALUE_NO","pk":true,"description":"필드 안의 정의 순서"}
      - {"name":"ENUM/FIXED/DEFAULT","physical_name":"VALUE_ROLE","description":"ENUM/FIXED/DEFAULT"}
      - {"name":"STRING/NUMBER/BOOLEAN/NULL","physical_name":"VALUE_TYPE","description":"STRING/NUMBER/BOOLEAN/NULL"}
      - {"name":"정형 스칼라 값. NULL 타입만 null","physical_name":"VALUE_TEXT","description":"정형 스칼라 값. NULL 타입만 null"}
      - {"name":"역할·타입·정형 값 SHA-256","physical_name":"VALUE_KEY","description":"역할·타입·정형 값 SHA-256"}
      - {"name":"열거 값의 의미/코드 표시명","physical_name":"MEANING","description":"열거 값의 의미/코드 표시명"}
    rules: ["값의 타입·앞자리 0·빈 문자열·null을 보존한다. 숫자는 정규 십진 표현이며 해시 일치 시 전체 값을 대조하고 충돌은 거부한다","ENUM은 필드의 허용값과 INLINE 코드명에서 같은 행을 참조한다. FIXED/DEFAULT는 요청 필드당 각 0..1개이고 검수된 비밀 아닌 값만 둔다. 가변 출처 선택은 ENT-037을 따른다. 다른 역할을 검증용 열거로 합산하지 않는다"]
    delete_policy: "고정 내용/과거 판은 불변이며 현재 쓰기 API로 제거하지 않는다. 점유는 FEAT-021의 명시 해제 조건에서만 제거하고 편집 결과는 보존 경계를 따른다"
    pending: []
    physical:
      attributes:
        - {"name":"REVISION_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"FIELD_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"VALUE_NO","type":"integer","nullable":false,"default":null}
        - {"name":"VALUE_ROLE","type":"character varying(8)","nullable":false,"default":null}
        - {"name":"VALUE_TYPE","type":"character varying(8)","nullable":false,"default":null}
        - {"name":"VALUE_TEXT","type":"text","nullable":true,"default":null}
        - {"name":"VALUE_KEY","type":"character varying(64)","nullable":false,"default":null}
        - {"name":"MEANING","type":"text","nullable":true,"default":null}
      constraints:
        - {"name":"PK_API_FIELD_VALUE","definition":"PRIMARY KEY (REVISION_ID, FIELD_ID, VALUE_NO)"}
        - {"name":"FK_API_VALUE_FIELD","definition":"FOREIGN KEY (REVISION_ID, FIELD_ID) REFERENCES AI_ADMIN_BUSINESS_API_FIELD (REVISION_ID, FIELD_ID) DEFERRABLE INITIALLY DEFERRED"}
        - {"name":"UK_API_VALUE_UNIQUE","definition":"UNIQUE (REVISION_ID, FIELD_ID, VALUE_ROLE, VALUE_KEY)"}
        - {"name":"CK_API_VALUE_KIND","definition":"CHECK (VALUE_NO > 0 AND VALUE_ROLE IN ('ENUM','FIXED','DEFAULT') AND VALUE_TYPE IN ('STRING','NUMBER','BOOLEAN','NULL') AND ((VALUE_TYPE = 'NULL' AND VALUE_TEXT IS NULL) OR (VALUE_TYPE <> 'NULL' AND VALUE_TEXT IS NOT NULL)))"}
      indexes: []

  - id: ENT-031
    name: "API 필드 검증 조건"
