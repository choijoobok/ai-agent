# 카탈로그의 구성 식별·전체 키·값·관계·근거·초안 편집 처리
entities:
  - id: ENT-020
    name: "카탈로그 구성 식별"
    term: TRM-264
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_CATALOG_MEMBER
    features: ["FEAT-003","FEAT-011"]
    reqs: ["REQ-301"]
    attributes:
      - {"name":"컬럼·관계·제약의 안정 식별자","physical_name":"MEMBER_ID","pk":true,"description":"컬럼·관계·제약의 안정 식별자"}
      - {"name":"생성 시 고정한 소유 카탈로그","physical_name":"CATALOG_ID","description":"생성 시 고정한 소유 카탈로그"}
      - {"name":"구성 종류","physical_name":"MEMBER_KIND","description":"COLUMN/RELATION/CONSTRAINT"}
      - {"name":"생성 주체","physical_name":"REG_ID","description":"생성 주체"}
      - {"name":"생성 시각","physical_name":"REG_DTM","description":"생성 시각"}
    relations:
      - {"entity":"ENT-005","cardinality":"소유 판·구성의 복합 키로 참조","description":"명시된 physical 외래키를 따른다. 보존·고정과 현재 권한 판정은 별도 계약이다"}
    rules: ["소유 카탈로그·종류·식별자는 생성 후 불변이다. 이름 변경이나 미사용/폐기 뒤 다른 구성에 ID를 재사용하지 않는다","카탈로그 부모 잠금 아래 실제 초안 구성과 함께 생성하며 관계의 관리측 이전을 차단한다"]
    delete_policy: "소유 리비전/근거의 불변성과 보존을 따른다. 현재 후보에서 제거해도 과거 판/안정 식별/성공 결과를 연쇄 삭제하지 않는다. 초안 자식 교체는 부모 잠금 아래 같은 트랜잭션으로 처리한다"
    pending: []
    physical:
      attributes:
        - {"name":"MEMBER_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"CATALOG_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"MEMBER_KIND","type":"character varying(12)","nullable":false,"default":null}
        - {"name":"REG_ID","type":"character varying(30)","nullable":false,"default":null}
        - {"name":"REG_DTM","type":"timestamp with time zone","nullable":false,"default":null}
      constraints:
        - {"name":"PK_CATALOG_MEMBER","definition":"PRIMARY KEY (MEMBER_ID)"}
        - {"name":"UK_CAT_MEMBER_OWNER","definition":"UNIQUE (CATALOG_ID, MEMBER_ID, MEMBER_KIND)"}
        - {"name":"FK_CAT_MEMBER_CATALOG","definition":"FOREIGN KEY (CATALOG_ID) REFERENCES AI_ADMIN_CATALOG_ENTRY (CATALOG_ID)"}
        - {"name":"CK_CAT_MEMBER_KIND","definition":"CHECK (MEMBER_KIND IN ('COLUMN','RELATION','CONSTRAINT'))"}
      indexes: []

  - id: ENT-021
    name: "카탈로그 식별키"
    term: TRM-265
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_CATALOG_KEY
    features: ["FEAT-003"]
    reqs: ["REQ-301"]
    attributes:
      - {"name":"소유 내용 판","physical_name":"REVISION_ID","pk":true,"description":"소유 내용 판"}
      - {"name":"판 안의 키 번호","physical_name":"KEY_NO","pk":true,"description":"판 안의 키 번호"}
      - {"name":"식별키 종류","physical_name":"KEY_KIND","description":"PRIMARY/UNIQUE"}
      - {"name":"확인한 원천 키 이름. 논리 유일성 근거는 null 가능","physical_name":"SOURCE_NAME","description":"확인한 원천 키 이름. 논리 유일성 근거는 null 가능"}
      - {"name":"검수 상태 UNKNOWN/VERIFIED/INVALID","physical_name":"REVIEW_STATUS","description":"검수 상태 UNKNOWN/VERIFIED/INVALID"}
      - {"name":"실제 검수자","physical_name":"REVIEWER_ID","description":"실제 검수자"}
      - {"name":"실제 검수 시각","physical_name":"REVIEWED_DTM","description":"실제 검수 시각"}
      - {"name":"검수 근거. 샘플 원값이나 비밀을 넣지 않는다","physical_name":"REVIEW_EVIDENCE","description":"검수 근거. 샘플 원값이나 비밀을 넣지 않는다"}
    relations:
      - {"entity":"ENT-006","cardinality":"소유 판·구성의 복합 키로 참조","description":"명시된 physical 외래키를 따른다. 보존·고정과 현재 권한 판정은 별도 계약이다"}
    rules: ["원천 PK·유일키의 전체 컬럼 구성과 근거를 보존한다. 인덱스·DB 제약을 생성하거나 편집하는 기능이 아니다","미완성 키는 조회 대체/1측 유일성의 검수 근거로 사용하지 않는다"]
    delete_policy: "소유 리비전/근거의 불변성과 보존을 따른다. 현재 후보에서 제거해도 과거 판/안정 식별/성공 결과를 연쇄 삭제하지 않는다. 초안 자식 교체는 부모 잠금 아래 같은 트랜잭션으로 처리한다"
    pending: []
    physical:
      attributes:
        - {"name":"REVISION_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"KEY_NO","type":"integer","nullable":false,"default":null}
        - {"name":"KEY_KIND","type":"character varying(8)","nullable":false,"default":null}
        - {"name":"SOURCE_NAME","type":"character varying(500)","nullable":true,"default":null}
        - {"name":"REVIEW_STATUS","type":"character varying(12)","nullable":false,"default":null}
        - {"name":"REVIEWER_ID","type":"character varying(30)","nullable":true,"default":null}
        - {"name":"REVIEWED_DTM","type":"timestamp with time zone","nullable":true,"default":null}
        - {"name":"REVIEW_EVIDENCE","type":"text","nullable":true,"default":null}
      constraints:
        - {"name":"PK_CATALOG_KEY","definition":"PRIMARY KEY (REVISION_ID, KEY_NO)"}
        - {"name":"FK_CAT_KEY_REV","definition":"FOREIGN KEY (REVISION_ID) REFERENCES AI_ADMIN_CATALOG_REVISION (REVISION_ID)"}
        - {"name":"CK_CAT_KEY_TYPE","definition":"CHECK (KEY_NO > 0 AND KEY_KIND IN ('PRIMARY','UNIQUE'))"}
        - {"name":"CK_CAT_KEY_REVIEW","definition":"CHECK (REVIEW_STATUS IN ('UNKNOWN','VERIFIED','INVALID') AND (REVIEW_STATUS <> 'VERIFIED' OR (REVIEWER_ID IS NOT NULL AND REVIEWED_DTM IS NOT NULL AND REVIEW_EVIDENCE IS NOT NULL)))"}
      indexes: []

