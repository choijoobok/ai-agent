        - { name: "USER_ID", type: "character varying(30)", nullable: false, default: null }
        - { name: "NOTI_TYPE_CD", type: "character varying(30)", nullable: false, default: null }
        - { name: "TITLE", type: "character varying(500)", nullable: false, default: null }
        - { name: "CONTENT", type: "character varying(2000)", nullable: true, default: null }
        - { name: "LINK_MENU_CD", type: "character varying(30)", nullable: true, default: null }
