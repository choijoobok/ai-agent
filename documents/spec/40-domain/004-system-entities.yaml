        - { name: "IX_SYS_NOTI_INBOX_03", unique: false, method: "btree", definition: "(cre_dtm)" }

  - id: ENT-527
    name: "계정·권한 관리 요청"
    table: SYS_NOTI_REQUEST
    features: [FEAT-509]
    attributes: [{ name: REQ_ID, type: bigint, pk: true }]
    columns: [REQ_ID, USER_ID, REQ_TYPE_CD, REQ_CONTENT, REQ_STAT_CD, HANDLER_ID, HANDLE_DTM, HANDLE_MEMO, CRE_DTM]
    relations: ["USER_ID -> ENT-501.USER_ID", "HANDLER_ID -> ENT-501.USER_ID (nullable)"]
    indexes: []
    index_policy: "현재 물리 인덱스를 그대로 두며 모듈 이동에서 새 인덱스를 만들지 않는다"
    state_machine: { RECEIVED: [DONE, REJECTED], DONE: [], REJECTED: [] }
    rules: ["판정은 계정·권한 변경과 분리", "종결 요청 재처리 금지", "REJECTED는 처리 메모 필수", "동시 판정은 대상 행 잠금으로 직렬화하고 뒤 요청은 상태 충돌로 거부"]
    audit: full
    delete_policy: never
    module: system
    implementation: implemented
    sources:
      - sources/backend/bootstrap/src/main/resources/db/changelog/db.changelog-master.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/system/db.changelog-system.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/system/001-system-schema.sql
    physical:
      attributes:
        - { name: "REQ_ID", type: "bigint", nullable: false, default: null }
        - { name: "USER_ID", type: "character varying(30)", nullable: false, default: null }
        - { name: "REQ_TYPE_CD", type: "character varying(30)", nullable: false, default: null }
        - { name: "REQ_CONTENT", type: "character varying(2000)", nullable: false, default: null }
        - { name: "REQ_STAT_CD", type: "character varying(20)", nullable: false, default: "'RECEIVED'::character varying" }
        - { name: "HANDLER_ID", type: "character varying(30)", nullable: true, default: null }
        - { name: "HANDLE_DTM", type: "timestamp with time zone", nullable: true, default: null }
        - { name: "HANDLE_MEMO", type: "character varying(2000)", nullable: true, default: null }
        - { name: "CRE_DTM", type: "timestamp with time zone", nullable: false, default: null }
      constraints:
        - { name: "PK_SYS_NOTI_REQUEST", definition: "PRIMARY KEY (req_id)" }
        - { name: "FK_SYS_NOTI_REQUEST_01", definition: "FOREIGN KEY (user_id) REFERENCES sys_user(user_id)" }
      indexes:
        - { name: "IX_SYS_NOTI_REQUEST_01", unique: false, method: "btree", definition: "(req_stat_cd, cre_dtm)" }
        - { name: "IX_SYS_NOTI_REQUEST_02", unique: false, method: "btree", definition: "(user_id, cre_dtm)" }

