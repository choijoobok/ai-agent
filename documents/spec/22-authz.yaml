# 권한 모델 — 사용자 그룹 · 매핑 구조 · 행 스코프 · SQL 통제 4단계
#
# 작성 단계: P2
# status: migrated — 사용자 승인 전이다.
#
# **요구사항은 10-requirements.yaml(REQ-103·105·111)이 갖는다** — 여기는 *모델* 이다.

meta:
  status: migrated
  baselined: null

# ── 통제의 축 ──────────────────────────────────────────────────────
axis:
  claim: "접근 통제의 축은 **선형 등급이 아니라 사용자 그룹**이다"
  why: "등급(전순서)은 높으면 낮은 것을 포함하는 구조라, **급여 담당자가 전 직원의 급여는 보되 평가 점수는 못 보는 식의 영역 경계**를 표현할 수 없다. **영역은 순서가 아니라 집합이다**"

# ── 애플리케이션 진입 권한과 업무 데이터 그룹은 다른 축이다 ──────
application_access:
  id: AUTHZ-090
  decision: ADR-007
  claim: "화면·API 진입은 system의 **메뉴/액션 유효 권한**, AI 업무 데이터 범위는 아래 AUTHZ-001의 **사용자 그룹**으로 각각 판정하며 둘을 역할명 하나로 합치지 않는다"
  rules:
    - "역할은 메뉴/액션 권한을 묶어 사용자에게 배포하는 수단이다. `ADMIN`·`TESTER`·`DEBUGGER` 같은 역할 코드는 런타임 분기 조건이 아니다"
    - "로그인 뒤 기본 경로는 안전한 원래 목적지 → 비밀번호 변경 → 관리 콘솔 진입 권한 → portal 진입 권한 순으로 결정한다(ARCH-021)"
    - "메뉴 없는 내부 화면은 내비게이션에서 숨겨도 권한 대상이어야 한다. 화면과 관련 `/api/service/**`에 같은 자원·액션 권한을 적용한다"
    - "프론트 라우트 가드는 사용성 장치이며 최종 판정은 서버 API가 한다. 직접 URL 입력으로 서버 권한을 우회할 수 없다"
    - "관리 콘솔과 portal 진입 권한이 모두 없는 사용자는 공통 API만 호출 가능한 빈 셸로 보내지 않고 시작 화면 없음으로 종료한다"
  unresolved_design: "숨김 화면을 `SYS_MENU`의 비내비게이션 유형으로 표현할지 별도 권한 자원으로 둘지는 SCR-112·ENT·API 설계에서 비교한다"
  traces_to: [ARCH-012, ARCH-021, FEAT-303]

# ── 설치 계정과 운영 권한의 분리 ────────────────────────────────
operational_role_boundary:
  id: AUTHZ-091
  decision: "system G1 사용자 승인(2026-09-12) · ADR-007"
  claim: "`ADMIN`은 설치를 끝내기 위한 초기 전체 권한 묶음일 뿐 상시 운영 역할이나 런타임 우회 키가 아니다"
  rules:
    - "설치 뒤에는 시스템 운영 권한, 감사 이력 열람 권한, AI 품질·정책 운영 권한을 서로 독립적으로 부여·회수할 수 있어야 한다"
    - "시스템 운영자는 계정·메뉴·역할·공통코드·메시지·설정·배치를 관리하지만, 권한 부여만으로 AI 품질·정책을 변경하거나 감사 원문을 열람하지 않는다"
    - "감사 권한은 system의 로그인·사용·오류 이력과 admin의 AI 감사 이력을 읽는 교차 모듈 권한이지만 어느 이력도 수정·삭제하지 못한다"
    - "AI 품질·정책 운영 권한은 admin이 소유한다. 품질 신고·정책 처리 결과의 사용자 알림은 system public 알림 계약을 사용하되 system 운영 권한을 요구하지 않는다"
    - "어떤 경로도 `ADMIN` 역할 코드의 존재만으로 허용하지 않는다. 설치 계정을 계속 사용하는 경우에도 실제 판정은 메뉴/액션 유효 권한을 따른다"
  grant_authority: "[ASM-005] 시스템 운영자가 감사·AI 품질 역할까지 부여할 수 있는지, 보안 책임자의 별도 승인·부여 경로가 필요한지는 미확정이다. 확정 전까지 세 권한 묶음은 서로를 자동 포함하지 않으며 모든 부여·회수 이력을 남긴다"
  bootstrap_lifecycle: "최초 기동에서만 설치용 계정을 제공하고, 운영 역할 구성이 끝나면 비활성화 또는 자격증명 회전을 안내한다. 자동 비활성화 여부와 정확한 역할 코드는 P3 인증·인가 설계에서 확정한다"
  traces_to: [REQ-502, REQ-503, REQ-507, REQ-509, AUTHZ-090]

# ── 그룹 판정 규칙 — 문서 전체에서 하나다 ─────────────────────────
judgement:
  id: AUTHZ-001
  rule: "사용자의 **소속 그룹 집합**과 객체의 **허용 그룹 집합**의 **교집합이 비어 있지 않으면 허용**, 매핑이 없으면 차단"
  applies_to:
    - 데이터소스
    - "테이블 · 컬럼"
    - "실행 API"
    - "커스텀 도구"
    - "지식 · 인증 예제 쿼리의 컨텍스트 주입 판정"
  single_component: "**다섯이 전부 같은 규칙을 쓰며 구현은 공통 컴포넌트 하나다**(FEAT-303). 같은 판정을 두 곳에서 구현하면 두 결과가 어긋난다"
  rules:
    - "사용자 그룹은 **전역**으로 정의하고 사용자에게 N:N 으로 매핑한다. 그룹은 개인 단위가 아니라 **직무·역할 단위**로 만든다 — 급여담당·근태담당·평가관리자"
    - "**그룹 결합은 합집합이다.** 여러 그룹에 속한 사용자의 접근 범위는 각 그룹이 여는 범위를 합친 것이다. **그룹을 추가로 부여한 것이 기존 접근을 좁혀서는 안 된다**"
    - "**기본값은 닫힘이다.** 그룹이 없는 신규 사용자, 허용 그룹 매핑이 없는 신규 테이블·컬럼·API 는 아무것도 열리지 않는다. **스키마 불일치 감지로 발견된 신규 컬럼도 매핑 전까지 차단된다** — 통보 없이 추가된 컬럼이 기본 공개되면 사고다. **운영상 번거롭지만 반대 방향의 실수는 사고다**"

# ── 매핑 구조 ──────────────────────────────────────────────────────
mappings:
  - id: AUTHZ-010
    object: 데이터소스
    mapping: "적용 가능 그룹 목록"
    meaning: "**어휘 제약** — 이 데이터소스의 테이블·컬럼에는 이 목록에 있는 그룹만 매핑할 수 있다. 런타임 판정은 말단(테이블·컬럼) 매핑만 보면 된다"
  - id: AUTHZ-011
    object: 테이블
    mapping: "접근 허용 그룹 목록"
    meaning: "매핑된 그룹의 사용자만 이 테이블을 볼 수 있다. **컨텍스트 필터링의 기준**이다"
  - id: AUTHZ-012
    object: 컬럼
    mapping: "접근 허용 그룹 + **모드(허용/마스킹)**"
    meaning: "기본은 테이블 매핑을 상속한다. **예외 컬럼만 별도 매핑**하며 **테이블 그룹의 부분집합만 가능하다** — 컬럼이 테이블보다 넓게 열리면 테이블 게이트가 무의미해진다"
  - id: AUTHZ-013
    object: "대상 시스템"
    mapping: "적용 가능 그룹 목록"
    meaning: "**어휘 제약** — 데이터소스와 테이블의 관계와 같은 구조다"
  - id: AUTHZ-014
    object: "실행 API"
    mapping: "호출 허용 그룹 목록 + 위험 등급 + 승인 강제 설정"
    meaning: "**사용자에게 API 를 개별 매핑하지 않는다** — 대상 시스템·API 가 늘어날 때 개인별 매핑을 유지하는 것은 현실적으로 불가능하다"
  - id: AUTHZ-015
    object: "API 응답 경로"
    mapping: "그룹별 모드(허용/마스킹)"
    meaning: "카탈로그의 컬럼 단위 매핑에 대응한다. **마스킹 변환 규칙은 컬럼 마스킹 규칙을 그대로 쓴다** — 원천을 하나로 둔다"

mapping_rules:
  - "한 컬럼에 대해 사용자의 어떤 그룹은 허용, 어떤 그룹은 마스킹이면 **허용이 이긴다**(합집합 원칙의 귀결)"
  - "**상위 목록에서 그룹을 제거하려면 하위 매핑이 남아 있는 동안 차단한다** — 어휘 제약이 사후에 깨지는 것을 막기 위함이다. 사용 중인 그룹의 삭제도 같은 규칙을 따른다"
  - "마스킹 값 변환 규칙(어떻게 가릴지)은 컬럼 단위로 정의한다"
  - "**변환 규칙의 원천을 하나로 둔다** — 같은 주민등록번호가 SQL 경로와 API 경로에서 다르게 가려지면 마스킹 자체가 신뢰를 잃는다"

# ── 행 스코프 ──────────────────────────────────────────────────────
row_scope:
  id: AUTHZ-020
  implementation: "행 스코프 조건은 **대상 데이터소스 안에 있는 사용자 권한 정보 테이블과의 조인 또는 서브쿼리로 구현**한다"
  why: "스코프 값을 AI 전용 DB 에 이중 관리하지 않고 **레거시가 이미 보유한 권한 데이터를 그대로 사용**한다(PRN-09)"
  rules:
    - "스코프 규칙은 **테이블당 0..1개**로 제한한다. admin 이 관리하는 것은 사용자별 스코프 값이 아니라 **주입 규칙**이다 — 어느 권한 정보 테이블·컬럼과 조인하는지"
    - "바인딩 값은 **그 데이터소스에 신원 매핑된 사용자 식별자**다. **매핑이 없으면 조회를 사유와 함께 거부**하고, 매핑은 있으나 권한 정보 테이블에 해당 사용자의 행이 없으면 결과가 0건이 되며 **이것이 정상 동작이다**"
  not_supported:
    claim: "**그룹 × 스코프 조합을 시스템 기능으로 풀지 않는다**"
    example: "팀원은 본인만 · 팀장은 부하 전원 · 관리자는 전 직원"
    why: "스코프 조건들의 OR 결합은 주입 로직과 검증을 급격히 복잡하게 만든다"
    instead: "**운영 가이드의 수단**으로 대응한다(아래 operational_means)"

# ── SQL 통제 4단계 ────────────────────────────────────────────────
sql_control:
  id: AUTHZ-030
  claim: "통제는 한 지점이 아니라 **네 단계**로 나뉘며 단계마다 막는 것이 다르다. **LLM 이 만든 SQL 을 신뢰하지 않는다**"
  stages:
    - stage: 1
      name: "컨텍스트 필터링"
      how: "스키마 카탈로그를 **사용자의 소속 그룹**으로 필터링해 LLM 에 전달한다. 허용 그룹에 속하지 않는 테이블·컬럼은 **LLM 에 노출되지 않는다**"
      blocks: "권한 없는 객체가 조회 대상으로 선택되는 것"
      note: "**가장 강력한 방어선이다.** 애초에 보여주지 않으므로 조회 대상이 될 수 없다"
    - stage: 2
      name: "구문 검증"
      how: "파서로 SQL 을 해석해 검증한다"
      blocks: "아래 bypass_paths"
    - stage: 3
      name: "조건 주입"
      how: "파서로 **행 스코프 조건**과 **기본 필터**를 강제 추가한다"
      blocks: "권한 밖 행의 조회 · 폐기·무효 데이터의 혼입"
    - stage: 4
      name: "결과 마스킹"
      how: "조회 결과에 마스킹 모드 컬럼의 변환을 적용한다"
      blocks: "마스킹 대상 값의 노출"
  parser_rule: "2~4단계는 모두 파서를 필요로 하며 **도구 호출이 선언한 데이터소스에 지정된 파서**를 사용한다. **파서 선택의 단위는 항상 데이터소스다**"

  bypass_paths:
    claim: "1단계는 **LLM 에게 보여주는 정보**에만 적용되고 실제 DB 에는 모든 객체가 그대로 있으므로 다음 경로가 남는다"
    paths:
      - path: "전체 컬럼 지정(별표)"
        risk: "카탈로그에 없던 컬럼까지 결과에 포함된다"
        block: "**별표를 금지하고 컬럼 명시를 강제한다**"
      - path: "카탈로그에 없는 객체 참조"
        risk: "LLM 이 흔한 테이블명을 추측해 서브쿼리에서 참조할 수 있다. 데이터소스 접속 계정은 사용자별로 나�‍지 않으므로 DB 권한으로는 막히지 않는다"
        block: "**SQL 이 참조하는 모든 객체를 추출해 허용 목록과 대조한다. 대조는 테이블만이 아니라 컬럼 단위까지 수행한다**(별표 금지로 모든 컬럼이 명시되므로 가능하다). 사용자에게 차단된 컬럼은 **존재하지 않는 컬럼과 같은 대조 실패**로 처리하고, 마스킹 모드 컬럼은 대조를 통과하며 4단계가 처리한다"
      - path: "뷰"
        risk: "뷰는 내부적으로 권한 없는 테이블을 참조할 수 있다"
        block: "뷰를 카탈로그에 등록할 때 **기반 테이블의 민감도를 뷰의 그룹 매핑에 반영한다**"
      - path: "함수·프로시저"
        risk: "데이터를 반환하거나 파일·시스템에 접근하는 함수가 있다"
        block: "**허용 함수 목록으로 제한한다**"
      - path: "다중 문장"
        risk: "하나의 요청에 여러 문장"
        block: "**하나의 조회 문장으로 제한한다**"
      - path: "크로스 데이터소스 조인"
        risk: "서로 다른 데이터소스의 테이블을 한 SQL 에 섞으면 어느 커넥션으로도 실행할 수 없다"
        block: "선언된 데이터소스의 카탈로그 대조 검증에서 **자동 차단된다**"
      - path: "컬럼 별칭"
        risk: "민감 컬럼에 무해한 별칭을 붙이면 결과 컬럼명으로는 마스킹 대상을 식별할 수 없다"
        block: "4단계 마스킹은 결과 컬럼명이 아니라 **파서가 추적한 원본 컬럼**을 기준으로 적용한다"

  turn_id_comment: "실행하는 SQL 에는 **턴 ID 를 SQL 주석으로 주입한다**(예: `/* turn:12345 */`). LLM 이 생성한 SQL 은 쿼리 모양이 출처를 말해주지 않으므로, DBA 가 세션 모니터·슬로우 쿼리 로그에서 문제 쿼리를 발견했을 때 턴 ID 로 감사 이력을 역조회해 출처를 특정할 수 있게 한다. **사용자 ID 가 아닌 턴 ID 를 쓰므로 DB 로그에 개인 식별자를 남기지 않는다**"

  rewrite_loop:
    parse_failure: "파서가 SQL 을 해석하지 못하면 조회도 불가능하므로(파싱 실패 = 검증 불가 = 실행 불가) **파싱 오류는 LLM 에 되돌려 다른 구문으로 재작성하게 한다.** 재시도 횟수는 턴 단위 상한으로 제한한다"
    mismatch: "**대조 실패도 같은 재작성 루프로 처리한다.** 이때 LLM 에 돌려주는 피드백은 **차단과 부재를 구분하지 않는 중립 문구로 고정한다** — '다음 객체가 카탈로그에 없음. 카탈로그에 제시된 객체만 사용해 재작성하라'"
    why_neutral: "**사유별로 문구가 다르면 존재 은닉(REQ-101)이 피드백 경로에서 깨지고 LLM 이 그 사유를 최종 응답에 옮긴다.** 실패한 객체명을 피드백에 적는 것은 안전하다 — LLM 이 방금 스스로 쓴 이름이라 새 정보가 아니다"
    internal: "agent 는 **내부적으로 차단과 부재를 구분해** 실제 사유를 정책 판정 이력에 남기고, 권한 부족 건은 품질 지표에 집계한다. 재작성으로 일부 항목이 제외된 채 완료된 턴의 응답에는 해당 항목에 대한 **정보 부재 안내를 붙인다**"

# ── 지식·인증 예제 쿼리의 주입 통제 ───────────────────────────────
injection_control:
  id: AUTHZ-040
  why: "지식과 인증 예제 쿼리는 **그 자체가 스키마 정보일 수 있다.** 카탈로그를 1단계에서 필터링해도 이 자산들이 미허용 객체를 언급한 채 주입되면 **존재 은닉이 컨텍스트 안에서 깨진다**"
  rules:
    - "두 자산은 **참조 테이블을 정형으로 갖는다** — 인증 예제 쿼리는 등록 검수 시 파서가 추출해 저장하고, 지식은 등록자가 링크한다(0..N). **참조 매핑은 테이블 단위다** — 컬럼 단위 매핑은 관리 부담이 통제 실익을 넘으므로 두지 않는다"
    - "**주입 판정** — 사용자의 소속 그룹이 참조 테이블 **전부**의 허용 그룹 판정을 통과해야 주입한다. **하나라도 차단이면 컨텍스트에 넣지 않는다.** 인증 예제 쿼리는 노출 허용 그룹 판정에 이 판정을 더한다. **참조 테이블이 없는 지식(순수 용어·규칙)은 판정 없이 주입한다**"
    - "테이블 단위 판정이므로 주입된 예제 쿼리가 **사용자에게 차단된 컬럼**을 참조할 수 있다. 이 경우 2단계의 컬럼 단위 대조가 잡아 중립 피드백 재작성 루프로 처리한다. **그 컬럼의 존재가 예제를 통해 드러나는 것은 감수한다** — 값 접근은 대조와 마스킹이 막고, 존재까지 숨겨야 하는 컬럼은 그 컬럼을 참조하는 예제 쿼리의 노출 그룹을 좁히거나 뷰 분리로 대응한다"

# ── 기본 필터 ──────────────────────────────────────────────────────
default_filter:
  id: AUTHZ-050
  why: "레거시 테이블에는 논리 삭제 플래그나 유효 상태 컬럼이 있고, 이를 빠뜨리면 **폐기된 데이터까지 집계된다.** 권한 위반은 아니지만 **사용자가 틀린 숫자를 받아 업무 판단을 하게 되므로** 통제 대상으로 다룬다"
  rules:
    - "테이블당 **0..1개**의 기본 필터를 등록한다. 행 스코프 규칙과 같은 구조이며 주입도 같은 3단계에서 파서로 수행한다"
    - "**기본은 강제 주입이다.** LLM 의 판단에 맡기지 않는다 — 빠뜨리는 순간 **조용히 틀린 결과**가 나오고 사용자는 틀렸다는 사실을 알 수 없다"
    - "**해제는 명시적 지시가 있을 때만 가능하다.** 사용자가 '취소된 것도 포함해서' 처럼 명시적으로 요구하면 LLM 이 해제를 요청할 수 있다. 이때 **해제 사실을 조회 계획에 표시하고 감사 이력에 남긴다.** 해제 요청이 없으면 무조건 주입된다"
    - "**해제 가능 여부 자체를 테이블별 설정으로 둔다.** 해제를 허용하지 않는 테이블에서는 사용자가 요구해도 주입을 유지하고 그 사유를 응답에 밝힌다"
  not_authz: "**기본 필터는 권한 통제가 아니다.** 그룹 판정·행 스코프를 대체하거나 보완하지 않으며 정확도를 위한 장치다. **두 규칙을 한 항목으로 합치지 않는다** — 하나는 볼 수 있는 범위이고 하나는 세어야 할 범위다"

# ── 시스템 통제의 경계와 운영 수단 ────────────────────────────────
operational_means:
  id: AUTHZ-060
  claim: "시스템 기능은 그룹 판정·스코프 주입까지만 책임진다. 그것으로 표현할 수 없는 케이스는 **기능을 늘려서가 아니라 운영 수단으로** 대응하며, 이를 **보안 운영 가이드**로 문서화해 고객사에 제공한다"
  means:
    - mean: "뷰 분리"
      when: "같은 테이블을 그룹별로 다른 행 범위·컬럼 구성으로 열어야 할 때"
      how: "그룹별 뷰를 만들어 각각 카탈로그에 등록하고 해당 그룹만 매핑한다"
      note: "**뷰 생성은 우리가 요구하는 것이 아니라 고객사 DBA 가 선택하는 운영 수단이다** — PRN-09 와 구분한다. 별도 스키마에 생성하고 읽기 전용 계정에 SELECT 를 부여하는 방식을 가이드한다"
    - mean: "카탈로그 제외 + 조회 API"
      when: "행 통제 논리가 SQL 조건으로 표현하기 어려울 만큼 복잡할 때"
      how: "테이블을 카탈로그에서 빼고 레거시의 조회 API 만 열어, 행 통제를 레거시의 기존 권한 로직에 위임한다"
      hard_rule: "**응답 경로의 개인정보 통제를 함께 등록해야 이 수단을 쓸 수 있다** — 그렇지 않으면 SQL 로 막은 컬럼이 API 로 평문 노출된다"
      roadmap: RM-P2
    - mean: "커스텀 도구"
      when: "여러 데이터소스·시스템에 걸친 가공이 필요해 SQL 한 문장으로 안 될 때"
      roadmap: RM-P2

# ── 책임의 층 — 레거시와 Hub ──────────────────────────────────────
responsibility_layers:
  id: AUTHZ-070
  claim: "조회 API 응답의 접근 통제를 레거시에 위임했으나 **층이 다르다**"
  layers:
    - question: "이 사용자에게 **어떤 행·컬럼을 돌려줄 것인가**"
      owner: "레거시 — 전달받은 신원 파라미터로 자체 권한 검사"
    - question: "받은 응답을 **어떤 형태로 화면에 내보내고, 무엇을 남기고, 무엇을 외부로 보낼 것인가**"
      owner: "**Hub**"
  claim2: "**레거시가 평문을 돌려준다는 사실이 Hub 가 그것을 평문으로 저장·전송해도 된다는 뜻은 아니다**"
  why_asymmetry_matters: "운영 가이드가 '행 통제가 복잡한 테이블은 카탈로그에서 빼고 조회 API 를 연다' 를 권하므로, **이 우회는 권장 경로를 따르면 생긴다.** 따라서 응답도 통제 대상으로 다룬다"
  also_legacy:
    - "**파라미터 검증·밸리데이션** — 공개된 API 는 호출자를 불문하고 스스로 방어해야 한다"
    - "**턴 사이의 중복 방지** — 대상 API 의 멱등성 또는 자체 중복 검사에 의존한다"
    - "**잘못 실행된 액션의 복구** — 대상 시스템의 업무 프로세스와 매뉴얼을 따르며, 복구·원복 절차는 연동 협의 시점에 함께 수립한다"
  hub_provides: "Hub 가 제공하는 것은 **무엇이 실행되었는지의 전량 실행 이력**이다"

# ── 유량 통제의 소유 ──────────────────────────────────────────────
rate_limit_ownership:
  id: AUTHZ-080
  claim: "**유량 통제는 받는 쪽(대상 시스템)의 책임이다**"
  why: "서버 capacity 는 대상 시스템이 알고, Hub 사용은 그 시스템을 직접 쓰던 사용자의 이용이 **창구만 옮겨온 것**이다"
  hub_behavior: "Hub 는 대상 시스템의 제한 응답(429 등)을 존중해 백오프·재시도하며 **자체 rate limit 을 약속하지 않는다**"
