# 보조 판정 대체 정책의 설계 테스트 — 모두 미구현·미실행이다. 실제 코드 시험/공급 경로 시험은 소유 G3 승인 뒤 수행한다.
testcases:
  - { id: TC-0151, feature: FEAT-015, usecase: UC-017, type: normal, title: "다섯 항목 목록의 보조 용도별 후보 순서와 설정 이력", actor: ACT-004, given: "역할을 지원하는 유효 공급 경로·모델·effort 조합", when: "공급사·모델·effort·용도·우선순위 한 목록에서 보조 용도의 1개·2개·3개 후보를 저장하고 조회", then: "REQ-602의 순서/조합·설정 버전·변경 근거가 일치하며 주 추론·운영·임베딩 설정을 바꾸지 않는다", status: planned }
  - { id: TC-0152, feature: FEAT-015, usecase: UC-017, type: validation, title: "잘못된 대체 후보 저장 차단", actor: ACT-004, given: "1순위 없음·4개·순번 중복/누락·동일 조합 중복·미지원 effort/기능·비활성/미확인 연결의 표", when: "후보 목록 저장", then: "모든 행 저장 거부·이전 유효 설정 유지. 같은 경로의 서로 다른 유효 모델은 저장 가능하나 장애 분산 한계를 안내한다", status: planned }
  - { id: TC-0153, feature: FEAT-015, usecase: UC-017, type: concurrency, title: "후보 변경과 실행 중 스냅샷 분리", actor: ACT-004, given: "보조 작업이 후보 설정 v1을 확보한 뒤 관리자가 순서/경로를 v2로 변경", when: "기존 작업 대체 및 별도 보조 작업 시작", then: "기존 작업은 v1 순서와 사용 순번/마감을 유지하고 현재 검사만 재수행한다. 별도 작업은 v2의 1순위부터 시작하며 새 경로는 기존 동의에 자동 편입되지 않는다. 동시 저장의 낡은 기대 버전은 반영하지 않는다", status: planned }
  - { id: TC-0154, feature: FEAT-015, usecase: UC-017, type: permission, title: "모든 사용자의 공통 텍스트 모델 선택지", actor: ACT-004, given: "서로 다른 그룹·쿼터 등급 사용자와 주 추론·보조·운영·임베딩 등록 조합", when: "등록 변경 뒤 각 사용자 선택지를 조회하고 용도가 겹치는 동일 조합 확인", then: "유효 텍스트 조합 전체를 동일하게 제공하고 같은 공급사·모델·effort는 하나로 표시한다. 임베딩은 제외하며 각 사용자 토큰 한도는 유지한다. 사용자 선택으로 보조·운영 지정은 바뀌지 않는다", status: planned }
  - { id: TC-0155, feature: FEAT-015, usecase: UC-017, type: validation, title: "기본 지정과 필수 용도 마지막 조합 보호", actor: ACT-004, given: "기본 주 추론과 필수 보조·시스템 운영·임베딩 지정이 유효", when: "대체 지정 없이 기본/마지막 필수 조합 제거 또는 임베딩을 주 추론 기본으로 지정", then: "전체 저장을 거부하고 적용본을 유지한다. 정상 최초 미선택의 기본값은 보존하되 사용 불가 후 복구에서 자동 선택·전송하지 않는다", status: planned }
  - { id: TC-1011, feature: FEAT-101, type: business_exception, title: "주 추론 일시 장애와 비활성 선택 복구 구분", actor: ACT-001, given: "선택 모델 A는 현재 허용되지만 일시 공급 장애", when: "오류 안내 후 B 선택·명시적 전송", then: "장애만으로 A 비활성/선택 해제·B 자동 선택·자동 전송 없음. B 선택만으로 호출하지 않고 명시적 전송 때 새 턴/시도와 현재 동의/권한 검사를 적용한다. 별도의 A 비활성 사례는 기존 목록 복구 경로로 처리한다", status: planned }
  - { id: TC-1012, feature: FEAT-101, type: permission, title: "보조 후보 경로 동의와 사용자 안내", actor: ACT-001, given: "자료/목적과 후보 P·Q 사전 안내·동의, 새 후보 R 또는 동의 거부/만료", when: "보조 대체 호출 전 범위 검사", then: "유효 동의 내 Q만 자동 전송 가능. R은 미전송 상태로 확인에 인계하며 거부/만료 뒤 호출하거나 다른 후보로 건너뛰지 않는다. 동의 후에도 만료한 작업을 재개하지 않는다. 사용자에게 주 추론 재선택으로 보조 설정을 고치라고 안내하지 않는다", status: planned }
  - { id: TC-2091, feature: FEAT-209, type: normal, title: "수용량 오류 뒤 두 번째 후보 성공", actor: ACT-001, given: "모든 사전 조건 유효·1순위의 명확한 일시 수용량 거부 종료·2순위 성공", when: "보조 요약 호출", then: "REQ-602에 따라 1·2순위 각 1회만 전송하고 3순위 호출 0회. 두 호출의 연결/오류/사용량을 기록하고 유효한 두 번째 결과 하나만 채택한다. 주 추론 선택은 유지한다", status: planned }
  - { id: TC-2092, feature: FEAT-209, type: business_exception, title: "세 번째 후보와 후보 소진 경계", actor: ACT-001, given: "1·2순위 일시 장애와 3순위 성공/실패 표, 또는 선택 후보 미설정", when: "보조 작업 처리", then: "최대 3개 등록 후보에 각 1회만 전송. 3순위 성공이면 계속, 전체 소진이면 역할별 실패/확인 경로. 미설정 후보 호출·동일 후보 재전송·주 추론 자동 대체·새 턴 자동 생성 0회", status: planned }
  - { id: TC-2093, feature: FEAT-209, type: validation, title: "대체 불가 오류를 다른 모델로 우회하지 않음", actor: ACT-001, given: "인증·권한·정책 거부·계정 결제/쿼터·미지원·입력 초과·설정/비밀 오류·빈/잘린/잘못된 응답·원인 불명 제한의 표", when: "각 오류를 1순위에 주입", then: "모든 행 다음 후보 전송 0회, 해당 오류와 가능한 후속 행동 기록. HTTP 상태나 at capacity 문자열만 같은 사례도 근거 없이는 전환하지 않는다", status: planned }
  - { id: TC-2094, feature: FEAT-209, type: permission, title: "후보마다 입력·현재 보안·동의 재검사", actor: ACT-001, given: "1순위의 허용 장애 뒤 다음 후보의 입력 한도 부족·권한 회수·동의 만료·연결 해석 실패 표", when: "다음 후보 시작", then: "불충족 후보와 그 뒤 후보의 전송 0회. 필수 입력/조건을 버리거나 동의 없는 경로로 우회하지 않는다. 동의 추가 가능 사례만 기존 확인 경로로 인계한다", status: planned }
  - { id: TC-2095, feature: FEAT-209, type: concurrency, title: "공유 마감·중단·예산 차단", actor: ACT-001, given: "후보 전환 직전 전체 사슬 마감/스텝·분류 예산 소진 또는 중단/점유 상실", when: "다음 후보 요청 및 재접속/인계", then: "후속 전송 0회, 후보 이동·동의 대기·재접속이 마감/예산을 초기화하지 않는다. 남은 시간만 호출에 적용하며 사용자 중단과 예산/장애 실패를 구별한다", status: planned }
  - { id: TC-2096, feature: FEAT-209, type: concurrency, title: "결과 불명·부분 응답·늦은 응답과 중복 제어", actor: ACT-001, given: "접수/종료 불명·부분 응답 뒤 단절·타임아웃·취소 미확인, 또는 종료 후 늦은/중복 이벤트", when: "복구·대체 판정과 동일 작업 인계", then: "불명 상태에서 대체 전송 0회. 종료된 원 호출의 늦은 이벤트는 채택 결과/현재 업무 상태를 덮지 않고 사실·계량만 원 호출에 연결한다. 인계/중복 오류 이벤트가 같은 후보를 두 번 보내지 않는다", status: planned }
  - { id: TC-2097, feature: FEAT-209, type: business_exception, title: "보조 역할 범위와 업무 재실행 금지", actor: ACT-001, given: "완료 조회/업무 실행 뒤 요약·카탈로그 선별·입력 분류의 일시 장애 및 주 추론/운영/임베딩 비교군", when: "오류 처리", then: "보조 판정에만 후보 정책 적용. 요약 저장/버전 충돌을 대체 호출로 해결하지 않고 완료 조회/실행 재전송 0회. 분류의 최종 실패는 REQ-032로 인계한다. 주 추론/운영은 자동 대체 0회, 임베딩은 기존 NFR-021 경로 유지", status: planned }
  - { id: TC-2101, feature: FEAT-210, type: business_exception, title: "후보 이력·실제 스텝·지연 계량 대조", actor: ACT-001, given: "미전송 실패·시작 관측 없는 거부·실제 응답 실행·지연/중복 사용량 이벤트", when: "후보 처리 이력 기록", then: "논리 작업/설정 버전/순번/오류/채택 결과가 연결되고 미관측 실행의 가상 스텝은 없다. 실제 실행은 각각 보존하며 지연 계량은 원 호출에 한 번만 반영한다. 알 수 없는 비용을 0으로 확정하지 않는다", status: planned }
  - { id: TC-2111, feature: FEAT-211, type: business_exception, title: "대체 호출 사용량·쿼터·분류 예산 합산", actor: ACT-001, given: "사용자 요청의 보조 후보 호출과 실패분 사용량·쿼터 재검사 활성/비활성 표", when: "대체 후보 전송 전 검사와 계량 반영", then: "실제 발생 비용은 원 사용자에게 합산하고 재검사 설정을 준수한다. 전환으로 스텝/분류 예산 초기화·중복 차감 없음. 관리자 운영 호출과 혼합하지 않는다", status: planned }
  - { id: TC-3041, feature: FEAT-304, type: validation, title: "공급사 오류 분류와 어댑터 자율 전환 금지", actor: ACT-001, given: "검증된 일시 수용량/서비스 거부와 동일 상태 코드의 계정 쿼터/불명 오류 표", when: "공급사별 응답을 공통 오류 계약으로 변환", then: "원인/접수/종료 근거를 구분하며 미검증 오류는 자동 대체 가능으로 분류하지 않는다. 어댑터 자율 모델 전환·SDK/HTTP/CLI 숨은 재전송 0회. 개발 CLI와 운영 API를 각각 검증한다", status: planned }
  - { id: TC-3042, feature: FEAT-304, type: business_exception, title: "필수 기록 실패에서 대체 호출 차단", actor: ACT-001, given: "원 오류 또는 후속 전송 전 필수 이력 저장의 실패/결과 불명", when: "다음 후보 호출 시도", then: "후속 전송 0회, 기존 기록 복구/대조 경로를 따르고 대체 성공으로 기록 실패를 덮지 않는다", status: planned }
