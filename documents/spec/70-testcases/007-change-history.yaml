    given: "현재 적용본과 요청 초안·제출·반려·동시 반영/참조 보호 사례"
    when: "REQ-601.approval_storage의 전이와 실제 저장/조회 결과를 대조"
    then: "승인 사용/미사용 각각에서 관리 목록은 적용본만 표시하고 승인 요청/저장을 구분한다. 요청 접수·반려 후 운영값 유지, 신규 미적용 목록 제외, 요청 메뉴에서 당시 전체 SNP/반려 사유를 조회한다."
    status: "planned"
    verification: "제품 구현 시 단위/통합 시험. 명세 검사는 제품 트랜잭션 실행 시험을 대신하지 않는다."
