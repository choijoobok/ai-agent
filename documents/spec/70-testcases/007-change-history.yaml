    then: "한 탭만 변경해도 전체 소유 관리 행을 같은 HISTORY_NO로 복사한다. HIST_DTM은 마스터에만 있고 자식은 부모 시각을 참조하며 원 REG/MOD를 유지한다."
    verification: "단위/DB 통합/계약/E2E; 제목의 규칙을 반대로 허용했을 때 실패해야 한다. 미구현 제품 시험 명세다."
