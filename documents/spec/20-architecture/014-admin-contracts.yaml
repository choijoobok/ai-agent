# admin P2 계약 구체화. 확정 요구의 구조이며 G2 승인·구현 완료를 뜻하지 않는다.
module_boundaries:
  - id: ARCH-028
    rule: "admin은 자산의 내용 버전·현재 효력·연결 참조를 제공하고 agent는 이를 실제 실행 직전에 검증해 사용한다. 내용 버전을 고정하는 것과 현재 권한을 고정하는 것은 다르다"
    reqs: [REQ-105, REQ-108, REQ-301, REQ-303, REQ-305, REQ-306, REQ-403, REQ-601, REQ-604, REQ-608, REQ-612]
    ownership: "ARCH-011·ADR-013의 공개 계약을 사용한다. admin 내부 저장소를 agent·portal에 공개하지 않으며, UI가 보낸 자산/연결 식별자를 그대로 실행 권한으로 사용하지 않는다"
    asset_versions:
      stable_id: "지식·예제·카탈로그·API·도구는 변경되지 않는 자산 식별자와 내용 리비전을 구분한다. API 연결은 안정된 API 식별자를 참조하고 표시명·주소 복사로 관계를 대신하지 않는다"
      selection: "REQ-108에 따라 턴에서 처음 필요해진 자산의 유효 내용 리비전을 선택하고 실행 근거에 기록하며 같은 턴에서 유지한다. 단순 내용 갱신이나 다음 스텝/액션 진입만으로 사용 중 버전을 바꾸지 않는다. 다만 장기 대기 후 기준 시간을 넘긴 이어가기의 내용 재선택은 REQ-102·108을 따르며, 바뀐 실행 내용·대상에 과거 승인을 재사용하지 않는다. 중단 후 새 실행 시도는 REQ-013에 따라 현재 내용을 새로 선택한다"
      current_checks: "선택한 내용의 참조 정합성과 현재 공개 상태·사용자 권한·신원 매핑·마스킹/전송 정책을 필요한 접근 시점마다 판정한다. 버전이 보관되어 있다는 사실은 폐지·회수된 권한을 계속 사용할 근거가 아니다"
      candidates: "초안·제출 후보와 현재 유효본을 분리한다. REQ-601의 제출 스냅샷, 단일 미종결 요청, 취소 후 재요청과 REQ-305·306의 세트 반영을 따른다. 승인/전결 반영 시 후보와 참조 버전의 최신성을 검사하고 세트 일부만 공개하지 않는다"
      api_change: "API 계약 변경 시 연결 지식·예제·도구의 참조와 업무 절차 영향을 확인한다. 지식 매핑 승인과 API 공동 오픈 검수는 별도 근거이며 어느 한쪽으로 다른 절차를 대신하지 않는다"
      history: "요청·판정·반영·실행은 사용한 자산/참조 리비전으로 연결한다. 이력 재현은 과거 판단 근거 조회이며 과거 권한·자격증명을 이용한 재실행이 아니다. 보존 범위는 REQ-107·109를 따른다"
    api_connection_resolution:
      inputs: "API 식별자/계약 리비전, 제공 시스템 식별자, 시스템 기본 연결 사용 또는 특정 연결 선택, 현재 시스템 허용 연결과 기본값, 현재 프로세스에 로드된 연결 정의를 사용한다"
      order:
        - "API가 기본 연결 사용이면 현재 제공 시스템의 기본 연결을 해석한다. 특정 연결 선택이면 그 연결을 그대로 선택한다"
        - "선택한 연결이 그 시스템의 현재 허용 목록에 있고 실행 노드에 정상 로드되어 있는지 확인한다. 누락·비활성·불일치이면 다른 기본값으로 대체하지 않는다"
        - "선택한 불변 연결 정의와 API의 상대 경로·인증/신원 전달 계약으로 실제 목적지·환경/테넌트·인증 방식·실행 주체를 해석한다. 사용자 입력과 모델이 접속 주소·인증/고정 헤더를 덮지 못한다"
        - "REQ-105.approval_target_binding의 승인 근거와 현재 해석 결과를 대조하고 전송에 사용할 동일한 연결 객체를 확보한다. 검사 뒤 같은 이름으로 연결을 다시 조회해 다른 정의를 사용하지 않는다"
      approval_record: "API/계약 리비전·제공 시스템·선택 방식·해석된 연결 식별자·불변 적용 설정 식별자·신원 매핑 버전과 비밀 없는 실행 대상 근거를 서버에 연결한다. 사용자 카드에는 허용된 업무 대상과 변경 의미만 표시한다. 비밀값과 비밀값 해시를 카드·일반 감사에 남기지 않는다"
      change: "기본 연결 재지정·배포 설정 교체·신원 변경의 처리와 재승인은 REQ-105가 정본이다. 새 실행 승인에서 연결을 다시 해석하며 이미 전송한 호출의 원 대상·결과를 수정하거나 변경된 연결로 재전송하지 않는다"
      credential_rotation: "동일성 예외에는 변경 전후의 적용 설정 식별자와 목적지·테넌트·인증 방식·실행 주체/권한 범위가 같다는 검수 근거가 필요하다. 비밀 교체를 수행한 운영 주체의 검증 근거를 서버가 확인할 수 없으면 기존 승인을 유지하지 않는다. 이름이나 비밀 해시만으로 동일성을 증명하지 않는다"
    deployment_contract:
      active_definition: "배포 연결의 현재 로드 정의와 배포 파일의 다음 기동 예정값을 구분한다. admin에는 참조 가능한 식별자와 비밀을 제거한 적용 정보만 제공하고 연결 비밀의 별도 DB 사본을 만들지 않는다"
      generation: "연결의 불변 적용 설정 식별자는 재기동/노드가 달라도 같은 배포 정의를 구분할 수 있어야 한다. 실행 노드가 승인 근거와 현재 효력을 확인하지 못하면 호출하지 않는다. 서로 다른 설정을 같은 식별자로 선언하지 않도록 배포 검증이 필요하다"
      datasource: "DB 연결은 ARCH-030의 기동 시 로드·재기동 반영을 따른다. 참조 변경 뒤에는 실제 로드 정의를 다시 확인한다"
      pending: "@defer P2 integration — API/모델 연결의 재적재 시점, 적용 설정 식별자의 발급/노드 간 최신 효력 확인, 자격증명 동일성 검수 근거 전달과 호출 직전 변경 경합을 확정한다. 미구현 설정 계약을 현재 소스의 보장으로 표현하지 않는다"
    verification:
      - "기본 연결 변경, 동일 연결명 내용 교체, 신원 매핑 회수, 노드별 적용 버전 불일치에서 과거 승인으로 다른 대상에 전송하지 않는다"
      - "검증 직후 연결 정의를 교체해도 실제 전송은 검사한 정의만 사용하거나 거부된다. 전송 직전 현재 권한·효력 검사를 별도로 통과해야 한다"
      - "지식 제출 후 연결 API 변경, 세트의 한 참조 폐지, 동시 승인/전결에서 오래된 후보의 부분 반영과 잘못된 참조를 거부한다"
      - "사용 중 내용 버전은 유지하되 권한 회수는 다음 접근에 적용된다. 과거 실행을 조회해도 현재 비밀이나 권한 밖 내용을 노출하지 않는다"

  - id: ARCH-029
    rule: "REQ-614의 운영 설정은 system의 기존 설정 원천을 재사용한다. admin용 설정 저장소를 복제하지 않고, 소비 목적별 공개 계약으로 필요한 유효값만 제공한다"
    reqs: [REQ-506, REQ-601, REQ-614]
    system_current:
      evidence: "sources/backend/domain/src/main/java/com/aiagent/domain/config/admin/ConfigService.java, sources/backend/support/src/main/java/com/aiagent/support/config/ConfigCatalog.java 및 ConfigLookup.java를 대조했다"
      available: "코드로 정의한 설정 키/자료형과 YAML 기본값, SYS_CONFIG 재정의, 여러 값의 한 트랜잭션 저장, 작업 단위 값 스냅샷을 사용한다"
      gap: "현재 조회에는 값과 결합된 불변 설정 버전이 없고 설정 저장의 기대 버전 검사도 없다. SYS_CACHE_VERSION은 캐시 갱신용이며 그것만으로 승인 처리와 값 버전의 원자성 또는 동시 저장 충돌 방지를 보장하지 않는다"
    target_contract:
      surface: "system이 지원 키·자료형·단위·기본값·허용 범위·출처·편집 가능 여부·적용 시점을 정의하고 소비 모듈에는 필요한 키의 유효값과 검증 가능한 스냅샷 식별자를 함께 제공한다. admin·agent는 system 내부 Entity/Repository를 직접 읽지 않는다"
      authority: "설정 조회/변경은 현재 유효 메뉴·액션 권한으로 판정한다. 기존 system 설정 화면을 재사용하며 REQ-614를 이유로 권한을 넓히거나 임의 키를 추가하는 화면을 만들지 않는다"
      source: "관리자가 바꿀 수 있는 운영값은 SYS_CONFIG와 제품 기본값, 비밀·연결·원문 보존처럼 배포 전용인 값은 해당 YAML 원천을 유지한다. 읽기 전용 표시를 편집 가능한 DB 재정의로 바꾸지 않는다"
      timing: "설정별 적용 시점은 해당 요구사항을 따른다. 턴 고정값·스텝 검사값·요청 접수 시 결정값·재기동 반영값을 하나의 즉시 반영 규칙으로 합치지 않는다. 비동기 작업은 HTTP 요청의 스냅샷을 무기한 재사용하지 않는다"
      approval_transaction: "REQ-601의 저장/신규 요청 접수는 사용한 업무별 설정 값과 버전을 기록하고 해당 모드로 후보/요청을 반영하는 동작까지 일관돼야 한다. system의 설정 변경과 admin 반영이 경합하면 일관된 한쪽 순서로 처리하거나 충돌을 반환한다. 검증 후 별도 커밋으로 설정이 바뀔 수 있는 단순 두 번 읽기는 이 보장을 대신하지 않는다"
      existing_requests: "이미 접수한 대기 요청의 모드는 접수 근거를 유지한다. 현재 설정이 false로 바뀌어도 기존 요청을 자동 승인하지 않는다. 혼합 세트·설정 읽기 실패의 업무 규칙은 REQ-601을 따른다"
      failure: "설정을 읽지 못했다고 승인 미사용으로 간주하지 않는다. 적용 값·버전의 일관성을 증명할 수 없는 반영은 성공으로 처리하지 않는다. 미구성 키의 제품 기본값 적용과 원천 장애/잘못된 설정은 구분한다"
    implementation_boundary: "위 target_contract는 P2 목표 계약이다. 기존 system의 로그인/설정 동작은 이미 승인된 기준선이므로 구현 전 change-request로 영향·검증을 정리하고 필요한 승인을 거친다. 현재 구현 완료나 소스 수정 허가로 해석하지 않는다"
    pending:
      - "@defer P2 — REQ-614 개별 설정 키·자료형·단위·기본값·허용 범위·적용 시점을 기존 REQ/NFR과 대조해 확정한다. 정하지 않은 숫자를 임의 기본값으로 만들지 않는다"
      - "@defer P2 system/integration — 공개 설정 계약과 값/버전 일관성 변경을 CR로 구체화한다. 같은 DB 내 모듈 경계·경합 제어와 분리 배포 시 동등 계약의 구현 가능성을 확인한다"
      - "@defer P3 — 기대 버전·조건부 반영/잠금 순서·다중 키 스냅샷의 물리 구조와 계약 시험을 연결한다. 설정 변경과 승인/전결 경합, 동시 저장, 읽기 실패·노드별 캐시 지연을 포함한다"
