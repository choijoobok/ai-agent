portal_agent_contract:
  id: ARCH-019
  rule: "**portal 은 agent 가 권한·보안·쿼터·감사 처리를 끝낸 뒤 내놓은 응답 계약만 소비한다.** 처리 내부 상태나 LLM 공급자 응답을 직접 해석하지 않는다. 저장된 조회는 별도의 agent 실행 계약으로 요청하며, portal은 SQL·저장 시점 권한 결과를 보유하거나 재사용하지 않는다"
  ownership: "계약 버전·호환성·계약 시험은 `integration` 작업흐름이 소유하고, agent 는 의미 블록·사용자 표시 문구·저장된 조회 실행 결과를 생산하며 portal 은 표현 어댑터로 렌더링한다"
  hard_rules:
    - "초기 계약 시험 화면은 최종 응답의 원문과 메타데이터를 **누락·재해석 없이** 보여 준다. 이것은 제품 portal 채팅 화면의 완료로 세지 않는다"
    - "사용자에게 보이는 처리 상태·오류·권한/범위 안내·대안·경고·지식 태그 안내와 새 대화 초기 안내는 **agent 계약의 문구 블록**이다. portal은 문구를 만들거나 바꾸거나 자체 폴백 문구로 대체하지 않고 그대로 표시한다. 초기 안내도 모델 호출은 만들지 않되 agent가 제공한 고정 계약 문구를 사용한다"
    - "**저장된 조회 실행은 턴·LLM을 만들지 않는다.** agent는 매 요청마다 참조 객체 재추출·현재 사용자 그룹·데이터소스·신원 매핑·컬럼 마스킹·조회 상한을 판정하고, portal은 그 결과만 표시한다(REQ-201·207)"
    - "계약은 특정 그리드·차트·지도 라이브러리의 설정 객체를 직접 노출하지 않는다. 라이브러리를 바꾸는 일은 portal 어댑터 안에서 끝나야 한다"
    - "새 표현 블록은 계약 버전과 함께 추가한다. 소비자가 모르는 블록은 버리거나 전체 응답을 실패시키지 않고 원문 대체 표시가 가능해야 한다"
    - "agent가 지식 검토 필요 자산을 하나 이상 주입했으면 계약에 경고 여부와 사용자 표시 문구를 함께 싣고 portal은 그 문구를 그대로 표시한다. 지식 식별자·리비전·공개 객체명은 계약으로 portal에 내보내지 않으며 감사 이력만 보관한다"
    - "**호환 불가 변경(주 버전 상승)은 직전 주 버전을 병행 지원하지 않는다.** 전환 시점부터 agent 는 새 주 버전만 받고, 구 주 버전 요청은 NFR-026 대로 **지원하지 않는 버전으로 실패 처리**한다. 영향받는 작업흐름의 베이스라인은 다시 연다"
    - "**구 계약을 들고 있는 portal 은 재접속시킨다.** portal 은 주 버전 불일치 실패를 버전 불일치로 판정해 화면을 다시 불러온다 — PRC-05-03 의 두 갈래(`재접속` · `한시 유지`) 중 **재접속이 기본**이다. 작성 중이던 입력과 화면 상태는 잃는다"
    - "**이 규칙은 서버 대수와 무관하다.** 단일 인스턴스여도 **브라우저에 이미 내려간 portal**은 구 계약으로 호출하므로, 서버를 한꺼번에 바꾸는 것으로는 구 계약 호출이 사라지지 않는다 — 병행 지원의 실제 이유는 인스턴스 수가 아니라 **클라이언트가 이미 받아 간 계약**이다"
  note: "@defer G3 — integration 작업흐름에서 envelope·상태·오류·표현 블록의 정확한 스키마와, portal 이 버전 불일치를 판정하는 지점(응답 헤더·오류 코드)을 확정한다"
  traces_to: [REQ-009, REQ-027]

# ── portal 진입 경로 · 레거시 딥링크 ────────────────────────
