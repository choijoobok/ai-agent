# 공급 경로와 비밀의 책임 경계. 공급자별 구현·물리 계약은 integration P2/P3 대상이다.
module_boundaries:
  - id: ARCH-032
    rule: "제작사·공급 경로·모델·역할 설정과 실제 배포 연결을 구분하고, 실행용 불변 호출 구성은 서버에서 조립한다"
    reqs: [REQ-403, REQ-602, REQ-604, REQ-608, REQ-610, REQ-116]
    ownership:
      admin: "제작사·공급 경로·모델의 업무 메타데이터, 유효 제공 조합과 역할 매핑·사용 여부·연결 참조를 소유한다. 비밀이나 접속 주소를 별도 저장·편집하지 않는다"
      integration: "배포 연결 로드·비밀 해석·공급자 변환 계약과 지원 기능을 소유한다. 도메인에 공급자 SDK 객체·인증 헤더·비밀 원문을 노출하지 않는다"
      agent: "대화·추론·보조 판정·시스템 운영 모델 호출의 실행 주체다. 역할 선택과 현재 권한·전송 정책·사용량 기록을 집행한다"
      embedding: "admin의 지식 본문 임베딩과 agent의 질의 임베딩만 ARCH-013·040에 따라 같은 유효 모델/벡터 설정을 사용한다. 대화 모델 호출의 우회 통로로 쓰지 않는다"
    resolution:
      - "호출 목적과 실행 시도/작업의 주체를 서버가 확인하고 REQ-602·ARCH-040의 역할 설정을 선택한다. 주 추론의 시도별 고정과 관리자 운영 역할을 구분한다"
      - "제공 조합은 REQ-602.registry_contract의 공급사/모델/effort 표시명과 코드·전송 방식을 기준으로 공급 경로·해당 경로의 실제 호출 모델 식별값·지원 effort·용도와 어댑터 지원 기능을 대조한다. 미전송 effort는 값을 생략하고 표시명을 전송 값으로 사용하지 않는다. 표시명이 같다는 이유로 다른 경로/모델을 같은 것으로 취급하지 않는다"
      - "admin의 연결 참조를 현재 로드된 배포 연결과 연결한다. 누락·미지원 조합은 명시 사유로 실패시키며 다른 기본 연결·모델로 대체하지 않는다. 모델 비활성화의 신규 선택/진행 시도 경계는 REQ-602·ARCH-040을 따른다"
      - "서버는 목적지·연결 리비전·모델 호출 식별값·effort·지원 기능·적용 정책 근거를 불변 호출 구성으로 확보한다. 전송 단계에서 이름으로 다시 조회해 다른 구성으로 바꾸지 않는다"
    lifecycle: "모델 비활성화·진행 중 시도·새 시도 재선택은 REQ-602·ARCH-040을 따른다. 실행 구성을 고정해도 현재 권한·전송 정책 검사는 유지한다. 물리 배포 연결은 ARCH-028·ADR-028의 호환성 검수와 계획 배출 후 순차 재기동을 따른다"
    capability_contract:
      fields: "추론/임베딩 용도·effort 조합·구조화/도구 호출·스트리밍·취소·사용량 계량·입력/출력 제한과 지원 근거를 구분한다. 지원 불명은 지원으로 기록하지 않는다"
      semantics: "취소 요청 접수, 실제 공급자 처리 종료, 최종 사용량 확인을 별도 결과로 둔다. 클라이언트 대기 종료만으로 외부 처리가 중단되거나 과금이 멈췄다고 표시하지 않는다"
      development: "CON-033·034에 따라 개발용 명령행 공급자와 운영 API의 지원/실측 결과를 구분한다. 명령행 시험 통과나 관리자 등록만으로 운영 기능 지원을 확정하지 않는다"
      compatibility: "제품 호출 의미·결과·오류 계약과 공급자 변환 계약을 구분한다. 어댑터가 의미를 보존할 수 없는 요청은 축소·자동 대체하지 않고 거부한다"
    execution_contract:
      status: "2026-10-27 P2 책임 정련·미구현. 실제 공급자별 지원 판정과 물리 호출/응답 필드는 P2 검수 및 P3 계약 시험 대상이다"
      layers: "integration은 제품 공통 호출/오류 의미와 공급자 변환 계약·버전·시험을 소유한다. agent는 시도·스텝·현재 권한·예산·도구 실행·종결을 결정한다. 어댑터는 확보한 요청을 변환하고 관측 사실을 반환하며 사용자 승인·권한·모델 교체·업무 실행 여부를 자율 결정하지 않는다. portal은 ARCH-019의 통제된 제품 응답만 소비한다"
      capabilities: "지원 근거에는 공급 경로/모델·어댑터/도구 버전·개발/운영 모드·확인 일자·시험 조건과 선언/실측/미지원/미확인 상태를 구별한다. 연결 성공을 스트리밍·취소·도구 호출·정확한 사용량 지원의 근거로 확대하지 않는다. 필요한 제어를 확인할 수 없는 조합을 해당 기능의 지원 목록에 넣지 않는다"
      attempts: "Hub 호출 식별자·시도 순번·목적·확보한 설정/연결 리비전과 공급자 요청 식별자를 연결한다. 전송 전 실패·전송 여부 불명·접수 관측·부분 응답·정상 종료·오류·취소 요청/확인·최종 사용량 확인을 별도 사실로 기록한다. 늦은 응답은 현재 시도/점유와 대조하고 종결 작업을 되살리지 않는다"
      timeouts: "ARCH-033.calls의 사용자 승인 공통값과 REQ-608.timeout_policy의 API별 예외를 서버에서 해석해 호출별로 고정한다. 실제 전송 경로의 지원/프록시 제한·현재 점유/갱신·허용된 재시도 예산을 대조하고 조합이 유효하지 않으면 호출을 시작하지 않는다. 승인 후 호출 시작 기한을 개별 호출 실행 시간으로 오해하지 않는다"
      retry_owner: "agent가 REQ-009·NFR-022의 원인별 재시도 허용을 판정하고 integration 어댑터가 그 한도 안에서 호출한다. 하위 SDK·HTTP 클라이언트·그래프·개발 CLI의 각 재전송은 전송 전에 현재 중단/점유·권한·예산·필수 이력 기록을 검사하는 agent 경계를 통과할 수 있을 때만 허용한다. NFR-022의 TIMEOUT_RETRYING 저장과 실제 새 모델 응답 실행의 스텝 예산 확보를 사후 횟수 집계로 대신하지 않는다. 이 사전 통제를 제공하지 못하면 하위 자동 재시도를 끄거나 해당 호출 경로를 미지원으로 둔다. 원 호출과 모든 시도의 전송/계량은 같은 근거로 연결한다"
      retries: "등록 계약상 안전한 도구 타임아웃만 NFR-022의 자동 1회를 사용한다. DB/DW 타임아웃은 REQ-037에 따라 재시도/재작성하지 않는다. 전송한 업무 실행과 결과 불명은 REQ-105의 확인·새 승인 경계를 따르며 멱등성 선언만으로 재전송하지 않는다. 인증/권한·정책 거부·미지원 기능·설정/계약 불일치를 다른 모델/연결로 우회하지 않는다"
      auxiliary_fallback: "REQ-602.auxiliary_fallback을 실행 정책 정본으로 사용한다. integration은 일시 수용량/서비스 불가와 인증·정책·계정 쿼터·계약 오류를 구별하고 공급자 오류 코드/근거·접수/종료 관측을 agent에 반환한다. 문구/HTTP 상태만으로 자동 대체 가능을 추정하지 않는다. agent가 후보/입력/설정 스냅샷·현재 검사·남은 마감/횟수·동의와 필수 기록을 확보해 다음 호출을 요청한다. 어댑터의 암묵적 경로 변경과 하위 자동 재시도는 금지한다. 후보마다 해석된 연결·모델·지원 계약을 고정하며 각 원격 호출의 취소·종료·사용량 미확인은 대체 성공으로 덮지 않는다. 실제 공급자별 분류 표와 거절/종료 근거를 검증하기 전에는 해당 오류를 자동 대체 가능으로 활성화하지 않는다"
      cancellation: "클라이언트 취소 요청 수락·공급자 처리 종료 확인·응답 수신 종료·사용량 확정을 분리한다. 개발 CLI의 프로세스 종료만으로 원격 작업 취소·과금 종료를 확정하지 않는다. 취소 미확인·계량 미제공은 명시 상태이며 성공/0으로 채우지 않는다"
      usage: "공급자 계량·Hub 추정·확인 불가를 구분해 REQ-116·NFR-010의 귀속과 기록을 유지한다. 늦은 계량의 반영은 원 호출에 연결해 중복 차감/집계를 방지하고 일반 응답에는 인증 정보·원문 헤더를 포함하지 않는다"
      proof: "정상/빈/잘린/거절 응답·부분 스트림 뒤 단절·취소 경합·사용량 누락/지연·숨은 재시도·동일 이름의 다른 모델·미지원 기능·승인 후 대상 변경을 실제 지원 경로별로 검증한다. CON-033·034의 개발 CLI 결과와 운영 API 결과는 따로 판정한다"
    secret_contract:
      authority: "REQ-403·ADR-022가 비밀 종류·암호화 YAML·환경별 외부 활성 마스터 키·구현 경계의 정본이다. 새 비밀 저장소·관리 화면·암호 알고리즘을 선택하지 않는다"
      flow: "공통 설정 해석 계층이 기존 설정 우선순위를 보존해 접속 구성요소 사용 전에 복호화한다. 연결 소비자는 그 결과를 사용하며 모듈마다 복호화 도구를 복제하지 않는다"
      exposure: "admin·portal에는 식별자·유효 상태·허용된 공개 필드만 제공한다. 설정 객체 전체 직렬화·바인딩 예외·헤더·URL·도구 출력·진단·감사·모델 문맥의 비밀 노출을 검증한다"
      failure: "필수 연결의 비밀 누락·변조·미지원 형식·복호화 실패는 해당 구성요소 기동/호출을 막는다. 미사용 선택 연동의 비밀을 요구하거나 인증 없음·평문으로 대체하지 않는다"
      no_auth: "인증 없음은 REQ-604·608의 명시 등록·공동 검수된 연결 방식에 한한다. API 키가 없다는 사실로 자동 선택하지 않는다"
      rotation: "비밀 교체의 업무 동일성 예외는 REQ-105, 배포 적용·복구는 ADR-028을 참조한다. 환경 마스터 키 교체를 일반 연결의 호환 변경으로 자동 분류하지 않는다. 비밀값 해시를 업무 승인 대상의 공개 지문으로 쓰지 않는다"
      boot_design:
        status: "ADR-022의 공통 설정 연동을 구체화한 P2 초안. 현재 제품의 조기 복호화 구현 또는 기동 시험 통과를 뜻하지 않는다"
        order: "Spring Boot의 설정 데이터/프로파일 해석 뒤, 비밀을 소비하는 DB·Liquibase 등 구성요소 바인딩 전의 공통 Environment 해석 경로에 연결한다. 각 PropertySource의 우선순위·원천 정보를 유지하고 평문 재정의 맵을 최상위에 덧씌워 선택 결과를 바꾸지 않는다"
        resolution: "최종 선택된 비밀 설정값을 소비할 때 버전/형식과 해당 환경 키를 검증해 메모리에서 복호화한다. 사용하지 않는 선택 연동의 설정을 전체 열거·강제 복호화하지 않는다. 필요한 연결의 해석 실패는 그 기동/사용을 차단하며 낮은 우선순위 값이나 평문으로 대체하지 않는다"
        bootstrap: "프로파일 선택·설정 파일 위치·외부 키 읽기 자체가 그 키의 복호화를 요구하는 순환 구성을 허용하지 않는다. 조기 로그/실패 분석·설정 진단에서 값·암호문·키가 노출되지 않는지 실제 부팅 경로를 별도로 검증한다"
        envelope_candidate: "ENC(...) 안에 제품 형식 버전·암호 프로파일·복호화에 필요한 공개 파라미터와 암호문을 구분하는 안이다. 지원하지 않는 버전/알고리즘을 자동 추측하지 않고 거부한다. 인증된 암호화 구현과 난수는 Spring Security Crypto를 재사용하며 자체 암호 알고리즘을 만들지 않는다"
        binding_candidate: "복호화한 내용을 고객사/환경·설정 용도와 결합해 다른 위치의 유효 암호문을 복사한 경우도 대조하는 안이다. 공개 키 식별자를 두더라도 키 자체·비밀 해시는 공개하지 않는다. 바이트 형식·키 재료·암호 파라미터와 라이브러리의 실제 지원은 P2 검수 대상이다"
        operations: "암호문 생성·검증·재암호화는 공통 운영 도구로 제공한다. 키/평문은 화면·명령행 인자·셸 이력·일반 로그·평문 중간 파일에 남기지 않으며 출력은 암호문과 비밀 없는 성공/실패 근거로 제한한다. YAML 전체 자동 편집과 원문 출력 도구를 범위에 추가하지 않는다"
