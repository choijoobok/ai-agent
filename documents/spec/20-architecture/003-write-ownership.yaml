write_ownership:
  claim: "네 모듈이 공유하는 PostgreSQL 스키마는 하나지만 **각 테이블과 Entity/Repository에는 쓰기 소유 모듈 하나가 있다.** 다른 모듈은 소유 모듈의 공개 조회 계약을 사용하고 내부 Repository를 직접 참조하지 않는다"
  why: "같은 DB를 쓴다는 이유로 모든 Entity를 공통화하면 소스 이동만 생기고 캡슐화는 생기지 않는다. 쓰기 소유권이 있어야 상태 전이와 마이그레이션 책임이 한곳에 남는다"
  rules:
    - "사용자·메뉴·역할·권한·공통코드·다국어 메시지는 **system**이 소유한다"
    - "AI 지식·정책·기준 정보·API·도구 등록 구성·쿼터 계획과 추가 토큰 신청·승인 상태는 **admin**이 소유한다"
    - "턴·스텝·감사 이력·토큰 사용량과 **저장된 조회의 실행 정의(SQL·파라미터 명세·참조 객체·무효화 상태)·경량 실행 이력**은 **agent**가 소유한다"
    - "질의 즐겨찾기·대시보드 배치처럼 agent 실행 정의를 포함하지 않는 개인화와 portal 전용 상태는 **portal**이 소유한다"
    - "정확한 테이블별 소유권은 P3의 ENT 명세에서 한 번씩 지정한다"

# ── 업무 확장 경계 (SHAPE-02) ───────────────────────────────
