datasource:
  id: ARCH-030
  modes:
    - mode: "운영 DB 직결"
      detail: "업무 시스템별 운영 DB 에 읽기 전용으로 접속"
      caution: "운영 부하 영향. 조회 제한 정책 필수"
    - mode: "통합 DW"
      detail: "여러 업무 시스템 데이터를 모아둔 DW 에 접속"
      caution: "**동기화 시점 문제.** 조회 결과에는 기준 시각을 함께 제공한다"
  rules:
    - "두 방식을 고객사별로 선택하거나 혼용할 수 있어야 한다"
    - "어느 방식이든 조회는 **읽기 전용 계정**을 사용한다. 데이터 변경은 반드시 업무 API 를 통한다"
    - "데이터소스별 **기준 시각을 조회 결과 메타데이터로 항상 반환한다**"
    - "**하나의 SQL 은 하나의 데이터소스 안에서만 생성한다.** 여러 데이터소스에 걸친 요청은 데이터소스별로 조회한 뒤 agent 가 결합한다"

  relation_to_target_system:
    claim: "**대상 시스템과 데이터소스 사이에 매핑을 두지 않는다**"
    detail: "데이터 조회(SQL)는 데이터소스의 권한만, 기능 실행(API)은 대상 시스템의 권한만 본다. 두 경로를 잇는 것은 오직 **사용자 그룹**이라는 전역 개념 하나다"
    gained: "이렇게 절단하면 이전에 필요했던 구조 — 시스템 ↔ 데이터소스 N:N 매핑, 공유 DB 의 판정 기준 선택, 경로별 등급 결합 규칙 — 가 전부 사라진다"
    catalog: "**스키마 카탈로그의 테이블은 데이터소스에만 귀속된다.** 테이블 ↔ 데이터소스 매핑이 결정하는 것은 둘이다 — ① 어떤 커넥션으로 조회할지 ② SQL 검증·조건 주입·원본 컬럼 추적에 어떤 파서를 쓸지"
    unique: "**카탈로그에는 물리 실체당 한 건만 등록한다** — `(데이터소스, DB 스키마, 테이블명)` 유니크 제약. 하나의 커넥션이 여러 네임스페이스를 볼 수 있으므로 테이블명만으로는 물리 실체가 유일하지 않다. 같은 물리 테이블에 대한 그룹별 차등 뷰는 각각 별도 엔트리로 등록한다"

  two_layers:
    why: "접속 정보를 화면에 노출하지 않기 위해 **연결 정의의 원천은 배포 yml**로 둔다. 비밀 원문을 yml에 넣어야 한다는 뜻이 아니며 비밀 설정값의 암호화 yml·공통 복호화 연동·외부 마스터 키 관리는 REQ-403을 따른다. admin은 **매핑만 관리**한다"
    layers:
      - layer: "접속 계층"
        source: "yml 설정"
        holds: "데이터소스 ID · 접속 URL·계정·암호화된 비밀 설정값 · 커넥션 풀 설정"
        note: "화면에서 관리하지 않고 AI 전용 DB 에도 저장하지 않는다"
      - layer: "관리 계층"
        source: "AI 전용 DB (admin 데이터소스 관리)"
        holds: "별칭 · 연결된 yml 데이터소스 ID · DBMS 종류 · 사용할 파서 · 유형(운영 DB / DW) · 시각 체계 · 설명"
    rules:
      - "**yml 은 기동 시 로드되며 데이터소스 추가·변경의 반영은 재기동을 전제로 한다.** 화면의 '실시간 조회' 는 로드된 설정을 화면 진입 시점에 직접 읽는다는 뜻이지(DB 에 복사해 두지 않는다) 무중단 동적 커넥션 풀 등록을 뜻하지 않는다"
      - "**다른 모든 메뉴와 agent 런타임은 관리 계층의 데이터소스 레코드만 참조한다.** 카탈로그의 테이블 귀속도 레코드의 **내부 식별자**를 참조할 뿐 yml ID 를 직접 참조하지 않는다"
      - "그 결과 **yml 의 데이터소스 ID 가 바뀌어도 관리 화면에서 해당 레코드의 ID 연결 한 군데만 바꾸면 된다.** 간접 계층을 두는 이유가 이것이다"
      - "**별칭은 표시용**이므로 변경할 수 있다. admin 화면과 LLM 컨텍스트에서 데이터소스를 지칭하는 이름이므로 업무 담당자가 알아보는 이름으로, 혼동을 막기 위해 유일하게 부여한다"
      - "**파서는 DBMS 종류에서 기본값을 유도하되 별도 필드로 관리한다** — 같은 DBMS 라도 버전·호환 모드에 따라 달리 써야 할 수 있다. **파서가 지정되지 않은 데이터소스는 조회 불가로 취급한다**"
      - "**yml 에 없는 ID 를 참조하는 레코드는 끊긴 연결로 감지한다.** 기동 시와 관리 화면 진입 시 검사하며, 끊긴 연결에 귀속된 테이블은 조회 불가로 처리하고 경고를 남긴다"

  declaration_and_verification:
    claim: "SQL 조회 도구 호출은 **대상 데이터소스를 파라미터로 명시**해야 하며, SQL 안의 객체는 실제 이름(`DB 스키마.테이블명`)을 그대로 쓴다. 별칭 접두어·노출명 같은 이름 변환 계층은 두지 않는다"
    steps:
      - "1. 도구 호출이 선언한 데이터소스로 **파서를 선택**한다. 선언이 없으면 거부한다"
      - "2. 파서로 SQL 의 **참조 객체 전체를 추출**한다"
      - "3. 모든 객체를 **선언된 데이터소스의 카탈로그와 대조**한다. 하나라도 없으면 실행하지 않고 거부한다"
      - "4. 전부 존재하면 선언된 데이터소스의 커넥션으로 실행한다"
    why_safe: "**선언이 틀려도 안전하다** — 잘못된 데이터소스를 선언하면 참조 객체가 그 카탈로그에 없어 거부되고, 결과는 항상 닫힘으로 수렴한다. **크로스 데이터소스 조인도 같은 검증에서 자동 차단된다**"
    context: "LLM 컨텍스트에는 카탈로그를 **데이터소스 단위로 묶어 제시**하고, 각 묶음에 별칭과 업무 설명을 함께 표기해 LLM 이 선언할 값을 고를 수 있게 한다. 반복 거부(선언 오류)는 품질 지표로 집계한다"

# ── LLM 연동 계층 ───────────────────────────────────────────
