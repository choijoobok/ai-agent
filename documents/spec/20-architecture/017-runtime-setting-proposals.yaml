# 사용자 선택으로 확정한 초기 운영값과 검토 중인 기술 설정을 구분한다. 실측 결과는 아니다.
module_boundaries:
  - id: ARCH-033
    rule: "초기 운영값·기술 후보·실측 필요값을 구분하고 호출별 적용과 운영 활성화 조건을 검증한다"
    reqs: [REQ-614, REQ-005, REQ-022, REQ-023, REQ-026, REQ-031, REQ-032, REQ-036, REQ-037, REQ-038, REQ-204, REQ-207]
    basis: "ARCH-031 — 확정값과 미정 항목의 목록. 여기서는 신규 후보의 기본값·입력 범위·적용 의미를 한 곳에 정의한다"
    status: "2026-10-27 사용자 명시 승인·admin G2 통과. query·execution_budget·calls·additional_info_wait·classification_budget과 technical_parameters의 초기값/범위·적용·보호 계약을 승인했다. API별 호출 제한은 REQ-608.timeout_policy, measurement_required는 ADR-029의 승인된 실측 순서를 따른다. 다른 작업흐름 게이트·성능 실측·현재 소스 구현 완료를 뜻하지 않는다"
    rationale: "무한 대기와 반복을 막는 초기 설정을 구체화하되 긴 업무를 한꺼번에 제한하지 않는다. 수치는 설계자가 제안한 시작점이며 실제 공급 경로·DB·자료 규모에 대한 안전성 증명이 아니다. 승인한 값도 소유 구현의 계약/부하 시험과 운영 검수를 거쳐야 한다"
    numeric_conventions: "MB는 1000000바이트다. 횟수/행 수는 정수, 시간 단위는 항목에 적힌 초/분을 사용한다. 0은 해당 항목이 명시 허용한 경우만 사용하며 무제한 의미로 해석하지 않는다"
    query:
      decision: "2026-10-27 사용자 선택 — 권장안. 초기 기본값·허용 범위와 적용 의미를 확정하며 실제 운영 검증은 별도다"
      source: "NFR-001·002·REQ-207"
      defaults:
        - { item: "기본 페이지 행 수", value: 200, unit: "행", allowed: "1 이상, 현재 서버 최대 행 수 이하" }
        - { item: "페이지당 서버 최대 행 수", value: 1000, unit: "행", allowed: "1~10000" }
        - { item: "개별 원천 조회 제한", value: 60, unit: "초", allowed: "1~600" }
        - { item: "페이지 결과 크기", value: 10, unit: "MB", allowed: "1~100" }
      alternative: "미선택 대안 — 큰 결과 중심: 기본 500행·최대 5000행·120초·20MB. 입력 허용 범위는 같고 메모리/원천 부하와 기다림이 늘 수 있다"
      why: "화면의 첫 결과는 작게 시작하고 더 많은 결과는 기존 페이지 요청으로 확인한다. 조회와 결과 크기에 별도 한도를 둬 적은 행의 매우 큰 값이나 오래 걸리는 조회도 제한하는 안이다"
      application: "원천 조회 시작 직전에 현재 값·버전을 함께 확보한다. 개인 순서 대기·모델의 SQL 생성 시간은 이 조회 타이머에 넣지 않는다. 시작한 조회는 고정값을 유지하고 다음 원천 페이지는 당시 현재값을 다시 사용한다. 저장 조회도 같은 정책을 적용한다"
      enforcement: "조회 시간은 원천 연결 확보·실행·결과 읽기/통제 경계를 포함하도록 P3에서 분해한다. 원천/드라이버 취소 지원과 실제 종료 확인은 별도로 검증한다. 페이지 크기는 마스킹한 결과 본문을 UTF-8로 직렬화한 비압축 바이트를 기준으로 하며 읽기 중에도 제한한다. 이 값이 서버 전체 메모리 상한이라는 주장은 하지 않는다"
      exceeded: "행 초과는 NFR-002의 N+1행 감지와 다음 페이지 안내로 처리한다. 시간/크기 초과는 정상 완료·더 없음으로 바꾸지 않으며 DB 타임아웃을 재작성/자동 재조회하지 않는다. 매우 큰 단일 필드를 전부 메모리에 올린 뒤에만 검사하는 구현은 검증 실패다"
      impact: "조회·후속 페이지·저장 조회의 공통 제한. 되돌리기 비용 중간 — 수치 변경은 운영 설정이지만 기존 호출/페이지의 적용 근거는 유지해야 한다"
    execution_budget:
      decision: "2026-10-27 사용자 선택 — 50스텝·되돌림 3회 권장안과 제시한 허용 범위/상한 처리"
      source: "NFR-013·014·023·REQ-038"
      defaults:
        - { item: "실행 시도별 최대 스텝", value: 50, unit: "스텝", allowed: "1~500" }
        - { item: "턴별 최대 되돌림", value: 3, unit: "회", allowed: "0~20 — 0은 되돌림 불허이며 무제한이 아니다" }
        - { item: "개인 동시 실행", value_basis: "NFR-023의 기존 3건", allowed: "1~20. 기존 기본값은 바꾸지 않는다" }
      alternative: "미선택 대안 — 긴 절차 중심: 시도별 100스텝·턴별 되돌림 5회. 개인 동시 기본값과 입력 허용 범위는 권장안과 같다"
      why: "정상 절차가 반복 때문에 무한히 이어지는 것을 제한하고 사용자가 명시적으로 새 요청을 선택할 기회를 둔다. 제안 수치는 실제 정상 업무의 스텝 분포를 측정한 결과가 아니다"
      application: "NFR-013·014·023.configuration_change의 이미 승인된 적용 규칙을 그대로 사용한다. 같은 시도의 이어가기·재접속·인계와 턴의 회차 변경으로 사용량을 초기화하지 않는다"
      exceeded: "상한에 도달해도 마지막 허용 단계에서 업무가 정상 완료됐다면 완료로 처리한다. 다음 단계/되돌림이 더 필요할 때는 추가 호출을 시작하지 않고 실패로 종결하며 완료된 범위·미처리 범위·상한 원인을 기록한다. 남은 일을 자동 새 턴으로 보내지 않고 사용자의 명시 재요청은 REQ-013의 현재 조건을 따른다. 전송된 업무의 결과 불명은 이 종결과 별도 사실로 보존한다"
      impact: "실행 예산·반복/종결·개인 순서 대기. 되돌리기 비용 중간 — 실패 분류/안내/예산 기록을 함께 맞춰야 한다"
    calls:
      decision: "2026-10-27 사용자 선택 — 권장안. 오래 걸리는 API에는 API별 별도 타임아웃을 설정하도록 추가 요청했다"
      source: "NFR-013·022·REQ-007·009·ARCH-032"
      defaults:
        - { item: "연결 확보/접속 제한", value: 10, unit: "초", allowed: "1~60, 해당 호출 전체 제한 이하" }
        - { item: "개별 모델 호출 전체 제한", value: 300, unit: "초", allowed: "30~1800" }
        - { item: "모델 첫 응답/응답 사이 무진전 제한", value: 180, unit: "초", allowed: "5~600, 해당 모델 호출 전체 제한 이하" }
        - { item: "일반 외부 도구 호출 전체 제한", value: 60, unit: "초", allowed: "1~600" }
      alternative: "미선택 대안: 모델 전체 600초·무진전 300초·도구 120초. 호출 제한 변경은 아래 갱신 모드·점유 정책과 함께 검수하며 숫자만 바꿔 활성화하지 않는다"
      why: "느린 추론과 도구를 구분하고 개별 호출의 무한 대기를 막는다. 모델 응답 조각이 계속 와도 전체 개별 호출 제한은 연장하지 않는다. 턴 전체 소요 시간·누적 토큰에는 새 상한을 두지 않는다"
      application: "각 실제 전송을 시작하기 전에 검증된 값·버전을 확보하고 해당 호출에는 고정한다. DB/DW 조회는 query의 조회 제한을 사용해 같은 타이머의 중복 정본을 만들지 않는다. 업무 API의 별도 전체 호출 제한은 REQ-608.timeout_policy를 우선하며 미지정이면 일반 외부 도구 기본값을 사용한다. 연결 확보 제한은 유효 전체 제한을 넘지 않도록 검증한다"
      semantics: "무진전의 시작/갱신은 공급 경로가 관측할 수 있는 실제 응답 진전을 사용하고 단순 연결 유지 신호로 무한 연장하지 않는다. 내부 추론 중 응답이 없는 공급 경로는 그 특성을 검수한다. 시간 초과는 통신 관측이며 외부 취소 성공·실행 실패·과금 종료를 뜻하지 않는다"
      retry: "등록 계약상 안전한 도구 타임아웃에만 NFR-022의 자동 1회와 전송 전 검사/이력 기록을 적용한다. DB/DW 타임아웃은 재시도/재작성하지 않는다. 모델 재요청의 원인별 허용 여부·상한은 REQ-009의 소유 상세 설계를 따르며 도구의 1회를 모델 공통 정책으로 복사하지 않는다. 각 재시도는 별도 호출 시도로 기록하며 숨은 재시도를 끄거나 사전 통제한다. 업무 실행이 전송됐거나 결과 불명이면 시간 초과를 이유로 자동 재전송하지 않는다"
      impact: "호출 지연·취소·계량·오류/재시도. 되돌리기 비용 중간 — 공급자 어댑터와 결과 불명 안내를 함께 검증한다"
    additional_info_wait:
      status: "2026-10-27 사용자 선택 — 기본 30분 권장안과 범위·적용/만료 처리를 승인했다. 실제 응답 분포 실측은 별도다"
      basis: "REQ-005·023과 WT-02. 계획 확인은 추가 정보 대기의 목적 중 하나이며 별도 대기 유형이나 승인으로 만들지 않는다"
      default_minutes: 30
      allowed: "양의 정수 1~1440분. 필요한 임시 자료의 남은 유효 기한 안에서만 사용할 수 있다"
      alternative: "미선택 대안 — 짧은 확인 중심의 10분. 입력 허용 범위와 기존 기한 고정은 같다"
      application: "새 WT-02 대기 요청을 처음 제시할 때 현재 값·버전을 고정한다. 같은 대기의 계획 수정·부분 입력·재표시·재접속·설정 저장은 기한을 연장하거나 새로 시작하지 않는다. 기존 대기 안에서 필요한 추가 자료의 기한이 더 짧으면 더 늦게까지 유효하다고 표시하지 않는다"
      expiry: "REQ-005·state_rules에 따라 만료 시 중단하고 자동 진행/승인/새 턴으로 우회하지 않는다. 계속 필요한 업무는 사용자가 명시적으로 새 요청을 할 수 있으며 원 턴은 되살리지 않는다"
      boundary: "승인 응답/승인 후 호출 시작은 REQ-026, 의도 확인은 ADR-029의 실측 순서를 유지한다. 원문 보존을 이 설정으로 늘리지 않는다"
      impact: "REQ-005·023·ARCH-031 — 사용자 입력/계획 확인의 대기와 안내. 되돌리기 비용 중간"
    classification_budget:
      status: "2026-10-27 사용자 선택 — 턴별 기본 10회 권장안과 범위·예산 집계·한도 도달 처리를 승인했다"
      default_calls: 10
      allowed: "정수 1~100회. NFR-013의 시도별 스텝 상한과 함께 검사하며 어느 쪽도 우회하지 않는다"
      alternative: "미선택 대안 — 짧은 대화 중심의 턴당 5회. 전체 스텝 예산과 예외 처리는 권장안과 같다"
      accounting: "대상 턴/시도가 확정된 실제 분류 모델 실행은 턴별 분류 횟수와 시도별 실제 모델 스텝에 각각 한 번 포함한다. 둘을 서로 다른 실행 두 건으로 기록하거나 사용량을 이중 차감하지 않는다. 동시 입력에서도 두 예산의 사전 확보·실제 시작·미시작 해제를 함께 검증한다. 실패/늦은 응답도 실제 실행했다면 사용 이력에서 빼지 않는다"
      application: "새 턴 첫 실행에 전용 상한 값·버전을 고정한다. 재분류·회차 변경·사용자대기 이어가기·재접속·노드 인계로 초기화하지 않는다. 명시적 중단과 대상 확인 질문 자체에는 분류 호출을 만들지 않는다"
      exhausted: "분류 상한만 소진되면 새 입력을 자동 분류/반영하지 않고 REQ-032의 확인 경로로 안내한다. 모델 추가 분류 없이 기존 요청 계속·별도 새 요청·중단을 명시 선택하게 하며 변경 의도를 추정하지 않는다. 자동으로 새 턴을 만들지 않는다. 전체 스텝 예산도 소진되어 후속 실행이 필요하면 NFR-013의 실패 종결이 우선한다"
      target: "대상 미정 입력은 REQ-007·031에 따라 대상을 먼저 확인한다. 어느 턴의 예산에도 귀속되지 않는 별도 분류 호출을 허용하지 않는다"
      impact: "REQ-031·032·NFR-013 — 연속 입력 비용 방어와 한도 도달 안내. 되돌리기 비용 중간"
    technical_parameters:
      status: "2026-10-27 admin G2에서 사용자 승인한 초기 기술 설정과 계약이다. 미구현 계약을 아래 두 갱신 모드로 구체화하며 운영 활성화 전 소유 agent·integration의 계약/지연 시험으로 지원 환경을 검증한다. 그 작업흐름의 게이트·실환경 실측 완료를 대신하지 않는다"
      defaults:
        - { item: "접수/처리 중 상태 조회 간격", value: 2, unit: "초", allowed: "1~10" }
        - { item: "사용자대기 상태 조회 간격", value: 5, unit: "초", allowed: "1~60" }
        - { item: "상태 조회 요청 제한", value: 10, unit: "초", allowed: "1~60" }
        - { item: "점유 유지", value: 360, unit: "초", allowed: "60~3600, 갱신 모드별 상호 제약 적용" }
        - { item: "점유 갱신 간격", value: 15, unit: "초", allowed: "5~60, 점유 유지의 1/3 이하" }
        - { item: "만료 회수 배치 간격", value: 15, unit: "초", allowed: "5~60, 점유 유지 이하" }
        - { item: "종료 신호 후 대기", value_basis: "ARCH-070의 기존 5분", unit: "분", allowed: "1~30, 외부 종료 유예/저장 여유 검증" }
      polling: "RECEIVED/RUNNING은 처리 중 간격, WAITING_USER는 사용자대기 간격을 적용한다. 이전 조회의 완료/요청 제한 도달 뒤 다음 조회를 예약하고 같은 대상 조회를 겹쳐 발행하지 않는다. 다음 예약부터 현재값을 적용하되 시작한 요청 제한은 고정한다. 늦은 응답으로 최신 상태를 되돌리지 않으며 종결 확인 시 정지한다. 오프라인에서는 전송하지 않고 재접속은 상태 조회부터 수행한다"
      polling_failures: "일시 통신 실패는 읽기 조회에만 현재 정상 간격에서 시작해 연속 실패마다 두 배로 늘리고 max(30초, 현재 정상 간격)에서 제한한다. 성공하면 해당 상태의 정상 주기로 돌아간다. 기본값에서 처리 중은 2·4·8·16·30초, 사용자대기는 5·10·20·30초다. 인증·권한·계약 버전 오류는 해당 접근/재접속 규칙을 따른다. 실패만으로 업무 상태·승인/대기 기한을 바꾸거나 업무/승인 명령을 자동 재전송하지 않는다"
      lease: "점유 유지·갱신·회수 값은 함께 검증한다. 갱신 간격은 유지 시간의 1/3 이하, 회수 간격은 유지 시간 이하이며 갱신하지 못하는 최장 구간과 지연 여유가 유지 시간보다 작아야 한다. 회수 배치의 노드별 분산 지연은 설정 간격 안에서만 두고 실제 지연을 따로 관측한다. 기본 360+15초는 마지막 유효 갱신부터 회수까지의 명목 설계 기준이며 DB/배치 장애·저장·통신·표시까지 375초에 끝난다는 보장이 아니다(NFR-009)"
      lease_changes: "획득 시 점유 유지/갱신 정책의 값·버전을 고정한다. 설정 저장으로 기존 점유 만료를 다시 계산하지 않으며 기존 점유를 갱신할 때도 획득 때의 유지 시간을 사용한다. 회수 배치 간격은 다음 예약부터 바꾸되 저장된 만료 시각으로 판정한다. 정확한 만료 시각 이후에는 배치가 아직 돌지 않았어도 갱신·후속 전송·실행 상태/체크포인트 쓰기를 허용하지 않는다"
      shutdown: "종료 신호 처리 때 검증된 값·버전으로 기한을 고정하고 조회 실패 시 기동 때 확보한 검증된 비상 종료값을 쓴다. 그러한 값도 없으면 실행 준비 상태로 기동하지 않는다. 외부 서비스 관리자의 종료 유예는 내부 대기와 저장/정리 여유를 수용해야 한다. 계획 배출은 기존 실행이 끝날 때까지 기다리므로 이 타이머를 적용하지 않는다. 긴 호출 도중 긴급 종료할 때는 외부 취소 성공을 추정하지 않는다"
      compatibility: "호출 제한을 늘리거나 점유 시간을 줄이는 변경은 연관 값 전체를 검증한 뒤 반영한다. API 후보 자체는 검토 대상으로 둘 수 있으나 그 값을 활성화하거나 전송하기 전에는 점유·재시도·프록시와 함께 검수한다. 현재 활성 계약뿐 아니라 이미 시작한 호출·유효 점유·사용자대기에 고정된 계약/설정도 대조한다. 기존 유효 대기 요청을 임의 종결하거나 기한을 연장해 새 설정을 맞추지 않는다. 실제 검수 범위를 벗어나면 입력 허용 범위 안이라는 사실만으로 운영 준비 완료로 보지 않는다"
      lease_validation:
        ownership: "agent·integration이 실제 호출 경로·재시도·갱신·저장 지연의 상한을 검증하고 system의 설정 계약에 상호 제약을 제공한다. admin은 검증 근거·적용 대상·반영 가능 여부를 표시한다. 현재 후보 수치와 지원 환경의 적합성은 별도이며 미검증 후보를 자동 활성화하지 않는다"
        modes:
          - { mode: "경계 갱신", applies: "본문에서 갱신하지 않는 일반 도구", bound: "본문의 호출·허용 재시도·백오프·정리까지 갱신 없는 전체 구간과 여유를 점유 유지보다 짧게 제한한다" }
          - { mode: "독립 갱신", applies: "모델 호출과 경계 갱신으로 감당되지 않는 긴 API", bound: "호출 중에도 독립 제어 경로로 갱신한다. 실제 갱신 불가 최장 구간과 여유를 점유 유지보다 짧게 검증하며 호출의 전체/정체 제한은 별도로 계속 집행한다" }
        bound: "호출 전에 실행 경로·갱신 모드·지원 근거·허용 재시도·유효 점유/호출 정책을 고정한다. API 타임아웃 숫자만으로 독립 갱신 지원을 추정하지 않는다. 연결 확보 시간이 전체 제한에 포함되면 중복 합산하지 않는다. 미정 재시도·무한 백오프·제한 없는 내부 작업은 모드와 무관하게 적합 판정을 막는다. 경계마다 갱신되는 여러 모델 호출의 합을 하나의 무갱신 구간으로 오인하지 않는다"
        renewal_control: "독립 제어는 현재 시도·점유 토큰·호출 식별자에 묶이며 실제 미만료 점유와 최초 호출 기한/정체 조건을 확인한다. 갱신 성공·연결 유지·청크로 호출 기한을 다시 시작하지 않는다. 호출 종료·기한 초과·점유 상실 시 해당 호출에 붙은 갱신을 끝내며 다음 작업은 기존 스텝/진전 조건으로 새로 판정한다. 제어가 업무 호출의 스레드·장기 트랜잭션·고갈된 연결 풀과 함께 막히지 않는지 시험한다"
        expiration: "DB의 판정 시점 시각과 현재 소유자·토큰·상태·미만료를 함께 검사해 갱신/실행 상태 쓰기를 조건부로 수행한다. 오래된 트랜잭션 시작 시각이나 별도 선조회 결과로 만료를 판정하지 않는다. 유효성 확인과 쓰기의 원자성은 소유 P3에서 구체화하고 만료 직전/직후 경합으로 검증한다. 갱신을 확인하지 못하면 후속 전송을 중지하며 만료 후 점유를 부활시키지 않는다. 원 호출의 늦은 결과·계량은 현재 상태를 되살리지 않고 감사 사실로만 연결한다"
        counterexamples:
          - "600초 API와 점유 360초를 본문 갱신 없이 조합하면 거부한다. 검증된 독립 갱신·600초 호출 기한·프록시 조건을 갖춘 경로는 허용할 수 있어야 하며 긴 API를 무조건 거부하는 구현도 통과로 보지 않는다"
          - "안전한 도구의 60초 호출과 자동 1회는 호출 시간만 최대 120초다. 그 사실만으로 360초 적합을 선언하지 않고 호출 밖 대기·저장 여유까지 대조한다"
          - "갱신 제어만 살아 있고 모델/도구는 응답하지 않으면 최초 호출 기한/정체 조건으로 끝내야 한다. 점유 갱신이 호출 타이머를 연장하면 실패다"
          - "점유가 만료된 뒤 회수 배치 전에 구 프로세스가 깨어나도 갱신·상태 쓰기·새 전송은 실패해야 한다. 만료 직전 유효 갱신과 배치가 경합하면 현재 DB 상태와 시각으로 한 결과만 확정한다"
    measurement_required:
      retained_decisions: "REQ-032의 의도 확인 만료와 NFR-005의 저장 조회·대시보드·위젯/자동 실행/캐시·쿨다운·재시도 제한은 기존 실측 후 결정 원칙을 유지한다. 이 항목에 임의 숫자를 제품 기본값으로 넣지 않는다"
      user_wait: "계획 확인·추가 정보·의도 확인의 응답 시간 분포와 무응답/복귀를 구분해 측정한다. 의도 확인은 실행 승인보다 짧게 설정한다는 기존 의미와 필요한 자료의 보존 기한을 함께 대조한다. 업무 승인 응답 10분·승인 후 호출 시작 5분은 REQ-026 확정값이므로 이 측정으로 조용히 바꾸지 않는다"
      saved_queries: "행 폭·대시보드/위젯 수·동시 사용자·반복 실행·캐시 적중/회수·연속 실패를 변화시켜 조회 지연·메모리·원천 부하·실패율을 측정한다. 목록의 개수 상한과 실제 실행 자원 제한을 구분하고 NFR-004의 원천 지표가 없으면 없다고 남긴다"
      outcome: "입력 후보값·실측 환경·표본 수·정상 사용 차단/자원 초과 반례를 보고 기본값·허용 범위·수정/삭제/실행 적용을 판정한다. 숫자가 없다는 사실을 무제한으로 해석하지 않는다. 최종 보호 설정과 계약이 검증되기 전 해당 기능을 운영 준비 완료로 표시하지 않는다"
      ownership: "의도 확인은 agent가 대기/응답·만료 경합을, portal이 사용자에게 실제 표시된 시각과 복귀 흐름을 검증한다. 저장 자산 개수는 admin·portal이, 저장 조회 실행/캐시는 agent가 측정하며 integration은 원천별 시간/부하 경계를 대조한다. system은 값·버전의 일관성을 담당한다. 측정 결과에 따른 제품 기본값·허용 범위 확정은 사용자 결정으로 기록한다"
      evidence_contract: "후보 설정 묶음·버전, 시험 코드/자료 버전, 원천/공급 경로와 실행 환경, 전체 표본 수·누락/취소 수, 시각 기준·측정 구간, 정상 사용 차단과 부하 초과 사례를 함께 남긴다. 결과가 없는 실행을 0초 성공으로 세거나 접근 불가능한 원천 지표를 정상으로 채우지 않는다. 합성 자료에는 운영 원문·비밀을 넣지 않는다"
      acceptance:
        - "의도 확인은 기한 직전·정확한 경계·직후 응답, 다른 탭 응답, 만료 배치 지연·재접속에서도 서버 시각과 현재 카드 기준으로 한 전이만 성공해야 한다. 의도 확인 동의로 실행 승인을 만들거나 기존 승인 기한을 연장하면 실패다"
        - "저장 자산 개수의 상한 직전·동시 추가·상한 초과·상한 감소를 검수한다. 동시 추가로 상한을 넘기거나 감소만으로 기존 자산을 자동 삭제하면 실패다. 기존 초과 자산의 수정/실행 조건은 소유 P3에서 정한다"
        - "저장 조회는 동시 실행·캐시 만료 직전/직후·권한 회수·노드 이동·실패 후 연타를 검사한다. 캐시가 현재 권한 검사를 우회하거나 영속 업무 원문 사본이 되거나 서버의 실행/재시도 제한을 넘으면 실패다"
        - "미설정·범위 밖·상호 제약 위반·설정 버전 불일치와 시험 전용 설정으로 운영 활성화를 요청하면 거부해야 한다. 유효한 설정과 측정 근거를 갖춘 경우만 활성화할 수 있어야 하며 단순히 전부 거부하는 구현도 통과로 보지 않는다"
      sequencing:
        decision: "2026-10-27 사용자 승인·ADR-029. P2에서 측정 계약을 확정하고 소유 G3 승인 뒤 구현·시험으로 수치를 확정한다. 최초 운영 활성화 전 검수와 미설정 활성화 금지를 필수로 한다. 승인한 다른 초기값과 단계 게이트 조건은 유지한다"
        p2: "측정할 항목·원천·후보 입력·실패 기준과 운영 활성화 전 확인 조건을 확정한다. 실측하지 않은 제품 숫자는 비워 두고 사용자 승인한 다른 초기값과 구분한다"
        p3: "소유 작업흐름의 상세 설계에서 측정 가능한 시험 사례·정상 업무 시나리오·보존/권한 경계·설정 검증과 미설정 표시를 정의한다. 모든 미정 운영값에는 측정 담당과 확정 전 활성화 금지 조건이 있어야 한다"
        implementation: "소유 G3 승인 뒤 구현·계약 시험에서 합성 자료와 명시적 시험 전용 후보값으로 측정한다. 후보값이 제품 기본값이나 고객 운영 프로파일로 자동 반영되지 않게 분리한다"
        activation: "최초 운영 활성화 전 측정 근거로 기본값·허용 범위를 확정하고, 관리자와 실행부가 같은 검증된 설정 프로파일을 사용한다. 미설정/불명 값을 0·무제한으로 바꾸지 않으며 보호 설정이 미완료인 기능은 운영 활성화하지 않는다"
        gate: "소유 G4/G5 검증에서 측정 근거·수치 반영·경계 시험·미설정 차단을 확인한다. 고객 실제 부하는 별도 파일럿에서 다시 검수하고 합성 시험 결과를 그 고객의 성능 보장으로 쓰지 않는다"
      deadline: "@defer 최초 운영 활성화 전 — sequencing에 따라 P3에서 시험·설정 검증을 설계하고 소유 G3 승인 뒤 수치·허용 범위·측정 근거를 확정한다. 수치 확정과 미설정 차단 검수 전 해당 기능의 운영 활성화는 금지한다"
    review:
      - "권장/대안 값 모두 쿼터·권한·기존 승인 기한·개인 한도와 독립적으로 검증한다"
      - "마지막 허용 스텝에서 완료한 작업을 상한 도달만으로 실패시키거나, 더 필요한 호출을 보내고 나서 예산을 검사하면 실패다"
      - "조회 행/시간/크기, 호출 전체/무진전, 점유/갱신/회수, 종료 신호 후 대기와 계획 배출의 단위·적용 경계를 혼동하면 실패다"
