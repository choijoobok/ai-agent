business_extension:
  - id: ARCH-016
    rule: "**빌드 시에 포함한다.** 고객사마다 포함할 확장을 정해 빌드하며 **실행 중 설치·제거 경로는 만들지 않는다**"
    hard_rule: "**의존은 단방향이다** — 확장은 Hub 를 참조하고 **Hub 는 확장을 참조하지 않는다.** 그래서 확장을 넣지 않고 빌드해도 Hub 가 선다"
    why: "제거는 실제로 일어나지 않는다 — SHAPE-02 는 업무 시스템을 **새로 짓는** 자리이고 그것이 고객의 주 목적이다. 없는 수요를 위해 해제 경로·잔여 데이터 정리·메뉴 회수를 설계하면 그 복잡도만 남는다"
    note: "그래서 정확한 표현은 *빼도 선다* 가 아니라 **넣지 않고 빌드해도 선다** 이다"
  - id: ARCH-017
    rule: "**업무 DB 는 업무 확장이 소유한다.** 별도 `DataSource` 이며 Liquibase changelog master 도 AI 전용 DB 와 분리한다"
    hard_rule: "**Hub DB 와 업무 DB 에 걸친 원자적 트랜잭션을 전제하지 않는다** — 둘을 함께 바꾸는 흐름은 보상 처리로 설계한다"
    why: "합치면 업무 시스템의 스키마 수명주기가 Hub 에 묶인다. 업무 시스템이 주인공인 형태에서 그것은 주객이 뒤바뀐 종속이다"
    traces_to: [ARCH-010]

  - id: ARCH-018
    rule: "**업무 확장은 좌측 메뉴 트리에 형제 노드로 자기 메뉴를 기여한다** — 시스템 관리·AI Agent 관리와 나란한 최상위 노드이며, 그에 딸린 프론트·백엔드 소스가 함께 온다"
    requires: "`menu-tree.yaml` → `screenRegistry.ts` → `endpoints.ts` 로 이어지는 **시드 사슬이 확장의 기여를 받을 수 있어야 한다.** 확장을 넣지 않고 빌드하면 그 메뉴·화면·인가 시드도 함께 빠진다"
    why: "**지금 사슬은 Hub 하나만 전제한 정적 구조다.** 굳은 뒤에 바꾸면 시드 생성기·인가 시드·라우팅을 함께 뜯는다 — 셋 중 가장 비싼 자리가 여기다"
    note: "@defer G3 — 사슬의 실제 확장 지점(생성기 입력 형태)은 설계 단계에서 정한다. 여기서 정하는 것은 *그 모양을 받을 수 있게 둔다* 까지다"

