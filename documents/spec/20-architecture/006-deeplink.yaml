deeplink:
  id: ARCH-020
  why: "portal 을 별도 사이트로만 열어두면 사용자는 기존 업무 화면과 Hub 를 계속 오가야 하고, **탐색 비용(PRB-03)이 그대로 남는다.** Hub 가 '또 하나의 시스템' 이 되지 않게 한다"
  rules:
    - "Hub 는 **딥링크 규약과 팝업 호출 스니펫을 제공**한다. 실제 링크·버튼을 레거시 화면에 설치하는 것은 **고객사 선택 사항**이다. 링크 삽입은 레거시의 스키마·기능 변경이 아니므로 PRN-09 에 저촉되지 않는다"
    - "딥링크는 **별 창 팝업으로 portal 채팅 화면을 열고** 파라미터로 초기 문맥을 전달한다 — 진입 화면 식별자·사용자가 보고 있던 대상의 키 값·초기 질의문 또는 예시 질의. 이 문맥은 첫 턴의 컨텍스트에 포함된다"
    - "**레거시 화면 안에 대화창을 삽입하는 방식(iframe 임베드)은 지원하지 않는다** — 삽입 방식은 레거시 화면의 CSS·스크립트와 충돌하고 고객사별 대응이 무한히 늘어난다. 진입 수단은 별 창 팝업 하나로 고정한다"
    - "**딥링크는 인증도 권한도 우회하지 않는다.** 팝업은 Hub 자체 인증을 거치며, 레거시가 전달한 사용자 식별자를 그대로 신뢰하지 않는다. 파라미터로 받은 키 값도 그룹 판정을 그대로 통과해야 한다"
    - "**진입 경로는 컨텍스트의 출처일 뿐 권한의 근거가 아니다**"
    - "**인증을 지나도 진입 문맥을 잃지 않는다.** 세션이 없으면 팝업은 로그인을 거치며, 그 뒤 **원래 문맥이 실린 채팅 화면으로 복귀**해야 한다. **유실되면 빈 채팅창을 열지 않고 무엇이 없는지 알린다** — 빈 창을 열면 사용자는 딥링크가 동작한 줄 알고 대상 없이 질의한다. 이 진입 경로의 값 전부가 *보고 있던 대상이 첫 턴 컨텍스트에 들어간다* 에 있으므로, **문맥을 잃은 딥링크는 새 창 열기와 다르지 않다**"
    - "**문맥의 키 값이 URL 에 머무르지 않게 한다.** 진입 시점에 서버가 문맥을 접수하고 이후로는 **단기 식별자로만 오간다** — 리다이렉트를 지나며 파라미터를 URL 에 계속 실으면 **브라우저 이력 · 중간 장비의 접속 로그(CON-028) · Referer 헤더에 업무 데이터의 키가 남는다.** 마스킹은 본문에만 걸리고 URL 은 그 밖이다"

# ── 화면 영역 · API 경로 · 로그인 진입 ─────────────────────
