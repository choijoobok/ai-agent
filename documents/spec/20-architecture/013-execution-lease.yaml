execution_lease:
  id: ARCH-070
  why: "턴은 상태를 가진 지속 작업이고 agent 는 부하에 따라 스케일 아웃된다. 따라서 **같은 턴을 두 인스턴스가 동시에 처리하는 상황**을 구조적으로 막아야 한다 — 막지 못하면 같은 업무 API 가 두 번 실행되고, 이력이 뒤섞이며, 재개 상태가 서로를 덮어쓴다"
  rules:
    - "사용자 중단은 REQ-007·033의 영속 이벤트와 실행 서버 제어 경로로 전달한다. 동기 호출 중에도 중단을 확인하며 현재 호출·회차·점유에 묶인 취소 수단만 제어한다. DB 조회 취소·전송 후 업무 실행 취소 불가·결과 보고, 참조 해제/재사용과 늦은 취소 방지는 REQ-007이 정본이다. 접수만으로 실행 점유·개인 실행 자리를 해제하거나 외부 호출 종료를 추정하지 않는다"
    - "승인 카드와 실제 호출에 필요한 실행 파라미터 원값은 REQ-005.execution_parameter_storage·ADR-025의 공용 DB 전용 암호화 임시 테이블을 사용한다. agent가 소유하며 일반 체크포인트에는 참조를 연결한다. 로그인 세션 수명과 독립적으로 승인 대상·버전·현재 권한·기한을 검사하고, 원값 조회 성공을 점유·승인·전송 방어의 대체 근거로 쓰지 않는다. 목적 종료·중단·만료·무효화 시 사용 차단·삭제는 REQ-005를 따른다"
    - "조회 결과의 공용 DB 사본은 REQ-107.retention_policy 및 ADR-024의 양의 유한 기한을 따른다. 턴/스텝 현재 상태와 불변 사건의 저장은 REQ-107.history_storage, 완료·실패·중단 후 실행용 체크포인트 정리는 REQ-109를 따르며 결과 사본을 함께 삭제하지 않는다. 다중 인스턴스가 결과 참조를 공유하되 접근 권한과 현재 시도·점유를 검증하며 세션 메모리나 Redis만을 결과의 유일한 저장소로 삼지 않는다"
    - "**한 턴은 한 시점에 한 인스턴스만 처리한다.** 이 보장은 인스턴스 간에 성립해야 하며 **동일한 구조를 워크플로우 잡에도 적용한다**"
    - "**점유는 AI 전용 DB 의 조건부 갱신으로 구현한다.** 분산 락 서버·메시지 브로커 같은 별도 코디네이터를 도입하지 않는다 — 폐쇄망 운영 구성요소를 늘리지 않기 위함이며, 별도 벡터 DB 를 두지 않기로 한 것과 같은 이유다. **Redis 는 화면 세션 저장소의 선택지일 뿐 점유의 근거로 삼지 않는다**"
    - "**점유는 스텝을 실제로 진행하는 동안에만 유지한다.** 사용자대기로 전이하면 점유를 놓는다 — 대기는 수 분 이상 이어질 수 있고 사용자의 승인·추가 입력이 다른 인스턴스로 도착할 수 있다"
    - "**점유에는 만료 시각을 둔다.** 인스턴스가 죽으면 만료로 회수된다. **점유가 만료된 원 턴은 중단으로 종결하고 다시 획득하거나 실행하지 않는다.** 원 질의의 새 턴 요청과 유효한 사용자대기 이어가기의 경계는 REQ-013.request_boundary를 따른다"
    - "**중단된 시도의 실행용 재개 상태는 다시 쓰지 않는다.** 만료 회수·사용자 중단·완료·실패에 따른 무효화와 정리는 REQ-109를 따른다. 물리 정리 지연 중에도 실행 입력에서 제외하고, 원 질의·감사 이력의 보존과 분리한다. 새 시도 접수는 REQ-013·REQ-036의 개인 한도·접수·시작 조건을 확인한다"
    - "**사용자대기 응답은 만료 배치와 별개로 검증한다.** 현재 시도·대기 요청·유형과 서버 기준 미만료 조건을 같은 상태 전이에서 확인한다. 이전 카드·만료 응답은 새 시도를 승인하거나 진행시키지 못하며, 중단·종결 뒤 늦게 온 결과도 처리를 되살리지 못한다(03-glossary state_rules)"
    - "**점유가 바뀔 때마다 증가하는 점유 토큰을 둔다.** 프로세스 정지·시각 오차로 점유를 잃은 줄 모르는 인스턴스의 뒤늦은 쓰기를 새 점유자의 토큰과 대조해 무효화한다"
    - "**점유를 잃은 인스턴스는 어떤 상태 전이도 하지 않고 처리를 포기한다.** 실패로 기록하는 것조차 하지 않는다 — 그 턴은 이미 다른 인스턴스의 것이고, 상태를 쓰면 새 점유자의 처리와 충돌한다"
    - "**감사 이력의 기록은 점유로 막지 않는다.** 기록 누락은 처리 실패이므로 점유 여부와 무관하게 남기고, 대신 이력에 **점유 토큰을 함께 남겨** 어느 점유 구간의 기록인지 사후에 판별한다"
    - "점유 유지 시간·갱신 주기·만료 회수 배치의 주기는 코드에 박지 않고 **운영 설정으로 관리한다**"
    - "**점유의 단위는 턴 하나다.** 서로 다른 세션·턴이 같은 대상에 같은 액션을 내는 것은 이 정책의 범위 밖이다"
    - "**정상 종료는 스텝 경계에서 끊는다.** 종료 신호를 받으면 ① 새 턴 접수를 멈추고 ② 진행 중 스텝이 끝나면 **다음 스텝을 시작하지 않고** ③ 중단 상태로 전이하며 점유를 놓는다. 새 메커니즘을 만들지 않고 ADR-001 이 고른 런타임의 **중단 확인 지점**을 그대로 쓴다"
    - "**정상 종료 중의 상태 전이는 허용된다.** 위 ③ 은 `점유를 잃은 인스턴스는 어떤 상태 전이도 하지 않는다` 와 충돌하지 않는다 — 그 규칙은 점유를 **잃은** 경우이고, 종료 중인 인스턴스는 아직 **유효한 점유를 쥐고 있어** 전이할 자격이 있다. 이 구분을 적지 않으면 구현이 만료 회수에 떠넘긴다"
    - "**종료 신호 후 드레인 상한은 5분이며 운영 설정으로 관리한다.** 그 안에 스텝이 끝나지 않으면 더 기다리지 않고 종료하고, 그 턴은 점유 만료 회수에 맡긴다. 이미 시작한 프로세스 종료의 유예를 스텝 단위로 제한하는 규칙이다. 종료 신호 전의 계획 배출·장기 작업으로 인한 배포 보류는 아래 planned_rollout을 따른다"
    - "**사용자대기 턴은 드레인 대상이 아니다.** 점유를 이미 놓았으므로 배포를 붙잡지 않고, 재기동 뒤 다른 인스턴스가 이어받는다. **중단시키지 않는다** — 사용자가 승인하려던 턴을 이유 없이 잃는다"
    - "**예외는 계약 주 버전 전환뿐이다.** 이때는 구 계약으로 접수된 턴을 진행 중·사용자대기 가릴 것 없이 중단으로 전이한다 — ARCH-019 가 portal 을 재접속시키므로 신 계약 화면이 구 계약 턴을 이어받을 수 없다. 접수 당시 계약 버전은 PRC-05-03 이 턴에 기록해 둔다"
  planned_rollout:
    basis: "ADR-028 — 종료 신호 전의 계획 배출을 종료 신호 후 처리와 구분한다"
    admission: "대상 노드의 새 작업 획득·사용자대기 재개·예약/백그라운드 배정을 닫되 이미 실행을 맡은 작업의 다음 스텝·점유 갱신·중단 입력·결과/사용량 저장은 유지한다. 배출 전 접수한 메모리 큐의 고정 목록을 원 노드에서 마치는 범위와 신규 접수는 ARCH-028.deployment_contract.control_design에서 구분한다. 신규 배정 차단과 완료 판정의 경합을 제어한다"
    completion: "맡은 실행의 정상 완료와 종료 기록을 확인한 뒤 재기동한다. 장기 작업이 남으면 다른 노드 서비스를 유지하며 배포를 보류한다. 위 종료 신호 후 드레인 상한을 계획 배출의 자동 강제 종료 시간으로 적용하지 않는다"
    waiting: "유효 사용자대기는 배출 완료를 붙잡지 않고 가용 노드가 현재 권한·개인 한도·단일 점유·고정 구성 호환성을 확인해 이어받는다. 미시작 작업 인계는 영속 접수·중복 방지 계약이 있는 경로에 한한다. 만료 점유·종결 턴을 새로 실행하지 않는다"
    failure: "노드 장애·강제/긴급 종료는 기존 종료·점유 만료·결과 불명 규칙을 따른다. 계획 배포가 이 종료 규칙을 없애거나 실제 실행 종료를 추정하는 근거가 되지 않는다"
  limits:
    claim: "**이 정책이 exactly-once 실행을 보장하지는 않는다**"
    detail: "프로세스 정지와 시각 오차뿐 아니라 **도구 실행 중 갱신하지 못하는 시간이 점유 유지 시간을 넘는 경우**에도 정상 처리 중 회수와 중복 실행 위험이 남는다. 본문 갱신이 없는 일반 도구는 API 타임아웃·허용 재시도·백오프·정리와 여유를 점유 유지 안에 수용한다. 긴 API는 검증된 독립 갱신 경로를 사용하고 실제 갱신 불가 구간을 제한하며 개별 호출 기한은 그대로 집행한다. ARCH-033.technical_parameters.lease_validation이 두 모드의 검수 조건을 갖는다. **어느 쪽도 exactly-once 를 약속하지 않는다**"
    complement: "**비가역 액션의 이중 실행은 점유만으로 막지 않는다.** REQ-013.execution_boundary의 이전 실행 재전송 제한·결과 확인과 새 계획의 명시 승인을 함께 적용한다. `action_executed`는 호출 응답이 아니라 호출 직전에 기록한다. 응답을 기다렸다가 기록하면 점유 회수 뒤 값이 거짓으로 남아 이전 실행이 미전송됐다고 오인하고 같은 액션을 다시 낼 수 있다. 과거 전송 사실만으로 원 질의의 새 턴 접수 자체를 막지는 않는다"
  timing_contract:
    basis: "2026-10-27 미구현 P2 기술 계약 보완. 기존 documents/design/turn-execution.md의 긴 API 독립 갱신 대안을 정본의 검증 조건으로 구체화했다. 초기 수치와 변경 적용은 ARCH-033.technical_parameters에 두며 현재 소스의 동작이나 운영 실측 결과가 아니다"
    valid_renewal: "점유는 소유자·토큰·상태뿐 아니라 DB 판정 시각에서 미만료일 때만 조건부 갱신한다. 회수 배치가 아직 돌지 않았어도 만료된 점유를 갱신·재획득하거나 실행 상태/체크포인트를 쓰거나 후속 호출을 보내지 못한다. 점유 상실 뒤 감사 기록 허용은 유지한다"
    independent_control: "모델과 검증된 긴 API의 제어 경로는 해당 시도·점유·호출에 묶인 갱신·중단/기한 확인을 수행한다. 제어의 생존을 업무 진전으로 보지 않고 호출 기한·정체 제한을 연장하지 않는다. 호출/점유 종료 뒤 이전 갱신 작업은 새 호출을 제어하지 못한다"
    ownership: "agent가 획득/갱신/쓰기·후속 전송의 경합을, integration이 호출/제어 실행부·연결·프로세스 정지와 배포 환경을 검증한다. 갱신 시점 시각과 원자적 저장 경계의 물리 구현은 각 소유 P3에서 설계한다"
