identity:
  id: ARCH-050
  account_source:
    - "사용자·조직·권한의 원천은 **레거시 시스템의 SSO·계정 연동을 기본**으로 한다 — 사용자 정보를 이중 관리하지 않기 위함이다"
    - "연동 수단이 없는 고객사를 위해 **자체 계정 모드**를 병행 제공한다"
    - "어느 모드이든 사용자 그룹·그룹 매핑·쿼터 등급 같은 AI 시스템 고유 권한은 admin 에서 관리한다. **레거시 권한을 그대로 상속하지 않는다**"
  trusted_subsystem:
    claim: "**레거시 호출은 trusted subsystem 모델을 따른다**"
    detail: "API 인증은 REQ-604의 등록 연결 방식과 REQ-608의 신원 전달 계약을 따른다. 인증이 필요한 API에는 시스템 단위 연동 계정을 사용하며, 실사용자 신원은 계약이 요구하는 위치에 서버가 검증된 매핑 식별자로 주입한다. 명시 등록·공동 검수된 인증 없음 연결도 허용하지만, Hub의 현재 그룹·권한·응답 개인정보 통제는 동일하게 집행한다. 인증 없음은 누락된 자격증명을 보완하는 폴백이 아니다"
    forbidden: "**사용자 개인의 레거시 비밀번호를 Hub 가 저장·사용하는 방식은 금지한다** — 전 직원의 타 시스템 비밀번호를 한곳에 모으는 구조가 되기 때문이다. 서비스 계정 발급이 불가능하고 사용자별 인증만 지원하는 레거시 API 는 연동 대상에서 제외하거나 고객사가 어댑터·계정을 마련한다"
    risk: "연동 계정이 유출되면 신원 매개변수를 악용할 수 있으므로 자격증명·호출 대역을 보호한다. 인증 없는 연결은 대상 API가 제공하는 실제 신원 검증·접근 제한 범위를 공동 검수에서 확인하며, Hub의 신원 주입만으로 대상 시스템이 호출자를 인증했다고 간주하지 않는다"
  mapping_rules:
    - "매핑은 **시스템/데이터소스별 기본 규칙**(Hub ID 그대로, 또는 변환 패턴)을 두고 다른 사용자만 개별 오버라이드한다 — 대부분의 고객사는 사번이 통일되어 있어 전 조합의 수기 입력은 낭비다"
    - "**SSO 모드여도 이 매핑은 필요하다** — SSO 는 Hub 로그인을 해결할 뿐, 각 시스템 내부의 사용자 키가 같다는 보장이 아니다"
    - "**행 스코프 조인의 바인딩 값도 같은 매핑을 쓴다**"
    - "**신원 매핑은 곧 사칭 능력이다.** 잘못 매핑하면 남의 권한으로 레거시 데이터에 접근한다. 매핑 부여·ID 변경의 승인과 제거 절차는 REQ-609를 따르고 정책 변경 이력에 남긴다. 인사 데이터 원천의 대량 등록·동기화는 입력 경로이며 부여 승인 면제가 아니다"
    - "**승인된 활성 사용자-대상 매핑이 없으면 닫힌다.** 요청 상태의 매핑은 사용하지 않는다. 신원 파라미터가 필요한 API 는 호출을 거부하고, 행 스코프 규칙이 걸린 테이블은 조회를 거부한다. **NULL 바인딩으로 조용히 0건을 반환하지 않고 사유를 알리며 거부한다**"
  change_events:
    claim: "**인사·조직 변경은 수신 인터페이스로 전파받는다**"
    why: "퇴직·조직 이동이 발생했는데 Hub 의 그룹 소속이 방치되면 **권한이 누적된다**"
    handling: "퇴직 → **사용자 비활성화** / 조직 이동 → **일시 비활성화 후 관리자 통보**, 관리자가 인사팀 확인을 거쳐 그룹을 재부여한다"

# ── 지식 검색 구성 ──────────────────────────────────────────
