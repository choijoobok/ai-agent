    exception_flows:
      - { id: E1, condition: "게시 또는 팝업 기간 밖", flow: ["사용자 팝업에 노출하지 않는다"] }
      - { id: E2, condition: "종결 요청 재처리 또는 실제 권한 변경 동반", flow: ["판정만 기록하고 계정·권한은 바꾸지 않는다"] }
    postcondition: "공지 노출과 요청 판정·알림이 추적되며 권한 변경과 분리된다"
    business_rules: ["요청 승인은 권한 부여가 아니다", "알림함은 수신자 자신의 행만 읽는다"]

  - id: UC-510
    name: "모듈 공통 사용자 상태를 한 곳에서 유지한다"
    workstream: system
    reqs: [REQ-510]
    actors: { primary: ACT-001, secondary: [ACT-012] }
