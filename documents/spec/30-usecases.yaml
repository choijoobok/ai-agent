    precondition: "사용자가 로그인했고 대상 메뉴가 등록되어 있다"
    trigger: "즐겨찾기·그리드 설정·조회조건·메뉴 통계를 읽거나 저장한다"
    main_flow: ["호출 모듈이 system 공개 계약을 부른다", "세션 사용자와 상태 소유자를 대조한다", "사용자·메뉴 키로 상태를 읽거나 갱신한다", "메뉴 선택을 월별 통계에 원자적으로 누적한다", "모든 화면 영역에 같은 값을 반환한다"]
    alternative_flows:
