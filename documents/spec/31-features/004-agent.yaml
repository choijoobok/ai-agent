features:
# ══ agent — 백엔드 (10.5) ════════════════════════════════════════
# 화면을 갖지 않는다. 상세 흐름은 documents/design/ 이 갖는다.
  - id: FEAT-201
    module: agent
    roadmap: RM-P1
    title: "질의 처리 오케스트레이션 (턴·스텝 관리)"
    detail: "REQ-038의 유형·후보 범위·실행 순서와 복합 작업의 부분 실패 처리를 적용한다. 최종 실패 시 독립 작업도 새로 시작하지 않고 처리 내역을 구분해 사용자에게 계속 여부를 확인하며 재요청·재승인은 기존 수명주기 규칙을 따른다"
    reqs: [REQ-004, REQ-009, REQ-010, REQ-015, REQ-038]
  - id: FEAT-202
    module: agent
    roadmap: RM-P1
    title: "컨텍스트 구성과 총량 관리"
    catalog_union: "REQ-303의 지식 직접 카탈로그와 연결된 사용 가능 예제의 카탈로그를 중복 제거해 후보 범위로 합산한다. 매핑 복사 없이 승인된 참조 버전을 사용하며 예제의 필수 참조 일부를 제외한 불완전한 주입은 금지한다. 합산 뒤에도 기존 질의 관련성·컬럼 프루닝·상한을 적용한다"
    detail: "과거 턴 참조 · 데이터소스 → 공개 인터페이스 → 컬럼 순의 단계적 범위 축소와 컬럼 프루닝 · 활성 반영 세트의 지식·인증 예제 주입 판정과 참조 인터페이스 합류 · 값 도메인·의미 유형·권장 조인 경로 주입과 주입 상한 · REQ-611의 기본 필터 명세를 허용된 카탈로그와 함께 제공 · 주입 지식의 안정 식별자·리비전·검토 필요 상태를 감사 이력에 전달하고, 하나라도 검토 필요이면 응답 계약에 경고 여부를 표시 업무 API·커스텀 도구 후보는 REQ-303·REQ-608·REQ-612의 지식 연결과 현재 권한·활성·검증 경계를 따른다. 유효 매핑의 용도·사용 조건을 도구와 함께 전달하고 설명의 지식·매핑 출처를 보존한다."
    reqs: [REQ-002, REQ-003, REQ-021, REQ-303, REQ-306, REQ-611]
    traces_to: [AUTHZ-040]
  - id: FEAT-203
    module: agent
    roadmap: RM-P1
    title: "도구 레지스트리와 도구 호출 처리"
    detail: "등록 REST 업무 API와 **Hub 내부 서비스 빈 기반 커스텀 도구를 같은 레지스트리·권한·승인·감사 흐름으로 호출**한다. 커스텀 도구의 데이터 범위·마스킹은 도구 구현이 선언한 계약으로 별도 강제한다 업무 질의의 후보 범위는 REQ-303·REQ-608·REQ-612의 지식 연결을 기준으로 하며 후보 구성과 호출 시 현재 유효 조건을 확인한다."
    reqs: [REQ-004, REQ-114, REQ-303, REQ-608, REQ-612]
  - id: FEAT-204
    module: agent
    roadmap: RM-P1
    title: "SQL 검증·정책 적용·실행"
    detail: "파서로 구문 검증 · 선언된 데이터소스의 카탈로그와 참조 객체 대조 검증(테이블·컬럼 단위) · 대조 실패 및 DBMS가 확인한 구문 오류의 중립 피드백 반환과 재작성 · DBMS 종류·실행 단계·Spring 변환 예외·근본 SQL 오류 코드 기반 실패 분류 · REQ-611의 기본 필터 제외 명세 검증과 모든 행 스코프/남은 기본 필터 주입 · 참조별 적용 완전성·조회 의미·업무 조건 출처 검증 및 적용/제외 이력 · 원본 컬럼 추적. LLM 조회 도구 호출과 저장 조회의 복원 요청은 REQ-207의 같은 검증·정책 적용·실행 경로를 사용한다"
    reqs: [REQ-037, REQ-103, REQ-207, REQ-611]
    traces_to: [AUTHZ-030, AUTHZ-050]
  - id: FEAT-205
    module: agent
    roadmap: RM-P1
    title: "업무 API 호출 (조회·실행)"
    detail: "**연속 실행의 순차 처리와 실패 시 중단·보고** · 타임아웃 재시도 가능으로 등록된 호출의 **최대 한 번 자동 재시도**와 `TIMEOUT_RETRYING` 시도 이력 기록 · 자동 재시도 소진 뒤 안전한 호출의 중단 전이와 수동 재시도 · 대상 실행 결과 불명 시 직접 재시도 차단과 등록된 결과 확인 · 결과 확인 API가 없거나 확인 실패면 대상 시스템 수동 확인 안내 · 결과가 처리 중이면 자동 폴링하지 않고 권장 재확인 시간을 안내 · 부분 실행 상태 판정 · **응답 수신 직후의 경로 분류와 마스킹 사본 분리** — 감사·재개 상태·로그로는 마스킹본만 내보내고 평문은 사용자 응답 경로와 REQ-106의 요청·동의 전송 경로에만 태운다 · 미지정 경로 경고 기록"
    reqs: [REQ-026, REQ-105, REQ-111]
    nfrs: [NFR-022]
  - id: FEAT-206
    module: agent
    roadmap: RM-P1
    title: "지식 검색"
    detail: "질의 키워드 추출 · 태그 검색 + 설정 시 벡터 검색 · 결과 병합. 활성 반영 세트의 지식 리비전만 검색한다"
    reqs: [REQ-303, REQ-305, REQ-306]
    traces_to: [ARCH-060]
    nfrs: [NFR-021]
  - id: FEAT-207
    module: agent
    roadmap: RM-P1
    title: "정책 집행"
    detail: "REQ-101의 경로별 업무 연관성·비업무 추정 표식 · 그룹 판정 · 마스킹 · REQ-106의 요청·동의 범위와 전송 제한"
    reqs: [REQ-101, REQ-102, REQ-103, REQ-106, REQ-025]
  - id: FEAT-208
    module: agent
    roadmap: RM-P1
    title: "결과 후처리 (집계 · 차트 데이터)"
    detail: "DB 또는 agent의 결정적 집계·정렬·필터·차트 계열 추출을 먼저 수행하고, **엑셀·이미지 파일 생성은 하지 않는다** — 클라이언트 컴포넌트의 기능으로 제공한다. REQ-011에 따라 결과 필드 타입·코드명/가공 의미·원천/반출 정책 참조를 유지해 portal 표현 계약으로 전달한다. LLM 처리는 REQ-039·106의 사용자 요청·동의 범위와 접근·마스킹·상한을 적용하고 직접 입력/기존 결과 출처·실제 전송을 감사한다"
    reqs: [REQ-011, REQ-039]
  - id: FEAT-209
    module: agent
    roadmap: RM-P1
    title: "LLM 공급 경로 추상화 및 전환"
    detail: "**역할별 모델 선택 적용과 실행 시도별 고정 — 중단 후 새 시도의 모델 변경은 ARCH-040을 따른다**"
    reqs: [REQ-034]
    traces_to: [ARCH-040, PRN-01, PRN-05]
    nfrs: [NFR-020]
  - id: FEAT-210
    module: agent
    roadmap: RM-P1
    title: "이력 기록"
    detail: "REQ-107의 요청/실제 처리 유형·자료 출처·업무 연관성/비업무 추정·동의와 실제 전송·검토 이력을 연결한다. 전달 프롬프트와 함께 주입 지식의 안정 식별자·리비전·지식 검토 필요 상태, 응답의 검토 필요 자산 사용 여부를 기록한다"
    reqs: [REQ-107, REQ-108]
  - id: FEAT-211
    module: agent
    roadmap: RM-P1
    title: "토큰·비용 집계와 쿼터 집행"
    reqs: []
    nfrs: [NFR-010, NFR-012, NFR-013, NFR-014]
  - id: FEAT-212
    module: agent
    roadmap: RM-P3
    title: "워크플로우 정의 실행"
    reqs: [REQ-207]
  - id: FEAT-213
    module: agent
    roadmap: RM-P3
    title: "스케줄러 (주기·조건 실행, 잡 관리)"
    reqs: []
    nfrs: [NFR-024, NFR-025]
  - id: FEAT-214
    module: agent
    roadmap: RM-P3
    title: "알림 발송 (메일 등)"
    reqs: [REQ-401]
  - id: FEAT-215
    module: agent
    roadmap: RM-P1
    title: "portal 채팅 인터페이스"
    detail: "질의 접수 · 개인별 동시 턴 제한·사용자별 순서 대기/취소와 요청·상태 영속 저장 · REQ-006의 현재 상태와 일치하는 공개 처리 이력·최신 유효 진행·누적 수행 내역·작업별 시간·전체 페이지에 걸친 공개 허용 턴 합계·서버 시간 기준 전달 · REQ-019의 안정된 턴 순서·과거 조회 경계/끝·보존/권한 선별과 REQ-040의 기존 대화/미종결 요약·현재 유효 카드/조작 조회 및 제출 시 재검사 · REQ-011의 공식 내보내기 정책/상한·필수 감사·결과 보고 계약 · 중단·재시도 처리"
    reqs: [REQ-006, REQ-007, REQ-011, REQ-013, REQ-019, REQ-036, REQ-040]
    traces_to: [ARCH-015]
  - id: FEAT-216
    module: agent
    roadmap: RM-P1
    title: "턴 상태 관리와 재개 처리"
    detail: "중단·변경 입력 이벤트의 순서 보존과 **변경·별개·중단 분류 및 무효화 시작 단계 판정** · 실행 점유의 획득·갱신·해제와 만료 턴 회수 · 사용자별 대기 순서 선택·개인 한도·시작 조건 확인 후 자동 실행 · 유효 대기 응답의 이어가기와 중단 후 새 시도 접수 구분(REQ-013) · 중단·종결·회차 무효화 시 실행용 재개 상태 사용 차단·정리와 감사 보존 분리(REQ-109)"
    reqs: [REQ-013, REQ-016, REQ-030, REQ-031, REQ-032, REQ-033, REQ-035, REQ-036, REQ-040, REQ-109]
    traces_to: [ARCH-070]
  - id: FEAT-217
    module: agent
    roadmap: RM-P1
    title: "공개 데이터 인터페이스 변화 보조 감지"
    detail: "고객사 DB/DW 변경 통지를 처리하고, 선택 기능으로 카탈로그에 등록된 **공개 뷰·테이블**과 저장된 조회·인증 예제 쿼리·지식의 참조 객체에 구조 변화 후보를 표시한다. 업무 DB/DW 전체를 순회·대사하거나 결과로 카탈로그를 자동 변경하지 않는다"
    reqs: [REQ-304, REQ-204]
  - id: FEAT-218
    module: agent
    roadmap: RM-P1
    title: "조회 계획 생성·제시와 사용자 교정 반영"
    detail: "업무 명칭 기반 변환 · 강제 조건 판정"
    reqs: [REQ-022, REQ-023]
  - id: FEAT-219
    module: agent
    roadmap: RM-P1
    title: "인증 예제 쿼리 매칭과 파라미터 채움 실행"
    detail: "직접 실행 경로. **SQL 통제 4단계를 그대로 적용한다**"
    reqs: [REQ-302]
  - id: FEAT-220
    module: agent
    roadmap: RM-P1
    title: "저장된 조회 실행"
    detail: "REQ-202의 저장 실행 요청을 같은 조회 도구 계약의 agent 입력으로 복원하고 파라미터를 바인딩해 FEAT-204의 공통 검증·정책 적용·실행 경로로 전달한다(REQ-207). 계약·제외 명세 유실 시 SQL 직접 실행으로 우회하지 않는다. 턴·모델 호출 없이 현재 권한·필터를 판정하고 새 실행/실패 이력을 남긴다. 재시도 제한·복구는 REQ-204를 따른다"
    reqs: [REQ-201, REQ-202, REQ-207]
    nfrs: [NFR-005]
  - id: FEAT-221
    module: agent
    roadmap: RM-P1
    title: "공개 카탈로그 사실 보조 수집"
    detail: "이미 선택·등록된 공개 뷰·테이블에 한해 권한이 있을 때 컬럼 목록·타입·PK·유니크·NOT NULL과 DB 코멘트를 수집하고 인라인 값 후보를 제안한다. 의미·정책 항목을 덮지 않고 변경 알림만 남기며, 원본 DB/DW 전체를 수집하지 않는다"
    reqs: [REQ-301]
