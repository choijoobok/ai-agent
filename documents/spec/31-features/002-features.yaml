features:
# ══ admin — 시스템 관리 (10.1) ═══════════════════════════════════
  - id: FEAT-001
    module: admin
    screen: SCR-001
    roadmap: RM-P2
    title: "대상 시스템 등록·관리"
    detail: "적용 가능 그룹 목록을 두어 API 그룹 매핑의 어휘를 제약한다"
    reqs: [REQ-105]
  - id: FEAT-002
    module: admin
    screen: SCR-002
    roadmap: RM-P1
    title: "데이터소스 관리"
    detail: "yml 설정의 데이터소스 ID 목록을 화면 진입 시 실시간 조회해 제시하고, 각 ID 에 **별칭·DBMS 종류·사용 파서·유형(운영 DB / DW)·시각 체계·적용 가능 사용자 그룹 목록**을 매핑해 데이터소스 레코드로 등록한다"
    hard_rule: "**접속 정보는 관리·표시 대상이 아니다**"
    states: "세 상태를 구분해 보여준다 — ① 미등록 yml ID(등록 후보) ② 정상 ③ **끊긴 연결**(참조하는 yml ID 가 현재 설정에 없음)"
    reqs: [REQ-103]
    traces_to: [ARCH-030]
  - id: FEAT-003
    module: admin
    screen: SCR-003
    roadmap: RM-P1
    title: "스키마 카탈로그 관리"
    detail: "업무 DB/DW 전체가 아닌 **Hub 공개 대상으로 선택한 뷰·테이블**만 관리한다. 속성을 스키마 사실 / 업무 의미로 구분해 다루며, 등록 공개 객체의 사실은 권한이 있을 때 보조적으로 수집·비교할 수 있고 의미는 수기 등록·검수 대상이다. 자동 수집이 의미·정책을 덮지 않는다"
    table_level: "귀속 데이터소스 · DB 스키마 · 객체명 · 객체 유형(TABLE/VIEW) · 공개 여부 · 업무 명칭·설명. `(데이터소스, DB 스키마, 객체명)` 유니크 제약, **대상 시스템 귀속 없음**"
    column_facts: "컬럼명 · 데이터 타입 · PK·유니크 키 여부 · NOT NULL 여부"
    column_meaning: "업무 명칭·설명 · **의미 유형**(날짜(형식)·일시·금액·수량·플래그·코드·식별자·자유 텍스트) · **값 도메인**(공통코드 그룹 참조 / 인라인 열거(값+의미) / 없음 중 하나)"
    why_value_domain: "**LLM 이 실존하지 않는 값으로 조건을 만드는 것을 막기 위해** 컨텍스트에 값·명칭을 함께 주입하는 근거가 된다"
    not_managed: "기본값(DEFAULT)·컬럼 길이·인덱스는 관리하지 않는다 — 조회 판단에 쓰이지 않거나 갱신되지 않아 틀린 정보가 된다"
    includes: "고객사 DB/DW 변경 근거에 대한 **공개 범위 영향 검수** · 등록 공개 객체의 구조 변화 후보 확인(선택 기능) · DB 코멘트 초안 제안과 검수 상태 · 인라인 값 후보 제안(값 샘플링) · 조회 빈도 상위 중 메타데이터 미완성 목록"
    hard_rule: "**업무 명칭·설명은 등록 필수 항목**이며 미기재 항목은 미완성으로 표시한다"
    reqs: [REQ-301, REQ-304]
    traces_to: [PRN-10]
  - id: FEAT-004
    module: admin
    screen: SCR-004
    roadmap: RM-P2
    title: "업무 API 목록 등록·관리"
    detail: "대상 시스템 귀속 · **유형(조회/실행)** · HTTP 메서드·경로 · **인증 방식과 yml 자격증명 참조 키**(자격증명 값은 화면에서 관리하지 않는다) · **신원 파라미터 필요 여부와 전달 위치** · 파라미터 명세 · **타임아웃·재시도 정책·멱등성 여부**"
    response_schema: "**응답 스키마와 경로별 속성 등록** — 경로별 의미 유형 · 마스킹 대상 여부 · 정보주체 식별자 여부 · LLM 전송 허용"
    hard_rule: "**허용목록이며 미등록 경로는 닫힘.** 응답에 나타난 미지정 경로의 경고 목록을 포함한다"
    reqs: [REQ-105, REQ-111, REQ-113]
  - id: FEAT-005
    module: admin
    screen: SCR-005
    roadmap: RM-P1
    title: "사용자·조직 관리"
    detail: "**활성/비활성 상태 포함** · **사용자 ↔ 그룹 매핑**(N:N) · **쿼터 등급 부여**(사용자 단위 1개) · **신원 매핑 관리**(시스템·데이터소스별 기본 규칙 + 사용자별 오버라이드, 대량 등록·동기화) · 사용자별 소속 그룹·접근 범위 현황 확인 · **변경 이벤트로 비활성화된 사용자의 그룹 재부여 처리**"
    reqs: [REQ-103]
    traces_to: [ARCH-050]
  - id: FEAT-006
    module: admin
    screen: SCR-006
    roadmap: RM-P1
    title: "사용자 그룹 정의 관리"
    detail: "전역 그룹의 생성·수정, **사용 중인 그룹의 삭제 차단**"
    reqs: [REQ-103]
    traces_to: [AUTHZ-001]
  - id: FEAT-007
    module: admin
    screen: SCR-007
    roadmap: RM-P1
    title: "카탈로그 그룹 매핑 관리"
    detail: "테이블별 접근 허용 그룹 · 컬럼별 예외 매핑과 모드(허용/마스킹) · **마스킹 값 변환 규칙**"
    hard_rule: "**변환 규칙은 API 응답 경로의 마스킹에도 그대로 쓴다** — 원천을 하나로 둔다"
    reqs: [REQ-103, REQ-111]
    traces_to: [AUTHZ-011, AUTHZ-012]
  - id: FEAT-008
    module: admin
    screen: SCR-008
    roadmap: RM-P2
    title: "API 그룹 매핑 관리"
    detail: "대상 시스템별 적용 가능 그룹 · API 별 호출 허용 그룹 · 위험 등급·승인 강제 설정 · **응답 경로별 열람 모드(허용/마스킹)의 그룹 매핑**"
    reqs: [REQ-105, REQ-111]
    traces_to: [AUTHZ-014, AUTHZ-015]
  - id: FEAT-009
    module: admin
    screen: SCR-009
    roadmap: RM-P1
    title: "행 스코프 주입 규칙 설정"
    detail: "테이블당 0..1개로, **어느 권한 정보 테이블·컬럼과 조인·서브쿼리할지, 사용자 식별자를 어떻게 바인딩할지** 정의한다. 사용자별 스코프 값은 레거시 DB 의 권한 데이터를 그대로 사용한다"
    hard_rule: "기본 필터와 같은 구조이나 **목적이 다르므로 규칙을 합치지 않는다**"
    reqs: [REQ-103]
    traces_to: [AUTHZ-020]
  - id: FEAT-010
    module: admin
    screen: SCR-014
    roadmap: RM-P1
    title: "채팅 도움말·주의사항 관리"
    detail: "사용 안내 · 예시 질의 · 제약 사항. portal 의 도움말로 노출된다"
    reqs: [REQ-101]
  - id: FEAT-011
    module: admin
    screen: SCR-003
    roadmap: RM-P1
    title: "권장 조인 경로 관리"
    detail: "테이블 간 조인 컬럼 쌍과 카디널리티(1:1 / 1:N) 등록"
    why: "**FK 가 없는 레거시에서 LLM 의 조인 추측 오류를 막는 근거다.** 1:N 조인 뒤 집계가 부풀려지는 오류를 막고 DISTINCT 필요 판단에도 쓰인다"
    reqs: [REQ-301]
  - id: FEAT-012
    module: admin
    screen: SCR-003
    roadmap: RM-P1
    title: "기본 필터 규칙 관리"
    detail: "테이블당 0..1개로, 강제 주입할 조건과 **해제 허용 여부**를 설정한다"
    reqs: [REQ-103]
    traces_to: [AUTHZ-050]

# ══ admin — AI 관리 (10.2) ═══════════════════════════════════════
  - id: FEAT-013
    module: admin
    screen: SCR-013
    roadmap: RM-P1
    title: "프롬프트 규칙 관리"
    detail: "실시간 반영"
    reqs: [REQ-101, REQ-112]
    traces_to: [PRN-06]
  - id: FEAT-014
    module: admin
    screen: SCR-011
    roadmap: RM-P1
    title: "지식 관리"
    detail: "안정 지식 식별자 아래 후보 리비전을 만들고, 등록·수정·삭제의 사유·근거를 기록한다. 태그·동의어 부여(외국어 표현 포함) · **참조 공개 인터페이스 링크(0..N)** · 본문 검수(물리명·SQL 감지 시 링크·예제 쿼리 등록으로 유도) · 고객사 정책상 필요한 외부 테스트·감수 근거를 포함한 반영 세트 작성 · 최종 책임자 승인 뒤 세트 일괄 활성화 · 지식 본문 임베딩과 전체 재임베딩을 제공한다"
    hard_rule: "승인 전·반려된 지식 리비전과 반영 세트는 검색·컨텍스트 주입에 쓰지 않는다. 활성 리비전을 직접 고치지 않으며, 세트의 일부만 활성화하지 않는다. 활성 상태 변경은 사유·근거·요청자·확인자를 남긴다"
    reqs: [REQ-303, REQ-305, REQ-306, REQ-020]
    traces_to: [ARCH-060, AUTHZ-040]
  - id: FEAT-015
    module: admin
    screen: SCR-015
    roadmap: RM-P1
    title: "외부 모델 관리"
    detail: "**공급 경로**·모델·effort · **임베딩 사용 여부**와 임베딩 모델 설정 · **역할별 모델 지정** — 주 추론의 기본값과 보조 판정 역할별 고정값. **경로와 모델은 따로 고른다**(ADR-004)"
    reqs: [REQ-031]
    traces_to: [ARCH-040]
  - id: FEAT-016
    module: admin
    screen: SCR-016
    roadmap: RM-P1
    title: "모델 단가 관리"
    detail: "**공급 경로별 단가표.** 계량 단위는 공통코드로 열려 있어 새 항목을 화면에서 더한다 · **판 단위로 발효하며 발효한 판은 고치지 않는다**(NFR-010 hard_rule) · **effort 는 비워 두는 것이 기본이다**(단가와 무관 — TRM-091)"
    reqs: []
    nfrs: [NFR-010]
  - id: FEAT-017
    module: admin
    screen: SCR-021
    roadmap: RM-P1
    title: "전사 예산 계획 관리"
    detail: "기간 단위 전사 상한 · 쿼터 등급별 배분율(합계 100%) · 사용자별 상한 자동 계산·재계산 · **일 단위 발효(과거 소급 불가)**"
    reqs: []
    nfrs: [NFR-011]
  - id: FEAT-018
    module: admin
    screen: SCR-022
    roadmap: RM-P4
    title: "초과 토큰 사용 신청 승인 처리"
    reqs: []
    nfrs: [NFR-011]
  - id: FEAT-019
    module: admin
    screen: SCR-017
    roadmap: RM-P1
    title: "LLM 외부 전송 허용 설정과 결과 원문 보존 설정"
    detail: "전송 허용 — 테이블·컬럼 단위, **API 응답 경로 단위**(P2). 보존 — 데이터소스·테이블 단위와 **API 단위**, 보관 기간 포함"
    hard_rule: "**재개 상태의 보관은 이 설정보다 길 수 없다** — 상태에 도구 결과 원문이 포함되므로 우회 경로가 된다"
    reqs: [REQ-106, REQ-107, REQ-109, REQ-111]
  - id: FEAT-020
    module: admin
    screen: SCR-018
    roadmap: RM-P1
    title: "실행 제한·운영 설정 관리"
    detail: "조회 상한·타임아웃 · **프론트 폴링 주기** · **조회 계획 확인 강제 조건** · **실행 점유 유지 시간·갱신 주기·만료 회수 주기** · **대기 유형별 대기 만료 시간** · **되돌림 상한(회차 상한)** · **일괄 승인 유효 시간** · **재개 상태 정리 주기와 기한**"
    why: "**코드에 박지 않는다** — PRN-06 에 따라 배포 없이 바뀌어야 한다"
    reqs: [REQ-023, REQ-026, REQ-109]
    nfrs: [NFR-001, NFR-013, NFR-014]
    traces_to: [ARCH-070]
  - id: FEAT-021
    module: admin
    screen: SCR-019
    roadmap: RM-P2
    title: "도구(Tool) 노출 설정"
    reqs: [REQ-105, REQ-114]
  - id: FEAT-022
    module: admin
    screen: SCR-024
    roadmap: RM-P1
    title: "품질 신고 접수·처리"
    detail: "신고 목록과 원 응답 이력 조회 · 상태 전이 · 조치 내역 기록 · **미처리 건 현황과 경과 시간 상시 노출**"
    reqs: [REQ-110]
  - id: FEAT-023
    module: admin
    screen: SCR-012
    roadmap: RM-P1
    title: "인증 예제 쿼리 관리"
    detail: "업무 질의와 SQL 쌍의 등록·검수·폐기 · 파라미터 명세 · **검수 시 참조 공개 인터페이스 추출·저장**(주입 판정과 영향 검수의 근거) · 귀속 업무 도메인과 노출 허용 그룹 매핑 · 조회 이력에서의 승격 · 지식·카탈로그와 함께 바뀔 때 반영 세트 후보 리비전으로 묶기"
    reqs: [REQ-302, REQ-205, REQ-306]
  - id: FEAT-024
    module: admin
    screen: SCR-010
    roadmap: RM-P1
    title: "업무 도메인 관리"
    detail: "도메인 정의와 카탈로그·지식·예제 쿼리의 도메인 귀속 매핑"
    reqs: [REQ-021]
  - id: FEAT-025
    module: admin
    screen: SCR-020
    roadmap: RM-P2
    title: "저장된 조회 현황과 제한 설정"
    detail: "등록된 저장된 조회·대시보드 현황과 **사용 빈도 조회**(승격 후보 판단 근거) · 저장 개수·위젯 수·동시 실행·캐시 TTL·쿨다운 설정 · **무효화된 항목 현황**"
    reqs: [REQ-204, REQ-205]
    nfrs: [NFR-005]

# ══ admin — 감사·통계 (10.3) ════════════════════════════════════
# 선행 설계에서 확정되는 이력·지표에 의존한다. **항목만 식별하고 상세는 감사·통계 설계에서** 한다.
  - id: FEAT-026
    module: admin
    screen: SCR-027
    roadmap: RM-P1
    title: "대화 이력 조회"
    detail: "질의·프롬프트·응답 추적"
    reqs: [REQ-107, REQ-109]
  - id: FEAT-027
    module: admin
    screen: SCR-028
    roadmap: RM-P1
    title: "조회 이력 조회"
    detail: "생성 SQL · 대상 · 기준 시각 · 결과 규모 · 결과 지문. **원문 미보존 건은 원문 없이 표시**하고 **당시 보존 설정을 함께 보여준다**"
    reqs: [REQ-104, REQ-107]
  - id: FEAT-028
    module: admin
    screen: SCR-029
    roadmap: RM-P2
    title: "실행 이력 조회"
    detail: "API·파라미터·승인 · **응답의 개인정보 항목 유형 목록과 정보주체 식별자 목록, 평문 열람 건 구분**"
    reqs: [REQ-107, REQ-111]
  - id: FEAT-029
    module: admin
    screen: SCR-030
    roadmap: RM-P1
    title: "정책 판정 이력 조회"
    detail: "거부·차단·마스킹"
    reqs: [REQ-101, REQ-107]
  - id: FEAT-030
    module: admin
    screen: SCR-023
