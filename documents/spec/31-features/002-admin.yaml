features:
# ══ admin — 시스템 관리 (10.1) ═══════════════════════════════════
  - id: FEAT-001
    module: admin
    screen: SCR-001
    roadmap: RM-P1
    title: "대상 시스템 등록·관리"
    detail: "적용 가능 그룹 목록을 두어 API 그룹 매핑의 어휘를 제약한다"
    reqs: [REQ-105]
  - id: FEAT-002
    module: admin
    screen: SCR-002
    roadmap: RM-P1
    title: "데이터소스 관리"
    detail: "yml 설정의 데이터소스 ID 목록을 화면 진입 시 실시간 조회해 제시하고, 각 ID 에 **별칭·DBMS 종류·사용 파서·유형(운영 DB / DW)·시각 체계·적용 가능 사용자 그룹 목록**을 매핑해 데이터소스 레코드로 등록한다"
    hard_rule: "**접속 정보는 관리·표시 대상이 아니다**"
    states: "세 상태를 구분해 보여준다 — ① 미등록 yml ID(등록 후보) ② 정상 ③ **끊긴 연결**(참조하는 yml ID 가 현재 설정에 없음)"
    reqs: [REQ-103]
    traces_to: [ARCH-030]
  - id: FEAT-003
    module: admin
    screen: SCR-003
    roadmap: RM-P1
    title: "스키마 카탈로그 관리"
    detail: "업무 DB/DW 전체가 아닌 **Hub 공개 대상으로 선택한 뷰·테이블**만 관리한다. 관리자는 공개 테이블을 먼저 등록하고 접근 그룹을 매핑한 뒤 컬럼을 등록한다. 속성을 스키마 사실 / 업무 의미로 구분해 다루며, 등록 공개 객체의 사실은 권한이 있을 때 보조적으로 수집·비교할 수 있고 의미는 수기 등록·검수 대상이다. 자동 수집이 의미·정책을 덮지 않는다"
    table_level: "귀속 데이터소스 · DB 스키마 · 객체명 · 객체 유형(TABLE/VIEW) · 공개 여부 · 업무 명칭·설명. `(데이터소스, DB 스키마, 객체명)` 유니크 제약, **대상 시스템 귀속 없음**"
    column_facts: "컬럼명 · 데이터 타입 · PK·유니크 키 여부 · NOT NULL 여부. 등록 컬럼은 별도 예외 매핑이 없으면 테이블 접근 그룹을 상속하고, 원천 변화 후보로만 감지된 미등록 컬럼은 표시·주입·조회하지 않는다"
    column_meaning: "업무 명칭·설명 · **의미 유형**(날짜(형식)·일시·금액·수량·플래그·코드·식별자·자유 텍스트) · **값 도메인**(공통코드 그룹 참조 / 인라인 열거(값+의미) / 없음 중 하나)"
    why_value_domain: "**LLM 이 실존하지 않는 값으로 조건을 만드는 것을 막기 위해** 컨텍스트에 값·명칭을 함께 주입하는 근거가 된다"
    not_managed: "기본값(DEFAULT)·컬럼 길이·인덱스는 관리하지 않는다 — 조회 판단에 쓰이지 않거나 갱신되지 않아 틀린 정보가 된다"
    includes: "고객사 DB/DW 변경 근거에 대한 **공개 범위 영향 검수** · 등록 공개 객체의 구조 변화 후보 확인(선택 기능) · 구조 변화 후보와 업무 의미·값 도메인 변경에 연결된 지식·인증 예제 쿼리의 **지식 검토 필요** 상태 · DB 코멘트 초안 제안과 검수 상태 · 인라인 값 후보 제안(값 샘플링) · 조회 빈도 상위 중 메타데이터 미완성 목록 · 객체 단위 전체 등록 상태의 불변 이력 스냅샷"
    hard_rule: "**업무 명칭·설명은 등록 필수 항목**이며 미기재 항목은 미완성으로 표시한다"
    reqs: [REQ-103, REQ-301, REQ-304]
    traces_to: [PRN-10]
  - id: FEAT-004
    module: admin
    screen: SCR-004
    roadmap: RM-P1
    title: "업무 API 목록 등록·관리"
    detail: "대상 시스템 귀속 · **유형(조회/실행)** · HTTP 메서드·경로 · **인증 방식과 yml 자격증명 참조 키**(자격증명 값은 화면에서 관리하지 않는다) · **신원 파라미터 필요 여부와 전달 위치** · 파라미터 명세 · **타임아웃·재시도 정책·멱등성 여부** · 실행 성공 응답 의미(완료/접수) · 요청 식별자 전달 방식 · 결과 확인 API 유무·호출 매핑·상태 매핑·권장 재확인 시간"
    response_schema: "**응답 스키마와 경로별 속성 등록** — 경로별 의미 유형 · 마스킹 대상 여부 · 정보주체 식별자 여부 · LLM 전송 허용"
    hard_rule: "**허용목록이며 미등록 경로는 닫힘.** 응답에 나타난 미지정 경로의 경고 목록을 포함한다"
    reqs: [REQ-105, REQ-111, REQ-113]
  - id: FEAT-005
    module: admin
    screen: SCR-005
    roadmap: RM-P1
    title: "사용자·조직 관리"
    detail: "**활성/비활성 상태 포함** · system 메뉴 역할과 분리된 **사용자 ↔ Hub 사용자 그룹 매핑**(N:N) · 사용자별 쿼터 등급 부여·직접 변경(신규 사용자는 최저 등급, 변경 사유와 다음 달 발효 이력 기록)과 다음 달 기본 한도 확인 · **신원 매핑 관리**(시스템·데이터소스별 기본 규칙 + 사용자별 오버라이드, 대량 등록·동기화) · 사용자별 소속 그룹·접근 범위 현황 확인 · **변경 이벤트로 비활성화된 사용자의 그룹 재부여 처리** · 사용자별 전체 Hub 그룹 집합의 불변 이력 스냅샷과 과거 시점 화면 복원"
    reqs: [REQ-103, REQ-116]
    traces_to: [ARCH-050]
  - id: FEAT-006
    module: admin
    screen: SCR-006
    roadmap: RM-P1
    title: "사용자 그룹 정의 관리"
    detail: "system 메뉴 역할과 분리한 전역 Hub 사용자 그룹의 생성·수정 · **사용 중인 그룹의 삭제 차단**"
    reqs: [REQ-103]
    traces_to: [AUTHZ-001]
  - id: FEAT-007
    module: admin
    screen: SCR-007
    roadmap: RM-P1
    title: "카탈로그 그룹 매핑 관리"
    detail: "테이블별 접근 허용 그룹 · 등록 컬럼의 테이블 권한 상속 · 컬럼별 예외 매핑과 모드(허용/마스킹) · **마스킹 값 변환 규칙** · 인터페이스별 테이블 그룹·컬럼 예외·마스킹 규칙 전체의 불변 이력 스냅샷과 과거 시점 화면 복원"
    hard_rule: "**변환 규칙은 API 응답 경로의 마스킹에도 그대로 쓴다** — 원천을 하나로 둔다"
    reqs: [REQ-103, REQ-111]
    traces_to: [AUTHZ-011, AUTHZ-012]
  - id: FEAT-008
    module: admin
    screen: SCR-008
    roadmap: RM-P1
    title: "API 그룹 매핑 관리"
    detail: "대상 시스템별 적용 가능 그룹 · API 별 호출 허용 그룹 · 위험 등급·승인 강제 설정 · **응답 경로별 열람 모드(허용/마스킹)의 그룹 매핑**"
    reqs: [REQ-105, REQ-111]
    traces_to: [AUTHZ-014, AUTHZ-015]
  - id: FEAT-009
    module: admin
    screen: SCR-009
    roadmap: RM-P1
    title: "행 스코프 주입 규칙 설정"
    detail: "테이블당 0..1개로, **어느 권한 정보 테이블·컬럼과 조인·서브쿼리할지, 사용자 식별자를 어떻게 바인딩할지** 정의한다. 사용자별 스코프 값은 레거시 DB 의 권한 데이터를 그대로 사용한다"
    hard_rule: "기본 필터와 같은 구조이나 **목적이 다르므로 규칙을 합치지 않는다**"
    reqs: [REQ-103]
    traces_to: [AUTHZ-020]
  - id: FEAT-010
    module: admin
    screen: SCR-014
    roadmap: RM-P1
    title: "채팅 도움말·주의사항 관리"
    detail: "사용 안내 지식의 목적·가능한 업무·질의 예시·안전한 사용 한계·접근 가능 데이터 확인 방법을 후보 리비전과 반영 세트로 관리한다. portal의 초기 안내 문구와 사용법 답변이 활성 리비전만 사용한다"
    reqs: [REQ-101, REQ-308]
  - id: FEAT-011
    module: admin
    screen: SCR-003
    roadmap: RM-P1
    title: "권장 조인 경로 관리"
    detail: "테이블 간 조인 컬럼 쌍과 카디널리티(1:1 / 1:N) 등록"
    why: "**FK 가 없는 레거시에서 LLM 의 조인 추측 오류를 막는 근거다.** 1:N 조인 뒤 집계가 부풀려지는 오류를 막고 DISTINCT 필요 판단에도 쓰인다"
    reqs: [REQ-301]
  - id: FEAT-012
    module: admin
    screen: SCR-003
    roadmap: RM-P1
    title: "기본 필터 규칙 관리"
    detail: "테이블당 0..1개로, 강제 주입할 조건과 **해제 허용 여부**를 설정한다"
    reqs: [REQ-103]
    traces_to: [AUTHZ-050]

# ══ admin — AI 관리 (10.2) ═══════════════════════════════════════
  - id: FEAT-013
    module: admin
    screen: SCR-013
    roadmap: RM-P1
    title: "프롬프트 규칙 관리"
    detail: "실시간 반영. 규칙별 식별자·우선순위·적용 조건·문구 템플릿·허용 치환값·활성 여부·리비전을 관리한다. 존재 은닉·대안 안내, 지식 검색 무결과 태그 안내, 지식 전체 열거 거절과 구체적 질문 요청, agent 문구의 portal 원문 표시를 전사 공통 규칙으로 둔다"
    hard_rule: "규칙은 사용자 문구와 응답 태도를 정할 뿐 권한·검색 상한·지식 일괄 열람 차단을 대체하지 않는다. 서버가 강제한 결과에만 규칙을 적용한다"
    reqs: [REQ-101, REQ-112, REQ-308]
    traces_to: [PRN-06]
  - id: FEAT-014
    module: admin
    screen: SCR-011
    roadmap: RM-P1
    title: "지식 관리"
    detail: "안정 지식 식별자 아래 후보 리비전을 만들고, 등록·수정·삭제의 사유·근거를 기록한다. **접근 허용 그룹** · 태그·동의어 부여(외국어 표현 포함) · **참조 공개 인터페이스 링크(0..N)** · 연결된 인터페이스의 구조 변화 후보 또는 업무 의미·값 도메인 변경에 따른 **지식 검토 필요** 상태와 수정·영향 없음 확인 이력 · 본문 검수(물리명·SQL 감지 시 링크·예제 쿼리 등록으로 유도) · 고객사 정책상 필요한 외부 테스트·감수 근거를 포함한 반영 세트 작성 · 승인 메뉴 액션을 가진 사용자의 승인 뒤 세트 일괄 활성화 · 지식 본문 임베딩과 전체 재임베딩을 제공한다"
    hard_rule: "승인 전·반려된 지식 리비전과 반영 세트는 검색·컨텍스트 주입에 쓰지 않는다. 활성 리비전을 직접 고치지 않으며, 세트의 일부만 활성화하지 않는다. 본문·접근 그룹·태그·동의어·참조 링크를 한 리비전의 전체 불변 스냅샷으로 보존하고, 과거 상태 복원은 새 후보 리비전으로만 한다"
    reqs: [REQ-103, REQ-303, REQ-304, REQ-305, REQ-306, REQ-307, REQ-020]
    traces_to: [ARCH-060, AUTHZ-040]
  - id: FEAT-015
    module: admin
    screen: SCR-015
    roadmap: RM-P1
    title: "외부 모델 관리"
    detail: "**공급 경로**·모델·effort · **임베딩 사용 여부**와 임베딩 모델 설정 · **역할별 모델 지정** — 주 추론의 기본값과 보조 판정 역할별 고정값 · **쿼터 등급별 주 추론 선택 가능 공급 경로·모델·effort 집합**. 경로와 모델은 따로 고른다(ADR-004)"
    reqs: [REQ-031, REQ-116]
    traces_to: [ARCH-040]
  - id: FEAT-016
    module: admin
    screen: SCR-016
    roadmap: RM-P1
    title: "토큰 풀 기준 단가 관리"
    detail: "공급 경로·모델별 **기본 공개 요금**과 입력·캐시·출력 구성비로 월별 계획 1M 기준 단가를 관리한다. 할인·이벤트·계약 특가·세금 등 예외 정책은 다루지 않으며, 개별 호출 예상 비용이나 공급사 청구 금액을 산정하지 않는다. 산정 기준은 월별 이력으로 남긴다"
    reqs: []
    nfrs: [NFR-010]
  - id: FEAT-017
    module: admin
    screen: SCR-021
    roadmap: RM-P1
    title: "월별 개인 쿼터 배분 기준 관리"
    detail: "달력 월 단위 계획 가능 금액(다음 달별 직접 입력 또는 연간 월별 등록) · 보정 단가 기반 총 토큰 풀 자동 산정과 관리자 보정(근거 필수) · 쿼터 등급별 토큰 배분 비율(등급 합계 100%) · 등급별 활성 사용자 수로 나눈 다음 달 개인 기본 한도 · 사용자별 배정·누적 사용·잔여와 공급사 계량/Hub 추정 사용량 모니터링 · 월별 발효 이력 관리. 최근 3개 확정 월의 공급사 대조값으로 계산한 보정률을 시스템이 제안하고, 관리자는 적용·수정·미적용을 선택하며 수동 보정 근거를 남긴다. 계획 총 풀은 일반 배정과 승인 판단의 기준선이며 절대 차단선이 아니다. 전사 예산 편성·잔액 관리는 제공하지 않는다"
    reqs: [REQ-116, REQ-118]
    nfrs: [NFR-011]
  - id: FEAT-018
    module: admin
    screen: SCR-022
    roadmap: RM-P1
    title: "이번 달 초과 토큰 사용 신청 승인 처리"
    detail: "사용자 사유·이번 달 추가 토큰 신청 · 미배정 계획량과 계획 총 풀 대비 초과 여부 확인 · 운영·비용 관리자의 승인 또는 반려 · 승인분 즉시 반영 · 월말 자동 만료와 이월 금지. 승인자는 계획 총 풀 밖의 예외 승인도 할 수 있고, 그 사유·승인자·승인량은 일반 배정과 구분해 남긴다"
    reqs: [REQ-119]
    nfrs: [NFR-011]
  - id: FEAT-019
    module: admin
    screen: SCR-017
    roadmap: RM-P1
