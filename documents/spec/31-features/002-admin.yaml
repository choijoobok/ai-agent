    detail: "그룹 정의·그룹 매핑·마스킹·전송 허용·프롬프트 규칙의 변경 내역과 **직전 상태로 되돌리기**. 사용자별 Hub 그룹 전체, 지식 리비전의 접근 그룹·태그 ID 매핑·참조 링크 전체, 스키마 카탈로그 객체의 등록 컬럼·업무 의미 전체, 카탈로그 그룹 매핑의 테이블 그룹·컬럼 예외·마스킹·행 스코프·기본 필터·전송 허용 전체를 과거 시점 화면처럼 조회한다"
    hard_rule: "과거 스냅샷은 읽기 전용이다. 복원은 과거 이력을 고치지 않고 새 변경으로 기록한다. 지식·예제·카탈로그와 자산 접근 그룹은 복원 후보를 요청·기술 검토·최종 승인 후 반영하고 그 밖의 직접 관리 대상은 REQ-103을 따른다. 스냅샷에 함께 보이는 승인 범위 밖 정책은 덮어쓰지 않는다"
    why: "정책은 배포 없이 즉시 반영되므로(PRN-06) **잘못된 변경을 되돌리는 수단이 사실상 유일한 안전장치다.** 이력이 없으면 매핑을 일시적으로 넓혀 조회한 뒤 되돌리는 행위를 추적할 수 없다"
