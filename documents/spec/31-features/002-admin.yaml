features:
# ══ admin — 시스템 관리 (10.1) ═══════════════════════════════════
  - id: FEAT-001
    module: admin
    screen: SCR-001
    roadmap: RM-P1
    title: "대상 시스템 등록·관리"
    detail: "REQ-604의 대상 시스템 정의·API별 제공 시스템 지정·허용 연결 목록·기본 연결과 사용처를 관리한다. 공통 참조 보호는 REQ-601을 따른다"
    reqs: [REQ-105, REQ-601, REQ-604]
  - id: FEAT-002
    module: admin
    screen: SCR-002
    roadmap: RM-P1
    title: "데이터소스 관리"
    detail: "REQ-603의 데이터소스 연결 참조·업무 메타데이터·상태를 관리한다. 연결 원천·비밀정보 제외·반영 시점·실행 차단과 다중 DB 스키마·객체 식별/권한 경계는 해당 카드가 정본이다. 단일 DB 스키마 필수 선택이나 별도 스키마 권한 관리 기능을 추가하지 않는다"
    reqs: [REQ-103, REQ-601, REQ-603]
    traces_to: [ARCH-030]
  - id: FEAT-003
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.approval_policy를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    module: admin
    screen: SCR-003
    roadmap: RM-P1
    title: "스키마 카탈로그 관리"
    detail: "업무 DB/DW 전체가 아닌 **Hub 공개 대상으로 선택한 뷰·테이블**만 관리한다. 관리자는 공개 테이블을 먼저 등록하고 접근 그룹을 매핑한 뒤 컬럼을 등록한다. 속성을 스키마 사실 / 업무 의미로 구분해 다루며, 등록 공개 객체의 사실은 권한이 있을 때 보조적으로 수집·비교할 수 있고 의미는 수기 등록·검수 대상이다. 자동 수집이 의미·정책을 덮지 않는다"
    table_level: "귀속 데이터소스 · DB 스키마명 · 객체명 · 객체 유형(TABLE/VIEW) · 공개 여부 · 업무 명칭·설명. 물리 식별·중복 제한·스키마명 명시는 REQ-301을 따른다. **대상 시스템 귀속 없음**"
    column_facts: "컬럼명 · 데이터 타입 · PK·유니크 키 여부 · NOT NULL 여부. 등록 컬럼은 별도 예외 매핑이 없으면 테이블 접근 그룹을 상속하고, 원천 변화 후보로만 감지된 미등록 컬럼은 표시·주입·조회하지 않는다"
    column_meaning: "업무 명칭·설명 · **의미 유형**(날짜(형식)·일시·금액·수량·플래그·코드·식별자·자유 텍스트) · **값 도메인**(공통코드 그룹 참조 / 인라인 열거(값+의미) / 없음 중 하나)"
    why_value_domain: "**LLM 이 실존하지 않는 값으로 조건을 만드는 것을 막기 위해** 컨텍스트에 값·명칭을 함께 주입하는 근거가 된다"
    not_managed: "기본값(DEFAULT)·컬럼 길이·인덱스는 관리하지 않는다 — 조회 판단에 쓰이지 않거나 갱신되지 않아 틀린 정보가 된다"
    includes: "고객사 DB/DW 변경 근거에 대한 **공개 범위 영향 검수** · 등록 공개 객체의 구조 변화 후보 확인(선택 기능) · 구조 변화 후보와 업무 의미·값 도메인 변경에 연결된 지식·인증 예제 쿼리의 **지식 검토 필요** 상태 · DB 코멘트 초안 제안과 검수 상태 · 인라인 값 후보 제안(값 샘플링) · 조회 빈도 상위 중 메타데이터 미완성 목록 · 객체 단위 전체 등록 상태의 불변 이력 스냅샷"
    hard_rule: "업무 명칭·설명은 AI 사용 전 필수 항목이다. 미완성·미검수 범위의 초안 저장과 AI 사용 제외는 REQ-301을 따른다. 단독 카탈로그 변경도 SCR-036에서 요청·기술 검토·최종 승인 후 반영한다(REQ-305·306)"
    reqs: ["REQ-103","REQ-301","REQ-304"]
    traces_to: ["PRN-10"]
  - id: FEAT-004
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.approval_policy를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    module: admin
    screen: SCR-004
    roadmap: RM-P1
    title: "업무 API 목록 등록·관리"
    detail: "REQ-608의 업무 API 계약·입출력 경로 속성·통제·공동 오픈 근거와 입력 필드별 값의 출처·채우기 가이드·검증 조건을 등록하고 조회한다. 업무별 용도·사용 조건·입력 확보·조회·선택 절차는 해당 지식-API 매핑 건의 설명에서 참조하며 공통 계약을 복제하지 않는다. 기존 실행·마스킹·고객사 계약 규칙은 REQ-105·111·113을 따른다 Hub 내부 API 전체 후보·책임자 승인/전결·반영은 REQ-608·601을 따른다"
    reqs: ["REQ-105","REQ-111","REQ-113","REQ-608"]
  - id: FEAT-005
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.approval_policy를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    module: admin
    screen: SCR-005
    roadmap: RM-P1
    title: "Portal 사용자 관리"
    detail: "admin의 독립된 Portal 사용자 관리 메뉴. REQ-616의 이용자 프로필·등록·활성/비활성·그룹·쿼터·변경 이력과 REQ-609의 대상별 신원 매핑을 관리한다. system 관리자 계정 관리(SCR-501)와 구분하며 관리자 권한을 자동 부여하지 않는다. 기존 그룹·월별 등급 규칙은 REQ-103·116을 참조한다"
    reqs: ["REQ-103","REQ-116","REQ-609","REQ-616"]
    traces_to: ["ARCH-050"]
  - id: FEAT-006
    module: admin
    screen: SCR-006
    roadmap: RM-P1
    title: "사용자 그룹 정의 관리"
    detail: "REQ-605의 전역 Hub 사용자 그룹 정의와 사용처를 관리한다. system 메뉴 역할·쿼터와의 분리 및 사용 중 삭제 차단은 해당 카드를 따른다"
    reqs: [REQ-103, REQ-601, REQ-605]
    traces_to: [AUTHZ-001]
  - id: FEAT-038
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.approval_policy를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    module: admin
    screen: SCR-037
    roadmap: RM-P1
    title: "사용자 접근 권한 승인"
    detail: "REQ-609의 사용자별 데이터소스·대상 시스템/사용자 ID 매핑 및 그룹 추가 요청을 조회하고 승인·반려한다. 승인된 동일 요청 버전만 활성화하며 사용자 관리의 요청 작성·제거와 승인 메뉴를 분리한다"
    hard_rule: "요청 상태는 권한이 없고 제거는 승인 대상이 아니다. 지식 세트·업무 실행·쿼터 승인과 구분하며 처리 권한은 메뉴·액션으로 판정한다"
    reqs: ["REQ-609"]
  - id: FEAT-007
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.approval_policy를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    module: admin
    screen: SCR-007
    roadmap: RM-P1
    title: "카탈로그 그룹 매핑 관리"
    detail: "카탈로그 그룹·컬럼별 원본 열람/마스킹 열람/접근 제한·공통 마스킹 정의와 당시 전체 상태를 조회·관리한다. 관리 속성은 REQ-611, 직접 관리와 자산 접근 그룹 세트 승인·복원 경계는 REQ-103을 따른다"
    reqs: ["REQ-103","REQ-111","REQ-611"]
    traces_to: ["AUTHZ-011","AUTHZ-012"]
  - id: FEAT-008
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.approval_policy를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    module: admin
    screen: SCR-008
    roadmap: RM-P1
    title: "API 그룹 매핑 관리"
    detail: "API별 호출 허용 그룹·위험 등급·승인 강제·응답 경로별 원본 열람/마스킹 열람/접근 제한을 관리한다. 속성과 통제 경계는 REQ-611, 응답 속성 원천은 REQ-608을 참조한다"
    reqs: ["REQ-105","REQ-111","REQ-611"]
    traces_to: ["AUTHZ-014","AUTHZ-015"]
  - id: FEAT-009
    module: admin
    screen: SCR-009
    roadmap: RM-P1
    title: "행 스코프 주입 규칙 설정"
    detail: "REQ-611의 테이블별 복수 행 스코프 규칙·식별자/리비전·권한 원천·신원 바인딩과 적용 상태를 관리한다. 회사·조직·담당 업무의 필수 조건을 함께 정의하며 실제 사용자별 권한 값은 레거시 원천을 참조한다"
    reqs: [REQ-103, REQ-611]
    traces_to: [AUTHZ-020]
  - id: FEAT-010
    module: admin
    screen: SCR-014
    roadmap: RM-P1
    title: "채팅 도움말·주의사항 관리"
    detail: "사용 안내 지식의 목적·가능한 업무·질의 예시·안전한 사용 한계·접근 가능 데이터 확인 방법을 후보 리비전과 반영 세트로 관리한다. portal의 초기 안내 문구와 사용법 답변이 활성 리비전만 사용한다"
    reqs: [REQ-101, REQ-308]
  - id: FEAT-011
    module: admin
    screen: SCR-003
    roadmap: RM-P1
    title: "권장 조인 경로 관리"
    detail: "테이블 간 조인 컬럼 쌍과 카디널리티(1:1 / 1:N) 등록"
    why: "**FK 가 없는 레거시에서 LLM 의 조인 추측 오류를 막는 근거다.** 1:N 조인 뒤 집계가 부풀려지는 오류를 막고 DISTINCT 필요 판단에도 쓰인다"
    reqs: [REQ-301]
  - id: FEAT-012
    module: admin
    screen: SCR-003
    roadmap: RM-P1
    title: "기본 필터 규칙 관리"
    detail: "REQ-611의 테이블별 복수 기본 필터 항목·식별자/리비전·업무 의미·조건·항목별 해제 허용 여부와 적용 상태를 관리한다. 조회 컨텍스트·선택 제외 명세의 원천이며 행 스코프와 구분한다"
    reqs: [REQ-103, REQ-611]
    traces_to: [AUTHZ-050]

# ══ admin — AI 관리 (10.2) ═══════════════════════════════════════
  - id: FEAT-013
    module: admin
    screen: SCR-013
    roadmap: RM-P1
    title: "프롬프트 규칙 관리"
    detail: "REQ-610의 프롬프트 규칙 속성·조건·템플릿·리비전과 적용 이력을 관리한다. 안내 업무 범위와 서버 통제 경계는 REQ-101·112·308을 참조한다"
    reqs: [REQ-101, REQ-112, REQ-308, REQ-610]
    traces_to: [PRN-06]
  - id: FEAT-014
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.approval_policy를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    module: admin
    screen: SCR-011
    roadmap: RM-P1
    title: "지식 관리"
    mapping_assist: "REQ-303에 따라 지식의 인증 예제와 직접 카탈로그를 각각 0..N개로 독립 매핑한다. 예제의 카탈로그를 지식 직접 매핑으로 복사하지 않고 조회 시 직접·예제 경유 참조를 합산한다. 관리 화면은 각 항목의 포함 경로·버전을 구분하고 과거 목록은 당시 스냅샷으로 재현한다"
    tool_mapping: "REQ-303.custom_tool_mapping에 따라 커스텀 도구를 0..N개 직접 연결하고 각 매핑의 용도·사용 조건·입력 확보 설명·참조 버전·변경 영향을 관리한다. 링크 변경은 지식 승인 설정, 도구 계약 변경은 REQ-612의 도구 승인 설정을 따른다"
    api_mapping: "REQ-608에 따라 지식에 업무 API를 0..N개 연결하고 각 매핑 건에 용도·사용 조건·업무별 입력 확보·조회·선택 절차를 작성한다. 같은 API를 여러 지식에서 참조할 수 있으며 공통 입력 명세·가이드는 API 관리 원천을 참조한다. API 연결·매핑별 사용 설명 변경은 지식 후보 승인 절차에 포함하고 연결만으로 API 호출 권한을 부여하지 않는다"
    request_screen: "지식 자체와 후보 작성은 SCR-011, 변경 요청의 독립 목록·등록·기술 검토·최종 승인·반려·반영 결과는 SCR-036이 맡는다. 조사·검토에서 요청으로 진입하고 양방향 근거·상태를 조회하는 규칙은 REQ-305·306을 따른다 업무 API(REQ-608)와 도구(REQ-612)의 내부 변경 후보도 같은 승인 화면에서 처리한다. 각 실제 변경 대상의 업무별 승인 설정과 전결·혼합 세트 규칙은 REQ-601을 따른다"
    detail: "안정 지식 식별자 아래 후보 리비전을 만들고, 등록·수정·삭제의 사유·근거를 기록한다. **접근 허용 그룹** · 태그 ID 매핑(검색 텍스트·외국어 동의어는 REQ-607의 공통 태그 정의 참조) · **직접 카탈로그 링크(0..N)와 인증 예제 링크(0..N)** · 연결된 인터페이스의 구조 변화 후보 또는 업무 의미·값 도메인 변경에 따른 **지식 검토 필요** 상태와 수정·영향 없음 확인 이력 · 본문 검수(물리명·SQL 감지 시 링크·예제 쿼리 등록으로 유도) · 고객사 정책상 필요한 외부 테스트·감수 근거를 포함한 반영 세트 작성 · 승인 메뉴 액션을 가진 사용자의 승인 뒤 세트 일괄 활성화 · 지식 본문 임베딩과 전체 재임베딩을 제공한다"
