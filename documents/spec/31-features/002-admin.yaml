  - id: FEAT-035
    module: admin
    screen: SCR-033
    roadmap: RM-P1
    title: "AI 처리 오류 관리"
    detail: "portal·agent의 요청·응답 계약, 컨텍스트, 모델·도구, SQL 검증·실행, 응답 구성 단계에서 실패한 턴별 AI 처리 오류 발생 이력을 열린 원인 묶음별 처리 건으로 조회한다. 새 처리 건은 품질 담당자에게 알리고, 지식·카탈로그·인증 예제 쿼리 보완이 필요하다고 판정하면 지식 검토 작업과 업무 자산 관리자를 배정해 자동 알림한다. 처리 건의 상태·담당자·조치 이력과 연결 오류 발생을 관리한다"
    hard_rule: "AI 처리 오류 발생 이력은 system 모듈의 SYS_LO_EXCEPTION과 별도 저장·조회하며 이를 참조하지 않는다. 원본 발생 이력은 수정·삭제하지 않고, 오류 상세에는 정제된 실패 정보만 표시하며 요청·프롬프트·조회 결과 원문은 감사 이력 권한으로만 확인한다. 정상 응답의 논리 오류를 접수하는 품질 신고 처리와 목록·상태·책임을 공유하지 않으며, 공통 원인은 같은 지식 검토 작업의 근거로만 연결한다"
    reqs: [REQ-115, REQ-304]
