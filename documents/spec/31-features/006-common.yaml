features:
# ══ 공통 (10.6) ══════════════════════════════════════════════════
  - id: FEAT-301
    module: common
    roadmap: RM-P1
    title: "영역별 인증·인가 경계"
    detail: "관리 콘솔은 system 관리자 자체 계정·세션과 AUTHZ-090 관리 메뉴/액션 권한을 사용한다. Portal은 별도 Portal 계정·SSO/대상 인증 또는 자체 모드·별도 세션과 현재 Portal 이용 조건을 사용한다. 두 영역의 로그인·세션·현재 주체를 교차 수락하지 않으며 AI 데이터 범위는 Portal 주체의 AUTHZ-001 사용자 그룹으로 판정한다"
    reqs: [REQ-103, REQ-501, REQ-616, REQ-041]
    usecases: [UC-501, UC-023]
    screens: [SCR-113, SCR-114, SCR-115]
    pending: "@defer P3 — ARCH-050의 영역별 인증·세션·서버 전달·권한 수락과 독립 Portal 인증 화면을 상세 설계한다. 공통 구현은 기술 유틸만 재사용한다"
    traces_to: [ARCH-050, AUTHZ-090, AUTHZ-001]
  - id: FEAT-302
    module: common
    roadmap: RM-P1
    title: "모듈별 환경 설정과 프로파일 관리"
    detail: "환경별 설정 분리는 REQ-402, 접속 설정·비밀정보의 관리 대상·저장/주입·공통 설정 복호화 연동/운영 도구·비노출 경계는 REQ-403을 따른다. 비밀 원문 관리 화면을 만들지 않는다"
    reqs: [REQ-402, REQ-403]
    traces_to: [CON-011]
  - id: FEAT-303
    module: common
    roadmap: RM-P1
    title: "그룹 판정 공통 컴포넌트"
    detail: "사용자 소속 그룹과 객체 허용 그룹의 교집합 판정 · 컬럼/API 응답 경로의 원본 열람·마스킹 열람·접근 제한 결과 산출"
    why: "**agent 의 조회·실행 통제와 portal 의 접근 가능 목록 조회가 함께 사용한다** — 같은 판정을 각각 구현하면 두 결과가 어긋난다"
    reqs: [REQ-103, REQ-105]
    nfrs: [NFR-026]
    traces_to: [AUTHZ-001, ARCH-012]
  - id: FEAT-304
    module: common
    roadmap: RM-P1
    title: "외부 모델 호출 공통 컴포넌트"
    detail: "공급 경로·모델 추상화 · 프롬프트 규칙 주입 · REQ-106의 자료 요청·동의 범위와 전송 정책 검사 · **호출 내용·토큰·비용 기록**. 구현체 공통 의미·지원 기능·요청/응답 변환·검증·문맥/자체 실행 통제와 공통 시험은 REQ-009, 변경의 사용자 동작 일치와 호출 취소/종료·계량 차이의 처리는 REQ-007·034, 프롬프트 조합은 REQ-610을 따른다 REQ-602의 보조 대체를 위해 ARCH-032에 따라 일시 장애/금지 오류·접수/종료·사용량 근거를 정규화한다. 후보 선택은 agent가 결정하며 하위 자동 재전송을 숨기지 않는다."
    hard_rule: "**용도별로 인터페이스를 분리해 노출한다** — 대화·추론용과 임베딩용을 하나로 합치지 않는다. 그래야 'portal·admin 은 대화·추론 LLM 을 호출하지 않는다' 를 참조 관계로 검사할 수 있다. **호출 성공·실패와 무관하게 기록을 남기며 기록 없이 성공한 호출이 있으면 안 된다.** 호출 기록에 **호출 용도**를 함께 남긴다"
    testability: "**테스트용 구현체(고정 응답 또는 녹화·재생)를 둘 자리를 인터페이스 설계 시점에 확보한다.** 구현 시점은 미룰 수 있으나 인터페이스가 이를 수용하지 못하면 나중에 추가할 수 없다"
    reqs: [REQ-007, REQ-009, REQ-034, REQ-106, REQ-107, REQ-602]
    nfrs: [NFR-026, NFR-027]
    traces_to: [PRN-01, ARCH-013, ARCH-040]
  - id: FEAT-305
    module: common
    roadmap: RM-P1
    title: "사용자 변경 이벤트 수신 인터페이스"
    detail: "인사 시스템·그룹웨어가 폐쇄망 내부에서 보내는 변경 사건을 검증된 외부 연결의 Portal 계정에 적용한다. 퇴직은 Portal 비활성화, 조직 이동은 Portal 일시 비활성화와 관리자 통보이며 처리 결과를 정책 변경 이력에 남긴다. system 관리자 계정·세션에는 자동 전파하지 않는다"
    reqs: [REQ-103, REQ-107]
    nfrs: [NFR-027]
    traces_to: [ARCH-050]

