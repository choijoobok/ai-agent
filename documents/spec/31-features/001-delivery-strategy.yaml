delivery_strategy:
  decision: ADR-006
  order: "admin 기준 정보·지식·정책·실행 설정 → agent 핵심과 실행 계약 시험 → 제품 portal 상세 설계·구현"
  release_rule: "RM-P1 제품 출시는 조회 전용으로 쪼개지 않는다. 등록 REST 업무 API의 명시적 사용자 승인 실행(REQ-026·105·111·113), 저장된 조회의 현재 권한 재판정 실행(REQ-201~207), 이번 달 추가 토큰 사용 신청·승인(REQ-119)이 함께 준비돼야 한다. 위 개발 순서는 내부 구현·검증 순서일 뿐 중간 조회 전용 제품을 고객에게 먼저 출시할 근거가 아니다. 커스텀 도구(REQ-114)는 RM-P1의 should 범위로 유지하며 첫 출시의 필수 조건으로 올리지 않는다"
  workstream_rule: "기능의 `workstream:`이 있으면 그것이 소유하고, 없으면 `module:`과 같은 이름의 작업흐름이 소유한다"
  portal_horizons:
    - name: contract_debug
      maturity: identified
      features: [FEAT-126]
      rule: "agent 계약을 검증하기 위한 최소 화면이다. 제품 portal 완료율에 합산하지 않는다"
    - name: product_portal
      maturity: identified
      features: [FEAT-101, FEAT-102, FEAT-103, FEAT-104, FEAT-105, FEAT-106, FEAT-107, FEAT-108, FEAT-109, FEAT-111, FEAT-112, FEAT-113, FEAT-114, FEAT-115, FEAT-116, FEAT-117, FEAT-118, FEAT-119, FEAT-120, FEAT-121, FEAT-122, FEAT-123, FEAT-124, FEAT-125, FEAT-127]
      rule: "요구는 유지하고 핵심 계약 영향만 먼저 검사한다. 제품 Portal의 PC·모바일 반응형 지원은 REQ-041·NFR-028을 따르며 같은 기능 ID로 추적한다. 화면 배치·도구 선택·세부 상호작용은 admin·agent 핵심 뒤 portal 작업흐름 P3에서 정한다"
