# 영역: admin 공통 관리 승인·오류 접수
features:
  - id: FEAT-040
    module: admin
    roadmap: RM-P1
    design_status: draft
    title: "관리 승인 경로·요청 무결성 공통 처리"
    type: transaction
    reqs: [REQ-601]
    usecases: [UC-001, UC-003, UC-004, UC-005, UC-006]
    traces_to: [ARCH-029]
    trigger: "승인 대상 기능이 반영 저장·신규 요청 접수·단계 전이·전결·결과 조회를 수행할 때 내부에서 사용한다"
    detail: "업무별 승인 설정의 값/버전 판정, 실제 변경 대상의 단일 미종결 요청, 제출본 고정, 요청 ID/버전/선행 상태 검증과 처리 근거 연결을 제공한다. 업무별 승인 단계·효력·인가·반영은 기존 기능이 소유한다"
    inputs:
      - "실제 변경 대상 종류·안정 식별자·기준 유효본·전체 후보/참조 스냅샷·사유와 요청 ID/버전"
      - "소유 기능의 현재 권한·참조/계약 검증 결과와 해당 업무의 허용 단계·반영 또는 적용 예약 계약"
      - "ARCH-029의 system 공개 설정 값/버전 또는 명시적인 조회 실패 근거"
    outputs:
      - "접수한 불변 요청 또는 같은 저장자의 전결 근거와 반영/예약 결과"
      - "중복·버전·상태 충돌, 읽기 장애 접수 제한 및 조회 권한을 지킨 기존 결과"
    rules_from: ["REQ-601.approval_policy", "REQ-601.request_integrity", "ARCH-029.target_contract.approval_transaction"]
    boundaries:
      - "전용 메뉴·화면을 만들지 않는다. 자산 승인 SCR-036의 소유는 FEAT-014이고 권한 부여·승급·추가 토큰 승인 화면과 통합하지 않는다"
      - "직접 관리 항목에 새 승인을 추가하지 않는다. 승인 대상 작업의 전결도 기존 미종결 요청·현재 권한·버전 검증을 우회하지 않는다"
      - "실제 업무 실행의 사용자 명시 확인(REQ-026·105)과 RM-P3 자동 승인 활성화(REQ-405)는 이 공통 관리 승인 설정의 적용 대상이 아니다"
      - "참조/영향 조회만 하는 자산을 실제 변경 대상으로 잠그지 않는다. 복합 세트 일부 전결·부분 활성화는 허용하지 않는다"
      - "서버 업무 계약이며 공통 모달이나 일반 UI 컴포넌트와 구분한다. 기존 기능은 uses_features로 참조하고 역방향 사용처는 계산한다"
    pending:
      - "@defer P3 — 요청·버전·이력 구조, 설정 스냅샷과 업무 반영의 트랜잭션 경계, 잠금/조건부 갱신·재전송·복구 계약과 테스트를 후속 설계에서 연결한다"

  - id: FEAT-041
    module: admin
    roadmap: RM-P1
    design_status: draft
    type: interface
    title: "처리 오류 발생·불변 증거 접수"
    reqs: [REQ-115]
    usecases: [UC-038]
    trigger: "agent·portal에서 채팅 처리 실패가 발생해 admin 공개 접수 계약으로 인계할 때"
    detail: "REQ-115의 발생 원본·불변 증거를 admin 소유로 접수하고 원 턴/회차/스텝·관련 자산·원천 근거를 연결한다. agent의 FEAT-210 감사 원본과 admin 오류 발생 원본을 구분하며 FEAT-035가 접수된 발생을 조회·조사한다"
    inputs: ["정제한 오류 발생 근거와 원 턴/회차/스텝·추적 참조", "현재 확보 가능한 마스킹 증거와 원자료의 보존·접근 제한 근거"]
    outputs: ["불변 발생/증거 접수 참조와 확인된 저장 결과", "미확보 증거·저장 실패와 재수신 대조에 필요한 근거"]
    rules_from: ["REQ-115.hard_rule", "REQ-115.business_rules", "REQ-110.business_rules", "REQ-107.retention_policy", "REQ-109.conversation_body_retention"]
    boundaries:
      - "전용 메뉴를 만들지 않는다. 조회·사람의 조사 처리는 SCR-033·FEAT-035가 소유한다"
      - "동일 전달의 재수신과 같은 코드·메시지를 가진 별도 발생을 구분한다. 발생 접수로 조사 생성·알림·무기한 보호를 자동 수행하지 않는다"
      - "저장 조회 실패는 REQ-207의 원 실행 이력을 참조하며 채팅 오류를 중복 생성하지 않는다. system 예외 이력은 원천으로 사용하지 않는다"
      - "비밀 원문이나 이미 파기된 자료를 복원·재조회해 증거로 채우지 않는다. 증거의 범위·보존·보호는 참조 요구사항을 따른다"
    pending:
      - "@defer P3 — 생산자 인증·발생 식별/재수신·부분 실패·저장 실패/복구·증거 확보 경합의 공개 계약과 시험을 admin·agent·portal·integration에서 대조한다. 새 전달 수단·재시도 수치·물리 저장 구조를 현재 확정하지 않는다"
