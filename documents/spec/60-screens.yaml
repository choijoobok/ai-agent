# 화면 목록 — admin 32 · portal 12 · system 25 = 69
#
# 작성 단계: P3
# status: migrated — 사용자 승인 전이다.
#
# 재채번: MNU-Ann → SCR-0nn · MNU-Pnn → SCR-1nn.
#
# **화면의 컬럼·검증·영향 테이블은 여기에 담지 않는다** — `documents/screen/{페이지경로}/`
# 의 문서 셋이 갖는다(CLAUDE.md §6). 여기는 *무엇이 메뉴로 존재하고 어떤 기능이 거기
# 속하는지* 까지다. **44개 화면의 문서 셋은 아직 없다** — CLAUDE.md §11.

meta:
  status: in_progress
  baselined: null
  workstreams: { system: reviewed }
  system_behavior_contract: "각 system 화면의 버튼·필드·검증·영향 테이블·현재 테스트는 current_doc이 정의한다. P4 이동은 동작을 바꾸지 않고 route와 소유 경로만 target_doc·system 모듈로 옮긴다"

delivery_strategy:
  decision: "ADR-006 · ADR-007"
  first: "SCR-112 계약 시험 화면을 integration 작업흐름에서 먼저 설계한다"
  later: "SCR-101~111 제품 portal 화면은 admin·agent 핵심 안정 뒤 portal 작업흐름에서 상세 설계한다"
  hard_rule: "SCR-112 승인은 SCR-101 채팅이나 다른 제품 portal 화면의 승인으로 간주하지 않는다"

# ── 무엇을 메뉴로 두는가 ────────────────────────────────────
menu_criteria:
  claim: "**셋을 모두 만족할 때만 메뉴로 둔다.** 하나라도 어긋나면 상위 화면의 기능으로 접는다"
  why: "메뉴를 잘게 쪼개면 **탐색 비용(PRB-03)을 우리가 다시 만드는 셈**이 된다"
  tests:
    - axis: 진입
      is_menu: "내비게이션에서 **직접 진입**한다"
      not_menu: "다른 화면의 흐름 안에서만 도달한다"
    - axis: 대상
      is_menu: "고유한 **관리 대상 목록**을 가진다"
      not_menu: "이미 열려 있는 대상에 대한 동작이다"
    - axis: 통제
      is_menu: "**접근 권한을 따로 줄 이유**가 있다"
      not_menu: "상위 화면의 권한에 종속된다"
  note: "**접는다고 설계가 사라지지 않는다** — 접힌 기능은 상위 메뉴의 문서 셋 안에서 FEAT ID 로 다뤄지고, 31-features.yaml 의 `screen` 칸이 그것을 보증한다"

# ── 접근 통제 경계 ──────────────────────────────────────────
# 대분류는 이 분리선과 일치하도록 잘랐다.
control_boundaries:
  - boundary: "정책 변경"
    group: "권한 관리"
    why: "**접근 범위 자체를 바꾼다. 자기 권한 확대가 가능한 자리다**"
  - boundary: "업무 자산 등록"
    group: "연동 관리 · 업무 지식 관리"
    why: "정확도를 만들지만 권한을 넓히지는 않는다. **현업 담당자에게 열 수 있어야 한다**"
  - boundary: "운영·비용"
    group: "AI 운영 · 비용 관리"
    why: "한도와 모델을 다룬다"
  - boundary: "열람 전용"
    group: "품질 관리 · 감사·이력"
    why: "**업무 데이터 원문과 개인정보에 닿는다**"
rules:
  - "**통제의 단위는 리프 메뉴다.** 대분류는 기본 묶음일 뿐이며 고객사가 리프 단위로 다르게 매핑할 수 있어야 한다 — 대분류를 단위로 삼으면 '카탈로그는 열되 API 는 막는다' 가 표현되지 않는다"
  - "**읽기와 쓰기를 별도 메뉴로 나누지 않는다.** 같은 대상의 조회 화면과 등록 화면을 따로 두면 메뉴 수가 두 배가 되고 탐색 비용이 늘어난다. 권한 모드는 메뉴 매핑의 속성으로 다룬다"
  - "**메뉴는 그 차수(RM-Pn)에 도달하기 전까지 노출하지 않는다.** 비활성 상태로 보여 주면 사용자가 매번 눌러 보게 되고, 그 자체가 탐색 비용이다"

