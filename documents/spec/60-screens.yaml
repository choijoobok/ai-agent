# ── 미확정 ──────────────────────────────────────────────────
undecided:
  - id: UND-S01
    item: "**portal 의 진입 기본 화면**"
    when: "SCR-105 설계 시 (P2)"
  - id: UND-S02
    item: "**메뉴 권한의 모드 표현** — 리프 메뉴에 읽기/쓰기 구분을 둘지, 아니면 메뉴 매핑은 접근 여부만 다루고 기능 단위 통제는 화면 안에서 처리할지"
    when: "SCR-006 설계 시"
    resolved: "2026-09-05 — **템플릿에 이미 구현돼 있다.** 역할·역할권한·사용자권한·접근제어가 서 있고, 메뉴마다 실행 유형 넷을 갖는다: `READ`(조회) · `SAVE`(저장) · `EXECUTE`(실행) · `EXPORT`(출력). 판정은 API 경로 접두가 하고(standard/backend/api.md §2) 그것이 인가 시드의 입력이다. **새로 정할 것이 없다** — 화면 설계는 이 넷을 쓰면 된다"
  - id: UND-S03
    item: "**감사 메뉴의 열람 행위를 기록할지** — 감사·이력은 개인정보 열람 경로인데 REQ-107 의 기록 대상에 admin 의 이력 열람은 들어 있지 않다"
    when: "REQ-107 개정 여부 판단 후"
    resolved: "2026-09-05 — **이미 기록된다.** 요청 인터셉터가 **모든 API 접근**을 사용 이력에 쌓는다(`documents/screen/admin/system/log/access/`). 감사 메뉴를 조회조건으로 넣으면 그 메뉴의 접근 이력만 따로 볼 수 있다 — 요청 URI 가 `API_CATALOG` 를 거쳐 `MENU_TREE` 로 이어진다. **INV-01(개인정보 열람의 정보주체 추적 100%)이 이 경로로 지켜진다**"
  - id: UND-S04
    item: "**admin 홈 화면의 유무와 구성** — 미완성 메타데이터·미처리 신고·예산 소진율처럼 여러 메뉴를 가로지르는 지표를 모을 자리가 필요한지"
    when: "**모든 기능 구현을 마친 뒤 가장 마지막**(사용자 결정 2026-09-05)"
    default_candidates:
      - "비용 현황 — 전사·조직·사용자별 토큰 사용량과 예상 비용(FEAT-030)"
      - "쿼터 추가 요청과 처리 현황(FEAT-018)"
      - "품질 신고·결함 처리 현황과 경과 시간(FEAT-022)"
      - "응답이 지나치게 느리거나 멈춘 턴 현황(NFR-006~009 · FEAT-216)"
      - "추가 설계 후보 — **활성 작업 사용자**(접수·처리중·사용자대기 턴의 사용자 중복 제거) · 상태별 턴 · 업무 API 호출 성공·실패·지연 현황. **현재 접속 사용자라고 부르지 않는다** — 브라우저를 닫아도 턴은 계속된다(REQ-016). 중단 턴은 활성에서 빼고 재시도 대기 현황으로 따로 센다"
    approach: >-
      **업무 운영 대시보드는 고객사마다 다르다.** 그래서 화면을 미리 확정하지 않고 **얹을 수 있는
      컴포넌트와 서비스를 미리 만들어 두고 고객사가 고르게 한다** — 위 후보로 기본 가능 범위와
      예시 구성을 보여 주는 것까지가 우리 몫이고, 실제 배치는 고객사 요구사항을 받아 정한다.
      고르게 하면 *만들어 둔 것 안에서* 고르게 되므로 별도 개발도 줄어든다.
      @defer P4 — 기능 구현을 전부 마친 뒤 대시보드 컴포넌트와 예시 구성을 만든다
  - id: UND-S05
    item: "**SCR-020 의 소속** — AI 운영 대 업무 지식 관리"
    when: "SCR-012·SCR-020 설계 시 (P2)"
  - id: UND-S06
    item: "**SCR-104 와 SCR-106 의 화면 경계**"
    when: "P3 (워크플로우 설계)"

# ── 문서 셋 작성 순서 ───────────────────────────────────────
doc_order:
  unit: "**리프 메뉴 1개 = 문서 셋 1건**을 기본으로 한다 (44건)"
  flexibility: "**묶어도 되고 쪼개도 된다.** 대상과 등록 주체가 같은 리프(SCR-007·SCR-008 그룹 매핑)는 묶을 수 있고, SCR-101 채팅은 흐름 단위로 나눌 수 있다"
  order: "**P1 메뉴가 먼저다.** 그중에서도 **SCR-003 스키마 카탈로그와 업무 지식 관리(SCR-010~014)를 앞에 둔다** — DB 설계의 설정 테이블 대부분이 여기서 나오고 agent 의 컨텍스트 구성이 이 화면들의 산출물을 입력으로 삼는다"
  path_rule: "화면 정본은 `documents/screen/{모듈}/{화면경로}/`에 둔다(ADR-007). 브라우저의 `/admin` 같은 화면 영역 접두사와 모듈 소유권을 혼동하지 않으며, 정확한 변환 규칙은 하네스·화면 문서 표준을 함께 갱신한다"
  status: >-
    **아직 한 건도 시작하지 않았다.** `documents/screen/` 에 있는 것은 백오피스 템플릿의
    화면 문서이고, 여기 44개(admin 32 · portal 12)는 이 목록에만 있다.
    @defer P3 — Hub 메뉴 44개의 화면 문서 셋을 시작한다
