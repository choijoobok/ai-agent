mapping_rules:
  - "한 컬럼에 대해 사용자의 어떤 그룹은 허용, 어떤 그룹은 마스킹이면 **허용이 이긴다**(합집합 원칙의 귀결)"
  - "**데이터소스의 적용 가능 그룹에서 그룹을 제거할 때 해당 데이터소스의 테이블·컬럼에 그 그룹 매핑이 남아 있으면 차단한다.** 대상 시스템에는 그룹 목록을 두지 않는다(REQ-604). 사용자 그룹 자체의 삭제는 데이터소스·테이블·컬럼·API 등 사용 중인 매핑이 있으면 차단한다"
  - "마스킹 값 변환 규칙(어떻게 가릴지)은 컬럼 단위로 정의한다"
  - "**변환 규칙의 원천을 하나로 둔다** — 같은 주민등록번호가 SQL 경로와 API 경로에서 다르게 가려지면 마스킹 자체가 신뢰를 잃는다"

# ── 행 스코프 ──────────────────────────────────────────────────────
