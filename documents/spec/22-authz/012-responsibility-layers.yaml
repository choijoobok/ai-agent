responsibility_layers:
  id: AUTHZ-070
  claim: "조회 API 응답의 접근 통제를 레거시에 위임했으나 **층이 다르다**"
  layers:
    - question: "이 사용자에게 **어떤 행·컬럼을 돌려줄 것인가**"
      owner: "레거시 — 전달받은 신원 파라미터로 자체 권한 검사"
    - question: "받은 응답을 **어떤 형태로 화면에 내보내고, 무엇을 남기고, 무엇을 외부로 보낼 것인가**"
      owner: "**Hub**"
  claim2: "**레거시가 평문을 돌려준다는 사실이 Hub 가 그것을 평문으로 저장·전송해도 된다는 뜻은 아니다**"
  why_asymmetry_matters: "운영 가이드가 '행 통제가 복잡한 테이블은 카탈로그에서 빼고 조회 API 를 연다' 를 권하므로, **이 우회는 권장 경로를 따르면 생긴다.** 따라서 응답도 통제 대상으로 다룬다"
  also_legacy:
    - "**파라미터 검증·밸리데이션** — 공개된 API 는 호출자를 불문하고 스스로 방어해야 한다"
    - "**턴 사이의 중복 방지** — 대상 API 의 멱등성 또는 자체 중복 검사에 의존한다"
    - "**잘못 실행된 액션의 복구** — 대상 시스템의 업무 프로세스와 매뉴얼을 따르며, 복구·원복 절차는 연동 협의 시점에 함께 수립한다"
  hub_provides: "Hub 가 제공하는 것은 **무엇이 실행되었는지의 전량 실행 이력**이다"

# ── 유량 통제의 소유 ──────────────────────────────────────────────
