row_scope:
  id: AUTHZ-020
  implementation: "행 스코프 조건은 **대상 데이터소스 안에 있는 사용자 권한 정보 테이블과의 조인 또는 서브쿼리로 구현**한다"
  why: "스코프 값을 AI 전용 DB 에 이중 관리하지 않고 **레거시가 이미 보유한 권한 데이터를 그대로 사용**한다(PRN-09)"
  rules:
    - "스코프 규칙은 **테이블당 0..1개**로 제한한다. admin 이 관리하는 것은 사용자별 스코프 값이 아니라 **주입 규칙**이다 — 어느 권한 정보 테이블·컬럼과 조인하는지"
    - "바인딩 값은 **그 데이터소스에 신원 매핑된 사용자 식별자**다. **매핑이 없으면 조회를 사유와 함께 거부**하고, 매핑은 있으나 권한 정보 테이블에 해당 사용자의 행이 없으면 결과가 0건이 되며 **이것이 정상 동작이다**"
  not_supported:
    claim: "**그룹 × 스코프 조합을 시스템 기능으로 풀지 않는다**"
    example: "팀원은 본인만 · 팀장은 부하 전원 · 관리자는 전 직원"
    why: "스코프 조건들의 OR 결합은 주입 로직과 검증을 급격히 복잡하게 만든다"
    instead: "**운영 가이드의 수단**으로 대응한다(아래 operational_means)"

