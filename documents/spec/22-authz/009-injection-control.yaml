injection_control:
  id: AUTHZ-040
  why: "지식과 인증 예제 쿼리는 **그 자체가 스키마 정보일 수 있다.** 카탈로그를 1단계에서 필터링해도 이 자산들이 미허용 객체를 언급한 채 주입되면 **존재 은닉이 컨텍스트 안에서 깨진다**"
  rules:
    - "지식은 **자산 접근 허용 그룹**과 참조 공개 인터페이스 링크(0..N)를 정형으로 갖는다. 인증 예제 쿼리는 자산 노출 허용 그룹과 등록 검수 시 파서가 추출한 참조 테이블·컬럼을 저장한다. 지식 본문은 물리명·SQL을 담지 않으므로 참조 링크는 공개 객체 단위로 충분하지만, 물리명을 포함하는 인증 예제 쿼리에는 컬럼 참조를 생략하지 않는다"
    - "**주입 판정** — 사용자의 소속 그룹이 자산 접근 허용 그룹과 참조 공개 인터페이스 **전부**의 허용 그룹 판정을 통과해야 주입한다. 인증 예제 쿼리는 추출된 참조 컬럼 **전부**도 통과해야 한다. **하나라도 차단이면 컨텍스트에 넣지 않는다.** 참조 인터페이스가 없는 순수 용어·규칙 지식도 자산 접근 허용 그룹 판정은 반드시 거친다"
    - "차단된 테이블·컬럼의 존재는 지식·인증 예제 쿼리를 통해서도 드러내지 않는다. 컬럼 접근 여부는 값 열람뿐 아니라 예제 쿼리 주입의 전제이며, 2단계 SQL 대조는 이 주입 판정을 대체하지 않는다"

# ── 기본 필터 ──────────────────────────────────────────────────────
