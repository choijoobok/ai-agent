injection_control:
  id: AUTHZ-040
  why: "지식과 인증 예제 쿼리는 **그 자체가 스키마 정보일 수 있다.** 카탈로그를 1단계에서 필터링해도 이 자산들이 미허용 객체를 언급한 채 주입되면 **존재 은닉이 컨텍스트 안에서 깨진다**"
  rules:
    - "두 자산은 **참조 공개 인터페이스를 정형으로 갖는다** — 인증 예제 쿼리는 등록 검수 시 파서가 추출해 저장하고, 지식은 등록자가 링크한다(0..N). **참조 매핑은 공개 객체 단위다** — 컬럼 단위 매핑은 관리 부담이 통제 실익을 넘으므로 두지 않는다"
    - "**주입 판정** — 사용자의 소속 그룹이 참조 공개 인터페이스 **전부**의 허용 그룹 판정을 통과해야 주입한다. **하나라도 차단이면 컨텍스트에 넣지 않는다.** 인증 예제 쿼리는 노출 허용 그룹 판정에 이 판정을 더한다. **참조 인터페이스가 없는 지식(순수 용어·규칙)은 판정 없이 주입한다**"
    - "테이블 단위 판정이므로 주입된 예제 쿼리가 **사용자에게 차단된 컬럼**을 참조할 수 있다. 이 경우 2단계의 컬럼 단위 대조가 잡아 중립 피드백 재작성 루프로 처리한다. **그 컬럼의 존재가 예제를 통해 드러나는 것은 감수한다** — 값 접근은 대조와 마스킹이 막고, 존재까지 숨겨야 하는 컬럼은 그 컬럼을 참조하는 예제 쿼리의 노출 그룹을 좁히거나 뷰 분리로 대응한다"

# ── 기본 필터 ──────────────────────────────────────────────────────
