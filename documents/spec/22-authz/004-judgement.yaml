judgement:
  id: AUTHZ-001
  rule: "사용자의 **소속 그룹 집합**과 객체의 **허용 그룹 집합**의 **교집합이 비어 있지 않으면 허용**, 매핑이 없으면 차단"
  applies_to:
    - 데이터소스
    - "테이블 · 컬럼"
    - "실행 API"
    - "커스텀 도구"
    - "지식 · 인증 예제 쿼리의 컨텍스트 주입 판정"
  single_component: "**다섯이 전부 같은 규칙을 쓰며 구현은 공통 컴포넌트 하나다**(FEAT-303). 같은 판정을 두 곳에서 구현하면 두 결과가 어긋난다"
  rules:
    - "사용자 그룹은 **전역**으로 정의하고 사용자에게 N:N 으로 매핑한다. 그룹은 개인 단위가 아니라 **직무·역할 단위**로 만든다 — 급여담당·근태담당·평가관리자"
    - "**그룹 결합은 합집합이다.** 여러 그룹에 속한 사용자의 접근 범위는 각 그룹이 여는 범위를 합친 것이다. **그룹을 추가로 부여한 것이 기존 접근을 좁혀서는 안 된다**"
    - "**기본값은 닫힘이다.** 그룹이 없는 신규 사용자, 허용 그룹 매핑이 없는 신규 공개 인터페이스·컬럼·API 는 아무것도 열리지 않는다. **공개 인터페이스 변화 후보로 확인된 신규 컬럼도 매핑 전까지 차단된다** — 통보 없이 추가된 컬럼이 기본 공개되면 사고다. **운영상 번거롭지만 반대 방향의 실수는 사고다**"

# ── 매핑 구조 ──────────────────────────────────────────────────────
