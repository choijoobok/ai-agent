default_filter:
  id: AUTHZ-050
  why: "레거시 테이블에는 논리 삭제 플래그나 유효 상태 컬럼이 있고, 이를 빠뜨리면 **폐기된 데이터까지 집계된다.** 권한 위반은 아니지만 **사용자가 틀린 숫자를 받아 업무 판단을 하게 되므로** 통제 대상으로 다룬다"
  rules:
    - "테이블당 **0..1개**의 기본 필터를 등록한다. 행 스코프 규칙과 같은 구조이며 주입도 같은 3단계에서 파서로 수행한다"
    - "**기본은 강제 주입이다.** LLM 의 판단에 맡기지 않는다 — 빠뜨리는 순간 **조용히 틀린 결과**가 나오고 사용자는 틀렸다는 사실을 알 수 없다"
    - "**해제는 명시적 지시가 있을 때만 가능하다.** 사용자가 '취소된 것도 포함해서' 처럼 명시적으로 요구하면 LLM 이 해제를 요청할 수 있다. 이때 **해제 사실을 조회 계획에 표시하고 감사 이력에 남긴다.** 해제 요청이 없으면 무조건 주입된다"
    - "**해제 가능 여부 자체를 테이블별 설정으로 둔다.** 해제를 허용하지 않는 테이블에서는 사용자가 요구해도 주입을 유지하고 그 사유를 응답에 밝힌다"
  not_authz: "**기본 필터는 권한 통제가 아니다.** 그룹 판정·행 스코프를 대체하거나 보완하지 않으며 정확도를 위한 장치다. **두 규칙을 한 항목으로 합치지 않는다** — 하나는 볼 수 있는 범위이고 하나는 세어야 할 범위다"

# ── 시스템 통제의 경계와 운영 수단 ────────────────────────────────
