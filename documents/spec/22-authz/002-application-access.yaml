application_access:
  id: AUTHZ-090
  decision: ADR-007
  claim: "화면·API 진입은 system의 **메뉴/액션 유효 권한**, AI 업무 데이터 범위는 아래 AUTHZ-001의 **사용자 그룹**으로 각각 판정하며 둘을 역할명 하나로 합치지 않는다"
  rules:
    - "역할은 메뉴/액션 권한을 묶어 사용자에게 배포하는 수단이다. `ADMIN`·`TESTER`·`DEBUGGER` 같은 역할 코드는 런타임 분기 조건이 아니다"
    - "로그인 뒤 기본 경로는 안전한 원래 목적지 → 비밀번호 변경 → 관리 콘솔 진입 권한 → portal 진입 권한 순으로 결정한다(ARCH-021)"
    - "메뉴 없는 내부 화면은 내비게이션에서 숨겨도 권한 대상이어야 한다. 화면과 관련 `/api/service/**`에 같은 자원·액션 권한을 적용한다"
    - "프론트 라우트 가드는 사용성 장치이며 최종 판정은 서버 API가 한다. 직접 URL 입력으로 서버 권한을 우회할 수 없다"
    - "관리 콘솔과 portal 진입 권한이 모두 없는 사용자는 공통 API만 호출 가능한 빈 셸로 보내지 않고 시작 화면 없음으로 종료한다"
  unresolved_design: "숨김 화면을 `SYS_MENU`의 비내비게이션 유형으로 표현할지 별도 권한 자원으로 둘지는 SCR-112·ENT·API 설계에서 비교한다"
  traces_to: [ARCH-012, ARCH-021, FEAT-303]

# ── 설치 계정과 운영 권한의 분리 ────────────────────────────────
