confusions:
  - pair: [TRM-136, TRM-137]
    title: "차수 ≠ 작업흐름"
    severity: "일정과 승인 범위를 섞으면 다른 모듈의 소스까지 열린다"
    left: "**차수** — 이번 통합 출시에 무엇을 내는가"
    right: "**작업흐름** — 같은 차수 안에서 어느 모듈·계약이 어디까지 성숙했는가"
    evidence: "admin·agent를 먼저 만들고 portal 상세 설계를 뒤로 미루려 했을 때 전역 단계 하나로는 두 상태를 함께 표현할 수 없었다(ADR-006)"
  - pair: [TRM-102, TRM-003]
    title: "노드 ≠ 스텝"
    severity: "가장 자주 어긋난다"
    left: "**노드** — LangGraph4j 가 정한 그래프의 작업 하나. 쓰임은 **실행 편의**"
    right: "**스텝** — 우리가 정한 agent ↔ LLM 1회 왕복. 쓰임은 **감사·과금**"
    evidence: "PoC 에서 훅을 전 노드에 걸었더니 스텝 이력이 5행이 아니라 **9행**으로 나왔다 — `reason` 노드와 `tool` 노드가 각각 행을 만들었다"
    rule: "**노드 분할은 구현 사정이고 스텝은 과금 단위다.** 둘이 우연히 일치할 때만 훅을 전역으로 건다"

  - pair: [TRM-012, TRM-004]
    title: "점유 토큰 ≠ 회차"
    left: "**점유 토큰** — 어느 **인스턴스**가 처리했나. 인프라 층. 점유가 바뀔 때 오른다"
    right: "**회차** — 무엇을 하려던 **시도**인가. 업무 흐름 층. 되돌려 다시 할 때 오른다"
    evidence: "**직교한다.** 한 회차가 여러 점유에 걸칠 수 있고(인스턴스가 죽어 회수·재개), 한 점유 안에서 회차가 오를 수도 있다(교정) — 후자가 실측으로 확인됐다: fence 는 1 로 고정인데 회차만 0→1"
    rule: "둘 다 이력에 함께 남긴다. 하나로 합치지 않는다"

  - pair: [TS-04, TS-05]
    title: "중단 ≠ 실패"
    left: "**중단** — **다시 해볼 여지가 있는** 멈춤. 서버 재시작 · 점유 만료 · 대기 만료 · 사용자 중단. **재시도 가능**"
    right: "**실패** — 다시 해도 같은 종결. 쿼터 소진 · 권한 부족 · 복구 불가 오류. 재시도 불가"
    rule: "**액션 실패를 보고할 때 이 구분을 담는다** — 사용자의 다음 행동이 갈린다"

  - pair: [REQ-013, REQ-024]
    title: "재시도 ≠ 교정 ≠ 결과 교정 재요청"
    severity: "셋 다 *다시 한다* 인데 전부 다르다"
    left: "**재시도**(REQ-013) — 턴이 **중단**됐을 때. 멈춘 지점에서 **이어간다.** 회차 안 올린다"
    middle: "**교정**(REQ-030~035 의 네 갈래 중 `CORRECT`) — 턴이 **처리 중**일 때. **되돌려서** 다시 한다. 회차 **올린다**"
    right: "**결과 교정 재요청**(REQ-024) — 턴이 **완료**됐을 때. **새 턴**을 만든다. 회차 해당 없음"

  - pair: [TRM-044, NFR-001]
    title: "조회 계획 ≠ DBMS 실행 계획(EXPLAIN)"
    left: "**조회 계획** — 실행 전에 사용자에게 **업무 용어로** 보여주는 예정 내역. 물리명과 SQL 은 보여주지 않는다"
    right: "**DBMS 실행 계획(EXPLAIN)** — DB 가 쿼리를 어떻게 처리할지에 대한 내부 계획. 대량 조회 방어의 사전 판정(NFR-001)에 쓴다"
    rule: "이름이 비슷하지만 **대상도 독자도 다르다**"
    note: "조회 계획은 액션이 포함된 턴에서 실행할 액션과 순서도 담게 되어(REQ-026) **이름과 범위가 어긋난 상태다.** 용어를 바꿀지는 미확정이다"

  - pair: [TRM-025, TRM-026]
    title: "질의 즐겨찾기 ≠ 저장된 조회"
    left: "**질의 즐겨찾기** — **자연어 문장**을 저장한다. 실행하면 새 턴이 생기고 LLM 을 거친다. 결과가 매번 달라질 수 있고 **토큰을 소모한다**"
    right: "**저장된 조회** — **확정 SQL + 파라미터 명세**를 저장한다. 턴이 생기지 않고 LLM 도 거치지 않는다. **결정적이고 토큰을 쓰지 않는다**"

  - pair: [TRM-113, REQ-107]
    title: "체크포인트 ≠ 감사 이력"
    severity: "같은 DB 에 있고 같은 턴을 다루지만 목적이 다르다"
    left: "**체크포인트** — **어디서부터 다시 시작하나.** 턴 종결 시 정리되고 이전 회차는 교정 시 정리된다. **갱신된다**"
    right: "**감사 이력** — **무슨 일이 있었나.** 보관 기간 정책을 따른다. **append-only** 이며 지난 행을 수정하지 않는다"
    rule: "원천은 하나이고 표가 둘인 것은 **분업이다** — 어느 한쪽을 다른 쪽으로 대신할 수 없다"

  - pair: [TRM-110, TS-04]
    title: "인터럽트 ≠ 중단(상태)"
    left: "**인터럽트** — LangGraph4j 가 노드 진입 직전에 멈추는 것. **재개 가능한 멈춤**을 뜻하며 **승인 대기도 인터럽트다**"
    right: "**중단** — 턴 상태 여섯 중 하나(TS-04)"
    rule: "승인 대기로 멈춘 것은 인터럽트지만 **중단 상태가 아니다.** 그리고 **점유를 잃었을 때는 인터럽트가 아니라 예외여야 한다** — 점유를 잃은 인스턴스는 그 턴에 아무 권한이 없어 *재개 가능한 멈춤* 이 성립하지 않는다"

  - pair: [TRM-040, TRM-041]
    title: "대상 시스템 ≠ 데이터소스"
    left: "**대상 시스템** — 레거시 시스템 하나. **API(실행·조회 기능)가 여기 귀속된다**"
    right: "**데이터소스** — 조회할 DB/DW 연결 하나. **테이블·컬럼이 여기 귀속된다**"
    rule: "**둘은 서로 관계를 갖지 않는다**(ARCH-030) — *이 대상 시스템의 DB 는 저 데이터소스* 라는 연결을 두지 않는다. 조회 경로와 실행 경로가 독립한 두 축이고 권한 매핑도 각각 따로 걸린다"

  - pair: [TRM-045, TRM-046]
    title: "사용자 그룹 ≠ 쿼터 등급"
    left: "**사용자 그룹** — 무엇에 **접근**할 수 있나. **여러 개** 가질 수 있고 범위는 합집합이다"
    right: "**쿼터 등급** — 얼마나 **쓸** 수 있나. 사용자별로 하나를 직접 부여하며, 사용자 그룹의 접근 범위와 연결하지 않는다"

  - pair: [TRM-133, TRM-134]
    title: "Hub 모듈 ≠ 업무 확장"
    severity: "**낱말 하나로 규칙이 잘못 적용된다**"
    left: "**제품 모듈** — system·admin·portal·agent. 한 애플리케이션과 AI 전용 DB를 공유하되 소스·API·쓰기 소유권을 나눈다(ARCH-010 · ADR-007)"
    right: "**업무 확장** — 함께 짓는 업무 시스템(WMS 등). **자기 업무 DB 를 소유한다.** 고객사마다 는다"
    rule: >-
      **ARCH-010의 제품 모듈 경계는 Hub 내부 넷에만 적용한다.** 업무 확장을 제품 모듈이라
      부르면 고객사 업무 DB의 독립 수명주기와 ARCH-017의 별도 데이터소스 규칙이 흐려진다.
      늘어나는 것은 제품 모듈이 아니라 **대상 시스템과 업무 확장**이다.

  - pair: [TRM-136, TRM-133]
    title: "차수(RM-Pn) ≠ 방법론 단계(P0~P6)"
    severity: "**같은 글자 `P1` 이 두 뜻이다**"
    left: "**차수** `RM-P1` — *무엇을 언제 출시하나*. 제품 출시 단계이며 spec 항목의 `roadmap:` 이 갖는다"
    right: "**단계** `P1` — *지금 어디까지 설계했나*. 방법론 단계이며 `project.state.yaml` 의 `current.phase` 가 갖는다"
    rule: >-
      **차수 하나를 만들기 위해 P0~P6 을 한 바퀴 돈다**(00-charter/_index.yaml `roadmap_notes`).
      그래서 같은 화면이 다음 차수에 다시 P1(요구사항)부터 시작할 수 있으며 **그것은 후퇴가 아니다.**
      spec 에서 차수를 적는 필드 이름은 `roadmap:` 이다 — `phase:` 로 적으면 두 축이 같은 글자를 쓴다.
