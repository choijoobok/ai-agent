turn_states:
  - id: TS-01
    state: 접수
    key: RECEIVED
    meaning: "질의를 받아 기록했고 아직 처리를 시작하지 않았다"
    next: [RUNNING, ABORTED, FAILED]
  - id: TS-02
    state: 처리중
    key: RUNNING
    meaning: "스텝을 진행하고 있다"
    next: [WAITING_USER, DONE, ABORTED, FAILED]
  - id: TS-03
    state: 사용자대기
    key: WAITING_USER
    meaning: "사용자 응답 없이는 진행할 수 없다"
    next: [RUNNING, ABORTED, FAILED]
  - id: TS-04
    state: 중단
    key: ABORTED
    meaning: "이 턴과 현재 실행 시도는 중단으로 종결됐다. 수동 중단·서버 재시작·실행 점유 만료·대기 만료 등이 원인이다. 원 턴의 접수/처리중 전환과 실행 재사용은 허용하지 않는다. 보존된 원 질의로 새 턴을 요청하는 조건과 이어가기의 구분은 REQ-013.request_boundary를 따른다. 원 질의의 새 턴 요청은 모든 상태에서 제공하되 현재 접수 조건과 REQ-013.execution_boundary의 실제 실행 통제를 적용한다. 실행용 상태는 REQ-109에 따라 정리하고 원 중단/감사는 보존한다"
    next: []
  - id: TS-05
    state: 실패
    key: FAILED
    meaning: "해당 턴의 처리가 불가능한 것으로 확정된 종결 상태다. 쿼터 소진·권한 부족·복구 불가 오류 등이 원인이며 원 턴은 되살리지 않는다. 원 질의의 별도 새 턴 요청은 현재 조건으로 REQ-013을 따른다"
    next: []
  - id: TS-06
    state: 완료
    key: DONE
    meaning: "필수 감사 이력과 최종 응답을 서버에 저장해 사용자가 조회할 수 있도록 처리를 마쳤다. 브라우저의 접속·수신·열람 여부와 구분하며 재접속은 저장된 결과 조회만 수행한다(REQ-040·REQ-108)"
    next: []
