wait_types:
  - id: WT-01
    type: 승인 대기
    key: APPROVAL
    waits_for: "승인 필요 액션의 실행 전 승인"
    resume: "승인 카드의 명시적 승인은 REQ-005·036의 개인 순서와 실행 직전 검사를 거쳐 처리한다. 승인 전 질문/보류의 유효 카드·기한 유지와 거절 카드 무효화·최초 기한까지 대기·새 카드 재승인은 REQ-017을 따른다. 승인 접수 전 대기 만료와 승인 후 호출 시작 기한을 구분하며 종결 뒤 명시 요청은 새 턴으로 처리한다"
  - id: WT-02
    type: 추가 정보 대기
    key: ADDITIONAL_INFO
    waits_for: "질의 처리에 필요한 정보 요구"
    resume: "REQ-005에 따라 유효한 항목을 유지하고 부족·부적합 항목만 보완받는다. 부분 입력으로 기존 기한을 연장하거나 대기를 끝내지 않으며, 필요한 정보가 모두 확보되면 같은 시도에서 처리를 이어간다"
  - id: WT-03
    type: 의도 확인 대기
    key: INTENT_CONFIRM
    waits_for: "**처리 중 들어온 새 입력의 의도 확인**"
    resume: "**세 갈래로 분기한다** — 변경 항목의 무효화 시작 단계부터 재수행 또는 계속 / 별도 턴 / 중단"
    note: "REQ-007·032에 따라 승인 관련 대기·이미 전송/수행한 액션 또는 분류 실패/판단 불명인 경우 대상 확정 후 차단형으로 사용한다. 대상 미정이면 기존 턴을 임의 정지하지 않고 먼저 대상을 확인한다. 현재 상태에서 복구 가능한 경우에만 처리중을 유지한 병행형을 사용하며 의도 확인은 실행 승인을 대신하지 않는다"
