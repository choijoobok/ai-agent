wait_types:
  - id: WT-01
    type: 승인 대기
    key: APPROVAL
    waits_for: "승인 필요 액션의 실행 전 승인"
    resume: "승인 카드의 명시적 승인은 REQ-005·036의 개인 순서와 실행 직전 검사를 거쳐 처리한다. 거절 카드 무효화·원 턴의 최초 기한까지 대기 유지·추가 질문과 새 승인 카드·만료 후 새 턴 처리는 REQ-017을 따른다"
  - id: WT-02
    type: 추가 정보 대기
    key: ADDITIONAL_INFO
    waits_for: "질의 처리에 필요한 정보 요구"
    resume: "REQ-005에 따라 유효한 항목을 유지하고 부족·부적합 항목만 보완받는다. 부분 입력으로 기존 기한을 연장하거나 대기를 끝내지 않으며, 필요한 정보가 모두 확보되면 같은 시도에서 처리를 이어간다"
  - id: WT-03
    type: 의도 확인 대기
    key: INTENT_CONFIRM
    waits_for: "**처리 중 들어온 새 입력의 의도 확인**"
    resume: "**세 갈래로 분기한다** — 변경 항목의 무효화 시작 단계부터 재수행 또는 계속 / 별도 턴 / 중단"
    note: "**되돌릴 수 없는 것이 걸린 턴에서만 쓴다.** 그 외에는 턴을 처리중으로 둔 채 확인을 병행하며 사용자대기로 전이하지 않는다 — 확인 때문에 멈추는 것 자체가 비용이다"
