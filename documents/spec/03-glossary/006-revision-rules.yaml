revision_rules:
  - path: "처리 중 입력 변경으로 이전 체크포인트가 무효"
    increments: true
    why: "영향받는 실행용 결과/체크포인트를 무효화하고 다시 처리한다. 이전 스텝의 사실·시간·사용량 이력은 보존한다"
  - path: "처리 중 입력 변경이 이후 단계에만 영향"
    increments: false
    why: "유효한 체크포인트를 버리지 않고 같은 턴을 계속 처리한다"
  - path: "모든 상태의 원 질의로 새 턴 요청"
    increments: null
    why: "원 턴의 회차 변경에 해당하지 않는다. REQ-013.request_boundary에 따라 원 턴의 진행/종결은 유지하고 새 턴이 자체 회차와 실행 시도를 시작한다. 원 턴의 회차·체크포인트·승인을 승계하지 않으며 실행용 상태와 감사 이력의 정리는 REQ-109를 따른다"
  - path: "만료되지 않은 승인·추가 정보 대기의 유효 응답 후 이어가기"
    increments: false
    why: "이어간다"
  - path: "비승인 입력 후 계속"
    increments: false
    why: "같은 턴을 계속 처리한다"
  - path: "성공한 턴의 결과 교정 재요청"
    increments: null
    why: "해당 없음 — 종결된 턴은 되돌리지 않고 **새 턴으로 처리한다**"
