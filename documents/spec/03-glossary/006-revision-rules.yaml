revision_rules:
  - path: "처리 중 입력 변경으로 이전 체크포인트가 무효"
    increments: true
    why: "되돌려 다시 한다. 지나온 스텝이 버려진다"
  - path: "처리 중 입력 변경이 이후 단계에만 영향"
    increments: false
    why: "유효한 체크포인트를 버리지 않고 같은 턴을 계속 처리한다"
  - path: "중단된 턴의 재시도"
    increments: false
    why: "사용자 질의와 의도는 바뀌지 않아 같은 회차로 둔다. 이전 시도의 체크포인트·검색·계획·SQL·도구 결과·승인을 실행 입력으로 사용하지 않고 첫 처리 단계부터 새 시도로 시작한다. 시도별 기록과 정리 대상을 구분하며 실행용 재개 상태와 감사 이력의 정리는 REQ-109를 따른다(REQ-013)"
  - path: "승인·추가 정보 응답 후 재개"
    increments: false
    why: "이어간다"
  - path: "비승인 입력 후 계속"
    increments: false
    why: "같은 턴을 계속 처리한다"
  - path: "성공한 턴의 결과 교정 재요청"
    increments: null
    why: "해당 없음 — 종결된 턴은 되돌리지 않고 **새 턴으로 처리한다**"
