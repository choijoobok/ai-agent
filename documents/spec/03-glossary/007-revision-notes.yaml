revision_notes:
  - "**버려진 회차의 기록도 남긴다**(PRN-07). 버려졌다는 것과 기록하지 않는다는 것은 다르며, 그 회차에서 이미 발생한 토큰과 이미 실행된 도구가 거기 있다. 이력은 append-only 이므로 지난 회차의 행을 수정해 표시하지 않는다"
  - "**감사 이력에는 기록 당시의 회차를 함께 남긴다.** 점유 토큰과 **두 값은 직교한다** — 점유 토큰은 '어느 인스턴스가 처리했나', 회차는 '무엇을 하려던 시도인가' 에 답한다"
  - "**되돌림에는 상한을 둔다.** 교정이 반복되면 이력과 비용이 함께 늘어난다. 상한 값은 미확정이다"

