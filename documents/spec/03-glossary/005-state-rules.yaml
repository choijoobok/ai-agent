state_rules:
  - "**중단과 실패를 구분한다.** 재시도 대상은 중단 상태에 한한다"
  - "**사용자대기에는 만료 시각을 둔다.** 만료되면 중단으로 전이하고 대기 중이던 액션은 실행하지 않는다. 만료 시간은 **대기 유형별로** 관리한다 — 승인은 사람의 판단을 기다리므로 길고, 의도 확인은 직전 입력에 대한 반응이므로 짧다"
  - "**이미 액션을 실행한 턴은 재개 대상에서 제외한다.** 실행된 업무 API 는 되돌릴 수 없으므로 재개 시 같은 액션이 다시 실행될 위험이 있다. 타임아웃으로 실행 결과가 불명인 경우도 같은 원칙으로 결과 확인을 먼저 수행한다. 부분 실행 상태를 사용자에게 알리고 새 턴으로 처리한다"
  - "**그 새 턴에서 무엇을 다시 할지는 agent 가 정하지 않는다.** 이미 실행된 액션과 결과를 제시하고 **사용자가 어디부터 다시 할지 선택**한다 — '같은 요청인가' 와 '이미 처리했는가' 를 추론으로 판정하면 오판이 곧 중복 실행이 된다"
  - "**스텝은 별도의 상태 모델을 두지 않는다.** 이력으로만 남으며, 재개 지점은 **현재 회차에서** 마지막으로 완료된 스텝을 근거로 판단한다"

# ── 되돌림과 회차 ───────────────────────────────────────────
