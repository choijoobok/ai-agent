state_rules:
  - "**원 턴의 상태와 새 질의 접수를 구분한다.** 접수·처리·사용자대기·완료·실패·중단의 원 질의 모두 REQ-013에 따라 별도 새 턴으로 요청할 수 있다. 원 턴의 진행/기한은 변경하지 않고 종결된 원 턴은 되살리지 않는다. 실행용 상태 정리는 REQ-109를 따른다"
  - "**사용자대기에는 만료 시각을 둔다.** 만료되면 중단으로 전이하고 대기 중이던 액션은 실행하지 않는다. 승인 요청의 사용자 응답 대기는 **최초 요청 시각부터** 기본 10분(`sys-config.agent.approval.wait-timeout-minutes`)이며, 거절·추가 질문·후보 확인으로 연장하지 않는다. 사용자가 승인한 뒤 대상 시스템 호출을 시작할 수 있는 시간은 기본 5분(`sys-config.agent.approval.execution-ttl-minutes`)이다. 둘 중 어느 만료도 자동 실행·자동 재시작하지 않으며, 이미 정한 만료 시각을 설정 변경으로 소급 변경하지 않는다"
  - "**원 질의의 새 턴 접수는 기존 실행의 재전송이 아니다.** 과거 실행 전송/결과 불명만으로 질의 접수를 막지 않고 REQ-013.execution_boundary를 적용한다. 새 계획의 실행에는 현재 승인·최근 이력을 확인하고, 처리 중/결과 불명인 동일 실행은 결과 확인 없이 재전송하지 않는다"
  - "**새 질의 요청은 실행 승인이 아니다.** 새 턴에서 계획·대상·전체 인자를 다시 확인하고 REQ-026의 명시 승인을 받는다. 이전 실행의 결과 확인/수동 확인은 REQ-105·113을 따르며 기존 승인·실행 상태를 자동 승계하지 않는다"
  - "**스텝은 별도의 업무 상태 전이 모델을 두지 않는다.** REQ-107의 실제 호출 시작·진행·종료 요약과 불변 사건은 저장하며 턴 상태와 구분한다. 변경으로 호출 하나를 취소해도 턴 전체 중단을 뜻하지 않는다. 사용자대기 응답과 처리 중 변경은 현재 회차에서 마지막으로 완료된 스텝을 근거로 이어갈 수 있으나, **원 질의의 새 턴 요청은 이전 체크포인트를 실행 입력으로 쓰지 않고 새 턴에서 첫 처리 단계부터 시작한다**(REQ-013)"
  - "**만료 배치가 아직 돌지 않았더라도 만료된 대기 응답은 거부한다.** 응답 처리 시 서버 기준 만료 시각과 현재 시도·대기 요청을 함께 검사하며, 유효 응답 접수와 만료 전이는 경합 시 하나만 성공한다. 이전 시도·이미 끝난 대기 카드 응답은 새 시도를 진행시키거나 승인하지 못한다"
  - "**종료된 처리를 늦은 결과로 되살리지 않는다.** 중단·종결·점유 상실 뒤 늦게 도착한 호출 결과는 해당 시도의 감사 기록으로만 처리하고 후속 실행이나 새 시도의 입력으로 사용하지 않는다. 감사 기록의 저장 범위·마스킹·보존은 REQ-107을 따른다"
  - "**원 질의의 새 턴 요청도 개인별 실행 한도를 따른다.** REQ-013의 현재 접수 조건과 동일 접수 식별자의 중복 방지를 적용하고, 별도 명시 요청은 원 질의가 같아도 각각 접수한다. REQ-036의 순서 대기는 실행 한도에서 제외하며 선택/인계부터 집계한다. 원 턴의 진행/종결과 새 턴의 점유를 구분한다"

# ── 되돌림과 회차 ───────────────────────────────────────────
