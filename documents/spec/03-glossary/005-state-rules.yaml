state_rules:
  - "**중단과 실패를 구분한다.** 재시도 후보는 중단 상태에 한하며 실제 허용 조건은 REQ-013을 따른다. 중단은 현재 시도의 종료이고 완료·실패는 턴의 종결이다. 중단 시에도 실행용 재개 상태는 REQ-109에 따라 무효화·정리한다"
  - "**사용자대기에는 만료 시각을 둔다.** 만료되면 중단으로 전이하고 대기 중이던 액션은 실행하지 않는다. 승인 요청의 사용자 응답 대기는 **최초 요청 시각부터** 기본 10분(`sys-config.agent.approval.wait-timeout-minutes`)이며, 거절·추가 질문·후보 확인으로 연장하지 않는다. 사용자가 승인한 뒤 대상 시스템 호출을 시작할 수 있는 시간은 기본 5분(`sys-config.agent.approval.execution-ttl-minutes`)이다. 둘 중 어느 만료도 자동 실행·자동 재시작하지 않으며, 이미 정한 만료 시각을 설정 변경으로 소급 변경하지 않는다"
  - "**실행 요청이 이미 전송됐거나 결과가 불명인 턴은 중단 후 같은 턴의 재시도 대상에서 제외한다**(REQ-013). 같은 액션이 다시 실행될 위험이 있으므로 등록된 방법으로 결과를 먼저 확인하고 부분 실행 상태를 알린다. 재요청은 사용자가 정해 새 턴으로 처리한다. 이는 정상 진행 중 후속 액션의 유효한 개별 승인에 응답하여 이어가는 경로(REQ-026)를 금지하는 규칙이 아니다"
  - "**그 새 턴에서 무엇을 다시 할지는 agent 가 정하지 않는다.** 이미 실행된 액션과 결과를 제시하고 **사용자가 어디부터 다시 할지 선택**한다 — '같은 요청인가' 와 '이미 처리했는가' 를 추론으로 판정하면 오판이 곧 중복 실행이 된다"
  - "**스텝은 별도의 상태 모델을 두지 않는다.** 이력으로만 남는다. 사용자대기 응답과 처리 중 변경은 현재 회차에서 마지막으로 완료된 스텝을 근거로 이어갈 수 있으나, **중단 턴의 재시도는 이전 체크포인트를 실행 입력으로 쓰지 않고 첫 처리 단계부터 시작한다**(REQ-013)"
  - "**만료 배치가 아직 돌지 않았더라도 만료된 대기 응답은 거부한다.** 응답 처리 시 서버 기준 만료 시각과 현재 시도·대기 요청을 함께 검사하며, 유효 응답 접수와 만료 전이는 경합 시 하나만 성공한다. 이전 시도·이미 끝난 대기 카드 응답은 새 시도를 진행시키거나 승인하지 못한다"
  - "**종료된 처리를 늦은 결과로 되살리지 않는다.** 중단·종결·점유 상실 뒤 늦게 도착한 호출 결과는 해당 시도의 감사 기록으로만 처리하고 후속 실행이나 새 시도의 입력으로 사용하지 않는다. 감사 기록의 저장 범위·마스킹·보존은 REQ-107을 따른다"
  - "**재시도 접수도 실행 용량을 우회하지 않는다.** 사용자 요청과 REQ-013의 허용 조건을 확인해 중단에서 접수로 전환한 후 REQ-036에 따라 실행하거나 대기열에 둔다. 접수 대기 중 중단도 허용하며 시작과 중단은 원자적으로 판정한다"

# ── 되돌림과 회차 ───────────────────────────────────────────
