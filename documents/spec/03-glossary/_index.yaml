# 용어사전 — 유비쿼터스 언어
#
# 작성 단계: P1
# status: migrated — 사용자 승인 전이다.
#
# **이 사전이 모든 문서·DB 테이블·API 필드 명명의 기준이다.** 동의어를 섞어 쓰지 않는다.
# `key` 는 영문 키이며, DB 컬럼 값과 코드 상수는 이 키를 대문자 스네이크로 쓴다.
#
# 절이 셋이고 **성격이 다르다** — 섞으면 남의 어휘가 우리 명명의 근거가 된다:
#   terms:            우리 용어. `key` 를 갖고 **명명의 기준이다**
#   framework_terms:  남의 어휘(LangGraph4j · Spring AI). `key` 가 **없다** — 읽기 위해 싣는다
#   confusions:       **실제로 어긋난 짝.** 정의를 나란히 두는 것으로 막히지 않는 것만 더한다

meta:
  status: migrated
  baselined: null

# ── 대화 구조 ────────────────────────────────────────────────
  source_commentary: |-
    [1] 용어사전 — 유비쿼터스 언어
    [2] 
    [3] 작성 단계: P1
    [4] status: migrated — 사용자 승인 전이다.
    [5] 
    [6] **이 사전이 모든 문서·DB 테이블·API 필드 명명의 기준이다.** 동의어를 섞어 쓰지 않는다.
    [7] `key` 는 영문 키이며, DB 컬럼 값과 코드 상수는 이 키를 대문자 스네이크로 쓴다.
    [8] 
    [9] 절이 셋이고 **성격이 다르다** — 섞으면 남의 어휘가 우리 명명의 근거가 된다:
    [10]   terms:            우리 용어. `key` 를 갖고 **명명의 기준이다**
    [11]   framework_terms:  남의 어휘(LangGraph4j · Spring AI). `key` 가 **없다** — 읽기 위해 싣는다
    [12]   confusions:       **실제로 어긋난 짝.** 정의를 나란히 두는 것으로 막히지 않는 것만 더한다
    [18] ── 대화 구조 ────────────────────────────────────────────────
    [82] ── 실행과 자동화 ────────────────────────────────────────────
    [125] ── 정책과 권한 ──────────────────────────────────────────────
    [222] ── 실행 기반 어휘 (구현 수준) ───────────────────────────────
    [223] **업무 용어가 아니라 구현 어휘다.** 그래도 우리가 정한 것이므로 `key` 를 갖고 명명의
    [224] 기준이 된다 — 정본은 documents/design/turn-execution.md 이고 여기는 그 색인이다.
    [296] ── 처리 중 입력의 어휘 ──────────────────────────────────────
    [330] ── 모델 공급과 비용 (ADR-004) ──────────────────────────────
    [331] **「공급사」를 셋으로 가른 결과다.** 가르기 전에는 *약관을 심사하는 대상* 과 *값을 청구하는
    [332] 곳* 이 한 낱말이었고, 같은 모델을 여러 경로로 사면 그 둘이 갈라진다.
    [374] system 공통 운영 언어
    [429] ── 개념 계층 ────────────────────────────────────────────────
    [432] ── 턴 상태 모델 ────────────────────────────────────────────
    [433] 한 턴은 수 초에서 수 분 이상 걸리며, 사용자 이탈·중단·서버 장애를 견디고 재개될 수
    [434] 있어야 한다. 따라서 턴은 **상태를 가진 지속 작업**으로 다룬다. 상태는 여섯으로 한정한다.
    [492] ── 되돌림과 회차 ───────────────────────────────────────────
    [515] ── 프레임워크 용어 ─────────────────────────────────────────
    [516] **`terms:` 와 갈라 둔 이유가 있다 — 이것은 우리 명명의 기준이 아니다.** 그래서 `key` 가
    [517] 없다. 남의 어휘이며, 구현이나 documents/design/turn-execution.md 를 읽을 때 필요해서
    [518] 싣는다. 오케스트레이션이 LangGraph4j 로 확정된 전제 위에 있고(ASM-003) 그 전제가
    [519] 바뀌면 이 절은 통째로 갈린다 — 그때 `terms:` 는 흔들리지 않는다. **그것이 가른 값이다.**
    [521] 그래프 실행 (LangGraph4j)
    [563] 멈춤과 재개
    [605] 실행 문맥과 훅
    [645] 모델 계층 (Spring AI)
    [665] 구축 구조 (00-charter.yaml deployment_shapes)
    [721] 훅과 인터럽트의 실행 순서 — **우리 설계가 이 순서에 의존한다.**
    [728] ── 헷갈리는 짝 ─────────────────────────────────────────────
    [729] **이 절이 사전의 본론이다.** 정의를 나란히 두는 것으로는 혼동이 막히지 않는다 —
    [730] 실제로 어긋난 지점을 *무엇과 무엇이 다른가* 로 적어야 막힌다(CLAUDE.md §5-13 과 같은 뿌리).
    [731] 
    [732] **미리 채우지 않는다.** 설계 논의·코드 리뷰·재현 실험에서 **실제로 혼동이 일어난 것만**
    [733] 더한다. 짝은 별도 ID 를 갖지 않고 `pair` 의 두 ID 로 식별한다 — 짝은 산출물이 아니라
    [734] 두 용어 사이의 관계이고, 새 접두를 만들면 `trace-check` 가 검사하지 않는 ID 가 늘어난다.

