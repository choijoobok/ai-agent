    table: SYS_CODE_REF
    features: [FEAT-504]
    attributes: [{ name: GRP_CD, type: varchar, pk: true }, { name: DTL_CD, type: varchar, pk: true }, { name: REF_CD, type: varchar, pk: true }]
    columns: [GRP_CD, DTL_CD, REF_CD, REF_VAL, REG_ID, REG_DTM, MOD_ID, MOD_DTM]
    relations: ["(GRP_CD,DTL_CD) -> ENT-514", "(GRP_CD,REF_CD) -> ENT-515"]
    rules: ["원 코드 또는 정의 삭제 시 같은 트랜잭션으로 정리"]
