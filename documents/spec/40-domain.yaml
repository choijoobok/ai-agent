# 도메인·데이터 모델 — system은 기존 31개 테이블의 물리 구조·데이터를 바꾸지 않고 쓰기 소유권만 인수한다.
meta:
  status: in_progress
  baselined: null
  workstreams: { system: reviewed }
  physical_policy: "ARCH-024 — 기존 이름·스키마·컬럼·제약·데이터 유지, 복제와 이중 쓰기 금지"

conventions:
  naming: "기존 SYS_* 이름 보존; 신규 system 테이블이 필요할 때만 승인된 changeset 규칙 적용"
  time: "현재 컬럼 타입과 의미를 보존하고 신규 일시는 timestamptz"
  audit: "REG_ID/REG_DTM/MOD_ID/MOD_DTM이 있는 테이블은 기존 감사 4컬럼 유지"
  delete: "이력은 사용자·관리 API로 삭제하지 않고 설정된 보존 기간이 지난 행만 파기 배치가 hard delete한다. 계정·권한 기준은 참조 무결성 또는 비활성화, 사용자 UI 상태는 소유 범위 행만 hard delete한다"
  source: "sources/backend/bootstrap/src/main/resources/db/changelog/schema/*.yaml"
  requiredness: "PK attributes are non-null. All other nullable/default constraints are the currently applied Liquibase constraints; a system module move may not loosen or tighten them"
  history_policy:
    immutable_history: [ENT-505, ENT-521, ENT-522]
    append_then_finalize: [ENT-524]
    state_history: [ENT-527]
    audit_columns_only: [ENT-501, ENT-502, ENT-503, ENT-506, ENT-507, ENT-508, ENT-509, ENT-510, ENT-511, ENT-512, ENT-513, ENT-514, ENT-515, ENT-516, ENT-517, ENT-518, ENT-520, ENT-523, ENT-525, ENT-526, ENT-528, ENT-529, ENT-531]
    no_history: [ENT-504, ENT-519, ENT-530]

entities:
  - id: ENT-501
    name: "사용자 계정"
    table: SYS_USER
    features: [FEAT-501]
    attributes: [{ name: USER_ID, type: varchar, pk: true }]
    columns: [USER_ID, USER_NM, EMAIL, PWD, USE_YN, VALID_FROM_DT, VALID_TO_DT, LOCK_YN, LOCK_DTM, LOGIN_FAIL_CNT, PWD_CHG_DTM, PWD_INIT_YN, LAST_LOGIN_DTM, DORMANT_YN, LOCALE_CD, REG_ID, REG_DTM, MOD_ID, MOD_DTM]
    rules: ["물리 삭제 금지", "상태·기간·잠금·휴면·IP를 로그인 때 함께 판정"]
    indexes: [{ name: IX_SYS_USER_01, purpose: "사용자 목록·로그인 후보 조회" }]
    audit: standard
    delete_policy: never

  - id: ENT-502
    name: "사용자 비밀번호 이력"
    table: SYS_USER_PWD_HIST
    features: [FEAT-501]
    attributes: [{ name: USER_ID, type: varchar, pk: true }, { name: CHG_SEQ, type: bigint, pk: true }]
    columns: [USER_ID, CHG_SEQ, PWD, REG_ID, REG_DTM]
    relations: ["USER_ID -> ENT-501.USER_ID"]
    rules: ["비밀번호 재사용 판정용", "계정 변경과 같은 수명주기로 보존"]
    audit: created_only
    delete_policy: never

  - id: ENT-503
    name: "사용자 접속 허용 IP"
    table: SYS_USER_IP_ALLOW
    features: [FEAT-501]
    attributes: [{ name: USER_ID, type: varchar, pk: true }, { name: IP_CIDR, type: varchar, pk: true }]
    columns: [USER_ID, IP_CIDR, USE_YN, VALID_FROM_DT, VALID_TO_DT, REG_ID, REG_DTM, MOD_ID, MOD_DTM]
    relations: ["USER_ID -> ENT-501.USER_ID"]
    rules: ["IPv4·IPv6 CIDR은 서버 리터럴 파서로 검증", "유효 기간과 사용 여부를 로그인 때 판정"]
    audit: standard
    delete_policy: hard

  - id: ENT-504
    name: "비밀번호 재설정 토큰"
    table: SYS_USER_PWD_RESET
    features: [FEAT-501]
    attributes: [{ name: USER_ID, type: varchar, pk: true }]
    columns: [USER_ID, TOKEN_HASH, ISSUE_DTM, EXPIRE_DTM, TRY_CNT, USED_YN]
    relations: ["USER_ID -> ENT-501.USER_ID"]
    state_machine: { ISSUED: [VERIFIED, EXPIRED], VERIFIED: [USED, EXPIRED], USED: [], EXPIRED: [] }
    rules: ["원문 토큰 저장 금지", "사용·만료 토큰 재사용 금지"]
    audit: none
    delete_policy: hard

  - id: ENT-505
    name: "로그인 이력"
    table: SYS_LO_LOGIN
    features: [FEAT-501, FEAT-507]
    attributes: [{ name: LOGIN_LOG_SEQ, type: bigint, pk: true }]
    columns: [LOGIN_LOG_SEQ, USER_ID, LOGIN_RSLT_CD, CLIENT_IP, USER_AGENT, TRACE_ID, CRE_DTM]
    indexes: []
    index_policy: "현재 물리 인덱스를 그대로 두며 모듈 이동에서 새 인덱스를 만들지 않는다"
    rules: ["없는 계정의 시도 ID도 보존", "결과 코드 전수 분류", "기본 365일 보존 뒤 파기 배치가 삭제"]
    audit: created_only
    delete_policy: never

  - id: ENT-506
    name: "역할"
    table: SYS_ROLE
    features: [FEAT-502]
    attributes: [{ name: ROLE_ID, type: varchar, pk: true }]
    columns: [ROLE_ID, ROLE_NM, ROLE_DESC, USE_YN, REG_ID, REG_DTM, MOD_ID, MOD_DTM]
    rules: ["역할명은 권한 판정 근거가 아님", "역할 간 겸임 금지 하드코딩 없음"]
    audit: standard
    delete_policy: hard

  - id: ENT-507
    name: "사용자 역할 부여"
