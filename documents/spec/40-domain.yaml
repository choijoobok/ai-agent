    relations: ["USER_ID -> ENT-501.USER_ID", "LINK_MENU_CD -> ENT-510.MENU_CD (nullable)"]
    state_machine: { UNREAD: [READ], READ: [] }
    rules: ["수신자 자신의 행만 조회·읽음 처리", "admin은 public 계약으로 전달"]
    audit: created_only
    delete_policy: hard

  - id: ENT-527
    name: "계정·권한 관리 요청"
    table: SYS_NOTI_REQUEST
    features: [FEAT-509]
    attributes: [{ name: REQ_ID, type: bigint, pk: true }]
    columns: [REQ_ID, USER_ID, REQ_TYPE_CD, REQ_CONTENT, REQ_STAT_CD, HANDLER_ID, HANDLE_DTM, HANDLE_MEMO, CRE_DTM]
    relations: ["USER_ID -> ENT-501.USER_ID", "HANDLER_ID -> ENT-501.USER_ID (nullable)"]
    indexes: []
    index_policy: "현재 물리 인덱스를 그대로 두며 모듈 이동에서 새 인덱스를 만들지 않는다"
    state_machine: { RECEIVED: [DONE, REJECTED], DONE: [], REJECTED: [] }
    rules: ["판정은 계정·권한 변경과 분리", "종결 요청 재처리 금지", "REJECTED는 처리 메모 필수", "동시 판정은 대상 행 잠금으로 직렬화하고 뒤 요청은 상태 충돌로 거부"]
