    columns: [GRP_CD, DTL_CD, DTL_NM, DTL_DESC, SYS_YN, USE_YN, SORT_NO, REG_ID, REG_DTM, MOD_ID, MOD_DTM]
    relations: ["GRP_CD -> ENT-513.GRP_CD"]
    rules: ["SYS_YN=Y 삭제·비활성화 금지", "코드명 메시지는 같은 수명주기로 정리"]
    audit: standard
    delete_policy: hard

  - id: ENT-515
    name: "코드 그룹 참조 정의"
    table: SYS_CODE_GRP_REF
    features: [FEAT-504]
    attributes: [{ name: GRP_CD, type: varchar, pk: true }, { name: REF_CD, type: varchar, pk: true }]
    columns: [GRP_CD, REF_CD, REF_NM, REF_DESC, REG_ID, REG_DTM, MOD_ID, MOD_DTM]
    relations: ["GRP_CD -> ENT-513.GRP_CD"]
    rules: ["참조값보다 정의가 먼저 존재"]
    audit: standard
    delete_policy: hard

  - id: ENT-516
