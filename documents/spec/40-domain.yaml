    rules: ["열람·권한 변경을 포함한 모든 API 접근 기록", "원문 수정·삭제 경로 없음", "권한 부여·회수 전용 원장이 아니라 시스템 사용 이력", "기본 90일 보존 뒤 파기 배치가 삭제"]
    audit: created_only
    delete_policy: never

  - id: ENT-522
