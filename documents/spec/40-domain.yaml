    rules: ["등록 BatchJob·cron·timezone 검증", "잠금 만료와 최소 실행 간격은 양수"]
    audit: standard
    delete_policy: hard

  - id: ENT-524
    name: "배치 실행 이력"
    table: SYS_BATCH_HISTORY
    features: [FEAT-508]
    attributes: [{ name: HIST_ID, type: bigint, pk: true }]
    columns: [HIST_ID, BATCH_ID, EXEC_TYPE_CD, NODE_ID, START_DTM, END_DTM, ELAPSED_MS, RSLT_CD, RSLT_MSG, RSLT_DTL_MSG, ERR_MSG, CANCEL_REQ_DTM]
    relations: ["BATCH_ID -> ENT-523.BATCH_ID"]
    indexes: []
    index_policy: "현재 물리 인덱스를 그대로 두며 모듈 이동에서 새 인덱스를 만들지 않는다"
    state_machine: { RUNNING: [SUCCESS, FAIL, CANCELED, LOST], SUCCESS: [], FAIL: [], SKIP_LOCK: [], SKIP_COOLDOWN: [], CANCELED: [], LOST: [] }
    rules: ["SKIP_LOCK·SKIP_COOLDOWN은 RUNNING을 거치지 않는 종결 시도", "CANCEL_REQ_DTM은 상태가 아니라 중단 요청 시각", "LOST의 ELAPSED_MS는 null"]
