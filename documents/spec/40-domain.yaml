    delete_policy: hard

  - id: ENT-512
    name: "메뉴와 API 매핑"
    table: SYS_MENU_API
    features: [FEAT-503]
    attributes: [{ name: MENU_CD, type: varchar, pk: true }, { name: API_URL, type: varchar, pk: true }]
    columns: [MENU_CD, API_URL, REG_ID, REG_DTM, MOD_ID, MOD_DTM]
    relations: ["MENU_CD -> ENT-510.MENU_CD", "API_URL -> ENT-511.API_URL"]
    rules: ["다대다 허용", "매핑 없는 service API 실패 폐쇄"]
    audit: standard
    delete_policy: hard

