    relations: ["USER_ID -> ENT-501.USER_ID", "ROLE_ID -> ENT-506.ROLE_ID"]
    rules: ["유효 기간 안의 행만 합성", "회수는 현재 구현대로 대상 행을 물리 삭제"]
    audit: standard
    delete_policy: hard

  - id: ENT-508
    name: "역할별 메뉴 액션 권한"
    table: SYS_ROLE_MENU_AUTH
    features: [FEAT-502, FEAT-503]
    attributes: [{ name: ROLE_ID, type: varchar, pk: true }, { name: MENU_CD, type: varchar, pk: true }, { name: ACTION_CD, type: varchar, pk: true }]
    columns: [ROLE_ID, MENU_CD, ACTION_CD, REG_ID, REG_DTM, MOD_ID, MOD_DTM]
    relations: ["ROLE_ID -> ENT-506.ROLE_ID", "MENU_CD -> ENT-510.MENU_CD"]
    rules: ["ACTION_CD는 READ/SAVE/EXECUTE/EXPORT", "역할 코드와 메뉴 코드 조합 금지 없음", "회수는 현재 구현대로 대상 행을 물리 삭제"]
    audit: standard
    delete_policy: hard

  - id: ENT-509
    name: "사용자별 메뉴 액션 예외"
    table: SYS_USER_MENU_AUTH
    features: [FEAT-502, FEAT-503]
    attributes: [{ name: USER_ID, type: varchar, pk: true }, { name: MENU_CD, type: varchar, pk: true }, { name: ACTION_CD, type: varchar, pk: true }]
    columns: [USER_ID, MENU_CD, ACTION_CD, VALID_FROM_DT, VALID_TO_DT, GRANT_RSN, REG_ID, REG_DTM, MOD_ID, MOD_DTM]
    relations: ["USER_ID -> ENT-501.USER_ID", "MENU_CD -> ENT-510.MENU_CD"]
    rules: ["유효 기간 안의 행만 합성", "개인 예외가 역할 권한과 만나는 규칙은 AUTHZ-090", "회수는 현재 구현대로 대상 행을 물리 삭제"]
    audit: standard
    delete_policy: hard

  - id: ENT-510
    name: "메뉴 트리"
