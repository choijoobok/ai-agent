deployment:
  - id: CON-012
    title: "독립형 배포"
    constraint: "레거시와 별도로 배포·운영되며 업무 시스템의 배포 주기에 종속되지 않는다. DB 와 WAS 는 내부 폐쇄망 설치를 기본 가정으로 한다. **AI 전용 DB 는 우리가 설치해 제공한다** — 고객사가 이미 쓰는 PostgreSQL 인스턴스를 받아 쓰지 않는다"
    why: "**완제품을 납품하는 형태이기 때문이다**(CON-014). 그래서 PostgreSQL 버전과 확장 설치가 우리 손 안에 있고, ADR-005(벡터 저장소)가 그 전제 위에 선다 — 남의 인스턴스를 받아 쓰면 확장 설치가 고객사마다 협의 항목이 된다"
    decided_at: "2026-09-10 — 사용자 확정. 그 전에는 *어디에 설치하나*(폐쇄망)만 있고 *누가 설치하나*가 spec 에 없었다"
  - id: CON-013
    title: "단일 아웃바운드 통로 · 인바운드 미허용"
    constraint: "폐쇄망에서 외부로 나가는 경로는 하나로 제한하고 인바운드는 허용하지 않는다. 기본 방식은 DMZ 아웃바운드 프록시 경유"
    infra_requirements: "① 외부 모델 목적지에 대한 아웃바운드 허용 — **IP 가 아니라 도메인 기준**(공급 경로 사정으로 변동되므로 IP 허용 목록은 주기적으로 깨진다) ② 프록시 경유 정보 제공 ③ 인바운드 미허용"
    owner: ACT-009
  - id: CON-014
    title: "SaaS 가 아니라 고객사 서버 직접 구축"
    constraint: "운영 이관 후 고객사별로 개별 유지보수한다. **고객사 간 버전이 갈릴 수 있음을 전제한다** — 이 헌장과 원칙은 버전이 갈려도 유지되어야 하는 공통 기반이다"
    operations: "**운영은 둘로 나뉜다**(사용자 확정 2026-09-10) — **일상 운영은 고객사 관리자**가 admin 화면으로 한다(계정·권한·쿼터와 비용 한도·업무 지식과 카탈로그 관리). **장애 대응과 업그레이드는 우리가 한다.** 그래서 admin 화면은 *우리가 쓰는 도구* 가 아니라 **고객사 관리자가 매일 쓰는 제품**이며, 그 사실이 화면 요건의 기준이다"

# ── 착수 시 확정해야 하는 것 ────────────────────────────────
# 시스템 기능이 아니므로 값을 여기서 확정하지 않는다. 대신 **확정되지 않은 상태로
# 구축에 들어가지 않는다**는 것을 요건으로 둔다. 미확정 항목은 ASM- 으로 관리한다.
