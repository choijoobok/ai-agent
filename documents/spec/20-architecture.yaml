# 아키텍처 — 구성 · 모듈 경계 · 통신 규칙 · 데이터소스 · LLM 연동 · 실행 점유
#
# 작성 단계: P2
# status: migrated — 사용자 승인 전이다.
#
# **기술 스택과 제약은 02-constraints.yaml 이 갖는다** — 여기에 다시 적지 않는다.
# 여기는 *구조* 다: 무엇이 무엇에 닿을 수 있고 무엇에 닿을 수 없나.

meta:
  status: migrated
  baselined: null

# ── 논리 구성 ────────────────────────────────────────────────
topology:
  id: ARCH-001
  core_claim: "**업무 시스템과 대화·추론 LLM 에 닿는 유일한 접점이 agent 다.** 업무 DB 를 읽는 경로, 업무 API 를 실행하는 경로, 사용자 질의가 LLM 으로 나가는 경로가 모두 agent 한 곳에 모인다"
  zones:
    - zone: "외부망"
      contains: "대화·추론 LLM API · 임베딩 모델 API"
    - zone: "DMZ"
      contains: "아웃바운드 게이트웨이 (단일 통로 · 인바운드 미허용)"
    - zone: "내부 폐쇄망 — Agentic AI Hub"
      contains: "portal · admin · agent 모듈 · AI 전용 DB(PostgreSQL — 설정·이력·지식·임베딩 벡터)"
    - zone: "내부 폐쇄망 — 레거시 (복수)"
      contains: "업무 시스템 WAS/REST · 업무 운영 DB(여러 시스템이 공유 가능 · 이기종 DBMS) · 통합 DW"
  notes:
    - "**외부망에는 두 종류가 있다** — 대화·추론 LLM 과 임베딩 모델. 대화·추론 LLM 은 agent 만 호출한다. 임베딩의 호출 주체는 둘이다: **admin**(지식 등록·수정·재임베딩 시 본문 임베딩) · **agent**(질의 키워드 임베딩으로 지식 검색). 두 경로 모두 공통 컴포넌트를 경유하며 외부로 나가는 통로는 하나다"
    - "**임베딩 사용은 선택 기능이다.** 끄면 임베딩 모델 연동 없이 태그 검색만으로 동작한다"
    - "지식 본문과 임베딩 벡터는 **별도 벡터 DB 를 두지 않고** AI 전용 DB 의 테이블로 관리한다 — 폐쇄망 운영 구성요소를 늘리지 않기 위함이다"
    - "**사용자 접속 방식은 고객사 정책을 따른다** — VPN 전용·사내 PC 원격·VDI 등. 이 시스템이 접속 경로를 규정하지 않는다"
    - "**알림 발송 경로도 고객사 환경에 따라 다르다** — 자체 메일 전송 에이전트 보유 여부"

  # ── 논리 구성도의 원본 ────────────────────────────────────
  # **여기가 그림의 정본이다.** `/doc-gen` 이 이 노드·간선으로
  # `documents/generated/20-아키텍처.md` 의 Mermaid 를 그린다(산출물 지도 8행).
  # **그림 파일을 만들지 않는다** — 이미지는 diff·검색·부분 수정이 되지 않는다.
  #
  # 원본(agentic-ai 의 6.1)은 Mermaid 로 그려져 있었고 이관에서 산문만 왔다.
  # 산문에는 *무엇이 어느 구역에 있나* 는 있어도 **무엇이 무엇을 부르나** 가 없어
  # 다시 그릴 수 없었다. 그 간선이 이 절이다 — 규칙은 module_boundaries 가 갖는다.
  nodes:
    - { key: USER,   zone: 사용자,    label: "사용자 PC",              note: "접속 방식은 고객사 정책(CON-015)" }
    - { key: LLM,    zone: 외부망,    label: "대화·추론 LLM API" }
    - { key: EMB,    zone: 외부망,    label: "임베딩 모델 API",        note: "선택 기능 — 끄면 태그 검색만으로 동작한다" }
    - { key: GW,     zone: DMZ,       label: "아웃바운드 게이트웨이",   note: "단일 통로 · 인바운드 미허용(CON-013)" }
    - { key: PORTAL, zone: Hub,       label: "portal 모듈" }
    - { key: ADMIN,  zone: Hub,       label: "admin 모듈" }
    - { key: AGENT,  zone: Hub,       label: "agent 모듈" }
    - { key: AIDB,   zone: Hub,       label: "AI 전용 DB (PostgreSQL)", kind: db, note: "설정 · 이력 · 지식 · 임베딩 벡터(CON-001)" }
    - { key: WAS1,   zone: 레거시,    label: "업무 시스템 A — WAS / REST API" }
    - { key: WAS2,   zone: 레거시,    label: "업무 시스템 B — WAS / REST API" }
    - { key: DB1,    zone: 레거시,    label: "업무 운영 DB",            kind: db, note: "여러 시스템이 공유할 수 있다" }
    - { key: DB2,    zone: 레거시,    label: "업무 운영 DB",            kind: db, note: "이기종 DBMS" }
    - { key: DW,     zone: 레거시,    label: "통합 DW",                 kind: db }
    - { key: MAIL,   zone: 고객사,    label: "메일 발송 경로",          note: "고객사 환경에 따라 상이(CON-031)" }
  edges:
    - { from: USER,   to: PORTAL }
    - { from: USER,   to: ADMIN }
    - { from: PORTAL, to: AGENT,  label: "채팅 질의·응답", note: "**비동기다** — 접수 후 즉시 반환하고 진행 상태는 폴링으로 조회한다(ARCH-015)" }
    - { from: PORTAL, to: AIDB }
    - { from: ADMIN,  to: AIDB }
    - { from: AGENT,  to: AIDB }
    - { from: AGENT,  to: DB1,    label: "조회" }
    - { from: AGENT,  to: DB2,    label: "조회" }
    - { from: AGENT,  to: DW,     label: "조회" }
    - { from: AGENT,  to: WAS1,   label: "실행 (REST)" }
    - { from: AGENT,  to: WAS2,   label: "실행 (REST)" }
    - { from: AGENT,  to: GW }
    - { from: ADMIN,  to: GW }
    - { from: GW,     to: LLM,    label: "질의·응답" }
    - { from: GW,     to: EMB,    label: "지식 임베딩 · 질의 키워드 임베딩" }
    - { from: AGENT,  to: MAIL,   label: "알림" }
  edge_invariants:
    - "**업무 DB·업무 API·대화·추론 LLM 에 닿는 간선은 agent 에서만 나간다.** 이 그림에서 그것이 보이는 것이 요점이며, portal·admin 에서 그런 간선이 그려지면 ARCH-013 위반이다"
    - "**admin → GW 간선은 임베딩 전용이다.** admin 이 대화·추론 LLM 을 부르는 간선은 없다 — 통로는 공유하지만 인터페이스가 갈려 있어(FEAT-304) 참조 관계로 검사된다"
    - "**모듈 사이의 간선은 portal → agent 하나뿐이다**(ARCH-011). 나머지는 각자 AIDB 로 직접 간다 — 조회를 위해 다른 모듈의 서비스를 경유하지 않는다"
    - "**레거시에서 Hub 로 들어오는 간선이 없다** — 인바운드 미허용(CON-013). 인사·조직 변경 수신은 예외이며 그 규약은 51-interfaces.yaml 이 갖는다"

# ── 모듈 경계 ────────────────────────────────────────────────
# 모듈의 정의와 책임은 01-actors.yaml 의 modules 가 갖는다. 여기는 **경계** 다.
module_boundaries:
  - id: ARCH-010
    rule: "모듈 경계는 **화면 소스와 백엔드의 컨트롤러·서비스·DTO/Record 에만** 적용한다. Entity 와 DB 는 모듈 경계를 두지 않고 공통으로 둔다"
  - id: ARCH-011
    rule: "**모듈의 서비스는 서로 호출하지 않는다.** 유일한 예외는 portal 의 채팅 화면이 agent 를 호출하는 경로다. 각 모듈은 자기 화면에 필요한 데이터를 공통 Entity·Repository 로 직접 조회하며, 조회를 위해 다른 모듈의 서비스를 경유하지 않는다"
  - id: ARCH-012
    rule: "**권한 판정 로직은 공통 컴포넌트 하나에만 둔다**"
    why: "agent 의 조회·실행 통제와 portal 의 접근 가능 목록 조회가 같은 판정을 각각 구현하면 두 결과가 어긋난다"
    traces_to: [FEAT-303]
  - id: ARCH-013
    rule: "**portal·admin 은 대화·추론 LLM 을 호출하지 않고, 업무 DB·업무 API 에 직접 접근하지 않는다**"
    why: "편의의 문제가 아니라 **보안 경계**다. 통합 배포 구조에서는 런타임에 호출자를 신뢰할 수 없으므로 **의존성 규칙 검사로 강제한다** — `modules/admin`·`modules/portal` 이 대화·추론 인터페이스를 참조하면 빌드가 실패해야 한다"
    traces_to: [PRN-01, PRN-02]
  - id: ARCH-014
    rule: "분리 배포는 **agent 만** 대상으로 한다(부하에 따른 스케일 아웃). 그때도 **DB 는 하나를 공유**하고 공통 Entity 를 양쪽이 함께 사용하므로 **스키마 변경 시 배포 시점을 맞춘다**"
  - id: ARCH-015
    rule: "**portal ↔ agent 통신은 비동기로 한다.** portal 은 질의를 접수시키고 즉시 반환받으며, 진행 상태와 결과는 프론트엔드 폴링으로 조회한다. 폴링은 턴 처리 중에만 수행하고 응답 수신 시 중지하며 **주기는 admin 시스템 설정으로 관리한다**"
    why: "서버 푸시(SSE·WebSocket)를 쓰지 않는 이유는 **프록시·L7 로드밸런서의 유휴 타임아웃과 응답 버퍼링 설정에 좌우되지 않기 위함**이다. 배포 환경이 고객사마다 다르므로 환경 의존을 줄이는 쪽을 택한다"
    note: "이 호출을 **portal 트랜잭션 안에 묶지 않는다** — 분리 시 원격 호출로 바뀔 수 있다"

write_ownership:
  claim: "테이블별 소유 모듈이나 모듈 간 접근 허가를 따지지 않는다. 세 모듈 모두 공통 Entity 로 AI 전용 DB 를 조회한다"
  why: "대화 기록처럼 agent 가 남기고 admin·portal 이 함께 읽는 데이터가 많아, 소유 규칙을 세우면 중계 계층만 늘어난다"
  exceptions:
    - "**감사 이력·토큰 사용량은 agent 의 처리 경로에서만 생성한다.** portal·admin 은 읽기만 하며 수정·삭제하지 않는다"
    - "**정책·기준 정보·쿼터 승인 상태는 admin 에서만 변경한다.** portal 은 신청을 등록할 뿐 승인 상태를 바꾸지 않는다"

# ── portal 진입 경로 · 레거시 딥링크 ────────────────────────
deeplink:
  id: ARCH-020
  why: "portal 을 별도 사이트로만 열어두면 사용자는 기존 업무 화면과 Hub 를 계속 오가야 하고, **탐색 비용(PRB-03)이 그대로 남는다.** Hub 가 '또 하나의 시스템' 이 되지 않게 한다"
  rules:
    - "Hub 는 **딥링크 규약과 팝업 호출 스니펫을 제공**한다. 실제 링크·버튼을 레거시 화면에 설치하는 것은 **고객사 선택 사항**이다. 링크 삽입은 레거시의 스키마·기능 변경이 아니므로 PRN-09 에 저촉되지 않는다"
    - "딥링크는 **별 창 팝업으로 portal 채팅 화면을 열고** 파라미터로 초기 문맥을 전달한다 — 진입 화면 식별자·사용자가 보고 있던 대상의 키 값·초기 질의문 또는 예시 질의. 이 문맥은 첫 턴의 컨텍스트에 포함된다"
    - "**레거시 화면 안에 대화창을 삽입하는 방식(iframe 임베드)은 지원하지 않는다** — 삽입 방식은 레거시 화면의 CSS·스크립트와 충돌하고 고객사별 대응이 무한히 늘어난다. 진입 수단은 별 창 팝업 하나로 고정한다"
    - "**딥링크는 인증도 권한도 우회하지 않는다.** 팝업은 Hub 자체 인증을 거치며, 레거시가 전달한 사용자 식별자를 그대로 신뢰하지 않는다. 파라미터로 받은 키 값도 그룹 판정을 그대로 통과해야 한다"
    - "**진입 경로는 컨텍스트의 출처일 뿐 권한의 근거가 아니다**"

# ── 데이터소스 전략 ─────────────────────────────────────────
datasource:
  id: ARCH-030
  modes:
    - mode: "운영 DB 직결"
      detail: "업무 시스템별 운영 DB 에 읽기 전용으로 접속"
      caution: "운영 부하 영향. 조회 제한 정책 필수"
    - mode: "통합 DW"
      detail: "여러 업무 시스템 데이터를 모아둔 DW 에 접속"
      caution: "**동기화 시점 문제.** 조회 결과에는 기준 시각을 함께 제공한다"
  rules:
    - "두 방식을 고객사별로 선택하거나 혼용할 수 있어야 한다"
    - "어느 방식이든 조회는 **읽기 전용 계정**을 사용한다. 데이터 변경은 반드시 업무 API 를 통한다"
    - "데이터소스별 **기준 시각을 조회 결과 메타데이터로 항상 반환한다**"
    - "**하나의 SQL 은 하나의 데이터소스 안에서만 생성한다.** 여러 데이터소스에 걸친 요청은 데이터소스별로 조회한 뒤 agent 가 결합한다"

  relation_to_target_system:
    claim: "**대상 시스템과 데이터소스 사이에 매핑을 두지 않는다**"
    detail: "데이터 조회(SQL)는 데이터소스의 권한만, 기능 실행(API)은 대상 시스템의 권한만 본다. 두 경로를 잇는 것은 오직 **사용자 그룹**이라는 전역 개념 하나다"
    gained: "이렇게 절단하면 이전에 필요했던 구조 — 시스템 ↔ 데이터소스 N:N 매핑, 공유 DB 의 판정 기준 선택, 경로별 등급 결합 규칙 — 가 전부 사라진다"
    catalog: "**스키마 카탈로그의 테이블은 데이터소스에만 귀속된다.** 테이블 ↔ 데이터소스 매핑이 결정하는 것은 둘이다 — ① 어떤 커넥션으로 조회할지 ② SQL 검증·조건 주입·원본 컬럼 추적에 어떤 파서를 쓸지"
    unique: "**카탈로그에는 물리 실체당 한 건만 등록한다** — `(데이터소스, DB 스키마, 테이블명)` 유니크 제약. 하나의 커넥션이 여러 네임스페이스를 볼 수 있으므로 테이블명만으로는 물리 실체가 유일하지 않다. 같은 물리 테이블에 대한 그룹별 차등 뷰는 각각 별도 엔트리로 등록한다"

  two_layers:
    why: "접속 정보를 화면에 노출하지 않기 위해 **yml 을 유일한 원천**으로 둔다. admin 은 접속 정보를 관리하지 않고 **매핑만 관리**한다"
    layers:
      - layer: "접속 계층"
        source: "yml 설정"
        holds: "데이터소스 ID · 접속 URL·계정·비밀 값 · 커넥션 풀 설정"
        note: "화면에서 관리하지 않고 AI 전용 DB 에도 저장하지 않는다"
      - layer: "관리 계층"
        source: "AI 전용 DB (admin 데이터소스 관리)"
        holds: "별칭 · 연결된 yml 데이터소스 ID · DBMS 종류 · 사용할 파서 · 유형(운영 DB / DW) · 시각 체계 · 설명"
    rules:
      - "**yml 은 기동 시 로드되며 데이터소스 추가·변경의 반영은 재기동을 전제로 한다.** 화면의 '실시간 조회' 는 로드된 설정을 화면 진입 시점에 직접 읽는다는 뜻이지(DB 에 복사해 두지 않는다) 무중단 동적 커넥션 풀 등록을 뜻하지 않는다"
      - "**다른 모든 메뉴와 agent 런타임은 관리 계층의 데이터소스 레코드만 참조한다.** 카탈로그의 테이블 귀속도 레코드의 **내부 식별자**를 참조할 뿐 yml ID 를 직접 참조하지 않는다"
      - "그 결과 **yml 의 데이터소스 ID 가 바뀌어도 관리 화면에서 해당 레코드의 ID 연결 한 군데만 바꾸면 된다.** 간접 계층을 두는 이유가 이것이다"
      - "**별칭은 표시용**이므로 변경할 수 있다. admin 화면과 LLM 컨텍스트에서 데이터소스를 지칭하는 이름이므로 업무 담당자가 알아보는 이름으로, 혼동을 막기 위해 유일하게 부여한다"
      - "**파서는 DBMS 종류에서 기본값을 유도하되 별도 필드로 관리한다** — 같은 DBMS 라도 버전·호환 모드에 따라 달리 써야 할 수 있다. **파서가 지정되지 않은 데이터소스는 조회 불가로 취급한다**"
      - "**yml 에 없는 ID 를 참조하는 레코드는 끊긴 연결로 감지한다.** 기동 시와 관리 화면 진입 시 검사하며, 끊긴 연결에 귀속된 테이블은 조회 불가로 처리하고 경고를 남긴다"

  declaration_and_verification:
    claim: "SQL 조회 도구 호출은 **대상 데이터소스를 파라미터로 명시**해야 하며, SQL 안의 객체는 실제 이름(`DB 스키마.테이블명`)을 그대로 쓴다. 별칭 접두어·노출명 같은 이름 변환 계층은 두지 않는다"
    steps:
      - "1. 도구 호출이 선언한 데이터소스로 **파서를 선택**한다. 선언이 없으면 거부한다"
      - "2. 파서로 SQL 의 **참조 객체 전체를 추출**한다"
      - "3. 모든 객체를 **선언된 데이터소스의 카탈로그와 대조**한다. 하나라도 없으면 실행하지 않고 거부한다"
      - "4. 전부 존재하면 선언된 데이터소스의 커넥션으로 실행한다"
    why_safe: "**선언이 틀려도 안전하다** — 잘못된 데이터소스를 선언하면 참조 객체가 그 카탈로그에 없어 거부되고, 결과는 항상 닫힘으로 수렴한다. **크로스 데이터소스 조인도 같은 검증에서 자동 차단된다**"
    context: "LLM 컨텍스트에는 카탈로그를 **데이터소스 단위로 묶어 제시**하고, 각 묶음에 별칭과 업무 설명을 함께 표기해 LLM 이 선언할 값을 고를 수 있게 한다. 반복 거부(선언 오류)는 품질 지표로 집계한다"

# ── LLM 연동 계층 ───────────────────────────────────────────
llm_layer:
  id: ARCH-040
  abstraction:
    - "공급 경로·모델·effort 는 설정 값이다. 도메인 코드는 추상화된 인터페이스만 사용한다"
    - "**임베딩 모델도 동일하게 추상화**한다. 대화·추론 모델과 임베딩 모델은 공급 경로·모델을 따로 설정할 수 있다"
    - "**임베딩 모델을 교체하면 기존 벡터를 재생성해야 하므로** 지식 전체 재임베딩 수단을 갖춘다"
    - "지식 본문 임베딩(admin)과 질의 키워드 임베딩(agent)은 **반드시 같은 모델·같은 설정**을 사용한다 — 서로 다른 모델로 만든 벡터를 비교하면 검색 결과가 무의미해진다"
    - "임베딩 모델은 **폐쇄망 내부 배치 가능성을 열어 둔다** — 지식 본문이 외부로 나가는 것을 허용하지 않는 고객사에 필요하다"
  role_based_model_selection:
    why: "모델·effort 를 모든 호출에 최상급으로 고정하면 비용이 불필요하게 커지고, 매 질의의 난이도를 판정해 고르게 하면 판정 호출이 또 늘어난다. 따라서 **선택의 단위는 질의의 난이도가 아니라 스텝 역할**로 고정한다"
    mapping:
      - role: "주 추론"
        steps: "계획 수립 · SQL 생성 · 최종 응답 작성 · 실패 원인 분석"
        model: "**사용자가 선택한 모델·effort.** 선택하지 않으면 관리자가 정한 기본값"
      - role: "보조 판정"
        steps: "업무 연관성 판정 · 업무 도메인·데이터소스 선별 · 컬럼 프루닝 · 질의 키워드 추출 · 과거 턴 요약 · 처리 중 입력의 의도 분류"
        model: "**관리자가 역할별로 지정한 모델·effort 로 고정.** 사용자 선택의 영향을 받지 않는다"
    rules:
      - "**역할 ↔ 모델 매핑은 admin 런타임 설정이다.** 역할별 모델을 코드에 박지 않는다"
      - "**주 추론 모델·effort 는 턴 시작 시점에 고정하고 그 턴 동안 바꾸지 않는다** — 한 턴 안에서 모델이 바뀌면 앞 스텝과 뒤 스텝의 판단 근거가 달라져 재현·감사가 불가능해진다. 처리 중 모델을 바꾸면 **다음 턴부터** 적용한다"
      - "**자동 난이도 판정으로 모델을 고르지 않는다** — 판정 자체가 추가 LLM 호출이고 비결정적이어서 비용은 줄지 않는데 같은 질의가 매번 다른 모델로 처리될 수 있다"
      - "**보조 판정 역할의 모델 호출이 실패하면 주 추론 모델로 자동 대체하지 않는다.** 해당 스텝을 실패로 처리하고 턴을 중단 상태로 전환한다"
      - "호출 기록에는 **스텝 역할과 그때 사용된 공급 경로·모델·effort 를 함께 남긴다** — 역할별 비용 구성을 사후에 볼 수 있어야 라우팅 설정을 조정할 수 있다"
      - "사용량은 역할과 무관하게 **질의를 발생시킨 사용자에게 귀속**한다. 보조 판정 호출도 그 사용자의 쿼터에서 차감한다"
      - "**컨텍스트 조립 순서를 안정 접두부 → 가변부로 고정한다**(시스템 프롬프트·프롬프트 규칙·카탈로그·지식 → 과거 턴 요약 → 이번 질의). 공급 경로가 프롬프트 캐시를 제공하면 접두부가 적중 대상이 된다 — 캐시가 없는 공급 경로에서도 동작에는 영향이 없다"

# ── 인증·계정 원천과 신원 매핑 ──────────────────────────────
identity:
  id: ARCH-050
  account_source:
    - "사용자·조직·권한의 원천은 **레거시 시스템의 SSO·계정 연동을 기본**으로 한다 — 사용자 정보를 이중 관리하지 않기 위함이다"
    - "연동 수단이 없는 고객사를 위해 **자체 계정 모드**를 병행 제공한다"
    - "어느 모드이든 사용자 그룹·그룹 매핑·쿼터 등급 같은 AI 시스템 고유 권한은 admin 에서 관리한다. **레거시 권한을 그대로 상속하지 않는다**"
  trusted_subsystem:
    claim: "**레거시 호출은 trusted subsystem 모델을 따른다**"
    detail: "agent 는 **시스템 단위 연동 계정**으로 API 에 인증하고, **실사용자 신원은 매핑된 식별자를 파라미터로** 전달한다. 레거시 API 는 이 식별자로 자체 권한 검사를 수행해 그 사용자에게 허용된 데이터만 반환한다"
    forbidden: "**사용자 개인의 레거시 비밀번호를 Hub 가 저장·사용하는 방식은 금지한다** — 전 직원의 타 시스템 비밀번호를 한곳에 모으는 구조가 되기 때문이다. 서비스 계정 발급이 불가능하고 사용자별 인증만 지원하는 레거시 API 는 연동 대상에서 제외하거나 고객사가 어댑터·계정을 마련한다"
    risk: "**연동 계정이 유출되면 임의 사용자를 사칭한 호출이 가능하다** — 레거시가 신원 파라미터를 믿는 근거가 연동 계정 인증뿐이기 때문이다. 자격증명 보호와 호출 허용 대역 제한이 완화 장치임을 전제로 운영한다"
  mapping_rules:
    - "매핑은 **시스템/데이터소스별 기본 규칙**(Hub ID 그대로, 또는 변환 패턴)을 두고 다른 사용자만 개별 오버라이드한다 — 대부분의 고객사는 사번이 통일되어 있어 전 조합의 수기 입력은 낭비다"
    - "**SSO 모드여도 이 매핑은 필요하다** — SSO 는 Hub 로그인을 해결할 뿐, 각 시스템 내부의 사용자 키가 같다는 보장이 아니다"
    - "**행 스코프 조인의 바인딩 값도 같은 매핑을 쓴다**"
    - "**신원 매핑은 곧 사칭 능력이다.** 잘못 매핑하면 남의 권한으로 레거시 데이터에 접근한다. 매핑 변경은 정책 변경 이력에 남기고, 수기 입력보다 **인사 데이터 원천의 대량 등록·동기화를 기본**으로 한다"
    - "**매핑이 없으면 닫힌다.** 신원 파라미터가 필요한 API 는 호출을 거부하고, 행 스코프 규칙이 걸린 테이블은 조회를 거부한다. **NULL 바인딩으로 조용히 0건을 반환하지 않고 사유를 알리며 거부한다**"
  change_events:
    claim: "**인사·조직 변경은 수신 인터페이스로 전파받는다**"
    why: "퇴직·조직 이동이 발생했는데 Hub 의 그룹 소속이 방치되면 **권한이 누적된다**"
    handling: "퇴직 → **사용자 비활성화** / 조직 이동 → **일시 비활성화 후 관리자 통보**, 관리자가 인사팀 확인을 거쳐 그룹을 재부여한다"

# ── 지식 검색 구성 ──────────────────────────────────────────
knowledge_search:
  id: ARCH-060
  rules:
    - "지식 검색은 **태그 기반 검색을 기본**으로 한다. agent 가 질의에서 키워드를 추출해 지식에 부여된 태그와 매칭한다"
    - "**임베딩 사용 여부는 시스템 설정으로 켜고 끈다.** 켜면 태그 검색과 벡터 검색을 **함께 수행하고 결과를 병합**한다. 끄면 태그 검색만 수행하며 임베딩 모델 연동 없이도 시스템이 동작한다"
    - "**벡터 검색만 단독으로 쓰는 구성은 두지 않는다** — 태그 검색이 항상 동작해야 임베딩 모델 장애나 비용 한도 초과 시에도 지식 검색이 유지된다"
    - "임베딩을 끈 구성에서는 사용자가 태그에 없는 표현을 쓰면 지식을 찾지 못한다. 이를 보완할 수 있도록 태그에 **동의어를 등록**할 수 있어야 한다. **이 구성에서는 태그 품질이 곧 검색 품질이다**"
    - "설정을 끈 상태에서 켜면 기존 지식 전체에 대한 임베딩이 필요하다"
    - "검색된 지식이 컨텍스트에 주입될 때는 **참조 테이블 판정**을 거치고, 주입된 지식의 참조 테이블은 카탈로그 주입 대상에 합류한다"
  undecided: "두 검색 결과의 병합 규칙(중복 제거·순위 결합·컨텍스트 주입 건수 상한)과 키워드 추출 방식은 상세 설계에서 확정한다"

# ── 턴 실행 점유 ───────────────────────────────────────────
# 상세 메커니즘(필드·획득·갱신·해제 규약·만료 회수·그래프 런타임과의 결합)은
# documents/design/turn-execution.md 가 갖는다.
execution_lease:
  id: ARCH-070
  why: "턴은 상태를 가진 지속 작업이고 agent 는 부하에 따라 스케일 아웃된다. 따라서 **같은 턴을 두 인스턴스가 동시에 처리하는 상황**을 구조적으로 막아야 한다 — 막지 못하면 같은 업무 API 가 두 번 실행되고, 이력이 뒤섞이며, 재개 상태가 서로를 덮어쓴다"
  rules:
    - "**한 턴은 한 시점에 한 인스턴스만 처리한다.** 이 보장은 인스턴스 간에 성립해야 하며 **동일한 구조를 워크플로우 잡에도 적용한다**"
    - "**점유는 AI 전용 DB 의 조건부 갱신으로 구현한다.** 분산 락 서버·메시지 브로커 같은 별도 코디네이터를 도입하지 않는다 — 폐쇄망 운영 구성요소를 늘리지 않기 위함이며, 별도 벡터 DB 를 두지 않기로 한 것과 같은 이유다. **Redis 는 화면 세션 저장소의 선택지일 뿐 점유의 근거로 삼지 않는다**"
    - "**점유는 스텝을 실제로 진행하는 동안에만 유지한다.** 사용자대기로 전이하면 점유를 놓는다 — 대기는 수 분 이상 이어질 수 있고 사용자의 승인·추가 입력이 다른 인스턴스로 도착할 수 있다"
    - "**점유에는 만료 시각을 둔다.** 인스턴스가 죽으면 만료로 회수된다. **만료된 턴은 중단 상태로 전이할 뿐 자동으로 재개하지 않는다** — 재개는 사용자의 재시도 요구로만 일어난다"
    - "**점유가 바뀔 때마다 증가하는 점유 토큰을 둔다.** 프로세스 정지·시각 오차로 점유를 잃은 줄 모르는 인스턴스의 뒤늦은 쓰기를 새 점유자의 토큰과 대조해 무효화한다"
    - "**점유를 잃은 인스턴스는 어떤 상태 전이도 하지 않고 처리를 포기한다.** 실패로 기록하는 것조차 하지 않는다 — 그 턴은 이미 다른 인스턴스의 것이고, 상태를 쓰면 새 점유자의 처리와 충돌한다"
