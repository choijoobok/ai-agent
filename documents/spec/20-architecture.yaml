# 아키텍처 — 구성 · 모듈 경계 · 통신 규칙 · 데이터소스 · LLM 연동 · 실행 점유
#
# 작성 단계: P2
# status: migrated — 사용자 승인 전이다.
#
# **기술 스택과 제약은 02-constraints.yaml 이 갖는다** — 여기에 다시 적지 않는다.
# 여기는 *구조* 다: 무엇이 무엇에 닿을 수 있고 무엇에 닿을 수 없나.

meta:
  status: migrated
  baselined: null

# ── 논리 구성 ────────────────────────────────────────────────
topology:
  id: ARCH-001
  core_claim: "**업무 시스템과 대화·추론 LLM 에 닿는 유일한 접점이 agent 다.** 업무 DB 를 읽는 경로, 업무 API 를 실행하는 경로, 사용자 질의가 LLM 으로 나가는 경로가 모두 agent 한 곳에 모인다"
  zones:
    - zone: "외부망"
      contains: "대화·추론 LLM API · 임베딩 모델 API"
    - zone: "DMZ"
      contains: "아웃바운드 게이트웨이 (단일 통로 · 인바운드 미허용)"
    - zone: "내부 폐쇄망 — Agentic AI Hub"
      contains: "system · admin · portal · agent 모듈 · 공유 PostgreSQL 스키마(시스템 설정·이력·지식·임베딩 벡터)"
    - zone: "내부 폐쇄망 — 레거시 (복수)"
      contains: "업무 시스템 WAS/REST · 업무 운영 DB(여러 시스템이 공유 가능 · 이기종 DBMS) · 통합 DW"
  notes:
    - "**외부망에는 두 종류가 있다** — 대화·추론 LLM 과 임베딩 모델. 대화·추론 LLM 은 agent 만 호출한다. 임베딩의 호출 주체는 둘이다: **admin**(지식 등록·수정·재임베딩 시 본문 임베딩) · **agent**(질의 키워드 임베딩으로 지식 검색). 두 경로 모두 공통 컴포넌트를 경유하며 외부로 나가는 통로는 하나다"
    - "**임베딩 사용은 선택 기능이다.** 끄면 임베딩 모델 연동 없이 태그 검색만으로 동작한다"
    - "지식 본문과 임베딩 벡터는 **별도 벡터 DB 를 두지 않고** AI 전용 DB 의 테이블로 관리한다(pgvector 확장) — **대안 비교와 근거는 ADR-005 가 갖는다**(승인 2026-09-10)"
    - "**사용자 접속 방식은 고객사 정책을 따른다** — VPN 전용·사내 PC 원격·VDI 등. 이 시스템이 접속 경로를 규정하지 않는다"
    - "**알림 발송 경로도 고객사 환경에 따라 다르다** — 자체 메일 전송 에이전트 보유 여부"

  # ── 논리 구성도의 원본 ────────────────────────────────────
  # **여기가 그림의 정본이다.** `/doc-gen` 이 이 노드·간선으로
  # `documents/generated/20-아키텍처.md` 의 Mermaid 를 그린다(산출물 지도 8행).
  # **그림 파일을 만들지 않는다** — 이미지는 diff·검색·부분 수정이 되지 않는다.
  #
  # 원본(agentic-ai 의 6.1)은 Mermaid 로 그려져 있었고 이관에서 산문만 왔다.
  # 산문에는 *무엇이 어느 구역에 있나* 는 있어도 **무엇이 무엇을 부르나** 가 없어
  # 다시 그릴 수 없었다. 그 간선이 이 절이다 — 규칙은 module_boundaries 가 갖는다.
  #
  # **C4 두 계층은 이 하나를 접어서 그린다**(2026-09-10 · G2 가 Level 1·2 를 따로 요구한다).
  # 노드·간선을 두 벌 적으면 그 순간 두 사실이 되고, 한쪽만 고쳤을 때 어느 그림이 참인지
  # 알 방법이 없다. **Level 1 은 노드의 `l1:` 로 접고, Level 2 는 `deploy:` 로 묶는다.**

  # ── C4 Level 1 — 시스템 컨텍스트 ──────────────────────────
  context:
    id: ARCH-002
    claim: "**바깥에서 본 이 시스템은 상자 하나다.** 누가 쓰는가 · 무엇에 닿는가 · 나가는 통로가 몇 개인가만 말한다"
    note: "**아웃바운드 게이트웨이를 상자로 남긴다.** C4 는 인프라를 Level 1 에 그리지 않는 것이 보통이지만, *나가는 통로가 하나이고 들어오는 통로가 없다* 는 것이 이 제품의 도입 조건이다(CON-013) — 지우면 그림이 그 사실을 말하지 않는다"
    systems:
      - { key: PERSON,     kind: 사람,      label: "사용자 · 관리자",                   note: "액터 열하나의 상세는 01-actors.yaml 이 갖는다" }
      - { key: HUB,        kind: 이 시스템, label: "Agentic AI Hub" }
      - { key: GW_SYS,     kind: 외부,      label: "아웃바운드 게이트웨이 (고객사 DMZ)", note: "단일 통로 · 인바운드 미허용(CON-013)" }
      - { key: LLM_SVC,    kind: 외부,      label: "외부 LLM 서비스",                   note: "대화·추론과 임베딩 둘이며 공급 경로를 따로 설정한다(ARCH-040)" }
      - { key: LEGACY_SYS, kind: 외부,      label: "업무 시스템 (복수)",                 note: "WAS/REST · 업무 운영 DB · 통합 DW 를 하나로 접은 것이다" }
      - { key: MAIL_SYS,   kind: 외부,      label: "메일 발송 경로",                     note: "고객사 환경에 따라 상이(CON-031)" }

  # ── C4 Level 2 — 컨테이너(따로 배포하거나 따로 실행되는 것) ─
  containers:
    id: ARCH-003
    claim: "**컨테이너는 따로 배포하거나 따로 실행되는 것이다.** system·admin·portal·agent 는 컨테이너가 아니라 **한 WAS 안의 모듈**이며, 그 경계는 ARCH-010~014와 ADR-007이 갖는다"
    units:
      - { key: SPA, label: "브라우저 SPA (React 19 · Vite)", holds: "portal 화면 영역 · system/admin 관리 콘솔 영역", note: "**Hub WAS 가 하나의 정적 번들로 서빙한다.** `/`와 `/admin`은 별도 `index.html`이 아니라 라우터·레이아웃·지연 로딩 경계다(ARCH-021)" }
      - { key: WAS, label: "Hub WAS (Spring Boot 4 · JDK 25)", holds: "system · admin · portal · agent 모듈", note: "**기본은 단일 배포다.** 분리는 agent 만 대상이고 그때도 DB 를 공유한다(ARCH-014). **SHAPE-02(통합 구축)에서는 여기에 업무 확장이 함께 들어가고 업무 DB 노드가 하나 더 생긴다**(ARCH-016~018) — 이 그림은 SHAPE-01 을 그린 것이다" }
      - { key: DBU, label: "Hub 공유 DB (PostgreSQL)", holds: "system 설정 · 이력 · 지식 · 임베딩 벡터", note: "네 모듈이 하나의 스키마를 공유한다. 벡터도 여기 있다 — pgvector 확장을 쓰며 별도 벡터 DB를 두지 않는다(CON-001 · ADR-005 · ADR-008)" }

  nodes:
    - { key: USER,   zone: 사용자,    l1: PERSON,                   label: "사용자 PC",              note: "접속 방식은 고객사 정책(CON-015)" }
    - { key: SPA,    zone: 사용자,    l1: HUB,        deploy: SPA,  label: "브라우저 SPA",           note: "화면은 여기서 돌고 서빙은 Hub WAS 가 한다 — 배포 단위가 하나인 이유" }
    - { key: LLM,    zone: 외부망,    l1: LLM_SVC,                  label: "대화·추론 LLM API" }
    - { key: EMB,    zone: 외부망,    l1: LLM_SVC,                  label: "임베딩 모델 API",        note: "선택 기능 — 끄면 태그 검색만으로 동작한다" }
    - { key: GW,     zone: DMZ,       l1: GW_SYS,                   label: "아웃바운드 게이트웨이",   note: "단일 통로 · 인바운드 미허용(CON-013)" }
    - { key: SYSTEM, zone: Hub,       l1: HUB,        deploy: WAS,  label: "system 모듈" }
    - { key: PORTAL, zone: Hub,       l1: HUB,        deploy: WAS,  label: "portal 모듈" }
    - { key: ADMIN,  zone: Hub,       l1: HUB,        deploy: WAS,  label: "admin 모듈" }
    - { key: AGENT,  zone: Hub,       l1: HUB,        deploy: WAS,  label: "agent 모듈" }
    - { key: AIDB,   zone: Hub,       l1: HUB,        deploy: DBU,  label: "Hub 공유 DB (PostgreSQL)", kind: db, note: "네 모듈이 공유하는 system 설정 · 이력 · 지식 · 임베딩 벡터(CON-001 · ADR-008)" }
    - { key: WAS1,   zone: 레거시,    l1: LEGACY_SYS,               label: "업무 시스템 A — WAS / REST API" }
    - { key: WAS2,   zone: 레거시,    l1: LEGACY_SYS,               label: "업무 시스템 B — WAS / REST API" }
    - { key: DB1,    zone: 레거시,    l1: LEGACY_SYS,               label: "업무 운영 DB",            kind: db, note: "여러 시스템이 공유할 수 있다" }
    - { key: DB2,    zone: 레거시,    l1: LEGACY_SYS,               label: "업무 운영 DB",            kind: db, note: "이기종 DBMS" }
    - { key: DW,     zone: 레거시,    l1: LEGACY_SYS,               label: "통합 DW",                 kind: db }
    - { key: MAIL,   zone: 고객사,    l1: MAIL_SYS,                 label: "메일 발송 경로",          note: "고객사 환경에 따라 상이(CON-031)" }
  edges:
    - { from: USER,   to: SPA,    label: "브라우저" }
    - { from: SPA,    to: SYSTEM }
    - { from: SPA,    to: PORTAL }
    - { from: SPA,    to: ADMIN }
    - { from: PORTAL, to: SYSTEM, label: "인증·유효 권한" }
    - { from: ADMIN,  to: SYSTEM, label: "인증·유효 권한" }
    - { from: AGENT,  to: SYSTEM, label: "인증·유효 권한" }
    - { from: PORTAL, to: AGENT,  label: "채팅 질의·응답", note: "**비동기다** — 접수 후 즉시 반환하고 진행 상태는 폴링으로 조회한다(ARCH-015)" }
    - { from: SYSTEM, to: AIDB }
    - { from: PORTAL, to: AIDB }
    - { from: ADMIN,  to: AIDB }
    - { from: AGENT,  to: AIDB }
    - { from: AGENT,  to: DB1,    label: "조회" }
    - { from: AGENT,  to: DB2,    label: "조회" }
    - { from: AGENT,  to: DW,     label: "조회" }
    - { from: AGENT,  to: WAS1,   label: "실행 (REST)" }
    - { from: AGENT,  to: WAS2,   label: "실행 (REST)" }
    - { from: AGENT,  to: GW }
    - { from: ADMIN,  to: GW }
    - { from: GW,     to: LLM,    label: "질의·응답" }
    - { from: GW,     to: EMB,    label: "지식 임베딩 · 질의 키워드 임베딩" }
    - { from: AGENT,  to: MAIL,   label: "알림" }
  edge_invariants:
    - "**업무 DB·업무 API·대화·추론 LLM 에 닿는 간선은 agent 에서만 나간다.** 이 그림에서 그것이 보이는 것이 요점이며, portal·admin 에서 그런 간선이 그려지면 ARCH-013 위반이다"
    - "**admin → GW 간선은 임베딩 전용이다.** admin 이 대화·추론 LLM 을 부르는 간선은 없다 — 통로는 공유하지만 인터페이스가 갈려 있어(FEAT-304) 참조 관계로 검사된다"
    - "**허용된 모듈 간 경로는 system의 인증·유효 권한 계약과 portal → agent 계약뿐이다**(ARCH-011·012). 그 밖의 모듈 내부 저장소·서비스 직접 참조는 금지한다"
    - "**레거시에서 Hub 로 들어오는 간선이 없다** — 인바운드 미허용(CON-013). 인사·조직 변경 수신은 예외이며 그 규약은 51-interfaces.yaml 이 갖는다"
    - "**두 계층이 어긋나면 접는 규칙이 틀린 것이다.** Level 1 은 이 노드·간선을 `l1:` 로 접은 결과이지 따로 그린 그림이 아니다 — Level 1 에만 있는 상자나 간선이 보이면 고칠 곳은 정본이 아니라 생성기다"

# ── 모듈 경계 ────────────────────────────────────────────────
# 모듈의 정의와 책임은 01-actors.yaml 의 modules 가 갖는다. 여기는 **경계** 다.
module_boundaries:
  - id: ARCH-010
    rule: "제품 모듈 경계는 **프론트 화면·백엔드 API·애플리케이션 서비스·도메인 모델·Entity/Repository·문서의 소유권에 모두 적용한다.** 기술 기반만 `platform`·`shared`에 두며 업무 규칙을 그곳으로 빼지 않는다"
    scope: "적용 대상은 **system·admin·portal·agent 넷**이다(ADR-007). 업무 확장(TRM-134)은 제품 모듈이 아니며 자기 업무 DB를 따로 소유한다(ARCH-017)"
  - id: ARCH-011
    rule: "모듈은 다른 모듈의 내부 서비스·Entity·Repository를 직접 참조하지 않는다. 허용된 경로는 **system이 제공하는 인증·유효 권한 계약**과 **portal이 agent를 호출하는 비동기 계약**뿐이며, 둘 다 공개 포트와 DTO를 거친다"
    why: "폴더만 나누고 내부 저장소를 직접 참조하면 테이블이나 서비스 변경이 모든 모듈로 전파된다. 허용 계약을 좁혀야 모듈별 변경과 시험 범위가 실제로 줄어든다"
  - id: ARCH-012
    rule: "**로그인·메뉴/API 접근의 유효 권한 판정은 system 소유 컴포넌트 하나에만 둔다.** 역할은 권한 묶음이며 화면 진입·API 허용을 역할명으로 직접 판정하지 않는다"
    why: "로그인 이동, 메뉴 렌더링, 내부 시험 화면과 API 인터셉터가 다른 기준을 쓰면 화면은 열리는데 API는 403이거나 그 반대가 된다"
    traces_to: [FEAT-303]
  - id: ARCH-013
    rule: "**portal·admin 은 대화·추론 LLM 을 호출하지 않고, 업무 DB·업무 API 에 직접 접근하지 않는다**"
    why: "편의의 문제가 아니라 **보안 경계**다. 통합 배포 구조에서는 런타임에 호출자를 신뢰할 수 없으므로 **의존성 규칙 검사로 강제한다** — `modules/admin`·`modules/portal` 이 대화·추론 인터페이스를 참조하면 빌드가 실패해야 한다"
    traces_to: [PRN-01, PRN-02]
  - id: ARCH-014
    rule: "분리 배포는 **agent 만** 대상으로 한다(부하에 따른 스케일 아웃). 그때도 네 모듈은 **하나의 PostgreSQL 스키마를 공유**하지만 모듈별 테이블 쓰기 소유권은 유지하며, 공유 계약이나 스키마 변경 시 배포 시점을 맞춘다"
  - id: ARCH-015
    rule: "**portal ↔ agent 통신은 비동기로 한다.** portal 은 질의를 접수시키고 즉시 반환받으며, 진행 상태와 결과는 프론트엔드 폴링으로 조회한다. 폴링은 턴 처리 중에만 수행하고 응답 수신 시 중지하며 **주기는 admin 시스템 설정으로 관리한다**"
    why: "서버 푸시(SSE·WebSocket)를 쓰지 않는 이유는 **프록시·L7 로드밸런서의 유휴 타임아웃과 응답 버퍼링 설정에 좌우되지 않기 위함**이다. 배포 환경이 고객사마다 다르므로 환경 의존을 줄이는 쪽을 택한다"
    note: "이 호출을 **portal 트랜잭션 안에 묶지 않는다** — 분리 시 원격 호출로 바뀔 수 있다"
  - id: ARCH-027
    rule: "`sample`은 system·admin·portal·agent에 이은 다섯 번째 제품 모듈이 아니며, 고객사 업무 확장도 아니다. local 배포 변형에만 포함하고 제품 배포물에서는 코드·화면·API·시드를 함께 제외하는 삭제 가능한 참조 구현이다"
    variant_selection:
      - "서버 기동에는 활성 Spring 프로파일을 반드시 명시한다. Gradle `bootRun`은 `-Pprofile=<프로파일>`, 패키지 JAR과 IDE 직접 실행은 `--spring.profiles.active=<프로파일>` 또는 동등한 외부 설정을 사용하며, 누락하면 데이터소스 유무와 관계없이 기동을 거부한다"
      - "유효 프로파일이 `local`이면 `includeSample=true`·`skipFrontend=true`를 기본으로 하고, 그 밖의 프로파일과 일반 build·check·bootJar 실행은 둘 다 false를 기본으로 한다"
      - "명시한 `-PincludeSample=<true|false>`와 `-PskipFrontend=<true|false>`는 프로파일 기본값보다 우선한다. local에서 sample을 명시적으로 빼면 Liquibase도 제품 master changelog를 사용해 코드·화면·API·시드를 함께 제외한다"
    source_boundary:
      backend: "`sources/backend/modules/sample/` — Gradle 모듈 `backend:modules:sample`; 컨트롤러·요청 DTO·도메인 서비스·Entity·Repository와 소유 테스트를 함께 둔다"
      frontend: "`sources/frontend/src/modules/sample/` — 공통 샘플 규칙과 소유 테스트를 두고, 여섯 화면·API 엔드포인트는 `features/{화면}/` 아래에 둔다"
    dependency_direction:
      - "sample의 Gradle 직접 의존은 HTTP/Security 경계인 `api` 하나다. 현재는 api가 공개하는 `core`·`support`·이행 전 `domain` 공통 계약을 간접 사용하며, system·admin·portal·agent의 내부 구현은 참조하지 않는다"
      - "제품 모듈과 `core`·`support`·`api`는 sample을 참조하지 않는다. `bootstrap`만 조립·실행을 위해 sample 모듈을 포함한다"
      - "프런트의 sample 밖 코드는 `modules/sample/**`을 참조하지 않는다. 라우터·메뉴 등록처럼 조립에 필요한 진입점만 명시적으로 가져온다"
    compatibility:
      - "local 변형에서는 외부 화면 주소 `/sample/**`와 API 주소 `/api/service/sample/**`를 유지한다. 제품 변형에는 둘 다 존재하지 않으며 구 소스 경로 별칭은 남기지 않는다"
      - "`SMPL_*` 테이블·메뉴·권한·메시지 시드는 local Liquibase context와 local 시드 생성에만 포함한다"
      - "고객 전달 시 sample 모듈·진입점·`SMPL_*` 시드를 한 절차로 제거할 수 있어야 하며, build·`.gradle`·`node_modules` 생성 폴더는 제거 대상이 아니다"
    verification: "신규 모듈 존재와 구 `api/sample`·`domain/sample`·`features/sample` 부재를 먼저 실패하는 구조 계약으로 고정하고, 전체 빌드·시드 생성·프로파일별 빌드 변형·활성 프로파일 누락 거부·샘플 규칙 반전 시험으로 확인한다"
    traces_to: [ARCH-010, ARCH-011]

write_ownership:
  claim: "네 모듈이 공유하는 PostgreSQL 스키마는 하나지만 **각 테이블과 Entity/Repository에는 쓰기 소유 모듈 하나가 있다.** 다른 모듈은 소유 모듈의 공개 조회 계약을 사용하고 내부 Repository를 직접 참조하지 않는다"
  why: "같은 DB를 쓴다는 이유로 모든 Entity를 공통화하면 소스 이동만 생기고 캡슐화는 생기지 않는다. 쓰기 소유권이 있어야 상태 전이와 마이그레이션 책임이 한곳에 남는다"
  rules:
    - "사용자·메뉴·역할·권한·공통코드·다국어 메시지는 **system**이 소유한다"
    - "AI 지식·정책·기준 정보·쿼터 승인 상태는 **admin**이 소유한다"
    - "턴·스텝·감사 이력·토큰 사용량은 **agent**가 소유한다"
    - "개인화·사용자 저장 항목 중 portal 전용 상태는 **portal**이 소유한다"
    - "정확한 테이블별 소유권은 P3의 ENT 명세에서 한 번씩 지정한다"

# ── 업무 확장 경계 (SHAPE-02) ───────────────────────────────
# **업무 확장은 Hub 모듈이 아니다**(TRM-134). 구현은 Hub 완성 뒤로 미루지만, **지금
# 굳으면 나중에 뜯어야 하는 자리 셋**만 여기서 열어 둔다. SPI 시그니처·버전 호환 규칙은
# 실물이 생길 때 정한다 — 지금 정하면 근거가 추측이 된다.
business_extension:
  - id: ARCH-016
    rule: "**빌드 시에 포함한다.** 고객사마다 포함할 확장을 정해 빌드하며 **실행 중 설치·제거 경로는 만들지 않는다**"
    hard_rule: "**의존은 단방향이다** — 확장은 Hub 를 참조하고 **Hub 는 확장을 참조하지 않는다.** 그래서 확장을 넣지 않고 빌드해도 Hub 가 선다"
    why: "제거는 실제로 일어나지 않는다 — SHAPE-02 는 업무 시스템을 **새로 짓는** 자리이고 그것이 고객의 주 목적이다. 없는 수요를 위해 해제 경로·잔여 데이터 정리·메뉴 회수를 설계하면 그 복잡도만 남는다"
    note: "그래서 정확한 표현은 *빼도 선다* 가 아니라 **넣지 않고 빌드해도 선다** 이다"
  - id: ARCH-017
    rule: "**업무 DB 는 업무 확장이 소유한다.** 별도 `DataSource` 이며 Liquibase changelog master 도 AI 전용 DB 와 분리한다"
    hard_rule: "**Hub DB 와 업무 DB 에 걸친 원자적 트랜잭션을 전제하지 않는다** — 둘을 함께 바꾸는 흐름은 보상 처리로 설계한다"
    why: "합치면 업무 시스템의 스키마 수명주기가 Hub 에 묶인다. 업무 시스템이 주인공인 형태에서 그것은 주객이 뒤바뀐 종속이다"
    traces_to: [ARCH-010]

  - id: ARCH-018
    rule: "**업무 확장은 좌측 메뉴 트리에 형제 노드로 자기 메뉴를 기여한다** — 시스템 관리·AI Agent 관리와 나란한 최상위 노드이며, 그에 딸린 프론트·백엔드 소스가 함께 온다"
    requires: "`menu-tree.yaml` → `screenRegistry.ts` → `endpoints.ts` 로 이어지는 **시드 사슬이 확장의 기여를 받을 수 있어야 한다.** 확장을 넣지 않고 빌드하면 그 메뉴·화면·인가 시드도 함께 빠진다"
    why: "**지금 사슬은 Hub 하나만 전제한 정적 구조다.** 굳은 뒤에 바꾸면 시드 생성기·인가 시드·라우팅을 함께 뜯는다 — 셋 중 가장 비싼 자리가 여기다"
    note: "@defer G3 — 사슬의 실제 확장 지점(생성기 입력 형태)은 설계 단계에서 정한다. 여기서 정하는 것은 *그 모양을 받을 수 있게 둔다* 까지다"

# ── portal ↔ agent 계약 ─────────────────────────────────────
portal_agent_contract:
  id: ARCH-019
  rule: "**portal 은 agent 가 권한·보안·쿼터·감사 처리를 끝낸 뒤 내놓은 응답 계약만 소비한다.** 처리 내부 상태나 LLM 공급자 응답을 직접 해석하지 않는다"
  ownership: "계약 버전·호환성·계약 시험은 `integration` 작업흐름이 소유하고, agent 는 의미 블록을 생산하며 portal 은 표현 어댑터로 렌더링한다"
  hard_rules:
    - "초기 계약 시험 화면은 최종 응답의 원문과 메타데이터를 **누락·재해석 없이** 보여 준다. 이것은 제품 portal 채팅 화면의 완료로 세지 않는다"
    - "계약은 특정 그리드·차트·지도 라이브러리의 설정 객체를 직접 노출하지 않는다. 라이브러리를 바꾸는 일은 portal 어댑터 안에서 끝나야 한다"
    - "새 표현 블록은 계약 버전과 함께 추가한다. 소비자가 모르는 블록은 버리거나 전체 응답을 실패시키지 않고 원문 대체 표시가 가능해야 한다"
    - "**호환 불가 변경(주 버전 상승)은 직전 주 버전을 병행 지원하지 않는다.** 전환 시점부터 agent 는 새 주 버전만 받고, 구 주 버전 요청은 NFR-026 대로 **지원하지 않는 버전으로 실패 처리**한다. 영향받는 작업흐름의 베이스라인은 다시 연다"
    - "**구 계약을 들고 있는 portal 은 재접속시킨다.** portal 은 주 버전 불일치 실패를 버전 불일치로 판정해 화면을 다시 불러온다 — PRC-05-03 의 두 갈래(`재접속` · `한시 유지`) 중 **재접속이 기본**이다. 작성 중이던 입력과 화면 상태는 잃는다"
    - "**이 규칙은 서버 대수와 무관하다.** 단일 인스턴스여도 **브라우저에 이미 내려간 portal**은 구 계약으로 호출하므로, 서버를 한꺼번에 바꾸는 것으로는 구 계약 호출이 사라지지 않는다 — 병행 지원의 실제 이유는 인스턴스 수가 아니라 **클라이언트가 이미 받아 간 계약**이다"
  note: "@defer G3 — integration 작업흐름에서 envelope·상태·오류·표현 블록의 정확한 스키마와, portal 이 버전 불일치를 판정하는 지점(응답 헤더·오류 코드)을 확정한다"
  traces_to: [REQ-009, REQ-027]

# ── portal 진입 경로 · 레거시 딥링크 ────────────────────────
deeplink:
  id: ARCH-020
  why: "portal 을 별도 사이트로만 열어두면 사용자는 기존 업무 화면과 Hub 를 계속 오가야 하고, **탐색 비용(PRB-03)이 그대로 남는다.** Hub 가 '또 하나의 시스템' 이 되지 않게 한다"
  rules:
    - "Hub 는 **딥링크 규약과 팝업 호출 스니펫을 제공**한다. 실제 링크·버튼을 레거시 화면에 설치하는 것은 **고객사 선택 사항**이다. 링크 삽입은 레거시의 스키마·기능 변경이 아니므로 PRN-09 에 저촉되지 않는다"
    - "딥링크는 **별 창 팝업으로 portal 채팅 화면을 열고** 파라미터로 초기 문맥을 전달한다 — 진입 화면 식별자·사용자가 보고 있던 대상의 키 값·초기 질의문 또는 예시 질의. 이 문맥은 첫 턴의 컨텍스트에 포함된다"
    - "**레거시 화면 안에 대화창을 삽입하는 방식(iframe 임베드)은 지원하지 않는다** — 삽입 방식은 레거시 화면의 CSS·스크립트와 충돌하고 고객사별 대응이 무한히 늘어난다. 진입 수단은 별 창 팝업 하나로 고정한다"
    - "**딥링크는 인증도 권한도 우회하지 않는다.** 팝업은 Hub 자체 인증을 거치며, 레거시가 전달한 사용자 식별자를 그대로 신뢰하지 않는다. 파라미터로 받은 키 값도 그룹 판정을 그대로 통과해야 한다"
    - "**진입 경로는 컨텍스트의 출처일 뿐 권한의 근거가 아니다**"
    - "**인증을 지나도 진입 문맥을 잃지 않는다.** 세션이 없으면 팝업은 로그인을 거치며, 그 뒤 **원래 문맥이 실린 채팅 화면으로 복귀**해야 한다. **유실되면 빈 채팅창을 열지 않고 무엇이 없는지 알린다** — 빈 창을 열면 사용자는 딥링크가 동작한 줄 알고 대상 없이 질의한다. 이 진입 경로의 값 전부가 *보고 있던 대상이 첫 턴 컨텍스트에 들어간다* 에 있으므로, **문맥을 잃은 딥링크는 새 창 열기와 다르지 않다**"
    - "**문맥의 키 값이 URL 에 머무르지 않게 한다.** 진입 시점에 서버가 문맥을 접수하고 이후로는 **단기 식별자로만 오간다** — 리다이렉트를 지나며 파라미터를 URL 에 계속 실으면 **브라우저 이력 · 중간 장비의 접속 로그(CON-028) · Referer 헤더에 업무 데이터의 키가 남는다.** 마스킹은 본문에만 걸리고 URL 은 그 밖이다"

# ── 화면 영역 · API 경로 · 로그인 진입 ─────────────────────
application_entry:
  id: ARCH-021
  decision: ADR-007
  ui:
    - { path: "/", owner: portal, meaning: "portal 기본 진입" }
    - { path: "/portal/**", owner: portal, meaning: "portal 기능 깊은 경로" }
    - { path: "/admin", owner: system, meaning: "관리 콘솔 진입과 허용된 첫 화면 선택" }
    - { path: "/admin/system/**", owner: system, meaning: "기존 백오피스 시스템 관리" }
    - { path: "/admin/hub/**", owner: admin, meaning: "AI Hub 관리" }
    - { path: "/internal/**", owner: integration, meaning: "메뉴에 노출하지 않는 내부 시험 화면" }
  api:
    convention: "/api/{계층}/{모듈}/{도메인}/{동작}"
    layers: [public, common, service]
    hard_rule: "모듈은 계층 뒤에 둔다. `/api/{모듈}/service/**`는 분류되지 않아 403이며, `/api/service/**`만 SYS_API·SYS_MENU_API 완전 일치 권한 판정을 받는다"
  login_redirect:
    order:
      - "안전한 동일 출처의 원래 목적지가 있고 유효 권한이 있으면 그곳으로 복귀한다"
      - "비밀번호 변경 필수 세션은 비밀번호 변경 화면으로 보낸다"
      - "관리 콘솔 진입 권한이 있으면 `/admin`으로 보낸다"
      - "portal 진입 권한만 있으면 `/`로 보낸다"
      - "둘 다 없으면 접근 가능한 시작 화면이 없음을 알리고 리다이렉트 반복을 만들지 않는다"
    hard_rule: "`ADMIN` 같은 역할명으로 분기하지 않고 서버가 계산한 유효 권한을 사용한다"
  internal_screen:
    rule: "주소를 아는 것은 권한이 아니다. `/internal/**`은 내비게이션에서 숨기되 화면과 `/api/service/**`를 같은 유효 권한으로 보호한다"
    note: "역할은 이 권한을 배포하는 기본 묶음으로 사용할 수 있다. 저장 모델은 P3에서 메뉴 노출 속성 또는 별도 권한 자원을 비교해 확정한다"
  traces_to: [ARCH-012, ARCH-020, AUTHZ-090]

# ── system 모듈 목표 경계와 호환 이행 ──────────────────────
# ADR-007이 승인한 네 제품 모듈 중 system의 현재 실물을 어디로 옮기고, 옮기는 동안
# 무엇을 깨뜨리지 않는지 정한다. **이 절은 목표 구조이며 현재 소스 경로를 사실처럼
# 바꾸지 않는다.** 실제 이동은 system G3 승인 뒤 수직 슬라이스로 수행한다.
system_transition:
  decision: ADR-007
  baseline:
    claim: "2026-09-12 현재 system 기능은 프론트 `src/features`·`src/shared`, 백엔드 `backend/api`·`backend/domain`, 공통 Liquibase master와 짧은 화면 URL에 분산되어 있다"
    evidence: "REQ-501~510의 frontend·backend·tables·screens가 이동 전 목록의 정본이다. 이 절에서 같은 목록을 다시 열거하지 않는다"

  source_boundary:
    id: ARCH-022
    backend:
      target_root: "`sources/backend/modules/system/` — Gradle 제품 모듈 `backend:modules:system`"
      package_shape: "`com.aiagent.system.api/{기능}` · `com.aiagent.system.domain/{애그리거트}` · `com.aiagent.system.contract/{auth|authz|code|message|userstate}`"
      public_surface: "다른 제품 모듈은 `com.aiagent.system.contract`만 참조한다. system의 controller·service·Entity·Repository 직접 참조는 ArchUnit으로 금지한다"
      foundation: "`backend/core`·`backend/support`는 도메인 비종속 기술 기반, `backend/bootstrap`은 조립·실행·Liquibase의 자리로 유지한다. 현재 `backend/api`·`backend/domain`은 기능별 이동이 끝나면 제거하는 과도기 모듈이다"
      enforcement: "경계 검사는 루트 `check`에서 네 제품 모듈의 main 출력 전체를 함께 스캔한다. 개별 모듈 테스트만 통과한 결과로 의존 경계를 통과했다고 판단하지 않는다"
    frontend:
      target_root: "`sources/frontend/src/modules/system/`"
      package_shape: "소유 화면은 `features/{기능}`, 다른 화면 영역이 쓰는 인증·유효 권한·공통코드·메시지·공통 사용자 상태 계약은 `public/{auth|authz|code|message|userstate}`에 둔다"
      public_surface: "admin·portal은 `@/modules/system/public/**`만 참조한다. system 내부 `features/**`를 가져오지 못하게 ESLint 경계 규칙으로 막는다"
      shared_rule: "`src/shared`에는 HTTP·그리드·탭·테마처럼 도메인 비종속인 구현만 남긴다. system 업무 이름과 저장소 호출이 있는 현재 shared 코드는 system public 또는 feature로 이동한다"
    dependency_direction: "system은 admin·portal·agent를 참조하지 않는다. admin·portal·agent → system public 계약만 허용하며 portal → agent 계약은 ARCH-019가 별도로 소유한다"
    traces_to: [REQ-501, REQ-502, REQ-503, REQ-504, REQ-505, REQ-506, REQ-510]

  api_transition:
    id: ARCH-023
    canonical: "system API의 목표 경로는 `/api/{public|common|service}/system/{도메인}/{동작}`이다"
    cutover:
      - "사용자 확정(2026-09-12): 현재는 고객이 없는 개발 단계이므로 배포 차수나 운영 관측 기간을 위한 호환 별칭을 두지 않는다"
      - "기능 슬라이스 안에서 컨트롤러·프론트 호출·`SYS_API`·`SYS_MENU_API` 생성 입력을 신규 정식 경로로 함께 바꾸고, 회귀 시험이 통과하면 기존 `/api/{계층}/{도메인}/{동작}` 매핑을 같은 커밋에서 제거한다"
      - "전환 결과에는 신규 경로 하나만 남긴다. 접두사 변환용 포괄 라우팅, 구 경로 리다이렉트, 이중 등록, 업무 로직·DTO 복제를 만들지 않는다"
      - "삭제 전 저장소 전체에서 기존 경로 참조 0건과 생성 시드 일치를 검사한다. 나중에 실제 고객이 생긴 뒤의 경로 변경은 이 개발 단계 결정을 재사용하지 않고 변경 요청으로 호환 정책을 다시 정한다"
    traces_to: [REQ-503]

  data_boundary:
    id: ARCH-024
    system_tables: [SYS_API, SYS_BATCH_HISTORY, SYS_CACHE_VERSION, SYS_CODE, SYS_CODE_GROUP, SYS_CODE_GRP_REF, SYS_CODE_REF, SYS_CONFIG, SYS_LO_ACCESS, SYS_LO_EXCEPTION, SYS_LO_LOGIN, SYS_MENU, SYS_MENU_API, SYS_MESSAGE, SYS_MESSAGE_KEY, SYS_NOTI_INBOX, SYS_NOTI_REQUEST, SYS_NOTICE, SYS_ROLE, SYS_ROLE_MENU_AUTH, SYS_SCHEDULE_BATCH, SYS_USER, SYS_USER_FAVORITE, SYS_USER_GRID_PREF, SYS_USER_IP_ALLOW, SYS_USER_MENU_AUTH, SYS_USER_MENU_STAT, SYS_USER_PWD_HIST, SYS_USER_PWD_RESET, SYS_USER_ROLE, SYS_USER_SEARCH_COND]
    physical_policy: "기존 31개 테이블의 이름·스키마·데이터를 바꾸거나 복제하지 않고 system이 쓰기 소유권만 인수한다. Entity·Repository 이동은 같은 테이블을 가리키며 이행 중 이중 쓰기를 만들지 않는다"
    changelog_policy: "적재된 changeset은 그대로 둔다. G3 이후 system의 신규 변경은 `sources/backend/bootstrap/src/main/resources/db/changelog/system/`에 새 changeset으로 추가하고 공통 master에서 포함한다"
    platform_exclusions: "`SYS_SEQUENCE`·`SYS_DATA_LOCK`·`SYS_JOB_PROGRESS`·Spring Session 테이블은 제품 업무 상태가 아니라 platform 기반이므로 system 소유 31개에 넣지 않는다(REQ-510)"
    notification_ownership: "공지·공통 알림함·계정/권한 요청의 판정은 system이 소유한다. AI 품질 신고·정책 관련 요청과 처리 상태는 admin이 소유하고, 사용자에게 보낼 알림만 system public 알림 계약에 전달한다. admin은 system 알림 테이블을 직접 쓰지 않는다"
    traces_to: [REQ-501, REQ-502, REQ-503, REQ-504, REQ-505, REQ-506, REQ-507, REQ-508, REQ-509, REQ-510]

  screen_transition:
    id: ARCH-025
    menu_routes: "현재 system 메뉴 URL의 경로 꼬리를 보존해 `/admin/system/{기존 경로}`로 옮긴다. 예: `/user` → `/admin/system/user`, `/log/login` → `/admin/system/log/login`, `/dashboard` → `/admin/system/dashboard`"
    standalone_routes: "로그인과 셸 공통 모달은 system 소유지만 관리 콘솔에 종속시키지 않는다. `/login`은 그대로 두고 프로필·설정·알림함·비밀번호 변경·세션 만료는 어느 화면 영역에서도 같은 system public 계약으로 연다"
    document_paths: "메뉴 화면 문서는 브라우저 목표 경로와 함께 `documents/screen/admin/system/**`로 옮긴다. URL이 없는 공통 오버레이 문서는 `documents/screen/_standalone/system/**`에 둔다"
    cutover: "사용자 확정(2026-09-12): 고객 북마크가 없는 개발 단계이므로 메뉴·라우터·화면 문서가 신규 경로로 함께 전환되면 기존 화면 경로는 같은 커밋에서 제거하고 리다이렉트 별칭을 두지 않는다"
    traces_to: [REQ-501, REQ-503, REQ-507, REQ-508, REQ-509, REQ-510]

  migration_order:
    id: ARCH-026
    steps:
      - "공개 계약과 의존성 검사를 먼저 세우고 현재 구현을 그대로 통과시킨다"
      - "기능 하나의 백엔드 패키지·프론트 feature·API 정식 경로·화면 문서 경로를 같은 슬라이스에서 옮긴다"
      - "프론트·메뉴·API 시드·내부 호출자의 기존 경로 참조가 0건인지 검사한다"
      - "신규 경로가 기존과 같은 권한·응답·업무 결과를 내는 회귀 시험을 통과시킨다"
      - "같은 커밋에서 기존 API·화면 경로를 제거한다"
    hard_rules:
      - "전환 중간에 테스트할 수는 있어도 슬라이스의 최종 상태에는 기존 경로 별칭을 남기지 않는다"
      - "DB 테이블 복사·이중 쓰기·기존 changeset 수정으로 모듈 이동을 표현하지 않는다"
      - "system G3 승인 전에는 소스·API 시드·화면 경로·DB changeset을 변경하지 않는다"
    rollback: "기능 슬라이스 커밋 전체를 되돌려 기존 패키지와 경로를 복원한다. DB를 복제하지 않으므로 데이터 역이행은 없다"
    traces_to: [ARCH-022, ARCH-023, ARCH-024, ARCH-025]

# ── 데이터소스 전략 ─────────────────────────────────────────
datasource:
  id: ARCH-030
  modes:
    - mode: "운영 DB 직결"
      detail: "업무 시스템별 운영 DB 에 읽기 전용으로 접속"
      caution: "운영 부하 영향. 조회 제한 정책 필수"
    - mode: "통합 DW"
      detail: "여러 업무 시스템 데이터를 모아둔 DW 에 접속"
      caution: "**동기화 시점 문제.** 조회 결과에는 기준 시각을 함께 제공한다"
  rules:
    - "두 방식을 고객사별로 선택하거나 혼용할 수 있어야 한다"
    - "어느 방식이든 조회는 **읽기 전용 계정**을 사용한다. 데이터 변경은 반드시 업무 API 를 통한다"
    - "데이터소스별 **기준 시각을 조회 결과 메타데이터로 항상 반환한다**"
    - "**하나의 SQL 은 하나의 데이터소스 안에서만 생성한다.** 여러 데이터소스에 걸친 요청은 데이터소스별로 조회한 뒤 agent 가 결합한다"

  relation_to_target_system:
    claim: "**대상 시스템과 데이터소스 사이에 매핑을 두지 않는다**"
    detail: "데이터 조회(SQL)는 데이터소스의 권한만, 기능 실행(API)은 대상 시스템의 권한만 본다. 두 경로를 잇는 것은 오직 **사용자 그룹**이라는 전역 개념 하나다"
    gained: "이렇게 절단하면 이전에 필요했던 구조 — 시스템 ↔ 데이터소스 N:N 매핑, 공유 DB 의 판정 기준 선택, 경로별 등급 결합 규칙 — 가 전부 사라진다"
    catalog: "**스키마 카탈로그의 테이블은 데이터소스에만 귀속된다.** 테이블 ↔ 데이터소스 매핑이 결정하는 것은 둘이다 — ① 어떤 커넥션으로 조회할지 ② SQL 검증·조건 주입·원본 컬럼 추적에 어떤 파서를 쓸지"
    unique: "**카탈로그에는 물리 실체당 한 건만 등록한다** — `(데이터소스, DB 스키마, 테이블명)` 유니크 제약. 하나의 커넥션이 여러 네임스페이스를 볼 수 있으므로 테이블명만으로는 물리 실체가 유일하지 않다. 같은 물리 테이블에 대한 그룹별 차등 뷰는 각각 별도 엔트리로 등록한다"

  two_layers:
    why: "접속 정보를 화면에 노출하지 않기 위해 **yml 을 유일한 원천**으로 둔다. admin 은 접속 정보를 관리하지 않고 **매핑만 관리**한다"
    layers:
      - layer: "접속 계층"
        source: "yml 설정"
        holds: "데이터소스 ID · 접속 URL·계정·비밀 값 · 커넥션 풀 설정"
        note: "화면에서 관리하지 않고 AI 전용 DB 에도 저장하지 않는다"
      - layer: "관리 계층"
        source: "AI 전용 DB (admin 데이터소스 관리)"
        holds: "별칭 · 연결된 yml 데이터소스 ID · DBMS 종류 · 사용할 파서 · 유형(운영 DB / DW) · 시각 체계 · 설명"
    rules:
      - "**yml 은 기동 시 로드되며 데이터소스 추가·변경의 반영은 재기동을 전제로 한다.** 화면의 '실시간 조회' 는 로드된 설정을 화면 진입 시점에 직접 읽는다는 뜻이지(DB 에 복사해 두지 않는다) 무중단 동적 커넥션 풀 등록을 뜻하지 않는다"
      - "**다른 모든 메뉴와 agent 런타임은 관리 계층의 데이터소스 레코드만 참조한다.** 카탈로그의 테이블 귀속도 레코드의 **내부 식별자**를 참조할 뿐 yml ID 를 직접 참조하지 않는다"
      - "그 결과 **yml 의 데이터소스 ID 가 바뀌어도 관리 화면에서 해당 레코드의 ID 연결 한 군데만 바꾸면 된다.** 간접 계층을 두는 이유가 이것이다"
      - "**별칭은 표시용**이므로 변경할 수 있다. admin 화면과 LLM 컨텍스트에서 데이터소스를 지칭하는 이름이므로 업무 담당자가 알아보는 이름으로, 혼동을 막기 위해 유일하게 부여한다"
      - "**파서는 DBMS 종류에서 기본값을 유도하되 별도 필드로 관리한다** — 같은 DBMS 라도 버전·호환 모드에 따라 달리 써야 할 수 있다. **파서가 지정되지 않은 데이터소스는 조회 불가로 취급한다**"
      - "**yml 에 없는 ID 를 참조하는 레코드는 끊긴 연결로 감지한다.** 기동 시와 관리 화면 진입 시 검사하며, 끊긴 연결에 귀속된 테이블은 조회 불가로 처리하고 경고를 남긴다"

  declaration_and_verification:
    claim: "SQL 조회 도구 호출은 **대상 데이터소스를 파라미터로 명시**해야 하며, SQL 안의 객체는 실제 이름(`DB 스키마.테이블명`)을 그대로 쓴다. 별칭 접두어·노출명 같은 이름 변환 계층은 두지 않는다"
    steps:
      - "1. 도구 호출이 선언한 데이터소스로 **파서를 선택**한다. 선언이 없으면 거부한다"
      - "2. 파서로 SQL 의 **참조 객체 전체를 추출**한다"
      - "3. 모든 객체를 **선언된 데이터소스의 카탈로그와 대조**한다. 하나라도 없으면 실행하지 않고 거부한다"
      - "4. 전부 존재하면 선언된 데이터소스의 커넥션으로 실행한다"
    why_safe: "**선언이 틀려도 안전하다** — 잘못된 데이터소스를 선언하면 참조 객체가 그 카탈로그에 없어 거부되고, 결과는 항상 닫힘으로 수렴한다. **크로스 데이터소스 조인도 같은 검증에서 자동 차단된다**"
    context: "LLM 컨텍스트에는 카탈로그를 **데이터소스 단위로 묶어 제시**하고, 각 묶음에 별칭과 업무 설명을 함께 표기해 LLM 이 선언할 값을 고를 수 있게 한다. 반복 거부(선언 오류)는 품질 지표로 집계한다"

# ── LLM 연동 계층 ───────────────────────────────────────────
llm_layer:
  id: ARCH-040
  abstraction:
    - "공급 경로·모델·effort 는 설정 값이다. 도메인 코드는 추상화된 인터페이스만 사용한다"
    - "**임베딩 모델도 동일하게 추상화**한다. 대화·추론 모델과 임베딩 모델은 공급 경로·모델을 따로 설정할 수 있다"
    - "**임베딩 모델을 교체하면 기존 벡터를 재생성해야 하므로** 지식 전체 재임베딩 수단을 갖춘다"
    - "지식 본문 임베딩(admin)과 질의 키워드 임베딩(agent)은 **반드시 같은 모델·같은 설정**을 사용한다 — 서로 다른 모델로 만든 벡터를 비교하면 검색 결과가 무의미해진다"
    - "임베딩 모델은 **폐쇄망 내부 배치 가능성을 열어 둔다** — 지식 본문이 외부로 나가는 것을 허용하지 않는 고객사에 필요하다"
  role_based_model_selection:
    why: "모델·effort 를 모든 호출에 최상급으로 고정하면 비용이 불필요하게 커지고, 매 질의의 난이도를 판정해 고르게 하면 판정 호출이 또 늘어난다. 따라서 **선택의 단위는 질의의 난이도가 아니라 스텝 역할**로 고정한다"
    mapping:
      - role: "주 추론"
        steps: "계획 수립 · SQL 생성 · 최종 응답 작성 · 실패 원인 분석"
        model: "**사용자가 선택한 모델·effort.** 선택하지 않으면 관리자가 정한 기본값"
      - role: "보조 판정"
        steps: "업무 연관성 판정 · 업무 도메인·데이터소스 선별 · 컬럼 프루닝 · 질의 키워드 추출 · 과거 턴 요약 · 처리 중 입력의 의도 분류"
        model: "**관리자가 역할별로 지정한 모델·effort 로 고정.** 사용자 선택의 영향을 받지 않는다"
    rules:
      - "**역할 ↔ 모델 매핑은 admin 런타임 설정이다.** 역할별 모델을 코드에 박지 않는다"
      - "**주 추론 모델·effort 는 턴 시작 시점에 고정하고 그 턴 동안 바꾸지 않는다** — 한 턴 안에서 모델이 바뀌면 앞 스텝과 뒤 스텝의 판단 근거가 달라져 재현·감사가 불가능해진다. 처리 중 모델을 바꾸면 **다음 턴부터** 적용한다"
      - "**자동 난이도 판정으로 모델을 고르지 않는다** — 판정 자체가 추가 LLM 호출이고 비결정적이어서 비용은 줄지 않는데 같은 질의가 매번 다른 모델로 처리될 수 있다"
      - "**보조 판정 역할의 모델 호출이 실패하면 주 추론 모델로 자동 대체하지 않는다.** 해당 스텝을 실패로 처리하고 턴을 중단 상태로 전환한다"
      - "호출 기록에는 **스텝 역할과 그때 사용된 공급 경로·모델·effort 를 함께 남긴다** — 역할별 비용 구성을 사후에 볼 수 있어야 라우팅 설정을 조정할 수 있다"
      - "사용량은 역할과 무관하게 **질의를 발생시킨 사용자에게 귀속**한다. 보조 판정 호출도 그 사용자의 쿼터에서 차감한다"
      - "**컨텍스트 조립 순서를 안정 접두부 → 가변부로 고정한다**(시스템 프롬프트·프롬프트 규칙·카탈로그·지식 → 과거 턴 요약 → 이번 질의). 공급 경로가 프롬프트 캐시를 제공하면 접두부가 적중 대상이 된다 — 캐시가 없는 공급 경로에서도 동작에는 영향이 없다"

# ── 인증·계정 원천과 신원 매핑 ──────────────────────────────
identity:
  id: ARCH-050
  account_source:
    - "사용자·조직·권한의 원천은 **레거시 시스템의 SSO·계정 연동을 기본**으로 한다 — 사용자 정보를 이중 관리하지 않기 위함이다"
    - "연동 수단이 없는 고객사를 위해 **자체 계정 모드**를 병행 제공한다"
    - "어느 모드이든 사용자 그룹·그룹 매핑·쿼터 등급 같은 AI 시스템 고유 권한은 admin 에서 관리한다. **레거시 권한을 그대로 상속하지 않는다**"
  trusted_subsystem:
    claim: "**레거시 호출은 trusted subsystem 모델을 따른다**"
    detail: "agent 는 **시스템 단위 연동 계정**으로 API 에 인증하고, **실사용자 신원은 매핑된 식별자를 파라미터로** 전달한다. 레거시 API 는 이 식별자로 자체 권한 검사를 수행해 그 사용자에게 허용된 데이터만 반환한다"
    forbidden: "**사용자 개인의 레거시 비밀번호를 Hub 가 저장·사용하는 방식은 금지한다** — 전 직원의 타 시스템 비밀번호를 한곳에 모으는 구조가 되기 때문이다. 서비스 계정 발급이 불가능하고 사용자별 인증만 지원하는 레거시 API 는 연동 대상에서 제외하거나 고객사가 어댑터·계정을 마련한다"
    risk: "**연동 계정이 유출되면 임의 사용자를 사칭한 호출이 가능하다** — 레거시가 신원 파라미터를 믿는 근거가 연동 계정 인증뿐이기 때문이다. 자격증명 보호와 호출 허용 대역 제한이 완화 장치임을 전제로 운영한다"
  mapping_rules:
    - "매핑은 **시스템/데이터소스별 기본 규칙**(Hub ID 그대로, 또는 변환 패턴)을 두고 다른 사용자만 개별 오버라이드한다 — 대부분의 고객사는 사번이 통일되어 있어 전 조합의 수기 입력은 낭비다"
    - "**SSO 모드여도 이 매핑은 필요하다** — SSO 는 Hub 로그인을 해결할 뿐, 각 시스템 내부의 사용자 키가 같다는 보장이 아니다"
    - "**행 스코프 조인의 바인딩 값도 같은 매핑을 쓴다**"
    - "**신원 매핑은 곧 사칭 능력이다.** 잘못 매핑하면 남의 권한으로 레거시 데이터에 접근한다. 매핑 변경은 정책 변경 이력에 남기고, 수기 입력보다 **인사 데이터 원천의 대량 등록·동기화를 기본**으로 한다"
    - "**매핑이 없으면 닫힌다.** 신원 파라미터가 필요한 API 는 호출을 거부하고, 행 스코프 규칙이 걸린 테이블은 조회를 거부한다. **NULL 바인딩으로 조용히 0건을 반환하지 않고 사유를 알리며 거부한다**"
  change_events:
    claim: "**인사·조직 변경은 수신 인터페이스로 전파받는다**"
    why: "퇴직·조직 이동이 발생했는데 Hub 의 그룹 소속이 방치되면 **권한이 누적된다**"
    handling: "퇴직 → **사용자 비활성화** / 조직 이동 → **일시 비활성화 후 관리자 통보**, 관리자가 인사팀 확인을 거쳐 그룹을 재부여한다"

# ── 지식 검색 구성 ──────────────────────────────────────────
knowledge_search:
  id: ARCH-060
  rules:
    - "지식 검색은 **태그 기반 검색을 기본**으로 한다. agent 가 질의에서 키워드를 추출해 지식에 부여된 태그와 매칭한다"
    - "**임베딩 사용 여부는 시스템 설정으로 켜고 끈다.** 켜면 태그 검색과 벡터 검색을 **함께 수행하고 결과를 병합**한다. 끄면 태그 검색만 수행하며 임베딩 모델 연동 없이도 시스템이 동작한다"
    - "**벡터 검색만 단독으로 쓰는 구성은 두지 않는다** — 태그 검색이 항상 동작해야 임베딩 모델 장애나 비용 한도 초과 시에도 지식 검색이 유지된다"
    - "임베딩을 끈 구성에서는 사용자가 태그에 없는 표현을 쓰면 지식을 찾지 못한다. 이를 보완할 수 있도록 태그에 **동의어를 등록**할 수 있어야 한다. **이 구성에서는 태그 품질이 곧 검색 품질이다**"
    - "설정을 끈 상태에서 켜면 기존 지식 전체에 대한 임베딩이 필요하다"
    - "**벡터는 AI 전용 DB 의 pgvector 확장에 둔다**(CON-001 · ADR-005). 별도 벡터 저장소를 두지 않으므로 지식 본문과 벡터가 **같은 트랜잭션·같은 백업·같은 복구 지점** 안에 있고, 임베딩을 끈 고객사에는 남는 구성요소가 없다"
    - "검색된 지식이 컨텍스트에 주입될 때는 **참조 테이블 판정**을 거치고, 주입된 지식의 참조 테이블은 카탈로그 주입 대상에 합류한다"
  undecided: "두 검색 결과의 병합 규칙(중복 제거·순위 결합·컨텍스트 주입 건수 상한)과 키워드 추출 방식은 상세 설계에서 확정한다"

# ── 턴 실행 점유 ───────────────────────────────────────────
# 상세 메커니즘(필드·획득·갱신·해제 규약·만료 회수·그래프 런타임과의 결합)은
# documents/design/turn-execution.md 가 갖는다.
execution_lease:
  id: ARCH-070
  why: "턴은 상태를 가진 지속 작업이고 agent 는 부하에 따라 스케일 아웃된다. 따라서 **같은 턴을 두 인스턴스가 동시에 처리하는 상황**을 구조적으로 막아야 한다 — 막지 못하면 같은 업무 API 가 두 번 실행되고, 이력이 뒤섞이며, 재개 상태가 서로를 덮어쓴다"
  rules:
    - "**한 턴은 한 시점에 한 인스턴스만 처리한다.** 이 보장은 인스턴스 간에 성립해야 하며 **동일한 구조를 워크플로우 잡에도 적용한다**"
    - "**점유는 AI 전용 DB 의 조건부 갱신으로 구현한다.** 분산 락 서버·메시지 브로커 같은 별도 코디네이터를 도입하지 않는다 — 폐쇄망 운영 구성요소를 늘리지 않기 위함이며, 별도 벡터 DB 를 두지 않기로 한 것과 같은 이유다. **Redis 는 화면 세션 저장소의 선택지일 뿐 점유의 근거로 삼지 않는다**"
    - "**점유는 스텝을 실제로 진행하는 동안에만 유지한다.** 사용자대기로 전이하면 점유를 놓는다 — 대기는 수 분 이상 이어질 수 있고 사용자의 승인·추가 입력이 다른 인스턴스로 도착할 수 있다"
    - "**점유에는 만료 시각을 둔다.** 인스턴스가 죽으면 만료로 회수된다. **만료된 턴은 중단 상태로 전이할 뿐 자동으로 재개하지 않는다** — 재개는 사용자의 재시도 요구로만 일어난다"
    - "**점유가 바뀔 때마다 증가하는 점유 토큰을 둔다.** 프로세스 정지·시각 오차로 점유를 잃은 줄 모르는 인스턴스의 뒤늦은 쓰기를 새 점유자의 토큰과 대조해 무효화한다"
    - "**점유를 잃은 인스턴스는 어떤 상태 전이도 하지 않고 처리를 포기한다.** 실패로 기록하는 것조차 하지 않는다 — 그 턴은 이미 다른 인스턴스의 것이고, 상태를 쓰면 새 점유자의 처리와 충돌한다"
    - "**감사 이력의 기록은 점유로 막지 않는다.** 기록 누락은 처리 실패이므로 점유 여부와 무관하게 남기고, 대신 이력에 **점유 토큰을 함께 남겨** 어느 점유 구간의 기록인지 사후에 판별한다"
    - "점유 유지 시간·갱신 주기·만료 회수 배치의 주기는 코드에 박지 않고 **운영 설정으로 관리한다**"
    - "**점유의 단위는 턴 하나다.** 서로 다른 세션·턴이 같은 대상에 같은 액션을 내는 것은 이 정책의 범위 밖이다"
    - "**정상 종료는 스텝 경계에서 끊는다.** 종료 신호를 받으면 ① 새 턴 접수를 멈추고 ② 진행 중 스텝이 끝나면 **다음 스텝을 시작하지 않고** ③ 중단 상태로 전이하며 점유를 놓는다. 새 메커니즘을 만들지 않고 ADR-001 이 고른 런타임의 **중단 확인 지점**을 그대로 쓴다"
    - "**정상 종료 중의 상태 전이는 허용된다.** 위 ③ 은 `점유를 잃은 인스턴스는 어떤 상태 전이도 하지 않는다` 와 충돌하지 않는다 — 그 규칙은 점유를 **잃은** 경우이고, 종료 중인 인스턴스는 아직 **유효한 점유를 쥐고 있어** 전이할 자격이 있다. 이 구분을 적지 않으면 구현이 만료 회수에 떠넘긴다"
    - "**드레인 상한은 5분이며 운영 설정으로 관리한다.** 그 안에 스텝이 끝나지 않으면 더 기다리지 않고 종료하고, 그 턴은 점유 만료 회수에 맡긴다. 상한을 두지 않으면 긴 스텝 하나가 배포를 무한정 붙잡는다. 상한을 턴이 아니라 **스텝**에 두는 이유는 다단계 턴이 전체 완료를 기다리게 만들기 때문이다"
    - "**사용자대기 턴은 드레인 대상이 아니다.** 점유를 이미 놓았으므로 배포를 붙잡지 않고, 재기동 뒤 다른 인스턴스가 이어받는다. **중단시키지 않는다** — 사용자가 승인하려던 턴을 이유 없이 잃는다"
    - "**예외는 계약 주 버전 전환뿐이다.** 이때는 구 계약으로 접수된 턴을 진행 중·사용자대기 가릴 것 없이 중단으로 전이한다 — ARCH-019 가 portal 을 재접속시키므로 신 계약 화면이 구 계약 턴을 이어받을 수 없다. 접수 당시 계약 버전은 PRC-05-03 이 턴에 기록해 둔다"
  limits:
    claim: "**이 정책이 exactly-once 실행을 보장하지는 않는다**"
    detail: "프로세스 정지와 시각 오차가 겹치는 경우뿐 아니라, **도구 실행이 점유 유지 시간보다 길어져 정상 처리 중인 인스턴스가 회수되는 경우**에도 중복 실행 가능성이 남는다. 후자는 장애 없이도 열리므로 점유 유지 시간을 실행 API 의 타임아웃·재시도까지 포함해 산정해야 한다. **어느 쪽이든 exactly-once 를 약속하지 않는다**"
    complement: "**비가역 액션의 이중 실행은 점유만으로 막지 않는다.** ① 재개 제외 규칙 ② 실행 승인 절차가 함께 막으며, ①이 실효를 가지려면 **`action_executed` 를 호출 응답이 아니라 호출 직전에 기록해야 한다** — 응답을 기다렸다가 기록하면 회수와 재개 사이에 값이 거짓으로 남아 재개가 같은 액션을 다시 낸다"
