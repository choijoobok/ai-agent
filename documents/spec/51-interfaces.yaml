# 외부 인터페이스 — 연동 방식과 전제
#
# 작성 단계: P3
# 원본: agentic-ai DESIGN-00 6.6 · 6.7 · 8.4 · 10.6
# status: migrated — 사용자 승인 전이다.
#
# **인터페이스의 개별 명세는 여기에 담지 않는다** — 대상 시스템·API·데이터소스의 실물
# 목록은 **런타임에 admin 이 등록하는 데이터**이고(PRN-08), 착수 시 고객사와 확정한다
# (CON-019 · CON-023). 여기는 *어떤 종류의 연동을 어떤 규약으로 하는가* 다.

meta:
  status: migrated
  migrated_from: "agentic-ai/docs/design/foundation/06-architecture.md · 08-security-governance.md 8.4"
  migrated_at: 2026-09-04
  baselined: null

interfaces:
# ── 나가는 연동 (Hub → 외부) ──────────────────────────────────────
  - id: IF-001
    direction: outbound
    peer: ACT-006
    name: "업무 DB · DW 조회"
    protocol: "JDBC (읽기 전용 계정)"
    detail: "데이터소스 단위로 접속한다. 접속 정보는 **yml 이 유일한 원천**이고 admin 은 매핑만 관리한다"
    hard_rules:
      - "**읽기 전용 계정을 쓴다.** 데이터 변경은 반드시 업무 API 를 통한다"
      - "**하나의 SQL 은 하나의 데이터소스 안에서만** 생성한다. 여러 데이터소스에 걸친 요청은 데이터소스별로 조회한 뒤 agent 가 결합한다"
      - "상한 강제는 **JDBC 수준**(최대 행 수·fetch size·쿼리 타임아웃)에서 적용하고 SQL 을 고쳐 쓰지 않는다"
      - "실행하는 SQL 에 **턴 ID 를 주석으로 주입한다** — DBA 가 슬로우 쿼리 로그에서 출처를 특정할 수 있게 한다"
    prerequisites: "읽기 전용 계정 · **메타데이터 조회 권한**(없으면 카탈로그 자동 수집 불가) · DBMS 별 리소스 한도 · 접속 허용 IP"
    traces_to: [CON-018, ARCH-030]
    reqs: [REQ-103]

  - id: IF-002
    direction: outbound
    peer: ACT-006
    name: "업무 API 호출 (조회·실행)"
    protocol: "HTTP/HTTPS 표준 REST · JSON"
    detail: "대상 시스템 단위로 등록된 API 만 호출한다. **목록에 없는 호출은 불가능하다**"
    auth: "**시스템 단위 연동 계정으로 인증하고 실사용자 신원은 매핑된 식별자를 파라미터로 전달한다**(trusted subsystem). 자격증명 값은 yml 에만 두고 admin 은 참조 키만 관리한다"
    hard_rules:
      - "**SOAP · gRPC · 메시지 큐 · 소켓 · DB 프로시저 직접 호출 · 파일 인터페이스는 지원하지 않는다**"
      - "**사용자 개인의 레거시 비밀번호를 Hub 가 저장·사용하지 않는다**"
      - "명세에 **타임아웃 · 재시도 정책 · 멱등성 여부**를 등록한다 — 앞의 둘은 실행 점유 유지 시간 산정에, 멱등성은 위험 등급 산정에 쓰인다"
      - "대상 시스템의 제한 응답(429 등)을 존중해 백오프·재시도하며 **자체 rate limit 을 약속하지 않는다**"
      - "**응답 경로 명세는 허용목록이며 미등록 경로는 닫힘이다**"
    prerequisites: "REST 제공 여부와 명세 문서 · **시스템별 서비스 계정 발급과 인증 방식** · 호출 허용 대역 · **응답 스키마의 개인정보 경로와 변경 통보 절차** · 복구·원복 절차"
    adapter_policy: "REST 를 제공하지 않는 기능은 **고객사가 어댑터를 제공하는 것을 연동 전제로 한다.** 어댑터가 확보되지 않은 기능은 연동 대상에서 제외한다"
    traces_to: [CON-003, CON-019, CON-020, ARCH-050, AUTHZ-070]
    reqs: [REQ-105, REQ-111, REQ-113]

  - id: IF-003
    direction: outbound
    peer: ACT-007
    name: "대화·추론 LLM 호출"
    protocol: "공급사 API (HTTPS · 스트리밍 수신)"
    detail: "**agent 만 호출한다.** 공통 컴포넌트(FEAT-304)를 경유하며 모듈 코드는 공급사 SDK 를 직접 참조하지 않는다"
    hard_rules:
      - "**스트리밍 수신이어야 한다** — 중단을 실효 있게 하고 진행 상태 표시의 근거를 얻기 위함이다"
      - "**호출 성공·실패와 무관하게 호출 내용·토큰·비용을 기록한다.** 기록 없이 성공한 호출이 있으면 안 된다"
      - "**전송 허용 목록 밖의 데이터를 보내지 않는다**(기본값 차단)"
    path: "폐쇄망 → DMZ 아웃바운드 게이트웨이 → 외부망. **인바운드는 허용하지 않는다**"
    prerequisites: "목적지의 **도메인 기준** 아웃바운드 허용 · 프록시 경유 정보 · 약관상 학습·저장 미사용 보장과 공인 정보보호 인증"
    traces_to: [CON-013, PRN-01, ARCH-040]
    reqs: [REQ-106, REQ-107]

  - id: IF-004
    direction: outbound
    peer: ACT-007
    name: "임베딩 모델 호출"
    protocol: "공급사 API (HTTPS)"
    detail: "호출 주체는 둘이다 — **admin**(지식 본문 임베딩·전체 재임베딩) · **agent**(질의 키워드 임베딩). 같은 공통 컴포넌트를 경유한다"
    hard_rules:
      - "**두 경로는 반드시 같은 모델·같은 설정을 쓴다** — 서로 다른 모델로 만든 벡터를 비교하면 검색 결과가 무의미해진다"
      - "**임베딩 사용은 선택 기능이다.** 끄면 이 인터페이스 없이 태그 검색만으로 동작한다"
      - "비용 귀속이 다르다 — 지식 본문 임베딩은 **시스템 비용**, 질의 키워드 임베딩은 **해당 사용자 사용량**"
    option: "**폐쇄망 내부 배치 가능성을 열어 둔다** — 지식 본문이 외부로 나가는 것을 허용하지 않는 고객사에 필요하다"
    traces_to: [ARCH-060]
    nfrs: [NFR-015, NFR-021]

  - id: IF-005
    direction: outbound
    peer: ACT-009
    name: "알림 발송 (메일 등)"
    protocol: "고객사 환경에 따라 상이"
    detail: "자체 메일 전송 에이전트를 보유한 고객사가 있고, 메일 서버를 직접 구성해야 하는 고객사도 있다"
    prerequisites: "발송 경로 확정"
    traces_to: [CON-031]
    phase: P3

# ── 들어오는 연동 (외부 → Hub) ────────────────────────────────────
  - id: IF-006
    direction: inbound
    peer: ACT-008
    name: "사용자 변경 이벤트 수신"
    protocol: "REST (폐쇄망 내부 호출)"
    detail: "인사 시스템·그룹웨어가 호출한다. 퇴직 → **사용자 비활성화** / 조직 이동 → **일시 비활성화 + 관리자 통보**"
    why: "**퇴직·조직 이동이 발생했는데 그룹 소속이 방치되면 권한이 누적된다**"
    hard_rules:
      - "처리 결과는 **정책 변경 이력에 남긴다**"
      - "**관리자가 인사팀 확인을 거쳐 그룹을 재부여한다** — 자동 재부여하지 않는다"
      - "**폐쇄망 내부 호출이다.** 외부에서 들어오는 인바운드는 허용하지 않는다"
    prerequisites: "이벤트 원천 시스템과 전달 방식"
    feature: FEAT-305
    traces_to: [CON-022]
    reqs: [REQ-103]

  - id: IF-007
    direction: inbound
    peer: ACT-006
    name: "레거시 딥링크 팝업 진입"
    protocol: "브라우저 URL (별 창 팝업)"
    detail: "Hub 는 **딥링크 규약과 팝업 호출 스니펫을 제공**한다. 파라미터로 진입 화면 식별자·사용자가 보고 있던 대상의 키 값·초기 질의문을 전달하며, 이 문맥은 첫 턴의 컨텍스트에 포함된다"
    hard_rules:
      - "**인증도 권한도 우회하지 않는다.** 팝업은 Hub 자체 인증을 거치며 레거시가 전달한 사용자 식별자를 그대로 신뢰하지 않는다. 파라미터로 받은 키 값도 그룹 판정을 그대로 통과해야 한다"
      - "**iframe 임베드는 지원하지 않는다** — 삽입 방식은 레거시 화면의 CSS·스크립트와 충돌하고 고객사별 대응이 무한히 늘어난다. 진입 수단은 별 창 팝업 하나로 고정한다"
      - "**진입 경로는 컨텍스트의 출처일 뿐 권한의 근거가 아니다**"
    ownership: "실제 링크·버튼의 설치는 **고객사 선택 사항**이다. 링크 삽입은 레거시의 스키마·기능 변경이 아니므로 PRN-09 에 저촉되지 않는다"
    prerequisites: "설치할 화면 목록 · 설치 담당 · 전달할 문맥 파라미터"
    feature: FEAT-101
    traces_to: [ARCH-020, CON-029]

  - id: IF-008
    direction: inbound
    peer: ACT-009
    name: "헬스 상태·지표 노출"
    protocol: "고객사 모니터링 도구가 수집 (형식 미확정)"
    detail: "**모니터링 화면은 제품 기능이 아니다** — 고객사가 자체 도구를 보유한 것을 전제로 한다. 다만 도구가 긁어 갈 지점은 우리 쪽에 있어야 한다"
    prerequisites: "고객사 도구와 **무엇을 어떤 형식으로 노출할지**"
    traces_to: [CON-027]
    status: undecided

# ── 인터페이스가 아닌 것 ──────────────────────────────────────────
not_interfaces:
  - item: "아웃바운드 통로(방화벽·프록시·목적지 허용 목록·전송량 제한)와 그 구간의 접속 로그"
    owner: ACT-009
    why: "**고객사 인프라 영역이다.** 우리 시스템이 제공하거나 보장하는 기능이 아니며 **연동 전제(인프라 요건)로 요구한다**"
    what_we_do: "① 목적지·프록시를 설정 값으로 다룬다 ② 일시 오류에 재시도하고 지속 장애 시 **턴을 중단 상태로 전환**한다 ③ **호출 내용과 토큰·비용을 기록한다**"
    what_we_dont: "**공급사 장애 자체를 극복하는 수단은 없으며 약속하지 않는다**"
  - item: "감사 시 인프라 접속 로그와 호출 기록의 대조"
    owner: ACT-009
    why: "애플리케이션을 우회한 외부 호출이 없었는지 교차 검증할 수 있으나, **이 대조는 고객사 협조가 필요한 운영 절차이며 시스템 기능이 아니다**"
