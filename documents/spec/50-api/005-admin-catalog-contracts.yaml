# 카탈로그 관리·모듈 공개 계약 — 미구현 P3 초안
feature_contracts:
  FEAT-003:
    security_domain_scope: "ARCH-050.admin_account_contract. 관리 명령의 인증·ACTOR_ID·지문·원 결과 소유 비교는 system 관리자 영역이다. Portal 주체/같은 문자열 ID로 실행·재생하지 않으며 Portal 대상 이용자와 처리자를 구분한다"
    design_status: draft
    implementation: planned
    request_rule: "POST/body·ApiResponse·SearchRequest/PageResponse와 AUTHZ-090·091을 따른다. 모든 BIGINT 식별자·버전/순서는 양의 십진 문자열이다. 신규 ID는 JPA TABLE/SYS_SEQUENCE를 사용하고 서버 주체/시각을 클라이언트가 대체하지 않는다. 기존 system 계약을 변경하지 않는다"
    response_rule: "안정 항목·선택한 내용 판·현재 효력·초안 검수·현재 정책/연결 관측을 분리한다. draft 저장 성공이나 검사 결과만으로 운영 사용 가능을 반환하지 않는다. 메타데이터 열람과 원본 값/샘플 열람 권한은 별도다"
    identity_contract:
      source: "REQ-301.business_rules와 identity_change·ADR-032를 따른다. DATA_SOURCE_ID는 같은 안정 항목에서 고정하며 다른 물리 실체/데이터소스로 이름을 바꾸는 우회를 허용하지 않는다"
      resolution: "integration 소유의 정확 객체 해석은 실제 데이터소스·DBMS 식별 규칙 버전·서버/DB/스키마/객체의 정확 이름과 각 차원의 PRESENT/NOT_APPLICABLE을 반환한다. 해당 없음은 DB null로 저장하지만 입력의 미확인/생략과 구분한다. 해당하는 스키마는 기본 스키마도 실제 이름을 명시한다. 모호함·지원 불가·조회 실패는 저장 가능 식별로 만들지 않는다"
      equality: "DBMS가 확인한 동일성 규칙으로 각 구성 요소를 정규화한 길이 구분 UTF-8 튜플을 만들고 SHA-256 OBJECT_KEY를 계산한다. 구성 순서는 profile/server/database/schema/object이며 해당 없음 표지를 포함한다. 단순 연결 문자열·전역 소문자화·데이터소스 별칭 규칙을 사용하지 않는다. 같은 키이면 전체 튜플을 추가 비교하며 해시 충돌은 동일 객체로 병합하지 않고 409로 중단한다. 길이는 각 이름 500자 이내이며 원문을 자르지 않는다"
      profile_transition: "한 데이터소스의 등록/반영에는 하나의 고정된 식별 규칙 버전만 사용한다. integration이 다른 버전을 반환하거나 기존 DRAFT/ACTIVE 항목의 IDENTITY_PROFILE이 섞였으면 기존 전체 등록과 재대조/충돌 해결·키 이행을 완료하기 전 신규 등록·이름 변경·복원/반영을 409로 차단한다. 새 버전으로 키만 계산해 기존 유일 인덱스를 우회하지 않는다. 이행은 데이터소스 및 해당 live 카탈로그 잠금 아래 현재 키를 함께 바꾸며 고정 과거 판의 profile/이름은 보존한다. @defer P3 integration — 규칙 버전의 원천·배포/이행 절차와 동시 저장 차단 계약을 연결한다"
      uniqueness: "ENT-005의 DATA_SOURCE_ID+OBJECT_KEY 부분 유일 인덱스로 DRAFT/ACTIVE 중복을 차단한다. 같은 객체의 여러 후보는 한 CATALOG_ID 아래에 둔다. RETIRED 항목의 과거 참조는 유지하고 신규 실체 등록은 새 ID를 사용한다. 복원/이름 변경 반영 때 새 이름 점유와 현재 원천 실체를 다시 검사한다. 객체 유형 TABLE/VIEW는 사실이며 동일 물리 식별 중복을 피해 가는 키가 아니다"
      rename: "이름 변경은 새 후보에 전체 새 물리 식별과 IDENTITY_EVIDENCE를 기록한다. 기존 항목·구성의 안정 ID를 재사용하려면 같은 객체임을 현재 근거로 검수하고, 참조 영향/기준 판/새 이름 중복을 세트 반영 직전 다시 검사한다. 현재 행의 이름은 실제 반영 시에만 바뀐다. 삭제·재생성의 자동 승계나 과거 판 이름 덮어쓰기는 금지한다"
      column: "COLUMN_ID는 ENT-020의 카탈로그/종류에 고정한다. 한 판에서 COLUMN_KEY의 중복을 거부하되 이름 미확인 초안은 null로 보존한다. 새로 발견한 동명 컬럼에 이전 ID를 자동 배정하지 않는다. 부분 수집을 등록 컬럼 삭제로 해석하지 않는다"
    composition_contract:
      scope: "ENT-006 한 판의 구조/의미·ENT-007 컬럼·ENT-008/025 소유 관계/쌍·ENT-009/026 기간 제약/대체 키·ENT-021/022 전체 키·ENT-023 인라인 값·ENT-024 코드 조건과 접근 그룹 후보가 전체 구성이다. 정책 소유의 현재 마스킹/행 스코프/기본 필터/전송 정책은 복사·복원하지 않는다"
      draft: "미완성 초안은 null/UNKNOWN과 구조화한 누락 사유로 보존한다. 없는 ID를 가짜 참조로 채우지 않으며 존재하지 않는 비null ID·다른 소유 구성·중복 ID·권한 밖 참조는 거부한다. 모든 자식 수정은 소유 카탈로그/리비전 잠금과 EDIT_VERSION을 검사한다. 관계별·컬럼별 독립 승인이나 부분 반영 API는 없다"
      member_identity: "신규 구성은 종류별 clientKey(UUID)를 받아 전체 입력의 임시 참조를 먼저 해석한다. 서버가 ENT-020을 배정하고 소유/종류를 고정하며 결과에 clientKey→memberId를 반환한다. 자기조인은 같은 저장의 신규 컬럼을 참조할 수 있다. 다른 후보의 아직 배정되지 않은 clientKey를 추정하지 않고 먼저 그 후보 저장 결과를 받는다. 삭제·재추가 시 명시한 기존 ID의 동일성을 검증하며 소유/종류 이전은 거부한다"
      keys: "ENT-021·022는 원천/검수된 유일 식별키의 전체 구성이다. 일부 컬럼이 미등록·미확인이면 키를 VERIFIED로 확정하지 않는다. PK 참여 컬럼 하나를 단일 유일키로 취급하지 않는다. 복합 키 순서·중복·전체 범위를 검증하며 원천 DB에 키/인덱스를 생성하지 않는다"
      code: "VALUE_MODE=CODE의 참조는 같은 데이터소스에 속한 공개 카탈로그의 정확 판·코드값/명칭 컬럼과 필요한 AND 동등 조건이다. CODE가 아닌 구성에 코드 참조/조건을 남기면 거부한다. 조건 유형은 STRING/NUMBER/BOOLEAN/DATE/DATETIME이며 무효 형식·NULL·임의 SQL은 받지 않는다. 전용 코드 객체에 그룹 조건을 강제하지 않는다. 값 도메인의 완성/검수와 현재 공개/접근 가능성은 별도다"
      inline: "VALUE_MODE=INLINE은 ENT-023의 명시 열거만 사용한다. 타입과 정형 값의 중복을 거부하며 개인정보 샘플을 자동 복사하지 않는다. NONE/UNKNOWN은 코드/열거 자식을 가지지 않는다. 빈 열거는 VERIFIED가 아니며 미완성 사유를 남긴다"
      constraints: "PERIOD_REQUIRED는 양쪽 경계를 요구하고 PERIOD_MAX는 그 기간의 상한도 요구한다. 최대 범위 단위는 CALENDAR_DAY(해당 시간대의 날짜 경계 기준) 또는 ELAPSED_SECOND(정규화한 시점 간 경과 초)로 명시하며 임의 기본값을 두지 않는다. 월/년 등 지원 밖 단위는 자동 일수 변환하지 않는다. 경계 포함/제외·DATE/DATETIME/문자열 해석·시간대가 미확인인 정의는 사용 불가다. 여러 제약은 모두 충족하고 대체는 해당 제약에 연결한 ENT-026의 키 한 개의 전체 구성에만 적용한다"
      reviews: "입력은 검수 의도와 근거를 전달하며 검수자/시각은 서버가 현재 작성/검수 권한에서 결정한다. UNKNOWN/INVALID를 유지할 수 있으나 VERIFIED 요청은 실제 필수 필드/전체 참조/타입·의미/근거 검사를 통과해야 한다. 단순 DTO의 VERIFIED 값 복사를 금지한다. 구조·의미·코드·키·관계·기간 정의가 달라지면 해당 검수와 의존 검수를 무효화하고 명시적으로 재검수한다. 세트 기술 검토·최종 승인 절차와는 구분한다"
      owned_components: "@defer P3 access_policy·knowledge — 접근 그룹 후보 저장/고정 참조와 당시 직접 정책 참조의 구체 형식은 FEAT-007 및 소유 정책 계약에서 완성한다. 이 계약을 비운 채 전체 스냅샷 고정/운영 반영을 구현 완료로 표시하지 않는다. 그룹 조회 실패를 빈 그룹 또는 상속 해제로 바꾸지 않는다"
    edit_transaction:
      scope: "카탈로그 초안 저장/복사와 변경 근거 접수의 성공 결과만 ENT-028에 저장한다. 운영 반영은 FEAT-014·040 소유이며 ENT-019 직접 관리 결과를 카탈로그 승인 원장으로 확대하지 않는다"
      input: "commandKey는 소문자 UUID다. 지문은 인증 주체·작업·요청 대상/기대 버전·전체 정규화 구성·기준/복원 판·clientKey와 참조·검수 의도/근거·사유를 포함한다. 서버 채번 ID/시각·traceId를 제외한다. 같은 키/다른 입력은 409이며 다른 주체에는 결과를 반환하지 않는다"
      save: "현재 권한과 기존 성공 결과를 확인하고 READ COMMITTED에서 필요한 부모를 공통 순서로 잠근다. 잠금 대기 후 같은 명령 결과를 재조회해 재생을 먼저 판정한다. DRAFT/EDIT_VERSION/소유·참조 검사를 통과하면 필요한 ID/전체 결과 매핑을 계산해 완전한 ENT-028 행을 INSERT한 후 전체 초안과 자식·신규 구성 ID·필요 변경 근거를 함께 저장한다. 하나라도 실패하면 전부 롤백한다. 고정 판에는 쓰지 않으며 새 판 복사로 연결한다"
      versions: "초안 전체 저장마다 EDIT_VERSION을 한 번 올린다. 이전 화면의 수정 충돌은 409이며 자동 병합/재시도하지 않는다. 새 판 복사는 현재 기준 유효본과 복사할 과거 판을 구분한다. 서로 참조하는 초안의 행에 상대 EDIT_VERSION을 재귀 저장하지 않고 세트 고정 요청이 전체 후보 ID→기대 EDIT_VERSION 집합을 한 번 제출한다"
      copy: "새 판 복사에서는 소유 전체 자식의 REVISION_ID와 같은 소유 객체/복사 원본 판을 가리키는 자기조인·자기 코드 참조를 새 판으로 함께 연결한다. 안정 구성 ID·종류·소유와 전체 컬럼쌍/키 구성은 유지한다. 이 내부 참조 재배치는 새 후보 작성의 일부이며 고정된 원본은 수정하지 않는다. 외부 카탈로그/내용 참조는 원래 선택 판을 보존하며 최신판/다른 세트 후보로 바꾸지 않는다. 당시 검수 완료를 자동 승계하지 않고 새 후보의 변경/참조/현재 정책에 맞게 재검수한다"
      result: "결과는 원래 catalogId/revisionId/editVersion/evidenceId·clientKey 매핑·반영 시각이다. 같은 명령 재수신은 새 판/구성/근거를 만들지 않는다. 유일 키 경합 실패 트랜잭션은 종료한 뒤 새 읽기로 결과를 확인한다. getCommandResult 미발견 또는 다른 주체 키는 UNKNOWN이며 미실행 확정이 아니다. 클라이언트는 같은 키를 사용하고 새 키로 중복 생성하지 않는다"
      impact: "업무 의미/값 도메인 변경은 구조 이상 유무와 무관하게 ENT-010·027 근거와 변경 판을 같은 저장에 남긴다. FEAT-036의 검토 연결 전달/재수신·실패 복구는 knowledge에서 완성하며 근거가 있다는 이유로 검토 완료로 표시하지 않는다"
      retention: "@defer P3 audit_trace — ENT-028 결과 보존과 늦은 재수신 차단을 함께 정하며 그 전 파기를 활성화하지 않는다"
    set_public_contract:
      implementation: planned
      owner: FEAT-014
      freeze: "전체 후보 집합의 대상 종류/안정 ID·기준 유효본·revisionId·기대 EDIT_VERSION을 먼저 고정한다. 같은 대상 두 후보를 거부하고 모든 후보/필수 내용 참조를 잠근 뒤 기록된 판을 대조한다. 전체 그룹 후보 등 소유 구성과 지문이 완전해야 FROZEN으로 전이한다. 세트 내 다른 후보를 가리키는 참조는 기록한 revisionId와 정확히 같아야 한다. 외부 운영본을 세트 후보로 자동 재결합하지 않는다"
      references: "초안 조회/선택 결과는 검증 근거이지 예약 권한이 아니다. 후보에는 정확한 객체/판/구성 참조를 저장하고 FEAT-014.reference_validation의 SELF/CANDIDATE/EXTERNAL_CONTENT/IMPACT_EVIDENCE/CURRENT_POLICY 구분을 세트의 고정 참조 목록에 보존한다. 자기조인은 양쪽 모두 소유 판이다. 상호 참조는 전체 집합으로 검증하며 먼저 온 후보만 선택하지 않는다"
      locks: "admin 자산 쓰기 경로는 종류 문자열 오름차순(CATALOG, DATA_SOURCE, …)과 양의 숫자 ID 순서로 부모를 잠그고, 같은 종류 안에서는 숫자순으로 처리한다. 카탈로그 자식은 그 부모 뒤 revisionId 순서로 잠근다. 변경 대상뿐 아니라 내용 참조의 현재 포인터 교체와 경쟁하는 외부 부모도 짧게 잠근다. 필요한 잠금 집합이 늘어나면 트랜잭션을 종료하고 전체 정렬 집합으로 재검증한다. 데이터소스 삭제/그룹 축소 및 카탈로그의 참조 추가·반영도 이 순서에 참여한다. 참조만 하는 자산에 업무상 미종결 요청 점유를 만들지는 않는다"
      apply: "승인/전결의 실제 반영 트랜잭션은 모든 변경 대상 기준본·고정 후보·외부 내용 참조 최신성·현재 권한/그룹·연결 지원·정확 객체 동일성/중복을 다시 검증한다. 검증과 같은 잠금 아래 전체 포인터·효력·물리 이름·세트 결과/이력을 함께 전환한다. 하나의 변경도 부분 적용하지 않는다. 실패/결과 불명 복구와 명령 원장은 세트 소유에서 구현한다"
      boundary: "@defer P3 knowledge·access_policy — 고정 참조/그룹 후보·세트 원장·주체/권한 회수 동시성의 실제 저장과 복구 계약을 연결한다. 외부 원천 DDL이나 설정 배포를 admin DB 잠금으로 동결했다고 주장하지 않으며 실제 소비 시 동일 연결/현재 상태를 재검증한다"
    source_public_contract:
      implementation: planned
      owner: integration
      input: "현재 주체·Hub 데이터소스·선정한 정확 공개 객체 또는 등록 catalogId/revisionId와 연결 관측 근거. 전체 DB 열거/자동 등록 입력은 없다"
      output: "nodeId/bootId/appliedSettingsId/observedAt·identityProfile·정확 물리 식별·TABLE/VIEW·컬럼 자료형/키 전체/NULL 사실과 COMPLETE/PARTIAL/FAILED. 부분 수집에는 누락/실패 범위를 명시한다. 원천 코멘트는 제안이며 검수 완료 값이 아니다. 연결 주소/계정/비밀은 제외한다"
      sampling: "샘플링은 runSample의 별도 수동 실행이다. 선택한 등록 컬럼의 현재 개인정보 제외·읽기/실행 권한·현재 정책·필수 조회 제약·조회량/시간 상한을 서버에서 검사한다. 상한/공개 검증 계약이 미완성인 배포에서는 기능을 활성화하지 않는다. 값은 ENT-010 구조 근거·후보/이력에 복제하지 않고 REQ-304.note의 시스템 조회 이력으로 연결한다"
      pending: "@defer P3 integration·agent — DBMS별 정확 이름/동일성 해석 규칙과 최대 이름 길이 대응·사실 조회/샘플링의 시간/행 상한·현재 연결 재검증·실행 이력 계약을 완성한다. 지원 밖 입력을 정상처럼 저장/실행하지 않는다"
    types:
      CatalogFilter: "SearchRequest.params의 dataSourceId/lifecycle/businessName 선택 조건. conditions는 같은 허용 필드만 허용하고 sorts는 catalogId/businessName/appliedAt, 동률 catalogId다. 기본 offset 페이지와 PageSpec 공통 제한을 사용한다"
      CatalogRow: "catalogId/dataSourceId/정확 물리 식별/lifecycle/currentRevisionId/stateVersion/업무명/반영시각. 검수/관측/현재 권한 결과는 이름이 다른 별도 필드다"
      CatalogKey: "catalogId:필수 양의 십진 문자열. 기록 보존 권한이 있으면 RETIRED 항목도 조회한다"
      CatalogDetail: "CatalogRow와 현재 선택 내용 요약·현재 연결/정책 관측·권한 있는 사용처. 조회 실패를 값 삭제로 바꾸지 않는다"
      RevisionKey: "catalogId/revisionId:필수. 둘의 소유를 함께 검사하고 다른 소유 판이면 404다"
      RevisionRow: "catalogId/revisionId/revisionNo/baseRevisionId/contentState/editVersion/작성·고정 시각·사유. 승인/반영 상태는 소유 세트 결과와 별도로 표시한다"
      CatalogComposition: "ENT-006의 편집 가능한 정의와 ENT-007~009/021~026의 전체 자식 목록, 접근 그룹 후보의 소유 계약 참조. memberId 또는 신규 clientKey를 사용한다. 모든 필드/목록을 명시하며 빈 목록과 누락은 다르다. 당시 정책 참조는 소유 계약의 서버 결과이며 사용자가 현재 정책을 덮지 못한다"
      RevisionDetail: "RevisionRow·당시 전체 CatalogComposition·과거 근거/고정 참조와 누락/검수 사유. 현재 컬럼/그룹으로 과거를 재구성하지 않는다"
      DraftCreate: "commandKey/dataSourceId/resolvedIdentity/identityObservation/reason와 최초 CatalogComposition. 객체 식별은 완전해야 하지만 업무 의미는 미완성 초안 가능하다"
      DraftSave: "commandKey/catalogId/revisionId/expectedEditVersion/reason/전체 CatalogComposition. 동일 객체 이름 변경 근거와 검수 의도 포함, 서버 검수자/시각은 입력받지 않는다"
      DraftCopy: "commandKey/catalogId/sourceRevisionId/expectedCurrentRevisionId/reason. 복원은 옛 내용을 새 판으로 복사하되 현재 기준본은 별도로 기록한다. 과거 직접 정책·기존 검수 완료를 새 내용/현재 권한의 근거로 자동 복사하지 않는다"
      DraftResult: "commandKey/catalogId/revisionId/editVersion/evidenceId/clientKeyMappings/appliedAt의 원 성공 사실만 반환한다. 이 값 전체는 ENT-028에 보존돼 재수신 결과가 달라지지 않는다. 현재 누락/검수 필요 목록은 별도 getValidation으로 읽고 원 성공 결과나 운영 활성화 상태로 섞지 않는다"
      CatalogReferenceRow: "참조 경로/종류·대상 안정 ID·선택 내용 판·역할·관리 카탈로그·권한 있는 영향 요약. 숨겨진 사용처는 상세를 노출하지 않지만 삭제/반영 검사에서 제외하지 않는다"
      SourceObjectQuery: "dataSourceId·선정한 정확 객체 식별. 서버/DB/스키마 해당 여부는 원천 해석에서 확인한다. 와일드카드 전체 수집 입력을 받지 않는다"
      SourceObjectResult: "해석 상태 RESOLVED/AMBIGUOUS/UNSUPPORTED 및 정확 식별/동일성 규칙 버전/관측. 실패는 불명으로 반환하고 기본 스키마로 자동 확정하지 않는다"
      StructureQuery: "RevisionKey·기대 내용 판/연결 관측 기준. 현재 등록 공개 범위의 구조 사실만 조회한다"
      StructureResult: "현재 사실/후보와의 차이·완전성/실패 범위·원천 관측 근거. 자동 후보 갱신이 없으며 저장할 때 서버가 검수 근거를 대조한다"
      SampleRequest: "RevisionKey·선택한 등록 columnIds·검증 가능한 조회 조건/상한. 원천 SQL 임의 입력이나 미등록 컬럼/개인정보 열 선택을 허용하지 않는다"
      SampleResult: "허용 샘플과 실제 조회 이력 참조·적용 제한·결과/실패 상태. 결과 원문을 카탈로그 저장 DTO에 포함하지 않는다"
      EvidenceFilter: "catalogId/sourceKind/receivedFrom/receivedTo 선택, 시각 범위는 시작 포함·끝 제외. 정렬 receivedAt/evidenceId 내림차순, 공통 offset 페이지"
      EvidenceKey: "evidenceId:필수. 관련 대상/원 근거의 현재 열람 권한을 함께 검사한다"
      EvidenceRow: "evidenceId/sourceKind/observationStatus/receivedAt/observedAt·권한 있는 대상 요약"
      EvidenceDetail: "EvidenceRow·버전 있는 구조 차이/업무 변경 근거·ENT-027의 각 대상/판/역할과 소유 검토/조사 연결. 미확인과 영향 없음은 다르다"
      EvidenceSave: "commandKey/sourceKind/sourceRef/observationStatus/evidenceFormat=1/evidenceBody/targets/고객사 예정·실제 적용 시각. 수동 통지/업무 근거만 입력하며 구조 관측 결과·주체·접수시각은 서버 근거로 검증한다. 보완은 새 evidenceId로 연결한다"
      CatalogCommandKey: "commandKey와 현재 READ·SAVE 권한. 다른 주체 키와 미발견을 같은 UNKNOWN으로 반환한다"
      CatalogCommandResult: "APPLIED면 원 DraftResult 또는 근거 접수 결과, UNKNOWN이면 진행/롤백/미접수를 확정하지 않는다. traceId는 이번 요청 값이다"
      ValidationRequest: "RevisionKey·expectedEditVersion·같은 세트 후보 ID→기대 편집 버전 목록. 소유 공개 조회로 전체 현재 구성을 검증하며 제출/예약/고정을 하지 않는다"
      ValidationResult: "관측한 후보 판/편집 버전·정확 참조 목록·오류/미완성/검수 필요 목록. 제출/반영 시 다시 검증하므로 이 결과를 영구 허가로 쓰지 않는다"
      ReferenceCandidateFilter: "소유 RevisionKey·후보 종류 COLUMN/CODE_OBJECT/JOIN_OBJECT/KEY·조회 범위. 현재 허용된 등록 객체/판만 반환하며 같은 세트 후보와 현재 운영본을 구분한다"
    exception_map:
      UC-007.E1: "400 식별 불명/403 현재 권한 부족/503 필수 원천·참조 조회 불가"
      UC-007.E2: "초안 저장은 누락/사용 불가를 명시하며 운영 사용/제출 요건을 충족한 것으로 표시하지 않는다"
      UC-007.E3: "409 기준/참조 충돌이며 세트 검증 실패로 인계한다"
      UC-014.E1: "미확인 근거를 보존하며 영향 없음으로 종결하지 않는다"
      UC-014.E2: "실제 오류/조사 연결이며 자동 비활성화하지 않는다"
      UC-014.E3: "중대한 영향의 조치 판단은 REQ-304.open 소유 절차로 인계한다"
    errors: "400 err.admin.catalog.invalidInput·403 공통 인가·404 공통 미발견·409 err.admin.catalog.versionConflict/referenceConflict/identityConflict/commandConflict·503 err.admin.catalog.dependencyUnavailable. 변경 실패는 전체 롤백한다. 실제 MSG 키/시드·문구는 화면/구현 단계에서 연결한다"
    verification_cases:
      - "동명 객체의 DB/스키마/서버/데이터소스가 다르면 별개, 정확 물리 실체가 같으면 그룹이나 TABLE/VIEW 구분으로 중복 등록 불가"
      - "같은 객체의 profile v1 등록 뒤 v2가 관측되면 키가 달라져도 신규 등록을 거부하며 기존 전체 대조/이행 전 반영을 허용하지 않는다"
      - "동일 이름의 삭제/재생성을 이름 변경으로 자동 승인하지 않으며 동일 객체 이름 변경 뒤 과거 판은 옛 이름을 유지한다"
      - "다른 카탈로그의 컬럼 ID·같은 컬럼의 다른 판·관계 소유 이전·자기조인의 한쪽 옛 판은 거부한다"
      - "제출 뒤 자식만 수정하는 경로도 FROZEN/EDIT_VERSION 검사에서 실패해야 한다"
      - "자기조인/자기 코드 참조가 있는 과거 판을 복사하면 양쪽/대상 참조가 새 자기 판을 가리키고 외부 내용 참조는 선택한 원래 판을 유지해야 한다"
      - "복합 키 일부·여러 대체 키 컬럼의 합집합·한 요청에서 여러 키값·NULL 조건은 기간 대체가 아니다"
      - "세트 상호 참조는 모두 고정한 후보로 검증하며 외부 판/새 후보의 불일치를 자동 치환하지 않는다"
      - "검증 직후 외부 유효본 전환·데이터소스 삭제와 경합하면 잠금/재검증으로 안전하게 한 순서만 반영한다"
      - "단순 소유자/시각 표시가 아닌 실제 검수 근거가 필요하며 의미/코드 변경 후 이전 검수 완료가 그대로 남으면 실패다"
  FEAT-011:
    design_status: draft
    implementation: planned
    request_rule: "관계 작성/저장은 FEAT-003의 전체 후보 API와 편집/세트 계약을 사용한다. 관리 카탈로그와 안정 관계 식별자는 ENT-020에 고정한다"
    response_rule: "양쪽 카탈로그의 getRelatedJoins는 같은 소유 관계를 역할과 함께 보여준다. 반대 화면에서 편집하면 관리 카탈로그의 초안으로 연결하고 그 권한을 검사한다"
    exception_map: { UC-008.E1: "초안의 누락/검수 필요를 보존하고 권장 관계 사용 제외", UC-008.E2: "403 현재 권한 또는 409 참조 충돌. 상대 객체 권한 부여/최신판 자동 치환 금지" }
