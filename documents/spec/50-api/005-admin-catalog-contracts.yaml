# 카탈로그 관리·모듈 공개 계약 — 미구현 P3 초안
feature_contracts:
  FEAT-003:
    security_domain_scope: "ARCH-050.admin_account_contract. 관리 명령의 인증·ACTOR_ID·지문·원 결과 소유 비교는 system 관리자 영역이다. Portal 주체/같은 문자열 ID로 실행·재생하지 않으며 Portal 대상 이용자와 처리자를 구분한다"
    design_status: draft
    implementation: planned
    request_rule: "POST/body·ApiResponse·SearchRequest/PageResponse와 AUTHZ-090·091을 따른다. 모든 BIGINT 식별자·버전/순서는 양의 십진 문자열이다. 신규 ID는 JPA TABLE/SYS_SEQUENCE를 사용하고 서버 주체/시각을 클라이언트가 대체하지 않는다. 기존 system 계약을 변경하지 않는다"
    response_rule: "안정 항목·선택한 내용 판·현재 효력·초안 검수·현재 정책/연결 관측을 분리한다. draft 저장 성공이나 검사 결과만으로 운영 사용 가능을 반환하지 않는다. 메타데이터 열람과 원본 값/샘플 열람 권한은 별도다"
    identity_contract:
      source: "REQ-301.business_rules와 identity_change·ADR-032를 따른다. DATA_SOURCE_ID는 같은 안정 항목에서 고정하며 다른 물리 실체/데이터소스로 이름을 바꾸는 우회를 허용하지 않는다"
      resolution: "integration 소유의 정확 객체 해석은 실제 데이터소스·DBMS 식별 규칙 버전·서버/DB/스키마/객체의 정확 이름과 각 차원의 PRESENT/NOT_APPLICABLE을 반환한다. 해당 없음은 DB null로 저장하지만 입력의 미확인/생략과 구분한다. 해당하는 스키마는 기본 스키마도 실제 이름을 명시한다. 모호함·지원 불가 식별은 저장하지 않는다. 원천 조회 실패는 선언 식별과 별개이며 REQ-301.manual_registration의 완전한 직접 입력을 서버에 고정된 identityProfile로 정규화할 수 있다. 메타데이터 조회 성공이 정규화의 전제는 아니다"
      equality: "서버에 고정된 DBMS별 동일성 규칙으로 각 구성 요소를 정규화한 길이 구분 UTF-8 튜플을 만들고 SHA-256 OBJECT_KEY를 계산한다. 구성 순서는 profile/server/database/schema/object이며 해당 없음 표지를 포함한다. 단순 연결 문자열·전역 소문자화·데이터소스 별칭 규칙을 사용하지 않는다. 같은 키이면 전체 튜플을 추가 비교하며 해시 충돌은 동일 객체로 병합하지 않고 409로 중단한다. 길이는 각 이름 500자 이내이며 원문을 자르지 않는다"
      profile_transition: "한 데이터소스의 등록/반영에는 하나의 고정된 식별 규칙 버전만 사용한다. integration이 다른 버전을 반환하거나 기존 DRAFT/ACTIVE 항목의 IDENTITY_PROFILE이 섞였으면 기존 전체 등록과 재대조/충돌 해결·키 이행을 완료하기 전 신규 등록·이름 변경·복원/반영을 409로 차단한다. 새 버전으로 키만 계산해 기존 유일 인덱스를 우회하지 않는다. 이행은 데이터소스 및 해당 live 카탈로그 잠금 아래 현재 키를 함께 바꾸며 고정 과거 판의 profile/이름은 보존한다. @defer P3 integration — 규칙 버전의 원천·배포/이행 절차와 동시 저장 차단 계약을 연결한다"
      uniqueness: "ENT-005의 DATA_SOURCE_ID+OBJECT_KEY 부분 유일 인덱스로 DRAFT/ACTIVE 중복을 차단한다. 같은 객체의 여러 후보는 한 CATALOG_ID 아래에 둔다. RETIRED 항목의 과거 참조는 유지하고 신규 실체 등록은 새 ID를 사용한다. 복원/이름 변경 반영 때 새 이름 점유와 현재 원천 실체를 다시 검사한다. 객체 유형 TABLE/VIEW는 사실이며 동일 물리 식별 중복을 피해 가는 키가 아니다"
      rename: "이름 변경은 새 후보에 전체 새 물리 식별과 IDENTITY_EVIDENCE를 기록한다. 기존 항목·구성의 안정 ID를 재사용하려면 같은 객체임을 현재 근거로 검수하고, 참조 영향/기준 판/새 이름 중복을 세트 반영 직전 다시 검사한다. 현재 행의 이름은 실제 반영 시에만 바뀐다. 삭제·재생성의 자동 승계나 과거 판 이름 덮어쓰기는 금지한다"
      column: "COLUMN_ID는 ENT-020의 카탈로그/종류에 고정한다. 한 판에서 COLUMN_KEY의 중복을 거부하되 이름 미확인 초안은 null로 보존한다. 새로 발견한 동명 컬럼에 이전 ID를 자동 배정하지 않는다. 부분 수집을 등록 컬럼 삭제로 해석하지 않는다"
    batch_comparison_contract:
      view_capabilities: "REQ-304.batch_structure_comparison.view_scope. 양쪽 objectType과 항목별 적용/지원/확인 상태를 반환한다. 일반 뷰의 물리 PK 해당 없음은 PK 없음·UNKNOWN과 구분하고 논리키를 원천 PK로 비교하지 않는다. 뷰 NULL UNKNOWN은 원본 컬럼 사실로 덮지 않는다. 특수 뷰 인덱스는 DBMS 지원에 따라 비교하며 구조 일치로 내부 쿼리 의미 동일을 보증하지 않는다"
      source: "REQ-304.batch_structure_comparison, SCR-002, ENT-039/040"
      presence_contract: "REQ-304.batch_structure_comparison.presence. 각 행은 catalogPresence/sourcePresence와 양쪽 정형 정의를 반환한다. ABSENT는 명시 상태이며 null/빈 배열/조회 실패로 추론하지 않는다. 화면은 존재하는 쪽의 이름으로 행을 식별하고 다른 쪽은 항목 없음으로 표시한다. 양쪽 부재도 성공 확인 범위와 최신 기준을 검사한 뒤 기존 차이 해소를 판정한다"
      comparison_views: "목록은 COLUMN/INDEX 유형별로 조회한다. COLUMN은 정확 테이블/컬럼별 카탈로그/원천의 이름·타입·치수·NULL·PK/순서와 속성별 비교 상태를 반환한다. INDEX는 정의 종류·이름·유일성·순서 있는 키 구성·포함 컬럼·필터/표현식·기타 지원 속성의 양쪽 전체 정의를 반환한다. 표시는 비교 쌍이지만 DTO는 구분 문자열 하나가 아닌 정형 값/원문/상태/기준 버전/관측 시각을 보존한다. 미관리/미지원/미확인을 같음으로 합치지 않는다. 긴 정의를 자르지 않고 현재 권한 범위의 셀 상세·엑셀에 제공한다"
      implementation: planned
      commands: "시작(dataSourceId/expectedSettingsVersion/commandKey)·실행 결과 조회(runId)·현재 불일치 목록(dataSourceId)으로 분리한다. 현재 HUB_DATA_SOURCE READ+비교 실행 권한 및 대상 메타데이터 권한을 서버에서 검사한다. 카탈로그 수정/SAVE와 비교 실행은 별도 액션이다"
      scope: "서버가 권한 있는 등록 카탈로그의 현재 유효 버전 목록을 확정하고 선택 객체의 API-029/integration 구조 조회를 재사용한다. 클라이언트가 임의 테이블/SQL을 추가하지 못한다. 부분 권한 범위를 데이터소스 전체 정상으로 표시하지 않는다"
      result: "실행/완료 시각·RUNNING/COMPLETED/PARTIAL/FAILED/CANCELED·대상/성공/불일치/확인불가/건너뜀 수와 대상별 결과·기준 버전·비교 지원 범위를 반환한다. 목록 행은 정확 대상/속성·정의값/원천값·최초/최근 발견·최근 확인 상태이며 실제 값 데이터는 없다"
      update: "동일 데이터소스 실행 점유·기준/세대 검사 뒤 대상별 결과와 현재 차이 UPSERT/일치 확인된 차이 제거를 원자 처리한다. 차이 해소 사실은 실행 기록/근거에 남긴다. 목록/이력/카탈로그 반영은 서로 다른 저장이며 비교가 자산을 자동 수정하거나 기존 검토를 종결하지 않는다"
      pending: "@defer P3 integration_assets·integration — 구체 API ID/경로/DTO·페이지/정렬·멱등/잠금·중단/재시작·시간 상한·보존/파기와 실제 검증을 확정한다. READ API-029를 일괄 실행 명령이나 결과 저장 API인 것처럼 사용하지 않는다"
    screen_projection: "REQ-301.column_workspace·relationship_metadata.workspace. SCR-003은 컬럼 정의·PK 및 유일키/인덱스/값/그룹 예외를 편집하고 관계 건수를 읽기 전용으로 요약한다. 관계 탭/직접 FK 설정 창 없이 SCR-039를 참조하며 별도 화면도 같은 관리 카탈로그의 전체 후보·EDIT_VERSION·API-023/024/025를 사용한다. 숨겨진 관계는 전체 구성에서 보존하고 미확보/조회 실패를 삭제로 해석하지 않는다. 요약/화면 이동·미저장 입력 보존·편집 충돌의 상세 계약은 SCR-039 후속 설계 대상이다"
    code_value_read_contract:
      source: "REQ-301.value_domain, REQ-603.code_lookup_definition. 소유 FEAT-002/003, 소비 FEAT-202"
      input: "이번 호출의 실제 선택 catalogId/revisionId·최종 허용 columnIds와 현재 인증/회사/언어/정책 문맥. 클라이언트 임의 SQL·정의 최신판·바인딩 덮어쓰기를 받지 않고 서버가 정확 후보/운영 컬럼 설정에서 해석한다"
      dedup: "dataSourceId/연결 설정 세대/codeQueryId/codeQueryRevisionId/정규화 typed 전체 바인딩/회사·언어·보안 문맥별로 중복 제거한다. 요청 안에서 동일 튜플은 한 번 조회하고 각 원래 컬럼과 대응을 반환한다. 서로 다른 SQL 자동 합성이나 데이터소스 간 대체는 없다"
      output: "각 컬럼의 queryRef/bindingRef/valueType/value/name/optionalDescription, LIVE 또는 CACHE, sourceObservedAt/usedAt/expiresAt, COMPLETE/EMPTY/FAILED/INCOMPLETE/UNAVAILABLE와 보호된 evidenceRef를 반환한다. HIDE/권한 밖 컬럼은 요청 범위·값 목록에서 제외하고 권한 확인 전 조회/캐시 노출하지 않는다"
      failure: "조회 실패·빈 결과·중복 모호 코드·미검수/비활성·한도 초과를 구분한다. 완전한 성공 또는 유효 캐시만 해당 코드 기반 생성에 사용하며 코드값 추정/최근 성공으로 오류 대체/무표시 절단은 금지한다. 코드에 의존하지 않는 독립 질의까지 일괄 차단하지 않는다"
      evidence: "사용한 정확 정의 버전·typed 바인딩·원 관측/사용 시각·결과 상태와 전달 코드 목록의 보호된 스냅샷/해시를 턴 근거에 연결한다. 현재 코드명으로 과거를 재구성하지 않으며 REQ-111·보존/반출 정책을 따른다"
      pending: "@defer P3 agent·integration — 모듈 공개 DTO/전송·배치/병렬 제한·대형 목록 검색·캐시 무효화 경합·보호된 실행/턴 근거 저장을 구현 전에 완성한다. 아래 관리자 preview는 이 운영 집합 조회 계약과 목적/권한을 구분한다"
    composition_contract:
      column_privacy: "REQ-111.privacy_metadata.column_workspace. 컬럼 후보는 privacyFlag(YES/NO/UNKNOWN), privacyType, maskingRef, subjectIdentifier, privacyReview를 가진다. YES 또는 MASK 예외 사용 시 유효한 공통 변환 참조를 요구하고 미확인/누락은 사용 가능으로 검수하지 않는다. 내용 변경은 검수를 무효화하며 전체 저장/복사/고정에서 보존한다. 컬럼 후보 참조를 바꿔도 공통 변환 정의를 덮지 않는다. @defer P3 access_policy — 물리 매핑/DTO·정책 참조 버전·과거 재현/현재 검증을 완성한다"
      source_types: "REQ-301.source_type_catalog. 각 컬럼은 sourceTypeCode(nullable DBMS_DATA_TYPE 상세 코드 1~30자)와 sourceType(nullable 원천 문자열 1~200자)를 별도로 가진다. 서버는 카탈로그 데이터소스의 현재 DBMS와 PARENT 일치·활성·NATIVE_TYPE/원천 대조를 검사한다. 미확인 초안은 원문/null 코드로 보존할 수 있지만 잘못된 비null 참조는 거부한다. 검수 완료에는 실제 원천 조회 또는 설계서/담당자 확인 등 REQ-301.manual_registration의 구조 근거 대조가 필요하며 자료형/DBMS 변경 시 해당 검수는 무효화한다. 저장/복사/고정/이력은 당시 코드·원문을 보존한다"
      column_exclusions: "REQ-103.column_group_exclusions. tableGroupRefs와 columnExceptions 전체 목록은 같은 후보/기대 버전으로 검증·저장·고정·반영한다. 입력은 columnRef/groupRef/treatment(HIDE 또는 MASK)/reason이며 반환에는 서버 regId/regDtm을 포함한다. 컬럼+그룹 중복·테이블 밖 그룹·빈 사유·알 수 없는 유형을 거부한다. MASK이면 해당 컬럼의 유효한 maskingRef를 검사한다. 예외 제거는 원본 열람 승계 복귀다. HIDE는 컨텍스트/SQL에서 제외, MASK는 결과 변환이며 현재 권한/복수 그룹 합집합을 대조한다. 저장 사본 개인정보 마스킹은 별도로 강제한다. 구체 행 식별·물리·감사/복사 모델은 FEAT-007 후속이다"
      additions_pending: "@defer P3 integration_assets — REQ-301.source_dimensions/index_metadata의 치수·인덱스 전체 정의/구성을 CatalogComposition에 포함할 형식·물리 매핑·조회/저장·과거 재현·복사/고정/검증 계약을 완성한다. 기존 DTO/ENT에 해당 필드가 이미 있는 것으로 해석하지 않으며 누락 상태로 부분 저장/운영 반영하지 않는다"
      scope: "ENT-006 한 판의 구조/의미·ENT-007 컬럼·ENT-008/025 소유 관계/쌍·ENT-021/022 전체 키·ENT-023 인라인 값·ENT-024 코드 바인딩과 접근 그룹 후보가 전체 구성이다. 정책 소유의 현재 마스킹/행 스코프/기본 필터/조회 제약/전송 정책은 복사·복원하지 않는다"
      relation_preservation: "SCR-003과 별도 SCR-039는 관리 카탈로그의 같은 전체 CatalogComposition을 편집한다. API-022의 전체 소유 관계/쌍을 확보해 보존한 API-023/024/025 저장·복사·고정만 허용하며 관계 화면을 열지 않았거나 요약 조회가 실패했다는 이유로 빈 목록/삭제를 만들지 않는다. 전체 후보 저장에서 관계 목록 누락은 거부하고 명시 제거와 조회용 요약/프루닝 결과를 구분한다. 다른 표면에서 저장했으면 이전 EDIT_VERSION 요청은 충돌이며 자동 병합/부분 저장하지 않는다"
      draft: "미완성 초안은 null/UNKNOWN과 구조화한 누락 사유로 보존한다. 없는 ID를 가짜 참조로 채우지 않으며 존재하지 않는 비null ID·다른 소유 구성·중복 ID·권한 밖 참조는 거부한다. 모든 자식 수정은 소유 카탈로그/리비전 잠금과 EDIT_VERSION을 검사한다. 관계별·컬럼별 독립 승인이나 부분 반영 API는 없다"
      member_identity: "신규 구성은 종류별 clientKey(UUID)를 받아 전체 입력의 임시 참조를 먼저 해석한다. 서버가 ENT-020을 배정하고 소유/종류를 고정하며 결과에 clientKey→memberId를 반환한다. 자기조인은 같은 저장의 신규 컬럼을 참조할 수 있다. 다른 후보의 아직 배정되지 않은 clientKey를 추정하지 않고 먼저 그 후보 저장 결과를 받는다. 삭제·재추가 시 명시한 기존 ID의 동일성을 검증하며 소유/종류 이전은 거부한다"
      keys: "REQ-301.key_workspace의 화면 매핑을 따른다. PRIMARY는 컬럼 정의의 전체 PK/순서, UNIQUE는 인덱스 탭의 UNIQUE_KEY 정의로 편집한다. ENT-021·022는 원천/검수된 유일 식별키의 전체 구성이다. 일부 컬럼이 미등록·미확인이면 키를 VERIFIED로 확정하지 않는다. PK 참여 컬럼 하나를 단일 유일키로 취급하지 않는다. 복합 키 순서·중복·전체 범위를 검증하며 원천 DB에 키/인덱스를 생성하지 않는다"
      code: "VALUE_MODE=CODE는 같은 데이터소스의 codeQueryId/codeQueryRevisionId와 ENT-024 codeBindings[]의 parameterName/valueType/valueText 또는 명시 null을 가진다. 정확 버전의 선언·필수/NULL/형식과 현재 검수/활성·권한을 검사한다. CODE 외 참조/바인딩 잔존, INLINE 외 직접 값 잔존을 거부한다. 기존 codeCatalogId/codeRevisionId/코드 값·명칭 컬럼/AND 조건 입력은 받지 않는다. 조회 결과는 CatalogComposition 입력/고정에 포함하지 않는다"
      inline: "VALUE_MODE=INLINE은 ENT-023의 명시 열거만 사용한다. 타입과 정형 값의 중복을 거부하며 개인정보 샘플을 자동 복사하지 않는다. NONE/UNKNOWN은 코드/열거 자식을 가지지 않는다. 빈 열거는 VERIFIED가 아니며 미완성 사유를 남긴다"
      constraints: "조회 제약 정의/파라미터/검수 상태/대체 키는 CatalogComposition에 포함하지 않는다. REQ-611.query_constraints의 현재 정책 원천을 사용하며 SCR-009 소유 공개 조회·변경 계약은 access_policy에서 설계한다"
      reviews: "입력은 검수 의도와 근거를 전달하며 검수자/시각은 서버가 현재 작성/검수 권한에서 결정한다. UNKNOWN/INVALID를 유지할 수 있으나 VERIFIED 요청은 실제 필수 필드/전체 참조/타입·의미/근거 검사를 통과해야 한다. 단순 DTO의 VERIFIED 값 복사를 금지한다. 구조·의미·코드·키·관계 정의가 달라지면 해당 검수와 의존 검수를 무효화하고 명시적으로 재검수한다. 세트 기술 검토·최종 승인 절차와는 구분한다"
      owned_components: "@defer P3 access_policy·knowledge — 접근 그룹 후보 저장/고정 참조와 당시 직접 정책 참조의 구체 형식은 FEAT-007 및 소유 정책 계약에서 완성한다. 이 계약을 비운 채 전체 스냅샷 고정/운영 반영을 구현 완료로 표시하지 않는다. 그룹 조회 실패를 빈 그룹 또는 상속 해제로 바꾸지 않는다"
    edit_transaction:
      scope: "카탈로그 초안 저장/복사와 변경 근거 접수의 성공 결과만 ENT-028에 저장한다. 운영 반영은 FEAT-014·040 소유이며 ENT-019 직접 관리 결과를 카탈로그 승인 원장으로 확대하지 않는다"
      input: "commandKey는 소문자 UUID다. 지문은 인증 주체·작업·요청 대상/기대 버전·전체 정규화 구성·기준/복원 판·clientKey와 참조·검수 의도/근거·사유를 포함한다. 서버 채번 ID/시각·traceId를 제외한다. 같은 키/다른 입력은 409이며 다른 주체에는 결과를 반환하지 않는다"
      save: "현재 권한과 기존 성공 결과를 확인하고 READ COMMITTED에서 필요한 부모를 공통 순서로 잠근다. 잠금 대기 후 같은 명령 결과를 재조회해 재생을 먼저 판정한다. DRAFT/EDIT_VERSION/소유·참조 검사를 통과하면 필요한 ID/전체 결과 매핑을 계산해 완전한 ENT-028 행을 INSERT한 후 전체 초안과 자식·신규 구성 ID·필요 변경 근거를 함께 저장한다. 하나라도 실패하면 전부 롤백한다. 고정 판에는 쓰지 않으며 새 판 복사로 연결한다"
      versions: "초안 전체 저장마다 EDIT_VERSION을 한 번 올린다. 이전 화면의 수정 충돌은 409이며 자동 병합/재시도하지 않는다. 새 판 복사는 현재 기준 유효본과 복사할 과거 판을 구분한다. 서로 참조하는 초안의 행에 상대 EDIT_VERSION을 재귀 저장하지 않고 세트 고정 요청이 전체 후보 ID→기대 EDIT_VERSION 집합을 한 번 제출한다"
      copy: "새 판 복사에서는 소유 전체 자식의 REVISION_ID와 같은 소유 객체/복사 원본 판을 가리키는 자기조인 참조를 새 판으로 함께 연결한다. 안정 구성 ID·종류·소유와 전체 컬럼쌍/키 구성은 유지한다. 이 내부 참조 재배치는 새 후보 작성의 일부이며 고정된 원본은 수정하지 않는다. 코드 조회 정의/외부 카탈로그 참조는 원래 정확 버전을 보존하며 최신판/다른 세트 후보로 바꾸지 않는다. 당시 검수 완료를 자동 승계하지 않고 새 후보의 변경/참조/현재 정책에 맞게 재검수한다"
      result: "결과는 원래 catalogId/revisionId/editVersion/evidenceId·clientKey 매핑·반영 시각이다. 같은 명령 재수신은 새 판/구성/근거를 만들지 않는다. 유일 키 경합 실패 트랜잭션은 종료한 뒤 새 읽기로 결과를 확인한다. getCommandResult 미발견 또는 다른 주체 키는 UNKNOWN이며 미실행 확정이 아니다. 클라이언트는 같은 키를 사용하고 새 키로 중복 생성하지 않는다"
      impact: "업무 의미/값 도메인 변경은 구조 이상 유무와 무관하게 ENT-010·027 근거와 변경 판을 같은 저장에 남긴다. FEAT-036의 검토 연결 전달/재수신·실패 복구는 knowledge에서 완성하며 근거가 있다는 이유로 검토 완료로 표시하지 않는다"
      retention: "@defer P3 audit_trace — ENT-028 결과 보존과 늦은 재수신 차단을 함께 정하며 그 전 파기를 활성화하지 않는다"
    set_public_contract:
      implementation: planned
      owner: FEAT-014
      freeze: "전체 후보 집합의 대상 종류/안정 ID·기준 유효본·revisionId·기대 EDIT_VERSION을 먼저 고정한다. 같은 대상 두 후보를 거부하고 모든 후보/필수 내용 참조를 잠근 뒤 기록된 판을 대조한다. 전체 그룹 후보 등 소유 구성과 지문이 완전해야 FROZEN으로 전이한다. 세트 내 다른 후보를 가리키는 참조는 기록한 revisionId와 정확히 같아야 한다. 외부 운영본을 세트 후보로 자동 재결합하지 않는다"
      references: "초안 조회/선택 결과는 검증 근거이지 예약 권한이 아니다. 후보에는 정확한 객체/판/구성 참조를 저장하고 FEAT-014.reference_validation의 SELF/CANDIDATE/EXTERNAL_CONTENT/IMPACT_EVIDENCE/CURRENT_POLICY 구분을 세트의 고정 참조 목록에 보존한다. 자기조인은 양쪽 모두 소유 판이다. 상호 참조는 전체 집합으로 검증하며 먼저 온 후보만 선택하지 않는다"
      locks: "admin 자산 쓰기 경로는 종류 문자열 오름차순(CATALOG, DATA_SOURCE, …)과 양의 숫자 ID 순서로 부모를 잠그고, 같은 종류 안에서는 숫자순으로 처리한다. 카탈로그 자식은 그 부모 뒤 revisionId 순서로 잠근다. 변경 대상뿐 아니라 내용 참조의 현재 포인터 교체와 경쟁하는 외부 부모도 짧게 잠근다. 필요한 잠금 집합이 늘어나면 트랜잭션을 종료하고 전체 정렬 집합으로 재검증한다. 데이터소스 삭제/그룹 축소 및 카탈로그의 참조 추가·반영도 이 순서에 참여한다. 참조만 하는 자산에 업무상 미종결 요청 점유를 만들지는 않는다"
      apply: "승인/전결의 실제 반영 트랜잭션은 모든 변경 대상 기준본·고정 후보·외부 내용 참조 최신성·현재 권한/그룹·연결 지원·정확 객체 동일성/중복을 다시 검증한다. 검증과 같은 잠금 아래 전체 포인터·효력·물리 이름·세트 결과/이력을 함께 전환한다. 하나의 변경도 부분 적용하지 않는다. 실패/결과 불명 복구와 명령 원장은 세트 소유에서 구현한다"
      boundary: "@defer P3 knowledge·access_policy — 고정 참조/그룹 후보·세트 원장·주체/권한 회수 동시성의 실제 저장과 복구 계약을 연결한다. 외부 원천 DDL이나 설정 배포를 admin DB 잠금으로 동결했다고 주장하지 않으며 실제 소비 시 동일 연결/현재 상태를 재검증한다"
    source_public_contract:
      type_candidates: "REQ-301.source_type_catalog의 콤보는 API-600에 grpCd=DBMS_DATA_TYPE, refCd=PARENT, refVal=소속 데이터소스 DBMS 코드를 전달해 활성 상세 코드 목록을 받는다. 공통 useCodeOptionsByRef/CodeSelect를 재사용하고 표시명은 기존 코드 메시지로 읽는다. 버전은 조건에 넣지 않는다. NATIVE_TYPE은 저장/검수 서버의 내부 코드 참조 조회에서 해석하며 단순 코드 배열 응답에 포함됐다고 가정하지 않는다. sourceTypeCode 선택과 SOURCE_TYPE 원천 근거를 대조한다. 기존 API-554는 그룹 전체 조회로 유지한다. CODE 캐시 무효화·조회 실패와 빈 결과의 구분은 FEAT-504.reference_combo_contract를 따른다. 실제 구현/시드는 소유 G3 뒤 진행한다"
      implementation: planned
      owner: integration
      input: "현재 주체·Hub 데이터소스·선정한 정확 공개 객체 또는 등록 catalogId/revisionId와 연결 관측 근거. 전체 DB 열거/자동 등록 입력은 없다"
      output: "nodeId/bootId/appliedSettingsId/observedAt·identityProfile·정확 물리 식별·TABLE/VIEW·관측 DBMS/버전과 컬럼 원천 자료형/치수/키 전체/NULL 사실과 COMPLETE/PARTIAL/FAILED. 부분 수집에는 누락/실패 범위를 명시한다. 원천 코멘트는 제안이며 검수 완료 값이 아니다. 연결 주소/계정/비밀은 제외한다"
      manual_boundary: "원천 조회는 선택 보조다. ACCESS_DENIED/UNAVAILABLE/NOT_REQUESTED를 보존하고 직접 입력·근거 검수로 신규 후보를 반영할 수 있다. 성공 관측 필드를 조작하거나 기존 객체의 이름 변경/복원 동일성 검증을 우회하지 않는다. 실제 실행 시 원천 읽기 권한은 별도로 검사한다"
      sampling: "현재 화면/구현 범위 제외, 재요청 시에만 재검토한다. 샘플링은 runSample의 별도 수동 실행이다. 선택한 등록 컬럼의 현재 개인정보 제외·읽기/실행 권한·현재 정책·필수 조회 제약·조회량/시간 상한을 서버에서 검사한다. 상한/공개 검증 계약이 미완성인 배포에서는 기능을 활성화하지 않는다. 값은 ENT-010 구조 근거·후보/이력에 복제하지 않고 REQ-304.note의 시스템 조회 이력으로 연결한다"
      pending: "@defer P3 integration·agent — DBMS별 정확 이름/동일성 해석 규칙과 최대 이름 길이 대응·사실 조회/일괄 비교의 시간 상한·현재 연결 재검증·실행/불일치 이력 계약을 완성한다. 지원 밖 입력을 정상처럼 저장/실행하지 않는다"
    types:
      CatalogFilter: "SearchRequest.params의 dataSourceId/lifecycle/businessName/objectType(TABLE/VIEW) 선택 조건. sorts는 catalogId/businessName/appliedAt, 동률 catalogId. 객체 유형은 정확 물리 식별 중복을 회피하는 키가 아니다. 공통 offset 페이지 제한을 사용한다"
      CatalogRow: "catalogId/dataSourceId/정확 물리 식별/objectType(TABLE 또는 VIEW)/lifecycle/currentRevisionId/stateVersion/업무명/반영시각. 상단 목록은 객체 유형을 테이블/뷰로 표시하며 검수/관측/현재 권한 결과는 별도다"
      CatalogKey: "catalogId:필수 양의 십진 문자열. 기록 보존 권한이 있으면 RETIRED 항목도 조회한다"
      CatalogDetail: "CatalogRow와 현재 선택 내용 요약·현재 연결/정책 관측·권한 있는 사용처. 조회 실패를 값 삭제로 바꾸지 않는다"
      RevisionKey: "catalogId/revisionId:필수. 둘의 소유를 함께 검사하고 다른 소유 판이면 404다"
      RevisionRow: "catalogId/revisionId/revisionNo/baseRevisionId/contentState/editVersion/작성·고정 시각·사유. 승인/반영 상태는 소유 세트 결과와 별도로 표시한다"
      CatalogComposition: "ENT-006의 편집 가능한 정의와 ENT-007/008/021~025의 전체 자식 목록, 접근 그룹 후보의 소유 계약 참조. memberId 또는 신규 clientKey를 사용한다. 모든 필드/목록을 명시하며 빈 목록과 누락은 다르다. 당시 정책 참조는 소유 계약의 서버 결과이며 사용자가 현재 정책을 덮지 못한다"
      RevisionDetail: "RevisionRow·당시 전체 CatalogComposition·과거 근거/고정 참조와 누락/검수 사유. 현재 컬럼/그룹으로 과거를 재구성하지 않는다"
      DraftCreate: "commandKey/dataSourceId/registrationMode(MANUAL 또는 OBSERVED)/reason와 최초 CatalogComposition. MANUAL은 완전한 declaredIdentity와 definitionEvidence를 전달하며 identityObservation은 선택적이다. OBSERVED는 서버 검증 가능한 resolvedIdentity/identityObservation을 전달한다. 서버가 두 경로 모두 같은 identityProfile/OBJECT_KEY로 검증·중복 검사한다. 수동 근거는 ENT-010과 REVIEW_EVIDENCE에 연결하며 허위 관측을 만들지 않는다. 객체 식별은 완전해야 하지만 업무 의미는 미완성 초안 가능하다"
      DraftSave: "commandKey/catalogId/revisionId/expectedEditVersion/reason/전체 CatalogComposition. 동일 객체 이름 변경 근거와 검수 의도 포함, 서버 검수자/시각은 입력받지 않는다"
      DraftCopy: "commandKey/catalogId/sourceRevisionId/expectedCurrentRevisionId/reason. 복원은 옛 내용을 새 판으로 복사하되 현재 기준본은 별도로 기록한다. 과거 직접 정책·기존 검수 완료를 새 내용/현재 권한의 근거로 자동 복사하지 않는다"
      DraftResult: "commandKey/catalogId/revisionId/editVersion/evidenceId/clientKeyMappings/appliedAt의 원 성공 사실만 반환한다. 이 값 전체는 ENT-028에 보존돼 재수신 결과가 달라지지 않는다. 현재 누락/검수 필요 목록은 별도 getValidation으로 읽고 원 성공 결과나 운영 활성화 상태로 섞지 않는다"
      CatalogReferenceRow: "참조 경로/종류·대상 안정 ID·선택 내용 판·역할·관리 카탈로그·권한 있는 영향 요약. 숨겨진 사용처는 상세를 노출하지 않지만 삭제/반영 검사에서 제외하지 않는다"
      SourceObjectQuery: "dataSourceId·선정한 정확 객체 식별. 서버/DB/스키마 해당 여부는 원천 해석에서 확인한다. 와일드카드 전체 수집 입력을 받지 않는다"
      SourceObjectResult: "해석 상태 RESOLVED/AMBIGUOUS/UNSUPPORTED/ACCESS_DENIED/UNAVAILABLE/NOT_FOUND 및 성공 시 정확 식별/동일성 규칙 버전/관측. 미조회는 NOT_REQUESTED로 구분한다. 제한된 목록의 빈 결과를 NOT_FOUND로 단정하지 않으며 부재 확인 근거가 있을 때만 반환한다. 실패는 기본 스키마나 관측 성공으로 자동 확정하지 않고 수동 등록을 안내한다"
      StructureQuery: "RevisionKey·기대 내용 판/연결 관측 기준. 현재 등록 공개 범위의 구조 사실만 조회한다"
      StructureResult: "현재 사실/후보와의 차이·완전성/실패 범위·원천 관측 근거. 자동 후보 갱신이 없으며 저장할 때 서버가 검수 근거를 대조한다"
      SampleRequest: "RevisionKey·선택한 등록 columnIds·검증 가능한 조회 조건/상한. 원천 SQL 임의 입력이나 미등록 컬럼/개인정보 열 선택을 허용하지 않는다"
      SampleResult: "허용 샘플과 실제 조회 이력 참조·적용 제한·결과/실패 상태. 결과 원문을 카탈로그 저장 DTO에 포함하지 않는다"
      EvidenceFilter: "catalogId/sourceKind/receivedFrom/receivedTo 선택, 시각 범위는 시작 포함·끝 제외. 정렬 receivedAt/evidenceId 내림차순, 공통 offset 페이지"
      EvidenceKey: "evidenceId:필수. 관련 대상/원 근거의 현재 열람 권한을 함께 검사한다"
      EvidenceRow: "evidenceId/sourceKind/observationStatus/receivedAt/observedAt·권한 있는 대상 요약"
      EvidenceDetail: "EvidenceRow·버전 있는 구조 차이/업무 변경 근거·targets:EvidenceTargetView[]·소유 검토/조사 연결. 미확인과 영향 없음은 다르다. 근거 대상은 관측/전후/후보 연결이며 실제 영향 확정이나 조치 완료 목록이 아니다"
      EvidenceTargetView: "ENT-027의 evidenceId/targetNo/catalogId/revisionId/referenceRole에 targetDataSourceName/targetObjectName/targetBusinessName/targetRevisionNo/targetContentState를 조회 조합한다. 원천은 ENT-005의 소속 ENT-002 현재 ALIAS_NM, 정확한 catalogId+revisionId의 ENT-006 객체 한정자·업무명·REVISION_NO·CONTENT_STATE다. 고정본은 보존값, DRAFT는 조회 시점 저장본임을 표시한다. revisionId=null이면 버전 미지정·이름 미확인을 반환하고 현재 버전으로 보충하지 않는다. 이름 null/조회 실패와 권한 제한을 구분하며 기존 관련 대상/원 근거 권한 검사 전에 이름·ID를 노출하지 않는다. targetEvidenceBody는 EvidenceDetail의 허용 근거 본문을 화면에서 공통 표시하며 대상별 변경 요약을 추정 생성하지 않는다. 응답의 표시값은 저장 필드가 아니며 EvidenceSave로 역입력하지 않는다"
      EvidenceSave: "commandKey/sourceKind/sourceRef/observationStatus/evidenceFormat=1/evidenceBody/targets/고객사 예정·실제 적용 시각. 수동 통지/업무 근거만 입력하며 구조 관측 결과·주체·접수시각은 서버 근거로 검증한다. 보완은 새 evidenceId로 연결한다. SCR-003 수동 입력은 NOTICE/MEANING, sourceRef 최대 200자, 공백뿐인 업무 본문 거부, 입력 시각은 UTC 오프셋 포함으로 검증한다. 이 화면은 선택 catalogId의 대상 1건 이상과 선택/null revisionId·OBSERVED/BEFORE/AFTER/CANDIDATE 역할을 전달하며 같은 catalogId/revisionId/역할 중복을 거부한다. UNCONFIRMED·접수 주체/시각은 서버가 확정하고 STRUCTURE 관측 결과를 사용자가 위조하지 못한다"
      CatalogCommandKey: "commandKey와 현재 READ·SAVE 권한. 다른 주체 키와 미발견을 같은 UNKNOWN으로 반환한다"
      CatalogCommandResult: "APPLIED면 원 DraftResult 또는 근거 접수 결과, UNKNOWN이면 진행/롤백/미접수를 확정하지 않는다. traceId는 이번 요청 값이다"
      ValidationRequest: "RevisionKey·expectedEditVersion·같은 세트 후보 ID→기대 편집 버전 목록. 소유 공개 조회로 전체 현재 구성을 검증하며 제출/예약/고정을 하지 않는다"
      ValidationResult: "관측한 후보 판/편집 버전·정확 참조 목록·오류/미완성/검수 필요 목록. 제출/반영 시 다시 검증하므로 이 결과를 영구 허가로 쓰지 않는다"
      ReferenceCandidateFilter: "소유 RevisionKey·후보 종류 COLUMN/CODE_QUERY/JOIN_OBJECT/KEY·조회 범위. 현재 허용된 등록 객체/판만 반환하며 같은 세트 후보와 현재 운영본을 구분한다. 선택 표시는 데이터소스 표시명/DB/스키마/물리명/업무명이며 반환값은 정확 catalogId/revisionId/columnId 또는 같은 편집본 clientKey다. 상대 테이블 선택 뒤 그 판의 컬럼만 조회하고 동명 객체·권한 밖 컬럼·이전 테이블의 잔존 선택을 서버에서 거부한다"
    exception_map:
      UC-007.E1: "400 식별 불명/403 현재 권한 부족/503 필수 원천·참조 조회 불가"
      UC-007.E2: "초안 저장은 누락/사용 불가를 명시하며 운영 사용/제출 요건을 충족한 것으로 표시하지 않는다"
      UC-007.E3: "409 기준/참조 충돌이며 세트 검증 실패로 인계한다"
      UC-014.E1: "미확인 근거를 보존하며 영향 없음으로 종결하지 않는다"
      UC-014.E2: "실제 오류/조사 연결이며 자동 비활성화하지 않는다"
      UC-014.E3: "중대한 영향의 조치 판단은 REQ-304.open 소유 절차로 인계한다"
    errors: "400 err.admin.catalog.invalidInput·403 공통 인가·404 공통 미발견·409 err.admin.catalog.versionConflict/referenceConflict/identityConflict/commandConflict·503 err.admin.catalog.dependencyUnavailable. 변경 실패는 전체 롤백한다. 실제 MSG 키/시드·문구는 화면/구현 단계에서 연결한다"
    verification_cases:
      - "동명 객체의 DB/스키마/서버/데이터소스가 다르면 별개, 정확 물리 실체가 같으면 그룹이나 TABLE/VIEW 구분으로 중복 등록 불가"
      - "같은 객체의 profile v1 등록 뒤 v2가 관측되면 키가 달라져도 신규 등록을 거부하며 기존 전체 대조/이행 전 반영을 허용하지 않는다"
      - "동일 이름의 삭제/재생성을 이름 변경으로 자동 승인하지 않으며 동일 객체 이름 변경 뒤 과거 판은 옛 이름을 유지한다"
      - "다른 카탈로그의 컬럼 ID·같은 컬럼의 다른 판·관계 소유 이전·자기조인의 한쪽 옛 판은 거부한다"
      - "제출 뒤 자식만 수정하는 경로도 FROZEN/EDIT_VERSION 검사에서 실패해야 한다"
      - "자기조인 과거 판 복사는 양쪽 자기 참조를 새 자기 판으로 바꾸며 코드 조회 정의/외부 참조는 원래 정확 버전을 보존하고 현재 사용 가능성을 다시 검사해야 한다"
      - "복합 키 일부·여러 대체 키 컬럼의 합집합·한 요청에서 여러 키값·NULL 조건은 기간 대체가 아니다"
      - "세트 상호 참조는 모두 고정한 후보로 검증하며 외부 판/새 후보의 불일치를 자동 치환하지 않는다"
      - "검증 직후 외부 유효본 전환·데이터소스 삭제와 경합하면 잠금/재검증으로 안전하게 한 순서만 반영한다"
      - "단순 소유자/시각 표시가 아닌 실제 검수 근거가 필요하며 의미/코드 변경 후 이전 검수 완료가 그대로 남으면 실패다"
  FEAT-011:
    design_status: draft
    implementation: planned
    request_rule: "별도 화면 SCR-039의 관계 작성/저장·복사는 FEAT-003의 같은 카탈로그 리비전·전체 후보 API-022/023/024/025와 EDIT_VERSION·편집/세트 계약을 사용한다. 관리 카탈로그와 안정 관계 식별자는 ENT-020에 고정하며 독립 관계 리비전·부분 저장/승인 API를 만들지 않는다"
    response_rule: "양쪽 카탈로그의 관리용 getRelatedJoins(API-027)는 같은 소유 관계를 역할과 함께 보여준다. 편집은 별도 SCR-039에서 관리 카탈로그의 초안으로 연결하고 현재 권한을 검사한다. 이 관리용 역조회는 LLM/예제 작성의 범위 제한 공통 조회를 대신하지 않는다"
    relation_read_contract:
      design_status: "입력/필터/소비 경계 합의. 구체 DTO·모듈 공개 방식·엔드포인트는 후속 P3에서 확정"
      consumers: [FEAT-202, FEAT-023]
      input: "이번 호출에서 실제 조회/선택한 카탈로그의 정확 catalogId/revisionId 집합과 최종 허용 컬럼 범위, 현재 인증 주체·소비 목적을 받는다. 지식 합산 전체 후보나 카탈로그 하나의 모든 인접 관계를 요청 범위로 바꾸지 않는다. 관리 후보/같은 세트 참고는 FEAT-014.reference_validation의 명시 후보 판을 함께 식별한다"
      scope: "관계의 LEFT와 RIGHT 각각의 catalogId/revisionId가 모두 입력 집합에 정확히 속해야 한다. ID만 같고 판이 다르거나 동명 다른 객체이면 제외하며 현재/최신판으로 치환하지 않는다. 자기조인은 한 집합 원소로 양쪽 포함을 만족해도 LEFT/RIGHT 두 역할·방향을 유지한다. 범위 밖 중간 테이블을 경로 완성 목적으로 자동 추가하거나 입력 집합/권한을 확대하지 않는다"
      validation: "현재 양쪽 공개 객체·정확 판·전체 컬럼쌍의 존재/참조·객체/컬럼 접근 권한·검수와 사용 가능 상태를 대조한다. 프루닝한 최종 컬럼 범위에서 필수 쌍 컬럼 하나라도 빠지면 관계 전체를 제외하고 일부 쌍만 완전한 관계로 반환하지 않는다. LLM 실행 컨텍스트는 실제 반영·운영 사용 가능한 관계만 받는다. 예제 작성의 같은 세트 후보 참고는 검수 근거/후보 상태를 명시하며 운영 가능으로 표시하지 않는다"
      output: "동일 정본의 관계 안정 ID·관리 카탈로그/소유 리비전·양쪽 정확 catalogId/revisionId·두 역할/방향·전체 순서 컬럼쌍·대응 수/1측 유일성·물리/논리 근거·검수/사용 가능 상태를 반환한다. 관계는 안정 ID와 소유 판으로 중복 제거하되 역할이나 복합 쌍을 합치거나 삭제하지 않는다. 카탈로그 메타데이터 목록에 모든 관계 본문을 내장하지 않고 이 필터 결과만 별도 조립한다. 관리용 전체 CatalogComposition은 그대로 보존하며 모델에 복사하지 않는다"
