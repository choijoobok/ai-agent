# 업무 API·도구 관리/소비 경계 — 미구현 P3 설계
feature_contracts:
  FEAT-004:
    design_status: draft
    implementation: planned
    request_rule: "POST/body·ApiResponse·SearchRequest/PageResponse·AUTHZ-090/091을 따른다. 모든 BIGINT ID/판/버전은 양의 십진 문자열, 순번과 초는 범위를 검사하는 정수다. 신규 ID는 JPA TABLE/SYS_SEQUENCE를 사용한다. 주체/검수자·시각·해시·현재 포인터·반영 결과는 서버가 결정한다"
    response_rule: "현재 항목·선택한 전체 내용 판·후보 검수·공동 오픈 시점·현재 호출 조건을 구분한다. 저장/검수 성공으로 호출 가능을 확정하지 않는다. 현재 연결 검사는 주소/인증값을 제외한 관측이며 예약/실행 허가가 아니다"
    composition_contract:
      scope: "ENT-012 한 판과 ENT-013 필드·ENT-014 코드명·ENT-030 값·ENT-031 검증·ENT-032 내용 참조·ENT-033 대응·ENT-034 상태·ENT-037 입력 출처 및 FEAT-008의 전체 그룹/응답 정책 후보가 하나의 구성이다. 필드/정책/가이드만의 변경도 같은 전체 판과 세트로 반영한다"
      draft: "전체 구성 목록을 명시하며 누락과 빈 목록을 구분한다. 선택한 종류의 필수값 미확인은 null/UNKNOWN으로 초안 저장할 수 있으나 다른 종류의 잔존값·없는 비null ID·다른 소유 필드/판·중복 순번·권한 밖 참조는 저장부터 거부한다. 완성/검수 전에는 정상 운영 계약으로 고정/반영하지 않는다"
      identity: "신규 필드는 clientKey(UUID)로 임시 연결하고 서버가 ENT-029를 배정한다. 같은 저장 안의 값/코드명/대응/출처는 전체 clientKey 집합을 먼저 해석한다. 기존 FIELD_ID의 API 소유는 고정이다. 판 안의 referenceNo/bindingNo/checkNo/valueNo 등은 양의 순번이며 해당 판 안에서만 의미가 있다. 다른 후보의 신규 필드를 참조하려면 먼저 저장해 실제 ID를 받는다"
      review: "클라이언트는 검수 의도·근거를 제출한다. 서버는 현재 액션 권한·실제 내용과 검수 항목을 대조하여 REVIEWER_ID/REVIEWED_DTM을 기록한다. 구조·타입·의미·값·개인정보·출처/참조가 달라지면 관련 필드·코드명·전체 계약 검수를 무효화한다. 고객사 검수 자료와 Hub 관리 승인자를 합치지 않는다"
      connection: "TARGET_SYSTEM_ID를 먼저 확인하고 DEFAULT이면 CONNECTION_ID=null, EXPLICIT이면 그 시스템의 현재 허용 연결 ID를 요구한다. 시스템을 바꾼 후보는 이전 특정 연결을 자동 승계하지 않는다. DEFAULT의 실제 연결/배포 적용 근거는 현재 공개 계약으로 해석한다. 현재 targetSystem 부모 FK를 역사 판에 강제하지 않지만 활성/작업 중 참조의 추가·변경·삭제는 FEAT-001의 부모 잠금/삭제 검사에 참여한다"
      call: "OPERATION_TYPE은 메서드와 독립인 QUERY/EXECUTE이며 UNKNOWN은 운영 불가다. TIMEOUT_SECONDS=null은 ARCH-033 공통값, 지정은 그 허용 범위·점유/갱신·프록시 지원을 함께 검사한다. IDEMPOTENCY_CD=NOT_GUARANTEED와 RESULT_CHECK_MODE=NONE은 유효한 명시 계약이며 임의 등록 금지 사유가 아니다. GUARANTEED는 전체 효과/범위·기간·키 조건·제공자 근거가 완전해야 하며 최초 승인이나 자동 재시도 제한을 면제하지 않는다"
      result: "SUCCESS_MEANING=COMPLETE/ACCEPTED는 검수한 외부 성공 응답의 업무 의미다. MAPPED는 ENT-034의 정형 상태 대응을 사용한다. HTTP 오류/시간 초과를 업무 실패/미실행 확정으로 자동 바꾸지 않는다. RESULT_CHECK_MODE=API이면 RESULT_CHECK 참조 정확히 하나와 조회 입력/상태 대응을 완성한다. NONE이면 결과 확인용 참조/상태 대응만 금지하고 수동 확인 안내를 요구한다. 원 응답의 MAPPED 상태 대응은 별개이며 결과 확인 API 없이도 사용할 수 있다. 권장 초는 자동 폴링 일정이 아니다"
      opening: "정상 운영 반영에는 고객사 RELEASE_REF/EXTERNAL_VERSION/EXTERNAL_OWNER/OPEN_EVIDENCE/OPEN_AT의 검수 근거가 필요하다. OPEN_AT은 시간대 포함 시점으로 저장하고 날짜만 입력해 자정을 추정하지 않는다. 미래 시점 반영은 가능하지만 소비 시 현재 시각·현재 외부 적용 근거를 재검사한다. 내부 승인이나 시간이 됐다는 사실만으로 외부 배포 완료를 만들어내지 않는다"
      owned_policy: "@defer P3 access_policy — FEAT-008의 호출 허용 그룹·위험 등급·승인 강제·응답 처리 전체 후보/불변 판·반출 허용/상속 및 당시 직접 정책 참조 저장을 완성한다. 현재 공통 마스킹/전송 동의는 별도다. 이 구성이 비어 있거나 조회 실패이면 전체 스냅샷/고정/반영 완료가 아니다"
    field_contract:
      path: "PATH_TOKENS는 고정 형식 1의 JSON 문자열이며 원소는 {kind:PROPERTY,name:정확 문자열} 또는 {kind:ITEM}이다. 루트는 빈 목록, PROPERTY는 한 객체 속성, ITEM은 모든 배열 항목만 뜻한다. name 안의 점/별표/슬래시는 문자 그대로이며 필터·재귀·스크립트·임의 배열 인덱스·동적 키 탐색은 없다. 부모 OBJECT/ARRAY와 하위 토큰의 구조 일치를 검수한다. BODY 이외 위치는 정확한 단일 PROPERTY만 허용하고 HTTP HEADER의 이름만 ASCII 대소문자를 무시한다. BODY/QUERY/PATH 속성명은 임의 소문자화하지 않는다"
      uniqueness: "방향·위치·정규 토큰의 길이 구분 UTF-8 직렬화로 PATH_KEY를 서버 계산한다. 같은 지문은 전체 원문을 비교하며 충돌은 409다. 동일 정규 경로 중복·구조/값 타입 충돌을 거부한다. PATH_TOKENS 미설정 null은 미완성 초안이고 루트 빈 배열과 다르다"
      presence: "REQUIRED_CD는 경로 존재, NULLABLE_CD는 존재한 값의 null 허용이다. 0/false/빈 문자열/null/미존재를 합치지 않는다. 객체/배열 노드도 등록해 부모 부재·빈 배열·중첩 필수 필드의 의미를 판정한다. 각 배열 항목에 자식 규칙을 적용하며 최소 항목 수는 별도 MIN_ITEMS다. 미등록 응답 경로와 개인정보 미확인은 노출하지 않는다"
      values: "VALUE_MODE=INLINE은 ENT-030의 ENUM 집합을 사용하고 REFERENCE는 OWNER_FIELD_ID가 같은 FIELD_CODE 참조와 전체 대응을 갖는다. NONE/UNKNOWN에는 ENUM/코드 원천을 남기지 않는다. ENUM은 동일 타입/정형 값 중복을 거부하고 STRING의 앞자리 0·공백을 보존한다. NUMBER는 유한 십진 값으로 정규화하며 INTEGER 제약을 별도 확인한다. NULL은 필드 nullable 규칙과 일치해야 한다. FIXED/DEFAULT는 ENUM과 별도이며 요청 필드당 각 하나 이하, 응답에는 없다"
      checks: "ENT-031 조건은 AND다. MIN/MAX는 NUMBER/INTEGER, LENGTH는 STRING, ITEMS는 ARRAY에 적용하고 음수 길이/항목 수·역전 범위·잘못된 포함 경계를 거부한다. FORMAT은 허용된 검증기 식별자와 VALUE_FORMAT/TIME_ZONE_ID를 대조한다. 지원 밖 형식을 조용히 무시하지 않는다. 임의 정규식/코드 실행은 제공하지 않는다. @defer P3 agent·integration — 지원 검증기·수치/날짜 형식의 정확 허용 목록과 실행 검증을 연결한다"
      privacy: "요청/응답의 PRIVACY_CD·PRIVACY_TYPE·SUBJECT_ID_CD·MASK_RULE_REF·검수는 API 원천이다. 그룹 화면에 복제하지 않는다. UNKNOWN은 원본/전송 허용이 아니며 현재 마스킹/전송·반출 정책 검사는 소유 계약을 따른다"
      input: "ENT-037은 REQUEST만 허용한다. USER는 질문/부족 안내, LOOKUP은 같은 필드 소유 INPUT_LOOKUP 참조와 INPUT_VALUE 대응, FIXED/DEFAULT는 같은 역할의 VALUE_NO, SERVER는 SERVER 원천의 주입 대응, TRANSFORM은 검수된 변환 안내와 원 입력 근거를 요구한다. 종류 밖 참조/값/대응은 null이다. LOOKUP은 source.FIELD_ID = reference.OWNER_FIELD_ID = binding.OWNER_FIELD_ID = binding.TARGET_FIELD_ID 및 source.REFERENCE_NO = binding.REFERENCE_NO를 검사하고 reference.ROLE_CD=INPUT_LOOKUP, binding.PURPOSE_CD=INPUT_VALUE, TARGET_KIND=LOCAL_FIELD, SOURCE_KIND=API_FIELD/CATALOG_COL을 요구한다. SERVER는 binding.OWNER_FIELD_ID와 TARGET_FIELD_ID가 자기 FIELD_ID, TARGET_KIND=LOCAL_FIELD, SOURCE_KIND=SERVER, REFERENCE_NO=null이고 PURPOSE_CD=INPUT_VALUE/IDENTITY/REQUEST_KEY 중 신뢰 문맥 계약이 허용한 종류여야 한다. FIXED/DEFAULT는 같은 판/필드의 VALUE_ROLE까지 일치해야 한다. 이 교차 행 연결은 초안 저장부터 검사하고 미완성 null을 다른 필드/다른 조회의 비null 연결로 채우지 않는다. 선택 조건이 여러 개면 검수한 조건에 맞게 안내하되 정렬 순서로 자동 fallback하지 않고 부족/복수는 확인/실패로 처리한다. 모델의 해석 후에도 실제 값 검증과 서버 보호값 주입을 수행한다"
    reference_contract:
      identity: "ENT-032의 역할·대상 종류와 안정 ID/정확 내용 판을 보존한다. 선택 종류 밖 ID는 null, 선택 종류 안 ID·판은 모두 있거나 미완성으로 표시한다. 비null 구성 ID에 부모 판이 null이면 저장을 거부한다. OWNER_FIELD_ID가 필요한 INPUT_LOOKUP/FIELD_CODE/CODE_NAME은 해당 필드와 방향/의미를 검사한다. RESULT_CHECK는 API 전체 역할이며 API QUERY만 허용한다"
      binding: "ENT-033은 판 안의 REFERENCE_NO와 그 참조의 정확 API/카탈로그 판을 함께 갖는다. SOURCE_KIND/TARGET_KIND별 필드·컬럼·고정값·문맥 키 중 선택한 하나만 사용한다. 원/대상 종류가 API_FIELD/CATALOG_COL이면 정확 참조 판과 구성 ID가 필수다. LOCAL_FIELD는 소유 판의 필드다. REFERENCE_NO가 null이면 원/대상 외부 판·구성은 모두 null이다. LOOKUP_INPUT은 원 요청/응답·고정·신뢰 서버 값에서 조회 API의 REQUEST 또는 카탈로그 조건 컬럼으로 보내며 코드명 해석의 서버 보호 입력은 서버 원천만 가능하다"
      matching: "MATCH_KEY는 검수한 전체 조건의 AND 동등 대응이다. CODE_VALUE와 DISPLAY_NAME은 실제 조회 응답 또는 카탈로그의 정형 컬럼을 RESULT로 추출한다. INPUT_VALUE는 소유 REQUEST 필드를 채우며 LOOKUP은 조회 응답/컬럼, SERVER는 허용 서버 문맥을 원천으로 한다. 코드명 규칙은 소유 필드와 REFERENCE_NO가 일치하는 대응만 사용하고 코드/명칭 추출은 각 하나, 필요한 그룹/회사/언어 전체 조건을 함께 검사한다. 원 코드와 전체 조건을 만족하는 결과가 정확히 하나여야 하며 배열 순서나 첫 결과를 근거로 선택하지 않는다"
      response_name: "ENT-014.METHOD_CD=RESPONSE는 소유 API RESPONSE의 NAME_FIELD_ID를 요구한다. SAME_ITEM은 코드/명칭의 동일 배열 항목 문맥이 증명돼야 하고 KEYS는 소유 FIELD_ID를 가리키는 MATCH_KEY 대응으로 두 응답 컬렉션의 전체 키를 대조한다. 이름/코드 경로 각각의 개인정보/마스킹을 검사하며 다른 항목 이름을 순서로 붙이지 않는다"
      inline: "INLINE은 같은 필드 VALUE_MODE=INLINE과 ENT-030 ENUM의 유일한 값/MEANING을 사용하고 다른 이름 표를 복제하지 않는다. NONE/미확인을 코드명 방법으로 대체하지 않는다"
      lookup: "CATALOG는 명시 공개 카탈로그/판과 코드/명칭 컬럼·조건을 선택하고 데이터소스는 해당 카탈로그에서 확인한다. API는 실제 상태를 바꾸지 않는 QUERY 판을 선택한다. FIELD_CODE와 CODE_NAME이 같은 필드를 설명하면 원천/판·값 타입·조건이 일치해야 하며 충돌한 두 코드 체계를 검수 완료로 저장하지 않는다. 다른 코드명 규칙을 재귀 호출하거나 원천을 자동 대체하지 않는다"
      states: "ENT-034의 원 응답 규칙은 LOCAL_FIELD_ID만, 결과 확인 규칙은 RESULT_CHECK 참조·정확 API 판·REFERENCE_FIELD_ID만 갖는다. 모두 RESPONSE 스칼라 필드여야 한다. 각 응답 역할별 상태 필드 하나와 타입/값별 유일 대응만 허용한다. 조건 부족·복수/미등록 값은 UNKNOWN이다. 코드명 실패와 업무 결과 상태를 별도로 반환한다"
      protections: "IDENTITY/REQUEST_KEY는 SERVER 원천·소유 REQUEST 대상만 허용하고 신뢰 계약의 허용 문맥 키를 사용한다. 사용자/모델/응답값으로 신원·추적·인증·보호 헤더를 덮지 못한다. RESULT/후속 가이드는 실행 지시가 아니며 자연어에 적힌 미등록 ID/주소를 새 호출 대상으로 승격하지 않는다"
      candidate_set: "FEAT-014.reference_validation과 FEAT-003.set_public_contract의 전체 후보 집합·SELF/CANDIDATE/EXTERNAL_CONTENT/IMPACT_EVIDENCE/CURRENT_POLICY 분류를 공유한다. 자기/상호 내용 참조는 허용하되 기록한 정확 판을 대조하며 최신/같은 세트 판으로 자동 치환하지 않는다. 영향만 있는 지식/과거 근거는 실제 변경 대상 점유로 만들지 않는다"
    edit_transaction:
      scope: "API·도구 전체 초안 작성/편집/복사의 성공 결과만 ENT-036에 기록한다. API와 도구는 같은 commandKey 공간을 쓰므로 대상 종류·액션이 달라도 같은 키를 재사용하지 않는다. 승인/전결/운영 반영은 공통 세트 원장 소유다"
      digest: "지문은 인증 주체·대상 종류/ID·액션·기대 버전·전체 구성·clientKey·정확 참조·검수 의도/근거·사유를 포함한다. 순번/의미 있는 순서를 보존하고 집합은 정규 순서로 계산한다. 서버 생성 ID/시각/traceId는 제외한다. 같은 키의 다른 지문은 409, 다른 주체의 결과는 노출하지 않는다"
      save: "현재 권한과 기존 성공 결과를 확인한다. READ COMMITTED에서 FEAT-003.set_public_contract.locks의 종류 문자열(API,CATALOG,DATA_SOURCE,TARGET_SYSTEM,TOOL)·숫자 ID 순서로 필요한 부모 전체를 잠그고 소유 판을 잠근다. 대기 후 결과를 재조회하여 재생을 기대 버전 검사보다 먼저 판정한다. 전체 ID/결과를 계산하고 완전한 ENT-036 성공 행 INSERT 뒤 초안·자식·필드 ID·대응 점유를 같은 트랜잭션에 저장한다. 충돌/실패는 전체 롤백이며 DB unique 실패 뒤에는 트랜잭션을 종료한 새 읽기로 결과를 확인한다"
      concurrency: "자식 한 개 변경도 전체 EDIT_VERSION을 한 번 증가시킨다. DRAFT만 수정하며 다른 탭 충돌은 409로 반환하고 자동 덮어쓰기/병합하지 않는다. 새 잠금 대상이 발견되면 전체 트랜잭션을 종료하고 전체 순서로 재획득한다. 참조만 하는 자산도 현재 포인터와 경쟁하는 짧은 잠금에는 참여하지만 미종결 요청 점유를 자동 생성하지 않는다"
      copy: "새 판은 소유 전체 자식과 안정 FIELD_ID를 복사하고 소유 원본 판을 가리키는 자기 API/자기 도구 참조만 새 판으로 재배치한다. 외부 참조는 선택한 원래 판을 보존한다. 기존 검수 완료와 현재 직접 정책을 자동 승계하지 않는다. BASE_REVISION_ID는 복사 원본과 별개인 현재 유효본이며 입력 기대 본과 다르면 409다. 고정 판의 자식은 취소/반려 후에도 수정하지 않는다"
      recovery: "재수신은 원 성공한 targetKind/targetId/revisionId/editVersion/clientKey 매핑/appliedAt만 반환한다. getCommandResult 미발견/다른 주체는 UNKNOWN이며 미실행 확정이 아니다. 원 키로 재확인/재수신하고 새 키로 중복 생성하지 않는다. 현재 검수/호출 가능성은 별도 조회한다. @defer P3 audit_trace — 보존/늦은 재수신 차단 확정 전 ENT-036 파기를 활성화하지 않는다"
    module_contract:
      freeze_apply: "API·도구 전체 후보의 기대 편집 버전 집합을 받아 참조/검수/그룹 정책/점유/기준본을 검증한 뒤 고정한다. 외부 참조 판·현재 직접 정책/권한/연결·공동 오픈 근거와 현재 API 대응을 실제 반영 직전에 재검증하고 모든 현재 포인터·효력·점유·세트 결과를 원자 전환한다. 실패/불명 복구는 FEAT-014·040이 소유한다. 그룹/세트 저장 계약이 미완성인 동안 이를 구현 완료로 표시하지 않는다"
      connection_owner: "integration은 targetSystem/DEFAULT 또는 EXPLICIT 선택·정확 API 판·현재 주체에서 연결 관측(nodeId/bootId/appliedSettingsId/connectionId/observedAt)과 지원/검수 상태를 제공한다. 서버가 검증한 메서드/상대 경로와 실제 전송 목적지를 일치시킨다. 절대 URL·다른 authority·스킴/사용자정보·경로/인코딩 우회·금지 헤더로 호스트/인증을 바꿀 수 없다. 임의 HTTP 실행 버튼을 이 관리 계약에 추가하지 않는다"
      consumer: "agent에는 선택한 정확 내용 판과 현재 효력/정책·검수/오픈·연결 관측을 구분해 제공한다. 소비 시 API와 대응 도구의 현재 유효 조건·지식 연결·현재 그룹·신원/마스킹/전송 정책·실제 인자·필수 실행 승인을 검사한다. 원 실행 상태와 응답/코드명 처리 상태를 분리하고 코드명 실패로 원 호출을 재전송하지 않는다. 조회 호출은 가려진 원값을 복원하지 않고 현재 행 스코프/허용량을 적용한다"
      pending: "@defer P3 integration·agent·access_policy·knowledge — 정확 URL 결합/보호 헤더·현재 배포와 무효화 경합·필드 실행 검증·조회 상한·그룹/반출 및 세트 원장/복구 계약을 연결한다. 코드명 외부 조회 상한/실행 통제가 없으면 해당 기능을 비활성으로 둔다. 첫 구현에서는 캐시/일괄 조회를 도입하지 않으며 도입하려면 현재 권한·회사/그룹·원천 판별 유효성과 상한을 먼저 설계한다"
    verification_cases:
      - "요청 F1의 LOOKUP 출처가 F2를 채우는 바인딩 또는 다른 조회 R2의 바인딩을 선택하면 FK 존재 여부와 무관하게 저장을 거부한다. 같은 필드/조회·목적의 완전한 대응만 허용한다"
      - "SERVER 출처가 다른 요청 필드 대상·외부 참조·LOCAL_FIELD 원천을 사용하면 거부한다. FIXED가 DEFAULT 값 행을 선택해도 거부한다"
      - "RESULT_CHECK_MODE=NONE·SUCCESS_MEANING=MAPPED의 원 응답 상태 대응은 허용한다. NONE 상태에서 결과 확인용 참조/상태 대응이 남으면 거부한다"
      - "배열 순서를 바꾸어도 전체 키의 코드/명칭만 연결한다. 동일 코드가 다른 회사에 존재하면 전체 조건으로 구분하고 부족/복수 결과는 확인 불가다"
      - "같은 commandKey의 응답을 잃은 뒤 편집 버전이 올라갔더라도 원 성공 결과를 재생한다. 같은 키의 다른 구성은 409이며 새로운 판을 만들지 않는다"
      - "자기 조회 참조를 가진 API를 복사하면 자기 참조만 새 판으로 바꾼다. 다른 API/카탈로그 참조는 원 판을 유지하여 제출 최신성 검사를 받는다"
    types:
      BusinessApiFilter: "SearchRequest.params의 businessName/targetSystemId/operationType/lifecycle 선택. conditions는 같은 허용 필드, sorts는 apiId/businessName/appliedAt와 동률 apiId. PageSpec 공통 offset 페이지 제한"
      BusinessApiKey: "apiId:필수 양의 십진 문자열. 현재 권한 안에서 폐지 항목도 조회한다"
      BusinessApiRow: "apiId/currentRevisionId/stateVersion/lifecycle·업무명·제공 시스템·유형·실제 반영 시각. 관리 상태와 공동 오픈/호출 조건은 별도 필드"
      BusinessApiDetail: "BusinessApiRow·현재 계약 요약·현재 연결/오픈 관측·권한 있는 사용처/대응 도구. 숨김/미확인/조회 실패를 없음으로 바꾸지 않는다"
      BusinessApiRevisionKey: "apiId/revisionId:필수. 소유가 다르면 404"
      BusinessApiRevisionRow: "apiId/revisionId/revisionNo/baseRevisionId/contentState/editVersion·작성/고정 시각·변경 사유. 세트 처리 결과는 별도 참조"
      BusinessApiComposition: "ENT-012 편집 항목, ENT-013/014/030~034/037 전체 자식 목록과 FEAT-008 소유 전체 정책 후보. 필드별 fieldId 또는 신규 clientKey, 판 내 순번/참조·검수 의도/근거를 사용한다. 서버 값은 입력 금지. DB 물리명을 그대로 클라이언트 필드명으로 노출하지 않고 logical attribute와 일대일 대응한다"
      BusinessApiRevisionDetail: "BusinessApiRevisionRow·당시 전체 BusinessApiComposition·고정 참조와 검수 근거. 현재 정책은 별도 관측이며 과거 판을 현재 값으로 재구성하지 않는다"
      BusinessApiDraftCreate: "commandKey/reason/전체 BusinessApiComposition. 안정 API와 최초 판을 같은 트랜잭션으로 생성한다"
      BusinessApiDraftSave: "commandKey/apiId/revisionId/expectedEditVersion/reason/전체 BusinessApiComposition"
      BusinessApiDraftCopy: "commandKey/apiId/sourceRevisionId/expectedCurrentRevisionId/reason. 신규 현재 판 없음은 null을 명시한다"
      AssetDraftResult: "commandKey/targetKind/targetId/revisionId/editVersion/clientKeyMappings/appliedAt. ENT-036에 보존하는 원 성공 결과만 반환"
      AssetReferencesQuery: "targetKind(API/TOOL)/targetId/revisionId·referenceRole 선택과 공통 페이지. endpoint 소유 종류와 다르면 400"
      AssetReferenceRow: "참조 경로·역할·대상 종류/안정 ID·선택 판·현재 최신성·권한 있는 사용처/영향. 숨겨진 사용처는 상세를 가려도 보호 검사에서 제외하지 않는다"
      AssetValidationQuery: "targetKind/targetId/revisionId/expectedEditVersion·선택한 전체 candidateSet[{kind,id,revisionId,expectedEditVersion}]. 단독 검수와 전체 세트 검수를 표시한다"
      AssetValidationResult: "revisionId/editVersion/checkedAt·구조/검수/참조/정책/배포/점유별 VALID/INVALID/UNKNOWN·사유/필드 경로. 단독 조회는 제출/반영 승인이나 이후 상태 보장이 아니다"
      AssetReferenceQuery: "targetKind/targetId/revisionId/referenceRole/desiredKind·필요한 API 필드/카탈로그 컬럼 유형·검색/페이지. 현재 권한의 선택 후보만 반환한다"
      AssetReferenceCandidate: "kind/stableId/revisionId/operationType·필드/컬럼 요약·공개/검수/현재 정책 관측. 선택은 예약이나 호출 권한이 아니다"
      ApiConnectionQuery: "BusinessApiRevisionKey·기대 editVersion. 저장된 시스템/기본·특정 선택에서 현재 연결을 해석한다"
      ApiConnectionResult: "RESOLVED/UNAVAILABLE/UNSUPPORTED/UNKNOWN·허용된 connectionId/nodeId/bootId/appliedSettingsId/observedAt·지원/검수 사유. 주소·비밀·보호 헤더 원값 제외"
      ApiToolMappingQuery: "apiId:필수. 현재 대응과 예약 상태를 구분해 조회한다"
      ApiToolMappingResult: "currentToolId/currentToolRevisionId/lifecycle·claimOwnerToolId/claimStatus 및 NONE/RESERVED/CURRENT/RETIRED/UNKNOWN. 다른 권한의 도구 상세는 가리고 대응 조회 실패를 없음으로 반환하지 않는다"
      AssetCommandQuery: "commandKey:필수. 현재 READ+SAVE, 실제 인증 주체, endpoint 소유 종류를 검사한다"
      AssetDraftCommandResult: "FOUND이면 원 AssetDraftResult, 다른 주체/미발견이면 UNKNOWN. 다른 종류의 자기 명령을 잘못된 endpoint로 조회하면 400"
    exception_map:
      UC-018.E1: "400 필드/경로·구성 오류, 403 권한, 404 없는/다른 소유 참조, 409 기준/참조·대응/현재 조건 충돌"
      UC-018.E2: "409 호출 제한과 현재 실행/연결 지원 불일치. 숫자만 바꾸어 통과하지 않는다"
      UC-018.E3: "실행 소유 계약의 응답/코드명 실패. 관리 저장 API가 원 업무를 재전송하거나 미실행 확정하지 않는다"
      UC-018.E4: "공통 세트 처리의 반려/실패. 기존 현재 포인터 유지"
  FEAT-021:
    design_status: draft
    implementation: planned
    request_rule: "FEAT-004의 request_rule·edit_transaction을 공유하고 종류는 TOOL이다. 현재 메뉴/액션 권한을 서버에서 검사한다"
    composition_contract:
      scope: "ENT-016 전체 판·INTERNAL 전용 ENT-038 가이드 참조와 소유 접근 그룹/노출 후보가 전체 구성이다. API는 정확 ENT-012의 입출력·호출/결과 가이드를 참조하고 사본을 저장하지 않는다. SOURCE_KIND=UNKNOWN은 미완성 초안만 가능하다"
      api: "API 종류는 안정 API/정확 판·원천과 같은 QUERY/EXECUTE 유형을 요구하고 구현/배포 참조·내부 가이드/ENT-038은 null/빈 목록이다. API 계약 변경을 도구 판에 자동 반영하지 않는다. 같은 세트의 정확 API 후보를 선택하거나 외부 최신 유효본을 검증한다"
      internal: "INTERNAL은 agent 공개 목록의 implementationId/contractVersion/deploymentRef와 검수 근거를 사용한다. 입력으로 임의 클래스/빈/스크립트·환경 설정·자격증명을 받지 않는다. 실제 금지 구현·무효 검수·미배포 계약은 등록/노출을 거부한다. 가이드의 후속 참조는 ENT-038로 정형화하고 현재 권한/새 실행 승인 조건을 유지한다"
      review: "검수 의도/근거만 입력받고 실제 주체/시각을 기록한다. API/구현 계약·그룹·노출·가이드가 바뀌면 해당 검수를 갱신한다. 내부 구현의 코드/보안/고객사 시험 근거는 관리 승인과 별개다"
      owned_policy: "@defer P3 access_policy — 도구 전체 허용 그룹 후보 저장/고정 참조를 연결한다. EXPOSE_YN=Y도 현재 원천·지식 연결·양쪽 그룹/정책을 충족해야 노출한다"
    api_mapping_contract:
      scope: "REQ-612.api_tool_mapping·ADR-031에 따라 ENT-035는 API_ID당 TOOL_ID 하나를 보장한다. 같은 도구의 현재 A와 변경 후보 B는 둘 다 확보할 수 있다. API 등록으로 도구를 자동 생성/승인하지 않는다. 내부 구현→도구 대응 수에 새 제한을 두지 않는다"
      acquire: "API를 선택한 최초/변경 초안 저장부터 필요한 API/TOOL 부모 전체를 공통 순서로 잠그고 ENT-035를 확보한다. 기존 소유가 같은 toolId이면 공유, 다르면 409로 전체 저장을 롤백한다. 신규 두 탭의 다른 toolId는 API_ID 유일키로 최종 차단한다. DRAFT/FROZEN 후보의 다른 판·다른 세트도 제한을 우회하지 못한다"
      basis: "점유 근거는 현재 실제 대응, 아직 작업 중인 후보, 폐지된 마지막 대응이다. 단순 과거 판이나 종결된 후보는 점유 근거가 아니다. 작업 중/종결은 FEAT-014의 후보/세트 소유 공개 계약으로 조회하며 불변 내용 판의 승인 상태를 새로 복제하지 않는다"
      transition: "API A→B의 후보 저장/제출은 현재 A를 유지하며 B도 같은 도구가 확보한다. 실제 반영이 성공해야 현재 포인터를 B로 바꾼다. A에 다른 작업 중 후보/현재/폐지 마지막 대응이 없으면 같은 트랜잭션에서 A 점유를 해제한다. 단순 A 과거 판은 보존하지만 영구 점유하지 않는다. 다른 도구가 이미 B를 확보했으면 부분 전환/강제 탈취하지 않는다"
      retirement: "현재 A를 참조한 도구를 비활성/폐지해도 A의 마지막 대응은 유지한다. A 재등록/복원은 기존 toolId의 새 후보이며 새 도구 ID로 우회하지 않는다. API 참조 변경으로 A 대응을 정식 종료한 뒤 과거 판만 남은 경우와 구분한다"
      release: "초안 참조 변경/후보 종료/실제 반영 때 모든 근거를 잠금 아래 재조회하고 하나도 없어야 해제한다. 한 후보를 취소했어도 같은 도구의 다른 후보가 사용하면 해제하지 않는다. 상태 조회 실패·공통 원장 미완성·복구 중 불명은 해제 사유가 아니다. @defer P3 knowledge — 후보 종료 권한/동시성·점유 근거 조회·실제 결과와의 원자 처리/복구를 완성한다. 세트 미완성 상태에서 점유 해제 기능을 활성화하지 않는다"
      consumption: "지식의 API 링크는 ENT-035의 예약자를 곧바로 호출하지 않는다. ENT-015 현재 포인터/ENT-016의 실제 API 대응을 확인하고 API·도구 양쪽 현재 효력/계약/노출/그룹·지식 연결을 검증한다. NONE/RESERVED/CONFLICT/UNKNOWN은 임의 도구 선택으로 바꾸지 않는다"
    registry_contract:
      input: "현재 주체·검색 조건 또는 저장된 implementationId/contractVersion/deploymentRef"
      output: "검증된 구현 식별/계약 버전·QUERY/EXECUTE·입출력/데이터 범위/마스킹·재시도/멱등성·결과 확인 계약 참조·검수/배포 상태·관측 시각/노드 적용 근거. 코드·비밀/환경값은 반환하지 않는다"
      boundary: "@defer P3 agent — 레지스트리의 실제 계약 형식·배포/무효화·현재 호출 직전 재검증과 노드 간 적용 근거를 연결한다. admin DB 잠금으로 외부 배포/검수 회수를 동결했다고 주장하지 않는다"
    verification_cases:
      - "동일 API에 다른 toolId의 신규 초안을 동시에 저장하면 하나만 점유하고 다른 트랜잭션 전체는 실패한다"
      - "도구 T의 현재 API A와 변경 후보 B는 T가 함께 점유한다. B 후보 하나를 취소해도 다른 작업 중 B 후보가 남으면 B를 해제하지 않는다"
      - "T가 A를 마지막 대응으로 폐지된 경우 A에 새 toolId 등록을 거부하고 T의 새 후보로 복원한다"
      - "T의 A→B 실제 반영 후 A의 작업 중/현재/폐지 대응이 모두 사라지면 A 점유를 해제하되 A의 과거 판은 보존한다. 단순 역사만으로 A를 영구 차단하지 않는다"
      - "API/도구 후보의 그룹 계약이 미완성·조회 실패이면 고정/반영하지 않는다. API가 미래 오픈 또는 원천 무효인 경우 내부 승인만으로 노출/호출하지 않는다"
    types:
      BusinessToolFilter: "businessName/sourceKind/operationType/lifecycle/exposeYn 선택 조건, sorts=toolId/businessName/appliedAt와 동률 toolId, 공통 페이지"
      BusinessToolKey: "toolId:필수 양의 십진 문자열. 폐지 이력도 현재 권한으로 조회"
      BusinessToolRow: "toolId/currentRevisionId/stateVersion/lifecycle·업무명·원천 종류·현재 원천 참조·노출 의도/실제 반영 시각"
      BusinessToolDetail: "BusinessToolRow·현재 계약/검수/배포 관측·권한 있는 연결 지식 역참조. 사용 설명의 사본은 두지 않는다"
      BusinessToolRevisionKey: "toolId/revisionId:필수. 소유가 다르면 404"
      BusinessToolRevisionRow: "toolId/revisionId/revisionNo/baseRevisionId/contentState/editVersion·작성/고정 근거"
      BusinessToolComposition: "ENT-016 편집 항목과 ENT-038 전체 후속 참조·전체 그룹 후보. API/INTERNAL 선택에 따라 사용하지 않는 값은 null/빈 목록이며 검수 의도/근거만 입력한다"
      BusinessToolRevisionDetail: "BusinessToolRevisionRow·당시 BusinessToolComposition·정확 원천 계약/가이드 참조·세트 처리 근거. 현재 검수/배포는 별도 관측"
      BusinessToolDraftCreate: "commandKey/reason/전체 BusinessToolComposition. 최초 도구·판·필요 API 대응 점유를 원자 생성"
      BusinessToolDraftSave: "commandKey/toolId/revisionId/expectedEditVersion/reason/전체 BusinessToolComposition"
      BusinessToolDraftCopy: "commandKey/toolId/sourceRevisionId/expectedCurrentRevisionId/reason. 현재 기준본/복원 원본 구분"
      ImplementationQuery: "현재 권한 안의 검증된 내부 구현 검색·계약 버전 조건·공통 페이지. 임의 클래스명 실행 입력 없음"
      ImplementationRow: "registry_contract.output의 비밀 아닌 요약. 현재 관측이지 이후 호출 허가/예약이 아님"
    exception_map:
      UC-019.E1: "400 금지/미지원 원천 입력, 409 검수/배포 무효. 내부 승인으로 우회하지 않는다"
      UC-019.E2: "404 없는/다른 소유 참조, 403 현재 권한, 409 최신성/사용처/검증 실패. 조회 실패를 연결 없음으로 치환하지 않는다"
      UC-019.E3: "409 API 대응 점유 충돌. 현재 대응/후보를 권한 안에서 안내하고 새 도구 ID로 우회하지 않는다"
