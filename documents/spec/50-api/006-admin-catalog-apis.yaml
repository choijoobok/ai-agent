# 카탈로그 관리 API — 소유 G3 전 미구현 설계
apis:
  - id: API-019
    feature: FEAT-003
    implementation: "planned"
    method: "POST"
    path: "/api/service/admin/catalog/getList"
    action: "READ"
    summary: "카탈로그 목록"
    request: "body=SearchRequest<CatalogFilter>"
    response: "ApiResponse<PageResponse<CatalogRow>>"
    contract: "CURRENT 적용본만 조회한다. 최초 미적용 요청·초안·반려 제출본은 제외한다."
  - id: API-020
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getOne
    action: READ
    summary: "카탈로그 현재 항목"
    request: "body=CatalogKey"
    response: "ApiResponse<CatalogDetail>"
  - id: API-021
    feature: FEAT-003
    implementation: "planned"
    method: "POST"
    path: "/api/service/admin/catalog/getChangeRequests"
    action: "READ"
    summary: "별도 변경 요청 화면의 카탈로그 요청 목록"
    contract: "REQUEST_NO별 상태/기준·결과 리비전/반려 사유를 조회한다. 관리 화면의 하단 버전 탭에서 사용하지 않는다."
    request: "body=SearchRequest<CatalogKey>"
    response: "ApiResponse<PageResponse<RevisionRow>>"
  - id: API-022
    feature: FEAT-003
    implementation: "planned"
    method: "POST"
    path: "/api/service/admin/catalog/getRevision"
    action: "READ"
    summary: "명시한 현재·요청·이력 문맥의 전체 구성"
    request: "body=RevisionKey"
    response: "ApiResponse<RevisionDetail>"
    contract: "kind=CURRENT이면 안정 자산 ID, REQUEST이면 requestNo+대상 종류/ID, HISTORY이면 안정 자산 ID+appliedRevision 또는 historyNo. 서버가 소유·세트·현재 권한을 검사하고 명시하지 않은 문맥/현재값으로 대체하지 않는다."
  - id: API-023
    feature: FEAT-003
    implementation: "planned"
    method: "POST"
    path: "/api/service/admin/catalog/saveCreate"
    action: "SAVE"
    summary: "카탈로그 신규 저장 또는 승인 요청"
    request: "body=ManagementChange"
    response: "ApiResponse<RequestResult>"
    contract: "BASE_REVISION=0 및 원본 미존재·업무키 유일성을 검사한다. 승인 사용이면 요청만, 미사용이면 전결·실제 반영한다."
  - id: API-024
    feature: FEAT-003
    implementation: "planned"
    method: "POST"
    path: "/api/service/admin/catalog/saveChange"
    action: "SAVE"
    summary: "카탈로그 전체 변경 저장 또는 승인 요청"
    request: "body=ManagementChange"
    response: "ApiResponse<RequestResult>"
    contract: "서버가 REQ-601.approval_storage에 따라 전체 _SNP·BASE_REVISION을 고정하고 설정에 따라 요청 또는 전결 반영한다."
  - id: API-025
    feature: FEAT-003
    implementation: "planned"
    method: "POST"
    path: "/api/service/admin/catalog/saveCopyDraft"
    action: "SAVE"
    summary: "별도 요청 작성 화면의 보완·복원 초안 복사"
    request: "body=DraftCopy"
    response: "ApiResponse<DraftResult>"
    contract: "새 요청번호로 복사하고 현재 기준 리비전·원 요청/이력을 연결한다. 운영 데이터는 바꾸지 않는다."
  - id: API-026
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getReferences
    action: READ
    summary: "카탈로그 사용처·영향"
    request: "body=SearchRequest<RevisionKey>"
    response: "ApiResponse<PageResponse<CatalogReferenceRow>>"
  - id: API-027
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getRelatedJoins
    action: READ
    summary: "양쪽 역할에서 보는 권장 관계"
    request: "body=SearchRequest<RevisionKey>"
    response: "ApiResponse<PageResponse<CatalogReferenceRow>>"
  - id: API-028
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getResolvedObject
    action: READ
    summary: "선정 공개 객체의 정확 식별"
    request: "body=SourceObjectQuery"
    response: "ApiResponse<SourceObjectResult>"
  - id: API-029
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getStructure
    action: READ
    summary: "데이터소스 일괄 비교에서 재사용할 등록 객체 구조 사실 조회"
    request: "body=StructureQuery"
    response: "ApiResponse<StructureResult>"
  - id: API-030
    scope_status: "현재 화면/구현 범위 제외. @defer 사용자 재요청 시 — 샘플 조회 필요성과 통제 재검토"
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/runSample
    action: EXECUTE
    summary: "허용된 등록 컬럼 수동 샘플링"
    request: "body=SampleRequest"
    response: "ApiResponse<SampleResult>"
  - id: API-031
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getEvidenceList
    action: READ
    summary: "카탈로그 변경 근거 목록"
    request: "body=SearchRequest<EvidenceFilter>"
    response: "ApiResponse<PageResponse<EvidenceRow>>"
  - id: API-032
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getEvidenceOne
    action: READ
    summary: "카탈로그 변경 근거 상세"
    request: "body=EvidenceKey"
    response: "ApiResponse<EvidenceDetail>"
  - id: API-033
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/saveEvidence
    action: SAVE
    summary: "변경 통지·업무 변경 근거 접수"
    request: "body=EvidenceSave"
    response: "ApiResponse<DraftResult>"
  - id: API-034
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getCommandResult
    action: READ
    summary: "초안 편집·근거 접수 결과 확인"
    request: "body=CatalogCommandKey"
    response: "ApiResponse<CatalogCommandResult>"
  - id: API-035
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getValidation
    action: READ
    summary: "후보 전체 구성의 현재 검증"
    request: "body=ValidationRequest"
    response: "ApiResponse<ValidationResult>"
  - id: API-036
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getReferenceCandidates
    action: READ
    summary: "등록 객체·컬럼·키 참조 후보"
    request: "body=SearchRequest<ReferenceCandidateFilter>"
    response: "ApiResponse<PageResponse<CatalogReferenceRow>>"
