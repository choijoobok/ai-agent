# 카탈로그 관리 API — 소유 G3 전 미구현 설계
apis:
  - id: API-019
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getList
    action: READ
    summary: "카탈로그 목록"
    request: "body=SearchRequest<CatalogFilter>"
    response: "ApiResponse<PageResponse<CatalogRow>>"
  - id: API-020
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getOne
    action: READ
    summary: "카탈로그 현재 항목"
    request: "body=CatalogKey"
    response: "ApiResponse<CatalogDetail>"
  - id: API-021
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getRevisions
    action: READ
    summary: "카탈로그 내용 판 목록"
    contract: "catalogId의 판 이력을 revisionNo DESC, revisionId DESC 고정 정렬로 반환한다. UI는 선택/탭 진입 시 자동 조회하고 페이지 이동도 같은 대상/정렬을 유지한다. CONTENT_STATE는 승인/운영 반영 상태가 아니다"
    request: "body=SearchRequest<CatalogKey>"
    response: "ApiResponse<PageResponse<RevisionRow>>"
  - id: API-022
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getRevision
    action: READ
    summary: "선택 내용 판 전체 구성"
    request: "body=RevisionKey"
    response: "ApiResponse<RevisionDetail>"
  - id: API-023
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/saveCreateDraft
    action: SAVE
    summary: "공개 객체와 최초 초안 등록"
    request: "body=DraftCreate"
    response: "ApiResponse<DraftResult>"
  - id: API-024
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/saveDraft
    action: SAVE
    summary: "카탈로그 전체 초안 저장"
    request: "body=DraftSave"
    response: "ApiResponse<DraftResult>"
  - id: API-025
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/saveCopyDraft
    action: SAVE
    summary: "변경·복원용 새 초안 작성"
    request: "body=DraftCopy"
    response: "ApiResponse<DraftResult>"
  - id: API-026
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getReferences
    action: READ
    summary: "카탈로그 사용처·영향"
    request: "body=SearchRequest<RevisionKey>"
    response: "ApiResponse<PageResponse<CatalogReferenceRow>>"
  - id: API-027
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/service/admin/catalog/getRelatedJoins
    action: READ
