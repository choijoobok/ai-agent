feature_contracts:
  FEAT-501:
    security_scope: "ARCH-050.admin_account_contract — 관리자 자체 계정/인증·세션 명령이며 Portal 계정/인증 요청에 재사용하지 않는다"
    request_rule: "관리 API의 userId는 필수이며 자기 서비스의 사용자 ID는 세션에서 얻는다; 비밀번호·토큰 원문은 응답·로그에 쓰지 않는다"
    response_rule: "현재 DTO 필드·null 의미·페이징을 보존하고 세션에는 authzVersion을 포함한다"
    transaction: "계정/역할/IP/비밀번호 이력 변경은 각 명령 단위로 원자적"
    exception_map: { UC-501.E1: LOGIN_CONDITION_DENIED, UC-501.E2: CREDENTIAL_OR_SESSION_CONFLICT }
  FEAT-502:
    request_rule: "부여 대상 사용자·역할·메뉴·액션과 유효 기간을 명시한다"
    response_rule: "저장 전 영향 사용자와 저장 후 유효 권한을 같은 합성 규칙으로 계산한다"
    transaction: "한 저장 요청의 부여·회수와 권한 버전 증가는 원자적"
    concurrency: "같은 역할의 권한 전체 저장이 겹치면 나중에 완료된 전체 스냅샷이 이기고 서버는 두 요청을 자동 병합하지 않는다"
    exception_map: { UC-502.E1: AUTHZ_TARGET_INVALID, UC-502.E2: AUTHZ_VERSION_STALE }
  FEAT-503:
    request_rule: "메뉴 위치 변경은 전용 트리 명령으로만 받고 API는 배포 선언에서 생성된 후보만 매핑한다"
    response_rule: "미등록·미매핑·액션 불일치는 모두 업무 서비스 호출 전 403"
    transaction: "노드·트리·API 매핑 명령은 각각 원자적"
    exception_map: { UC-503.E1: AUTHORIZATION_DENIED, UC-503.E2: MENU_TREE_CONFLICT }
  FEAT-504:
    reference_combo_contract:
      implementation: planned
      request: "API-600 body는 grpCd(필수 1~30자)·refCd(필수 1~30자)·refVal(필수 1~200자) 세 문자열이다. 그룹/참조 키의 공백뿐 값과 refVal의 null/빈 문자열을 거부한다. 참조값의 내부/앞뒤 공백·대소문자를 임의 정규화하지 않고 저장 원문과 정확 비교한다. 열 이름·SQL·연산자·정렬 문자열을 입력받지 않는다. DBMS 버전은 조회 인자가 아니다"
      query: "SYS_CODE와 SYS_CODE_REF를 GRP_CD/DTL_CD로 조인하고 그룹코드=grpCd, 참조코드=refCd, 참조값=refVal, SYS_CODE.USE_YN=Y를 모두 적용한다. SYS_CODE_GRP_REF의 현재 해당 참조 정의도 확인한다. 파라미터 바인딩을 사용하고 결과는 중복 없는 DTL_CD를 SORT_NO/DTL_CD 순서로 반환한다. 일치하지 않는 코드/참조 정의는 빈 성공 목록이며 조회 실패와 다르다. SQL 삽입 문자열도 단순 참조값으로 비교한다"
      response: "ApiResponse<CodeRefListResponse>이며 data={version:CODE 캐시 버전,codes:상세 코드 문자열 배열}이다. 기존 API-554처럼 CODE 버전을 먼저 읽고 코드 목록을 조회한다. 조회 후 새 버전을 읽어 이전 데이터에 붙이지 않는다. 표시명은 기존 code.{grpCd}.{dtlCd} 메시지와 label 경로로 만든다. 임의 참조속성/전체 관리 DTO를 응답에 싣지 않는다. NATIVE_TYPE은 카탈로그 서버가 별도 내부 코드/참조 조회로 검증·해석하며 콤보 응답에 있다고 가정하지 않는다"
      access: "기존 common 계층의 인증·유효 세션/계정·제한 세션·authzVersion 계약을 유지한다. CODE_MGMT 관리 메뉴 권한과 SYS_MENU_API 매핑을 요구하지 않으며 관리 저장 권한은 확대하지 않는다. Portal 인증 주체를 관리자 세션으로 받아들이는 별칭을 만들지 않는다"
      frontend: "shared/code/api/endpoints.ts·codeApi.ts에 getListByRef를 선언하고 shared/code/useCodeOptionsByRef의 공통 훅으로 콤보 옵션을 만든다. CodeSelect에 선택적 refFilter={refCd,refVal}를 두어 재사용한다. refFilter가 없으면 기존 그룹 전체 조회, 있으면 참조 조건 조회이며 조건 미완성 시 요청하지 않고 후보 없음/선행 선택 필요를 표시한다. 기존 선택값과 로딩/실패/미지원 표시를 구분하고 첫 후보를 자동 선택하지 않는다. 화면마다 같은 조인/후보 필터를 구현하지 않는다"
      cache: "필터 결과는 기존 codeStore.groups[grpCd] 전체 목록에 넣지 않는다. (grpCd,refCd,refVal) 튜플을 구조적으로 직렬화한 별도 캐시 키를 사용한다. 공백 연결 키는 금지한다. API-554/600 응답 version과 현재 CODE 버전을 함께 대조해 새 버전이면 전체/필터 캐시를 모두 비운 뒤 해당 결과만 적재한다. 이전 버전의 늦은 응답은 버전을 내리거나 캐시에 다시 적재하지 않는다. CODE 버전 변경 알림도 양쪽 캐시를 함께 무효화한다. 조건 변경 후 이전 응답이 새 후보를 덮지 않게 요청 키를 대조한다. 빈 성공은 캐시 가능하나 실패는 빈 성공으로 캐시하지 않는다"
      errors: "필수/길이 오류 400, 인증/세션 오류는 기존 common 계약, 의존 조회 실패는 오류로 반환한다. 클라이언트는 로딩·빈 결과·조회 실패를 구분한다. 구체 MsgKey 및 source_contract는 소유 G3 이후 구현과 시드 생성에서 연결한다"
      verification: "TC-5046. 같은 그룹 다른 부모·같은 참조값 다른 그룹/참조 키·비활성·빈 결과·누락 조건·따옴표/공백 값·일반 로그인 권한·전체 캐시 오염·CODE 무효화와 늦은 응답을 검증한다"
    request_rule: "그룹·코드·참조 정의·참조값의 행 상태와 키를 함께 보낸다"
    response_rule: "조회는 사용 중 값과 명시된 정렬을 유지한다"
    transaction: "원본 코드와 코드명·참조값 정리는 한 트랜잭션"
    exception_map: { UC-504.E1: SYSTEM_CODE_PROTECTED, UC-504.E2: CODE_REFERENCE_CONFLICT }
  FEAT-505:
    request_rule: "생성된 MSG_KEY의 언어별 값만 변경 가능"
    response_rule: "번들은 요청 언어→기본 언어→키 문자열 폴백과 cacheVersion을 제공한다"
    transaction: "메시지 값과 MESSAGE 캐시 버전 증가를 원자 처리"
    exception_map: { UC-505.E1: MESSAGE_KEY_CREATION_FORBIDDEN, UC-505.E2: MESSAGE_VERSION_ROLLBACK }
  FEAT-506:
    request_rule: "`sys-config.*` 아래 등록된 화면 노출용 키와 타입에 맞는 값만 받으며, 비밀값·임의 변경 금지 값의 별도 프로퍼티 경로는 받지 않는다"
    response_rule: "화면 노출용 설정의 배포 기본값과 오버라이드를 합성하고 값 원천·경고를 함께 표시하며, 별도 프로퍼티 경로 값은 응답하지 않는다"
    transaction: "오버라이드와 CONFIG 캐시 버전 증가를 원자 처리"
    exception_map: { UC-506.E1: CONFIG_VALUE_INVALID, UC-506.E2: CONFIG_VERSION_ROLLBACK }
  FEAT-507:
    request_rule: "기간·사용자·경로·결과·traceId와 제한된 페이지 범위를 받는다"
    response_rule: "목록과 상세를 분리하되 요청·오류 전문은 목록과 같은 해당 이력 메뉴의 현재 READ 판정을 거친다"
    transaction: "조회 전용; 열람 요청의 접근 이력만 새로 기록"
    exception_map: { UC-507.E1: AUTHORIZATION_DENIED, UC-507.E2: LOG_QUERY_RANGE_INVALID }
  FEAT-508:
    request_rule: "등록 beanId·유효 cron·IANA timezone·양수 잠금/쿨다운과 JSON 파라미터를 받는다"
    response_rule: "실행 ID와 RUNNING/SUCCESS/FAIL/SKIP_LOCK/SKIP_COOLDOWN/CANCELED/LOST 결과를 구분한다"
    transaction: "일정 저장, 실행 시작, 결과 확정은 각각 원자적이며 분산 잠금과 함께 판정"
    exception_map: { UC-508.E1: BATCH_DEFINITION_INVALID, UC-508.E2: BATCH_EXECUTION_CONFLICT }
  FEAT-509:
    request_rule: "공지 기간과 요청 판정 사유를 검증하고 알림 소유자는 세션·계약 발신자로 고정한다"
    response_rule: "현재 노출 가능 공지와 자기 요청·자기 알림만 반환한다"
    transaction: "요청 판정은 대상 행을 PK 오름차순으로 잠근 뒤 결과 알림 생성과 원자적으로 처리하며, 뒤 동시 요청은 상태 충돌로 거부하고 계정·권한 데이터는 건드리지 않는다"
    exception_map: { UC-509.E1: NOTICE_OUTSIDE_WINDOW, UC-509.E2: NOTIFICATION_REQUEST_STATE_CONFLICT }
  FEAT-510:
    request_rule: "userId는 세션에서, menuCd/gridId/conditionName은 등록된 범위에서 얻는다"
    response_rule: "system/admin 관리 콘솔의 동일 관리자·메뉴 키에 같은 값을 반환한다. Portal 인증·같은 문자열 ID로 system 개인 상태를 읽거나 쓰지 않는다"
    transaction: "개별 사용자 상태 저장/초기화와 월별 사용 횟수 증가는 원자적"
    exception_map: { UC-510.E1: USER_STATE_OWNER_MISMATCH, UC-510.E2: USER_STATE_ORPHAN }
