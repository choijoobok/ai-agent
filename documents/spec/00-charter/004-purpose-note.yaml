purpose_note: >-
  **이것은 이 시스템이 가질 수 있는 여러 목적 중 하나다.** AI 가 고객 입장에서
  *구축 비용을 투자할 값이 가장 큰 것* 을 기준으로 골랐고 사용자가 확인했다(2026-09-05).
  다른 목적(기능 실행 · 워크플로우 자동화 · 개인화)을 부정하지 않으며 로드맵이 그것을
  뒤에 둔다. **이 문장이 요구사항의 우선순위를 가르는 기준이므로**, 중심이 바뀌면
  우선순위를 다시 매겨야 한다 — 그때는 변경 요청(CHANGES.md)이다.

# ── 범위 안 (G0) ───────────────────────────────────────────────────
# **범위 밖은 non_goals 가 갖는다.** 둘은 짝이며 한쪽만 있으면 게이트가 열리지 않는다.
# 여기 있는 것은 *만든다* 는 뜻이고, 언제 만드는가는 roadmap 이 정한다.
