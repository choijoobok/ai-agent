problems:
  - id: PRB-01
    title: "시스템의 분산"
    detail: "한 업무를 처리하려면 ERP·그룹웨어·각종 관리 시스템을 번갈아 열어야 한다. 시스템마다 접속·화면·용어가 다르고, 한 시스템의 조회 결과를 다른 시스템에서 다시 찾아 대조하는 일이 반복된다"
  - id: PRB-02
    title: "경로의 고정"
    detail: "정해진 화면에서 정해진 방식으로만 사용 가능하다"
  - id: PRB-03
    title: "탐색 비용"
    detail: "메뉴와 기능이 많아 어디서 무엇을 해야 할지 모른다. 이 비용은 사용하는 시스템 수만큼 곱해진다"
  - id: PRB-04
    title: "조회의 경직성"
    detail: "미리 만들어 둔 조건·형식 외의 조회·가공이 불가능하다. 시스템 경계를 넘는 조회·대조는 아예 불가능하다"
    note: "**가치가 여기에 집중된다** — 나머지 넷에는 대체 수단이 있다(2.3)"
  - id: PRB-05
    title: "반복 수작업"
    detail: "업무 프로세스상 때가 되면 화면을 열고 확인하고 실행 버튼을 누르는 단순 반복이 많다"

# ── 목적 — 한 문장 (G0) ────────────────────────────────────────────
# **왜 만드는가** 다. 무엇을 하는가는 아래 direction 이 갖는다.
