direction: "여러 업무 시스템을 하나의 창구로 모은다. 자주 쓰는 조회·실행을 시스템마다 찾아다니지 않고 하나의 대화창에서 자연어로 처리한다. 그 위에서 사용자가 화면을 찾아가는 대신 목적을 말하면 시스템이 조회·가공·실행까지 수행하고, 반복되는 업무는 사용자별 워크플로우로 정의해 자동 처리한다"

# ── 구축 형태 — 둘을 수용한다 ────────────────────────────────
# **제품은 하나다.** 소스도 문서도 나누지 않으며, 차이는 업무 시스템이 저장소 **밖에**
# 있느냐 **안에** 있느냐뿐이다. 형태에 따라 *가치의 근거* 가 달라지므로 여기 적는다.
