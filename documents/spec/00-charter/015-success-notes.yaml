success_notes:
  - "**자율 처리 비율은 단독 목표가 아니다.** 처리한 것의 정확도가 낮으면 사용자는 결과를 검증하기 위해 원래 화면을 다시 열게 되고, 자동화율은 높은데 실제 절감은 없는 상태가 된다. 목표는 '많이 처리한다' 가 아니라 '처리한 것을 믿을 수 있다' 이며, 지표의 우선순위도 **정확성·절제가 유효성보다 앞선다**"
  - "**효과는 도입 전 기준선과의 대조로만 측정된다.** 적용 대상 업무의 현행 처리 시간과 건수를 착수 시 확보하지 못하면 이후 어떤 수치가 나와도 개선을 증명할 수 없다"

# ── 로드맵 ──────────────────────────────────────────────────
# 각 차수는 보안·성능 정책을 **처음부터** 만족해야 한다. 정책은 후행 과제로 미루지 않는다.
