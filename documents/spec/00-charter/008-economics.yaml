economics:
  - id: ECO-01
    claim: "연동 시스템의 수가 아니라 **시스템 경계를 넘는 업무의 빈도**가 효용을 결정한다"
    why: "각자 자기 시스템 안에서만 일하는 조직에서는 시스템이 많아도 효용이 생기지 않는다"
    note: "**SHAPE-02(통합 구축)에서는 이 축이 0 이다** — 그래도 도입하는 이유는 구축 비용이고, 효용은 PRB-04 가 낸다"
  - id: ECO-02
    claim: "정형 반복 업무에서는 자연어가 기존 화면보다 **느리다**"
    why: "매일 같은 화면에서 같은 조건으로 조회하는 숙련 사용자에게 대화는 추가 비용이다. 이 구간은 저장된 조회와 대시보드가 담당한다. 모든 업무를 대화로 옮기는 것을 목표로 삼지 않는다"
  - id: ECO-03
    claim: "비용은 라이선스가 아니라 **메타데이터**에 있다"
    why: "정확도가 업무 메타데이터의 품질에서 나오므로, 실질 비용은 테이블·컬럼의 업무 의미를 등록·검수하는 인력이다. 확보되지 않으면 시스템이 동작하지 않는다"
    traces_to: [PRN-10, CON-016]
  - id: ECO-04
    claim: "레거시를 대체하지 않으므로 운영 비용은 **더해진다**"
    why: "절감은 사용자의 처리 시간에서 나오는 것이지 시스템 운영 비용에서 나오지 않는다"
    traces_to: [NGOAL-02]
  - id: ECO-05
    claim: "개인정보 취급 방식은 **도입의 전제**다"
    why: "여러 시스템의 데이터가 한곳으로 모이는 구조이므로, 열람과 보존의 통제가 서지 않으면 효용 계산에 앞서 도입 자체가 성립하지 않는다"
    traces_to: [REQ-103, REQ-107, REQ-111]

# ── 최종 목표 ────────────────────────────────────────────────
# 목표 ID 는 `GOAL-` 이다 — `G0`~`G6` 은 게이트의 것이다(CLAUDE.md).
