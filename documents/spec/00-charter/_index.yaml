    [9]   성공 기준 셋의 목표 수치는 아직 null 이며 ASM-002 가 P1 실측으로 미뤄 뒀다.
    [19] ── 배경 — 현행 시스템의 한계 ────────────────────────────────
    [38] ── 목적 — 한 문장 (G0) ────────────────────────────────────────────
    [39] **왜 만드는가** 다. 무엇을 하는가는 아래 direction 이 갖는다.
    [49] ── 범위 안 (G0) ───────────────────────────────────────────────────
    [50] **범위 밖은 non_goals 가 갖는다.** 둘은 짝이며 한쪽만 있으면 게이트가 열리지 않는다.
    [51] 여기 있는 것은 *만든다* 는 뜻이고, 언제 만드는가는 roadmap 이 정한다.
    [82] ── 해결 방향 ────────────────────────────────────────────────
    [85] ── 구축 형태 — 둘을 수용한다 ────────────────────────────────
    [86] **제품은 하나다.** 소스도 문서도 나누지 않으며, 차이는 업무 시스템이 저장소 **밖에**
    [87] 있느냐 **안에** 있느냐뿐이다. 형태에 따라 *가치의 근거* 가 달라지므로 여기 적는다.
    [113] ── 가치와 비용이 모이는 곳 — 도입 판단의 기준 ───────────────
    [135] ── 최종 목표 ────────────────────────────────────────────────
    [136] 목표 ID 는 `GOAL-` 이다 — `G0`~`G6` 은 게이트의 것이다(CLAUDE.md).
    [159] ── 비목표 — 명시적으로 하지 않는 것 ─────────────────────────
    [160] 상세 설계에서 이 경계를 넘는 요구가 나오면 헌장을 개정해야 한다(변경 요청).
    [196] ── 성공 기준 ────────────────────────────────────────────────
    [197] **셋만 둔다**(G0 — 3개 이내). 사용자가 정확성·유효성·절제를 택했다(2026-09-05).
    [198] **목표 수치를 미리 세우지 않는 것이 방침이다**(사용자 결정 2026-09-05).
    [199] 순서는 *측정 방법을 만든다 → 정확히 잰다 → 개선이 필요한지 판단한다* 이며,
    [200] 그래서 `target: null` 은 **빠진 것이 아니라 아직 재지 않았다는 뜻**이다.
    [201] 재기 전에 세운 목표는 근거가 없고, 근거 없는 목표는 게이트에서 협상 대상이 된다.
    [202] 동시 처리량·큐잉 정책·인스턴스 수 산정은 실측값을 근거로 결정한다(ASM-002).
    [230] ── 지표 — 성공 기준은 아니지만 계속 잰다 ──────────────────────────
    [231] 성공 기준을 셋으로 좁히면서 버린 것이 아니라 **판정의 축에서 내린 것**이다.
    [232] 재는 것은 그대로이고, 게이트의 통과 여부를 이것으로 가르지 않는다.
    [260] ── 불변식 — 목표가 아니라 조건이다 ────────────────────────────────
    [261] 옛 SUC-05(안전성)다. **달성을 목표로 하는 값이 아니라 어겨지면 안 되는 값**이라
    [262] 성공 기준에서 뺐다 — 성공 기준은 못 미치면 아쉬운 것이고 이것은 못 미치면 멈춘다.
    [274] ── 로드맵 ──────────────────────────────────────────────────
    [275] 각 차수는 보안·성능 정책을 **처음부터** 만족해야 한다. 정책은 후행 과제로 미루지 않는다.
    [302] ── 기대치 정렬 (G0 · aidd-guide/process/11-verification-cost.md §2) ──
    [317] ── 재단 (트랙) ────────────────────────────────────────────────────

