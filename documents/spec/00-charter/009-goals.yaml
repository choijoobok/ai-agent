goals:
  - id: GOAL-0
    title: "다중 업무 시스템 단일 창구"
    detail: "한 고객사의 여러 업무 시스템(ERP·그룹웨어·각종 관리 시스템)을 동시에 연동해, 사용자가 시스템을 옮겨 다니지 않고 하나의 창구에서 조회·실행한다"
    note: "**단계가 아니라 전 단계의 전제다.** GOAL-1~4 가 모두 이 위에서 성립한다. 따라서 스키마 카탈로그·실행 API 목록·사용자 그룹·감사 이력은 처음부터 대상 시스템이 여럿인 것을 전제로 설계한다. 단일 시스템 연동은 특수 사례로 취급하며 그 반대로 설계하지 않는다"
  - id: GOAL-1
    title: "자연어 데이터 조회"
    detail: "원하는 조건·형식으로 데이터를 조회하고 가공(집계·차트·엑셀)한다"
    roadmap: RM-P1
  - id: GOAL-2
    title: "자연어 기능 실행"
    detail: "업무 시스템의 기능을 자연어 지시로 실행한다"
    roadmap: RM-P2
  - id: GOAL-3
    title: "사용자 정의 워크플로우 자동화"
    detail: "기본 기능을 조합한 워크플로우를 사용자가 직접 만들어 주기 실행·조건 실행한다"
    roadmap: RM-P3
  - id: GOAL-4
    title: "개인화"
    detail: "사용자별로 AI 가 자신의 질의에 어떻게 반응할지 지정한다"
    roadmap: RM-P4

# ── 비목표 — 명시적으로 하지 않는 것 ─────────────────────────
