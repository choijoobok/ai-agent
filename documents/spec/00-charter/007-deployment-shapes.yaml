deployment_shapes:
  - id: SHAPE-01
    title: "독립 운영 — Hub 를 세우고 업무 시스템을 연동한다"
    what: "고객사에 이미 있는 업무 시스템들을 업무 API·DW 로 연동한다. Hub 는 자기 DB 만 갖는다"
    when: "업무 시스템이 여럿이고 이미 운영 중이다"
    value: "PRB-01 과 PRB-04 가 **모두** 선다 — 시스템 경계를 넘는 조회가 가치의 중심이다"
    note: >-
      **바람직한 형태다.** Hub 가 업무 시스템의 수명주기에 묶이지 않는다.
      **초기 영업·검증은 우리 WMS·TMS 를 이미 구축한 고객사를 우선 후보로 삼는다.**
      기존 고객과 업무 지식에 접근할 수 있어 지식 베이스 구축 부담을 줄일 가능성이 크기 때문이다.
      이는 **접근 전략이지 제품 범위의 고정이 아니다** — Hub 는 특정 업무 시스템에 맞춰 설계하지 않는다.
    traces_to: [ECO-01]
  - id: SHAPE-02
    title: "통합 구축 — 업무 시스템을 확장으로 함께 짓는다"
    what: "업무 시스템(WMS 등)을 **업무 확장**으로 같은 빌드에 넣어 함께 구축한다. 업무 DB 는 확장이 따로 소유하고, 좌측 메뉴 트리에 형제 노드로 그 시스템의 메뉴가 붙는다"
    when: "고객사가 업무 시스템 자체를 새로 구축하면서 AI 기능을 함께 원한다 — **따로 세우는 것보다 싸다**"
    value: "**PRB-01(시스템의 분산)은 서지 않는다** — 시스템이 하나뿐이다. 가치는 PRB-02·03·04 에서만 나오며, 그중 PRB-04(조회의 경직성)가 여전히 중심이다"
    hard_rule: "**수용하되 이 형태에 맞춰 설계하지 않는다** — GOAL-0 의 *단일 시스템 연동은 특수 사례로 취급하며 그 반대로 설계하지 않는다* 가 가리키는 특수 사례가 이것이다"
    note: >-
      **이 형태에서는 업무 시스템이 주인공이고 Hub 가 보조다.** 고객이 돈을 내는 대상이
      업무 시스템이며 Hub 는 그것을 더 쉽게 쓰게 하는 보조 서비스다. 목적 문장(`purpose`)이
      *시스템 여럿* 을 전제하므로 **이 고객에게는 목적의 절반만 성립한다** — 도입 판단에서
      그 절반을 있는 것처럼 말하지 않는다.
    traces_to: [GOAL-0, ECO-01]

# ── 가치와 비용이 모이는 곳 — 도입 판단의 기준 ───────────────
