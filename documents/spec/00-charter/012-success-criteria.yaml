success_criteria:
  - id: SUC-02
    axis: 정확성
    rank: 1
    metrics: "평가셋 기준 정확도(단계별·전체) · **오답률** — 잘못된 결과를 정답처럼 제시한 비율"
    target: null
    why_first: >-
      **오답을 정답처럼 내는 순간 사용자는 원래 화면을 다시 연다.** 그러면 창구가 하나
      늘어난 것에 그치고 나머지 지표가 아무리 좋아도 도입이 실패한다(ACT-001 note).
  - id: SUC-01
    axis: 유효성
    rank: 2
    metrics: "자연어 질의 처리 성공률 · 화면을 열지 않고 완료한 업무 비율 · **시스템 경계를 넘는 조회·대조 건수**(ECO-01 이 실제로 발생하는지)"
    target: null
    note: >-
      **세 번째 지표가 헌장의 효용 주장을 검증한다** — 경계를 넘는 일이 실제로 일어나지
      않는 조직에서는 이 제품의 값이 나오지 않는다.
      @defer P5 — 첫 고객 파일럿에서 OQ-002 업무의 적용 전·후 값을 비교해 ECO-01 효용을 검증한다
  - id: SUC-03
    axis: 절제
    rank: 3
    metrics: "확신이 없을 때 추측하지 않고 확인을 요구하거나 처리 불가로 응답한 비율"
    target: null
    note: "**이 값은 실패로 집계하지 않는다.** 지표에서 빼면 구현이 정확도를 올리려고 추측하게 된다"
    traces_to: [REQ-025]

# ── 지표 — 성공 기준은 아니지만 계속 잰다 ──────────────────────────
# 성공 기준을 셋으로 좁히면서 버린 것이 아니라 **판정의 축에서 내린 것**이다.
# 재는 것은 그대로이고, 게이트의 통과 여부를 이것으로 가르지 않는다.
