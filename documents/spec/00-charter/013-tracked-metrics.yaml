    axis: 응답성
    metrics: "질의 접수부터 첫 응답까지 지연 · 전체 처리 완료 시간"
    was: SUC-07
    why_demoted: "NFR 의 성능 목표와 같은 것을 두 곳에서 재고 있었다. 정본은 21-nfr/_index.yaml 이다"
    open_risk: >-
      **G0 레드팀이 지적했고, 사용자가 답해 성격이 바뀌었다(2026-09-05).** 성공 기준에서
      내렸는데 정본이라던 `21-nfr/_index.yaml` 의 목표가 전부 null 이라 *지금은 응답성을
      아무도 판정하지 않는다* 고 지적했다. 답은 **목표를 먼저 세우지 않는다** 였다 —
      재는 것을 먼저 만들고, 정확히 잰 뒤에, 개선이 필요한지 판단한다(`measurement_first`).
      **그러므로 지금 비어 있어야 하는 것은 목표이지 측정이 아니다.** 남은 위험은 하나로
      좁혀진다: *측정 자체를 안 만들면* 판단할 근거가 영영 생기지 않는다.
      **이 일의 주인은 ASM-002 다** — 표는 거기 하나만 단다.
      **2026-09-10 에 받는 자리가 섰다** — `NFR-006`~`NFR-009`. 이제 남은 위험은
      *설계한 측정을 P4 에서 실제로 심지 않는 것* 하나이며, 그 기한은 `21-nfr/_index.yaml` 이 갖는다.

