not_interfaces:
  - item: "아웃바운드 통로(방화벽·프록시·목적지 허용 목록·전송량 제한)와 그 구간의 접속 로그"
    owner: ACT-009
    why: "**고객사 인프라 영역이다.** 우리 시스템이 제공하거나 보장하는 기능이 아니며 **연동 전제(인프라 요건)로 요구한다**"
    what_we_do: "① 목적지·프록시를 설정 값으로 다룬다 ② 일시 오류에 재시도하고 지속 장애 시 **턴을 중단 상태로 전환**한다 ③ **호출 내용과 토큰·비용을 기록한다**"
    what_we_dont: "**공급 경로 장애 자체를 극복하는 수단은 없으며 약속하지 않는다**"
  - item: "감사 시 인프라 접속 로그와 호출 기록의 대조"
    owner: ACT-009
    why: "애플리케이션을 우회한 외부 호출이 없었는지 교차 검증할 수 있으나, **이 대조는 고객사 협조가 필요한 운영 절차이며 시스템 기능이 아니다**"
