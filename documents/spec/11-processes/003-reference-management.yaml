# 영역: 기준정보·Portal 이용자 운영
processes:
  - id: PRC-13
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.approval_policy를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    request_integrity: "관리 변경 요청의 단일 미종결 건·제출본 고정·취소 후 새 요청·승인 경합 처리는 REQ-601.request_integrity를 따르며 실제 권한 회수와 직접 관리 업무는 기존 절차를 유지한다"
    name: "기준정보·Portal 이용자 등록과 변경 적용"
    trigger: "Hub 운영에 필요한 기준 정의·매핑·이용자를 등록하거나 변경·사용 중지한다"
    actors: ["ACT-002","ACT-003","ACT-004","ACT-005"]
    steps:
      - id: PRC-13-01
        name: "관리 원천·속성·사용처 확인과 변경 작성"
        actor: ["ACT-002","ACT-003","ACT-004","ACT-005"]
        system: "admin의 대상별 관리 메뉴 — 실제 처리자는 해당 메뉴·액션 권한자"
        input: "원천 자료·변경 사유·대상 식별자·현재 속성·참조 현황"
        output: "원천과 편집 범위를 확인한 변경 내용 및 영향 대상"
        reqs: ["REQ-601","REQ-602","REQ-603","REQ-604","REQ-605","REQ-606","REQ-607","REQ-608","REQ-609","REQ-610","REQ-611","REQ-612","REQ-613","REQ-614","REQ-615","REQ-616"]
        rules:
          - "개별 요구사항의 관리 주체·속성·사용처를 따른다. 모든 기준정보를 같은 액터나 하나의 범용 테이블로 통합하지 않는다"
          - "Portal 계정은 admin에서 별도 등록·관리하고 portal이 별도 인증/세션으로 수락한다. system 관리자 계정은 Portal 등록 원천이 아니며 겸임자는 별도 Portal 계정을 발급받는다. 외부/자체 모드·재요청·활성화는 UC-023을 따른다"
        exceptions:
          - "권한 밖 원천·비밀값·연동 원천 소유 속성은 편집하지 않고 관리 원천을 안내한다"
      - id: PRC-13-02
        name: "참조·유효성 검사 후 정해진 절차로 적용"
        actor: ["ACT-002","ACT-003","ACT-004","ACT-005"]
        system: "대상별 관리 기능 및 기존 승인·월 배정·고객사 공동 오픈 절차"
        input: "변경 내용·사용처·원천별 적용 규칙"
        output: "적용 결과 또는 승인/적용 월/배포 대기 안내"
        reqs: ["REQ-601"]
        rules:
          - "업무별 기존 처리와 관리 원천을 유지하며 REQ-601의 개별 승인 설정으로 별도 승인 또는 저장자 전결을 선택한다. 지식/예제/카탈로그는 REQ-305·306, API는 REQ-608·PRC-11, 도구는 REQ-612, 사용자 권한 부여는 REQ-609, 쿼터는 REQ-116~119를 따른다. 기존 직접 관리 대상에 새 승인을 일괄 추가하지 않는다. RM-P3 워크플로우 자동 승인 활성화는 REQ-405의 필수 사용자 요청·관리자 검토·승인을 따르며 이 전결 설정으로 생략하지 않는다"
        exceptions:
          - "유효 참조를 끊거나 값·지원 조합·원천 규칙이 잘못되면 적용하지 않고 대상과 보완 방법을 알린다"
      - id: PRC-13-03
        name: "적용 상태·이력 확인 및 후속 보완"
        actor: ["ACT-002","ACT-003","ACT-004","ACT-005"]
        system: "대상별 상세·변경 이력 및 유효 설정 조회"
        input: "변경 처리 결과·실제 적용값·처리 근거"
        output: "현재 사용 여부·적용 시점·변경 전후 근거 확인"
        reqs: ["REQ-601"]
        rules:
          - "요청·저장 상태와 실제 유효 상태를 구분하며 과거 이력을 현재 값으로 바꾸지 않는다"
        exceptions:
          - "끊긴 연결·비활성 참조·미반영 설정은 정상 적용으로 표시하지 않고 해당 복구·재적용 경로를 안내한다"
      - id: PRC-13-04
        name: "사용자 접근 권한 추가 요청과 승인"
        actor: "ACT-002"
        system: "admin Portal 사용자 관리 → 사용자 접근 권한 승인 메뉴"
        input: "Portal 사용자·대상 시스템/데이터소스와 사용자 ID 또는 그룹·사유·신원 근거"
        output: "권한 없는 요청 → 승인된 활성 부여 또는 반려·취소 이력"
        reqs: ["REQ-609"]
        rules:
          - "사용자 접근 권한 부여 설정 사용 시 요청자가 후보를 작성하고 승인 권한자가 별도 메뉴에서 승인한다. 미사용 시 후보 저장자가 전결해 부여한다(REQ-601). 양쪽 방식의 상태·권한 효력·내용 변경·경합은 REQ-609를 따른다"
        exceptions:
          - "권한 없는 승인·요청 내용 불일치·이미 종결되거나 제거된 요청의 승인은 거부한다"
      - id: PRC-13-05
        name: "사용자 접근 권한 제거"
        actor: "ACT-002"
        system: "admin Portal 사용자 관리"
        input: "사용자에게 부여된 데이터소스·대상 시스템·그룹과 제거 사유"
        output: "제거된 권한과 변경 이력"
        reqs: ["REQ-609"]
        rules:
          - "제거 권한자가 별도 승인 없이 처리한다. 마지막 활성 그룹 제거는 이용자 비활성화와 함께 처리하고 재부여는 새 후보를 작성해 REQ-601의 해당 설정에 따라 승인 또는 전결로 처리한다"
        exceptions:
          - "승인과 제거의 경합에서 오래된 승인이 권한을 다시 살리지 못하며, 이미 판정한 턴의 적용은 REQ-108과 REQ-609의 명시된 결정을 따른다"
    outcome: "운영 기준과 Portal 이용자를 해당 관리 원천에서 관리한다. 사용자별 접근 권한은 추가 시 승인 후 활성화하고 제거는 승인 없이 처리하며 현재 권한과 과거 이력을 구분한다"
