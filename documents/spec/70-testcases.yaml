# 테스트 케이스
#
# 작성 단계: P3~P5
# status: empty — **비어 있다. 지어내지 않았다.**
#
# **비어 있는 것이 각 작업흐름 G3 를 막는다.** 추적성 규칙 T5 는 모든 FEAT 가 최소 1개
# TC 를 가질 것을 요구한다. 아직 G3를 청구하지 않은 작업흐름의 FEAT 86건은 경고로 보이지만,
# 해당 작업흐름 G3를 검사할 때는 오류가 된다 — **순서를 미뤘다고 검증이 사라지지 않는다.**
# NFR의 `test_case: null`도 같은 방식으로 T7이 센다.
#
# **TEST-FIRST 다**(aidd-guide/process/07-slice.md): 슬라이스 구현 전에 TC 를 먼저 코드로
# 옮기고 실패를 확인한다. 그리고 **테스트 통과만으로 완료를 선언하지 않는다** —
# 업무 규칙을 코드에서 뒤집었을 때 테스트가 실패하는지 확인한다
# (aidd-guide/quality/redteam.md).
#
# 최소 세트와 작성 형식: aidd-guide/quality/test-design.md

