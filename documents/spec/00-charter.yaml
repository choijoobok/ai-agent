# 프로젝트 헌장 — 목적 · 문제 · 목표 · 범위 · 성공 기준
#
# 작성 단계: P0
#
# status: baselined
#   **G0 를 통과했다(2026-09-05).** 목적·성공 기준·범위·액터·제약이 합의된 것으로
#   인용될 수 있다. 다만 **동결은 아니다** — spec 동결은 G3 이고, 여기서 확정된 것은
#   헌장뿐이다. 이후 이 파일을 바꾸려면 CHANGES.md 의 변경 요청을 거친다.
#   성공 기준 셋의 목표 수치는 아직 null 이며 ASM-002 가 P1 실측으로 미뤄 뒀다.

meta:
  id: CHARTER
  name: "기업용 Agentic AI Hub"
  code: AIHUB
  status: baselined
  baselined: 2026-09-05
  baselined_by: "사용자 승인 (G0 · /phase-gate)"

# ── 배경 — 현행 시스템의 한계 ────────────────────────────────
problems:
  - id: PRB-01
    title: "시스템의 분산"
    detail: "한 업무를 처리하려면 ERP·그룹웨어·각종 관리 시스템을 번갈아 열어야 한다. 시스템마다 접속·화면·용어가 다르고, 한 시스템의 조회 결과를 다른 시스템에서 다시 찾아 대조하는 일이 반복된다"
  - id: PRB-02
    title: "경로의 고정"
    detail: "정해진 화면에서 정해진 방식으로만 사용 가능하다"
  - id: PRB-03
    title: "탐색 비용"
    detail: "메뉴와 기능이 많아 어디서 무엇을 해야 할지 모른다. 이 비용은 사용하는 시스템 수만큼 곱해진다"
  - id: PRB-04
    title: "조회의 경직성"
    detail: "미리 만들어 둔 조건·형식 외의 조회·가공이 불가능하다. 시스템 경계를 넘는 조회·대조는 아예 불가능하다"
    note: "**가치가 여기에 집중된다** — 나머지 넷에는 대체 수단이 있다(2.3)"
  - id: PRB-05
    title: "반복 수작업"
    detail: "업무 프로세스상 때가 되면 화면을 열고 확인하고 실행 버튼을 누르는 단순 반복이 많다"

# ── 목적 — 한 문장 (G0) ────────────────────────────────────────────
# **왜 만드는가** 다. 무엇을 하는가는 아래 direction 이 갖는다.
purpose: "한 업무를 처리하려고 시스템 여럿을 번갈아 열고 그 결과를 사람이 손으로 대조하는 일을 없애기 위해 만든다"
purpose_traces_to: [PRB-01, PRB-04, ECO-01]
purpose_note: >-
  **이것은 이 시스템이 가질 수 있는 여러 목적 중 하나다.** AI 가 고객 입장에서
  *구축 비용을 투자할 값이 가장 큰 것* 을 기준으로 골랐고 사용자가 확인했다(2026-09-05).
  다른 목적(기능 실행 · 워크플로우 자동화 · 개인화)을 부정하지 않으며 로드맵이 그것을
  뒤에 둔다. **이 문장이 요구사항 59건의 우선순위를 가르는 기준이므로**, 중심이 바뀌면
  우선순위를 다시 매겨야 한다 — 그때는 변경 요청(CHANGES.md)이다.

# ── 범위 안 (G0) ───────────────────────────────────────────────────
# **범위 밖은 non_goals 가 갖는다.** 둘은 짝이며 한쪽만 있으면 게이트가 열리지 않는다.
# 여기 있는 것은 *만든다* 는 뜻이고, 언제 만드는가는 roadmap 이 정한다.
scope_in:
  - id: IN-01
    what: "다중 업무 시스템 연동 기반 — 스키마 카탈로그 · 실행 API 목록 · 사용자 그룹 · 감사 이력"
    why: "GOAL-0 은 단계가 아니라 전 단계의 전제다. 나중에 얹을 수 없다"
    roadmap: RM-P1
  - id: IN-02
    what: "자연어 데이터 조회와 가공 — 조회 계획 제시 · SQL 생성·검증·실행 · 마스킹 · 그리드·차트·다운로드"
    why: "GOAL-1. 가치가 몰리는 자리(PRB-04)이며 1차 출시 범위다"
    roadmap: RM-P1
  - id: IN-03
    what: "자연어 기능 실행 — API 등록·그룹 매핑 · 승인 필요 액션 · 실행 이력"
    why: "GOAL-2"
    roadmap: RM-P2
  - id: IN-04
    what: "사용자 정의 워크플로우 자동화 — 정의·실행 · 스케줄러 · 알림"
    why: "GOAL-3. 반복 수작업(PRB-05)을 겨눈다"
    roadmap: RM-P3
  - id: IN-05
    what: "개인화 심화 · 운영 고도화 — 개인 기본 지시 · 감사·통계·정산 · 쿼터 승인 · 다국어"
    why: "GOAL-4"
    roadmap: RM-P4
  - id: IN-06
    what: "관리자 화면 — 연동·업무 지식·권한·AI 운영·비용·품질·감사"
    why: "액터 ACT-002~005 가 쓰는 자리다. 이것이 없으면 정확도를 만들 방법이 없다(ECO-03)"
    roadmap: RM-P1
  - id: IN-07
    what: "위 전부를 담는 백오피스 셸 — 인증·메뉴·권한·코드·메시지·이력"
    why: "백오피스 템플릿을 바탕으로 한다. **새로 만들지 않고 이어받는다**"
    roadmap: RM-P1

# ── 해결 방향 ────────────────────────────────────────────────
direction: "여러 업무 시스템을 하나의 창구로 모은다. 자주 쓰는 조회·실행을 시스템마다 찾아다니지 않고 하나의 대화창에서 자연어로 처리한다. 그 위에서 사용자가 화면을 찾아가는 대신 목적을 말하면 시스템이 조회·가공·실행까지 수행하고, 반복되는 업무는 사용자별 워크플로우로 정의해 자동 처리한다"

# ── 가치와 비용이 모이는 곳 — 도입 판단의 기준 ───────────────
economics:
  - id: ECO-01
    claim: "연동 시스템의 수가 아니라 **시스템 경계를 넘는 업무의 빈도**가 효용을 결정한다"
    why: "각자 자기 시스템 안에서만 일하는 조직에서는 시스템이 많아도 효용이 생기지 않는다"
  - id: ECO-02
    claim: "정형 반복 업무에서는 자연어가 기존 화면보다 **느리다**"
    why: "매일 같은 화면에서 같은 조건으로 조회하는 숙련 사용자에게 대화는 추가 비용이다. 이 구간은 저장된 조회와 대시보드가 담당한다. 모든 업무를 대화로 옮기는 것을 목표로 삼지 않는다"
  - id: ECO-03
    claim: "비용은 라이선스가 아니라 **메타데이터**에 있다"
    why: "정확도가 업무 메타데이터의 품질에서 나오므로, 실질 비용은 테이블·컬럼의 업무 의미를 등록·검수하는 인력이다. 확보되지 않으면 시스템이 동작하지 않는다"
    traces_to: [PRN-10, CON-016]
  - id: ECO-04
    claim: "레거시를 대체하지 않으므로 운영 비용은 **더해진다**"
    why: "절감은 사용자의 처리 시간에서 나오는 것이지 시스템 운영 비용에서 나오지 않는다"
    traces_to: [NGOAL-02]
  - id: ECO-05
    claim: "개인정보 취급 방식은 **도입의 전제**다"
    why: "여러 시스템의 데이터가 한곳으로 모이는 구조이므로, 열람과 보존의 통제가 서지 않으면 효용 계산에 앞서 도입 자체가 성립하지 않는다"
    traces_to: [REQ-103, REQ-107, REQ-111]

# ── 최종 목표 ────────────────────────────────────────────────
# 목표 ID 는 `GOAL-` 이다 — `G0`~`G6` 은 게이트의 것이다(CLAUDE.md).
goals:
  - id: GOAL-0
    title: "다중 업무 시스템 단일 창구"
    detail: "한 고객사의 여러 업무 시스템(ERP·그룹웨어·각종 관리 시스템)을 동시에 연동해, 사용자가 시스템을 옮겨 다니지 않고 하나의 창구에서 조회·실행한다"
    note: "**단계가 아니라 전 단계의 전제다.** GOAL-1~4 가 모두 이 위에서 성립한다. 따라서 스키마 카탈로그·실행 API 목록·사용자 그룹·감사 이력은 처음부터 대상 시스템이 여럿인 것을 전제로 설계한다. 단일 시스템 연동은 특수 사례로 취급하며 그 반대로 설계하지 않는다"
  - id: GOAL-1
    title: "자연어 데이터 조회"
    detail: "원하는 조건·형식으로 데이터를 조회하고 가공(집계·차트·엑셀)한다"
    phase: P1
  - id: GOAL-2
    title: "자연어 기능 실행"
    detail: "업무 시스템의 기능을 자연어 지시로 실행한다"
    phase: P2
  - id: GOAL-3
    title: "사용자 정의 워크플로우 자동화"
    detail: "기본 기능을 조합한 워크플로우를 사용자가 직접 만들어 주기 실행·조건 실행한다"
    phase: P3
  - id: GOAL-4
    title: "개인화"
    detail: "사용자별로 AI 가 자신의 질의에 어떻게 반응할지 지정한다"
    phase: P4

# ── 비목표 — 명시적으로 하지 않는 것 ─────────────────────────
# 상세 설계에서 이 경계를 넘는 요구가 나오면 헌장을 개정해야 한다(변경 요청).
non_goals:
  - id: NGOAL-01
    title: "범용 챗봇이 아니다"
    why: "등록된 업무 범위 밖의 질의는 거부한다"
    traces_to: [REQ-101]
  - id: NGOAL-02
    title: "레거시 업무 시스템의 대체가 아니다"
    why: "기존 시스템의 화면·기능을 없애지 않는다. 병행 사용한다"
  - id: NGOAL-03
    title: "LLM 이 업무 DB·WAS 에 직접 접근하지 않는다"
    why: "실행 주체는 항상 agent 다"
    traces_to: [PRN-02]
  - id: NGOAL-04
    title: "특정 업무 도메인 전용 기능을 내장하지 않는다"
    why: "업무 지식은 코드가 아닌 설정으로 표현한다"
    traces_to: [PRN-08]
  - id: NGOAL-05
    title: "데이터 웨어하우스 구축 자체는 범위가 아니다"
    why: "연동 대상으로만 취급한다"
  - id: NGOAL-06
    title: "멀티테넌시를 지원하지 않는다"
    why: "다중 시스템 연동은 한 고객사 내부에 한한다. 고객사당 독립 구축·독립 운영을 전제하며, 하나의 배포가 여러 고객사를 수용하지 않는다"
  - id: NGOAL-07
    title: "모바일 웹·앱을 제공하지 않는다"
    why: "PC 브라우저 환경만 지원한다"
  - id: NGOAL-08
    title: "비 HTTP 연동 프로토콜을 지원하지 않는다"
    why: "실행 연동은 HTTP/HTTPS 표준 REST 하나로 고정하고, 그 외 수단(SOAP·gRPC·메시지 큐·소켓·파일 인터페이스)은 고객사가 REST 어댑터를 제공하는 것을 연동 전제로 한다"
  - id: NGOAL-09
    title: "저장된 조회를 사용자 간에 공유하지 않는다"
    why: "정의를 공유하면 실행은 각자의 권한으로 이루어져야 하고, 같은 위젯이 사람마다 다른 결과를 보이거나 누군가에게는 거부된다. 그 이유도 존재 은닉(REQ-101) 때문에 설명할 수 없다. 조직 차원의 공유는 **인증 예제 쿼리로의 승격**으로 처리한다"
  - id: NGOAL-10
    title: "조회 결과를 서버에서 파일로 생성하지 않는다"
    why: "표시 상한 안의 결과는 전량 브라우저로 전달되므로, 엑셀·이미지 내보내기는 그리드·차트 컴포넌트의 클라이언트 기능으로 제공한다. 서버가 파일을 만들 이유가 없다"

# ── 성공 기준 ────────────────────────────────────────────────
# **셋만 둔다**(G0 — 3개 이내). 사용자가 정확성·유효성·절제를 택했다(2026-09-05).
# **목표 수치를 미리 세우지 않는 것이 방침이다**(사용자 결정 2026-09-05).
# 순서는 *측정 방법을 만든다 → 정확히 잰다 → 개선이 필요한지 판단한다* 이며,
# 그래서 `target: null` 은 **빠진 것이 아니라 아직 재지 않았다는 뜻**이다.
# 재기 전에 세운 목표는 근거가 없고, 근거 없는 목표는 게이트에서 협상 대상이 된다.
# 동시 처리량·큐잉 정책·인스턴스 수 산정은 실측값을 근거로 결정한다(ASM-002).
measurement_first: true
success_criteria:
  - id: SUC-02
    axis: 정확성
    rank: 1
    metrics: "평가셋 기준 정확도(단계별·전체) · **오답률** — 잘못된 결과를 정답처럼 제시한 비율"
    target: null
    why_first: >-
      **오답을 정답처럼 내는 순간 사용자는 원래 화면을 다시 연다.** 그러면 창구가 하나
      늘어난 것에 그치고 나머지 지표가 아무리 좋아도 도입이 실패한다(ACT-001 note).
  - id: SUC-01
    axis: 유효성
    rank: 2
    metrics: "자연어 질의 처리 성공률 · 화면을 열지 않고 완료한 업무 비율 · **시스템 경계를 넘는 조회·대조 건수**(ECO-01 이 실제로 발생하는지)"
    target: null
    note: "**세 번째 지표가 헌장의 효용 주장을 검증한다** — 경계를 넘는 일이 실제로 일어나지 않는 조직에서는 이 제품의 값이 나오지 않는다"
  - id: SUC-03
    axis: 절제
    rank: 3
    metrics: "확신이 없을 때 추측하지 않고 확인을 요구하거나 처리 불가로 응답한 비율"
    target: null
    note: "**이 값은 실패로 집계하지 않는다.** 지표에서 빼면 구현이 정확도를 올리려고 추측하게 된다"
    traces_to: [REQ-025]

# ── 지표 — 성공 기준은 아니지만 계속 잰다 ──────────────────────────
# 성공 기준을 셋으로 좁히면서 버린 것이 아니라 **판정의 축에서 내린 것**이다.
# 재는 것은 그대로이고, 게이트의 통과 여부를 이것으로 가르지 않는다.
tracked_metrics:
  - id: MET-01
    axis: 자동화
    metrics: "워크플로우로 대체된 반복 업무 건수와 절감 시간"
    was: SUC-04
    why_demoted: "GOAL-3(로드맵 P3)에 가야 값이 나온다. 1차 출시에서 이것으로 성패를 가르면 아직 만들지 않은 것으로 판정하게 된다"
  - id: MET-02
    axis: 비용
    metrics: "질의당 평균 토큰·비용 · 등급별 쿼터 초과율"
    was: SUC-06
    why_demoted: "운영 관리 지표다. 목표치는 NFR 이 갖는다"
  - id: MET-03
    axis: 응답성
    metrics: "질의 접수부터 첫 응답까지 지연 · 전체 처리 완료 시간"
    was: SUC-07
    why_demoted: "NFR 의 성능 목표와 같은 것을 두 곳에서 재고 있었다. 정본은 21-nfr.yaml 이다"
    open_risk: >-
      **G0 레드팀이 지적했고, 사용자가 답해 성격이 바뀌었다(2026-09-05).** 성공 기준에서
      내렸는데 정본이라던 `21-nfr.yaml` 의 목표가 전부 null 이라 *지금은 응답성을
      아무도 판정하지 않는다* 고 지적했다. 답은 **목표를 먼저 세우지 않는다** 였다 —
      재는 것을 먼저 만들고, 정확히 잰 뒤에, 개선이 필요한지 판단한다(`measurement_first`).
      **그러므로 지금 비어 있어야 하는 것은 목표이지 측정이 아니다.** 남은 위험은 하나로
      좁혀진다: *측정 자체를 안 만들면* 판단할 근거가 영영 생기지 않는다.
      **이 일의 주인은 ASM-002 다** — 표는 거기 하나만 단다.
      **2026-09-10 에 받는 자리가 섰다** — `NFR-006`~`NFR-009`. 이제 남은 위험은
      *설계한 측정을 P4 에서 실제로 심지 않는 것* 하나이며, 그 기한은 `21-nfr.yaml` 이 갖는다.

# ── 불변식 — 목표가 아니라 조건이다 ────────────────────────────────
# 옛 SUC-05(안전성)다. **달성을 목표로 하는 값이 아니라 어겨지면 안 되는 값**이라
# 성공 기준에서 뺐다 — 성공 기준은 못 미치면 아쉬운 것이고 이것은 못 미치면 멈춘다.
invariants:
  - id: INV-01
    what: "권한 위반·미승인 실행 **0건** · 감사 이력 누락 **0건** · 개인정보 열람 건의 정보주체 추적 가능률 **100%**"
    was: SUC-05
    traces_to: [ECO-05, REQ-103, REQ-107, REQ-111]
    note: "**이 셋 중 하나라도 깨지면 그 시점에 배포를 멈춘다.** 요구사항과 NFR 의 보안 항목이 이것을 구현으로 옮긴다"

success_notes:
  - "**자율 처리 비율은 단독 목표가 아니다.** 처리한 것의 정확도가 낮으면 사용자는 결과를 검증하기 위해 원래 화면을 다시 열게 되고, 자동화율은 높은데 실제 절감은 없는 상태가 된다. 목표는 '많이 처리한다' 가 아니라 '처리한 것을 믿을 수 있다' 이며, 지표의 우선순위도 **정확성·절제가 유효성보다 앞선다**"
  - "**효과는 도입 전 기준선과의 대조로만 측정된다.** 적용 대상 업무의 현행 처리 시간과 건수를 착수 시 확보하지 못하면 이후 어떤 수치가 나와도 개선을 증명할 수 없다"

# ── 로드맵 ──────────────────────────────────────────────────
# 각 Phase 는 보안·성능 정책을 **처음부터** 만족해야 한다. 정책은 후행 과제로 미루지 않는다.
roadmap:
  - id: RM-P1
    title: "P1 — 조회"
    goal: GOAL-1
    includes: "채팅 기본 · 세션·컨텍스트 · 중단·재시도 · 대화 이력 논리 삭제 · 데이터소스·스키마 카탈로그(사실 자동 수집) · 권장 조인 경로·기본 필터 · 사용자 그룹과 그룹 매핑 · SQL 생성·검증·실행 · 마스킹 · 그리드·차트·다운로드 · 이력 기록 · 프롬프트·지식 관리 · 품질 신고·처리 · 토큰 집계 · 업무 도메인·인증 예제 쿼리 · 조회 계획 제시와 교정 · 평가셋·회귀 평가 · 레거시 딥링크 진입 · 질의 즐겨찾기 · 턴 실행 점유 · 처리 중 입력의 의도 분류와 네 갈래 분기 · 되돌림과 회차"
    excludes: "업무 API 호출 · 워크플로우 · 스케줄 · 저장된 조회·대시보드"
  - id: RM-P2
    title: "P2 — 실행"
    goal: GOAL-2
    includes: "API 등록·그룹 매핑(조회·실행) · 응답 스키마 등록과 경로 단위 개인정보 통제 · 커스텀 도구 기반 · 승인 필요 액션 · 실행 이력 · 실행 중 중단 시 액션 처리 방침 · 내 접근 가능 데이터·툴 목록 조회 · 저장된 조회·개인 대시보드"
    excludes: "워크플로우 정의 · 스케줄"
  - id: RM-P3
    title: "P3 — 자동화"
    goal: GOAL-3
    includes: "워크플로우 설정 화면 · 워크플로우 정의·실행 · 스케줄러·잡 관리 · 알림 발송"
    excludes: "—"
  - id: RM-P4
    title: "P4 — 개인화 심화·운영 고도화"
    goal: GOAL-4
    includes: "개인 기본 지시 고도화 · 담당 업무·할 일 정의 · 감사·통계·정산 고도화 · 쿼터 신청·승인 자동화 · 질의·응답 다국어 처리"
    excludes: "—"

roadmap_notes:
  - "**턴의 실행 기반(상태·회차 · 실행 점유 · 처리 중 입력 처리)은 P1 에서 세운다.** 이력 스키마와 오케스트레이션 구조를 함께 규정하므로 나중에 얹을 수 없다"
  - "**로드맵의 P1~P4 는 제품 출시 단계이고, 방법론의 P0~P6 은 개발 단계다.** 둘은 다른 축이다 — 로드맵 P1 하나를 만들기 위해 방법론 P0~P6 을 한 바퀴 돈다"

# ── 기대치 정렬 (G0 · aidd-guide/process/11-verification-cost.md §2) ──
expectations:
  user_priority: balanced
  aligned_at: 2026-09-05
  j_curve_explained: true
  what_was_said: >-
    처음이 느리고 중간이 빠르고 끝이 다시 느리다. 설계 확정까지는 돌아가는 화면이 없고,
    구현 구간에서 기능이 빠르게 쌓이며, 검증 구간에서 다시 느려진다. **AI 를 쓴다고 총
    기간이 줄지는 않을 수 있다** — 줄어드는 것은 문서를 쓰는 시간이고 늘어나는 것은
    확인하는 시간이다.
  what_it_means: >-
    **균형**이다. 게이트는 지키되 산출물의 깊이를 상황에 맞춘다. 절차를 줄이자는 판단이
    나올 때 AI 가 *지금 줄일 수 있다 / 절대 안 된다 / 지금은 빨라도 나중에 비싸다* 셋으로
    나눠 제시하고 사용자가 고른다(aidd-guide/process/12-scope-reduction.md).

