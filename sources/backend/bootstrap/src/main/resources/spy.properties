# P6Spy — 28 §2 · ADR-0011.
#
# 감싸는 일은 SqlLogConfig 가 한다(스타터를 쓰지 않는다 — 28 §2.0). 이 파일은 P6Spy 가
# 자기 로그를 어떤 모양으로 낼지만 정한다.
#
# 이 파일이 켜고 끄는 스위치는 아니다. app.logging.sql.enabled 가 꺼져 있으면 DataSource
# 를 감싸지 않으므로 여기 무엇을 적어도 아무 일도 일어나지 않는다.

# 우리 포맷터 — 값이 박힌 SQL 한 줄 + 소요시간 + (설정 시) 호출 경로.
logMessageFormat=com.aiagent.support.logging.SqlLogFormat

# 걸러 낸 SQL 에 빈 줄이 남지 않게 한다.
appender=com.aiagent.support.logging.SqlLogAppender

# 로거 이름 — logging.level.p6spy 로 끌 수 있다.
customLogMessageFormat=

# result/resultset 은 행마다 한 줄이라 그리드 한 장에 수백 줄이 된다.
# commit/rollback 은 SQL 이 없어 우리 포맷터가 빈 줄을 낸다 — 아예 만들지 않는다.
excludecategories=info,debug,result,resultset,commit,rollback
