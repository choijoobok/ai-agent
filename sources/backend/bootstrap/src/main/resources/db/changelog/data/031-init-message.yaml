# 메시지 값 23차 — 사람 소유 시드다(22 §1.1).
#
# 라이트 바탕의 흰색 농도(51 §9.7). 모드의 네 번째 칸이 아니라 <b>다른 축</b>이라 이름도
# 모드의 말투("라이트 · 다크")를 쓰지 않는다 — 같은 말투로 적으면 사용자가 둘 중 하나를
# 고르는 것으로 읽는다.
#
# 이 파일은 만든 날 안에서 한 번 고쳐졌다(흰색·회색 두 칸 → 농도 눈금). 적용된 적이
# 없어 새 번호를 두지 않았다 — 22 §1.1 이 막는 것은 <b>이미 적용된</b> 체인지셋을 고치는
# 것이다. settings.lightBase* 세 키는 코드에 존재한 적이 없는 것이 된다.
databaseChangeLog:
  - changeSet:
      id: data-031-message
      author: template
      comment: 라이트 바탕의 흰색 농도 ko·en — 51 §9.7
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/031-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-031-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
