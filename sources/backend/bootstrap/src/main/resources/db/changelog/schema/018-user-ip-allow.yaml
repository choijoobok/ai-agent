# 접속 IP 허용 — 41 §7(AUTH-08, S).
#
# 40 §35 행이 "모델링 중 신설" 로 잡아 두고 41 §7 이 컬럼 넷을 낸 뒤로 비어 있던 자리다.
# 61 §3.8 의 탭 3 이 이 테이블을 원천으로 갖는다 — 화면이 서니 테이블이 필요해졌다.
#
# 행이 없으면 제한 없음이다(41 §7). 빈 화이트리스트를 전면 차단으로 읽으면 운영 사고가
# 되고, 그 사고는 관리자 계정에서 난다 — 이 기능을 쓰는 계정이 정확히 그것이다.
# 그래서 DDL 에는 아무 제약도 없다: "행이 없음" 과 "전부 꺼짐" 을 DB 가 구분하지 않는다.
#
# USE_YN 이 있는 이유는 지우지 않고 끄기 위해서다. 사무실 이전처럼 잠시 막았다 여는 일이
# 있고, 지웠다 다시 넣으면 그 IP 를 누가 언제 넣었는지(감사 4컬럼)가 사라진다.
#
# IP_CIDR 이 PK 에 있다 — 같은 사용자에게 같은 대역을 두 번 넣을 수 없다. 대리키를 두면
# 중복 행이 생기고, 그때 하나만 끄면 나머지가 살아 있어 "껐는데 들어와진다" 가 된다.
# 길이 45 는 IPv6 최대 표기(39자) + /128 여유이며 SYS_LO_LOGIN.CLIENT_IP 와 같다(45 §5).
#
# FK 를 건다(41 §8) — 사용자가 사라지면 허용 대역도 뜻을 잃는다. 41 §9 의 "이력에는 걸지
# 않는다" 는 예외에 들지 않는다: 이것은 이력이 아니라 계정에 매인 설정이다.
databaseChangeLog:
  - changeSet:
      id: 018-create-sys-user-ip-allow
      author: template
      comment: 행이 없으면 제한 없음이다 — 빈 화이트리스트가 전면 차단이면 운영 사고가 된다(41 §7)
      changes:
        - createTable:
            tableName: SYS_USER_IP_ALLOW
            columns:
              - column:
                  name: USER_ID
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_USER_IP_ALLOW
                    nullable: false
              # 단일 IP(192.168.0.10) 또는 CIDR(10.0.0.0/8). 형식 검증은 애플리케이션이
              # 한다 — 벤더 중립 DDL 에 CHECK 정규식을 둘 수 없고(22 §4), 둘 수 있어도
              # IPv6 축약까지 정규식으로 맞추는 것은 저장 시 파싱보다 약하다.
              - column:
                  name: IP_CIDR
                  type: VARCHAR(45)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_USER_IP_ALLOW
                    nullable: false
              # 지우지 않고 끈다. 꺼진 행은 판정에 참여하지 않으며, 한 사용자의 행이
              # 전부 꺼져 있으면 그것은 "행이 없음" 과 같다 — 제한 없음이다.
              - column:
                  name: USE_YN
                  type: CHAR(1)
                  defaultValue: 'Y'
                  constraints:
                    nullable: false
              - column:
                  name: REG_ID
                  type: VARCHAR(50)
              - column:
                  name: REG_DTM
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: MOD_ID
                  type: VARCHAR(50)
              - column:
                  name: MOD_DTM
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 018-fk-sys-user-ip-allow
      author: template
      comment: 계정에 매인 설정이므로 FK 를 건다 — 41 §8
      changes:
        - addForeignKeyConstraint:
            constraintName: FK_SYS_USER_IP_ALLOW_01
            baseTableName: SYS_USER_IP_ALLOW
            baseColumnNames: USER_ID
            referencedTableName: SYS_USER
            referencedColumnNames: USER_ID
