# 메시지 값 — 알림 모달 3탭과 공지 팝업의 문구 32키. 사람 소유 시드다(22 §1.1).
#
# 073 은 메뉴 둘(NOTICE_MGMT · NOTI_REQUEST)의 문구였고 여기는 **메뉴 밖 화면**의
# 것이다(60 §1). 앞 파일의 CSV 를 고치지 않고 새로 여는 이유는 같다 — 적재된 changeset 을
# 고치면 Liquibase 가 체크섬 불일치로 기동을 거부한다.
#
# ── 오류 셋이 앞에 있다 ─────────────────────────────────────────────────
#
# err.noti-inbox.not-found 는 **남의 것과 없는 것을 같은 말로** 답한다. 갈라 말하면
# 그 번호가 실재한다는 사실을 알려 주게 되고, 알림은 사람마다 행이 다르므로(47 §7)
# 그 사실 자체가 정보다.
#
# err.noti-req.duplicate 는 **왜 막혔는지**를 말한다 — "또 내도 빨라지지 않는다" 가
# 요점이며, 워크플로가 없으므로(01 §2) 한 번 내면 답이 올 때까지 그대로다.
#
# ── 라벨 넷이 생산자다 ──────────────────────────────────────────────────
#
#   noti.type.*   요청 처리 · 계정 · 권한 · 배치
#
# **값은 코드이고 이 글자는 라벨이다**(54 §5.4 · 47 §10). 공통코드로 두지 않은 것은
# 값이 늘면 **처리 코드가 함께 늘어야** 하기 때문이며, 관리자가 늘리면 처리 코드가 없는
# 값이 생긴다(66 §3.2).
#
# ── 문구 둘이 사실을 말한다 ─────────────────────────────────────────────
#
# notification.mine.gotoDenied 는 **권한**이라고 말한다. "오류" 라고 하면 고장으로 읽히고,
# 실제로는 알림이 가리키는 메뉴의 권한을 잃은 것뿐이다 — **알림이 권한을 주지 않는다**
# (`NI-11` · 10 §H).
#
# notification.request.placeholder 는 **되묻는 단계가 없다**고 미리 알린다(01 §2).
# 그것을 모르고 한 줄만 적으면 반려되고, 반려 사유를 읽고 다시 내야 한다.
#
# notification.notice.empty 는 0건을 **진단으로** 읽히게 한다(64 §3.7) — 게시 중인 것이
# 없는 것이지 기능이 죽은 것이 아니다.
databaseChangeLog:
  - changeSet:
      id: data-074-message
      author: template
      comment: 알림 모달 3탭과 공지 팝업의 문구 32키 — 51 §7 · 60 §8 · §9
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/074-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-074-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
