# 메시지 값 17차 — 사람 소유 시드다(22 §1.1).
#
# 엑셀 다운로드 다섯이다(53 §2.2 · ADR-0019). 버튼은 아이콘만 나가므로 `grid.excel` 은
# 툴팁과 접근성 이름으로만 쓰인다 — 항목이 둘이라 어느 라벨도 대표하지 못한다.
#
# `grid.excel.tooMany` 에 **숫자가 없다**. 응답 문구가 아니라 화면 문구지만 같은 규칙을
# 따랐다 — 상한은 관리자가 바꾸는 값이고, 문구에 박으면 설정과 어긋난 안내가 남는다.
# 대신 **다음에 할 일**(조건을 좁힌다)을 적었다.
databaseChangeLog:
  - changeSet:
      id: data-025-message
      author: template
      comment: 엑셀 다운로드의 ko·en — 53 §2.2
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/025-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-025-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
