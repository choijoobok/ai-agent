# 논리 시퀀스 시드 4차 — SYS_BATCH_HISTORY.
#
# 001 이 "생성 키를 쓰는 테이블이 늘 때마다 여기에 행이 하나 는다" 고 적은 그 자리다.
# 047 이 SYS_LO_ACCESS, 057 이 SYS_LO_EXCEPTION 으로 그것을 했고 이번이 넷째다.
# 이력 테이블이 아니라 배치 이력이지만 생성 키의 규칙은 같다(45 §2.3 · ADR-0015).
#
# 빠뜨리면 조용하다 — 기동도 되고 첫 INSERT 도 성공한다. Hibernate 가 자체 경로로 행을
# 만들기 때문이며, 다중 노드에서 그 순간 경합한다. 배치는 정확히 다중 노드에서 도는
# 것이 전제이므로(31 §7) 여기서 빠뜨리면 드러나는 자리가 가장 나쁘다.
databaseChangeLog:
  - changeSet:
      id: data-065-seq-sys-batch-history
      author: template
      changes:
        - insert:
            tableName: SYS_SEQUENCE
            columns:
              - column:
                  name: SEQ_NAME
                  value: SYS_BATCH_HISTORY
              - column:
                  name: NEXT_VAL
                  valueNumeric: 1
      rollback:
        - delete:
            tableName: SYS_SEQUENCE
            where: SEQ_NAME = 'SYS_BATCH_HISTORY'
