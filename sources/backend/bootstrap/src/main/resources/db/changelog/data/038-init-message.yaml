# 메시지 값 29차 — 사람 소유 시드다(22 §1.1).
#
# 자주 쓰는 메뉴의 근거 둘(UX-16 · 42 §8) — 센 기간과 메뉴별 횟수.
#
# 목록만 보여 주면 "무엇을 기준으로 자주인가" 와 "왜 이 순서인가" 를 알 수 없다. 창의
# 길이는 서버 설정이라 화면이 짐작할 수도 없다 — 센 쪽이 말해야 한다.
#
# 기간은 달 단위다. STAT_YM 이 월 버킷이라 그보다 잘게 말하면 없는 정밀도를 지어내는 것이
# 된다(42 §8).
databaseChangeLog:
  - changeSet:
      id: data-038-message
      author: template
      comment: 자주 쓰는 메뉴의 기간·횟수 ko·en — 42 §8
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/038-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-038-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
