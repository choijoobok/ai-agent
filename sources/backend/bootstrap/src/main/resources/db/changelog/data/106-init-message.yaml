# 메시지 키 개명 — `segment.dirty.content` → `screenTabs.dirty.content`.
#
# 컴포넌트가 `ScreenSegment` 에서 `ScreenTabs` 로 개명될 때(2026-09-02) 이 키만 옛 이름으로
# 남았다. 문서와 코드는 *화면 안 최상단 탭* 을 말하는데 메시지 키는 *세그먼트* 를 가리켜,
# 관리 화면에서 이 키를 찾는 사람이 무엇의 문구인지 알 수 없었다.
#
# ── 개명은 지우고 다시 넣는 것이다 ──────────────────────────────────────
#
# `SYS_MESSAGE_KEY.MSG_KEY` 가 PK 이고 `SYS_MESSAGE` 가 그것을 참조하므로 `update` 로
# 옮기려면 둘의 순서를 잡아야 한다. 행이 셋(키 하나 · 값 둘)뿐이라 **지우고 넣는** 쪽이
# 짧고, 새 키의 행은 `008` 이 이미 소스에서 만든다(ADR-0023) — 여기서는 **값만** 싣는다.
#
# `008` 의 옛 키 줄은 **남는다** — `USE_SCOPE='NONE'` 으로 이어 쓰인다(33 §2.2). 지우려고
# 해 봤고 `SeedMessageTest` 가 막았다: `088` 의 CSV 에 그 키의 값 두 줄이 있고 그 파일은
# 체크섬이 걸려 고칠 수 없으므로, 키를 시드에서 빼면 **기동에서 FK 가 거부한다**. 시드의
# 그 줄은 값 두 줄이 들어올 자리를 지키는 것이다.
#
# 그래서 **런타임에서 지운다**. 순서가 성립한다 — `008`·`088` 이 먼저 넣고 이 파일이
# 지운다. 신규 설치도 기존 DB 도 결과가 같다. 남겨 두면 관리 화면에 같은 문구가 옛 이름과
# 새 이름으로 둘 보이며, 죽은 키 목록에도 영원히 하나가 낀다.
#
# 값은 `099` 가 고친 문구를 그대로 옮긴다 — 탭을 옮겨도 **행은 사라지지 않는다**는 것이
# `ScreenTabs` 가 언마운트하지 않기 때문이며(68 §9.3), 그 사실이 문구에 이미 반영돼 있다.
databaseChangeLog:
  - changeSet:
      id: data-106-drop-segment-key
      author: template
      comment: 옛 키의 값과 키를 지운다 — 값이 먼저다(FK)
      changes:
        - delete:
            tableName: SYS_MESSAGE
            where: MSG_KEY = 'segment.dirty.content'
        - delete:
            tableName: SYS_MESSAGE_KEY
            where: MSG_KEY = 'segment.dirty.content'

  - changeSet:
      id: data-106-message
      author: template
      comment: 개명한 키의 문구 — 099 가 고친 문구를 그대로 옮긴다
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/106-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-106-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
