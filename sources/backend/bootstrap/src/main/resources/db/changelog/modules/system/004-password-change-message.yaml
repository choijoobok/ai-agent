# @feat FEAT-501
# 변경 폼이 구현된 뒤에도 남아 있던 미구현 안내를 교체한다. 사용자 수정 문구는 보존한다.
databaseChangeLog:
  - changeSet:
      id: system-004-password-change-message
      author: codex
      changes:
        - update:
            tableName: SYS_MESSAGE
            columns:
              - column:
                  name: MSG_VAL
                  value: "비밀번호가 초기화되었거나 사용 기간이 만료되었습니다. 아래에서 비밀번호를 변경해 주세요."
            where: "MSG_KEY = 'session.passwordChange.desc' AND LANG_CD = 'ko' AND MSG_VAL = '비밀번호 변경 화면은 아직 없습니다(60 §4).'"
        - update:
            tableName: SYS_MESSAGE
            columns:
              - column:
                  name: MSG_VAL
                  value: "Your password was reset or has expired. Please change it below."
            where: "MSG_KEY = 'session.passwordChange.desc' AND LANG_CD = 'en' AND MSG_VAL = 'The password change screen does not exist yet (60 §4).'"
        - update:
            tableName: SYS_MESSAGE_KEY
            columns:
              - column:
                  name: MSG_DESC
                  value: "초기화·만료된 비밀번호를 변경해야 업무를 계속할 수 있다는 안내."
            where: "MSG_KEY = 'session.passwordChange.desc' AND MSG_DESC = '그 화면이 아직 없다는 안내 — 비밀번호 변경 화면(screen/_standalone/README.md)이 오면 사라진다.'"
      rollback:
        - update:
            tableName: SYS_MESSAGE
            columns:
              - column:
                  name: MSG_VAL
                  value: "비밀번호 변경 화면은 아직 없습니다(60 §4)."
            where: "MSG_KEY = 'session.passwordChange.desc' AND LANG_CD = 'ko' AND MSG_VAL = '비밀번호가 초기화되었거나 사용 기간이 만료되었습니다. 아래에서 비밀번호를 변경해 주세요.'"
        - update:
            tableName: SYS_MESSAGE
            columns:
              - column:
                  name: MSG_VAL
                  value: "The password change screen does not exist yet (60 §4)."
            where: "MSG_KEY = 'session.passwordChange.desc' AND LANG_CD = 'en' AND MSG_VAL = 'Your password was reset or has expired. Please change it below.'"
        - update:
            tableName: SYS_MESSAGE_KEY
            columns:
              - column:
                  name: MSG_DESC
                  value: "그 화면이 아직 없다는 안내 — 비밀번호 변경 화면(screen/_standalone/README.md)이 오면 사라진다."
            where: "MSG_KEY = 'session.passwordChange.desc' AND MSG_DESC = '초기화·만료된 비밀번호를 변경해야 업무를 계속할 수 있다는 안내.'"
