# 메시지 관리 API의 신규 키 생성 거부 문구 — 008 생성 키의 설치용 ko·en 값이다.
#
# 적용된 값 체인지셋은 고치지 않는다. 새 설치와 이미 운영 중인 DB가 같은 문구를 갖도록
# 별도 체인지셋으로 적재하고, 값 변경을 프런트 번들에 알리기 위해 캐시 버전도 올린다.
# 배포를 되돌려야 하면 이 행을 고치거나 버전을 내리지 않고, 새 forward changeset으로 두 언어
# 행을 삭제한 뒤 메시지 버전을 다시 올린다. 캐시 버전은 단조 증가여야 클라이언트가 갱신을 놓치지 않는다.
databaseChangeLog:
  - changeSet:
      id: data-116-message
      author: codex
      comment: 메시지 키 신규 생성 거부 문구 ko·en
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/116-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-116-cache-version
      author: codex
      comment: 값을 넣었으면 메시지 캐시 버전을 올린다 — sys/message.md
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
