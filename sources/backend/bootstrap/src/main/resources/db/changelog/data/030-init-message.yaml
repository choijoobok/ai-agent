# 메시지 값 22차 — 사람 소유 시드다(22 §1.1).
#
# 틀고정 두 값의 뜻이 바뀌었다. 026 에서는 세그먼트 버튼의 글자(`왼쪽`·`오른쪽`)였는데,
# 지금은 **경계선의 이름**이다 — 선 둘의 생김새가 같아 툴팁이 유일한 설명이므로 무엇에
# 대한 왼쪽인지까지 말해야 한다(53 §5).
#
# `grid.settings.pin`(열 머리) · `grid.settings.pin.none`(없음) · `grid.settings.column`
# (컬럼 열 머리) 셋은 코드에서 사라졌다. 008 재생성이 USE_SCOPE='NONE'(죽은 키)으로
# 표시했으며 값 행은 남는다 — 앞의 파일을 손대지 않는 규약 그대로다(33 §2.2).
databaseChangeLog:
  - changeSet:
      id: data-030-pin-left-ko
      author: template
      comment: 세그먼트 글자가 아니라 경계선의 이름이다 — 53 §5
      changes:
        - update:
            tableName: SYS_MESSAGE
            columns:
              - column:
                  name: MSG_VAL
                  value: 왼쪽 틀고정 — 이 선 위가 왼쪽에 고정된다
            where: MSG_KEY = 'grid.settings.pin.left' AND LANG_CD = 'ko'

  - changeSet:
      id: data-030-pin-left-en
      author: template
      comment: 〃
      changes:
        - update:
            tableName: SYS_MESSAGE
            columns:
              - column:
                  name: MSG_VAL
                  value: Freeze left — columns above this line
            where: MSG_KEY = 'grid.settings.pin.left' AND LANG_CD = 'en'

  - changeSet:
      id: data-030-pin-right-ko
      author: template
      comment: 〃
      changes:
        - update:
            tableName: SYS_MESSAGE
            columns:
              - column:
                  name: MSG_VAL
                  value: 오른쪽 틀고정 — 이 선 아래가 오른쪽에 고정된다
            where: MSG_KEY = 'grid.settings.pin.right' AND LANG_CD = 'ko'

  - changeSet:
      id: data-030-pin-right-en
      author: template
      comment: 〃
      changes:
        - update:
            tableName: SYS_MESSAGE
            columns:
              - column:
                  name: MSG_VAL
                  value: Freeze right — columns below this line
            where: MSG_KEY = 'grid.settings.pin.right' AND LANG_CD = 'en'

  - changeSet:
      id: data-030-cache-version
      author: template
      comment: 값을 바꿨으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
