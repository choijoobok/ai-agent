# SYS_MENU.EXPORT_YN — 42 §4 · 52 §4.2 · ADR-0027.
#
# 액션은 매핑된 API 가 말한다(ADR-0020). EXPORT 만 그 말이 닿지 않는다 — 엑셀은
# 프론트가 만들고(ADR-0019) 그래서 SYS_API 행이 없다. 그 결과 52 §4.2 의 액션 열에서
# E 를 가진 메뉴 10개가 **정의되지 않은 액션을 부여받은 상태**로 있었다: 역할 권한
# 화면의 트리에 스위치가 서지 않고, 004 가 준 부여는 고아로 남아 회수할 수단이 없었다.
#
# 그래서 EXPORT 만 메뉴가 직접 선언한다. 이 컬럼이 그 선언이며, 값을 채우는 것은
# 056-menu-export.yaml 이다 — 035 가 003 이 비워 둔 ICON_CD 를 채운 것과 같은 자리다.
#
# 기본값은 'N' 이다. 새 메뉴는 엑셀을 내지 않는 것에서 시작하고, 낼 수 있게 하려면
# 시드가 필요하다 — 매핑을 시드로만 바꾸는 이유와 같다(23 §4). 관리 화면의 저장
# DTO 에도 두지 않으므로 운영에서 켜는 경로가 구조적으로 없다(원칙 P1).
#
# USE_YN 과 층이 다르다. USE_YN 은 유효 권한의 최종 게이트(23 §4 ④)이고 이것은
# **부여할 수 있는 액션의 정의**다 — 끄면 권한이 무효가 되는 것이 아니라 애초에
# 줄 수 없게 된다.
databaseChangeLog:
  - changeSet:
      id: 016-menu-export-yn
      author: template
      comment: EXPORT 는 부를 API 가 없다 — 메뉴가 선언한다(ADR-0027)
      changes:
        - addColumn:
            tableName: SYS_MENU
            columns:
              - column:
                  name: EXPORT_YN
                  type: CHAR(1)
                  defaultValue: "N"
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: SYS_MENU
            columnName: EXPORT_YN
