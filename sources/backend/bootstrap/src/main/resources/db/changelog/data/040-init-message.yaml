# 메시지 값 30차 — 사람 소유 시드다(22 §1.1).
#
# 시스템 환경설정(CONFIG_MGMT · 63 §4)의 컬럼·조회조건·경고와 거부 문구 셋.
#
# 유형 넷(STRING · NUMBER · BOOLEAN · JSON)은 ko·en 이 같다. 필드 타입에서 온 이름이고
# 관리자가 개발자와 같은 말을 쓰는 자리라, 번역하면 화면과 소스가 다른 단어로 같은 것을
# 가리키게 된다(43 §4.4 가 코드값 대신 이름을 보여주라고 한 것과 방향이 다른 경우다).
#
# config.revert.warn 은 **기본값을 함께 말한다**(63 §4.4). 라벨이 *되돌리기* 인 것과 짝이며,
# 값이 사라지는 것이 아니라 yml 이 드러난다는 것을 미리 말해 두지 않으면 되돌린 뒤에도
# 목록에 남은 같은 키가 "지웠는데 그대로다" 로 읽힌다.
databaseChangeLog:
  - changeSet:
      id: data-040-message
      author: template
      comment: 시스템 환경설정 화면의 문구 ko·en — 63 §4
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/040-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-040-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
