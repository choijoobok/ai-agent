# @feat FEAT-501
# 기존 브라우저도 system-004의 수정 문구를 받도록 메시지 번들 버전을 올린다.
databaseChangeLog:
  - changeSet:
      id: system-005-password-change-message-cache
      author: codex
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: "CACHE_NAME = 'message'"
      # 롤백 때도 버전을 증가시켜 이전 문구로의 복원을 새 번들로 인식하게 한다.
      rollback:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: "CACHE_NAME = 'message'"
