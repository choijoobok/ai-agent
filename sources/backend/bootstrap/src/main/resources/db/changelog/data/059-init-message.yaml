# 메시지 값 42차 — 사람 소유 시드다(22 §1.1). 사용자 관리(61 §3)의 문구 전부.
#
# 키 행은 여기 없다. 프론트 MSG · 백엔드 MsgKey 의 값이라 008 이 만들며(ADR-0023),
# 여기서 넣으면 그 파일과 겹쳐 loadData 가 중복 키로 죽는다.
#
# **그리드 실행(grid.action.*) 넷이 함께 들어 있다.** 55 §7 이 *"첫 실행 버튼이 생기는
# 화면이 api.actions[] 를 가져온다"* 고 미뤄 둔 그것이며, 이 화면의 잠금 해제·휴면 해제·
# 비밀번호 초기화가 그 첫 실물이다 — 공용 어휘라 화면 문구와 파일이 갈릴 이유가 없다.
#
# **err.user-admin.* 이 err.user.* 와 별개인 것이 의도다.** 저기는 **본인이** 자기 계정에
# 하는 일의 실패(비밀번호 변경 · 언어)이고 여기는 **관리자가 남의 계정에** 하는 일이다.
# 같은 접두를 쓰면 관리 화면에서 문구를 고치는 사람이 로그인한 사용자 전원이 보는 문구를
# 건드리게 된다.
#
# **user.stat.* 다섯이 공통코드가 아니다**(61 §3.2.1). 서버가 접근 제어 체인으로 계산하는
# 파생값이고 다섯에서 늘 일이 없으므로 메시지 키로 둔다 — 로그인 이력의 결과 코드(052)가
# SYS_CODE 인 것과 갈리는 자리이며, 그쪽은 **소스가 열거형으로 갖는 값**이라 코드다.
#
# **user.issued.* 셋이 61 §6 의 미결 하나를 닫는다.** *메일 발송이 없는 배포에서 임시
# 비밀번호를 화면에 표시할지* — 표시한다. 43 §6.3 이 admin-reset-enabled 를 켜 두며 적은
# 근거가 *"잠긴 계정을 푸는 유일한 경로"* 인데 전달 수단이 없으면 경로가 아니다. 대신
# 문구가 **다시 볼 수 없다**는 것과 **곧 만료된다**는 것을 함께 말한다.
databaseChangeLog:
  - changeSet:
      id: data-059-message
      author: template
      comment: 사용자 관리 — 컬럼 · 조회조건 · 실행 셋 · 발급 모달 · 그리드 실행 공용 넷(61 §3 · 55 §7)
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/059-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-059-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
