# 메시지 값 — 진행률 창이 말하는 것(30 §6 · 46 §8 · 68 §9.1).
#
# 앞의 것을 고치지 않고 파일을 더한다(22 §1.1). loadData 는 CSV 의 내용을 체크섬에 넣으므로
# 087 에 줄을 더하면 그 changeset 이 이미 돈 DB 에서 기동이 죽는다.
#
# ── 왜 세 줄이 더 필요한가 ──────────────────────────────────────────────
#
# 창이 답해야 하는 질문은 하나다 — **기다릴까 접을까**. 퍼센트만으로는 그 결정을 할 수
# 없다: 3초 지난 24% 와 5분 지난 24% 는 답이 정반대다. 그래서 경과 시간이 온다.
#
# progress.count 는 **고친다**(update). 087 이 넣은 값은 `{cur} / {tot}건` 이라 완료율이
# 없었고, 그 숫자는 막대에만 있었다 — 막대의 퍼센트는 눈금이지 값이 아니어서, 사용자가
# 그것을 읽어 보고하거나 남기려면 글자가 있어야 한다. loadData 로 다시 넣을 수는 없다:
# SYS_MESSAGE 의 PK 가 (MSG_KEY, LANG_CD) 라 그 자리에서 PK 충돌이다(055 의 선례).
#
# progress.count.unknown 은 **새 키**다. 전체를 모르는 작업(46 §8)은 나눌 수가 없어
# `{cur} / {tot}` 을 쓸 수 없는데, 그렇다고 줄을 없애면 창에 도는 막대만 남아 **멈춘 것과
# 구별되지 않는다** — 건수라도 올라가는 것이 돌고 있다는 유일한 증거다.
#
# 키는 008 이 소스에서 만든다(ADR-0023) — 여기서 또 넣으면 loadData 가 중복 키로 죽는다.
databaseChangeLog:
  - changeSet:
      id: data-103-message
      author: template
      comment: 전체를 모르는 작업의 건수와 경과 시간 — 30 §6 · 46 §8
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/103-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-103-message-count-percent
      author: template
      comment: 건수 줄에 완료율을 함께 적는다 — 막대의 퍼센트는 눈금이지 값이 아니다
      changes:
        - update:
            tableName: SYS_MESSAGE
            columns:
              - column:
                  name: MSG_VAL
                  value: '{cur} / {tot}건 ({percent}%)'
            where: MSG_KEY = 'progress.count' AND LANG_CD = 'ko'
        - update:
            tableName: SYS_MESSAGE
            columns:
              - column:
                  name: MSG_VAL
                  value: '{cur} / {tot} ({percent}%)'
            where: MSG_KEY = 'progress.count' AND LANG_CD = 'en'

  - changeSet:
      id: data-103-cache-version
      author: template
      comment: 값을 넣고 고쳤으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
