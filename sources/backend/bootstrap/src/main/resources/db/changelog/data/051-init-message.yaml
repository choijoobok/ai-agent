# 메시지 값 38차 — 사람 소유 시드다(22 §1.1).
#
# 역할 관리(62 §3)와 역할 권한 관리(62 §2). 두 화면이 접두 둘을 나눠 갖는다 —
# `role.*` 는 **역할 자체의 생애**(만들고·끄고·지운다)이고 `roleAuth.*` 는 **그 역할이
# 무엇을 할 수 있나**다.
#
# 하단 pane 의 컬럼이 `role.col.*` 하나로 모여 있는 것이 62 §3.4 의 결과다 — 두 화면이
# **같은 그리드**를 쓰고 제목만 다르다(*보유 사용자* · *영향 인원*).
#
# 이 묶음의 문구 셋이 특히 길다 — `role.disable.impact` · `role.disable.blocked` ·
# `roleAuth.save.*` 다. 23 §4 가 **공집합이 되는 인원은 다음 로그인부터 차단되므로
# 관리자가 모르고 지나가면 안 된다**고 요구한 것이며, 건수만 내면 *"그 몇 명이 누구지"* 를
# 찾으러 다른 화면에 가야 한다.
databaseChangeLog:
  - changeSet:
      id: data-051-message
      author: template
      comment: 역할 관리 · 역할 권한 관리 — 62 §2 · §3
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/051-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-051-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
