# 메시지 값 — 저장 실패 표의 머리 셋과 경합(409) 문구.
#
# 앞의 것을 고치지 않고 파일을 더한다(playbook/changeset.md). loadData 는 CSV 의 내용을
# 체크섬에 넣으므로 107 에 줄을 더하면 그 changeset 이 이미 돈 DB 에서 기동이 죽는다.
#
# 키는 008 이 소스에서 만든다(ADR-0023) — 여기서 또 넣으면 loadData 가 중복 키로 죽는다.
#
# ── 표의 머리가 문구인 것이 결정이다 ────────────────────────────────────
#
# `컬럼` · `값` · `사유` 를 소스에 박지 않는다(CLAUDE.md §5-6). 짧다고 예외를 두면 다국어에
# 구멍이 나며, 구멍이 난 사실은 **한국어로 쓰는 동안 보이지 않는다**.
#
# ── err.conflict 가 *다시 조회하세요* 로 끝난다 ─────────────────────────
#
# 이 실패는 **입력이 틀린 것이 아니다** — 읽은 뒤 쓰기 전에 남이 먼저 썼을 뿐이라, 같은
# 값을 다시 넣어도 또 막힌다. 사용자가 할 일은 고치는 것이 아니라 *지금 무엇이 있는지
# 다시 보는 것* 이고, 문구가 그것을 말하지 않으면 사용자는 저장을 반복한다.
databaseChangeLog:
  - changeSet:
      id: data-109-message
      author: template
      comment: 저장 실패 표의 머리 셋 · 경합 문구 — frontend/grid.md ④ · backend/api.md
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/109-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-109-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — sys/message.md
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
