# 메시지 값 18차 — 사람 소유 시드다(22 §1.1).
#
# 그리드 설정 창 열셋이다(UX-06 · 53 §5).
#
# 제목이 `그리드 설정` 이 아니라 `컬럼 설정` 인 것은 **버튼 이름과 창 제목이 다른 일을**
# 하기 때문이다 — 버튼은 *무엇을 여는가*(그리드 설정), 창은 *무엇을 다루는가*(컬럼)를
# 말한다. 전역 설정 모달(51 §9)과 헷갈리지 않게 하는 것도 제목 쪽의 일이다.
#
# `틀고정` 은 이 판의 관례어다. `고정` 만 두면 *값 고정* 으로도 읽히고, 엑셀을 쓰는
# 사람에게는 틀고정이 이미 아는 말이다.
databaseChangeLog:
  - changeSet:
      id: data-026-message
      author: template
      comment: 그리드 설정 창의 ko·en — UX-06 · 53 §5
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/026-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-026-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
