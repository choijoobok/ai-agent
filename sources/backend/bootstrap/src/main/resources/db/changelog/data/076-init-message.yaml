# 메시지 값 — 화면 보완 여섯 자리의 문구 9키. 사람 소유 시드다(22 §1.1).
#
# 075 까지가 기능이 서면서 생긴 문구였고, 여기는 **이미 서 있는 화면을 다시 보며** 생긴
# 것들이다. 앞 파일의 CSV 를 고치지 않고 새로 여는 이유는 같다 — 적재된 changeset 을
# 고치면 Liquibase 가 체크섬 불일치로 기동을 거부한다.
#
# ── 연산자 하나 ─────────────────────────────────────────────────────────
#
# search.op.lte 는 크기 계열의 셋째다(57 §3.4). 기간 칸에서 **한쪽만 아는 조건**이 실제로
# 흔하다 — "이 날짜 이후로 한 번도 안 들어온 계정" 이 그것이며, 범위로 쓰려면 반대쪽 끝에
# 사람이 아무 값이나 넣어야 하고 그 값이 곧 조건이 된다.
#
# 글자가 `이하` 다. `<=` 를 그대로 쓰지 않는 것은 기호가 이미 버튼에 있기 때문이다 —
# 드롭다운은 그 기호의 **이름**을 내는 자리다(57 §3.4).
#
# ── 허용 IP 의 기간 ─────────────────────────────────────────────────────
#
# 컬럼 이름이 `허용 시작`·`허용 종료` 다. `시작일`·`종료일` 로 두면 같은 그리드의 감사
# 컬럼(등록일시·수정일시)과 뜻이 섞이고, 무엇의 기간인지를 말하지 않는다.
#
# 툴팁이 **셋을 말한다** — 비우면 제한 없음, 서버 기준 날짜, 양끝 포함(40 §4.3).
# 이 셋은 값을 보고는 알 수 없고, 틀리게 짐작하면 접근이 하루 넓거나 좁아진다.
#
# ── 활성 세션의 출처 ────────────────────────────────────────────────────
#
# `브라우저` 다. `User-Agent` 를 그대로 쓰지 않는 것은 그 글자가 **값 안에 이미** 있어서다
# (`Mozilla/5.0 …`) — 헤더가 값의 형식을 되풀이하면 아무것도 더 말하지 않는다.
#
# 툴팁이 출처를 밝힌다(64 §3.2.1 과 같은 규약). 세션 스토어에는 없는 값이며 로그인 이력에서
# 오므로, 그 사실이 값의 옆에 없으면 **빈 칸이 결함으로** 읽히고 채워진 칸은 세션이 들고
# 있는 사실처럼 읽힌다.
#
# ── 검증 실패의 목록 두 줄 ────────────────────────────────────────────────
#
# 56 §3.3 ④ 는 여러 건이면 목록 이라고 적었는데 구현은 건수만 냈다. 건수는 얼마나를
# 말할 뿐이라 무엇이 틀렸는지를 말하지 못한다 — IP 형식이 아닌 값을 넣으면 테두리만
# 빨개지고 이유가 어디에도 없었다(2026-08-31 실물).
#
# grid.validation.line 이 컬럼 이름과 문구를 잇는다. 행 번호를 넣지 않는 것은 화면의
# 번호가 보이는 자리에서 나오기 때문이다 — 클라이언트 정렬이 걸린 판에서는 우리가 센
# 순서와 어긋나고, 틀린 번호는 없는 번호보다 나쁘다.
#
# 자리표 둘 다 값이라 번역이 갈리지 않는다 — ko 와 en 이 같은 문자열이다. 그래도 두
# 언어를 다 넣는 것은, 한쪽이 없으면 그 언어에서 키가 그대로 보이기 때문이다(43 §7.3).
databaseChangeLog:
  - changeSet:
      id: data-076-message
      author: template
      comment: 화면 보완 여섯 자리의 문구 9키 — 56 §3.3 · 57 §3.4 · 61 §3.3 · §3.8
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/076-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-076-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
