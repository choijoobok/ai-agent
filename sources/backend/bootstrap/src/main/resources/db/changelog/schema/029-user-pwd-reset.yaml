# 분실 비밀번호 자기 재설정의 토큰 — AUTH-07 · docs/screen/login/requirements.md §3-1 · §6-3.
#
# 요건서가 이 표를 "없다 — 새 changeset" 으로 적어 두었고(§8), 미리 만들어 두지 않은 것이
# 규약이었다: 쓰지 않는 DDL 은 "됐다" 로 보이지만 한 번도 돌아 본 적이 없다. 재설정 3단계를
# 만드는 이 슬라이스가 만든다.
#
# ── 사용자당 한 행이다 ──────────────────────────────────────────────────
#
# USER_ID 가 단독 PK 이므로 재요청은 덮어쓴다. 발급 이력이 아니라 **지금 유효한 토큰 하나**
# 를 담는 표이며, 그래서 시퀀스도 청소 배치도 없다 — 다음 발급이 옛 행을 밀어낸다.
#
# 이력이 필요하지 않은 이유는 로그인 이력이 그 자리를 이미 갖기 때문이다(45 §5). 여기에
# 이력을 쌓으면 **토큰 해시가 계정마다 여러 줄 남고**, 그것은 지켜야 할 것이 늘어나는 쪽이다.
#
# ── 메일 주소 컬럼이 없다 ───────────────────────────────────────────────
#
# 서버가 SYS_USER.EMAIL 에서 찾는다(요건서 §6-3). 여기에 복사해 두면 발급 시점과 발송 시점의
# 주소가 갈릴 수 있고, 무엇보다 **입력받지 않는 값을 저장할 자리**가 생긴다.
#
# ── TOKEN_HASH 는 평문을 담지 않는다 ────────────────────────────────────
#
# 6자리는 100만 조합이라 DB 를 읽을 수 있는 사람에게 해시는 절대적 방어가 아니다. 그래서
# 방어가 셋이다 — 해시 · 10분 만료 · 5회 시도 한도(AuthPasswordProps.Reset). 평문으로 두면
# 셋 중 하나가 통째로 사라진다.
#
# ── FK 를 건다 ──────────────────────────────────────────────────────────
#
# 41 §8 의 기본이며 018(IP 허용)과 같은 판단이다. 이것은 이력이 아니라 **계정에 매인 일시적
# 상태**라 계정이 사라지면 뜻을 잃는다.
databaseChangeLog:
  - changeSet:
      id: 029-create-sys-user-pwd-reset
      author: template
      comment: 지금 유효한 재설정 토큰 하나 — 사용자당 한 행이며 재요청이 덮어쓴다(AUTH-07)
      changes:
        - createTable:
            tableName: SYS_USER_PWD_RESET
            columns:
              - column:
                  name: USER_ID
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_USER_PWD_RESET
                    nullable: false
              # BCrypt 해시. SYS_USER.PWD 와 같은 길이(100)이며 같은 PasswordEncoder 가
              # 만든다 — 알고리즘을 옮기는 날 두 컬럼이 함께 옮겨진다(23 §6).
              - column:
                  name: TOKEN_HASH
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              # 재발송 쿨다운의 기준(reset.request-cooldown-seconds). 만료 시각에서
              # 역산하지 않는 것은 유효 시간 설정을 바꾸면 옛 행의 역산이 틀어지기 때문이다.
              - column:
                  name: ISSUE_DTM
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              # 계산이 아니라 값이다 — 발급 시점의 정책(reset.token-valid-minutes)으로 굳힌다.
              # 운영이 10분을 30분으로 바꿔도 **이미 나간 메일이 말한 시각**이 정답이다.
              - column:
                  name: EXPIRE_DTM
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              # 틀린 횟수. 한도에 닿으면 이 행을 즉시 만료시킨다(요건서 §6-5) — 지우지 않는
              # 것은 쿨다운의 기준(ISSUE_DTM)이 남아 있어야 재요청 폭주를 막기 때문이다.
              - column:
                  name: TRY_CNT
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              # 쓴 토큰을 지우지 않고 표시한다. 지우면 "쓴 적 없음" 과 구분되지 않아
              # 같은 코드로 두 번 바꾸는 경로가 재요청 쿨다운을 지나지 않는다.
              - column:
                  name: USED_YN
                  type: CHAR(1)
                  defaultValue: 'N'
                  constraints:
                    nullable: false

  - changeSet:
      id: 029-fk-sys-user-pwd-reset
      author: template
      comment: 계정에 매인 일시적 상태다 — 이력이 아니므로 FK 를 건다(41 §8)
      changes:
        - addForeignKeyConstraint:
            constraintName: FK_SYS_USER_PWD_RESET_01
            baseTableName: SYS_USER_PWD_RESET
            baseColumnNames: USER_ID
            referencedTableName: SYS_USER
            referencedColumnNames: USER_ID
