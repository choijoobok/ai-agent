# 메시지 값 36차 — 사람 소유 시드다(22 §1.1).
#
# 사용 이력(64 §3)과 그것이 데려온 공통 어휘 셋.
#
# 이 묶음에도 저장·삭제·확인 문구가 하나도 없다 — 이력 행은 불변이고(64 §2.1) 화면에
# 쓰기 경로가 아예 없기 때문이다. 있는 것은 컬럼 이름과 조회조건, 그리고 **말해 주지
# 않으면 오독되는 것 넷**이다.
#
#   accessLog.anonymous          빈칸으로 두면 "수집이 안 된 것" 과 구분되지 않는다
#   accessLog.noMenu             〃 — 메뉴 문맥 없는 요청은 정상이다(64 §3.2.1)
#   accessLog.menu.clientClaim   말하지 않으면 메뉴별 집계가 감사 근거로 인용된다
#   accessLog.payload.truncated  말하지 않으면 잘린 JSON 이 "저장이 깨졌다" 로 읽힌다
#
# accessLog.empty 가 보존 기간을 함께 말하는 것도 같은 이유다 — 0건에는 언제나 이유가
# 있고, 조건이 좁은 것과 거기 데이터가 없는 것은 다른 사실이다(64 §3.7).
#
# 공통 어휘 넷이 함께 온다. grid.footer.loaded 는 커서형 푸터의 왼쪽이며 grid.footer.total
# 과 다른 말이다 — 저것은 "전부가 몇 건" 이고 이것은 "이 장이 몇 건" 이다. search.op.between
# 은 크기 계열 연산자의 첫 실물이고(57 §3.4), 나머지 둘은 폼이 조회를 막는 두 경우다.
databaseChangeLog:
  - changeSet:
      id: data-049-message
      author: template
      comment: 사용 이력 — 64 §3
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/049-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-049-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
