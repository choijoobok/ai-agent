# 메시지 값 19차 — 사람 소유 시드다(22 §1.1).
#
# `search.op.in` 의 이름을 고친다. 021 에서 `포함` 으로 두었는데 `search.op.contains` 도
# `포함` 이었다 — **한 드롭다운에 같은 이름이 둘** 이었고, 둘은 전혀 다른 연산자다:
# contains 는 *문자열의 일부* 이고 in 은 *고른 값들 중 하나* 다.
#
# `여럿 중 하나` 로 둔다. `IN` 은 SQL 을 모르는 운영자에게 뜻이 닫히지 않고, `목록 포함`
# 은 다시 `포함` 을 끌고 온다. en 은 형제들(`is`, `is not`, `starts with`)에 맞춰 소문자다.
databaseChangeLog:
  - changeSet:
      id: data-027-op-in-ko
      author: template
      comment: 한 드롭다운에 `포함` 이 둘이었다 — 57 §3.4
      changes:
        - update:
            tableName: SYS_MESSAGE
            columns:
              - column:
                  name: MSG_VAL
                  value: 여럿 중 하나
            where: MSG_KEY = 'search.op.in' AND LANG_CD = 'ko'

  - changeSet:
      id: data-027-op-in-en
      author: template
      comment: 형제 연산자들과 대소문자를 맞춘다
      changes:
        - update:
            tableName: SYS_MESSAGE
            columns:
              - column:
                  name: MSG_VAL
                  value: is one of
            where: MSG_KEY = 'search.op.in' AND LANG_CD = 'en'

  - changeSet:
      id: data-027-cache-version
      author: template
      comment: 값을 바꿨으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
