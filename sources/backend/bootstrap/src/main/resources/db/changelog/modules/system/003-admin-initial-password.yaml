# @feat FEAT-501
# UC-501 / TC-5016: 설치 계정 admin / admin은 본인 비밀번호 변경 전 업무 접근을 금지한다.
# 기존 기준선은 수정하지 않는다. 비밀번호가 이미 변경된 계정과 다른 계정은 보존한다.
databaseChangeLog:
  - changeSet:
      id: system-003-admin-initial-password
      author: codex
      changes:
        - update:
            tableName: SYS_USER
            columns:
              - column:
                  name: PWD
                  value: "{bcrypt}$2a$10$K4FWozmK6P.1juIcNjvnjuUzPE03BS.wAfpk.rAePOLgFLeBo4sEi"
              - column:
                  name: PWD_INIT_YN
                  value: "Y"
              - column:
                  name: PWD_CHG_DTM
                  valueComputed: "NULL"
            where: "USER_ID = 'admin' AND PWD = '{bcrypt}$2a$10$EvYM6dfQuT0zVHd/sHdCD.4vdyGIFaMSRaQ1oUY0FNcMkLQEnRfa6'"
        # 위 보정으로 행을 잠근 뒤 대상의 기존 정상 세션을 종료한다.
        # 사용자 변경이 먼저 완료되면 UPDATE와 세션 삭제가 모두 건너뛰어진다.
        # SPRING_SESSION_ATTRIBUTES는 플랫폼 FK의 ON DELETE CASCADE로 정리된다.
        - delete:
            tableName: SPRING_SESSION
            where: "PRINCIPAL_NAME = 'admin' AND EXISTS (SELECT 1 FROM SYS_USER WHERE USER_ID = 'admin' AND PWD = '{bcrypt}$2a$10$K4FWozmK6P.1juIcNjvnjuUzPE03BS.wAfpk.rAePOLgFLeBo4sEi' AND PWD_INIT_YN = 'Y')"
      # 롤백도 아직 사용자가 바꾸지 않은 초기 비밀번호에만 적용한다.
      rollback:
        - update:
            tableName: SYS_USER
            columns:
              - column:
                  name: PWD
                  value: "{bcrypt}$2a$10$EvYM6dfQuT0zVHd/sHdCD.4vdyGIFaMSRaQ1oUY0FNcMkLQEnRfa6"
              - column:
                  name: PWD_INIT_YN
                  value: "Y"
              - column:
                  name: PWD_CHG_DTM
                  valueComputed: "NULL"
            where: "USER_ID = 'admin' AND PWD = '{bcrypt}$2a$10$K4FWozmK6P.1juIcNjvnjuUzPE03BS.wAfpk.rAePOLgFLeBo4sEi' AND PWD_INIT_YN = 'Y'"
