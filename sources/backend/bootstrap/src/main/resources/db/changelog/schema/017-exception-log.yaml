# 에러 로그 — 45 §4.2 · 21 §6-1.2 · 64 §5.
#
# 003-log 가 "SYS_LO_ACCESS · SYS_LO_EXCEPTION 은 이력 슬라이스가 만든다" 며 비워 둔 자리
# 중 뒤엣것이다. 014 가 앞엣것을 만들며 "뒤엣것은 64 §5 의 화면이 서는 날 온다 — 지금
# 만들면 쓰는 쪽 없이 굳는다" 고 적었고, 그날이 오늘이다.
#
# **배타가 아니다**(64 §1.4). 예외가 난 요청은 SYS_LO_ACCESS 에 한 행, 여기에 한 행 —
# 둘이 TRACE_ID 로 이어진다. 배타였을 때 "이 에러가 난 요청의 전문을 보자" 가 언제나
# 0건이었고 사용자는 그것을 로그 유실로 읽었다(64 §2.5).
#
# 굵은 셋(HTTP_STAT · ERR_CD · ERR_MSG)이 이 슬라이스의 요점이다. 45 §4 는 한때
# "사용 이력과 동일 + ROOT_CAUSE_STACK" 이라고만 적었는데, 그러면 403 홍수 속에서 500 을
# 찾을 수 없고 "같은 오류가 몇 건인가" 를 물을 수 없다(64 §5.3). 셋 다 응답이 이미 갖고
# 있는 값이다 — ApiResponse 의 code · message 와 HTTP 상태(21 §6-1). 새로 만드는 것이
# 아니라 버리고 있던 것을 적는다.
#
# 감사 4컬럼이 없다(45 §2.1) · FK 도 없다(45 §2.2) — 014 와 같다.
# 인덱스도 둘뿐이다(64 §2.2 · §5.6) — 기간과 추적 ID.
databaseChangeLog:
  - changeSet:
      id: 017-create-sys-lo-exception
      author: template
      comment: 예외 한 건이 한 행 — 코드와 문구가 함께 남는다(21 §6-1.2)
      changes:
        - createTable:
            tableName: SYS_LO_EXCEPTION
            columns:
              - column:
                  name: EXCEPTION_LOG_SEQ
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_LO_EXCEPTION
                    nullable: false
              # 미인증 요청은 NULL 이다 — 화면이 (익명) 으로 그린다(64 §2.7).
              - column:
                  name: USER_ID
                  type: VARCHAR(30)
              # X-Menu-Code 헤더 값. 클라이언트 주장이며 NULL 을 허용한다 — 014 와 같다.
              - column:
                  name: MENU_CD
                  type: VARCHAR(30)
              - column:
                  name: REQUEST_URI
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              # 4xx 와 5xx 를 가르는 유일한 값이다(64 §5.3). 403 은 흔하고 500 은 드문데,
              # 이 컬럼이 없으면 드문 쪽이 흔한 쪽에 묻힌다. 범위가 100~599 라 smallint 다.
              - column:
                  name: HTTP_STAT
                  type: SMALLINT
                  constraints:
                    nullable: false
              # ErrorCode.code() 를 그대로 적는다 — 문자열 상수라 리팩터링으로 흔들리지
              # 않는다(21 §6-1.2). 403 의 세 갈래(err.api-not-registered ·
              # err.api-not-mapped · err.no-authority)를 나르는 것도 이 컬럼이다(23 §4).
              #
              # 예외 클래스명 컬럼을 따로 두지 않는다 — 같은 일을 하는데 클래스명은
              # 리팩터링으로 바뀌어 과거 이력과 현재 코드가 어긋난다(64 §5.3).
              - column:
                  name: ERR_CD
                  type: VARCHAR(50)
              # 서버가 번역을 완성해 담으므로 파라미터가 치환된 문장이 들어온다(21 §6-1.2).
              # NCLOB 으로 두면 목록 컬럼으로 쓸 수 없고(정렬 불가 · 미적재 — 64 §2.4)
              # "코드와 완성된 문구가 함께 남는 것이 운영 대응의 값" 이라는 말이 화면에서
              # 성립하지 않는다. 초과분은 절단한다.
              - column:
                  name: ERR_MSG
                  type: VARCHAR(1000)
              # 근본 원인의 스택. 매핑은 @Nationalized + LONG32NVARCHAR 고정 — @Lob 은
              # MySQL 에서 tinytext(255B) 가 된다(22 §3.1). 014 의 PARAMETERS 와 같다.
              #
              # **4xx 는 NULL 이다**(64 §5.3). AccessDeniedException 의 스택은 인터셉터의
              # 프레임뿐이고 전 행이 같다 — 180일치 노이즈이며, 모달의 스택 탭이
              # 비활성으로 뜨는 근거가 이 NULL 이다.
              - column:
                  name: ROOT_CAUSE_STACK
                  type: NCLOB
              - column:
                  name: CLIENT_IP
                  type: VARCHAR(45)
              # 사용 이력과 이 테이블을 잇는 유일한 끈이다 — 상세 모달의 전문 탭이
              # 이 값으로 SYS_LO_ACCESS 를 찾는다(64 §5.5).
              - column:
                  name: TRACE_ID
                  type: VARCHAR(64)
              - column:
                  name: CRE_DTM
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 017-index-sys-lo-exception
      author: template
      comment: 기간과 추적 ID 둘뿐이다 — 014 와 같은 균형(64 §5.6)
      changes:
        # 기본 조회가 최근 순이고 조회조건의 기간이 필수다(64 §2.2). 보존 배치(32 §4)도
        # 같은 컬럼으로 지운다 — 여기는 180일이다.
        - createIndex:
            tableName: SYS_LO_EXCEPTION
            indexName: IX_SYS_LO_EXCEPTION_01
            columns:
              - column:
                  name: CRE_DTM
        # 이 화면은 셋 중 유일하게 사람이 먼저 찾아온다 — 사용자가 5xx 토스트에서 복사한
        # traceId 를 들고 온다(64 §5.4). 그때 기간이 선택이 되는 근거가 이 인덱스다.
        - createIndex:
            tableName: SYS_LO_EXCEPTION
            indexName: IX_SYS_LO_EXCEPTION_02
            columns:
              - column:
                  name: TRACE_ID
