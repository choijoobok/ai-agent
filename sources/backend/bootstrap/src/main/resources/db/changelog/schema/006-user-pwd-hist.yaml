# 비밀번호 이력 — 41 §5.
#
# 002-auth 가 "쓰지 않는 DDL 을 미리 넣으면 '됐다' 로 보이는데 한 번도 돌아 본 적이 없다" 며
# 미뤄 둔 테이블이다. 이제 쓰는 슬라이스(AUTH-05 재사용 금지)가 왔으므로 여기서 만든다.
#
# USER_ID 는 **주체**, REG_ID 는 **행위자**다. 둘이 갈리는 유일한 테이블이며(40 §3),
# 본인 변경이면 같고 관리자 임시 발급이면 다르다 — 이 컬럼이 둘을 구분한다(23 §4).
# 그래서 감사 컬럼이 REG_* 둘뿐이다: 이력은 수정되지 않는다(40 §4.2).
#
# FK 가 없다(41 §8). 계정을 지울 때 함께 지우는 것은 파기 정책의 일이다(32 §3).
databaseChangeLog:
  - changeSet:
      id: 006-create-sys-user-pwd-hist
      author: template
      comment: 비교 건수도 보관 건수도 정책이 정한다 — 코드에 박지 않는다(41 §5)
      changes:
        - createTable:
            tableName: SYS_USER_PWD_HIST
            columns:
              - column:
                  name: USER_ID
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_USER_PWD_HIST
                    nullable: false
              # 변경 순번. 사용자 안에서만 단조 증가하며 전역 시퀀스가 아니다 —
              # 비교가 언제나 "이 사람의 최근 N건" 이라 전역 번호는 쓸 데가 없다.
              - column:
                  name: CHG_SEQ
                  type: INT
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_USER_PWD_HIST
                    nullable: false
              # SYS_USER.PWD 와 같은 길이다 — 같은 값이 옮겨 오는 자리다
              - column:
                  name: PWD
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: REG_ID
                  type: VARCHAR(50)
              - column:
                  name: REG_DTM
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 006-index-sys-lo-login-user
      author: template
      comment: 내 로그인 이력(LOG-02 · 51 §8)은 한 사람의 최근 순이다 — CRE_DTM 단독 인덱스로는 전건을 훑는다
      changes:
        - createIndex:
            tableName: SYS_LO_LOGIN
            indexName: IX_SYS_LO_LOGIN_03
            columns:
              - column:
                  name: USER_ID
              - column:
                  name: CRE_DTM
