# 만료 예고 배치의 등록 — AUTH-05 · AUTHZ-08 · 66 §6.2. 사람 소유 시드다(22 §1.1).
#
# 069 가 "템플릿이 등록을 시드하는 첫 배치이며, 마지막일 가능성이 높다" 고 적었는데
# **둘째가 왔다.** 그 문장이 틀린 것은 아니다 — 069 는 업무 배치를 지어내지 않겠다는
# 말이었고, 이것도 지어낸 것이 아니라 **10 이 이미 기능으로 정해 둔** 것이다:
# AUTH-05 의 expire-notice-days 와 AUTHZ-08 의 만료 예정 통보는 **읽는 코드가 없으면
# 설정만 있고 아무 일도 안 일어나는** 상태였다.
#
# ── USE_YN='Y' 다 — 069 와 갈리는 자리 ────────────────────────────────────
#
# 파기 배치는 꺼진 채로 들어간다. 되돌릴 수 없는 삭제를 그 프로젝트가 보존 기간을
# 정하기도 전에 시작하기 때문이다. **여기는 되돌릴 수 있다** — 넣는 것이 알림뿐이고,
# 잘못 갔어도 사람이 읽고 무시하면 그만이며 90일 뒤 파기 배치가 지운다.
#
# 그리고 꺼 두면 **기능이 조용히 없다.** 비밀번호 만료 7일 전 예고는 설정 화면에
# expire-notice-days 로 보이는데(43 §6.3) 그 값이 아무 일도 안 하는 상태가 된다 —
# 설정이 거짓말하는 것이 꺼진 배치보다 나쁘다.
#
# ── 04:10 인 이유 ────────────────────────────────────────────────────────
#
# 파기(03:30)와 겹치지 않게 비켜 둔다. 둘 다 락 키가 달라 부딪히지는 않지만, 같은
# 시각에 두면 실행 이력에서 원인을 가릴 때 로그가 섞인다. 업무 시작 전이어야 하는 것도
# 이유다 — 출근해서 알림을 보는 것이 이 기능의 모양이다.
#
# LOCK_EXPIRY_SEC 이 60 이다. 다루는 양이 "예고 창에 걸린 사람" 뿐이라 초 단위로 끝나며,
# 하트비트가 도는 동안 계속 밀리므로 이 값은 "이만큼 소식이 없으면 죽은 것" 이다(31 §5.1).
databaseChangeLog:
  - changeSet:
      id: data-075-expiry-notice-batch
      author: template
      comment: 만료 예고 배치 등록 — 켜진 채로 들어간다(66 §6.2)
      changes:
        - insert:
            tableName: SYS_SCHEDULE_BATCH
            columns:
              - column:
                  name: BATCH_ID
                  value: EXPIRY_NOTICE
              - column:
                  name: BATCH_NM
                  value: 만료 예고 알림
              # 끄는 확인 창이 이 문장을 읽어 준다(65 §3.6) — 여기서는 끄는 쪽이 조용하다.
              - column:
                  name: BATCH_DESC
                  value: >-
                    비밀번호와 권한의 만료를 미리 알린다 — 비밀번호는 만료 예고일 기준(AUTH-05),
                    권한은 역할 부여와 개인 예외의 유효 종료일 기준(AUTHZ-08).
                    만료를 처리하지는 않는다: 판정은 조회 시 계산이며(23 §4) 이 배치는 알림만 넣는다.
                    끄면 사용자가 만료를 미리 알 수 없고, 설정의 예고 일수가 아무 일도 하지 않게 된다.
              - column:
                  name: BEAN_ID
                  value: expiryNoticeJob
              # 04:10 — 파기(03:30)와 비켜 두고 업무 시작 전이다.
              - column:
                  name: CRON
                  value: 0 10 4 * * *
              # PARAM_JSON 이 없다. 예고 일수는 시스템 설정이 갖는다
              # (sys-config.auth.password.expire-notice-days · sys-config.noti.authz-expire-notice-days).
              - column:
                  name: LOCK_EXPIRY_SEC
                  valueNumeric: 60
              - column:
                  name: LOCK_MIN_INTERVAL_SEC
                  valueNumeric: 0
              # 되돌릴 수 있는 배치라 켜진 채로 들어간다 — 파일 머리의 근거.
              - column:
                  name: USE_YN
                  value: Y
              - column:
                  name: SORT_NO
                  valueNumeric: 20
              - column:
                  name: REG_ID
                  value: SYSTEM
              # MOD_* 를 넣지 않는다 — 069 와 같다. 갓 넣은 행은 고쳐진 적이 없고,
              # 넣으면 화면의 "수정자" 가 아무도 고치지 않은 행에 SYSTEM 을 보인다.
              - column:
                  name: REG_DTM
                  valueComputed: CURRENT_TIMESTAMP
