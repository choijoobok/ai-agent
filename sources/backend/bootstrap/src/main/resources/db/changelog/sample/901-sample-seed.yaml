# 샘플 시드 — 48 §7 · 68 §5.
#
# 셋을 넣는다: 채번 행 · 공통코드 · 볼 것이 있는 주문 여섯.
#
# ── 왜 데이터까지 넣는가 ────────────────────────────────────────────────
#
# 68 §1 이 이 화면들을 참조 구현 이라 했는데, 빈 그리드는 참조가 되지 않는다 — 배지의
# 색도, 계산 컬럼도, 마스터 삭제 게이트도 행이 있어야 보인다. 그리고 68 §5.7 의 예외
# 화면 다섯 중 넷은 행이 있어야 재현된다.
#
# ── 코드 그룹이 셋뿐이다 ────────────────────────────────────────────────
#
# SMPL_MD_VERT 가 실제로 그리는 코드 컬럼이 셋이다(주문상태 · 단위 · 품목상태).
# CHNL_CD · PRIORITY_CD · CUST_GRD_CD 는 테이블에 있지만 이 화면의 아홉 컬럼에 없으므로
# 그룹을 넣지 않는다 — 그리는 화면이 서는 날 그 화면이 가져온다(구현된 것만 담는다).
#
# DTL_NM 이 이름이 아니라 메시지 키인 것에 주의한다(43 §4.4). 값은 메시지 시드가 넣는다.
databaseChangeLog:
  - changeSet:
      id: 901-seq-smpl-order
      author: template
      comment: 논리 시퀀스명 = 테이블명이다(ADR-0015 · 22 §4.1)
      changes:
        # NEXT_VAL 이 1 이 아닌 것은 아래 시드가 ORD_ID 를 직접 쓰기 때문이다.
        # 1 로 두면 첫 채번 블록이 시드 행과 겹쳐 PK 충돌이 나는데, 그 충돌은
        # 기동이 아니라 사용자가 행을 처음 추가할 때 난다 — 늦게 드러나는 쪽이다.
        - insert:
            tableName: SYS_SEQUENCE
            columns:
              - column:
                  name: SEQ_NAME
                  value: SMPL_ORDER
              - column:
                  name: NEXT_VAL
                  valueNumeric: 51
      rollback:
        - delete:
            tableName: SYS_SEQUENCE
            where: SEQ_NAME = 'SMPL_ORDER'

