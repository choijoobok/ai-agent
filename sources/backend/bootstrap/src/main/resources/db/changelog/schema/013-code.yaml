# 공통 코드 — 43 §4 · §5 · 63 §2 · ADR-0025.
#
# 테이블이 넷이다. 단계는 셋(그룹 → 코드 → 참조)인데 셋째가 **정의와 값 둘**로 갈렸다 —
# "이 그룹이 어떤 속성을 쓰는가" 를 담을 자리가 없었기 때문이다(43 §5). 값만 두면 목록이
# SELECT DISTINCT REF_CD 라 **마지막 코드를 지우는 순간 정의가 조용히 사라진다**.
#
# 005 가 "SYS_CODE_GROUP · SYS_CODE 는 여기서 만들지 않는다 — 기준정보 슬라이스의 것" 이라
# 적어 둔 그 자리다. 함께 오는 것이 LANG_CD 그룹의 **실물**인데, 지원 언어의 런타임 원본은
# 아직 sys-config.message.supported 다(MessageProps) — 그 이관은 이 슬라이스의 것이 아니다.
#
# 그룹에는 USE_YN 이 없다(43 §4.1). 코드에는 있다 — 이름이 같다고 같은 것이 아니다.
#
# 명칭 컬럼이 둘로 갈린다(43 §3).
#   GRP_NM · GRP_DESC · DTL_DESC · REF_NM · REF_DESC : **컬럼**이다 — 관리 화면 전용 명칭
#   DTL_NM                                           : **메시지 키**다 — code.{GRP_CD}.{DTL_CD}
# 뒤엣것이 사람이 입력하는 값이 아니라는 것이 요점이며(43 §4.4), 그래서 저장 DTO 에 없다.
databaseChangeLog:
  - changeSet:
      id: 013-create-sys-code-group
      author: template
      comment: 코드 그룹 — SYS_YN 은 화면이 켜고 끄지 못한다(43 §4.3 · 63 §2.6)
      changes:
        - createTable:
            tableName: SYS_CODE_GROUP
            columns:
              - column:
                  name: GRP_CD
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_CODE_GROUP
                    nullable: false
              # 관리 화면 전용 명칭이라 컬럼이다 — 다국어가 아니다(43 §3).
              - column:
                  name: GRP_NM
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: GRP_DESC
                  type: VARCHAR(500)
              # 소스가 이 그룹을 문자열로 참조하는가. 지우면 그 기능이 깨진다(43 §4.3).
              # 화면에는 입력 수단이 없고 시드만 'Y' 를 넣는다.
              - column:
                  name: SYS_YN
                  type: CHAR(1)
                  defaultValue: N
                  constraints:
                    nullable: false
              # USE_YN 이 없다 — 43 §4.1. 코드 쪽의 그것과 이름만 같고 성질이 다르다:
              # 코드의 USE_YN 은 **콤보 후보에서 뺀다** 는 뜻이라 읽는 쪽이 있고(§5.5),
              # 그룹은 콤보의 후보가 아니라 **소스가 이름으로 지목하는 것**이라 끄면
              # 무슨 일이 일어나야 하는지 답이 없다. 콤보가 통째로 비면 화면이 못 쓰고,
              # 무시하면 플래그가 아무 일도 안 한다.
              - column:
                  name: SORT_NO
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: REG_ID
                  type: VARCHAR(50)
              - column:
                  name: REG_DTM
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: MOD_ID
                  type: VARCHAR(50)
              - column:
                  name: MOD_DTM
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 013-create-sys-code
      author: template
      comment: 코드 — DTL_NM 은 이름이 아니라 메시지 키다(43 §4.4)
      changes:
        - createTable:
            tableName: SYS_CODE
            columns:
              - column:
                  name: GRP_CD
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_CODE
                    nullable: false
              - column:
                  name: DTL_CD
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    nullable: false
              # code.{GRP_CD}.{DTL_CD}. 서버가 PK 로 조립하며 저장 DTO 에 없다 — 화면이
              # 보낸 값을 쓰지 않는 것이 아니라 **받을 경로가 없다**(43 §4.4 · 원칙 P1).
              # NOT NULL 이다: 값이 PK 에서 도출되므로 비어 있을 수 있는 상태가 없다.
              - column:
                  name: DTL_NM
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: DTL_DESC
                  type: VARCHAR(500)
              - column:
                  name: SYS_YN
                  type: CHAR(1)
                  defaultValue: N
                  constraints:
                    nullable: false
              - column:
                  name: USE_YN
                  type: CHAR(1)
                  defaultValue: Y
                  constraints:
                    nullable: false
              # 관리 화면 정렬이 아니라 **콤보 정렬**이다 — 63 §2.2.
              - column:
                  name: SORT_NO
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: REG_ID
                  type: VARCHAR(50)
              - column:
                  name: REG_DTM
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: MOD_ID
                  type: VARCHAR(50)
              - column:
                  name: MOD_DTM
                  type: TIMESTAMP WITH TIME ZONE

        # ON DELETE CASCADE 를 쓰지 않는다(41 §8). 이 FK 가 거부하는 것이 곧 53 §6.2 의
        # 삭제 게이트이며, 63 §2.5 가 그것을 이 저장소의 **첫 실물**로 지목했다 —
        # 코드가 남아 있는 그룹은 화면이 미리 막고, 그래도 뚫리면 DB 가 막는다.
        - addForeignKeyConstraint:
            constraintName: FK_SYS_CODE_GROUP
            baseTableName: SYS_CODE
            baseColumnNames: GRP_CD
            referencedTableName: SYS_CODE_GROUP
            referencedColumnNames: GRP_CD

        # 코드명 조회가 DTL_NM 을 조인 키로 쓴다(43 §4.4) — 문자열을 조립하지 않는다.
        - createIndex:
            indexName: IX_SYS_CODE_NM
            tableName: SYS_CODE
            columns:
              - column:
                  name: DTL_NM

  - changeSet:
      id: 013-create-sys-code-grp-ref
      author: template
      comment: 참조 코드 정의 — USE_YN 이 없다. 쓰지 않을 속성은 정의를 지운다(43 §5.1)
      changes:
        - createTable:
            tableName: SYS_CODE_GRP_REF
            columns:
              - column:
                  name: GRP_CD
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_CODE_GRP_REF
                    nullable: false
              # CODE_REF_KEY 공통코드의 화이트리스트에서 고른다 — 소스가 이 값을 문자열로
              # 참조하므로 정의 테이블이 그 통제를 대신하지 않는다(43 §4.3 · §5.2).
              - column:
                  name: REF_CD
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    nullable: false
              # 상세 코드 그리드의 **컬럼 헤더**다. 비면 그리드를 읽을 수 없으므로 필수이며,
              # 전역 코드명으로 폴백하지 않는다 — 같은 REF_CD 를 그룹마다 다르게 부르는 것이
              # 이 컬럼의 존재 이유다(43 §5.2).
              - column:
                  name: REF_NM
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: REF_DESC
                  type: VARCHAR(500)
              - column:
                  name: REG_ID
                  type: VARCHAR(50)
              - column:
                  name: REG_DTM
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: MOD_ID
                  type: VARCHAR(50)
              - column:
                  name: MOD_DTM
                  type: TIMESTAMP WITH TIME ZONE

        - addForeignKeyConstraint:
            constraintName: FK_SYS_CODE_GRP_REF_GROUP
            baseTableName: SYS_CODE_GRP_REF
            baseColumnNames: GRP_CD
            referencedTableName: SYS_CODE_GROUP
            referencedColumnNames: GRP_CD

  - changeSet:
      id: 013-create-sys-code-ref
      author: template
      comment: 참조값 — 매트릭스의 셀이라 부모가 둘이다(43 §5.3)
      changes:
        - createTable:
            tableName: SYS_CODE_REF
            columns:
              - column:
                  name: GRP_CD
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_CODE_REF
                    nullable: false
              - column:
                  name: DTL_CD
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: REF_CD
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    nullable: false
              # PK 가 아니다 — 넣으면 같은 속성에 Y/N 이 공존해 조용한 비결정 동작이 된다
              # (10 MASTER-10). NOT NULL 인 것은 **없는 값이 행이 없는 것**이기 때문이며
              # (43 §5.4), NULL 을 허용하면 "없음" 의 표현이 둘이 된다.
              - column:
                  name: REF_VAL
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: REG_ID
                  type: VARCHAR(50)
              - column:
                  name: REG_DTM
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: MOD_ID
                  type: VARCHAR(50)
              - column:
                  name: MOD_DTM
                  type: TIMESTAMP WITH TIME ZONE

        # 행(SYS_CODE)과 열(SYS_CODE_GRP_REF) 양쪽을 건다 — **정의 없는 참조값이 구조적으로
        # 생길 수 없다**(43 §2). 화면이 만들 수 없는 것을 요청 본문으로는 만들 수 있으므로
        # 서비스의 거부와 FK 둘이 같은 것을 지킨다(63 §2.4).
        - addForeignKeyConstraint:
            constraintName: FK_SYS_CODE_REF_CODE
            baseTableName: SYS_CODE_REF
            baseColumnNames: GRP_CD, DTL_CD
            referencedTableName: SYS_CODE
            referencedColumnNames: GRP_CD, DTL_CD

        - addForeignKeyConstraint:
            constraintName: FK_SYS_CODE_REF_DEF
            baseTableName: SYS_CODE_REF
            baseColumnNames: GRP_CD, REF_CD
            referencedTableName: SYS_CODE_GRP_REF
            referencedColumnNames: GRP_CD, REF_CD
