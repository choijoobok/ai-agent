# 메시지 값 — 배치 두 화면의 **오류 문구**(65 §3 · §4). 사람 소유 시드다(22 §1.1).
#
# 키 행은 여기 없다. 백엔드 MsgKey 의 값이라 008 이 만들며(ADR-0023), 여기서 넣으면
# 그 파일과 겹쳐 loadData 가 중복 키로 죽는다 — 058 과 같은 모양이다.
#
# **화면 문구는 여기 없다.** 컬럼 라벨 · 버튼 · 배지 · 탭 이름은 프론트 MSG 의 값이고
# 그것은 파일을 따로 둔다 — MsgKey 와 messageKeys.ts 를 한 파일에 섞으면 어느 쪽을
# 고쳐야 하는지가 CSV 를 읽어서는 안 보인다.
#
# **파라미터가 없다.** ErrorMessages 는 코드 하나로 문구를 찾고 파라미터를 넘기지
# 않으므로(049 · 053 · 058 과 같다) 중괄호를 넣으면 그대로 보인다. 그래서
# err.batch.already-running 이 "이미 실행 중입니다" 로 끝난다 — 65 §3.7 이 요구한
# **노드와 시각**은 이 문구가 아니라 BusinessException 의 FieldError 가 나른다.
# 문구를 둘로 가르는 것이 아니라, 하나는 *무엇이 거부됐나* 이고 하나는 *얼마나
# 기다려야 하나* 라서 자리가 다르다.
#
# err.batch.cooldown-too-long 도 같다. 여기 있는 것은 관계의 이름이고, 실제 초 두 개가
# 들어간 문장은 두 셀(cron · lockMinIntervalSec)에 붙는 FieldError 다(65 §3.4).
databaseChangeLog:
  - changeSet:
      id: data-066-message
      author: template
      comment: 배치 스케줄 · 실행 이력의 거부 문구 열둘 — 65 §3.4 · §3.7 · §3.8 · §4.5
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/066-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-066-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
