# 메시지 값 — 배열 편집 모달의 동작 넷과 빈 목록.
#
# 셀 하나가 값 여럿을 담는 컬럼의 편집기다(54 §5.6 · 68 §9.6). 창의 제목은 컬럼 헤더이고
# 확인·취소는 공통이라, 이 창에만 있는 글자는 다섯이다.
#
# 위·아래가 있는 것은 순서가 값의 일부이기 때문이다 — 저장이 자식 테이블이라 SORT_NO 가
# 컬럼이고(48 §4.1), 직렬화 문자열이면 공짜로 얻는 것이 여기서는 사람이 정하는 값이다.
#
# 아이콘만 있는 버튼 셋이라 툴팁이 유일한 설명이다.
#
# CSV 는 생성한다 — 손으로 쓰는 관행이 남으면 콤마가 든 문구가 오는 날 기동에서만 깨진다.
databaseChangeLog:
  - changeSet:
      id: data-086-message
      author: template
      comment: 배열 편집 모달의 동작 넷과 빈 목록 — 54 §5.6 · 68 §9.6
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/086-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-086-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
