# 메시지 값 12차 — 사람 소유 시드다(22 §1.1).
#
# 스플리터 화살표 둘의 접근성 이름이다(53 §6.3). 화면에는 아이콘만 보이고 글자는 나오지
# 않는다 — 읽는 것은 스크린리더와 테스트뿐이라 `위 그리드 접기` 처럼 **무엇이 접히는지**를
# 그대로 적었다. 화살표가 가리키는 것은 *막대가 갈 자리* 이므로(▲ 를 누르면 위가 접힌다)
# 방향을 이름으로 삼으면 뜻이 뒤집힌다.
databaseChangeLog:
  - changeSet:
      id: data-020-message
      author: template
      comment: 스플리터 화살표의 접근성 이름 ko·en — 53 §6.3
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/020-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-020-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1. 빠뜨리면 기존 세션이 옛 번들을 계속 쓴다
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
