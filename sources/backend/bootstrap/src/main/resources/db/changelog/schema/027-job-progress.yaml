# 진행률 — 30 §6 · 46 §8 · 68 §9.1.
#
# 오래 걸리는 작업은 jobId 를 즉시 돌려주고 요청 스레드를 붙잡지 않는다(30 §6). 그 작업이
# 어디까지 갔는지를 담는 테이블이며, 화면은 GET /api/common/progress/{jobId} 로 훑는다.
#
# store 가 선택형인 것이 30 §6.1 이고 이 테이블은 그중 jdbc 다. 다중화이면서 Redis 가
# 없는 배포가 템플릿의 기본 가정이므로(30 §6.1 의 표) 여기서 만드는 것은 이것 하나다 —
# inmemory·caffeine 은 폴링이 다른 노드로 가면 조용히 못 찾고, 그 함정은 29 §5 와 같다.
#
# 건별로 쓰지 않는다(30 §6.2). 진행률 1% 또는 1초 중 늦은 쪽으로 flush 하므로 10만 건이면
# UPDATE 는 100회이고, 프론트 폴링이 1초 주기라 사용자가 보는 정밀도는 그대로다.
# 종료(complete·fail)만 즉시 쓴다 — 늦으면 끝난 작업이 99% 에서 멈춰 보인다.
databaseChangeLog:
  - changeSet:
      id: 027-create-sys-job-progress
      author: template
      comment: jobId 를 즉시 주고 진행률은 폴링으로 본다 — 30 §6
      changes:
        - createTable:
            tableName: SYS_JOB_PROGRESS
            columns:
              # ProgressHelper.start() 가 발급한다. UUID 라 추측이 어렵지만 그것이 인가는
              # 아니다 — 아래 USER_ID 가 그 일을 한다(46 §8.1).
              - column:
                  name: JOB_ID
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_JOB_PROGRESS
                    nullable: false
              # 시작한 사람. 조회 시 세션 사용자와 대조하고 다르면 404 다(46 §8.1) —
              # 403 은 "그 jobId 는 존재한다" 를 알려주므로 존재 여부까지 감춘다.
              #
              # FK 를 걸지 않는다. 이 행은 만료 청소로 사라지는 임시 행이고(32 §5),
              # 계정 정리와 순서를 다툴 이유가 없다.
              - column:
                  name: USER_ID
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              # RUNNING · DONE · FAILED — 30 §6 의 셋이다. 공통코드가 아니다: 값에 따라
              # 프론트의 화면이 갈리므로(막대 · 완료 · 실패) 소스가 값을 가져야 한다
              # (43 §4.4 의 ACTION_CD 와 같은 자리).
              - column:
                  name: JOB_STAT_CD
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: CUR_CNT
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              # 모르면 NULL 이다(46 §8). 0 으로 두면 0/0 이 되어 완료로 보이며, 전체를
              # 모르는 작업이 실제로 있다(스트리밍 파싱) — 그때 화면은 불확정 막대를 그린다.
              - column:
                  name: TOT_CNT
                  type: BIGINT
              # 퍼센트만 있으면 멈춘 것과 느린 것을 구별할 수 없다(68 §9.1).
              - column:
                  name: STEP_MSG
                  type: VARCHAR(500)
              # 실패 사유. 매핑은 @Nationalized + LONG32NVARCHAR 고정이다 — @Lob 은
              # MySQL 에서 tinytext(255B) 가 된다(22 §3.1).
              - column:
                  name: ERR_MSG
                  type: NCLOB
              # RUNNING 사전 등록 시점(30 §6). 첫 폴링이 NOT_FOUND 를 받지 않게 하는 것이
              # 그 사전 등록의 목적이며, 만료 청소가 이 값을 본다(32 §5).
              - column:
                  name: CRE_DTM
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              # throttle 된 UPDATE 가 찍는다(46 §8).
              - column:
                  name: MOD_DTM
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 027-index-sys-job-progress
      author: template
      comment: 만료 청소가 전 사용자를 훑는다 — 32 §5
      changes:
        # "종료 후 보관 기간을 넘긴 행" — 32 §5 의 일 1회 청소다. PK 는 JOB_ID 라
        # 이 질문에 쓸 수 없다.
        - createIndex:
            tableName: SYS_JOB_PROGRESS
            indexName: IX_SYS_JOB_PROGRESS_01
            columns:
              - column:
                  name: CRE_DTM
