# 메시지 값 43차 — 사람 소유 시드다(22 §1.1). 개인 예외 권한(61 §4)의 문구 전부.
#
# 키 행은 여기 없다. 프론트 MSG · 백엔드 MsgKey 의 값이라 008 이 만든다(ADR-0023).
#
# **트리의 표시 문구가 여기 없는 것이 의도다.** 폴더의 파생 3-state(전체 · 부분 · 없음)와
# `—` 의 툴팁은 `roleAuth.*` 를 그대로 쓴다 — 61 §4.4 가 *"읽는 것은 마찰의 대상이 아니므로
# 표시는 양쪽 공통"* 이라고 정했고, 같은 트리를 두 화면에서 다른 말로 부르면 그것이 학습
# 비용이다. 키 이름이 roleAuth 로 시작하는 것은 **먼저 쓴 화면이 이름을 가져간** 결과일 뿐이다.
#
# **err.user-auth.* 가 err.role.auth.* 와 뜻이 겹치는 것이 셋 있다**(메뉴 · 액션 · READ).
# 같은 규칙을 두 화면이 지키기 때문인데(42 §6 원칙 P1) 키를 나눈 이유는 MsgKey 에 적어
# 두었다 — **규칙이 하나인 것과 문구가 하나인 것은 다르다**.
#
# **userAuth.viaRole.tag 가 이름이 아니라 수를 낸다.** 액션 칸이 124px 이고 역할이 여럿일
# 수 있어 이름을 그대로 두면 셀이 무너진다 — 61 §4.4 가 *"역할이 여럿이면 배지도 여럿"*
# 이라 한 것은 **여럿임이 보여야 한다**는 뜻이고, 이름은 툴팁(userAuth.viaRole)이 온전히
# 말한다.
#
# **비어 있는 필수 칸의 문구는 여기 없다.** 컬럼의 required 가 그리드 공용 문구
# (grid.validation.required)를 낸다(54 §5.1) — 같은 말을 화면마다 다시 적으면 번역해야 할
# 문장이 하나 더 는다. 여기 있는 period.reversed 는 **두 컬럼에 걸친 조건**이라 공용이 없다.
databaseChangeLog:
  - changeSet:
      id: data-061-message
      author: template
      comment: 개인 예외 권한 — 화면 셋 · 상태 배지 · 불변식 알림 · 저장 실패 아홉(61 §4)
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/061-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-061-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
