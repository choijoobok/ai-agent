# 테스트용 역할 둘과 계정 여섯 — **템플릿의 부트스트랩이 아니라 시험 데이터다**.
#
# +----------------------------------------------------------------------+
# |  여섯 계정 모두 비밀번호가 admin 과 같다 - Backoffice!1                |
# |  운영 배포에서는 이 파일을 include 에서 빼거나 계정을 지운다.          |
# +----------------------------------------------------------------------+
#
# 004 가 *"역할은 ADMIN 하나만 둔다 — 템플릿이 역할을 지어내면 조직마다 뜻이 달라 아무도
# 쓰지 않는다"* 고 적었고 그 판단은 그대로다. 여기 둘은 **그 판단의 예외가 아니라 다른
# 범주**다: 인가 화면 셋(역할 권한 · 개인 예외 · 유효 권한)은 **역할이 하나뿐이면 아무것도
# 보여주지 못한다** — 트리의 *역할 경유 보유* 배지도, 개인 예외의 *예정 · 유효 · 만료* 도,
# 조회조건의 *보유 역할* 도 전부 데이터가 있어야 눈에 보인다(61 §4.4).
#
# 해시는 002 의 것을 그대로 쓴다. 새로 만들면 그 평문이 **주석에만** 남아 어긋날 수 있고
# (SeedAdminPasswordTest 가 검사하는 것은 admin 하나다), 시험 계정에서 값을 숨길 이유가
# 없다. 같은 해시라 소금도 같다는 사실이 DB 에 드러나지만 **그것이 곧 시험 계정이라는 표시**다.
#
# -- 무엇을 시험하려고 이렇게 뒀나 -------------------------------------------
#
#   역할 DEVELOPER  이력·로그 셋 + 배치 스케줄
#   역할 MANAGER    공지사항 관리 하나
#
#   개인 예외로 **역할이 주지 않는 것**을 준다 — 그것이 61 §4 화면의 존재 이유다.
#     dev1 -> 기준정보 셋(공통코드 · 메시지 · 환경설정)
#     mgr1 -> 사용자 관리 · 개인 예외 권한
#
#   계정 상태 파생 컬럼(61 §3.2.1)의 다섯 값이 **한 목록에 다 나오게** 계정을 깐다 —
#   정상 · 잠김 · 휴면 · 기간 만료 · 미사용. 잠금 해제·휴면 해제 버튼(61 §3.6)을 누를
#   대상이 시드에 없으면 그 버튼은 눌러 볼 수가 없다.
#
#   개인 예외의 상태 셋(61 §4.7)도 마찬가지다 — 유효 하나로는 배지를 볼 수 없어
#   **예정 하나와 만료 하나**를 함께 깐다.
#
# 날짜를 고정 값으로 박는다. CURRENT_DATE 로 상대 날짜를 만들면 벤더마다 문법이 갈리고
# (22 §4), 무엇보다 **시험 데이터는 언제 깔아도 같은 그림**이어야 한다 — 만료가 진짜로
# 만료여야 만료 배지를 볼 수 있다.
databaseChangeLog:
  - changeSet:
      id: data-060-test-role
      author: template
      comment: 시험용 역할 둘 — 인가 화면은 역할이 하나뿐이면 아무것도 보여주지 못한다
      changes:
        - insert:
            tableName: SYS_ROLE
            columns:
              - column:
                  name: ROLE_ID
                  value: DEVELOPER
              - column:
                  name: ROLE_NM
                  value: 개발자
              - column:
                  name: ROLE_DESC
                  value: 이력·로그와 배치 스케줄. 기준정보는 개인 예외로 받는다 — 시험 데이터다.
              - column:
                  name: USE_YN
                  value: "Y"
              - column:
                  name: REG_ID
                  value: SYSTEM
              - column:
                  name: REG_DTM
                  valueComputed: CURRENT_TIMESTAMP
        - insert:
            tableName: SYS_ROLE
            columns:
              - column:
                  name: ROLE_ID
                  value: MANAGER
              - column:
                  name: ROLE_NM
                  value: 매니저
              - column:
                  name: ROLE_DESC
                  value: 공지사항 관리. 사용자·권한 화면은 개인 예외로 받는다 — 시험 데이터다.
              - column:
                  name: USE_YN
                  value: "Y"
              - column:
                  name: REG_ID
                  value: SYSTEM
              - column:
                  name: REG_DTM
                  valueComputed: CURRENT_TIMESTAMP
      rollback:
        - delete:
            tableName: SYS_ROLE
            where: ROLE_ID IN ('DEVELOPER', 'MANAGER')

