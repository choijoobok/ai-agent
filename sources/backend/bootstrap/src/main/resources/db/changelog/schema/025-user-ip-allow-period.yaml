# SYS_USER_IP_ALLOW.VALID_FROM_DT · VALID_TO_DT — 41 §7 · 61 §3.8 탭 3.
#
# 018 은 이 테이블에 기간을 두지 않았고 근거는 이랬다 — "허용 대역은 사무실이 어디인가
# 라는 사실이고 그것은 예정된 종료를 갖지 않는다. 이사하면 그날 바꾸지 미리 넣어 두지
# 않는다."
#
# 그 문장은 이 목록의 용도를 하나로 봤다. 실제로는 하나가 더 있다 — 파견 · 출장 · 외부
# 감사처럼 **기한이 정해진 접근**이다. 그때 기간이 없으면 그 대역을 사람이 기억해서
# 지워야 하고, 잊으면 그것은 **끝난 계약의 IP 가 열려 있는 상태**다. 접근을 제한하려고
# 만든 목록이 시간이 갈수록 넓어지는 셈이다.
#
# USE_YN 과 층이 다르다. USE_YN 은 "지금 손으로 끄고 켜는 것" 이고 기간은 "미리 정해 두는
# 것" 이다 — 둘의 AND 가 판정이며 역할 부여(SYS_USER_ROLE)가 이미 같은 모양을 갖는다
# (42 §3.1). 하나로 합칠 수 없는 것은, 미리 정해 둔 기간이 지났을 때 USE_YN 을 누가
# 내려 주지 않기 때문이다(그 배치를 만들면 그것이 곧 기간 컬럼의 재구현이다).
#
# NULL 이 제한 없음이다(40 §4.3). 그것이 018 의 해석과 이어진다 — 기간을 적지 않은 행은
# 예전과 똑같이 동작하고, 이 마이그레이션이 **기존 행의 뜻을 바꾸지 않는다**. 기본값을
# 두지 않는 것도 그래서다: CURRENT_DATE 를 깔면 어제 넣은 대역이 어제부터만 유효했던
# 것처럼 보인다.
#
# TIMESTAMP 가 아니라 DATE 다. 양끝을 포함하는 날짜 구간이며(40 §4.3) 판정 시각은 서버가
# 정한다(BusinessCalendar — 46 §5) — 시각까지 두면 "오늘 몇 시부터" 를 누가 정하느냐가
# 브라우저의 시계로 흘러간다.
#
# 인덱스를 만들지 않는다. 한 계정의 행이 열 줄을 넘는 일이 없고, 판정은 언제나
# USER_ID 로 먼저 좁힌다 — PK 의 앞 컬럼이 그것이다.
databaseChangeLog:
  - changeSet:
      id: 025-user-ip-allow-period
      author: template
      comment: 기한이 정해진 접근이 이 목록의 둘째 용도다 — NULL 이 제한 없음이라 기존 행의 뜻은 그대로다(41 §7)
      changes:
        - addColumn:
            tableName: SYS_USER_IP_ALLOW
            columns:
              - column:
                  name: VALID_FROM_DT
                  type: DATE
              - column:
                  name: VALID_TO_DT
                  type: DATE
      rollback:
        - dropColumn:
            tableName: SYS_USER_IP_ALLOW
            columnName: VALID_FROM_DT
        - dropColumn:
            tableName: SYS_USER_IP_ALLOW
            columnName: VALID_TO_DT
