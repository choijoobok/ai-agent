# 메시지 값 — 건별 처리 뒤 목록을 비웠다는 안내(backend/row-transaction.md §7).
#
# 앞의 것을 고치지 않고 파일을 더한다(playbook/changeset.md). loadData 는 CSV 의 내용을
# 체크섬에 넣으므로 110 에 줄을 더하면 그 changeset 이 이미 돈 DB 에서 기동이 죽는다.
#
# 키는 008 이 소스에서 만든다 — 여기서 또 넣으면 loadData 가 중복 키로 죽는다.
#
# ── 왜 안내가 필요한가 ─────────────────────────────────────────────────
#
# `keepFailed` 는 실패한 행만 남기고 목록을 비운다. 500건을 저장했는데 화면에 12줄만
# 남으면 사용자는 **488건도 실패했나** 를 먼저 의심한다 — 남은 것이 고칠 것이라는 사실은
# 배관만 알고 있으므로 배관이 말해야 한다. 말하지 않으면 사라진 것으로 보인다.
#
# ── 왜 비운 수를 말하나 ────────────────────────────────────────────────
#
# 요약 줄이 총·성공·실패를 이미 말하지만, 그 셋 어디에도 **손대지 않은 행** 은 없다.
# 저장은 변경된 행만 보내므로 비워진 것은 성공한 행보다 많을 수 있고, 그 차이를 설명하지
# 않으면 수가 맞지 않는 것으로 보인다.
databaseChangeLog:
  - changeSet:
      id: data-111-message
      author: template
      comment: 건별 처리 뒤 목록을 비웠다는 안내 — backend/row-transaction.md §7
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/111-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-111-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — sys/message.md
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
