# 메뉴 아이콘 — 52 §4 · 51 §4.1.
#
# 003 이 ICON_CD 를 비워 두며 "아이콘은 셸이 사이더를 그릴 때 정한다, 지금 값을 넣으면
# 실제로 렌더된 적 없는 이름 24개가 남는다" 고 적었다. 셸이 섰고 폴백(폴더/문서)만으로는
# 24개가 전부 같아 보이므로 여기서 채운다.
#
# 값은 판(antd)의 컴포넌트 이름이 아니라 **뜻의 코드**다. 이름을 그대로 넣으면 판을
# 바꿀 때 데이터가 낡는다 — 코드 -> 컴포넌트 매핑은 프론트(menuIcons.tsx)가 갖는다.
#
# 없는 코드가 와도 화면은 선다. 매핑에 없으면 폴백(구조 노드는 폴더, 리프는 문서)이며
# 그것이 003 이 비워 두었을 때의 모습이다.
databaseChangeLog:
  - changeSet:
      id: data-035-icon-dashboard
      author: template
      comment: 메뉴명에 맞는 아이콘 — 51 §4.1
      changes:
        - update:
            tableName: SYS_MENU
            columns:
              - column:
                  name: ICON_CD
                  value: dashboard
            where: MENU_CD = 'DASHBOARD'

