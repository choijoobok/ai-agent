# 메시지 값 44차 — 사람 소유 시드다(22 §1.1). 사용자 관리 디테일 탭 다섯(61 §3.8)의 문구 전부.
#
# 키 행은 여기 없다. 프론트 MSG · 백엔드 MsgKey 의 값이라 008 이 만든다(ADR-0023).
#
# CSV 는 생성한다 — 값에 콤마와 아포스트로피가 들어 있어 손으로 적으면 기동에서만 깨진다.
#
# **액션 넷의 헤더 문구가 여기 없다.** 유효 권한 탭의 네 열은 authz.action.* 를 그대로
# 쓴다(054) — 같은 액션을 화면마다 다른 말로 부르면 그것이 학습 비용이고, 61 §4.4 가
# 트리 표시를 두 화면이 공유하게 한 것과 같은 규칙이다.
#
# **user.state.* 가 userAuth.state.* 와 글자가 같다**(예정 · 유효 · 만료). 규칙이 하나인
# 것과 문구가 하나인 것은 다르며(059 의 err.user-admin.* 와 같은 판단), 여기서 셋이 걸리는
# 탭이 셋이라 화면 하나가 자기 어휘를 갖는 편이 낫다.
#
# **빈 목록의 문구 셋이 사실을 말한다.** 흔한 실수가 빈 목록을 '없음' 으로만 적는 것인데,
# 여기서는 그 '없음' 의 뜻이 탭마다 다르다 — 허용 IP 가 없으면 **제한 없음**이고(41 §7),
# 역할이 없으면 **개인 예외로만 닿는다**이며, 유효 권한이 없으면 **다음 로그인부터
# 차단**이다(23 §4). 셋 다 그 말을 문구에 넣는다.
databaseChangeLog:
  - changeSet:
      id: data-063-message
      author: template
      comment: 디테일 탭 다섯 — 탭 이름 · 컬럼 · 빈 목록의 뜻 · 저장 실패 열(61 §3.8)
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/063-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-063-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
