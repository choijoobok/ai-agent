# 메시지 값 34차 — 사람 소유 시드다(22 §1.1).
#
# PK 칸이 잠긴 이유(54 §5.1 의 `pk`). 잠긴 칸은 왜 잠겼는지를 말하지 않으면 버그로 읽힌다 —
# 여기서 답해야 할 것은 "고치려면 지우고 다시 만든다" 이고 그것은 화면 어디에도 없다.
databaseChangeLog:
  - changeSet:
      id: data-046-message
      author: template
      comment: PK 칸이 잠긴 이유 — 54 §5.1
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/046-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-046-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
