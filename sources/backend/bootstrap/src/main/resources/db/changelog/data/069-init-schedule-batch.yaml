# 보존 파기 배치의 등록 — LOG-07 · 32 §4. 사람 소유 시드다(22 §1.1).
#
# 템플릿이 등록을 시드하는 첫 배치이며, 마지막일 가능성이 높다. 65 §3.3 이 "지어내면
# 아무도 안 쓰는 배치가 시드에 남는다" 고 한 것은 **업무 배치**의 이야기이고, 파기는
# 32 가 이미 정책으로 정해 둔 시스템 기능이다 — 없으면 이력 테이블이 무한히 자란다.
#
# ── USE_YN='N' 이 이 파일에서 가장 중요한 값이다 ──────────────────────────
#
# 켜져 있으면 템플릿을 받아 첫 기동한 날 밤 3시 30분에 **지우기부터 시작한다.** 그
# 프로젝트는 아직 보존 기간을 정하지도 않았고, 삭제는 되돌릴 수 없다.
#
# 그리고 32 §3.1 이 요구한 "아카이브 후 삭제" 를 이 구현은 하지 않는다 — §7 이 아카이브
# 산출물 형식을 아직 미결로 들고 있어서다(파일 vs 아카이브 테이블). 켜는 사람이 그 둘을
# **함께** 정하는 것이 맞고, 꺼 둔 상태가 그 결정을 강제한다.
#
# 화면에서 켜는 것은 스위치 하나다(65 §3.6). 끄고 넣는 것과 아예 안 넣는 것의 차이는
# **보이는가** 이며, 보이면 "이런 것이 있었지" 가 가능하다.
#
# ── LOCK_EXPIRY_SEC 이 300 인 것 ──────────────────────────────────────────
#
# 수백만 행을 청크로 지우므로 5분을 훌쩍 넘길 수 있다. 그런데도 300 인 것은 락 하트비트가
# 서면서(31 §5.1) 이 값의 뜻이 바뀌었기 때문이다 — "이만큼 걸릴 것이다"(예측) 가 아니라
# **"이만큼 소식이 없으면 죽은 것이다"**(관측) 다. 도는 동안 계속 밀리므로 실행 시간과
# 무관하고, 짧을수록 진짜 죽었을 때 빨리 풀린다.
#
# LOCK_MIN_INTERVAL_SEC 은 0 이다. 하루 한 번 도는 배치에 쿨다운을 걸 이유가 없고,
# 걸면 즉시 실행이 우회해야 할 것만 는다(31 §7).
databaseChangeLog:
  - changeSet:
      id: data-069-retention-batch
      author: template
      comment: 보존 파기 배치 등록 — 꺼진 채로 들어간다(32 §4)
      changes:
        - insert:
            tableName: SYS_SCHEDULE_BATCH
            columns:
              - column:
                  name: BATCH_ID
                  value: RETENTION_PURGE
              - column:
                  name: BATCH_NM
                  value: 이력 보존 파기
              # 끄는 확인 창이 이 문장을 읽어 준다(65 §3.6) — 그래서 "무엇이 안 되는가"
              # 가 아니라 "켜면 무슨 일이 일어나는가" 를 적는다. 여기서는 켜는 쪽이 위험하다.
              - column:
                  name: BATCH_DESC
                  value: >-
                    보관 기간이 지난 감사·추적 이력을 지운다 — 사용 이력 90일 · 에러 로그 180일 ·
                    로그인 이력 1년 · 배치 실행 이력 1년(32 §3, 시스템 환경설정에서 바꾼다).
                    삭제는 되돌릴 수 없고 아카이브는 아직 없다 — 켜기 전에 보존 기간과
                    아카이브 방침을 먼저 정한다.
              - column:
                  name: BEAN_ID
                  value: retentionPurgeJob
              # 03:30 — 자정 근처의 정산·집계와 겹치지 않게 비켜 둔다. 매일이면 충분하다:
              # 하루치가 쌓여 봐야 청크 몇 번이고, 주 1회로 두면 그 하루가 일곱 배가 된다.
              - column:
                  name: CRON
                  value: 0 30 3 * * *
              # PARAM_JSON 이 없다. 대상과 기간은 32 §3 의 표이고 그 표는 시스템 설정이
              # 갖는다(sys-config.retention.*) — 등록마다 다르게 둘 값이 아니다.
              - column:
                  name: LOCK_EXPIRY_SEC
                  valueNumeric: 300
              - column:
                  name: LOCK_MIN_INTERVAL_SEC
                  valueNumeric: 0
              - column:
                  name: USE_YN
                  value: N
              - column:
                  name: SORT_NO
                  valueNumeric: 10
              - column:
                  name: REG_ID
                  value: SYSTEM
              - column:
                  name: REG_DTM
                  valueComputed: CURRENT_TIMESTAMP
