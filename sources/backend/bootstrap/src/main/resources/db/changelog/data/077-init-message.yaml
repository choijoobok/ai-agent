# 메시지 값 — 개인 예외 화면 보완의 문구 2키. 사람 소유 시드다(22 §1.1).
#
# 좌 pane 에 **유효 예외 건수** 컬럼이 하나 늘었다(61 §4.2). 그 화면에서 가장 자주 하는 일이
# *누구에게 이미 예외가 있나* 인데, 그것을 알려면 **한 사람씩 골라 트리를 읽어야** 했다.
#
# ── 이름이 `유효 예외` 다 ───────────────────────────────────────────────
#
# `예외 건수` 로 두면 **만료가 쌓인 계정에서 화면의 어느 수와도 맞지 않는다** — 세는 것은
# 기간이 오늘을 품은 행뿐이고(61 §4.7), 그것이 하단 목록의 *상태* 컬럼과 같은 규칙이다.
#
# ── 툴팁이 세지 않는 것을 말한다 ────────────────────────────────────────
#
# 예정과 만료를 빼는 것은 **값을 보고는 알 수 없다.** 3 이라고 적혀 있으면 그것이 전부인지
# 지금 되는 것인지를 물을 수 없고, 틀리게 짐작하면 *왜 목록에는 다섯 줄인가* 로 이어진다.
#
# 앞 파일(`076`)의 CSV 를 고치지 않고 새로 여는 이유는 같다 — 적재된 changeset 을 고치면
# Liquibase 가 체크섬 불일치로 기동을 거부한다.
databaseChangeLog:
  - changeSet:
      id: data-077-message
      author: template
      comment: 개인 예외 좌 pane 의 유효 예외 건수 컬럼 문구 2키 — 61 §4.2
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/077-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-077-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
