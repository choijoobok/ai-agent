# 논리 시퀀스 시드 — 22 §4.1.
#
# 논리 시퀀스명 = 테이블명이다(ADR-0015). 생성 키를 쓰는 테이블이 늘 때마다 여기에 행이
# 하나 는다.
#
# 시드를 빠뜨리면 조용하다 — 기동도 되고 첫 INSERT 도 성공한다. Hibernate 가 자체 경로로
# 행을 만들기 때문이며, 다중 노드에서 그 순간 경합한다. 그래서 이 파일이 누락 검사의
# 대상이다.
#
# 이 시드는 사람 소유다 — 기존 changeset 을 고치지 않고 새 changeset 을 더한다(22 §1.1).
databaseChangeLog:
  - changeSet:
      id: data-001-seq-sys-lo-login
      author: template
      changes:
        - insert:
            tableName: SYS_SEQUENCE
            columns:
              - column:
                  name: SEQ_NAME
                  value: SYS_LO_LOGIN
              - column:
                  name: NEXT_VAL
                  valueNumeric: 1
      rollback:
        - delete:
            tableName: SYS_SEQUENCE
            where: SEQ_NAME = 'SYS_LO_LOGIN'
