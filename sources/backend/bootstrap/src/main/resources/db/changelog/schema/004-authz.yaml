# 역할 · 메뉴 · 권한 · API — 42.
#
# 인가 사실은 두 축이다(23 §4). "누가 무엇을 할 수 있는가" 는 (주체 × 메뉴 × 액션) 이고,
# "이 URL 이 무엇인가" 는 SYS_API · SYS_MENU_API 다. 코드에는 아무 선언도 없다.
#
# ON DELETE CASCADE 를 쓰지 않는다(41 §8) — 역할 하나를 지웠더니 권한이 조용히 사라지는
# 사고를 만든다. 지우려면 참조를 먼저 정리하는 서비스를 거친다.
#
# SYS_USER_FAVORITE · SYS_USER_MENU_STAT 는 42 §7·§8 이 정의했지만 여기서 만들지 않는다 —
# 둘 다 셸(즐겨찾기 모달 · 자주 쓰는 메뉴)이 쓰는 것이고, 쓰지 않는 DDL 을 미리 넣으면
# "됐다" 로 보이는데 한 번도 돌아 본 적이 없다. 002-auth 가 SYS_USER_PWD_HIST 를 미룬 것과 같다.
databaseChangeLog:
  - changeSet:
      id: 004-create-sys-role
      author: template
      comment: 역할 자체에는 유효 기간이 없다 — 기간은 부여(SYS_USER_ROLE)의 것이다(42 §3.1)
      changes:
        - createTable:
            tableName: SYS_ROLE
            columns:
              - column:
                  name: ROLE_ID
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_ROLE
                    nullable: false
              - column:
                  name: ROLE_NM
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: ROLE_DESC
                  type: VARCHAR(500)
              # 유효 권한 계산의 입력 필터다 — 'N' 인 역할은 권한 행을 내지 않는다(23 §4).
              # SORT_NO 를 두지 않는다: 있으면 우선순위로 읽히는데 합집합에 우선순위가 없다(42 §3).
              - column:
                  name: USE_YN
                  type: CHAR(1)
                  defaultValue: "Y"
                  constraints:
                    nullable: false
              - column:
                  name: REG_ID
                  type: VARCHAR(50)
              - column:
                  name: REG_DTM
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: MOD_ID
                  type: VARCHAR(50)
              - column:
                  name: MOD_DTM
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 004-create-sys-menu
      author: template
      comment: URL 과 자식은 배타다 — 구조 노드는 경로, 리프는 화면(23 §4). DB 로는 표현할 수 없어 시드 검증 테스트가 지킨다
      changes:
        - createTable:
            tableName: SYS_MENU
            columns:
              - column:
                  name: MENU_CD
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_MENU
                    nullable: false
              # 자기참조. FK 는 고아를 막고 순환은 막지 못한다 — 42 §4 의 네 층이 그것을 맡는다.
              - column:
                  name: UP_MENU_CD
                  type: VARCHAR(30)
              # 메뉴명이 아니라 메시지 키(menu.{MENU_CD})다 — 명칭의 단일 원본은 SYS_MESSAGE 다(42 §4).
              - column:
                  name: MENU_NM
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              # NULL 이면 순수 구조 노드이며 권한 대상이 아니다. 이 컬럼 하나가 판정 대상 여부다.
              - column:
                  name: MENU_URL
                  type: VARCHAR(200)
              - column:
                  name: ICON_CD
                  type: VARCHAR(50)
              # 형제 간 정렬. 드래그 시 형제 전체를 1..N 으로 재작성한다 —
              # UNIQUE(UP_MENU_CD, SORT_NO) 는 걸 수 없다: NULL 을 포함한 UNIQUE 가 벤더마다 다르다(22 §4).
              - column:
                  name: SORT_NO
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              # 유효 권한 계산의 최종 게이트다 — 역할이 몇 개든 되살릴 수 없다(23 §4).
              - column:
                  name: USE_YN
                  type: CHAR(1)
                  defaultValue: "Y"
                  constraints:
                    nullable: false
              - column:
                  name: REG_ID
                  type: VARCHAR(50)
              - column:
                  name: REG_DTM
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: MOD_ID
                  type: VARCHAR(50)
              - column:
                  name: MOD_DTM
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 004-create-sys-api
      author: template
      comment: 키는 API_URL 단독이다 — HTTP_METHOD 를 두지 않는다(ADR-0016). 한 경로에 두 오퍼레이션을 두려는 시도는 PK 충돌로 배포에서 막힌다
      changes:
        - createTable:
            tableName: SYS_API
            columns:
              # 고정 문자열이다. 경로 변수·와일드카드를 쓰지 않으므로 매칭이 해시 한 번이다(23 §4).
              - column:
                  name: API_URL
                  type: VARCHAR(200)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_API
                    nullable: false
              # @Operation.summary 에서 온다 — 코드에 없으면 만들 수 없어 빌드가 막는다(ADR-0020).
              - column:
                  name: API_NM
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: API_DESC
                  type: VARCHAR(500)
              # 이 API 의 속성이지 (API, 메뉴) 조합의 속성이 아니다 — 한 번만 존재하므로
              # "메뉴마다 액션이 다른" 모순이 구조적으로 불가능하다(ADR-0016).
              #
              # USE_YN 을 두지 않는다: API 의 존재는 코드가 결정하는 사실이며 데이터로 끄지 않는다(42 §5).
              - column:
                  name: ACTION_CD
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: REG_ID
                  type: VARCHAR(50)
              - column:
                  name: REG_DTM
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: MOD_ID
                  type: VARCHAR(50)
              - column:
                  name: MOD_DTM
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 004-create-sys-user-role
      author: template
      comment: 부여에는 기간이 있고 NULL 은 무제한이다 — 회수는 삭제가 아니라 VALID_TO_DT 로 한다(42 §3.1)
      changes:
        - createTable:
            tableName: SYS_USER_ROLE
            columns:
              - column:
                  name: USER_ID
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_USER_ROLE
                    nullable: false
              - column:
                  name: ROLE_ID
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_USER_ROLE
                    nullable: false
              # NULL 허용이 핵심이다. 필수로 하면 정규 직원의 부여에 9999-12-31 을 채우는
              # 관행이 생기고, 그 값은 "무기한" 을 뜻하지만 아무 제약도 그것을 보증하지 않는다.
              - column:
                  name: VALID_FROM_DT
                  type: DATE
              - column:
                  name: VALID_TO_DT
                  type: DATE
              - column:
                  name: REG_ID
                  type: VARCHAR(50)
              - column:
                  name: REG_DTM
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: MOD_ID
                  type: VARCHAR(50)
              - column:
                  name: MOD_DTM
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 004-create-sys-role-menu-auth
      author: template
      comment: 행의 존재가 곧 허용이다 — DENY_YN 도 USE_YN 도 두지 않는다(42 §6)
      changes:
        - createTable:
            tableName: SYS_ROLE_MENU_AUTH
            columns:
              - column:
                  name: ROLE_ID
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_ROLE_MENU_AUTH
                    nullable: false
              - column:
                  name: MENU_CD
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_ROLE_MENU_AUTH
                    nullable: false
              - column:
                  name: ACTION_CD
                  type: VARCHAR(20)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_ROLE_MENU_AUTH
                    nullable: false
              - column:
                  name: REG_ID
                  type: VARCHAR(50)
              - column:
                  name: REG_DTM
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: MOD_ID
                  type: VARCHAR(50)
              - column:
                  name: MOD_DTM
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 004-create-sys-user-menu-auth
      author: template
      comment: 개인 예외는 기간·사유가 필수다 — 마찰을 유지하는 것이 설계다(23 §4 · AUTHZ-07)
      changes:
        - createTable:
            tableName: SYS_USER_MENU_AUTH
            columns:
              - column:
                  name: USER_ID
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_USER_MENU_AUTH
                    nullable: false
              - column:
                  name: MENU_CD
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_USER_MENU_AUTH
                    nullable: false
              - column:
                  name: ACTION_CD
                  type: VARCHAR(20)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_USER_MENU_AUTH
                    nullable: false
              # 역할 부여와 달리 NOT NULL 이다. 개인 예외는 일시적·개별적이라는 것이
              # 정의이므로 무기한 예외라는 개념이 없다(42 §3.1 의 대조표).
              - column:
                  name: VALID_FROM_DT
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: VALID_TO_DT
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: GRANT_RSN
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: REG_ID
                  type: VARCHAR(50)
              - column:
                  name: REG_DTM
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: MOD_ID
                  type: VARCHAR(50)
              - column:
                  name: MOD_DTM
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 004-create-sys-menu-api
      author: template
      comment: 매핑 행 추가가 곧 접근 범위 확장이다 — 운영 화면이 아니라 시드로만 바뀐다(23 §4)
      changes:
        - createTable:
            tableName: SYS_MENU_API
            columns:
              - column:
                  name: MENU_CD
                  type: VARCHAR(30)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_MENU_API
                    nullable: false
              - column:
                  name: API_URL
                  type: VARCHAR(200)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SYS_MENU_API
                    nullable: false
              - column:
                  name: REG_ID
                  type: VARCHAR(50)
              - column:
                  name: REG_DTM
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: MOD_ID
                  type: VARCHAR(50)
              - column:
                  name: MOD_DTM
                  type: TIMESTAMP WITH TIME ZONE

  # FK 를 테이블 정의와 분리한다 — createTable 안에 두면 선언 순서가 곧 생성 순서가 되어
  # 자기참조(SYS_MENU.UP_MENU_CD)를 표현할 수 없다.
  - changeSet:
      id: 004-fk-authz
      author: template
      comment: 고아 매핑은 인가 판정을 오염시키고, 없는 API 에 대한 매핑은 영원히 403 이 되며 원인이 보이지 않는다 — 42 §9
      changes:
        - addForeignKeyConstraint:
            constraintName: FK_SYS_MENU_01
            baseTableName: SYS_MENU
            baseColumnNames: UP_MENU_CD
            referencedTableName: SYS_MENU
            referencedColumnNames: MENU_CD
        - addForeignKeyConstraint:
            constraintName: FK_SYS_USER_ROLE_01
            baseTableName: SYS_USER_ROLE
            baseColumnNames: USER_ID
            referencedTableName: SYS_USER
            referencedColumnNames: USER_ID
        - addForeignKeyConstraint:
            constraintName: FK_SYS_USER_ROLE_02
            baseTableName: SYS_USER_ROLE
            baseColumnNames: ROLE_ID
            referencedTableName: SYS_ROLE
            referencedColumnNames: ROLE_ID
        - addForeignKeyConstraint:
            constraintName: FK_SYS_ROLE_MENU_AUTH_01
            baseTableName: SYS_ROLE_MENU_AUTH
            baseColumnNames: ROLE_ID
            referencedTableName: SYS_ROLE
            referencedColumnNames: ROLE_ID
        - addForeignKeyConstraint:
            constraintName: FK_SYS_ROLE_MENU_AUTH_02
            baseTableName: SYS_ROLE_MENU_AUTH
            baseColumnNames: MENU_CD
            referencedTableName: SYS_MENU
            referencedColumnNames: MENU_CD
        - addForeignKeyConstraint:
            constraintName: FK_SYS_USER_MENU_AUTH_01
            baseTableName: SYS_USER_MENU_AUTH
            baseColumnNames: USER_ID
            referencedTableName: SYS_USER
            referencedColumnNames: USER_ID
        - addForeignKeyConstraint:
            constraintName: FK_SYS_USER_MENU_AUTH_02
            baseTableName: SYS_USER_MENU_AUTH
            baseColumnNames: MENU_CD
            referencedTableName: SYS_MENU
            referencedColumnNames: MENU_CD
        - addForeignKeyConstraint:
            constraintName: FK_SYS_MENU_API_01
            baseTableName: SYS_MENU_API
            baseColumnNames: MENU_CD
            referencedTableName: SYS_MENU
            referencedColumnNames: MENU_CD
        - addForeignKeyConstraint:
            constraintName: FK_SYS_MENU_API_02
            baseTableName: SYS_MENU_API
            baseColumnNames: API_URL
            referencedTableName: SYS_API
            referencedColumnNames: API_URL

  - changeSet:
      id: 004-index-authz
      author: template
      comment: 역방향 조회(이 역할을 누가 갖는가 · 이 메뉴를 누가 쓰는가)가 캐시 무효화의 대상 집합을 만든다 — 23 §4
      changes:
        # 역할 권한이 바뀌면 그 역할 보유자 전원의 세션에 authzDirty 를 세워야 한다.
        # PK 가 (USER_ID, ROLE_ID) 라 ROLE_ID 단독 조회는 선행 컬럼이 없다.
        - createIndex:
            tableName: SYS_USER_ROLE
            indexName: IX_SYS_USER_ROLE_01
            columns:
              - column:
                  name: ROLE_ID
        # AUTHZ-13 "이 메뉴를 누가 쓸 수 있나" 의 첫 걸음이다.
        - createIndex:
            tableName: SYS_ROLE_MENU_AUTH
            indexName: IX_SYS_ROLE_MENU_AUTH_01
            columns:
              - column:
                  name: MENU_CD
        # 인가 인터셉터는 이 방향을 쓰지 않는다(기동 시 전건 적재) — 카탈로그 화면의 것이다.
        - createIndex:
            tableName: SYS_MENU_API
            indexName: IX_SYS_MENU_API_01
            columns:
              - column:
                  name: API_URL
