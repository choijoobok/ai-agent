# 메시지 값 6차 — 사람 소유 시드다(22 §1.1).
#
# 앞의 것을 고치지 않고 파일을 더한다(22 §1.1).
#
# 담는 것은 메뉴 진입 모달의 문구다(51 §4.3). 검색·즐겨찾기·최근·자주가 한 창의 네 탭이
# 되면서 생겼다. `shell.search.title` 은 쓰는 곳이 없어져 008 이 USE_SCOPE='NONE' 으로
# 내렸다(ADR-0023) — 값 행은 지우지 않는다.
databaseChangeLog:
  - changeSet:
      id: data-014-message
      author: template
      comment: 메뉴 진입 모달의 ko·en — 51 §4.3
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/014-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-014-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
