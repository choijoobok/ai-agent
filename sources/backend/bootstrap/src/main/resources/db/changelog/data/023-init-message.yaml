# 메시지 값 15차 — 사람 소유 시드다(22 §1.1).
#
# 담는 것 둘이다.
#
# ① 그리드 시스템 컬럼 다섯 — 행 번호 · 체크박스 컬럼 · 전체 선택 · 행 선택 · 스플리터
#    되돌리기(53 §4 · §6.3). `grid.col.rowNo` 는 ko·en 이 같은 `No` 다. 폭 60px 짜리
#    헤더라 `번호` 를 넣으면 숫자보다 헤더가 넓어지고, `No` 는 두 언어에서 같게 읽힌다.
#    `grid.selectAll`·`grid.selectRow`·`grid.col.select` 는 화면에 글자가 나오지 않는다 —
#    체크박스의 접근성 이름이며 읽는 것은 스크린리더와 테스트다.
#
#    `grid.split.expand` 를 `펼치기` 가 아니라 `되돌리기` 로 둔 이유 — 같은 아래 화살표가
#    접기이기도 하고 되돌리기이기도 하다. 방향을 이름으로 삼으면 상태에 따라 뜻이 뒤집힌다.
#
# ② `searchCond.title` — 022 에서 `저장된 조회조건` 이었다. 아이콘만 있던 버튼에 글자가
#    붙으면서(톱니 → 서랍) 이름이 **무엇을 여는가**가 아니라 **무엇을 하는가**여야 했다.
#
# 022 를 고치지 않고 update 로 덮는다 — 016 · 021 과 같은 이유다.
databaseChangeLog:
  - changeSet:
      id: data-023-message
      author: template
      comment: 그리드 행 번호와 선택 체크박스의 ko·en — 53 §4
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/023-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-023-cond-title-ko
      author: template
      comment: 버튼에 글자가 붙었다 — 무엇을 여는가가 아니라 무엇을 하는가다
      changes:
        - update:
            tableName: SYS_MESSAGE
            columns:
              - column:
                  name: MSG_VAL
                  value: 저장/불러오기
            where: MSG_KEY = 'searchCond.title' AND LANG_CD = 'ko'

  - changeSet:
      id: data-023-cond-title-en
      author: template
      comment: 〃
      changes:
        - update:
            tableName: SYS_MESSAGE
            columns:
              - column:
                  name: MSG_VAL
                  value: Save / Load
            where: MSG_KEY = 'searchCond.title' AND LANG_CD = 'en'

  - changeSet:
      id: data-023-cache-version
      author: template
      comment: 값을 넣거나 바꿨으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
