# config 캐시 버전 행 — 43 §8.1.
#
# 009 가 message 하나만 넣으며 "code 와 config 캐시는 아직 없다" 고 적었다. 시스템 환경설정
# 슬라이스가 그 config 를 만든다.
#
# 저장 서비스는 행이 없어도 죽지 않는다(SysCacheVersion.started 가 만든다). 그래도 시드가
# 넣어 두는 것은, 행이 없는 상태에서 첫 저장이 VERSION=1 로 **시작** 하면 그 전에 로그인해
# 둔 브라우저가 자기 값과 같다고 읽기 때문이다 — 시작 값과 첫 증가가 겹친다.
databaseChangeLog:
  - changeSet:
      id: data-039-cache-version-config
      author: template
      comment: 저장이 올릴 자리를 미리 둔다 — 43 §8.1
      changes:
        - insert:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: CACHE_NAME
                  value: config
              - column:
                  name: VERSION
                  valueNumeric: 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
