# 스키마의 유일한 출처 — 22 §1.
#
# changelog 는 createTable 같은 추상 명령으로 쓴다. 접속한 DB 에 맞는 DDL 은 Liquibase 가
# 실행 시점에 만든다. 벤더별 DDL 을 손으로 4벌 관리하면 서로 어긋나는 것은 시간 문제다.
#
# 파일이 늘어나는 방식은 시드의 소유자에 따라 다르다(22 §1.1) —
#   사람 소유(코드·메뉴·계정) : 기존 changeset 을 손대지 않고 새 파일을 더한다
#   코드 소유(API·메시지 시드) : 같은 파일을 다시 쓰고 runOnChange 로 전건 재동기화한다
databaseChangeLog:
  - include:
      file: db/changelog/schema/001-core-tables.yaml
  - include:
      file: db/changelog/schema/002-auth.yaml
  - include:
      file: db/changelog/schema/003-log.yaml
  - include:
      file: db/changelog/schema/004-authz.yaml
  - include:
      file: db/changelog/schema/005-message.yaml
