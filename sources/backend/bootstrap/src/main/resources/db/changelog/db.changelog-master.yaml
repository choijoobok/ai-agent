  # 40 §7 · 41 §9 가 57 로 미뤄 둔 SYS_USER_SEARCH_COND — 57 §5 가 형태를 닫았다.
  - include:
      file: db/changelog/schema/007-user-search-cond.yaml
  # 40 §7 이 "스키마 미정" 으로 남겨 둔 SYS_USER_GRID_PREF — 53 §5 가 담을 것을 정했다.
  - include:
      file: db/changelog/schema/008-user-grid-pref.yaml
  # 42 §7 이 형태까지 닫아 두고 "테이블만 먼저" 로 남긴 SYS_USER_FAVORITE — UX-03.
  - include:
      file: db/changelog/schema/009-user-favorite.yaml
  # 42 §8 이 형태까지 닫아 두고 "테이블만 먼저" 로 남긴 SYS_USER_MENU_STAT — UX-16.
  - include:
      file: db/changelog/schema/010-user-menu-stat.yaml
  # 010 의 CHAR(6) 이 Hibernate 검증에 걸렸다 — 순수 String 은 VARCHAR 다(22 §4.3).
  - include:
      file: db/changelog/schema/011-menu-stat-stat-ym-varchar.yaml
  # 43 §6 · 63 §4 · ADR-0026 이 형태를 닫아 둔 SYS_CONFIG — 오버라이드만 담는다.
  - include:
      file: db/changelog/schema/012-config.yaml
  # 005 가 "기준정보 슬라이스의 것" 이라며 비워 둔 넷 — 43 §4 · §5 · ADR-0025.
