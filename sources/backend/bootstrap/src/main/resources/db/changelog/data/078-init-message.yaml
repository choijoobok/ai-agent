# 메시지 값 — 그리드 설정 창의 적용 버튼 1키. 사람 소유 시드다(22 §1.1).
#
# 창의 버튼이 셋이었고(취소 · 저장 · 초기화) 닫는 길이 **저장하거나 되감거나** 둘뿐이었다.
# 고친 것은 이미 화면에 들어가 있는데(적용은 즉시다 — 53 §5), 저장하지 않고 그대로 두려면
# **창을 열어 둔 채로만** 볼 수 있었다 — 창이 그리드를 가리므로 그것은 보는 것이 아니다.
#
# ── 이름이 `적용` 이다 ──────────────────────────────────────────────────
#
# `닫기` 로 두면 취소와 무엇이 다른지 말하지 못한다. 셋이 남기는 것이 다 다르고
# (DB · 화면 · 되감기) 이름이 그 차이를 져야 한다.
#
# 앞 파일(`077`)의 CSV 를 고치지 않고 새로 여는 이유는 같다 — 적재된 changeset 을 고치면
# Liquibase 가 체크섬 불일치로 기동을 거부한다.
databaseChangeLog:
  - changeSet:
      id: data-078-message
      author: template
      comment: 그리드 설정 창의 적용 버튼 문구 1키 — 53 §5
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/078-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-078-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
