# 메시지 값 — 샘플 ⑤ SMPL_MD_TABS (68 §7).
#
# 089·091·093·095 에 이어 붙이지 않는다. loadData 는 CSV 의 내용을 체크섬에 넣으므로, 줄을
# 더하면 그 changeset 이 이미 돈 DB 에서 기동이 죽는다 — 095 의 머리말이 그 사고를 한 번
# 겪고 적어 두었다. 물어야 하는 것은 커밋 여부가 아니라 이 changeset 이 어딘가에서 돌았나
# 이고, 로컬에서 한 번이라도 띄웠으면 답은 그렇다 다.
#
# ── 화면 문구가 ④보다 많은 이유 ────────────────────────────────────────
#
# ④는 메뉴명 하나뿐이었다. 그리는 것이 ③의 부분집합이라 컬럼도 빈 판의 문구도 ③의 키를
# 그대로 썼기 때문이다. ⑤는 마스터와 품목 탭까지는 그렇지만 태그 탭이 새 표라 —
# SMPL_ORDER_TAG 를 행으로 그리는 첫 화면이다(48 §4.1) — 컬럼 넷과 제목·빈 판이 새것이다.
#
# 탭 이름 둘도 여기 있다. 그리드 제목(주문 품목 · 주문 태그)과 갈라 두는 것은 탭바가
# 좁아서다: 탭은 한 단어여야 나란히 훑을 수 있고, 제목은 접미가 붙어 무엇의 것인지를
# 말한다(53 §6.1).
#
# 접두는 089 와 같다(48 §7.3): 데이터가 만드는 menu.SMPL_* 와 화면이 쓰는 sample.* ·
# err.sample.* 다. 제거 changelog 의 LIKE 셋이 그대로 잡는다.
#
# 키는 둘로 갈린다 —
#
#   menu.*            여기 CSV 가 갖는다. SYS_MENU.MENU_NM 에 이름이 아니라 키가 들어가므로
#                     (42 §4) 값이 없으면 메뉴 트리에 menu.SMPL_MD_TABS 가 그대로 보인다.
#   sample.* err.*    키는 008 이 소스에서 만든다(ADR-0023). 여기서 또 넣으면 loadData 가
#                     중복 키로 죽는다 — 값만 싣는다.
databaseChangeLog:
  - changeSet:
      id: data-097-message-key
      author: template
      comment: 데이터가 만드는 키 — ⑤의 메뉴명 하나(42 §4)
      changes:
        - loadData:
            tableName: SYS_MESSAGE_KEY
            file: db/changelog/data/097-init-message-key.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: USE_SCOPE
                  type: STRING
              - column:
                  name: MSG_DESC
                  type: STRING

  - changeSet:
      id: data-097-message
      author: template
      comment: ⑤의 메뉴명과 태그 탭의 문구 — 마스터·품목 탭은 ③의 키를 그대로 쓴다
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/097-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-097-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
