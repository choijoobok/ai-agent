# 비고를 채운다 — 시드가 ①의 조건부 필수를 어기고 있었다.
#
# ── 무엇이 깨져 있었나 ──────────────────────────────────────────────────
#
# ①은 조건부 필수를 갖는다: **할인율이 0 보다 크면 비고가 필수**다(68 §3.2 · 54 §5.1 의
# *조건부 필수는 함수다*). 그런데 시드가 그 규칙을 어긴 행을 1996건 담고 있었다 —
#
#   901 의 여섯 중 셋   ORD_ID 2·3·6 (할인율 12 · 22 · 7.5, 비고 빈칸)
#   902 의 2,000 중     1993건 — DC_RT 를 넣고 RMK 는 컬럼 목록에 두지 않았다
#
# 증상이 조용하지 않다. 저장 검증은 **판의 모든 행**을 보므로(56 §3.3 — 무변경 행도 검증한다)
# 한 칸을 고치고 저장을 누르면 *99건의 오류가 있습니다* 가 뜬다: 사용자가 손대지 않은 97행이
# 함께 걸리고 **그중 자기가 만든 오류는 하나도 없다.** 그러면 저장이 아예 되지 않는다.
#
# 실기동에서 태그 상한을 재던 중 드러났다(2026-09-02). 시드를 읽어서는 보이지 않고
# **저장을 눌러야** 보인다 — 901 의 셋은 화면이 서기 전부터 있었다.
#
# ── 왜 901·902 를 고치지 않나 ───────────────────────────────────────────
#
# 둘 다 이미 돈 changeset 이다(22 §1.1). 902 는 특히 loadData 라 CSV 내용이 체크섬에 들어가
# 있어, 그 파일에 RMK 열을 더하면 남의 로컬이 **기동에서** 죽는다 — 902 의 머리말이 적어 둔
# 그대로이며 여기서 그 규칙을 우리가 지킨다.
#
# 생성기(build.gradle.kts 의 SampleBulkSeedTask)도 그대로다. CSV 와 생성기는
# checkSampleBulkSeed 가 묶어 두었으므로 한쪽만 고칠 수 없다. **건수를 바꾸는 다음 사람에게
# 남기는 말**은 그 생성기의 주석에 있다: 새 changeset 에는 RMK 를 함께 실어야 한다.
#
# ── 할인율을 0 으로 만들지 않은 이유 ────────────────────────────────────
#
# 그쪽이 한 줄 더 짧지만 ①의 progress 렌더러와 tone 맵이 볼 것을 잃는다(68 §3.2 의 막대 —
# 할인율이 없으면 그 어휘의 실물이 시드에서 사라진다). 그리고 규칙이 말하는 것은 *할인에는
# 사유가 있어야 한다* 이므로 **사유를 적는 것이 규칙을 지키는 방향**이고, 할인을 지우는 것은
# 규칙을 피하는 방향이다.
#
# ── 문구를 둘로 가른다 ──────────────────────────────────────────────────
#
# 901 의 여섯은 손으로 고른 행이라 값 하나하나에 뜻이 있고(902 의 머리말), 거기에 *대량
# 시드* 라고 적으면 그 뜻이 틀린 말이 된다.
databaseChangeLog:
  - changeSet:
      id: 903-sample-rmk
      author: template
      comment: 할인이 있으면 비고가 필수다 — 시드가 그 규칙을 어기고 있었다(68 §3.2)
      changes:
        # 901 의 손으로 고른 여섯 — 지금 걸리는 것은 2·3·6 이다.
        - update:
            tableName: SMPL_ORDER
            columns:
              - column:
                  name: RMK
                  value: 할인 사유 — 분기 계약가.
            where: ORD_ID <= 6 AND DC_RT > 0 AND (RMK IS NULL OR RMK = '')
        # 902 의 2,000. ORD_ID 범위를 적는 것은 이 changeset 이 무엇을 고쳤는지 다음 사람이
        # 조건만 보고는 알 수 없기 때문이며, 사람이 만든 행까지 덮을 문을 닫아 둔다.
        - update:
            tableName: SMPL_ORDER
            columns:
              - column:
                  name: RMK
                  value: 분기 계약가 할인 — 대량 시드.
            where: ORD_ID BETWEEN 1001 AND 3000 AND DC_RT > 0 AND (RMK IS NULL OR RMK = '')
