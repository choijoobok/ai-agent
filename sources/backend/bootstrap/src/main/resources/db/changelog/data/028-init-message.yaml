# 메시지 값 20차 — 사람 소유 시드다(22 §1.1).
#
# 담는 것 둘이다.
#
# ① `set` 필터 셋(54 §4.3) — 코드·스위치 컬럼의 체크박스 목록이다. `grid.filter.blank`
#    는 값이 비어 있는 행을 고르는 항목이며, 빈 칸도 골라야 거를 수 있다. 괄호를 두른
#    이유는 그것이 **값이 아니라 값의 부재**이기 때문이다 — 괄호 없이 두면 `비어 있음`
#    이라는 코드값이 있는 것처럼 보인다.
#
# ② `grid.settings.drag` — 설정 창의 순서 손잡이다. 화면에는 아이콘만 보이므로 읽는
#    것은 스크린리더뿐이다.
#
# grid.settings.up · down 은 여기서 다루지 않는다. 드래그로 바꾸면서 코드에서 사라졌고
# 008 재생성이 그 둘을 USE_SCOPE='NONE'(죽은 키)으로 표시했다 — 그것이 죽은 키 판정의
# 유일한 경로이며(33 §2.2) 값 행은 남는다. 026 을 고쳐 지우지 않는 이유는 앞의 파일을
# 손대지 않는 규약 그대로다.
databaseChangeLog:
  - changeSet:
      id: data-028-message
      author: template
      comment: set 필터와 설정 창 손잡이의 ko·en — 54 §4.3 · 53 §5
      changes:
        - loadData:
            tableName: SYS_MESSAGE
            file: db/changelog/data/028-init-message.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            columns:
              - column:
                  name: MSG_KEY
                  type: STRING
              - column:
                  name: LANG_CD
                  type: STRING
              - column:
                  name: MSG_VAL
                  type: STRING

  - changeSet:
      id: data-028-cache-version
      author: template
      comment: 값을 넣었으면 버전을 올린다 — 43 §8.1
      changes:
        - update:
            tableName: SYS_CACHE_VERSION
            columns:
              - column:
                  name: VERSION
                  valueComputed: VERSION + 1
              - column:
                  name: MOD_DTM
                  valueComputed: CURRENT_TIMESTAMP
            where: CACHE_NAME = 'message'
