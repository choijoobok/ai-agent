# 고객 제출 사이트 배치 카탈로그 템플릿
meta:
  id: DLV-###
  status: draft
  baselined: null

sites:
  - id: SITE-###
    key: design
    title: "설계·검증 산출물"
    description: "고객이 이 사이트에서 판단할 것"
    sources:
      - "정본 또는 파생 문서 경로 — 같은 원문을 복사하지 않는다"
    # 선택: requirement의 overview_diagram·sequence_routes에서 연속 보기 HTML 생성.
    # flow_views: [{ key: "파일명", requirement: "REQ-###", title: "제목", layout: { width: 1600, height: 990, groups: [], routes: [] } }]
    # groups는 모든 정본 노드를 한 번씩 배치한다. 상세 형식은 site-kit/README.md 참조.

output:
  path: build/deliverables
  offline: true
  shared_assets: true
  html_per_site: one
  pdf: optional

capture:
  identity: "SCR-###/그림키"
  main_file: screen.png
  keyed_file: "screen-{그림키}.png"
  draft_fallback: mockup
  release_requires_png: true
