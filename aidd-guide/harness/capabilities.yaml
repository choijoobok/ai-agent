version: 2

constitution:
  common: AGENTS.md
  claude_entry: CLAUDE.md
  codex_entry: AGENTS.md

skills:
  source: aidd-guide/harness/skill-src/
  claude_output: .claude/skills/
  codex_output: .agents/skills/
  sync: aidd-guide/harness/runtime/sync-skills.mjs

hooks:
  contract: aidd-guide/harness/hooks-contract.md
  chain_source: aidd-guide/harness/runtime/chains.mjs
  pretool_bootstrap: aidd-guide/harness/runtime/pretool-bootstrap.mjs
  codex_revision: aidd-guide/harness/runtime/codex-hook-revision.mjs
  shared_policy_engine: .claude/hooks/
  claude_wiring: .claude/settings.json
  codex_wiring: .codex/hooks.json
  pre_file: [guard-write, guard-generated]
  pre_shell: [guard-bash, guard-commit]
  post_file: [normalize-encoding, hook-syntax, trace-check, doc-drift, guide-drift, skill-sync, harness-doc, commons-doc]
  session_start: [git-sync, session-brief]   # 순서가 의미다 — 당긴 뒤에 상태를 읽는다
  conversation: [session-brief, log-raw]

context:
  common_outcome: continuity
  claude_strategy: measured-warning
  codex_strategy: compact-rehydrate

verification:
  check: aidd-guide/harness/runtime/harness-check.mjs
  session_start: true
  ci_required: true
  restart_after_harness_pull: true
  codex_reentry:
    desktop: fresh-local-task-handoff # 새 실행에 작업 맥락을 인계하고 revision·PreToolUse를 실측한다
    cli: resume-same-task          # 저장된 같은 task에 새 CLI 실행으로 다시 붙는다
    unknown: ask-client-surface    # 지원하지 않는 경로를 지어내지 않는다
